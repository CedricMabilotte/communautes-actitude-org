  - id: "comites-biodiversite"
    atlas_uid: ""
    communaute: "Comités de gestion de la biodiversité des collectivités locales"
    etats: ["Inde"]
    entite: "Territoires des collectivités locales élues (panchayats et municipalités)"
    mecanisme: "gouvernance_biodiversite"
    annee: 2002
    concept_local: ""
    resume: >-
      La loi de 2002 sur la diversité biologique (art. 41) impose à chaque collectivité locale élue de constituer un comité de gestion de la biodiversité (Biodiversity Management Committee, BMC). Le comité tient un registre de la biodiversité des peuples (People's Biodiversity Register), qui recense les ressources et les savoirs locaux ; il peut percevoir des droits de collecte et doit être consulté par l'Autorité nationale de la biodiversité avant toute autorisation d'accès. Le comité est désigné par le panchayat ou la municipalité, non par une communauté définie par l'appartenance. Les comités ont été créés en masse après une ordonnance du Tribunal vert national d'avril 2019.
    gouvernance: "Comité désigné par la collectivité locale élue ; Autorité nationale et conseils de la biodiversité des États pour les autorisations d'accès."
    effectivite: "Plus de 276 653 comités et environ 272 648 registres en juin 2026 ; environ 145 crore roupies (1,45 milliard) versés au titre du partage des avantages de 2017 à 2026, à environ 11 000 comités, soit moins de 5 % (PIB, 5 juin 2026)."
    textes:
      - {titre: "Biological Diversity Act 2002, art. 41 (modifié en 2023)", nature: "loi", annee: 2002, source: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jun/doc202665883601.pdf"}
    sources:
      - {titre: "Press Information Bureau — document du 5 juin 2026 sur la biodiversité", url: "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/jun/doc202665883601.pdf"}
      - {titre: "Down To Earth — Most biodiversity panels now in place (janvier 2020)", url: "https://www.downtoearth.org.in/india/most-biodiversity-panels-now-in-place-national-biodiversity-authority-to-tell-ngt-69334"}

synthese: >-
  La réponse dépend moins du nom du régime que de l'institution qui l'exerce. L'autogestion réelle, où la communauté fixe les règles, les fait respecter et sanctionne, se trouve là où une institution du village existait avant la loi et garde la terre : conseils de village du Nagaland, appuyés sur l'article 371A et la propriété coutumière de la plupart des forêts (Khonoma, Sendenyu, et Pangti où le conseil a agi sous la menace d'une coupure des fonds de l'État) ; assemblées de village du district de Gadchiroli au Maharashtra, qui vendent elles-mêmes bambou et feuilles de tendu au titre des droits forestiers communautaires ; tribunaux coutumiers de l'Arunachal Pradesh pour la justice civile ; dorbar shnong des Khasi, qui fonctionnent sans loi propre. Dans ces cas, l'État garde l'expropriation, l'interdiction nationale de la chasse et le contrôle des registres fonciers, comme le montre Mendha-Lekha.


  La cogestion est la règle dans les autres cas. Les réserves communautaires en sont le type : la loi donne au comité local la majorité et le plan de gestion, mais l'État déclare la réserve, fixe le comité, approuve tout changement d'usage du sol et ne prévoit aucune sortie. Leur fonctionnement varie selon l'État : au Nagaland, la réserve ajoute un agent forestier et des fonds fédéraux à une gestion villageoise antérieure ; au Meghalaya, les comités sont issus des institutions khasi avec un forestier comme secrétaire ; au Punjab, les cinq villages de Keshopur gardent la terre et attribuent les baux ; au Kerala, le comité de Kadalundi n'avait ni plan approuvé ni soutien local en 2012 ; au Haryana, les comités de Fatehabad sont présidés par l'administration et limités au conseil, ce qui en fait une gestion d'État sous le nom de réserve communautaire. Les Van Panchayats de l'Uttarakhand, les conseils de Leh et de Kargil et les habitats coutumiers reconnus en Odisha, au Chhattisgarh et au Madhya Pradesh relèvent aussi de la cogestion : la communauté fixe les règles d'usage, l'administration approuve les plans, les ventes ou les budgets. La gestion d'État domine dans la gestion conjointe des forêts, dans les comités de biodiversité créés par les collectivités élues et dans les permis d'entrée de la ligne intérieure. Les lois foncières du Jharkhand et d'Andhra Pradesh empêchent la perte des terres sans donner à la communauté le pouvoir de décider de leur usage ; au Manipur, les conseils des collines n'ont plus d'élus depuis 2020.

limites:
  - "Réserves communautaires de l'Arunachal Pradesh (9), du Manipur (15), du Bihar et du Karnataka : aucune source sur le fonctionnement des comités n'a été trouvée."
  - "Les sanctions appliquées dans les réserves du Meghalaya, de Keshopur, de Kadalundi et de Fatehabad ne sont décrites dans aucune source ouverte ; seules celles de Khonoma sont documentées."
  - "Les directives du ministère de l'Environnement sur la création des réserves communautaires (procédure, protocole d'accord type) et le montant versé par réserve au titre du programme « Integrated Development of Wildlife Habitats » n'ont pas été trouvés."
  - "Le lien entre la réserve « Khonoma » de 2018 (2,65 km²) et le sanctuaire villageois de 1998 n'est établi par aucune source ; la résolution de l'Assemblée du Nagaland adoptant la loi de 1972 sur la faune n'a pas été consultée."
  - "Textes non ouverts : texte intégral de la loi CNT de 1908 et des règles PESA du Jharkhand de 2026, règlement de 1873 sur la ligne intérieure, règles des Van Panchayats de 2005 et 2012, article 41 de la loi de 2002 sur la diversité biologique ; les cas s'appuient sur des analyses secondaires citées."
  - "Aucun chiffre officiel récent sur la gestion conjointe des forêts n'a été trouvé ; le dernier chiffre fiable date de 2002."
  - "Hors champ : conseils de district autonomes de la Sixième annexe, Bodoland, Sikkim et Mizoram, traités dans leurs fiches."

