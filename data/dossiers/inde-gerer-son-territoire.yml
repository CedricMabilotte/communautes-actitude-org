  - id: "dorbar-shnong"
    atlas_uid: "khasi-khasi-hills"
    communaute: "Villages khasi"
    etats: ["Inde (Meghalaya)"]
    entite: "Villages des Khasi Hills"
    mecanisme: "institution_coutumiere"
    annee: 2014
    concept_local: "dorbar shnong ; rangbah shnong"
    resume: >-
      La dorbar shnong est l'assemblée de village khasi, présidée par le chef de village (rangbah shnong). Elle n'avait pas de statut légal avant la création de l'État du Meghalaya. Le conseil de district autonome des Khasi Hills a adopté le 1er juillet 2014 un projet de loi sur l'administration des villages, toujours en attente d'assentiment, puis une loi de 2021 sur les conseils de développement de village et de ville. Le 10 décembre 2014, la Haute Cour du Meghalaya a jugé que l'administration ne devait plus exiger de certificat du chef de village.
    gouvernance: "Assemblée de village et chef de village selon la coutume, sous le conseil de district autonome des Khasi Hills (Sixième annexe)."
    effectivite: "Le syndicat des chefs de village a refusé d'appliquer l'arrêt de 2014 (Oh Meghalaya) ; en 2024, le rôle de la dorbar shnong fait l'objet d'un débat de réforme (The Shillong Times)."
    textes:
      - {titre: "Haute Cour du Meghalaya, arrêt du 10 décembre 2014 sur les certificats des chefs de village", nature: "jurisprudence", annee: 2014, source: "https://ohmeghalaya.com/headmen-decides-to-defy-court-order/"}
    sources:
      - {titre: "The Shillong Times — Reforming and streamlining the role of the Dorbar Shnong (12 novembre 2024)", url: "https://theshillongtimes.com/2024/11/12/reforming-and-streamlining-the-role-of-the-dorbar-shnong/"}
