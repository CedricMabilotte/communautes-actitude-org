  - id: "kebang-arunachal"
    atlas_uid: "autorites-villageoises-arunachal"
    communaute: "Adi et autres peuples de l'Arunachal Pradesh"
    etats: ["Inde (Arunachal Pradesh)"]
    entite: "Villages de l'Arunachal Pradesh (5 589 villages)"
    mecanisme: "institution_coutumiere"
    annee: 2021
    concept_local: "kebang"
    resume: >-
      Le règlement de 1945 sur l'administration de la justice dans la frontière de l'Assam reconnaît les autorités villageoises (art. 5) et leur permet de juger vols, coups et intrusions et d'infliger des amendes (art. 19-20). La loi de 2021 sur les tribunaux civils de l'Arunachal Pradesh fait du tribunal coutumier, le tribunal du conseil traditionnel du village « quel que soit son nom », un degré de juridiction (art. 2 (d) et 3 (e)). Les autorités villageoises jugent tous les procès civils entre autochtones de l'État, sans limite de valeur (art. 27). Depuis l'amendement de 2023, elles comprennent les conseils traditionnels de village, les conseils inter-villages et les conseils coutumiers supérieurs, comme le kebang des Adi.
    gouvernance: "Conseils traditionnels de village et conseils coutumiers ; le préfet de district peut en désigner les membres (règlement de 1945, art. 5)."
    effectivite: "Inconnue : aucune source ouverte ne chiffre les affaires jugées par les tribunaux coutumiers depuis 2021."
    textes:
      - {titre: "Assam Frontier (Administration of Justice) Regulation 1945, art. 5, 19, 20 et 40", nature: "reglement", annee: 1945, source: "https://www.ijcrt.org/papers/IJCRT2602272.pdf"}
