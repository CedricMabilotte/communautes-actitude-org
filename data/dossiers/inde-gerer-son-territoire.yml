slug: "inde-gerer-son-territoire"
titre: "Inde : gérer son territoire au village"
chapeau: >-
  En Inde, des villages gèrent une forêt, une zone humide ou un territoire coutumier au titre de lois nationales ou de lois des États, sans passer par les mécanismes des Nations unies. Ce dossier compare 20 cas, dont cinq consacrés à des réserves communautaires, pour répondre à une question : qui décide réellement sur le terrain, la communauté, l'administration, ou les deux ?

introduction: >-
  La Constitution indienne donne déjà à certains territoires une autonomie propre : conseils de district autonomes de la Sixième annexe (régime des districts autonomes du Nord-Est) chez les Khasi, les Garo ou les Pnar du Meghalaya, article 371A au Nagaland, Cinquième annexe et loi PESA de 1996 (extension des conseils de village aux zones dites répertoriées) dans l'Inde centrale. Ces régimes sont décrits dans les fiches de l'atlas. Ce dossier regarde un niveau plus bas : le village, l'assemblée de village (gram sabha, réunion de tous les électeurs inscrits du village), le conseil coutumier, le comité de forêt. Il laisse de côté les recours devant les organes des Nations unies et ne retient que le droit indien.


  Le dossier distingue six mécanismes. L'autonomie territoriale par la loi confie à un conseil élu la terre d'un district entier. La gestion propre d'une forêt ou d'un territoire coutumier donne à une assemblée de village un droit de gestion sur une ressource délimitée. La cogestion d'une aire protégée associe un comité local et le service forestier dans une réserve créée par l'État. La protection foncière interdit de vendre la terre à des personnes extérieures au groupe, sans créer d'institution de décision. L'institution coutumière reconnue est un conseil de village ou un tribunal coutumier auquel la loi donne des pouvoirs. Enfin, la gouvernance de la biodiversité passe par des comités créés dans chaque collectivité locale.


  Les réserves communautaires occupent une place à part. Créées en 2003 par la loi sur la protection de la faune, elles étaient 309 selon la liste officielle de février 2025, dont 297 dans quatre États du Nord-Est. Le dossier en examine cinq cas, du Nagaland au Haryana, avec pour chacune trois questions : qui décide, quelles règles s'appliquent, quelles sanctions existent. Trois cas du Nagaland (Khonoma, Sendenyu, Pangti) montrent aussi des règles de conservation décidées par un village sans notification de l'État ou avant elle.

mecanismes:
  - {cle: "autonomie_territoriale", libelle: "Autonomie territoriale par la loi", definition: "Une loi confie à un conseil élu l'attribution des terres, la gestion de forêts et des services publics sur un district ; l'État garde l'expropriation et peut dissoudre le conseil."}
  - {cle: "gestion_propre", libelle: "Gestion propre d'une forêt ou d'un territoire coutumier", definition: "Une assemblée de village ou un conseil élu par les habitants fixe les règles d'usage d'une forêt ou d'un territoire délimité ; le sol reste en général à l'État."}
  - {cle: "cogestion_aire_protegee", libelle: "Cogestion d'une aire protégée", definition: "L'État crée une réserve ou un comité forestier ; un comité où siègent des représentants locaux et un agent forestier gère la zone, et l'État approuve les décisions qui changent l'usage du sol."}
  - {cle: "protection_fonciere", libelle: "Protection foncière", definition: "La loi interdit ou limite la vente des terres à des personnes extérieures au groupe, ou l'entrée de ces personnes sur le territoire ; elle ne crée pas d'institution qui décide pour la communauté."}
  - {cle: "institution_coutumiere", libelle: "Institution coutumière reconnue", definition: "Un conseil de village ou une autorité coutumière tient de la loi, ou de la coutume tolérée par la loi, des pouvoirs de règlement, de justice ou de gestion de services."}
  - {cle: "gouvernance_biodiversite", libelle: "Gouvernance de la biodiversité", definition: "Un comité créé par la collectivité locale élue tient un registre des ressources biologiques et perçoit une part des avantages tirés de leur usage commercial."}

