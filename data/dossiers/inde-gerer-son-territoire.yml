tableau:
  titre: "Les réserves communautaires notifiées"
  fichier: "reserves-communautaires-inde.csv"
  note: >-
    Le total officiel, 309 réserves pour 8 464,13 km², vient de la liste du Wildlife Institute of India (base ENVIS) arrêtée en février 2025 ; le tableau en reprend les 308 réserves distinctes et ajoute trois notifications parues dans la presse en octobre 2024 et en février 2025. Pour 65 réserves du Meghalaya, cette liste donne des surfaces exactement 100 fois supérieures à celles de juillet 2023, soit des hectares étiquetés en km², ce que confirme une étude de 2023 : le tableau garde la valeur de 2023, laisse vide la surface de 11 réserves plus récentes, et le total officiel est surévalué.
