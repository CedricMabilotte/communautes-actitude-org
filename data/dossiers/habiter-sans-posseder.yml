slug: "habiter-sans-posseder"
titre: "Habiter sans posséder : des terres retirées du marché"
chapeau: >-
  Dans une vingtaine de pays, des terres ne peuvent être ni vendues, ni saisies, ni perdues par l'occupation d'un tiers. Ceux qui y vivent en ont l'usage parce qu'ils appartiennent à un groupe, non parce qu'ils ont acheté un titre. Ce dossier compare 25 de ces régimes : qui attribue l'usage, ce qui bloque la vente, ce qui s'applique sur le terrain.

introduction: >-
  Dans le droit courant, la terre est une marchandise : on l'achète, on la vend, on l'hypothèque, un créancier peut la faire saisir. Les régimes réunis ici font l'inverse. Ils déclarent la terre inaliénable (elle ne peut être vendue ni donnée), insaisissable (un créancier ne peut la faire saisir) et imprescriptible (on ne la perd pas parce qu'un tiers l'occupe longtemps). L'usage y est attribué par l'appartenance au groupe ou par l'autorité du groupe, et non par un acte d'achat.


  Le dossier distingue sept mécanismes. Dans la propriété collective protégée, le groupe est propriétaire et la loi lui interdit de vendre. Dans le deuxième, l'État reste propriétaire et la communauté a l'usufruit (le droit d'utiliser la terre et d'en percevoir les fruits sans en être propriétaire). Dans la fiducie, un organisme détient le titre et gère la terre pour le compte des ayants droit. Le droit d'usage sans titre donne des droits de chasse, de cueillette ou de culture sur une terre qui reste publique. L'attribution coutumière renvoie à des chefs, des familles ou des conseils de village. Les biens tenus en main commune sont les communaux d'Europe, qui appartiennent aux habitants d'un lieu sans parts individuelles. Enfin, la vente encadrée autorise la vente, mais seulement au profit du groupe.


  Les cas retenus figurent dans l'atlas ou se rattachent à une communauté qui y figure. Trois cas européens (Galice, Ampezzo, sections de commune en France) servent de point de comparaison : ils ne concernent pas des peuples autochtones mais des collectivités d'habitants. Le cas mexicain montre le mouvement inverse : une réforme de 1992 a permis de faire revenir sur le marché des terres qui en étaient sorties.

mecanismes:
  - {cle: "propriete_collective", libelle: "Propriété collective protégée", definition: "Le groupe est propriétaire du sol ; la loi interdit ou limite la vente, la saisie et la perte par occupation prolongée."}
  - {cle: "propriete_etat_usufruit", libelle: "Propriété de l'État, usufruit du groupe", definition: "Le sol appartient à l'État ; la communauté en a la possession permanente et l'usage exclusif des ressources de surface."}
  - {cle: "fiducie", libelle: "Fiducie ou organisme gestionnaire", definition: "Un organisme (fiduciaire, bureau, domaine) détient le titre, consent les baux et redistribue les revenus pour le compte des ayants droit."}
  - {cle: "droit_usage", libelle: "Droit d'usage sans propriété du sol", definition: "La communauté ou ses membres ont des droits de chasse, de pêche, de cueillette, de culture ou d'habitation sur une terre qui reste à l'État."}
  - {cle: "attribution_coutumiere", libelle: "Attribution par l'autorité coutumière", definition: "La loi renvoie à la coutume : chefs, familles ou conseils de village attribuent l'usage et autorisent les transferts."}
  - {cle: "main_commune", libelle: "Biens tenus en main commune", definition: "Communaux européens : la terre appartient aux habitants ou aux familles d'un lieu, sans parts individuelles, et chacun en jouit tant qu'il fait partie du groupe."}
  - {cle: "cession_restreinte", libelle: "Vente encadrée au profit du groupe", definition: "La terre peut se vendre, mais la vente est réservée aux membres du groupe, ou le groupe dispose d'un droit de rachat prioritaire."}

