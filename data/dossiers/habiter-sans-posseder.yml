  - id: "finnmark-sami"
    atlas_uid: "sami-norvege"
    communaute: "Sames et habitants du Finnmark"
    etats: ["Norvège"]
    entite: "Domaine du Finnmark (anciennes terres de l'État dans le comté)"
    mecanisme: "fiducie"
    annee: 2005
    concept_local: "Finnmárkkuopmodat"
    resume: >-
      La loi sur le Finnmark de 2005 a transféré les terres de l'État dans le comté à une entité indépendante, le domaine du Finnmark (Finnmarkseiendommen). Le Sámediggi (parlement same) et le conseil du comté en désignent chacun trois administrateurs. Tout changement d'usage des terres non cultivées doit être évalué au regard de la culture same et de l'élevage de rennes ; une minorité d'administrateurs peut renvoyer la décision au Sámediggi. Les habitants disposent de droits d'usage (pêche, bois de chauffage, tourbe, chasse, baies) fondés sur la résidence, non sur l'appartenance ethnique (art. 22 et 23).
    gouvernance: "Conseil d'administration paritaire ; une commission du Finnmark identifie les droits de propriété et d'usage acquis par un long usage, et un tribunal des terres non cultivées tranche les contestations."
    effectivite: "Le Rapporteur spécial relève en 2016 qu'aucun mécanisme comparable n'existe hors du Finnmark ; en 2021, la Cour suprême a annulé les licences des parcs éoliens de Fosen pour atteinte aux droits culturels des éleveurs de rennes."
    textes:
      - {titre: "Loi n° 85 du 17 juin 2005 sur le Finnmark, art. 6, 7, 10, 22, 23 et 29", nature: "loi", annee: 2005, source: "https://app.uio.no/ub/ujur/oversatte-lover/data/lov-20050617-085-eng.pdf"}
    sources:
      - {titre: "Université d'Oslo — traduction anglaise de la loi sur le Finnmark", url: "https://app.uio.no/ub/ujur/oversatte-lover/data/lov-20050617-085-eng.pdf"}
      - {titre: "Rapporteur spécial — Situation des Sames (A/HRC/33/42/Add.3, 2016)", url: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
      - {titre: "Cour suprême de Norvège, HR-2021-1975-S (Fosen)", url: "https://www.domstol.no/en/supremecourt/rulings/2021/supreme-court-civil-cases/hr-2021-1975-s/"}

  - id: "montes-vecinales-galice"
    atlas_uid: "montes-vecinales-mano-comun-espagne"
    communaute: "Communautés de voisins (comuneiros) de Galice"
    etats: ["Espagne"]
    entite: "Montes vecinales en mano común"
    mecanisme: "main_commune"
    annee: 2003
    concept_local: "monte vecinal en mano común"
    resume: >-
      Les montes vecinales en mano común sont des terres de bois, de landes et de pâturages qui appartiennent en commun, sans parts, aux voisins qui forment à chaque moment le groupe d'habitants. La loi forestière espagnole de 2003 les classe comme propriétés privées de nature particulière, soumises à l'indivisibilité, l'inaliénabilité, l'imprescriptibilité et l'insaisissabilité (art. 11). Les titulaires sont les voisins qui composent le groupe « à chaque moment » : le droit suit l'appartenance au groupe d'habitants, non un titre individuel. Le Statut d'autonomie donne à la Galice une compétence exclusive sur leur régime (art. 27).
    gouvernance: "La communauté des voisins gère le monte selon une législation spéciale, qui prévaut sur la loi forestière générale (art. 2) ; la Galice fixe cette législation."
    effectivite: "Inconnue : aucun registre ni étude chiffrée récente n'a pu être ouvert."
    textes:
      - {titre: "Loi 43/2003 du 21 novembre sur les forêts (Ley de Montes), art. 2 et 11", nature: "loi", annee: 2003, source: "https://www.boe.es/buscar/act.php?id=BOE-A-2003-21339"}
      - {titre: "Statut d'autonomie de la Galice (loi organique 1/1981), art. 27, n° 10 et 11", nature: "loi_organique", annee: 1981, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
    sources:
      - {titre: "BOE — Ley 43/2003 de Montes, texte consolidé", url: "https://www.boe.es/buscar/act.php?id=BOE-A-2003-21339"}
      - {titre: "BOE — Statut d'autonomie de la Galice", url: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}

  - id: "regole-ampezzo"
    atlas_uid: "regole-venetie"
    communaute: "Regolieri d'Ampezzo et domaines collectifs italiens"
    etats: ["Italie"]
    entite: "Bois et pâturages des Regole d'Ampezzo (Cortina) ; domaines collectifs"
    mecanisme: "main_commune"
    annee: 2017
    concept_local: "regola ; laudo"
    resume: >-
      Les Regole d'Ampezzo sont des propriétés collectives de bois et de pâturages, attestées par des recueils écrits de règles coutumières (laudi) dès le XIVe siècle. Les terres sont transmises au sein des familles d'origine et doivent rester indivises ; selon les Regole, elles « ne peuvent être vendues ni changer de destination ». La loi italienne 168 de 2017 reconnaît les domaines collectifs comme « ordre juridique primaire des communautés d'origine », capables de fixer leurs propres règles. Elle leur applique un régime d'inaliénabilité, d'indivisibilité, d'impossibilité d'acquisition par prescription et de destination agro-sylvo-pastorale perpétuelle (art. 3).
    gouvernance: "Chaque Regola administre son patrimoine selon ses laudi et ses règlements ; la loi de 2017 reconnaît cette capacité à se donner des règles."
    effectivite: "Le parc naturel des Dolomites d'Ampezzo a été créé en 1990 sur les terres des Regole ; des lois régionales de Vénétie encadrent l'usage touristique temporaire des terres collectives (1975) et réorganisent les Regole (1996)."
    textes:
      - {titre: "Loi n° 168 du 20 novembre 2017, normes en matière de domaines collectifs, art. 1 à 3", nature: "loi", annee: 2017, source: "https://www.consiglioregionale.calabria.it/upload/istruttoria/legge%20168%20del%202017.pdf"}
    sources:
      - {titre: "Regole d'Ampezzo — site officiel", url: "https://www.regole.it/"}
      - {titre: "Regole d'Ampezzo — Origini di un'antica istituzione", url: "https://www.regole.it/IT/pagina108-origini-di-un-antica-istituzione"}
      - {titre: "Regole d'Ampezzo — Le date della storia regoliera", url: "https://www.regole.it/IT/pagina109-le-date-della-storia-regoliera"}
      - {titre: "Conseil régional de Calabre — texte de la loi 168/2017", url: "https://www.consiglioregionale.calabria.it/upload/istruttoria/legge%20168%20del%202017.pdf"}

  - id: "ecosse-crofting-rachat"
    atlas_uid: "terres-communautaires-ecosse"
    communaute: "Communautés locales et communautés de crofters d'Écosse"
    etats: ["Royaume-Uni"]
    entite: "Terres acquises par les communautés ; terres de croft et pâturages communs"
    mecanisme: "cession_restreinte"
    annee: 2003
    concept_local: "croft ; common grazings"
    resume: >-
      Le mouvement écossais part de l'autre sens : la terre est sur le marché et la loi donne aux communautés un moyen de la racheter. La loi de 2003 sur la réforme foncière donne aux communautés locales un droit d'achat prioritaire quand une terre est mise en vente (partie 2). Elle donne aux communautés de crofters (petits exploitants à bail protégé) un droit d'achat sans mise en vente préalable, sur les crofts, les pâturages communs et certains droits de pêche et minéraux (partie 3, art. 68). À l'inverse, la loi de 1993 permet à un crofter d'acheter individuellement sa terre, au besoin par ordonnance de la Land Court (art. 12).
    gouvernance: "Un organisme représentant la communauté acquiert et gère la terre ; la Land Court tranche les litiges sur les crofts."
    effectivite: "En 2023, 840 biens appartiennent à 533 groupes communautaires, soit 208 597 hectares ou 2,7 % du territoire écossais ; 74 % de cette surface se trouve dans les Hébrides extérieures (Na h-Eileanan Siar)."
    textes:
      - {titre: "Land Reform (Scotland) Act 2003, parties 2 et 3", nature: "loi", annee: 2003, source: "https://www.legislation.gov.uk/asp/2003/2/contents"}
      - {titre: "Crofters (Scotland) Act 1993, art. 12", nature: "loi", annee: 1993, source: "https://www.legislation.gov.uk/ukpga/1993/44/section/12"}
    sources:
      - {titre: "legislation.gov.uk — Land Reform (Scotland) Act 2003, section 68", url: "https://www.legislation.gov.uk/asp/2003/2/section/68"}
      - {titre: "Gouvernement écossais — Community ownership in Scotland 2023", url: "https://www.gov.scot/publications/community-ownership-in-scotland-2023/"}

  - id: "sections-de-commune-france"
    atlas_uid: "sections-de-commune-france"
    communaute: "Membres des sections de commune"
    etats: ["France"]
    entite: "Biens sectionaux"
    mecanisme: "main_commune"
    annee: 2011
    concept_local: "biens sectionaux"
    resume: >-
      Contrepoint européen sans peuple autochtone. Une section de commune est une personne publique, distincte de la commune, qui possède des biens et des droits sur une partie du territoire communal. Ses membres n'en sont pas propriétaires : ils ont la jouissance de certains biens dont ils perçoivent les fruits en nature, selon les décisions de l'autorité municipale ou les usages locaux. Le code général des collectivités territoriales permet de transférer les biens de la section à la commune dans trois cas : impôts non payés pendant plusieurs années, absence de commission syndicale, faible participation aux élections de la section.
    gouvernance: "La commission syndicale élue par les membres, ou à défaut le conseil municipal, gère les biens sectionaux."
    effectivite: "Le Conseil constitutionnel a jugé ce transfert à la commune conforme à la Constitution en 2011 ; aucun chiffre sur le nombre de sections existantes n'a pu être ouvert."
    textes:
      - {titre: "Code général des collectivités territoriales, art. L. 2411-12-1", nature: "loi", annee: 2011, source: "https://www.conseil-constitutionnel.fr/decision/2011/2011118QPC.htm"}
    sources:
      - {titre: "Conseil constitutionnel, décision n° 2011-118 QPC du 8 avril 2011 (section de commune d'Antoingt)", url: "https://www.conseil-constitutionnel.fr/decision/2011/2011118QPC.htm"}

synthese: >-
  Tous les régimes réunis ici séparent l'usage de la terre de sa propriété marchande. Dans la plupart des cas, l'interdiction de vendre, de saisir et de perdre la terre par prescription est inscrite dans la Constitution ou dans une loi à valeur renforcée (Nouvelle-Calédonie, Brésil, Colombie, Fidji, Alberta). La personne qui vit sur la terre y accède par son appartenance au groupe : clan, famille, village, établissement, résidence dans le lieu. L'attribution revient à une autorité du groupe (chefferie, conseil de village, assemblée) ou à un organisme gestionnaire. Les cas européens reposent sur la même idée d'une terre rattachée aux habitants d'un lieu plutôt qu'à des individus.


  Les écarts portent sur trois points. Le premier est le titulaire du sol : le groupe lui-même, l'État (Brésil, zones de droits d'usage de Guyane, Russie, forêts indiennes) ou un organisme intermédiaire (Fidji, Territoire du Nord, Finnmark, fiducie fédérale aux États-Unis). Le deuxième est la place du bail : presque tous les régimes l'autorisent, avec des plafonds de surface ou de durée (Guyana) ou sous le contrôle d'un organisme ; le Brésil l'interdit. Le troisième est la réversibilité : au Mexique depuis 1992 et au Maroc depuis 2019, la loi organise la sortie de parcelles vers la propriété individuelle. En Nouvelle-Zélande, la vente reste possible, mais d'abord au profit du groupe. L'Écosse suit le chemin inverse et fait racheter par des communautés des terres restées sur le marché.

limites:
  - "Les règles coutumières internes (répartition entre familles, héritage, place des femmes) ne sont documentées que lorsqu'une source publique les décrit ; elles sont absentes pour la plupart des cas."
  - "Le décret colombien 2164 de 1995, la loi galicienne sur les montes vecinales, la loi italienne sur les Regole d'Ampezzo et la loi française de 2013 sur les sections de commune n'ont pas pu être ouverts ; les cas s'appuient sur les textes cités."
  - "Aucune donnée chiffrée n'a été trouvée sur la surface des terres coutumières kanak, des montes vecinales de Galice ni sur le nombre de sections de commune en France."
  - "Cas écartés : Zanzibar et Éthiopie (toute la terre du pays appartient à l'État ou aux peuples, sans régime propre à une communauté), terres APY (régime proche du Territoire du Nord, déjà couvert), Sikkim (restriction de vente entre individus, sans terre collective), Sabah (aucune source sur l'application des titres communaux)."
  - "La date du rapport du gouvernement australien sur Fidji (2022 selon le document ouvert) diffère de celle indiquée dans la fiche de l'atlas."

candidats_atlas:
  - "Ejidos et communautés agraires du Mexique : propriété sociale sur environ la moitié du territoire, gouvernée par des assemblées reconnues par la loi agraire."
  - "Regole d'Ampezzo : propriété collective reconnue comme « ordre juridique primaire » par la loi italienne 168/2017, avec règles propres (laudi)."
  - "Communautés paysannes du Pérou : mêmes garanties que les communautés natives (art. 89), propriétaires collectives de terres andines."
  - "Propriétaires communautaires des Hébrides extérieures (Écosse) : 74 % des terres en propriété communautaire du pays, gérées par des fiducies locales."
