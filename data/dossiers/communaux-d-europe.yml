slug: "communaux-d-europe"
titre: "Les communaux d’Europe, un droit ancien toujours en vigueur"
chapeau: >-
  En Europe, des forêts, des alpages, des pâturages et des canaux d'irrigation appartiennent encore à des groupes d'habitants, de descendants ou de propriétaires de fermes, ou leur sont réservés en usage, au titre de lois souvent récentes qui reprennent des droits plus anciens. Ce dossier compare 30 régimes, 25 en Europe et 5 hors d'Europe, autour de trois questions : qui est ayant droit, ce qui ne peut pas être vendu, qui gouverne.

introduction: >-
  Les communaux sont des terres ou des eaux dont l'usage revient à un groupe et non à un individu : bois de chauffage, pâturage, alpage d'été, chasse, pêche, eau d'irrigation. Dans les cas étudiés, ces terres ont été séparées des communes ou retirées aux villages à différentes époques : biens des bourgeoisies suisses séparés de la commune après 1798, communautés agraires slovènes supprimées en 1947, obști roumaines placées sous propriété d'État de 1948 à 1989. Plusieurs pays leur ont consacré depuis 1980 une loi ou des articles de loi : Espagne (1980), Slovénie (1994 et 2015), Roumanie (loi de restitution de 2000), Slovaquie (2013), Italie (2017), Portugal (2017). Les noms changent d'un pays à l'autre (montes vecinales, baldios, usi civici, regole, Agrargemeinschaften, obști, sections de commune, bygdeallmenninger, commons), et le dossier pose à chaque régime les trois mêmes questions.


  Le dossier distingue sept mécanismes, classés selon la réponse à la première question. Dans la propriété des habitants, le groupe des voisins tel qu'il est composé à chaque moment détient la terre, sans parts. Dans le bien d'une collectivité publique de village, une personne publique plus petite que la commune détient la terre et les habitants en ont la jouissance (le droit d'en tirer les fruits). Dans la corporation d'ayants droit héréditaires, la qualité de membre se transmet par la famille, quel que soit le domicile. Dans la copropriété d'ayants droit inscrits, des personnes nommées sur une liste détiennent des parts qui s'héritent et parfois se vendent. Dans la propriété attachée aux exploitations, le droit suit la ferme. Dans les droits d'usage sur le sol d'autrui, le sol appartient à un propriétaire, à la Couronne ou à l'État, et les usagers n'ont que des droits d'usage. Enfin, les communautés d'usagers de l'eau répartissent une eau qui reste publique et, en Espagne, jugent les litiges.


  Les cas européens viennent tous des fiches de l'atlas. Cinq cas hors d'Europe servent de points de comparaison : deux régimes du Nouveau-Mexique issus du droit colonial espagnol (acequias et mercedes), les commonages des Bahamas, régis par une loi de 1896, les forêts iriai du Japon, que le Code civil de 1896 soumet aux coutumes locales, et les terres des collectivités soulaliyates du Maroc. Le dossier ne traite ni des communs de la mer (prud'homies de pêche, réserves marines) ni des droits d'achat des communautés écossaises, décrits ailleurs dans l'atlas.

mecanismes:
  - {cle: "propriete_des_habitants", libelle: "Propriété des habitants, sans parts", definition: "La terre appartient au groupe des habitants d'un lieu, tel qu'il est composé à chaque moment ; on devient ayant droit en s'y installant et on cesse de l'être en partant ; aucune part ne se vend ni ne s'hérite."}
  - {cle: "collectivite_publique_de_village", libelle: "Bien d'une collectivité publique de village", definition: "La terre appartient à une personne publique plus petite que la commune (section, concejo) ou à un groupement de communes ; les habitants en ont la jouissance, et des élus locaux ou la commune l'administrent."}
  - {cle: "corporation_hereditaire", libelle: "Corporation d'ayants droit héréditaires", definition: "La qualité d'ayant droit se transmet par la filiation ou par l'appartenance à une famille ou à une lignée, indépendamment du domicile ; une corporation reconnue par la loi détient la terre, qui ne se partage pas entre ses membres."}
  - {cle: "coproprietaires_inscrits", libelle: "Copropriété d'ayants droit inscrits", definition: "La terre appartient en indivision (sans partage matériel) à des personnes nommément inscrites sur une liste ou un registre ; leur part se transmet par héritage et parfois se vend, alors que l'ensemble ne se partage pas, ou seulement à des conditions fixées par la loi."}
  - {cle: "propriete_des_exploitations", libelle: "Propriété attachée aux exploitations", definition: "Le droit appartient à une ferme ou à un immeuble et suit sa vente ; les propriétaires des exploitations possèdent le sol en commun, et une autorité de l'État approuve ou fixe les règles de la communauté."}
  - {cle: "droits_sur_sol_d_autrui", libelle: "Droits d'usage sur le sol d'autrui", definition: "Le sol appartient à un propriétaire foncier, à la Couronne ou à l'État ; les ayants droit détiennent des droits de pâturage, de bois, de chasse ou de pêche, administrés par un organe prévu par la loi, dont les membres sont, selon les cas, élus par les usagers, nommés par l'État, la Couronne ou les propriétaires, ou désignés par les communes."}
  - {cle: "usagers_de_l_eau", libelle: "Communautés d'usagers de l'eau", definition: "L'eau reste publique ; les titulaires de droits d'eau d'un même canal forment une corporation qui élit ses organes, répartit l'eau, adopte ses ordonnances et, dans certains cas, juge les litiges."}

