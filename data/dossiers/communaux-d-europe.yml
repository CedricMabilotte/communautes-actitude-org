synthese: >-
  Dans vingt-sept des trente cas, les ayants droit élisent ou désignent tout ou partie de l'organe qui gère la terre ou l'eau ; les trois autres sont les forêts d'iriai, pour lesquelles la loi n'impose aucun organe, les communaux d'État norvégiens, dont le conseil de montagne est désigné par le conseil municipal, et le Pays Quint, géré par une commission de délégués des conseils municipaux. Des membres nommés siègent à côté des élus à Dartmoor et à Bodmin Moor, où ils sont minoritaires, et dans la Cour des Verderers, où ils occupent la moitié des sièges. Une autorité publique approuve ou fixe les statuts ou les règles d'usage dans plusieurs cas : le Conseil d'État du Valais pour les consortages, l'autorité agraire du Tyrol pour les communautés agraires, le conseil d'administration du comté pour les forêts communales suédoises, le ministère norvégien pour les communaux villageois, la Crofting Commission pour les pâturages écossais. Elle peut aussi se substituer au groupe : gestion conservatoire en Galice, reprise par la commune après trois élections sans quorum dans le Trentin, société obligatoire créée par le maire en Pologne, comité nommé en Écosse. La qualité d'ayant droit suit la résidence en Galice, au Portugal, dans le Trentin, dans les sections de commune et dans les concejos ; la filiation dans les bourgeoisies suisses, les corporations de Suisse centrale (sauf les corporations dites réelles de Lucerne, liées à un bien-fonds), les Regole et les mercedes ; la ferme ou la terre en Autriche, dans les communaux villageois norvégiens, en Suède, à Dartmoor et dans la New Forest ; une part ou une inscription en Roumanie, en Pologne, en Slovaquie, en Slovénie, dans les consortages valaisans et aux Bahamas. La loi déclare la terre inaliénable dans les montes vecinales, les domaines collectifs italiens, les biens communaux de Navarre, les biens administratifs des patriziati tessinois, le patrimoine ancien des Regole et les obști roumaines, mais prévoit des issues : actes de disposition votés par les trois quarts des membres en Galice, loi forale en Navarre, retour au conseil local en cas de dissolution en Roumanie, exclusion depuis 2023 des terres privées grevées d'usi civici en Italie. Ailleurs, la vente est permise à des conditions fixées par la loi : vote des ayants droit au Portugal et en Suède, cas énumérés en Norvège, autorisation de l'administration en Autriche et en Álava, ordonnance du juge pour les mercedes. La loi a ouvert la sortie du régime en Pologne (2016) et en Slovaquie (2018), et le préfet peut transférer à la commune les biens des sections de commune. Là où le sol appartient à autrui, les droits d'usage sont attachés aux exploitations ou aux terres à Dartmoor et dans la New Forest, au village ou au hameau dans les communaux d'État norvégiens, aux habitants de la vallée de Baïgorry dans le Pays Quint.


  Pour plusieurs régimes, les chiffres disponibles montrent un écart entre le nombre de communautés recensées et celui des communautés dotées d'organes ou inscrites : 200 commissions syndicales connues en 2003 pour 26 792 sections recensées en 1999 ; 1 080 sociétés de gestion pour environ 5 100 communautés foncières polonaises en 2015 ; 44 communautés agraires slovènes au registre national début 2025 sur 638 recensées en 2013 ; 495 comités en 2020 pour plus de 1 000 pâturages écossais. En Roumanie, les études citées relèvent les procès liés à la restitution et la dispersion des parts par héritage ; en Slovénie, la loi de 2015 ne donne pas la personnalité juridique aux communautés. Les cas hors d'Europe se rattachent aux mêmes mécanismes, sur des bases différentes : droit colonial espagnol au Nouveau-Mexique, loi de 1896 aux Bahamas, renvoi du Code civil japonais aux coutumes locales, loi de 2019 au Maroc. Selon le GAO, la quasi-totalité des terres confirmées aux concessions communautaires du Nouveau-Mexique hors pueblos semble avoir été transférée à d'autres propriétaires ; au Japon, la loi de 1966 permet de remplacer le droit d'iriai par une propriété, un bail ou un droit de superficie. Parmi les cas, seule la loi espagnole reconnaît à des juridictions d'usagers le rang de tribunal ; aux Bahamas, un comité d'élus des commoners de Savannah Sound tranche les litiges entre commoners.

limites:
  - "Le dossier ne couvre que les régimes qui ont une fiche dans l'atlas ; les communaux d'Allemagne, des Pays-Bas, de Grèce, d'Islande et des Balkans occidentaux ne sont pas traités."
  - "Le nombre d'ayants droit n'est connu que pour quelques régimes (Trentin, Roumanie, Dartmoor, New Forest, Valence et Murcie, concejos d'Álava et de Navarre) ; aucun total national des communautés agraires d'Autriche ni des consortages du Valais n'a été trouvé."
  - "Les chiffres viennent d'années différentes (1990 pour le Japon, 1999 pour les sections de commune, 2013 pour la Slovénie, 2015 pour la Pologne, 2025 pour l'Álava) et ne se comparent pas directement."
  - "Le fonctionnement des conseils des communaux de Brendon et de Bodmin Moor après 2016, celui des communautés foncières de Slovaquie et celui des tribunaux d'Orihuela et d'Aldaia ne sont décrits par aucune source ouverte."
  - "Les règles internes (statuts, laudi, ordonnances) des communautés n'ont pas été consultées une à une ; le dossier décrit le cadre légal et quelques cas documentés."
  - "Les communs de la mer (prud'homies de pêche, réserves marines de Galice) et les droits d'achat des communautés écossaises sont exclus ; ils relèvent d'autres dossiers et fiches."

candidats_atlas:
  - "Commissions syndicales de Cize, d'Ostabaret et de Soule (Pays basque français) : signataires avec celle de Baïgorry de la charte de la montagne basque de 2008, elles gèrent des terres indivises entre communes au titre du CGCT, art. L. 5222-1 à L. 5222-3."
  - "Communautés pastorales (pašne skupnosti) de Slovénie : régime distinct des communautés agraires, mentionné par le ministère de l'Agriculture slovène et exclu de la fiche communautes-agraires-slovenie."
  - "Communauté des Bardenas Reales et Universidad de la vallée de Salazar (Navarre) : corporations traditionnelles nommées par la loi forale 6/1990 et régies par leurs propres ordonnances ; à décrire dans des fiches propres à côté de entites-traditionnelles-concejos-navarre."
  - "Partecipanze agrarie d'Émilie et università agrarie du Latium : formes de domaines collectifs citées par la loi italienne de 2017, sans fiche propre ; à vérifier au regard du critère d'autonomie du cadre."
  - "Coopératives bourgeoises du Liechtenstein : fiche bourgeoisies-liechtenstein existante, non retenue ici ; cinq coopératives sur onze communes (quatre constituées au plus tard en 2004, Vaduz en 2010), à intégrer au dossier."
