slug: "le-droit-de-partir"
titre: "Le droit de partir : sécession et référendums inscrits dans les textes"
chapeau: >-
  Trente-huit fiches de l'atlas relèvent un texte qui prévoit, sous une forme ou une autre, la possibilité de quitter l'État dont la communauté relève ou d'en changer le lien, que ce texte soit appliqué, conditionnel ou contesté. Ce dossier examine 30 cas en Afrique, en Amérique, en Asie, en Europe et en Océanie avec quatre questions : que prévoit le texte, qui vote, à quelle majorité, et le droit a-t-il été exercé ?

introduction: >-
  Dans la grille de l'atlas, le droit d'« autodétermination externe » (choix du statut international d'un territoire, indépendance comprise) est le seul qui place une fiche au degré 5. Il est retenu quand un texte en vigueur prévoit un référendum d'indépendance ou un droit de sécession (séparation d'avec l'État). Le dossier part des fiches où ce droit est inscrit, partiel ou remis en cause (un seul cas par article pour l'Éthiopie, voir plus bas), et y ajoute des cas où un vote sur le statut a eu lieu sans texte permanent ou sans compétence reconnue : Bermudes, Mariannes du Nord, Papouasie occidentale, Kurdistan irakien. Il ne traite pas de la légitimité des revendications, seulement de ce que disent les textes et de ce qui s'est passé.


  Six mécanismes se dégagent des cas. Le droit de sécession constitutionnel est écrit dans la constitution de l'État ou dans sa loi d'autonomie, avec sa procédure (Éthiopie, Ouzbékistan, Saint-Christophe-et-Niévès, Liechtenstein, Moldavie, Aruba dans le Royaume des Pays-Bas). La sortie par accord est prévue par le statut d'une entité : le vote local ouvre une négociation dont le Parlement de l'État central approuve l'issue (Groenland, Irlande du Nord). La consultation issue d'un accord de paix ou de décolonisation est inscrite dans un accord négocié, souvent sous l'égide de l'ONU, avec un calendrier (Nouvelle-Calédonie, Bougainville, Abyei, Sahara occidental, Cachemire). L'acte d'autodétermination observé par l'ONU a fixé un statut de libre association (territoire qui s'administre lui-même et confie certaines compétences, comme la défense, à l'État auquel il reste lié) ou d'union politique (rattachement à un État avec un statut propre) (Îles Cook, Niue, Mariannes du Nord, Tokélaou, Papouasie occidentale). Le référendum consultatif permet à une assemblée locale de consulter la population sur le statut sans que le résultat lie l'État central. Enfin, le référendum sans compétence reconnue est organisé ou voulu par une entité que la justice de l'État juge dépourvue du pouvoir de le tenir.


  L'Éthiopie est traitée séparément. L'article 39 de la Constitution de 1994 reconnaît à chaque « nation, nationalité et peuple » un droit « inconditionnel » à l'autodétermination, sécession comprise : il figure dans 13 fiches éthiopiennes de l'atlas. Le dossier le traite par un cas (Tigray) et montre, par un second (Sidama), comment la procédure voisine de l'article 47, qui permet de créer un nouvel État membre de la fédération, a été employée trois fois depuis 2019.

mecanismes:
  - {cle: "secession_constitutionnelle", libelle: "Droit de sécession constitutionnel", definition: "La constitution de l'État, ou une loi d'autonomie, reconnaît à une entité le droit de se séparer et fixe la procédure : vote d'une assemblée, référendum, majorité requise ; le droit peut être soumis à condition."}
  - {cle: "sortie_par_accord", libelle: "Sortie par accord prévue par un statut", definition: "Le statut d'une entité prévoit qu'un vote local ouvre une négociation sur la sortie ; l'accord qui en résulte doit être approuvé par le parlement de l'État central."}
  - {cle: "consultation_accord_paix", libelle: "Consultation issue d'un accord de paix ou de décolonisation", definition: "Un accord négocié entre les parties, souvent sous l'égide de l'ONU, prévoit un référendum sur le statut à une date ou dans un délai, avec un corps électoral défini par l'accord."}
  - {cle: "acte_onu", libelle: "Acte d'autodétermination observé par l'ONU", definition: "Un vote ou une consultation, observé ou supervisé par l'ONU, fixe un statut de libre association, d'union politique ou d'intégration ; l'ONU en prend acte par une résolution."}
  - {cle: "referendum_consultatif", libelle: "Référendum consultatif sur le statut", definition: "Une constitution ou une loi locale permet à l'assemblée ou au gouvernement de l'entité de consulter la population sur le statut, indépendance comprise ; le résultat ne lie pas l'État central."}
  - {cle: "referendum_sans_competence", libelle: "Référendum sans compétence reconnue", definition: "L'entité organise ou veut organiser un vote sur l'indépendance ; la juridiction suprême de l'État juge que le texte ne lui en donne pas le pouvoir."}

