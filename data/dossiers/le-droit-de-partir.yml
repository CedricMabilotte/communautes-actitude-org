synthese: >-
  Dans la plupart des cas où un texte fixe une procédure, le vote de la population est nécessaire mais ne suffit pas. Un organe de l'État central garde l'étape finale : Parlement national en Papouasie-Nouvelle-Guinée, Folketing au Danemark, Parlement britannique pour l'Irlande du Nord, Congrès des États-Unis pour Porto Rico, loi ou traité soumis à l'accord du prince au Liechtenstein. La Constitution de Saint-Christophe-et-Niévès, celle de l'Ouzbékistan et le Statut du Royaume des Pays-Bas pour Aruba confient la décision à l'entité seule, le décret royal néerlandais ne faisant que fixer la date selon l'avis du gouvernement d'Aruba ; l'article 39 éthiopien la confie à la nation concernée, le gouvernement fédéral organisant le vote. Les majorités varient : majorité simple des suffrages en Nouvelle-Calédonie, en Irlande du Nord et dans l'article 39 éthiopien ; 50 % plus un au Québec selon la Loi 99 ; deux tiers à Nevis et aux Tokélaou ; majorité des électeurs inscrits, et non des votants, à Aruba. Le corps électoral est restreint par une liste spéciale en Nouvelle-Calédonie et, dans les territoires britanniques d'outre-mer, par un statut d'appartenance défini par la loi locale (Caymanian, Turks and Caicos Islander, Bermudian) ; la restriction fondée sur l'ascendance à Guam a été jugée contraire à la Constitution des États-Unis.


  Les régimes se distinguent par leur origine. En Éthiopie (1994) et en Ouzbékistan (1992), le droit est inscrit dans la Constitution depuis sa rédaction et n'a jamais servi à la sécession ; en Éthiopie, la procédure parallèle de l'article 47 a servi trois fois à créer des États membres. Au Danemark et au Royaume-Uni, la sortie du Groenland ou de l'Irlande du Nord passe par une négociation dont l'issue revient au Parlement de l'État ; aux Pays-Bas, le Statut laisse la sortie d'Aruba aux Staten et aux électeurs d'Aruba. Dans les territoires suivis par l'ONU, le vote a souvent eu lieu une fois et fixé un statut (Îles Cook, Niue, Mariannes du Nord), ou a été répété sans atteindre le seuil (Tokélaou) ; en Papouasie occidentale, l'acte dont l'ONU a pris acte a été exprimé par des conseils représentatifs de 1 026 membres, et non par un vote de toute la population. Les accords de paix et les résolutions de l'ONU ont prévu des consultations : tenues en Nouvelle-Calédonie et à Bougainville, jamais organisées à Abyei, au Sahara occidental et au Cachemire. Sur les 30 cas, aucun vote tenu au titre de ces textes n'a conduit à l'indépendance à la date du dossier. Deux votes prévus par un texte ont donné une majorité pour la séparation : à Nevis en 1998 (61,8 %), sous le seuil des deux tiers, et à Bougainville en 2019 (97,7 %), dont le résultat attend la décision du Parlement national. Là où l'entité a voté sans compétence reconnue (Catalogne, Kurdistan), la juridiction suprême a privé le vote d'effet.

limites:
  - "Le dossier repose sur les fiches de l'atlas ; quelques chiffres de résultats viennent de la presse ou de bases secondaires (Sint Maarten, Québec, Kurdistan, Porto Rico, participation de 2021 en Nouvelle-Calédonie), signalés dans les sources de chaque cas."
  - "L'article 39 éthiopien figure dans 13 fiches ; le dossier n'en présente qu'un cas, le Tigray, et un cas pour l'article 47."
  - "Les situations évoluent : vote de ratification du résultat de Bougainville attendu, suite de l'accord de Bougival en Nouvelle-Calédonie non fixée, combats au Tigray depuis septembre 2026."
  - "Non traités en cas séparé : référendum des Falkland (Malvinas) de 2013, dont la base juridique locale n'a pas été consultée ; Gilgit-Baltistan, rattaché au cas du Cachemire ; Féroé, où aucun texte en vigueur ne prévoit de référendum d'indépendance ; sécession d'Anguilla (1967) et crise comorienne de 1997, qui ne reposaient pas sur un texte de ce type."
  - "Les États souverains en libre association (Palaos, Îles Marshall, États fédérés de Micronésie) sont exclus de l'atlas par le cadre et ne sont pas examinés."
  - "Le dossier ne juge pas de la régularité des scrutins ; il rapporte les constats de l'ONU et des sources citées."
  - "Le référendum de 1980 au Québec et le référendum de 1977 à Nevis n'ont pas été vérifiés sur une source ouverte."
candidats_atlas:
  - "Mayotte (France) : consultations de 1974, 1976 et 2009 sur le statut, aucune fiche dans l'atlas ; utile pour comparer avec les autres territoires de l'océan Indien."
  - "Unités administratives de la rive gauche du Dniestr (Moldavie) : loi moldave de 2005 sur leur statut juridique spécial ; contenu sur l'autodétermination externe à vérifier, par comparaison avec la Gagaouzie."
