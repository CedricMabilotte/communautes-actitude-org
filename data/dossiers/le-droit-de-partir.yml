  - id: "tokelaou"
    atlas_uid: "tokelau"
    communaute: "Peuple des Tokélaou"
    etats: ["Nouvelle-Zélande"]
    entite: "Tokélaou, territoire non autonome"
    mecanisme: "acte_onu"
    annee: 2006
    concept_local: ""
    resume: >-
      Le Fono général (assemblée des trois atolls) a organisé en février 2006 puis en octobre 2007 deux référendums d'autodétermination, sous supervision de l'ONU, sur un projet de constitution et de traité de libre association avec la Nouvelle-Zélande. Il avait lui-même fixé le seuil d'adoption aux deux tiers des suffrages. En 2006, environ 60 % des votants ont approuvé le projet ; en 2007, 446 votants sur 692, soit 64,4 %, seize voix de moins que le seuil. Les Tokélaou restent sur la liste des territoires non autonomes.
    gouvernance: "Fono général (décision d'organiser le vote et seuil des deux tiers) ; électeurs des trois atolls ; supervision de l'ONU."
    effectivite: "Exercé deux fois, seuil non atteint. Le Fono général a relancé le dialogue sur l'autodétermination le 23 mai 2022 (résolution 79/110)."
    textes:
      - {titre: "Tokelau Act 1948, réimpression au 20 septembre 2007", nature: "loi", annee: 1948, source: "https://faolex.fao.org/docs/pdf/tok151698.pdf"}
    sources:
      - {titre: "ONU Info — Tokelau narrowly rejects self-government option in UN-supervised ballot (octobre 2007)", url: "https://news.un.org/en/story/2007/10/237132"}
      - {titre: "Résolution 79/110 « Question des Tokélaou » (2024)", url: "https://documents.un.org/api/symbol/access?s=A/RES/79/110&l=fr&t=pdf"}
