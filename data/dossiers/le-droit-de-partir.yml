cas:
  - id: "ethiopie-article-39"
    atlas_uid: "tigray-ethiopie"
    communaute: "Tigréens et, par le même article, toutes les « nations, nationalités et peuples » d'Éthiopie"
    etats: ["Éthiopie"]
    entite: "État régional du Tigray"
    mecanisme: "secession_constitutionnelle"
    annee: 1994
    concept_local: ""
    resume: >-
      L'article 39 (1) de la Constitution fédérale de 1994 reconnaît à chaque « nation, nationalité et peuple » un droit « inconditionnel » à l'autodétermination, sécession comprise. L'article 39 (4) fixe la procédure : demande approuvée par les deux tiers des membres du conseil législatif de la nation concernée ; référendum organisé par le gouvernement fédéral dans les trois ans ; approbation à la majorité des votants ; transfert des pouvoirs fédéraux au conseil ; partage des biens selon la loi. La Chambre de la Fédération (chambre haute, formée de représentants des nations) statue sur ces questions (art. 62 (3)). Le Tigray est le premier des neuf États membres énumérés en 1994 (art. 47).
    gouvernance: "Vote : conseil législatif de la nation (deux tiers), puis population de la nation par référendum (majorité simple) ; organisation par le gouvernement fédéral ; Chambre de la Fédération compétente."
    effectivite: "Jamais exercé, au Tigray ni ailleurs. Après la guerre de 2020-2022 et l'accord de Pretoria, le Tigray est dirigé par une administration intérimaire ; le TPLF en a écarté le président en mai 2026 et les combats ont repris en septembre 2026 (Crisis Group)."
    textes:
      - {titre: "Constitution de la République fédérale démocratique d'Éthiopie, art. 39, 47 et 62", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
    sources:
      - {titre: "Constitute Project — Constitution de l'Éthiopie (1994)", url: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
      - {titre: "Crisis Group — Arresting the Dangerous Descent Back into War in Northern Ethiopia (25 septembre 2026)", url: "https://www.crisisgroup.org/stm/africa/ethiopia-eritrea/arresting-dangerous-descent-back-war-northern-ethiopia"}

  - id: "ethiopie-article-47-sidama"
    atlas_uid: "sidama-ethiopie"
    communaute: "Sidama ; peuples du Sud-Ouest et du Sud éthiopien"
    etats: ["Éthiopie"]
    entite: "Région Sidama (2020), Région du Sud-Ouest (2021), Région d'Éthiopie du Sud (2023)"
    mecanisme: "secession_constitutionnelle"
    annee: 2019
    concept_local: ""
    resume: >-
      L'article 47 (3) applique à la création d'un nouvel État membre la même architecture que l'article 39 : vote du conseil de la nation aux deux tiers, référendum organisé dans l'année par le conseil de l'État régional, approbation à la majorité. Le conseil de la zone Sidama a demandé la création d'un État le 18 juillet 2018 ; le référendum, organisé par la Commission électorale nationale, a eu lieu le 20 novembre 2019, plus d'un an après la demande, avec plus de 98 % de votes favorables. Le 30 septembre 2021, cinq zones et un district à statut particulier ont voté pour former la Région du Sud-Ouest (1 262 679 votants sur 1 344 622 inscrits). Le 6 février 2023, six zones et cinq districts ont voté pour un État commun, l'Éthiopie du Sud ; le vote de la zone Wolayta, annulé, a été refait le 19 juin 2023.
    gouvernance: "Conseil de la zone ou de la nation (demande), Commission électorale nationale (organisation), conseil de l'État régional d'origine ou Chambre de la Fédération (approbation)."
    effectivite: "Exercé trois fois depuis 2019, pour l'autonomie interne et non pour la sécession. Les conseils des zones Wolayta, Gamo et d'autres avaient voté aux deux tiers pour un État propre à chacune ; les gouvernements régional et fédéral les ont conduits à demander un État commun (fiche Éthiopie du Sud). L'État d'Éthiopie centrale a été créé sans référendum, sur décision de la Chambre de la Fédération (fiche Éthiopie centrale)."
    textes:
      - {titre: "Constitution de la République fédérale démocratique d'Éthiopie, art. 47 (2) et (3)", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
    sources:
      - {titre: "Commission électorale nationale d'Éthiopie — Référendums", url: "https://nebe.org.et/en/referendum"}
      - {titre: "Commission électorale nationale d'Éthiopie — South West Ethiopia People's Referendum", url: "https://nebe.org.et/en/node/657"}
      - {titre: "Rift Valley Institute — Referendum in Ethiopia's Southern Region (2023)", url: "https://riftvalley.net/wp-content/uploads/2023/03/RVI-2023.03.21-Referendum-in-Ethiopias-Southern-Region.pdf"}
      - {titre: "Tronvoll, Boroje, Tezera — The Sidama's quest for self-rule, European Institute of Peace (2020)", url: "https://eip.org/wp-content/uploads/2020/06/Sidamas-quest-for-self-rule.pdf"}

  - id: "karakalpakstan"
    atlas_uid: "karakalpaks-karakalpakstan"
    communaute: "Karakalpaks et population de la République du Karakalpakstan"
    etats: ["Ouzbékistan"]
    entite: "République du Karakalpakstan"
    mecanisme: "secession_constitutionnelle"
    annee: 1992
    concept_local: "Jokargy Kenes"
    resume: >-
      La Constitution ouzbèke de 1992 (art. 74), puis celle de 2023 (art. 89), reconnaît au Karakalpakstan le droit de faire sécession de l'Ouzbékistan « sur la base d'un référendum général de son peuple ». Le texte ne fixe ni majorité ni délai ; les litiges entre les deux républiques se règlent par voie diplomatique (art. 90). Les frontières du Karakalpakstan ne peuvent être modifiées sans son consentement. En juillet 2022, un projet de révision supprimait la souveraineté de la république et ce droit ; le projet a été retiré après les manifestations de Noukous.
    gouvernance: "Peuple du Karakalpakstan par référendum ; ni l'organe qui convoque le vote ni la majorité ne sont précisés dans la Constitution ouzbèke."
    effectivite: "Jamais exercé. Les manifestations de juillet 2022 ont fait 18 morts selon le parquet cité par la Haute-Commissaire aux droits de l'homme, au moins 21 selon Human Rights Watch, qui relève en 2024 des condamnations sans enquête indépendante."
    textes:
      - {titre: "Constitution de la République d'Ouzbékistan, art. 85 à 90", nature: "constitution", annee: 2023, source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
      - {titre: "Constitution de la République d'Ouzbékistan (1992, révision 2011), art. 74", nature: "constitution", annee: 1992, source: "https://www.constituteproject.org/constitution/Uzbekistan_2011"}
    sources:
      - {titre: "HCDH — Bachelet calls for urgent probe into deadly protest in Uzbek city of Nukus (5 juillet 2022)", url: "https://www.ohchr.org/en/press-releases/2022/07/bachelet-calls-urgent-probe-deadly-protest-uzbek-city-nukus"}
      - {titre: "Human Rights Watch — Uzbekistan: 2 Years on, No Justice in Autonomous Republic (2024)", url: "https://www.hrw.org/news/2024/07/01/uzbekistan-2-years-no-justice-autonomous-republic"}
      - {titre: "Foreign Policy Centre — The curious case of the Republic of Karakalpakstan (2020)", url: "https://fpc.org.uk/the-curious-case-of-the-republic-of-karakalpakstan/"}

  - id: "nevis"
    atlas_uid: "nevis-saint-kitts"
    communaute: "Habitants de l'île de Nevis"
    etats: ["Saint-Christophe-et-Niévès"]
    entite: "Île de Nevis"
    mecanisme: "secession_constitutionnelle"
    annee: 1983
    concept_local: ""
    resume: >-
      L'article 113 de la Constitution de 1983 permet à l'Assemblée de l'île de Nevis de mettre fin à l'appartenance de l'île à la fédération. La loi doit être votée par les deux tiers des élus de l'Assemblée, puis approuvée à Nevis par référendum aux deux tiers des suffrages exprimés, après publication d'un projet détaillé de constitution future (art. 113 et 115, annexe 3). Un projet de loi de sécession a été voté en deuxième lecture le 7 juillet 1998 par six voix contre deux. Au référendum du 10 août 1998, 2 427 votants ont dit oui et 1 498 non, soit 61,8 % des suffrages valables.
    gouvernance: "Assemblée de l'île de Nevis (deux tiers des élus), puis électeurs de Nevis (deux tiers des suffrages exprimés), enfin assentiment du gouverneur général ; aucun vote du Parlement fédéral n'est requis par l'article 113."
    effectivite: "Exercé une fois, en 1998 ; seuil des deux tiers non atteint. Aucun nouveau projet trouvé depuis ; l'île garde sa législature et son administration propres (Freedom House, 2023)."
    textes:
      - {titre: "Constitution de Saint-Christophe-et-Niévès, art. 113 et 115, annexe 3", nature: "constitution", annee: 1983, source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
    sources:
      - {titre: "Political Database of the Americas — St. Kitts and Nevis: 1998 Referendum", url: "https://pdba.georgetown.edu/Elecdata/Kitts/ref1998.html"}
      - {titre: "Database and Search Engine for Direct Democracy — Nevis, 10 août 1998", url: "https://www.sudd.ch/event.php?lang=en&id=kn011998"}
      - {titre: "Freedom House — St. Kitts and Nevis, Freedom in the World 2023", url: "https://freedomhouse.org/country/st-kitts-and-nevis/freedom-world/2023"}

  - id: "liechtenstein-communes"
    atlas_uid: "communes-liechtenstein-droit-de-sortie"
    communaute: "Citoyens des onze communes du Liechtenstein"
    etats: ["Liechtenstein"]
    entite: "Chacune des onze communes politiques (Gemeinden)"
    mecanisme: "secession_constitutionnelle"
    annee: 2003
    concept_local: "aus dem Staatsverband austreten"
    resume: >-
      Depuis la révision constitutionnelle de 2003, l'article 4 al. 2 donne à chaque commune le droit de sortir de l'union de l'État. La majorité des citoyens liechtensteinois ayant le droit de vote et résidant dans la commune décide d'ouvrir la procédure. La sortie est ensuite réglée par une loi ou par un traité international ; dans le cas d'un traité, un second vote a lieu dans la commune après la négociation. La loi ou le traité suit la procédure ordinaire : il peut être soumis au référendum facultatif (vote national demandé par pétition, art. 66) et requiert l'accord du prince (sanction de la loi ou conclusion du traité).
    gouvernance: "Citoyens de la commune (majorité, pour ouvrir la procédure, puis pour approuver un traité) ; Diète (Parlement), corps électoral national en cas de référendum facultatif, et prince pour la loi ou le traité de sortie."
    effectivite: "Aucune procédure ouverte depuis 2003 selon les sources consultées ; le commentaire de la Constitution (état 2015) relève que l'État ne peut être contraint d'y consentir et que la commune ne peut imposer sa sortie."
    textes:
      - {titre: "Constitution de la principauté de Liechtenstein, art. 4 al. 2 (révision LGBl. 2003 n° 186)", nature: "constitution", annee: 2003, source: "https://www.gesetze.li/konso/pdf/1921.015"}
    sources:
      - {titre: "P. Bussjäger, Art. 4 LV, commentaire en ligne de la Constitution — Liechtenstein-Institut", url: "https://verfassung.li/Art._4"}
      - {titre: "Verfassung des Fürstentums Liechtenstein, version consolidée — gesetze.li", url: "https://www.gesetze.li/konso/pdf/1921.015"}

  - id: "gagaouzie"
    atlas_uid: "gagaouzes-gagaouzie"
    communaute: "Peuple de Gagaouzie"
    etats: ["Moldavie"]
    entite: "Unité territoriale autonome de Gagaouzie (Gagauz Yeri)"
    mecanisme: "secession_constitutionnelle"
    annee: 1994
    concept_local: "Gagauz Yeri"
    resume: >-
      La loi du 23 décembre 1994 sur le statut juridique spécial de la Gagaouzie dispose que, si la Moldavie perd son statut d'État indépendant, le peuple de Gagaouzie a droit à l'autodétermination externe (art. 1, al. 4). Le droit ne s'ouvre donc que sur un événement extérieur à la Gagaouzie ; la loi ne fixe ni corps électoral, ni majorité, ni procédure. L'article 111 de la Constitution moldave définit la Gagaouzie comme une forme d'autodétermination du peuple gagaouze au sein de la Moldavie.
    gouvernance: "Non précisée par la loi : le texte désigne « le peuple de Gagaouzie » sans organe ni procédure."
    effectivite: "Jamais exercé ; la condition ne s'est pas réalisée. Le mandat de l'Assemblée populaire a expiré le 12 novembre 2025 sans élections et le ministère de la Justice a saisi la Cour constitutionnelle de plusieurs compétences en mars 2026 (ADEPT, note soutenue par le PNUD)."
    textes:
      - {titre: "Loi n° 344-XIII du 23 décembre 1994 sur le statut juridique spécial de la Gagaouzie, art. 1", nature: "statut_autonomie", annee: 1994, source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
      - {titre: "Constitution de la République de Moldavie, art. 111", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Moldova_2024"}
    sources:
      - {titre: "ADEPT, projet PNUD Moldavie — Developments of the institutional crisis in the Găgăuzia region (2026)", url: "https://www.undp.org/sites/g/files/zskgke326/files/2026-04/adept-developments_of_the_institutional_crisis_in_gagauzia_region.pdf"}
      - {titre: "Alber et Cuijuclu — The Autonomy of Gagauzia and its Uneasy Centre-Autonomy Relations, IACL-AIDC Blog (2023)", url: "https://blog-iacl-aidc.org/territorial-autonomy/2023/10/3/the-autonomy-of-gagauzia-and-its-uneasy-centre-autonomy-relations"}

  - id: "groenland"
    atlas_uid: "kalaallit-groenland"
    communaute: "Peuple du Groenland"
    etats: ["Danemark"]
    entite: "Groenland (Kalaallit Nunaat)"
    mecanisme: "sortie_par_accord"
    annee: 2009
    concept_local: "Inatsisartut"
    resume: >-
      Le préambule de la loi de 2009 sur l'autonomie reconnaît le peuple du Groenland comme un peuple au sens du droit international. L'article 21 dispose que la décision sur l'indépendance appartient à ce peuple. Si elle est prise, des négociations s'ouvrent entre les gouvernements danois et groenlandais ; l'accord conclu doit être approuvé par l'Inatsisartut (Parlement du Groenland), par référendum au Groenland, puis par le Folketing (Parlement danois). La loi ne fixe pas de majorité qualifiée.
    gouvernance: "Inatsisartut et électeurs du Groenland, puis Folketing ; le gouvernement danois négocie avec le Naalakkersuisut (gouvernement du Groenland)."
    effectivite: "Jamais exercé. Un projet de constitution a été présenté au Parlement du Groenland en avril 2023 ; le Rapporteur spécial (2023) relève la dépendance financière envers le Danemark."
    textes:
      - {titre: "Loi n° 473 du 12 juin 2009 sur l'autonomie du Groenland, préambule et art. 21", nature: "statut_autonomie", annee: 2009, source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
    sources:
