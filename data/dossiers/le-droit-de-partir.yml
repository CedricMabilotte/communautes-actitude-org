  - id: "papouasie-occidentale"
    atlas_uid: "papous-indonesie"
    communaute: "Papous autochtones (Orang Asli Papua)"
    etats: ["Indonésie"]
    entite: "Provinces de Papouasie (ancienne Nouvelle-Guinée occidentale)"
    mecanisme: "acte_onu"
    annee: 1969
    concept_local: ""
    resume: >-
      L'accord de New York du 15 août 1962 entre l'Indonésie et les Pays-Bas place la Nouvelle-Guinée occidentale sous administration temporaire de l'ONU (UNTEA), puis la transfère à l'Indonésie le 1er mai 1963, à charge d'organiser un « acte de libre choix ». En 1969, ce choix est exprimé par des conseils représentatifs de 1 026 membres, et non par un vote de toute la population ; l'Assemblée générale en prend acte par la résolution 2504 (XXIV). La loi 21/2001 sur l'autonomie spéciale, modifiée en 2021, ne prévoit pas de nouvelle consultation sur le statut.
    gouvernance: "Conseils représentatifs de 1 026 membres en 1969 ; l'ONU a pris acte du résultat sans le qualifier."
    effectivite: "Exercé une fois selon l'ONU ; le mode de désignation des votants reste discuté. La fiche ne retient pas de droit actuel d'autodétermination externe ; le Comité des droits de l'homme (2024) relève des cas de torture de Papous autochtones."
    textes:
      - {titre: "Accord de New York du 15 août 1962 (résolution 1752 (XVII))", nature: "traite", annee: 1962, source: "https://peacekeeping.un.org/sites/default/files/past/unsfbackgr.html"}
      - {titre: "Loi 21/2001 sur l'autonomie spéciale de la Papouasie", nature: "statut_autonomie", annee: 2001, source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
    sources:
      - {titre: "Nations unies — Nouvelle-Guinée occidentale (UNSF), historique", url: "https://peacekeeping.un.org/sites/default/files/past/unsfbackgr.html"}
      - {titre: "Comité des droits de l'homme, CCPR/C/IDN/CO/2 (2024)", url: "https://docs.un.org/fr/CCPR/C/IDN/CO/2"}

  - id: "iles-caimans"
    atlas_uid: "iles-caimans"
    communaute: "Caïmaniens"
    etats: ["Royaume-Uni"]
    entite: "Îles Caïmans, territoire non autonome"
    mecanisme: "referendum_consultatif"
    annee: 2009
    concept_local: ""
    resume: >-
      La section 69 de la Constitution de 2009 permet d'organiser par une loi un référendum sur une question « d'importance nationale », sur résolution de la majorité des élus. La question de demander une modification de la Constitution pouvant conduire à l'indépendance est réputée d'importance nationale. La charte des droits de la Constitution s'ouvre sur l'affirmation que tous les peuples ont le droit de disposer d'eux-mêmes. Le texte ne dit pas que le résultat lie le Royaume-Uni.
    gouvernance: "Parlement des Îles Caïmans (majorité des élus) ; électeurs ayant le statut de Caymanian ; décision finale du Royaume-Uni."
    effectivite: "Aucun référendum sur l'indépendance trouvé. La résolution 79/103 (2024) réaffirme le droit du peuple à l'autodétermination."
    textes:
      - {titre: "The Cayman Islands Constitution Order 2009, annexe 2, s. 69", nature: "constitution", annee: 2009, source: "https://www.legislation.gov.uk/uksi/2009/1379/schedule/2/made"}
    sources:
      - {titre: "Comité spécial de la décolonisation — Îles Caïmans, A/AC.109/2025/5", url: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/5&l=en&t=pdf"}

  - id: "turks-et-caicos"
    atlas_uid: "turks-et-caicos"
    communaute: "Turks-et-Caïquais"
    etats: ["Royaume-Uni"]
    entite: "Îles Turks-et-Caïcos, territoire non autonome"
    mecanisme: "referendum_consultatif"
    annee: 2024
    concept_local: ""
    resume: >-
      L'ordonnance constitutionnelle de 2024 (art. 16) insère une section 62A : une loi locale peut organiser un référendum sur des « questions d'intérêt national », dont celle de demander une modification constitutionnelle pouvant mener à l'indépendance. Le résultat n'est pas contraignant (s. 62A, al. 5). La même ordonnance renomme la Chambre d'assemblée en Parlement et supprime les membres nommés à partir de la dissolution suivante (élections de février 2025). De 2009 à 2012, le Royaume-Uni avait suspendu le gouvernement élu et confié le pouvoir au gouverneur.
    gouvernance: "Parlement (loi organisant le vote) ; électeurs ayant le statut de Turks and Caicos Islander ; décision finale du Royaume-Uni."
    effectivite: "Aucun référendum sur l'indépendance trouvé depuis l'entrée en vigueur de la section 62A le 10 décembre 2024."
    textes:
      - {titre: "The Turks and Caicos Islands Constitution (Amendment) Order 2024, art. 16 (s. 62A)", nature: "constitution", annee: 2024, source: "https://www.legislation.gov.uk/uksi/2024/1128/contents/made"}
    sources:
      - {titre: "Peter Clegg — Constitutional Change in Turks and Caicos Islands, ConstitutionNet (2024)", url: "https://constitutionnet.org/news/voices/constitutional-change-turks-and-caicos-islands-territorial-particularities"}
      - {titre: "Comité spécial de la décolonisation — Îles Turks-et-Caïcos, A/AC.109/2025/15", url: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/15&l=en&t=pdf"}

  - id: "curacao"
    atlas_uid: "curacao"
    communaute: "Peuple de Curaçao"
    etats: ["Pays-Bas (Royaume)"]
    entite: "Curaçao, pays du Royaume des Pays-Bas"
    mecanisme: "referendum_consultatif"
    annee: 2010
    concept_local: "landsverordening"
    resume: >-
      Le préambule de la Staatsregeling (constitution du pays) de 2010 déclare : « Le droit à l'autodétermination du peuple de Curaçao est absolu et inaliénable. Le peuple a le dernier mot dans l'exercice de ce droit sacré. » Aucun article de la Staatsregeling ni du Statut du Royaume ne fixe de procédure de sortie pour Curaçao ; les articles 58 à 60 du Statut ne visent qu'Aruba. Les Staten peuvent organiser un référendum consultatif par ordonnance (art. 60). Trois référendums ont porté sur le statut : en 1993 (maintien dans des Antilles néerlandaises restructurées), en 2005 (près de 68 % pour un statut de pays autonome) et en 2009 (52 % pour les accords sur ce statut).
    gouvernance: "Staten de Curaçao (ordonnance organisant le vote) ; électeurs de Curaçao ; toute modification du statut passe par une loi du Royaume."
    effectivite: "Exercé trois fois pour choisir un statut interne au Royaume ; l'indépendance n'a pas été retenue. Le budget reste soumis au Collège de surveillance financière institué par une loi du Royaume."
    textes:
      - {titre: "Staatsregeling van Curaçao (AB 2010, n° 86), préambule et art. 60", nature: "constitution", annee: 2010, source: "https://algemenerekenkamercuracao.cw/wp-content/uploads/2023/09/staatsregeling_curacao__ab_2010_no__86__1475286399.pdf"}
    sources:
      - {titre: "Université Laval — Curaçao, L'aménagement linguistique dans le monde", url: "https://www.axl.cefan.ulaval.ca/amsudant/Curacao.htm"}
      - {titre: "Statuut voor het Koninkrijk der Nederlanden — wetten.overheid.nl", url: "https://wetten.overheid.nl/BWBR0002154/"}

  - id: "sint-maarten"
    atlas_uid: "sint-maarten"
    communaute: "Population de Sint Maarten"
    etats: ["Pays-Bas (Royaume)"]
    entite: "Sint Maarten, pays du Royaume des Pays-Bas"
    mecanisme: "referendum_consultatif"
    annee: 2000
    concept_local: "landsverordening"
    resume: >-
      Le préambule de la Constitution de Sint Maarten de 2010 invoque le droit à l'autodétermination exercé par le référendum du 23 juin 2000. Ce vote proposait plusieurs statuts : 69,98 % des suffrages exprimés ont choisi celui de pays au sein du Royaume, 14,44 % l'indépendance. Le Parlement peut organiser un référendum consultatif (art. 92). Le Statut du Royaume ne prévoit pas de procédure de sortie pour Sint Maarten.
    gouvernance: "Parlement de Sint Maarten (référendum consultatif) ; électeurs de Sint Maarten ; toute modification du statut passe par une loi du Royaume."
    effectivite: "Exercé en 2000 ; statut de pays obtenu le 10 octobre 2010. Les finances publiques restent sous le contrôle du Collège de surveillance financière (Cft)."
    textes:
      - {titre: "Constitution of Sint Maarten (2010), préambule et art. 92", nature: "constitution", annee: 2010, source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
    sources:
      - {titre: "2000 Sint Maarten status referendum — Wikipédia (anglais)", url: "https://en.wikipedia.org/wiki/2000_Sint_Maarten_status_referendum"}
      - {titre: "Colleges financieel toezicht — Cft", url: "https://www.cft.cw/over-het-cft"}

  - id: "porto-rico"
    atlas_uid: "porto-rico"
    communaute: "Peuple de Porto Rico"
    etats: ["États-Unis"]
    entite: "Porto Rico (Estado Libre Asociado)"
    mecanisme: "referendum_consultatif"
    annee: 2020
    concept_local: "Estado Libre Asociado"
    resume: >-
      La loi portoricaine 165-2020 (art. 2.1) autorise le gouverneur à convoquer par décret un vote « pour résoudre le statut politique futur de Porto Rico ». Le plébiscite du 5 novembre 2024, convoqué sur cette base, proposait l'État fédéré, la souveraineté en libre association et l'indépendance. Résultats certifiés : État fédéré 58,61 %, libre association 29,57 %, indépendance 11,82 % des votes valides. Le résultat est transmis au président et au Congrès des États-Unis comme une demande ; il ne les lie pas.
    gouvernance: "Gouverneur (convocation) ; électeurs de Porto Rico ; Congrès des États-Unis, qui garde le pouvoir de décider du statut d'un territoire."
    effectivite: "Exercé à titre consultatif ; aucune suite fédérale trouvée. Le Comité spécial de la décolonisation réaffirme chaque année le droit du peuple portoricain à l'autodétermination et à l'indépendance."
    textes:
      - {titre: "Ley Núm. 165-2020, art. 2.1 et 5.10", nature: "loi", annee: 2020, source: "https://bvirtualogp.pr.gov/ogp/Bvirtual/leyesreferencia/PDF/165-2020.pdf"}
      - {titre: "Orden Ejecutiva OE-2024-016 (1er juillet 2024)", nature: "loi", annee: 2024, source: "https://docs.pr.gov/files/Estado/OrdenesEjecutivas/2024/OE-2024-016.pdf"}
    sources:
      - {titre: "Primera Hora — la CEE certifie les résultats du plébiscite de 2024", url: "https://www.primerahora.com/noticias/gobierno-politica/notas/cee-certifica-a-la-estadidad-como-la-formula-ganadora-del-plebiscito/"}
      - {titre: "A/AC.109/2025/L.7 — Comité spécial de la décolonisation, Porto Rico", url: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/L.7&l=fr&t=pdf"}

  - id: "bermudes"
    atlas_uid: "bermudes"
    communaute: "Bermudiens"
    etats: ["Royaume-Uni"]
    entite: "Bermudes, territoire non autonome"
    mecanisme: "referendum_consultatif"
    annee: 1995
    concept_local: ""
    resume: >-
      La Constitution des Bermudes de 1968 ne prévoit pas de référendum sur le statut. Le référendum sur l'indépendance de 1995 reposait sur une loi ponctuelle : 73,6 % des votants se sont prononcés contre, avec une participation de 58,8 % ; le Parti travailliste progressiste avait appelé à ne pas voter. Une Commission bermudienne sur l'indépendance a rendu un rapport en 2005. Le droit de vote est réservé aux personnes ayant le statut bermudien défini par la loi de 1956 sur l'immigration.
    gouvernance: "Parlement des Bermudes (loi ponctuelle) ; électeurs ayant le statut bermudien."
    effectivite: "Exercé une fois à titre consultatif, en 1995 ; refus. La fiche ne retient pas de droit d'autodétermination externe faute de texte en vigueur."
    textes:
      - {titre: "Bermuda Constitution Order 1968", nature: "constitution", annee: 1968, source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1968/Bermuda%20Constitution%20Order%201968"}
    sources:
      - {titre: "Comité spécial de la décolonisation — Bermudes, A/AC.109/2025/3", url: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/3&l=en&t=pdf"}

  - id: "quebec"
    atlas_uid: "quebecois-quebec"
    communaute: "Nation québécoise"
    etats: ["Canada"]
    entite: "Québec"
    mecanisme: "referendum_consultatif"
    annee: 1998
    concept_local: ""
    resume: >-
      Aucun texte canadien ne prévoit la sécession d'une province. Dans le Renvoi relatif à la sécession du Québec (avis de 1998), la Cour suprême exclut un droit de sécession unilatérale mais juge qu'une majorité claire en réponse à une question claire obligerait les autres parties de la fédération à négocier. La Loi 99 de 2000 affirme le droit du peuple québécois à disposer de lui-même et fixe la majorité à 50 % des votes valides plus un (art. 1 à 4). La Loi sur la clarté (fédérale, 2000) confie à la Chambre des communes l'examen de la question et de la majorité. Au référendum de 1995, le oui a obtenu 49,42 % et le non 50,58 %, avec une participation de 93,52 %.
    gouvernance: "Assemblée nationale et électeurs du Québec (50 % plus un selon la Loi 99) ; Chambre des communes pour juger de la clarté (Loi sur la clarté) ; négociation entre les parties de la fédération."
    effectivite: "Exercé deux fois (1980, 1995), avec un refus à chaque scrutin ; le dossier n'a vérifié que les chiffres de 1995. En 2021, la Cour d'appel du Québec a rejeté l'appel visant six articles de la Loi 99, dont la règle des 50 % plus un (Le Devoir)."
    textes:
      - {titre: "Renvoi relatif à la sécession du Québec, [1998] 2 R.C.S. 217", nature: "jurisprudence", annee: 1998, source: "https://juricaf.org/arret/CANADA-COURSUPREME-19980820-19982RCS217"}
      - {titre: "Loi sur l'exercice des droits fondamentaux et des prérogatives du peuple québécois et de l'État du Québec (Loi 99), art. 1 à 4", nature: "loi", annee: 2000, source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/E-20.2"}
      - {titre: "Loi de clarification (Loi sur la clarté, L.C. 2000, ch. 26)", nature: "loi", annee: 2000, source: "https://laws-lois.justice.gc.ca/fra/lois/C-31.8/TexteComplet.html"}
    sources:
      - {titre: "Electoral Geography — Quebec Independence Referendum 1995", url: "https://www.electoralgeography.com/new/en/countries/q/quebec/quebec-independence-referendum-1995.html"}
      - {titre: "Le Devoir — La loi 99 validée par la Cour d'appel (10 avril 2021)", url: "https://www.ledevoir.com/politique/quebec/598542/la-loi-99-sur-l-autodetermination-du-quebec-validee-par-la-cour-d-appel"}

  - id: "guam"
    atlas_uid: "chamorro-guam"
    communaute: "Chamorros de Guam"
    etats: ["États-Unis"]
    entite: "Guam, territoire non autonome"
    mecanisme: "referendum_consultatif"
    annee: 2000
    concept_local: "Native Inhabitants of Guam"
    resume: >-
      Une loi de Guam de 2000 prévoyait un plébiscite sur le statut politique (indépendance, libre association ou État fédéré) réservé aux « habitants autochtones de Guam », définis par l'ascendance de personnes devenues citoyennes par l'Organic Act de 1950. Le tribunal fédéral de district a invalidé cette restriction le 8 mars 2017 ; la Cour d'appel du neuvième circuit l'a jugée contraire au quinzième amendement (interdiction de restreindre le vote selon la race) le 29 juillet 2019 ; la décision est devenue définitive le 4 mai 2020. Un référendum de 1987 avait approuvé un projet d'État libre associé, dont les négociations avec Washington ont pris fin en 1997.
    gouvernance: "Législature de Guam (loi) ; Commission guamienne de décolonisation ; électorat restreint invalidé par la justice fédérale."
    effectivite: "Plébiscite interrompu après la décision fédérale ; plus de 11 000 autochtones s'étaient inscrits auprès de la Commission de décolonisation (résolution 79/105)."
    textes:
      - {titre: "Davis v. Guam, n° 17-15719 (9e circuit, 29 juillet 2019)", nature: "jurisprudence", annee: 2019, source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
    sources:
      - {titre: "Résolution 79/105 « Question de Guam » (2024)", url: "https://documents.un.org/api/symbol/access?s=A/RES/79/105&l=fr&t=pdf"}
      - {titre: "Davis v. Guam (9e circuit, 2019)", url: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}

  - id: "ecosse"
    atlas_uid: "ecossais-ecosse"
    communaute: "Peuple d'Écosse"
    etats: ["Royaume-Uni"]
    entite: "Écosse"
    mecanisme: "referendum_sans_competence"
    annee: 2022
    concept_local: ""
    resume: >-
      L'Union des royaumes d'Écosse et d'Angleterre est une matière réservée (compétence que le Parlement du Royaume-Uni garde pour lui) (Scotland Act 1998, annexe 5, partie I, para. 1). Le référendum du 18 septembre 2014 a eu lieu grâce à un transfert temporaire de compétence par une ordonnance de 2013 ; pour la première fois, les jeunes de 16 et 17 ans pouvaient voter. Le non l'a emporté avec 55,3 % contre 44,7 %, pour une participation de 84,6 %. Le 23 novembre 2022, la Cour suprême du Royaume-Uni a jugé que le Parlement écossais n'a pas compétence pour organiser seul un nouveau référendum.
    gouvernance: "Parlement écossais, avec un transfert de compétence par le Parlement du Royaume-Uni ; électeurs résidant en Écosse, dès 16 ans en 2014."
    effectivite: "Exercé une fois, en 2014, avec un accord du gouvernement britannique ; refus. Sans nouveau transfert, aucune base légale pour un second vote ([2022] UKSC 31)."
    textes:
      - {titre: "Scotland Act 1998, annexe 5", nature: "loi", annee: 1998, source: "https://www.legislation.gov.uk/ukpga/1998/46/schedule/5"}
      - {titre: "Cour suprême du Royaume-Uni, [2022] UKSC 31", nature: "jurisprudence", annee: 2022, source: "https://www.supremecourt.uk/cases/uksc-2022-0098"}
    sources:
      - {titre: "House of Commons Library — Scottish Independence Referendum 2014: Analysis of results (RP14-50)", url: "https://commonslibrary.parliament.uk/research-briefings/rp14-50/"}
      - {titre: "[2022] UKSC 31 — Cour suprême du Royaume-Uni", url: "https://www.supremecourt.uk/cases/uksc-2022-0098"}

  - id: "catalogne"
    atlas_uid: "catalans-catalogne"
    communaute: "Catalans de Catalogne"
    etats: ["Espagne"]
    entite: "Catalogne, communauté autonome"
    mecanisme: "referendum_sans_competence"
    annee: 2017
    concept_local: ""
    resume: >-
      Le Statut d'autonomie de 2006 ne prévoit pas de référendum sur l'indépendance. Le 6 septembre 2017, le Parlement de Catalogne adopte la loi 19/2017 « du référendum d'autodétermination ». Par l'arrêt 114/2017 du 17 octobre 2017, le Tribunal constitutionnel la déclare inconstitutionnelle et nulle en totalité. La loi qui fondait le vote du 1er octobre 2017 étant nulle, ce dossier n'en examine pas les résultats.
    gouvernance: "Parlement de Catalogne (loi 19/2017, annulée) ; le Tribunal constitutionnel juge qu'une communauté autonome ne peut convoquer un tel vote."
    effectivite: "Aucun droit reconnu en droit espagnol ; vote de 2017 sans effet juridique selon l'arrêt 114/2017."
    textes:
      - {titre: "Tribunal constitutionnel, arrêt 114/2017 du 17 octobre 2017", nature: "jurisprudence", annee: 2017, source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2017-12206"}
      - {titre: "Statut d'autonomie de la Catalogne (loi organique 6/2006)", nature: "statut_autonomie", annee: 2006, source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
    sources:
      - {titre: "BOE — Arrêt 114/2017 du Tribunal constitutionnel", url: "https://www.boe.es/buscar/doc.php?id=BOE-A-2017-12206"}

  - id: "kurdistan-irak"
    atlas_uid: "kurdes-region-kurdistan-irak"
    communaute: "Kurdes de la Région du Kurdistan"
    etats: ["Irak"]
    entite: "Région du Kurdistan"
    mecanisme: "referendum_sans_competence"
    annee: 2017
    concept_local: ""
    resume: >-
      La Constitution irakienne de 2005 reconnaît la Région du Kurdistan comme région fédérale ; elle ne prévoit pas de sécession. La région organise le 25 septembre 2017 un référendum d'indépendance, y compris dans des territoires disputés avec Bagdad comme Kirkouk ; selon la commission électorale régionale, 92 % des votants choisissent l'indépendance. Le vote est présenté comme non contraignant. Le 20 novembre 2017, la Cour suprême fédérale le déclare inconstitutionnel en s'appuyant sur l'article 1, qui fait de la Constitution la garante de l'unité de l'Irak.
    gouvernance: "Gouvernement et Parlement de la Région du Kurdistan (organisation du vote) ; Cour suprême fédérale (art. 93, litiges entre l'État fédéral et les régions)."
    effectivite: "Vote tenu, déclaré inconstitutionnel ; aucun effet juridique. La fiche ne retient pas de droit d'autodétermination externe."
