  - id: "aruba"
    atlas_uid: "aruba"
    communaute: "Électeurs d'Aruba"
    etats: ["Pays-Bas (Royaume)"]
    entite: "Aruba, pays du Royaume des Pays-Bas"
    mecanisme: "secession_constitutionnelle"
    annee: 1995
    concept_local: "landsverordening"
    resume: >-
      Les articles 58 à 60 du Statut du Royaume (charte constitutionnelle commune aux pays du Royaume), en vigueur depuis 1995, organisent la sortie d'Aruba. Le Parlement d'Aruba (Staten) vote aux deux tiers des membres en fonction une ordonnance nationale (landsverordening) déclarant vouloir mettre fin à l'ordre juridique du Statut, accompagnée d'une esquisse de constitution future. Un référendum a lieu dans les six mois ; l'ordonnance n'est adoptée que si une majorité des électeurs inscrits, et non des seuls votants, l'approuve. Les Staten adoptent ensuite la constitution aux deux tiers, et un décret royal fixe, conformément à l'avis du gouvernement d'Aruba, la date de fin du lien, au plus un mois après. Aucune approbation par le Parlement des Pays-Bas ou par le gouvernement du Royaume n'est prévue.
    gouvernance: "Staten d'Aruba (deux tiers, deux fois), électeurs inscrits d'Aruba (majorité absolue des inscrits) ; le Royaume fixe la date par décret royal conformément à l'avis du gouvernement d'Aruba (art. 60)."
    effectivite: "Jamais exercé. La loi de 1994 entrée en vigueur en 1995 a abrogé l'ancien article 62, qui prévoyait l'indépendance d'Aruba en 1996 ; Aruba reste pays du Royaume pour une durée indéterminée."
    textes:
      - {titre: "Statuut voor het Koninkrijk der Nederlanden, art. 58 à 60 (rédaction de 1995)", nature: "loi_organique", annee: 1995, source: "https://wetten.overheid.nl/jci1.3:c:BWBR0002154"}
    sources:
      - {titre: "Statuut voor het Koninkrijk der Nederlanden, XML au 1er janvier 2024 — officiële overheidspublicaties", url: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0002154/2024-01-01_0/xml/BWBR0002154_2024-01-01_0.xml"}
      - {titre: "Het Statuut — Parlamento di Aruba", url: "https://www.parlamento.aw/het-statuut"}

  - id: "irlande-du-nord"
    atlas_uid: "irlande-du-nord"
    communaute: "Population de l'Irlande du Nord"
    etats: ["Royaume-Uni", "Irlande"]
    entite: "Irlande du Nord"
    mecanisme: "sortie_par_accord"
    annee: 1998
    concept_local: "border poll"
    resume: >-
      L'accord de Belfast du 10 avril 1998 reconnaît au peuple de l'île d'Irlande seul le droit d'exercer son autodétermination, par accord entre ses deux parties, avec un consentement donné librement et en même temps au Nord et au Sud. La section 1 du Northern Ireland Act 1998 dispose que l'Irlande du Nord ne cesse d'appartenir au Royaume-Uni que par le vote d'une majorité de sa population lors d'un référendum. Le secrétaire d'État doit l'organiser s'il lui paraît probable qu'une majorité choisirait une Irlande unie ; aucun nouveau vote n'est possible avant sept ans (annexe 1). Si la majorité choisit une Irlande unie, le gouvernement soumet au Parlement les propositions convenues avec l'Irlande.
    gouvernance: "Électeurs d'Irlande du Nord (majorité simple) ; déclenchement par le secrétaire d'État pour l'Irlande du Nord ; mise en œuvre par les Parlements britannique et irlandais."
    effectivite: "Aucun référendum organisé au titre de l'annexe 1. L'Assemblée et l'exécutif n'ont pas fonctionné pleinement de février 2022 au 3 février 2024 (bibliothèque de la Chambre des communes)."
    textes:
      - {titre: "Accord de Belfast et accord britannico-irlandais du 10 avril 1998", nature: "accord_paix", annee: 1998, source: "https://avalon.law.yale.edu/20th_century/good_friday.asp"}
      - {titre: "Northern Ireland Act 1998, s. 1 et annexe 1", nature: "loi", annee: 1998, source: "https://www.legislation.gov.uk/ukpga/1998/47/schedule/1"}
    sources:
      - {titre: "Northern Ireland Act 1998, section 1 — legislation.gov.uk", url: "https://www.legislation.gov.uk/ukpga/1998/47/section/1"}
      - {titre: "The Good Friday Agreement — Avalon Project, Yale Law School", url: "https://avalon.law.yale.edu/20th_century/good_friday.asp"}
      - {titre: "House of Commons Library — Northern Ireland devolution: Safeguarding the Union", url: "https://commonslibrary.parliament.uk/research-briefings/cbp-9954/"}

  - id: "nouvelle-caledonie"
    atlas_uid: "kanak-nouvelle-caledonie"
    communaute: "Kanak et populations intéressées de Nouvelle-Calédonie"
    etats: ["France"]
    entite: "Nouvelle-Calédonie"
    mecanisme: "consultation_accord_paix"
    annee: 1998
    concept_local: "Kanaky"
    resume: >-
      L'accord de Nouméa de 1998, constitutionnalisé par l'article 77 de la Constitution, et la loi organique de 1999 (art. 216 à 218) prévoient une consultation sur l'accession à la pleine souveraineté. Seuls votent les électeurs inscrits sur une liste électorale spéciale, définie par des conditions de durée de résidence, de statut civil coutumier (régime de droit civil régi par la coutume kanak) ou de naissance. La majorité des suffrages exprimés décide ; en cas de refus, une deuxième puis une troisième consultation peuvent être organisées à la demande d'un tiers des membres du Congrès. Les trois consultations ont donné : non 56,7 % en 2018 (participation 81,0 %), non 53,3 % en 2020 (participation 85,7 %), non 96,5 % en 2021, scrutin que les mouvements indépendantistes avaient appelé à ne pas suivre (participation 43,9 %).
    gouvernance: "Électeurs de la liste spéciale pour la consultation (majorité des suffrages exprimés) ; consultation organisée par l'État ; deuxième et troisième consultations à la demande d'un tiers du Congrès."
    effectivite: "Exercé trois fois, avec un refus à chaque scrutin. L'Assemblée générale relève les préoccupations exprimées sur le résultat de 2021 (résolution 79/107). Le projet de loi constitutionnelle traduisant l'accord de Bougival (2025) a été rejeté par l'Assemblée nationale le 2 avril 2026 ; la suite du processus n'est pas fixée."
    textes:
      - {titre: "Accord sur la Nouvelle-Calédonie signé à Nouméa le 5 mai 1998", nature: "accord_paix", annee: 1998, source: "https://peacemaker.un.org/sites/default/files/document/files/2024/05/accord20sur20la20nouvelle-calc3a9donie20signc3a920c3a020noumc3a9a20le20520mai201998.pdf"}
      - {titre: "Loi organique n° 99-209 du 19 mars 1999, art. 216 à 218", nature: "loi_organique", annee: 1999, source: "https://dass.gouv.nc/sites/default/files/atoms/files/loi_organique_modifiee_99-209_du_19_mars_1999-nc.pdf"}
    sources:
      - {titre: "Résolution 79/107 « Question de la Nouvelle-Calédonie » (2024)", url: "https://documents.un.org/api/symbol/access?s=A/RES/79/107&l=fr&t=pdf"}
      - {titre: "Assemblée nationale — Réponse à la question écrite n° 15887 (résultats de 2018)", url: "https://www.assemblee-nationale.fr/dyn/15/questions/QANR5L15QE15887.pdf"}
      - {titre: "Maison de la Nouvelle-Calédonie — Référendum 2020 : résultats officiels", url: "https://www.mncparis.fr/actualites/archives/2020/referendum-2020-resultats-officiels"}
      - {titre: "Public Sénat — Le non à l'indépendance l'emporte (12 décembre 2021), participation de 2021", url: "https://www.publicsenat.fr/actualites/non-classe/referendum-en-nouvelle-caledonie-le-non-a-l-independance-l-emporte-a-191563"}
      - {titre: "Assemblée nationale — Réponse à la question écrite n° 40773 (résultats définitifs de 2021)", url: "https://www.assemblee-nationale.fr/dyn/15/questions/QANR5L15QE40773.pdf"}
      - {titre: "Localtis — Les députés rejettent le projet de réforme constitutionnelle (3 avril 2026)", url: "https://www.banquedesterritoires.fr/les-deputes-rejettent-le-projet-de-reforme-constitutionnelle-de-la-nouvelle-caledonie"}

  - id: "bougainville"
    atlas_uid: "bougainville"
    communaute: "Peuple de Bougainville"
    etats: ["Papouasie-Nouvelle-Guinée"]
    entite: "Région autonome de Bougainville"
    mecanisme: "consultation_accord_paix"
    annee: 2001
    concept_local: ""
    resume: >-
      L'accord de paix de Bougainville, signé à Arawa le 30 août 2001, est mis en œuvre par la partie XIV de la Constitution nationale. Elle prévoit un référendum sur le statut politique futur, indépendance comprise (art. 338 et 339), et soumet le résultat à des consultations entre les deux gouvernements puis au Parlement national, qui a le dernier mot (art. 342). Le texte ne fixe pas de majorité qualifiée et le résultat ne lie pas le Parlement. Au référendum de fin 2019, 207 213 électeurs étaient inscrits ; 176 928 ont choisi l'indépendance (97,7 %) et 3 043 une autonomie renforcée, sur 181 067 votants (participation 87,4 %).
    gouvernance: "Électeurs inscrits sur la liste du référendum ; commission du référendum ; consultations entre gouvernements ; ratification ou rejet par le Parlement national."
    effectivite: "Exercé en 2019 ; résultat non encore ratifié. Il a été déposé au Parlement national le 27 août 2026 ; le gouvernement annonce une réunion en octobre 2026 pour fixer la date du vote (RNZ)."
    textes:
      - {titre: "Accord de paix de Bougainville, Arawa, 30 août 2001 (déclaration du président du Conseil de sécurité, SC/7238)", nature: "accord_paix", annee: 2001, source: "https://press.un.org/en/2001/sc7238.doc.htm"}
      - {titre: "Constitution de Papouasie-Nouvelle-Guinée, partie XIV, art. 338 à 342", nature: "constitution", annee: 2002, source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
    sources:
      - {titre: "Commission du référendum de Bougainville — Voter Information (archive)", url: "https://bougainville-referendum.org/voter-information/index.html"}
      - {titre: "ABC News — Bougainville votes overwhelmingly for independence (11 décembre 2019)", url: "https://www.abc.net.au/news/2019-12-11/bougainville-independence-referendum-result/11787434"}
      - {titre: "RNZ — PNG parliament decision on Bougainville still months off at least (28 août 2026)", url: "https://www.rnz.co.nz/news/pacific/1157863/png-parliament-decision-on-bougainville-still-months-off-at-least"}

  - id: "abyei"
    atlas_uid: "ngok-dinka-abyei"
    communaute: "Ngok Dinka et autres résidents de la zone d'Abyei"
    etats: ["Soudan", "Soudan du Sud"]
    entite: "Zone d'Abyei"
    mecanisme: "consultation_accord_paix"
    annee: 2004
    concept_local: ""
    resume: >-
      Le Protocole d'Abyei du 26 mai 2004, intégré à l'Accord de paix global de 2005, prévoit un vote séparé, simultané au référendum du Sud-Soudan, entre deux choix : garder un statut administratif spécial au Nord ou rejoindre le Bahr el-Ghazal (sections 1.3 et 8). Les résidents appelés à voter sont « les membres de la communauté ngok dinka et les autres Soudanais résidant dans la zone » ; les critères de résidence devaient être fixés par une commission du référendum (section 6.1). La Constitution de transition du Soudan du Sud reprend ce référendum (art. 97).
    gouvernance: "Commission du référendum d'Abyei, jamais constituée ; la résolution 2802 (2025) relève trois administrations dans la zone : celle mise en place par le Soudan du Sud, celle mise en place par le Soudan et l'administration misseriya à Moughlad."
    effectivite: "Jamais organisé : le vote prévu en janvier 2011 n'a pas eu lieu. La résolution 2802 (2025) du Conseil de sécurité insiste pour que le statut futur soit déterminé par la négociation entre les parties. Un vote non officiel de 2013 est signalé par la fiche de l'atlas, sans source primaire."
    textes:
      - {titre: "Protocole sur la résolution du conflit d'Abyei, 26 mai 2004, sections 1.3, 6.1 et 8", nature: "accord_paix", annee: 2004, source: "https://www.peaceagreements.org/media/documents/ag583_55dc1c528ce29.pdf"}
      - {titre: "Constitution de transition du Soudan du Sud, art. 97", nature: "constitution", annee: 2011, source: "https://www.constituteproject.org/constitution/South_Sudan_2013"}
    sources:
      - {titre: "PA-X, Université d'Édimbourg — Protocole d'Abyei (2004)", url: "https://www.peaceagreements.org/media/documents/ag583_55dc1c528ce29.pdf"}
      - {titre: "Conseil de sécurité, résolution 2802 (2025)", url: "https://documents.un.org/api/symbol/access?s=S/RES/2802(2025)&l=fr&t=pdf"}

  - id: "sahara-occidental"
    atlas_uid: "sahraouis-sahara-occidental"
    communaute: "Peuple du Sahara occidental"
    etats: ["Maroc"]
    entite: "Sahara occidental, territoire non autonome"
    mecanisme: "consultation_accord_paix"
    annee: 1988
    concept_local: ""
    resume: >-
      Le Sahara occidental figure depuis 1963 sur la liste des territoires non autonomes (territoires dont la population ne s'administre pas encore pleinement elle-même, suivis par l'ONU). Le plan de règlement accepté par le Maroc et le Front POLISARIO le 30 août 1988, approuvé par les résolutions 658 (1990) et 690 (1991) du Conseil de sécurité, prévoit un référendum entre l'indépendance et l'intégration au Maroc. La résolution 690 crée la Mission des Nations unies pour l'organisation d'un référendum au Sahara occidental (MINURSO). Le texte relève du droit international ; aucune disposition marocaine ne prévoit ce référendum.
    gouvernance: "Organisation confiée à l'ONU par le plan de règlement ; corps électoral à établir par la MINURSO."
    effectivite: "Jamais organisé. Les hostilités ont repris en 2020. La résolution 2797 (2025) fonde les négociations sur le plan d'autonomie marocain de 2007 tout en demandant une solution qui « assure l'autodétermination du peuple du Sahara occidental »."
    textes:
      - {titre: "Conseil de sécurité, résolution 690 (1991)", nature: "traite", annee: 1991, source: "https://docs.un.org/fr/S/RES/690(1991)"}
    sources:
      - {titre: "Conseil de sécurité, résolution 2797 (2025)", url: "https://docs.un.org/fr/S/RES/2797(2025)"}
      - {titre: "Sahara occidental — Document de travail du Secrétariat, A/AC.109/2026/17", url: "https://docs.un.org/fr/A/AC.109/2026/17"}
      - {titre: "Human Rights Watch — ONU : le droit à l'autodétermination des habitants du Sahara occidental est menacé (2026)", url: "https://www.hrw.org/fr/news/2026/03/25/onu-le-droit-a-lautodetermination-des-habitants-du-sahara-occidental-est-menace"}

  - id: "cachemire-azad"
    atlas_uid: "azad-jammu-et-cachemire"
    communaute: "Population de l'ancien État de Jammu-et-Cachemire (partie administrée par le Pakistan)"
    etats: ["Pakistan"]
    entite: "Azad Jammu-et-Cachemire (et Gilgit-Baltistan)"
    mecanisme: "consultation_accord_paix"
    annee: 1948
    concept_local: ""
    resume: >-
      Les résolutions de la Commission des Nations unies pour l'Inde et le Pakistan (UNCIP) de 1948 et 1949 prévoient un plébiscite (vote de la population sur le rattachement) pour décider du statut de l'ensemble de l'État de Jammu-et-Cachemire. La Constitution intérimaire de l'Azad Jammu-et-Cachemire de 1974 y renvoie dans son préambule et permet au Président de nommer un conseiller pour le plébiscite (art. 11). La même Constitution interdit d'agir contre « l'idéologie de l'adhésion de l'État au Pakistan » (art. 4, droit fondamental 7 (3)). Au Gilgit-Baltistan, l'ordre de 2018 réserve la position du Pakistan sur l'autodétermination « conformément aux résolutions des Nations unies » (art. 115).
    gouvernance: "Plébiscite sous l'égide de l'ONU, jamais organisé ; l'article 257 de la Constitution du Pakistan prévoit que, si le peuple de l'État choisit l'adhésion, la relation sera fixée selon sa volonté."
    effectivite: "Jamais organisé depuis 1948. Le HCDH (2018) écrit que le territoire est contrôlé dans les faits par le gouvernement du Pakistan ; le choix offert par la Constitution intérimaire se limite à l'adhésion au Pakistan."
    textes:
      - {titre: "Azad Jammu and Kashmir Interim Constitution 1974, préambule, art. 4 et 11", nature: "constitution", annee: 1974, source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
      - {titre: "Government of Gilgit-Baltistan Order 2018, art. 115", nature: "statut_autonomie", annee: 2018, source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
    sources:
      - {titre: "UNCIP — premier rapport intérimaire (S/1100, 1948)", url: "https://documents.un.org/api/symbol/access?s=S/1100&l=en&t=pdf"}
      - {titre: "Conseil de sécurité, résolution 91 (1951)", url: "https://docs.un.org/en/S/RES/91(1951)"}
      - {titre: "HCDH — Report on the Situation of Human Rights in Kashmir (juin 2018)", url: "https://www.ohchr.org/Documents/Countries/IN/DevelopmentsInKashmirJune2016ToApril2018.pdf"}
      - {titre: "Constitution du Pakistan, partie XII, chapitre 4 (art. 257)", url: "https://www.pakistani.org/pakistan/constitution/part12.ch4.html"}

  - id: "iles-cook"
    atlas_uid: "iles-cook"
    communaute: "Peuple des Îles Cook"
    etats: ["Nouvelle-Zélande (libre association)"]
    entite: "Îles Cook"
    mecanisme: "acte_onu"
    annee: 1965
    concept_local: ""
    resume: >-
      En 1965, des élections surveillées par un représentant de l'ONU ont porté au pouvoir une assemblée qui a adopté le statut d'autonomie en libre association avec la Nouvelle-Zélande ; l'Assemblée générale en prend acte par la résolution 2064 (XX). La Nouvelle-Zélande garde des responsabilités pour les affaires extérieures et la défense, exercées après consultation du Premier ministre des Îles Cook. La déclaration néo-zélandaise de 1988 qualifie les Îles Cook d'« État autonome en libre association volontaire » issu d'un acte d'autodétermination conforme à la résolution 1541 (XV). Le vote a porté sur le choix d'un statut, non sur une procédure de sortie future.
    gouvernance: "Électeurs des Îles Cook en 1965 ; depuis, gouvernement et Parlement des Îles Cook, la Nouvelle-Zélande gardant les affaires extérieures et la défense, exercées après consultation du Premier ministre des Îles Cook."
    effectivite: "Exercé en 1965 ; statut en vigueur. Les habitants conservent la citoyenneté néo-zélandaise. Aucune évaluation indépendante consultée sur les relations de 2025-2026."
    textes:
      - {titre: "Constitution of the Cook Islands, version consolidée au 13 juin 2022", nature: "constitution", annee: 1965, source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
    sources:
      - {titre: "Résolution 2064 (XX) de l'Assemblée générale (1965)", url: "https://documents.un.org/api/symbol/access?s=A/RES/2064%28XX%29&l=fr&t=pdf"}
      - {titre: "Parlement des Îles Cook — page Constitution", url: "https://parliament.gov.ck/mandates/constitution-2/"}

  - id: "niue"
    atlas_uid: "niue"
    communaute: "Peuple de Niue"
    etats: ["Nouvelle-Zélande (libre association)"]
    entite: "Niue"
    mecanisme: "acte_onu"
    annee: 1974
    concept_local: ""
    resume: >-
      En 1974, le peuple de Niue a voté par référendum pour l'autonomie en libre association avec la Nouvelle-Zélande ; une mission spéciale de l'ONU, envoyée à Niue en août 1974, a observé la procédure. L'Assemblée générale en prend acte par la résolution 3285 (XXIX) et juge que la communication de renseignements au titre de l'article 73 e de la Charte (obligation de rendre compte d'un territoire non autonome) n'est plus nécessaire. Le statut est en vigueur depuis le 19 octobre 1974. L'Assemblée de Niue peut modifier la Constitution (art. 35).
    gouvernance: "Électeurs de Niue en 1974 ; Assemblée de Niue (20 membres, dont 14 élus par les villages) pour la révision constitutionnelle."
    effectivite: "Exercé en 1974 ; statut en vigueur. La Nouvelle-Zélande s'est engagée à continuer son assistance économique et administrative (résolution 3285 (XXIX), par. 7)."
    textes:
      - {titre: "Niue Constitution Act 1974 et Constitution of Niue, édition 2019", nature: "constitution", annee: 1974, source: "https://www.gov.nu/media/pages/information/5304ad08d7-1764012786/niue_constitution_ul2022.pdf"}
    sources:
      - {titre: "Résolution 3285 (XXIX) de l'Assemblée générale (1974)", url: "https://documents.un.org/api/symbol/access?s=A/RES/3285%28XXIX%29&l=fr&t=pdf"}
      - {titre: "Gouvernement de Niue — Our History", url: "https://www.gov.nu/our-history"}

  - id: "mariannes-du-nord"
    atlas_uid: "mariannes-du-nord"
    communaute: "Chamorros et Caroliniens des Mariannes du Nord"
    etats: ["États-Unis"]
    entite: "Commonwealth des Îles Mariannes du Nord"
    mecanisme: "acte_onu"
    annee: 1976
    concept_local: ""
    resume: >-
      Les Mariannes du Nord faisaient partie du Territoire sous tutelle des îles du Pacifique (territoire confié par l'ONU à un État chargé de l'administrer), administré par les États-Unis depuis 1947. Leurs populations ont approuvé par plébiscite, observé par une mission de visite du Conseil de tutelle, le Pacte (Covenant) qui établit un Commonwealth (territoire des États-Unis doté d'une constitution propre) en union politique avec les États-Unis, en vigueur depuis 1976. En 1990, la résolution 683 du Conseil de sécurité constate qu'elles ont ainsi exercé leur droit à l'autodétermination et que l'accord de tutelle cesse de s'appliquer. Ni le Pacte ni la Constitution du Commonwealth consultée ne prévoient de nouveau vote sur le statut.
    gouvernance: "Populations des Mariannes du Nord par plébiscite ; Conseil de tutelle puis Conseil de sécurité pour la fin de la tutelle."
    effectivite: "Exercé une fois ; statut en vigueur. La fiche ne retient pas de droit actuel d'autodétermination externe faute de texte ; en 2016, la justice fédérale a invalidé le vote réservé aux personnes d'ascendance nord-mariannaise sur l'article XII (Davis v. Commonwealth Election Commission)."
    textes:
      - {titre: "Conseil de sécurité, résolution 683 (1990)", nature: "traite", annee: 1990, source: "https://documents.un.org/api/symbol/access?s=S/RES/683(1990)&l=fr&t=pdf"}
      - {titre: "Constitution du Commonwealth des Îles Mariannes du Nord", nature: "constitution", annee: 1978, source: "https://cnmilaw.org/cons.php"}
    sources:
      - {titre: "Conseil de sécurité — Résolution 683 (1990)", url: "https://documents.un.org/api/symbol/access?s=S/RES/683(1990)&l=fr&t=pdf"}
