cas:
  - id: "qoliqoli-fidji"
    atlas_uid: "qoliqoli-fidji"
    communaute: "Mataqali et autres unités sociales iTaukei titulaires de droits de pêche"
    etats: ["Fidji"]
    entite: "410 zones de pêche coutumières, dont 385 marines et 25 d'eau douce"
    mecanisme: "droit_coutumier_reconnu"
    annee: 1942
    concept_local: "qoliqoli ; tabu"
    resume: >-
      La loi sur les pêches, en vigueur depuis 1942, charge une commission d'établir quels droits de pêche coutumiers appartiennent à quels groupes et d'en inscrire les limites dans un registre (art. 14 à 20). Réserver et exclure : sur un récif ou un banc de coquillages inscrit, une personne extérieure au groupe ne peut pêcher qu'avec un permis du commissaire de division, qui consulte le groupe (art. 13) ; la pêche à la ligne, au harpon ou au piège portatif hors commerce en est exemptée. Selon la FAO, le service des pêches demande en pratique l'accord préalable du chef. Fermer : le chef héréditaire limite l'accès, interdit les filets maillants ou les compresseurs de plongée ; en 2013, 143 qoliqoli comptaient 415 aires tabu. Sanctionner : les sources consultées ne décrivent pas les sanctions appliquées.
    gouvernance: "Chef héréditaire ou autorité coutumière de l'unité titulaire ; Commission des pêcheries iTaukei (registre) ; commissaire de division (permis, après consultation du groupe)."
    effectivite: "Selon la FAO (2009), la plupart des zones n'ont pas d'objectifs de gestion formels ; le cinquième rapport à la CDB (2014) indique qu'au moins 70 qoliqoli sur 400 sont surexploités."
    textes:
      - {titre: "Fisheries Act (loi sur les pêches), chap. 158, art. 13 à 20", nature: "loi", annee: 1942, source: "https://faolex.fao.org/docs/pdf/fij1155.pdf"}
      - {titre: "Constitution de Fidji, art. 30 (part des redevances minières du fond marin)", nature: "constitution", annee: 2013, source: "https://www.constituteproject.org/constitution/Fiji_2013"}
    sources:
      - {titre: "Fisheries Act, chap. 158 — FAOLEX", url: "https://faolex.fao.org/docs/pdf/fij1155.pdf"}
      - {titre: "Stratégie et plan d'action nationaux pour la biodiversité de Fidji 2020-2025 — CDB", url: "https://www.cbd.int/doc/world/fj/fj-nbsap-v2-en.pdf"}
      - {titre: "FAO — Profil de la pêche et de l'aquaculture : Fidji (2009)", url: "https://www.fao.org/fishery/docs/DOCUMENT/fcp/en/FI_CP_FJ.pdf"}
      - {titre: "Cinquième rapport national de Fidji à la CDB (2014)", url: "https://www.cbd.int/doc/world/fj/fj-nr-05-en.pdf"}

  - id: "salomon-droits-coutumiers"
    atlas_uid: "peche-coutumiere-iles-salomon"
    communaute: "Communautés titulaires de droits coutumiers sur les eaux de pêche"
    etats: ["Îles Salomon"]
    entite: "Zones de droits coutumiers, jusqu'au bord externe du récif"
    mecanisme: "droit_coutumier_reconnu"
    annee: 2015
    concept_local: ""
    resume: >-
      La loi sur la gestion des pêches de 2015 reconnaît les droits que les communautés exercent sur des eaux du fait de leur usage historique, attesté par les chefs coutumiers (art. 2). Exclure : nul ne peut pêcher ou entrer dans une zone de droits coutumiers avec un autre bateau que ceux de la pêche coutumière sans la permission des titulaires, sous peine d'amende et d'un an d'emprisonnement au plus (art. 21). Une aire marine nationale qui inclut une telle zone exige leur accord (art. 19 (4)). Fermer et sanctionner : un plan communautaire de gestion peut fixer des fermetures, des amendes et des pouvoirs de contrôle ; il prend valeur d'arrêté local (bye-law) après adoption par l'assemblée provinciale et publication au Journal officiel (art. 18).
    gouvernance: "Titulaires désignés par le droit coutumier pour donner la permission de pêcher ; comité représentant les titulaires ; exécutif provincial et directeur des pêches (approbation des plans, objection possible sous 60 jours)."
    effectivite: "Plus de 300 communautés pratiquent une forme de gestion communautaire (politique nationale 2019-2029) ; selon la Banque mondiale (2024), les plans non publiés ne s'appliquent que par les systèmes villageois, et l'ordonnance des pêches de Choiseul attendait en 2022 l'avis du procureur général."
    textes:
      - {titre: "Fisheries Management Act 2015, art. 2, 3, 18, 19 et 21", nature: "loi", annee: 2015, source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
    sources:
      - {titre: "Fisheries Management Act 2015 — FAOLEX", url: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
      - {titre: "Solomon Islands National Fisheries Policy 2019-2029 — FAOLEX", url: "https://faolex.fao.org/docs/pdf/sol188935.pdf"}
      - {titre: "MFMR et WorldFish — CBRM in Solomon Islands: Provincial Snapshots 2022", url: "https://digitalarchive.worldfishcenter.org/server/api/core/bitstreams/8da4642f-da76-4de9-83c9-20f8dc51adcb/content"}
      - {titre: "Banque mondiale — Solomon Islands: case studies (2024)", url: "https://documents1.worldbank.org/curated/en/099071624162524055/pdf/P1743531b641cf0df1aa09105fb4074f5cb.pdf"}

  - id: "chuuk-recifs"
    atlas_uid: "recifs-coutumiers-chuuk"
    communaute: "Lignages et autres titulaires de droits traditionnels, municipalités de l'État de Chuuk"
    etats: ["États fédérés de Micronésie"]
    entite: "Récifs, estrans et terres submergées, avec la colonne d'eau"
    mecanisme: "droit_coutumier_reconnu"
    annee: 1989
    concept_local: ""
    resume: >-
      La Constitution de l'État de Chuuk, en vigueur depuis le 1er octobre 1989, reconnaît « les droits traditionnels sur tous les récifs, estrans et autres terres submergées, y compris leur colonne d'eau » ; la législature peut en réglementer l'usage raisonnable (art. IV, s. 4). Les 39 municipalités, dont la constitution « doit être démocratique et peut être traditionnelle », sont compétentes sur l'espace marin à l'intérieur des récifs, et leurs pouvoirs sur les affaires locales priment sur la loi de l'État (art. XIII). Les sources consultées ne décrivent pas les règles de fermeture, d'exclusion ou de sanction fixées par les titulaires.
    gouvernance: "Titulaires de droits traditionnels (lignages selon F. X. Hezel ; « propriétaires individuels » selon la Cour suprême de Chuuk, 1993) ; municipalités et chefs traditionnels reconnus (art. IV, s. 2) ; législature de l'État pour l'usage raisonnable."
    effectivite: "La Cour suprême de Chuuk restreint la portée de l'article : effet pour l'avenir seulement (1993), exclusion des chenaux profonds et des estrans remblayés avant 1989 (Sellem v. Maras, 1995)."
    textes:
      - {titre: "Constitution de l'État de Chuuk, art. IV (droits traditionnels)", nature: "constitution", annee: 1989, source: "http://fsmlaw.org/chuuk/constitution/article04.htm"}
      - {titre: "Constitution de l'État de Chuuk, art. XIII (municipalités)", nature: "constitution", annee: 1989, source: "http://fsmlaw.org/chuuk/constitution/article13.htm"}
    sources:
      - {titre: "Constitution de l'État de Chuuk — FSM Legal Information System", url: "https://fsmlaw.org/chuuk/constitution/entire.htm"}
      - {titre: "F. X. Hezel, « Land Issues in Chuuk », Micronesian Counselor n° 16 (1994)", url: "https://micsem.org/micronesian-counselo/land-issues-in-chuuk/"}

  - id: "ecmpo-chili"
    atlas_uid: "espaces-cotiers-marins-peuples-originaires-chili"
    communaute: "Communautés autochtones du littoral constituées selon la loi 19.253"
    etats: ["Chili"]
    entite: "34 espaces côtiers marins décrétés, 222 404 ha (mai 2024)"
    mecanisme: "droit_coutumier_reconnu"
    annee: 2008
    concept_local: ""
    resume: >-
      La loi 20.249 de 2008, dite « loi lafkenche », crée l'espace côtier marin des peuples originaires (ECMPO) pour maintenir un usage coutumier attesté : pêche, usages religieux, récréatifs et médicinaux (art. 6). L'espace est remis à la communauté ou à l'association de communautés par une convention d'usage à durée indéfinie (art. 3 et 12). Réserver : le plan d'administration fixe les usages, les périodes et les usagers extérieurs admis ; les contrevenants sont sanctionnés selon la loi générale de la pêche (art. 11 et 15). Exclure : l'attributaire ne peut empêcher ni l'accès, ni le passage, ni la navigation (art. 15 b). Le plan est approuvé par une commission intersectorielle de l'État.
    gouvernance: "Association de communautés ou communauté seule si elle a seule l'usage coutumier ; commission intersectorielle (approbation du plan) ; Sous-secrétariat à la Pêche (convention d'usage, rapports)."
    effectivite: "Selon Pivotes (2024), les ECMPO décrétés ont attendu en moyenne 5,94 ans, et 109 demandes portant sur 3 823 760 ha restaient en cours au 31 mai 2024."
    textes:
      - {titre: "Loi 20.249 créant l'espace côtier marin des peuples originaires", nature: "loi", annee: 2008, source: "https://www.bcn.cl/leychile/navegar?idNorma=269291"}
      - {titre: "Décret suprême n° 134, règlement de la loi 20.249", nature: "reglement", annee: 2009, source: "https://www.subpesca.cl/portal/616/articles-82585_recurso_1.pdf"}
    sources:
      - {titre: "Historia de la Ley N° 20.249 — Bibliothèque du Congrès national", url: "https://www.bcn.cl/historiadelaley/fileadmin/file_ley/5244/HLD_5244_37a6259cc0c1dae299a7866489dff0bd.pdf"}
      - {titre: "Decretos de destinación ECMPO — Subpesca", url: "https://www.subpesca.cl/portal/615/w3-propertyvalue-51039.html"}
      - {titre: "Ley Lafkenche : alcances y consecuencias — Pivotes (juin 2024)", url: "https://www.pivotes.cl/web/wp-content/uploads/2024/04/240603-Ley-Lafkenche-alcances-y-consecuencias-VF.pdf"}

  - id: "japon-droits-communs"
    atlas_uid: "droits-peche-communs-japon"
    communaute: "Coopératives de pêche côtière (gyogyō kyōdō kumiai)"
    etats: ["Japon"]
    entite: "4 790 droits de pêche communs accordés en 2023"
    mecanisme: "organisation_pecheurs"
    annee: 1949
    concept_local: "kyōdō gyogyōken"
    resume: >-
      La loi sur la pêche de 1949, réformée en 2018, réserve le droit de pêche commun (algues, coquillages, espèces sédentaires, petits filets fixes) à la coopérative du district rattaché à la zone, si ses membres représentent au moins les deux tiers des ménages de pêcheurs côtiers résidents (art. 60, 62 et 72). Le droit dure dix ans et est assimilé à un droit réel, c'est-à-dire un droit sur un bien opposable à tous (art. 75 et 77). Réserver et fermer : la coopérative adopte un règlement d'exercice qui fixe qui peut pêcher, où, quand, avec quels engins et contre quelle redevance ; il faut l'accord écrit des deux tiers des membres concernés, puis l'approbation du gouverneur, qui le refuse s'il est « injustement discriminatoire » (art. 106). Les sources consultées ne décrivent pas les sanctions internes.
    gouvernance: "Assemblée générale de la coopérative, une voix par membre, majorité des deux tiers pour acquérir, modifier ou abandonner un droit ; gouverneur de la préfecture (attribution, approbation, révocation pour motif d'intérêt public, art. 93)."
    effectivite: "148 droits n'ont pas été renouvelés en 2023, dont 59 pour défaut d'usage « approprié et effectif » (Agence des pêches) ; T. Murota relève l'abandon de droits contre indemnités pour des projets industriels, dont des centrales nucléaires."
    textes:
      - {titre: "Loi sur la pêche (loi n° 267 de 1949), art. 60, 72, 75, 77, 93 et 106", nature: "loi", annee: 1949, source: "https://hourei.net/law/324AC0000000267"}
      - {titre: "Loi sur les coopératives de la pêche (loi n° 242 de 1948)", nature: "loi", annee: 1948, source: "https://hourei.net/law/323AC0000000242"}
    sources:
      - {titre: "Agence des pêches — Les droits de pêche", url: "https://www.jfa.maff.go.jp/j/enoki/gyogyouken_jouhou3.html"}
      - {titre: "Agence des pêches — Renouvellement général de 2023", url: "https://www.jfa.maff.go.jp/j/enoki/attach/pdf/gyogyouken_jouhou3-417.pdf"}
      - {titre: "Uchida et Makino, Japanese coastal fishery co-management — FAO", url: "https://www.fao.org/4/a1497e/a1497e20.pdf"}
      - {titre: "Murota, Fishery Commons in Japan — Digital Library of the Commons", url: "https://dlc.dlib.indiana.edu/dlcrest/api/core/bitstreams/ccb45c40-e160-4660-aa22-7fa05edc2fd0/content"}

  - id: "coree-peche-villageoise"
    atlas_uid: "peches-villageoises-coree"
    communaute: "Fraternités de villages de pêcheurs (eochongye), dont les plongeuses haenyeo de Jeju"
    etats: ["Corée du Sud"]
    entite: "Zones littorales de pêche villageoise"
    mecanisme: "organisation_pecheurs"
    annee: 2022
    concept_local: "eochongye"
    resume: >-
      La loi sur la pêche, refondue en 2022, ne donne la licence de pêche villageoise (coquillages, algues, espèces sédentaires d'une zone littorale délimitée) qu'à une fraternité de village de pêcheurs ou à une coopérative de district (art. 7 et 8). Le droit est un droit réel détenu collectivement, pour dix ans prolongeables (art. 14 et 16). Réserver et fermer : la fraternité fixe un règlement de gestion qui désigne qui peut pêcher, les méthodes, les périodes et les redevances (art. 37) ; son assemblée générale décide de l'accès des non-membres domiciliés dans la même ville, le même comté ou le même arrondissement (art. 36). L'autorité locale peut ordonner la modification du règlement, restreindre ou suspendre la pêche pour protéger la ressource ou pour des travaux publics ; les restrictions pour motif d'intérêt public ouvrent droit à indemnisation (art. 33, 37 et 88). Les sources consultées ne décrivent pas les sanctions internes.
    gouvernance: "Assemblée générale de la fraternité ; chef de la ville, du comté ou de l'arrondissement (licence, contrôle du règlement, restrictions)."
    effectivite: "Inconnue : aucune évaluation indépendante consultée ; l'UNESCO (2016) indique qu'à Jeju les coopératives locales détiennent les droits de pêche de leur zone."
    textes:
      - {titre: "Loi sur la pêche (loi n° 18755 de 2022), art. 7, 8, 14, 16, 33, 36 à 38 et 88", nature: "loi", annee: 2022, source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
    sources:
      - {titre: "Fisheries Act (2022), traduction anglaise — Korea Legislation Research Institute", url: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
      - {titre: "La culture des haenyeo de l'île de Jeju — UNESCO", url: "https://ich.unesco.org/fr/RL/la-culture-des-haenyeo-femmes-plongeuses-de-jeju-01068"}

  - id: "amerb-chili"
    atlas_uid: "aires-gestion-ressources-benthiques-chili"
    communaute: "Organisations de pêcheurs artisanaux"
    etats: ["Chili"]
    entite: "758 aires de gestion des ressources benthiques (2017)"
    mecanisme: "organisation_pecheurs"
    annee: 1995
    concept_local: ""
    resume: >-
      La loi générale de la pêche et le règlement de 1995 permettent à l'État de délimiter un secteur côtier et de le confier à une organisation de pêcheurs artisanaux, par une convention d'usage limitée à quatre ans dans le règlement de 1995 et à durée indéfinie depuis la loi 20.657 de 2013 (art. 55 A à 55 H). Réserver et exclure : l'organisation obtient l'usage exclusif des ressources benthiques (invertébrés et algues du fond) du secteur ; ses droits ne peuvent être ni cédés ni loués. Fermer : elle propose un plan de gestion (périodes, modalités d'extraction, quotas) que le Sous-secrétariat de la pêche approuve, et les quantités annuelles sont fixées par résolution de celui-ci. Sanctionner : la surveillance est assurée par l'organisation, les sanctions par l'État ; Gelcich et al. décrivent le braconnage comme l'un des principaux problèmes.
    gouvernance: "Organisation titulaire inscrite au registre de la pêche artisanale ; Sous-secrétariat de la pêche (plan, quotas) ; Service national de la pêche (convention)."
    effectivite: "Hausse de l'abondance et de la taille des ressources ciblées, coûts de surveillance en hausse (Gelcich et al., 2010) ; en 2013, 161 secteurs sur 512 étaient classés « operativo en duda » (fonctionnement incertain)."
    textes:
      - {titre: "Loi générale de la pêche et de l'aquaculture, art. 55 A à 55 H, 144 et 144 A", nature: "loi", annee: 1991, source: "https://www.subpesca.cl/portal/615/articles-88020_documento.pdf"}
      - {titre: "Décret suprême 355 de 1995, règlement des AMERB", nature: "reglement", annee: 1995, source: "https://www.subpesca.cl/portal/615/articles-11086_documento.pdf"}
    sources:
      - {titre: "AMERB — Subpesca", url: "https://www.subpesca.cl/portal/sitio/Areas-y-Zonificaciones/Areas-de-Manejo-y-Explotacion-de-Recursos-Bentonicos-AMERB/"}
      - {titre: "Área de Manejo y Explotación de Recursos Bentónicos (fiche de cas) — CEPAL", url: "https://archivo.cepal.org/cajaherramientas/Casos/Caso_%C3%81rea%20de%20Manejo%20y%20Explotaci%C3%B3n%20de%20Recursos%20Bent%C3%B3nicos.pdf"}
      - {titre: "Gelcich et al., PNAS (2010)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2947917/"}

  - id: "cambodge-pecheries"
    atlas_uid: "pecheries-communautaires-cambodge"
    communaute: "Pêcheries communautaires formées par les habitants d'un ou de plusieurs villages"
    etats: ["Cambodge"]
    entite: "516 pêcheries communautaires (2025), 967 000 hectares cogérés (2018)"
    mecanisme: "organisation_pecheurs"
    annee: 2005
    concept_local: ""
    resume: >-
      Après la réduction des lots de pêche commerciaux en 2001 puis leur suppression en 2012, l'État a confié des zones de son domaine halieutique à des pêcheries communautaires (décret royal de 2005 ; sous-décret, texte réglementaire du gouvernement, de 2007 ; loi sur la pêche de 2025). Réserver : dans les zones continentales, la pêche à petite ou moyenne échelle est réservée aux membres (loi de 2025, art. 29). Fermer : le comité élu prépare un plan de gestion que l'Administration des pêches approuve ; l'accord de zone dure trois ans au plus, renouvelable, et la zone ne peut être ni vendue ni partagée. Sanctionner : en cas d'urgence, la pêcherie peut demander aux autorités voisines de saisir les preuves et de retenir l'auteur d'une infraction, remis aussitôt à l'Administration des pêches (sous-décret, art. 11) ; les statuts fixent l'exclusion des membres.
    gouvernance: "Comité de cinq à onze membres élu au scrutin secret pour cinq ans ; Administration des pêches (enregistrement, plan, accord de zone, reprise possible)."
    effectivite: "En 2022, 293 pêcheries avaient un comité au mandat expiré ; selon l'évaluation de 2023, 67 % des 385 pêcheries enquêtées ne donnent aucune information sur un budget."
    textes:
      - {titre: "Loi sur la pêche (2025), chapitre 8, art. 66 à 69, et art. 29", nature: "loi", annee: 2025, source: "https://data.opendevelopmentcambodia.net/en/dataset/3a85fa81-8a0d-4ce9-a095-a6b99d58ae75/resource/5d8555e6-c44d-4a7f-9628-555c4b88da7d/download/royal_decree_no_028__28.06.2025.pdf"}
      - {titre: "Sous-décret n° 25 sur la gestion des pêcheries communautaires", nature: "reglement", annee: 2007, source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
    sources:
      - {titre: "Sous-décret n° 25 (2007) — Open Development Cambodia", url: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
