  - id: "prud-homies"
    atlas_uid: "prud-homies-peche-mediterranee"
    communaute: "Patrons pêcheurs des 33 prud'homies de Méditerranée"
    etats: ["France"]
    entite: "Circonscriptions des prud'homies, de Port-Vendres à Menton et en Corse"
    mecanisme: "organisation_pecheurs"
    annee: 1859
    concept_local: ""
    resume: >-
      Le décret du 19 novembre 1859, toujours en vigueur pour ses articles 4 à 52, fait élire par les patrons pêcheurs de chaque circonscription des prud'hommes qui règlent entre pêcheurs l'usage de la mer. Fermer : ils fixent les postes, les tours de rôle, l'ordre de calage des filets et les heures de pêche, et attribuent les postes par tirage au sort (art. 17). Sanctionner : ils « connaissent seuls, exclusivement et sans appel » des différends entre pêcheurs de leur ressort, et leurs sentences sont exécutoires, avec saisie possible de la barque et des filets (art. 17 et 25) ; les prud'hommes assermentés constatent aussi les infractions (code rural et de la pêche maritime, art. L. 942-2). Exclure : le droit au tirage des postes n'est pas réservé aux pêcheurs de la circonscription (art. 49). Le Conseil d'État leur reconnaît en 2022 des attributions juridictionnelles et un pouvoir réglementaire.
    gouvernance: "Prud'hommes élus pour trois ans au scrutin secret ; administration des affaires maritimes (présidence de l'assemblée, révocation des prud'hommes, dissolution par le ministre)."
    effectivite: "Élections, tirages au sort et audiences toujours tenus (inventaire du patrimoine culturel immatériel, 2021) ; depuis les réformes de 1992 à 2010, les comités régionaux des pêches gèrent la bande des 12 milles et l'action des prud'homies se limite au niveau local et aux lagunes (Soltanpour et al., 2020)."
    textes:
      - {titre: "Décret du 19 novembre 1859 sur la pêche côtière dans le 5e arrondissement maritime, art. 4 à 52", nature: "decret", annee: 1859, source: "https://dumas.ccsd.cnrs.fr/dumas-03593848/document"}
      - {titre: "Conseil d'État, 18 juillet 2022, n° 459789", nature: "jurisprudence", annee: 2022, source: "https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2022-07-18/459789"}
    sources:
      - {titre: "Pratiques des prud'homies de pêche en Méditerranée — ministère de la Culture (2021)", url: "https://www.culture.gouv.fr/Media/Thematiques/Patrimoine-culturel-immateriel/Files/Fiches-inventaire-du-PCI/pratiques-des-prud-homies-de-peche-en-mediterranee"}
      - {titre: "F. Féral, Grandeurs et misères des prud'homies de pêcheurs de Méditerranée (2022)", url: "https://hal.science/hal-04634773/document"}
      - {titre: "Soltanpour, Peri et Temri, Maritime Studies (2020)", url: "https://hal.science/hal-02491206/document"}

  - id: "raui-cook"
    atlas_uid: "raui-iles-cook"
    communaute: "Chefs coutumiers et communautés de district des Îles Cook"
    etats: ["Îles Cook (Nouvelle-Zélande)"]
    entite: "Ra'ui de Rarotonga et d'Atiu ; 23 sites actifs en 2022"
    mecanisme: "interdit_coutumier"
    annee: 1998
    concept_local: "ra'ui ; tiaki ra'ui"
    resume: >-
      À Rarotonga, le Koutu Nui, assemblée des chefs coutumiers, déclare des ra'ui depuis le 8 février 1998 sans texte législatif. Fermer : la loi sur les ressources marines de 2005 permet aussi aux conseils insulaires de préparer des règlements locaux (by-laws), promulgués en Conseil exécutif, que le ministre ou le Conseil des ministres ne peuvent rejeter que s'ils sont contraires à la loi (art. 8). À Atiu, le règlement sur l'environnement de 2008 place le ra'ui sous le contrôle des chefs coutumiers, qui en fixent les restrictions « conformément à la coutume traditionnelle » (règl. 18). Sanctionner : le gardien (tiaki ra'ui) nommé par les chefs peut saisir prises et matériel et infliger sur place une sanction (utunga) de 100 dollars, ou transmettre le dossier au Service national de l'environnement (règl. 22).
    gouvernance: "Koutu Nui à Rarotonga ; à Atiu, Ui Ariki et Mataiapo (chefs) qui nomment et révoquent les tiaki ra'ui ; conseils insulaires pour les règlements locaux ; consultation du conseil insulaire et des propriétaires fonciers."
    effectivite: "Le sixième rapport à la CDB indique que le ra'ui n'est pas juridiquement contraignant et que des prélèvements ont lieu dans ces aires ; l'enquête de la Communauté du Pacifique (2022) compte 23 sites actifs et 9 inactifs."
    textes:
      - {titre: "Marine Resources Act 2005, art. 8", nature: "loi", annee: 2005, source: "https://www.spc.int/digitallibrary/get/s5b7j"}
      - {titre: "Environment (Atiu and Takutea) Regulations 2008, règl. 18, 21, 22 et 51", nature: "reglement", annee: 2008, source: "https://www.spc.int/digitallibrary/get/s5b7j"}
      - {titre: "Ra'ui déclarés par le Koutu Nui à Rarotonga", nature: "coutume_reconnue", annee: 1998, source: "https://www.mmr.gov.ck/raui-marine-protected-areas/"}
    sources:
      - {titre: "Legal Guide to Enabling and Strengthening Coastal Fisheries Co-Management in the Pacific — CPS et ELI (2023)", url: "https://www.spc.int/digitallibrary/get/s5b7j"}
      - {titre: "Govan et Lalavanua, Status of Community-based Fisheries Management — CPS (2022)", url: "https://www.spc.int/digitallibrary/get/H_uNgzxUo7kB36r"}
      - {titre: "Ra'ui — ministère des Ressources marines des Îles Cook", url: "https://www.mmr.gov.ck/raui-marine-protected-areas/"}
      - {titre: "Sixième rapport national des Îles Cook à la CDB", url: "https://chm.cbd.int/api/v2013/documents/252891"}

  - id: "tagal-sabah"
    atlas_uid: "tagal-sabah"
    communaute: "Comités tagal des villages du Sabah"
    etats: ["Malaisie (Sabah)"]
    entite: "642 tronçons de rivière dans 23 districts (2025)"
    mecanisme: "interdit_coutumier"
    annee: 2003
    concept_local: "tagal ; sogit"
    resume: >-
      Le tagal est une interdiction de pêche décidée par le village et levée à des dates fixées. L'Enactment (loi de l'État du Sabah) de 2003 sur la pêche continentale, en vigueur depuis 2019, permet au ministre de déclarer une zone de gestion communautaire des pêches et au directeur des pêches de nommer un comité de membres du village pour l'administrer (art. 35 et 36). Fermer et exclure : le comité fixe les périodes de fermeture et d'ouverture, interdit le poison, les explosifs et certains engins, et soumet l'entrée des personnes extérieures à sa permission ; le Département des pêches découpe les tronçons en zones rouge, jaune et verte. Sanctionner : le contrevenant paie une amende coutumière (sogit) en argent ou en bétail ; les règlements opposables, pris par le ministre, prévoient une amende jusqu'à 50 000 ringgits (art. 37).
    gouvernance: "Comité tagal nommé par le directeur des pêches parmi les villageois ; protocoles d'accord avec le Département des pêches depuis 2016 ; tribunaux autochtones (native courts) pour le droit coutumier."
    effectivite: "Sites passés d'environ 400 à 642 entre 2020 et 2025 ; une étude de 2024 sur 15 sites touristiques trouve que, pour 87,3 % des 400 ménages interrogés, le revenu tiré du tagal pèse peu."
    textes:
      - {titre: "Sabah Inland Fisheries and Aquaculture Enactment 2003, art. 5, 35 à 37 et 118", nature: "loi", annee: 2003, source: "http://fishdept.sabah.gov.my/wp-content/uploads/2023/01/SabahInlandFisheriesAquacultureEnactment2003.pdf"}
      - {titre: "Native Courts (Native Customary Laws) Rules 1995, règle 58", nature: "coutume_reconnue", annee: 1995, source: "https://sagc.sabah.gov.my/sites/default/files/law/NativeCourts1992%28NativeCustomaryLaws1995%29.pdf"}
    sources:
      - {titre: "The community-based tagal system in Sabah — Local Biodiversity Outlooks", url: "https://localbiodiversityoutlooks.net/the-community-based-tagal-system-in-sabah-malaysia/"}
      - {titre: "Reviving rivers: history and success of Sabah Tagal system — The Borneo Post (2025)", url: "https://www.theborneopost.com/2025/06/01/reviving-rivers-history-and-success-of-sabah-tagal-system/"}
      - {titre: "Sixth National Report of Malaysia to the CBD (2019)", url: "https://www.cbd.int/doc/nr/nr-06/my-nr-06-en.pdf"}
      - {titre: "Journal of Sustainability Science and Management 19 (5), 2024", url: "https://doi.org/10.46754/jssm.2024.05.001"}

  - id: "vanuatu-tabu"
    atlas_uid: "aires-conservation-communautaires-vanuatu"
    communaute: "Propriétaires coutumiers, chefs et conseils de village"
    etats: ["Vanuatu"]
    entite: "9 aires de conservation communautaires enregistrées et environ 250 aires informelles (2019)"
    mecanisme: "interdit_coutumier"
    annee: 2002
    concept_local: "tabu"
    resume: >-
      Les chefs posent des tabu, interdits coutumiers de pêche ou de récolte, sans enregistrement. La loi sur l'environnement de 2002, modifiée en 2010, permet d'enregistrer une terre ou des eaux comme aire de conservation communautaire, avec le consentement de toutes les personnes titulaires de droits et un plan de gestion (art. 35 à 40). Fermer : le plan fixe les règles de gestion de l'aire ; le comité de gestion l'applique et le fait respecter. Sanctionner : le comité veille au règlement des litiges hors tribunal prévu par le plan, et la violation du plan d'une aire enregistrée est une infraction punie jusqu'à cinq ans d'emprisonnement ou 5 millions de vatu (art. 39 et 41). L'enregistrement ne transfère pas la propriété : la terre reste aux propriétaires coutumiers (Constitution, art. 73 et 74) ; la Constitution ne mentionne pas les eaux.
    gouvernance: "Comité de gestion désigné par l'organe de décision coutumier (chef, conseil des chefs, conseil de village) ; directeur du département de l'environnement (enregistrement, radiation)."
    effectivite: "Neuf aires enregistrées en 2019 contre environ 250 aires informelles ; les comités peinent à remettre leurs rapports annuels (sixième rapport à la CDB)."
    textes:
      - {titre: "Environmental Management and Conservation Act n° 12 de 2002, art. 35 à 40", nature: "loi", annee: 2002, source: "https://faolex.fao.org/docs/pdf/van53103.pdf"}
      - {titre: "Environmental Management and Conservation (Amendment) Act n° 28 de 2010", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/van110177.pdf"}
    sources:
      - {titre: "Sixième rapport national du Vanuatu à la CDB (2019)", url: "https://www.cbd.int/doc/nr/nr-06/vu-nr-06-en.pdf"}
      - {titre: "Constitution du Vanuatu — Constitute Project", url: "https://www.constituteproject.org/constitution/Vanuatu_1983"}

  - id: "sasi-moluques"
    atlas_uid: "negeri-adat-maluku"
    communaute: "Negeri coutumières des Moluques"
    etats: ["Indonésie (Moluques)"]
    entite: "Territoires coutumiers (petuanan), dont les zones côtières de Rutong et Hukurila"
    mecanisme: "interdit_coutumier"
    annee: 2005
    concept_local: "sasi ; kewang"
    resume: >-
      Le règlement provincial n° 14 de 2005 rétablit les negeri comme communautés de droit coutumier et cite le sasi, interdiction coutumière temporaire de prélèvement, parmi les institutions qui fondent leur reconnaissance. Le règlement n° 16 de 2019 leur donne la gestion des terres coutumières et le règlement des différends selon le droit coutumier, par délibération et audiences de conciliation. Surveiller : à Ambon, le kewang est l'organe de la negeri chargé de surveiller les ressources naturelles du territoire coutumier (règlement n° 8 de 2017, art. 1 (19)). Un arrêté ministériel de 2019 reconnaît la zone de gestion coutumière côtière de Rutong et de Hukurila. Les sources consultées ne décrivent ni les règles de fermeture d'un sasi marin ni les sanctions appliquées.
    gouvernance: "Chef au titre coutumier (raja) issu d'une lignée ; conseil Saniri Negeri ; kewang ; gouverneur et maire (encadrement, délimitation des territoires par étapes)."
    effectivite: "Aucun chiffre provincial des negeri désignées ; à Ambon, les limites des territoires sont fixées par étapes (règlement n° 9 de 2017)."
    textes:
      - {titre: "Peraturan Daerah Provinsi Maluku n° 14 de 2005 (rétablissement des negeri)", nature: "loi", annee: 2005, source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20NO%2014%20TAHUN%202005%20Tentang%20PENETAPAN%20KEMBALI%20NEGERI.pdf"}
      - {titre: "Peraturan Daerah Kota Ambon n° 8 de 2017 sur les negeri", nature: "loi", annee: 2017, source: "https://peraturan.bpk.go.id/Details/120657/perda-kota-ambon-no-8-tahun-2017"}
    sources:
      - {titre: "Peraturan Daerah Provinsi Maluku n° 16 de 2019 — JDIH Maluku", url: "https://jdih.malukuprov.go.id/peraturan/PERDA%20PENATAAN%20DESA%20ADAT%20EDIT%20HASIL%20FASILITASI%20KEMNDAGRI%20TERAKHIR.pdf"}
      - {titre: "Hukurila — Badan Registrasi Wilayah Adat", url: "https://brwa.id/profil/1876"}
      - {titre: "Negeri Rutong — Badan Registrasi Wilayah Adat", url: "https://brwa.id/profil/2992"}

  - id: "samoa-fono"
    atlas_uid: "aires-peche-villageoises-samoa"
    communaute: "Fono (conseils des chefs) des villages côtiers"
    etats: ["Samoa"]
    entite: "Aires villageoises de gestion des pêches ; 111 sites actifs, 123 villages (2022)"
    mecanisme: "reglement_approuve"
    annee: 2016
    concept_local: ""
    resume: >-
      La loi sur la gestion des pêches de 2016 permet au ministère de déclarer une aire villageoise de gestion des pêches après consultation du fono du village et des villages voisins (art. 19). Fermer : le fono peut adopter des règlements (by-laws) qui interdisent des espèces ou des méthodes, fixent des fermetures périodiques et des tailles minimales ; ils sont examinés par le procureur général, approuvés par le Conseil des ministres et publiés (art. 86). Sanctionner : la violation est punie jusqu'à douze mois d'emprisonnement ; le tribunal peut verser l'amende au fonds du fono, et doit tenir compte, comme circonstance atténuante, de la sanction déjà infligée par le fono au titre de la loi de 1990 sur le fono de village (art. 88).
    gouvernance: "Fono de village et comité villageois de gestion institué par lui ; directeur général du ministère (déclaration de l'aire, suspension ou abrogation des règlements sur avis du fono)."
    effectivite: "111 sites actifs dotés d'un plan villageois, 14 inactifs (Communauté du Pacifique, 2022) ; 78 règlements villageois approuvés selon le sixième rapport à la CDB (2019)."
    textes:
      - {titre: "Fisheries Management Act 2016, art. 19 et 86 à 89", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
    sources:
      - {titre: "Fisheries Management Act 2016 — FAOLEX", url: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
      - {titre: "Govan et Lalavanua, Status of Community-based Fisheries Management — CPS (2022)", url: "https://purl.org/spc/digilib/doc/H_uNgzxUo7kB36r"}
      - {titre: "Sixième rapport national du Samoa à la CDB (2019)", url: "https://www.cbd.int/doc/nr/nr-06/ws-nr-06-en.pdf"}

  - id: "tonga-sma"
    atlas_uid: "zones-gestion-speciale-tonga"
    communaute: "Communautés côtières désignées"
    etats: ["Tonga"]
    entite: "61 zones de gestion spéciale (2024), première à ʻOʻua en 2006"
    mecanisme: "reglement_approuve"
    annee: 2002
    concept_local: ""
    resume: >-
      La loi sur la gestion des pêches de 2002 permet au ministre de déclarer une zone de gestion spéciale et d'en confier la charge à une communauté côtière (art. 13 et 14). Réserver et exclure : seules les personnes inscrites au registre tenu par le comité de gestion peuvent pêcher dans la zone ; le comité retire du registre celles qui ne respectent pas les mesures de gestion jusqu'à ce qu'elles les corrigent (règlement de 2009, règl. 16). Fermer : chaque zone comprend une réserve d'habitat des poissons fermée à toute pêche ; le comité prépare le plan de gestion, approuvé par le directeur général du ministère, et les règlements propres à la zone sont pris par le ministre. Le rivage et les ressources marines restent propriété de la Couronne (Constitution, art. 109).
    gouvernance: "Comité de gestion : président élu par la communauté, agent de la localité, agent du district, représentant du ministère, deux représentants des pêcheurs et deux représentantes des femmes élus, trois membres nommés par le président (règl. 6 et 8) ; décision par consensus, à défaut à la majorité (règl. 11)."
    effectivite: "Effets écologiques variables selon les zones ; trois études seulement ont mesuré l'effet après création (Ford-Learner et al., 2024)."
    textes:
      - {titre: "Fisheries Management Act 2002, art. 13 à 16", nature: "loi", annee: 2002, source: "https://purl.org/spc/digilib/doc/s5b7j"}
      - {titre: "Fisheries (Coastal Communities) Regulations 2009, règl. 5 à 18", nature: "reglement", annee: 2009, source: "https://purl.org/spc/digilib/doc/s5b7j"}
    sources:
      - {titre: "Legal Guide to Enabling and Strengthening Coastal Fisheries Co-Management in the Pacific — CPS et ELI (2023)", url: "https://purl.org/spc/digilib/doc/s5b7j"}
