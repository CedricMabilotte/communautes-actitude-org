      - {titre: "Community fisheries — Open Development Cambodia", url: "https://opendevelopmentcambodia.net/topics/community-fisheries/"}

  - id: "galice-reserves"
    atlas_uid: "reserves-marines-interet-halieutique-galice"
    communaute: "Confréries de pêcheurs de Lira et de Cedeira"
    etats: ["Espagne (Galice)"]
    entite: "Réserves marines d'intérêt halieutique Os Miñarzos (2007) et Ría de Cedeira (2009)"
    mecanisme: "organisation_pecheurs"
    annee: 2007
    concept_local: ""
    resume: >-
      Les deux réserves ont été créées par décret à la demande des pêcheurs de Lira puis de la confrérie de Cedeira ; les confréries (cofradías) sont des corporations professionnelles de droit public. Réserver : la pêche professionnelle y est limitée aux titulaires de permis inscrits à un recensement propre à chaque réserve, sur des embarcations d'une jauge brute de 1,5 GT au plus, sauf dérogations (décret 28/2009, art. 8 et 9). Fermer : les professionnels recensés rédigent la proposition de plan de gestion intégrale, qui peut déroger aux règlements de pêche et entre en vigueur après approbation de la Direction générale de la pêche. Sanctionner : les sources consultées ne décrivent pas de pouvoir de sanction propre aux confréries.
    gouvernance: "Organe de gestion de huit membres : quatre sièges pour le secteur de la pêche, quatre pour l'administration, qui préside et tranche les égalités de voix (décret 28/2009, art. 10)."
    effectivite: "Plans de gestion approuvés depuis 2010 et 2011, organes renouvelés en 2023 et 2026 ; une étude de 2024 décrit Os Miñarzos comme un régime de gouvernance partagée (Ecology and Society)."
    textes:
      - {titre: "Décret 87/2007 créant la réserve Os Miñarzos, modifié par le décret 241/2008", nature: "decret", annee: 2007, source: "https://www.xunta.gal/dog/Publicados/2008/20081029/Anuncio40382_es.html"}
      - {titre: "Décret 28/2009 créant la réserve Ría de Cedeira", nature: "decret", annee: 2009, source: "https://www.xunta.gal/dog/Publicados/2009/20090217/AnuncioA442_es.html"}
    sources:
