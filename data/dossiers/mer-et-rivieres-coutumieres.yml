  - id: "mataitai-taiapure"
    atlas_uid: "mataitai-taiapure-nouvelle-zelande"
    communaute: "Hapū et iwi māori"
    etats: ["Nouvelle-Zélande"]
    entite: "58 réserves mātaitai et 11 taiāpure (octobre 2026)"
    mecanisme: "reglement_approuve"
    annee: 1996
    concept_local: "mātaitai ; tangata kaitiaki"
    resume: >-
      La partie 9 de la loi sur les pêches de 1996 et les règlements de 1998 et 1999 sur la pêche coutumière confient aux tangata whenua (groupe qui détient l'autorité coutumière sur un lieu) la désignation de gardiens (tangata kaitiaki) qui autorisent la pêche coutumière. Réserver : dans une réserve mātaitai, la pêche commerciale cesse en règle générale. Fermer : les gardiens proposent des règlements (bylaws) qui limitent ou interdisent la prise d'espèces pour tous les pêcheurs ; le ministre les approuve après consultation publique. Les fermetures temporaires de 24 mois au plus (ss. 186A et 186B) reconnaissent les pratiques de gestion coutumières. Dans un taiāpure, ouvert à toutes les pêches, le comité ne fait que recommander des règles. Sanctionner : les sources consultées n'attribuent pas de pouvoir de sanction aux gardiens.
    gouvernance: "Gardiens désignés par les tangata whenua et confirmés par avis du ministre publié à la Gazette ; comité de gestion du taiāpure nommé sur proposition de la communauté māori locale ; ministre des Océans et des Pêches."
    effectivite: "Hausse de 2 mātaitai en 2003 à 58 en 2026 ; 17 fermetures temporaires publiées entre 2024 et 2026 (couche cartographique du ministère des Industries primaires)."
    textes:
      - {titre: "Fisheries Act 1996, partie 9, ss. 174 à 186B", nature: "loi", annee: 1996, source: "https://www.legislation.govt.nz/act/public/1996/0088/latest/DLM394192.html"}
      - {titre: "Fisheries (Declaration of Te Mātaitai ō Te Hikutū) Notice 2025, pris en vertu du règl. 23 des Fisheries (Kaimoana Customary Fishing) Regulations 1998", nature: "reglement", annee: 2025, source: "https://gazette.govt.nz/notice/id/2025-go7343"}
    sources:
      - {titre: "Ministère des Industries primaires — Managing customary fisheries", url: "https://www.mpi.govt.nz/fishing-aquaculture/maori-customary-fishing/managing-customary-fisheries"}
      - {titre: "Ministère des Industries primaires — Marine Customary Restrictions", url: "https://geospatial.mpi.govt.nz/portal/rest/services/MARINE/Marine_Customary_Restrictions/FeatureServer"}
      - {titre: "Māori Law Review — T. Love (2018)", url: "https://maorilawreview.co.nz/2018/07/incorporating-maori-approaches-to-ecosystem-management-in-marine-management/"}

  - id: "kenya-bmu"
    atlas_uid: "unites-gestion-plages-kenya"
    communaute: "Unités de gestion des plages (Beach Management Units)"
    etats: ["Kenya"]
    entite: "Aires de cogestion des sites de débarquement ; 14 aires marines gérées localement (tengefu) sur 109,6 km² en 2014"
    mecanisme: "reglement_approuve"
    annee: 2007
    concept_local: ""
    resume: >-
      Le règlement de 2007 fait de l'unité de gestion des plages (BMU) l'organisation des pêcheurs, mareyeurs, propriétaires de bateaux et autres usagers d'une plage. Fermer : le plan de cogestion convenu avec l'agent des pêches et approuvé par le directeur peut fermer des zones ou des saisons, restreindre les engins et limiter les licences (règle 7) ; sur la côte, des communautés ont ainsi créé des zones fermées, les tengefu. Réserver : aucune licence liée à une plage n'est délivrée à une personne qui n'est pas membre de la BMU (règle 11 (7)). Sanctionner : les règlements internes (by-laws) s'imposent aux membres et à toute personne présente sur la plage ; le directeur peut les suspendre, et ils sont réputés approuvés sans réponse sous 21 jours (règles 5 et 23).
    gouvernance: "Assemblée des membres et comité exécutif de 9 à 15 membres élus au scrutin secret ; directeur des Pêches (suspension du comité, comité intérimaire) ; ministre (dissolution)."
    effectivite: "Redevances non perçues et amendes non appliquées à Shimoni, Wasini et Kibuyuni (2013) ; nombre des quelque 60 BMU de la côte n'existent que de nom (Rocliffe et al., 2014)."
    textes:
      - {titre: "Fisheries (Beach Management Unit) Regulations 2007, L.N. 402", nature: "reglement", annee: 2007, source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
      - {titre: "Fisheries Management and Development Act n° 35 de 2016, art. 29 et 37", nature: "loi", annee: 2016, source: "https://new.kenyalaw.org/akn/ke/act/2016/35/eng@2022-12-31"}
    sources:
      - {titre: "Rocliffe et al., Towards a Network of LMMAs in the Western Indian Ocean, PLoS ONE (2014)", url: "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0103000"}
      - {titre: "Mwambao — Shimoni–Wasini–Kibuyuni (2013)", url: "http://www.mwambao.or.tz/wp-content/uploads/2014/08/Main-RB-Fisheries-Report-for-Kenya-30th-July.pdf"}
      - {titre: "Wageningen Marine Research — Mission Report Kenya (2017)", url: "https://edepot.wur.nl/413271"}

  - id: "madagascar-dina"
    atlas_uid: "aires-marines-gerees-localement-madagascar"
    communaute: "Groupements de pêcheurs des aires marines gérées localement"
    etats: ["Madagascar"]
    entite: "Aires de pêche gérées localement ; 150 communautés dans le réseau MIHARI (2017)"
    mecanisme: "reglement_approuve"
    annee: 2015
    concept_local: "dina"
    resume: >-
      Le Code de la pêche de 2015 et l'arrêté du 28 novembre 2017 permettent à un groupement de pêcheurs légalement constitué d'obtenir, pour une zone délimitée, une autorisation de gestion de deux ans renouvelable, avec un cahier des charges. Fermer : le groupement peut demander une réserve de pêche, et gère la zone selon des réglementations communautaires, dont un dina, convention collective locale homologuée par le tribunal. Sanctionner : le dina fixe les sanctions de la communauté ; il ne s'impose qu'après homologation. Réserver : aucun texte consulté ne réserve l'accès de la zone aux seuls membres. Le ministère chargé de la pêche assure le suivi et la supervision du groupement.
    gouvernance: "Groupement de pêcheurs reconnu par le ministère ; assemblée communautaire (validation du plan simple de gestion) ; tribunal (homologation du dina)."
    effectivite: "En 2017, les communautés du réseau MIHARI ont demandé une homologation plus rapide des dina et un droit de pêche exclusif sur la bande littorale ; aucune liste officielle des autorisations n'a été trouvée."
    textes:
      - {titre: "Loi n° 2015-053 portant Code de la pêche et de l'aquaculture, art. 14 et 15", nature: "loi", annee: 2015, source: "https://www.dcn-pac.mg/uploads/loi/5d836f7ded9833bafec7e9f6e7ad5b40.pdf"}
      - {titre: "Arrêté n° 29211/2017 fixant les modalités de transfert de gestion des ressources halieutiques", nature: "reglement", annee: 2017, source: "https://faolex.fao.org/docs/pdf/mad179721.pdf"}
    sources:
      - {titre: "Les communautés de pêcheurs (forum MIHARI, 2017) — Madagascar Tribune", url: "https://madagascar-tribune.com/Les-communautes-de-pecheurs,23207.html"}
      - {titre: "Motion — Officialisation et mise en œuvre des dina (2017) — MIHARI", url: "https://mihari-network.org/wp-content/uploads/2019/07/Motion-1-MIHARI-Officialisation-et-mise-en-%C5%93uvre-des-dina-en-mati%C3%A8re-de-gestion-des-ressources.pdf"}
      - {titre: "Décret n° 2016-1352 — FAOLEX", url: "https://faolex.fao.org/docs/pdf/mad203280.pdf"}

  - id: "mozambique-apgc"
    atlas_uid: "aires-peche-gestion-communautaire-mozambique"
    communaute: "Conseils communautaires de pêche (Conselhos Comunitários de Pesca)"
    etats: ["Mozambique"]
    entite: "107 aires marines à gestion locale recensées, aucune publiée au journal officiel (mai 2024)"
    mecanisme: "reglement_approuve"
    annee: 2020
    concept_local: ""
    resume: >-
      Le règlement de la pêche maritime de 2020 définit l'aire de pêche à gestion communautaire (APGC) comme une aire du domaine public gérée par une ou plusieurs communautés locales sur leur aire d'usage coutumier ; le diplôme ministériel (arrêté du ministre) de 2023 fixe la procédure, qui exige la preuve d'un consensus avec les communautés et se termine par une décision du ministre. Réserver : l'aire n'est pas réservée à la communauté mais à certaines pêches : artisanale, de subsistance, récréative et sportive, de recherche, expérimentale et de formation. Exclure et fermer : les conseils communautaires de pêche participent à la limitation de l'accès, y compris au nombre de pêcheurs et d'engins, et mettent en œuvre le plan de gestion. Sanctionner : la délivrance des licences et le contrôle restent à l'administration.
    gouvernance: "Conseils communautaires de pêche dotés de la personnalité juridique ; représentant de l'État au district (début et fin de leurs activités) ; ministre chargé des pêches (création, modification, extinction de l'aire)."
    effectivite: "Au 31 mai 2024, 61 aires établies au niveau local, 28 en attente d'approbation ministérielle, aucune publiée ; 63,2 % sans plan de gestion (fondation Likhulu, 2024)."
    textes:
      - {titre: "Decreto n.º 89/2020, Regulamento da Pesca Marítima, art. 22 à 24", nature: "reglement", annee: 2020, source: "https://adnap.gov.mz/download/aprovacao-do-regulamento-geral-da-pesca-maritima-repmar"}
      - {titre: "Diploma Ministerial n.º 83/2023 (régime des APGC)", nature: "reglement", annee: 2023, source: "https://sibmoz.gov.mz/content/uploads/2023/09/Diploma-Ministerial-n.o-83_2023-de-6-de-Junho-Estabelece-o-Regime-Juridico-de-APGCs.pdf"}
    sources:
      - {titre: "National assessment of locally-managed marine areas in Mozambique — fondation Likhulu (2024)", url: "https://biblioteca.biofund.org.mz/wp-content/uploads/2024/10/1728570656-1.%20Likhulu%20Report%20Moz%20LMMA%20Assessment%20Moz%20Aug%202024.pdf"}
      - {titre: "Lei n.º 22/2013 — Lei das Pescas, ADNAP", url: "https://adnap.gov.mz/download/lei-n-22-2013-de-1-de-novembro-aprova-a-lei-das-pescas-e-revoga-a-lei-3-90-de-26-de-setembro-2"}

  - id: "laos-vang-sanguan"
    atlas_uid: "zones-conservation-poissons-laos"
    communaute: "Villages riverains et comités de gestion des zones de conservation"
    etats: ["Laos"]
    entite: "1 313 zones de conservation des poissons officielles et 364 non approuvées (2018)"
    mecanisme: "reglement_approuve"
    annee: 2025
    concept_local: "vang sa-nguan"
    resume: >-
      La première zone de conservation des poissons officielle date de 1993, dans le district de Khong. Selon la décision ministérielle de 2025, un ou plusieurs villages demandent la création de la zone, accompagnée du procès-verbal de la réunion villageoise ; le district l'approuve et nomme un comité présidé par le chef de village (art. 7 et 8). Fermer : le comité établit le règlement (engins, saisons, espèces interdites), que le district approuve et promulgue ; la pêche saisonnière n'est possible qu'après trois ans de gestion continue (art. 9 et 17). Sanctionner : le comité de patrouille retient le contrevenant, saisit ses engins et inflige une amende à la deuxième et à la troisième infraction ; le comité de médiation règle les affaires (art. 9 et 10). Le district peut supprimer la zone pour un projet de l'État (art. 12).
    gouvernance: "Comité de gestion présidé par le chef de village, avec comités de médiation et de patrouille ; comité administratif du district (création, règlement, suppression)."
    effectivite: "Selon FISHBIO, le WWF et le Département de l'élevage et de la pêche (2018), une partie des zones recensées n'existe que de nom, faute de budget de surveillance ou après des changements de direction villageoise."
    textes:
      - {titre: "Décision n° 0766 du 22 août 2025 sur la gestion des zones de conservation des poissons", nature: "reglement", annee: 2025, source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
      - {titre: "Loi n° 41/AN du 17 juillet 2023 sur les animaux aquatiques et la pêche", nature: "loi", annee: 2023, source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/41%E0%BA%AA%E0%BA%9E%E0%BA%8A17.7.2023.pdf"}
    sources:
      - {titre: "Status Report on Fish Conservation Zones in Lao PDR (2018) — FISHBIO et DLF", url: "https://data.opendevelopmentmekong.net/dataset/7aa6bb8c-8f2a-4537-92c9-69973023a57e/resource/6e308e77-8bc7-481c-adf9-8482fd8bd1ca/download/fcz-status-report-for-lao-pdr-2018.pdf"}
      - {titre: "Fisheries Law No. 03/NA (2009) — FAOLEX", url: "https://faolex.fao.org/docs/pdf/lao139169.pdf"}

  - id: "namibie-reserves"
    atlas_uid: "reserves-peche-communautaires-namibie"
    communaute: "Conservancies communales des régions du Zambèze et du Kavango"
    etats: ["Namibie"]
    entite: "20 réserves de pêche fluviales déclarées entre 2015 et 2021"
    mecanisme: "reglement_approuve"
    annee: 2003
    concept_local: ""
    resume: >-
      La loi de 2003 sur les ressources halieutiques continentales permet au ministre de déclarer une réserve de pêche à son initiative ou à celle d'une autorité traditionnelle, d'un conseil régional ou municipal (art. 22). Les avis de 2015 à 2020 reconnaissent l'accord de gestion rédigé par la conservancy (zone de gestion communautaire de la faune) avec l'autorité traditionnelle, le ministère et le conseil régional. Fermer et réserver : les règles figurent dans l'annexe de l'avis ministériel ; la communauté fixe la date de la récolte annuelle, réservée aux membres. Exclure : dans la conservancy Joseph Mbambangandu, toute pêche et l'accès des non-résidents (300 dollars namibiens par engin pour deux semaines) passent par l'autorisation du comité de pêche. Sanctionner : les gardes de la conservancy patrouillent ; les autorités traditionnelles et le ministère poursuivent les contrevenants (NACSO).
    gouvernance: "Conservancy, autorité traditionnelle et comité de pêche continentale ; ministre des Pêches (déclaration et modification des réserves)."
    effectivite: "Environ 50 gardes-pêche employés et payés par les conservancies du Zambèze (Conservation Namibia) ; aucune évaluation publiée des effets sur les stocks."
    textes:
      - {titre: "Inland Fisheries Resources Act 2003, art. 22", nature: "loi", annee: 2003, source: "https://www.lac.org.na/laws/annoSTAT/Inland%20Fisheries%20Resources%20Act%201%20of%202003.pdf"}
      - {titre: "Avis n° 65 à 68 de 2020 (huit réserves du Zambèze)", nature: "reglement", annee: 2020, source: "https://gazettes.africa/archive/na/2020/na-government-gazette-dated-2020-03-06-no-7138.pdf"}
      - {titre: "Avis n° 206 de 2021 (conservancy Joseph Mbambangandu)", nature: "reglement", annee: 2021, source: "https://gazettes.africa/archive/na/2021/na-government-gazette-dated-2021-09-22-no-7641.pdf"}
    sources:
      - {titre: "Community Fisheries Reserves — Conservation Namibia", url: "https://conservationnamibia.com/factsheets/community-fisheries-reserves.php"}
      - {titre: "Community Fisheries Reserves — NACSO", url: "https://nacso.org.na/community-fisheries-reserves/"}

  - id: "polynesie-rahui-zpr"
    atlas_uid: "rahui-polynesie-francaise"
    communaute: "Communes et comités de gestion (tōmite rāhui) de Tahiti et des îles"
    etats: ["France (Polynésie française)"]
    entite: "34 zones de pêche réglementée (2023), dont le rāhui de Teahupo'o (760 ha)"
    mecanisme: "proposition_consultation"
    annee: 2017
    concept_local: "rāhui"
    resume: >-
      Le code de l'environnement de la Polynésie française, adopté en 2017, définit le rāhui par des « règles non écrites […] appliquées de manière traditionnelle » (art. LP. 2122-1). Les règles opposables sont toutefois fixées par arrêté du conseil des ministres, à la demande de la commune et après consultation publique. Fermer : à Tautira, l'arrêté de 2018 crée une sous-zone fermée à toute pêche en tout temps et deux sous-zones dont le comité de gestion propose la périodicité d'ouverture (art. 2 à 5). Sanctionner : les infractions sont des contraventions de 5e classe (la catégorie d'amendes la plus élevée hors délits), environ 179 000 F CFP selon la Direction des ressources marines, poursuivies par l'administration. Le comité, qui réunit commune, pêcheurs, résidents et confessions religieuses, propose et suit ; il ne décide pas.
    gouvernance: "Tōmite rāhui (comité de gestion) ; conseil des ministres de la Polynésie française (création, règles) ; Direction des ressources marines."
    effectivite: "À Teahupo'o, le comité fonctionne sans budget propre et la surveillance repose en partie sur des habitants bénévoles ; hausse de la taille et de la biomasse des espèces commerciales (Fabre et al., 2022)."
    textes:
      - {titre: "Loi du pays n° 2017-25 relative au code de l'environnement, art. LP. 2121-4 et LP. 2122-1", nature: "loi", annee: 2017, source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/c037f33d-7ed2-4f27-b9bd-ea538929b7b4/PF_Loi%20du%20Pays%20n%C2%B0%202017-25%20du%205%20octobre%202017%20relative%20au%20code%20de%20l%27environnement%20de%20la%20Polyn%C3%A9sie%20fran%C3%A7aise.pdf"}
      - {titre: "Arrêté n° 1204 CM du 12 juillet 2018 (zone de pêche réglementée de Tautira)", nature: "reglement", annee: 2018, source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/d649f384-fc51-442d-ae60-67c8f3b5ab84/PF_Arr%C3%AAt%C3%A9%20n%C2%B0%201204%20du%2012%20juillet%202018%20r%C3%A9glementant%20la%20p%C3%AAche%20sur%20le%20domaine%20public%20maritime%20au%20droit%20de%20la%20commune%20associ%C3%A9e%20de%20Tautira.pdf"}
    sources:
      - {titre: "Zones de pêche réglementée — Direction des ressources marines", url: "https://www.ressources-marines.gov.pf/cartes-thematiques/zpr/"}
      - {titre: "Fabre, Le Meur, Mawyer et Bambridge, Revue d'anthropologie des connaissances (2022)", url: "https://journals.openedition.org/rac/27989"}

  - id: "hawaii-cbsfa"
    atlas_uid: "zones-peche-subsistance-hawaii"
    communaute: "Communautés de Hā'ena, Miloli'i et Kīpahulu"
    etats: ["États-Unis (Hawaï)"]
    entite: "Trois zones de pêche de subsistance gérées par la communauté"
    mecanisme: "proposition_consultation"
    annee: 1994
    concept_local: ""
    resume: >-
      Une loi de 1994 permet au département des Terres et Ressources naturelles de désigner, par règlement, des zones de pêche de subsistance pour protéger les pratiques de pêche hawaïennes coutumières ; un groupe communautaire peut proposer une zone avec un plan de gestion (§ 188-22.6). Fermer : les règles de Hā'ena (2015) ferment des sous-zones et interdisent la vente des prises ; celles de Miloli'i (2022) interdisent la pêche pour aquarium ; celles de Kīpahulu (2024) ont été proposées par l'association Kīpahulu 'Ohana après dix ans de concertation. Exclure et sanctionner : la communauté n'a pas de pouvoir réglementaire propre ; les règles sont adoptées et appliquées par l'État. À Hā'ena, le département doit consulter les habitants de l'ahupua'a (division territoriale de la montagne à la mer).
    gouvernance: "Groupe communautaire (proposition, suivi) ; département des Terres et Ressources naturelles (adoption des règles, contrôle)."
    effectivite: "Inconnue : aucune évaluation publique de l'application des règles n'a été trouvée."
    textes:
      - {titre: "Hawaii Revised Statutes, § 188-22.6, 188-22.7 et 188-22.9", nature: "loi", annee: 1994, source: "https://data.capitol.hawaii.gov/sessions/session2017/HRS-Chapter-PDF's/HRS_0188.pdf"}
