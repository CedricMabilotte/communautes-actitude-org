slug: "mer-et-rivieres-coutumieres"
titre: "La mer et les rivières sous règle locale"
chapeau: >-
  Sur un récif, un lagon, une plage de débarquement ou un tronçon de rivière, des villages, des clans, des coopératives et des nations autochtones fixent des règles de pêche. Ce dossier compare 29 cas sur cinq continents pour répondre à quatre questions : qui peut fermer une zone, qui peut la réserver à ses membres, qui peut en exclure les autres, qui peut sanctionner ?

introduction: >-
  Les pêcheries dont il est question ici sont côtières ou continentales : récifs et lagons du Pacifique, plages de l'océan Indien et des lacs africains, rivières de Bornéo et du Mékong, lacs d'inondation de l'Amazonie, estrans du Chili, de Corée et du Japon, eaux des traités dans le nord-ouest de l'Amérique du Nord. Dans chaque cas, une loi, un règlement, une constitution ou un jugement donne une place à un groupe local : groupe de parenté, village, association de pêcheurs ou nation autochtone. Le dossier s'appuie sur les fiches de l'atlas et sur les textes qu'elles citent ; il ne traite pas des quotas de pêche industrielle ni des aires marines protégées gérées par l'État seul.


  Le dossier distingue six mécanismes, tirés des cas. Le droit coutumier reconnu par la loi rattache une zone de pêche à un groupe défini par la coutume (Fidji, Îles Salomon, Chuuk, espaces côtiers autochtones du Chili). Le droit ou la juridiction d'une organisation de pêcheurs confie une zone ou la police de la mer à un groupe défini par la résidence ou le métier (Japon, Corée, Chili, Cambodge, Galice, prud'homies de Méditerranée). L'interdit coutumier adossé à la loi part d'une fermeture décidée par des chefs ou un village (ra'ui, tagal, tabu, sasi). Le règlement communautaire approuvé par l'État fait d'une règle de village ou d'une unité de plage un texte opposable à tous. La proposition et la consultation laissent à l'administration l'adoption des règles. Le droit garanti par traité ou par la constitution, enfin, est délimité par les tribunaux.


  Quatre pouvoirs servent de grille de lecture à chaque cas. Fermer : interdire la pêche sur une zone ou pour une période. Réserver : limiter la pêche aux membres du groupe. Exclure : refuser l'entrée ou la pêche à une personne extérieure. Sanctionner : saisir un engin, infliger une amende ou juger un différend. Les chiffres viennent des fiches et datent de 2006 à 2026 selon les cas.

mecanismes:
  - {cle: "droit_coutumier_reconnu", libelle: "Droit coutumier reconnu par la loi", definition: "Une loi ou une constitution reconnaît à un groupe de parenté ou à une communauté autochtone un droit sur une zone de pêche délimitée par la coutume ; une personne extérieure a besoin de la permission du groupe ou d'un permis délivré après consultation."}
  - {cle: "organisation_pecheurs", libelle: "Droit ou juridiction d'une organisation de pêcheurs", definition: "Une coopérative, une fraternité de village, une organisation de pêcheurs artisanaux ou une communauté de patrons pêcheurs, définie par la résidence ou le métier, reçoit un usage exclusif sur une zone ou le pouvoir de régler la pêche entre ses membres ; l'administration accorde le droit, approuve le règlement et peut révoquer."}
  - {cle: "interdit_coutumier", libelle: "Interdit coutumier adossé à la loi", definition: "Des chefs, un conseil de chefs ou un village posent un interdit temporaire de prélèvement sur un récif, un lagon ou une rivière ; un texte le reconnaît, l'enregistre ou lui adjoint un comité, mais l'interdit existe avant le texte et parfois sans lui."}
  - {cle: "reglement_approuve", libelle: "Règlement communautaire approuvé par l'État", definition: "Un conseil de village, une unité de plage, un comité ou des gardiens désignés par la communauté rédigent des règles qui s'imposent aussi aux personnes extérieures après approbation ou publication par l'administration ; celle-ci peut les suspendre ou retirer la zone."}
  - {cle: "proposition_consultation", libelle: "Proposition et consultation", definition: "La communauté demande la création d'une zone, propose des règles ou siège dans un comité ; l'administration adopte seule les règles et les sanctions, et la communauté n'a pas de pouvoir propre d'exclure."}
  - {cle: "droit_garanti_partage", libelle: "Droit garanti par traité ou par la constitution", definition: "Un traité ou la constitution protège le droit de pêche d'une nation autochtone ; les tribunaux fixent sa part de la ressource et les limites de l'intervention de l'État ; la nation désigne ses pêcheurs et réglemente leur pêche."}

concepts:
  - {terme: "qoliqoli", langue: "fidjien", communautes: ["qoliqoli-fidji"], sens: "Zone de pêche coutumière d'un mataqali (clan) ou d'une autre unité sociale iTaukei, inscrite au registre des droits de pêche coutumiers ; 410 en 2020.", source: "https://www.cbd.int/doc/world/fj/fj-nbsap-v2-en.pdf"}
  - {terme: "tabu", langue: "fidjien ; bislama", communautes: ["qoliqoli-fidji", "aires-conservation-communautaires-vanuatu"], sens: "Interdit posé par un chef sur une zone ou une ressource ; à Fidji, 415 aires tabu dans 143 qoliqoli en 2013 ; au Vanuatu, aires de récolte fermées par les chefs, le plus souvent sans enregistrement.", source: "https://www.cbd.int/doc/world/fj/fj-nbsap-v2-en.pdf"}
  - {terme: "rāhui", langue: "tahitien", communautes: ["rahui-polynesie-francaise"], sens: "Espace terrestre ou marin où des règles non écrites, dictées par la gestion des ressources, s'appliquent de manière traditionnelle (code de l'environnement de la Polynésie française, art. LP. 2122-1).", source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/c037f33d-7ed2-4f27-b9bd-ea538929b7b4/PF_Loi%20du%20Pays%20n%C2%B0%202017-25%20du%205%20octobre%202017%20relative%20au%20code%20de%20l%27environnement%20de%20la%20Polyn%C3%A9sie%20fran%C3%A7aise.pdf"}
  - {terme: "ra'ui ; tiaki ra'ui", langue: "maori des Îles Cook", communautes: ["raui-iles-cook"], sens: "Ra'ui : restriction coutumière d'usage des ressources de la terre, du récif et du lagon, déclarée par les chefs ; tiaki ra'ui : gardien communautaire nommé par les chefs.", source: "https://www.mmr.gov.ck/raui-marine-protected-areas/"}
  - {terme: "mātaitai ; tangata kaitiaki", langue: "te reo māori", communautes: ["mataitai-taiapure-nouvelle-zelande"], sens: "Mātaitai : zone de pêche traditionnelle d'un hapū ou d'un iwi ; tangata kaitiaki : gardiens désignés par le groupe qui détient l'autorité coutumière sur le lieu.", source: "https://www.mpi.govt.nz/fishing-aquaculture/maori-customary-fishing/managing-customary-fisheries"}
  - {terme: "tagal ; sogit", langue: "kadazan-dusun", communautes: ["tagal-sabah"], sens: "Tagal : « interdit », fermeture de la pêche sur un tronçon de rivière décidée par le village et levée à date fixe ; sogit : amende coutumière, en argent ou en bétail, infligée au contrevenant.", source: "https://localbiodiversityoutlooks.net/the-community-based-tagal-system-in-sabah-malaysia/"}
  - {terme: "sasi ; kewang", langue: "malais des Moluques", communautes: ["negeri-adat-maluku"], sens: "Sasi : interdiction coutumière temporaire de prélèvement ; kewang : organe de la negeri chargé de surveiller les ressources naturelles du territoire coutumier.", source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20NO%2014%20TAHUN%202005%20Tentang%20PENETAPAN%20KEMBALI%20NEGERI.pdf"}
  - {terme: "eochongye (어촌계)", langue: "coréen", communautes: ["peches-villageoises-coree"], sens: "Fraternité de village de pêcheurs : association des pêcheurs résidents d'un village côtier, seule titulaire, avec la coopérative de district, de la licence de pêche villageoise.", source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
  - {terme: "kyōdō gyogyōken (共同漁業権)", langue: "japonais", communautes: ["droits-peche-communs-japon"], sens: "Droit de pêche commun : droit d'exercer en commun et de façon exclusive une pêche déterminée dans une zone délimitée, accordé à la coopérative de pêche du district.", source: "https://www.jfa.maff.go.jp/j/enoki/gyogyouken_jouhou3.html"}
  - {terme: "dina", langue: "malgache", communautes: ["aires-marines-gerees-localement-madagascar"], sens: "Convention collective locale, homologuée par le tribunal, qui fixe les règles de gestion d'une aire de pêche et les sanctions de leur violation.", source: "https://faolex.fao.org/docs/pdf/mad179721.pdf"}
  - {terme: "vang sa-nguan (ວັງສະຫງວນ)", langue: "lao", communautes: ["zones-conservation-poissons-laos"], sens: "Zone de conservation des poissons : fosse ou portion de rivière fermée à la pêche toute l'année ou une partie de l'année par un ou plusieurs villages.", source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
