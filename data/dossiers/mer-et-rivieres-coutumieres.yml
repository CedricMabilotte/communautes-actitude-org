  - id: "senegal-clpa"
    atlas_uid: "conseils-locaux-peche-artisanale-senegal"
    communaute: "Conseils locaux de pêche artisanale"
    etats: ["Sénégal"]
    entite: "43 conseils locaux (2024), dont la zone de pêche protégée de Fass Boye"
    mecanisme: "proposition_consultation"
    annee: 2015
    concept_local: ""
    resume: >-
      Le Code de la pêche maritime de 2015 engage l'État à la cogestion (art. 6) et prévoit les conseils locaux de pêche artisanale (CLPA) (art. 23), que le ministre crée par arrêté (décret de 2016, art. 5). Fermer : le conseil peut proposer des mesures locales, que le ministre approuve et qu'une autorité administrative prend par arrêté ; la zone de pêche protégée de Fass Boye a été réglementée en 2017 par arrêté du sous-préfet, sur proposition du CLPA. Sanctionner : le conseil règle « en premier ressort » (avant tout recours) les conflits entre pêcheurs, sans pouvoir juridictionnel (arrêté de 2011, art. 12), et participe à la surveillance. Réserver et exclure : il donne un avis sur les permis ; la ressource reste un patrimoine national géré par l'État (art. 3 et 4).
    gouvernance: "Collèges de pêcheurs, mareyeurs, transformatrices, notables, élus et agents de l'État, au moins trois quarts issus des communautés de pêche ; présidence par le représentant de l'État."
    effectivite: "Réunions irrégulières, résolutions peu appliquées ; quelques conseils seulement ont reçu la part des redevances prévue, et des ONG financent la surveillance de certains (CEMLAWS Africa, 2024)."
    textes:
      - {titre: "Loi n° 2015-18 portant Code de la pêche maritime, art. 5, 6 et 23", nature: "loi", annee: 2015, source: "https://faolex.fao.org/docs/pdf/sen155049.pdf"}
      - {titre: "Décret n° 2016-1804, art. 5 à 8", nature: "decret", annee: 2016, source: "https://faolex.fao.org/docs/pdf/sen163863.pdf"}
      - {titre: "Arrêté portant réglementation de la pêche dans la zone de pêche protégée de Fass Boye", nature: "reglement", annee: 2017, source: "https://faolex.fao.org/docs/pdf/sen221111.pdf"}
    sources:
      - {titre: "Local Artisanal Fisheries Councils in Senegal — CEMLAWS Africa (2024)", url: "https://cemlawsafrica.org/wp-content/uploads/2024/08/EN-Local-Artisanal-Fisheries-Councils-CLPAs-in-Senegal.pdf"}
      - {titre: "Arrêté n° 12439 du 15 novembre 2011 — FAOLEX", url: "https://faolex.fao.org/docs/pdf/sen131163.pdf"}

  - id: "amazonie-acordos"
    atlas_uid: "accords-de-peche-amazonie-bresil"
    communaute: "Communautés riveraines (ribeirinhas) des várzeas"
    etats: ["Brésil"]
    entite: "Lacs des plaines inondées ; 35 accords réglementés en Amazonas (1995-2006)"
    mecanisme: "proposition_consultation"
    annee: 2002
    concept_local: ""
    resume: >-
      Les communautés riveraines fixent par consensus des règles de pêche sur les lacs qu'elles utilisent : engins interdits, périodes de fermeture, lacs affectés à la subsistance, à la pêche commerciale ou à la reproduction. L'instruction normative n° 29 de 2002 de l'IBAMA (Institut brésilien de l'environnement) définit l'accord de pêche comme un ensemble de mesures issues d'accords consensuels entre usagers et administration. Fermer : les règles ne s'imposent qu'une fois reprises par un arrêté (portaria) de l'IBAMA. Réserver et exclure : l'instruction exclut les accords qui donnent un privilège à un groupe, et les cours d'eau sont des voies publiques, ce qui empêche de réserver la pêche aux riverains. Sanctionner : le contrôle relève de l'État ; le programme d'agents environnementaux volontaires ouvert aux communautés a pris fin.
    gouvernance: "Assemblées d'usagers des lacs (proposition par consensus) ; IBAMA (arrêté, contrôle)."
    effectivite: "Dans une enquête auprès de 214 pêcheurs d'Amazonas, 72 % jugent la productivité accrue et 71 % décrivent la surveillance et les sanctions comme inexistantes ou inefficaces (Oviedo et al., 2015)."
    textes:
      - {titre: "Instruction normative IBAMA n° 29 du 31 décembre 2002", nature: "reglement", annee: 2002, source: "https://www.ibama.gov.br/sophia/cnia/legislacao/IBAMA/IN0029-311202.PDF"}
    sources:
      - {titre: "Oviedo, Bursztyn et Drummond, Ambiente & Sociedade (2015)", url: "https://www.scielo.br/j/asoc/a/Xcr5CQ43KCYyCnhR4Gkrrxj/?lang=pt"}

  - id: "imraguen-arguin"
    atlas_uid: "imraguen-banc-darguin"
    communaute: "Imraguen des neuf villages du Banc d'Arguin"
    etats: ["Mauritanie"]
    entite: "Parc national du Banc d'Arguin"
    mecanisme: "proposition_consultation"
    annee: 2000
    concept_local: ""
    resume: >-
      La loi de 2000 sur le Parc national du Banc d'Arguin y interdit la pêche, sauf pour les populations résidentes, qui conservent la pêche de subsistance, dont la pêche à pied dite « pêche Imraguen » et la pêche à la lanche à voile (art. 10 et 11). Réserver : le plan d'aménagement 2025-2029 présente les Imraguen comme les seuls autorisés à pêcher dans le parc ; les embarcations motorisées y sont interdites pour la pêche (art. 17). Fermer, exclure et sanctionner : ces pouvoirs appartiennent au parc, établissement public de l'État ; le ministre délivre les autorisations de lanches, dont le nombre est plafonné. Les populations résidentes ont des représentants au conseil d'administration (art. 6).
    gouvernance: "Conseil d'administration du parc ; en 2006, un siège pour les communautés résidentes sur quatorze, la composition fixée en 2015 n'ayant pas été consultée ; direction du parc et ministre chargé des pêches."
    effectivite: "Le plan d'aménagement 2025-2029 constate une érosion de la cogestion depuis plus de dix ans ; un recensement de juin 2023 compte 116 lanches, dont 93 plastifiées, alors que seules les lanches à voile traditionnelles sont autorisées."
    textes:
      - {titre: "Loi n° 2000-024 relative au Parc national du Banc d'Arguin, art. 6, 10, 11 et 17", nature: "loi", annee: 2000, source: "https://faolex.fao.org/docs/pdf/mau20609.pdf"}
      - {titre: "Décret n° 2006-068 portant application de la loi n° 2000-024", nature: "decret", annee: 2006, source: "https://faolex.fao.org/docs/pdf/mau170207.pdf"}
    sources:
      - {titre: "Plan d'aménagement et de gestion du PNBA 2025-2029", url: "https://pnba.mr/wp-content/uploads/2025/12/PAG-PNBA-2025-2029-decembre-2025-VF.pdf"}
      - {titre: "Boulay S., « La tradition imrâgen » (2011) — HAL", url: "https://hal.science/hal-01327593/document"}

  - id: "washington-traites"
    atlas_uid: "cogestion-peche-traites-ouest-washington"
    communaute: "20 nations signataires des traités de 1854-1856"
    etats: ["États-Unis (Washington)"]
    entite: "Saumon, truite steelhead et coquillages des lieux de pêche habituels et accoutumés"
    mecanisme: "droit_garanti_partage"
    annee: 1974
    concept_local: ""
    resume: >-
      Les traités de 1854-1856 réservent aux nations « le droit de prendre le poisson, à tous les lieux et stations habituels et accoutumés […], en commun avec tous les citoyens ». Réserver : la décision du juge Boldt de 1974 fixe leur part à la moitié des poissons récoltables, confirmée par la Cour suprême en 1979, et étendue aux coquillages en 1994, y compris sur des estrans privés, hors bancs artificiels ou cultivés. Fermer et sanctionner : une nation qui dispose d'un gouvernement organisé, d'agents de contrôle formés, d'experts en halieutique et d'un registre des membres réglemente la pêche de ses membres sans réglementation de l'État ; l'État ne peut imposer que les mesures « raisonnables et nécessaires » à la conservation, en prouvant cette nécessité. Exclure : la pêche reste exercée « en commun » avec les autres citoyens.
    gouvernance: "Gouvernements des nations ; Northwest Indian Fisheries Commission (coordination, depuis 1974) ; département de la Pêche et de la Faune de l'État (planification conjointe) ; tribunal fédéral, qui reste saisi."
    effectivite: "Partage et planification conjointe appliqués depuis 1974 ; en 2018, la Cour suprême a laissé en vigueur l'injonction qui oblige l'État à remplacer d'ici 2030 les buses routières qui nuisent le plus au saumon."
    textes:
      - {titre: "Traités de Medicine Creek, Point Elliott, Point No Point, Neah Bay et Quinault River", nature: "traite", annee: 1855, source: "https://wdfw.wa.gov/hunting/management/tribal/history"}
      - {titre: "United States v. Washington, 384 F. Supp. 312 (W.D. Wash. 1974)", nature: "jurisprudence", annee: 1974, source: "https://law.justia.com/cases/federal/district-courts/FSupp/384/312/1370661/"}
      - {titre: "Washington v. Fishing Vessel Association, 443 U.S. 658 (1979)", nature: "jurisprudence", annee: 1979, source: "https://supreme.justia.com/cases/federal/us/443/658/"}
    sources:
      - {titre: "Northwest Indian Fisheries Commission — About Us", url: "https://nwifc.org/about-us/"}
      - {titre: "Northwest Indian Fisheries Commission — Rafeedie Decision", url: "https://nwifc.org/about-us/shellfish/rafeedie-decision/"}
      - {titre: "MRSC — The Culverts Case (2018)", url: "https://mrsc.org/stay-informed/mrsc-insight/june-2018/culverts-case-implications-local-governments"}

  - id: "nuu-chah-nulth"
    atlas_uid: "peches-nuu-chah-nulth"
    communaute: "Nations Ahousaht, Ehattesaht/Chinehkint, Hesquiaht, Mowachaht/Muchalaht et Tla-o-qui-aht"
    etats: ["Canada (Colombie-Britannique)"]
    entite: "Territoires de pêche jusqu'à neuf milles marins au large de l'île de Vancouver"
    mecanisme: "droit_garanti_partage"
    annee: 2009
    concept_local: "T'aaq-wiihak"
    resume: >-
      Les tribunaux de la Colombie-Britannique ont déclaré en 2009, puis confirmé en 2011 et 2013, le droit ancestral (droit fondé sur les pratiques antérieures au contact avec les Européens, protégé par l'article 35 de la Loi constitutionnelle de 1982) des cinq nations de pêcher toutes les espèces sauf la panope et de vendre le poisson. Réserver : seuls les membres des cinq nations participent à cette pêche, sous un permis communautaire de Pêches et Océans Canada ; les nations désignent les pêcheurs et les bateaux. Exclure : le droit n'est pas exclusif. Fermer : Pêches et Océans Canada fixe les parts par espèce dans un plan de gestion annuel ; en 2021, la Cour d'appel a jugé injustifiées plusieurs atteintes au droit, dont l'exclusion des nations d'un couloir entre un et cinq milles de la côte.
    gouvernance: "Ha'wiih (chefs héréditaires) et dirigeants élus des cinq nations ; Pêches et Océans Canada (permis, plan annuel, consultation) ; Accord progressif de réconciliation du 25 septembre 2024."
    effectivite: "En 2024, la pêche des cinq nations a pris 17 267 saumons chinook, contre 47 656 pour la pêche récréative et 24 154 pour la pêche commerciale à la traîne (Ha-Shilth-Sa, 2026) ; les nations contestent les allocations."
    textes:
      - {titre: "Loi constitutionnelle de 1982, art. 35", nature: "constitution", annee: 1982, source: "https://laws-lois.justice.gc.ca/fra/const/page-12.html"}
      - {titre: "Ahousaht Indian Band and Nation v. Canada, 2009 BCSC 1494 ; 2013 BCCA 300 ; 2021 BCCA 155", nature: "jurisprudence", annee: 2009, source: "https://www.woodwardandcompany.com/news/ahousaht-indian-band-and-nation-v-canada-2021-bcca-155-summary/"}
      - {titre: "Règlement sur les permis de pêche communautaires des Autochtones (DORS/93-332)", nature: "reglement", annee: 1993, source: "https://laws-lois.justice.gc.ca/fra/reglements/DORS-93-332/page-1.html"}
    sources:
      - {titre: "Five Nations Multi-species Fishery Management Plan 2023-2024 — Pêches et Océans Canada", url: "https://waves-vagues.dfo-mpo.gc.ca/library-bibliotheque/41096605.pdf"}
      - {titre: "About T'aaq-wiihak — T'aaq-wiihak Fisheries", url: "https://taaqwiihakfisheries.ca/about-taaq-wiihak/"}
      - {titre: "Salmon allocation revision faces scrutiny — Ha-Shilth-Sa (2026)", url: "https://www.hashilthsa.com/news/2026-02-03/canada-must-bring-policy-line-law-salmon-allocation-revision-faces-scrutiny"}

synthese: >-
  Dans la plupart des cas, l'administration accorde, approuve, publie ou révoque le droit ou les règles de la communauté. Les exceptions sont les fermetures décidées sans texte (ra'ui de Rarotonga, tabu non enregistrés du Vanuatu), les droits traditionnels sur les récifs reconnus par la Constitution de Chuuk, et les droits garantis par traité ou par la constitution, dont les tribunaux fixent l'étendue (ouest de Washington, Nuu-chah-nulth). Là où les cas le précisent, la zone reste dans le domaine de l'État ou de la Couronne (Cambodge, Tonga, Mozambique). Fermer une zone est le pouvoir que les cas attribuent le plus souvent à la communauté : dans 25 cas sur 29, un chef, un village, un comité, une coopérative ou une nation peut proposer ou décider une fermeture ; les exceptions sont Chuuk et les Moluques, faute de source, le Banc d'Arguin et les Nuu-chah-nulth. La différence tient à la force de cette fermeture face aux personnes extérieures. Elle s'impose à tous quand un texte de l'État la reprend (Samoa, Tonga, mātaitai, unités de plage du Kenya, Laos, Namibie, Polynésie française, Hawaï) ; elle repose sur la coutume seule quand le texte manque, comme pour les ra'ui de Rarotonga, les tabu non enregistrés du Vanuatu ou les plans des Îles Salomon non publiés. Réserver et exclure suivent deux voies. Dans la première, la loi attache un droit exclusif à un groupe : unités sociales iTaukei à Fidji, titulaires coutumiers aux Îles Salomon, coopératives du Japon, fraternités de Corée, organisations titulaires d'une aire benthique au Chili, pêcheries cambodgiennes dans les zones continentales, communautés tonguiennes, pêcheurs recensés de Galice. Dans la seconde, la zone reste ouverte à tous ceux qui respectent la règle : accords de pêche d'Amazonie, où les rivières sont des voies publiques, espaces côtiers autochtones du Chili, dont l'attributaire ne peut empêcher ni l'accès ni le passage même si le plan désigne les usagers extérieurs admis, aires gérées localement de Madagascar, droits issus des traités exercés « en commun » avec les autres citoyens.


  Sanctionner est délégué dans peu de régimes. Six donnent à la communauté une sanction propre : sentence sans appel des prud'hommes de Méditerranée, sanction sur place de 100 dollars par le gardien d'Atiu, amende coutumière du tagal, amendes du comité de patrouille au Laos, sanction du fono de Samoa dont le tribunal doit tenir compte, autoréglementation des nations des traités de Washington. Ailleurs, la communauté surveille, retient ou signale et l'administration poursuit, ou les sources consultées ne décrivent pas de sanction. Les régimes diffèrent aussi par la définition du groupe : la parenté, la coutume ou l'appartenance à un peuple autochtone (Fidji, Îles Salomon, Chuuk, Vanuatu, Moluques, Nouvelle-Zélande, espaces côtiers autochtones du Chili, ouest de Washington, Nuu-chah-nulth) ; le village ou la résidence (Îles Cook, Sabah, Samoa, Tonga, Cambodge, Laos, Namibie, Polynésie française, Hawaï, Banc d'Arguin) ; la résidence et le métier (Japon, Corée, aires benthiques du Chili, Galice, prud'homies) ; l'usage d'une plage, d'une zone de pêche ou d'un lac (Kenya, Madagascar, Mozambique, Sénégal, Amazonie). Là où les textes fixent une durée, elle va de deux ans renouvelables (Madagascar) et trois ans au plus, renouvelables (Cambodge), à dix ans (Japon, Corée) et à une durée indéfinie (aires benthiques et espaces côtiers autochtones du Chili). Les sources d'application signalent des comités inactifs, sans budget ou qui n'existent que de nom au Kenya, au Sénégal, au Cambodge et au Laos, des sites inactifs aux Îles Cook et au Samoa, des aires sans plan de gestion et aucune aire publiée au Mozambique en 2024, et une attente moyenne de 5,94 ans pour les espaces côtiers autochtones du Chili.

limites:
  - "Le dossier repose sur les fiches de l'atlas et sur les textes qu'elles citent ; aucune recherche nouvelle n'a été faite pour ce dossier. Les sanctions effectivement appliquées ne sont décrites que pour quelques cas (Sabah, prud'homies, Namibie) ; pour Atiu et le Laos, seuls les textes qui les prévoient ont été consultés, et la décision laotienne de 2025, publiée en image, n'a pas pu être relue pour cette vérification."
  - "Fiches de l'atlas sur le même sujet non retenues pour limiter le nombre de cas : Kiribati, Tanzanie, Malawi, Zambie, Gambie, Viêt Nam, Sri Lanka, Costa Rica, Afrique du Sud, Papouasie-Nouvelle-Guinée, Yap et détroit de Torres."
  - "Japon et Corée : les règlements internes des coopératives et des fraternités, et les sanctions qu'ils prévoient, n'ont pas été consultés."
  - "Chuuk et Moluques : aucune source consultée ne décrit les règles de fermeture fixées par les titulaires de droits ou les règles d'un sasi marin."
  - "Les chiffres ne sont pas à la même date : 2006 pour les accords de pêche d'Amazonie, 2013 pour les aires tabu de Fidji, 2014 pour les tengefu du Kenya, 2017 pour les aires benthiques du Chili et le réseau MIHARI de Madagascar, 2018 pour le Laos et la surface des pêcheries cambodgiennes, 2019 pour le Vanuatu, 2021 à 2026 pour les autres."
  - "Hors champ : quotas de pêche industrielle attribués à des communautés (Alaska, Nouvelle-Zélande commerciale), aires marines protégées gérées par l'État seul, traités de pêche des Grands Lacs et du bassin du Columbia, faute de fiche dans l'atlas."

candidats_atlas:
  - "Nations des traités de 1855 du bassin du Columbia (Yakama, Umatilla, Warm Springs, Nez Perce), coordonnées par la Columbia River Inter-Tribal Fish Commission : cogestion de traités comparable à celle de l'ouest de Washington."
  - "Nations ojibwe des traités de 1836 à 1854 des Grands Lacs, coordonnées par la Great Lakes Indian Fish and Wildlife Commission : autoréglementation de la pêche reconnue par les tribunaux fédéraux."
  - "Comités de pêche de shehia de Zanzibar : régime distinct des unités de plage de Tanzanie continentale, mentionné par la fiche tanzanienne, sans fiche propre."
