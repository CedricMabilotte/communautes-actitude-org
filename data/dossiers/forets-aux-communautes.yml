  - {terme: "ejido ; comisariado ejidal", langue: "espagnol (Mexique)", communautes: ["ejidos-comunidades-agrarias-mexique"], sens: "Ejido : terre dotée à un groupe de paysans par la réforme agraire, propriété du groupe ; comisariado : bureau exécutif élu par l'assemblée des ejidatarios.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LAgra.pdf"}
  - {terme: "monte veciñal en man común", langue: "galicien", communautes: ["montes-vecinales-mano-comun-espagne"], sens: "« Mont de voisinage en main commune » : bois, landes et pâturages appartenant sans parts aux voisins qui composent le groupe à chaque moment.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
  - {terme: "Allmend ; Korporationsbürgerrecht", langue: "allemand (Suisse)", communautes: ["corporations-allmend-suisse-centrale"], sens: "Allmend : terres d'usage collectif issues des anciens biens communaux ; Korporationsbürgerrecht : droit de bourgeoisie de la corporation, transmis en principe par filiation, qui donne part à ces biens.", source: "https://www.korporation.ch/rb/140.1.pdf"}
  - {terme: "obște ; composesorat", langue: "roumain", communautes: ["obsti-composesorate-roumanie"], sens: "Communauté de copropriétaires de forêts et de pâturages d'un village (obște de moșneni en Valachie, de răzeși en Moldavie ; composesorat en Transylvanie), détenue en indivision par des ayants droit qui héritent de leurs parts.", source: "https://legeaz.net/legea-1-2000/art-26"}
