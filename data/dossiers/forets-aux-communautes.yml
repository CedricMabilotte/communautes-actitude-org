  - {terme: "cộng đồng dân cư", langue: "vietnamien", communautes: ["forets-communautes-residentielles-viet-nam"], sens: "« Communauté résidentielle » : ensemble des habitants d'un même village, hameau ou quartier qui partagent des coutumes ; la loi de 2017 en fait un propriétaire forestier.", source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
