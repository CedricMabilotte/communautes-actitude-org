  - {terme: "upabhokta samuha", langue: "népali", communautes: ["forets-communautaires-nepal"], sens: "« Groupe d'usagers » : les ménages qui utilisent une forêt et à qui l'administration en remet la gestion ; la loi de 2019 en fait une institution autonome à succession perpétuelle.", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
