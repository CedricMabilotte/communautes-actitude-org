cas:
  # ---------------- Propriété collective reconnue ----------------
  - id: "allmend-uri"
    atlas_uid: "corporations-allmend-suisse-centrale"
    communaute: "Membres des corporations d'allmend d'Uri, de Schwyz, d'Obwald, de Zoug et de Lucerne"
    etats: ["Suisse"]
    entite: "Forêts, alpages et allmends des corporations ; au moins 85 % de la surface du canton d'Uri pour les corporations Uri et Ursern"
    mecanisme: "propriete_collective"
    annee: 1984
    concept_local: "Allmend ; Korporationsbürgerrecht"
    resume: >-
      Le Code civil suisse (art. 59, al. 3) laisse au droit cantonal les « sociétés d'allmends et autres semblables ». La constitution d'Uri de 1984 fait des corporations Uri et Ursern des collectivités autonomes de droit public (personnes morales publiques), qui s'organisent elles-mêmes selon des principes démocratiques et dont le patrimoine est garanti (art. 72, 73 et 118). À Zoug, le bien corporatif doit rester indivisible ; à Lucerne, sa substance ne peut être répartie entre les membres ; à Obwald, la constitution encadre la vente de biens-fonds. La qualité de membre se transmet en principe par filiation. À Uri, les corporations accordent les concessions de carrières et les droits de cristallier sur leurs allmends (art. 57) et disposent du droit d'exproprier (art. 32).
    gouvernance: "Assemblée des membres (Korporationsgemeinde), réunie tous les deux ans à Altdorf, conseil élu (Korporationsrat) et exécutif (Engerer Rat) ; contrôle de légalité du canton (constitution d'Uri, art. 118)."
    effectivite: "Le Dictionnaire historique de la Suisse (2008) décrit un statut de collectivité de droit public avec garantie de propriété et une large autonomie dans la plupart des cantons ; selon leur fédération, le canton de Schwyz comptait 81 corporations en 2025, propriétaires d'environ la moitié de la surface cantonale. La fiche ne décrit pas l'application du droit forestier fédéral aux coupes."
    textes:
      - {titre: "Code civil suisse (RS 210), art. 59, al. 3", nature: "loi", annee: 1907, source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/24/233_245_233/20260701/fr/html/fedlex-data-admin-ch-eli-cc-24-233_245_233-20260701-fr-html-2.html"}
      - {titre: "Constitution du canton d'Uri (RS 131.214), art. 32, 57, 72 à 74 et 118", nature: "constitution", annee: 1984, source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1985/2_621_625_589_fga/20210921/de/html/fedlex-data-admin-ch-eli-cc-1985-2_621_625_589_fga-20210921-de-html-6.html"}
      - {titre: "Loi sur le droit de bourgeoisie de la Korporation Uri (recueil n° 140.1)", nature: "norme communautaire", annee: 2007, source: "https://www.korporation.ch/rb/140.1.pdf"}
    sources:
      - {titre: "Verfassung des Kantons Uri — Fedlex", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1985/2_621_625_589_fga/20210921/de/html/fedlex-data-admin-ch-eli-cc-1985-2_621_625_589_fga-20210921-de-html-6.html"}
      - {titre: "Verfassung des Kantons Zug — Fedlex", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1894/2_278_126_278_fga/20240927/de/html/fedlex-data-admin-ch-eli-cc-1894-2_278_126_278_fga-20240927-de-html-1.html"}
      - {titre: "Dictionnaire historique de la Suisse — Corporations", url: "https://hls-dhs-dss.ch/fr/articles/010262/"}

  - id: "montes-vecinales-galice"
    atlas_uid: "montes-vecinales-mano-comun-espagne"
    communaute: "Communautés de voisins (comuneros) de Galice"
    etats: ["Espagne"]
    entite: "3 312 montes vecinales classés, 664 230 ha (2018)"
    mecanisme: "propriete_collective"
    annee: 1980
    concept_local: "monte veciñal en man común"
    resume: >-
      La loi d'État 55/1980 définit les montes vecinales en mano común comme des terres qui appartiennent à des groupes de voisins « en leur qualité de groupes sociaux et non d'entités administratives » ; ils sont indivisibles, inaliénables, imprescriptibles et insaisissables, c'est-à-dire qu'ils ne peuvent être partagés, vendus, acquis par possession prolongée ni saisis (art. 2). L'administration, la jouissance et la disposition du monte appartiennent « exclusivement » à la communauté (art. 5.1). La loi galicienne 13/1989 précise que cette propriété est « privée et collective » ; la communauté peut répartir des lots entre ses membres pour onze ans au plus et consentir des droits de superficie (droit de bâtir ou planter sur le sol d'autrui) jusqu'à trente ans (art. 7 et 22). Si la communauté n'existe plus ou ne respecte pas les règles d'organisation, le département régional chargé des montes assure une gestion conservatoire au bénéfice de la communauté (art. 20, rédaction de 2021).
    gouvernance: "Assemblée générale de tous les comuneros, « organe suprême », qui élit pour quatre ans au plus une junta rectora (conseil de direction) dont le président représente la communauté (loi 13/1989, art. 14 et 15)."
    effectivite: "Fin 2018, 3 312 montes vecinales étaient classés en Galice pour 664 230 ha (annuaire forestier de la Xunta cité par l'Association forestière de Galice) ; une étude de 2020 (revue Land) indique qu'environ un quart du territoire galicien est en terres communes."
    textes:
      - {titre: "Ley 55/1980 de montes vecinales en mano común, art. 1 à 15", nature: "loi", annee: 1980, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1980-25463"}
      - {titre: "Ley 13/1989 de montes vecinales en mano común (Galice)", nature: "loi", annee: 1989, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
    sources:
      - {titre: "Ley 55/1980 — BOE", url: "https://www.boe.es/buscar/act.php?id=BOE-A-1980-25463"}
      - {titre: "Ley 13/1989 (Galice) — BOE", url: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
      - {titre: "Association forestière de Galice — Os montes vecinais en man común : número e características", url: "https://asociacionforestal.gal/en/os-montes-vecinais-en-man-comun/numero-e-caracteristicas/"}
      - {titre: "Land (MDPI), 2020 — étude sur les terres communes de Galice", url: "https://www.mdpi.com/2073-445X/9/1/9"}

  - id: "baldios-portugal"
    atlas_uid: "baldios-portugal"
    communaute: "Ayants droit (compartes) des baldios"
    etats: ["Portugal"]
    entite: "Baldios du Portugal continental, environ 500 000 ha (estimation 2020)"
    mecanisme: "propriete_collective"
    annee: 2017
    concept_local: "baldio ; compartes"
    resume: >-
      La Constitution portugaise range les « moyens de production communautaires, possédés et gérés par des communautés locales » dans le secteur coopératif et social (art. 82, al. 4, b). La loi 75/2017 fait des compartes les titulaires des baldios, terrains hors commerce juridique qui ne peuvent être appropriés par des tiers, saisis ni hypothéqués (art. 6 et 7). L'assemblée peut vendre des parcelles limitées pour un intérêt local à la majorité des deux tiers, et sortir du régime communautaire à l'unanimité d'une assemblée réunissant au moins deux tiers des compartes (art. 38 et 40). Les recettes ne sont pas distribuées : elles sont réinvesties, dont au moins 20 % en réserve (art. 14). L'assemblée peut déléguer l'administration à la paroisse civile, à la commune ou à l'État et révoquer cette délégation à tout moment (art. 35) ; les baldios administrés en association avec l'État le restent jusqu'au terme convenu ou, à défaut, 50 ans après 1976, sauf décision contraire de l'assemblée (art. 46).
    gouvernance: "Assemblée des compartes, qui élit un conseil directeur de trois à cinq membres et une commission de contrôle (loi 75/2017, art. 17, 24, 28 et 30) ; l'État peut exproprier pour utilité publique (art. 41)."
    effectivite: "Une étude publiée dans Silva Lusitana (2020) indique que 71,6 % des baldios sont cogérés avec l'État, qu'environ 60 % sont gérés par des conseils directeurs, que 664 des 776 plans d'utilisation recueillis par l'Institut de la conservation de la nature et des forêts étaient approuvés en 2018, et que la présence moyenne aux assemblées est de 25 participants."
    textes:
      - {titre: "Lei n.º 75/2017, de 17 de agosto (régime des baldios)", nature: "loi", annee: 2017, source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
      - {titre: "Constituição da República Portuguesa, art. 82, al. 4, b", nature: "constitution", annee: 1976, source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
    sources:
      - {titre: "Lei n.º 75/2017 — Diário da República", url: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
      - {titre: "Lei n.º 75/2017 (version à jour) — PGD Lisboa", url: "https://www.pgdlisboa.pt/leis/lei_mostra_articulado.php?nid=2746&tabela=leis"}
      - {titre: "Silva Lusitana, 2020 — étude sur la gestion des baldios", url: "https://silva-lusitana.edpsciences.org/articles/silu/pdf/2020/02/silu2020282p91.pdf"}

  - id: "obsti-roumanie"
    atlas_uid: "obsti-composesorate-roumanie"
    communaute: "Ayants droit des obști et des composesorate"
    etats: ["Roumanie"]
    entite: "Environ 1 500 communs ; 873 000 ha de forêts, 14 % de la surface forestière du pays (2014)"
    mecanisme: "propriete_collective"
    annee: 2000
    concept_local: "obște ; composesorat"
    resume: >-
      Placées sous propriété d'État de 1948 à 1989, les forêts des obști et des composesorate ont été restituées par la loi n° 1/2000 sous un seul titre de propriété, et le tribunal rend sa personnalité juridique à chaque association (art. 26 à 28). Les membres ne peuvent céder leurs parts à des personnes extérieures et les terres ne peuvent être aliénées ; en cas de dissolution, elles passent dans la propriété publique du conseil local (art. 28). Le Code forestier de 2024 qualifie cette propriété de « garantie, indivisible et inaliénable » (art. 8). L'association récolte le bois selon un plan d'aménagement forestier (amenajament silvic), obligatoire au-delà de 10 ha, et doit conclure un contrat avec un district forestier (ocol silvic) pour la garde et, selon les cas, l'administration de la forêt (art. 23 à 26).
    gouvernance: "Assemblée générale des membres, conseil de cinq membres, président et commission de contrôle (Sorea et al., 2022) ; tout changement des organes est notifié au district forestier (Code forestier de 2024, art. 8)."
    effectivite: "Sur 40 communs du département de Hunedoara interrogés en 2016, 67 % avaient des procès liés à la restitution ; les communs de moins de 100 ha ne peuvent obtenir de plan d'aménagement propre (Vasile, International Journal of the Commons, 2018). Sorea et al. (2022) relèvent le coût des plans et des contrats obligatoires et la dispersion des parts par héritage."
    textes:
      - {titre: "Loi n° 1/2000, art. 26 à 28", nature: "loi", annee: 2000, source: "https://legeaz.net/legea-1-2000/art-28"}
      - {titre: "Loi n° 331/2024 portant Code forestier, art. 8, 23 à 26", nature: "loi", annee: 2024, source: "https://legeaz.net/monitorul-oficial-7-2025/codul-silvic"}
    sources:
      - {titre: "Loi n° 1/2000, art. 26 — legeaz.net", url: "https://legeaz.net/legea-1-2000/art-26"}
      - {titre: "Loi n° 1/2000, art. 28 — legeaz.net", url: "https://legeaz.net/legea-1-2000/art-28"}
      - {titre: "Code forestier de 2024 — legeaz.net", url: "https://legeaz.net/monitorul-oficial-7-2025/codul-silvic"}
      - {titre: "Vasile, International Journal of the Commons, 2018", url: "https://thecommonsjournal.org/articles/10.18352/ijc.805"}

  - id: "regole-ampezzo"
    atlas_uid: "regole-venetie"
    communaute: "Familles ayant droit des Regole de Vénétie, dont les onze Regole d'Ampezzo"
    etats: ["Italie"]
    entite: "51 Regole constituées ; environ 16 000 ha de forêt pour les Regole d'Ampezzo"
    mecanisme: "propriete_collective"
    annee: 1996
    concept_local: "laudo ; fuoco"
    resume: >-
      La loi nationale sur la montagne de 1994 demande aux régions de reconnaître la personnalité juridique de droit privé aux Regole ; la loi régionale de Vénétie 26/1996 fixe la procédure. Le « patrimoine ancien » (biens agro-sylvo-pastoraux, voués à l'agriculture, à la forêt et à l'élevage, détenus au 31 décembre 1952) est inaliénable, indivisible, insusceptible d'usucapion (acquisition par possession prolongée) et annoté comme tel aux registres immobiliers (art. 5 et 6). Les Regole gèrent ces biens selon la coutume et leur statut, dans le cadre des lois forestières de l'État et de la Région ; tout changement de destination, même temporaire, exige l'avis du service forestier et l'autorisation de la Région (art. 7 à 11). La loi nationale 168/2017 reconnaît aux domaines collectifs une capacité de se donner leurs propres règles. Depuis 1990, la Comunanza des Regole d'Ampezzo gère le parc naturel régional des Dolomites d'Ampezzo (11 200 ha).
    gouvernance: "Assemblée de chaque Regola, qui approuve le laudo (statut) et élit les organes de gestion (loi régionale 26/1996, art. 2 et 3) ; le président de la Région organise une gestion de substitution si la Regola cesse de fonctionner (art. 12)."
    effectivite: "La Région recense 51 Regole constituées ; les Regole d'Ampezzo indiquent gérer environ 16 000 ha de forêt selon un plan d'aménagement. Aucune source indépendante évaluant l'application du régime n'a été trouvée (« inconnue » au-delà de ces données)."
    textes:
      - {titre: "Legge regionale del Veneto 19 agosto 1996, n. 26, Riordino delle Regole", nature: "loi", annee: 1996, source: "https://www.consiglioveneto.it/web/crv/dettaglio-legge?numeroDocumento=26&id=1725316&backLink=https%3A%2F%2Fwww.consiglioveneto.it%2Fleggi-regionali%3Fp_p_id&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&pageTitle=&tab=vigente&annoSelezionato=1996"}
