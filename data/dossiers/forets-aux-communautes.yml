  - {terme: "gram sabha", langue: "hindi", communautes: ["droits-forestiers-communautaires-inde", "mendha-lekha"], sens: "Assemblée de tous les adultes d'un village, avec la pleine participation des femmes (loi de 2006, art. 2 (g)) ; elle engage la procédure de reconnaissance des droits forestiers et gère la ressource forestière communautaire.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
