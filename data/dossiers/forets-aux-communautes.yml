  - id: "allmanningsskogar-norrland"
    atlas_uid: "forets-communales-norrland-suede"
    communaute: "Propriétaires des immeubles copropriétaires des forêts communales du Norrland et de Dalécarlie"
    etats: ["Suède"]
    entite: "33 forêts communales (allmänningsskogar et besparingsskogar)"
    mecanisme: "propriete_collective"
    annee: 1952
    concept_local: "besparingsskog ; allmänning"
    resume: >-
      Ces forêts ont été mises en réserve au XIXe siècle lors du remembrement ou du partage des terres entre la Couronne et les paysans. La loi de 1952 les attribue aux propriétaires des immeubles pour lesquels elles ont été constituées ; la part ne peut être cédée qu'avec l'immeuble (§ 2 et 4). La forêt doit être maintenue sans diminution et ne peut être hypothéquée ni saisie ; une vente de terrain exige une décision des copropriétaires et un avantage notable pour eux (§ 5 et 8). Le revenu net peut payer les impôts fonciers des immeubles copropriétaires, soutenir l'agriculture des paroisses ou servir d'autres fins utiles à leur population ; les revenus en capital vont à l'amélioration ou à l'agrandissement de la forêt (§ 18 et 21).
    gouvernance: "Assemblée annuelle des copropriétaires (allmänningsstämma), où chacun vote selon sa part sans dépasser un dixième des parts représentées, et conseil élu (allmänningsstyrelse) ; le conseil d'administration du comté (représentation de l'État) fixe le règlement et peut nommer des membres du conseil (§ 7, 31, 32 et 35)."
    effectivite: "La thèse de Holmgren (Université suédoise des sciences agricoles, 2009) sur les 33 forêts relève une exploitation limitée dans le Västerbotten et le Norrbotten, des disparités entre forêts et une influence directe de l'État sur leur gestion."
    textes:
      - {titre: "Lag (1952:167) om allmänningsskogar i Norrland och Dalarna", nature: "loi", annee: 1952, source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1952167-om-allmanningsskogar-i-norrland-och_sfs-1952-167/"}
    sources:
      - {titre: "Lag (1952:167) — Riksdagen", url: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1952167-om-allmanningsskogar-i-norrland-och_sfs-1952-167/"}
      - {titre: "Holmgren, thèse, Université suédoise des sciences agricoles, 2009", url: "https://pub.epsilon.slu.se/2173/"}
      - {titre: "Svärdsjö Svartnäs Besparingsskog", url: "https://www.svardsjobesparingsskog.se/"}

  - id: "agrargemeinschaften-tyrol"
    atlas_uid: "agrargemeinschaften-autriche"
    communaute: "Membres des communautés agraires du Tyrol"
    etats: ["Autriche"]
    entite: "Forêts, alpages et pâturages de 1 800 à 2 000 communautés agraires (estimation du Land du Tyrol)"
    mecanisme: "propriete_collective"
    annee: 1996
    concept_local: "Agrargemeinschaft ; Gemeindegut"
    resume: >-
      En droit tyrolien, la communauté agraire (Agrargemeinschaft) est une corporation de droit public qui possède ou utilise en commun des forêts, alpages et pâturages « en vertu d'un usage ancien » (TFLG 1996, § 33 et 34). La qualité de membre est attachée à une ferme et n'en est séparée qu'avec l'autorisation de l'autorité agraire, qui autorise aussi toute vente de terrain au-delà de 2 000 m² (§ 38 et 40). Sur le Gemeindegut (biens communaux transférés à une communauté agraire), la Cour constitutionnelle a jugé en 2008 (arrêt « Mieders ») que la valeur de substance, c'est-à-dire les revenus au-delà de l'usage agricole et forestier, revient à la commune. Depuis 2014, un administrateur de substance nommé par le conseil municipal gère ventes, baux et charges sur ces terrains (§ 36a à 36k).
    gouvernance: "Assemblée générale, comité élu pour cinq ans et président (Obmann) élu par le comité (TFLG 1996, § 35) ; l'autorité agraire contrôle la légalité et l'opportunité de la gestion et peut nommer un administrateur à la place des organes (§ 37)."
    effectivite: "La Cour constitutionnelle a tranché en 2008 et en 2010 des recours de communes et de communautés agraires contre l'autorité agraire tyrolienne ; en 2010, elle a validé l'attribution de la valeur de substance du Gemeindegut à la commune."
    textes:
      - {titre: "Tiroler Flurverfassungslandesgesetz 1996 (TFLG 1996), §§ 33 à 40", nature: "loi", annee: 1996, source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
      - {titre: "Cour constitutionnelle, B464/07 (VfSlg 18.446/2008, « Mieders »)", nature: "jurisprudence", annee: 2008, source: "https://www.ris.bka.gv.at/Dokument.wxe?Abfrage=Vfgh&Dokumentnummer=JFR_09919389_07B00464_01"}
    sources:
      - {titre: "TFLG 1996 — RIS", url: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
      - {titre: "Cour constitutionnelle, B639/10 — RIS", url: "https://www.ris.bka.gv.at/Dokument.wxe?Abfrage=Vfgh&Dokumentnummer=JFR_09898790_10B00639_01"}
      - {titre: "Agrargemeinschaften — Land Tirol", url: "https://www.tirol.gv.at/landwirtschaft-forstwirtschaft/agrar/agrarrecht/agrargemeinschaftliche-grundstuecke-und-agrargemeinschaften/agrargemeinschaftliche-grundstuecke-und-agrargemeinschaften/"}

  - id: "sections-de-commune"
    atlas_uid: "sections-de-commune-france"
    communaute: "Membres des sections de commune (habitants domiciliés sur le territoire de la section)"
    etats: ["France"]
    entite: "Bois, pâturages et terres de 26 792 sections recensées en 1999, surtout dans le Massif central"
    mecanisme: "propriete_collective"
    annee: 2013
    concept_local: "section de commune ; commission syndicale"
    resume: >-
      La section de commune est une partie d'une commune qui possède « à titre permanent et exclusif des biens ou des droits distincts de ceux de la commune », souvent issus de titres antérieurs à 1789 (Code général des collectivités territoriales, art. L. 2411-1). Le propriétaire est la section, personne morale de droit public (entité publique dotée de la personnalité juridique) ; ses membres n'ont qu'un droit de jouissance (Conseil constitutionnel, 2011). Ils perçoivent les fruits en nature, « à l'exclusion de tout revenu en espèces », et les terres agricoles ou pastorales vont en priorité aux exploitants de la section (art. L. 2411-10). Le préfet peut transférer les biens à la commune, et la loi du 27 mai 2013 interdit la création de nouvelles sections.
    gouvernance: "Commission syndicale composée du maire et de membres élus par les électeurs de la section, constituée à la demande de la moitié des électeurs ou du conseil municipal, et jamais en dessous de vingt électeurs ou de 2 000 euros de revenu cadastral ; sans commission, le conseil municipal décide (CGCT, art. L. 2411-3 et L. 2411-5)."
    effectivite: "En 2003, seules 200 commissions syndicales étaient connues des services de l'État pour 26 792 sections : dans la plupart des sections, la commune administre les biens (rapport du Sénat, 2012)."
    textes:
      - {titre: "Code général des collectivités territoriales, art. L. 2411-1 à L. 2412-2", nature: "loi", annee: 2013, source: "https://www.collectivites-locales.gouv.fr/connaitre-les-acteurs-et-les-institutions/structures-territoriales/les-communes/le-territoire-communal/ladministration-des-sections-de-communes"}
      - {titre: "Loi n° 2013-428 du 27 mai 2013 modernisant le régime des sections de commune", nature: "loi", annee: 2013, source: "https://www.senat.fr/leg/tas12-143.html"}
      - {titre: "Conseil constitutionnel, décision n° 2011-118 QPC du 8 avril 2011", nature: "jurisprudence", annee: 2011, source: "https://www.conseil-constitutionnel.fr/decision/2011/2011118QPC.htm"}
    sources:
      - {titre: "L'administration des sections de communes — DGCL", url: "https://www.collectivites-locales.gouv.fr/connaitre-les-acteurs-et-les-institutions/structures-territoriales/les-communes/le-territoire-communal/ladministration-des-sections-de-communes"}
      - {titre: "Rapport de Pierre-Yves Collombat, Sénat, 2012", url: "https://www.senat.fr/rap/l12-013/l12-013.html"}

  - id: "ejidos-mexique"
    atlas_uid: "ejidos-comunidades-agrarias-mexique"
    communaute: "Ejidos et communautés agraires"
    etats: ["Mexique"]
    entite: "32 102 noyaux agraires couvrant 50,8 % du territoire (2016)"
    mecanisme: "propriete_collective"
    annee: 1992
    concept_local: "ejido ; comisariado ejidal"
    resume: >-
      L'article 27 de la Constitution et la loi agraire de 1992 reconnaissent aux ejidos et aux communautés agraires la personnalité juridique et la propriété de leurs terres ; les terres d'usage commun sont inaliénables, imprescriptibles et insaisissables, sauf apport à une société (art. 9, 64, 74, 75 et 99). La loi générale de développement forestier durable de 2018 attribue la propriété des ressources forestières aux propriétaires des terrains, dont les ejidos et les communautés (art. 5). L'exploitation du bois exige une autorisation du ministère de l'Environnement, accordée sur la base d'un programme de gestion forestière et valable pour un cycle de coupe (art. 72 et 73). Un tiers qui demande une autorisation forestière sur ces terres doit produire l'accord de l'assemblée du noyau agraire (art. 54).
    gouvernance: "Assemblée de tous les membres, organe suprême, qui élit au scrutin secret un comisariado (bureau exécutif) et un conseil de surveillance, avec parité depuis 2023 (loi agraire, art. 21, 22, 37 et 107) ; l'expropriation pour utilité publique reste possible (art. 93)."
    effectivite: "La Rapporteuse spéciale des Nations unies sur les droits des peuples autochtones (A/HRC/39/17/Add.2, 2018) relève que les autorités ejidales ne coïncident pas toujours avec les autorités des communautés autochtones et que des consultations passent par les seules autorités ejidales."
    textes:
      - {titre: "Constitución Política de los Estados Unidos Mexicanos, art. 27, fr. VII", nature: "constitution", annee: 1992, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
      - {titre: "Ley Agraria", nature: "loi", annee: 1992, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LAgra.pdf"}
      - {titre: "Ley General de Desarrollo Forestal Sustentable, art. 5, 54, 72 et 73", nature: "loi", annee: 2018, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDFS.pdf"}
    sources:
      - {titre: "Ley General de Desarrollo Forestal Sustentable — Chambre des députés", url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDFS.pdf"}
      - {titre: "Ley Agraria — Chambre des députés", url: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LAgra.pdf"}
      - {titre: "A/HRC/39/17/Add.2 — Rapport de la Rapporteuse spéciale sur sa visite au Mexique", url: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.2&l=fr&t=pdf"}

