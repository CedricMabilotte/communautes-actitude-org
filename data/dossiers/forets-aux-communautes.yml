slug: "forets-aux-communautes"
titre: "Les forêts confiées aux communautés"
chapeau: >-
  Forêt communautaire, forêt villageoise, forêt coutumière, concession communautaire, van panchayat, hutan adat, ejido, monte vecinal, Allmend : les noms changent d'un État à l'autre. Ce dossier compare 30 régimes d'Asie, d'Afrique, des Amériques et d'Europe pour répondre à une question : quand une forêt est confiée à une communauté, qui décide de la coupe, de la vente du bois, de l'exclusion des tiers, de la durée du droit et de sa reprise ?

introduction: >-
  Deux situations juridiques se distinguent dans les fiches de l'atlas. Dans la plupart des cas d'Asie, d'Afrique et d'Amérique centrale, la forêt appartient à l'État, qui en confie la gestion à un groupe local par une décision, un accord ou une concession, presque toujours depuis les années 1990. En Europe et au Mexique, la communauté est propriétaire d'une forêt qu'elle tenait souvent avant l'administration forestière moderne, et l'État reconnaît ce titre tout en gardant la police forestière (règles de coupe, plans d'aménagement, autorisations). Entre les deux, quelques régimes reconnaissent un droit sans terme fondé sur la possession coutumière, comme les forêts coutumières d'Indonésie ou les concessions forestières des communautés locales en République démocratique du Congo.


  Le dossier distingue six mécanismes, tirés des textes cités par les fiches. La propriété collective reconnue fait de la communauté la propriétaire inscrite d'une forêt en général inaliénable (qui ne peut être vendue). Le titre sans terme reconnaît ou transfère un droit sans date d'échéance, souvent fondé sur la coutume. La forêt déclarée sur la terre villageoise est créée, par une institution du village ou par le ministre à la demande d'un organe local, sur une terre que le village ou la communauté administre déjà. L'attribution administrative révocable remet une partie de la forêt publique à un groupe d'usagers, que l'administration peut lui retirer. L'accord de gestion d'une forêt publique donne un droit d'usage pour une durée fixée. La concession d'exploitation communautaire donne un droit exclusif d'exploiter le bois à des fins commerciales, seul ou avec une entreprise.


  Pour chaque cas, le dossier relève cinq points : qui approuve la coupe, qui vend et à quelles conditions, qui peut exclure les personnes extérieures, combien de temps dure le droit, et comment l'État peut le reprendre. Les cas sont des fiches agrégées de l'atlas : ils décrivent le régime national ou régional, et seulement quelques forêts ou districts particuliers (Gadchiroli, Mendha-Lekha, Ampezzo, Uri, Kwandu, Beyan Poye, Djoko).

mecanismes:
  - {cle: "propriete_collective", libelle: "Propriété collective reconnue", definition: "La communauté, ou une personne morale qui la représente, est propriétaire inscrite de la forêt ; le bien est en général inaliénable ou indivisible, et l'État garde la police forestière et une tutelle sur les ventes de terrain et les changements d'usage."}
  - {cle: "titre_sans_terme", libelle: "Titre sans terme", definition: "L'État reconnaît ou transfère à la communauté un droit sur la forêt sans date d'échéance (propriété, concession perpétuelle ou droit héréditaire), souvent fondé sur sa possession coutumière ; le droit est incessible, et l'État garde le retrait pour mauvaise gestion, le reclassement ou l'expropriation."}
  - {cle: "foret_terre_villageoise", libelle: "Forêt déclarée sur la terre villageoise", definition: "Une forêt est déclarée sur la terre villageoise ou communale, par une institution du village (Tanzanie) ou par le ministre après une convention avec l'organe qui représente les titulaires de droits sur cette terre (Namibie) ; l'État publie la déclaration, encadre la récolte commerciale et peut reprendre la gestion ou révoquer la déclaration en cas de manquement."}
  - {cle: "attribution_revocable", libelle: "Attribution administrative révocable", definition: "L'administration remet à un groupe d'usagers ou à une communauté une partie de la forêt publique par une décision qu'elle peut retirer ; le droit ne repose ni sur un contrat à terme ni sur une propriété de la communauté."}
  - {cle: "accord_gestion", libelle: "Accord de gestion d'une forêt publique", definition: "Un contrat ou une approbation, conclu pour une durée fixée (au plus 15 ans au Cambodge, 25 ans aux Philippines, 35 ans en Indonésie, jusqu'à 60 ans en Mongolie, une rotation des essences au Honduras), donne à une organisation locale le droit de gérer et d'utiliser une forêt publique selon un plan approuvé ; la vente du bois est limitée ou soumise à un permis distinct."}
  - {cle: "concession_communautaire", libelle: "Concession d'exploitation communautaire", definition: "La communauté reçoit, pour une durée fixée ou liée au cycle de coupe, le droit exclusif d'exploiter le bois à des fins commerciales ou la propriété des produits, seule ou par contrat avec une entreprise ; l'administration approuve le plan et les contrats, et peut résilier."}

