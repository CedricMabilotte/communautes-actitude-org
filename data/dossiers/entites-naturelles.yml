  - {terme: "Mpuluma / Balamansi", langue: "langue des Bagungu", communautes: [], sens: "Sites naturels sacrés des Bagungu et leurs gardiens coutumiers, chargés des rituels et de la protection des sites.", source: "https://gaiafoundation.org/uganda-recognises-rights-of-nature-customary-laws-sacred-natural-sites/"}
