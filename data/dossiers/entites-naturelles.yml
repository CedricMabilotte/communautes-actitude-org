  - id: "dine-loi-naturelle"
    atlas_uid: "navajo-dine"
    communaute: "Nation navajo (Diné)"
    etats: ["États-Unis"]
    entite: "Éléments sacrés de la vie (air, lumière/feu, eau, terre/pollen), six montagnes sacrées, êtres vivants"
    mecanisme: "droit_propre"
    annee: 2002
    concept_local: "Diné bi beenahazʼáanii ; Nahasdzáán dóó Yádiłhił"
    resume: >-
      Par la résolution CN-69-02 du 1er novembre 2002, le conseil de la nation navajo inscrit les lois fondamentales diné dans le code navajo. La section sur la loi naturelle diné (1 N.N.C. § 205) énonce que les quatre éléments sacrés et les six montagnes sacrées doivent être respectés et protégés. Elle déclare que toute la création, de la Terre-Mère et du Ciel-Père aux animaux et aux plantes, « a ses propres lois et a des droits et libertés d'exister ». Les Diné ont le devoir de respecter et protéger ces « parents » ; ils ne possèdent pas la Terre-Mère et le Ciel-Père.
    gouvernance: "Pas de représentant propre aux entités naturelles ; les tribunaux navajos appliquent les lois fondamentales."
    effectivite: "Les annotations du code montrent que la Cour suprême navajo demande aux juges de prendre en compte les lois fondamentales diné (résolution CN-69-02). Aucune décision fondée sur les droits d'une entité naturelle n'a été trouvée."
    textes:
      - {titre: "Code de la nation navajo, titre 1, § 201 à 206 (lois fondamentales diné), dont § 205", nature: "norme communautaire", annee: 2002, source: "https://ecojurisprudence.org/wp-content/uploads/2022/02/US_Navajo-Nation-Code_278.pdf"}
    sources:
      - {titre: "Eco Jurisprudence Monitor — Navajo Nation Code", url: "https://ecojurisprudence.org/initiatives/navajo-nation-code/"}
      - {titre: "Navajo Nation Office of Legislative Services — code navajo", url: "https://www.nnols.org/navajo-nation-code/"}

  - id: "iles-loyaute"
    atlas_uid: "kanak-nouvelle-caledonie"
    communaute: "Kanak des îles Loyauté (aires coutumières de Maré, Lifou et Ouvéa)"
    etats: ["France (Nouvelle-Calédonie)"]
    entite: "Requins et tortues marines, puis autres éléments de la nature à désigner"
    mecanisme: "personnalite_juridique"
    annee: 2023
    concept_local: "Principe unitaire de vie ; espèces totémiques des clans"
    resume: >-
      La province des îles Loyauté, compétente en matière d'environnement, adopte un code de l'environnement rédigé avec les autorités coutumières. L'article 110-3 pose le « principe unitaire de vie », fondateur de la société kanak, et permet de donner une personnalité juridique à des éléments de la nature. Par une délibération du 29 juin 2023, l'assemblée de province reconnaît les requins et les tortues marines comme « entités naturelles sujets de droits » (art. 242-16 et 242-17). Ces entités ont des droits fondamentaux, dont celui de ne pas être la propriété d'un État, d'une province ou d'un individu (art. 242-18), et aucun devoir.
    gouvernance: "Six porte-paroles par entité : trois désignés par le président de la province, un par chacune des trois aires coutumières selon ses usages ; les clans qui portent le nom du requin seraient prioritaires selon le juriste Victor David, interrogé par Wild Legal. D'autres espèces peuvent être ajoutées sur proposition des autorités coutumières."
    effectivite: "inconnue (désignation des porte-paroles et actions en justice non vérifiées)"
    textes:
      - {titre: "Code de l'environnement de la province des îles Loyauté, art. 110-3", nature: "reglement local", annee: 2019, source: "https://www.wildlegal.eu/post/decryptage-reconnaissance-des-droits-de-la-nature-dans-les-iles-loyaute"}
      - {titre: "Délibération de l'assemblée de la province des îles Loyauté du 29 juin 2023 (art. 242-16 à 242-18 du code)", nature: "reglement local", annee: 2023, source: "https://www.wildlegal.eu/post/decryptage-reconnaissance-des-droits-de-la-nature-dans-les-iles-loyaute"}
    sources:
      - {titre: "Wild Legal — Reconnaissance des droits de la nature dans les îles Loyauté", url: "https://www.wildlegal.eu/post/decryptage-reconnaissance-des-droits-de-la-nature-dans-les-iles-loyaute"}
      - {titre: "Eco Jurisprudence Monitor — code de l'environnement des îles Loyauté", url: "https://ecojurisprudence.org/initiatives/loyalty-islands-environmental-code/"}

  - id: "martuwarra"
    atlas_uid: "titre-autochtone-australie"
    communaute: "Nations du Martuwarra (Bunuba, Gooniyandi, Nyikina, Wangkatjunka, Walmajarri et autres)"
    etats: ["Australie"]
    entite: "Fleuve Fitzroy (Martuwarra), 733 km, Kimberley"
    mecanisme: "droit_propre"
    annee: 2016
    concept_local: "Martuwarra ; First Law ; Warloongarriy Law"
    resume: >-
      En novembre 2016, les propriétaires traditionnels du fleuve adoptent la déclaration du fleuve Fitzroy. Elle reconnaît le Martuwarra comme un être ancestral vivant doté d'un droit à la vie, à protéger pour les générations présentes et futures et à gérer conjointement par les propriétaires traditionnels. La déclaration s'appuie sur la First Law (loi première aborigène), dont la Warloongarriy Law (loi du fleuve). Elle demande un plan de gestion du bassin, une aire protégée autochtone et un organe autochtone de gestion du fleuve.
    gouvernance: "Martuwarra Fitzroy River Council, créé en 2018 par les propriétaires traditionnels comme groupe représentatif pour la gestion du fleuve."
    effectivite: "Aucun texte de l'Australie-Occidentale ne reconnaît le statut du fleuve à la date du dossier (non trouvé). En 2018, le conseil demande un moratoire sur les nouvelles allocations d'eau ; suite donnée : inconnue. Le titre autochtone est reconnu le long du fleuve."
    textes:
      - {titre: "Déclaration du fleuve Fitzroy", nature: "norme communautaire", annee: 2016, source: "https://ecojurisprudence.org/wp-content/uploads/2022/07/fitzroy-river-declaration.pdf"}
    sources:
      - {titre: "Eco Jurisprudence Monitor — déclaration du fleuve Fitzroy", url: "https://ecojurisprudence.org/initiatives/fitzroy-river-declaration-recognizing-martuwarra-fitzroy-river-as-a-living-ancestral-being/"}
      - {titre: "Kimberley Land Council — création du Martuwarra Fitzroy River Council (2018)", url: "https://www.klc.org.au/kimberley-traditional-owners-establish-martuwarra-fitzroy-river-council"}

  - id: "niyamgiri"
    atlas_uid: "droits-forestiers-communautaires-inde"
    communaute: "Dongria Kondh et Kutia Kandha"
    etats: ["Inde"]
    entite: "Collines de Niyamgiri, demeure de Niyam Raja (Odisha)"
    mecanisme: "protection_coutumiere_reconnue"
    annee: 2013
    concept_local: "Niyam Raja"
    resume: >-
      Le 18 avril 2013, la Cour suprême examine un projet de mine de bauxite dans les collines de Niyamgiri. Elle juge que le droit des Scheduled Tribes (« tribus répertoriées », catégorie de la Constitution) de vénérer leur divinité Niyam Raja, au sommet des collines, relève de la liberté religieuse de la Constitution (art. 25 et 26) et doit être protégé. Elle confie aux gram sabha (assemblées de village), en vertu de la loi de 2006 sur les droits forestiers, le soin de dire si la mine porte atteinte à ces droits religieux, culturels et communautaires. La colline n'est pas une personne juridique : c'est la relation de la communauté au lieu qui est protégée.
    gouvernance: "Les assemblées de village (gram sabha) des villages concernés ; décision finale du ministère de l'Environnement au vu de leurs résolutions."
    effectivite: "Les douze assemblées de village consultées rejettent le projet ; le ministère refuse l'autorisation en janvier 2014 (fiche de l'atlas, d'après Down To Earth)."
    textes:
      - {titre: "Orissa Mining Corporation c. ministère de l'Environnement et des Forêts, Cour suprême", nature: "jurisprudence", annee: 2013, source: "https://indiankanoon.org/doc/153831190/"}
      - {titre: "Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006", nature: "loi", annee: 2006, source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
    sources:
      - {titre: "Indian Kanoon — arrêt du 18 avril 2013", url: "https://indiankanoon.org/doc/153831190/"}
      - {titre: "Down To Earth — Niyamgiri dix ans après", url: "https://www.downtoearth.org.in/governance/niyamgiri-10-years-since-india-s-first-environmental-referendum-88850"}

  - id: "bois-sacres-inde"
    atlas_uid: ""
    communaute: "Communautés gardiennes des bois sacrés (orans du Rajasthan ; devrai, law kyntang et autres ailleurs en Inde)"
    etats: ["Inde"]
    entite: "Bois sacrés (orans, devrai, law kyntang, kavu, sarna…)"
    mecanisme: "protection_coutumiere_reconnue"
    annee: 2024
    concept_local: "Oran, devbani, devrai, law kyntang"
    resume: >-
      Les bois sacrés sont des forêts protégées par une communauté en raison d'une divinité ou d'un ancêtre ; l'arrêt de la Cour suprême de 2024 cite leurs noms régionaux dans une dizaine d'États. Au Rajasthan, environ 25 000 orans couvrent près de 600 000 ha selon l'arrêt. Le 18 décembre 2024, la Cour ordonne au Rajasthan de recenser et cartographier les orans et de les classer comme « forêts », quelle que soit leur taille. Elle recommande de les déclarer « réserves communautaires » (article 36-C de la loi de 1972 sur la protection de la faune), statut qui exige l'accord de la communauté pour tout changement d'usage. Elle suggère aussi de les reconnaître comme ressources forestières communautaires au titre de la loi de 2006.
    gouvernance: "Selon les lieux : conseils de village, fiducies de temple, clans ; pour une réserve communautaire, un comité de gestion de la communauté avec l'État. Un comité de cinq membres, présidé de préférence par un juge retraité, suit l'exécution de l'arrêt."
    effectivite: "L'arrêt constate que le Rajasthan a commencé à notifier des bois sacrés comme forêts, district par district, avec retard. État d'avancement après 2025 : inconnu."
    textes:
      - {titre: "In Re: T.N. Godavarman Thirumulpad c. Union de l'Inde, Cour suprême, 18 décembre 2024", nature: "jurisprudence", annee: 2024, source: "https://indiankanoon.org/doc/94069814/"}
      - {titre: "Wild Life (Protection) Act, 1972, article 36-C (réserves communautaires)", nature: "loi", annee: 1972, source: "https://indiankanoon.org/doc/94069814/"}
    sources:
      - {titre: "Indian Kanoon — arrêt du 18 décembre 2024 sur les bois sacrés du Rajasthan", url: "https://indiankanoon.org/doc/94069814/"}

  - id: "bishnoi"
    atlas_uid: ""
    communaute: "Bishnoï (Rajasthan)"
    etats: ["Inde"]
    entite: "Arbres khejri, antilopes cervicapres (blackbuck), gazelles chinkara et autres animaux sauvages"
    mecanisme: "coutume_sans_statut"
    annee: 1730
    concept_local: "Les 29 principes de Guru Jambheshwar ; khejri"
    resume: >-
      La communauté bishnoï suit 29 principes énoncés en 1485 par Guru Jambheshwar ; huit portent sur la protection de la biodiversité selon Down To Earth, en particulier des animaux sauvages. En 1730, à Khejarli près de Jodhpur, 363 Bishnoï sont tués en s'opposant à l'abattage des khejri par les hommes du maharaja de Marwar. Ces règles ne sont pas reconnues comme droit applicable : ni les arbres ni les animaux n'ont de statut juridique propre au titre de la coutume bishnoï. Les espèces concernées relèvent du droit général de protection de la faune.
    gouvernance: "Aucun représentant désigné ; la communauté surveille ses terres et ses villages."
    effectivite: "La coutume est appliquée par la communauté. Reconnaissance publique seulement symbolique : en 2013, le ministère de l'Environnement et des Forêts déclare le 11 septembre Journée nationale des martyrs de la forêt (Sahapedia). L'arrêt de la Cour suprême de 2024 cite les Bishnoï à propos des orans du Rajasthan."
    textes:
      - {titre: "Aucun texte juridique ne reconnaît les règles bishnoï ; mention dans l'arrêt de la Cour suprême du 18 décembre 2024 (§ 12)", nature: "jurisprudence", annee: 2024, source: "https://indiankanoon.org/doc/94069814/"}
    sources:
      - {titre: "Down To Earth — les Bishnoï et les principes de Guru Jambheshwar", url: "https://www.downtoearth.org.in/wildlife-biodiversity/the-bishnoi-blackbuck-and-chinkara-what-exactly-were-guru-jambeshwars-principles-regarding-thar-wildlife"}
      - {titre: "Sahapedia — Amrita Devi et le massacre de Khejarli", url: "https://www.sahapedia.org/when-amrita-devi-and-362-bishnois-sacrificed-their-lives-khejri-tree"}

  - id: "bagungu-buliisa"
    atlas_uid: ""
    communaute: "Bagungu (district de Buliisa)"
    etats: ["Ouganda"]
    entite: "Sites naturels sacrés (Mpuluma) : zones humides, rives du lac, forêts"
    mecanisme: "protection_coutumiere_reconnue"
    annee: 2020
    concept_local: "Mpuluma ; Balamansi ; Balamansi Bahandu"
    resume: >-
      Le 23 décembre 2020, le conseil du district de Buliisa adopte à l'unanimité une ordonnance (règlement de district) sur les lois coutumières des Bagungu. Le texte reconnaît ces lois coutumières et fait des sites naturels sacrés des zones fermées à toute personne ou entreprise extérieure. Il reconnaît aux gardiens (Balamansi) le droit d'accéder aux sites et d'y conduire les rituels. Les clans bagungu ont préparé l'ordonnance en documentant leurs lois et leurs cartes éco-culturelles à partir de 2018. Au niveau national, la loi ougandaise sur l'environnement de 2019 (section 4) reconnaît des droits à la nature.
    gouvernance: "Gardiens coutumiers (Balamansi) et gardiens en chef (Balamansi Bahandu) ; organe de gouvernance partagée entre gardiens et agents du district."
    effectivite: "inconnue (application dans ce district où l'on exploite du pétrole non vérifiée)"
    textes:
      - {titre: "The Local Governments (Buliisa District) (Bagungu Customary Laws) Ordinance 2020", nature: "reglement local", annee: 2020, source: "https://ecojurisprudence.org/initiatives/buliisa-district-uganda-ordinance-on-bagungu-customary-law-and-preservation-of-sacred-natural-sites-in-buliisa-district/"}
