  - id: "atrato"
    atlas_uid: "communautes-noires-pacifique-colombie"
    communaute: "Conseils communautaires noirs et communautés autochtones du bassin de l'Atrato (Chocó)"
    etats: ["Colombie"]
    entite: "Fleuve Atrato, son bassin et ses affluents"
    mecanisme: "sujet_de_droits_juge"
    annee: 2016
    concept_local: "Derechos bioculturales (droits bioculturels)"
    resume: >-
      Des conseils communautaires noirs (Cocomopoca, Cocomacia, Asocoba) et le Foro Inter-étnico Solidaridad Chocó saisissent la justice par une acción de tutela (recours en protection des droits fondamentaux) contre l'État, pour les effets de l'exploitation minière illégale. Le 10 novembre 2016, la Cour constitutionnelle reconnaît le fleuve, son bassin et ses affluents comme « entité sujet de droits » à la protection, la conservation, l'entretien et la restauration, à la charge de l'État et des communautés ethniques. Elle fonde sa décision sur les « droits bioculturels », qu'elle définit comme le droit des communautés ethniques d'administrer leurs territoires et leurs ressources de manière autonome. En 2018, la Cour suprême reprend ce raisonnement pour l'Amazonie colombienne (STC4360-2018), à la demande de 25 enfants et jeunes et non d'une communauté ; des associations autochtones y interviennent.
    gouvernance: "Des « gardiens du fleuve » : un membre des communautés demanderesses et un délégué du gouvernement désigné par le président de la République (point 4 du dispositif)."
    effectivite: "Le dispositif fixe un mois pour désigner les gardiens. Le suivi de l'exécution n'a pas été vérifié dans une source ouverte pour ce dossier : inconnue."
    textes:
      - {titre: "Cour constitutionnelle, arrêt T-622 de 2016", nature: "jurisprudence", annee: 2016, source: "https://www.corteconstitucional.gov.co/relatoria/2016/t-622-16.htm"}
      - {titre: "Cour suprême de justice, STC4360-2018 (Amazonie colombienne)", nature: "jurisprudence", annee: 2018, source: "https://ecojurisprudence.org/wp-content/uploads/2022/02/Colombia_Colombian-Amazon_131.pdf"}
    sources:
