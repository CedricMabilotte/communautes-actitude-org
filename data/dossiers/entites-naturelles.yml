  - id: "magpie-mutehekau-shipu"
    atlas_uid: ""
    communaute: "Innus d'Ekuanitshit"
    etats: ["Canada"]
    entite: "Rivière Magpie (Mutehekau Shipu), environ 290 km, bassin de 7 650 km²"
    mecanisme: "droit_propre"
    annee: 2021
    concept_local: "Mutehekau Shipu ; Nitassinan ; Innu Aitun"
    resume: >-
      Le 18 janvier 2021, le Conseil des Innus d'Ekuanitshit adopte une résolution qui reconnaît à la rivière la personnalité juridique et neuf droits, dont celui d'évoluer naturellement et d'être protégée, d'être à l'abri de la pollution et d'ester en justice (agir devant un tribunal). La rivière est située dans le Nitassinan, territoire ancestral des Innus, et menacée par des projets hydroélectriques selon la résolution. La municipalité régionale de comté (MRC) de Minganie adopte une résolution parallèle en février 2021. La résolution innue précise qu'elle ne restreint pas les droits ancestraux ni l'Innu Aitun.
    gouvernance: "Des gardiens désignés à la fois par le Conseil des Innus d'Ekuanitshit et par la MRC de Minganie ; participation des Innus garantie pour toute décision qui touche la rivière."
    effectivite: "Aucune loi du Québec ou du Canada reprenant ce statut n'a été trouvée ; la reconnaissance repose sur deux délibérations locales. Désignation effective des gardiens et actions en justice : inconnue."
    textes:
      - {titre: "Résolution du Conseil des Innus d'Ekuanitshit sur la Mutehekau Shipu / rivière Magpie", nature: "norme communautaire", annee: 2021, source: "https://ecojurisprudence.org/wp-content/uploads/2026/01/CA_Quebec_Second-Resolution-Document_245.pdf"}
      - {titre: "Résolution de la MRC de Minganie reconnaissant la personnalité juridique de la rivière Magpie", nature: "reglement local", annee: 2021, source: "https://ecojurisprudence.org/initiatives/recognition-of-legal-personality-and-rights-of-the-magpie-river/"}
    sources:
      - {titre: "Eco Jurisprudence Monitor — résolution innue", url: "https://ecojurisprudence.org/initiatives/innu-first-nation-resolution-rights-of-the-magpie-river/"}
