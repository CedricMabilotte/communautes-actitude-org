  - id: "gange-yamuna"
    atlas_uid: ""
    communaute: "Aucune communauté partie (recours d'un particulier) ; rivières vénérées dans l'hindouisme"
    etats: ["Inde"]
    entite: "Gange et Yamuna"
    mecanisme: "sujet_de_droits_juge"
    annee: 2017
    concept_local: "Ganga Mata (« Gange mère »)"
    resume: >-
      En mars 2017, dans une affaire d'occupations illégales des rives, la haute cour de l'Uttarakhand déclare le Gange et la Yamuna entités vivantes ayant les droits, devoirs et responsabilités d'une personne. Elle désigne comme gardiens des hauts fonctionnaires de l'État, dont le secrétaire général et l'avocat général de l'Uttarakhand. La même année, dans l'affaire Miglani, la haute cour étend ce statut aux glaciers, lacs, forêts et prairies. Le gouvernement de l'Uttarakhand saisit la Cour suprême, en soutenant que la décision est juridiquement intenable.
    gouvernance: "Gardiens nommés par la haute cour : fonctionnaires de l'État, sans représentant de communauté."
    effectivite: "Sans effet : le 7 juillet 2017, la Cour suprême suspend la décision de la haute cour (la BBC parle d'annulation)."
    textes:
      - {titre: "Mohd. Salim c. État d'Uttarakhand, haute cour de l'Uttarakhand", nature: "jurisprudence", annee: 2017, source: "https://ecojurisprudence.org/initiatives/salim-v-state-of-uttarakhand/"}
      - {titre: "Lalit Miglani c. État d'Uttarakhand, haute cour de l'Uttarakhand", nature: "jurisprudence", annee: 2017, source: "https://ecojurisprudence.org/initiatives/miglani-v-state-of-uttarakhand/"}
    sources:
      - {titre: "Eco Jurisprudence Monitor — Salim c. État d'Uttarakhand", url: "https://ecojurisprudence.org/initiatives/salim-v-state-of-uttarakhand/"}
      - {titre: "BBC — India's Ganges and Yamuna rivers are 'not living entities' (7 juillet 2017)", url: "https://www.bbc.com/news/world-asia-india-40537701"}

  - id: "mar-menor"
    atlas_uid: ""
    communaute: "Aucune communauté autochtone (initiative législative citoyenne)"
    etats: ["Espagne"]
    entite: "Lagune du Mar Menor et son bassin (Murcie)"
    mecanisme: "personnalite_juridique"
    annee: 2022
    concept_local: ""
    resume: >-
      Cas de comparaison, sans communauté autochtone. La loi 19/2022 du 30 septembre 2022 naît d'une initiative législative populaire (proposition de loi portée par des signatures de citoyens). Elle déclare la personnalité juridique de la lagune et de son bassin, reconnus « sujet de droits » (art. 1). Toute personne physique ou morale peut agir en justice au nom de l'écosystème, « véritable partie intéressée », et récupérer ses frais de procès si elle gagne (art. 6). Le 20 novembre 2024, le Tribunal constitutionnel rejette le recours contre la loi et la juge conforme à la Constitution.
    gouvernance: "Tutelle du Mar Menor (art. 3) : comité de représentants de treize membres (trois de l'État, trois de la région, sept citoyens, d'abord les promoteurs de l'initiative), commission de suivi (« gardiens » désignés par les communes riveraines et les secteurs économiques, sociaux et associatifs) et comité scientifique."
    effectivite: "Constitutionnalité confirmée (2024). Des actions au nom de la lagune sont recensées par l'Eco Jurisprudence Monitor ; leur issue n'a pas été vérifiée pour ce dossier."
    textes:
      - {titre: "Ley 19/2022, de 30 de septiembre, para el reconocimiento de personalidad jurídica a la laguna del Mar Menor y su cuenca", nature: "loi", annee: 2022, source: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-16019"}
      - {titre: "Tribunal constitutionnel, arrêt du 20 novembre 2024 sur la loi 19/2022", nature: "jurisprudence", annee: 2024, source: "https://ecojurisprudence.org/initiatives/spain-constitutional-court-ruling-on-the-mar-menor-act-of-2022/"}
    sources:
      - {titre: "BOE — Ley 19/2022 (texte consolidé)", url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-16019"}
      - {titre: "Eco Jurisprudence Monitor — arrêt du Tribunal constitutionnel", url: "https://ecojurisprudence.org/initiatives/spain-constitutional-court-ruling-on-the-mar-menor-act-of-2022/"}
synthese: >-
  Dans les cas néo-zélandais, la personnalité juridique vient d'un accord de règlement entre la Couronne et un iwi. L'entité reçoit la propriété de ses terres et un organe paritaire, ou à majorité māori, parle en son nom ; le texte reprend les notions de la communauté dans sa langue. En Équateur et en Bolivie, les droits visent la nature en général et empruntent des termes kichwa, aymara ou guarani, mais personne n'est désigné pour les défendre : ce sont les juges qui leur donnent effet, comme dans l'affaire Los Cedros. En Colombie et en Inde, le juge a créé le statut sans loi ; la décision colombienne associe les communautés comme gardiennes, la décision indienne sur le Gange a été suspendue.


  Une autre série de cas vient des communautés elles-mêmes : constitution tribale ho-chunk, code navajo, lois yurok et ojibwe, résolution innue, déclarations de Sarayaku et du Martuwarra. Ces textes s'appliquent sur le territoire de la communauté ; hors de ce territoire, leur force dépend de l'État, comme le montre le rejet de l'affaire manoomin pour incompétence du tribunal tribal. Enfin, les bois sacrés, les sites des Bagungu et Niyamgiri relèvent d'une protection coutumière que l'État reconnaît sans faire du lieu une personne. La coutume bishnoï, elle, n'a aucune traduction juridique. Le Mar Menor montre qu'un même mécanisme peut naître hors de toute communauté autochtone.
limites:
  - "Le dossier ne couvre pas les forêts sacrées kaya des Mijikenda (Kenya) : la source officielle (UNESCO) n'était pas accessible."
  - "L'arrêté interministériel béninois n° 0121 de 2012 sur la gestion des forêts sacrées, qui confie leur gestion aux communautés, n'a pas été traité en cas séparé faute de communauté précise."
  - "Suivi de l'arrêt Atrato (désignation et fonctionnement des gardiens du fleuve) : aucune source ouverte fiable consultée."
  - "Pour les normes tribales (Yurok, Ho-Chunk, Navajo) et la résolution innue, aucune décision de justice les appliquant n'a été trouvée ; leur effet réel reste inconnu."
  - "Plusieurs cas reposent sur l'Eco Jurisprudence Monitor (université de l'Oregon) comme source secondaire ; les textes primaires ont été ouverts quand ils étaient en ligne."
  - "Autres cas repérés et non traités : loi propre de la communauté A'i Cofán de Sinangoe (Équateur, 2017) et arrêt de la Cour constitutionnelle du 4 février 2022 sur le consentement, Piatúa (communautés kichwa, Équateur, 2019), droits de la rivière Rice Lake (Première Nation d'Alderville), harengs (Mashpee Wampanoag), système hydrographique Long Man (Cherokee de l'Est), caribou de Finlayson (Premières Nations du Yukon), fleuve Saint-Laurent."
candidats_atlas:
  - "Innus d'Ekuanitshit (Québec) : Première Nation sous la Loi sur les Indiens, avec conseil élu ; auteur de la résolution sur la Mutehekau Shipu. Une fiche « Innus (Nitassinan) » couvrirait aussi les ententes de Pessamit et de l'Approche commune."
  - "A'i Cofán de Sinangoe (Équateur) : communauté qui a adopté en 2017 sa propre loi territoriale (le territoire « vivant et sacré ») et obtenu en 2022 un arrêt de la Cour constitutionnelle sur le consentement ; aucune fiche équatorienne hors Sarayaku. Sources : https://ecojurisprudence.org/initiatives/ecuador-ai-cofan-of-sinangoe-indigenous-law/ et https://amazonfrontlines.org/chronicles/the-sinangoe-precedent-an-instrument-of-protection/"
