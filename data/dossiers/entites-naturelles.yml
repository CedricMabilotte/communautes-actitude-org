  - id: "klamath-yurok"
    atlas_uid: "nations-tribales-etats-unis"
    communaute: "Nation yurok (Yurok Tribe)"
    etats: ["États-Unis"]
    entite: "Fleuve Klamath (Heyhl-keek 'We-roy), son écosystème et ses espèces"
    mecanisme: "droit_propre"
    annee: 2019
    concept_local: "Heyhl-keek 'We-roy"
    resume: >-
      Le 9 mai 2019, le conseil yurok (Yurok Tribal Council) adopte la résolution 19-40 qui déclare que le Klamath possède des droits inhérents « d'exister, de prospérer et d'évoluer naturellement ». La résolution cite le préambule de la constitution yurok de 1993 sur le fleuve, le saumon et la gestion du territoire. Le 7 novembre 2024, la nation yurok inscrit ces droits dans son code tribal par une ordonnance (règlement tribal) : droit d'exister, droit à être restauré des dommages causés par l'homme, droits comme paysage culturel. L'ordonnance vise toute personne ou autorité dont les activités portent atteinte au fleuve, y compris hors de la réserve.
    gouvernance: "La nation yurok représente le fleuve ; l'ordonnance de 2024 lui reconnaît le « Right to Be Represented by the Yurok Tribe » (droit d'être représenté par la nation yurok)."
    effectivite: "inconnue ; aucune action en justice fondée sur l'ordonnance n'a été trouvée. La portée hors de la réserve dépend de la reconnaissance par les tribunaux des États-Unis, non vérifiée."
    textes:
      - {titre: "Yurok Tribal Council, résolution 19-40 établissant les droits du fleuve Klamath", nature: "norme communautaire", annee: 2019, source: "https://ecojurisprudence.org/wp-content/uploads/2022/02/US_Klamath_Resolution-Establishing-Rights-of-the-Klamath-River_168.pdf"}
      - {titre: "Ordonnance yurok établissant les droits de Heyhl-keek 'We-roy (code tribal, chapitre 21.60)", nature: "norme communautaire", annee: 2024, source: "https://ecojurisprudence.org/initiatives/yurok-tribe-ordinance-establishing-the-rights-of-the-heyhl-keek-we-roy-klamath-river/"}
    sources:
      - {titre: "Eco Jurisprudence Monitor — résolution de 2019", url: "https://ecojurisprudence.org/initiatives/resolution-establishing-rights-of-the-klamath-river/"}
      - {titre: "Eco Jurisprudence Monitor — ordonnance de 2024", url: "https://ecojurisprudence.org/initiatives/yurok-tribe-ordinance-establishing-the-rights-of-the-heyhl-keek-we-roy-klamath-river/"}

  - id: "ho-chunk"
    atlas_uid: "nations-tribales-etats-unis"
    communaute: "Nation ho-chunk"
    etats: ["États-Unis"]
    entite: "Écosystèmes, communautés naturelles et espèces du territoire ho-chunk (Wisconsin)"
    mecanisme: "droit_propre"
    annee: 2018
    concept_local: "Mother Earth (Terre-Mère), « dont nous sommes issus et dont nous dépendons »"
    resume: >-
      Le Conseil général (assemblée des membres) de la nation ho-chunk ajoute à sa constitution un article X, section 2, sur les droits de la nature ; l'amendement est adopté en 2018 selon l'Eco Jurisprudence Monitor. Le texte reconnaît aux écosystèmes, communautés naturelles et espèces du territoire le droit d'exister, de prospérer, de se régénérer et d'évoluer, et le droit à un climat sain. Il interdit sur le territoire l'extraction de combustibles fossiles, l'extraction de sable de fracturation, les organismes génétiquement modifiés et la destruction des plantes à usage médicinal traditionnel.
    gouvernance: "Les écosystèmes peuvent agir devant un tribunal en leur propre nom, comme « partie réelle au procès » ; la nation ho-chunk et chacun de ses membres peuvent aussi agir. Les dommages-intérêts sont versés à la nation pour la restauration."
    effectivite: "inconnue ; aucune décision du tribunal ho-chunk appliquant l'article X, section 2, n'a été trouvée."
    textes:
      - {titre: "Constitution de la nation ho-chunk, article X, section 2 (droits de la nature)", nature: "norme communautaire", annee: 2018, source: "https://ecojurisprudence.org/wp-content/uploads/2022/02/US_Ho-Chunk_Ho-Chunk-Nation-Resolution-Rights-of-Nature_157.pdf"}
    sources:
      - {titre: "Eco Jurisprudence Monitor — amendement ho-chunk", url: "https://ecojurisprudence.org/initiatives/ho-chunk-nation-resolution-rights-of-nature/"}

  - id: "manoomin"
    atlas_uid: "nations-tribales-etats-unis"
    communaute: "Bande ojibwe de White Earth et 1855 Treaty Authority"
    etats: ["États-Unis"]
    entite: "Manoomin (riz sauvage) et ses habitats d'eau douce"
    mecanisme: "droit_propre"
    annee: 2018
    concept_local: "Manoomin"
    resume: >-
      En décembre 2018, la bande de White Earth et l'autorité intertribale du traité de 1855 adoptent une loi tribale sur les droits de manoomin, dans la réserve et dans les territoires cédés par traité. Le texte reconnaît au riz sauvage des droits inhérents à exister, prospérer, se régénérer et évoluer, à une eau propre et à un habitat d'eau douce, à ne pas être breveté et à ne pas être contaminé par des organismes génétiquement modifiés. Le riz sauvage est une nourriture sacrée et une espèce clé des milieux humides du nord du Minnesota.
    gouvernance: "La bande de White Earth et ses membres agissent au nom de manoomin devant le tribunal tribal."
    effectivite: "En août 2021, une action au nom de manoomin contre le département des Ressources naturelles du Minnesota (prélèvement d'eau pour l'oléoduc Line 3) est déposée devant le tribunal tribal de White Earth. Le 10 mars 2022, la cour d'appel tribale juge que le tribunal n'est pas compétent et l'action est rejetée."
    textes:
      - {titre: "Résolution et ordonnance sur les droits de manoomin (White Earth)", nature: "norme communautaire", annee: 2018, source: "https://ecojurisprudence.org/initiatives/resolution-establishing-rights-of-manoomin/"}
      - {titre: "Cour d'appel tribale de White Earth, Manoomin et al. c. Minnesota DNR", nature: "jurisprudence", annee: 2022, source: "https://ecojurisprudence.org/initiatives/tribal-court-of-the-white-earth-band-of-ojibwe-case-manoomin-et-al-v-minnesota-dnr/"}
    sources:
