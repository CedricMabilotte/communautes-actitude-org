  - {terme: "Pacha Mama", langue: "kichwa", communautes: ["sarayaku-kichwa"], sens: "La Terre-Mère ; la Constitution de l'Équateur l'emploie comme synonyme de « nature » à l'article 71.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
