slug: "entites-naturelles"
titre: "Rivières, forêts, montagnes : quand une entité naturelle devient sujet de droit"
chapeau: >-
  Des rivières, des montagnes, des forêts, une plante ou des espèces animales ont reçu des droits propres, parfois une personnalité juridique. Ce dossier recense vingt cas liés à des communautés autochtones, noires ou coutumières, et précise pour chacun le texte, la personne qui parle au nom de l'entité et ce qui s'applique.
introduction: >-
  Dans de nombreuses communautés, une rivière, une montagne ou une forêt est un parent, un ancêtre ou un être vivant, et non une ressource. Depuis 2008, plusieurs États ont traduit une partie de ces conceptions dans leur droit. D'autres fois, la communauté l'a écrit elle-même, dans sa constitution tribale, un code ou une déclaration d'assemblée.


  Le dossier distingue six mécanismes : la personnalité juridique (capacité d'avoir des droits et d'agir en justice) donnée par une loi ; les droits de la nature inscrits dans une constitution ou une loi nationale ; la reconnaissance d'une entité comme sujet de droits par un juge ; la norme adoptée par la communauté elle-même dans son droit propre ; la protection coutumière reconnue par l'État (bois sacrés, sites sacrés) ; la coutume appliquée sans statut juridique. Plusieurs cas combinent deux mécanismes.


  Pour chaque cas, le dossier indique qui agit au nom de l'entité et ce que l'on sait de l'application. Deux cas sans lien avec une communauté autochtone (Gange et Yamuna, Mar Menor) servent de point de comparaison.
mecanismes:
  - {cle: "personnalite_juridique", libelle: "Personnalité juridique par la loi", definition: "Une loi ou un règlement fait d'une entité naturelle une personne au sens du droit, avec des représentants désignés qui agissent en son nom."}
  - {cle: "droits_nature_texte_national", libelle: "Droits de la nature dans la constitution ou la loi", definition: "Un texte national reconnaît des droits à la nature en général ; toute personne ou toute autorité peut en demander le respect."}
  - {cle: "sujet_de_droits_juge", libelle: "Sujet de droits par décision de justice", definition: "Un tribunal déclare une entité naturelle sujet de droits et désigne ses gardiens, sans loi préalable qui le prévoit."}
  - {cle: "droit_propre", libelle: "Norme adoptée par la communauté", definition: "La communauté reconnaît des droits à une entité dans son propre droit (constitution tribale, code, délibération d'assemblée, déclaration) ; la portée hors de son territoire dépend de l'État."}
  - {cle: "protection_coutumiere_reconnue", libelle: "Protection coutumière reconnue par l'État", definition: "Un texte ou un juge de l'État reconnaît les règles coutumières qui protègent un site ou une espèce et le rôle de ses gardiens, sans créer de personnalité juridique."}
  - {cle: "coutume_sans_statut", libelle: "Coutume sans statut juridique", definition: "La communauté protège des arbres, des animaux ou des lieux selon ses règles ; aucun texte de l'État ne donne force juridique à ces règles."}
concepts:
