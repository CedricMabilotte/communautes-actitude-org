cas:
  - id: "whanganui"
    atlas_uid: "maori-aotearoa"
    communaute: "Iwi de la Whanganui"
    etats: ["Nouvelle-Zélande"]
    entite: "Rivière Whanganui (Te Awa Tupua)"
    mecanisme: "personnalite_juridique"
    annee: 2017
    concept_local: "Te Awa Tupua ; Tupua te Kawa"
    resume: >-
      La loi de 2017 règle les réclamations des iwi (peuples māori) de la Whanganui au titre du traité de Waitangi. Elle déclare Te Awa Tupua « tout vivant et indivisible », des montagnes à la mer (s. 12), et en fait une personne juridique qui a les droits, pouvoirs, devoirs et responsabilités d'une personne (s. 14). Quatre valeurs, Tupua te Kawa, guident les décisions qui touchent la rivière (s. 13). Un groupe stratégique réunit iwi, collectivités, usagers et associations pour établir un plan commun (Te Heke Ngahuru, s. 35).
    gouvernance: "Te Pou Tupua, « visage humain » de la rivière : deux personnes, l'une désignée par les iwi ayant des intérêts dans la rivière, l'autre par la Couronne (s. 18 à 20) ; appuyées par un groupe consultatif, Te Karewao (s. 27)."
    effectivite: "L'office de Te Pou Tupua fonctionne : il indique ses titulaires actuels (un désigné par les iwi, un par la Couronne), une petite équipe et ses relations avec l'entité de gouvernance des iwi et le groupe stratégique Te Kōpuka. Aucun procès intenté au nom de la rivière n'a été trouvé."
    textes:
      - {titre: "Te Awa Tupua (Whanganui River Claims Settlement) Act 2017", nature: "loi", annee: 2017, source: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
      - {titre: "Ruruku Whakatupua, accord de règlement entre les iwi de la Whanganui et la Couronne", nature: "accord", annee: 2014, source: "https://www.tepoutupua.nz"}
    sources:
      - {titre: "Te Awa Tupua Act 2017 — legislation.govt.nz", url: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
      - {titre: "Te Pou Tupua — présentation de l'office", url: "https://www.tepoutupua.nz/tepoutupua"}

  - id: "te-urewera"
    atlas_uid: "tuhoe-te-urewera"
    communaute: "Tūhoe"
    etats: ["Nouvelle-Zélande"]
    entite: "Te Urewera (ancien parc national, environ 2 100 km²)"
    mecanisme: "personnalite_juridique"
    annee: 2014
    concept_local: "Te Manawa o te Ika a Māui ; Tūhoetanga"
    resume: >-
      La loi de 2014 retire Te Urewera de la propriété de la Couronne et du statut de parc national. Te Urewera devient « une entité juridique » qui a les droits et devoirs d'une personne (s. 11) ; les terres lui appartiennent à elle-même. Pour Tūhoe, Te Urewera est « le cœur du grand poisson de Māui » et donne sens à sa culture, sa langue et son identité (s. 3). Le conseil de gestion doit tenir compte des notions tūhoe, dont le rāhui (interdiction temporaire d'usage) et le tapu (caractère sacré).
    gouvernance: "Conseil de Te Urewera (s. 16 et 21) : huit membres au départ, à parité ; après trois ans, six membres nommés par Tūhoe Te Uru Taumatua et trois par le ministre. Le conseil adopte le plan de gestion (s. 44)."
    effectivite: "Le plan de gestion Te Kawa o Te Urewera est publié par Tūhoe en māori et en anglais, avec des règles d'autorisation pour la chasse. Aucune évaluation indépendante du fonctionnement du conseil n'a été trouvée."
    textes:
      - {titre: "Te Urewera Act 2014", nature: "loi", annee: 2014, source: "https://www.legislation.govt.nz/act/public/2014/0051/latest/whole.html"}
      - {titre: "Te Kawa o Te Urewera (plan de gestion)", nature: "norme communautaire", annee: null, source: "https://teurewera.iwi.nz/te-kawa/te-marae/"}
    sources:
      - {titre: "Te Urewera Act 2014 — legislation.govt.nz", url: "https://www.legislation.govt.nz/act/public/2014/0051/latest/whole.html"}
      - {titre: "Te Urewera Board — Te Marae (Te Kawa o Te Urewera)", url: "https://teurewera.iwi.nz/te-kawa/te-marae/"}
      - {titre: "Māori Law Review — Te Urewera Act 2014", url: "https://maorilawreview.co.nz/2014/10/tuhoe-crown-settlement-te-urewera-act-2014/"}

  - id: "taranaki-maunga"
    atlas_uid: "maori-aotearoa"
    communaute: "Ngā Iwi o Taranaki (huit iwi)"
    etats: ["Nouvelle-Zélande"]
    entite: "Taranaki Maunga et les montagnes ancestrales voisines (Te Kāhui Tupua)"
    mecanisme: "personnalite_juridique"
    annee: 2025
    concept_local: "Te Kāhui Tupua"
    resume: >-
      La loi de 2025 règle une partie des réclamations des huit iwi de Taranaki, dont les terres ont été confisquées au XIXe siècle. Elle déclare Te Kāhui Tupua « tout vivant et indivisible » formé de Taranaki Maunga et des autres montagnes ancestrales (s. 17), et en fait une personne juridique (s. 18). Les terres de l'ancien parc national lui sont transférées en pleine propriété (s. 59). Le parc prend le nom de Te Papa-Kura-o-Taranaki ; les noms « Egmont » sont abandonnés (s. 23). Le public garde l'accès au parc.
    gouvernance: "Te Tōpuni Kōkōrangi, « visage et voix » de Te Kāhui Tupua (s. 28) : huit membres, quatre nommés par l'entité collective des iwi (Te Tōpuni Ngārahu), quatre par le ministre de la Conservation (s. 31)."
    effectivite: "inconnue (loi en vigueur depuis février 2025 ; aucun rapport de fonctionnement trouvé)"
    textes:
      - {titre: "Te Ture Whakatupua mō Te Kāhui Tupua 2025 / Taranaki Maunga Collective Redress Act 2025", nature: "loi", annee: 2025, source: "https://www.legislation.govt.nz/act/public/2025/1/en/latest/"}
    sources:
      - {titre: "Taranaki Maunga Collective Redress Act 2025 — legislation.govt.nz", url: "https://www.legislation.govt.nz/act/public/2025/1/en/latest/"}
      - {titre: "Eco Jurisprudence Monitor — Taranaki Maunga", url: "https://ecojurisprudence.org/initiatives/taranaki-maunga/"}

  - id: "equateur-constitution"
    atlas_uid: ""
    communaute: "Nationalités et peuples autochtones d'Équateur (norme nationale)"
    etats: ["Équateur"]
    entite: "La nature ou Pacha Mama"
    mecanisme: "droits_nature_texte_national"
    annee: 2008
    concept_local: "Pacha Mama ; sumak kawsay"
    resume: >-
      La Constitution de 2008 reconnaît à « la nature ou Pacha Mama » le droit au respect de son existence et au maintien de ses cycles vitaux (art. 71), et un droit à la restauration distinct de l'indemnisation des personnes (art. 72). L'État doit prendre des mesures de précaution contre l'extinction d'espèces et la destruction d'écosystèmes (art. 73). Toute personne, communauté, peuple ou nationalité peut exiger ces droits (art. 71). Le sumak kawsay (« bien vivre ») sert de principe au droit à l'environnement (art. 14) et au régime de développement (art. 275).
    gouvernance: "Pas de représentant désigné : toute personne ou collectivité peut agir en justice au nom de la nature ; les juges, jusqu'à la Cour constitutionnelle, tranchent."
    effectivite: "Appliquée par les juges. Arrêt 1149-19-JP/21 du 10 novembre 2021 (forêt protégée de Los Cedros, recours de la commune de Cotacachi) : la Cour constitutionnelle juge que les permis miniers violent les droits de la nature et ordonne leur annulation ; elle juge ces droits applicables sur tout le territoire."
    textes:
      - {titre: "Constitution de la République de l'Équateur, art. 14, 71 à 74 et 275", nature: "constitution", annee: 2008, source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
      - {titre: "Cour constitutionnelle, arrêt 1149-19-JP/21 (Los Cedros)", nature: "jurisprudence", annee: 2021, source: "https://ecojurisprudence.org/wp-content/uploads/2022/02/Ecuador_Los-Cedros_CC-ruling_176.pdf"}
    sources:
      - {titre: "Constitution de 2008 — Assemblée nationale de l'Équateur", url: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
      - {titre: "Eco Jurisprudence Monitor — Los Cedros", url: "https://ecojurisprudence.org/initiatives/los-cedros/"}

  - id: "sarayaku-kawsak-sacha"
    atlas_uid: "sarayaku-kichwa"
    communaute: "Pueblo Originario Kichwa de Sarayaku"
    etats: ["Équateur"]
    entite: "Territoire de Sarayaku (environ 135 000 ha) comme forêt vivante"
    mecanisme: "droit_propre"
    annee: 2018
    concept_local: "Kawsak Sacha ; Sacha runakuna ; sumak kawsay"
    resume: >-
      L'assemblée générale du peuple kichwa de Sarayaku adopte la déclaration Kawsak Sacha les 8 et 9 décembre 2012 ; elle la révise en 2016 et la met à jour en juin 2018. L'article 1 déclare le territoire « forêt vivante, être vivant et conscient, sujet de droits ». L'article 2 exclut du territoire toute activité extractive (pétrole, mines, exploitation forestière, biopiraterie). L'article 5 fait du consentement préalable, libre et éclairé une condition de toute décision qui touche le territoire. La déclaration invoque le droit à l'autodétermination et le caractère plurinational de l'État.
    gouvernance: "Assemblée et dirigeants élus du peuple de Sarayaku ; les « gardiens » (Runayuk) sont, dans la déclaration, des êtres de la forêt et non des personnes désignées."
    effectivite: "Aucune reconnaissance légale de la déclaration par l'État n'a été trouvée. En juin 2022, les représentants de Sarayaku indiquent que l'État n'a pas exécuté l'arrêt de la Cour interaméricaine des droits de l'homme de 2012 (retrait des explosifs, loi sur la consultation) et demandent la reconnaissance de Kawsak Sacha comme sujet de droits (CEJIL)."
    textes:
      - {titre: "Déclaration Kawsak Sacha — la forêt vivante (version de juin 2018)", nature: "norme communautaire", annee: 2018, source: "https://ecojurisprudence.org/wp-content/uploads/2022/08/KAWSAK_SACHA_DECLARATION-2018.pdf"}
      - {titre: "Cour interaméricaine des droits de l'homme, Pueblo Indígena Kichwa de Sarayaku c. Équateur (série C n° 245)", nature: "jurisprudence", annee: 2012, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
    sources:
      - {titre: "Déclaration Kawsak Sacha (texte de 2018)", url: "https://ecojurisprudence.org/wp-content/uploads/2022/08/KAWSAK_SACHA_DECLARATION-2018.pdf"}
      - {titre: "Territoires de vie — Sarayaku", url: "https://report.territoriesoflife.org/es/territorios/sarayaku-ecuador/"}
      - {titre: "CEJIL — Sarayaku demande le retrait des explosifs et la reconnaissance de la forêt vivante", url: "https://cejil.org/exigimos-retirar-explosivos-y-reconocer-la-selva-viviente-como-sujeto-de-derechos-pueblo-kichwa-sarayaku/"}

  - id: "bolivie-madre-tierra"
    atlas_uid: ""
    communaute: "Nations et peuples indígena originario campesinos de Bolivie (norme nationale)"
    etats: ["Bolivie"]
    entite: "La Terre-Mère (Madre Tierra) et ses systèmes de vie"
    mecanisme: "droits_nature_texte_national"
    annee: 2010
    concept_local: "Madre Tierra ; Vivir Bien (sumaj kamaña, sumaj kausay, yaiko kavi päve)"
    resume: >-
      La loi 071 de décembre 2010 définit la Terre-Mère comme un « système vivant » considéré comme sacré par les nations et peuples autochtones (art. 3). Elle lui donne le caractère de « sujet collectif d'intérêt public » (art. 5) et énumère ses droits : à la vie, à la diversité, à l'eau, à l'air pur, à l'équilibre, à la restauration, à ne pas être polluée (art. 7). La loi-cadre 300 d'octobre 2012 relie ces droits au « Vivir Bien ». Elle charge les autorités publiques, le ministère public et le tribunal agro-environnemental de les défendre, et permet aux personnes directement touchées d'agir (art. 39).
    gouvernance: "Autorités publiques, ministère public et tribunal agro-environnemental ; la loi 071 prévoit une Défenseure de la Terre-Mère (art. 10), renvoyée à une loi spéciale."
    effectivite: "La loi spéciale sur la Défenseure de la Terre-Mère n'est connue qu'à l'état de proposition (déposée en 2021). Aucune décision de justice fondée sur ces lois n'a été vérifiée pour ce dossier."
    textes:
      - {titre: "Loi n° 071 des droits de la Terre-Mère", nature: "loi", annee: 2010, source: "https://www.lexivox.org/norms/BO-L-N71.html"}
      - {titre: "Loi n° 300, loi-cadre de la Terre-Mère et du développement intégral pour vivre bien", nature: "loi", annee: 2012, source: "https://www.lexivox.org/norms/BO-L-N300.html"}
    sources:
      - {titre: "Lexivox — loi 071", url: "https://www.lexivox.org/norms/BO-L-N71.html"}
      - {titre: "Lexivox — loi 300", url: "https://www.lexivox.org/norms/BO-L-N300.html"}
