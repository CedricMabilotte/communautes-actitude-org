resume: >-
  Cherán est une commune purépecha du Michoacán. Le 15 avril 2011, des habitantes affrontent des exploitants forestiers illégaux ; la communauté cesse de reconnaître le gouvernement municipal et exclut les partis politiques. Le 2 novembre 2011, le Tribunal électoral fédéral reconnaît son droit d'élire ses autorités selon ses usages et coutumes. Le 22 janvier 2012, la commune élit selon ses usages un Grand Conseil de gouvernement communal (Concejo Mayor de Gobierno Comunal), renouvelé tous les trois ans par les assemblées des quatre quartiers. Santa Cruz Tanaco, localité de la commune, et les autres communautés du Michoacán à gouvernement propre font l'objet de la fiche « Communautés autochtones à gouvernement propre du Michoacán » ; le cadre fédéral figure dans la fiche des peuples autochtones du Mexique (article 2).
