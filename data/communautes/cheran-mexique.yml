droits:
  autogouvernement: {valeur: "reconnu", note: "Le Tribunal électoral fédéral (SUP-JDC-9167/2011) reconnaît le droit d'élire les autorités selon les normes propres ; la Constitution (art. 2 A III) garantit ce droit ; en 2014, la Cour suprême admet l'action du Grand Conseil en sa qualité d'autorité municipale (CC 32/2012).", source: "https://www.te.gob.mx/sentenciasHTML/convertir/expediente/SUP-JDC-9167-2011"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 2 A I et II, réforme de 2024) reconnaît l'application de systèmes normatifs propres, dans le respect de la Constitution et des droits humains.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution (art. 2 A II, réforme de 2024) reconnaît une juridiction exercée par les autorités communautaires selon leurs systèmes normatifs, dans le cadre de l'ordre juridique en vigueur ; la loi fixe la validation par les juges.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution (art. 2 A IX) accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 2 A XIII, 2024) impose une consultation visant le consentement ou l'accord ; la Cour suprême (CC 32/2012, 29 mai 2014) déclare invalide, avec effet limité aux parties, une réforme constitutionnelle du Michoacán adoptée sans consulter Cherán.", source: "https://www.scjn.gob.mx/derechos-humanos/sites/default/files/sentencias-emblematicas/resumen/2022-06/Resumen%20CC32-2012%20DGDH.pdf"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (art. 4) fait des langues autochtones reconnues par la loi des langues nationales ayant la même validité que l'espagnol.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution (art. 2 A VI) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution (art. 2 B II, 2024) prévoit des dotations budgétaires administrées directement par les peuples et communautés.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le 19 mai 2024, les assemblées des quatre quartiers élisent les 11 membres du Grand Conseil pour 2024-2027, avec 1 562 votants (Cambio de Michoacán) ; en mars 2026, la chambre régionale de Toluca du Tribunal électoral confirme que l'Assemblée générale décide de la révocation d'un membre du conseil.", source: "https://cambiodemichoacan.com.mx/2024/05/19/con-baja-participacion-elige-cheran-a-11-integrantes-del-concejo-mayor/"}
chronologie:
  - {annee: 2011, evenement: "Soulèvement du 15 avril contre les exploitants forestiers ; décision SUP-JDC-9167/2011 du Tribunal électoral fédéral (2 novembre)."}
  - {annee: 2012, evenement: "Élection du Grand Conseil de gouvernement communal selon les usages et coutumes (22 janvier)."}
  - {annee: 2014, evenement: "La Cour suprême juge que le Michoacán devait consulter Cherán avant sa réforme constitutionnelle (29 mai)."}
  - {annee: 2024, evenement: "Élection du Grand Conseil 2024-2027 par les assemblées de quartier (19 mai) ; réforme de l'article 2 de la Constitution fédérale : les peuples et communautés autochtones deviennent sujets de droit public (30 septembre)."}
  - {annee: 2025, evenement: "Attaque armée contre Cherán attribuée au Cartel Jalisco Nouvelle Génération, repoussée par la ronde communautaire (2 juillet) ; un mort et un blessé."}
  - {annee: 2026, evenement: "La chambre régionale de Toluca du Tribunal électoral (JDC 12/2026) confirme l'Assemblée générale comme autorité qui ratifie ou révoque les membres du conseil (10 mars)."}
