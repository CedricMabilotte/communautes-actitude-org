effectivite: {valeur: "effective", note: "Le Grand Conseil élu en janvier 2012 selon les usages et coutumes est validé par l'Institut électoral du Michoacán ; la Cour suprême tranche en sa faveur en 2014 (résumé officiel de la CC 32/2012).", source: "https://www.scjn.gob.mx/derechos-humanos/sites/default/files/sentencias-emblematicas/resumen/2022-06/Resumen%20CC32-2012%20DGDH.pdf"}
chronologie:
  - {annee: 2011, evenement: "Soulèvement du 15 avril contre les exploitants forestiers ; décision SUP-JDC-9167/2011 du Tribunal électoral fédéral (2 novembre)."}
  - {annee: 2012, evenement: "Élection du Grand Conseil de gouvernement communal selon les usages et coutumes (22 janvier)."}
  - {annee: 2014, evenement: "La Cour suprême juge que le Michoacán devait consulter Cherán avant sa réforme constitutionnelle (29 mai)."}
  - {annee: 2024, evenement: "Réforme de l'article 2 de la Constitution fédérale : les peuples indigènes deviennent sujets de droit public."}
