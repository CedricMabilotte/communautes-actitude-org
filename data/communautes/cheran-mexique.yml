droits:
  autogouvernement: {valeur: "reconnu", note: "Le Tribunal électoral fédéral (SUP-JDC-9167/2011) reconnaît le droit d'élire les autorités selon les normes propres ; la Constitution (art. 2 A III) garantit ce droit ; la Cour suprême reconnaît en 2014 au Grand Conseil le rang d'un conseil municipal.", source: "https://www.te.gob.mx/sentenciasHTML/convertir/expediente/SUP-JDC-9167-2011"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 2 A I et II, réforme de 2024) reconnaît l'application de systèmes normatifs propres, dans le respect de la Constitution et des droits humains.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution (art. 2 A II) reconnaît une juridiction indigène exercée par les autorités communautaires, avec validation par les juges selon la loi.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution (art. 2 A IX) accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 2 A XIII, 2024) impose une consultation visant le consentement ou l'accord ; la Cour suprême (CC 32/2012, 29 mai 2014) annule une réforme constitutionnelle du Michoacán adoptée sans consulter Cherán.", source: "https://www.scjn.gob.mx/derechos-humanos/sites/default/files/sentencias-emblematicas/resumen/2022-06/Resumen%20CC32-2012%20DGDH.pdf"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (art. 4) fait des langues indigènes des langues nationales ayant la même validité que l'espagnol.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution (art. 2 A VI) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution (art. 2 B II, 2024) prévoit des dotations budgétaires administrées directement par les peuples et communautés.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
