resume: >-
  Cherán est une commune purépecha du Michoacán. Le 15 avril 2011, des habitantes affrontent des exploitants forestiers illégaux ; la communauté cesse de reconnaître le gouvernement municipal et exclut les partis politiques. Le 2 novembre 2011, le Tribunal électoral fédéral reconnaît son droit d'élire ses autorités selon ses usages et coutumes. Depuis janvier 2012, la commune est gouvernée par un Grand Conseil de gouvernement communal (Concejo Mayor de Gobierno Comunal). Les autres communautés du Michoacán à gouvernement propre font l'objet de la fiche « Communautés autochtones à gouvernement propre du Michoacán ».
