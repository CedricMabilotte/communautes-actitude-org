  - {annee: 1997, evenement: "Loi sur l'administration des organisations religieuses islamiques, qui encadre les conseils islamiques provinciaux."}
  - {annee: 2005, evenement: "Décret d'urgence appliqué aux provinces frontalières du Sud, prolongé depuis."}
  - {annee: 2012, evenement: "Le CERD examine les rapports périodiques 1 à 3 de la Thaïlande et vise la situation des Malayu."}
  - {annee: 2015, evenement: "Le ministère de la Justice lance un projet de médiation en droit islamique de la famille et des successions dans les conseils islamiques de cinq provinces."}
  - {annee: 2022, evenement: "Publication des observations finales du CERD sur les rapports périodiques 4 à 8 de la Thaïlande, adoptées le 1er décembre 2021."}
