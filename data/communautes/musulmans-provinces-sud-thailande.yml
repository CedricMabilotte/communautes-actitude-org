resume: >-
  Les Malais musulmans, qui se nomment eux-mêmes « Malayu », forment environ 80 % de la population des provinces frontalières du Sud de la Thaïlande selon l'État. Depuis la loi de 1946 sur l'application du droit islamique dans les provinces de Pattani, Narathiwat, Yala et Satun, le droit islamique de la famille et des successions s'applique entre musulmans dans ces quatre provinces. Un juge musulman, le Dato' Yutitham (juge « de justice »), siège avec les juges civils des tribunaux de première instance ; sa décision sur le droit islamique est sans appel. Il n'existe ni autonomie territoriale ni statut officiel de la langue malaise.
