effectivite: {valeur: "partielle", note: "Les juges musulmans siègent dans les tribunaux des quatre provinces, avec des pouvoirs limités par rapport aux juges civils ; l'essentiel des litiges familiaux est réglé par médiation au conseil islamique provincial, dont les décisions ne lient pas les parties (Pattani : 910 affaires résolues en 2019). Le CERD relève en 2022 l'état d'urgence en vigueur depuis 2005 et des discriminations envers les groupes ethno-religieux de la région.", source: "https://journal.uinjkt.ac.id/ahkam/article/view/30437"}
chronologie:
