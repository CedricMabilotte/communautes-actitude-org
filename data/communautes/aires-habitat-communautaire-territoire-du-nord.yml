resume: >-
  Une Aboriginal community living area (aire d'habitat communautaire aborigène) est une petite parcelle détachée d'un bail pastoral du Territoire du Nord et attribuée en fee simple (pleine propriété) à une association ou corporation aborigène pour y loger une communauté. Le régime découle d'un mémorandum d'accord conclu en 1989 entre le gouvernement fédéral et celui du Territoire, qui fermait les revendications sur les routes de bétail et réserves au titre de la loi fédérale de 1976 sur les droits fonciers ; il figure aujourd'hui dans la partie 8 du Pastoral Land Act 1992 (loi sur les terres pastorales) et à l'article 46(1A) du Lands Acquisition Act 1978 (loi sur l'acquisition des terres). Peuvent demander une aire les Aborigènes qui ont résidé sur le bail à un moment depuis le 1er janvier 1968 ou y ont un lien de résidence historique, et qui justifient d'un besoin actuel, ou tout autre Aborigène avec l'accord écrit du titulaire du bail ; il n'est pas nécessaire d'être propriétaire traditionnel. On compte environ 100 aires dans le Territoire, dont 78 dans la région du Central Land Council (conseil foncier du Centre).
