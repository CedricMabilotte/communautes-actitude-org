resume: >-
  Fiche agrégée : elle couvre les iwi (peuples), hapū (sous-groupes) et whānau (familles élargies) māori qui demandent ou détiennent un titre marin coutumier (customary marine title) au titre de la loi de 2011 sur l'espace marin et côtier (Takutai Moana), qui a abrogé la loi de 2004 sur l'estran et les fonds marins et rétabli les droits coutumiers que celle-ci avait éteints. Le titre est reconnu par la Haute Cour ou par accord avec la Couronne lorsque le groupe détient la zone selon le tikanga (droit coutumier māori) et l'a utilisée et occupée de façon exclusive depuis 1840 sans interruption substantielle (art. 58). Il confère un intérêt foncier inaliénable assorti de droits d'autorisation, de consultation, de protection des wāhi tapu (lieux sacrés) et de propriété de certains minéraux, sans fermer l'accès du public ni la pêche. Les demandes étaient closes le 3 avril 2017. En 2026, la Haute Cour liste 201 demandes actives ; le registre officiel compte 19 ordonnances, dont 18 sur la côte de Ngā Hapū o Ngāti Porou et une pour les îles Tamaitemioka et Pohowaitai, au large de Rakiura (Stewart Island).
