droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le titre marin coutumier est un intérêt foncier (art. 60 de la loi de 2011) qui ne comporte pas le droit d'aliéner ni de céder ; l'espace marin et côtier commun n'appartient à personne (art. 11 de la loi de 2011), et l'accès du public, la navigation et la pêche y restent garantis (art. 26 à 28), sauf restrictions légales (Cour suprême, 2024, par. 102, 106, 205 et 229).", source: "https://www.courtsofnz.govt.nz/assets/cases/2024/2024-NZSC-164.pdf"}
  ressources: {valeur: "partiel", note: "Le groupe titulaire est propriétaire des minéraux autres que le pétrole, l'or, l'argent, l'uranium et, là où s'applique la loi de 1997 sur le pounamu de Ngāi Tahu, le pounamu (jade), ainsi que des taonga tūturu (objets protégés) découverts dans la zone (art. 60 et 62 de la loi de 2011 ; Cour suprême, 2024, par. 72) ; les droits coutumiers protégés ne peuvent porter sur une activité régie par la loi de 1996 sur la pêche.", source: "https://whakatau.govt.nz/te-tira-takutai-moana/what-are-customary-interests"}
  consentement: {valeur: "partiel", note: "Le titre donne un droit d'autorisation au titre de la loi sur la gestion des ressources (RMA permission right) et un droit d'autorisation en matière de conservation, qui permettent de dire oui ou non à certaines activités soumises à permis, un droit d'être notifié et consulté (permis d'observation des mammifères marins, politique côtière) et un document de planification pris en compte par les autorités (art. 60 et 62 de la loi de 2011).", source: "https://whakatau.govt.nz/te-tira-takutai-moana/what-are-customary-interests"}
  langue: {valeur: "non_applicable", note: "", source: ""}
