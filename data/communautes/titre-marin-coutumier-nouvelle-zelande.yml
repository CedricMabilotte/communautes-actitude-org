reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/NZL/CO/23-24, par. 37 b) : préoccupation au sujet du projet de loi présenté en 2025 visant à modifier la loi sur les zones marines et côtières (Takutai Moana) ; recommandation que la législation sur les zones marines et côtières respecte le droit des Maoris à l'autodétermination et au contrôle de leurs terres et ressources (par. 38 b)", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=CERD/C/NZL/CO/23-24&l=fr&t=pdf"}
