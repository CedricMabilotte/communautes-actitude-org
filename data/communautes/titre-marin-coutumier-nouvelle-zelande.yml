effectivite: {valeur: "contestee", note: "Au 18 septembre 2025, le registre officiel (LINZ) compte 19 ordonnances de titre marin coutumier, dont 18 sur la côte de Ngā Hapū o Ngāti Porou, alors que la Haute Cour liste 201 demandes actives ; après l'arrêt de la Cour suprême du 2 décembre 2024 qui a reformulé le critère de l'article 58, le Parlement a adopté le 21 octobre 2025 une loi qui précise les notions d'occupation exclusive et d'interruption substantielle et exige des preuves matérielles en plus des preuves culturelles et spirituelles ; le 19 décembre 2025, le CERD exprime sa préoccupation au sujet de cette modification, qui pourrait affaiblir le droit des Maoris à l'autodétermination sur leurs terres et ressources (CERD/C/NZL/CO/23-24, par. 37 b).", source: "https://documents.un.org/api/symbol/access?s=CERD/C/NZL/CO/23-24&l=fr&t=pdf"}
chronologie:
  - {annee: 2004, evenement: "La loi sur l'estran et les fonds marins éteint les droits coutumiers māori sur l'espace côtier et les remplace par un système de reconnaissance limité."}
  - {annee: 2011, evenement: "La loi sur l'espace marin et côtier (Takutai Moana) abroge la loi de 2004, rétablit les droits coutumiers et crée le titre marin coutumier et les droits coutumiers protégés."}
  - {annee: 2016, evenement: "Le 23 août, le ministre conclut que le critère du titre marin coutumier est rempli sur environ 16 km de côte de la baie de Hawke pour Ngāti Pāhauwera et propose un accord de reconnaissance."}
  - {annee: 2017, evenement: "Clôture des demandes le 3 avril ; le 9 août, signature de l'acte modifié avec Ngā Hapū o Ngāti Porou."}
  - {annee: 2019, evenement: "Loi Ngā Rohe Moana o Ngā Hapū o Ngāti Porou ; avec la loi de 2011, elle fonde les titres marins coutumiers de Ngāti Porou inscrits au registre."}
  - {annee: 2021, evenement: "Décision Re Edwards (Whakatōhea) de la Haute Cour [2021] NZHC 1025, dans l'est de la baie de l'Abondance."}
  - {annee: 2023, evenement: "Arrêt de la Cour d'appel [2023] NZCA 504 dans la même affaire."}
  - {annee: 2024, evenement: "Le 2 décembre, la Cour suprême accueille l'appel de l'Attorney-General et reformule le critère de l'article 58 ([2024] NZSC 164)."}
  - {annee: 2025, evenement: "Le 21 octobre, troisième lecture de la loi modifiant l'article 58, sanctionnée le 24 octobre ; le 19 décembre, observations finales du CERD."}
fiabilite:
  verifie: ["Arrêt [2024] NZSC 164 de la Cour suprême (2 décembre 2024) : dispositif, par. 1, 2, 5, 71 et 72 (droits attachés au titre, délai du 3 avril 2017, extinction en 2004 et rétablissement en 2011).", "Nombre de demandes actives (201) : page de la Haute Cour sur la liste des demandes au titre de la loi de 2011 (consultée le 1er octobre 2026).", "Registre de l'espace marin et côtier (LINZ, mis à jour le 18 septembre 2025) : un document de reconnaissance de la Couronne au titre de la loi Ngāti Porou de 2019 et 19 ordonnances de titre marin coutumier, dont 18 entre Pōtikirua et Koutunui Head et une pour les îles Tamaitemioka et Pohowaitai.", "Situation des îles Tamaitemioka et Pohowaitai dans le groupe sud-ouest des îles Tītī, près de Rakiura : article Wikipédia sur les îles Tītī.", "Dates de la troisième lecture (21 octobre 2025) et de la sanction royale (24 octobre 2025) de la loi modificative : article Wikipédia sur cette loi.", "Contenu des droits et critère modifié en 2025 : page « What are customary interests » de Te Tari Whakatau.", "Accord avec Ngāti Pāhauwera (23 août 2016) et acte avec Ngāti Porou (9 août 2017) : pages de Te Tari Whakatau.", "Observations finales CERD/C/NZL/CO/23-24, par. 37 b et 38 b (19 décembre 2025)."]
  non_confirme: ["Texte consolidé de la loi de 2011 sur legislation.govt.nz : page protégée, articles vérifiés à travers l'arrêt de la Cour suprême et les pages officielles de Te Tari Whakatau.", "Contenu exact de la loi de 2025, y compris son effet sur les demandes déjà jugées.", "Titulaire de l'ordonnance relative aux îles Tamaitemioka et Pohowaitai et décision qui la fonde : document du registre non accessible (page protégée).", "Attribution à Ngā Hapū o Ngāti Porou des 18 ordonnances situées entre Pōtikirua et Koutunui Head : déduite de la zone de demande décrite par Te Tari Whakatau, documents individuels du registre non accessibles.", "Dates et surfaces des 19 ordonnances inscrites au registre ; statut des titres reconnus dans les affaires Whakatōhea (Haute Cour) et Ngāti Pāhauwera (ministre), non inscrits au registre à la date de consultation.", "Nombre de demandes déposées dans la voie de négociation directe avec la Couronne.", "Effet juridique du document de planification et des protections de wāhi tapu (art. 78 à 93) : texte non lu directement.", "Population : chiffre de l'iwi Ngāti Porou (recensement de 2013), et non des seuls membres des hapū titulaires ; titulaires de l'ordonnance des îles Tamaitemioka et Pohowaitai non comptés.", "Nombre de villages : non trouvé."]
