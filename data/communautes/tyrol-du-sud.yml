resume: >-
  La province de Bolzano – Tyrol du Sud compte trois groupes linguistiques officiellement recensés : germanophone (68,61 %), italophone (26,98 %) et ladin (4,41 %) selon la déclaration d'appartenance de 2024. Son autonomie repose sur l'accord de Paris de 1946 entre l'Autriche et l'Italie, sur l'article 116 de la Constitution et sur le Statut d'autonomie de 1972. Le différend entre les deux États, porté devant l'Assemblée générale des Nations unies en 1960, a été clos en 1992. Une loi constitutionnelle de réforme du Statut a été définitivement adoptée le 13 mai 2026.
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Résolution 1497 (XV) de l'Assemblée générale sur le statut de l'élément germanophone de la province de Bolzano et l'application de l'accord de Paris du 5 septembre 1946 ; elle recommande à l'Autriche et à l'Italie de reprendre les négociations.", annee: 1960, source: "https://documents.un.org/doc/resolution/gen/nr0/152/71/pdf/nr015271.pdf"}
base_nationale:
  - {instrument: "Accord de Paris entre l'Autriche et l'Italie (accord De Gasperi-Gruber), 5 septembre 1946", nature: "traite", annee: 1946, source: "https://documents.un.org/doc/resolution/gen/nr0/152/71/pdf/nr015271.pdf"}
  - {instrument: "Constitution de la République italienne, art. 6 et 116", nature: "constitution", annee: 1948, source: "https://www.constituteproject.org/constitution/Italy_2020"}
  - {instrument: "Statut spécial du Trentin-Haut-Adige (décret présidentiel n° 670 du 31 août 1972)", nature: "statut_autonomie", annee: 1972, source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  - {instrument: "Loi constitutionnelle de réforme du Statut d'autonomie, adoptée le 13 mai 2026", nature: "statut_autonomie", annee: 2026, source: "https://news.provincia.bz.it/it/news/definitivamente-approvata-la-riforma-dello-statuto-di-autonomia"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil provincial de 35 membres élus au suffrage universel direct ; la loi électorale garantit la représentation du groupe ladin, Statut de 1972, art. 48.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "La province légifère dans les matières énumérées à l'article 8 du Statut ; la réforme de 2026 rétablit et étend ces compétences (environnement, commerce, urbanisme).", source: "https://news.provincia.bz.it/it/news/definitivamente-approvata-la-riforma-dello-statuto-di-autonomia"}
  justice_propre: {valeur: "partiel", note: "Section autonome de Bolzano du tribunal administratif régional, composée à parité des deux principaux groupes linguistiques et dont la moitié des membres est nommée par le Conseil provincial, Statut, art. 90 à 93 ; les postes de magistrats sont répartis à la proportionnelle des groupes, art. 89.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  terres: {valeur: "partiel", note: "Urbanisme, paysage, droits d'usage collectifs et régime des fermes indivisibles (maso chiuso, ferme transmise sans partage) relèvent de la loi provinciale, Statut, art. 8, n° 5 à 8.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  ressources: {valeur: "partiel", note: "Mines, carrières, chasse, pêche, forêts et certains ouvrages hydrauliques relèvent de la loi provinciale, Statut, art. 8, n° 14, 15, 21 et 24 ; l'usage des eaux publiques relève de la province, art. 9, n° 9, et les grandes concessions hydroélectriques font l'objet des art. 12 et 13.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  consentement: {valeur: "reconnu", note: "Les décrets d'application du Statut sont pris après avis d'une commission paritaire État-région-provinces comptant des membres germanophones, Statut, art. 107 ; la réforme de 2026 subordonne les modifications futures du Statut à l'accord du conseil régional et des conseils provinciaux.", source: "https://news.provincia.bz.it/it/news/definitivamente-approvata-la-riforma-dello-statuto-di-autonomia"}
  langue: {valeur: "reconnu", note: "L'allemand est à égalité avec l'italien dans la région, Statut, art. 99 ; les germanophones peuvent employer leur langue devant l'administration et la justice dans la province, art. 100.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  education: {valeur: "reconnu", note: "L'enseignement est donné dans la langue maternelle, italien ou allemand, par des enseignants de même langue ; le ladin est langue d'enseignement dans les vallées ladines, Statut, art. 19.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  fiscalite: {valeur: "reconnu", note: "Les provinces peuvent lever leurs propres impôts, Statut, art. 73, et reçoivent une part, jusqu'à neuf dixièmes, des recettes fiscales de l'État perçues sur leur territoire, art. 75.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le droit de vote aux élections provinciales de Bolzano est subordonné à quatre ans de résidence ininterrompue dans la région, Statut, art. 25, al. 4 ; la déclaration d'appartenance à un groupe linguistique conditionne la répartition proportionnelle des emplois publics, art. 89.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le rapport d'Eurac Research (2025) décrit un système proportionnel appliqué dans l'emploi public, la politique et les financements, et rappelle la déclaration autrichienne de clôture du différend en 1992.", source: "https://works.eurac.edu/Autonomy-Report-South-Tyrol-2025.pdf"}
