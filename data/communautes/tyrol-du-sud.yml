resume: >-
  La province de Bolzano – Tyrol du Sud compte trois groupes linguistiques officiellement recensés : germanophone (68,61 %), italophone (26,98 %) et ladin (4,41 %) selon la déclaration d'appartenance de 2024. Son autonomie repose sur l'accord de Paris de 1946 entre l'Autriche et l'Italie, sur l'article 116 de la Constitution et sur le Statut d'autonomie de 1972. Le différend entre les deux États, porté devant l'Assemblée générale des Nations unies en 1960, a été clos en 1992. La loi constitutionnelle n° 2 du 18 mai 2026, en vigueur depuis le 23 juin 2026, modifie le Statut. Les Ladins du val de Fassa, dans la province de Trente, ont leur propre fiche (« Ladins du val de Fassa »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Sixième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur l'Italie (adopté le 11 février 2026) : il décrit la déclaration d'appartenance à l'un des trois groupes linguistiques (italien, allemand, ladin) dans la province autonome de Bolzano et cite les résultats de 2024.", annee: 2026, source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-fr/48802bdf5f"}
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Résolution 1497 (XV) de l'Assemblée générale sur le statut de l'élément germanophone de la province de Bolzano et l'application de l'accord de Paris du 5 septembre 1946 ; elle recommande à l'Autriche et à l'Italie de reprendre les négociations.", annee: 1960, source: "https://documents.un.org/doc/resolution/gen/nr0/152/71/pdf/nr015271.pdf"}
base_nationale:
  - {instrument: "Accord de Paris entre l'Autriche et l'Italie (accord De Gasperi-Gruber), 5 septembre 1946", nature: "traite", annee: 1946, source: "https://documents.un.org/doc/resolution/gen/nr0/152/71/pdf/nr015271.pdf"}
  - {instrument: "Constitution de la République italienne, art. 6 et 116", nature: "constitution", annee: 1948, source: "https://www.constituteproject.org/constitution/Italy_2020"}
  - {instrument: "Statut spécial du Trentin-Haut-Adige (décret présidentiel n° 670 du 31 août 1972)", nature: "statut_autonomie", annee: 1972, source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  - {instrument: "Loi constitutionnelle n° 2 du 18 mai 2026 portant modification du Statut spécial du Trentin-Haut-Adige/Südtirol (en vigueur le 23 juin 2026)", nature: "statut_autonomie", annee: 2026, source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge.costituzionale:2026-05-18;2"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil provincial de 35 membres élus au suffrage universel direct ; la loi électorale garantit la représentation du groupe ladin, Statut de 1972, art. 48.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "La province légifère dans les matières énumérées à l'article 8 du Statut ; la loi constitutionnelle n° 2 de 2026 retire les limites des « principes de l'ordre juridique » et des « normes fondamentales des réformes économiques et sociales » (art. 4), réécrit l'urbanisme (n° 5), les marchés publics (n° 17) et les services publics (n° 19), et ajoute l'environnement et la faune sauvage (n° 29 bis) et le commerce (n° 29 ter).", source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge.costituzionale:2026-05-18;2"}
  justice_propre: {valeur: "partiel", note: "Section autonome de Bolzano du tribunal administratif régional, composée à parité des deux principaux groupes linguistiques et dont la moitié des membres est nommée par le Conseil provincial, Statut, art. 90 à 93 ; les postes de magistrats sont répartis à la proportionnelle des groupes, art. 89.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  terres: {valeur: "partiel", note: "Aménagement du territoire et urbanisme, paysage, droits d'usage collectifs (usi civici) et régime des fermes indivisibles (masi chiusi, ferme transmise sans partage) relèvent de la loi provinciale, Statut, art. 8, n° 5 à 8, dans la version modifiée en 2026.", source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:presidente.repubblica:decreto:1972-08-31;670"}
  ressources: {valeur: "partiel", note: "Mines, carrières, chasse, pêche et forêts relèvent de la loi provinciale, Statut, art. 8, n° 14, 15 et 21 ; depuis 2026, le n° 24 couvre aussi les petites et moyennes dérivations hydroélectriques ; l'usage des eaux publiques relève de la province, art. 9, n° 9, et la province fixe par loi les procédures d'attribution des grandes concessions hydroélectriques, art. 13 ; l'art. 12 a été abrogé en 2026.", source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:presidente.repubblica:decreto:1972-08-31;670"}
  consentement: {valeur: "reconnu", note: "Les décrets d'application du Statut sont pris après avis d'une commission paritaire de douze membres État-région-provinces, dont trois du groupe allemand ou ladin, Statut, art. 107 ; depuis 2026, tout projet de modification du Statut est soumis à l'accord (intesa) du conseil régional et des conseils provinciaux à la majorité absolue, à défaut duquel, après soixante jours, les Chambres peuvent l'adopter à la majorité absolue sans réduire l'autonomie déjà reconnue, art. 103.", source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:presidente.repubblica:decreto:1972-08-31;670"}
  langue: {valeur: "reconnu", note: "L'allemand est à égalité avec l'italien dans la région, Statut, art. 99 ; les germanophones peuvent employer leur langue devant l'administration et la justice dans la province, art. 100.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  education: {valeur: "reconnu", note: "L'enseignement est donné dans la langue maternelle, italien ou allemand, par des enseignants de même langue ; le ladin est langue d'enseignement dans les vallées ladines, Statut, art. 19.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  fiscalite: {valeur: "reconnu", note: "Les provinces peuvent lever leurs propres impôts, Statut, art. 73, et reçoivent une part des recettes fiscales de l'État perçues sur leur territoire, neuf dixièmes pour la plupart des impôts et huit dixièmes de la TVA intérieure, art. 75.", source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:presidente.repubblica:decreto:1972-08-31;670"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le droit de vote aux élections provinciales de Bolzano est subordonné à deux ans de résidence ininterrompue dans la région depuis la loi constitutionnelle n° 2 de 2026 (quatre ans auparavant), Statut, art. 25 ; la déclaration d'appartenance à un groupe linguistique conditionne la répartition proportionnelle des emplois publics, art. 89.", source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:presidente.repubblica:decreto:1972-08-31;670"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le rapport d'Eurac Research (2025), centre de recherche privé de Bolzano, indique que la représentation proportionnelle des groupes dans l'emploi public était presque atteinte en 2023 et que le système de protection des minorités s'est révélé « globalement effectif » ; il rappelle la déclaration autrichienne de clôture du différend en 1992.", source: "https://works.eurac.edu/Autonomy-Report-South-Tyrol-2025.pdf"}
chronologie:
