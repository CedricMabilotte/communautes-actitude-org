  - {annee: 1960, evenement: "Résolution 1497 (XV) de l'Assemblée générale des Nations unies (31 octobre)."}
  - {annee: 1972, evenement: "Entrée en vigueur du deuxième Statut d'autonomie."}
  - {annee: 1992, evenement: "Déclaration de clôture du différend par l'Autriche."}
  - {annee: 2026, evenement: "Adoption définitive par le Sénat de la réforme du Statut (13 mai), promulgation de la loi constitutionnelle n° 2 (18 mai) et entrée en vigueur (23 juin)."}
