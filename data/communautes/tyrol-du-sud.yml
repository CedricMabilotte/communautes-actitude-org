  - {annee: 1972, evenement: "Entrée en vigueur du deuxième Statut d'autonomie."}
  - {annee: 1992, evenement: "Déclaration de clôture du différend par l'Autriche."}
  - {annee: 2026, evenement: "Adoption définitive par le Sénat de la réforme constitutionnelle du Statut (13 mai)."}
