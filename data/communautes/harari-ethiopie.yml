resume: >-
  Les Harari sont une « nation, nationalité et peuple » au sens de la Constitution fédérale éthiopienne, originaire de la ville de Harar, dans l'est du pays.
  L'article 47 de la Constitution fédérale fait de « l'État du peuple harari » l'un des États membres de la fédération, alors que les Harari sont minoritaires dans cette région.
  Selon la Constitution régionale révisée en 2004, l'assemblée régionale compte 36 sièges, dont 14 reviennent au Conseil national harari, élu par les Harari de toute l'Éthiopie et compétent pour la langue, la culture et le patrimoine harari.
  Le régime combine une autonomie territoriale (la région) et une autonomie personnelle (un électorat défini par l'appartenance, quel que soit le lieu de résidence).
