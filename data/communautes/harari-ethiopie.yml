droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 47(1) de la Constitution fédérale : « l'État du peuple harari » figure parmi les neuf États membres énumérés ; Constitution régionale de 2004 : assemblée régionale de 36 sièges, dont 22 au Conseil du peuple harari et 14 au Conseil national harari.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(2)(b) de la Constitution fédérale : chaque État adopte sa constitution et ses lois ; art. 59 de la Constitution régionale : le Conseil national harari adopte politiques et lois sur la culture, la langue et le patrimoine historique et culturel harari.", source: "https://addisstandard.com/view-point-harari-people-self-administration-electoral-system-clearing-wrong-perceptions/"}
  justice_propre: {valeur: "reconnu", note: "Art. 50(2) de la Constitution fédérale : les États détiennent le pouvoir judiciaire ; art. 78(5) : les Conseils des États peuvent créer ou reconnaître des tribunaux religieux et coutumiers.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  terres: {valeur: "partiel", note: "Art. 40(3) de la Constitution fédérale : la terre est propriété commune des nations, nationalités et peuples, inaliénable ; art. 52(2)(d) : les États l'administrent selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) de la Constitution fédérale : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Art. 39(2) de la Constitution fédérale : droit de parler, écrire et développer sa langue ; art. 59 de la Constitution régionale : le Conseil national harari légifère sur la langue harari.", source: "https://addisstandard.com/view-point-harari-people-self-administration-electoral-system-clearing-wrong-perceptions/"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 97 de la Constitution fédérale : les États lèvent l'impôt sur le revenu des salariés de l'État et des entreprises privées, les redevances d'usufruit foncier et d'autres impôts.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Constitution régionale de 2004 : 14 des 36 sièges de l'assemblée régionale et un siège réservé à la Chambre des représentants des peuples (chambre basse fédérale) sont élus par les Harari de tout le pays ; art. 61(2) de la Constitution fédérale : au moins un siège à la Chambre de la Fédération (chambre haute).", source: "https://addisstandard.com/view-point-harari-people-self-administration-electoral-system-clearing-wrong-perceptions/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) de la Constitution fédérale : droit inconditionnel à l'autodétermination, y compris la sécession (séparation d'avec l'État), par vote aux deux tiers du conseil législatif puis référendum organisé par l'État fédéral dans les trois ans. Jamais exercé.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "effective", note: "Selon un ancien conseiller juridique de la présidence régionale (2021), le mode d'élection a été appliqué lors de cinq élections nationales et régionales consécutives, et la Commission électorale nationale a perdu devant la chambre de cassation de la Cour suprême fédérale. En mai 2026, un tribunal de l'État régional harari (dossier 0916) interdit à un membre du parti EZEMA et à d'autres personnes de se présenter, au motif que l'appartenance harari conditionne le droit d'élire et d'être élu au conseil régional ; EZEMA, qui dit que son membre briguait un siège au Parlement fédéral, conteste la décision.", source: "https://borkena.com/ezema-disputes-court-ruling-over-candidate-in-harari-which-showcases-the-brute-of-ethnic-federalism/"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale : « l'État du peuple harari » figure parmi les neuf États membres (art. 47)."}
  - {annee: 2004, evenement: "Révision de la Constitution régionale : Conseil national harari (14 sièges sur 36) élu par les Harari de tout le pays (art. 48, 49 et 59) ; il propose le président de la région (art. 59(4) et 63(1))."}
  - {annee: 2026, evenement: "Un tribunal de l'État régional harari interdit à un membre du parti EZEMA et à d'autres personnes de se présenter, au motif que l'appartenance harari conditionne le droit d'élire et d'être élu au conseil régional ; EZEMA conteste la décision."}
