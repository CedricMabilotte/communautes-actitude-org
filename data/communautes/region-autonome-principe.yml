base_nationale:
  - {instrument: "Constitution de la République démocratique de São Tomé-et-Principe (révision de 2003), art. 137", nature: "constitution", annee: 2003, source: "https://www2.camara.leg.br/saotomeeprincipe/legislacao/legislacao-constitucional/constituicao.pdf"}
  - {instrument: "Loi n° 4/2010 du 18 juin 2010, Statut politico-administratif de la Région autonome de Principe (EPARAP), abrogeant la loi n° 4/94 du 20 septembre 1994", nature: "statut_autonomie", annee: 2010, source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  - {instrument: "Loi n° 10/2022 du 9 août 2022, première modification du statut politico-administratif (texte republié en annexe)", nature: "statut_autonomie", annee: 2022, source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'Assemblée législative régionale, élue au suffrage universel direct à la représentation proportionnelle, et le gouvernement régional sont les organes du pouvoir régional (Constitution art. 137 ; statut de 2010 révisé en 2022, art. 6, 12 et 13) ; le président du gouvernement régional est nommé par le Premier ministre selon les résultats des élections régionales (art. 51), la région est soumise à la tutelle administrative du Premier ministre (art. 75) et le gouvernement de la République peut dissoudre l'Assemblée pour actions ou omissions illégales graves (art. 119).", source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée régionale légifère par décrets législatifs régionaux dans les matières d'intérêt spécifique pour la région non réservées aux organes de souveraineté, dans le respect des principes des lois générales ; les décrets exigent la signature du président de la République (statut, art. 32, 35, 75-A et 75-B, rédaction de 2022) ; l'Assemblée a adopté par exemple les décrets législatifs régionaux n° 1/2024 (grandes options du plan) et n° 2/2024 (budget régional), publiés au Journal officiel le 16 avril 2024.", source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les biens du domaine public de l'État situés sur l'île intègrent le domaine public régional, hors défense et services non régionalisés ; la politique des sols et l'aménagement du territoire sont des matières d'intérêt spécifique (statut, art. 35 g, 116 à 118). Il s'agit d'un patrimoine de la collectivité régionale, non d'un titre foncier collectif.", source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  ressources: {valeur: "partiel", note: "Pêche, agriculture, ressources hydriques et minérales, forêts, parcs et réserves naturelles et littoral figurent parmi les matières d'intérêt spécifique où la région légifère (statut, art. 35 e, f, h, bb, dd, gg) ; le territoire régional comprend la mer environnante et ses fonds (art. 3).", source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  consentement: {valeur: "partiel", note: "L'Assemblée nationale et le gouvernement doivent entendre les organes régionaux, par écrit, avant d'exercer le pouvoir législatif ou réglementaire sur des matières qui concernent la région ; le défaut d'audition peut entraîner l'inconstitutionnalité ou l'illégalité de l'acte (statut, art. 76 à 79). Il s'agit d'une obligation de consultation, non d'un droit de veto : le statut lui-même est adopté par l'Assemblée nationale sur projet de l'Assemblée régionale (art. 120).", source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'éducation préscolaire, l'enseignement de base, secondaire, supérieur et spécial figurent parmi les matières d'intérêt spécifique où la région légifère, dans le cadre des lois générales de la République (statut, art. 32 b et 35 l).", source: "https://principe.gov.st/wp-content/uploads/2025/01/Lei-10_22_-Revisao-a-Lei-1_2010_-Estatuto-Politico-Administrativo.pdf"}
  fiscalite: {valeur: "partiel", note: "La région exerce un pouvoir fiscal « dans les termes du statut et de la loi », dispose des impôts, taxes, droits de douane et amendes perçus sur son territoire, d'une participation aux recettes fiscales de l'État et d'un budget annuel voté par l'Assemblée régionale (statut, art. 91 à 93) ; les bénéfices fiscaux relèvent d'une délégation du gouvernement central (art. 114) et le budget régional de 2024 compte 128,4 millions de dobras de transferts du Trésor national sur 240,6 millions de recettes (décret législatif régional n° 2/2024, art. 2).", source: "https://principe.gov.st/wp-content/uploads/2025/01/Decreto-Legislativo-Regional-n.o-1-e-2_2024_-GOP-e-Orcamento-Regional.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Les élections régionales du 25 septembre 2022 ont été suivies de l'investiture du président du gouvernement régional par le Premier ministre le 19 novembre 2022 ; le gouvernement régional demandait alors une loi des finances régionales et une loi électorale régionale (Téla Nón, 19 novembre 2022).", source: "https://www.telanon.info/politica/2022/11/19/39154/filipe-nascimento-presidente-do-governo-regional-do-principe-legitimado-nas-urnas/"}
chronologie:
  - {annee: 1994, evenement: "Loi n° 4/94 du 20 septembre 1994, premier statut politico-administratif de Principe."}
  - {annee: 1995, evenement: "Élection du premier gouvernement régional ; son président, Damião Vaz d'Almeida, prend ses fonctions le 29 avril 1995."}
  - {annee: 2003, evenement: "La révision constitutionnelle inscrit la Région autonome de Principe à l'article 137."}
  - {annee: 2006, evenement: "Une protestation contre l'absence d'élections locales conduit à la démission du gouvernement régional en juin."}
  - {annee: 2010, evenement: "Loi n° 4/2010 du 18 juin 2010 (nouveau statut) ; élections régionales du 25 juillet et investiture du gouvernement régional de José Cassandra pour quatre ans."}
  - {annee: 2020, evenement: "Démission de José Cassandra ; le Premier ministre sollicite le parti majoritaire à l'Assemblée régionale pour nommer son successeur."}
  - {annee: 2021, evenement: "Après le rejet d'une proposition de révision du statut par l'Assemblée nationale, le gouvernement régional demande que la nomination et la dissolution des organes régionaux relèvent du président de la République."}
  - {annee: 2022, evenement: "Loi n° 10/2022 : révision du statut (décrets législatifs régionaux, autorisation législative au gouvernement régional), promulguée le 28 juillet et publiée le 9 août ; élections régionales du 25 septembre."}
  - {annee: 2024, evenement: "Décrets législatifs régionaux n° 1/2024 et n° 2/2024 : grandes options du plan et budget régional."}
fiabilite:
  verifie:
    - "Article 137 de la Constitution (Région autonome de Principe, Assemblée régionale et gouvernement régional), lu dans le texte publié par l'Assemblée nationale."
    - "Articles 1 à 6, 12, 13, 32, 35, 75-A, 75-B, 76 à 79, 91 à 93 et 116 à 118 du statut, lus dans le texte republié au Journal officiel (Diário da República, I série, n° 59, 9 août 2022)."
    - "Abrogation de la loi n° 4/1994 par la loi n° 4/2010."
    - "Décrets législatifs régionaux n° 1/2024 et n° 2/2024 (Diário da República, I série, n° 24, 16 avril 2024) : recettes régionales de 112,1 millions de dobras et transferts du Trésor national de 128,4 millions."
    - "Élections régionales du 25 septembre 2022 et investiture du gouvernement régional le 19 novembre 2022 (Téla Nón)."
  non_confirme:
    - "Le site du gouvernement régional désigne le statut comme « Lei 1/2010 », alors que le Journal officiel le cite comme loi n° 4/2010 du 18 juin ; la fiche suit le Journal officiel."
    - "Population (8 420 en 2018) et surface (142 km²) reprises d'une encyclopédie citant l'Institut national de la statistique ; source primaire non ouverte. Le recensement de 2012 comptait 7 324 habitants selon la même encyclopédie."
    - "Application effective du transfert des recettes fiscales de l'État (art. 92 et 94) non documentée par une source indépendante ; existence d'une loi des finances régionales non établie (le gouvernement régional en demandait la création en 2022)."
    - "Nombre de sièges de l'Assemblée régionale et représentation de Principe à l'Assemblée nationale non vérifiés (renvoi à la loi électorale)."
