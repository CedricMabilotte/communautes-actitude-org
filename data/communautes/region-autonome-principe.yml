resume: >-
  L'île de Principe et les îlots qui l'entourent forment une région autonome de São Tomé-et-Principe, dotée par l'article 137 de la Constitution d'un statut politico-administratif (loi fixant ses institutions et compétences) et de deux organes propres : l'Assemblée régionale, renommée Assemblée législative régionale en 2022, et le gouvernement régional. L'autonomie s'exerce depuis l'entrée en fonction du premier gouvernement régional, le 29 avril 1995, sur la base de la loi n° 4/94, remplacée par la loi n° 4/2010 du 18 juin 2010, elle-même révisée par la loi n° 10/2022. Le statut fonde l'autonomie sur la géographie des deux îles, sur les caractéristiques économiques, sociales et culturelles de Principe et sur les aspirations autonomistes de sa population, sans désignation ethnique. L'Assemblée régionale adopte des décrets législatifs régionaux, dont le budget régional ; plus de la moitié des recettes du budget de 2024 proviennent de transferts du Trésor national.
