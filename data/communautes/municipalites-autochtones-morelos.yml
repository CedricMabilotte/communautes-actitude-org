droits:
  autogouvernement: {valeur: "reconnu", note: "Les décrets de 2017 (art. 4) instituent un conseil municipal propre à chaque commune ; le code électoral (art. 17, 5e alinéa, et art. 19) prévoit que les municipalités autochtones élisent leurs autorités selon leurs systèmes normatifs, aux dates qu'ils fixent.", source: "https://marcojuridico.morelos.gob.mx/documentos/1781/download"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution du Morelos (art. 2 Bis, IX) prévoit que les peuples et communautés appliquent leurs systèmes normatifs dans la régulation des conflits internes, sous réserve des constitutions fédérale et locale et des droits humains ; le code électoral (art. 7 Bis, III et IV, 2023) reconnaît l'assemblée générale communautaire comme autorité de délibération et de décision pour élire les autorités, là où le système normatif le prévoit, et oblige l'État à respecter ses accords.", source: "https://marcojuridico.morelos.gob.mx/documentos/3/download"}
  justice_propre: {valeur: "partiel", note: "La Constitution du Morelos (art. 2 Bis, IX) reconnaît l'application interne des systèmes normatifs pour résoudre les conflits ; un article transitoire de la réforme judiciaire renvoie à une loi secondaire l'élection des juges de paix de Coatetelco, Hueyapan et Xoxocotla selon leurs systèmes normatifs.", source: "https://marcojuridico.morelos.gob.mx/documentos/3/download"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution du Morelos (art. 2 Bis, VII) accorde aux peuples et communautés la préférence dans l'usage des ressources naturelles de leurs territoires, dans les limites de la Constitution fédérale et des lois.", source: "https://marcojuridico.morelos.gob.mx/documentos/3/download"}
  consentement: {valeur: "partiel", note: "La Constitution du Morelos (art. 2 Bis, XII j) prévoit la consultation des peuples pour les plans de développement ; la Cour suprême annule en 2019 le décret de création de Tetelcingo (n° 2341) faute de consultation autochtone préalable (CC 30/2018, rappelée dans la sentence CC 69/2021).", source: "https://dof.gob.mx/nota_detalle.php?codigo=5676738&fecha=11/01/2023&print=true"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (2003, art. 4) donne aux langues autochtones, dont le nahuatl, le statut de langues nationales ; la Constitution du Morelos (art. 2 Bis, XI) permet la rédaction des actes d'état civil dans la langue de l'intéressé.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution du Morelos (art. 2 Bis, XII b et c) prévoit une éducation bilingue et interculturelle et des programmes à contenu régional définis en consultation avec les communautés.", source: "https://marcojuridico.morelos.gob.mx/documentos/3/download"}
  fiscalite: {valeur: "partiel", note: "En tant que municipalités, les trois communes administrent leur trésor municipal (Constitution fédérale, art. 115, IV) ; le code électoral (art. 7 Bis, V, 2023) soumet leurs autorités aux mêmes règles de contrôle des fonds publics que les autres conseils municipaux.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les conseils municipaux s'installent en 2019 ; une étude universitaire de 2022 relève des conflits internes sur leur composition à Xoxocotla et Hueyapan, des litiges de limites et de dette avec les communes d'origine, un retard d'attribution du code géostatistique INEGI qui prive un temps les communes du fonds de participations, et la paralysie de Tetelcingo. Pour le scrutin de 2024, l'Institut national électoral (INE) indique que les trois communes sont régies par leurs systèmes normatifs et restent hors du scrutin des partis.", source: "https://revistas.chapingo.mx/textual/article/view/r.textual.2022.80.02"}
chronologie:
  - {annee: 2014, evenement: "Le gouvernement du Morelos présente une initiative de réforme de l'article 40 de la Constitution de l'État pour permettre la création de municipalités autochtones."}
  - {annee: 2017, evenement: "Décrets n° 2341 à 2344 portant création de Tetelcingo, Coatetelco, Hueyapan et Xoxocotla (Periódico Oficial n° 5559, 5560, 5561 et 5563, 14-22 décembre)."}
  - {annee: 2019, evenement: "Entrée en vigueur des décrets le 1er janvier et installation des conseils municipaux ; le 26 septembre, la Cour suprême annule le décret de Tetelcingo (CC 30/2018)."}
  - {annee: 2023, evenement: "Décret n° 1016 : le code électoral reconnaît les systèmes normatifs autochtones (art. 7 Bis) et l'élection des autorités des municipalités autochtones selon ces systèmes, aux dates qu'ils fixent (art. 17 et 19)."}
  - {annee: 2024, evenement: "Pour le scrutin local 2023-2024, l'INE et l'institut électoral du Morelos (IMPEPAC) excluent les trois communes de l'élection par partis : leurs autorités sont élues selon leur système normatif."}
  - {annee: 2025, evenement: "Décret n° 363 : le code électoral (art. 179 Sexies) réserve à tour de rôle l'une des trois municipalités autochtones aux candidatures de femmes à chaque période électorale."}
