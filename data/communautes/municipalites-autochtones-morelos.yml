resume: >-
  En décembre 2017, le Congrès du Morelos crée quatre municipalités autochtones en application de l'article 40, fraction XI, de la Constitution de l'État : Coatetelco (détachée de Miacatlán), Xoxocotla (détachée de Puente de Ixtla), Hueyapan (détachée de Tetela del Volcán) et Tetelcingo (détachée de Cuautla). Les décrets entrent en vigueur le 1er janvier 2019 ; un conseil municipal (Concejo Municipal) désigné en tenant compte des usages et coutumes gouverne d'abord chaque commune. Le 26 septembre 2019, la Cour suprême annule le décret de Tetelcingo faute de consultation préalable des communautés autochtones. Le code électoral du Morelos prévoit que les trois municipalités restantes élisent leurs autorités selon leurs systèmes normatifs (règles propres de la communauté), hors du système des partis.
