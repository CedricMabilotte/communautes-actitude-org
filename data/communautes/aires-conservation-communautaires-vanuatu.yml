effectivite: {valeur: "partielle", note: "Le sixième rapport national à la CDB (2019) compte neuf aires enregistrées, dont cinq de 2014 à 2019, face à environ 250 aires de conservation informelles ; il indique que les comités peinent à remettre seuls leurs rapports annuels et qu'aucune méthode commune aux deux systèmes, coutumier et légal, n'a été arrêtée. La stratégie nationale 2018-2030 visait 10 aires enregistrées en 2020. La fiche descriptive Ramsar du lac Letes (2023) indique que l'aire communautaire qui le couvre est encore en cours d'enregistrement. Hors administration, le programme Nakau, qui finance l'aire de Loru (293 ha, clan Serakar), fait état de réductions d'émissions vérifiées selon le standard Plan Vivo et auditées par des tiers.", source: "https://nakau.org/projects/loru-vanuatu"}
chronologie:
  - {annee: 2002, evenement: "Loi n° 12 sur la gestion et la conservation de l'environnement : division 2 de la partie 4 sur les aires de conservation communautaires ; entrée en vigueur le 10 mars 2003."}
  - {annee: 2010, evenement: "Loi n° 28 (sanction le 30 décembre 2010, en vigueur le 24 janvier 2011) : la loi devient loi sur la protection et la conservation de l'environnement ; consentement des propriétaires coutumiers avant négociation, comité de gestion, règlement des litiges et infraction pour violation du plan."}
  - {annee: 2013, evenement: "Le département de l'environnement publie un livret d'information sur l'enregistrement des aires de conservation communautaires (cité par le sixième rapport national)."}
  - {annee: 2015, evenement: "Enregistrement de l'aire de conservation communautaire de Loru (Santo)."}
  - {annee: 2018, evenement: "Enregistrement des aires de Tabwemasana (Santo) et d'Apuma Lelepa Island Tours (Lelepa) ; adoption de la stratégie nationale pour la biodiversité 2018-2030."}
  - {annee: 2019, evenement: "Enregistrement des aires de Wairua (Santo) et de Malakloplop (Gaua) ; le registre national compte neuf aires."}
  - {annee: 2023, evenement: "Le lac Letes (Gaua), couvert par une aire de conservation communautaire en cours d'enregistrement, est inscrit sur la liste de Ramsar le 15 septembre."}
fiabilite:
  verifie: ["Texte des art. 2, 6, 34 et 35 à 40 de la loi de 2002 (édition consolidée de 2006, FAOLEX) et date d'entrée en vigueur (10 mars 2003).", "Texte de la loi n° 28 de 2010 (FAOLEX) : nouveau titre, définitions, art. 34B, modifications des art. 35 à 40, nouvel art. 41 et art. 44B ; sanction le 30 décembre 2010, entrée en vigueur le 24 janvier 2011.", "La loi n° 6 de 2019 modifiant la même loi porte sur l'évaluation environnementale des projets et ne modifie pas la division sur les aires de conservation (FAOLEX).", "Sixième rapport national à la CDB : neuf aires enregistrées, liste et années de cinq d'entre elles, estimation de 250 aires informelles.", "Stratégie nationale 2018-2030 : environ 50 sites reconnus non enregistrés, environ 80 aires marines gérées localement, cible de 10 aires enregistrées en 2020 ; Amal-Crab Bay et Penauro qualifiées d'aires enregistrées.", "Fiche descriptive Ramsar n° 2524 (lac Letes, PDF de 2023) : inscription le 15 septembre 2023, 8 248,12 ha, aire communautaire en cours de désignation au titre de la loi, comité de gestion de 7 membres.", "Base mondiale des aires protégées (Protected Planet) : Vatthe, 34,7 km², année de statut 1994 ; Loru Protected Area, année de statut 1993.", "Stratégie nationale 2018-2030 : le département a enregistré trois aires forestières et une aire de mangrove couvrant environ 11 000 ha ; chiffre non repris en surface, car il ne couvre pas les neuf aires du registre de 2019."]
  non_confirme: ["Le sixième rapport donne neuf aires enregistrées mais sa liste de neuf aires cartographiées inclut le lac Letas « en attente d'approbation » : la neuvième aire enregistrée n'est pas identifiée avec certitude (la stratégie nationale cite aussi Edenhope, Matantas et Tasmate comme enregistrées), d'où huit lignes au tableau.", "Années d'enregistrement de Vatthe, Penaoru et Amal-Crab Bay : non trouvées ; la base mondiale des aires protégées (WDPA) donne 1994 pour Vatthe et 1993 pour Loru, dates antérieures à la loi de 2002.", "Le plan de gestion du lac Letes (2023) décrit l'aire comme enregistrée, alors que la fiche Ramsar de la même année la dit en cours d'enregistrement.", "Aucune donnée ouverte postérieure à 2019 sur le nombre d'aires enregistrées ; le registre environnemental (art. 6) et le site du département de l'environnement n'ont pas pu être consultés.", "Population, nombre de villages et surface totale des aires enregistrées : aucun chiffre trouvé.", "Aucune source universitaire indépendante sur le régime d'enregistrement n'a pu être ouverte ; la seule source non gouvernementale consultée (programme Nakau) porte sur la seule aire de Loru.", "La page en ligne du site Ramsar n'affiche pas l'état d'enregistrement ni la composition du comité ; ces faits sont lus dans la fiche descriptive en PDF."]
