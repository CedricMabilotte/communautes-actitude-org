reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Vanuatu à la Convention sur la diversité biologique : il décrit la procédure d'enregistrement des aires de conservation communautaires (art. 37 de la loi), compte neuf aires enregistrées d'après le registre national (2019), donne les années d'enregistrement de cinq d'entre elles et nomme neuf aires cartographiées, dont le lac Letas « en attente d'approbation », et fait de l'enregistrement de nouvelles aires une cible nationale (10 aires enregistrées en 2020)", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/vu-nr-06-en.pdf"}
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2018-2030, transmis à la CDB : environ 50 sites considérés comme reconnus mais non enregistrés au titre de la loi, environ 80 aires marines gérées localement selon la coutume, peu documentées, et cibles sur les rapports annuels des comités de gestion", annee: 2018, source: "https://www.cbd.int/doc/world/vu/vu-nbsap-v2-en.pdf"}
base_nationale:
  - {instrument: "Environmental Management and Conservation Act n° 12 de 2002 (chap. 283, édition consolidée de 2006), partie 4, division 2, art. 35 à 40 ; art. 6 (registre environnemental) et art. 34 (6) (bioprospection)", nature: "loi", annee: 2002, source: "https://faolex.fao.org/docs/pdf/van53103.pdf"}
  - {instrument: "Environmental Management and Conservation (Amendment) Act n° 28 de 2010 (en vigueur le 24 janvier 2011) : nouveau titre de la loi, art. 34B, 35 à 40 modifiés, art. 41 et 44B", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/van110177.pdf"}
  - {instrument: "Constitution de la République du Vanuatu (1980), art. 73 et 74 : la terre appartient aux propriétaires coutumiers et les règles coutumières fondent sa propriété et son usage", nature: "constitution", annee: 1980, source: "https://www.constituteproject.org/constitution/Vanuatu_1983"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le comité de gestion d'une aire enregistrée élabore, applique et fait respecter le plan de gestion et remet un rapport annuel au département de l'environnement (art. 39 (1) modifié par la loi n° 28 de 2010) ; la loi définit l'organe de gouvernement (governing body) comme toute entité reconnue pour décider au nom de la population : chef de haut rang, conseil des chefs, conseil de village, comité d'aire ou bureau provincial (art. 34B). Le directeur du département peut radier l'aire si le plan n'est pas appliqué dans le délai convenu (art. 40).", source: "https://faolex.fao.org/docs/pdf/van110177.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi de 2010 définit les « règles de gestion » (management rules) appliquées pour gérer l'aire et fait de la violation d'une clause du plan de gestion d'une aire enregistrée une infraction punie jusqu'à cinq ans d'emprisonnement ou 5 millions de vatu d'amende pour une personne physique (art. 41 (1) (f) et (2)). Le plan et ses modifications passent par le directeur du département (art. 37 (2) (d) et 38).", source: "https://faolex.fao.org/docs/pdf/van110177.pdf"}
  justice_propre: {valeur: "partiel", note: "Le comité de gestion veille au respect des procédures de règlement des litiges sur les violations des règles de l'aire, selon le mode de règlement extrajudiciaire prévu par le plan de gestion (art. 39 (1) (b), loi n° 28 de 2010). La compétence se limite aux règles de l'aire ; les infractions pénales relèvent des tribunaux.", source: "https://faolex.fao.org/docs/pdf/van110177.pdf"}
  terres: {valeur: "partiel", note: "L'enregistrement ne transfère pas la propriété : la terre reste coutumière (Constitution, art. 73 et 74). Il exige le consentement de toutes les personnes titulaires de droits sur la terre incluse (art. 37 (2) (c) de la loi de 2002) ; le demandeur peut à tout moment demander l'annulation de l'enregistrement, la modification du plan ou des limites de l'aire (art. 38 (1)). La décision appartient au directeur, après consultation des propriétaires et de la communauté (art. 38 (2) modifié en 2010).", source: "https://faolex.fao.org/docs/pdf/van53103.pdf"}
  ressources: {valeur: "partiel", note: "Le plan de gestion décrit comment, par qui et où l'aire est gérée (art. 2 modifié en 2010) et sa violation est une infraction (art. 41 (1) (f), loi de 2010). Hors de l'aire comme dedans, un permis de bioprospection exige un contrat avec les propriétaires coutumiers ou les détenteurs de savoirs traditionnels sur l'accès, l'acquisition des ressources et les redevances (art. 34 (6) (a) de la loi de 2002). Depuis 2010, le directeur ne transmet une demande de permis au conseil consultatif de la biodiversité que si les propriétaires et la communauté la soutiennent (art. 33 (4)). Le sous-sol n'est pas visé.", source: "https://faolex.fao.org/docs/pdf/van53103.pdf"}
  consentement: {valeur: "reconnu", note: "Le directeur ne négocie l'enregistrement avec le demandeur qu'« après avoir obtenu le consentement des propriétaires coutumiers » (art. 35 modifié en 2010) ; il s'assure avant l'enregistrement du consentement de toutes les personnes ayant des droits sur la terre (art. 37 (2) (c)) et, avant toute extension, de l'accord de tous les titulaires de droits sur la terre ajoutée (art. 38 (5) (b)).", source: "https://faolex.fao.org/docs/pdf/van110177.pdf"}
