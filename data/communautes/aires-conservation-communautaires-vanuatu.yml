resume: >-
  Fiche agrégée : elle couvre les propriétaires coutumiers, chefs, familles et communautés qui font enregistrer une partie de leur terre ou de leurs eaux comme « aire de conservation communautaire » (Community Conservation Area). La loi sur la gestion et la conservation de l'environnement de 2002 (chap. 283, en vigueur le 10 mars 2003), renommée loi sur la protection et la conservation de l'environnement en 2010, subordonne l'enregistrement au consentement de toutes les personnes titulaires de droits sur la terre et à un plan de gestion (art. 35 à 40). Depuis la modification de 2010 (loi n° 28), un comité de gestion applique et fait respecter ce plan, veille au respect de la procédure de règlement des litiges qu'il prévoit, et la violation du plan est une infraction pénale. Le demandeur peut être un propriétaire coutumier, un chef, un groupe familial, un conseil de village, une organisation ou un particulier (art. 34B), mais le consentement des propriétaires coutumiers reste requis (art. 35). En 2019, neuf aires étaient enregistrées ; les zones tabu (interdits coutumiers de pêche ou de récolte posés par les chefs), estimées à plusieurs centaines, relèvent de la coutume sans enregistrement.
