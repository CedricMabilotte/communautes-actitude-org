resume: >-
  Fiche agrégée : elle couvre les communautés de droit coutumier (masyarakat hukum adat, MHA) auxquelles le ministère des Forêts attribue par décret le statut de forêt coutumière (hutan adat). Depuis l'arrêt de la Cour constitutionnelle 35/PUU-X/2012, la forêt coutumière n'est plus classée comme forêt d'État : le règlement gouvernemental n° 23 de 2021 distingue forêt d'État, forêt coutumière et forêt privée, et le règlement ministériel n° 9 de 2021 retire de la forêt d'État le territoire coutumier visé par le décret. La communauté doit d'abord être reconnue par un règlement régional (Perda) si elle se trouve dans la zone forestière de l'État, ou par un règlement régional ou un arrêté du gouverneur ou du chef de district si elle se trouve hors de cette zone ; elle gère ensuite la forêt selon son droit coutumier, sans pouvoir la louer ni en changer le statut. Le ministère compte 174 forêts coutumières, 368 877 hectares et 92 955 ménages au 30 avril 2026 ; le tableau des sites inclut des forêts d'Aceh, de Bali et des provinces de Papouasie, aussi traitées dans les fiches « Acehnais », « Villages coutumiers de Bali (desa adat) » et « Papous (Orang Asli Papua) ». La reconnaissance préalable des communautés par les gouvernements régionaux fait l'objet de la fiche « Territoires coutumiers d'Indonésie ».
