effectivite: {valeur: "partielle", note: "En novembre 2025, 332 500 hectares de forêts coutumières étaient reconnus, soit moins de 2 % des 23 millions d'hectares cartographiés par l'Agence d'enregistrement des territoires coutumiers (BRWA) ; la reconnaissance préalable par des actes locaux est décrite comme longue et coûteuse (dossier, cartographie, approbation des gouvernements régionaux et central), et la loi sur les peuples autochtones est en attente au Parlement depuis 2012 (Mongabay, 2025).", source: "https://news.mongabay.com/2025/11/new-pledge-old-problems-as-indonesias-latest-indigenous-forest-promise-draws-skepticism/"}
chronologie:
  - {annee: 1999, evenement: "Loi sur les forêts n° 41 : la forêt coutumière est définie comme forêt d'État située dans le territoire d'une communauté de droit coutumier."}
  - {annee: 2013, evenement: "Arrêt 35/PUU-X/2012 de la Cour constitutionnelle du 16 mai 2013, qui accueille en partie la requête contre la loi forestière : la forêt coutumière cesse d'être forêt d'État."}
  - {annee: 2016, evenement: "Premiers décrets ministériels de forêt coutumière : huit décrets de décembre 2016 dans la couche cartographique officielle (Jambi, Banten, Sulawesi central, Sulawesi du Sud)."}
  - {annee: 2021, evenement: "Règlement gouvernemental n° 23 et règlement ministériel n° 9 sur la foresterie sociale, pris en application de la loi n° 11 de 2020 sur la création d'emplois."}
  - {annee: 2022, evenement: "Premières forêts coutumières reconnues en province de Papouasie et de Papouasie occidentale."}
  - {annee: 2025, evenement: "Arrêté du ministre des Forêts n° 144 de 2025 créant un groupe de travail pour l'accélération de l'établissement des forêts coutumières."}
  - {annee: 2026, evenement: "174 forêts coutumières, 368 877 hectares et 92 955 ménages au 30 avril 2026 ; 123 demandes en attente sur environ 2,5 millions d'hectares dans 21 provinces. Le 6 juin, lancement de la feuille de route 2025-2029 (objectif d'environ 1,4 million d'hectares)."}
fiabilite:
  verifie: ["Texte indonésien des art. 1, 62 à 75 et 92 à 94 du règlement ministériel n° 9 de 2021 (pasal.id).", "Art. 1 (7) et 15 du règlement gouvernemental n° 23 de 2021 : forêt d'État, forêt coutumière et forêt privée comme catégories distinctes (pasal.id).", "Art. 18B (2) de la Constitution (Constitute Project, traduction anglaise).", "174 forêts coutumières, 368 877 ha, 92 955 ménages ; 162 forêts et 354 608 ha fin 2025 ; 123 demandes sur environ 2,5 millions d'hectares : communiqué du ministère des Forêts SP.136/HKLN/04/2026 du 30 avril 2026.", "Feuille de route 2025-2029 (environ 1,4 million d'hectares, 95 communautés prêtes pour vérification, 123 autres à accompagner) et remise de 10 décrets le 6 juin 2026 : communiqué SP.201/HKLN/06/2026.", "Tableau des sites : couche officielle HUTAN_ADAT_AR_50K du géoportail de la planification forestière (mise à jour de janvier 2026), 168 entrées, somme des surfaces 361 635 ha, consultée le 1er octobre 2026.", "Ordres de grandeur indépendants : 265 250 ha reconnus en juillet 2024, 332 500 ha en novembre 2025, 332 661 ha en août 2026 selon le directeur de la BRWA (Mongabay).", "Arrêt 35/PUU-X/2012, prononcé le 16 mai 2013 : dispositif lu sur pasal.id (mot « negara » de l'art. 1 (6) déclaré contraire à la Constitution ; art. 5 (1) à lire comme excluant la forêt coutumière de la forêt d'État).", "Tableau : les 168 lignes contrôlées une à une sur la couche (nom, surface, année) ; deux années corrigées en 2017 (Tawang Panyai, Marena de Sulawesi central), dont le numéro de décret porte « 3/2017 » alors que le champ date de la couche indique le 16 mars 2016."]
  non_confirme: ["Texte de l'arrêt 35/PUU-X/2012 lu sur une reprise (pasal.id) et non sur le site de la Cour.", "La couche cartographique de janvier 2026 compte 168 entrées contre 162 forêts fin 2025 selon le ministère ; elle inclut 5 zones indicatives de forêt coutumière (remarque « Penetapan Wilayah Indikatif Hutan Adat »), qui ne sont pas des forêts établies et sont signalées comme telles dans le tableau. Les 12 forêts établies en 2026 ne figurent pas dans le tableau.", "Le tableau comprend 8 forêts d'Aceh (mukim), 6 de Bali et 12 des provinces de Papouasie, Papouasie occidentale et Papouasie du Sud-Ouest, aussi concernées par les fiches aceh-indonesie, desa-adat-bali et papous-indonesie.", "Population : le ministère donne des ménages (92 955), non des personnes.", "Les noms de provinces du tableau sont déduits des codes provinciaux officiels de la couche (KODE_PROV) ; les districts ne sont pas repris.", "Aucun document onusien nommant le régime n'a été trouvé (stratégie nationale pour la biodiversité 2015-2020 et cinquième rapport national à la CDB consultés)."]
