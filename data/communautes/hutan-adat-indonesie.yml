base_nationale:
  - {instrument: "Constitution de 1945, art. 18B (2) : l'État reconnaît et respecte les communautés de droit coutumier et leurs droits traditionnels", nature: "constitution", annee: 2000, source: "https://www.constituteproject.org/constitution/Indonesia_2002"}
  - {instrument: "Loi n° 41 de 1999 sur les forêts, art. 1 (6), 5 et 37, modifiée par la loi n° 6 de 2023 ; arrêt de la Cour constitutionnelle 35/PUU-X/2012 (requête partiellement accueillie)", nature: "loi", annee: 1999, source: "https://pasal.id/peraturan/uu/uu-no-41-tahun-1999"}
  - {instrument: "Arrêt de la Cour constitutionnelle 35/PUU-X/2012 du 16 mai 2013 sur la loi forestière : le mot « negara » (État) de l'art. 1 (6) est déclaré contraire à la Constitution, et la forêt d'État ne comprend pas la forêt coutumière (art. 5 (1))", nature: "jurisprudence", annee: 2013, source: "https://pasal.id/peraturan/putusan-mk/puu-mk-35-2012"}
  - {instrument: "Règlement gouvernemental n° 23 de 2021 sur l'administration des forêts, art. 1 (7) et 15", nature: "loi", annee: 2021, source: "https://pasal.id/peraturan/pp/pp-no-23-tahun-2021"}
  - {instrument: "Règlement du ministre de l'Environnement et des Forêts n° 9 de 2021 sur la gestion de la foresterie sociale, art. 62 à 75 et 92 à 94", nature: "loi", annee: 2021, source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
droits:
  autogouvernement: {valeur: "partiel", note: "La forêt coutumière est gérée par la communauté de droit coutumier (art. 62 (3) du règlement ministériel n° 9 de 2021), dont l'existence doit être établie par règlement régional si elle se trouve dans la zone forestière de l'État, ou par règlement régional ou arrêté du gouverneur ou du chef de district hors de cette zone (art. 63 (1)) sur la base de critères qui incluent des institutions dirigées par les autorités coutumières (art. 64 b) ; la demande est déposée par le chef coutumier (pemangku adat, art. 66). L'institution n'existe pour l'État qu'après cette reconnaissance régionale.", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  pouvoir_normatif: {valeur: "partiel", note: "La communauté peut mener la gestion de la forêt « selon le droit coutumier en vigueur », s'il ne contredit pas la législation (art. 92 (1) e du règlement ministériel n° 9 de 2021) ; l'existence de règles et de sanctions coutumières encore respectées est une condition de reconnaissance (art. 64 d).", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le territoire coutumier visé par le décret est retiré de la forêt d'État (art. 75 (1) du règlement ministériel n° 9 de 2021) ; la forêt coutumière est une catégorie distincte de la forêt d'État (art. 15 (1) du règlement gouvernemental n° 23 de 2021), mais elle reste comprise dans la zone forestière (kawasan hutan, espace soumis au droit forestier, art. 15 (2)). Le titulaire ne peut ni louer la forêt ni en changer le statut ou la fonction, ni y planter du palmier à huile (art. 94 (2)) ; la fonction (conservation, protection, production) est fixée par l'État (art. 62 (2)).", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  ressources: {valeur: "partiel", note: "La communauté a le droit d'utiliser l'espace, les services environnementaux, le bois et les produits non ligneux de la forêt (art. 92 (1) du règlement ministériel n° 9 de 2021) ; le bois n'est exploité que pour les besoins quotidiens et selon les savoirs locaux (art. 92 (2)), et l'abattage est interdit dans la partie classée forêt de protection (art. 94 (2) c).", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  consentement: {valeur: "partiel", note: "Dans une zone indicative de forêt coutumière (wilayah indikatif hutan adat, territoire délimité par le chef de district en attente de règlement régional), aucun nouveau permis ne peut être délivré hors des concessions existantes ; dans une concession existante, le titulaire du permis doit se coordonner avec le chef coutumier (art. 72 (1) du règlement ministériel n° 9 de 2021). Le texte ne prévoit pas de consentement préalable hors de ces zones.", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
