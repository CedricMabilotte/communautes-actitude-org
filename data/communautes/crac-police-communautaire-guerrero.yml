resume: >-
  La Police communautaire naît le 15 octobre 1995 d'assemblées de communautés me'phaa, na savi et nahuas de la Costa Chica et de la Montaña du Guerrero ; la Coordination régionale des autorités communautaires (CRAC), créée en 1998, y ajoute des fonctions de justice et de rééducation. La loi 701 du Guerrero (2011) reconnaît la Police communautaire comme « corps de sécurité publique reconnu » (art. 6, fr. XI) et, dans sa version initiale, les fonctions de sécurité, de poursuite et de justice exercées par la CRAC (art. 37). La réforme publiée le 5 juillet 2022 remplace ces articles par un « Système de sécurité communautaire autochtone et afromexicain » limité à la prévention du délit et coopérant avec le système de sécurité de l'État ; la CRAC-PC n'y est plus nommée, seule la définition de la Police communautaire (art. 6, fr. XI) demeurant, et elle a refusé la consultation préalable. Selon la CRAC-PC, le système compte cinq maisons de justice et couvre 215 communautés dans 29 municipes (2022).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Le rapport de la Rapporteuse spéciale sur sa visite au Mexique (A/HRC/39/17/Add.2, § 52) indique que la police communautaire du Guerrero exerce depuis 1995 des fonctions de sécurité, de justice et de réinsertion selon les usages autochtones, qu'elle a été reconnue légalement par l'État en 2011, et signale des poursuites pénales contre des policiers communautaires.", annee: 2018, source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.2&l=en&t=pdf"}
  - {mecanisme: "oit_169", detail: "Le Mexique ratifie la Convention 169 de l'OIT le 5 septembre 1990 ; l'exposé des motifs de la loi 701 s'y réfère.", annee: 1990, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
base_nationale:
  - {instrument: "Loi n° 701 de reconnaissance, droits et culture des peuples et communautés autochtones et afromexicains de l'État du Guerrero (P.O. n° 28 du 8 avril 2011 ; réformée par le décret n° 183, P.O. n° 53 du 5 juillet 2022), art. 6 fr. XI, 26, 30, 35 à 42 novies", nature: "loi", annee: 2011, source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  - {instrument: "Constitution politique de l'État libre et souverain du Guerrero, art. 11 et 14 (art. 14 réformé par le décret n° 756 de 2018 et le décret n° 182 de 2025 ; art. 11 réformé le 13 février 2026)", nature: "constitution", annee: 2014, source: "https://congresogro.gob.mx/legislacion/CONSTITUCION-GUERRERO-15-06-2022.pdf"}
  - {instrument: "Loi générale des droits linguistiques des peuples autochtones (LGDLPI), art. 4", nature: "loi", annee: 2003, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 701 (art. 26, fr. III) reconnaît l'élection des autorités communautaires selon les règles propres ; depuis 2022, l'Assemblée générale de chaque communauté est l'organe suprême du système de sécurité communautaire (art. 40), mais la CRAC, instance régionale, n'est plus nommée dans le texte en vigueur.", source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 701 (art. 30 et 36) reconnaît la validité des normes internes des communautés pour les relations familiales, la vie civile et la solution des conflits internes, sous réserve des constitutions, des lois de l'État et des droits humains.", source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  justice_propre: {valeur: "conteste", note: "Dans sa version de 2011, la loi 701 (art. 37) faisait respecter par l'État les fonctions de sécurité publique, de poursuite (procuración, enquête et accusation) et de justice exercées par la CRAC (El Sur, 30 janvier 2013) ; la réforme de 2022 retire cette mention, fait de la justice autochtone une voie « alterne » soumise au Code national de procédure pénale (art. 35 et 42) et cantonne la Police autochtone et afromexicaine à la prévention, en auxiliaire du système de sécurité de l'État (art. 42 quinquies) ; la CRAC-PC qualifie les réformes de 2022 de « extrêmement régressives » (Tlachinollan, 15 octobre 2022).", source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  terres: {valeur: "partiel", note: "La loi 701 (art. 26, fr. VI) et la Constitution du Guerrero (art. 11, fr. IV) reconnaissent l'usage et la jouissance collectifs des terres et territoires dans les modalités de la Constitution fédérale, sans dépossession.", source: "https://congresogro.gob.mx/legislacion/CONSTITUCION-GUERRERO-15-06-2022.pdf"}
  ressources: {valeur: "partiel", note: "La loi 701 (art. 26, fr. VI) interdit l'exploitation des ressources naturelles par des entités extérieures sans consentement préalable, libre et éclairé de la communauté et prévoit une part des bénéfices en cas d'accord.", source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  consentement: {valeur: "partiel", note: "La loi 701 (art. 26, fr. VI) et la Constitution du Guerrero (art. 11, fr. IV) exigent le consentement préalable, libre et éclairé pour l'exploitation des terres et ressources ; le décret n° 217 de 2022 présente le décret n° 183 comme le résultat d'une consultation des communautés, à laquelle la CRAC-PC a refusé de participer (El Faro de la Costa Chica, 1er avril 2022).", source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (art. 4, 2003) fait des langues autochtones des langues nationales ayant la même validité que l'espagnol ; la loi 701 (art. 18) interdit toute discrimination fondée sur l'usage d'une langue autochtone.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La loi 701 (art. 26, fr. VII) prévoit l'enregistrement de candidats de préférence autochtones dans les municipes et districts où la population autochtone dépasse 40 %.", source: "https://congresogro.gob.mx/legislacion/ordinarias/ARCHI/ley-numero-701-de-reconocimiento-derechos-y-cultura-de-los-pueblos-y-comunidades-indigenas-y-afromexicanas-del-estado-de-guerrero-701-2022-07-19.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "La CRAC-PC continue de fonctionner avec cinq maisons de justice (San Luis Acatlán, Espino Blanco, Zitlaltepec, El Paraíso, Caxitepec) et dénonce la réforme de la loi 701 (Tlachinollan, 15 octobre 2022) ; la Rapporteuse spéciale des Nations unies signale en 2018 de nombreuses poursuites pénales contre des policiers communautaires (A/HRC/39/17/Add.2, § 52).", source: "https://www.tlachinollan.org/a-27-anos-de-la-crac-pc-hasta-que-el-respeto-a-nuestros-derechos-se-haga-justicia/"}
chronologie:
  - {annee: 1995, evenement: "Création de la Police communautaire par des assemblées de communautés de la Costa Chica et de la Montaña (15 octobre), avec 34 communautés et six organisations sociales selon la CRAC-PC."}
  - {annee: 1998, evenement: "Création de la Coordination régionale des autorités communautaires, chargée de la justice et de la rééducation."}
  - {annee: 2011, evenement: "Loi 701 du Guerrero (P.O. du 8 avril) : la Police communautaire est un corps de sécurité publique reconnu (art. 6, fr. XI) ; l'art. 37 reconnaît les fonctions de sécurité, de poursuite et de justice de la CRAC."}
  - {annee: 2018, evenement: "Réforme de l'art. 14 de la Constitution du Guerrero (décret n° 756, P.O. du 21 août) sur les actions de sécurité des communautés, puis réforme de la loi 701 (décret n° 778, P.O. du 24 août) ; la Rapporteuse spéciale de l'ONU mentionne la police communautaire du Guerrero (A/HRC/39/17/Add.2)."}
  - {annee: 2020, evenement: "La Cour suprême invalide le décret n° 778 le 20 avril (action en inconstitutionnalité 81/2018) faute de consultation libre, préalable, éclairée et culturellement adaptée des peuples autochtones et afromexicains, et donne douze mois au Congrès pour consulter."}
  - {annee: 2022, evenement: "Projet de réforme de la loi 701 soumis à consultation (avril), refusée par la CRAC-PC ; décret n° 183 publié le 5 juillet, transmis à la Cour suprême en exécution de la décision de 2020 : création du Système de sécurité communautaire autochtone et afromexicain et de la Police autochtone et afromexicaine."}
  - {annee: 2025, evenement: "Nouvelle réforme de l'art. 14 de la Constitution du Guerrero (décret n° 182, P.O. du 17 juillet)."}
