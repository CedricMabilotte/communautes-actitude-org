  verifie: ["Texte en vigueur de la loi 701 (version du Congrès du Guerrero, réforme du 5 juillet 2022) : art. 6 fr. XI, 26, 30, 35 à 42 novies, transitoires du décret n° 183.", "Art. 11 et 14 de la Constitution du Guerrero et liste des décrets de réforme de l'art. 14 (2018, 2025).", "Rapport A/HRC/39/17/Add.2, § 52.", "Refus de la consultation de 2022 par la CRAC-PC (El Faro de la Costa Chica, 1er avril 2022).", "Invalidation du décret n° 778 par la Cour suprême le 20 avril 2020, action en inconstitutionnalité 81/2018 (communiqué de Tlachinollan).", "Date de fondation, cinq maisons de justice, 215 communautés et 29 municipes selon la CRAC-PC (Tlachinollan, 2022)."]
  non_confirme: ["Texte original de l'art. 37 à 39 de la loi 701 (2011) cité d'après un article de presse de 2013 (El Sur), non d'après le Périodique officiel.", "Contenu du décret n° 778 de 2018 à l'égard de la CRAC-PC : la décision de 2020 n'a été vue qu'à travers le communiqué de Tlachinollan.", "Population couverte et surface du territoire d'intervention de la CRAC-PC.", "Chiffres de 215 communautés et 29 municipes : déclaration de l'organisation, sans recensement public ; ils peuvent inclure des groupes issus de scissions.", "Présence de communautés afromexicaines dans le système de la CRAC-PC."]
