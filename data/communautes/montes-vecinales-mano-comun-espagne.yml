resume: >-
  Fiche agrégée : elle couvre les communautés de voisins propriétaires de montes vecinales en mano común (bois, landes et pâturages de voisinage tenus « en main commune », c'est-à-dire en propriété collective sans parts). La loi d'État 55/1980 du 11 novembre les définit comme des terres qui appartiennent à des groupements de voisins « en leur qualité de groupes sociaux et non d'entités administratives » et qui sont exploitées en commun selon la coutume ; elles sont indivisibles, inaliénables, imprescriptibles et insaisissables. La Galice, compétente en vertu de son Statut d'autonomie (art. 27, n° 11), les régit par sa loi 13/1989 du 10 octobre ; les Asturies les régissent par le titre II de leur loi 3/2004 sur les montes. En 2018, la Galice comptait 3 312 montes vecinales classés couvrant 664 230 ha, selon l'annuaire forestier de la Xunta cité par l'Association forestière de Galice.
