reconnaissance_onu:
  - {mecanisme: "registre_apac", detail: "Le monte vecinal de Froxán (commune de Lousame, 100 ha, classé en 1977) est inscrit depuis 2017 au registre des APAC (ICCA Registry) et, selon sa fiche publiée par le PNUE-WCMC en octobre 2018, à la base mondiale des aires protégées (WDPA) après un examen national par les pairs ; l'inscription est auto-déclarée. Le registre présente aussi les montes vecinales de Santiago de Covelo (environ 700 ha) et de Teis (Vigo, communauté constituée en 1998).", annee: 2017, source: "https://www.iccaregistry.org/en/explore/Spain/froxan-common-woodlands"}
base_nationale:
  - {instrument: "Loi 55/1980 du 11 novembre sur les montes vecinales en mano común (État), art. 1 à 15", nature: "loi", annee: 1980, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1980-25463"}
  - {instrument: "Statut d'autonomie de Galice (loi organique 1/1981), art. 27, n° 11 : compétence exclusive sur le régime juridique des montes vecinales en mano común", nature: "statut_autonomie", annee: 1981, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  - {instrument: "Loi galicienne 13/1989 du 10 octobre sur les montes vecinales en mano común (texte consolidé au 31 décembre 2021)", nature: "loi", annee: 1989, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
  - {instrument: "Loi 43/2003 du 21 novembre sur les montes (État), art. 2.1 et 11.4", nature: "loi", annee: 2003, source: "https://www.boe.es/eli/es/l/2003/11/21/43/con"}
  - {instrument: "Loi des Asturies 3/2004 du 23 novembre sur les montes et l'aménagement forestier, titre II (art. 102 et suivants)", nature: "loi", annee: 2004, source: "https://www.boe.es/eli/es-as/l/2004/11/23/3/con"}
  - {instrument: "Loi galicienne 7/2012 du 28 juin sur les montes de Galice, art. 125 (quotes-parts de réinvestissement)", nature: "loi", annee: 2012, source: "https://www.boe.es/eli/es-ga/l/2012/06/28/7/con"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'administration, la jouissance et la disposition du monte appartiennent « exclusivement » à la communauté propriétaire (loi 55/1980, art. 5.1). En Galice, l'assemblée générale de tous les comuneros (membres) est l'« organe suprême » et élit pour quatre ans au plus une junta rectora (conseil de direction) dont le président représente la communauté (loi 13/1989, art. 14 et 15). Si la communauté n'existe plus ou ne respecte pas les règles d'organisation du règlement de 1992, la consellería (département régional) chargée des montes assure une gestion conservatoire du monte au bénéfice de la communauté et la propose à la commune (loi 13/1989, art. 20, rédaction de 2021).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
  pouvoir_normatif: {valeur: "partiel", note: "La communauté adopte ses statuts, qui règlent les droits des membres, les organes et la répartition des usages « dans les limites établies par les lois » (loi 55/1980, art. 4.1 et 5.4). En Galice, les statuts sont « la norme qui régit son fonctionnement » et doivent reprendre les usages et coutumes de la communauté (loi 13/1989, art. 16.1) ; ils sont transmis pour information au registre général des montes vecinales (art. 16.2).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les montes vecinales en mano común sont « indivisibles, inaliénables, imprescriptibles et insaisissables » et leur propriété appartient, sans parts, aux voisins qui composent à chaque moment le groupe (loi 55/1980, art. 2). La classification par le jury provincial attribue la propriété à la communauté et sert de titre d'inscription au registre foncier (art. 13). La loi galicienne précise que cette propriété est « privée et collective » (loi 13/1989, art. 3.1) ; la loi 43/2003 les range parmi les montes privés (art. 11.4).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1980-25463"}
  ressources: {valeur: "reconnu", note: "L'usage et la jouissance du monte appartiennent « exclusivement » à la communauté titulaire, selon ses statuts et la loi (loi 13/1989, art. 21.1) ; la communauté peut répartir des lots entre ses membres pour onze ans au plus (art. 22) et consentir des droits de superficie jusqu'à trente ans (art. 7). La loi d'État sur les montes s'applique « sans préjudice » de cette législation spéciale (loi 43/2003, art. 2.1).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
  consentement: {valeur: "partiel", note: "L'expropriation ou l'imposition de servitudes d'utilité publique exige une déclaration expresse, un rapport du ministère et l'audition des communautés touchées (« oídas las comunidades afectadas »), sans droit de veto ; l'indemnité est investie dans des ouvrages ou services d'intérêt général pour la communauté (loi 55/1980, art. 3.2). En Galice, l'expropriation n'est possible que pour une utilité publique qui prévaut sur celle du monte, et l'indemnité sert à l'amélioration du monte ou à des services de la communauté, ou à défaut est répartie entre les comuneros (loi 13/1989, art. 6). Les actes de disposition exigent l'accord des trois quarts des membres (loi 55/1980, art. 5.2).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1980-25463"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les montes vecinales ne sont soumis à aucune contribution de base territoriale (loi 55/1980, art. 2). La communauté gère ses recettes et fait approuver ses comptes par l'assemblée (loi 13/1989, art. 18.2) ; en Galice, elle doit réinvestir dans le monte au moins 40 % de tous ses revenus, dont 10 % de cette part pour la prévention des incendies (loi 7/2012, art. 125). Aucun pouvoir fiscal.", source: "https://www.boe.es/eli/es-ga/l/2012/06/28/7/con"}
  representation: {valeur: "partiel", note: "Le jury provincial qui classe les montes compte un représentant de la communauté propriétaire concernée (loi 55/1980, art. 9) ; en Galice, il compte un représentant des communautés de la province et deux de la communauté concernée (loi 13/1989, art. 10) ; aux Asturies, un représentant élu par l'ensemble des communautés et deux de la communauté concernée (loi 3/2004, art. 107). Aucune représentation au niveau de l'État.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-3358"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Fin 2018, 3 312 montes vecinales étaient classés en Galice pour 664 230 ha, dont 1 258 dans la province d'Ourense, selon l'annuaire statistique forestier de la Xunta cité par l'Association forestière de Galice. Une étude universitaire de 2020 (revue Land) indique qu'environ un quart du territoire galicien est classé en terres communes appartenant à quelque 3 300 communautés. Pour Froxán, le registre des APAC indique que l'activité minière a laissé une dégradation et des litiges fonciers qui se poursuivent.", source: "https://www.mdpi.com/2073-445X/9/1/9"}
chronologie:
  - {annee: 1968, evenement: "Loi 52/1968 du 27 juillet : première loi d'État sur les montes vecinales en mano común."}
  - {annee: 1980, evenement: "Loi 55/1980 du 11 novembre : régime actuel de l'État, gestion exclusive par la communauté."}
  - {annee: 1981, evenement: "Statut d'autonomie de Galice : compétence exclusive sur le régime juridique de ces montes (art. 27, n° 11)."}
  - {annee: 1989, evenement: "Loi galicienne 13/1989 du 10 octobre sur les montes vecinales en mano común."}
  - {annee: 1990, evenement: "Le Tribunal constitutionnel admet un recours contre la loi galicienne et suspend son article 10 (jurys provinciaux)."}
  - {annee: 1999, evenement: "Arrêt du Tribunal constitutionnel 127/1999 du 1er juillet : la vice-présidence du jury par un magistrat (article 10) et la troisième disposition additionnelle de la loi galicienne sont déclarées nulles."}
  - {annee: 2003, evenement: "Loi 43/2003 sur les montes : les montes vecinales en mano común sont des montes privés à régime spécial (art. 11.4)."}
  - {annee: 2004, evenement: "Loi des Asturies 3/2004 : titre II consacré aux montes vecinales en mano común."}
  - {annee: 2012, evenement: "Loi galicienne 7/2012 sur les montes : quote-part minimale de réinvestissement de 40 % (art. 125)."}
  - {annee: 2018, evenement: "3 312 montes vecinales classés en Galice, 664 230 ha."}
fiabilite:
  verifie: ["Définition, caractères (indivisibles, inaliénables, imprescriptibles, insaisissables), gestion exclusive par la communauté, statuts, audition en cas d'expropriation, composition du jury provincial (État), compétence de la juridiction ordinaire sur la propriété : texte de la loi 55/1980 sur le BOE.", "Propriété privée et collective, assemblée générale, junta rectora, statuts, lots, gestion conservatoire, composition du jury provincial galicien, suspension de 1990 et arrêt 127/1999 (passage annulé : vice-présidence par un magistrat ; troisième disposition additionnelle) : texte consolidé de la loi galicienne 13/1989 sur le BOE.", "Article 125 de la loi galicienne 7/2012 (réinvestissement de 40 %) : texte consolidé sur le BOE.", "Articles 2.1 et 11.4 de la loi 43/2003 ; titre II de la loi des Asturies 3/2004 (art. 102 à 107) ; article 8.4 de la loi de Castille-et-León 3/2009 qui mentionne ces montes : BOE.", "Nombre (3 312) et surface (664 230 ha) des montes classés en Galice en 2018, répartition par province : Association forestière de Galice, d'après l'annuaire forestier de la Xunta.", "Fiches de Froxán (inscription en 2017, publication par le PNUE-WCMC en octobre 2018), Santiago de Covelo et Teis : registre des APAC."]
  non_confirme: ["Nombre de comuneros (membres) et population concernée : aucune source chiffrée trouvée.", "Nombre de montes vecinales classés aux Asturies, en Castille-et-León (León, Zamora) et ailleurs en Espagne : non trouvé ; total national inconnu.", "Le chiffre de 3 312 compte des montes classés ; le nombre de communautés constituées avec statuts peut différer.", "Les litiges sur la propriété relèvent de la juridiction ordinaire (loi 55/1980, art. 10.9) et les décisions du jury du contentieux administratif : aucune juridiction propre.", "Aucun document de la Convention sur la diversité biologique visant ce régime : recherche dans les 4e, 5e et 6e rapports nationaux de l'Espagne sans résultat.", "Nombre de villages : non trouvé. Le registre en ligne de la Xunta (ovmediorural.xunta.gal) situe chaque monte par commune et paroisse, sans décompte des villages.", "Liste officielle des montes classés : consultable fiche par fiche sur ovmediorural.xunta.gal (avec une couche cartographique de 2025), non exploitée ; d'où l'absence de tableau."]
