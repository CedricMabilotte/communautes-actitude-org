resume: >-
  Chamorros et Caroliniens, peuples autochtones des îles Mariannes du Nord, ancien élément du Territoire sous tutelle des îles du Pacifique administré par les États-Unis. Le Pacte (Covenant) de 1976 établit un Commonwealth en union politique avec les États-Unis ; la fin de la tutelle a été constatée par le Conseil de sécurité en 1990. La Constitution du Commonwealth réserve l'acquisition de droits permanents ou de longue durée sur les terres aux personnes « d'ascendance nord-mariannaise » (art. XII) et déclare les terres publiques propriété collective de ces personnes (art. XI). Le chamorro et le carolinien sont langues officielles avec l'anglais. Les Chamorros de Guam, territoire voisin, font l'objet de la fiche « Chamorros de Guam ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Résolution 683 du Conseil de sécurité : les populations des îles Mariannes septentrionales ont exercé leur droit à l'autodétermination en approuvant le pacte de Commonwealth par un plébiscite observé par une mission de visite du Conseil de tutelle ; l'accord de tutelle cesse de s'appliquer", annee: 1990, source: "https://documents.un.org/api/symbol/access?s=S/RES/683(1990)&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Covenant to Establish a Commonwealth of the Northern Mariana Islands in Political Union with the United States of America, art. VIII, s. 805", nature: "traite", annee: 1976, source: "https://cnmilaw.org/cons.php"}
  - {instrument: "Constitution du Commonwealth des Îles Mariannes du Nord, art. XI, XII, XXII", nature: "constitution", annee: 1978, source: "https://cnmilaw.org/cons.php"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution, dont plusieurs dispositions sont imposées par le Covenant, établit un exécutif, une législature et une justice propres au Commonwealth ; ces institutions sont celles de tous les habitants, non des seuls Chamorros et Caroliniens. Un assistant exécutif aux affaires caroliniennes, accepté par la communauté carolinienne, conseille le gouverneur (art. III, s. 18).", source: "https://cnmilaw.org/cons.php"}
  pouvoir_normatif: {valeur: "partiel", note: "La législature du Commonwealth adopte des lois dans le cadre du Covenant et du droit fédéral applicable.", source: "https://cnmilaw.org/cons.php"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "« L'acquisition de droits permanents et de longue durée sur les biens immobiliers du Commonwealth est réservée aux personnes d'ascendance nord-mariannaise » (art. XII, s. 1), en application du Covenant (s. 805), qui impose cette restriction pendant vingt-cinq ans après la fin de la tutelle et la permet ensuite ; est d'ascendance nord-mariannaise un citoyen ou ressortissant des États-Unis ayant « au moins un certain degré » d'ascendance chamorro ou carolinienne des Mariannes du Nord (art. XII, s. 4, modifié en 2014) ; toute transaction contraire est nulle (art. XII, s. 6).", source: "https://cnmilaw.org/cons.php"}
  ressources: {valeur: "partiel", note: "Les terres publiques et les terres submergées au large du Commonwealth appartiennent collectivement au peuple du Commonwealth d'ascendance nord-mariannaise (art. XI, s. 1) ; leur gestion a été confiée à une corporation publique dont les directeurs devaient être de cette ascendance et agir à son bénéfice (art. XI, s. 4) ; la Constitution prévoyait sa dissolution après douze ans et le transfert de ses fonctions à l'exécutif (s. 4 f)).", source: "https://cnmilaw.org/cons.php"}
  consentement: {valeur: "conteste", note: "La Constitution réserve le vote sur les amendements à l'article XII aux électeurs d'ascendance nord-mariannaise (art. XVIII, s. 5 c)) ; la Cour d'appel du neuvième circuit a jugé cette restriction fondée sur la race et contraire au quinzième amendement de la Constitution des États-Unis, et a confirmé l'interdiction de l'appliquer prononcée par la cour de district (Davis v. Commonwealth Election Commission, 27 décembre 2016).", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2016/12/27/14-16090.pdf"}
  langue: {valeur: "reconnu", note: "« La langue officielle du Commonwealth est le chamorro, le carolinien et l'anglais » (art. XXII, s. 3).", source: "https://cnmilaw.org/cons.php"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le gouverneur nomme, avec l'avis conforme du Sénat, un responsable exécutif résident pour les affaires autochtones (resident executive for indigenous affairs), d'ascendance nord-mariannaise, chargé notamment de défendre les positions des peuples autochtones (art. III, s. 23, 1985) ; au moins un des cinq administrateurs du Marianas Public Land Trust (fonds qui place les revenus des terres publiques) doit être d'ascendance carolinienne (art. XI, s. 6 a)). Aucun siège n'est réservé dans la législature.", source: "https://cnmilaw.org/cons.php"}
  statut_personnel: {valeur: "partiel", note: "Statut d'« ascendance nord-mariannaise » défini par la Constitution (art. XII, s. 4), certifié par la Cour supérieure pour les personnes de moins d'un quart d'ascendance (amendement de 2014) ; il conditionne l'accès à la propriété foncière.", source: "https://cnmilaw.org/cons.php"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La restriction foncière de l'article XII reste appliquée par les tribunaux : en 2024, la Cour suprême du Commonwealth rappelle que seules les personnes d'ascendance nord-mariannaise peuvent détenir des droits permanents ou de longue durée et tranche un litige successoral sur ce statut (Pangelinan v. Pangelinan, 2024 MP 5). En 2016, la Cour d'appel du neuvième circuit a rappelé que l'article XII avait été jugé conforme à la Constitution des États-Unis dans l'arrêt Wabol, mais a invalidé la réservation aux personnes d'ascendance nord-mariannaise du vote sur sa modification (Davis v. Commonwealth Election Commission).", source: "https://cnmilaw.org/pdf/supreme/2024-MP-05.pdf"}
chronologie:
  - {annee: 1947, evenement: "Accord de tutelle : Territoire sous tutelle des îles du Pacifique administré par les États-Unis."}
  - {annee: 1976, evenement: "Covenant établissant le Commonwealth des Îles Mariannes du Nord."}
  - {annee: 1978, evenement: "Entrée en vigueur de la Constitution du Commonwealth (9 janvier), ratifiée par les électeurs le 6 mars 1977."}
  - {annee: 1985, evenement: "Amendements de la deuxième convention constitutionnelle : responsable exécutif résident pour les affaires autochtones, langues officielles chamorro, carolinien et anglais."}
  - {annee: 1990, evenement: "Résolution 683 du Conseil de sécurité : fin de la tutelle pour les Mariannes du Nord."}
  - {annee: 1999, evenement: "Ajout à la Constitution du vote réservé aux personnes d'ascendance nord-mariannaise sur les amendements à l'article XII (art. XVIII, s. 5 c))."}
  - {annee: 2014, evenement: "Amendement de l'article XII, s. 4 : « un certain degré » d'ascendance chamorro ou carolinienne suffit, avec certification par la Cour supérieure en dessous d'un quart."}
  - {annee: 2016, evenement: "Davis v. Commonwealth Election Commission : invalidation du vote réservé sur l'article XII."}
  - {annee: 2020, evenement: "Recensement : 47 329 habitants, dont 12 001 Chamorros et 2 271 Caroliniens déclarant une seule race."}
  - {annee: 2024, evenement: "Pangelinan v. Pangelinan : la Cour suprême du Commonwealth applique l'article XII à un litige successoral."}
fiabilite:
  verifie: ["Entrée en vigueur de la Constitution le 9 janvier 1978 ; art. III s. 18 et 23, XI s. 1, 4 et 6, XII s. 1, 4 et 6, XVIII s. 5 c) et XXII s. 3, et citation du Covenant s. 805 dans le commentaire de l'amendement de 2014 (cnmilaw.org, consulté en octobre 2026).", "Résolution 683 (1990) du Conseil de sécurité.", "Arrêt Davis v. Commonwealth Election Commission (2016) : invalidation de l'art. XVIII s. 5 c), rappel de l'arrêt Wabol sur l'art. XII.", "Arrêt Pangelinan v. Pangelinan, 2024 MP 5 (Cour suprême du Commonwealth).", "Recensement 2020 (U.S. Census Bureau) : population totale, population par race détaillée (profil démographique), 4 municipalités, 135 villages de recensement dont 86 habités, surface terrestre.", "Aucun amendement de l'article XII ni décision de justice le remettant en cause trouvé entre 2024 et octobre 2026."]
