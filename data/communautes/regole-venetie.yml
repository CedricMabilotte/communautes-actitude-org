droits:
  autogouvernement: {valeur: "partiel", note: "Chaque Regola reconnue a la personnalité juridique de droit privé ; son assemblée approuve le laudo et élit les organes de gestion (loi régionale 26/1996, art. 2 et 3). Le président de la Région organise une gestion de substitution, de préférence en consortium, si la Regola cesse de fonctionner (art. 12), et le laudo, les règlements, les élections et les budgets sont soumis à publicité (art. 13).", source: "https://www.consiglioveneto.it/web/crv/dettaglio-legge?numeroDocumento=26&id=1725316&backLink=https%3A%2F%2Fwww.consiglioveneto.it%2Fleggi-regionali%3Fp_p_id&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&pageTitle=&tab=vigente&annoSelezionato=1996"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque Regola est régie par son propre laudo ou statut et par ses coutumes, dans le respect de la Constitution et du droit en vigueur (loi régionale 26/1996, art. 4). La loi 168/2017 reconnaît les domaines collectifs comme « ordinamento giuridico primario delle comunità originarie » (ordre juridique premier des communautés d'origine) doté d'une « capacità di autonormazione » (capacité de se donner ses règles) et leur accorde l'autonomie statutaire (art. 1, al. 1 et 2). Ce pouvoir porte sur l'administration du patrimoine collectif.", source: "https://www.normattiva.it/atto/caricaDettaglioAtto?atto.dataPubblicazioneGazzetta=2017-11-28&atto.codiceRedazionale=17G00181"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le patrimoine ancien, formé des biens agro-sylvo-pastoraux inscrits au livre foncier ou au registre immobilier et appartenant à la Regola au 31 décembre 1952 (loi régionale 26/1996, art. 5), est inaliénable, indivisible, insusceptible d'usucapion (acquisition par possession prolongée) et voué aux activités agro-sylvo-pastorales ; ce lien est annoté aux registres immobiliers (art. 6).", source: "https://www.consiglioveneto.it/web/crv/dettaglio-legge?numeroDocumento=26&id=1725316&backLink=https%3A%2F%2Fwww.consiglioveneto.it%2Fleggi-regionali%3Fp_p_id&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&pageTitle=&tab=vigente&annoSelezionato=1996"}
  ressources: {valeur: "partiel", note: "Les Regole gèrent et utilisent les biens agro-sylvo-pastoraux selon la coutume et leurs statuts, dans le cadre des lois forestières de l'État et de la Région (loi régionale 26/1996, art. 11). Tout changement de destination, permanent ou temporaire (vingt ans au plus), exige l'avis du service forestier et l'autorisation de la Région (art. 7 à 9).", source: "https://www.consiglioveneto.it/web/crv/dettaglio-legge?numeroDocumento=26&id=1725316&backLink=https%3A%2F%2Fwww.consiglioveneto.it%2Fleggi-regionali%3Fp_p_id&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&pageTitle=&tab=vigente&annoSelezionato=1996"}
  consentement: {valeur: "partiel", note: "La Région, les communes et les communautés de montagne doivent recueillir l'avis des Regole dans leurs choix d'urbanisme et d'environnement et motiver leur décision au regard de cet avis ; l'avis est rendu dans les soixante jours et réputé favorable en l'absence de réponse (loi régionale 26/1996, art. 14) ; il s'agit d'une consultation, sans droit de veto.", source: "https://www.consiglioveneto.it/web/crv/dettaglio-legge?numeroDocumento=26&id=1725316&backLink=https%3A%2F%2Fwww.consiglioveneto.it%2Fleggi-regionali%3Fp_p_id&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&pageTitle=&tab=vigente&annoSelezionato=1996"}
