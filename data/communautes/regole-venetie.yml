effectivite: {valeur: "non_etablie", note: "La Région recense 51 Regole constituées et publie la liste des communes où elles possèdent des terres, avec les actes de reconnaissance. Les Regole d'Ampezzo indiquent gérer environ 16 000 hectares de forêt selon un plan d'aménagement forestier et, depuis 1990, le parc naturel des Dolomites d'Ampezzo (11 200 hectares). Ces éléments viennent de la Région et des Regole elles-mêmes ; aucune source indépendante évaluant l'application du régime n'a été trouvée.", source: "https://www.regione.veneto.it/web/enti-locali/regole"}
chronologie:
  - {annee: 1948, evenement: "Décret législatif du 3 mai 1948, n. 1104, qui faisait des Regole du Cadore des personnes de droit public (loi régionale 26/1996, art. 2) ; le tableur régional le cite, sous le numéro 4, pour Nebbiù, Pescul et la Regola Staccata di Vodo."}
  - {annee: 1952, evenement: "Loi 991/1952 sur la montagne, art. 34 ; le 31 décembre 1952 sert de date de référence du patrimoine ancien."}
  - {annee: 1971, evenement: "Loi 1102 du 3 décembre 1971 sur la montagne, art. 10."}
  - {annee: 1975, evenement: "Lois régionales de Vénétie 48/1975 et 49/1975 du 3 mai, citées par la Région comme base de reconnaissance des Regole d'Ampezzo et du Comelico."}
  - {annee: 1985, evenement: "Adoption du laudo actuellement en vigueur des Regole d'Ampezzo."}
  - {annee: 1990, evenement: "Loi régionale 21/1990 du 22 mars : parc naturel des Dolomites d'Ampezzo, confié à la Comunanza des Regole d'Ampezzo."}
  - {annee: 1994, evenement: "Loi 97/1994 sur la montagne, art. 3 : principes de reconnaissance des organisations montagnardes."}
  - {annee: 1996, evenement: "Loi régionale de Vénétie 26/1996 du 19 août sur la réorganisation des Regole."}
  - {annee: 2017, evenement: "Loi 168/2017 du 20 novembre sur les domaines collectifs."}
  - {annee: 2019, evenement: "Reconnaissance des Regole di Cancia (Vodo di Cadore), dernier acte inscrit à la liste régionale."}
