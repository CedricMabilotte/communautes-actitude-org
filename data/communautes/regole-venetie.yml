  - {instrument: "Loi régionale de Vénétie 26/1996 du 19 août 1996, « Riordino delle Regole » (réorganisation des Regole), titre étendu en 2012 aux propriétés collectives du plateau d'Asiago et de Grignano Polesine", nature: "loi", annee: 1996, source: "https://www.consiglioveneto.it/web/crv/dettaglio-legge?numeroDocumento=26&id=1725316&backLink=https%3A%2F%2Fwww.consiglioveneto.it%2Fleggi-regionali%3Fp_p_id&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&pageTitle=&tab=vigente&annoSelezionato=1996"}
