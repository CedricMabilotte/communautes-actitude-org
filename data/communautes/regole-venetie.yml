  non_confirme: ["Le tableur régional compte 59 dénominations distinctes, contre 51 Regole annoncées sur la page de la Région ; certaines lignes désignent peut-être des Regole fusionnées ou des ensembles (ex. Regola di Pozzale e di Tai e Vissà di Cadore). Le tableau de la fiche reprend toutes les dénominations sans les réconcilier.", "Date de mise à jour du tableur régional non indiquée (la page de la Région qui annonce 51 Regole est datée du 16 décembre 2025) ; la colonne « annee » du tableau donne l'année de l'acte de reconnaissance cité par la Région (premier décret au titre de la loi 26/1996 dans l'ordre des dates, ou loi régionale de 1975 ou 1977, ou décret de 1948).", "Objet de la loi régionale 48/1975 : le site des Regole d'Ampezzo la décrit comme une loi sur le changement temporaire de destination des biens à usage touristique, la Région la cite comme base de reconnaissance ; texte non ouvert.", "Nombre de foyers ou de membres (regolieri) et surface totale des Regole : aucune source officielle trouvée.", "Texte de l'article 3 de la loi 97/1994 et de la loi régionale 21/1990 non ouvert sur une base officielle ; contenu repris de la page régionale et du site des Regole d'Ampezzo.", "Aucun document de l'ONU, de la Convention sur la diversité biologique ni du registre ICCA visant ce régime n'a été trouvé.", "La Comunanza des Regole d'Ampezzo, gestionnaire du parc des Dolomites d'Ampezzo, pourrait relever d'un régime propre justifiant une fiche distincte.", "Population : non trouvée (aucun décompte des membres des Regole publié par la Région).", "Nombre de villages : non trouvé."]
