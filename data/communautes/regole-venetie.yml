resume: >-
  Fiche agrégée : elle couvre les Regole de Vénétie, groupements de familles (chaque famille ayant droit forme un « fuoco », foyer) qui possèdent et gèrent en commun des forêts, des pâturages et des alpages. La loi nationale sur la montagne (loi 97/1994, art. 3) demande aux régions de leur reconnaître la personnalité juridique de droit privé ; la loi régionale de Vénétie 26/1996 fixe la procédure de reconnaissance, le régime du « patrimoine ancien » (biens collectifs agro-sylvo-pastoraux, c'est-à-dire voués à l'agriculture, à la forêt et à l'élevage), inaliénable et indivisible, et le gouvernement de chaque Regola par son « laudo » (statut propre) et ses coutumes. La loi nationale 168/2017 sur les domaines collectifs reconnaît à ces ensembles une capacité d'auto-réglementation. La Région dénombre 51 Regole constituées, 50 dans la province de Belluno et une dans celle de Vicence ; la Comunanza des Regole d'Ampezzo, qui réunit onze Regole, gère depuis 1990 le parc naturel régional des Dolomites d'Ampezzo. Le régime national des domaines collectifs a sa propre fiche (« Domaines collectifs d'Italie »).
