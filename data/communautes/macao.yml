resume: >-
  Macao, administré par le Portugal jusqu'en 1999, est depuis le 20 décembre 1999 une Région administrative spéciale de la République populaire de Chine. La Loi fondamentale (texte constitutionnel de la Région) adoptée le 31 mars 1993 par l'Assemblée populaire nationale lui accorde un « haut degré d'autonomie », avec des pouvoirs exécutif, législatif et judiciaire indépendant, y compris le jugement en dernière instance (art. 2). La Région a ses finances, son système fiscal, son territoire douanier et sa politique d'éducation ; le portugais y est langue officielle avec le chinois (art. 9). Le chef de l'exécutif est désigné par un comité électoral de 400 membres puis nommé par le gouvernement central ; l'Assemblée législative compte 33 membres, dont 14 élus au suffrage direct.
