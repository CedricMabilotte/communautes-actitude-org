reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, observations finales sur le deuxième rapport périodique de Macao (Chine), CCPR/C/CHN-MAC/CO/2, adoptées le 22 juillet 2022 : préoccupations sur les interprétations de la Loi fondamentale par le Comité permanent de l'Assemblée populaire nationale, l'absence de suffrage universel et l'exclusion de 21 candidats aux élections législatives de 2021 (par. 4 et 42).", annee: 2022, source: "https://documents.un.org/doc/undoc/gen/g22/583/27/pdf/g2258327.pdf"}
base_nationale:
  - {instrument: "Loi fondamentale de la Région administrative spéciale de Macao de la République populaire de Chine, adoptée le 31 mars 1993, en vigueur le 20 décembre 1999 ; annexes I et II révisées en 2012", nature: "statut_autonomie", annee: 1993, source: "https://www.al.gov.mo/pt/basic-law"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organes propres : chef de l'exécutif, gouvernement et Assemblée législative composés de résidents permanents (Loi fondamentale, art. 3, 45 et 67) ; l'Assemblée compte 33 membres, dont 14 élus au suffrage direct, 12 au suffrage indirect (élus par des collèges sectoriels) et 7 nommés par le chef de l'exécutif (annexe II, révision de 2012) ; le chef de l'exécutif, élu par un comité électoral de 400 membres, est nommé par le gouvernement populaire central et responsable devant lui (art. 45 et 47, annexe I).", source: "https://www.al.gov.mo/pt/basic-law"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée législative exerce le pouvoir législatif de la Région (Loi fondamentale, art. 17 et 67) ; les lois nationales ne s'y appliquent pas, sauf celles de l'annexe III, limitées à la défense, aux relations extérieures et aux matières hors autonomie, et sauf décret du gouvernement central en cas d'état de guerre ou d'urgence (art. 18) ; les lois régionales sont transmises pour enregistrement au Comité permanent de l'Assemblée populaire nationale, qui peut renvoyer, sans la modifier, une loi touchant aux compétences centrales, laquelle cesse alors de produire effet (art. 17) ; ce Comité détient le pouvoir d'interprétation de la Loi fondamentale (art. 143).", source: "https://www.al.gov.mo/pt/basic-law"}
  justice_propre: {valeur: "reconnu", note: "Pouvoir judiciaire indépendant, y compris le jugement en dernière instance, exercé par des tribunaux de première instance, un Tribunal de deuxième instance et un Tribunal de dernière instance (Loi fondamentale, art. 2, 19 et 84) ; les tribunaux n'ont pas compétence sur les actes de l'État (défense, relations extérieures), art. 19.", source: "https://www.al.gov.mo/pt/basic-law"}
  terres: {valeur: "partiel", note: "Les sols de la Région sont propriété de l'État, sauf les terrains reconnus en propriété privée avant 1999 ; le gouvernement de la Région en assure la gestion, l'usage, la location ou la concession, et les recettes reviennent à la Région seule (Loi fondamentale, art. 7).", source: "https://www.al.gov.mo/pt/basic-law"}
  ressources: {valeur: "partiel", note: "Les ressources naturelles sont propriété de l'État, gérées et mises en valeur par le gouvernement de la Région, qui dispose seul des recettes (Loi fondamentale, art. 7).", source: "https://www.al.gov.mo/pt/basic-law"}
  consentement: {valeur: "partiel", note: "Le Comité permanent de l'Assemblée populaire nationale consulte le gouvernement de la Région avant de modifier la liste des lois nationales applicables (Loi fondamentale, art. 18) ; une proposition de révision de la Loi fondamentale venant de la Région requiert l'accord des deux tiers des députés de Macao à l'Assemblée populaire nationale, des deux tiers de l'Assemblée législative et du chef de l'exécutif, mais le pouvoir de révision appartient à l'Assemblée populaire nationale, sans accord requis de la Région (art. 144) ; la modification des modes de désignation du chef de l'exécutif et de formation de l'Assemblée législative requiert les deux tiers de l'Assemblée et l'accord du chef de l'exécutif, puis la ratification ou l'enregistrement par le Comité permanent (annexes I, § 7, et II, § 3).", source: "https://www.al.gov.mo/pt/basic-law"}
  langue: {valeur: "reconnu", note: "Le portugais est langue officielle avec le chinois et peut être employé par les organes exécutif, législatif et judiciaires (Loi fondamentale, art. 9).", source: "https://www.al.gov.mo/pt/basic-law"}
  education: {valeur: "reconnu", note: "Le gouvernement de la Région fixe lui-même la politique d'éducation : système scolaire, langues d'enseignement, budget, évaluation, reconnaissance des diplômes (Loi fondamentale, art. 121).", source: "https://www.al.gov.mo/pt/basic-law"}
  fiscalite: {valeur: "reconnu", note: "Finances indépendantes : la Région dispose de toutes ses recettes, qui ne sont pas versées au gouvernement central, lequel ne lève aucun impôt à Macao (Loi fondamentale, art. 104) ; système fiscal propre, la Région légiférant sur les types et taux d'impôts (art. 106) ; territoire douanier distinct (art. 112).", source: "https://www.al.gov.mo/pt/basic-law"}
  representation: {valeur: "partiel", note: "Les résidents de nationalité chinoise élisent localement les députés de la Région à l'Assemblée populaire nationale, selon le nombre de sièges et la méthode fixés par celle-ci (Loi fondamentale, art. 21).", source: "https://www.al.gov.mo/pt/basic-law"}
  statut_personnel: {valeur: "reconnu", note: "Statut de résident permanent (citoyens chinois nés à Macao ou y résidant depuis sept ans, Portugais nés à Macao ou y résidant depuis sept ans avec domicile permanent, autres personnes après sept ans de résidence) ouvrant le droit de résidence et la carte d'identité de résident permanent (Loi fondamentale, art. 24) ; droit de vote et d'éligibilité réservé aux résidents permanents (art. 26).", source: "https://www.al.gov.mo/pt/basic-law"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité des droits de l'homme de l'ONU relève en 2022 que l'interprétation de la Loi fondamentale par le Comité permanent de l'Assemblée populaire nationale en 2011 a soumis les réformes politiques locales à l'autorité du gouvernement central, que Macao n'a pas annoncé l'instauration du suffrage universel et maintient sa réserve à l'article 25 b) du Pacte, et qu'en juillet 2021 la Commission des affaires électorales a exclu 21 candidats aux élections de l'Assemblée législative au motif qu'ils n'étaient « pas loyaux » envers la Région et ne « soutenaient pas » la Loi fondamentale (CCPR/C/CHN-MAC/CO/2, par. 4 et 42).", source: "https://documents.un.org/doc/undoc/gen/g22/583/27/pdf/g2258327.pdf"}
chronologie:
  - {annee: 1993, evenement: "Adoption de la Loi fondamentale par l'Assemblée populaire nationale le 31 mars."}
  - {annee: 1999, evenement: "Établissement de la Région administrative spéciale le 20 décembre ; entrée en vigueur de la Loi fondamentale."}
  - {annee: 2009, evenement: "Loi n° 2/2009 sur la défense de la sécurité nationale."}
  - {annee: 2011, evenement: "Interprétation de la Loi fondamentale par le Comité permanent de l'Assemblée populaire nationale sur la désignation du chef de l'exécutif et la formation de l'Assemblée législative."}
  - {annee: 2012, evenement: "Révision des annexes I et II : comité électoral porté à 400 membres, Assemblée législative à 33 membres dont 14 élus au suffrage direct à partir de 2013."}
  - {annee: 2021, evenement: "Exclusion de 21 candidats aux élections de l'Assemblée législative par la Commission des affaires électorales."}
  - {annee: 2022, evenement: "Observations finales du Comité des droits de l'homme de l'ONU sur le deuxième rapport périodique de Macao (22 juillet)."}
  - {annee: 2024, evenement: "Élection de Sam Hou Fai, seul candidat, comme chef de l'exécutif le 13 octobre ; entrée en fonction le 20 décembre."}
