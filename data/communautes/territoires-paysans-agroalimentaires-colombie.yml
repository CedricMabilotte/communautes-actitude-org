effectivite: {valeur: "partielle", note: "Huit TECAM constitués entre octobre 2025 et juillet 2026 ; en juillet 2026, la presse indique que la formalisation « avance lentement » et que le dossier de La Libertad (TECAM El Toro, Cesar), achevé devant l'Agence nationale des terres, reste bloqué par des obstacles administratifs.", source: "https://www.colombiainforma.info/caravana-humanitaria-recorrera-seis-departamentos-para-visibilizar-los-tecam/"}
chronologie:
  - {annee: 2023, evenement: "Acte législatif 01 (5 juillet) : la Constitution reconnaît le campesinado comme sujet de droits et ses formes de territorialité."}
  - {annee: 2023, evenement: "La loi 2294 (art. 359) charge le gouvernement de reconnaître et formaliser les territorialités paysannes, dont les TECAM."}
  - {annee: 2024, evenement: "Décret 780 du 24 juin : procédure de constitution des TECAM et plans de vie digne."}
  - {annee: 2025, evenement: "Accord 531 du 29 octobre : le conseil de direction de l'Agence nationale des terres constitue le TECAM Nuevo Amanecer (Cesar), premier du pays."}
  - {annee: 2025, evenement: "L'Agence nationale des terres déclare recevable la demande du TECAM Tuta Xua (Sogamoso, Boyacá) en décembre."}
  - {annee: 2025, evenement: "Accords 559 et 560 du 23 décembre : TECAM Ciénaga de la Zapatosa (Cesar) et Vida y Soberanía Popular (Arauca)."}
  - {annee: 2026, evenement: "Accords 568 et 569 du 25 février : TECAM Paz y Soberanía (Bolívar) et Del Piedemonte Araucano (Arauca)."}
  - {annee: 2026, evenement: "Accords 591 et 592 du 19 juin : TECAM Cacique Poima (Santander) et Cañón de los ríos Lagunilla y Azufrado (Tolima)."}
  - {annee: 2026, evenement: "Accord 601 du 16 juillet : TECAM Macizo Isnos (Huila)."}
fiabilite:
  verifie:
    - "Définition du TECAM, rôle autonome des formes organisationnelles paysannes et absence de titre collectif de propriété : décret 780 de 2024, art. 2.14.26.1.3."
    - "Constitution du TECAM Nuevo Amanecer par l'accord 531 du 29 octobre 2025 : 6 286 ha et 3 943 m², Tamalameque, Chimichagua et Pailitas (Cesar) ; 214 familles et neuf veredas selon l'Agence nationale des terres."
    - "Huit accords de constitution de TECAM dans la liste des accords du conseil de direction de l'Agence nationale des terres (531, 559, 560, 568, 569, 591, 592, 601) ; extensions lues à l'article 2 de chaque accord."
    - "Article 359 de la loi 2294 de 2023 et nouvel article 64 de la Constitution (acte législatif 01 de 2023)."
  non_confirme:
    - "Accords postérieurs à l'accord 614 (publié le 26 août 2026) non consultés ; demandes signalées à Sogamoso (Tuta Xua), à Agustín Codazzi (El Toro), dans le Cauca, le Nariño et le Chocó."
    - "Localités du TECAM Nuevo Amanecer : sept veredas et 6 295,59 ha selon la presse, neuf veredas selon l'Agence nationale des terres."
    - "Le décret cite parmi les objectifs des mécanismes propres de protection (gardes paysannes) et de règlement alternatif des conflits, sans en faire une juridiction (art. 2.14.26.2.2)."
    - "Effet du changement de gouvernement d'août 2026 sur l'instruction des demandes."
