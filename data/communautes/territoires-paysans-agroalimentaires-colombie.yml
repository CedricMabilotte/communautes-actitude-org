resume: >-
  Fiche agrégée. Le décret 780 de 2024 crée le régime des territoires paysans agroalimentaires (TECAM) : des zones délimitées, habitées et organisées par des familles, communautés et organisations paysannes. Leurs « formes organisationnelles paysannes » adoptent de façon autonome les décisions sur la régulation, l'aménagement et la représentation du territoire, selon un plan de vie digne. Le décret précise que le TECAM ne constitue pas un titre collectif de propriété. Le conseil de direction de l'Agence nationale des terres a constitué le premier TECAM, Nuevo Amanecer (Cesar), le 29 octobre 2025, puis sept autres jusqu'en juillet 2026, dans six départements ; d'autres demandes sont en cours d'instruction.
