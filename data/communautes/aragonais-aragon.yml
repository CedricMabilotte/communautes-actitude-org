  - {instrument: "Loi 2/2016 du 28 janvier de mesures fiscales et administratives, art. 35 (modifie l'art. 4.1 de la loi 3/1999 du patrimoine culturel aragonais : désignation de l'aragonais et du catalan d'Aragon)", nature: "loi", annee: 2016, source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2016-2408"}
  - {instrument: "Arrêt du Tribunal constitutionnel 110/2011 du 22 juin 2011 (recours de La Rioja contre la réforme du Statut)", nature: "jurisprudence", annee: 2011, source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2011-12500"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les institutions de la Communauté sont les Cortes, le Président, le Gouvernement ou Diputación General et le Justicia (défenseur des droits propre), Statut, art. 32 ; les Cortes, monocamérales, comptent de 65 à 80 députés élus au suffrage universel direct, art. 36 et 37.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les Cortes représentent le peuple aragonais et exercent le pouvoir législatif, Statut, art. 33.1 ; compétence exclusive sur la conservation, la modification et le développement du droit foral aragonais, art. 71.2 ; le Code du droit foral de 2011 fait de la loi, de la coutume et des principes généraux les sources du droit civil aragonais, le droit civil de l'État n'étant que supplétif, art. 1.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  justice_propre: {valeur: "partiel", note: "Le Tribunal supérieur de justice d'Aragon, juridiction de l'État, est l'organe où culmine l'organisation judiciaire en Aragon et juge les pourvois en cassation fondés sur la violation du droit propre de l'Aragon, Statut, art. 63 ; compétence exclusive sur le droit procédural dérivé des particularités du droit aragonais, art. 71.3.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur les montes (terres boisées et pastorales) et les voies de transhumance, pâturages compris, Statut, art. 71.20 ; le Code du droit foral de 2011 régit l'alera foral (servitude de pâturage de jour entre territoires de villages voisins), régie par le titre et la coutume locale ou comarcale, art. 582, et les ademprios (droits traditionnels de pâturage, de bois de chauffage et autres usages), régis d'abord par le titre écrit ou la possession immémoriale, puis par la coutume, et présumés de durée indéfinie en cas de titularité communautaire, art. 584.", source: "https://www.boe.es/buscar/act.php?id=BOA-d-2011-90007"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur les eaux qui coulent entièrement sur le territoire, les eaux minérales et thermales, Statut, art. 72.1, et sur la chasse, la pêche fluviale et lacustre, art. 71.23 ; participation seulement à la planification des bassins intercommunautaires comme l'Èbre, art. 72.2.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige un vote des deux tiers des Cortes d'Aragon puis une loi organique, et peut être soumise à référendum de ratification, Statut, art. 115 ; la Communauté émet un avis obligatoire sur tout projet d'ouvrage hydraulique ou de transfert d'eau affectant son territoire, art. 72.3.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  langue: {valeur: "partiel", note: "Les langues et modalités linguistiques propres sont protégées et une loi fixe leurs zones d'usage, Statut, art. 7 ; la loi 3/2013 reconnaît le droit de les utiliser devant les administrations aragonaises dans ces zones, art. 3 et 16, le castillan restant seule langue officielle, art. 2 ; la loi 2/2016, art. 35, en modifiant l'art. 4.1 de la loi 3/1999 du patrimoine culturel aragonais, les nomme « l'aragonais et le catalan d'Aragon ».", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2013-6103"}
  education: {valeur: "reconnu", note: "Compétence partagée avec l'État sur l'enseignement à tous les niveaux, c'est-à-dire législation et exécution dans le cadre des bases fixées par l'État, Statut, art. 73, comme dans les autres communautés autonomes ; la loi 3/2013 reconnaît le droit de recevoir l'enseignement des langues propres dans leurs zones d'usage, à titre volontaire, art. 12.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  fiscalite: {valeur: "partiel", note: "Finances propres dans le cadre de la loi organique de financement des communautés autonomes, Statut, art. 103 ; pouvoir d'établir des impôts propres et de fixer taux et déductions des impôts cédés, art. 105 ; accord bilatéral économique et financier avec l'État, formalisé en commission mixte, art. 108 et 109.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  representation: {valeur: "reconnu", note: "Les Cortes d'Aragon désignent les sénateurs de désignation autonomique, Statut, art. 41 c ; la Constitution réserve à chaque communauté autonome un sénateur et un de plus par million d'habitants, désignés par son assemblée législative, art. 69.5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  statut_personnel: {valeur: "partiel", note: "La condition politique d'Aragonais est attribuée aux citoyens espagnols domiciliés dans une commune d'Aragon, Statut, art. 4 ; le droit foral s'applique aux personnes de vecindad civil (rattachement civil) aragonaise quel que soit leur lieu de résidence, art. 9.2.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2007-8444"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité d'experts de la Charte européenne des langues, dans son rapport adopté le 18 juin 2024, relève que l'aragonais est enseigné au moins 90 minutes par semaine dans près de 60 écoles à plus de 1 300 élèves, mais que les financements de sa promotion ont été supprimés à partir de 2023, que la direction générale de politique linguistique a été fermée et que les autorités régionales ont annoncé vouloir modifier la loi 3/1999 qui nomme l'aragonais et le catalan.", source: "https://rm.coe.int/spainecrml6-en/1680b1b32d"}
chronologie:
  - {annee: 1982, evenement: "Premier Statut d'autonomie d'Aragon (loi organique 8/1982 du 10 août)."}
  - {annee: 1994, evenement: "Première réforme du Statut (loi organique 6/1994 du 24 mars)."}
  - {annee: 1996, evenement: "Deuxième réforme du Statut (loi organique 5/1996 du 30 décembre)."}
  - {annee: 2007, evenement: "Nouveau Statut (loi organique 5/2007 du 20 avril) : nationalité historique, droit foral, accord bilatéral économique et financier."}
  - {annee: 2009, evenement: "Loi 10/2009 du 22 décembre sur l'usage, la protection et la promotion des langues propres d'Aragon."}
  - {annee: 2011, evenement: "Code du droit foral d'Aragon (décret législatif 1/2011) ; arrêt 110/2011 du Tribunal constitutionnel sur la réforme du Statut."}
  - {annee: 2013, evenement: "La loi 3/2013 du 9 mai remplace la loi 10/2009."}
  - {annee: 2016, evenement: "La loi 2/2016 du 28 janvier modifie la loi 3/1999 du patrimoine culturel aragonais pour désigner l'aragonais et le catalan d'Aragon comme langues propres."}
  - {annee: 2023, evenement: "Suppression des financements de la promotion de l'aragonais et fermeture de la direction générale de politique linguistique, selon le Comité d'experts de la Charte européenne des langues (rapport adopté le 18 juin 2024)."}
  - {annee: 2022, evenement: "Loi organique 15/2022 du 27 décembre : modification des articles 36 et 38 du Statut (composition des Cortes)."}
fiabilite:
  verifie: ["Statut, texte consolidé au BOE : art. 1, 2, 4, 7, 9, 32, 33, 36, 37, 41, 63, 71, 72, 73, 103, 105, 108, 109, 115 et dispositions additionnelles troisième et cinquième.", "Code du droit foral d'Aragon, art. 1, 582 et 584 (BOE, texte consolidé).", "Loi 3/2013, art. 2, 3, 5, 12, 16 et disposition abrogatoire de la loi 10/2009 (BOE).", "Loi 2/2016, art. 35, qui modifie la loi 3/1999 et non la loi 3/2013 (BOE).", "Disposition additionnelle cinquième et interprétation de l'arrêt 110/2011 (BOE).", "Population au 1er janvier 2025 (INE, tableau 56940, API).", "Mention de l'aragonais et du catalan en Aragon dans le communiqué du Conseil de l'Europe du 24 septembre 2024.", "Constats du Comité d'experts de la Charte sur l'aragonais : coupes budgétaires, fermeture de la direction générale de politique linguistique, enseignement dans près de 60 écoles (rapport adopté le 18 juin 2024).", "Superficie totale de la région ES24 : 47 722 km² en 2024 (Eurostat, tableau reg_area3, API).", "Nomenclátor au 1er janvier 2025 : 731 communes, 1 570 entités de population, 1 423 noyaux et 1 039 zones d'habitat dispersé (communiqué de l'Institut aragonais de statistique du 28 janvier 2026)."]
  non_confirme: ["Conclusion effective de l'accord bilatéral économique et financier prévu à l'article 108 non vérifiée.", "Liste officielle des communes des zones d'usage des langues propres non vérifiée.", "Le Comité d'experts écrit que la loi 3/2013 a été modifiée par la loi 2/2016 ; le texte de la loi 2/2016 au BOE ne modifie que la loi 3/1999 ; une modification ultérieure de la loi 3/2013 ou de la loi 3/1999 n'a pas été vérifiée au Boletín Oficial de Aragón."]
