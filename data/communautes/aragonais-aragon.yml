resume: >-
  Le Statut d'autonomie de 2007 (loi organique 5/2007) qualifie l'Aragon de « nationalité historique » dont les pouvoirs « émanent du peuple aragonais et de la Constitution » ; il lui reconnaît une identité propre fondée sur ses institutions traditionnelles, son droit foral (droit civil historique propre) et sa culture. Les Cortes d'Aragon (Parlement régional) exercent le pouvoir législatif, dont la compétence exclusive sur le droit foral, codifié en 2011. L'aragonais et le catalan d'Aragon sont désignés comme langues propres par la loi du patrimoine culturel aragonais depuis 2016 et protégés, sans statut officiel ; le castillan reste la seule langue officielle. Une disposition additionnelle réserve les droits que le peuple aragonais tient de son histoire, actualisables selon la Constitution.
reconnaissance_regionale:
  - {mecanisme: "charte_langues_regionales", detail: "Selon le communiqué du Conseil de l'Europe du 24 septembre 2024 sur le rapport du Comité d'experts de la Charte européenne des langues régionales ou minoritaires, l'Espagne doit préserver et accorder un certain niveau de protection à l'aragonais et au catalan dans la Communauté autonome d'Aragon.", annee: 2024, source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
