resume: >-
  La minorité allemande est l'une des neuf minorités nationales que la loi polonaise du 6 janvier 2005 reconnaît nommément ; elle vit surtout dans les voïvodies (régions) d'Opole et de Silésie. Dans les communes où elle compte au moins 20 % des habitants selon le dernier recensement, la loi permet d'employer l'allemand comme langue auxiliaire devant les autorités communales ; 22 communes, toutes dans la voïvodie d'Opole, sont inscrites à ce titre. Des noms allemands peuvent être ajoutés aux noms officiels des localités, au-delà du seuil de 20 % ou après consultation des habitants. Le code électoral exempte les listes des organisations de minorités nationales du seuil national de 5 % aux élections du Sejm (chambre basse). La minorité n'a pas d'organe d'autogouvernement propre ; deux de ses représentants siègent à la Commission conjointe du gouvernement et des minorités, organe consultatif.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre sur la Pologne (adopté le 6 novembre 2019) : 147 814 personnes de nationalité allemande au recensement de 2011 ; l'extension de la ville d'Opole aux dépens de communes voisines où vivait un nombre significatif de personnes appartenant à la minorité allemande a privé celles-ci de « droits linguistiques et participatifs dont ils jouissaient avant cette réforme territoriale ».", annee: 2019, source: "https://rm.coe.int/4th-op-poland-fr/16809f91c6"}
reconnaissance_onu: []
base_nationale:
  - {instrument: "Constitution de la République de Pologne du 2 avril 1997, art. 35", nature: "constitution", annee: 1997, source: "https://api.sejm.gov.pl/eli/acts/DU/1997/483/text.pdf"}
  - {instrument: "Loi du 6 janvier 2005 sur les minorités nationales et ethniques et la langue régionale (Dz. U. 2005 n° 17, poz. 141), texte consolidé Dz. U. 2026 poz. 75", nature: "loi", annee: 2005, source: "https://api.sejm.gov.pl/eli/acts/DU/2026/75/text.pdf"}
  - {instrument: "Code électoral du 5 janvier 2011, art. 196 et 197, texte consolidé Dz. U. 2026 poz. 1261", nature: "loi", annee: 2011, source: "https://api.sejm.gov.pl/eli/acts/DU/2026/1261/text.pdf"}
  - {instrument: "Traité entre la République de Pologne et la République fédérale d'Allemagne sur le bon voisinage et la coopération amicale, Bonn, 17 juin 1991, art. 20 à 22 (Dz. U. 1992 n° 14, poz. 56)", nature: "traite", annee: 1991, source: "https://api.sejm.gov.pl/eli/acts/DU/1992/56/text.pdf"}
  - {instrument: "Loi du 7 septembre 1991 sur le système éducatif, art. 13, texte consolidé Dz. U. 2025 poz. 881", nature: "loi", annee: 1991, source: "https://api.sejm.gov.pl/eli/acts/DU/2025/881/text.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Deux représentants de la minorité allemande siègent à la Commission conjointe du gouvernement et des minorités nationales et ethniques, organe consultatif du président du Conseil des ministres qui donne son avis sur les projets de textes et sur la répartition des crédits destinés aux minorités, loi de 2005, art. 23 et 24 ; pour une localité habitée, l'ajout d'un nom en langue minoritaire suppose une consultation préalable de ses habitants par le conseil communal, art. 13, al. 1 ; sous le seuil de 20 %, il faut l'accord de plus de la moitié des participants, art. 12, al. 7.", source: "https://api.sejm.gov.pl/eli/acts/DU/2026/75/text.pdf"}
  langue: {valeur: "partiel", note: "Dans les communes où la minorité représente au moins 20 % des habitants au dernier recensement et qui sont inscrites au registre officiel, l'allemand peut être employé comme langue auxiliaire devant les autorités communales, mais la procédure d'appel se fait uniquement en polonais, loi de 2005, art. 9 et 10 ; des noms allemands peuvent être ajoutés aux noms officiels des localités, après les noms polonais, art. 12.", source: "https://api.sejm.gov.pl/eli/acts/DU/2026/75/text.pdf"}
  education: {valeur: "partiel", note: "Les minorités ont le droit de créer leurs propres établissements d'enseignement, Constitution, art. 35, al. 2 ; l'école publique organise, à la demande des parents, l'enseignement de la langue minoritaire ou dans cette langue, loi sur le système éducatif, art. 13 ; un règlement de 2022 a ramené à une heure par semaine l'allemand enseigné sous forme de cours supplémentaires de langue minoritaire, puis un règlement de 2024 a rétabli trois heures à partir du 1er septembre 2024.", source: "https://api.sejm.gov.pl/eli/acts/DU/2025/881/text.pdf"}
  fiscalite: {valeur: "partiel", note: "Aucun pouvoir fiscal ni budget propre garanti ; les pouvoirs publics peuvent accorder aux organisations de la minorité des subventions ciblées ou de fonctionnement, loi de 2005, art. 18 ; l'État prend en charge le remplacement des panneaux portant les noms en langue minoritaire, art. 15, al. 2.", source: "https://api.sejm.gov.pl/eli/acts/DU/2026/75/text.pdf"}
  representation: {valeur: "partiel", note: "Pas de siège réservé : les comités électoraux formés par les membres d'organisations enregistrées de minorités nationales peuvent être exemptés du seuil national de 5 % aux élections du Sejm, code électoral, art. 197 ; en 2023, la liste de la minorité allemande a été admise à la répartition à ce titre mais n'a obtenu aucun siège avec 25 778 voix.", source: "https://api.sejm.gov.pl/eli/acts/DU/2023/2234/text.pdf"}
  statut_personnel: {valeur: "partiel", note: "L'appartenance à la minorité relève du libre choix de la personne et nul ne peut être tenu de la prouver, loi de 2005, art. 4 ; les membres de la minorité ont le droit d'écrire leurs prénoms et noms selon l'orthographe de leur langue, y compris dans l'état civil et les pièces d'identité, art. 7 ; aucun statut civil propre.", source: "https://api.sejm.gov.pl/eli/acts/DU/2026/75/text.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2019 que l'extension de la ville d'Opole a privé des membres de la minorité allemande de droits linguistiques et participatifs ; les cours supplémentaires d'allemand langue minoritaire ont été limités à une heure par semaine de 2022 à 2024 (règlements Dz. U. 2022 poz. 276 et Dz. U. 2024 poz. 144) ; depuis 2023, la minorité n'a plus de député au Sejm (Dz. U. 2023 poz. 2234).", source: "https://rm.coe.int/4th-op-poland-fr/16809f91c6"}
chronologie:
  - {annee: 1991, evenement: "Traité germano-polonais de bon voisinage du 17 juin : articles 20 à 22 sur les droits de la minorité allemande en Pologne."}
  - {annee: 1991, evenement: "Élections au Sejm du 27 octobre : le comité électoral national de la minorité allemande obtient sept sièges (six sur listes de circonscription, un sur liste nationale)."}
  - {annee: 1997, evenement: "La Constitution reconnaît aux minorités nationales et ethniques le droit de créer leurs propres institutions éducatives et culturelles (art. 35)."}
  - {annee: 2005, evenement: "Loi du 6 janvier sur les minorités nationales et ethniques et la langue régionale : la minorité allemande est reconnue nommément ; langue auxiliaire et noms additionnels."}
  - {annee: 2007, evenement: "Élections au Sejm : la minorité allemande n'a plus qu'un siège."}
  - {annee: 2011, evenement: "Code électoral : exemption du seuil de 5 % pour les listes des organisations de minorités nationales (art. 197)."}
  - {annee: 2019, evenement: "Quatrième avis du Comité consultatif de la Convention-cadre sur la Pologne."}
  - {annee: 2022, evenement: "Règlement du 4 février : les cours supplémentaires d'allemand langue minoritaire passent de trois heures à une heure par semaine à partir du 1er septembre."}
  - {annee: 2023, evenement: "Élections au Sejm du 15 octobre : la liste de la minorité allemande obtient 25 778 voix et aucun siège."}
  - {annee: 2024, evenement: "Règlement du 2 février : trois heures de cours supplémentaires par semaine pour toutes les langues minoritaires à partir du 1er septembre."}
  - {annee: 2025, evenement: "Modification de la loi de 2005 du 9 juillet : la Chancellerie du Sejm assure le soutien des représentants des minorités à la Commission conjointe (art. 30a), en vigueur le 1er novembre."}
fiabilite:
  verifie: ["Loi de 2005, art. 2, 4, 7, 9 à 15, 18, 23 et 24 (texte consolidé Dz. U. 2026 poz. 75).", "Code électoral, art. 196 et 197 (texte consolidé Dz. U. 2026 poz. 1261).", "Résultats officiels des élections au Sejm de 2023 (Dz. U. 2023 poz. 2234) : 25 778 voix, admission à la répartition au titre de l'art. 197, aucun siège.", "Constitution, art. 35.", "Traité de 1991, art. 20 à 22.", "Règlements Dz. U. 2022 poz. 276 et Dz. U. 2024 poz. 144 sur les heures d'enseignement.", "22 communes à langue auxiliaire allemande (Commission de normalisation des noms géographiques, état au 22 septembre 2025).", "Recensement de 2021 : 144 177 personnes d'identification nationale allemande, dont 59 911 dans la voïvodie d'Opole et 27 923 dans celle de Silésie (GUS, tableaux 1 et 2).", "Registre officiel des communes à langue auxiliaire (état au 16 avril 2021) : 22 communes pour l'allemand, toutes dans la voïvodie d'Opole.", "Élections au Sejm de 1991 : sept sièges pour le comité électoral national de la minorité allemande (Monitor Polski 1991 n° 41 poz. 288).", "Quatrième avis du Comité consultatif (6 novembre 2019) : 147 814 Allemands au recensement de 2011 et passage sur l'extension d'Opole."]
  non_confirme: ["Nombre de sièges de 1993 à 2019 (un seul siège en 2007, 2011 et 2015 selon Minority Rights Group, sans source officielle consultée) et résultats aux assemblées régionales et communales : non vérifiés sur source officielle.", "Engagements de la Pologne pour l'allemand au titre de la Charte européenne des langues régionales ou minoritaires : documents non consultés.", "Cinquième avis du Comité consultatif sur la Pologne (visite de 2025) : non publié ou non consulté.", "Aucun document d'un organe de l'ONU nommant la minorité allemande de Pologne n'a été consulté.", "Surface : non trouvée ; aucune source ne donne la superficie cumulée des 22 communes à langue auxiliaire allemande."]
