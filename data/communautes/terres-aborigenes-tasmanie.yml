reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD recommande à l'Australie de protéger les droits fonciers des peuples autochtones et d'inscrire dans la loi le consentement préalable, libre et éclairé (CERD/C/AUS/CO/18-20) ; le document vise les peuples autochtones d'Australie sans nommer la Tasmanie (par. 21 et 22).", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
