resume: >-
  L'Aboriginal Lands Act 1995, loi de l'État de Tasmanie sanctionnée le 14 novembre 1995, crée l'Aboriginal Land Council of Tasmania (Conseil foncier aborigène de Tasmanie), composé de huit Aborigènes élus par les seuls électeurs aborigènes de cinq circonscriptions. La loi n'ouvre pas de procédure de revendication : elle dévolue au conseil une liste fermée de terres, « en fiducie pour les Aborigènes à perpétuité » (en trust, c'est-à-dire détenues pour le compte des Aborigènes). Douze terres sont dévolues en 1995, Wybalenna en 1999, l'île du Cap Barren et l'île Clarke en 2005. Ces terres ne peuvent être ni hypothéquées ni expropriées.
