  - {instrument: "Mineral Resources Development Act 1995 (Tasmanie), s. 179", nature: "loi", annee: 1995, source: "https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-116"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseil de huit Aborigènes élus pour environ trois ans par les électeurs aborigènes inscrits sur une liste propre : deux pour chacune des régions sud, nord et nord-ouest, un pour le groupe de l'île Flinders, un pour le groupe de l'île du Cap Barren (loi de 1995, s. 6 à 13) ; compétence limitée à la gestion des terres.", source: "https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-098"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les terres de l'annexe 3 sont dévolues au conseil en fiducie pour les Aborigènes à perpétuité (s. 27), ne peuvent être hypothéquées (s. 30) et ne peuvent être expropriées (Land Acquisition Act 1993, s. 5A) ; le ministre déclare terre aborigène, à la demande du conseil, toute terre que celui-ci acquiert (s. 35A, 2005).", source: "https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-098"}
  ressources: {valeur: "partiel", note: "La dévolution comprend les minéraux jusqu'à 50 mètres de profondeur, hors pétrole, substances atomiques et géothermiques (s. 27(2)) ; le conseil gère les terres et leurs ressources naturelles et approuve les plans de gestion (s. 18 et 32) ; des droits d'accès du public et de la Couronne sont réservés sur plusieurs terres (s. 27(4) à (10)).", source: "https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-098"}
  consentement: {valeur: "reconnu", note: "Le ministre ne peut accorder de bail ou de licence minière sur une terre aborigène sans l'accord du conseil (Mineral Resources Development Act 1995, s. 179).", source: "https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-116"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Fonds propre administré par le conseil, alimenté par les baux et licences sur les terres aborigènes et par des crédits du Commonwealth ou de l'État (s. 21 et 22) ; aucun pouvoir fiscal, aucun montant garanti par la loi.", source: "https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-098"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon ABC News (novembre 2025), vingt ans après le retour de l'île du Cap Barren, la Cape Barren Aboriginal Association (association aborigène de l'île) est au centre de sa gestion et toute décision sur l'île passe par elle ; deux groupes de gardes aborigènes (rangers) gèrent les terres des îles Furneaux ; le gouvernement de Tasmanie n'a procédé à aucun autre transfert de terres d'ampleur à la communauté aborigène depuis 2005. Aucune source indépendante consultée ne décrit le fonctionnement du conseil lui-même.", source: "https://www.abc.net.au/news/2025-11-29/cape-barren-island-20-years-after-land-return/105916324"}
chronologie:
  - {annee: 1995, evenement: "Sanction de l'Aboriginal Lands Act (14 novembre), qui crée le conseil et lui dévolue douze terres ; la loi entre en vigueur à des dates fixées par proclamation (s. 2)."}
  - {annee: 1999, evenement: "Aboriginal Lands Amendment (Wybalenna) Act : dévolution de Wybalenna et gestion du cimetière de Settlement Point."}
  - {annee: 2005, evenement: "Entrée en vigueur (12 avril) de la loi modificative de 2004 : dévolution de l'île du Cap Barren et de l'île Clarke, qui cessent d'être des réserves."}
  - {annee: 2005, evenement: "Loi modificative n° 2 (21 juillet) : définition de la personne aborigène (ascendance, auto-identification, reconnaissance par la communauté) et déclaration des terres acquises par le conseil."}
  - {annee: 2008, evenement: "Loi modificative : protection des pièces confidentielles produites pour l'inscription sur la liste électorale."}
