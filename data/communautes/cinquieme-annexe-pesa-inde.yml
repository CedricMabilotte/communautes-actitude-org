resume: >-
  Fiche agrégée : elle couvre les tribus répertoriées (Scheduled Tribes, plus de 705 groupes notifiés au titre de l'article 342 de la Constitution) qui vivent dans les « zones répertoriées » de la Cinquième annexe, déclarées par décret présidentiel dans dix États. Dans ces zones, le gouverneur peut écarter une loi et réglementer la cession des terres entre tribaux et non-tribaux, après avis d'un conseil consultatif tribal. La loi PESA du 24 décembre 1996 (extension des panchayats aux zones répertoriées) donne à l'assemblée de village (gram sabha) la protection des coutumes, des ressources communes et du règlement coutumier des litiges, et impose sa consultation avant toute acquisition de terres.
