  non_confirme: ["Superficie totale des zones répertoriées : non trouvée en km² ; seule une proportion d'environ 11,3 % du territoire national est publiée (The News Minute).", "Population des tribus répertoriées vivant dans ces zones : non trouvée en nombre ; les tribus répertoriées comptent environ 10,4 crores (104 millions) de personnes dans toute l'Inde (recensement de 2011) et environ 41 % d'entre elles vivraient dans les zones répertoriées (The News Minute).", "Arrêt Samatha (1997) : lu dans le résumé d'ESCR-Net, texte intégral non consulté.", "Validité du règlement 1 de 1970 : contestée devant la Cour suprême par des résidents non tribaux d'Andhra Pradesh et du Telangana (affaire pendante en juin 2026, Counterview) ; aucune décision trouvée au 4 octobre 2026.", "Contenu détaillé du règlement PESA du Jharkhand (2026) : texte du journal officiel non consulté."]
