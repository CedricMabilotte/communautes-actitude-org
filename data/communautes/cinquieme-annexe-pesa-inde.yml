droits:
  autogouvernement: {valeur: "partiel", note: "L'assemblée de village (gram sabha) est compétente pour protéger les traditions, les coutumes, l'identité culturelle et les ressources communes, loi PESA, art. 4 (d) ; l'assemblée de l'État doit s'efforcer de suivre le modèle de la Sixième annexe pour les panchayats de district, art. 4 (o) ; application par des lois et règlements des États.", source: "https://faolex.fao.org/docs/pdf/ind200703.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "L'assemblée de village protège le mode coutumier de règlement des litiges, loi PESA, art. 4 (d).", source: "https://faolex.fao.org/docs/pdf/ind200703.pdf"}
  terres: {valeur: "partiel", note: "Pouvoir de prévenir la cession des terres et de restituer les terres cédées illégalement, loi PESA, art. 4 (m) (iii) ; le gouverneur peut, par règlement soumis au président de la République et après consultation du conseil consultatif tribal, interdire ou restreindre la cession de terres par des membres des tribus répertoriées ou entre eux, Cinquième annexe, paragraphe 5 (2) (a), (4) et (5). En Andhra Pradesh et au Telangana, le règlement de 1959 sur la cession des terres des zones répertoriées, modifié par le règlement 1 de 1970 pris à ce titre, rend nulle toute cession d'immeuble des zones d'agence (Agency tracts) qui n'est pas faite à un membre d'une tribu répertoriée ou à une société coopérative, et présume, sauf preuve contraire, qu'un immeuble détenu par un non-tribal lui vient d'un tribal, art. 3 (1). Dans l'arrêt Samatha c. État d'Andhra Pradesh (Cour suprême, 11 juillet 1997), les baux miniers accordés à des non-tribaux en zone répertoriée sont annulés ; l'exploitation y est réservée à l'entreprise minière publique ou à des coopératives tribales, et au moins 20 % des bénéfices vont aux services locaux. Des résidents non tribaux contestent la validité du règlement de 1970 devant la Cour suprême (requête SLP (C) 1580 de 2023, pendante en juin 2026).", source: "https://faolex.fao.org/docs/pdf/ind200703.pdf"}
  ressources: {valeur: "partiel", note: "Propriété des produits forestiers mineurs, art. 4 (m) (ii) ; recommandation préalable obligatoire pour les concessions de minéraux mineurs, art. 4 (k) et (l), loi PESA.", source: "https://faolex.fao.org/docs/pdf/ind200703.pdf"}
  consentement: {valeur: "partiel", note: "L'assemblée de village ou le panchayat est consulté avant toute acquisition de terres pour des projets de développement et avant la réinstallation des personnes déplacées, loi PESA, art. 4 (i) ; consultation, non consentement.", source: "https://faolex.fao.org/docs/pdf/ind200703.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Sièges des panchayats (conseils élus de village, de bloc et de district) réservés aux tribus répertoriées en proportion de leur population, au moins pour moitié, et présidences de tous les panchayats réservées, loi PESA, art. 4 (g) ; conseil consultatif tribal d'au plus vingt membres, dont autant que possible les trois quarts sont des élus des tribus répertoriées à l'Assemblée de l'État, avec un rôle d'avis, Cinquième annexe, paragraphe 4. Les sièges des panchayats relèvent des institutions locales ; au niveau de l'État, seul le conseil consultatif tribal a une composition tribale garantie, avec un rôle d'avis.", source: "https://faolex.fao.org/docs/pdf/ind200703.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En février 2026, neuf des dix États ont un règlement d'application ; l'Odisha n'a pas finalisé le sien et le Jharkhand n'a notifié le sien qu'en janvier 2026 ; les services administratifs contournent souvent la consultation obligatoire des assemblées de village (Down To Earth, 24 février 2026).", source: "https://www.downtoearth.org.in/governance/three-decades-on-pesa-struggles-to-deliver-tribal-self-governance"}
chronologie:
  - {annee: 1950, evenement: "Décrets présidentiels sur les zones répertoriées (Scheduled Areas Orders) et liste des tribus répertoriées."}
  - {annee: 1970, evenement: "Règlement 1 de 1970 : en Andhra Pradesh, toute cession de terre de zone répertoriée à un non-tribal est nulle."}
  - {annee: 1996, evenement: "Loi PESA du 24 décembre."}
  - {annee: 1997, evenement: "Arrêt Samatha du 11 juillet : baux miniers à des non-tribaux en zone répertoriée annulés."}
  - {annee: 2013, evenement: "Arrêt du 18 avril : la Cour suprême renvoie la décision sur la mine de bauxite de Niyamgiri (Odisha) aux assemblées de village concernées, qui votent ensuite contre le projet à l'unanimité."}
  - {annee: 2023, evenement: "Odisha : projet de règlement PESA publié au journal officiel de l'État le 10 novembre ; toujours en révision en mars 2026."}
  - {annee: 2026, evenement: "Le Jharkhand notifie son règlement PESA le 2 janvier."}
  - {annee: 2026, evenement: "Juin : la requête de résidents non tribaux contre le règlement 1 de 1970 (Andhra Pradesh, Telangana) est pendante devant la Cour suprême."}
