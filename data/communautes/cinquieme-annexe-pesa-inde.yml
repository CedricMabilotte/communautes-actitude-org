  - {annee: 2013, evenement: "Arrêt du 18 avril : douze assemblées de village de Niyamgiri se prononcent contre la mine de bauxite."}
  - {annee: 2026, evenement: "Le Jharkhand publie son règlement PESA en janvier."}
