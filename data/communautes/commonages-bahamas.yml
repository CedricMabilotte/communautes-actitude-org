effectivite: {valeur: "partielle", note: "En 2019, selon son trésorier adjoint, le comité du commonage de Harbour Island avait fait ratifier par les commoners et transmis au procureur général des modifications de la loi et des règles, jugées dépassées pour l'usage commercial des terres ; le procureur général Carl Bethel a déclaré ne pas les avoir encore reçues et a répondu que tout changement exigerait une consultation des commoners de tout le pays et que les revendications ancestrales liées aux terres familiales (generation land) étaient « not well-founded in law » (peu fondées en droit).", source: "https://thenassauguardian.com/bethel-commonage-law-changes-will-require-consultation-throughout-bahamas/"}
chronologie:
  - {annee: 1842, evenement: "Concession royale des terres du commonage de Harbour Island, au nord d'Eleuthera, datée de 1842 par un membre de son comité en 2019 et de 1844 par ce comité en 2004."}
  - {annee: 1896, evenement: "Entrée en vigueur du Commonage Act le 30 avril."}
  - {annee: 1926, evenement: "Règles des commoners de Tarpum Bay (Eleuthera), en vigueur le 1er mai."}
  - {annee: 1938, evenement: "Règles des commoners de Harbour Island et Spanish Wells, en vigueur le 15 août, et de Rock Sound, en vigueur le 1er novembre."}
  - {annee: 1959, evenement: "Location au gouvernement d'environ 2 400 acres du commonage de Harbour Island pour l'aéroport de North Eleuthera, selon le comité de ce commonage."}
  - {annee: 2000, evenement: "Le comité du commonage de Harbour Island assigne le gouvernement devant la Cour suprême pour l'exécution des contrats de location, selon ce comité."}
  - {annee: 1961, evenement: "Règles des commoners de Mount Thompson et Ramsey, en vigueur le 29 juillet."}
  - {annee: 2004, evenement: "Règles du commonage de Savannah Sound (Eleuthera), en vigueur le 15 décembre."}
  - {annee: 2019, evenement: "Le comité de Harbour Island propose une révision de la loi ; le procureur général exige une consultation nationale des commoners."}
  - {annee: 2025, evenement: "La loi sur l'adjudication foncière interdit au ministre de déclarer zone d'adjudication une terre tenue en commun au titre du Commonage Act (art. 3 (3))."}
