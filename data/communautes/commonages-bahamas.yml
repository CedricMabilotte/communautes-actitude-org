  statut_personnel: {valeur: "non_etabli", note: "Le registre des commoners, ouvert aux résidents reconnus par le commissaire (Commonage Act, art. 3 à 6) et, à Savannah Sound, aux personnes d'ascendance directe dans la localité après six mois de résidence (règles de 2004, règle 2), fixe qui a un intérêt sur les terres communes : cette qualité est codée sous « Terres et territoire » et « Institutions propres » ; aucun statut civil ni droit de domicile propre n'a été trouvé.", source: "https://faolex.fao.org/docs/pdf/bha78380.pdf"}
