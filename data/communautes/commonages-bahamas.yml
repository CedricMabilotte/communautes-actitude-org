droits:
  autogouvernement: {valeur: "partiel", note: "Les commoners tiennent des assemblées qui décident à la majorité, avec un quorum de dix (Commonage Act, art. 7) ; l'assemblée annuelle du premier lundi de décembre élit un président et un bureau, que le commissaire (administrateur de district) nomme à défaut d'élection (art. 8). À Mount Thompson et Ramsey, le comité des commoners délivre une licence préalable à toute activité commerciale sur le commonage (règles de 1961, règle 10).", source: "https://faolex.fao.org/docs/pdf/bha78380.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les commoners de chaque terre tenue en commun peuvent adopter des règles sur l'aménagement, l'usage équitable, l'eau douce et la protection des cultures (Commonage Act, art. 11 (1)) ; ces règles sont soumises au ministre, qui peut les modifier (art. 11 (2)), puis publiées au Journal officiel, où elles ont force de loi (art. 12) ; amende de vingt dollars en cas d'infraction (art. 13).", source: "https://faolex.fao.org/docs/pdf/bha78380.pdf"}
  justice_propre: {valeur: "partiel", note: "À Mount Thompson et Ramsey, les dommages dus aux brûlis sont évalués par deux commoners désignés par les parties, avec un arbitre final en cas de désaccord (règles de 1961, règle 5), et les autres litiges entre commoners sont tranchés en dernier ressort par un comité de commoners nommé par le commissaire (règle 7). À Savannah Sound, le comité de la politique foncière, formé des élus des commoners, tranche les litiges entre commoners à la majorité et sans recours interne (règles de 2004, règles 7 et 12). Les infractions aux règles sont jugées par le commissaire (Commonage Act, art. 14).", source: "https://laws.bahamas.gov.bs/cms/images/LEGISLATION/SUBORDINATE/1896/1896-0014/1896-0014_1.pdf"}
  terres: {valeur: "partiel", note: "Les terres concédées à plus de vingt personnes et non partagées sont tenues en commun (Commonage Act, art. 2) ; seule une personne inscrite comme commoner y a un intérêt (art. 10) ; tout occupant non inscrit est réputé intrus et peut être expulsé à la demande d'un commoner par mandat du commissaire (art. 15), toute réoccupation étant un délit (art. 16). La loi ne déclare pas ces terres inaliénables et elles cessent d'être tenues en commun une fois partagées (art. 2) ; le droit d'exclure les non-inscrits ne suffit pas à établir une propriété collective protégée, d'où « partiel ».", source: "https://faolex.fao.org/docs/pdf/bha78380.pdf"}
  ressources: {valeur: "partiel", note: "Les règles des commoners peuvent viser l'approvisionnement en eau douce et sa répartition équitable (Commonage Act, art. 11 (1) (c)) ; à Mount Thompson et Ramsey, chaque commoner a librement accès aux points d'eau naturels (règles de 1961, règle 6). Aucune disposition sur le sous-sol ou la pêche n'a été trouvée.", source: "https://faolex.fao.org/docs/pdf/bha112226.pdf"}
