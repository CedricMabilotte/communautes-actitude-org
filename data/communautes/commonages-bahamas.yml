resume: >-
  Aux Bahamas, la loi sur les commonages (Commonage Act, chap. 152, en vigueur le 30 avril 1896) organise les terres concédées à plus de vingt personnes et non partagées entre elles. Ces terres sont tenues en commun par les commoners (ayants droit inscrits sur un registre tenu dans chaque localité). Les commoners se réunissent chaque année, élisent un président et un bureau, et adoptent des règles d'usage que le ministre approuve et que le Journal officiel publie. Le recueil des lois contient cinq règlements de commonage : Tarpum Bay (1926), Harbour Island et Spanish Wells (1938), Rock Sound (1938), Mount Thompson et Ramsey (1961) et Savannah Sound, à Eleuthera (2004). La loi de 2025 sur l'adjudication foncière exclut ces terres de ses zones d'adjudication. Aucun décompte officiel des commonages n'a été trouvé.
