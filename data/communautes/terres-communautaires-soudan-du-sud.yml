resume: >-
  Fiche agrégée : elle couvre les communautés du Soudan du Sud titulaires de terres communautaires au sens de la loi foncière de 2009 (Land Act, 2009) et de l'article 171 de la Constitution transitoire de 2011 (révisée en 2013). La loi classe toutes les terres en publiques, communautaires ou privées (s. 9) ; la terre communautaire est détenue par des communautés identifiées par l'ethnicité, la résidence ou l'intérêt (s. 11). Les droits fonciers coutumiers, y compris ceux détenus en commun, ont la même force juridique qu'une propriété ou un bail (s. 8 (6)). L'autorité traditionnelle (Traditional Authority, l'instance des chefs coutumiers reconnue par la Constitution, art. 167) attribue et retire les droits coutumiers au nom de la communauté (s. 15 et 16). Le nombre de terres communautaires enregistrées n'est pas établi.
