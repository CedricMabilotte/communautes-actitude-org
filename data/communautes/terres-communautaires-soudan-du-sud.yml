effectivite: {valeur: "partielle", note: "Selon le profil foncier du Soudan du Sud publié par l'agence américaine de développement (USAID, 2013), le droit coutumier propre à chaque groupe régit l'usage des terres et des ressources, mais la loi ne fixe pas de procédure claire pour créer les autorités foncières de comté et les conseils fonciers de payam, et très peu ont été créés ; malgré les lacunes du cadre institutionnel et légal, des investisseurs étrangers ont acquis de grandes surfaces.", source: "https://www.land-links.org/country-profile/south-sudan/"}
chronologie:
  - {annee: 2005, evenement: "La Constitution intérimaire du Sud-Soudan, issue de l'accord de paix global, sert de base à la loi foncière."}
  - {annee: 2009, evenement: "Adoption de la loi foncière (Land Act, 2009) par l'Assemblée législative du Sud-Soudan, en février."}
  - {annee: 2011, evenement: "Indépendance du Soudan du Sud ; la Constitution transitoire reconnaît l'autorité traditionnelle et la terre communautaire."}
  - {annee: 2013, evenement: "Révision de la Constitution transitoire."}
