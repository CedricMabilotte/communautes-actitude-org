resume: >-
  Population de l'archipel des Bermudes, dans l'Atlantique Nord, à environ 917 km de la côte de la Caroline du Nord. Colonisé à partir de 1609 et passé sous l'administration directe de la Couronne en 1684, le territoire figure sur la liste des territoires non autonomes de l'ONU, avec le Royaume-Uni comme puissance administrante. La Constitution de 1968 institue un Parlement de deux chambres, un Cabinet dirigé par un Premier ministre (Premier) responsable devant ce Parlement, et réserve au gouverneur nommé par la Couronne les relations extérieures, la défense, la sécurité intérieure et la police. Le statut bermudien (Bermudian status), défini par la loi de 1956 sur l'immigration, conditionne le droit de vote, l'éligibilité et la propriété foncière.
