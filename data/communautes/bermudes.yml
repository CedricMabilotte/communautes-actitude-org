droits:
  autogouvernement: {valeur: "reconnu", note: "La Législature se compose de la Couronne, d'un Sénat de onze membres nommés par le gouverneur (cinq sur avis du Premier ministre, trois sur avis du chef de l'opposition, trois à sa discrétion) et d'une Chambre d'assemblée de trente-six élus (Constitution de 1968, s. 26 à 28, s. 28 modifiée en 2003) ; le gouverneur nomme Premier ministre le député le plus à même de réunir une majorité, et le Cabinet est collectivement responsable devant la Législature (s. 57 et 58).", source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1968/Bermuda%20Constitution%20Order%201968"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Législature fait les lois « pour la paix, l'ordre et le bon gouvernement » des Bermudes (Constitution, s. 34) ; le gouverneur doit réserver à la décision de Londres les projets contraires aux obligations internationales du Royaume-Uni, à la prérogative royale, à la Constitution, touchant à ses responsabilités propres ou à la monnaie et aux banques, sauf autorisation de Londres (s. 35, al. 2), et la Couronne ne peut annuler (désaveu) que les lois relatives aux emprunts publics (s. 47).", source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1968/Bermuda%20Constitution%20Order%201968"}
  justice_propre: {valeur: "partiel", note: "La Constitution établit une Cour suprême et une Cour d'appel des Bermudes (s. 73 et 77) ; le président de la Cour suprême (Chief Justice) est nommé par le gouverneur après consultation du Premier ministre, qui consulte d'abord le chef de l'opposition (s. 73, al. 3), et les juges de la Cour d'appel sont nommés par le gouverneur à sa discrétion (s. 77, al. 3) ; la révocation d'un juge suppose l'avis du Comité judiciaire du Conseil privé, à Londres (s. 74, al. 3).", source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1968/Bermuda%20Constitution%20Order%201968"}
  terres: {valeur: "partiel", note: "La partie VI de la loi de 1956 sur l'immigration a pour objet de « protéger les terres des Bermudes pour qu'elles soient détenues par les personnes ayant le statut bermudien » (s. 73) : une personne sans ce statut (restricted person, personne soumise à restriction) ne peut détenir ou acquérir de terre sans licence (s. 76, rédaction de 2015) ; la Constitution admet ces restrictions (s. 11, al. 2 e).", source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1956/Bermuda%20Immigration%20and%20Protection%20Act%201956"}
  ressources: {valeur: "partiel", note: "Le département de l'Environnement et des Ressources naturelles du gouvernement territorial gère et réglemente la pêche, la conservation marine et terrestre et les réserves naturelles ; une modification de 2017 de la loi de 1986 sur les parcs nationaux a créé seize nouvelles aires protégées ; le gouvernement territorial soutient la commission de la mer des Sargasses, créée en application de la déclaration de Hamilton.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/3&l=en&t=pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "Le ministère de l'Éducation du gouvernement territorial, dirigé par un ministre (Constitution, s. 61), organise l'école obligatoire de 5 à 16 ans et gratuite dans le public jusqu'à 19 ans, et conduit depuis 2022-2023 la réforme du système public (dix écoles primaires, une par paroisse sauf deux à Pembroke).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/3&l=en&t=pdf"}
  fiscalite: {valeur: "reconnu", note: "Toutes les recettes du gouvernement alimentent un fonds consolidé (Constitution, s. 94) dont le ministre des Finances, issu de la Chambre d'assemblée (s. 61), présente chaque année à cette chambre les prévisions de recettes et de dépenses, votées par une loi de finances (Appropriation bill) (s. 96).", source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1968/Bermuda%20Constitution%20Order%201968"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Le statut bermudien s'acquiert par la naissance, l'adoption, une attache familiale bermudienne, le mariage ou certaines résidences longues (loi de 1956, partie III, s. 16 à 22) ; la Constitution le protège (s. 102, al. 3), en fait la condition principale d'appartenance aux Bermudes (s. 11, al. 5), du droit de vote (s. 55, sauf électeurs inscrits au 1er mai 1976) et de l'éligibilité (s. 29), et permet de restreindre la circulation et la résidence des autres personnes (s. 11, al. 2 d) ainsi que leur entrée et leur emploi (s. 12, al. 4 b).", source: "https://www.bermudalaws.bm/Laws/Consolidated%20Law/1968/Bermuda%20Constitution%20Order%201968"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Selon la puissance administrante, la Constitution donne au territoire une autonomie interne presque complète ; le gouvernement territorial finance son budget (recettes prévues de 1,2 milliard de dollars pour 2024-2025) et des élections générales ont eu lieu le 18 février 2025 ; le gouverneur conserve la défense, les relations extérieures, la sécurité intérieure et la police.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/3&l=en&t=pdf"}
chronologie:
  - {annee: 1609, evenement: "Des colons britanniques en route vers la Virginie font naufrage sur un récif de l'archipel, jusque-là inhabité."}
  - {annee: 1612, evenement: "Le roi Jacques Ier étend la charte de la Compagnie de Virginie aux Bermudes."}
  - {annee: 1684, evenement: "La charte de la compagnie est annulée ; le gouvernement passe à la Couronne britannique."}
  - {annee: 1956, evenement: "Loi sur l'immigration et la protection : statut bermudien et règles foncières."}
  - {annee: 1968, evenement: "La Constitution des Bermudes entre en application le 2 juin."}
  - {annee: 1995, evenement: "Référendum sur l'indépendance : 73,6 % des votants se prononcent contre, avec une participation de 58,8 % ; le Parti travailliste progressiste avait appelé au boycott."}
  - {annee: 2003, evenement: "Modification de la Constitution : la Chambre d'assemblée passe à 36 sièges élus dans 36 circonscriptions à un siège."}
  - {annee: 2005, evenement: "Rapport de la Commission bermudienne sur l'indépendance."}
  - {annee: 2025, evenement: "Élections générales du 18 février ; document de travail du Secrétariat de l'ONU sur les Bermudes (A/AC.109/2025/3)."}
fiabilite:
  verifie: ["Composition du Parlement, nomination du Premier ministre, responsabilité du Cabinet, responsabilités réservées du gouverneur (s. 62), réserve des projets de loi (s. 35) et désaveu limité aux emprunts publics (s. 47), dans le texte consolidé de la Constitution sur bermudalaws.bm.", "Passage à 36 circonscriptions à un siège (SI 2003/456, legislation.gov.uk, et s. 52 du texte consolidé).", "Définition de l'appartenance aux Bermudes (s. 11, al. 5) et conditions de vote et d'éligibilité liées au statut bermudien (s. 29 et 55).", "Objet de la partie VI de la loi de 1956 et interdiction de détenir des terres sans licence pour les personnes sans statut bermudien (s. 72, 73 et 76).", "Nomination des juges (s. 73, al. 3, s. 74, al. 3, et s. 77, al. 3), fonds consolidé et budget (s. 61, 94 et 96), restrictions d'entrée, d'emploi et de résidence (s. 11, al. 2 d, et s. 12, al. 4 b).", "Inscription sur la liste des territoires non autonomes, population, surface, budget, résultats du référendum de 1995 (A/AC.109/2025/3)."]
  non_confirme: ["Le texte de 1968 consulté sur constitutionnet.org est antérieur à 2003 et indique encore 40 députés ; le chiffre en vigueur est de 36.", "Pouvoir éventuel de la Couronne de légiférer pour les Bermudes par ordonnance en conseil (Bermuda Constitution Act 1967) non vérifié sur le texte.", "Le référendum de 1995 reposait sur une loi ponctuelle ; aucun texte en vigueur prévoyant une consultation sur l'indépendance n'a été trouvé.", "Les neuf paroisses et les deux municipalités (Hamilton, St. George's) ne sont pas décrites ici faute de source primaire consultée.", "Nombre de villages : non trouvé."]
