resume: >-
  La loi de 2002 sur la Fondation nationale pour le développement des nationalités autochtones (NFDIN) a reconnu 59 groupes comme nationalités autochtones (Adivasi Janajati) ; les Humlo ont été ajoutés en 2024, ce qui porte le nombre à 60. Le Népal a ratifié la Convention 169 de l'OIT en 2007. La Constitution de 2015 prévoit leur représentation sur les listes proportionnelles, l'enseignement en langue maternelle, une commission des Adivasi Janajati et, à son article 56 (5), des régions spéciales, protégées ou autonomes, dont aucune n'a été créée. En juin 2025, la Cour suprême a ordonné d'aligner les lois sur la Convention 169 et la DNUDPA. Les forêts gérées par des groupes d'usagers et les zones tampons des parcs nationaux font l'objet des fiches Forêts communautaires du Népal et Zones tampons des aires protégées du Népal.
