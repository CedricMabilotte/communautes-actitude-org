droits:
  autogouvernement: {valeur: "conteste", note: "Des régions spéciales, protégées et autonomes peuvent être créées par loi fédérale pour la protection socioculturelle, Constitution, art. 56 (5) (2015) ; aucune n'a été créée à ce jour selon une déclaration d'organisations autochtones à l'Examen périodique universel (2025).", source: "https://upr-info.org/sites/default/files/country-document/2025-11/Nepal_LAHURNIP_statement.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Politique de l'État : faire participer les Adivasi Janajati aux décisions qui les concernent et préserver leurs savoirs traditionnels, Constitution, art. 51 (j) (8) ; sa mise en œuvre ne peut être contestée en justice, art. 55. Le 6 juin 2025, la Cour suprême a ordonné à la fédération, aux provinces et aux collectivités locales d'adopter des lois conformes à la Convention 169 et à la DNUDPA, consentement libre, préalable et éclairé (accord donné avant tout projet, en connaissance de cause) compris ; aucune loi n'a suivi.", source: "https://www.culturalsurvival.org/news/historic-victory-nepals-supreme-court-mandates-nationwide-implementation-treaties-indigenous"}
  langue: {valeur: "partiel", note: "Chaque province peut adopter par loi provinciale, en plus du népali, une ou plusieurs langues parlées par la majorité de sa population comme langue de travail officielle, Constitution, art. 7 (2) ; la loi de 2023 de la province de Bagmati a fait du tamang et du newar (Nepal Bhasa) des langues officielles provinciales, proclamées le 6 mai 2024.", source: "https://english.khabarhub.com/2024/06/354257/"}
  education: {valeur: "partiel", note: "Chaque communauté a le droit à l'enseignement dans sa langue maternelle jusqu'au secondaire et d'ouvrir et gérer des écoles « selon la loi », Constitution, art. 31 (5) (2015).", source: "https://www.constituteproject.org/constitution/Nepal_2016"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Listes fermées des partis pour les 110 sièges à la proportionnelle de la Chambre des représentants avec représentation des Adivasi Janajati, art. 84 (2), et des assemblées provinciales, art. 176 (6) ; droit de participer aux organes de l'État selon le principe d'inclusion proportionnelle, art. 42 (1), Constitution de 2015. La loi ne fixe pas de nombre de sièges réservés ; les élections du 5 mars 2026 ont appliqué ces listes.", source: "https://www.ifes.org/sites/default/files/2026-03/2026_Nepal_General%20Elections%20FAQs.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "L'Association des juristes pour les droits des peuples autochtones du Népal (LAHURNIP, organisation non gouvernementale) indique le 28 novembre 2025 que l'article 56 (5) n'est pas appliqué, que des projets avancent sans consentement préalable et que la décision de la Cour suprême de 2025 sur la Convention 169 et la DNUDPA n'est pas suivie. En avril 2026, aucun amendement constitutionnel n'avait été adopté et la réduction des sièges à la proportionnelle était en débat.", source: "https://upr-info.org/sites/default/files/country-document/2025-11/Nepal_LAHURNIP_statement.pdf"}
chronologie:
  - {annee: 2002, evenement: "Loi NFDIN : 59 nationalités autochtones reconnues."}
  - {annee: 2007, evenement: "Ratification de la Convention 169 de l'OIT."}
  - {annee: 2015, evenement: "Constitution fédérale ; art. 56 (5) sur les régions autonomes."}
  - {annee: 2023, evenement: "Loi de la province de Bagmati sur la langue officielle : tamang et newar."}
  - {annee: 2024, evenement: "Reconnaissance des Humlo par le Conseil des ministres le 11 juillet."}
  - {annee: 2025, evenement: "Décision de la Cour suprême du 6 juin sur la mise en œuvre de la Convention 169 et de la DNUDPA."}
  - {annee: 2025, evenement: "Dissolution de la Chambre des représentants en septembre après des manifestations de jeunes."}
  - {annee: 2026, evenement: "Élections générales du 5 mars ; groupe de travail gouvernemental sur un amendement de la Constitution."}
