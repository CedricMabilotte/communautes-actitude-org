resume: >-
  La Voïvodine est l'une des deux provinces autonomes que la Constitution serbe de 2006 définit comme des collectivités territoriales autonomes où les citoyens exercent le droit à l'autonomie provinciale (art. 182). Son Statut du 22 mai 2014, adopté avec l'accord préalable de l'Assemblée nationale, institue une Assemblée de 120 députés élus au suffrage direct et un gouvernement provincial. La Constitution fixe son budget à au moins 7 % de celui de la République. Le hongrois, le slovaque, le croate, le roumain et le ruthène sont en usage officiel dans les organes provinciaux à côté du serbe ; la Serbie reste un État unitaire où seul le Parlement national adopte des lois. Les conseils nationaux des minorités, sans territoire propre, ont leur fiche (« Hongrois de Serbie », « Minorités nationales de Serbie »).
