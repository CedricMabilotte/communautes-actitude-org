resume: >-
  Le Statut de Gernika (loi organique 3/1979) constitue le « Peuple basque ou Euskal-Herria », comme expression de sa nationalité, en Communauté autonome. Le Parlement basque exerce le pouvoir législatif ; les trois territoires historiques gardent leurs institutions forales (propres à l'ancien régime des fueros, chartes coutumières). Les relations fiscales avec l'État suivent le Concert économique : les territoires historiques lèvent et règlent l'impôt. L'euskera est co-officiel avec le castillan. Les concejos d'Álava ont leur propre fiche (« Concejos d'Álava ») ; la Navarre, hors de la Communauté autonome, aussi (« Navarre »).
reconnaissance_regionale:
