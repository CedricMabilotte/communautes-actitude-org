droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement basque composé d'un nombre égal de représentants de chaque territoire historique élus au suffrage universel, Statut, art. 25 et 26 ; les territoires historiques conservent leurs institutions propres, art. 3.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement basque exerce la potestad legislativa (pouvoir de faire des lois) dans les matières de compétence exclusive énumérées à l'article 10, Statut, art. 25.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  justice_propre: {valeur: "partiel", note: "Les juridictions situées au Pays basque, qui relèvent du pouvoir judiciaire de l'État, jugent en dernière instance, y compris en cassation, les affaires de droit civil foral basque, Statut, art. 14.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur les montes (terres boisées et pastorales), les pâturages et les voies de transhumance, sous réserve de la législation de base de l'État, Statut, art. 10, n° 8.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur l'agriculture, l'élevage et la pêche dans les eaux intérieures, Statut, art. 10, n° 9 et 10.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige l'approbation du Parlement basque à la majorité absolue, celle des Cortes Generales (Parlement espagnol) par loi organique et celle des électeurs par référendum, Statut, art. 46.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  langue: {valeur: "reconnu", note: "L'euskera, langue propre du Peuple basque, est langue officielle avec le castillan, Statut, art. 6.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  education: {valeur: "reconnu", note: "L'enseignement dans toute son extension, niveaux et degrés relève de la Communauté autonome, sous réserve des règles de base de l'État, Statut, art. 16.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  fiscalite: {valeur: "reconnu", note: "Les relations fiscales avec l'État suivent le Concert économique ; les institutions des territoires historiques établissent et règlent le régime fiscal sur leur territoire, Statut, art. 41.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La condition politique de Basque est attribuée aux citoyens espagnols ayant leur domicile administratif dans une commune de la Communauté, et aux résidents à l'étranger dont c'était le dernier domicile, Statut, art. 7.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité d'experts de la Charte constate en 2024 un système de protection des langues régionales développé en Espagne, avec des lacunes dans la justice, la santé et l'administration de l'État.", source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
