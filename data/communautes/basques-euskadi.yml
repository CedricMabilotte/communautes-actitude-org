base_nationale:
  - {instrument: "Statut d'autonomie du Pays basque (loi organique 3/1979 du 18 décembre)", nature: "statut_autonomie", annee: 1979, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement basque composé d'un nombre égal de représentants de chaque territoire historique élus au suffrage universel, Statut, art. 25 et 26 ; les territoires historiques conservent leurs institutions propres, art. 3.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement basque exerce la potestad legislativa (pouvoir de faire des lois), Statut, art. 25 ; la Communauté a la compétence exclusive dans les matières énumérées à l'article 10, et les territoires historiques dans celles de l'article 37.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  justice_propre: {valeur: "partiel", note: "Les juridictions situées au Pays basque, qui relèvent du pouvoir judiciaire de l'État, jugent en dernière instance, y compris en cassation, les affaires de droit civil foral basque, Statut, art. 14.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur les montes (terres boisées et pastorales), les pâturages et les voies de transhumance, sans préjudice de la législation de base de l'État (Constitution, art. 149.1.23), Statut, art. 10, n° 8 ; les territoires historiques règlent le régime des biens communaux, art. 37.3.d.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur l'agriculture et l'élevage dans le cadre de l'ordonnancement général de l'économie, sur la pêche en eaux intérieures et la chasse, et sur les eaux qui coulent entièrement dans le Pays basque, Statut, art. 10, n° 9, 10 et 11.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige l'approbation du Parlement basque à la majorité absolue, celle des Cortes Generales (Parlement espagnol) par loi organique et celle des électeurs par référendum, Statut, art. 46.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  langue: {valeur: "reconnu", note: "L'euskera, langue propre du Peuple basque, est langue officielle avec le castillan, Statut, art. 6.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  education: {valeur: "reconnu", note: "L'enseignement dans toute son extension, niveaux et degrés relève de la Communauté autonome, sous réserve des règles de base de l'État, Statut, art. 16.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  fiscalite: {valeur: "reconnu", note: "Les relations fiscales avec l'État suivent le Concert économique ; les institutions des territoires historiques établissent et règlent le régime fiscal sur leur territoire, Statut, art. 41.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La condition politique de Basque est attribuée aux personnes ayant leur domicile administratif dans une commune de la Communauté ; les résidents à l'étranger dont c'était le dernier domicile, et leurs descendants, ont sur demande les mêmes droits politiques s'ils conservent la nationalité espagnole, Statut, art. 7.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1979-30177"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité d'experts indépendants de la Charte constate en 2024 un système de protection des langues régionales développé en Espagne, avec des lacunes dans la justice, l'administration de l'État et les services publics. Les juridictions de l'État encadrent l'usage de l'euskera : le Tribunal constitutionnel a annulé en 2023 l'article 6.2 de la loi 2/2016 sur les institutions locales d'Euskadi, et le Tribunal suprême a confirmé en 2025 l'annulation d'articles du décret 179/2019 qui donnaient priorité à l'euskera dans les institutions locales.", source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
chronologie:
  - {annee: 1979, evenement: "Loi organique 3/1979 portant Statut d'autonomie du Pays basque (18 décembre)."}
  - {annee: 1980, evenement: "Entrée en vigueur du Statut (11 janvier)."}
  - {annee: 2023, evenement: "Le Tribunal constitutionnel annule l'article 6.2 de la loi 2/2016 sur les institutions locales d'Euskadi, qui permettait l'usage du seul euskera dans les documents municipaux."}
  - {annee: 2025, evenement: "Le Tribunal suprême confirme l'annulation d'articles du décret 179/2019 sur l'usage de l'euskera dans les institutions locales (juillet)."}
  - {annee: 2026, evenement: "Le PNV, le PSE-EE et EH Bildu négocient hors du Parlement une réforme du Statut ; aucun texte n'est déposé au 2 octobre."}
fiabilite:
  verifie: ["Statut de 1979, art. 1, 2, 3, 6, 7, 10, 14, 16, 25, 26, 37, 41, 46 et disposition additionnelle (BOE, texte consolidé, dernière mise à jour publiée le 22 décembre 1979 : aucune réforme du Statut).", "Population au 1er janvier 2025 (Eustat).", "Surface de 7 234 km² (site touristique du Gouvernement basque).", "251 communes et 1 299 entités de population (fichiers de codes Eustat, 2017 et 2019).", "Rapport de la Charte publié le 24 septembre 2024 (Conseil de l'Europe).", "Décisions de 2023 (Tribunal constitutionnel) et 2025 (Tribunal suprême) sur l'usage de l'euskera dans les institutions locales (presse).", "Négociation de la réforme du Statut sans texte déposé au 2 octobre 2026 (presse)."]
  non_confirme: ["La disposition additionnelle du Statut dit que l'acceptation de l'autonomie n'implique pas la renonciation du Peuple basque à ses droits historiques ; sa portée juridique est débattue.", "Issue de la négociation sur la réforme du Statut (2026) inconnue.", "La liste Eustat des entités de population date de 2019 ; des créations ou suppressions ultérieures ne sont pas vérifiées.", "La Navarre, dont l'article 2 prévoit l'adhésion possible, relève d'un autre régime (Communauté forale) et n'est pas couverte par cette fiche."]
