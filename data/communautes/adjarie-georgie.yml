resume: >-
  L'Adjarie est une république autonome de la Géorgie, située sur la mer Noire autour de Batoumi. Son autonomie remonte à 1921 : une république soviétique autonome est créée en juillet, et le traité de Kars d'octobre cède Batoumi à la Géorgie soviétique sous condition d'autonomie locale. Elle ne repose sur aucune désignation ethnique : elle a été accordée à une population géorgienne de tradition musulmane. Depuis 2017, la loi constitutionnelle n° 1325 « sur la République autonome d'Adjarie » encadre sa constitution propre, son Conseil suprême de 21 députés au plus qui vote des lois et le budget, et un gouvernement dont le président est proposé par le président de la Géorgie. La Constitution de la Géorgie de 2018 renvoie ses compétences à des lois constitutionnelles (art. 7) et donne au Conseil suprême l'initiative des lois au Parlement géorgien (art. 45).
