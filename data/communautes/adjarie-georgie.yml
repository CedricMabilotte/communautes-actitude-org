  - {instrument: "Loi constitutionnelle de la Géorgie « sur la République autonome d'Adjarie », n° 1325-რს du 13 octobre 2017, publiée le 19 octobre 2017", nature: "statut_autonomie", annee: 2017, source: "https://www.matsne.gov.ge/en/document/view/3811829"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseil suprême (organe représentatif suprême) de 21 députés au plus, élus pour quatre ans au suffrage universel direct par les citoyens géorgiens inscrits en Adjarie, et gouvernement responsable devant lui (loi constitutionnelle de 2017, art. 3 et 4) ; le président de la Géorgie propose le président du gouvernement et les ministres, que le Conseil suprême approuve, et peut dissoudre le Conseil avec l'accord du Parlement géorgien ; le gouvernement adjar répond aussi devant le président et le gouvernement de la Géorgie (art. 3(8), 4(3) et 4(6)). L'exécutif est proposé par le pouvoir central et répond devant lui, d'où « partiel ».", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Conseil suprême adopte à la majorité des deux tiers la constitution de l'Adjarie, qui entre en vigueur après approbation par une loi organique de la Géorgie, et adopte les lois de l'Adjarie dans ses compétences propres (loi constitutionnelle de 2017, art. 1(4), 2(2)(a) et 3(5)) ; le gouvernement de la Géorgie peut suspendre ou annuler les actes du gouvernement adjar contraires au droit géorgien (art. 4(7)) ; les compétences de l'Adjarie sont fixées par la Constitution de la Géorgie, la loi constitutionnelle, la constitution de l'Adjarie « et les autres actes législatifs de la Géorgie » (art. 2(1)), et ses compétences hors liste ne s'exercent que dans les matières que la législation géorgienne ne réserve pas à l'État (art. 2(3)) : la loi ordinaire de l'État fixe le domaine, d'où « partiel ».", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La république autonome gère et cède les terres dont elle est propriétaire et assure la planification spatiale et territoriale, selon les règles du droit géorgien et adjar (loi constitutionnelle de 2017, art. 2(2)(d), (e) et (f)).", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  ressources: {valeur: "partiel", note: "La république autonome gère et cède les forêts et ressources en eau dont elle est propriétaire, dans le cadre du droit géorgien (loi constitutionnelle de 2017, art. 2(2)(e)).", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  consentement: {valeur: "partiel", note: "Les limites administratives de l'Adjarie peuvent être modifiées par une loi organique de la Géorgie à l'initiative de son Conseil suprême, qui statue à la majorité des deux tiers (loi constitutionnelle de 2017, art. 1(2)) ; la loi ne prévoit pas d'autre consultation obligatoire.", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La république autonome crée, gère et soutient les établissements d'enseignement, de recherche, d'art et de sport d'importance régionale, et peut exercer des compétences en éducation, culture, sport et jeunesse non réservées à l'État ni aux collectivités locales (loi constitutionnelle de 2017, art. 2(2)(h) et 2(3)).", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  fiscalite: {valeur: "partiel", note: "Le Conseil suprême adopte la loi de budget de l'Adjarie ; la république autonome dispose d'une « autonomie financière dans les limites fixées par la législation de la Géorgie » et peut recevoir une part des recettes fiscales de l'État et un financement spécial du budget national (loi constitutionnelle de 2017, art. 2(2)(c), 2(5) et 3(5)(d)).", source: "https://www.matsne.gov.ge/en/document/view/3811829"}
  representation: {valeur: "partiel", note: "Le Conseil suprême détient l'initiative législative au Parlement de la Géorgie (Constitution de 2018, art. 45(1)) ; ses membres font partie du collège électoral qui élit le président de la Géorgie (art. 50(3)) ; il peut, comme le gouvernement adjar, saisir la Cour constitutionnelle d'un conflit de compétences (art. 60(4)(d)) ; un Sénat comprenant des membres élus en Adjarie n'est prévu qu'après le rétablissement de la juridiction géorgienne sur tout le territoire (art. 37(1)).", source: "https://www.constituteproject.org/constitution/Georgia_2018"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Conseil suprême élu le 26 octobre 2024 a tenu sa première session le 26 novembre 2024 et élu son président et ses présidents de commission, alors que l'opposition, qui conteste la régularité des élections, refuse de siéger (Civil.ge).", source: "https://civil.ge/archives/638034"}
chronologie:
  - {annee: 1921, evenement: "Création de la République socialiste soviétique autonome d'Adjarie (juillet) ; traité de Kars (13 octobre) : la Turquie cède Batoumi et sa région à la Géorgie soviétique sous condition d'autonomie locale."}
  - {annee: 2004, evenement: "Départ du dirigeant Aslan Abachidze en mai ; loi n° 305 du 1er juillet sur le statut de la République autonome d'Adjarie."}
  - {annee: 2017, evenement: "Loi constitutionnelle n° 1325 du 13 octobre « sur la République autonome d'Adjarie », qui abroge celle de 2004."}
  - {annee: 2018, evenement: "Entrée en vigueur de la Constitution révisée de la Géorgie : compétences de l'Adjarie fixées par loi constitutionnelle (art. 7) et initiative législative de son Conseil suprême (art. 45)."}
  - {annee: 2024, evenement: "Élection du Conseil suprême le 26 octobre (participation de 63,6 %) ; 13 sièges sur 21 au Rêve géorgien."}
  - {annee: 2025, evenement: "Fin, à leur demande, du mandat de six députés d'opposition du Conseil suprême (février)."}
