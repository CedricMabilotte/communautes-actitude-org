base_nationale:
  - {instrument: "Constitution libanaise de 1926, art. 9, 10, 19 et 24", nature: "constitution", annee: 1926, source: "https://www.constituteproject.org/constitution/Lebanon_2004?lang=en"}
  - {instrument: "Arrêté n° 60 L.R. du 13 mars 1936 fixant le statut des communautés, modifié par l'arrêté n° 146 L.R. du 18 novembre 1938", nature: "loi", annee: 1936, source: "https://www.lagbd.org/La_curieuse_cat%C3%A9gorie_des_communaut%C3%A9s_de_droit_commun_au_Liban_(lb)"}
  - {instrument: "Loi du 2 avril 1951 relative aux attributions des autorités religieuses des confessions chrétiennes et de la confession israélite", nature: "loi", annee: 1951, source: "https://iedja.org/lorganisation-juridictionnelle-du-liban/"}
  - {instrument: "Loi du 16 juillet 1962 sur les juridictions sunnites et chiites", nature: "loi", annee: 1962, source: "https://iedja.org/lorganisation-juridictionnelle-du-liban/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Arrêté n° 60 L.R. de 1936, art. 1 : chaque communauté historique a une organisation fixée par un acte législatif (régime inapplicable aux communautés musulmanes depuis l'arrêté n° 53 L.R. de 1939) ; ses chefs peuvent saisir le Conseil constitutionnel en matière de statut personnel, de liberté de croyance et d'enseignement religieux (Constitution, art. 19).", source: "https://www.lagbd.org/La_curieuse_cat%C3%A9gorie_des_communaut%C3%A9s_de_droit_commun_au_Liban_(lb)"}
  pouvoir_normatif: {valeur: "partiel", note: "Arrêté n° 60 L.R. de 1936 : autonomie législative des communautés chrétiennes et juive en matière de statut personnel ; pour les communautés musulmanes, exclues de ce régime par l'arrêté n° 53 L.R. de 1939, la législation relève de l'État ; 15 régimes de statut personnel s'appliquent aux 18 communautés reconnues.", source: "https://www.lagbd.org/La_curieuse_cat%C3%A9gorie_des_communaut%C3%A9s_de_droit_commun_au_Liban_(lb)"}
  justice_propre: {valeur: "partiel", note: "Tribunaux ecclésiastiques (loi du 2 avril 1951) compétents en matière de mariage, de divorce, de garde et de pension alimentaire, sans compétence successorale ; tribunaux de la charia (loi islamique) sunnites et jaafarites (chiites) (loi du 16 juillet 1962), compétents aussi en matière successorale ; pourvoi devant l'assemblée plénière de la Cour de cassation. Les juges des tribunaux ecclésiastiques sont nommés et rémunérés par leurs communautés ; ceux des tribunaux de la charia sont des fonctionnaires de l'État (EuroMed Droits, 2018). La désignation des juges par les communautés ne vaut pas pour les tribunaux de la charia, dont les juges sont nommés par l'État.", source: "https://iedja.org/lorganisation-juridictionnelle-du-liban/"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_applicable", note: "Fiche à base personnelle : le régime porte sur des personnes et des biens cultuels, sans territoire ni ressource naturelle.", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Constitution, art. 10 : le droit des communautés à avoir leurs propres écoles privées ne peut être atteint, sous réserve des règles générales de l'État sur l'instruction publique.", source: "https://www.constituteproject.org/constitution/Lebanon_2004?lang=en"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Constitution, art. 24 : sièges répartis à parts égales entre chrétiens et musulmans et proportionnellement entre les confessions ; depuis l'accord de Taëf (1989), 64 sièges chrétiens, 27 sunnites, 27 chiites et 2 alaouites sur 128 ; les communautés ismaélienne et juive n'ont pas de siège propre.", source: "https://en.wikipedia.org/wiki/Parliament_of_Lebanon"}
  statut_personnel: {valeur: "partiel", note: "Constitution, art. 9 : l'État garantit le respect du statut personnel et des intérêts religieux des populations, quelle que soit leur confession ; arrêté n° 60 L.R. de 1936 (communautés chrétiennes et juive) et loi du 16 juillet 1962 (sunnites et chiites) : statut personnel régi par le droit de chaque communauté. Le régime se limite au statut personnel ; il ne crée ni nationalité ni droit de résidence propres.", source: "https://www.constituteproject.org/constitution/Lebanon_2004?lang=en"}
  autodetermination_externe: {valeur: "non_applicable", note: "Constitution, art. 1 : le Liban est un État indépendant, d'une unité indivisible ; le préambule exclut toute partition.", source: "https://www.constituteproject.org/constitution/Lebanon_2004?lang=en"}
effectivite: {valeur: "effective", note: "Selon l'Agence de l'Union européenne pour l'asile, les affaires de statut personnel sont jugées par les tribunaux de la charia sunnites et chiites et par les tribunaux ecclésiastiques ; les membres de groupes non reconnus n'ont pas accès à un tribunal de leur confession.", source: "https://www.euaa.europa.eu/lebanon-country-focus/311-personal-status-law-and-courts"}
chronologie:
  - {annee: 1926, evenement: "Constitution : respect du statut personnel des communautés (art. 9) et répartition confessionnelle des sièges (art. 24)."}
  - {annee: 1936, evenement: "Arrêté n° 60 L.R. du 13 mars : reconnaissance des communautés historiques, liste annexée de 16 communautés."}
  - {annee: 1938, evenement: "Arrêté n° 146 L.R. du 18 novembre : ajout de la communauté protestante."}
  - {annee: 1939, evenement: "Arrêté n° 53 L.R. du 30 mars : les arrêtés de 1936 et 1938 sont déclarés sans application à l'égard des musulmans."}
  - {annee: 1951, evenement: "Loi du 2 avril sur les juridictions des communautés chrétiennes et juive."}
  - {annee: 1962, evenement: "Loi du 16 juillet sur les tribunaux de la charia sunnites et jaafarites."}
  - {annee: 1989, evenement: "Accord de Taëf : parité des sièges entre chrétiens et musulmans."}
  - {annee: 1996, evenement: "Reconnaissance de la communauté copte orthodoxe, dix-huitième communauté."}
