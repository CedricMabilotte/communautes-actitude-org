resume: >-
  L'arrêté n° 60 L.R. du 13 mars 1936, pris par le haut-commissaire de la puissance mandataire, reconnaît comme « communautés à statut personnel » les communautés historiques dont l'organisation, les juridictions et la législation sont fixées par un acte législatif.
  L'arrêté n° 53 L.R. du 30 mars 1939 déclare ce régime sans application à l'égard des musulmans : l'organisation des communautés musulmanes relève depuis de lois de l'État.
  Cette fiche couvre douze communautés chrétiennes, quatre communautés musulmanes (sunnite, chiite, alaouite, ismaélienne) et la communauté juive ; la communauté druze a sa propre fiche.
  Le statut personnel (mariage, divorce, garde des enfants) de leurs membres relève de tribunaux confessionnels organisés par la loi du 2 avril 1951 pour les chrétiens et les juifs et par la loi du 16 juillet 1962 pour les sunnites et les chiites.
  La Constitution répartit les sièges de la Chambre des députés entre les confessions (art. 24).
