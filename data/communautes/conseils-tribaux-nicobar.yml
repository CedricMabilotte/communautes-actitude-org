resume: >-
  Les Nicobarais, inscrits sur la liste des Scheduled Tribes (groupes protégés par la Constitution indienne), vivent dans l'archipel des Nicobar. Le règlement présidentiel de 2009 sur les conseils tribaux crée, « pour donner une plus grande autonomie aux Scheduled Tribes nicobaraises dans la gestion de leurs affaires », des assemblées générales de village, des conseils de village dirigés par un premier capitaine et des conseils d'île dirigés par un capitaine en chef. Ce régime s'applique hors des zones relevant du règlement de 1994 sur les panchayats (conseils locaux ordinaires) et reste subordonné au règlement de 1956 sur la protection des populations aborigènes (Protection of Aboriginal Tribes Regulation). L'administration du district dispose d'un droit de suspension de leurs décisions ; un projet de règles électorales publié en mai 2026 est contesté par des chefs nicobarais.
