resume: >-
  Fiche agrégée : elle couvre les communautés riveraines qui gèrent une forêt communautaire au Cameroun. La loi forestière n° 94/01 du 20 janvier 1994 (art. 37 et 38) a créé ce régime ; la loi n° 2024/008 du 24 juillet 2024, qui en abroge les dispositions contraires (art. 190), le reprend (art. 37 à 39 et 72) : une forêt naturelle du domaine forestier non permanent (forêts du domaine national qui peuvent être affectées à d'autres usages) est attribuée en jouissance (droit d'usage et d'exploitation, sans propriété) par l'État à une communauté riveraine, par une convention de gestion (contrat entre la communauté et l'administration forestière) et un plan simple de gestion (document qui programme les activités dans la forêt). La communauté, constituée en association, coopérative, groupe d'initiative commune ou groupement d'intérêt économique, gère la forêt sous le contrôle technique de l'administration ; les ressources forestières tirées de l'exploitation lui appartiennent. La superficie est plafonnée à 5 000 ha par forêt (décret n° 95/531/PM, art. 27). La couche cartographique du ministère des Forêts et de la Faune compte 762 entrées, dont 758 identifiées.
