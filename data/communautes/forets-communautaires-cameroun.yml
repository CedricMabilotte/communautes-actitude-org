reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Cameroun à la Convention sur la diversité biologique (mars 2014) : le nombre de forêts communautaires atteint 301 sites, pour environ un million d'hectares, en 2011 ; le rapport rattache la révision des procédures d'attribution à l'objectif national 13 (approches communautaires de la conservation). La stratégie nationale pour la biodiversité (version II, décembre 2012), publiée par la Convention, cite le même chiffre.", annee: 2014, source: "https://www.cbd.int/doc/world/cm/cm-nr-05-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 2024/008 du 24 juillet 2024 portant régime des forêts et de la faune, art. 3, 6, 7, 35, 37 à 39, 72, 147, 148 et 190", nature: "loi", annee: 2024, source: "https://www.prc.cm/fr/actualites/actes/lois/7298"}
  - {instrument: "Loi n° 94/01 du 20 janvier 1994 portant régime des forêts, de la faune et de la pêche, art. 37 et 38 (abrogée par la loi n° 2024/008 pour ses dispositions contraires)", nature: "loi", annee: 1994, source: "https://faolex.fao.org/docs/pdf/cmr4845.pdf"}
  - {instrument: "Décret n° 95/531/PM du 23 août 1995 fixant les modalités d'application du régime des forêts, art. 27 à 32, 95 et 96", nature: "loi", annee: 1995, source: "https://faolex.fao.org/docs/pdf/cmr4471.pdf"}
  - {instrument: "Arrêté n° 0518/MINEF/CAB du 21 décembre 2001 fixant les modalités d'attribution en priorité aux communautés villageoises riveraines de toute forêt susceptible d'être érigée en forêt communautaire", nature: "loi", annee: 2001, source: "https://faolex.fao.org/docs/pdf/cmr195736.pdf"}
  - {instrument: "Décision n° 0098/D/MINFOF du 2 février 2009 portant adoption du Manuel des procédures d'attribution et des normes de gestion des forêts communautaires", nature: "loi", annee: 2009, source: "https://faolex.fao.org/docs/pdf/cmr195731.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté tient une réunion de concertation de toutes ses composantes, sous la supervision de l'autorité administrative locale, pour désigner le responsable de la gestion, et doit avoir la personnalité morale (décret n° 95/531/PM, art. 28) ; la mise en œuvre de la convention de gestion relève de la communauté, sous l'assistance obligatoire et le contrôle technique de l'administration forestière, qui peut exécuter d'office les travaux ou résilier la convention (loi n° 2024/008, art. 39).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque communauté définit les modalités d'attribution des titres d'exploitation dans sa forêt (décret n° 95/531/PM, art. 95, al. 2) ; le plan simple de gestion est établi à la diligence des intéressés et toute activité dans la forêt doit s'y conformer (loi n° 94/01, art. 37, al. 2), mais il est approuvé par l'administration forestière (loi n° 2024/008, art. 72).", source: "https://faolex.fao.org/docs/pdf/cmr4471.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire, située dans le domaine forestier non permanent, est attribuée en jouissance par l'État (loi n° 2024/008, art. 35 et 37) ; la convention est provisoire pour deux ans au plus, puis définitive pour vingt-cinq ans renouvelables, avec retrait possible du titre de jouissance en cas d'inexécution du cahier des charges (art. 38) ; la superficie ne peut dépasser 5 000 ha et la forêt est attribuée en priorité à la communauté riveraine la plus proche (décret n° 95/531/PM, art. 27).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298"}
  ressources: {valeur: "partiel", note: "Les ressources forestières de toute nature tirées de l'exploitation appartiennent à la communauté (loi n° 2024/008, art. 37, al. 3), qui exploite pour son compte, en régie ou en sous-traitance, par vente de coupe, permis ou autorisation personnelle de coupe, selon le plan simple de gestion approuvé par l'administration (art. 72) ; les communautés riveraines ont un droit de préemption (priorité d'achat) sur les produits naturels des forêts où elles exercent leurs droits d'usage (art. 7).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298"}
  consentement: {valeur: "partiel", note: "Avant toute vente de coupe, la liste des forêts concernées est notifiée aux villages riverains contre récépissé signé par l'autorité traditionnelle ; ils ont trois mois pour demander à ériger ces forêts en forêts communautaires, et toute vente de coupe qui chevauche une forêt communautaire en cours d'attribution ou attribuée est nulle (arrêté n° 0518 de 2001, art. 6 et 7) ; l'État consulte les populations par leurs institutions représentatives avant de suspendre ou restreindre les droits d'usage (loi n° 2024/008, art. 6) ; aucun consentement préalable n'est exigé.", source: "https://faolex.fao.org/docs/pdf/cmr195736.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Au titre de l'exploitation de leurs forêts, les communautés riveraines perçoivent le prix de vente des produits forestiers et la redevance forestière annuelle (taxe calculée sur la superficie exploitée), à l'exclusion des impôts, droits et taxes (loi n° 2024/008, art. 147) ; les revenus tirés des forêts communautaires reviennent à 100 % à la communauté et sont gérés par le bureau de l'entité juridique selon le plan simple de gestion (arrêté conjoint n° 0000076/MINATD/MINFI/MINFOF du 26 juillet 2012, art. 7, cité par Forest Peoples Programme).", source: "https://www.forestpeoples.org/fileadmin/uploads/fpp/migration/documents/Community%20conservation%20in%20Cameroon%20FR%20v5.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Dans la couche cartographique du ministère des Forêts et de la Faune, 338 forêts ont une convention provisoire (plus 19 notées « Convention provisoire ») et 327 une convention définitive. Une étude publiée par Forest Peoples Programme (enquêtes de 2022 à Ngoyla) relève des procédures longues et coûteuses (choix d'une forme juridique, cartographie, inventaires, sept exemplaires du plan simple de gestion) ; dans la forêt communautaire de Djoko, l'attribution d'une convention provisoire (achevée en 2020) a été suivie d'une exploitation par l'exploitant forestier autorisé par la communauté ; des Baka interrogés disent que leur porte-parole a été payé et qu'ils ne veulent pas de l'exploitation forestière. Une note d'analyse d'organisations de la société civile (novembre 2024) critique la durée des conventions et la possibilité pour l'État de se substituer aux communautés.", source: "https://www.forestpeoples.org/fileadmin/uploads/fpp/migration/documents/Community%20conservation%20in%20Cameroon%20FR%20v5.pdf"}
chronologie:
  - {annee: 1994, evenement: "Loi n° 94/01 du 20 janvier 1994 : création des forêts communautaires (art. 37 et 38)."}
  - {annee: 1995, evenement: "Décret n° 95/531/PM du 23 août 1995 : procédure d'attribution, plafond de 5 000 ha, priorité à la communauté riveraine la plus proche."}
  - {annee: 1997, evenement: "Conventions de gestion signées pour Mbimboé et COFAYET-Bengbis, les plus anciennes de la liste officielle publiée en 2000."}
  - {annee: 2000, evenement: "Décision n° 1305/D/MINEF/DF/CFC du 23 octobre 2000 : liste officielle de sept forêts attribuées."}
  - {annee: 2001, evenement: "Arrêté n° 0518/MINEF/CAB du 21 décembre 2001 : attribution en priorité aux communautés villageoises riveraines."}
  - {annee: 2009, evenement: "Adoption du Manuel des procédures d'attribution et des normes de gestion des forêts communautaires (décision n° 0098 du 2 février 2009)."}
  - {annee: 2011, evenement: "301 forêts communautaires pour environ un million d'hectares, selon le cinquième rapport national à la Convention sur la diversité biologique."}
  - {annee: 2012, evenement: "Arrêté conjoint n° 0000076 du 26 juillet 2012 sur la planification et le suivi des revenus forestiers des communes et des communautés villageoises riveraines."}
  - {annee: 2024, evenement: "Loi n° 2024/008 du 24 juillet 2024 portant régime des forêts et de la faune : abrogation des dispositions contraires de la loi de 1994, convention définitive de vingt-cinq ans renouvelables."}
fiabilite:
  verifie:
    - "Articles 3, 6, 7, 35, 37 à 39, 72, 147, 148 et 190 de la loi n° 2024/008 dans le texte publié par la Présidence de la République (PDF de 53 pages)."
    - "Articles 37 et 38 de la loi n° 94/01 dans le texte publié par FAOLEX."
    - "Définition de la forêt communautaire et articles 27 à 32, 95 et 96 du décret n° 95/531/PM dans la copie numérisée publiée par FAOLEX (texte d'origine de 1995)."
    - "Articles 1 à 9 de l'arrêté n° 0518/MINEF/CAB de 2001 et liste de la décision n° 1305 de 2000 dans les copies publiées par FAOLEX."
    - "301 sites et environ un million d'hectares en 2011 dans le cinquième rapport national (2014) et la stratégie nationale version II (2012), publiés sur le site de la Convention sur la diversité biologique."
    - "762 entrées, statut des conventions, superficies administratives et dates des conventions dans la couche « Forêts communautaires » du portail de données du ministère des Forêts et de la Faune, interrogée le 1er octobre 2026."
  non_confirme:
    - "La loi n° 2024/008 ne reprend pas expressément la priorité d'attribution aux communautés riveraines ; celle-ci repose sur le décret n° 95/531/PM (art. 27) et l'arrêté n° 0518 de 2001, dont le maintien en vigueur après 2024 n'a pas été vérifié ; aucun décret d'application de la loi de 2024 n'a été trouvé."
    - "Le décret n° 95/531/PM a été modifié en 2000, 2001 et 2006 ; seules les versions d'origine des articles cités ont été lues."
    - "La part de 100 % des revenus à la communauté (arrêté conjoint de 2012, art. 7) est citée d'après Forest Peoples Programme ; le texte de l'arrêté n'a pas été ouvert."
    - "La notice de la couche cartographique indique que les données les plus récentes datent de 2013 et que la couche n'est pas exhaustive, alors que des conventions y sont datées jusqu'en 2025 ; la couche contient des doublons probables (Komba I, Woué, Bibioki de Parny) et des entrées sans statut."
    - "La couche ne donne ni la région ni le département ; la colonne subdivision du tableau reste vide. L'année du tableau est celle de la convention provisoire, à défaut celle de la convention définitive."
    - "Population et nombre de villages concernés : aucune source trouvée."
