droits:
  autogouvernement: {valeur: "partiel", note: "La loi 19.253 (art. 67 et 68) crée la Commission de développement de l'île de Pâques, où siègent six membres rapa nui élus aux côtés de représentants de l'État.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-19253&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=30620.2024-01-01.0.0%23"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi 19.253 (art. 69) charge la Commission de constituer la propriété des membres rapa nui possesseurs de terres ; l'État conserve le parc national, soit environ la moitié de l'île.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-19253&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=30620.2024-01-01.0.0%23"}
  ressources: {valeur: "partiel", note: "Depuis novembre 2017, la communauté Ma'u Henua administre par concession de 50 ans le parc national, qui comprend les sites sacrés et les moai.", source: "https://www.interior.gob.cl/noticias/2017/11/23/presidenta-bachelet-entrega-administracion-del-parque-nacional-rapa-nui-a-la-comunidad-de-isla-de-pascua/"}
  consentement: {valeur: "partiel", note: "La loi 21.070 de 2018 (art. 25) place les six commissaires rapa nui élus et trois représentants du peuple rapa nui dans le conseil qui intervient sur la capacité de charge démographique ; la Convention 169 (ratifiée en 2008) impose la consultation.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-21070_23-MAR-2018&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=1116414.2018-08-01.0.0%23"}
  langue: {valeur: "partiel", note: "La loi 19.253 (art. 28 a) prévoit l'usage des langues indigènes aux côtés de l'espagnol dans les zones de forte densité indigène, sans statut officiel.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-19253&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=30620.2024-01-01.0.0%23"}
  education: {valeur: "partiel", note: "La loi 19.253 (art. 32) prévoit un système d'éducation interculturelle bilingue dans les zones de forte densité indigène, conduit par l'État.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-19253&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=30620.2024-01-01.0.0%23"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La loi 21.070 de 2018 (art. 2, 5 et 6) limite à 30 jours le séjour des personnes non rapa nui ; les membres du peuple rapa nui, définis par l'article 66 de la loi 19.253, ne sont pas soumis à cette limite.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-21070_23-MAR-2018&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=1116414.2018-08-01.0.0%23"}
