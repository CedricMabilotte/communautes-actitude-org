resume: >-
  Les Rapa Nui sont le peuple autochtone de l'île de Pâques, rattachée au Chili par l'acte de cession de souveraineté du 9 septembre 1888. La loi 19.253 de 1993 sur les peuples autochtones crée la Commission de développement de l'île de Pâques, où siègent six membres rapa nui élus. Depuis 2012, la Constitution (art. 126 bis) fait de l'île un territoire spécial ; la loi 21.070 de 2018 limite à 30 jours le séjour des personnes non rapa nui. Depuis 2017, la communauté Ma'u Henua administre le parc national par concession. Le statut spécial de gouvernement prévu par la Constitution n'a pas été adopté : le projet est rejeté en consultation le 1er février 2026. Le recensement de 2024 compte 4 800 habitants dans la commune, dont 2 579 personnes qui se déclarent rapa nui, et 6 659 Rapa Nui dans l'ensemble du Chili.
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Chili ratifie la Convention 169 de l'OIT le 15 septembre 2008 (en vigueur le 15 septembre 2009).", annee: 2008, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Chili vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Déclaration du Rapporteur spécial James Anaya sur les expulsions de Rapa Nui ; il demande la reconnaissance des droits fonciers ancestraux des clans au titre de la Convention 169.", annee: 2011, source: "https://www.ohchr.org/es/statements/2011/01/default-title"}
base_nationale:
  - {instrument: "Loi 19.253 de 1993 sur les peuples autochtones, art. 28, 32, 41 et 66 à 70", nature: "loi", annee: 1993, source: "https://www.bcn.cl/leychile/navegar?idNorma=30620"}
  - {instrument: "Constitution politique, art. 126 bis (loi de réforme constitutionnelle 20.573 de 2012) et disposition transitoire 22", nature: "constitution", annee: 2012, source: "https://www.bcn.cl/leychile/navegar?idNorma=242302"}
  - {instrument: "Loi 21.070 de 2018 sur la résidence, le séjour et les déplacements vers et depuis le territoire spécial de l'île de Pâques", nature: "loi", annee: 2018, source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-21070_23-MAR-2018&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=1116414.2018-08-01.0.0%23"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 19.253 (art. 67 et 68) crée la Commission de développement de l'île de Pâques (CODEIPA) : six membres rapa nui élus, dont le président du Conseil des anciens, y siègent avec des représentants de l'État, sous la présidence du représentant du gouvernement sur l'île.", source: "https://www.bcn.cl/leychile/navegar?idNorma=30620"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 19.253, qui vise les Rapa Nui (art. 66), dispose que la coutume invoquée en justice entre autochtones d'une même ethnie constitue du droit, si elle n'est pas incompatible avec la Constitution, et qu'en matière pénale elle peut servir de circonstance exonératoire ou atténuante (art. 54). Les institutions rapa nui n'édictent pas de normes.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi 19.253 (art. 69) charge la Commission de constituer la propriété des membres rapa nui possesseurs de terres et de proposer des attributions gratuites de terres de l'État ; les terres attribuées sont des terres autochtones au sens de l'art. 12, avec les protections de la loi. Les titres sont accordés par décret du ministère des Biens nationaux.", source: "https://www.bcn.cl/leychile/navegar?idNorma=30620"}
  ressources: {valeur: "partiel", note: "Depuis le 23 novembre 2017, la communauté Ma'u Henua administre par concession de 50 ans renouvelable le parc national, qui comprend les sites sacrés et les moai et couvre la moitié de l'île selon le ministère de l'Intérieur.", source: "https://www.interior.gob.cl/noticias/2017/11/23/presidenta-bachelet-entrega-administracion-del-parque-nacional-rapa-nui-a-la-comunidad-de-isla-de-pascua/"}
  consentement: {valeur: "partiel", note: "La loi 21.070 de 2018 (art. 24 à 26) crée un conseil de gestion de la capacité de charge démographique (nombre de personnes que l'île peut accueillir) formé du maire, des six commissaires rapa nui élus et de trois représentants du peuple rapa nui ; il collabore et rend des avis, sans pouvoir de décision. La Convention 169, ratifiée en 2008, impose la consultation.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-21070_23-MAR-2018&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=1116414.2018-08-01.0.0%23"}
  langue: {valeur: "partiel", note: "La loi 19.253 (art. 28 a) prévoit l'usage et la conservation des langues autochtones aux côtés de l'espagnol dans les zones de forte densité autochtone, sans statut officiel.", source: "https://www.bcn.cl/leychile/navegar?idNorma=30620"}
  education: {valeur: "partiel", note: "La loi 19.253 (art. 32) prévoit un système d'éducation interculturelle bilingue dans les zones de forte densité autochtone, conduit par l'organisme public chargé des peuples autochtones (CONADI).", source: "https://www.bcn.cl/leychile/navegar?idNorma=30620"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La loi 19.253 (art. 41 d) réserve un siège rapa nui parmi les huit représentants autochtones du conseil national de la CONADI ; le titulaire est nommé par le président de la République sur proposition des communautés.", source: "https://www.bcn.cl/leychile/navegar?idNorma=30620"}
  statut_personnel: {valeur: "reconnu", note: "La loi 21.070 de 2018 (art. 2, 5 et 6) limite à 30 jours le séjour des personnes non rapa nui ; les membres du peuple rapa nui, définis par l'article 66 de la loi 19.253, ne sont pas soumis à cette limite. La qualité de Rapa Nui conditionne ainsi le droit de séjourner sur l'île.", source: "https://nuevo.leychile.cl/servicios/Consulta/Exportar?radioExportar=Normas&exportar_formato=pdf&nombrearchivo=Ley-21070_23-MAR-2018&exportar_con_notas_bcn=False&exportar_con_notas_originales=False&exportar_con_notas_al_pie=False&hddResultadoExportar=1116414.2018-08-01.0.0%23"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2011, le Rapporteur spécial de l'ONU s'inquiète d'expulsions violentes de Rapa Nui et demande un dialogue de bonne foi sur les revendications foncières des clans. Le statut spécial de gouvernement prévu par la Constitution depuis 2012 n'a pas été adopté : le projet soumis à consultation est rejeté le 1er février 2026 et l'île reste régie par les règles communes.", source: "https://www.biobiochile.cl/noticias/nacional/chile/2026/02/03/autoridades-de-rapa-nui-piden-seguir-con-proceso-de-autonomia-tras-fallida-consulta-del-gobierno.shtml"}
chronologie:
  - {annee: 1888, evenement: "Acte de cession de souveraineté entre l'État chilien et les chefs rapa nui (9 septembre)."}
  - {annee: 1993, evenement: "La loi 19.253 crée la Commission de développement de l'île de Pâques."}
  - {annee: 2011, evenement: "Déclaration du Rapporteur spécial de l'ONU sur les expulsions de Rapa Nui."}
  - {annee: 2012, evenement: "La réforme constitutionnelle 20.573 (art. 126 bis) fait de l'île de Pâques un territoire spécial et renvoie à un statut spécial de gouvernement."}
  - {annee: 2017, evenement: "L'administration du parc national est confiée à la communauté Ma'u Henua (23 novembre)."}
  - {annee: 2018, evenement: "Publication de la loi 21.070 (23 mars)."}
  - {annee: 2021, evenement: "Un siège réservé au peuple rapa nui à la Convention constitutionnelle (disposition transitoire 46 de la Constitution)."}
  - {annee: 2025, evenement: "Ouverture de la consultation autochtone sur le projet de statut spécial de l'île (13 août)."}
  - {annee: 2026, evenement: "Le projet de statut spécial est rejeté lors du vote de la consultation (1er février) : 955 voix contre et 114 pour, selon la délégation présidentielle provinciale."}
fiabilite:
  verifie: ["Articles 28, 32, 41 et 66 à 70 de la loi 19.253, version en vigueur du 29 septembre 2025 ; ces articles n'ont pas été modifiés depuis 2014.", "Articles 1, 2, 5, 6, 11 et 24 à 26 de la loi 21.070.", "Article 126 bis et dispositions transitoires 22 et 46 de la Constitution.", "Durée de la concession Ma'u Henua (communiqué du ministère de l'Intérieur, 2017).", "Population communale (4 800) et population rapa nui (2 579 dans la commune, 6 659 au Chili) : fichiers du recensement 2024 de l'INE.", "Entités habitées de la commune : publication de l'INE « Ciudades, pueblos, aldeas y caseríos 2019 ».", "Résultat du vote du 1er février 2026 (communiqué de la délégation présidentielle provinciale)."]
  non_confirme: ["Décret fondant la concession Ma'u Henua (décret 119 de 2018, non ouvert).", "Suites données au projet de statut spécial après le vote de 2026 et après le changement de gouvernement de mars 2026.", "Publication du décret fixant la capacité de charge démographique (art. 11 de la loi 21.070).", "Écart de chiffres sur le vote de 2026 : la délégation présidentielle donne 955 voix contre et 114 pour ; El Dínamo donne 959 contre, BioBioChile 164 pour."]
