resume: >-
  Fiche agrégée : elle couvre les huit falekaupule de Tuvalu, assemblées traditionnelles de chaque île « composées selon l'Aganu », c'est-à-dire la coutume locale. La loi sur les falekaupule de 1997 (chap. 4.08, en vigueur en 1999) en fait l'autorité locale de chaque île, avec un organe exécutif élu de six membres, le kaupule, qui exerce les fonctions de l'annexe 3 (agriculture, pêche, écoles primaires, aménagement, ordre public). Le kaupule lève les taxes locales et adopte des règlements locaux (bye-laws) avec l'approbation du falekaupule ; la base mondiale des aires protégées lui attribue la gestion de neuf aires de conservation marines et terrestres. La Constitution révisée, entrée en vigueur le 1er octobre 2023, reconnaît à l'article 140 le falekaupule comme autorité traditionnelle de gouvernement de chaque île.
