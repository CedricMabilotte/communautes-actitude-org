droits:
  autogouvernement: {valeur: "partiel", note: "Chaque communauté traditionnelle reconnue dispose d'un conseil traditionnel (traditional council) qui administre ses affaires selon la coutume (loi n° 3 de 2019, art. 20 (1) (a)) ; 60 % de ses membres sont choisis selon la coutume par le chef qui le préside et 40 % sont élus (art. 16 (2) (c)). La loi n° 3 de 2019 a été déclarée invalide par la Cour constitutionnelle en 2023, avec effet suspendu jusqu'au 29 mai 2027. Le roi ou son représentant préside le conseil d'administration de la fiducie, dont les huit autres membres sont nommés par le ministre (loi n° 3KZ de 1994, art. 2A (3)).", source: "https://www.gov.za/sites/default/files/gcis_document/201911/4286528-11act3of2019tradkhoisanleadership.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil d'administration, que la loi désigne ici sous le nom d'Ingonyama (art. 1), gère les terres « in accordance with Zulu indigenous law or any other applicable law » (loi n° 3KZ de 1994, art. 2 (4)) ; la Constitution reconnaît les autorités traditionnelles qui observent un système de droit coutumier et impose aux tribunaux d'appliquer ce droit lorsqu'il est applicable (art. 211 (2) et (3)). Aucun pouvoir d'édicter des lois.", source: "https://www.justice.gov.za/legislation/constitution/SAConstitution-web-eng-12.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les terres sont dévolues à l'Ingonyama, fiduciaire, « for and on behalf of the members of the tribes and communities and the residents » (loi n° 3KZ de 1994, art. 3 (1) (a)) ; le titre est au nom du fiduciaire, non des communautés. Le dispositif du jugement du 11 juin 2021 (point 1.1) qualifie les personnes qui vivent sur ces terres de « true and beneficial owners » (propriétaires véritables et bénéficiaires) au regard du droit coutumier zoulou et les protège au titre de la loi n° 31 de 1996.", source: "https://www.saflii.org/za/cases/ZAKZPHC/2021/42.html"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le conseil d'administration, désigné ici sous le nom d'Ingonyama (art. 1), ne peut grever, louer, aliéner ou céder une terre ou un droit réel sans le consentement écrit préalable de l'autorité traditionnelle ou communautaire concernée (loi n° 3KZ de 1994, art. 2 (5)). Nul ne peut être privé d'un droit foncier informel sans son consentement, sous réserve de l'expropriation ; les droits d'un bénéficiaire de fiducie publique sont des droits informels au sens de cette loi (art. 1 (iii) (b)) ; sur une terre communale, la décision revient à la majorité des titulaires de droits réunis à cet effet (loi n° 31 de 1996, art. 2 (1), (2) et (4)).", source: "https://ingonyamatrust.org.za/wp-content/uploads/2026/05/Ingonyama-Trust-Act-as-amended.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
