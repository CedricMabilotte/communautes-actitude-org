effectivite: {valeur: "contestee", note: "La Haute Cour de Pietermaritzburg a déclaré illicites les baux résidentiels conclus depuis 2007 avec des titulaires de droits coutumiers et ordonné le remboursement des loyers (11 juin 2021) ; la fiducie a retiré son appel le 3 novembre 2023 et a commencé les remboursements en juillet 2025 pour 1 602 résidents, selon le Legal Resources Centre. Le 18 mars 2026, le ministre a mis fin au mandat des membres restants du conseil d'administration et annoncé la désignation d'un administrateur, selon la fiducie, qui conteste la légalité de cette décision.", source: "https://lrc.org.za/lrc-welcomes-start-of-ingonyama-trust-lease-repayments/"}
chronologie:
  - {annee: 1994, evenement: "Loi n° 3KZ de l'assemblée législative du KwaZulu : les terres du gouvernement du KwaZulu sont transférées à l'Ingonyama Trust (sanction le 25 avril 1994, effet au 24 avril)."}
  - {annee: 1996, evenement: "Loi n° 31 sur la protection provisoire des droits fonciers informels."}
  - {annee: 1997, evenement: "Loi modificative n° 9 : création de l'Ingonyama Trust Board ; la loi devient une loi nationale."}
  - {annee: 2007, evenement: "Début du programme de conversion des permis d'occupation (Permission to Occupy) en baux résidentiels de 40 ans."}
  - {annee: 2019, evenement: "Loi n° 3 sur les autorités traditionnelles et khoï-san."}
  - {annee: 2021, evenement: "Jugement CASAC v Ingonyama Trust (11 juin) : baux annulés, remboursement ordonné."}
  - {annee: 2022, evenement: "La Cour suprême d'appel rejette la demande d'autorisation d'appel fondée sur la récusation de deux juges (24 août)."}
  - {annee: 2023, evenement: "La fiducie retire son appel devant la Cour suprême d'appel (3 novembre)."}
  - {annee: 2025, evenement: "Début des remboursements des loyers (juillet)."}
  - {annee: 2026, evenement: "Le ministre met fin au mandat des membres restants du conseil d'administration et annonce la désignation d'un administrateur (18 mars)."}
