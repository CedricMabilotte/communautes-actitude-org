resume: >-
  La loi KwaZulu-Natal Ingonyama Trust Act n° 3KZ de 1994, adoptée par l'assemblée législative du KwaZulu et sanctionnée le 25 avril 1994, deux jours avant les premières élections au suffrage universel, a transféré les terres de l'ancien bantoustan (homeland) du KwaZulu à une fiducie (trust, entité qui détient un bien pour le compte d'autrui) dont le roi zoulou (Ingonyama) est le fiduciaire. La fiducie doit être administrée au profit et pour le bien-être matériel et social (« for the benefit, material welfare and social well-being ») des communautés énumérées en annexe de la loi et des résidents de leurs districts (art. 2 (2)). Depuis la loi modificative n° 9 de 1997, un conseil d'administration, l'Ingonyama Trust Board, présidé par le roi ou son représentant, gère ces terres. Le 11 juin 2021, la Haute Cour de Pietermaritzburg a jugé que les résidents titulaires de droits coutumiers sont les véritables propriétaires bénéficiaires et a annulé les baux résidentiels conclus depuis 2007.
