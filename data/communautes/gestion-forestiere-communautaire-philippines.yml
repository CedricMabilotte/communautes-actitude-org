resume: >-
  Fiche agrégée : elle couvre les communautés locales qui, regroupées en organisations populaires (people's organizations), reçoivent de l'État un accord de gestion forestière communautaire (Community-Based Forest Management Agreement, CBFMA) sur une portion de terres forestières publiques. Le décret présidentiel n° 263 de 1995 fait de la gestion forestière communautaire la stratégie nationale ; l'arrêté administratif du ministère de l'Environnement (DENR) n° 2004-29 fixe un accord de 25 ans renouvelable une fois, un droit d'occuper, de gérer et d'utiliser la forêt selon un plan propre, et un consentement de l'organisation avant tout permis d'extraction accordé à un tiers. La terre reste propriété de l'État, l'accord est incessible et le ministère peut l'annuler. Les statistiques forestières comptent 1 884 accords sur 1 615 598 ha en 2018 et 1 139 accords en vigueur sur 669 970 ha fin 2025.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action des Philippines pour la biodiversité 2015-2028, déposés auprès de la Convention sur la diversité biologique : carte des surfaces sous accord de gestion forestière communautaire (CBFMA), rappel du décret n° 318 de 2004 qui fait de la gestion forestière communautaire la stratégie principale, et cible 2.3 : 50 % des titulaires d'accords CBFMA, d'accords de gestion communautaire des aires protégées (PACBRMA) et d'autres titres forestiers engagés dans des moyens de subsistance compatibles avec la biodiversité", annee: 2016, source: "https://www.cbd.int/doc/world/ph/ph-nbsap-v3-en.pdf"}
base_nationale:
  - {instrument: "Executive Order n° 263 du 19 juillet 1995 (décret présidentiel adoptant la gestion forestière communautaire comme stratégie nationale), sect. 1, 3 et 4", nature: "loi", annee: 1995, source: "https://faolex.fao.org/docs/pdf/phi68061.pdf"}
  - {instrument: "Executive Order n° 318 du 9 juin 2004 (gestion durable des forêts), sect. 2.3 : la gestion forestière communautaire est la stratégie principale", nature: "loi", annee: 2004, source: "https://lawphil.net/executive/execord/eo2004/eo_318_2004.html"}
  - {instrument: "DENR Administrative Order n° 2004-29 (arrêté administratif du ministère de l'Environnement et des Ressources naturelles), règles révisées d'application du décret n° 263, qui abroge l'arrêté n° 96-29", nature: "loi", annee: 2004, source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté est représentée par une organisation populaire enregistrée (sect. 5 et 13 de l'arrêté n° 2004-29), qui fixe les droits et devoirs de ses membres et la responsabilité de ses dirigeants (sect. 7 vi) ; le ministère approuve l'accord, le respect de l'accord est contrôlé par le bureau local du ministère et la collectivité locale (sect. 38), un suivi annuel est fait par une équipe mixte (ministère, collectivités locales, ONG ; sect. 30) et l'accord peut être annulé par l'autorité supérieure du ministère, notamment pour manquement non corrigé ou infraction au droit forestier (sect. 38 et 39).", source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'organisation répartit et réglemente les droits d'usage des ressources entre ses membres, selon les coutumes s'il y a lieu (sect. 6 b et 7 ii de l'arrêté n° 2004-29), et adopte des règles et sanctions sur l'usage et la protection de la forêt (sect. 7 viii) ; son cadre de gestion des ressources (CRMF) et son plan de cinq ans sont soumis à l'affirmation du ministère (sect. 19 et 23).", source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
  justice_propre: {valeur: "partiel", note: "L'organisation met en place des mécanismes de règlement des conflits sur l'usage de la forêt, avec sanctions ; pour les communautés autochtones, leurs procédures propres s'appliquent (sect. 7 viii de l'arrêté n° 2004-29). Des membres peuvent être désignés agents adjoints de l'environnement, habilités à appréhender les coupeurs illégaux et à saisir le bois (sect. 25).", source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
  terres: {valeur: "partiel", note: "L'accord donne une sécurité de tenure (droit d'occupation garanti) pour 25 ans renouvelables une fois (sect. 14 de l'arrêté n° 2004-29) ; la terre reste forêt publique, l'accord est incessible (sect. 17) et devient inopposable si la zone est reclassée en terre aliénable (sect. 16), avec indemnisation des améliorations en cas de résiliation sans faute.", source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
  ressources: {valeur: "partiel", note: "L'organisation peut occuper, aménager, protéger, gérer et utiliser les terres forestières et leurs ressources et devient propriétaire des améliorations (sect. 6 a de l'arrêté n° 2004-29) ; la récolte, la transformation et le transport des produits suivent la réglementation générale (sect. 26) et les plantations publiques font l'objet d'un partage négocié avec le ministère (sect. 27). Le décret n° 263 exige des méthodes de récolte prévues au plan de gestion approuvé (sect. 3).", source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
  consentement: {valeur: "partiel", note: "L'organisation est informée et consultée sur tout projet public dans la zone ; son consentement est requis avant l'octroi ou le renouvellement à un tiers d'un contrat, bail ou permis d'extraction des ressources de la zone, avec un accord de partage préalable (sect. 6 d de l'arrêté n° 2004-29).", source: "https://faolex.fao.org/docs/pdf/phi209011.pdf"}
