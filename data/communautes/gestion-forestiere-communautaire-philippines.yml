effectivite: {valeur: "partielle", note: "Une étude de la Forest Foundation Philippines et de Tropenbos International (2020) relève que le ministère garde le contrôle des droits d'usage, peut annuler les accords ou suspendre les nouveaux à tout moment, que la récolte, surtout de bois, exige des permis d'usage distincts (Resource Use Permits) et que les accords ont été suspendus sans procédure en 2006. Le ministère avait ordonné l'annulation de tous les accords par mémorandums des 30 novembre 2005 et 5 janvier 2006, puis a interdit le 13 mars 2006 de nouveaux ordres d'annulation et demandé le réexamen des accords annulés. Les accords en vigueur passent de 1 971 (2022) à 1 139 (2025) dans les statistiques forestières.", source: "https://www.forestfoundation.ph/wp-content/uploads/2020/12/Forest-Foundation-Review-of-Community-Forest-Rights-Philippines.pdf"}
chronologie:
  - {annee: 1995, evenement: "Décret présidentiel n° 263 : la gestion forestière communautaire devient la stratégie nationale."}
  - {annee: 1996, evenement: "Premières règles d'application (arrêté administratif n° 96-29)."}
  - {annee: 2004, evenement: "Décret n° 318 sur la gestion durable des forêts ; arrêté n° 2004-29, règles révisées d'application du décret n° 263."}
  - {annee: 2006, evenement: "Après les ordres d'annulation de tous les accords (novembre 2005 et janvier 2006), le secrétaire du ministère interdit de nouveaux ordres d'annulation et demande le réexamen des accords annulés (mémorandum du 13 mars 2006)."}
  - {annee: 2018, evenement: "1 884 accords, 1 615 598 ha, 191 356 membres (statistiques forestières)."}
  - {annee: 2022, evenement: "1 971 accords en vigueur sur environ 1,67 million d'hectares."}
  - {annee: 2025, evenement: "1 139 accords en vigueur sur 669 970 ha (accords expirés avant le 1er janvier 2025 exclus)."}
fiabilite:
  verifie: ["Texte du décret n° 263 de 1995 (FAOLEX), sect. 1 à 14.", "Texte du décret n° 318 de 2004, sect. 2.3 (Lawphil).", "Arrêté n° 2004-29 du 25 août 2004 (publié le 27 août 2004), sect. 1 à 42, dont 5 à 7, 14 à 17, 19, 23, 25 à 27, 30, 38, 39 et 41 : copie numérisée FAOLEX ; numéro 2004-29 lu sur la page de titre.", "1 884 accords, 1 615 598 ha, 1 884 organisations et 191 356 membres en 2018 : statistiques forestières 2018, tableau 2.03.", "Série 2003-2025 des accords et 1 139 accords sur 669 970 ha au 31 décembre 2025, par province : statistiques forestières 2025, tableaux 2.01 et 2.02.", "Mémorandum du secrétaire du 13 mars 2006 sur les annulations de 2005-2006 (arrêt des nouveaux ordres d'annulation, réexamen des accords annulés).", "Constats de la Forest Foundation Philippines (2020) sur le contrôle du ministère et la suspension de 2006, p. 22-23.", "Mention des accords dans la stratégie pour la biodiversité 2015-2028 déposée à la CDB."]
  non_confirme: ["La Forest Foundation Philippines situe la suspension de 2006 dans 8 régions, le mémorandum du 13 mars 2006 parle de l'annulation de tous les accords ; l'étendue réelle n'est pas établie.", "Cause de la baisse de 1 971 accords (2022) à 1 139 (2025) : expiration des premiers accords de 25 ans, non-renouvellement ou annulation ; aucune ventilation trouvée.", "Le chiffre de 5 503 accords sur 4,9 millions d'hectares en 2003-2004 inclut probablement d'autres instruments ; non expliqué dans les statistiques.", "Aucune liste officielle des accords site par site n'a été trouvée : pas de tableau par site, seulement des totaux par province.", "Nombre de membres non publié après 2018.", "Le site du Bureau de gestion forestière présente une chaîne de certificat incomplète ; certains navigateurs peuvent refuser la connexion.", "Nombre de villages : non trouvé (les statistiques forestières de 2025 donnent le nombre d'accords et la surface par province, sans nombre de barangays ni de villages)."]
