  consentement: {valeur: "partiel", note: "La loi régionale n° 29/2007, art. 30 bis (ajouté en 2021), crée une Commission régionale consultative pour la minorité linguistique frioulane, présidée par l'assesseur régional (membre de l'exécutif régional) et composée notamment du président de l'ARLeF et du président de l'Assemblée de la communauté linguistique frioulane ; elle rend des avis au Conseil et à la Junte régionale et elle est entendue avant l'approbation du Plan général de politique linguistique, art. 25, al. 4 ; la loi n° 482/1999, art. 3, permet aux minorités réparties sur plusieurs territoires de constituer des organismes de coordination et de proposition.", source: "https://lexview-int.regione.fvg.it/fontinormative/xml/xmlLex.aspx?anno=2007&legge=29"}
  langue: {valeur: "partiel", note: "Dans les communes délimitées, l'usage oral et écrit de la langue protégée est admis dans les bureaux publics et devant le juge de paix, loi n° 482/1999, art. 9 ; seuls les actes en italien produisent des effets juridiques, art. 7 ; l'usage du frioulan est admis auprès des collectivités locales du territoire délimité et la réponse est donnée aussi en frioulan, loi régionale n° 29/2007, art. 6 ; les élus des conseils communaux et les conseillers régionaux peuvent s'exprimer en frioulan, art. 9, al. 1 et 2 ; les communes, fractions et localités portent aussi leur nom frioulan officiel, art. 11, al. 3 ; l'usage du frioulan auprès des bureaux régionaux hors du territoire délimité (art. 6, al. 2) a été annulé par la Cour constitutionnelle en 2009.", source: "https://lexview-int.regione.fvg.it/fontinormative/xml/xmlLex.aspx?anno=2007&legge=29"}
  education: {valeur: "partiel", note: "Dans les écoles maternelles, primaires et secondaires de premier degré (collège) des communes délimitées, la langue de la minorité est utilisée dans les activités éducatives et comme langue d'enseignement, loi n° 482/1999, art. 4, al. 1 ; chaque école en fixe les modalités dans les limites de l'horaire national, art. 4, al. 2, et les parents déclarent à la préinscription s'ils choisissent cet enseignement, art. 4, al. 5 ; la loi régionale n° 29/2007, art. 12, al. 2, inscrit le frioulan dans le parcours éducatif de ces écoles ; la garantie d'au moins une heure par semaine (art. 14, al. 2) et le refus des parents à l'inscription (art. 12, al. 3) ont été annulés par la Cour constitutionnelle (arrêt n° 159 de 2009).", source: "https://lexview-int.regione.fvg.it/fontinormative/xml/xmlLex.aspx?anno=2007&legge=29"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'Université Laval (page mise à jour en juin 2025) indique que le frioulan n'est pas intégré officiellement au système scolaire et qu'il est enseigné à titre facultatif, une heure par semaine, dans une partie des écoles de l'ancienne province d'Udine, selon la volonté des établissements et les enseignants disponibles ; environ 40 % des communes de cette province ont une signalisation routière bilingue. La Cour constitutionnelle, par l'arrêt n° 159 déposé le 22 mai 2009, a annulé les art. 6, al. 2, 8, al. 1 et 3, 9, al. 3, 11, al. 5, 12, al. 3, et 14, al. 2 (dernière phrase) et 3, de la loi régionale n° 29/2007.", source: "https://www.axl.cefan.ulaval.ca/europe/italiefrioul.htm"}
chronologie:
  - {annee: 1996, evenement: "Loi régionale n° 15 du 22 mars : première loi reconnaissant le frioulan ; création de l'Observatoire de la langue et de la culture frioulanes (OLF)."}
  - {annee: 1999, evenement: "Loi n° 482 du 15 décembre : le frioulan figure parmi les douze langues des minorités linguistiques historiques protégées par l'État."}
  - {annee: 2005, evenement: "L'ARLeF remplace l'OLF."}
  - {annee: 2007, evenement: "Loi régionale n° 29 du 18 décembre sur la protection, la valorisation et la promotion de la langue frioulane."}
  - {annee: 2009, evenement: "Arrêt n° 159 de la Cour constitutionnelle annulant plusieurs dispositions de la loi régionale n° 29/2007."}
  - {annee: 2021, evenement: "Création de la Commission régionale consultative pour la minorité linguistique frioulane (art. 30 bis de la loi régionale n° 29/2007)."}
  - {annee: 2023, evenement: "Enquête sociolinguistique « Tire fûr la lenghe » dans 178 communes ; premiers résultats publiés en mai 2024."}
fiabilite:
