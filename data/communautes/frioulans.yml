  non_confirme: ["L'Assemblée de la communauté linguistique frioulane, organisme de coordination de communes mentionné à l'art. 30 bis de la loi régionale n° 29/2007 « si elle est constituée », n'a pas été documentée : statut, date de création et nombre de communes membres inconnus ; elle n'est pas élue par les locuteurs.", "Endonyme non vérifié sur une source écrite.", "Surface du territoire délimité et nombre de localités non trouvés.", "Les trois communes de Vénétie relevant de la loi n° 482/1999 ne sont pas nommées par l'ARLeF ; leur acte de délimitation n'a pas été consulté.", "Les constats de l'Université Laval sur l'enseignement et la signalisation ne sont pas datés précisément."]
