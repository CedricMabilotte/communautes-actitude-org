resume: >-
  Les Frioulans forment l'une des douze minorités linguistiques historiques protégées par la loi italienne n° 482 du 15 décembre 1999. Leur langue est parlée dans 173 communes du Frioul-Vénétie Julienne et dans sept communes de Vénétie, dont trois relèvent de la loi n° 482/1999. La loi régionale n° 29 du 18 décembre 2007 organise l'usage du frioulan dans l'administration locale et régionale, l'enseignement, la toponymie et les médias, sous la coordination de l'Agence régionale pour la langue frioulane (ARLeF). Les Frioulans n'ont pas d'institution politique propre élue : leurs droits collectifs sont linguistiques. La Région autonome a sa propre fiche (« Frioul-Vénétie Julienne »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Sixième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur l'Italie, adopté le 11 février 2026, § 19 : le frioulan figure parmi les douze minorités linguistiques historiques protégées par la loi n° 482/1999 ; le § 71 relève que l'Italie n'a pas ratifié la Charte européenne des langues régionales ou minoritaires.", annee: 2026, source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-en/48802bdf6e"}
