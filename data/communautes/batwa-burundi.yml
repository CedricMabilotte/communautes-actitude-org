resume: >-
  Les Batwa constituent, à côté des Hutu et des Tutsi, l'une des trois composantes de la population du Burundi ; selon la délégation de l'État devant le CERD en 2025, ils en représentent environ 1 %.
  La Constitution du 7 juin 2018 leur garantit trois sièges à l'Assemblée nationale (art. 169) et trois au Sénat (art. 185) ; ce dispositif existait déjà dans la Constitution de 2005.
  La Commission nationale indépendante des droits de l'homme (CNIDH) les qualifie de peuples autochtones.
  Aucun texte ne leur attribue de terres collectives ni d'institution propre.
