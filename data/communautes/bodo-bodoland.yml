resume: >-
  Les Bodo (« Boro, Borokachari » dans la liste officielle) figurent parmi les tribus répertoriées (Scheduled Tribes, catégorie constitutionnelle des peuples tribaux) des plaines de l'Assam. Le mémorandum d'accord du 10 février 2003 et l'amendement constitutionnel de la même année créent le Conseil territorial du Bodoland (BTC), conseil autonome relevant de la Sixième annexe de la Constitution. L'accord du 27 janvier 2020 prévoit l'extension de ses compétences et de son territoire, renommé Région territoriale du Bodoland, qui compte cinq districts. Le conseil est élu ; la dernière élection a eu lieu en septembre 2025.
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître les peuples tribaux et les « tribus énumérées » comme groupes ayant droit à une protection spéciale ; § 12 et 19 sur les États du nord-est", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
