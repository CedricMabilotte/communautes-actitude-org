resume: >-
  Les Bodo (« Boro, Borokachari » dans la liste officielle) figurent sur la liste des Scheduled Tribes (catégorie constitutionnelle des peuples tribaux) de l'Assam ; le recensement de 2011 en compte 1 361 735 dans cet État. Le mémorandum d'accord du 10 février 2003 et l'amendement constitutionnel de la même année créent le Conseil territorial du Bodoland (BTC), conseil autonome relevant de la Sixième annexe de la Constitution. L'accord du 27 janvier 2020 prévoit l'extension de ses compétences et de son territoire, renommé Région territoriale du Bodoland, qui compte cinq districts. Le conseil est élu ; la dernière élection a eu lieu en septembre 2025. Les Bodo vivant hors de la région relèvent du conseil Bodo Kachari Welfare, décrit dans la fiche « Conseils autonomes de l'Assam (hors Sixième annexe) ».
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande à l'Inde de reconnaître ses peuples tribaux comme groupes distincts ayant droit à une protection spéciale et de préciser les critères d'inscription sur la liste des « tribus énumérées » (Scheduled Tribes) ; § 12 et 19 sur les États du nord-est ; les Bodo ne sont pas nommés", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, Sixième annexe, modifiée par la loi de 2003 (loi 44 de 2003) : paragraphes 2, 3 et 3B et Table, partie I", nature: "constitution", annee: 2003, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Mémorandum d'accord sur le Conseil territorial du Bodoland (gouvernement de l'Inde, gouvernement de l'Assam, Bodo Liberation Tigers)", nature: "accord_paix", annee: 2003, source: "https://peacemaker.un.org/sites/default/files/document/files/2024/05/in030210memorandumsettlementbodolandterritorialcouncil.pdf"}
  - {instrument: "Troisième accord bodo (mémorandum d'accord du 27 janvier 2020)", nature: "accord_paix", annee: 2020, source: "https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=1913900"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de 46 membres au plus : 40 élus au suffrage universel (30 sièges réservés aux Scheduled Tribes, 5 aux communautés non tribales, 5 ouverts) et 6 nommés par le gouverneur, Sixième annexe, paragraphe 2, clause ajoutée en 2003 (loi 44 de 2003).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil légifère sur 40 domaines (agriculture, éducation, forêts non classées, terres et recettes foncières, etc.), Sixième annexe, paragraphes 3 et 3B (2003) ; ses lois requièrent l'assentiment du gouverneur, et celui du président pour les matières de la liste concurrente.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "non_etabli", note: "Le paragraphe 4 de la Sixième annexe (tribunaux de village et juridiction d'appel des conseils de district) ne s'applique pas au conseil territorial du Bodoland, sous-paragraphe (6) ajouté par la loi 44 de 2003 ; aucune autre source de justice propre n'a été trouvée.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "partiel", note: "Compétence sur l'attribution et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a), et sur les terres et recettes foncières, paragraphe 3B (xv) ; ces lois ne peuvent ni modifier les droits fonciers existants ni empêcher un citoyen d'acquérir une terre, et l'État garde le pouvoir d'expropriation.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Compétence sur les forêts non classées, l'usage des canaux pour l'agriculture, la pêche et l'irrigation, Sixième annexe, paragraphes 3 (1) (b) et (c) et 3B (vi), (ix) et (xiii).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Aucune loi de l'Assemblée de l'Assam sur les matières des paragraphes 3, 3A ou 3B ne s'applique au territoire du conseil sans notification du conseil, qui peut l'adapter, Sixième annexe, paragraphe 12 (1) (a), modifié par la loi 44 de 2003 ; les lois du Parlement s'appliquent sauf notification contraire du gouverneur, paragraphe 12 (1) (b). Accord du conseil, non consentement préalable des communautés.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  langue: {valeur: "reconnu", note: "Le bodo est langue officielle du conseil aux côtés de l'assamais et de l'anglais, mémorandum d'accord de 2003 ; il figure à la Huitième annexe de la Constitution (langues reconnues) depuis le 92e amendement (2003).", source: "https://peacemaker.un.org/sites/default/files/document/files/2024/05/in030210memorandumsettlementbodolandterritorialcouncil.pdf"}
  education: {valeur: "reconnu", note: "Compétence législative sur l'enseignement primaire, secondaire supérieur, professionnel, des adultes et collégial, Sixième annexe, paragraphe 3B (v) ; les lois du conseil requièrent l'assentiment du gouverneur, paragraphe 3 (3).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre et pouvoir de percevoir l'impôt foncier et certaines taxes, Sixième annexe, paragraphes 7 et 8.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "partiel", note: "Sièges réservés aux districts autonomes à l'Assemblée de l'Assam, dans des circonscriptions limitées au district, Constitution, art. 332 (2) et (5) ; pour le district territorial du Bodoland, la représentation des tribus répertoriées et des non-tribaux dans les circonscriptions existantes est maintenue, réserve de l'art. 332 (6) ajoutée par le 90e amendement (2003) ; les sièges sont garantis au district et non aux Bodo en tant que tels.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j). Le paragraphe 3B, ajouté en 2003, s'applique « sans préjudice » du paragraphe 3, et les lois de l'État sur ces matières ne s'appliquent au territoire du conseil que sur sa décision, paragraphe 12 (1) (a) : même régime que les autres conseils de district de la Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le conseil est élu (élection du 22 septembre 2025, 77,9 % de participation) ; en juin 2026, l'All Bodo Students Union, signataire de l'accord de 2020, relève que l'extension territoriale (634 villages en litige) et le 125e amendement constitutionnel portant le conseil à 60 sièges ne sont pas réalisés.", source: "https://www.sentinelassam.com/topheadlines/implement-bodo-accord-now-or-face-fresh-stir-absu-cautions-centre-assam-over-bodoland-aspirations"}
chronologie:
  - {annee: 1993, evenement: "Accord créant le Conseil autonome bodo (BAC), abrogé en 2003."}
  - {annee: 2003, evenement: "Mémorandum d'accord du 10 février et amendement de la Sixième annexe créant le Conseil territorial du Bodoland ; le bodo entre à la Huitième annexe."}
  - {annee: 2020, evenement: "Troisième accord bodo du 27 janvier : extension prévue des compétences et du territoire, qui devient la Région territoriale du Bodoland."}
  - {annee: 2020, evenement: "Le 30 décembre, l'Assemblée de l'Assam adopte la loi faisant du bodo une langue officielle associée de l'État."}
  - {annee: 2023, evenement: "Le gouvernement indique au Parlement la création d'une direction des écoles de langue bodo et du conseil Bodo Kachari Welfare (communiqué du 5 avril)."}
  - {annee: 2025, evenement: "La commission prévue au paragraphe 14 de la Sixième annexe achève son mandat le 31 mars après l'ajout de 60 villages ; 634 villages restent en litige."}
  - {annee: 2025, evenement: "Élection du conseil le 22 septembre, remportée par le Bodoland People's Front (28 sièges sur 40)."}
  - {annee: 2026, evenement: "En juin, l'All Bodo Students Union demande l'adoption du 125e amendement constitutionnel (60 sièges, compétences de l'annexe I de l'accord de 2020)."}
