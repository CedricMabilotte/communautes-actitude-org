  - {instrument: "Troisième accord bodo (mémorandum d'accord du 27 janvier 2020)", nature: "accord_paix", annee: 2020, source: "https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=1913900"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de 46 membres dont 40 élus au suffrage universel, dont 30 sièges réservés aux tribus répertoriées, Sixième annexe, paragraphe 2, clause ajoutée en 2003.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil légifère sur 40 domaines (agriculture, éducation, forêts non classées, terres et recettes foncières, etc.), Sixième annexe, paragraphes 3 et 3B (2003) ; ses lois requièrent l'assentiment du gouverneur, et celui du président pour les matières de la liste concurrente.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Compétence sur l'attribution et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a), et sur les terres et recettes foncières, paragraphe 3B (xv) ; ces lois ne peuvent ni modifier les droits fonciers existants ni empêcher un citoyen d'acquérir une terre, et l'État garde le pouvoir d'expropriation.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Compétence sur les forêts non classées, l'usage des canaux pour l'agriculture, la pêche et l'irrigation, Sixième annexe, paragraphes 3 (1) (b) et (c) et 3B (vi), (ix) et (xiii).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Le bodo est langue officielle du conseil aux côtés de l'assamais et de l'anglais, mémorandum d'accord de 2003 ; il figure à la Huitième annexe de la Constitution (langues reconnues) depuis le 92e amendement (2003).", source: "https://peacemaker.un.org/sites/default/files/document/files/2024/05/in030210memorandumsettlementbodolandterritorialcouncil.pdf"}
  education: {valeur: "reconnu", note: "Compétence législative sur l'enseignement primaire, secondaire supérieur, professionnel, des adultes et collégial, Sixième annexe, paragraphe 3B (v) ; une direction des écoles de langue bodo a été créée après l'accord de 2020.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre et pouvoir de percevoir l'impôt foncier et certaines taxes, Sixième annexe, paragraphes 7 et 8.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le conseil est élu (élection du 22 septembre 2025, 77,9 % de participation) ; en juin 2026, l'All Bodo Students Union, signataire de l'accord de 2020, relève que l'extension territoriale (634 villages en litige) et le 125e amendement constitutionnel portant le conseil à 60 sièges ne sont pas réalisés.", source: "https://www.sentinelassam.com/topheadlines/implement-bodo-accord-now-or-face-fresh-stir-absu-cautions-centre-assam-over-bodoland-aspirations"}
chronologie:
  - {annee: 1993, evenement: "Accord créant le Conseil autonome bodo (BAC), abrogé en 2003."}
  - {annee: 2003, evenement: "Mémorandum d'accord du 10 février et amendement de la Sixième annexe créant le Conseil territorial du Bodoland ; le bodo entre à la Huitième annexe."}
  - {annee: 2020, evenement: "Troisième accord bodo du 27 janvier : extension prévue des compétences et du territoire, qui devient la Région territoriale du Bodoland."}
  - {annee: 2025, evenement: "Élection du conseil, remportée par le Bodoland People's Front (28 sièges sur 40)."}
