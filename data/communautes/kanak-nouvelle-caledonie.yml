resume: >-
  Archipel du Pacifique Sud rattaché à la France depuis 1853. Au recensement de 2019, 41,2 % des 271 407 habitants se déclarent kanak ; le recensement de 2025 compte 264 596 habitants. La Nouvelle-Calédonie figure sur la liste des territoires non autonomes (territoires à décoloniser suivis par l'ONU) depuis 1986. L'accord de Nouméa de 1998 et la loi organique de 1999 organisent un transfert de compétences, un statut civil coutumier kanak et trois consultations sur l'indépendance, tenues en 2018, 2020 et 2021. L'accord de Bougival de juillet 2025 prévoit un « État de la Nouvelle-Calédonie » ; l'Assemblée nationale adopte le 2 avril 2026 une motion de rejet du projet de loi constitutionnelle qui le traduit. Les élections provinciales, reportées depuis 2024, ont lieu le 28 juin 2026. La loi organique (art. 1) découpe le pays en huit aires coutumières, dont chacune a un conseil coutumier et désigne deux membres du Sénat coutumier ; le tableau les énumère.
reconnaissance_onu:
