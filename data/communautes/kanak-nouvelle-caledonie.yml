  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial sur les droits des peuples autochtones, James Anaya, sur la situation du peuple kanak, après une visite du 6 au 13 février 2011 (A/HRC/18/35/Add.6)", annee: 2011, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A-HRC-18-35-Add6.pdf"}
