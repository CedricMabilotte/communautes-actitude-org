reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La loi fédérale L.C. 2021, ch. 14 (Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones) vise les peuples autochtones au sens du paragraphe 35(2) de la Loi constitutionnelle de 1982, qui nomme les Métis.", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/TexteComplet.html"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission au Canada (A/HRC/27/52/Add.2) : les Métis, non visés par la Loi sur les Indiens, ont engagé des négociations tripartites vers des accords d'autonomie (par. 40) ; l'appartenance métisse repose sur le lien ancestral, l'auto-identification et l'acceptation par la communauté, selon la Cour suprême (par. 56) ; mention de la Manitoba Metis Federation.", annee: 2014, source: "https://www.ohchr.org/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
base_nationale:
  - {instrument: "Loi constitutionnelle de 1982, art. 35 (droits ancestraux et issus de traités des peuples indiens, inuit et métis)", nature: "constitution", annee: 1982, source: "https://laws-lois.justice.gc.ca/fra/const/page-12.html"}
  - {instrument: "R. c. Powley, 2003 CSC 43, [2003] 2 R.C.S. 207", nature: "jurisprudence", annee: 2003, source: "https://www.metisnation.org/wp-content/uploads/2020/12/r-v-powley-2003-scc-43-1.pdf"}
  - {instrument: "Accords de reconnaissance et de mise en œuvre de l'autonomie gouvernementale métisse avec la Métis Nation of Ontario, la Métis Nation–Saskatchewan et la Métis Nation of Alberta", nature: "accord_revendication", annee: 2023, source: "https://www.canada.ca/en/crown-indigenous-relations-northern-affairs/news/2023/02/self-government-agreement-between-the-metis-nationsaskatchewan-and-the-government-of-canada.html"}
  - {instrument: "Traité concernant la reconnaissance et la mise en œuvre de l'autonomie gouvernementale des Métis de la Rivière Rouge, signé le 30 novembre 2024, non en vigueur", nature: "traite", annee: 2024, source: "https://www.mmf.mb.ca/wcm-docs/freetext/mmf_treaty_digitalcompressed_20250127152926.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les accords de février 2023 reconnaissent la Métis Nation of Ontario, la Métis Nation–Saskatchewan et la Métis Nation of Alberta comme gouvernements des Métis qu'ils représentent ; cette reconnaissance ne lie que le Canada et chaque gouvernement ; pour l'Alberta, la Cour fédérale a annulé en mars 2024 le chapitre 6 (reconnaissance du gouvernement) et l'a renvoyé au ministre pour réexamen ; la loi de mise en œuvre (projet de loi C-53, 2023) n'a pas été adoptée ; le traité de 2024 désigne la Manitoba Metis Federation comme gouvernement des Métis de la Rivière Rouge (art. 9), sans effet avant sa loi de mise en œuvre (projet de loi C-21, 2026).", source: "https://lop.parl.ca/staticfiles/PublicWebsite/Home/ResearchPublications/LegislativeSummaries/PDF/44-1/PV_44-1-C53-E.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les accords de 2023 reconnaissent le pouvoir de légiférer sur la citoyenneté, le choix des dirigeants et le fonctionnement du gouvernement ; ils ne traitent ni des terres ni de la récolte ; le traité de 2024 prévoit les mêmes compétences pour la Manitoba Metis Federation (art. 21 à 34) ; l'article 5 du projet de loi C-21, en deuxième lecture en 2026, donne au traité la primauté sur les lois fédérales incompatibles.", source: "https://www.parl.ca/documentviewer/en/45-1/bill/C-21/first-reading"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "R. c. Powley (2003) reconnaît aux membres de la communauté métisse de Sault Ste. Marie un droit ancestral collectif de chasser pour se nourrir, garanti par l'article 35 ; accords provinciaux de récolte : Manitoba–Manitoba Metis Federation (29 septembre 2012, carte de récolteur de la fédération acceptée comme preuve d'identité, zone désignée) et Ontario–Métis Nation of Ontario (accord-cadre du 3 mai 2018, cartes de récolteur de la Métis Nation of Ontario reconnues dans les zones de récolte identifiées) ; ces droits restent soumis aux mesures de conservation.", source: "https://www.metisnation.org/wp-content/uploads/2020/12/r-v-powley-2003-scc-43-1.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Les gouvernements métis déterminent leurs citoyens en vertu des accords de 2023 (compétence sur la citoyenneté) ; le traité de 2024 donne à la Manitoba Metis Federation compétence sur les critères de citoyenneté, l'inscription, le retrait et les recours (art. 21), sous réserve de la loi de mise en œuvre ; l'arrêt Powley fixe trois critères d'appartenance : auto-identification, lien ancestral et acceptation par la communauté.", source: "https://www.canada.ca/en/crown-indigenous-relations-northern-affairs/news/2023/02/recognizing-and-implementing-metis-nation-self-government-in-ontario.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "En mars 2024, la Cour fédérale a annulé des parties de l'accord de 2023 avec la Métis Nation of Alberta pour défaut de consultation de la Fort McKay Métis Nation Association et du Metis Settlements General Council ; la Métis Nation–Saskatchewan a retiré son appui au projet de loi C-53 en avril 2024 ; les Chiefs of Ontario contestent les droits revendiqués par la Métis Nation of Ontario ; le ministre a suspendu le projet de loi en décembre 2024.", source: "https://www.aptnnews.ca/national-news/feds-pause-proposed-law-that-would-recognize-metis-in-ontario-alberta-and-saskatchewan/"}
chronologie:
  - {annee: 1870, evenement: "L'article 31 de la Loi de 1870 sur le Manitoba promet des terres aux enfants des Métis de la Rivière Rouge."}
  - {annee: 1982, evenement: "L'article 35 de la Loi constitutionnelle reconnaît les droits ancestraux des peuples indiens, inuit et métis."}
  - {annee: 2003, evenement: "Arrêt R. c. Powley de la Cour suprême, le 19 septembre : droit ancestral collectif de chasser pour se nourrir de la communauté métisse de Sault Ste. Marie."}
  - {annee: 2012, evenement: "Accord du 29 septembre entre le Manitoba et la Manitoba Metis Federation sur la récolte des ressources naturelles."}
  - {annee: 2013, evenement: "Arrêt Manitoba Metis Federation c. Canada : la Couronne n'a pas mis en œuvre l'article 31 de la Loi de 1870 sur le Manitoba conformément au principe de l'honneur de la Couronne."}
  - {annee: 2018, evenement: "Accord-cadre du 3 mai entre l'Ontario et la Métis Nation of Ontario sur la récolte."}
  - {annee: 2019, evenement: "Accords de reconnaissance des gouvernements métis et d'autonomie gouvernementale signés le 27 juin avec la Métis Nation of Ontario, la Métis Nation–Saskatchewan et la Métis Nation of Alberta."}
  - {annee: 2021, evenement: "Accord de reconnaissance et de mise en œuvre de l'autonomie gouvernementale signé le 6 juillet entre le Canada et la Manitoba Metis Federation."}
  - {annee: 2023, evenement: "Accords mis à jour signés en février avec les trois gouvernements ; dépôt du projet de loi C-53 le 21 juin."}
  - {annee: 2024, evenement: "La Cour fédérale annule en mars des parties de l'accord albertain ; signature du traité avec la Manitoba Metis Federation à Winnipeg le 30 novembre ; suspension du projet de loi C-53 en décembre."}
  - {annee: 2026, evenement: "Dépôt, le 12 février, du projet de loi C-21 qui donne effet au traité des Métis de la Rivière Rouge ; débat en deuxième lecture le 22 avril."}
fiabilite:
  verifie: ["Membres inscrits des quatre gouvernements au recensement 2021 et 624 220 personnes identifiées comme Métis (Statistique Canada, 98-200-X2021006).", "Extraits bilingues du sommaire de R. c. Powley (droit collectif, chasse pour se nourrir à Sault Ste. Marie, jugement du 19 septembre 2003).", "Portée des accords de 2023 (citoyenneté, choix des dirigeants, fonctionnement du gouvernement ; ni les terres ni la récolte) dans les communiqués de Relations Couronne-Autochtones.", "Texte du traité des Métis de la Rivière Rouge : préambule (accord du 6 juillet 2021), art. 4, 9, 21, chap. 7 à 9, signature du 30 novembre 2024.", "Première lecture du projet de loi C-21 le 12 février 2026, article 5 (primauté du traité), et état au stade de la deuxième lecture (LEGISinfo, débat du 22 avril 2026).", "Paragraphes 40 et 56 du rapport A/HRC/27/52/Add.2 du Rapporteur spécial (2014).", "Résumé législatif de la Bibliothèque du Parlement sur C-53 : dates de 2019 et 2023, décision de la Cour fédérale de mars 2024 (chapitre 6 de l'accord albertain annulé), retrait de l'appui de la Métis Nation–Saskatchewan le 17 avril 2024."]
  non_confirme: ["Date exacte de l'accord de 2023 avec la Métis Nation of Ontario : 23 février selon le communiqué fédéral, 24 février selon la Bibliothèque du Parlement et la Métis Nation of Ontario.", "État actuel de l'accord albertain après la décision de la Cour fédérale de 2024 et de l'éventuel appel.", "Texte intégral de l'arrêt Powley consulté sur une copie diffusée par la Métis Nation of Ontario, la page officielle de la Cour suprême n'ayant pas répondu.", "Issue du projet de loi C-21, en deuxième lecture à la Chambre des communes depuis avril 2026.", "Nom propre commun aux quatre gouvernements dans la langue de la communauté (michif) non vérifié."]
