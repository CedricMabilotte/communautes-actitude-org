resume: >-
  Les Métis sont l'un des trois peuples autochtones dont les droits sont reconnus par l'article 35 de la Loi constitutionnelle de 1982. L'arrêt R. c. Powley (Cour suprême, 2003) définit la communauté métisse et reconnaît à ses membres un droit collectif de chasser pour se nourrir. En février 2023, le Canada a signé des accords de reconnaissance et de mise en œuvre de l'autonomie gouvernementale avec la Métis Nation of Ontario, la Métis Nation–Saskatchewan et la Métis Nation of Alberta (Otipemisiwak Métis Government), limités à la citoyenneté, au choix des dirigeants et au fonctionnement du gouvernement ; en mars 2024, la Cour fédérale a annulé le chapitre de l'accord albertain qui reconnaît le gouvernement métis de l'Alberta ; le projet de loi C-53 qui devait les mettre en œuvre n'a pas été adopté. Le traité d'autonomie gouvernementale des Métis de la Rivière Rouge, signé le 30 novembre 2024 avec la Manitoba Metis Federation, attend la loi de mise en œuvre (projet de loi C-21, déposé le 12 février 2026, en deuxième lecture à la Chambre des communes en avril 2026). Les huit établissements métis de l'Alberta relèvent d'un régime distinct (fiche distincte).
