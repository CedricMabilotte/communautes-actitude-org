resume: >-
  La Constitution révisée de l'État régional Amhara (2001) dote certaines nationalités minoritaires de la région de conseils propres (art. 45(2)) et d'administrations de nationalité (art. 73).
  Trois zones de nationalité existent : Wag Hemra (Agaw Xamir), Awi (Agaw Awi) et Oromo ; la Proclamation régionale 130/2006 y ajoute un woreda (district) de nationalité argobba.
  Chaque administration comprend un conseil de nationalité, un conseil administratif et un organe judiciaire.
  Les Qemant, absents de la constitution régionale de 2001, obtiennent du gouvernement régional une administration propre, d'abord sur 42 kebele (plus petite unité administrative), puis en 2017 sur 69 unités ; un référendum se tient le 17 septembre 2017 dans des kebele disputés de quatre woredas.
  Le régime de l'État régional lui-même relève de la fiche « Amhara (État régional Amhara) ».
