resume: >-
  Les Ouïghours sont l'une des nationalités minoritaires reconnues par la Chine. La Région autonome ouïghoure du Xinjiang relève du système d'autonomie régionale des nationalités prévu par la Constitution (art. 4 et 112 à 122) et par la loi de 1984 sur l'autonomie régionale des nationalités, modifiée en 2001. Le droit prévoit des organes d'autogouvernement, un pouvoir de réglementation soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale et l'usage des langues locales. Selon une étude universitaire de 2017, aucune des cinq régions autonomes n'a adopté de règlement d'autonomie. La loi sur la promotion de l'unité et du progrès des nationalités, en vigueur depuis le 1er juillet 2026, fait du chinois standard (« langue commune nationale ») la langue de base de l'enseignement et la langue de travail des organes de l'État. Les préfectures et districts autonomes situés dans la région relèvent de la fiche « Préfectures et districts autonomes de Chine ».
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/CHN/CO/14-17, § 40-42 : détention d'un grand nombre d'Ouïghours, surveillance, interdiction signalée de l'enseignement de l'ouïghour à Hotan", annee: 2018, source: "https://docs.un.org/fr/CERD/C/CHN/CO/14-17"}
  - {mecanisme: "organe_traite", detail: "Comité des droits économiques, sociaux et culturels, E/C.12/CHN/CO/3, § 35-36 : restrictions discriminatoires visant les populations ouïghoures et d'autres communautés musulmanes, renvoi à l'évaluation du HCDH sur le Xinjiang ; § 88 : signalements de fermeture d'écoles enseignant en ouïghour, en tibétain et en kazakh", annee: 2023, source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
base_nationale:
  - {instrument: "Constitution de la République populaire de Chine, art. 4 et 112 à 122", nature: "constitution", annee: 1982, source: "https://www.constituteproject.org/constitution/China_2018"}
  - {instrument: "Loi sur l'autonomie régionale des nationalités (1984, modifiée en 2001)", nature: "loi", annee: 2001, source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  - {instrument: "Loi sur la promotion de l'unité et du progrès des nationalités, art. 8 et 15 (adoptée le 12 mars 2026, en vigueur le 1er juillet 2026)", nature: "loi", annee: 2026, source: "https://www.hmo.gov.cn/2026/08/21/ARTIgK42opgXcy1hZy8Rn4uC260821.shtml"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organes d'autogouvernement (assemblée populaire et gouvernement de la région), dont le président est un citoyen de la nationalité qui exerce l'autonomie, Constitution, art. 112 et 114 ; loi sur l'autonomie régionale, art. 17 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  pouvoir_normatif: {valeur: "conteste", note: "L'assemblée peut adopter des règlements d'autonomie et des règlements particuliers, soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale, Constitution, art. 116 ; loi sur l'autonomie régionale, art. 19 ; aucune des cinq régions autonomes n'en a adopté (Yang Feng, 2017).", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les organes d'autogouvernement définissent, conformément à la loi, la propriété et le droit d'usage des pâturages et des forêts, loi sur l'autonomie régionale, art. 27 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  ressources: {valeur: "partiel", note: "Gestion et protection des ressources naturelles et priorité d'exploitation dans le cadre des plans de l'État, loi sur l'autonomie régionale, art. 28 ; compensation due par l'État pour l'exploitation des ressources, art. 65 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  consentement: {valeur: "partiel", note: "La création d'une zone autonome, ses limites et son nom sont proposés après pleine consultation des représentants des nationalités concernées ; sa suppression, sa fusion ou la modification de ses limites exige la pleine consultation de ses organes d'autogouvernement, loi sur l'autonomie régionale, art. 14 (2001). Aucune obligation de consentement n'a été trouvée.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  langue: {valeur: "partiel", note: "Les organes d'autogouvernement utilisent les langues d'usage courant dans la région, la langue de la nationalité autonome pouvant être langue principale, Constitution, art. 121 ; loi sur l'autonomie régionale, art. 10, 21 et 47 (2001). Depuis le 1er juillet 2026, les organes de l'État travaillent en chinois standard et tout document publié dans une langue minoritaire doit l'être aussi en chinois standard, loi sur la promotion de l'unité et du progrès des nationalités, art. 15 (2026).", source: "https://www.hmo.gov.cn/2026/08/21/ARTIgK42opgXcy1hZy8Rn4uC260821.shtml"}
  education: {valeur: "conteste", note: "Les organes d'autogouvernement décident, selon les orientations de l'État, des programmes et de la langue d'enseignement, loi sur l'autonomie régionale, art. 36 et 37 (2001) ; la loi sur la promotion de l'unité et du progrès des nationalités fait du chinois standard la langue de base de l'enseignement dans toutes les écoles, art. 15 (2026) ; le Comité des droits économiques, sociaux et culturels relève des signalements de fermeture d'écoles enseignant en ouïghour, E/C.12/CHN/CO/3, § 88 (2023).", source: "https://www.hmo.gov.cn/2026/08/21/ARTIgK42opgXcy1hZy8Rn4uC260821.shtml"}
  fiscalite: {valeur: "partiel", note: "Autonomie de gestion des finances régionales dans le cadre du système financier de l'État, Constitution, art. 117 ; loi sur l'autonomie régionale, art. 32 (2001).", source: "https://www.constituteproject.org/constitution/China_2018"}
  representation: {valeur: "partiel", note: "Constitution, art. 59 : toutes les nationalités minoritaires ont droit à une représentation appropriée à l'Assemblée populaire nationale ; le texte ne fixe pas de nombre de sièges.", source: "https://www.constituteproject.org/constitution/China_2018"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le Comité pour l'élimination de la discrimination raciale (2018) relève des informations sur la détention sans inculpation d'Ouïghours, estimée de dizaines de milliers à plus d'un million de personnes, et une surveillance ciblée. L'évaluation du Haut-Commissariat aux droits de l'homme (31 août 2022) conclut à des violations graves des droits de l'homme et à une détention arbitraire à grande échelle au moins entre 2017 et 2019, et relève une directive de 2017 du district de Hotan qui écarte l'ouïghour du système éducatif. Le Comité des droits économiques, sociaux et culturels (2023) relève des restrictions « draconiennes, systématiques » et discriminatoires. Selon une analyse de l'Université nationale australienne (East Asia Forum, 2026), la loi de 2026 maintient l'autonomie régionale dans les textes et généralise l'enseignement en chinois standard.", source: "https://www.ohchr.org/sites/default/files/documents/countries/2022-08-31/22-08-31-final-assesment.pdf"}
chronologie:
  - {annee: 1982, evenement: "La Constitution consacre l'autonomie régionale des nationalités (art. 4 et 112 à 122)."}
  - {annee: 1984, evenement: "Loi sur l'autonomie régionale des nationalités, modifiée en 2001."}
  - {annee: 2018, evenement: "Observations du Comité pour l'élimination de la discrimination raciale sur la Région autonome ouïghoure du Xinjiang."}
  - {annee: 2022, evenement: "Évaluation du Haut-Commissariat aux droits de l'homme sur la Région autonome ouïghoure du Xinjiang (31 août)."}
  - {annee: 2023, evenement: "Observations du Comité des droits économiques, sociaux et culturels sur le Xinjiang, qui renvoient à l'évaluation du HCDH de 2022."}
  - {annee: 2026, evenement: "Adoption le 12 mars de la loi sur la promotion de l'unité et du progrès des nationalités, en vigueur le 1er juillet ; la loi sur l'autonomie régionale reste dans sa version de 2001."}
fiabilite:
  verifie: ["Articles 4, 112, 114, 116, 117 et 121 de la Constitution (Constitute Project).", "Articles 10, 17, 19, 21, 27, 28, 32, 36, 37, 47 et 65 de la loi sur l'autonomie régionale dans sa version de 2001 (Wikisource) ; version de 1984 sur ILO NATLEX ; loi toujours en vigueur dans sa version de 2001 selon la liste officielle des lois en vigueur au 12 mars 2026 (Administration d'État pour la régulation du marché).", "Articles 8, 15 et 65 de la loi sur la promotion de l'unité et du progrès des nationalités (texte chinois, hmo.gov.cn) : adoption le 12 mars 2026, entrée en vigueur le 1er juillet 2026.", "CERD/C/CHN/CO/14-17, § 40-42 et E/C.12/CHN/CO/3, § 35-36 et 88 (textes français).", "Évaluation du HCDH du 31 août 2022, § 80, 89 et 143-148.", "Population ouïghoure (11 624 257) et nombre de divisions de niveau préfectoral (14) : communiqué du 7e recensement, Bureau statistique du Xinjiang ; liste des 14 divisions sur le site du gouvernement régional.", "Surface : annuaire statistique du Xinjiang 2019, tableau 3-5 (1 664 599,55 km², donnée 2008).", "Absence de règlement d'autonomie dans les cinq régions autonomes (Yang Feng, Asian-Pacific Law & Policy Journal, 2017)."]
  non_confirme: ["Texte de la loi de 2001 consulté sur Wikisource et non sur le site de l'Assemblée populaire nationale, inaccessible.", "Adoption d'un règlement d'autonomie par la Région autonome ouïghoure du Xinjiang après 2017 : non vérifiée ; selon Yang Feng (2017), le Xinjiang n'avait pas engagé de rédaction.", "Portée de la loi de 2026 sur l'article 36 de la loi sur l'autonomie régionale (langue d'enseignement) : aucune interprétation officielle consultée ; texte de 2026 lu en chinois, sans traduction officielle.", "Nombre de villages : non trouvé (l'annuaire statistique régional qui donne le nombre de comités de villageois n'est plus en ligne).", "La région est autonome au titre des Ouïghours mais compte d'autres nationalités (Kazakhs, Kirghizes, Hui, Mongols) et des préfectures autonomes propres, traitées dans la fiche « Préfectures et districts autonomes de Chine »."]
