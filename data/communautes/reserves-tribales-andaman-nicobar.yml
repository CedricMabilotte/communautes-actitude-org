resume: >-
  Fiche agrégée : elle couvre les zones réservées (« reserved areas ») déclarées par l'administration du territoire au titre de l'Andaman and Nicobar Islands (Protection of Aboriginal Tribes) Regulation de 1956. Dans une réserve, une personne étrangère au groupe ne peut ni acquérir de droit sur la terre ou ses produits, ni commercer sans autorisation ; l'administration peut y soumettre l'entrée à un permis. Les réserves couvrent environ 3 500 km² : l'ensemble des îles Nicobar (Nicobarais et Shompen) et quatre réserves aux Andaman (Jarawa, Grand-Andamanais, Onge, Sentinelles). Dans le district de Nicobar, hors zones shompen et hors zones des panchayats (conseils locaux ordinaires), des conseils élus créés en 2009 administrent les villages et les îles ; ce régime fait l'objet de la fiche « Nicobarais (conseils tribaux des îles Nicobar) ».
