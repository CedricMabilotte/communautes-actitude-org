resume: >-
  Propriétaires traditionnels anangu des terres de l'ouest de l'Australie-Méridionale, en bordure du Grand Désert de Victoria, dont une partie a servi aux essais nucléaires britanniques des années 1950. Le Maralinga Tjarutja Land Rights Act 1984, loi de l'État d'Australie-Méridionale, crée une personne morale, Maralinga Tjarutja, dont tous les propriétaires traditionnels sont membres, et permet de lui concéder les terres en pleine propriété (fee simple, propriété privée sans limite de durée), inaliénable ; Maralinga Tjarutja détient ce titre. Ce régime est distinct de celui des terres APY. Oak Valley, fondée en 1985, est la seule communauté habitée en permanence.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD recommande à l'Australie de protéger les droits fonciers des peuples autochtones et d'inscrire dans la loi le principe du consentement préalable, libre et éclairé (CERD/C/AUS/CO/18-20, par. 21 et 22) ; le document vise les peuples autochtones d'Australie sans nommer Maralinga Tjarutja", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Maralinga Tjarutja Land Rights Act 1984 (Australie-Méridionale), version du 1er janvier 2021", nature: "loi", annee: 1984, source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/maralinga%20tjarutja%20land%20rights%20act%201984/current/1984.3.auth.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Maralinga Tjarutja est une personne morale dont tous les propriétaires traditionnels sont membres (s. 4) ; son conseil réunit les personnes reconnues comme leaders des propriétaires traditionnels (s. 6), exerce ses pouvoirs (s. 7) et doit consulter les propriétaires traditionnels et tenir compte de leurs coutumes (s. 8).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/maralinga%20tjarutja%20land%20rights%20act%201984/current/1984.3.auth.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Maralinga Tjarutja peut, avec l'approbation du ministre, prendre des règlements locaux (by-laws) applicables sur ses seules terres, limités à l'alcool, à l'essence et aux autres substances réglementées, aux jeux d'argent et aux matières prévues par décret ; ils sont soumis à la confirmation du gouverneur et à l'annulation par le Parlement, et l'amende est plafonnée à 2 000 dollars (s. 43). Le registre officiel ne liste aucun règlement local pris en vertu de cette section.", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/maralinga%20tjarutja%20land%20rights%20act%201984/current/1984.3.auth.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le gouverneur peut concéder les terres en pleine propriété à Maralinga Tjarutja (s. 13) ; elles ne peuvent être ni aliénées ni expropriées en vertu du droit de l'État (s. 15) ; l'entrée des personnes autres que les propriétaires traditionnels est soumise à autorisation (s. 18).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/maralinga%20tjarutja%20land%20rights%20act%201984/current/1984.3.auth.pdf"}
  ressources: {valeur: "partiel", note: "Un tiers des redevances minières (royalties) perçues sur les terres revient à Maralinga Tjarutja, un tiers au ministre des Affaires aborigènes pour la santé, le bien-être et le progrès des habitants aborigènes et un tiers au budget de l'État ; au-delà d'un plafond fixé par décret, l'excédent revient au budget de l'État (s. 24) ; toute activité minière est interdite sur l'ancien site d'essais nucléaires (s. 15K, ajoutée en 2009).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/maralinga%20tjarutja%20land%20rights%20act%201984/current/1984.3.auth.pdf"}
  consentement: {valeur: "partiel", note: "Les activités minières requièrent la permission de Maralinga Tjarutja ; en cas de refus, de conditions jugées inacceptables ou sans réponse après 120 jours, le demandeur peut obtenir que le ministre des Mines saisisse un arbitre, qui tient compte du mode de vie, de la culture et des traditions des propriétaires traditionnels, de l'environnement et de l'intérêt économique des opérations pour l'État et l'Australie (s. 21) ; les travaux routiers requièrent aussi son consentement, avec recours à l'arbitrage en cas de désaccord et sans consentement pour l'entretien de la route inscrite à l'annexe (s. 28 à 31).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/maralinga%20tjarutja%20land%20rights%20act%201984/current/1984.3.auth.pdf"}
