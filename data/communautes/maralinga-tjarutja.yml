chronologie:
  - {annee: 1984, evenement: "Adoption du Maralinga Tjarutja Land Rights Act par le Parlement d'Australie-Méridionale."}
  - {annee: 1985, evenement: "Fondation de la communauté d'Oak Valley par des Anangu déplacés des terres de Maralinga lors des essais nucléaires britanniques."}
  - {annee: 1991, evenement: "Loi de modification ajoutant des terres au régime."}
  - {annee: 2004, evenement: "Loi de modification créant un conseil de cogestion du parc de conservation de Mamungari, dont la majorité des membres appartiennent à Maralinga Tjarutja."}
  - {annee: 2009, evenement: "Loi de modification intégrant l'ancien site d'essais nucléaires (section 400) et y interdisant toute activité minière."}
