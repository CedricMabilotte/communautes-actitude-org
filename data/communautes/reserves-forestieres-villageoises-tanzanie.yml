villages: {valeur: 2328, annee: 2014, perimetre: "villages engagés dans la gestion forestière participative (CBFM et JFM réunies), environ 22 % des villages du pays", source: "https://www.cbd.int/doc/world/tz/tz-nr-05-en.pdf"}
resume: >-
  Fiche agrégée : elle couvre les villages de la Tanzanie continentale qui possèdent, gèrent ou cogèrent une forêt au titre de la loi forestière de 2002 (Forest Act, n° 14 de 2002, chap. 323). Un conseil de village peut, par résolution, déclarer une partie de la terre villageoise réserve forestière villageoise (village land forest reserve), la faire gérer par un comité issu de l'assemblée villageoise, puis demander sa publication au Journal officiel (art. 33 à 35) ; ce régime est appelé gestion forestière communautaire (Community Based Forest Management, CBFM). La même loi permet des accords de gestion conjointe (joint management agreements) entre villages et services de l'État ou des collectivités pour des réserves nationales ou locales (art. 16 et 39), régime appelé gestion forestière conjointe (Joint Forest Management, JFM), ainsi que des réserves forestières communautaires gérées par des groupes (art. 42 à 48). En 2014, le cinquième rapport national à la Convention sur la diversité biologique comptait 2 328 villages et 4 122 500 hectares sous ces deux régimes.
