base_nationale:
  - {instrument: "Forest Act (loi forestière), loi n° 14 de 2002, publiée au supplément n° 7 du Journal officiel du 7 juin 2002 : art. 4 (forêts villageoises), 14 (plan de gestion forestière villageois), 16 (accords de gestion conjointe), 32 à 41 (réserves forestières villageoises), 42 à 48 (réserves forestières communautaires), 49 (6) (permis délivrés par le village), 78 (3) (exemption de redevances), 106 (4) (règles locales)", nature: "loi", annee: 2002, source: "https://www.tfs.go.tz/uploads/documents/Forest_Act_2002.pdf"}
  - {instrument: "Forest (Sustainable Utilization of Logs, Timber, Withies, Poles or Charcoal) Regulations 2019, G.N. n° 417 du 24 mai 2019 : plan de récolte préparé et approuvé par le directeur des forêts, y compris dans les réserves forestières villageoises de production ; comité de district de récolte présidé par le commissaire de district", nature: "loi", annee: 2019, source: "https://www.tfs.go.tz/uploads/GN_NO._417_24_MAY_2019.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil de village peut déclarer une réserve forestière villageoise et confier sa gestion à un comité formé parmi les membres de l'assemblée villageoise, avec un équilibre entre femmes et hommes, qui élit son président chaque année et rend compte à l'assemblée (loi forestière de 2002, art. 33). Une réserve peut appartenir à un ou plusieurs villages et être gérée par eux (art. 32 (3) et 38). L'autorité locale exerce une supervision générale et peut reprendre la gestion d'une réserve déclarée si le conseil de village manque à ses obligations, avec appel au ministre chargé des collectivités locales (art. 41).", source: "https://www.tfs.go.tz/uploads/documents/Forest_Act_2002.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Une réserve déclarée est gérée selon les politiques, règlements locaux (by-laws) et règles du conseil de village, le plan de gestion adopté par résolution de l'assemblée villageoise, et les règles et pratiques coutumières applicables (loi de 2002, art. 14 et 34 (4)). Pour une réserve publiée au Journal officiel, le conseil de village soumet le projet de règlement local au directeur des forêts par l'intermédiaire du conseil de district ; il doit tenir compte de leurs avis sans être lié, et peut adopter le règlement si aucun avis n'est rendu en soixante jours (art. 37). Les règles locales prévues à l'art. 106 (4) exigent l'approbation du ministre chargé des collectivités locales.", source: "https://www.tfs.go.tz/uploads/documents/Forest_Act_2002.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi range parmi les forêts villageoises les réserves forestières villageoises, les réserves communautaires créées à partir des forêts villageoises et les forêts non classées de la terre villageoise dont la gestion revient au conseil de village (loi de 2002, art. 4 (c)) ; une réserve forestière villageoise peut être possédée et gérée par un ou plusieurs villages (art. 32 (3)). La réserve est déclarée sur la terre villageoise (art. 33 (1) (a)) ; la loi sur les terres villageoises de 1999 (Village Land Act, chap. 114) pose que toute terre en Tanzanie est une terre publique confiée au président comme fiduciaire au nom des citoyens (art. 3 (1) (b)).", source: "https://www.tfs.go.tz/uploads/documents/Forest_Act_2002.pdf"}
  ressources: {valeur: "partiel", note: "Sauf accord contraire, les villageois ont le droit d'entrer, d'utiliser et de récolter les produits de la réserve en commun, et d'en exclure les non-membres dépourvus de permis (loi de 2002, art. 40 (a) et (e)) ; les résidents ne paient pas de redevance sauf si l'accord de gestion le prévoit (art. 78 (3)), et le conseil de village fixe, par résolution confirmée par l'assemblée villageoise, les règles d'autorisation des usages non domestiques (art. 49 (6)). Depuis 2019, toute exploitation de bois d'œuvre, perches ou charbon dans une réserve villageoise de production suppose un plan de récolte préparé et approuvé par le directeur des forêts, et les demandes sont tranchées par un comité de district présidé par le commissaire de district, où siègent le président et le secrétaire exécutif du village concerné (G.N. n° 417 de 2019, règl. 3 à 5 et 7).", source: "https://www.tfs.go.tz/uploads/GN_NO._417_24_MAY_2019.pdf"}
  consentement: {valeur: "partiel", note: "Le plan de gestion forestière villageois est présenté en assemblée villageoise après un préavis de vingt et un jours, puis adopté par résolution de l'assemblée (loi de 2002, art. 14 (4) à (6)) ; tout accord de gestion avec un tiers doit être approuvé par l'assemblée avant d'entrer en vigueur (art. 34 (4) (f)), et la demande de gestion d'une partie de réserve nationale ou locale suppose une résolution de l'assemblée (art. 39 (3)).", source: "https://www.tfs.go.tz/uploads/documents/Forest_Act_2002.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les villageois doivent payer la taxe ou le prélèvement fixé par le conseil de village pour couvrir les coûts de gestion de la réserve, et le village peut créer un fonds alimenté par les droits et amendes perçus (loi de 2002, art. 40 (f) et (g)). Pour une réserve publiée gérée sous accord conjoint, le comité perçoit la part des droits, redevances et permis prévue par l'accord et la verse sur les comptes du conseil de village (art. 36 (4) (g)).", source: "https://www.tfs.go.tz/uploads/documents/Forest_Act_2002.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon le Tanzania Forest Conservation Group (TFCG) et le réseau MJUMITA, plus de 17,6 millions d'hectares de forêts, soit 80 % des forêts de la terre villageoise, ne sont pas classés en réserve ; le règlement G.N. n° 417 de 2019 recentralise les décisions sur les plans de récolte et l'agrément des acheteurs dans les réserves forestières villageoises. L'organisation Mpingo Conservation & Development Initiative indique avoir aidé, à fin 2017, 40 communautés du sud du pays à créer des réserves sur plus de 410 000 hectares, dont les recettes de bois financent des services du village.", source: "https://www.tfcg.org/what-we-do/advocate/forest-justice-in-tanzania/"}
chronologie:
  - {annee: 1998, evenement: "Adoption de la politique forestière nationale en mars."}
  - {annee: 2002, evenement: "Publication de la loi forestière n° 14 au Journal officiel du 7 juin ; les réserves forestières villageoises existantes deviennent des réserves déclarées (art. 32 (2))."}
  - {annee: 2014, evenement: "Le cinquième rapport national à la CDB compte 2 328 villages et 4 122 500 hectares sous gestion forestière participative."}
  - {annee: 2019, evenement: "Le règlement G.N. n° 417 du 24 mai soumet la récolte dans les réserves villageoises de production à un plan approuvé par le directeur des forêts et à un comité de district."}
  - {annee: 2023, evenement: "Le G.N. n° 670 de 2023 crée quatre réserves forestières villageoises (Ndongosi, Muhukululilahi, Liweta, Litowa) dans le district de Songea, sur 14 676,31 hectares."}
  - {annee: 2026, evenement: "Le discours budgétaire du ministère des Ressources naturelles et du Tourisme pour 2026-2027 fait état de 17 forêts villageoises formalisées sur 4 077,27 hectares dans le district de Chalinze, avec plans de gestion et règlements locaux."}
