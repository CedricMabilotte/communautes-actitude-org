resume: >-
  Le Guatemala reconnaît trois peuples autochtones : le peuple maya, qui comprend 22 groupes sociolinguistiques, le peuple garífuna et le peuple xinka. L'Accord sur l'identité et les droits des peuples autochtones, signé à Mexico le 31 mars 1995 entre le gouvernement et l'Unidad Revolucionaria Nacional Guatemalteca (URNG) sous la modération de l'ONU, reconnaît le rôle des autorités communautaires constituées selon les normes coutumières et prévoit une réforme du Code municipal ; sa vérification a été confiée à la Mission des Nations unies au Guatemala (MINUGUA) jusqu'en 2004. Le Code municipal de 2002 (décret 12-2002) reconnaît la personnalité juridique des communautés autochtones, organisées selon leurs normes propres, ainsi que les alcaldías indígenas (mairies autochtones) et les alcaldías comunitarias désignées selon les usages des communautés. La justice autochtone est reconnue par la jurisprudence des hautes cours, sans loi d'application. Le régime des terres communales a sa propre fiche (« Terres communales du Guatemala »).
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communauté autochtone maya q'eqchi' Agua Caliente c. Guatemala (série C n° 488, 16 mai 2023) : violation du droit à la personnalité juridique et à la propriété collective ; obligation d'offrir un titre communautaire ou collectif (point 5), de consulter la communauté (point 7) et d'adopter des mesures législatives sur la propriété communautaire et la consultation préalable (points 9 et 10).", annee: 2023, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_488_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Peuples autochtones maya kaqchikel de Sumpango et autres c. Guatemala (série C n° 440, 6 octobre 2021) : violation de la liberté d'expression, de l'égalité devant la loi et du droit de participer à la vie culturelle de quatre peuples autochtones mayas ; obligation de permettre le fonctionnement de leurs radios communautaires et de leur réserver une part du spectre radioélectrique (points 4 et 6).", annee: 2021, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_440_esp.pdf"}
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Accord sur l'identité et les droits des peuples autochtones, signé à Mexico le 31 mars 1995 par le gouvernement et l'URNG en présence de l'ONU (modérateur Jean Arnault) et transmis par le Secrétaire général à l'Assemblée générale et au Conseil de sécurité (A/49/882-S/1995/256) ; il demande au Secrétaire général d'en vérifier l'exécution (chap. VII).", annee: 1995, source: "https://documents.un.org/api/symbol/access?s=A/49/882&l=es&t=pdf"}
  - {mecanisme: "mission_onu", detail: "Mission de vérification des Nations unies au Guatemala (MINUGUA), créée par la résolution 48/267 de l'Assemblée générale (28 septembre 1994) et fermée le 31 décembre 2004 ; son rapport final relève l'absence de reconnaissance des terres communales et du droit coutumier et qualifie l'accord sur les peuples autochtones de domaine des accords de paix le moins avancé (A/59/746, § 22 à 24).", annee: 2004, source: "https://documents.un.org/api/symbol/access?s=A/59/746&l=es&t=pdf"}
  - {mecanisme: "oit_169", detail: "Convention 169 de l'OIT approuvée par le décret 9-96 et dont la ratification est enregistrée par l'OIT le 5 juin 1996 (arrêt Agua Caliente, note 42 ; A/HRC/39/17/Add.3, § 15).", annee: 1996, source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.3&l=es&t=pdf"}
  - {mecanisme: "dnudpa", detail: "Le Guatemala a participé à l'élaboration et à l'adoption de la Déclaration de 2007 par l'Assemblée générale (A/HRC/39/17/Add.3, § 16) et reconnaît les peuples maya, xinka et garífuna (§ 9).", annee: 2007, source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.3&l=es&t=pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale sur les droits des peuples autochtones sur sa visite au Guatemala (A/HRC/39/17/Add.3, 2018) : 19 % des engagements de l'accord de 1995 exécutés (§ 17), inscription des communautés au registre municipal soumise au bon vouloir des municipalités (§ 74 et 75), justice autochtone (§ 77 à 79).", annee: 2018, source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.3&l=es&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/GTM/CO/16-17, 2019) : consultation préalable, peuple xinka, peuple garífuna, absence de loi sur la juridiction autochtone (§ 37 et 38).", annee: 2019, source: "https://documents.un.org/api/symbol/access?s=CERD/C/GTM/CO/16-17&l=es&t=pdf"}
base_nationale:
  - {instrument: "Constitution politique de la République (1985, réformée en 1993), art. 66 à 70 (communautés autochtones) et art. 76 (enseignement bilingue)", nature: "constitution", annee: 1985, source: "https://www.constituteproject.org/constitution/Guatemala_1993?lang=es"}
  - {instrument: "Accord sur l'identité et les droits des peuples autochtones (Mexico, 31 mars 1995), chap. IV B, D, E et F, intégré à l'Accord de paix ferme et durable du 29 décembre 1996", nature: "accord_paix", annee: 1995, source: "https://faolex.fao.org/docs/pdf/gua122086.pdf"}
  - {instrument: "Code municipal (décret 12-2002), art. 20, 21, 55 à 57 et 65, texte publié au Diario de Centro América du 13 mai 2002", nature: "loi", annee: 2002, source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2002/gtdcx12-2002.pdf"}
  - {instrument: "Loi sur les conseils de développement urbain et rural (décret 11-2002), art. 5, 7, 9, 23 et 26", nature: "loi", annee: 2002, source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2002/gtdcx11-2002.pdf"}
  - {instrument: "Loi sur les langues nationales (décret 19-2003), art. 1, 8, 13 et 15", nature: "loi", annee: 2003, source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2003/gtdcx19-2003.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les communautés autochtones ont droit à la personnalité juridique, avec leurs autorités traditionnelles, par inscription au registre de la municipalité (Code municipal de 2002, art. 20) ; la municipalité doit reconnaître les alcaldías indígenas « lorsqu'elles existent » (art. 55) et le maire nomme les alcaldes comunitarios désignés par les communautés selon leurs usages (art. 56) ; la Rapporteuse spéciale constate en 2018 des refus d'inscription (A/HRC/39/17/Add.3, § 74 et 75).", source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2002/gtdcx12-2002.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'organisation et l'administration internes des communautés autochtones se régissent selon leurs normes, valeurs et procédures propres (Code municipal de 2002, art. 20) et leurs relations entre elles selon leurs normes traditionnelles (art. 21) ; ces normes ne s'appliquent qu'aux affaires internes, dans le cadre municipal.", source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2002/gtdcx12-2002.pdf"}
  justice_propre: {valeur: "partiel", note: "Les hautes cours reconnaissent le pluralisme juridique et la juridiction autochtone dans leur jurisprudence, sans loi d'application ; l'inscription de la justice autochtone dans la Constitution a été retirée du projet de réforme de 2016 (A/HRC/39/17/Add.3, § 77 et 78 ; CERD/C/GTM/CO/16-17, § 37).", source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.3&l=es&t=pdf"}
  terres: {valeur: "partiel", note: "Les terres des communautés autochtones et les autres formes de tenure communale bénéficient d'une protection spéciale, et les communautés qui administrent traditionnellement leurs terres maintiennent ce système (Constitution, art. 67) ; la loi du Registre d'information cadastrale de 2005 prévoit la déclaration de terres communales (art. 65 ; voir la fiche « Terres communales du Guatemala ») ; la Cour interaméricaine ordonne en 2023 des mesures législatives pour la sécurité juridique de la propriété communautaire (arrêt Agua Caliente, point 9).", source: "https://www.constituteproject.org/constitution/Guatemala_1993?lang=es"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le conseil municipal consulte les communautés ou autorités autochtones, à leur demande, sur les affaires qui touchent leurs droits, y compris selon leurs coutumes (Code municipal de 2002, art. 65) ; les consultations sur les mesures de développement de l'exécutif peuvent passer par les représentants autochtones des conseils de développement en attendant une loi (décret 11-2002, art. 26) ; la Cour interaméricaine ordonne en 2023 d'adopter des mesures législatives sur la consultation préalable (arrêt Agua Caliente, point 10).", source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2002/gtdcx12-2002.pdf"}
  langue: {valeur: "partiel", note: "L'espagnol est la seule langue officielle (Constitution, art. 143) ; la loi sur les langues nationales de 2003 reconnaît les langues maya, garífuna et xinka, autorise leur usage sans restriction dans leur communauté linguistique (art. 8) et prévoit l'accueil en langue propre dans les services de santé, d'éducation, de justice et de sécurité (art. 15).", source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2003/gtdcx19-2003.pdf"}
  education: {valeur: "partiel", note: "L'enseignement est dispensé de préférence en forme bilingue dans les zones de population autochtone majoritaire (Constitution, art. 76) et le système éducatif applique l'usage des langues maya, garífuna et xinka (loi sur les langues nationales de 2003, art. 13) ; le système reste celui du ministère de l'Éducation.", source: "https://www.constituteproject.org/constitution/Guatemala_1993?lang=es"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le Conseil national de développement urbain et rural compte quatre représentants du peuple maya, un du peuple xinka et un du peuple garífuna (décret 11-2002, art. 5 g) ; un représentant de chaque peuple autochtone siège aux conseils régionaux et départementaux de développement (art. 7 f et 9 e) et des conseils consultatifs autochtones formés des autorités propres des communautés assistent les conseils communautaires et municipaux (art. 23) ; aucun siège n'est réservé au Congrès, qui compte en 2018 18 députés mayas sur 158 (A/HRC/39/17/Add.3, § 76).", source: "https://www.congreso.gob.gt/assets/uploads/info_legislativo/decretos/2002/gtdcx11-2002.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Rapporteuse spéciale relève en 2018 que 19 % des engagements de l'accord de 1995 sont exécutés, que l'inscription des communautés au registre municipal dépend du bon vouloir des municipalités et que la reconnaissance des autorités autochtones rencontre des résistances, y compris après des décisions de justice favorables (A/HRC/39/17/Add.3, § 17, 74 et 75).", source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.3&l=es&t=pdf"}
chronologie:
  - {annee: 1985, evenement: "La Constitution reconnaît les formes d'organisation sociale des groupes autochtones (art. 66) et protège les terres communales (art. 67)."}
  - {annee: 1994, evenement: "L'Assemblée générale des Nations unies crée la MINUGUA (résolution 48/267)."}
  - {annee: 1995, evenement: "Signature à Mexico de l'Accord sur l'identité et les droits des peuples autochtones (31 mars)."}
  - {annee: 1996, evenement: "Ratification de la Convention 169 de l'OIT ; Accord de paix ferme et durable (29 décembre), qui fait entrer en vigueur l'accord de 1995."}
  - {annee: 1999, evenement: "Rejet par référendum des réformes constitutionnelles issues des accords de paix."}
  - {annee: 2002, evenement: "Code municipal (décret 12-2002) et loi sur les conseils de développement (décret 11-2002)."}
  - {annee: 2003, evenement: "Loi sur les langues nationales (décret 19-2003)."}
  - {annee: 2004, evenement: "Fermeture de la MINUGUA (31 décembre)."}
  - {annee: 2016, evenement: "Retrait de la reconnaissance de la justice autochtone du projet de réforme constitutionnelle du secteur de la justice."}
  - {annee: 2018, evenement: "Visite de la Rapporteuse spéciale des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2021, evenement: "Arrêt de la Cour interaméricaine sur les radios communautaires de quatre peuples mayas (6 octobre)."}
  - {annee: 2023, evenement: "Arrêt de la Cour interaméricaine Agua Caliente (16 mai)."}
