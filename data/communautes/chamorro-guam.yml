resume: >-
  Guam est un territoire non incorporé des États-Unis (territoire soumis au pouvoir plénier du Congrès sans être intégré à l'Union), doté depuis l'Organic Act de 1950 d'un gouvernement élu. Les Chamorros sont le peuple autochtone de l'île. Une loi de Guam de 2000 prévoyait un plébiscite sur le statut politique réservé aux « habitants autochtones de Guam » ; la justice fédérale l'a invalidé en 2017, décision confirmée en 2019 et devenue définitive en 2020. Guam figure sur la liste des territoires non autonomes.
