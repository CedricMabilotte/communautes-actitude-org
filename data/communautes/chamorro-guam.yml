resume: >-
  Guam est un territoire non incorporé des États-Unis (territoire soumis au pouvoir plénier du Congrès sans être intégré à l'Union), doté depuis l'Organic Act de 1950 d'un gouvernement élu. Les Chamorros sont le peuple autochtone de l'île. Une loi de Guam de 2000 réservait le plébiscite sur le statut politique aux « habitants autochtones de Guam » ; la justice fédérale l'a invalidée en 2017, décision confirmée en 2019 et devenue définitive en 2020. Depuis 2021, les baux du Chamorro Land Trust ne sont plus réservés aux « Native Chamorros ». Guam figure sur la liste des territoires non autonomes. Les Chamorros des îles voisines relèvent d'un autre régime : voir la fiche Chamorros et Caroliniens des Mariannes du Nord.
reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Résolution 80/96 « Question de Guam » (5 décembre 2025) : réaffirme le droit du peuple de Guam à l'autodétermination, rappelle le référendum de 1987 reconnaissant le droit du peuple chamorro à l'autodétermination et note l'interruption du référendum après la décision fédérale", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=A/RES/80/96&l=fr&t=pdf"}
