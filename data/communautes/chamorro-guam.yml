  verifie: ["Arrêt Davis v. Guam (9e circuit, 2019), y compris son exposé de l'Organic Act, du Chamorro Land Trust Act et de la loi de 2000 sur le plébiscite.", "Résolutions 79/105 (2024) et 80/96 (2025) et leurs renvois aux décisions de 2017, 2019 et 2020.", "21 Guam Code Ann. ch. 75A (compilation du 22 avril 2025) et page du ministère fédéral de la Justice sur l'affaire 17-cv-00113.", "1 Guam Code Ann. § 706 (langues officielles).", "48 U.S.C. § 1421a (govinfo.gov, édition 2023).", "Communication AL USA 7/2021 (OHCHR).", "Recensement de 2020 : tableau 1 (municipalités) et communiqué du Bureau du recensement (population chamorro)."]
  non_confirme: ["Sort du projet de loi 242-38 après l'audition publique de février 2026.", "Nombre de baux accordés selon le nouveau critère depuis 2021.", "Statut de l'enseignement du chamorro dans le droit de Guam."]
