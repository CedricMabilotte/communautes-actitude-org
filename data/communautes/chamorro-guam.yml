base_nationale:
  - {instrument: "Organic Act of Guam, Pub. L. 81-630 (48 U.S.C. §§ 1421-1424)", nature: "loi", annee: 1950, source: "https://www.govinfo.gov/content/pkg/USCODE-2023-title48/html/USCODE-2023-title48-chap8A-subchapI-sec1421a.htm"}
  - {instrument: "Chamorro Land Trust Act, Guam Pub. L. 12-226 (21 Guam Code Ann. ch. 75), modifiée par Guam Pub. L. 35-112 (21 Guam Code Ann. ch. 75A, en vigueur le 1er janvier 2021)", nature: "loi", annee: 2020, source: "https://col.guamcourts.gov/sites/default/files/21gc075A.pdf"}
  - {instrument: "Davis v. Guam, Cour d'appel fédérale du neuvième circuit, n° 17-15719", nature: "jurisprudence", annee: 2019, source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  - {instrument: "Langues officielles, Guam Pub. L. 12-132 (1 Guam Code Ann. § 706)", nature: "loi", annee: 1974, source: "https://col.guamcourts.gov/sites/default/files/01gc007.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'Organic Act de 1950 établit un exécutif, une législature et une justice pour le territoire, qui reste un territoire non incorporé soumis au pouvoir plénier du Congrès (48 U.S.C. §§ 1421a-1424) ; ces institutions sont celles de tous les habitants, non des seuls Chamorros.", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La législature de Guam adopte des lois dans les limites de l'Organic Act (48 U.S.C. §§ 1422-1424) et du pouvoir plénier du Congrès.", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "conteste", note: "La Chamorro Land Trust Commission, créée en 1975, attribue des baux sur des terres prises par les États-Unis entre 1898 et 1968 puis rendues à Guam. Après une action du ministère fédéral de la Justice (2017) et un accord de 2020, la loi Guam Pub. L. 35-112 remplace pour les demandes non approuvées au 1er janvier 2021 le critère « Native Chamorro » par celui de la perte de terres, « sans distinction de race » (21 Guam Code Ann. §§ 75A100-75A101) ; trois des cinq membres de la Commission doivent être Native Chamorros (§ 75A102).", source: "https://col.guamcourts.gov/sites/default/files/21gc075A.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "L'anglais et le chamorro sont langues officielles de Guam, mais le chamorro n'est pas requis pour l'enregistrement officiel des actes publics et la version anglaise prévaut (1 Guam Code Ann. §§ 706-707, Guam Pub. L. 12-132 de 1974).", source: "https://col.guamcourts.gov/sites/default/files/01gc007.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "conteste", note: "La loi de Guam définit les « Native Chamorros » comme les personnes devenues citoyennes des États-Unis par l'Organic Act et leurs descendants (21 Guam Code Ann. § 75101(d)) ; ce statut ne conditionne plus l'accès aux baux du Chamorro Land Trust depuis 2021 et ne peut plus fonder le droit de vote au plébiscite depuis Davis v. Guam.", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  autodetermination_externe: {valeur: "conteste", note: "La loi de Guam de 2000 sur le plébiscite (3 Guam Code Ann. § 21001(e)) réservait le vote sur le statut politique (indépendance, libre association, État fédéré) aux « Native Inhabitants of Guam » ; la Cour d'appel du neuvième circuit juge en 2019 cette restriction contraire au quinzième amendement (Davis v. Guam), et aucun plébiscite n'a eu lieu.", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
effectivite: {valeur: "contestee", note: "L'Assemblée générale note en 2025 que le référendum sur l'autodétermination a été interrompu après la décision fédérale confirmée par la Cour suprême le 4 mai 2020, et que plus de 11 000 autochtones s'étaient inscrits auprès de la Commission guamienne de décolonisation (résolution 80/96). Le projet de loi 242-38, déposé le 5 décembre 2025 pour ouvrir le plébiscite à tous les électeurs inscrits, n'avait pas été adopté en janvier 2026 (Pacific Island Times).", source: "https://documents.un.org/api/symbol/access?s=A/RES/80/96&l=fr&t=pdf"}
chronologie:
  - {annee: 1950, evenement: "Organic Act : gouvernement civil et citoyenneté des États-Unis."}
  - {annee: 1974, evenement: "Le chamorro devient langue officielle de Guam avec l'anglais (Guam Pub. L. 12-132)."}
  - {annee: 1975, evenement: "Création de la Chamorro Land Trust Commission."}
  - {annee: 1987, evenement: "Référendum approuvant un projet de loi sur un État libre associé de Guam ; les négociations avec les États-Unis prennent fin en 1997."}
  - {annee: 2000, evenement: "Loi de Guam sur le plébiscite de statut politique réservé aux habitants autochtones."}
  - {annee: 2017, evenement: "Le tribunal fédéral de district de Guam invalide la restriction du corps électoral (Davis v. Guam, 8 mars)."}
  - {annee: 2017, evenement: "Le ministère fédéral de la Justice attaque le Chamorro Land Trust Act au titre du Fair Housing Act (29 septembre)."}
  - {annee: 2019, evenement: "Confirmation par la Cour d'appel du neuvième circuit (29 juillet)."}
  - {annee: 2020, evenement: "La décision devient définitive devant la Cour suprême des États-Unis (4 mai)."}
  - {annee: 2020, evenement: "Accord avec le ministère fédéral de la Justice (déposé le 4 juin) ; la loi Guam Pub. L. 35-112 (10 décembre) remplace le critère « Native Chamorro » des baux du Chamorro Land Trust à compter du 1er janvier 2021."}
  - {annee: 2025, evenement: "Dépôt du projet de loi 242-38 ouvrant le plébiscite de statut à tous les électeurs inscrits (5 décembre)."}
