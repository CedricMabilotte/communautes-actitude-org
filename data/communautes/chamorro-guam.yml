droits:
  autogouvernement: {valeur: "partiel", note: "L'Organic Act de 1950 établit un exécutif, une législature et une justice pour le territoire, qui reste soumis au pouvoir plénier du Congrès (48 U.S.C. § 1421a) ; ces institutions sont celles de tous les habitants, non des seuls Chamorros.", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La législature de Guam adopte des lois dans les limites de l'Organic Act (48 U.S.C. §§ 1422-1424) et du pouvoir plénier du Congrès.", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La Chamorro Land Trust Commission, créée en 1975, attribue aux « Native Chamorros » des baux sur les terres saisies par les États-Unis pendant et après la Seconde Guerre mondiale puis rendues au gouvernement de Guam (21 Guam Code Ann. § 75101 et suiv.).", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La loi de Guam définit les « Native Chamorros », bénéficiaires du Chamorro Land Trust, comme les personnes devenues citoyennes des États-Unis par l'Organic Act et leurs descendants (Guam Pub. L. 15-118 de 1980, 21 Guam Code Ann. § 75101(d)).", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
  autodetermination_externe: {valeur: "conteste", note: "La loi de Guam de 2000 sur le plébiscite réservait le vote sur le statut politique aux « Native Inhabitants of Guam » ; la Cour d'appel du neuvième circuit juge en 2019 cette restriction contraire au quinzième amendement (Davis v. Guam).", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2019/07/29/17-15719.pdf"}
effectivite: {valeur: "contestee", note: "L'Assemblée générale note que le référendum sur l'autodétermination a été interrompu après la décision fédérale, confirmée par la Cour suprême le 4 mai 2020, et que plus de 11 000 autochtones s'étaient inscrits auprès de la Commission guamienne de décolonisation (résolution 79/105).", source: "https://documents.un.org/api/symbol/access?s=A/RES/79/105&l=fr&t=pdf"}
chronologie:
  - {annee: 1950, evenement: "Organic Act : gouvernement civil et citoyenneté des États-Unis."}
  - {annee: 1975, evenement: "Création de la Chamorro Land Trust Commission."}
  - {annee: 1987, evenement: "Référendum approuvant un projet de loi sur un État libre associé de Guam ; négociations closes en 1997."}
  - {annee: 2000, evenement: "Loi de Guam sur le plébiscite de statut politique réservé aux habitants autochtones."}
  - {annee: 2017, evenement: "Le tribunal fédéral de district de Guam invalide la restriction du corps électoral (Davis v. Guam, 8 mars)."}
  - {annee: 2019, evenement: "Confirmation par la Cour d'appel du neuvième circuit (29 juillet)."}
  - {annee: 2020, evenement: "La décision devient définitive devant la Cour suprême des États-Unis (4 mai)."}
