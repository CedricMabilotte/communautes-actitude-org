resume: >-
  Les zones Gurage, Hadiya, Kembata-Tembaro, Silte et Halaba et le woreda spécial (district à statut particulier) Yem relevaient de l'État régional des nations, nationalités et peuples du Sud ; leurs peuples sont des « nations, nationalités et peuples » au sens de la Constitution fédérale éthiopienne.
  Ces unités avaient demandé des référendums séparés, puis ont accepté un regroupement ; la Chambre de la Fédération (chambre haute) a décidé qu'elles resteraient ensemble dans un État renommé, sans référendum.
  L'État régional d'Éthiopie centrale a été établi le 19 août 2023, et son conseil s'est réuni à Wolkite ; la demande d'un État séparé maintenue par le conseil de la zone Gurage n'a pas été satisfaite.
