base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 5, 39, 40, 47, 52 et 61", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 39(3) : droit de chaque nation, nationalité et peuple à l'autogouvernement ; art. 47(2)-(3) : droit de former son propre État par référendum. État d'Éthiopie centrale établi le 19 août 2023, conseil réuni à Wolkite.", source: "https://www.ena.et/web/eng/w/eng_3222547"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(1) : les pouvoirs non attribués à la Fédération sont réservés aux États ; art. 52(2)(b) : chaque État adopte et applique sa constitution et ses lois.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Art. 40(3) : la terre est propriété commune des nations, nationalités et peuples, inaliénable ; art. 52(2)(d) : les États l'administrent selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Art. 39(2) : droit de chaque nation, nationalité et peuple de parler, écrire et développer sa langue ; art. 5(3) : chaque État fixe par la loi sa langue de travail. Langue de travail de l'État : l'amharique, selon la presse (2023).", source: "https://borkena.com/2023/08/19/ethiopias-two-new-regional-states-formed-central-ethiopia-south-ethiopia/"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Art. 61(2) : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération, plus un par million d'habitants.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) : droit inconditionnel à l'autodétermination, y compris la sécession (séparation d'avec l'État), selon une procédure de vote du conseil législatif puis de référendum. Jamais exercé par ces peuples.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "partielle", note: "La Chambre de la Fédération a décidé du regroupement sans référendum, contrairement à la procédure de l'art. 47. Le conseil de la zone Gurage a transmis en août 2022 son rejet de l'État d'Éthiopie centrale ; des dizaines de jeunes ont été détenus à Wolkite en novembre 2022, puis des responsables de la zone, des responsables politiques locaux, des militants et des jeunes ont été arrêtés en mars 2023 (Rift Valley Institute, mars 2023).", source: "https://riftvalley.net/wp-content/uploads/2023/03/RVI-2023.03.21-Referendum-in-Ethiopias-Southern-Region.pdf"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale (art. 39 et 47)."}
  - {annee: 2022, evenement: "En août, le conseil de la zone Gurage rejette le projet d'État d'Éthiopie centrale et maintient sa demande d'un État séparé ; quatre woredas gurage et la ville de Butajira demandent au contraire à rejoindre l'Éthiopie centrale."}
  - {annee: 2022, evenement: "En novembre, arrestations de jeunes à Wolkite après une journée de grève."}
  - {annee: 2023, evenement: "En mars, arrestations de responsables de la zone Gurage, de responsables politiques locaux, de militants et de jeunes."}
  - {annee: 2023, evenement: "Le 19 août, établissement de l'État régional d'Éthiopie centrale à partir de la partie restante de l'État des nations, nationalités et peuples du Sud."}
