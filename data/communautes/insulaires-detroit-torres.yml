resume: >-
  Peuple autochtone des îles du détroit de Torrès, entre la péninsule du cap York et la Papouasie-Nouvelle-Guinée. La décision Mabo (No 2) de la Haute Cour d'Australie du 3 juin 1992, obtenue par Eddie Koiki Mabo, écarte la doctrine de la terra nullius (terre sans maître) et reconnaît un titre autochtone limité. La Torres Strait Regional Authority, autorité statutaire fédérale créée le 1er juillet 1994, dont les 20 membres sont tous élus depuis 2012 (dernière élection le 30 novembre 2024), a pour mission de reconnaître et maintenir l'Ailan Kastom (coutume insulaire). En 2022, le Comité des droits de l'homme de l'ONU constate que l'inaction climatique de l'Australie viole les droits d'insulaires à la vie privée et familiale et à la vie culturelle de leur minorité ; le 15 juillet 2025, la Cour fédérale rejette l'action en négligence de deux insulaires de Boigu et Saibai contre l'État fédéral. La zone protégée du traité de 1978 et les terres insulaires transférées par le Queensland font l'objet des fiches « Habitants traditionnels de la zone protégée du détroit de Torrès » et « Terres aborigènes et insulaires du Queensland ».
