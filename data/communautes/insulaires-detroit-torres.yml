  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité des droits de l'homme constate en 2022 que l'Australie n'a pas protégé les auteurs, insulaires du détroit, contre les effets du changement climatique sur leur vie privée et familiale et sur leur vie culturelle (art. 17 et 27 du Pacte), et lui demande une réparation intégrale et des consultations avec leurs communautés (§ 11). Le 15 juillet 2025, la Cour fédérale (Pabai v Commonwealth (No 2), [2025] FCA 796) constate les atteintes au mode de vie traditionnel et à l'Ailan Kastom mais juge qu'aucune obligation de diligence de l'État fédéral n'est établie.", source: "https://documents.un.org/api/symbol/access?s=CCPR/C/135/D/3624/2019&l=fr&t=pdf"}
chronologie:
  - {annee: 1992, evenement: "Décision Mabo (No 2) de la Haute Cour (3 juin)."}
  - {annee: 1993, evenement: "Native Title Act."}
  - {annee: 1994, evenement: "Création de la Torres Strait Regional Authority (1er juillet)."}
  - {annee: 2005, evenement: "L'ATSIC Act de 1989 devient l'Aboriginal and Torres Strait Islander Act 2005 ; la TSRA y est régie par la partie 3A."}
  - {annee: 2012, evenement: "Première élection directe de tous les membres de la TSRA (15 septembre)."}
  - {annee: 2020, evenement: "Loi du Queensland Meriba Omasker Kaziw Kazipa sur l'adoption coutumière insulaire."}
  - {annee: 2022, evenement: "Constatations du Comité des droits de l'homme dans l'affaire Billy et consorts c. Australie (21 juillet)."}
  - {annee: 2024, evenement: "Élection des 20 membres de la TSRA (30 novembre), dont un sans concurrent à Boigu."}
  - {annee: 2025, evenement: "La Cour fédérale rejette l'action climatique Pabai v Commonwealth (15 juillet)."}
