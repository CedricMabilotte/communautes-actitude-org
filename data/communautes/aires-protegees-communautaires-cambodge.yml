effectivite: {valeur: "partielle", note: "En juillet 2021, sur 182 aires, 141 avaient un prakas de reconnaissance, 48 un plan de gestion et 39 un accord de gestion signé (ClientEarth, 2022) ; en octobre 2022, aucune des 61 aires créées avant 2008, dont le terme de 15 ans était en principe échu, n'avait été officiellement prolongée. Les communautés n'ont pas le droit d'exclure les tiers de l'aire et ne peuvent imposer elles-mêmes de sanctions légales (MRLG, 2022).", source: "https://data.opendevelopmentcambodia.net/en/dataset/fadc0000-80f2-4e0e-b275-fe58d6bc733c/resource/050f2e39-c346-47d6-9980-0f5892d26498/download/00_land-cpa.pdf"}
chronologie:
  - {annee: 1993, evenement: "Décret royal sur la protection des aires naturelles : 23 aires protégées."}
  - {annee: 1999, evenement: "Premières aires protégées communautaires."}
  - {annee: 2008, evenement: "Loi sur les aires protégées : accords de 15 ans dans la zone d'usage durable ; 61 aires existent déjà."}
  - {annee: 2016, evenement: "Les forêts des aires protégées passent du ministère de l'Agriculture au ministère de l'Environnement."}
  - {annee: 2017, evenement: "Prakas sur la procédure d'établissement des aires protégées communautaires (sept étapes)."}
  - {annee: 2019, evenement: "Sixième rapport national à la Convention sur la diversité biologique."}
  - {annee: 2020, evenement: "Lignes directrices sur la résolution des conflits dans les aires protégées communautaires (décembre)."}
  - {annee: 2021, evenement: "182 aires, 309 463 hectares, 55 446 familles."}
  - {annee: 2023, evenement: "Code de l'environnement et des ressources naturelles (29 juin) : accords de 25 ans au plus avec l'administration infranationale ; abrogation de la loi de 2008."}
  - {annee: 2024, evenement: "Application du Code, un an après son entrée en vigueur. En mai, consultation du ministère et de RECOFTC sur de nouvelles lignes directrices des aires protégées communautaires."}
  - {annee: 2026, evenement: "Septième rapport national à la Convention sur la diversité biologique (27 février) : 193 aires et 332 108 hectares en 2023."}
  - {annee: 2026, evenement: "Sous-décret n° 106 du 26 mai : abrogation du sous-décret n° 245 du 30 novembre 2022 qui délimitait 933 577 hectares de zones communautaires dans les aires protégées ; ces terres restent aires protégées naturelles gérées par le ministère de l'Environnement."}
fiabilite:
  verifie: ["Art. 21 à 28 de la loi de 2008 (traduction anglaise publiée par Open Development Cambodia).", "Art. 364 et 368 à 374, 864 et 865 du Code de 2023 (traduction anglaise réalisée avec le PNUE sous la supervision du ministère de l'Environnement).", "182 aires, 309 463 ha, 55 446 familles, 141 prakas, 48 plans, 39 accords : ClientEarth (avril 2022), qui cite un rapport ministériel du 2 juillet 2021.", "153 aires en 2017 et 22 plans approuvés : sixième rapport national à la CDB (2019).", "61 aires créées avant 2008, aucune prolongée en octobre 2022 ; pas de droit d'exclusion ; pénalités mineures seulement : policy brief du MRLG (octobre 2022).", "Tableau : 61 sites tirés du jeu de données « Community protected areas » d'Open Development Cambodia (licence CC-BY, mis à jour le 5 octobre 2026), chacun rattaché à un prakas ou à un document de l'aire ; Cham Pen (prakas du 8 septembre 2020) ajoutée en octobre 2026.", "193 aires et 332 108 ha en 2023 : septième rapport national à la CDB (février 2026), objectif national 9.", "Sous-décret n° 106 du 26 mai 2026 (Journal officiel, année 26, n° 48) : art. 1 (abrogation du sous-décret n° 245 de 2022 sur les zones communautaires, 933 577 ha) et art. 2 (maintien de ces terres en aires protégées naturelles), lus sur le texte khmer.", "Loi de 2008 et Code de 2023 : aucun texte d'abrogation ou de modification du chapitre 6 du livre sur les aires protégées n'apparaît dans la base juridique d'Open Development Cambodia ni sur le site du ministère de l'Environnement (consultés le 6 octobre 2026)."]
  non_confirme: ["Le prakas de 2017 n'a été consulté qu'à travers l'analyse de ClientEarth (articles cités par ce rapport) ; seul un projet de texte est en ligne.", "Le Code de 2023 renvoie les règles d'établissement et de gestion à un sous-décret et à un prakas (art. 371 (8) et (9)) dont la publication n'a pas été vérifiée.", "Le Code (art. 371 (1)) cite la seule zone d'usage durable, alors qu'une étude du MRLG (2025) mentionne aussi la zone communautaire.", "Le texte anglais du Code ne contient pas le terme « indigenous », présent dans la loi de 2008 (« indigenous ethnic minorities ») ; le glossaire annexé au Code (art. 3) ne figure pas dans cette traduction. Selon le MRLG (2025), « communautés locales » remplace « peuples autochtones » dans le Code et seul le glossaire mentionne les peuples autochtones ; texte khmer non consulté.", "Le tableau couvre 61 des 193 aires (environ 1 212 km²) ; les années sont laissées vides lorsque la date de délivrance et la date du prakas cité diffèrent (4 aires du parc national de Virachey, Akphivoat Prey Veng) ; deux aires de Prey Lang comptent deux polygones additionnés.", "Le sixième rapport national donne 24 410 ha pour 153 aires en 2017, mais aussi 169 104 ha et 28 782 familles pour 122 aires en 2014 : les deux chiffres du même rapport sont incompatibles entre eux ; le premier l'est aussi avec les 309 463 ha de 2021.", "Nombre de personnes concernées : les sources donnent des familles, non des personnes.", "Le sous-décret n° 106 de 2026 vise les zones communautaires (habitat, rizières) et non les aires protégées communautaires, situées en zone d'usage durable ; son effet sur les aires protégées communautaires et sur l'usage des ressources en zone communautaire (Code, art. 370) n'est pas établi.", "Les nouvelles lignes directrices discutées en 2024 n'ont pas été trouvées publiées : Open Development Cambodia n'affiche en 2025 que le projet de 2016.", "Veille d'actualité 2025-2026 limitée aux sites officiels (ministère de l'Environnement, base juridique d'Open Development Cambodia, Convention sur la diversité biologique) et aux sources citées : la veille de presse 2025-2026 n'a pas été faite par recherche générale."]
