effectivite: {valeur: "partielle", note: "En juillet 2021, sur 182 aires, 141 avaient un prakas de reconnaissance, 48 un plan de gestion et 39 un accord de gestion signé (ClientEarth, 2022) ; en octobre 2022, aucune des 61 aires créées avant 2008, dont le terme de 15 ans était en principe échu, n'avait été officiellement prolongée. Les communautés n'ont pas le droit d'exclure les tiers de l'aire et ne peuvent imposer elles-mêmes de sanctions légales (MRLG, 2022).", source: "https://data.opendevelopmentcambodia.net/en/dataset/fadc0000-80f2-4e0e-b275-fe58d6bc733c/resource/050f2e39-c346-47d6-9980-0f5892d26498/download/00_land-cpa.pdf"}
chronologie:
  - {annee: 1993, evenement: "Décret royal sur la protection des aires naturelles : 23 aires protégées."}
  - {annee: 1999, evenement: "Premières aires protégées communautaires."}
  - {annee: 2008, evenement: "Loi sur les aires protégées : accords de 15 ans dans la zone d'usage durable ; 61 aires existent déjà."}
  - {annee: 2016, evenement: "Les forêts des aires protégées passent du ministère de l'Agriculture au ministère de l'Environnement."}
  - {annee: 2017, evenement: "Prakas sur la procédure d'établissement des aires protégées communautaires (sept étapes)."}
  - {annee: 2019, evenement: "Sixième rapport national à la Convention sur la diversité biologique."}
  - {annee: 2020, evenement: "Lignes directrices sur la résolution des conflits dans les aires protégées communautaires (décembre)."}
  - {annee: 2021, evenement: "182 aires, 309 463 hectares, 55 446 familles."}
  - {annee: 2023, evenement: "Code de l'environnement et des ressources naturelles (29 juin) : accords de 25 ans au plus avec l'administration infranationale ; abrogation de la loi de 2008."}
  - {annee: 2024, evenement: "Application du Code, un an après son entrée en vigueur."}
fiabilite:
  verifie: ["Art. 21 à 28 de la loi de 2008 (traduction anglaise publiée par Open Development Cambodia).", "Art. 364 et 368 à 374, 864 et 865 du Code de 2023 (traduction anglaise réalisée avec le PNUE sous la supervision du ministère de l'Environnement).", "182 aires, 309 463 ha, 55 446 familles, 141 prakas, 48 plans, 39 accords : ClientEarth (avril 2022), qui cite un rapport ministériel du 2 juillet 2021.", "153 aires en 2017 et 22 plans approuvés : sixième rapport national à la CDB (2019).", "61 aires créées avant 2008, aucune prolongée en octobre 2022 ; pas de droit d'exclusion ; pénalités mineures seulement : policy brief du MRLG (octobre 2022).", "Tableau : 60 sites tirés du jeu de données « Community protected areas » d'Open Development Cambodia (licence CC-BY, mis à jour en 2026), chacun rattaché à un prakas ou à un document de l'aire."]
  non_confirme: ["Le prakas de 2017 n'a été consulté qu'à travers l'analyse de ClientEarth (articles cités par ce rapport) ; seul un projet de texte est en ligne.", "Le Code de 2023 renvoie les règles d'établissement et de gestion à un sous-décret et à un prakas (art. 371 (8) et (9)) dont la publication n'a pas été vérifiée.", "Le Code (art. 371 (1)) cite la seule zone d'usage durable, alors qu'une étude du MRLG (2025) mentionne aussi la zone communautaire.", "Le texte anglais du Code ne contient pas le terme « indigenous », présent dans la loi de 2008 (« indigenous ethnic minorities ») : le MRLG (2025) relève le remplacement de « peuples autochtones » par « communautés locales » dans le Code ; texte khmer non consulté.", "Le tableau couvre 60 des 182 aires (environ 1 178 km²) ; les années sont laissées vides lorsque la date de délivrance et la date du prakas cité diffèrent (4 aires du parc national de Virachey, Akphivoat Prey Veng) ; deux aires de Prey Lang comptent deux polygones additionnés.", "Le sixième rapport national donne 24 410 ha pour 153 aires en 2017, mais aussi 169 104 ha et 28 782 familles pour 122 aires en 2014 : les deux chiffres du même rapport sont incompatibles entre eux ; le premier l'est aussi avec les 309 463 ha de 2021.", "Nombre de personnes concernées : les sources donnent des familles, non des personnes."]
