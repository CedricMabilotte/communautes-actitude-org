droits:
  autogouvernement: {valeur: "partiel", note: "La communauté élit un comité de gestion pour cinq ans au plus, qui doit recevoir dans les 15 jours un mandat de reconnaissance du chef de commune ; 60 % des membres peuvent demander au conseil communal sa dissolution (prakas de 2017, art. 16 à 18, selon ClientEarth). L'accord conclu avec l'État peut être suspendu ou révoqué si la communauté ne respecte pas l'accord ou le plan de gestion (loi de 2008, art. 25 ; Code de 2023, art. 371 (5) à (7)).", source: "https://www.clientearth.org/media/cbzoeazp/clientearth_cpa-report-cambodia_en.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le règlement de l'aire protégée communautaire est établi par la communauté locale, reconnu par l'autorité locale et approuvé par l'administration de la conservation de la nature (loi de 2008, art. 26) ; le Code de 2023 retient le plan de gestion des ressources rédigé par la communauté, reconnu par l'administration infranationale et révisé tous les trois ans (art. 374), et maintient les textes d'application antérieurs jusqu'à leur remplacement (art. 863). Selon ClientEarth, les autorités ont exigé dans un cas le respect du modèle de règlement annexé au prakas de 2017.", source: "https://data.opendevelopmentcambodia.net/en/dataset/15618852-c2af-4d8c-950e-dea975724bbe/resource/0894d3f7-051f-4235-8206-375efe4d98a4/download/code-on-environment-and-natural-resources.pdf"}
  justice_propre: {valeur: "partiel", note: "Le comité peut régler lui-même les différends internes à la communauté (prakas de 2017, art. 21, selon ClientEarth) et n'applique que des pénalités mineures prévues par le plan de gestion ; les sanctions légales relèvent des autorités de l'État (MRLG, 2022).", source: "https://data.opendevelopmentcambodia.net/en/dataset/fadc0000-80f2-4e0e-b275-fe58d6bc733c/resource/050f2e39-c346-47d6-9980-0f5892d26498/download/00_land-cpa.pdf"}
  terres: {valeur: "partiel", note: "Le ministère attribue à la communauté une partie de la zone d'usage durable par un accord de 15 ans au plus (loi de 2008, art. 25), porté à 25 ans au plus par le Code de 2023 (art. 371 (4)) ; la communauté ne peut défricher, convertir en terre agricole, titrer, vendre, louer, mettre en gage, donner ni transférer l'aire (loi de 2008, art. 26 ; Code de 2023, art. 372 (1)). La terre reste domaine public de l'État.", source: "https://data.opendevelopmentcambodia.net/en/dataset/15618852-c2af-4d8c-950e-dea975724bbe/resource/0894d3f7-051f-4235-8206-375efe4d98a4/download/code-on-environment-and-natural-resources.pdf"}
  ressources: {valeur: "partiel", note: "L'État reconnaît et garantit le droit des communautés locales d'utiliser les ressources naturelles selon leurs pratiques traditionnelles, coutumières et religieuses dans les aires protégées (Code de 2023, art. 369 (1), qui reprend l'art. 22 de la loi de 2008) ; l'usage se fait dans les zones d'usage durable et communautaires, selon le plan de gestion et les directives techniques du ministère (art. 370).", source: "https://data.opendevelopmentcambodia.net/en/dataset/15618852-c2af-4d8c-950e-dea975724bbe/resource/0894d3f7-051f-4235-8206-375efe4d98a4/download/code-on-environment-and-natural-resources.pdf"}
  consentement: {valeur: "partiel", note: "L'administration étudie la création de l'aire, son emplacement et sa taille en consultation avec l'autorité locale et la communauté (loi de 2008, art. 27 ; Code de 2023, art. 371 (3)) ; la création suppose la participation volontaire d'au moins 60 % des ménages du village (prakas de 2017, art. 11, selon ClientEarth). Le droit cambodgien ne prévoit pas de consentement libre, préalable et éclairé pour l'attribution, le renouvellement ou la révocation (ClientEarth, 2022).", source: "https://data.opendevelopmentcambodia.net/en/dataset/15618852-c2af-4d8c-950e-dea975724bbe/resource/0894d3f7-051f-4235-8206-375efe4d98a4/download/code-on-environment-and-natural-resources.pdf"}
