resume: >-
  Fiche agrégée : elle couvre les communautés villageoises à qui le ministère de l'Environnement confie la gestion d'une partie d'une aire protégée naturelle sous forme d'« aire protégée communautaire » (community protected area). La loi sur les aires protégées de 2008 permettait d'attribuer une partie de la zone d'usage durable à une communauté résidant dans l'aire ou à proximité, par un accord de 15 ans au plus ; la terre reste propriété publique de l'État et la communauté ne peut ni la défricher, ni la titrer, ni la céder. Le Code de l'environnement et des ressources naturelles, promulgué le 29 juin 2023 et applicable depuis 2024, abroge cette loi et reprend le régime (art. 371 à 374), avec des accords conclus avec l'administration infranationale pour 25 ans au plus. En 2021, 182 aires couvraient 309 463 hectares et réunissaient 55 446 familles ; le septième rapport national à la Convention sur la diversité biologique (2026) compte 193 aires et 332 108 hectares en 2023.
