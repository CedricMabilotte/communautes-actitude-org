resume: >-
  Communautés afrodescendantes et autochtones du bassin de l'Atrato, dans le Chocó. Par l'arrêt T-622 du 10 novembre 2016, la Cour constitutionnelle reconnaît le fleuve, son bassin et ses affluents comme sujet de droits (titulaire de droits propres) à la protection, à la conservation, à l'entretien et à la restauration, à la charge de l'État et des communautés ethniques. Elle confie la tutelle et la représentation légale du fleuve à un délégué du gouvernement et à un représentant des communautés demanderesses (Cocomopoca, Cocomacia, Asocoba, FISCH). Le gouvernement a désigné le ministère de l'Environnement en 2017 ; sept organisations du bassin ont formé un Corps collégial de quatorze gardiens et gardiennes, qui siège avec le ministère dans la Commission des gardiens du fleuve créée en 2018. Le titre collectif des conseils communautaires relève de la fiche « Communautés noires du Pacifique colombien ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits économiques, sociaux et culturels cite l'arrêt T-622 de 2016 de la Cour constitutionnelle sur les droits culturels et environnementaux du fleuve Atrato (E/C.12/COL/CO/7, § 52)", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=E/C.12/COL/CO/7&l=fr&t=pdf"}
  - {mecanisme: "oit_169", detail: "La Convention 169 de l'OIT, incorporée par la loi 21 de 1991, est appliquée par l'arrêt T-622 aux communautés demanderesses ; l'ordre cinquième exige leur participation au plan de décontamination « dans le cadre de la Convention 169 de l'OIT »", annee: 2016, source: "https://www.corteconstitucional.gov.co/relatoria/2016/t-622-16.htm"}
base_nationale:
  - {instrument: "Cour constitutionnelle, arrêt T-622 du 10 novembre 2016 (Sala Sexta de Revisión, magistrat rapporteur Jorge Iván Palacio Palacio)", nature: "jurisprudence", annee: 2016, source: "https://www.corteconstitucional.gov.co/relatoria/2016/t-622-16.htm"}
  - {instrument: "Décret 1148 du 5 juillet 2017 désignant le ministère de l'Environnement et du Développement durable comme représentant légal des droits du fleuve, de son bassin et de ses affluents", nature: "loi", annee: 2017, source: "https://atrato.minambiente.gov.co/wp-content/uploads/2021/11/Decreto-1148-del-05-de-Julio-de-2017-Representante-Derechos-del-Rio-Atrato.pdf"}
  - {instrument: "Résolution 907 du 23 mai 2018 du ministère de l'Environnement créant la Commission des gardiens du fleuve Atrato", nature: "loi", annee: 2018, source: "https://atrato.minambiente.gov.co/index.php/normatividad/"}
  - {instrument: "Loi 70 du 27 août 1993 (conseils communautaires des communautés noires, art. 5)", nature: "loi", annee: 1993, source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'arrêt T-622 (ordre quatrième) prévoit que le fleuve est représenté par un membre des communautés demanderesses, choisi par elles. Le Corps collégial des gardiens, convenu le 31 août 2017 à Quibdó, réunit quatorze représentants de sept organisations du bassin (un homme et une femme par organisation) ; il siège avec le ministère de l'Environnement dans la Commission des gardiens créée par la résolution 907 de 2018. Sa compétence se limite au suivi de l'arrêt.", source: "https://atrato.minambiente.gov.co/index.php/comision-de-guardianes-del-rio-atrato/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'arrêt T-622 (ordre quatrième) confie la tutelle et la représentation légale des droits du fleuve, de son bassin et de ses affluents au gouvernement « en conjunto con las comunidades étnicas » (avec les communautés ethniques) du bassin ; il définit les droits bioculturels comme le droit de ces communautés d'administrer et de protéger de façon autonome leurs territoires et leurs ressources selon leurs propres lois et coutumes.", source: "https://www.corteconstitucional.gov.co/relatoria/2016/t-622-16.htm"}
  consentement: {valeur: "partiel", note: "L'arrêt T-622 ordonne que le plan de décontamination (ordre cinquième), le plan contre l'exploitation minière illégale (ordre sixième) et le plan de sécurité alimentaire (ordre septième) soient conçus avec les communautés demanderesses ou de façon concertée avec elles, et que leur participation soit garantie dans le cadre de la Convention 169 de l'OIT. Il s'agit d'une participation, non d'un droit de veto.", source: "https://www.corteconstitucional.gov.co/relatoria/2016/t-622-16.htm"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "L'arrêt T-622 (ordre quatrième) fait d'un représentant des communautés l'un des deux gardiens légaux du fleuve, avec le délégué du gouvernement. La Commission des gardiens réunit les quatorze délégués des communautés, le ministère de l'Environnement et une équipe de conseil (Institut Humboldt, IIAP, universités, WWF) ; sa neuvième session, en juillet 2020, est présidée par le ministère et par une gardienne au nom du Corps collégial. Il ne s'agit pas de sièges réservés dans une assemblée élue.", source: "https://www.minambiente.gov.co/minambiente-lidero-novena-sesion-de-la-comision-de-guardianes-del-rio-atrato/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de 2021 relève que la Commission des gardiens se réunit régulièrement depuis 2018 et que les plans des ordres sixième (2017), cinquième (2019) et septième (fin 2020) ont été adoptés, les deux derniers avec plus de deux ans de retard. Elle note que les gardiens des communautés ne sont pas rémunérés et n'ont pas de moyens propres de transport, que l'exploitation minière illégale a augmenté et que des groupes armés en tirent des revenus.", source: "https://academic.oup.com/jel/article/33/3/531/6359472"}
chronologie:
  - {annee: 1993, evenement: "Loi 70 : les communautés noires reçoivent des titres collectifs administrés par des conseils communautaires."}
  - {annee: 2015, evenement: "Le Tribunal administratif de Cundinamarca (11 février) puis le Conseil d'État (21 avril) rejettent l'action de tutelle (recours en protection des droits fondamentaux) déposée par Tierra Digna pour les communautés."}
  - {annee: 2016, evenement: "Arrêt T-622 du 10 novembre : le fleuve Atrato devient sujet de droits ; tutelle partagée entre l'État et les communautés ethniques."}
  - {annee: 2017, evenement: "Décret 1148 du 5 juillet : le ministère de l'Environnement est désigné représentant légal des droits du fleuve. Le 31 août, à Quibdó, les organisations du bassin conviennent de former un Corps collégial de quatorze gardiens et gardiennes."}
  - {annee: 2018, evenement: "Résolution 907 du 23 mai du ministère de l'Environnement : création de la Commission des gardiens."}
  - {annee: 2020, evenement: "Neuvième session de la Commission des gardiens ; les quinze mairies du bassin visées par l'arrêt y présentent leurs actions."}
  - {annee: 2021, evenement: "Quatorzième session de la Commission : adoption du plan d'action de l'ordre septième (subsistance et alimentation)."}
  - {annee: 2025, evenement: "Le Comité des droits économiques, sociaux et culturels de l'ONU cite l'arrêt T-622 ; accords de restauration de 300 hectares avec quatre conseils communautaires (La Molana, Paimadó, Cocomopoca, Cocomacia)."}
fiabilite:
  verifie: ["Dispositif de l'arrêt T-622 (ordres deuxième à septième), date, composition de la chambre, liste des quinze municipalités, surface du bassin (40 000 km²), population du Chocó et définition des droits bioculturels : texte de l'arrêt sur le site de la Cour constitutionnelle.", "Décret 1148 du 5 juillet 2017, article 1 : texte publié par le ministère de l'Environnement.", "Résolution 907 du 23 mai 2018 : page « Normatividad » du site du ministère consacré à l'Atrato.", "Composition du Corps collégial (quatorze représentants de sept organisations, un homme et une femme chacune, accord du 31 août 2017) : page du ministère sur la Commission des gardiens.", "Composition de la Commission et neuvième session : communiqué du ministère du 2 juillet 2020.", "Quatorzième session et adoption du plan de l'ordre septième : communiqué du ministère du 27 novembre 2021.", "Accords de restauration de 2025 : communiqué du ministère du 3 octobre 2025.", "§ 52 des observations finales E/C.12/COL/CO/7 (2025) et § 70 du rapport A/HRC/43/3/Add.3 (2020, persistance de la contamination au mercure dans le bassin)."]
  non_confirme: ["Texte de la résolution 907 de 2018 non lu ; seuls son numéro, sa date et son objet sont confirmés.", "Population du bassin : aucun chiffre sourcé trouvé ; l'arrêt ne donne que celle du département du Chocó.", "Nombre de villages et de conseils communautaires du bassin : non établi.", "Le nombre de municipalités du bassin diffère selon la source : 15 visées par l'arrêt, 27 selon le ministère en 2025.", "Rapport d'audit de la Contrôleuse générale sur l'exécution de l'arrêt (exercice 2021) : annoncé par le ministère, document non lisible en ligne.", "Les titres collectifs des conseils communautaires relèvent de la fiche sur les communautés noires du Pacifique ; ils ne sont pas repris ici."]
