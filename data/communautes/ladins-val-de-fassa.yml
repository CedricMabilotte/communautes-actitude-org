droits:
  autogouvernement: {valeur: "reconnu", note: "Le Comun General de Fascia, collectivité supracommunale nommée à l'art. 102 du Statut depuis la loi constitutionnelle 1/2017, a pour organes un Procurador élu au suffrage universel direct et un Consei General de 28 membres plus le Procurador, dont 16 élus au suffrage universel et 12 désignés par les conseils municipaux, statut approuvé par la loi provinciale 1/2010, art. 10 et 17.", source: "https://www.consiglio.provincia.tn.it/leggi-e-archivi/codice-provinciale/Pages/legge.aspx?uid=21177"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Consei General adopte les règlements et les actes généraux de la vallée, dont ceux relatifs à la langue ladine ; aucun pouvoir législatif : la région et la province peuvent lui attribuer, transférer ou déléguer des fonctions administratives, Statut, art. 102, al. 3 (loi constitutionnelle 1/2017).", source: "https://www.comungeneraldefascia.tn.it/Comun-General2/Organi-istituzionali/Il-Consei-general"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le territoire du Comun General n'est pas modifiable, loi provinciale 3/2006, art. 19, al. 2 ; la collectivité exerce les fonctions d'urbanisme et de planification territoriale des communautés de vallée, avec un plan territorial de communauté.", source: "https://www.comungeneraldefascia.tn.it/Comun-General2/Organi-istituzionali/Il-Comun-general-de-Fascia-Art.-8.-L.-Cost.-1-dicembre-2017-n.1"}
  ressources: {valeur: "partiel", note: "Le Comun General délivre les autorisations de cueillette de plantes et de fleurs au-delà des limites quantitatives de la loi provinciale 11/2007 (forêts, cours d'eau et aires protégées) et gère depuis 1997, en accord avec les communes, la cueillette réglementée des champignons ; aucune compétence sur les forêts, les eaux ou le sous-sol n'a été trouvée.", source: "https://www.comungeneraldefascia.tn.it/Guida-alla-Val-di-Fassa/Ambiente-e-territorio"}
  consentement: {valeur: "partiel", note: "Le Comun General rend un avis obligatoire sur les projets de loi de la Giunta provinciale (exécutif provincial) qui visent spécifiquement la population ladine et donne son entente (intesa, accord formel) sur les mesures générales et les conventions qui visent spécifiquement la communauté ladine, loi provinciale 3/2006, art. 19, al. 9 ; tout nouveau transfert de fonctions suppose aussi une intesa, art. 19, al. 6. Le Procurador et le conseiller provincial ladin siègent à la Conférence des minorités, dont l'avis obligatoire et contraignant est requis pour répartir le fonds provincial des minorités, loi provinciale 6/2008, art. 9 et 24.", source: "https://www.consiglio.provincia.tn.it/leggi-e-archivi/codice-provinciale/Pages/legge.aspx?uid=15067"}
  langue: {valeur: "partiel", note: "Droit d'employer le ladin à l'oral et à l'écrit avec les écoles, la province et les collectivités locales du val ; les réponses écrites sont données en italien, qui fait foi, et en ladin, et les actes publics destinés au public sont rédigés en italien suivi du texte ladin, loi provinciale 6/2008, art. 16, al. 2 et 3 ; priorité absolue dans les concours publics locaux aux candidats attestant la connaissance du ladin, art. 29.", source: "https://www.consiglio.provincia.tn.it/leggi-e-archivi/codice-provinciale/Pages/legge.aspx?uid=18194"}
  education: {valeur: "reconnu", note: "L'enseignement de la langue et de la culture ladines est garanti dans les écoles des communes ladines, Statut, art. 102, al. 2 ; l'école ladine de Fassa (scola ladina de Fascia) regroupe les écoles du val, et le Comun General nomme le conseil de l'éducation et de la formation de Fassa, loi provinciale 5/2006, art. 46 et 47.", source: "https://www.consiglio.provincia.tn.it/leggi-e-archivi/codice-provinciale/Pages/legge.aspx?uid=15633"}
  fiscalite: {valeur: "partiel", note: "Autonomie financière fondée sur des ressources propres et transférées ; pouvoir de fixer taxes, tarifs et contributions des services transférés par les communes, statut du Comun General, art. 22 ; la province finance la protection des populations ladine, mochène et cimbre, Statut, art. 15, al. 3.", source: "https://www.consiglio.provincia.tn.it/leggi-e-archivi/codice-provinciale/Pages/legge.aspx?uid=21177"}
  representation: {valeur: "reconnu", note: "Un siège du Conseil provincial de Trente est attribué au territoire des communes ladines du val de Fassa, Statut, art. 48, al. 3 ; le Procurador représente la population ladine au Conseil des autonomies locales, loi provinciale 6/2008, art. 8, al. 3.", source: "https://www.provinz.bz.it/downloads/autonomy_statute_eng.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Minority Rights Group (page mise à jour en 2024) relève que le ladin est langue administrative dans le val de Fassa depuis 1993 et que six écoles maternelles l'emploient à parité avec l'italien, mais qu'aucune offre en ladin n'existe dans le secondaire supérieur et que la protection est moindre dans la province de Trente que dans celle de Bolzano. Le Procurador et le Consei General ont été élus le 4 mai 2025.", source: "https://minorityrights.org/communities/ladins/"}
chronologie:
  - {annee: 1253, evenement: "Première mention de la Communitas Fasciae (Magnifica Comunità di Fassa) dans les documents."}
  - {annee: 1972, evenement: "Entrée en vigueur du deuxième Statut d'autonomie du Trentin-Haut-Adige."}
  - {annee: 2006, evenement: "La loi provinciale 3/2006 institue le Comun General de Fascia ; la loi 5/2006 organise l'école ladine de Fassa."}
  - {annee: 2008, evenement: "Loi provinciale 6/2008 sur la protection des minorités linguistiques locales."}
  - {annee: 2010, evenement: "Approbation du statut du Comun General de Fascia par la loi provinciale 1/2010."}
  - {annee: 2017, evenement: "La loi constitutionnelle 1/2017 inscrit le Comun General de Fascia à l'art. 102 du Statut."}
  - {annee: 2025, evenement: "Élection du Procurador et du Consei General (4 mai)."}
fiabilite:
  verifie: ["Statut, art. 15, 48, 92 et 102 (traduction anglaise publiée par la province de Bolzano) ; art. 48, al. 3 et art. 102, al. 3 dans le texte italien consolidé après la réforme de 2026.", "Loi constitutionnelle 1/2017, art. 8 (texte consolidé du Statut, note sous l'art. 102).", "Loi provinciale 3/2006, art. 19, al. 9 (avis obligatoires et intesa).", "Loi provinciale 3/2006, art. 19 ; loi provinciale 1/2010, statut, art. 10, 17, 18 et 22 ; loi provinciale 6/2008, art. 3, 8, 9, 16, 18, 24, 26 et 29 ; loi provinciale 5/2006, art. 46 à 49 (Code provincial du Conseil provincial de Trente).", "Population et surface (ISPAT, document publié par le Comun General).", "Six communes depuis la fusion de Pozza di Fassa et Vigo di Fassa en San Giovanni di Fassa – Sèn Jan (province de Trente)."]
