resume: >-
  Les Ladins du val de Fassa forment la partie trentine de la communauté ladine des Dolomites. Le Statut d'autonomie du Trentin-Haut-Adige réserve un siège du Conseil provincial de Trente aux communes du val (art. 48). Depuis la loi provinciale 3/2006, ces communes forment le Comun General de Fascia, collectivité dotée d'un statut propre (loi provinciale 1/2010), d'un Procurador (président) et d'un Consei General (assemblée) élus. La loi constitutionnelle 1/2017 a inscrit cette collectivité dans l'article 102 du Statut. Les Ladins des vallées de Gardena et de Badia relèvent de la province de Bolzano (fiche « Germanophones et Ladins du Tyrol du Sud ») ; la province de Trente a sa propre fiche (« Trentins »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Sixième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur l'Italie (adopté le 11 février 2026), § 29 et 37 : le recensement de la province autonome de Trente comporte une question facultative sur l'appartenance aux groupes parlant le mochène, le cimbre ou le ladin.", annee: 2026, source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-fr/48802bdf5f"}
