resume: >-
  Les tribunaux de village (Village Courts) sont des juridictions de proximité que le ministre de la Justice établit, par avis au Journal officiel, pour une zone déterminée (Village Courts Act 1989, article 4). Leurs magistrats, au moins trois par tribunal, sont nommés par le ministre sur une liste que le chef du Secrétariat des tribunaux de village établit après consultation du gouvernement local (articles 16 et 17) ; ils représentent autant que possible « les groupements traditionnels de population » de la zone (article 17). Leur fonction première est d'assurer la paix dans la zone par la médiation (article 52), et ils appliquent la coutume du lieu même lorsqu'elle s'écarte d'une loi (article 57). Les premiers tribunaux ont siégé en 1975 ; le Secrétariat des tribunaux de village et de la médiation foncière, au ministère de la Justice, coordonne le système. Les groupes fonciers coutumiers font l'objet de la fiche « Terres coutumières de Papouasie-Nouvelle-Guinée ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination à l'égard des femmes, observations finales sur la Papouasie-Nouvelle-Guinée (CEDAW/C/PNG/CO/3, paragraphes 17, 18, 29 et 33) : le Comité relève que le droit coutumier est le principal droit appliqué par les tribunaux de village, demande que leurs décisions respectent l'égalité et la non-discrimination, et note la faible présence des femmes parmi leurs membres.", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/PNG/CO/3&l=en&t=pdf"}
base_nationale:
  - {instrument: "Village Courts Act 1989 (loi n° 37 de 1989 sur les tribunaux de village), qui abroge la loi de 1973 (chapitre 44)", nature: "loi", annee: 1989, source: "https://faolex.fao.org/docs/pdf/png65549.pdf"}
  - {instrument: "Village Courts Regulation 1974 (règlement sur les tribunaux de village : conditions de service des magistrats, infractions prévues, registres de médiation)", nature: "loi", annee: 1974, source: "https://faolex.fao.org/docs/pdf/png65550.pdf"}
  - {instrument: "Organic Law on Provincial Governments and Local-level Governments (loi organique sur les gouvernements provinciaux et locaux), article 47 : une loi provinciale peut organiser des tribunaux de village, avec au moins la compétence prévue par la loi de 1989", nature: "loi_organique", annee: 1995, source: "https://faolex.fao.org/docs/pdf/png147709.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "Le tribunal de village applique la coutume pertinente déterminée selon les articles 2, 3 et 7 du Customs (Recognition) Act 1963 (loi sur la reconnaissance de la coutume), y compris lorsqu'elle est contraire à une loi (Village Courts Act 1989, article 57, alinéas 1 et 2). Limites : la coutume reconnue n'est pas édictée par une institution de la communauté ; un gouvernement local peut déclarer par voie de règlement ce qu'est la coutume, et cette déclaration s'impose au tribunal (article 57, alinéa 3) ; le tribunal reste lié par la Constitution et par la loi de 1989 (article 58).", source: "https://faolex.fao.org/docs/pdf/png65549.pdf"}
  justice_propre: {valeur: "partiel", note: "Tribunal établi pour une zone (article 4), compétent pour les litiges nés dans la zone ou entre ses habitants (article 36), tenu de tenter d'abord la médiation (articles 52 et 53), sans règles techniques de preuve (article 59) ; magistrats représentatifs, autant que possible, des groupements traditionnels de population de la zone (article 17, alinéa 2). Limites : amendes plafonnées à 200 kina (article 42) et réparations à 1 000 kina sauf en matière de prix de la fiancée (bride price, versement de la famille du marié à celle de l'épouse), de garde d'enfants ou de décès (articles 45 et 46) ; pas de compétence sur la propriété des terres, sauf ordonnances provisoires d'usage dans l'attente du tribunal foncier (articles 43 et 48) ; création, suspension et suppression des tribunaux par le ministre (articles 4 et 5), nomination et révocation des magistrats par le ministre (articles 17 et 20) ; appel et réexamen devant un magistrat de l'ordre judiciaire, assisté de magistrats de village qui le conseillent sur la coutume (articles 86 à 92).", source: "https://faolex.fao.org/docs/pdf/png65549.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
