effectivite: {valeur: "partielle", note: "Selon le rapport annuel 2014 du secteur Droit et Justice cité par l'évaluation de mars 2016, 1 525 tribunaux de village étaient publiés au Journal officiel. En 2010, le Comité pour l'élimination de la discrimination à l'égard des femmes relève que le droit coutumier qu'ils appliquent entraîne une discrimination persistante envers les femmes, que des excuses traditionnelles y servent de règlement à des violences, et que les femmes y sont peu représentées (CEDAW/C/PNG/CO/3, paragraphes 17, 29 et 33).", source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/PNG/CO/3&l=en&t=pdf"}
chronologie:
  - {annee: 1973, evenement: "Adoption de la première loi sur les tribunaux de village."}
  - {annee: 1974, evenement: "Règlement sur les tribunaux de village."}
  - {annee: 1975, evenement: "Les premiers tribunaux de village commencent à siéger."}
  - {annee: 1985, evenement: "856 tribunaux de village et 7 674 membres en août, selon la Commission australienne de réforme du droit."}
  - {annee: 1989, evenement: "Loi n° 37 de 1989 sur les tribunaux de village, qui abroge la loi de 1973 et sa modification de 1986."}
  - {annee: 1995, evenement: "La loi organique sur les gouvernements provinciaux et locaux permet aux provinces d'organiser des tribunaux de village (article 47)."}
  - {annee: 2010, evenement: "Le Comité pour l'élimination de la discrimination à l'égard des femmes demande que les décisions des tribunaux de village respectent l'égalité et la non-discrimination."}
  - {annee: 2014, evenement: "1 525 tribunaux de village publiés au Journal officiel, selon le rapport annuel du secteur Droit et Justice."}
fiabilite:
  verifie:
    - "Articles 2 à 6, 16 à 18, 20, 36, 39 à 48, 52 à 59 et 86 à 92 du Village Courts Act 1989 : texte de la loi sur FAOLEX (version de l'Office du conseiller législatif)."
    - "Article 47 de la loi organique sur les gouvernements provinciaux et locaux : texte sur FAOLEX."
    - "Paragraphes 17, 18, 29 et 33 de CEDAW/C/PNG/CO/3 (30 juillet 2010) : texte de l'ONU."
    - "1 525 tribunaux publiés au Journal officiel (source : rapport annuel 2014 du secteur Droit et Justice, page 82) : évaluation de la formation des membres des tribunaux de village, mars 2016, publiée par le ministère australien des Affaires étrangères."
    - "Loi de 1973, premiers tribunaux en 1975, 856 tribunaux et 7 674 membres en août 1985 : rapport n° 31 de la Commission australienne de réforme du droit."
  non_confirme:
    - "La page du Secrétariat des tribunaux de village et de la médiation foncière indique « 14,496 Village Courts », couvrant environ 90 % du pays, avec plus de 15 000 membres dont 900 femmes, et 4 à 5 magistrats « choisis par la communauté » par tribunal ; le nombre de tribunaux ne concorde pas avec le nombre de membres ni avec le chiffre de 2014 et n'est pas repris ; date de la page inconnue."
    - "Modifications de la loi après 1995 et éventuelle révision des plafonds d'amende et de réparation : non vérifiées ; le texte consulté est une reprise non datée de l'Office du conseiller législatif."
    - "Lois provinciales prises en application de l'article 47 de la loi organique : aucune lue."
    - "Liste officielle des tribunaux par province : aucune source ouverte ; pas de tableau des sites."
