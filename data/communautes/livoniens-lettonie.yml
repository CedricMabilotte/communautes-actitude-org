resume: >-
  Les Livoniens sont un peuple finnique de la côte nord de la Courlande, en Lettonie.
  La loi sur la langue officielle (1999) charge l'État d'assurer le maintien, la protection et le développement du live comme langue de la population autochtone,
  et impose l'usage du live, à côté du letton, pour les noms de lieux, d'institutions et d'événements de la Côte live.
  La loi sur les terres historiques lettones (2021) rappelle la responsabilité de l'État et des communes envers l'identité, la culture et la langue lives.
  Une organisation live peut attester l'origine d'une personne qui demande l'inscription « livonienne » au registre de la population.
  Aucune source trouvée n'établit d'institution propre reconnue par l'État ni de droit collectif sur les terres.
