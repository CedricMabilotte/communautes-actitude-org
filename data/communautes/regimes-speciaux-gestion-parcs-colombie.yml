effectivite: {valeur: "partielle", note: "Les autorités traditionnelles des communautés autochtones de la commune de Taraira (Vaupés), qui disaient représenter la moitié du resguardo, ont contesté en justice la création du parc Yaigojé Apaporis, faute de consentement ; l'arrêt T-384A de 2014 a refusé leur demande, validé le parc et ordonné la suspension immédiate de toute activité d'exploration et d'exploitation minière dans la zone.", source: "https://www.corteconstitucional.gov.co/relatoria/2014/T-384A-14.htm"}
chronologie:
  - {annee: 1974, evenement: "Le décret-loi 2811 crée le système des parcs nationaux et prévoit pour ces aires un régime spécial de gestion."}
  - {annee: 1977, evenement: "Le décret 622 (art. 7) déclare compatibles parc national et territoire autochtone, sous réserve d'un régime spécial."}
  - {annee: 1987, evenement: "Création du parc national naturel Cahuinarí (résolution exécutive 190), habité par les peuples bora et miraña."}
  - {annee: 2009, evenement: "Consultation préalable (24-25 juillet) puis résolution 2079 (27 octobre) : création du parc Yaigojé Apaporis sur tout le resguardo du même nom."}
  - {annee: 2010, evenement: "Adoption du REM du parc Cahuinarí."}
  - {annee: 2014, evenement: "Arrêt T-384A de la Cour constitutionnelle : validation du parc Yaigojé Apaporis et définition du REM."}
  - {annee: 2015, evenement: "Le décret 1076 compile l'art. 7 du décret 622 de 1977 sous l'art. 2.2.2.1.9.2."}
  - {annee: 2018, evenement: "Document du REM de Yaigojé Apaporis, daté du 29 juillet."}
  - {annee: 2019, evenement: "Adoption du REM du parc Macuira avec les autorités wayuu."}
  - {annee: 2025, evenement: "Signature du REM « Zôrârâ kirinchadê » du parc Las Orquídeas avec les Embera Eyabida des resguardos Valle de Pérdidas et Chaquenodá ; travaux du REM d'El Itilla (Chiribiquete)."}
fiabilite:
  verifie: ["Art. 327 à 336 du décret-loi 2811 de 1974 (Secrétariat du Sénat) : l'art. 328 vise un « régimen especial de manejo » ; l'art. 334 confie à l'administration la délimitation et la réglementation des parcs.", "Texte de l'art. 7 du décret 622 de 1977, cité intégralement dans l'arrêt T-384A de 2014.", "Résolution 2079 du 27 octobre 2009 (1 056 230 ha) et dispositif de l'arrêt T-384A de 2014 (protection refusée, suspension des activités minières ordonnée).", "Document du REM de Yaigojé Apaporis (daté du 29 juillet 2018) : accords 1 à 13 de la consultation préalable de 2009, sept peuples, ACIYA et ACIYAVA, renvoi à l'art. 2.2.2.1.9.2 du décret 1076 de 2015.", "Pages officielles de Parques Nacionales Naturales attestant un REM à Cahuinarí (2010), Los Katíos (communauté Juin Phubuur), Nevado del Huila (resguardo de Gaitania), Macuira (2019), Utría et Las Orquídeas (2025), et un REM en préparation à El Itilla (juillet 2025).", "Bilan de Parques Nacionales Naturales (12 février 2022) : deux REM signés en Amazonie (Yaigojé Apaporis et Cahuinarí) ; neuf des onze aires protégées amazoniennes recouvrent 28 resguardos. Le document du REM de Yaigojé Apaporis est daté de 2018, neuf ans après la création du parc.", "Ratification de la Convention 169 de l'OIT par la Colombie le 7 août 1991 (Collection des traités de l'ONU)."]
  non_confirme: ["Le nombre total de REM signés dans le pays n'a pas été trouvé ; les sept cités sont ceux attestés sur les pages consultées, la liste n'est pas exhaustive.", "Le texte du décret 1076 de 2015 n'a pas pu être lu sur le site du Département administratif de la fonction publique (certificat refusé) ; l'art. 2.2.2.1.9.2 est connu par la citation qu'en fait le REM de Yaigojé Apaporis.", "La date de signature et le contenu des REM de Los Katíos, Nevado del Huila et Utría n'ont pas été lus ; les droits notés reposent sur les cas de Yaigojé Apaporis et de Cahuinarí.", "L'arrêt T-384A de 2014 note que l'art. 7 du décret 622 de 1977, rédigé pour les « reservas indígenas », pourrait avoir perdu sa force depuis la conversion de ces réserves en resguardos (art. 11 du décret 2001 de 1998, cité par la Cour).", "La surface du parc Yaigojé Apaporis varie selon les sources : 1 056 230 ha (résolution 2079 de 2009), 1 054 300,45 ha et 1 056 549 ha (page du parc).", "Aucun document de la CDB ni du registre ICCA visant ce régime n'a été trouvé.", "Nombre de resguardos en chevauchement : 58 selon le groupe de planification de la gestion de Parques Nacionales Naturales (2022), 65 selon la page de Parques Nacionales Naturales préparée pour la COP16 (2024), qui compte les aires administrées par l'organisme et aussi 31 aires protégées dotées d'accords avec des communautés ethniques.", "Population : non trouvée pour les resguardos en chevauchement avec les parcs.", "Surface cumulée des chevauchements entre parcs et resguardos : non trouvée.", "Nombre de villages : non trouvé."]
