resume: >-
  Fiche agrégée : elle couvre les peuples autochtones dont le resguardo (terre collective titrée) est recouvert par un parc national naturel et qui ont conclu avec l'organisme Parques Nacionales Naturales de Colombia un régime spécial de gestion (Régimen Especial de Manejo, REM). Le décret 622 de 1977 (art. 7), repris dans le décret 1076 de 2015 (art. 2.2.2.1.9.2), dispose qu'un parc peut inclure un territoire occupé par des autochtones à condition d'établir un régime spécial qui respecte la permanence de la communauté et son droit d'exploiter les ressources naturelles renouvelables. Le REM est un ensemble de règles de planification, d'exécution et de suivi convenues entre l'autorité environnementale et l'autorité autochtone, au titre de la « coordinación de la función pública de la conservación », sans délégation des compétences de chacune. Le parc Yaigojé Apaporis (résolution 2079 de 2009), qui couvre tout le resguardo du même nom, en donne l'exemple : sept peuples, deux associations d'autorités (ACIYA et ACIYAVA), désaccords réglés par consensus. Des REM sont aussi attestés à Cahuinarí (2010), Macuira (2019), Las Orquídeas (2025), Los Katíos, Nevado del Huila et Utría ; celui d'El Itilla (Chiribiquete) est en préparation en juillet 2025.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "La Colombie ratifie la Convention 169 de l'OIT le 7 août 1991 ; le REM de Yaigojé Apaporis cite cette convention parmi ses fondements.", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
base_nationale:
  - {instrument: "Décret-loi 2811 de 1974 (Code national des ressources naturelles renouvelables), art. 327 à 336 : système des parcs nationaux ; l'art. 328 prévoit pour ces aires un « régimen especial de manejo » et l'art. 334 confie à l'administration la délimitation et la réglementation du système", nature: "loi", annee: 1974, source: "http://www.secretariasenado.gov.co/senado/basedoc/decreto_2811_1974_pr008.html"}
  - {instrument: "Décret 622 de 1977, art. 7 : un parc national peut inclure un territoire occupé par des autochtones ; un régime spécial établi en leur faveur respecte la permanence de la communauté et son droit d'exploiter les ressources naturelles renouvelables", nature: "loi", annee: 1977, source: "https://www.corteconstitucional.gov.co/relatoria/2014/T-384A-14.htm"}
  - {instrument: "Décret 1076 de 2015 (« Decreto Único Reglamentario » du secteur de l'environnement, compilation des décrets), art. 2.2.2.1.9.2 (reprise de l'art. 7 du décret 622 de 1977)", nature: "loi", annee: 2015, source: "https://www.parquesnacionales.gov.co/wp-content/uploads/2020/10/rem-yaigojeapaporis-oct2018-2.pdf"}
  - {instrument: "Résolution 2079 du 27 octobre 2009 du ministère de l'Environnement : création du parc national naturel Yaigojé Apaporis et obligation d'y construire un REM", nature: "loi", annee: 2009, source: "https://www.corteconstitucional.gov.co/relatoria/2014/T-384A-14.htm"}
  - {instrument: "Cour constitutionnelle, arrêt T-384A de 2014 : validation de la création du parc Yaigojé Apaporis et définition du REM", nature: "jurisprudence", annee: 2014, source: "https://www.corteconstitucional.gov.co/relatoria/2014/T-384A-14.htm"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le REM reconnaît le caractère public et spécial des autorités autochtones (décret 1088 de 1993) et fixe des instances de décision conjointes (comité directif, comité technique à Yaigojé Apaporis) ; il n'emporte pas de délégation des compétences environnementales, qui restent coordonnées avec Parques Nacionales Naturales.", source: "https://www.parquesnacionales.gov.co/wp-content/uploads/2020/10/rem-yaigojeapaporis-oct2018-2.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Dans le REM de Yaigojé Apaporis (2018), Parques Nacionales Naturales « reconoce como fuente de derecho los usos, costumbres y/o sistemas regulatorios propios » ; à Cahuinarí, le REM de 2010 « valida los sistemas regulatorios propios como fuente legítima de ordenamiento del área protegida ».", source: "https://www.parquesnacionales.gov.co/nuestros-parques/pnn-cahuinari/"}
  justice_propre: {valeur: "partiel", note: "Le REM de Cahuinarí (2010) « reconoce la jurisdicción especial indígena » (juridiction propre prévue par l'art. 246 de la Constitution) dans l'aire protégée ; aucune mention équivalente n'a été vérifiée pour les autres REM.", source: "https://www.parquesnacionales.gov.co/nuestros-parques/pnn-cahuinari/"}
  terres: {valeur: "partiel", note: "À Yaigojé Apaporis, l'accord 4 de la consultation préalable de 2009 dispose que la propriété reste aux autochtones sous forme de resguardo et que le parc est inscrit au registre foncier du resguardo comme « afectación de carácter ambiental especial » (charge environnementale spéciale) ; l'usage du sol est limité aux usages compatibles avec les objectifs du parc.", source: "https://www.parquesnacionales.gov.co/wp-content/uploads/2020/10/rem-yaigojeapaporis-oct2018-2.pdf"}
  ressources: {valeur: "partiel", note: "L'art. 2.2.2.1.9.2 du décret 1076 de 2015 (reprise de l'art. 7 du décret 622 de 1977) garantit le droit à l'exploitation économique des ressources naturelles renouvelables selon des techniques compatibles avec les objectifs du parc ; à Yaigojé Apaporis, les cultures, la cueillette, la pêche et la chasse sont respectées selon les règles culturelles de chaque peuple (accord 8 de 2009) ; les activités agricoles, industrielles, minières et pétrolières restent interdites dans le parc (décret 1076 de 2015).", source: "https://www.parquesnacionales.gov.co/wp-content/uploads/2020/10/rem-yaigojeapaporis-oct2018-2.pdf"}
  consentement: {valeur: "partiel", note: "La création du parc Yaigojé Apaporis a fait l'objet d'une consultation préalable protocolisée les 24 et 25 juillet 2009 ; l'accord 9 dispose : « Los desacuerdos se resolverán por consenso en todos los casos. No habrá decisiones unilaterales » ; la portée de cette règle dans les autres REM n'a pas été vérifiée.", source: "https://www.parquesnacionales.gov.co/wp-content/uploads/2020/10/rem-yaigojeapaporis-oct2018-2.pdf"}
