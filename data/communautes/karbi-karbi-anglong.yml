resume: >-
  Les Karbi vivent sur les plateaux du centre de l'Assam. Leur territoire relève de la Sixième annexe de la Constitution : un conseil de district autonome y existe depuis le 23 juin 1952 ; le district des Mikir Hills, séparé de celui du North Cachar en 1970, prend le nom de Karbi Anglong en 1976, et le conseil celui de Karbi Anglong Autonomous Council en 1995. L'amendement de 1995 ajoute quinze domaines législatifs au conseil, dont l'éducation et la cession des terres. L'accord du 4 septembre 2021 entre le gouvernement indien, l'Assam et des groupes armés karbi prévoit une dévolution supplémentaire de pouvoirs ; un conseil distinct pour les Karbi des plaines, hors du territoire du conseil, est constitué en 2026.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19 (5 mai 2007), § 10 : recommande de reconnaître officiellement les peuples tribaux comme groupes distincts ayant droit à une protection spéciale et de préciser les critères d'inscription sur la liste des Scheduled Tribes ; § 12 et 19 sur les États du nord-est ; les Karbi et l'Assam ne sont pas nommés", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, art. 244 (2) et Sixième annexe", nature: "constitution", annee: 1950, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Loi de 1995 portant modification de la Sixième annexe (loi 42 de 1995), paragraphe 3A", nature: "constitution", annee: 1995, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Accord de Karbi Anglong (gouvernement de l'Inde, gouvernement de l'Assam, groupes armés karbi)", nature: "accord_paix", annee: 2021, source: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=1752066&reg=48&lang=2"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, mandat de cinq ans, Sixième annexe de la Constitution, paragraphe 2 (1) et (6A) ; nommé Karbi Anglong Autonomous Council par l'amendement de 1995 (loi 42 de 1995).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3, et sur quinze domaines supplémentaires (industrie, éducation primaire et secondaire, agriculture, eau, santé, cession des terres…), paragraphe 3A inséré en 1995 ; ses lois requièrent l'assentiment du gouverneur, paragraphe 3 (3), et celles qui touchent la liste concurrente sont réservées au président, paragraphe 3A (2).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Le conseil peut créer des conseils ou tribunaux de village pour les litiges entre membres des Scheduled Tribes, à l'exclusion des autres tribunaux de l'État, et une juridiction d'appel ; seuls la Haute Cour et la Cour suprême restent compétentes, Sixième annexe, paragraphe 4.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Aucune loi de l'Assemblée de l'Assam sur les matières des paragraphes 3 ou 3A ne s'applique au district autonome sans notification du conseil, qui peut l'adapter, Sixième annexe, paragraphe 12 (1) (a), modifié en 1995 ; les lois du Parlement restent applicables sauf décision du président ou du gouverneur.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  langue: {valeur: "partiel", note: "Ordre du gouverneur de l'Assam n° PLB.560215/110 du 19 avril 2025 : le karbi est employé avec l'anglais pour les usages officiels dans les districts de Karbi Anglong et de Karbi Anglong-Ouest ; en juillet 2025, sa notification comme langue officielle associée au titre de la loi de 1960 sur la langue officielle restait en attente d'une proposition du conseil.", source: "https://assamtribune.com/assam/assam-clears-use-of-karbi-language-in-government-work-across-karbi-anglong-1580381"}
  education: {valeur: "reconnu", note: "Compétence législative sur l'enseignement primaire et secondaire, Sixième annexe, paragraphe 3A (1) (d) inséré en 1995 ; création et gestion d'écoles primaires et choix de la langue d'enseignement, paragraphe 6 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des non-tribaux, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "partiel", note: "Sièges réservés aux districts autonomes à l'Assemblée de l'Assam, en proportion au moins égale à leur population, dans des circonscriptions limitées au district où seuls les membres des tribus répertoriées des districts autonomes sont éligibles, Constitution, art. 332 (2), (4), (5) et (6) ; les sièges sont garantis au district et non aux Karbi en tant que tels.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le conseil, renouvelé en juin 2022 (26 sièges élus), administre les deux districts. En février 2024, il notifie l'expulsion des occupants des réserves de pâturage (Professional et Village Grazing Reserves) ; un recours devant la Haute Cour de Gauhati suspend la mesure. Les 22 et 23 décembre 2025, des manifestations pour ces expulsions à Kheroni (Karbi Anglong-Ouest) font deux morts. Le 30 décembre 2025, le conseil annonce de nouveaux avis d'expulsion, hors 339 familles protégées par une ordonnance de la Haute Cour. En juillet 2025, le président de l'exécutif du conseil demande l'application des engagements de l'accord de 2021.", source: "https://indianexpress.com/article/explained/assam-karbi-anglong-violence-trigger-background-10436264/"}
chronologie:
  - {annee: 1952, evenement: "Création du conseil de district le 23 juin, dans le district uni des Mikir and North Cachar Hills."}
  - {annee: 1970, evenement: "Séparation des districts des Mikir Hills et du North Cachar Hills."}
  - {annee: 1976, evenement: "Le district des Mikir Hills prend le nom de Karbi Anglong le 14 octobre."}
  - {annee: 1995, evenement: "Paragraphe 3A : quinze domaines législatifs supplémentaires ; le conseil devient Karbi Anglong Autonomous Council."}
  - {annee: 2015, evenement: "Division en deux districts administratifs (Karbi Anglong et Karbi Anglong-Ouest) le 15 août, sous le même conseil."}
  - {annee: 2021, evenement: "Accord de Karbi Anglong le 4 septembre."}
  - {annee: 2022, evenement: "Élection du conseil en juin : 26 sièges élus."}
  - {annee: 2024, evenement: "Avis d'expulsion des occupants des réserves de pâturage, suspendus par un recours devant la Haute Cour de Gauhati."}
  - {annee: 2025, evenement: "Ordre du gouverneur du 19 avril sur l'usage officiel du karbi ; loi du 28 novembre créant un conseil pour les Karbi vivant hors du territoire du conseil ; violences à Kheroni les 22 et 23 décembre."}
  - {annee: 2026, evenement: "Constitution du Karbi Welfare Autonomous Council (26 membres) pour les Karbi des plaines, prévu par la clause 3.6 de l'accord de 2021 ; le conseil enjoint en janvier à onze services de l'État de quitter une réserve de pâturage à Kheroni."}
