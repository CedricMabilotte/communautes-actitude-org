    - "Adoption, depuis 2019, de la loi sur les zones de protection communautaire et les biens immeubles communautaires prévue à l'art. 28 de la loi n° 13/2017 : non vérifiée."
    - "Surface des terres de Camenassa, signature de l'acte de transmission et suite donnée au projet Suai Supply Base non vérifiées sur une source primaire."
    - "Classification effective de zones de protection communautaire : aucune trouvée."
    - "Population concernée : non trouvée."
    - "Nombre de villages : non trouvé."
