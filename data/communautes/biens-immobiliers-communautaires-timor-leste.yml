resume: >-
  La loi n° 10/2011 du 14 septembre 2011, qui approuve le Code civil, définit la propriété communautaire comme celle qui relève de l'usage commun d'une communauté selon ses usages et coutumes (art. 4). La loi foncière n° 13/2017 du 5 juin 2017 précise que les biens immeubles (terres et constructions) reconnus par une communauté locale comme étant d'usage commun et partagé, par un groupe d'individus ou de familles organisés selon les usages locaux, sont la propriété de cette communauté, inaliénables et insaisissables (art. 27). Elle crée aussi des zones de protection communautaire (habitat, cultures et jachères, forêts, sites sacrés, pâturages, sources) et renvoie le régime détaillé des deux figures à une loi (art. 28) ; en 2019, selon la Rapporteuse spéciale des Nations unies, la plupart des lois complémentaires de la loi foncière n'étaient pas rédigées. Le décret-loi n° 36/2014 du 17 décembre 2014 a appliqué la notion aux terres de la communauté de Camenassa, représentée par ses chefs communautaires traditionnels, pour constituer sur elles un droit de propriété de 150 ans transmis à l'État, contre des actions préférentielles représentant 10 % du capital de la société du projet Suai Supply Base. Les sucos, organes administratifs de base, font l'objet de la fiche « Sucos du Timor-Leste ».
