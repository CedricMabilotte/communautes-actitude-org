effectivite: {valeur: "partielle", note: "En 2019, la Rapporteuse spéciale des Nations unies relève que la plupart des lois complémentaires de la loi foncière n'ont pas été rédigées, que très peu de titres communautaires ont été enregistrés dans le Système national de cadastre lancé en 2014 et que, selon les informations qu'elle a reçues, la plupart des terres enregistrées l'ont été en titres privés à un seul propriétaire (A/HRC/42/37/Add.2, § 42 à 44). Le seul cas désigné par un texte, Camenassa, est un transfert de terres communautaires à l'État.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/42/37/Add.2&l=en&t=pdf"}
chronologie:
  - {annee: 2011, evenement: "Loi n° 10/2011 approuvant le Code civil : définition de la propriété communautaire (art. 4)."}
  - {annee: 2014, evenement: "Lancement du Système national de cadastre ; décret-loi n° 36/2014 du 17 décembre 2014 sur les terres de la communauté de Camenassa (projet Suai Supply Base)."}
  - {annee: 2017, evenement: "Loi foncière n° 13/2017 du 5 juin 2017 : biens immeubles communautaires et zones de protection communautaire."}
  - {annee: 2019, evenement: "Visite de la Rapporteuse spéciale sur les droits des peuples autochtones (8 au 16 avril) ; rapport A/HRC/42/37/Add.2."}
fiabilite:
  verifie:
    - "Loi n° 13/2017 lue au Jornal da República : art. 8 (eaux communautaires exclues du domaine public), 9(2), 23 à 28 et 34."
    - "Décret-loi n° 36/2014 du 17 décembre 2014 (promulgué le 24 novembre 2014) lu sur le site du Jornal da República : préambule (consultations publiques, négociation), art. 1, 3 (biens immeubles communautaires de Camenassa, représentation par les chefs communautaires traditionnels, renvoi à l'art. 4 de la loi n° 10/2011), 5 (droit de propriété de 150 ans transmis à l'État, accord collectif de la communauté) et 6 (actions préférentielles, 10 % du capital)."
    - "Loi n° 10/2011, art. 4 (propriété communautaire) et Code civil, art. 1305 (eaux communautaires soumises aux usages) : texte lu sur le site du Jornal da República."
    - "A/HRC/42/37/Add.2, § 40 à 49 et 85 à 87, lus en anglais."
    - "Minority Rights Group : la loi de 2017 crée les figures de « zones de protection communautaire » et de « propriété communautaire » sans reconnaître de statut aux systèmes coutumiers ni aux gestionnaires coutumiers des terres."
  non_confirme:
