reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale sur les droits des peuples autochtones après sa visite du 8 au 16 avril 2019 (A/HRC/42/37/Add.2), § 40 à 46 et 85 à 87 : la plupart des terres sont des terres communautaires ; la plupart des lois complémentaires de la loi foncière n° 13/2017 n'ont pas été rédigées ; très peu de titres communautaires ont été enregistrés dans le Système national de cadastre ; recommande de garantir l'enregistrement des revendications foncières communautaires.", annee: 2019, source: "https://documents.un.org/api/symbol/access?s=A/HRC/42/37/Add.2&l=en&t=pdf"}
base_nationale:
  - {instrument: "Loi n° 10/2011 du 14 septembre 2011 approuvant le Code civil, art. 4 (propriété communautaire)", nature: "loi", annee: 2011, source: "https://www.mj.gov.tl/jornal/?q=node/803"}
  - {instrument: "Décret-loi n° 36/2014 du 17 décembre 2014, transmission des droits sur les biens immeubles dans le projet Suai Supply Base (art. 3 : biens immeubles communautaires de la communauté de Camenassa)", nature: "loi", annee: 2014, source: "https://www.mj.gov.tl/jornal/?q=node/6514"}
  - {instrument: "Loi n° 13/2017 du 5 juin 2017, régime spécial de définition de la propriété des biens immeubles (art. 23 à 28 : zones de protection communautaire et biens immeubles communautaires)", nature: "loi", annee: 2017, source: "https://www.mj.gov.tl/jornal/public/docs/2017/serie_1/SERIE_I_NO_21.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Décret-loi n° 36/2014, art. 3(2) : la communauté de Camenassa est représentée devant l'État et les tiers par ses chefs communautaires traditionnels, investis selon ses usages et coutumes ; aucune disposition générale de la loi n° 13/2017 ne désigne l'organe qui représente une communauté propriétaire.", source: "https://www.mj.gov.tl/jornal/?q=node/6514"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Loi n° 13/2017, art. 27 : les biens immeubles reconnus par la communauté locale comme d'usage commun et partagé selon les usages locaux sont sa propriété, inaliénables et insaisissables ; la démarcation et le régime détaillé sont renvoyés à des textes ultérieurs (art. 27(3) et 28) ; en cas de litige, cette propriété est traitée comme un droit informel de propriété (art. 27(4)). Loi n° 10/2011, art. 4.", source: "https://www.mj.gov.tl/jornal/public/docs/2017/serie_1/SERIE_I_NO_21.pdf"}
  ressources: {valeur: "partiel", note: "Loi n° 13/2017, art. 23 et 25(2) : les zones de protection communautaire couvrent forêts, pâturages, sources et ressources naturelles d'usage partagé ; l'État veille à ce que leur usage économique par des tiers bénéficie à l'ensemble de la communauté locale et respecte son accès aux ressources naturelles ; la classification de ces zones dépend de la loi prévue à l'art. 28. Art. 8(3)(e) : les eaux communautaires au sens du Code civil sont exclues du domaine public de l'État ; le Code civil (art. 1305) soumet ces eaux aux usages.", source: "https://www.mj.gov.tl/jornal/public/docs/2017/serie_1/SERIE_I_NO_21.pdf"}
  consentement: {valeur: "partiel", note: "Loi n° 13/2017, art. 25(3) et 34 : l'usage économique par des tiers de biens situés en zone de protection communautaire et le relevé cadastral de ces zones sont précédés d'une consultation de la communauté ; consultation, pas consentement. Le décret-loi n° 36/2014 (préambule et art. 5(1)) fait suite à des consultations publiques et à une négociation avec la communauté de Camenassa, dont l'accord collectif conditionne la transmission.", source: "https://www.mj.gov.tl/jornal/public/docs/2017/serie_1/SERIE_I_NO_21.pdf"}
