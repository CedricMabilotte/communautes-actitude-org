resume: >-
  Les Sorabes, appelés Wendes dans le Brandebourg, sont une des quatre minorités nationales reconnues par l'Allemagne. Une note au protocole du traité d'unification de 1990 garantit la préservation de leur culture. La loi saxonne de 1999 et la loi brandebourgeoise de 1994 délimitent une aire d'implantation où le sorabe peut être employé devant les autorités avec le même effet juridique que l'allemand. Chaque Land a un conseil consultatif pour les affaires sorabes de cinq membres, élu au suffrage direct des Sorabes/Wendes dans le Brandebourg et par le Landtag en Saxe. La Fondation pour le peuple sorabe, financée par l'État fédéral, la Saxe et le Brandebourg, soutient la langue et la culture.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif sur l'Allemagne, adopté le 3 février 2022 : les Sorabes sont une des minorités couvertes par la Convention-cadre ; § 95 sur la Fondation pour le peuple sorabe, financée par accords pluriannuels à hauteur de 18,6 millions d'euros par an pendant la période de suivi, dont six des quinze membres du conseil de fondation représentent les Sorabes.", annee: 2022, source: "https://rm.coe.int/5th-op-germany-en/1680a6e008"}
reconnaissance_onu: []
base_nationale:
  - {instrument: "Traité d'unification (1990), note au protocole n° 14 relative à l'art. 35", nature: "traite", annee: 1990, source: "https://www.minderheitensekretariat.de/wp-content/uploads/2022/08/rechtsvorschriften.pdf"}
  - {instrument: "Loi sur les droits des Sorabes/Wendes dans le Land de Brandebourg (Sorben/Wenden-Gesetz, SWG), 7 juillet 1994, modifiée le 11 février 2014 et le 5 mars 2024", nature: "loi", annee: 1994, source: "https://bravors.brandenburg.de/gesetze/swg"}
  - {instrument: "Loi sur les droits des Sorabes dans l'État libre de Saxe (Sächsisches Sorbengesetz), 31 mars 1999, version en vigueur depuis le 1er janvier 2023", nature: "loi", annee: 1999, source: "https://www.revosax.sachsen.de/vorschrift/3019-Saechsisches-Sorbengesetz"}
  - {instrument: "Traité d'État entre le Brandebourg et la Saxe sur la création de la Fondation pour le peuple sorabe, 28 août 1998, et accords de financement avec l'État fédéral", nature: "traite", annee: 1998, source: "https://www.minderheitensekretariat.de/wp-content/uploads/2022/08/rechtsvorschriften.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Dans le Brandebourg, un conseil pour les affaires sorabes/wendes de cinq membres est élu pour chaque législature au suffrage libre, égal, secret et direct des Sorabes/Wendes électeurs du Land, scrutin organisé par les fédérations reconnues, SWG, § 5 ; en Saxe, le Landtag élit cinq membres sur proposition des associations sorabes et des communes de l'aire d'implantation, loi saxonne, § 6 ; les deux conseils sont consultatifs.", source: "https://bravors.brandenburg.de/gesetze/swg"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le Landtag et le gouvernement saxons doivent entendre le conseil pour les affaires sorabes sur toute question touchant les droits des Sorabes, loi saxonne, § 6 al. 2 ; dans le Brandebourg, les membres du conseil ont voix consultative dans les commissions du Landtag, SWG, § 5, et les fédérations reconnues peuvent attaquer en justice les mesures du Land ou des collectivités contraires à la loi (droit de recours collectif), SWG, § 4a.", source: "https://www.revosax.sachsen.de/vorschrift/3019-Saechsisches-Sorbengesetz"}
  langue: {valeur: "reconnu", note: "Dans l'aire d'implantation, les habitants peuvent employer le sorabe devant les autorités du Land avec les mêmes effets juridiques que l'allemand, loi saxonne, § 9 al. 1, et SWG, § 8 ; en Saxe, la règle s'applique aussi devant les tribunaux des arrondissements de Bautzen et de Görlitz, loi saxonne, § 9 al. 2.", source: "https://www.revosax.sachsen.de/vorschrift/3019-Saechsisches-Sorbengesetz"}
  education: {valeur: "partiel", note: "Les enfants et les jeunes de l'aire d'implantation peuvent apprendre le bas-sorabe si leurs parents le souhaitent ; l'histoire et la culture sorabes/wendes sont intégrées au travail éducatif des crèches et des écoles, SWG, § 10.", source: "https://bravors.brandenburg.de/gesetze/swg"}
  fiscalite: {valeur: "partiel", note: "La Fondation pour le peuple sorabe, établissement de droit public créé par le traité d'État de 1998, reçoit des subventions annuelles de la Saxe, du Brandebourg et de l'État fédéral ; le troisième accord de financement (2016-2020, reconduit d'année en année sauf dénonciation) fixe 18,6 millions d'euros par an, répartis pour 3/6 à l'État fédéral, 2/6 à la Saxe et 1/6 au Brandebourg ; aucun pouvoir fiscal.", source: "https://www.minderheitensekretariat.de/wp-content/uploads/2022/08/rechtsvorschriften.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Appartient au peuple sorabe quiconque s'en réclame ; cette déclaration est libre, ne peut être ni contestée ni vérifiée et ne peut entraîner aucun désavantage, loi saxonne, § 1.", source: "https://www.revosax.sachsen.de/vorschrift/3019-Saechsisches-Sorbengesetz"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2022 une amélioration des conditions juridiques et financières d'emploi du bas-sorabe devant les autorités du Brandebourg, une pénurie d'enseignants dans l'enseignement du sorabe, et note que le Brandebourg est le seul Land où les associations sorabes peuvent agir en justice.", source: "https://rm.coe.int/5th-op-germany-en/1680a6e008"}
chronologie:
  - {annee: 1990, evenement: "Traité d'unification, note au protocole n° 14 relative à l'art. 35 : liberté de se déclarer sorabe et garantie de la culture sorabe."}
  - {annee: 1994, evenement: "Loi brandebourgeoise sur les Sorabes/Wendes (7 juillet)."}
  - {annee: 1998, evenement: "Traité d'État entre le Brandebourg et la Saxe donnant la personnalité juridique à la Fondation pour le peuple sorabe (28 août)."}
  - {annee: 1999, evenement: "Loi saxonne sur les Sorabes (31 mars)."}
  - {annee: 2008, evenement: "Nouvelle annexe de la loi saxonne fixant les communes et parties de communes de l'aire d'implantation."}
  - {annee: 2014, evenement: "Loi du 11 février modifiant la loi brandebourgeoise ; l'annexe fixe les communes et parties de communes de l'aire d'implantation à cette date."}
  - {annee: 2022, evenement: "Cinquième avis du Comité consultatif de la Convention-cadre sur l'Allemagne (3 février)."}
