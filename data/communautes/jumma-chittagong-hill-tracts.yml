etats: ["Bangladesh"]
region: "asie"
coord: [22.6, 92.2]
type: "peuple_autochtone"
base: "territoriale"
types_secondaires: ["peuple_tribal"]
population: {valeur: 920217, annee: 2022, perimetre: "habitants des trois districts recensés comme non bengalis (49,94 % d'une population totale de 1 842 815), rapport préliminaire du recensement de 2022 du Bureau des statistiques du Bangladesh, chiffres repris par Parbatta News", source: "https://en.parbattanews.com/population-census-2022-a-cht-demographic-analysis/"}
lieux: {valeur: 3, unite: "districts (Rangamati, Khagrachari, Bandarban)", annee: 2011, source: "https://docs.un.org/fr/E/C.19/2011/6"}
surface_km2: {valeur: 13295, annee: null, perimetre: "superficie totale des trois districts de Rangamati, Khagrachari et Bandarban, selon le ministère des Affaires des Chittagong Hill Tracts ; année non indiquée", source: "https://mochta.gov.bd/pages/static-pages/694032a235ce18e1c055fb2a"}
