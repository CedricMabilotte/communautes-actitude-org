resume: >-
  Saint-Pierre-et-Miquelon est un archipel français de l'Atlantique Nord, situé au sud de l'île de Terre-Neuve (Canada). Département d'outre-mer en 1976, puis « collectivité territoriale de la République française » par la loi du 11 juin 1985, il est régi depuis la loi organique n° 2007-223 du 21 février 2007 par l'article 74 de la Constitution (collectivité d'outre-mer). Son conseil territorial de 19 membres fixe les règles en matière d'impôts, droits et taxes, de cadastre, de régime douanier et d'urbanisme, et la collectivité fixe la redevance due par les titulaires de concessions d'hydrocarbures dans la zone économique exclusive. Le sujet collectif est la population de l'archipel ; aucune désignation ethnique n'est retenue par le droit. À l'égard de l'Union européenne, l'archipel est un pays et territoire d'outre-mer (PTOM, territoire associé sans en faire partie).
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "Décision (UE) 2021/1764 du Conseil du 5 octobre 2021 relative à l'association des pays et territoires d'outre-mer à l'Union européenne ; l'article 9, paragraphe 4, dispose que Saint-Pierre-et-Miquelon est considéré comme un PTOM isolé.", annee: 2021, source: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32021D1764"}
