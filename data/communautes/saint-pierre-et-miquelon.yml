  - {instrument: "Loi n° 85-595 du 11 juin 1985 relative au statut de l'archipel de Saint-Pierre-et-Miquelon", nature: "statut_autonomie", annee: 1985, source: "https://www.senat.fr/rap/l06-025-1/l06-025-160.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Depuis la loi organique du 21 février 2007 (CGCT, art. LO 6411-1), la collectivité est administrée par un conseil territorial de 19 membres élus pour cinq ans (15 sièges pour Saint-Pierre, 4 pour Miquelon-Langlade), qui élit un conseil exécutif de huit membres.", source: "https://www.senat.fr/rap/r10-308/r10-30817.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'article LO 6414-1 du CGCT confie à la collectivité la fixation des règles applicables en matière d'impôts, droits et taxes, de cadastre, de régime douanier (à l'exclusion des prohibitions à l'importation et à l'exportation) et d'urbanisme, construction, habitation et logement.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-160.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'article LO 6414-3 du CGCT donne à la collectivité la compétence pour fixer l'assiette, le taux et les modalités de recouvrement de la redevance due par les titulaires de concessions de mines et d'hydrocarbures dans la zone économique exclusive (espace maritime sous juridiction française) ; l'exploration, l'exploitation et la délivrance des titres miniers relèvent de l'État, qui peut en concéder l'exercice à la collectivité par un cahier des charges approuvé par décret en Conseil d'État.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-160.html"}
  consentement: {valeur: "partiel", note: "L'article LO 6413-3 du CGCT impose la consultation du conseil territorial sur les projets et propositions de loi, d'ordonnance ou de décret comportant des dispositions particulières à l'archipel et sur certains traités ou accords avant leur ratification ; la collectivité rend un avis.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-160.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "La collectivité fixe les règles en matière d'impôts, droits et taxes et de régime douanier (CGCT, art. LO 6414-1) ; la collectivité institue des impôts ou taxes au bénéfice des deux communes, dont le conseil municipal fixe le taux (art. LO 6414-6).", source: "https://www.senat.fr/rap/l06-025-1/l06-025-160.html"}
  representation: {valeur: "reconnu", note: "L'article LO 6411-2 du CGCT dispose que la collectivité est représentée au Parlement et au Conseil économique et social dans les conditions prévues par les lois organiques.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-160.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le conseil territorial a été renouvelé au second tour du 27 mars 2022 : 19 sièges pourvus (15 pour la liste arrivée en tête, 4 pour la seconde), puis élection du président par 15 voix sur 19.", source: "https://outremers360.com/bassin-atlantique-appli/bernard-briand-elu-president-du-conseil-territorial-de-saint-pierre-et-miquelon"}
