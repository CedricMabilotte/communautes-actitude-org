resume: >-
  Peuple originaire de Banaba (Ocean Island), dans l'actuel Kiribati, réinstallé à partir de 1945 sur l'île Rabi à Fidji après l'exploitation du phosphate sur son île. À Fidji, le Banaban Settlement Act confie l'administration de Rabi à un Conseil des dirigeants (Rabi Council of Leaders) ; le conseil élu a été dissous en 2013 et un administrateur nommé par le Premier ministre l'exerce seul depuis 2023, les élections étant reportées jusqu'à la révision de la loi. La Constitution de Fidji de 2013 interdit l'aliénation définitive des terres banabanes (art. 28). La Constitution de Kiribati (1979) consacre un chapitre aux Banabans : siège réservé au Parlement, droits fonciers sur Banaba, droit inaliénable d'y entrer et d'y résider, Conseil de l'île de Banaba.
