base_nationale:
  - {instrument: "Constitution de Kiribati (1979, révisée en 2013), chapitre IX, art. 117 à 125", nature: "constitution", annee: 1979, source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  - {instrument: "Constitution de la République de Fidji (2013), art. 28 al. 5 et 6", nature: "constitution", annee: 2013, source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  - {instrument: "Banaban Settlement Act et Banaban Lands Act (lois de Fidji, chap. 123 et 124)", nature: "loi", annee: 1970, source: "https://www.pmoffice.gov.fj/rabi/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le Conseil des dirigeants de Rabi, organe statutaire élu pour quatre ans, supervise les affaires de la communauté en vertu du Banaban Settlement Act (chap. 123) ; la Constitution de Kiribati le désigne pour nommer le député banaban (art. 117 et 125) et prévoit un Conseil de l'île de Banaba (art. 121).", source: "https://www.pmoffice.gov.fj/rabi/"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Banaban Settlement Act (chap. 123) autorise le Conseil à prendre des règlements insulaires en matière de santé publique, de paix et de sécurité et de bien-être général, sous réserve d'approbation préalable ; chacune des quatre communautés de Rabi élit deux membres du Conseil.", source: "https://unfccc.int/files/adaptation/groups_committees/loss_and_damage_executive_committee/application/pdf/lhr.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "À Fidji, les terres banabanes ne peuvent être aliénées définitivement (Constitution 2013, art. 28 al. 5) et le titre de Rabi est confié au Conseil en fiducie pour la communauté (Banaban Lands Act). À Kiribati, les droits fonciers des Banabans sur Banaba ne sont pas affectés par leur résidence à Rabi, et les terres prises pour le phosphate doivent leur être restituées (art. 119 al. 1 et 2).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  ressources: {valeur: "partiel", note: "Les propriétaires de terres coutumières à Fidji ont droit à une part équitable des redevances minières (Constitution de Fidji, art. 30).", source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  consentement: {valeur: "partiel", note: "Un droit foncier banaban à Banaba ne peut être exproprié qu'en bail, après consultation du Conseil de l'île de Banaba et tentative d'accord amiable (Constitution de Kiribati, art. 119 al. 3).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Un siège du Parlement de Kiribati (Maneaba ni Maungatabu) est réservé à un représentant de la communauté banabane nommé par le Conseil de Rabi (Constitution de Kiribati, art. 117).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  statut_personnel: {valeur: "reconnu", note: "Tout Banaban a un droit inaliénable d'entrer et de résider à Banaba (art. 119 al. 4) ; un Banaban peut voter et être élu dans la circonscription de Banaba sans être citoyen de Kiribati (art. 118) ; la loi peut restreindre l'entrée des non-Banabans (art. 120).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Conseil de Rabi dépend d'une subvention de l'État fidjien (fonds créé en 1994, 95 000 dollars fidjiens par an) ; le gouvernement l'a incité à réduire ses coûts de fonctionnement.", source: "https://www.pmoffice.gov.fj/rabi/"}
