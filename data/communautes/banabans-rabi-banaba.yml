base_nationale:
  - {instrument: "Constitution de Kiribati (1979, révisée en 2013), chapitre IX, art. 117 à 125", nature: "constitution", annee: 1979, source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  - {instrument: "Constitution de la République de Fidji (2013), art. 28 al. 5 et 6", nature: "constitution", annee: 2013, source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  - {instrument: "Banaban Settlement Act (1970, chap. 123) et Banaban Lands Act (1965, chap. 124), lois de Fidji", nature: "loi", annee: 1970, source: "https://www.pmoffice.gov.fj/rabi/"}
droits:
  autogouvernement: {valeur: "conteste", note: "Le Banaban Settlement Act (chap. 123) institue le Conseil des dirigeants de Rabi, élu pour quatre ans par les quatre villages de l'île. Le conseil élu a été dissous en 2013 ; depuis 2023, un administrateur nommé par le Premier ministre de Fidji occupe seul les neuf sièges, et les élections sont reportées jusqu'à la révision de la loi (Fiji Sun, décembre 2025). À Kiribati, la Constitution prévoit un Conseil de l'île de Banaba (art. 121).", source: "https://fijisun.com.fj/news/nation/rabi-election-hinges-on-act-review"}
  pouvoir_normatif: {valeur: "conteste", note: "Le Banaban Settlement Act (art. 5) autorise le Conseil à prendre des règlements insulaires (santé publique, ordre public, pêche, écoles, bien-être général), sous réserve d'approbation préalable du gouvernement ; depuis la dissolution du conseil élu, ce pouvoir est exercé par l'administrateur nommé, qui a imposé en 2024 l'enregistrement des visiteurs non banabans (RNZ, janvier 2024).", source: "https://www.rnz.co.nz/international/pacific-news/508052/fiji-official-aims-to-ban-visitors-to-rabi-island"}
  justice_propre: {valeur: "partiel", note: "Une police locale relevant du Conseil applique les règlements pris en vertu du Banaban Settlement Act et un magistrat de l'île juge les infractions mineures en langue banabane ; les affaires graves relèvent de la police fidjienne (Fiji Sun, décembre 2025).", source: "https://fijisun.com.fj/news/nation/shared-justice-rabis-local-wardens-and-fiji-police-divide-duties"}
  terres: {valeur: "reconnu", note: "À Fidji, les terres banabanes ne peuvent être aliénées définitivement (Constitution 2013, art. 28 al. 5) et le titre de Rabi est confié au Conseil en fiducie pour la communauté (Banaban Lands Act). À Kiribati, les droits fonciers des Banabans sur Banaba ne sont pas affectés par leur résidence à Rabi, et les terres prises pour le phosphate doivent leur être restituées (art. 119 al. 1 et 2).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  ressources: {valeur: "partiel", note: "Les propriétaires de terres, coutumières ou en pleine propriété, ont droit à une part équitable des redevances minières perçues par l'État (Constitution de Fidji, art. 30) ; cette règle vaut pour tous les propriétaires fonciers de Fidji, et le titre de Rabi est détenu par le Conseil en fiducie (trust) pour la communauté.", source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  consentement: {valeur: "partiel", note: "Un droit foncier banaban à Banaba ne peut être exproprié qu'en bail, après consultation du Conseil de l'île de Banaba et tentative d'accord amiable (Constitution de Kiribati, art. 119 al. 3).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Un siège du Parlement de Kiribati (Maneaba ni Maungatabu) est réservé à un représentant banaban nommé par le Conseil de Rabi (Constitution de Kiribati, art. 117) ; le membre nommé ou un élu de Banaba peut bloquer une révision du chapitre IX (art. 124).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  statut_personnel: {valeur: "reconnu", note: "Tout Banaban a un droit inaliénable d'entrer et de résider à Banaba (art. 119 al. 4) ; un Banaban peut voter et être élu dans la circonscription de Banaba sans être citoyen de Kiribati (art. 118) ; la loi peut restreindre l'entrée des non-Banabans (art. 120).", source: "https://www.constituteproject.org/constitution/Kiribati_2013"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le conseil élu de Rabi a été dissous en 2013 ; l'administrateur nommé en 2023 exerce seul les fonctions du Conseil et le gouvernement fidjien conditionne les élections à une révision du Banaban Settlement Act annoncée en décembre 2025 (Fiji Sun, 19 décembre 2025). La subvention annuelle de l'État (150 000 dollars fidjiens) a été suspendue trois ans faute de comptes audités (PINA, janvier 2023).", source: "https://fijisun.com.fj/news/nation/rabi-election-hinges-on-act-review"}
chronologie:
  - {annee: 1945, evenement: "703 Banabans sont réinstallés sur l'île Rabi."}
  - {annee: 1965, evenement: "Banaban Lands Act : le titre de Rabi est confié au Conseil en fiducie pour la communauté."}
  - {annee: 1970, evenement: "Banaban Settlement Ordinance de Fidji : Conseil des dirigeants de Rabi."}
  - {annee: 1977, evenement: "Résolutions de Bairiki : double citoyenneté accordée sur demande par les îles Gilbert."}
  - {annee: 1979, evenement: "Indépendance de Kiribati ; chapitre IX de la Constitution consacré aux Banabans."}
  - {annee: 1994, evenement: "Création du fonds de subvention de Rabi par l'État fidjien."}
  - {annee: 2013, evenement: "Dissolution du conseil élu de Rabi ; Constitution de Fidji : terres banabanes inaliénables (art. 28)."}
  - {annee: 2023, evenement: "Le Premier ministre de Fidji nomme un administrateur du Conseil ; accord d'exploration du phosphate à Banaba avec Centrex, suspendu après les objections de la communauté."}
  - {annee: 2024, evenement: "L'administrateur impose l'enregistrement des visiteurs non banabans à Rabi."}
  - {annee: 2025, evenement: "Le gouvernement fidjien annonce la révision du Banaban Settlement Act avant toute élection du Conseil ; la Haute Cour de Suva se déclare incompétente pour les documents relatifs à Banaba."}
  - {annee: 2026, evenement: "Le Conseil écarte Centrex et engage une étude de faisabilité minière avec Kiribati et la société nauruane RONPHOS."}
