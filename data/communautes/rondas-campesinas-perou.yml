chronologie:
  - {annee: 1976, evenement: "Première ronde paysanne à Cuyumalca (province de Chota, Cajamarca), le 29 décembre."}
  - {annee: 1986, evenement: "Loi 24571 : première reconnaissance légale des rondes paysannes."}
  - {annee: 1987, evenement: "Loi 24656 : l'assemblée d'une communauté paysanne peut constituer une ronde (art. 18 k)."}
  - {annee: 1993, evenement: "Constitution : art. 149 sur la juridiction des communautés avec l'appui des rondes."}
  - {annee: 2003, evenement: "Loi 27908 des rondes paysannes, qui abroge la loi 24571, puis règlement (décret suprême 025-2003-JUS) du 29 décembre."}
  - {annee: 2017, evenement: "Recensement des communautés paysannes : 2 327 communautés déclarent une ronde."}
fiabilite:
  verifie: ["Article 149 de la Constitution de 1993 (texte publié par l'État).", "Articles 1 à 9 et dispositions finales de la loi 27908 (texte reproduit par Justicia Viva) : personnalité juridique, conciliation, coordination avec la justice ordinaire, abrogation de la loi 24571, 29 décembre jour des rondes.", "Articles 2, 4, 5, 7, 8, 13 et 15 du règlement approuvé par le décret suprême 025-2003-JUS (texte reproduit par Justicia Viva), dont la formation de rondes dans les hameaux hors communautés (art. 5).", "Article 18 k de la loi 24656.", "2 327 communautés paysannes dotées d'une ronde (INEI, recensement 2017, tome 1).", "Origine à Cuyumalca en 1976 et loi 24571 de novembre 1986 (O. Starn, IEP, 1991)."]
  non_confirme: ["Nombre total de rondes inscrites aux Registres publics (SUNARP) et nombre de ronderos : la revue Ideele cite environ 250 000 ronderos et 8 000 comités sans source ni date ; non retenu.", "Accord plénier 1-2009/CJ-116 de la Cour suprême sur la juridiction des rondes : texte non consulté.", "Aucun document onusien ou régional nommant les rondes n'a été consulté.", "Liste officielle des rondes par site : aucune liste ouverte trouvée, d'où l'absence de tableau.", "Texte de la loi 27908 lu sur une reproduction (Justicia Viva) ; la copie du Congrès est un scan illisible.", "Statut personnel : l'inscription au registre des membres (padrón, règlement art. 8) relève de l'adhésion à une organisation et ne constitue pas un statut civil propre ; valeur non retenue.", "Population : non trouvée.", "Surface : non trouvée.", "Nombre de villages ou localités : non trouvé ; le recensement de 2017 compte des communautés paysannes, dont 3 760 sur 6 682 déclarent des annexes ou hameaux (tome 1, tableau n° 3), et non des localités ; le chiffre de 2 327 communautés dotées d'une ronde est porté en lieux."]
