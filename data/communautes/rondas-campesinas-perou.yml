droits:
  autogouvernement: {valeur: "partiel", note: "La loi 27908 (2003) reconnaît la personnalité juridique des rondes comme forme autonome et démocratique d'organisation communale (art. 1) ; selon le règlement de 2003, l'assemblée générale adopte le statut (art. 7) et le bureau (junta directiva) a un mandat de deux ans (art. 15). Dans une communauté paysanne ou native, la ronde se forme à l'initiative exclusive de la communauté (art. 2 de la loi).", source: "https://www.justiciaviva.org.pe/acceso_justicia/justicia_comunal/2.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque ronde élabore son statut en assemblée générale « en exerçant son autonomie » (règlement de 2003, art. 7) ; dans l'exercice du droit coutumier, ses membres ont droit au respect de leur culture et de leurs coutumes, dans le respect des droits fondamentaux (art. 4).", source: "https://www.justiciaviva.org.pe/acceso_justicia/justicia_comunal/2.pdf"}
  justice_propre: {valeur: "partiel", note: "Les autorités des communautés exercent des fonctions juridictionnelles avec l'appui des rondes (Constitution, art. 149) ; la loi 27908 autorise les rondes à régler à l'amiable, selon leurs coutumes, les conflits nés de faits survenus sur leur territoire (art. 1 et 7) et impose à la justice ordinaire de se coordonner avec elles en respectant leur autonomie (art. 9). Le règlement limite la conciliation à la possession, à l'usufruit de la propriété communale, aux biens et à l'usage des ressources communales (art. 13).", source: "https://www.justiciaviva.org.pe/acceso_justicia/justicia_comunal/1.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La loi 27908 donne aux rondes un droit de participation, de contrôle et de surveillance des programmes et projets de développement mis en œuvre dans leur ressort (art. 6) et leur applique les droits des peuples autochtones « en ce qui leur correspond et les favorise » (art. 1) ; aucune obligation de consultation préalable propre aux rondes n'est inscrite.", source: "https://www.justiciaviva.org.pe/acceso_justicia/justicia_comunal/1.pdf"}
