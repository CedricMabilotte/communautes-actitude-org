resume: >-
  Fiche agrégée. Les rondes paysannes (rondas campesinas, comités de surveillance villageois) sont des organisations de ruraux nées le 29 décembre 1976 au hameau de Cuyumalca (province de Chota, Cajamarca) pour lutter contre le vol de bétail, puis étendues aux Andes du nord et à d'autres régions. La Constitution de 1993 (art. 149) les associe aux fonctions juridictionnelles des communautés paysannes et natives ; la loi 27908 de 2003 leur donne la personnalité juridique comme forme autonome et démocratique d'organisation communale, avec des fonctions de sécurité, de conciliation extrajudiciaire (règlement à l'amiable hors tribunal) et de règlement des conflits sur leur territoire. Le règlement de 2003 admet des rondes hors des communautés, dans les hameaux, ce qui en fait un sujet collectif distinct des communautés paysannes, qui ont leur propre fiche. Le recensement de 2017 compte 2 327 communautés paysannes dotées d'une ronde ; le nombre total de rondes, y compris hors communautés, n'est pas publié.
