resume: >-
  Fiche agrégée : elle couvre les communautés de pêcheurs qui gèrent une aire marine gérée localement (AMGL, en anglais LMMA), dénommée dans le droit des pêches « aire de pêche gérée localement » (APGL). Le Code de la pêche et de l'aquaculture de 2015 (loi n° 2015-053) valorise la gouvernance communautaire des ressources halieutiques et confie au ministère chargé de la pêche les transferts de gestion (délégation par l'État de la gestion d'une ressource) aux communautés locales de base ; le décret n° 2016-1352 et l'arrêté n° 29211/2017 du 28 novembre 2017 en fixent les modalités. Un groupement de pêcheurs légalement constitué peut obtenir, pour une zone délimitée couverte par un plan d'aménagement des pêcheries, une autorisation de gestion de deux ans renouvelable, assortie d'un cahier des charges, et gère la zone selon des réglementations communautaires, dont un dina (convention collective locale homologuée par le tribunal). Le régime relève du ministère chargé de la pêche et se distingue des transferts de gestion des ressources naturelles renouvelables de la loi n° 96-025 ; aucune liste officielle des autorisations délivrées n'a été trouvée.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de Madagascar à la Convention sur la diversité biologique (février 2019) : la liste des sigles définit les LMMA (Locally Managed Marine Areas) et le rapport cite la création de la LMMA d'Ambatolava parmi les mesures pour les écosystèmes aquatiques.", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/mg-nr-06-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 2015-053 portant Code de la pêche et de l'aquaculture, titre II, chapitre 3 « Gouvernance locale de la petite pêche » (articles 14 et 15)", nature: "loi", annee: 2015, source: "https://www.dcn-pac.mg/uploads/loi/5d836f7ded9833bafec7e9f6e7ad5b40.pdf"}
  - {instrument: "Loi n° 2018-026 portant refonte de certaines dispositions de la loi sur le Code de la pêche et de l'aquaculture (40 articles modifiés : suppression des peines d'emprisonnement, amendes en ariary, missions des inspecteurs), déclarée conforme à la Constitution par la décision n° 32-HCC/D3 du 14 décembre 2018", nature: "loi", annee: 2018, source: "https://www.hcc.gov.mg/?p=4635"}
  - {instrument: "Décret n° 2016-1352 du 8 novembre 2016 portant organisation des activités de préservation des ressources halieutiques et écosystèmes aquatiques, chapitre III (articles 11 à 15, transfert de gestion) et chapitre V (articles 28 à 30, réserves de pêche)", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/mad203280.pdf"}
  - {instrument: "Arrêté ministériel n° 29211/2017 du 28 novembre 2017 fixant les modalités de transfert de gestion des ressources halieutiques et écosystèmes aquatiques (aires de pêche gérées localement)", nature: "loi", annee: 2017, source: "https://faolex.fao.org/docs/pdf/mad179721.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les bénéficiaires du transfert sont des communautés de pêcheurs rassemblées en groupement légalement constitué et reconnu par le ministère chargé de la pêche (arrêté n° 29211/2017, art. 3 ; décret n° 2016-1352, art. 12) ; le plan simple de gestion est élaboré par les groupements et validé par l'assemblée communautaire (arrêté, art. 1 et 7) ; l'autorisation est valable deux ans renouvelables et le ministère assure le suivi et la supervision des activités du groupement (arrêté, art. 7 et 10 ; décret, art. 14 et 15).", source: "https://faolex.fao.org/docs/pdf/mad179721.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les modes de gestion des ressources par les groupements sont fixés par des réglementations communautaires, dont un dina homologué par le tribunal du lieu, et par un cahier des charges (document fixant droits et obligations) conclu avec l'administration (arrêté n° 29211/2017, art. 4 ; l'arrêté vise dans son préambule la loi n° 2001-004 sur les dina) ; la gestion locale et la surveillance communautaire sont approuvées par voie réglementaire sur proposition des organes de gestion locale (Code de la pêche 2015, art. 14).", source: "https://faolex.fao.org/docs/pdf/mad179721.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La zone établie par transfert de gestion est une zone clairement délimitée dont l'État délègue la gestion des ressources aux membres des communautés de pêcheurs ; elle doit être couverte par un plan d'aménagement des pêcheries (arrêté n° 29211/2017, art. 1 et 2) et porte sur des ressources du domaine de l'État ou des collectivités territoriales (décret n° 2016-1352, art. 13) ; aucun texte ne confère de propriété.", source: "https://faolex.fao.org/docs/pdf/mad179721.pdf"}
  ressources: {valeur: "partiel", note: "Le Code de 2015 place les transferts de gestion des ressources halieutiques et des écosystèmes aquatiques aux communautés locales de base sous la compétence de l'autorité chargée de la pêche (art. 15) ; le groupement peut demander une APGL, sous forme de réserve de pêche ou de zone établie par transfert de gestion, et peut en consacrer une partie au paiement des services écosystémiques ou à l'écotourisme (arrêté n° 29211/2017, art. 5 et 8) ; aucun texte trouvé ne réserve l'accès à la zone aux seuls membres de la communauté.", source: "https://www.dcn-pac.mg/uploads/loi/5d836f7ded9833bafec7e9f6e7ad5b40.pdf"}
