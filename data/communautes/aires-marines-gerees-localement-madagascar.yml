effectivite: {valeur: "partielle", note: "Lors du quatrième forum national du réseau MIHARI (Fort-Dauphin, juillet 2017), qui regroupait alors 150 communautés en 64 associations, les représentants des communautés ont adopté à l'unanimité, en présence du directeur général du ministère chargé de la pêche, trois motions qui demandent notamment une homologation plus rapide des dina et un droit de pêche exclusif sur la bande littorale. La motion sur les dina décrit la longueur des procédures d'homologation et le risque de rejet des dossiers.", source: "https://madagascar-tribune.com/Les-communautes-de-pecheurs,23207.html"}
chronologie:
  - {annee: 1996, evenement: "Loi n° 96-025 relative à la gestion locale des ressources naturelles renouvelables : transferts de gestion aux communautés de base, y compris pour la faune et la flore aquatiques."}
  - {annee: 2006, evenement: "Selon l'organisation Blue Ventures, les premières aires marines gérées localement sont mises en place à Madagascar."}
  - {annee: 2015, evenement: "Adoption par l'Assemblée nationale, le 16 décembre, de la loi n° 2015-053 portant Code de la pêche et de l'aquaculture : gouvernance locale de la petite pêche et transferts de gestion aux communautés locales de base (art. 14 et 15)."}
  - {annee: 2016, evenement: "Décret n° 2016-1352 du 8 novembre : transfert de gestion dans le cadre d'un plan d'aménagement des pêcheries, autorisation de deux ans renouvelable."}
  - {annee: 2017, evenement: "Forum national du réseau MIHARI à Fort-Dauphin (27-31 juillet) : motions sur les dina, les engins de pêche et un droit de pêche communautaire exclusif sur la bande littorale."}
  - {annee: 2017, evenement: "Arrêté n° 29211/2017 du 28 novembre : définition de l'aire de pêche gérée localement et procédure de demande."}
  - {annee: 2018, evenement: "Loi n° 2018-026 : refonte de 40 articles du Code de la pêche et de l'aquaculture, déclarée conforme à la Constitution le 14 décembre (décision n° 32-HCC/D3) ; la décision ne mentionne pas les articles 14 et 15."}
  - {annee: 2025, evenement: "Décision n° 10-HCC/D3 du 14 octobre : la Haute Cour constitutionnelle constate la vacance de la présidence de la République, invite l'autorité militaire à exercer les fonctions de chef de l'État et dispose que les institutions en place continuent d'exercer leurs pouvoirs ; aucun texte trouvé n'abroge ou ne suspend les textes du régime des pêches."}
fiabilite:
  verifie: ["Arrêté n° 29211/2017 : articles 1 à 12 lus intégralement (définitions de l'APGL, bénéficiaires, dina homologué, autorisation de deux ans, supervision).", "Décret n° 2016-1352 : articles 1 à 15 et 28 à 30 lus.", "Code de la pêche et de l'aquaculture (loi n° 2015-053) : articles 14 et 15 lus ; l'article 49 sur les droits d'usage coutumiers libres et gratuits dans les zones réservées figure dans le chapitre sur la pêche continentale.", "Loi n° 96-025 : articles 1 à 3 lus (ressources aquatiques incluses dans le champ des transferts de gestion).", "150 communautés en 64 associations membres du réseau MIHARI en 2017 (Madagascar Tribune).", "Loi n° 2015-053 : adoptée par l'Assemblée nationale le 16 décembre 2015 et déclarée conforme à la Constitution par la décision n° 07-HCC/D3 du 27 janvier 2016.", "Révision d'octobre 2026 : la décision n° 10-HCC/D3 du 14 octobre 2025 maintient les institutions en place ; la Haute Cour constitutionnelle continue en 2026 de contrôler les lois au regard de la Constitution (décision n° 18-HCC/D3 du 21 août 2026) ; aucune loi ni ordonnance sur la pêche n'apparaît parmi les décisions de la Haute Cour de 2025-2026 (seule la loi n° 2025-023 autorisant la ratification de l'accord de l'OMC sur les subventions à la pêche, décision n° 02-HCC/D1 du 28 janvier 2026) ni dans la liste des textes de l'Assemblée nationale consultée le 6 octobre 2026."]
  non_confirme: ["Nombre de groupements titulaires d'une autorisation de transfert de gestion au titre de l'arrêté de 2017 : aucune liste officielle trouvée, d'où l'absence de tableau des sites ; le tableau de bord du réseau MIHARI (page mise à jour en mai 2026) indique plus de 300 aires marines gérées localement appuyées par 30 ONG partenaires dans 13 régions, sans distinguer leur statut juridique (dina, transfert de gestion, aire protégée).", "Date de promulgation de la loi n° 2015-053 : 2 décembre 2015 selon le décret n° 2016-1352, 3 février 2016 selon l'arrêté n° 29211/2017 ; le 16 décembre 2015 est la date d'adoption par l'Assemblée nationale et la décision de conformité date du 27 janvier 2016, ce qui rend la date du 3 février 2016 compatible.", "Texte consolidé du Code de la pêche après la loi n° 2018-026 non trouvé : la rédaction actuelle des articles 14 et 15 n'a pas été vérifiée sur un texte consolidé.", "Veille de presse 2025-2026 non faite par recherche générale : seuls les sites officiels (Haute Cour constitutionnelle, Assemblée nationale) et les sources citées ont été consultés ; le site du ministère chargé de la pêche n'a pas été trouvé en ligne.", "Articulation avec les transferts de gestion de la loi n° 96-025 (ministère chargé de l'environnement) : certaines aires sont gérées sous ce régime ou sous le statut d'aire protégée ; le site de Velondriake figure dans la base WDPA du PNUE-WCMC (639,95 km²), sans que le type de gouvernance ait pu être confirmé.", "Surface totale des aires : Blue Ventures indique « près d'un cinquième » des fonds marins côtiers, sans chiffre.", "Population : non trouvée ; le seul chiffre trouvé est national (500 000 personnes vivant de la pêche, Madagascar Tribune, 2017) et ne se limite pas aux aires.", "Nombre de villages : non trouvé ; Blue Ventures indique 219 sites appuyés par 25 organisations partenaires du réseau MIHARI, sans nombre de villages."]
