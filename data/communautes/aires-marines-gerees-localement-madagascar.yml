effectivite: {valeur: "partielle", note: "Lors du quatrième forum national du réseau MIHARI (Fort-Dauphin, juillet 2017), qui regroupait alors 150 communautés en 64 associations, les représentants des communautés ont adopté à l'unanimité, en présence du directeur général du ministère chargé de la pêche, trois motions qui demandent notamment une homologation plus rapide des dina et un droit de pêche exclusif sur la bande littorale. La motion sur les dina décrit la longueur des procédures d'homologation et le risque de rejet des dossiers.", source: "https://madagascar-tribune.com/Les-communautes-de-pecheurs,23207.html"}
chronologie:
  - {annee: 1996, evenement: "Loi n° 96-025 relative à la gestion locale des ressources naturelles renouvelables : transferts de gestion aux communautés de base, y compris pour la faune et la flore aquatiques."}
  - {annee: 2006, evenement: "Selon l'organisation Blue Ventures, le modèle d'aire marine gérée localement est mis au point à Madagascar."}
  - {annee: 2015, evenement: "Loi n° 2015-053 portant Code de la pêche et de l'aquaculture : gouvernance locale de la petite pêche et transferts de gestion aux communautés locales de base (art. 14 et 15)."}
  - {annee: 2016, evenement: "Décret n° 2016-1352 du 8 novembre : transfert de gestion dans le cadre d'un plan d'aménagement des pêcheries, autorisation de deux ans renouvelable."}
  - {annee: 2017, evenement: "Forum national du réseau MIHARI à Fort-Dauphin (27-31 juillet) : motions sur les dina, les engins de pêche et un droit de pêche communautaire exclusif sur la bande littorale."}
  - {annee: 2017, evenement: "Arrêté n° 29211/2017 du 28 novembre : définition de l'aire de pêche gérée localement et procédure de demande."}
fiabilite:
  verifie: ["Arrêté n° 29211/2017 : articles 1 à 12 lus intégralement (définitions de l'APGL, bénéficiaires, dina homologué, autorisation de deux ans, supervision).", "Décret n° 2016-1352 : articles 1 à 15 et 28 à 30 lus.", "Code de la pêche et de l'aquaculture (loi n° 2015-053) : articles 14 et 15 lus ; l'article 49 sur les droits d'usage coutumiers libres et gratuits dans les zones réservées figure dans le chapitre sur la pêche continentale.", "Loi n° 96-025 : articles 1 à 3 lus (ressources aquatiques incluses dans le champ des transferts de gestion).", "150 communautés en 64 associations membres du réseau MIHARI en 2017 (Madagascar Tribune)."]
  non_confirme: ["Nombre de groupements titulaires d'une autorisation de transfert de gestion au titre de l'arrêté de 2017 : aucune liste officielle trouvée, d'où l'absence de tableau des sites ; le tableau de bord du réseau MIHARI indique plus de 300 aires marines gérées localement en 2026, sans distinguer leur statut juridique (dina, transfert de gestion, aire protégée).", "Date de la loi n° 2015-053 : 16 décembre 2015 selon FAOLEX, 2 décembre 2015 selon le décret n° 2016-1352, 3 février 2016 selon l'arrêté n° 29211/2017 (date de promulgation probable).", "Articulation avec les transferts de gestion de la loi n° 96-025 (ministère chargé de l'environnement) : certaines aires sont gérées sous ce régime ou sous le statut d'aire protégée ; le site de Velondriake figure dans la base WDPA du PNUE-WCMC (639,95 km²), sans que le type de gouvernance ait pu être confirmé.", "Surface totale des aires : Blue Ventures indique « près d'un cinquième » des fonds marins côtiers, sans chiffre.", "Population : non trouvée ; le seul chiffre trouvé est national (500 000 personnes vivant de la pêche, Madagascar Tribune, 2017) et ne se limite pas aux aires.", "Nombre de villages : non trouvé ; Blue Ventures indique 219 sites appuyés par 25 organisations partenaires du réseau MIHARI, sans nombre de villages."]
