resume: >-
  Fiche agrégée : elle couvre les organisations communautaires à qui le Conseil national des aires protégées (CONAP) attribue par contrat une unité de gestion forestière dans la zone à usages multiples de la réserve de biosphère maya, au nord du Guatemala. La loi sur les aires protégées (décret 4-89, art. 19) autorise le CONAP à accorder des concessions d'exploitation ; la réserve est créée par le décret 5-90 et les « Normes d'octroi des concessions » de 1998 fixent la procédure, les droits et les obligations. La concession donne un droit exclusif d'exploitation du bois et des produits forestiers non ligneux, pour la durée fixée au contrat (25 ans pour les premiers contrats, 30 ans pour ceux de 2022), selon un plan de gestion approuvé par le CONAP ; la terre reste propriété de l'État et ne peut être acquise par le concessionnaire. De 1994 à 2002, 12 concessions communautaires et 2 concessions industrielles ont été attribuées ; trois contrats communautaires ont été suspendus ou annulés en 2009, huit ont été prorogés de 25 ans en 2021 et 2022, et deux nouvelles unités ont été concédées en 2022.
