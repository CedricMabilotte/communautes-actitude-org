reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la RDC à la Convention sur la diversité biologique (octobre 2019) : la loi n° 15/015 du 25 août 2015 fixant le statut des chefs coutumiers figure parmi les textes cités pour l'accès aux ressources génétiques et le partage des avantages (annexe 1 à l'objectif 9, p. 245 du rapport, p. 259 du fichier PDF), et l'art. 13 de la loi n° 15/026 relative à l'eau, reproduit dans le rapport (encadré 1, p. 98), charge les collèges exécutifs de chefferie de mesures de protection des ressources en eau.", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/cd-nr-06-fr.pdf"}
base_nationale:
  - {instrument: "Constitution du 18 février 2006, révisée par la loi n° 11/002 du 20 janvier 2011, art. 3 (chefferie, entité territoriale décentralisée), 34 (propriété collective acquise conformément à la coutume), 197 (députés provinciaux cooptés) et 207 (autorité coutumière)", nature: "constitution", annee: 2006, source: "https://www.constituteproject.org/constitution/Democratic_Republic_of_the_Congo_2011"}
  - {instrument: "Loi organique n° 08/016 du 7 octobre 2008 portant composition, organisation et fonctionnement des entités territoriales décentralisées et leurs rapports avec l'État et les provinces, art. 5, 65 à 92, 95 et 104 à 119", nature: "loi_organique", annee: 2008, source: "https://faolex.fao.org/docs/pdf/cng146255.pdf"}
  - {instrument: "Loi n° 15/015 du 25 août 2015 fixant le statut des chefs coutumiers, art. 1 à 10, 25, 26, 29 à 36", nature: "loi", annee: 2015, source: "https://congo-autrement.e-monsite.com/page/renseignements-rd-congo/loi-fixant-le-statut-des-chefs-coutumiers-en-rd-congo.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "La chefferie est une entité territoriale décentralisée dotée de la personnalité juridique, qui jouit de la libre administration (loi organique n° 08/016, art. 5) ; son chef est désigné selon la coutume et investi par arrêté du gouverneur (art. 67, 74 et 80) ; il est le chef du collège exécutif (art. 87), qui comprend trois échevins (adjoints) qu'il désigne avec l'approbation du conseil (art. 79) ; il ne répond pas de ses actes devant le conseil, et ses actes sont contresignés par un échevin responsable devant celui-ci (art. 82) ; le conseil de chefferie est élu au suffrage universel direct (art. 70). Limites : l'exercice des fonctions de chef exige l'investiture et la reconnaissance par les pouvoirs publics (loi n° 15/015, art. 6) ; le gouverneur de province exerce la tutelle sur les actes de la chefferie (loi organique, art. 95) ; la déchéance du chef de chefferie pour faute administrative est prononcée par le gouverneur de province (loi n° 15/015, art. 32).", source: "https://faolex.fao.org/docs/pdf/cng146255.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La chefferie est administrée conformément à la loi organique et à la coutume, « pour autant que celle-ci ne soit contraire ni aux lois, ni aux édits, ni à l'ordre public et aux bonnes mœurs » (loi organique n° 08/016, art. 67) ; le conseil délibère sur les matières d'intérêt local (art. 73) ; le chef prend des arrêtés de chefferie et, en cas d'urgence, des règlements de police assortis de peines limitées à sept jours de servitude pénale (emprisonnement) et 2 500 francs congolais d'amende, qui cessent d'avoir effet s'ils ne sont pas entérinés par le conseil (art. 88 et 89).", source: "https://faolex.fao.org/docs/pdf/cng146255.pdf"}
  justice_propre: {valeur: "partiel", note: "Le chef coutumier « règle les conflits coutumiers qui surgissent entre différentes communautés de son entité » et en informe sa tutelle (loi n° 15/015, art. 26) ; pour les conflits de pouvoir coutumier, dont la contestation des terres des communautés locales, le gouverneur de province intervient au niveau de la chefferie, et le chef de chefferie au niveau des groupements et des villages, par conciliation, médiation ou arbitrage ; une commission consultative de règlement des conflits coutumiers peut être créée au niveau de la chefferie (art. 35 et 36). Les recours contre les sanctions en matière coutumière suivent la coutume locale (art. 34). Aucune juridiction propre à la chefferie n'est créée.", source: "https://congo-autrement.e-monsite.com/page/renseignements-rd-congo/loi-fixant-le-statut-des-chefs-coutumiers-en-rd-congo.html"}
  terres: {valeur: "partiel", note: "L'État garantit la propriété individuelle ou collective acquise conformément à la loi ou à la coutume (Constitution, art. 34). Le chef coutumier veille « à la protection des espaces fonciers qui relèvent des terres des communautés locales », définies comme les terres que ces communautés habitent, cultivent ou exploitent conformément aux coutumes (loi n° 15/015, art. 2 et 10). Le collège exécutif de chefferie veille à la gestion du domaine de l'entité (loi organique n° 08/016, art. 84). Aucun titre foncier collectif n'est attribué à la chefferie par ces textes.", source: "https://congo-autrement.e-monsite.com/page/renseignements-rd-congo/loi-fixant-le-statut-des-chefs-coutumiers-en-rd-congo.html"}
  ressources: {valeur: "partiel", note: "Le collège exécutif de chefferie veille à la protection de la flore, de la faune, des eaux, des cours d'eau et des rives (loi organique n° 08/016, art. 84) ; le conseil délibère sur les campagnes agricoles, l'élevage et la pêche (art. 73). La taxe de superficie sur les concessions forestières et la taxe sur la superficie des concessions minières figurent parmi les taxes d'intérêt commun qui reviennent en tout ou en partie aux entités décentralisées (art. 112). La loi organique ne donne à la chefferie aucune compétence d'attribution des concessions forestières ou minières.", source: "https://faolex.fao.org/docs/pdf/cng146255.pdf"}
  consentement: {valeur: "partiel", note: "Les chefs coutumiers « peuvent être consultés, à tout moment, par les autorités publiques sur toute question relative à l'exercice du pouvoir coutumier » (loi n° 15/015, art. 9). La consultation est une faculté, sans obligation ni consentement préalable.", source: "https://congo-autrement.e-monsite.com/page/renseignements-rd-congo/loi-fixant-le-statut-des-chefs-coutumiers-en-rd-congo.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Le conseil de chefferie délibère sur l'initiative de création des crèches et des écoles maternelles, primaires, secondaires, professionnelles et spéciales, « conformément aux normes établies par le pouvoir central », et sur les programmes d'alphabétisation des adultes (loi organique n° 08/016, art. 73).", source: "https://faolex.fao.org/docs/pdf/cng146255.pdf"}
  fiscalite: {valeur: "partiel", note: "Les finances de la chefferie sont distinctes de celles de la province (loi organique n° 08/016, art. 104) ; l'impôt personnel minimum est perçu au profit exclusif des communes, secteurs et chefferies, et les entités décentralisées ont droit à 40 % de la part des recettes à caractère national allouées aux provinces (art. 109 et 115). Le budget de la chefferie est intégré dans celui de la province et ses comptes sont contrôlés par l'Inspection générale des finances et la Cour des comptes (art. 106 et 107).", source: "https://faolex.fao.org/docs/pdf/cng146255.pdf"}
  representation: {valeur: "partiel", note: "Les assemblées provinciales comprennent des députés cooptés (désignés sans élection au suffrage universel), dans la limite d'un dixième de leurs membres (Constitution, art. 197) ; un chef coutumier peut y siéger sans se soumettre à l'élection par application de cette disposition (art. 207). Selon l'International Crisis Group (2013), ces sièges reviennent aux chefs coutumiers, cooptés par les députés provinciaux à raison d'un chef par territoire. Aucun siège n'est réservé au niveau national.", source: "https://www.constituteproject.org/constitution/Democratic_Republic_of_the_Congo_2011"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon l'International Crisis Group (rapport du 23 juillet 2013, cité par une réponse de la Commission de l'immigration et du statut de réfugié du Canada reproduite en ligne), l'organisation de la gouvernance locale en chefferies n'avait été que partiellement mise en œuvre : les gouvernements successifs n'avaient ni organisé les élections locales ni voté la loi sur le statut des chefs coutumiers (adoptée depuis, en 2015). La même source décrit les chefs comme « à la fois des administrateurs de terres et des arbitres des querelles foncières », fonctions qui « n'ont pas toujours un fondement légal », et relève que, excédant souvent les limites de leur pouvoir, ils cèdent et retirent des terres, source de conflits fonciers. Aucune donnée postérieure à 2013 sur la tenue d'élections des conseils de chefferie n'a été consultée.", source: "https://congo-autrement.e-monsite.com/page/renseignements-rd-congo/loi-fixant-le-statut-des-chefs-coutumiers-en-rd-congo.html"}
chronologie:
  - {annee: 2006, evenement: "Constitution du 18 février : la chefferie devient une entité territoriale décentralisée (art. 3) et l'autorité coutumière est reconnue (art. 207)."}
  - {annee: 2008, evenement: "Loi organique n° 08/016 du 7 octobre : définition de la chefferie, conseil élu, collège exécutif présidé par le chef désigné selon la coutume, ressources financières propres."}
  - {annee: 2011, evenement: "Loi n° 11/002 du 20 janvier portant révision de la Constitution, dont l'art. 197 sur les députés provinciaux cooptés."}
  - {annee: 2015, evenement: "Loi n° 15/015 du 25 août fixant le statut des chefs coutumiers : désignation selon la coutume, protection des terres des communautés locales, règlement des conflits coutumiers, caractère apolitique du chef."}
  - {annee: 2019, evenement: "Le sixième rapport national de la RDC à la Convention sur la diversité biologique cite la loi n° 15/015."}
fiabilite:
  verifie: ["Texte des art. 5, 65 à 92, 95 et 104 à 119 de la loi organique n° 08/016 (Journal officiel du 10 octobre 2008, numérisé par FAOLEX).", "Texte des art. 3, 34, 197 et 207 de la Constitution révisée en 2011 (traduction anglaise, Constitute Project).", "Mention de la loi n° 15/015 et de l'art. 13 de la loi n° 15/026 dans le sixième rapport national à la CDB (2019)."]
  non_confirme: ["Texte de la loi n° 15/015 consulté sur un site de diffusion non officiel, et non au Journal officiel.", "Nombre de chefferies : 259 en 2012 selon une étude universitaire (Université de l'Uélé) et France 24, cités de seconde main par la Commission de l'immigration et du statut de réfugié du Canada ; le découpage en 26 provinces de 2015 n'a pas été pris en compte. Aucune liste officielle des chefferies n'a été trouvée, d'où l'absence de tableau des sites.", "Attribution effective des sièges cooptés aux chefs coutumiers par la loi électorale : connue seulement par l'International Crisis Group (2013), loi électorale non consultée.", "Tenue d'élections des conseils de chefferie depuis 2013 : non vérifiée.", "Population, surface et nombre de villages couverts par les chefferies : aucune source trouvée."]
