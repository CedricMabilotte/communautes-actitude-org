resume: >-
  Fiche agrégée : elle couvre les chefferies de la République démocratique du Congo, que la loi définit comme un « ensemble généralement homogène de communautés traditionnelles organisées sur base de la coutume », dirigé par un chef désigné selon la coutume puis reconnu et investi par les pouvoirs publics (loi organique n° 08/016 du 7 octobre 2008, art. 67). La Constitution de 2006 range la chefferie parmi les entités territoriales décentralisées (collectivités locales dotées de la personnalité juridique) et reconnaît l'autorité coutumière (art. 3 et 207). Chaque chefferie a un conseil élu et un collège exécutif présidé par le chef ; la loi n° 15/015 du 25 août 2015 fixe le statut des chefs coutumiers, dont la protection des terres des communautés locales et le règlement des conflits coutumiers. Une source secondaire de 2012 compte 259 chefferies.
