resume: >-
  Fiche agrégée : elle couvre les communautés villageoises titulaires des régimes de gestion locale créés par la loi n° 14/PR/2008 du 10 juin 2008 portant régime des forêts, de la faune et des ressources halieutiques. La forêt communautaire est une portion du domaine forestier protégé des collectivités territoriales décentralisées (communes et autres collectivités locales) affectée à une communauté, à la demande d'un village, d'un regroupement de villages ou d'un canton, et gérée selon un plan simple de gestion (document de planification rédigé par les membres de la communauté) ; les revenus de son exploitation appartiennent à la communauté (art. 26 à 28 et 87). La forêt sacrée, affectée à un groupe ou à une communauté villageoise, est gérée selon les coutumes locales (art. 31 et 32). Les communautés peuvent aussi classer des zones de gestion de la faune (art. 120 à 127) et demander des zones de gestion de la pêche confiées à un comité de gestion qui délivre des permis propres (art. 253 à 262). Le nombre de sites créés n'a pas été trouvé.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Quatrième rapport national du Tchad à la Convention sur la diversité biologique (octobre 2009) : la loi n° 14/PR/2008 est citée au titre de l'objectif 7.2 (protéger les droits des communautés autochtones et locales sur leurs connaissances, innovations et pratiques), avec le retard des textes d'application ; le rapport décrit un système d'aires protégées comprenant des réserves communautaires et des forêts sacrées, et cite la « Convention locale de gestion de la faune de la zone du Sena-Oura des cantons de Dari et de Goumadji ». Le cinquième rapport (avril 2014) mentionne une multitude de forêts sacrées et de forêts communautaires.", annee: 2009, source: "https://www.cbd.int/doc/world/td/td-nr-04-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 14/PR/2008 du 10 juin 2008 portant régime des forêts, de la faune et des ressources halieutiques, art. 13, 14, 17, 26 à 28, 31 à 33, 36, 67, 85 à 87, 115, 118, 120 à 127, 216, 228, 250, 253 à 262", nature: "loi", annee: 2008, source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La zone de gestion de la faune ou de la pêche est créée par décision de « l'organe délibérant compétent » de la communauté, après avis des services techniques (loi n° 14/PR/2008, art. 123 et 254) ; la gestion d'une zone de pêche est confiée à un comité de gestion de la pêche dont la création, la composition et le fonctionnement sont fixés par arrêté du ministre chargé des pêches (art. 255, 261 et 262) ; la gestion des zones de faune peut être confiée à des associations, groupements villageois ou structures locales agréées (art. 126) ; la forêt communautaire est classée par décision du ministre chargé des forêts, après avis du conseil rural ou du groupement d'intérêt communautaire (art. 33).", source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les activités autorisées dans les zones de gestion de la faune et de la pêche sont déterminées par les communautés avec l'assistance des services techniques, dans un plan simple de gestion révisable ; les services techniques fixent chaque année, si besoin, un quota de prélèvement (loi n° 14/PR/2008, art. 125 et 256) ; le comité de gestion de la pêche formule le plan simple de gestion de sa zone (art. 262) ; la gestion des forêts sacrées « est faite suivant les coutumes, us et pratiques locales des concernés » (art. 32).", source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire est une portion du domaine protégé des collectivités territoriales décentralisées « affectée à une communauté », créée à la demande d'un village, d'un regroupement de villages ou d'un canton (loi n° 14/PR/2008, art. 26 et 27) ; la forêt sacrée est affectée à un groupe ou à une communauté villageoise et les forêts sacrées sont déclarées « inviolables, intangibles et inaliénables » (art. 14 et 31) ; la zone de gestion de la faune ou de la pêche est une partie du territoire de la communauté affectée par elle à l'exploitation des ressources (art. 123 et 254) ; la loi ne confère pas la propriété du sol, et une zone classée au nom des communautés peut être reclassée au profit de l'État (art. 122).", source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
  ressources: {valeur: "partiel", note: "Les produits forestiers du domaine forestier communautaire appartiennent à la communauté concernée et les revenus de l'exploitation des forêts communautaires sont sa propriété (loi n° 14/PR/2008, art. 17 et 87) ; le domaine aquacole des communautés comprend les eaux qui leur sont concédées par l'État et les aménagements qu'elles réalisent (art. 216) ; la pêche dans une zone de gestion de la pêche exige un permis propre à la zone, demandé auprès du comité de gestion, dans la limite du nombre de pêcheurs autorisés (art. 258 et 259) ; les zones de faune et de pêche peuvent être amodiées (louées) par les communautés à des professionnels (art. 126 et 257).", source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
  consentement: {valeur: "partiel", note: "La loi définit l'approche participative et concertée comme l'implication des membres de la communauté, qui « est associée, consultée, fournit des informations, pose des questions et donne son avis » (loi n° 14/PR/2008, art. 13) ; les procédures de classement doivent assurer la participation de la population concernée (art. 36) ; les restrictions aux droits d'usage sont prises en concertation avec les populations (art. 77) ; l'administration des pêches consulte les représentants des communautés de pêcheurs pour le plan de gestion des pêcheries (art. 250) ; aucun consentement préalable n'est exigé.", source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les redevances et taxes perçues sur l'exploitation des zones de gestion de la faune et de la pêche sont réparties entre les budgets des collectivités territoriales décentralisées et les organisations communautaires de gestion (loi n° 14/PR/2008, art. 127 et 260) ; celles des réserves de faune sont réparties entre l'État, les collectivités et les communautés locales, et la moitié de la redevance d'une concession de chasse revient aux collectivités et aux communautés au prorata des surfaces (art. 115 et 118) ; la loi ne fixe pas la part de chacun.", source: "https://faolex.fao.org/docs/pdf/cha117920.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucun inventaire des forêts communautaires, forêts sacrées ou zones communautaires de faune et de pêche créées n'a été trouvé. Les rapports nationaux du Tchad à la Convention sur la diversité biologique relèvent le retard des textes d'application de la loi n° 14/PR/2008 (quatrième rapport, 2009) et la faible participation du secteur communautaire à la gestion des ressources naturelles (cinquième rapport, 2014 ; sixième rapport, 2018) ; la stratégie nationale pour la biodiversité (janvier 2016) classe l'élaboration de ces textes « en cours » et inscrit un « Projet Gestion des Forêts Communautaires » parmi les actions.", source: "https://www.cbd.int/doc/world/td/td-nbsap-v2-fr.pdf"}
chronologie:
  - {annee: 2008, evenement: "Loi n° 14/PR/2008 du 10 juin 2008 portant régime des forêts, de la faune et des ressources halieutiques : création des forêts communautaires, des forêts sacrées, des zones de gestion concertée de la faune et des zones de gestion de la pêche ; abrogation du décret de 1958 portant régime forestier et des ordonnances de 1963 sur la chasse et de 1975 sur la pêche."}
  - {annee: 2009, evenement: "Quatrième rapport national à la Convention sur la diversité biologique : retard des textes d'application de la loi."}
  - {annee: 2014, evenement: "Décret n° 579/PR/PM/MAE/2014 fixant les modalités de gestion du domaine forestier en application de la loi n° 14/PR/2008 : contrats de transfert de gestion forestière aux communautés rurales (collectivités territoriales décentralisées) et contrats de gestion signés avec une structure locale de gestion (art. 2 et 88)."}
  - {annee: 2016, evenement: "Stratégie nationale pour la biodiversité (version II) : élaboration des textes d'application de la loi n° 14/PR/2008 notée « en cours »."}
fiabilite:
  verifie:
    - "Articles 13, 14, 17, 26 à 28, 31 à 33, 36, 67, 77, 85 à 87, 115, 118, 120 à 127, 216, 250, 253 à 262 et 335 de la loi n° 14/PR/2008 dans le texte publié par FAOLEX (50 pages, signé le 10 juin 2008)."
    - "Mentions de la loi n° 14/PR/2008, des forêts sacrées, des réserves communautaires et de la convention locale du Sena-Oura dans le quatrième rapport national (octobre 2009) publié sur le site de la Convention sur la diversité biologique."
    - "Décret n° 579/PR/PM/MAE/2014 publié par FAOLEX : visa de la loi n° 14/PR/2008, articles 1, 2, 7, 31 à 35 et 88."
    - "Mention des forêts sacrées et des forêts communautaires dans le cinquième rapport national (avril 2014) ; textes d'application « en cours » et « Projet Gestion des Forêts Communautaires » dans la stratégie nationale version II (janvier 2016) ; même projet listé dans le sixième rapport national (décembre 2018)."
  non_confirme:
    - "Le décret n° 579/PR/PM/MAE/2014 fixant les modalités de gestion du domaine forestier applique la loi n° 14/PR/2008, mais range le patrimoine forestier en domaines de l'État, des collectivités territoriales décentralisées et des privés (art. 7) sans mentionner les forêts communautaires ni les forêts sacrées dans le texte lu ; aucun décret ou arrêté fixant la procédure de création des forêts communautaires, des forêts sacrées ou la composition des comités de gestion de la pêche n'a été trouvé."
    - "Le maintien en vigueur de la loi n° 14/PR/2008 en 2026 n'a pas été vérifié sur une source officielle tchadienne ; la notice ECOLEX ne mentionne aucun texte d'abrogation et liste des textes d'application de 2014 à 2019."
    - "Nombre de sites : non trouvé ; pas de liste officielle des sites, donc pas de tableau."
    - "Surface : non trouvée."
    - "Population : non trouvée."
    - "Nombre de villages : non trouvé. Les rapports nationaux à la CDB (2009, 2014, 2018) et la stratégie nationale version II (2016) ne donnent aucun chiffre sur ces sites."
    - "La convention locale du Sena-Oura (cantons de Dari et de Goumadji) est citée par le quatrième rapport national, sans indication qu'elle ait été prise en application des articles 120 à 127 de la loi."
    - "Aucune source indépendante (étude universitaire ou rapport d'organisation non gouvernementale) sur la mise en œuvre du régime n'a pu être ouverte."
