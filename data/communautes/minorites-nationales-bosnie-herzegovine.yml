resume: >-
  La loi de 2003 sur la protection des droits des membres des minorités nationales définit comme minorité nationale les citoyens de Bosnie-Herzégovine qui n'appartiennent à aucun des trois « peuples constitutifs » (Bosniaques, Croates, Serbes) et nomme 17 minorités : Albanais, Tchèques, Allemands, Hongrois, Italiens, Juifs, Macédoniens, Monténégrins, Polonais, Roms, Roumains, Russes, Ruthènes, Slovaques, Slovènes, Turcs et Ukrainiens (art. 3). Un Conseil des minorités nationales de 18 membres, constitué en 2008, est un organe consultatif de l'Assemblée parlementaire ; des conseils existent aussi auprès des entités et de certains cantons. La loi électorale réserve des sièges aux minorités dans les conseils municipaux là où elles dépassent 3 % de la population, et le statut du district de Brčko leur réserve deux sièges sur 31. Les droits collectifs se limitent à la représentation et à la consultation.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Bosnie-Herzégovine, adopté le 8 février 2024 : liste des 17 minorités de la loi de 2003 et membre autrichien du Conseil des minorités nationales (§ 33) ; seuils de 50 % ou 33 % fixés pour l'accès aux droits des minorités, « de toute évidence prohibitif » (§ 8) ; conseils des minorités, seul moyen de se faire entendre des parlementaires (§ 10).", annee: 2024, source: "https://rm.coe.int/5th-op-bih-fr/1680b07a27"}
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif, adopté le 9 novembre 2017 : aucun progrès sur l'usage des langues minoritaires avec l'administration et sur la signalisation, dispositions législatives des entités « largement non-opérationnelles » (§ 16).", annee: 2017, source: "https://rm.coe.int/4th-op-bih-fr/16808e2c54"}
