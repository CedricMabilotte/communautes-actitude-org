resume: >-
  L'île Lord Howe, rattachée à la Nouvelle-Galles du Sud depuis 1855, est administrée par le Lord Howe Island Board, un organisme public (statutory authority) créé par le Lord Howe Island Act 1953. La loi définit un statut d'« Islander » (insulaire) : personnes résidant sur l'île avant le 1er janvier 1982 et titulaires, ou proches d'un titulaire, d'une autorisation d'occupation antérieure au 22 avril 1954, et toute personne y résidant de façon continue depuis 10 ans. Depuis 1982, des Islanders élus par les résidents siègent au Board ; depuis 2004, ils en occupent 4 sièges sur 7, sous la direction du ministre de l'État. Toute la terre reste propriété de la Couronne et les baux perpétuels résidentiels sont réservés aux Islanders, sauf si aucun Islander n'est preneur.
