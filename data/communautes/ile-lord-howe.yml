droits:
  autogouvernement: {valeur: "partiel", note: "Le Lord Howe Island Board compte 7 membres : 4 Islanders élus par les résidents et 3 membres nommés par le ministre (Lord Howe Island Act 1953, modifié en 2004) ; le Board est chargé de la garde, du contrôle et de la gestion de l'île, de ses affaires et de son commerce, et reste soumis en tout (hors rapports et recommandations) à la direction et au contrôle du ministre de l'Environnement de Nouvelle-Galles du Sud.", source: "https://www.lhib.nsw.gov.au/about"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Toute la terre de l'île appartient à la Couronne et aucun titre de pleine propriété (freehold) ne peut y être créé ; le ministre ne peut accorder de bail perpétuel résidentiel qu'à un Islander, et un bail ne passe à un non-Islander que si le Board constate qu'aucun Islander n'est disposé à le reprendre (Lord Howe Island Act 1953, art. 23(4)) ; tout transfert est approuvé par le ministre sur recommandation du Board, et un transfert à un non-Islander exige aussi l'accord du gouverneur.", source: "https://www.lhib.nsw.gov.au/sites/default/files/2023-11/Information%20Sheet%203%20-%20Owning%20and%20Inheriting%20Land%20on%20Lord%20Howe%20Island.PDF"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La loi définit l'Islander (insulaire) : personne ayant résidé sur l'île de façon continue pendant les 10 dernières années, ou y résidant avant le 1er janvier 1982 et titulaire, ou proche d'un titulaire, d'une autorisation d'occupation antérieure au 22 avril 1954 ; ce statut ouvre la priorité sur les baux et l'éligibilité au Board (Lord Howe Island Act 1953, modifié en 1982).", source: "https://www.lhib.nsw.gov.au/sites/default/files/2022-09/Information%20Sheet%204%20-%20Who%20is%20a%20Lord%20Howe%20Islander.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Selon le Board lui-même, il siège avec 4 Islanders élus dont les mandats courent jusqu'au 28 février 2027 et 3 membres nommés, dont la présidence ; les transferts de baux vers des non-Islanders suivent une procédure publique d'annonce prévue par sa politique de transfert. Aucune évaluation indépendante (rapport d'audit, décision de justice, étude universitaire) n'a été trouvée.", source: "https://www.lhib.nsw.gov.au/about/board-members"}
chronologie:
  - {annee: 1855, evenement: "L'île est incluse dans la colonie de Nouvelle-Galles du Sud."}
  - {annee: 1913, evenement: "Premier Lord Howe Island Board, composé de 3 fonctionnaires de Sydney, avec un comité consultatif de résidents."}
  - {annee: 1953, evenement: "Lord Howe Island Act : Board de 5 membres nommés, comité insulaire de 4 membres élus, baux perpétuels réservés aux Islanders."}
  - {annee: 1982, evenement: "Entrée en vigueur des amendements de 1981 : 3 Islanders élus sur 5 membres du Board, suppression du comité insulaire, statut d'Islander ouvert aux résidents de 10 ans, création de la réserve permanente (Permanent Park Preserve)."}
  - {annee: 1982, evenement: "Inscription du groupe de Lord Howe sur la Liste du patrimoine mondial de l'UNESCO."}
  - {annee: 2004, evenement: "Board porté à 7 membres, dont 4 Islanders élus ; fin du monopole du Board sur le commerce des graines de palmier kentia."}
  - {annee: 2014, evenement: "Lord Howe Island Regulation 2014 (élections, transferts de baux, loyers)."}
