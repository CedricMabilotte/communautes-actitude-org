resume: >-
  Les Tłı̨chǫ, auparavant désignés sous le nom de Dogrib (flanc-de-chien), vivent dans les Territoires du Nord-Ouest. L'Accord sur les revendications territoriales et l'autonomie gouvernementale, signé le 25 août 2003 avec le Canada et les Territoires du Nord-Ouest, est entré en vigueur le 4 août 2005. Il institue le Gouvernement tłı̨chǫ, doté d'un pouvoir législatif, et attribue environ 39 000 km² de terres, sous-sol compris. Quatre gouvernements communautaires tłı̨chǫ ont remplacé les bandes et les municipalités.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14, art. 4 a)) confirme que la Déclaration « trouve application en droit canadien ».", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Accord sur les revendications territoriales et l'autonomie gouvernementale du peuple tłı̨chǫ (Tłı̨chǫ Agreement)", nature: "accord_revendication", annee: 2003, source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  - {instrument: "Loi sur les revendications territoriales et l'autonomie gouvernementale du peuple tlicho (L.C. 2005, ch. 1)", nature: "loi", annee: 2005, source: "https://laws-lois.justice.gc.ca/fra/lois/T-11.3/page-1.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le Gouvernement tłı̨chǫ légifère sur sa propre structure et sa gestion interne, Accord tłı̨chǫ, art. 7.4.1 a) (2003) ; il est l'autorité gouvernante sur les terres tłı̨chǫ selon le gouvernement des T.N.-O.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Pouvoir de légiférer sur les terres et leurs ressources (art. 7.4.2), la pêche (7.4.3), la langue, la culture, les services sociaux, l'éducation, l'adoption, les successions et le mariage (7.4.4), avec pouvoir de sanction (7.4.6).", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  justice_propre: {valeur: "partiel", note: "Le Gouvernement tłı̨chǫ peut fournir aux citoyens des services de règlement des différends hors des tribunaux, art. 7.4.4 o), et légiférer sur l'application de ses lois (fouille, saisie, amendes), art. 7.4.6 ; aucun tribunal propre n'est prévu par ces articles.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  terres: {valeur: "reconnu", note: "Le Gouvernement tłı̨chǫ détient, au nom de la Première Nation, le titre sur environ 39 000 km², mines et minéraux compris, art. 18.1.1 ; ces terres ne peuvent être saisies ni hypothéquées, art. 18.1.12 et 18.1.13.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  ressources: {valeur: "reconnu", note: "Titre sur les mines et minéraux des terres tłı̨chǫ, art. 18.1.1 ; pouvoir de légiférer sur les ressources renouvelables et non renouvelables de ces terres, art. 7.4.2 ; part des redevances minières perçues par l'État dans la vallée du Mackenzie : 10,429 % des deux premiers millions de dollars et 2,086 % au-delà, chaque année, art. 25.1.1.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  consentement: {valeur: "partiel", note: "L'Office des terres et des eaux du Wek'èezhìi et l'Office d'examen des répercussions environnementales de la vallée du Mackenzie examinent les projets et doivent tenir compte du savoir traditionnel, Accord tłı̨chǫ, chapitre 22, art. 22.1.7 ; mécanisme de participation, sans droit de refus. La Loi sur la gestion des ressources de la vallée du Mackenzie, à jour au 21 septembre 2026, maintient l'Office du Wekeezhii (art. 57.1) : deux de ses cinq membres sont nommés par le Gouvernement tłı̨chǫ.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  langue: {valeur: "reconnu", note: "Le tłı̨chǫ figure parmi les onze langues officielles des Territoires du Nord-Ouest ; le Gouvernement tłı̨chǫ légifère sur la protection et la promotion de la langue, Accord, art. 7.4.4 a) et b).", source: "https://www.axl.cefan.ulaval.ca/amnord/tno.htm"}
  education: {valeur: "partiel", note: "Pouvoir de légiférer sur l'éducation, sauf postsecondaire, des citoyens tłı̨chǫ, y compris l'enseignement de la langue, mais sans la certification générale des enseignants, art. 7.4.4 j) et m).", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  fiscalite: {valeur: "partiel", note: "Pouvoir de légiférer en matière d'impôts directs sur les citoyens tłı̨chǫ sur les terres tłı̨chǫ ou dans une collectivité tłı̨chǫ, art. 7.4.5.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Est citoyen tłı̨chǫ la personne inscrite au registre (Accord, chapitre 1, définitions) ; peuvent s'inscrire les personnes tłı̨chǫ citoyennes ou résidentes permanentes du Canada et les personnes admises selon la procédure d'acceptation communautaire de la Constitution tłı̨chǫ, art. 3.1.1 ; le registraire est désigné par le Gouvernement tłı̨chǫ, art. 3.2.2.", source: "https://www.eia.gov.nt.ca/sites/eia/files/tlicho_land_claims_and_self-government_agreement.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Selon Cabin Radio (média de Yellowknife), le grand chef tłı̨chǫ est élu au suffrage des citoyens tłı̨chǫ : Jackson Lafferty, élu en 2021, a été réélu le 29 septembre 2025 avec 962 voix contre 689 et une participation de 60 % ; les quatre gouvernements communautaires ont tenu leurs élections de chef et de conseil en juin 2025.", source: "https://cabinradio.ca/260931/news/politics/jackson-lafferty-re-elected-as-tli%cc%a8ch%c7%ab-grand-chief/"}
chronologie:
  - {annee: 2003, evenement: "Signature de l'Accord le 25 août par le Conseil du Traité 11 des Dogrib, le Canada et les T.N.-O."}
  - {annee: 2005, evenement: "Loi fédérale sanctionnée le 15 février ; entrée en vigueur de l'Accord et création des gouvernements communautaires le 4 août."}
  - {annee: 2021, evenement: "Élection de Jackson Lafferty au poste de grand chef ; premier scrutin ouvert au vote en ligne."}
  - {annee: 2025, evenement: "Élections de chef et de conseil dans les quatre collectivités en juin ; réélection de Jackson Lafferty comme grand chef le 29 septembre ; accord de coopération avec la Première Nation des Dénés Yellowknives sur le projet de corridor routier vers le Nunavut en novembre."}
  - {annee: 2026, evenement: "Le gouvernement des T.N.-O. rejoint l'accord sur le corridor en janvier ; en août, les deux gouvernements autochtones proposent un tracé d'environ 30 km de large."}
