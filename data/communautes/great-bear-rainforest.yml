  - {instrument: "Central and North Coast Biodiversity, Mining and Tourism Area Order (décret 0002-2009 du 9 janvier 2009, pris en vertu de l'Environment and Land Use Act, art. 7), art. 3 (objectifs, dont les usages sociaux, cérémoniels et culturels des premières nations) et 4 (consultation des premières nations)", nature: "loi", annee: 2009, source: "https://www.bclaws.gov.bc.ca/civix/document/id/oic/arc_oic/0002_2009"}
  - {instrument: "Accord régional Coastal First Nations – Colombie-Britannique (Accord for Co-Governance, Environmental Stewardship, Economic Renewal and Local Community Well-Being in the Pacific North Coast), 14 août 2024 ; son art. 10.3 met fin au protocole de réconciliation du 10 décembre 2009 pour les nations membres", nature: "accord_revendication", annee: 2024, source: "https://www2.gov.bc.ca/assets/gov/environment/natural-resource-stewardship/consulting-with-first-nations/agreements/240814_cfn-bc_ra_fully_signed.pdf"}
  - {instrument: "Nanwakolas Reconciliation Protocol (29 juillet 2011), modifié en 2011, 2015 et le 2 mai 2016", nature: "accord_revendication", annee: 2011, source: "https://www2.gov.bc.ca/assets/gov/environment/natural-resource-stewardship/consulting-with-first-nations/agreements/nanwakolas_reconciliation_protocal_signed_-_2016.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'accord régional de 2024, signé par la province et sept nations membres de la Coastal First Nations représentées par leur chef et leur conseil (ou par le Conseil de la nation haïda), crée un forum de travail de gouvernement à gouvernement à trois niveaux (art. 6.1 et 6.2) et confie à la Great Bear Initiative Society, mandatée par ces nations, la coordination et la réception des fonds (art. 5.1) ; le protocole Nanwakolas de 2011 confie au conseil Nanwakolas la relation de gouvernement à gouvernement sur les terres et les ressources (art. 4.2) et s'appuie sur le forum stratégique Nanwakolas créé en 2009 (art. 5). Ces instances recommandent ; l'accord de 2024 ne limite pas le pouvoir de décision de la province (art. 19.1).", source: "https://www2.gov.bc.ca/assets/gov/environment/natural-resource-stewardship/consulting-with-first-nations/agreements/240814_cfn-bc_ra_fully_signed.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'ordonnance de 2023 impose de maintenir un volume de cèdre, fixé lors de la concertation, pour les usages des premières nations (Indigenous tree use), de maintenir les cèdres monumentaux dans les aires d'intendance du cèdre et d'éviter, dans la mesure du possible, la coupe dans les sites de ressources forestières autochtones (parties 2 et 3, art. 5 et 8) ; le Park Act fixe parmi les objectifs des conservancies la préservation des usages sociaux, cérémoniels et culturels des premières nations (art. 5(3.1)(b)), comme le décret 0002-2009 pour les zones de biodiversité, d'extraction minière et de tourisme (art. 3(b)).", source: "https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/natural-resource-use/land-water-use/crown-land/land-use-plans-and-objectives/westcoast-region/great-bear-rainforest/great_bear_rainforest_land_use_objectives_order_june_2023.pdf"}
  consentement: {valeur: "partiel", note: "L'ordonnance de 2023 impose une concertation avec les premières nations concernées (First Nation engagement : partage d'informations, dialogue, recherche de solutions) pour sa mise en œuvre (partie 1, art. 3) ; un site patrimonial autochtone de type 1 ou 2 et sa zone tampon peuvent être modifiés avec l'appui ou l'absence d'objection des premières nations concernées (parties 2 et 3, art. 6(3) et 6(7)), mais la zone tampon peut aussi l'être sans cet appui pour une route ou un motif de sécurité sans autre solution praticable, après simple concertation (art. 6(4) et 6(8)) ; une demande de coupe dans un bassin versant halieutique sans évaluation complète exige l'appui ou l'absence d'objection des premières nations (parties 2 et 3, art. 10(2)(b)). Le cadre de décision collaborative de l'accord de 2024 (annexe 7) vise des recommandations consensuelles ; le décideur provincial peut s'en écarter en donnant une explication écrite (annexe 7, art. 9.4).", source: "https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/natural-resource-use/land-water-use/crown-land/land-use-plans-and-objectives/westcoast-region/great-bear-rainforest/great_bear_rainforest_land_use_objectives_order_june_2023.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'accord régional de 2024 prévoit un financement provincial de 6,7 millions de dollars versé à la Great Bear Initiative Society pour les exercices 2024-2025 à 2027-2028, sous réserve des crédits votés (art. 14.1 et 14.5), et reconnaît le rôle des revenus tirés de la vente des crédits carbone liés aux décisions d'utilisation des terres de la région (art. 14.7) ; la province a versé au conseil Nanwakolas 200 000 dollars par an pendant cinq ans à partir d'avril 2015 (protocole Nanwakolas, art. 13.6, modifié en 2015). Aucun pouvoir fiscal ni budget garanti n'est prévu.", source: "https://www2.gov.bc.ca/assets/gov/environment/natural-resource-stewardship/consulting-with-first-nations/agreements/240814_cfn-bc_ra_fully_signed.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Deborah Curran (McGill Law Journal, 2017) relève que le cadre de concertation alors en vigueur n'atteint pas une véritable décision conjointe et que la province conserve l'autorité de décision ultime ; selon elle, les règles écologiques négociées puis adoptées en droit restreignent toutefois fortement la marge des décideurs provinciaux sur le terrain. Cette analyse précède l'accord régional de 2024. Selon la province, les premiers plans de réserves paysagères ont été approuvés de gouvernement à gouvernement en 2021, et une politique provisoire retarde les décisions de coupe dans les zones sans plan approuvé par les premières nations. Le cadre provincial de septembre 2025 (version 1.3) maintient cette approbation de gouvernement à gouvernement et prévoit un réexamen de l'ordonnance en 2026.", source: "https://lawjournal.mcgill.ca/article/legalizing-the-great-bear-rainforest-agreements-colonial-adaptations-toward-reconciliation-and-conservation/"}
chronologie:
  - {annee: 1996, evenement: "Début de la planification de l'utilisation des terres et des ressources sur la côte de la Colombie-Britannique."}
  - {annee: 2001, evenement: "Annonce d'un accord intérimaire sur la planification de la côte centrale."}
  - {annee: 2006, evenement: "La province et les premières nations annoncent la décision sur l'utilisation des terres de la côte (Coast Land Use Decision) ; protocole sur les terres et les ressources entre la Coastal First Nations et la province."}
  - {annee: 2009, evenement: "114 conservancies et 21 zones de biodiversité, d'extraction minière et de tourisme établies entre 2006 et 2009 (décret 0002-2009 du 9 janvier) ; protocole de réconciliation avec la Coastal First Nations (10 décembre) ; accord de partage des bénéfices atmosphériques."}
  - {annee: 2011, evenement: "Protocole de réconciliation Nanwakolas (29 juillet)."}
  - {annee: 2016, evenement: "Ordonnance sur les objectifs d'utilisation des terres (21 janvier) ; Great Bear Rainforest (Forest Management) Act (19 mai) ; huit zones spéciales d'aménagement forestier désignées (B.C. Reg. 325/2016)."}
  - {annee: 2017, evenement: "Modification du protocole de la Coastal First Nations et nouveau cadre de concertation (16 mars)."}
  - {annee: 2023, evenement: "Nouvelle ordonnance sur les objectifs d'utilisation des terres (9 juin), qui abroge celle de 2016 et précise les exigences de concertation avec les premières nations."}
  - {annee: 2024, evenement: "Désignation de la zone spéciale d'aménagement forestier M̓aćinuxʷ (B.C. Reg. 113/2024) ; accord régional entre la Coastal First Nations et la province (14 août), qui met fin au protocole de 2009 pour les nations membres."}
  - {annee: 2025, evenement: "Version 1.3 du cadre de conception des réserves paysagères (septembre) : les plans sont approuvés de gouvernement à gouvernement par la province, la Coastal First Nations et le conseil Nanwakolas ; un réexamen de l'ordonnance est prévu en 2026."}
fiabilite:
  verifie:
    - "Texte consolidé du Great Bear Rainforest (Forest Management) Act (art. 6 et 50 à 53) et du B.C. Reg. 325/2016 (9 zones spéciales d'aménagement forestier, dont M̓aćinuxʷ ajoutée en 2024) sur BC Laws."
    - "Ordonnance de 2023 : fondement (Land Act, art. 93.4), définition de la concertation, art. 3, 5, 6, 8 et 10 des parties 2 et 3, aire de 3 108 876 ha de forêt protégée et réservée (partie 1, art. 6)."
    - "Park Act, art. 4.2 et 5(3.1)(b)."
    - "Protocole de 2009 avec la Coastal First Nations (texte modifié en 2017) ; accord régional de 2024 : signataires, art. 5, 6, 9, 10.3 (fin du protocole de 2009), 14 et annexe 7 ; protocole Nanwakolas : signataires, art. 4.2, 5, 13.6."
    - "Liste des 26 premières nations, 6,4 millions d'hectares et 18 000 habitants sur les pages de la province."
    - "Révision d'octobre 2026 : la loi de 2016 et le Park Act sont à jour au 22 septembre 2026 sur BC Laws, le B.C. Reg. 325/2016 au 29 septembre 2026 (dernière modification : B.C. Reg. 113/2024) ; aucune modification de l'ordonnance de 2023 ni aucun nouvel accord régional n'a été trouvé depuis août 2024 ; signataires de l'accord de 2024 relus (six nations représentées par leur chef et leur conseil, la nation haïda par le Conseil de la nation haïda)."
    - "Décret 0002-2009 (image numérisée sur BC Laws) : date du 9 janvier 2009, art. 3 et 4, noms et superficies des 21 zones de biodiversité, d'extraction minière et de tourisme (annexe)."
  non_confirme:
    - "Les superficies des 21 zones de biodiversité, d'extraction minière et de tourisme sont celles du décret de 2009 ; d'éventuelles modifications ultérieures n'ont pas été recherchées. Les superficies des 9 zones spéciales d'aménagement forestier n'ont pas été trouvées."
    - "La liste des 114 conservancies situées dans la région n'a pas été trouvée sous forme officielle ; elles ne figurent pas au tableau."
    - "Le chiffre de 18 000 habitants ne précise pas son année ni sa source statistique ; la part des membres des premières nations n'est pas donnée."
    - "Les accords de 2006 n'ont pas été ouverts. L'accord de 2024 est une image numérisée, lue par reconnaissance de caractères. Aucun accord postérieur à 2016 n'a été trouvé pour le conseil Nanwakolas."
    - "Aucun rapport d'un organe de l'ONU nommant ce régime n'a été trouvé."
    - "Le réexamen de l'ordonnance prévu en 2026 et l'objectif de coupe annuelle de 2,5 millions de m³ fixé jusqu'au 31 décembre 2026 (préambule de l'ordonnance de 2023) : aucune décision publiée n'a été trouvée au 6 octobre 2026."
    - "Nombre de villages et de localités : la province cite 7 communautés (dont Prince Rupert et Kitimat), sans liste exhaustive."
