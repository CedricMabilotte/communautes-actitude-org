  - {instrument: "Great Bear Rainforest Land Use Objectives Order, arrêté du ministre des Forêts du 9 juin 2023 pris en vertu du Land Act (RSBC 1996, ch. 245), art. 93.4, remplaçant l'ordonnance du 21 janvier 2016", nature: "loi", annee: 2023, source: "https://www2.gov.bc.ca/assets/gov/farming-natural-resources-and-industry/natural-resource-use/land-water-use/crown-land/land-use-plans-and-objectives/westcoast-region/great-bear-rainforest/great_bear_rainforest_land_use_objectives_order_june_2023.pdf"}
