resume: >-
  Fiche agrégée : elle couvre les 26 premières nations dont le territoire chevauche la forêt pluviale du Grand Ours, sur la côte centrale et nord de la Colombie-Britannique. Le régime est issu de négociations de gouvernement à gouvernement entre la province, la Coastal First Nations et le conseil Nanwakolas : décision sur l'utilisation des terres de la côte (2006), protocoles de réconciliation de 2009 et 2011, Great Bear Rainforest (Forest Management) Act de 2016, ordonnance sur les objectifs d'utilisation des terres (Land Use Objectives Order) de 2016 remplacée en 2023, et accord régional de 2024 qui met fin au protocole de 2009 pour les nations membres de la Coastal First Nations. L'ordonnance de 2023 impose une concertation avec les premières nations concernées (First Nation engagement) et leur appui ou leur absence d'objection pour modifier certains sites patrimoniaux ; entre 2006 et 2009, la province a créé 114 conservancies (aires protégées où les usages sociaux, cérémoniels et culturels des premières nations sont un objectif légal) et 21 zones de biodiversité, d'extraction minière et de tourisme. La décision finale reste à la province.
