  non_confirme: ["Population : aucun chiffre ukrainien postérieur à 2001 ; le recensement russe de 2014 en Crimée n'est pas retenu (territoire hors du contrôle de l'Ukraine).", "Nombre de lieux : sans objet pour un régime à base mixte sans territoire délimité ; non renseigné.", "Représentation : la loi de 2021, art. 2, al. 4, prévoit que l'État favorise la représentation au Parlement et dans les assemblées de Crimée ; aucun siège réservé trouvé.", "Élections du Qurultay postérieures à 2013 : non vérifiées."]
