resume: >-
  Les Tatars de Crimée sont reconnus comme peuple autochtone de l'Ukraine par une résolution de la Verkhovna Rada (Parlement) de 2014 et par la Loi sur les peuples autochtones de l'Ukraine du 1er juillet 2021, qui vise aussi les Karaïmes et les Krymtchaks. La résolution de 2014 reconnaît le Qurultay comme organe représentatif suprême et le Mejlis comme son organe exécutif. La loi de 2021 leur reconnaît un droit à l'autodétermination au sein de l'Ukraine ; le 3 avril 2026, le Conseil des ministres a conféré au Mejlis le statut juridique d'organe représentatif prévu par cette loi. Depuis 2014, la péninsule est sous contrôle russe ; l'Assemblée générale des Nations unies a affirmé l'intégrité territoriale de l'Ukraine (résolution 68/262 du 27 mars 2014). Les autorités russes ont interdit le Mejlis en 2016. Les Karaïmes et les Krymtchaks ont leur propre fiche (« Karaïmes et Krymtchaks de Crimée »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur l'Ukraine (ACFC/OP/IV(2018)001, adopté le 10 mars 2017), § 19, 20 et 59 : loi du 17 avril 2014 sur le rétablissement des droits des personnes déportées, retards dans la formalisation du statut du Mejlis, enseignement du tatar de Crimée dans une seule école du continent (région de Kherson).", annee: 2017, source: "https://rm.coe.int/fourth-opinion-on-ukraine-adopted-on-10-march-2017-published-on-5-marc/16807930cf"}
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La Verkhovna Rada déclare soutenir la Déclaration des Nations unies sur les droits des peuples autochtones et reconnaît le peuple tatar de Crimée comme autochtone, résolution n° 1140-VII du 20 mars 2014, points 1 et 4 ; la loi de 2021 vise la Déclaration dans son préambule. L'Ukraine s'était abstenue lors du vote de la Déclaration par l'Assemblée générale le 13 septembre 2007.", annee: 2014, source: "https://zakon.rada.gov.ua/laws/show/1140-18"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale sur l'Ukraine (CERD/C/UKR/CO/22-23), § 23 et 24 sur la situation des Tatars de Crimée.", annee: 2016, source: "https://documents.un.org/doc/undoc/gen/g16/223/14/pdf/g1622314.pdf"}
base_nationale:
  - {instrument: "Constitution de l'Ukraine, art. 11 et 92", nature: "constitution", annee: 1996, source: "https://www.constituteproject.org/constitution/Ukraine_2019"}
  - {instrument: "Résolution de la Verkhovna Rada n° 1140-VII du 20 mars 2014 sur la garantie des droits du peuple tatar de Crimée", nature: "loi", annee: 2014, source: "https://zakon.rada.gov.ua/laws/show/1140-18"}
  - {instrument: "Loi n° 1616-IX du 1er juillet 2021 sur les peuples autochtones de l'Ukraine", nature: "loi", annee: 2021, source: "https://zakon.rada.gov.ua/laws/show/1616-20"}
  - {instrument: "Ordre du Conseil des ministres n° 303-r du 3 avril 2026 conférant au Mejlis le statut juridique d'organe représentatif du peuple tatar de Crimée", nature: "loi", annee: 2026, source: "https://web.archive.org/web/20260411072236/https://zakon.rada.gov.ua/laws/show/303-2026-%D1%80"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'Ukraine reconnaît le Qurultay comme organe représentatif suprême et le Mejlis comme son organe exécutif, résolution de 2014, point 3 ; la loi de 2021, art. 2, al. 2, reconnaît un droit à l'autonomie dans les affaires internes ; l'ordre du Conseil des ministres n° 303-r du 3 avril 2026 confère au Mejlis le statut juridique d'organe représentatif prévu à l'art. 8, al. 1, de la loi ; ce statut ne comporte pas de pouvoir normatif.", source: "https://web.archive.org/web/20260411072236/https://zakon.rada.gov.ua/laws/show/303-2026-%D1%80"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le Conseil des ministres fixe, après consultation des organes représentatifs, la réservation de terres pour les membres des peuples autochtones qui reviennent en Crimée, loi de 2021, art. 7, al. 4.", source: "https://zakon.rada.gov.ua/laws/show/1616-20"}
  ressources: {valeur: "partiel", note: "Les organes représentatifs interagissent avec les autorités sur l'usage des terres, eaux et forêts de Crimée, loi de 2021, art. 7, al. 2 ; le droit à une part des recettes tirées des ressources naturelles, art. 7, al. 3, n'entrera en vigueur qu'après le retour de la Crimée sous juridiction ukrainienne, art. 11.", source: "https://zakon.rada.gov.ua/laws/show/1616-20"}
  consentement: {valeur: "partiel", note: "Participation aux programmes publics qui les concernent sur la base du consentement libre, préalable et éclairé, loi de 2021, art. 7, al. 1 ; consultation obligatoire des organes représentatifs avant les actes de l'exécutif sur la langue, la culture, l'éducation et les médias, art. 8, al. 2, selon la procédure fixée par la résolution du Conseil des ministres n° 1018 du 19 août 2022 ; l'ordre n° 303-r du 3 avril 2026 rend cette consultation applicable au Mejlis. Le consentement n'est pas une condition de validité des actes.", source: "https://web.archive.org/web/20260411072236/https://zakon.rada.gov.ua/laws/show/303-2026-%D1%80"}
  langue: {valeur: "partiel", note: "L'État garantit la possibilité d'apprendre les langues des peuples autochtones et leur préservation, loi de 2021, art. 5, al. 3 et 4 ; le tatar de Crimée n'a pas de statut de langue officielle.", source: "https://zakon.rada.gov.ua/laws/show/1616-20"}
  education: {valeur: "partiel", note: "Les peuples autochtones peuvent créer leurs propres établissements d'enseignement, y compris avec enseignement dans leur langue, dans le cadre de la loi sur l'éducation, loi de 2021, art. 5, al. 1.", source: "https://zakon.rada.gov.ua/laws/show/1616-20"}
  fiscalite: {valeur: "partiel", note: "L'activité des organes représentatifs est financée par le budget de l'État au titre d'un programme budgétaire distinct, loi de 2021, art. 9, al. 2 ; aucun pouvoir fiscal.", source: "https://zakon.rada.gov.ua/laws/show/1616-20"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Les autorités russes ont interdit le Mejlis comme « extrémiste » en 2016 ; il siège depuis à Kyiv (Minority Rights Group). La Cour internationale de justice a jugé le 31 janvier 2024 que la Russie, en maintenant des restrictions au Mejlis, a violé son ordonnance de mesures conservatoires du 19 avril 2017, et a rejeté les autres demandes de l'Ukraine fondées sur la Convention sur l'élimination de la discrimination raciale. Les droits de la loi de 2021 liés aux terres et ressources de Crimée ne s'exercent pas sur un territoire hors du contrôle de l'Ukraine.", source: "https://www.icj-cij.org/node/203486"}
chronologie:
  - {annee: 2014, evenement: "Résolution de la Verkhovna Rada reconnaissant le peuple tatar de Crimée comme autochtone, ainsi que le Qurultay et le Mejlis (20 mars)  ; la Russie prend le contrôle de la Crimée ; l'Assemblée générale des Nations unies affirme l'intégrité territoriale de l'Ukraine (résolution 68/262, 27 mars)."}
  - {annee: 2016, evenement: "Interdiction du Mejlis par les autorités russes."}
  - {annee: 2017, evenement: "Ordonnance de la Cour internationale de justice : la Russie doit s'abstenir de restreindre les institutions représentatives tatares, dont le Mejlis (19 avril)."}
  - {annee: 2021, evenement: "Loi sur les peuples autochtones de l'Ukraine (1er juillet)."}
  - {annee: 2022, evenement: "Le Conseil des ministres fixe la procédure d'attribution du statut d'organe représentatif (résolution n° 936) et celle des consultations (résolution n° 1018), 19 août."}
  - {annee: 2024, evenement: "Arrêt de la Cour internationale de justice constatant la violation de l'ordonnance de 2017 (31 janvier)."}
  - {annee: 2026, evenement: "Ordre du Conseil des ministres n° 303-r conférant au Mejlis le statut juridique d'organe représentatif (3 avril)."}
