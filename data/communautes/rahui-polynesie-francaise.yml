base_nationale:
  - {instrument: "Loi du pays n° 2017-25 du 5 octobre 2017 relative au code de l'environnement de la Polynésie française : art. LP. 2111-1 à LP. 2113-2 (espaces naturels protégés), LP. 2121-4 (restrictions par des règles non écrites appliquées de manière traditionnelle) et LP. 2122-1 (rāhui)", nature: "loi", annee: 2017, source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/c037f33d-7ed2-4f27-b9bd-ea538929b7b4/PF_Loi%20du%20Pays%20n%C2%B0%202017-25%20du%205%20octobre%202017%20relative%20au%20code%20de%20l%27environnement%20de%20la%20Polyn%C3%A9sie%20fran%C3%A7aise.pdf"}
  - {instrument: "Délibération n° 88-183 AT du 8 décembre 1988 portant réglementation de la pêche, art. 17 bis (rédaction de la délibération n° 96-151 APF du 5 décembre 1996) : le conseil des ministres peut, sur proposition du ministre chargé de la mer, fixer par arrêté pour des parties délimitées du domaine public des restrictions ou prohibitions, permanentes ou temporaires, de certains moyens et techniques de pêche ; art. 18 : contraventions de 5e classe", nature: "loi", annee: 1988, source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/813d18ae-f0aa-48c5-b66b-03cf9067202c/PF_D%C3%A9lib%C3%A9ration%20n%C2%B088-183%20du%208%20d%C3%A9cembre%201988%20portant%20r%C3%A9glementation%20de%20la%20p%C3%AAche.pdf"}
  - {instrument: "Arrêtés du conseil des ministres créant chaque zone de pêche réglementée et son comité de gestion (exemple : arrêté n° 1204 CM du 12 juillet 2018, Tautira, art. 5 et 6)", nature: "loi", annee: 2018, source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/d649f384-fc51-442d-ae60-67c8f3b5ab84/PF_Arr%C3%AAt%C3%A9%20n%C2%B0%201204%20du%2012%20juillet%202018%20r%C3%A9glementant%20la%20p%C3%AAche%20sur%20le%20domaine%20public%20maritime%20au%20droit%20de%20la%20commune%20associ%C3%A9e%20de%20Tautira.pdf"}
  - {instrument: "Arrêté n° 864 CM du 6 juin 2014 portant classement du rāhui de Teahupo'o, et arrêté n° 971 CM du 27 juin 2014 (cités par Fabre et al., 2022)", nature: "loi", annee: 2014, source: "https://journals.openedition.org/rac/27989"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les arrêtés de création des ZPR instituent un comité de gestion local ; certaines ZPR anciennes n'en ont pas encore, selon la Direction des ressources marines. À Tautira, l'arrêté n° 1204 CM du 12 juillet 2018 crée le « Tomite Rahui Tahunatara Vaionifa No Tautira », composé du maire délégué, du service de la pêche, de la coopérative de pêche, de représentants des pêcheurs, des résidents et des confessions religieuses, qui fixe son fonctionnement par un règlement intérieur (art. 5 et 6). Le comité propose et suit ; la décision reste au conseil des ministres. Le panneau officiel de 2023, qui renvoie à l'arrêté n° 39 CM du 15 janvier 2021, mentionne toujours ce comité et son président.", source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/d649f384-fc51-442d-ae60-67c8f3b5ab84/PF_Arr%C3%AAt%C3%A9%20n%C2%B0%201204%20du%2012%20juillet%202018%20r%C3%A9glementant%20la%20p%C3%AAche%20sur%20le%20domaine%20public%20maritime%20au%20droit%20de%20la%20commune%20associ%C3%A9e%20de%20Tautira.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le code de l'environnement admet que l'activité humaine soit restreinte dans le sanctuaire marin « par des règles non écrites appliquées de manière traditionnelle, dans la mesure où elles ne contredisent pas les dispositions du présent code » (art. LP. 2121-4) et définit le rāhui par ces règles (art. LP. 2122-1). Les règles opposables des ZPR sont toutefois fixées par arrêté du conseil des ministres pris en application des délibérations n° 88-183 AT et n° 88-184 AT ; le comité de gestion en propose le contenu (arrêté n° 1204 CM du 12 juillet 2018, art. 5).", source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/c037f33d-7ed2-4f27-b9bd-ea538929b7b4/PF_Loi%20du%20Pays%20n%C2%B0%202017-25%20du%205%20octobre%202017%20relative%20au%20code%20de%20l%27environnement%20de%20la%20Polyn%C3%A9sie%20fran%C3%A7aise.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'arrêté de chaque ZPR fixe des règles de pêche propres à la zone. À Tautira, l'arrêté n° 1204 CM du 12 juillet 2018 crée une sous-zone de réserve où toute pêche est interdite en tout temps et deux sous-zones fermées dont le comité de gestion propose la périodicité et les modalités d'ouverture (art. 2 à 5) ; les infractions relèvent des sanctions des délibérations n° 88-183 AT et n° 88-184 AT (art. 7), soit une contravention de 5e classe, environ 179 000 F CFP selon la Direction des ressources marines. La décision reste au conseil des ministres.", source: "https://www.spc.int/CoastalFisheries/CFM/Document/Get/d649f384-fc51-442d-ae60-67c8f3b5ab84/PF_Arr%C3%AAt%C3%A9%20n%C2%B0%201204%20du%2012%20juillet%202018%20r%C3%A9glementant%20la%20p%C3%AAche%20sur%20le%20domaine%20public%20maritime%20au%20droit%20de%20la%20commune%20associ%C3%A9e%20de%20Tautira.pdf"}
  consentement: {valeur: "partiel", note: "Selon la Direction des ressources marines, une ZPR naît d'une demande de la commune, suivie de travaux participatifs avec pêcheurs, élus et société civile, puis d'une consultation publique, avant adoption par le conseil des ministres. Pour un classement au titre du code de l'environnement, seules les communes ou la Polynésie française peuvent demander le classement (art. LP. 2111-3), les communes sont consultées et une enquête publique est menée (art. LP. 2111-5 et LP. 2111-6). Il s'agit de consultation, pas de consentement.", source: "https://www.ressources-marines.gov.pf/cartes-thematiques/zpr/"}
