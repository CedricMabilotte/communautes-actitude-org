resume: >-
  Fiche agrégée : elle couvre les communautés littorales de Polynésie française qui gèrent un rāhui (interdit temporaire de prélèvement sur une zone, pratique polynésienne) ou une zone de pêche réglementée (ZPR). Le code de l'environnement, dans sa partie adoptée par la loi du pays n° 2017-25 du 5 octobre 2017, définit le rāhui comme « un espace terrestre et/ou marin sur lequel des règles non écrites dictées par un impératif de gestion des ressources sont appliquées de manière traditionnelle » (art. LP. 2122-1). Les ZPR sont créées par arrêté du conseil des ministres pris en application des délibérations n° 88-183 AT et n° 88-184 AT du 8 décembre 1988 sur la pêche ; selon la Direction des ressources marines, la demande vient de la commune et le projet passe par des travaux participatifs et une consultation publique. Un comité de gestion local, nommé tōmite rāhui à Tautira et à Teahupo'o, associe commune, pêcheurs, habitants et administration ; certaines ZPR anciennes n'en ont pas encore. La Direction des ressources marines comptait 34 ZPR en septembre 2023 ; le rāhui de Teahupo'o (Tahiti), classé en 2014 au titre du code de l'environnement, couvre 760 hectares.
