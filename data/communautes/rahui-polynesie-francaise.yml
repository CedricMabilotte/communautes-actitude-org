effectivite: {valeur: "partielle", note: "Fabre et al. (2022), après une enquête de terrain de 2017 à 2021 à Teahupo'o, décrivent un comité de gestion (tōmite rāhui) qui fonctionne comme une association mais sans budget propre, des dépenses engagées par la Direction de l'environnement, des demandes d'autorisation de comptages déposées depuis 2016 par des scientifiques à la demande du comité, rejetées ou restées sans réponse, et une surveillance assurée en partie bénévolement par les habitants ; ils relèvent une hausse de la taille et de la biomasse des espèces commerciales dans le rāhui. La Direction des ressources marines indique que certaines ZPR anciennes n'ont pas encore de comité de gestion. En octobre 2023, selon Tahiti Infos, un séminaire des gestionnaires de rāhui et de ZPR à Papeari a relevé la surveillance et le respect des règles parmi les difficultés communes aux comités de gestion.", source: "https://journals.openedition.org/rac/27989"}
chronologie:
  - {annee: 1988, evenement: "Délibération n° 88-183 AT du 8 décembre 1988 portant réglementation de la pêche en Polynésie française."}
  - {annee: 1996, evenement: "Délibération n° 96-151 APF : nouvel article 17 bis, qui permet au conseil des ministres de fixer par arrêté des restrictions de pêche sur des parties délimitées du domaine public."}
  - {annee: 2003, evenement: "Arrêté n° 1813 CM du 9 décembre 2003 : zone de pêche réglementée de Pirae (Tahiti), arrêté en vigueur affiché par la Direction des ressources marines."}
  - {annee: 2014, evenement: "Arrêté n° 864 CM du 6 juin 2014 : classement du rāhui de Teahupo'o (760 hectares) en aire marine de ressources naturelles gérées ; arrêté n° 952 CM du 26 juin 2014 : ZPR de Tetiaroa."}
  - {annee: 2017, evenement: "Loi du pays n° 2017-25 du 5 octobre 2017 : partie loi du pays du code de l'environnement, dont l'article LP. 2122-1 sur le rāhui."}
  - {annee: 2018, evenement: "Arrêté n° 1204 CM du 12 juillet 2018 : ZPR de Tautira et comité « Tomite Rahui Tahunatara Vaionifa No Tautira »."}
  - {annee: 2022, evenement: "Arrêté n° 1885 CM du 9 septembre 2022 : ZPR de Moorea, qui reprend les aires marines protégées de l'ancien plan de gestion de l'espace maritime."}
  - {annee: 2023, evenement: "La Direction des ressources marines compte 34 ZPR ; création de la fédération Rāhui - Te Marae Mo'a lors d'un séminaire réunissant plus de 80 acteurs à Papeari."}
  - {annee: 2024, evenement: "Arrêté n° 795 CM du 31 mai 2024 : création du « Rāhui No Tumaraa » (Raiatea) sous forme de ZPR."}
  - {annee: 2025, evenement: "Arrêté n° 1828 CM du 25 septembre 2025 : classement de la zone économique exclusive en espaces naturels protégés et création de ZPR jusqu'à 12 milles autour des Marquises (« Te Tai Nui A Hau »)."}
fiabilite:
  verifie: ["Texte de l'article LP. 2122-1 et des articles LP. 2111-3 à LP. 2111-11 et LP. 2121-4 : loi du pays n° 2017-25 du 5 octobre 2017 publiée au Journal officiel de la Polynésie française (copie de la base juridique de la Communauté du Pacifique).", "Article 17 bis de la délibération n° 88-183 AT, rédaction de 1996 : texte consolidé du secrétariat général du gouvernement de la Polynésie française.", "Arrêté n° 1204 CM du 12 juillet 2018 (Tautira) : création de la ZPR, sous-zones, comité de gestion et sa composition (art. 1 à 7).", "Procédure de création, missions des comités, 34 ZPR en septembre 2023, sanction de 5e classe : pages de la Direction des ressources marines.", "Arrêtés en vigueur par ZPR : panneaux officiels de la Direction des ressources marines (mise à jour novembre 2023).", "Teahupo'o : arrêté n° 864 CM du 6 juin 2014, 760 hectares, catégorie 6 du code de l'environnement, composition du comité de gestion : Fabre, Le Meur, Mawyer et Bambridge, 2022.", "36 sites actifs, 20 communautés couvertes sur 116 : portail de gestion communautaire des pêches de la Communauté du Pacifique.", "Arrêté n° 1828 CM du 25 septembre 2025 : titre II « Te Tai Nui A Hau », ZPR jusqu'à 12 milles nautiques autour des Marquises (texte publié par la base Reeflex)."]
  non_confirme: ["Le texte des arrêtés n° 864 CM et n° 971 CM de 2014 (Teahupo'o) n'a pas pu être ouvert : le site Lexpol n'a pas répondu ; les références sont reprises de Fabre et al. (2022).", "Date d'apparition du rāhui dans le droit de l'environnement : la loi du pays de 2017 recodifie le code ; une version antérieure de l'article n'a pas été vérifiée.", "Écart de chiffres pour Teahupo'o : The Conversation (2017) indique un rāhui établi en 2013 sur 700 hectares ; Fabre et al. (2022) indiquent un classement officiel en 2014 sur 760 hectares. La fiche retient la seconde source, qui cite l'arrêté.", "Le décompte de 34 ZPR (Direction des ressources marines, 2023) et celui de 36 sites (Communauté du Pacifique) n'emploient pas la même unité ; la liste du tableau compte les zones affichées par la Direction des ressources marines, la ZPR de Moorea (huit secteurs) et celle d'Ua Huka (deux sites) y figurant sur une ligne chacune.", "Les ZPR de Pueu et d'Afaahiti (Taiarapu-Est, arrêtés n° 566 CM et n° 1203 CM de 2018, répertoriés par la Communauté du Pacifique) ne figurent pas sur les pages de la Direction des ressources marines ; leur statut actuel n'a pas été établi.", "Rāhui de Rapa et de Maiao, cités par The Conversation (2017) : leur rattachement à un texte en vigueur n'a pas été vérifié ; ils ne figurent pas dans le tableau.", "Aucun document de la Convention sur la diversité biologique ni inscription au registre ICCA ou à la base WDPA n'a été vérifié pour ces sites.", "Dans le tableau, l'année est celle de l'arrêté en vigueur affiché par la Direction des ressources marines en 2023 ; elle peut être postérieure à la création de la zone (Tautira : le panneau de 2023 renvoie à l'arrêté n° 39 CM du 15 janvier 2021, dont le texte n'a pas été consulté ; la base Reeflex de la Communauté du Pacifique indique encore l'arrêté n° 1204 CM de 2018 comme en vigueur).", "Population des communes couvertes et surface cumulée des ZPR : aucun chiffre trouvé.", "Les ZPR créées autour des Marquises par l'arrêté n° 1828 CM du 25 septembre 2025 ne figurent pas dans le tableau ; la Direction des ressources marines annonce une entrée en vigueur des mesures en janvier 2027."]
