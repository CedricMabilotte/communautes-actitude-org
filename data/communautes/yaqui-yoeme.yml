base: "territoriale"
types_secondaires: []
population: {valeur: 34000, annee: 2024, perimetre: "environ 34 000 habitants des 50 communautés des huit pueblos raccordées à l'aqueduc yaqui inauguré le 25 février 2024, chiffre arrondi du gouvernement du Sonora et de l'INPI cité par Ibarra Ozuna et Pineda Pablos (2026) ; la source parle d'habitants sans distinguer Yaquis et non-Yaquis ; membres vivant hors de ces communautés non comptés", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S1870-39252026000100101"}
lieux: {valeur: 8, unite: "pueblos (communautés traditionnelles) : Vícam, Pótam, Tórim, Ráhum, Huírivis, Belem, Loma de Bácum, Cócorit-Loma de Guamúchil", annee: 2021, source: "https://dof.gob.mx/nota_detalle.php?codigo=5631172&fecha=29/09/2021"}
surface_km2: {valeur: 4852, annee: 1940, perimetre: "terres restituées en propriété communale par la résolution présidentielle de 1940 (485 235 ha), avant l'exécution partielle de 1997", source: "https://www.scielo.org.mx/pdf/soc/v29n82/v29n82a8.pdf"}
villages: {valeur: 46, annee: 2021, perimetre: "localités qui composent les huit communautés traditionnelles selon le diagnostic des autorités traditionnelles repris dans le Plan de justice du peuple yaqui (2021, p. 101), cité par Ibarra Ozuna et Pineda Pablos (2026) ; les communiqués de 2024 sur l'aqueduc parlent de 50 communautés", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S1870-39252026000100101"}
resume: >-
  Les Yoeme (Yaquis) vivent dans le sud de l'État de Sonora, organisés en huit pueblos dotés d'autorités traditionnelles (gobernadores tradicionales). La résolution présidentielle de 1940 leur reconnaît un territoire d'environ 485 000 ha et jusqu'à la moitié des eaux du río Yaqui stockées au barrage de La Angostura. Depuis le Plan de justice convenu à Pótam en 2019, des décrets fédéraux restituent des terres en propriété collective, reçues par les autorités traditionnelles. Un décret de 2021 crée le district d'irrigation 018 du peuple yaqui et le déclare titulaire et administrateur du district, par l'intermédiaire d'une commission formée par les autorités des huit communautés (Comisión Jiaki del Agua).
