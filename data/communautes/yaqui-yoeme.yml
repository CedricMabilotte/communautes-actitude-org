  - {mecanisme: "dnudpa", detail: "Le Mexique vote pour la résolution 61/295 ; les décrets de 2021 se fondent sur les articles 3, 4, 5, 8, 26 et 27 de la Déclaration.", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale sur sa visite au Mexique (A/HRC/39/17/Add.2), § 48 et annexe (cas 93) : aqueduc Independencia construit sur le territoire yaqui sans consentement préalable ; des juges en ordonnent la suspension, l'ouvrage reste en service.", annee: 2018, source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.2&l=fr&t=pdf"}
