  - {instrument: "Loi n° 82 sur les droits des peuples et communautés autochtones du Sonora, art. 14", nature: "loi", annee: 2010, source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=54c0c561-c5f3-4d4d-b8e2-71747cd184c1"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le décret du 29 septembre 2021 reconnaît les huit communautés « con una forma de organización, territorio ancestral y gobierno tradicional de conformidad con sus propios sistemas normativos » et confie l'administration du district d'irrigation 018 à une commission formée par leurs autorités selon leurs normes internes (art. 6) ; le décret du 9 mai 2026 (art. 2) est reçu « por conducto de sus Autoridades Tradicionales » ; la Constitution (art. 2 A I et III) garantit ces formes de gouvernement.", source: "https://dof.gob.mx/nota_detalle.php?codigo=5631172&fecha=29/09/2021"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 2 A II) reconnaît l'application des systèmes normatifs propres dans le respect de ses principes ; le décret du 9 mai 2026 remet les terres pour leur usage « de conformidad con sus sistemas normativos » ; le décret du 29 septembre 2021 (transitoire 2) charge le peuple yaqui d'adopter le règlement du district d'irrigation 018 selon ses systèmes normatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution (art. 2 A II) reconnaît une juridiction autochtone (jurisdicción indígena) exercée par les autorités communautaires, avec validation par les juges selon la loi.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  terres: {valeur: "reconnu", note: "La résolution de 1940 titre le territoire restitué ; le décret du 9 mai 2026 (art. 3) déclare la propriété collective du peuple yaqui « inalienable, imprescriptible e inembargable » (incessible, non soumise à prescription, insaisissable) ; les décrets de 2021 à 2024 remettent aussi les terres en propriété collective.", source: "https://sidof.segob.gob.mx/notas/docFuente/5786997"}
  ressources: {valeur: "partiel", note: "Le décret du 29 septembre 2021 reconnaît le droit de disposer « hasta el 50% del agua del Río Yaqui » (résolution de 1940) et crée le district d'irrigation 018 (126 259 ha) à administrer par le peuple yaqui, avec un volume d'environ 673 millions de m³ par an fourni de manière graduelle selon la disponibilité et les droits déjà concédés.", source: "https://dof.gob.mx/nota_detalle.php?codigo=5631172&fecha=29/09/2021"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 2 A XIII) impose la consultation ; le décret de 2021 fait état du consentement donné les 21 et 22 août 2021 par les autorités traditionnelles à Vícam et Pótam ; la Rapporteuse spéciale (2018) relève que l'aqueduc Independencia fonctionne sans consentement malgré des décisions de suspension.", source: "https://dof.gob.mx/nota_detalle.php?codigo=5631172&fecha=29/09/2021"}
  langue: {valeur: "partiel", note: "La loi générale sur les droits linguistiques (art. 4) fait des langues autochtones des langues nationales ayant la même validité que l'espagnol.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution (art. 2 A VI) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution (art. 2 B II, 2024) prévoit des dotations budgétaires « administradas directamente » par les peuples et communautés.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  representation: {valeur: "partiel", note: "La loi n° 82 de 2010 du Sonora (art. 14) donne aux communes comptant des établissements autochtones un regidor étnico (conseiller municipal autochtone) désigné selon les systèmes normatifs ; le Tribunal électoral fédéral a statué en 2015 (SUP-REC-716/2015) sur la désignation du conseiller yaqui de Cajeme. Aucun siège réservé au niveau fédéral ou de l'État n'a été trouvé.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=54c0c561-c5f3-4d4d-b8e2-71747cd184c1"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les restitutions de terres se poursuivent par décrets de 2021 à 2026. La Rapporteuse spéciale (A/HRC/39/17/Add.2, 2018) signale l'aqueduc Independencia en service malgré des décisions de suspension. Une étude d'El Colegio de Sonora (Región y sociedad, 2026) constate à Pótam une couverture en eau potable presque universelle après la mise en service de l'aqueduc Yaqui en 2024, avec des coupures persistantes, et rapporte des critiques internes : consultation jugée insuffisante, structures de gestion de l'aqueduc et du district d'irrigation 018 jugées extérieures à l'organisation propre, río Yaqui resté à sec.", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S1870-39252026000100101"}
chronologie:
  - {annee: 1937, evenement: "Accord présidentiel (DOF, 30 octobre) sur la question agraire de la région yaqui : terres de la rive droite du río Yaqui et eau d'irrigation du barrage de La Angostura."}
  - {annee: 1940, evenement: "Résolution présidentielle (DOF, 22 octobre) titrant le territoire restitué et attribuant jusqu'à la moitié des eaux stockées à La Angostura."}
  - {annee: 1997, evenement: "Exécution de la résolution de 1940 sur une surface moindre ; décret d'expropriation de 2 688 ha (DOF, 10 janvier)."}
  - {annee: 2019, evenement: "Accord à Pótam (26 octobre) sur un Plan de justice pour le peuple yaqui : terres, territoire, eau et développement."}
  - {annee: 2020, evenement: "Création de la Commission présidentielle de justice pour le peuple yaqui (DOF, 27 octobre)."}
  - {annee: 2021, evenement: "Décrets du 29 septembre : district d'irrigation 018 du peuple yaqui et remise de 2 943,7 ha en propriété collective."}
  - {annee: 2022, evenement: "Décret de restitution de 29 241,7 ha à Guaymas et Cajeme (DOF, 29 octobre)."}
  - {annee: 2024, evenement: "Décrets de restitution de 12 978,2 ha à Guaymas (DOF, 7 juillet) et de 392,3 ha à Cajeme (DOF, 27 septembre)."}
  - {annee: 2024, evenement: "Mise en service de l'aqueduc Yaqui et des réseaux d'eau potable du Plan de justice."}
  - {annee: 2026, evenement: "Décret de restitution du domaine « Rancho La Matanza », 239,67 ha à Cajeme (DOF, 9 mai)."}
fiabilite:
  verifie: ["Articles 1 à 3 du décret du 9 mai 2026 (propriété collective incessible, réception par les autorités traditionnelles).", "Articles 1 à 3 du décret du 29 septembre 2021 sur le district d'irrigation 018 (surface, finalités, volume).", "Liste des huit communautés et rôle des gobernadores tradicionales dans le décret du 27 octobre 2020.", "Titres et surfaces des décrets de restitution de 2021, 2022, 2024 et 2026 au DOF.", "Paragraphe 48 et cas 93 du rapport A/HRC/39/17/Add.2.", "Article 2 de la Constitution après la réforme de 2024 et article 4 de la loi sur les droits linguistiques.", "Article 14 de la loi n° 82 du Sonora (texte du dictamen de 2010).", "Durée du décret de 2020 : en vigueur jusqu'au 30 septembre 2024 (transitoire 1)."]
  non_confirme: ["Date de la résolution de 1940 : les décrets fédéraux citent une publication au DOF le 22 octobre 1940, une chronique du Diario del Yaqui une résolution du 27 octobre 1940.", "Surface de 485 235 ha tirée d'un article universitaire (Lerma Rodríguez, 2014), non lue dans la résolution de 1940 ; la même chronique de presse indique que la résolution laissait hors du territoire les pueblos de Cócorit et Bácum.", "Population : seul un chiffre arrondi (environ 34 000 habitants des communautés raccordées à l'aqueduc, 2024) a été trouvé, cité par une étude universitaire ; aucun décompte du recensement INEGI propre au peuple yaqui n'a été consulté. Nombre de localités : 46 selon le Plan de justice (2021), 50 selon les communiqués de 2024, source primaire non consultée.", "Rapport d'admissibilité de la Commission interaméricaine n° 48/15 (pétition 79-06, peuple yaqui) et mesures conservatoires en faveur de dirigeants yaquis citées par l'ONU : documents non consultés (site de l'OEA inaccessible).", "Transfert effectif de l'administration du district d'irrigation 018 au peuple yaqui.", "Liste complète des décrets de restitution (recherche limitée aux titres du DOF contenant « Yaqui »)."]
