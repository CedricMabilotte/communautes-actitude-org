nom: "Yoeme (Yaquis) de Sonora"
endonyme: "Yoeme"
territoire: "Territoire yaqui des huit pueblos, municipalités de Guaymas, Cajeme, Bácum, Empalme et San Ignacio Río Muerto, État de Sonora"
etats: ["Mexique"]
