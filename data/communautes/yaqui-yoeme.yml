  - {instrument: "Constitution politique des États-Unis mexicains, art. 2 (réformé le 30 septembre 2024)", nature: "constitution", annee: 2024, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  - {instrument: "Décret créant la Commission présidentielle de justice pour le peuple yaqui (DOF, 27 octobre 2020 ; en vigueur jusqu'au 30 septembre 2024)", nature: "loi", annee: 2020, source: "https://dof.gob.mx/nota_detalle.php?codigo=5603578&fecha=27/10/2020"}
  - {instrument: "Décret établissant le district d'irrigation 018 du peuple yaqui (DOF, 29 septembre 2021)", nature: "loi", annee: 2021, source: "https://dof.gob.mx/nota_detalle.php?codigo=5631172&fecha=29/09/2021"}
  - {instrument: "Décret de restitution du domaine « Rancho La Matanza » (DOF, 9 mai 2026)", nature: "loi", annee: 2026, source: "https://sidof.segob.gob.mx/notas/docFuente/5786997"}
