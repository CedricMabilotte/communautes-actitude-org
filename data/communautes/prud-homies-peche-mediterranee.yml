resume: >-
  Fiche agrégée : elle couvre les 33 prud'homies de pêche du littoral méditerranéen français, 29 de Port-Vendres à Menton et 4 en Corse. Une prud'homie réunit les patrons pêcheurs (propriétaires-exploitants d'un bateau de pêche) qui travaillent dans une circonscription délimitée à terre par le décret n° 93-56 du 15 janvier 1993 et en mer par la limite des eaux territoriales. Ses membres élisent des prud'hommes qui, selon le décret du 19 novembre 1859 toujours en vigueur pour ses articles 4 à 52, règlent l'usage de la mer entre pêcheurs, attribuent les postes de pêche par tirage au sort, jugent sans appel les différends entre pêcheurs et participent à la police des pêches, sous la tutelle de l'administration maritime. La fiche d'inventaire du patrimoine culturel immatériel (2021) compte moins d'une centaine de prud'hommes élus pour deux à trois mille patrons pêcheurs.
