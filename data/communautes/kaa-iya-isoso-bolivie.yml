resume: >-
  Le parc national et aire naturelle de gestion intégrée (ANMI, zone protégée où l'usage des ressources par les habitants est admis) Kaa-Iya du Gran Chaco est déclaré par le décret suprême 24122 du 21 septembre 1995 sur 3 441 115 ha. Le décret rappelle que la Capitanía de l'Alto et du Bajo Izozog (CABI), organisation du peuple guarani isoseño, a demandé en 1993 la protection de son territoire, et reconnaît la juridiction du premier district municipal autochtone de l'Izozog exercée par la CABI (art. 8). Il prévoit une convention-cadre de gestion participative avec les organisations autochtones locales (art. 9) ; la CABI cogère le parc de novembre 1995 à mars 2008, date à laquelle le Service national des aires protégées (SERNAP) en reprend l'administration directe. La CABI dépose en 1997 une demande de terre communautaire d'origine (TCO, propriété collective) ; 560 000 ha étaient titrés en 2005. Les communautés isoseñas se trouvent dans les zones Alto et Bajo Isoso de l'autonomie Charagua Iyambae, qui a sa propre fiche.
