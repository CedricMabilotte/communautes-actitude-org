droits:
  autogouvernement: {valeur: "conteste", note: "Le décret 24122 (art. 8) reconnaît la juridiction du premier district municipal autochtone de l'Izozog exercée par la CABI et (art. 9) prévoit une convention-cadre de gestion participative ; la convention de cogestion signée en novembre 1995 est rompue en mars 2008 et le SERNAP (Service national des aires protégées) administre depuis directement le parc ; le règlement de 1997 (art. 77 et 78) exclut tout pouvoir normatif ou de sanction des cogestionnaires et permet à l'administration de résilier ces conventions.", source: "https://fcbc.org.bo/wp-content/uploads/2021/07/PM-KaaIya.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le parc relève du patrimoine de l'État (loi 1333, art. 61) et le décret 24122 (art. 11) y interdit toute dotation de terres ; à côté, 560 000 ha de la TCO Isoso, demandée par la CABI en 1997, étaient titrés en 2005.", source: "https://www.equatorinitiative.org/wp-content/uploads/2017/05/case_1_1360168586_SP.pdf"}
  ressources: {valeur: "partiel", note: "Le décret 24122 (art. 6) réserve l'usage des ressources renouvelables de l'aire de gestion intégrée « en especial » à la population autochtone, selon le plan de gestion, et garantit (art. 5) la subsistance des familles ayoreode non contactées ; tout permis d'exploitation relève du ministère (art. 13), de même que les hydrocarbures et les mines (art. 14 et 15).", source: "https://www.lexivox.org/norms/BO-DS-24122.html"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15 et 403.I) impose une consultation préalable, sans exiger le consentement ; l'art. 385.II prévoit une gestion partagée selon les normes propres des peuples là où une aire protégée chevauche un territoire autochtone.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5.I) fait du guarani une langue officielle de l'État.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon le plan de gestion 2013-2022 du parc, la cogestion entre la CABI et l'État dure de 1995 à mars 2008 ; la convention est alors rompue, la CABI conteste la procédure suivie par le SERNAP, qui administre depuis directement le parc, et deux capitanías parallèles à la CABI apparaissent. En juin 2026, les capitanías de l'Alto Isoso et du Bajo Isoso et le gouvernement autonome de Charagua Iyambae siègent au comité de gestion du parc (instance de participation, règlement de 1997, art. 47 et 48), dont le directeur du parc nommé par le SERNAP assure le secrétariat (Agence de presse environnementale ANA, 1er juillet 2026).", source: "https://fcbc.org.bo/wp-content/uploads/2021/07/PM-KaaIya.pdf"}
chronologie:
  - {annee: 1991, evenement: "Fondation de la Capitanía de l'Alto et du Bajo Izozog (CABI)."}
  - {annee: 1993, evenement: "La CABI demande au gouvernement la protection de son territoire."}
  - {annee: 1994, evenement: "Ordonnance municipale 011/94 (26 juillet) créant le premier district municipal autochtone de l'Izozog, dans le cadre de la loi 1551 de participation populaire."}
  - {annee: 1995, evenement: "Le décret suprême 24122 (21 septembre) déclare le parc Kaa-Iya et reconnaît la juridiction exercée par la CABI ; convention de cogestion entre la CABI et le ministère du Développement durable (novembre)."}
  - {annee: 1997, evenement: "Règlement général des aires protégées (décret 24781, 31 juillet) ; la CABI dépose la demande de TCO Isoso."}
  - {annee: 2000, evenement: "Approbation du plan de gestion du parc."}
  - {annee: 2004, evenement: "La CABI reçoit le prix Équateur du PNUD."}
  - {annee: 2005, evenement: "560 000 ha de la TCO Isoso sont titrés à cette date."}
  - {annee: 2008, evenement: "Rupture de la convention de cogestion (mars) ; le SERNAP administre directement le parc."}
  - {annee: 2026, evenement: "Renouvellement du directoire du comité de gestion du parc pour 2026-2028 (30 juin)."}
