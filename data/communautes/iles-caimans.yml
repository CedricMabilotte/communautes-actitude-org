resume: >-
  Population des îles Caïmans, trois îles de la mer des Caraïbes situées à environ 290 km à l'ouest de la Jamaïque. Le territoire figure sur la liste des territoires non autonomes de l'ONU, avec le Royaume-Uni comme puissance administrante. La Constitution de 2009, modifiée en 2020, institue un Parlement de dix-neuf élus et deux membres de droit, un Premier (chef du gouvernement) et un Cabinet dotés d'une compétence autonome et exclusive dans les affaires intérieures, sous réserve des responsabilités du gouverneur nommé par la Couronne ; sa charte des droits (partie I) s'ouvre sur l'affirmation que tous les peuples ont le droit de disposer d'eux-mêmes. Le statut de Caymanian, défini par la loi locale, conditionne le droit de vote.
