resume: >-
  Fiche agrégée : elle couvre les communautés villageoises des montagnes de l'Uttarakhand (Kumaon et Garhwal) auxquelles l'État a confié la gestion d'une forêt de village. Le régime date des règles de 1931, prises après les incendies de forêt de protestation de 1921. Les habitants élisent en assemblée un conseil de neuf membres et un président (sarpanch), qui fixe les règles d'usage et les amendes ; le service forestier approuve le plan de gestion et les ventes. En 2026, 11 217 conseils géraient environ 4 526 km² de forêts.
