resume: >-
  Saint-Barthélemy est une île des Petites Antilles, détachée de la Guadeloupe et érigée en collectivité d'outre-mer (art. 74 de la Constitution) le 15 juillet 2007 par la loi organique n° 2007-223 du 21 février 2007, après une consultation où 95,51 % des suffrages exprimés ont approuvé le changement. La collectivité est dotée de l'autonomie : son conseil territorial fixe des règles de niveau législatif en matière d'impôts, d'urbanisme, de transports, de domaine, d'environnement, d'accès au travail des étrangers, d'énergie et de tourisme, sous le contrôle du Conseil d'État. Le sujet collectif est la population de l'île ; aucune désignation ethnique n'est retenue par le droit. Depuis le 1er janvier 2012, l'île est un pays et territoire d'outre-mer (PTOM, territoire associé à l'Union européenne sans en faire partie).
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "Décision 2010/718/UE du Conseil européen du 29 octobre 2010 modifiant le statut de l'île de Saint-Barthélemy à l'égard de l'Union européenne : à compter du 1er janvier 2012, l'île cesse d'être une région ultrapériphérique (région soumise au droit de l'Union avec adaptations) et accède au statut de pays et territoire d'outre-mer.", annee: 2010, source: "https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32010D0718"}
reconnaissance_onu: []
base_nationale:
