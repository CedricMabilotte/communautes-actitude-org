  - {instrument: "Loi organique n° 2007-223 du 21 février 2007 portant dispositions statutaires et institutionnelles relatives à l'outre-mer (CGCT, art. LO 6211-1 et suivants)", nature: "loi_organique", annee: 2007, source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  - {instrument: "Conseil constitutionnel, décision n° 2007-547 DC du 15 février 2007", nature: "jurisprudence", annee: 2007, source: "https://www.conseil-constitutionnel.fr/decision/2007/2007547DC.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi organique de 2007 institue un conseil territorial de 19 membres élus, un président et un conseil exécutif élus par le conseil, et un conseil économique, social et culturel consultatif (CGCT, art. LO 6221-1 et s., LO 6223-1 à LO 6223-3).", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'article LO 6214-3 du CGCT confie à la collectivité la fixation des règles de niveau législatif ou réglementaire en matière d'impôts et cadastre, urbanisme et logement, circulation et transport routiers, desserte maritime et ports, domaine, environnement, accès au travail des étrangers, énergie, tourisme et services publics de la collectivité ; ces actes relèvent d'un contrôle propre du Conseil d'État.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'article LO 6214-7 du CGCT permet à la collectivité de soumettre à déclaration les transferts entre vifs de propriétés foncières et d'exercer un droit de préemption (droit d'acheter en priorité) pour préserver la cohésion sociale, le droit au logement et les espaces naturels ; le Conseil constitutionnel a exigé que la durée de résidence ouvrant exemption n'excède pas la mesure strictement nécessaire (décision 2007-547 DC).", source: "https://www.conseil-constitutionnel.fr/decision/2007/2007547DC.htm"}
  ressources: {valeur: "partiel", note: "La loi organique de 2007 rend la collectivité compétente pour réglementer l'exploration et l'exploitation des ressources naturelles des eaux intérieures, du sol, du sous-sol et des eaux de la mer territoriale et de la zone économique exclusive, dans le respect des engagements internationaux et des compétences de l'État.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  consentement: {valeur: "partiel", note: "L'article LO 6213-3 du CGCT impose la consultation du conseil territorial sur les projets et propositions de loi, d'ordonnance ou de décret comportant des dispositions particulières à Saint-Barthélemy et sur les engagements internationaux touchant ses compétences ; l'avis ne lie pas l'État.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "La collectivité fixe les impôts, droits et taxes et perçoit le produit des impositions qu'elle établit (CGCT, art. LO 6214-3, I, 1°) ; l'État peut instituer des taxes liées à ses missions de sécurité aérienne et de communications électroniques (art. LO 6214-4, III).", source: "https://www.conseil-constitutionnel.fr/decision/2007/2007547DC.htm"}
  representation: {valeur: "reconnu", note: "La loi organique de 2007 crée un siège de sénateur propre à Saint-Barthélemy.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  statut_personnel: {valeur: "partiel", note: "L'article LO 6214-4 du CGCT soumet l'accès au régime fiscal local à une résidence d'au moins cinq ans sur l'île pour les personnes physiques, et à une condition équivalente pour les personnes morales ; ce statut de résidence est limité à la fiscalité.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le conseil territorial issu du scrutin de mars 2022 a élu son président le 3 avril 2022 par 13 voix sur 19, puis les membres du conseil exécutif.", source: "https://www.journaldesaintbarth.com/actualites/conseil-territorial/xavier-ledee-nouveau-president-de-la-collectivite-202204071514.html"}
chronologie:
  - {annee: 1784, evenement: "La France cède l'île à la Suède."}
  - {annee: 1878, evenement: "Rétrocession de l'île à la France, rattachée ensuite à la Guadeloupe."}
  - {annee: 2003, evenement: "Consultation du 7 décembre : 95,51 % des suffrages exprimés approuvent la création d'une collectivité d'outre-mer."}
  - {annee: 2007, evenement: "Loi organique n° 2007-223 du 21 février ; la collectivité d'outre-mer est installée le 15 juillet."}
  - {annee: 2010, evenement: "Décision 2010/718/UE du Conseil européen sur le changement de statut à l'égard de l'Union."}
  - {annee: 2012, evenement: "L'île devient pays et territoire d'outre-mer de l'Union européenne au 1er janvier."}
  - {annee: 2022, evenement: "Élection du conseil territorial."}
