  consentement: {valeur: "partiel", note: "Les politiques publiques et l'aménagement régional doivent tenir compte des droits et du développement du groupe hakka (art. 7) ; dans les districts de municipalités spéciales issus d'anciens cantons et classés zones hakka, le gouvernement doit tenir compte de la volonté des Hakka et garantir le développement autonome de leur langue et de leur culture (art. 8, al. 2), loi fondamentale de 2018. Aucune obligation de consentement.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0140005"}
  langue: {valeur: "reconnu", note: "Le hakka est une langue nationale, égale aux langues des autres groupes (art. 3) ; dans les cantons et districts où les Hakka forment au moins un tiers de la population, il est l'une des langues d'usage public (通行語), et la langue d'usage public principale dans les municipalités, comtés, villes, cantons et districts où ils formaient au moins la moitié de la population à l'entrée en vigueur de la révision (art. 4, al. 2) ; les agents publics et les enseignants de ces zones doivent être certifiés en hakka dans une proportion égale à la part des Hakka dans la population locale (art. 9), loi fondamentale de 2018.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0140005"}
  education: {valeur: "partiel", note: "Dans les zones où le hakka est langue d'usage public, les écoles maternelles et les écoles de l'enseignement obligatoire doivent garantir aux enfants le droit d'apprendre en hakka et d'être enseignés en hakka (règlement du 26 novembre 2018, art. 9, pris pour l'application de l'art. 4 de la loi fondamentale ; art. 12 de la loi) ; les écoles restent gérées par l'État et les collectivités.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0140019"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
