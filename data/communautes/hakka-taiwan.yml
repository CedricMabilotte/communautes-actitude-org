  verifie: ["Texte des articles 1 à 21 de la loi fondamentale révisée, version en vigueur (Base nationale des lois, dernière modification le 31 janvier 2018).", "Texte du règlement du 26 novembre 2018 sur le hakka langue d'usage public (art. 1 à 16).", "Liste des 69 zones de 2011 (Journal officiel du Yuan exécutif).", "Ajout de Daxi et liste complète de 70 zones dans 11 villes et comtés (annexe PDF de l'avis du 24 février 2017, Journal officiel) ; les 70 lignes du tableau correspondent à cette liste.", "Adoption de la révision le 29 décembre 2017 (Taipei Times)."]
  non_confirme: ["Une désignation postérieure à 2017, fondée sur l'enquête de population de 2021, n'a pas été trouvée ; la liste de 70 zones est celle de 2017. Le site du Conseil des affaires hakka n'a pas pu être consulté.", "Noms des zones : la table reprend les noms administratifs actuels ; l'avis de 2011 utilisait les anciens noms de Taoyuan (comté, cantons) et l'avis de 2017 écrit encore Toufen « 頭份鎮 » (aujourd'hui 頭份市).", "Population de 4 669 000 Hakka (2021) reprise de Wikipédia, qui cite le rapport du Conseil des affaires hakka ; rapport non ouvert.", "Les cantons de Tai'an (Miaoli) et Heping (Taichung) sont aussi des régions autochtones ; le régime conjoint (loi, art. 4, al. 2 et art. 9, al. 3 ; règlement de 2018, art. 15) est inscrit, son application n'est pas documentée."]
