effectivite: {valeur: "non_etablie", note: "Aucune évaluation publiée de l'application des articles 4, 9 et 12 n'a été consultée. Le règlement de 2018 fixe un délai de huit ans pour la certification en hakka des agents publics et des enseignants (art. 13) ; aucun bilan n'a été consulté. Le Taipei Times (janvier 2016, avant la révision) rapporte que 22,8 % des Hakka de 19 à 29 ans parlent la langue.", source: "https://www.taipeitimes.com/News/feat/archives/2016/01/25/2003637997"}
chronologie:
  - {annee: 2010, evenement: "Première loi fondamentale sur les Hakka."}
  - {annee: 2011, evenement: "Le Conseil des affaires hakka désigne 69 zones de développement culturel hakka (avis du 25 février)."}
  - {annee: 2017, evenement: "Ajout du district de Daxi (Taoyuan), soit 70 zones (avis du 24 février)."}
  - {annee: 2017, evenement: "Le Yuan législatif (parlement) adopte la révision de la loi fondamentale (29 décembre)."}
  - {annee: 2018, evenement: "Promulgation de la loi révisée (31 janvier), en vigueur le 2 février."}
  - {annee: 2018, evenement: "Règlement sur le hakka langue d'usage public (26 novembre)."}
