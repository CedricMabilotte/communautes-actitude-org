resume: >-
  Les Hakka forment le deuxième groupe de population de Taïwan. La loi fondamentale sur les Hakka, adoptée en 2010 et révisée le 29 décembre 2017 (promulguée le 31 janvier 2018), fait du hakka une langue nationale et protège les « droits collectifs du groupe hakka ». Dans les cantons et districts où les Hakka forment au moins un tiers de la population, désignés par le Conseil des affaires hakka (ministère chargé des Hakka) comme zones de développement culturel hakka, le hakka est langue d'usage public. Les droits portent sur la langue, l'enseignement et l'administration ; la loi ne crée pas d'institution propre.
