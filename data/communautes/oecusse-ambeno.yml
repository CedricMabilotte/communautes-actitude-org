resume: >-
  Oé-Cusse Ambeno est une enclave timoraise entourée par le Timor occidental indonésien, sauf au nord où elle borde la mer. La Constitution de 2002 lui garantit une politique administrative et un régime économique spéciaux (art. 5 et 71). La loi n° 3/2014 du 18 juin 2014 en fait une Région administrative spéciale, personne morale territoriale (collectivité dotée de la personnalité juridique) à autonomie administrative, financière et patrimoniale, et y créait une zone économique spéciale (ZEESM). La loi n° 18/2023 du 30 novembre 2023, troisième modification de ce texte, supprime la zone spéciale, met fin aux mandats des organes régionaux et renforce la tutelle du Premier ministre. Le décret-loi n° 1/2026 du 2 février 2026 remplace le statut de 2015, délègue la tutelle au ministre de l'Administration de l'État, rapproche l'organisation de la Région de celle des autorités municipales et ouvre une période de transition en vue d'une « éventuelle intégration future » dans le système de pouvoir local. Les organes régionaux sont nommés par le gouvernement central et n'ont pas de pouvoir législatif ; la Région dispose d'un pouvoir réglementaire encadré, d'un budget autonome et de recettes propres.
