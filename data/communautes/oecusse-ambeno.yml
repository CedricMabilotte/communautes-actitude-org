base_nationale:
  - {instrument: "Constitution de la République démocratique du Timor-Leste (2002), art. 5 (3) et 71 (2)", nature: "constitution", annee: 2002, source: "https://timor-leste.gov.tl/wp-content/uploads/2010/03/Constituicao_RDTL_PT.pdf"}
  - {instrument: "Loi n° 3/2014 du 18 juin 2014 créant la Région administrative spéciale d'Oé-Cusse Ambeno", nature: "statut_autonomie", annee: 2014, source: "https://www.mj.gov.tl/jornal/?q=node%2F6670"}
