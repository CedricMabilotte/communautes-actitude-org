droits:
  autogouvernement: {valeur: "partiel", note: "Organes propres : l'Autorité (organe délibérant) et son président (organe exécutif), avec un conseil consultatif, loi n° 3/2014 modifiée en 2023, art. 15. L'Autorité compte le président et six secrétaires régionaux nommés par le Conseil des ministres sur proposition du Premier ministre, art. 17 ; le président est nommé de la même manière pour cinq ans et peut être révoqué à tout moment, art. 19 ; le Premier ministre exerce une tutelle de légalité et d'opportunité (contrôle du bien-fondé des décisions) et un pouvoir d'orientation, art. 4. Le conseil consultatif comprend un lia nain (gardien de la parole coutumière) d'Oé-Cusse Ambeno et un chef de suco désigné par les chefs de suco, art. 24. Le décret-loi n° 1/2026 délègue la tutelle au ministre de l'Administration de l'État, qui propose la nomination du président et des membres de l'Autorité, art. 5 (2) (g) et 5 (3) ; les directeurs des services régionaux sont nommés et révoqués librement par la tutelle, art. 22 (2) ; les secrétaires régionaux n'ont pas de compétences propres, art. 13.", source: "https://www.mj.gov.tl/jornal/public/docs/2023/serie_1/SERIE_I_NO_45_A.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Pouvoir réglementaire propre sous forme de règlements administratifs régionaux, adoptés par l'Autorité, dans les limites de la Constitution et des lois ; chaque règlement exige une loi d'habilitation et l'avis conforme préalable du Premier ministre, loi n° 3/2014 modifiée en 2023, art. 9 et 16 (2) (e). L'autonomie ne comprend pas de compétence législative et les lois nationales s'appliquent directement, art. 8 (2).", source: "https://www.mj.gov.tl/jornal/public/docs/2023/serie_1/SERIE_I_NO_45_A.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La Région gère les biens du domaine public et privé de l'État situés sur son territoire et non utilisés par l'État, loi n° 3/2014 modifiée en 2023, art. 12 (c) ; l'État garantit l'usage de la terre pour des projets d'investissement et les terrains sont cédés aux investisseurs, art. 26 ; l'aménagement du territoire régional reste approuvé par le gouvernement, art. 8-A (o). Le texte ne prévoit pas de propriété collective de la population.", source: "https://www.mj.gov.tl/jornal/public/docs/2023/serie_1/SERIE_I_NO_45_A.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Droit de la Région d'être entendue par le gouvernement sur toute question qui la concerne et de participer à la négociation des traités qui la visent, loi n° 3/2014 modifiée en 2023, art. 12 (d) et (f) ; l'Autorité donne un avis sur les politiques régionales d'aménagement du territoire et d'exploitation des ressources naturelles et sur les projets de modification de la loi, art. 16 (2) (c) et (d). Aucun consentement n'est requis ; les activités pétrolières et minières restent réservées au gouvernement, art. 8-A (i).", source: "https://www.mj.gov.tl/jornal/public/docs/2023/serie_1/SERIE_I_NO_45_A.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Budget autonome intégré au budget général de l'État, géré par les organes exécutifs ; le projet de budget annuel est proposé au gouvernement, loi n° 3/2014 modifiée en 2023, art. 10 ; recettes propres : dotation de l'État, taxes pour services rendus, impôts qualifiés comme tels par la loi, amendes, emprunts, art. 11 ; toutes les recettes perçues par la Région lui sont propres, art. 28 (3) ; la loi peut créer des impôts spécifiques ou des droits de douane différenciés pour la Région et fixe la part des impôts perçus qui lui revient, art. 29 et 32. La politique fiscale reste proposée par le gouvernement, art. 8-A (h). Depuis le décret-loi n° 1/2026, toute dépense de plus de 500 000 dollars est soumise à l'approbation de la tutelle, art. 11 (6) (c).", source: "https://www.mj.gov.tl/jornal/public/docs/2023/serie_1/SERIE_I_NO_45_A.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les organes régionaux fonctionnent depuis la nomination de Mari Alkatiri à la présidence de l'Autorité le 25 juillet 2014. L'organisation La'o Hamutuk relève que la loi a été adoptée sans audition publique, que l'Autorité n'est pas élue, et que les dépenses de la Région sont passées de 22 millions de dollars en 2014 à 218 millions en 2016. Le chercheur Michael Rose (Université d'Adélaïde, Devpolicy Blog, 2019) rapporte qu'en 2014 des habitants du hameau d'Oeupun ont appris que certaines de leurs maisons seraient démolies pour construire un hôtel, et que l'eau douce n'y arrive que deux fois par semaine. Par le despacho n° 014/PM/VII/2025 du 31 juillet 2025, le Premier ministre a interdit à la Région de recruter de nouveaux techniciens ou conseillers et a soumis toute dépense de fournitures, de services et de travaux à son avis favorable, pendant la transition vers un modèle proche du régime municipal (communiqué du gouvernement).", source: "https://www.laohamutuk.org/econ/Oecussi/ZEESMIndex.htm"}
chronologie:
  - {annee: 1515, evenement: "Débarquement portugais à Lifau, sur la côte de l'enclave."}
  - {annee: 2002, evenement: "La Constitution reconnaît à Oé-Cusse Ambeno un traitement administratif et économique spécial (art. 5 et 71)."}
  - {annee: 2013, evenement: "Résolution du gouvernement n° 6/2013 : Mari Alkatiri est désigné le 30 janvier représentant de l'État pour la Zone spéciale d'économie sociale de marché d'Oé-Cusse Ambeno."}
  - {annee: 2014, evenement: "Loi n° 3/2014 du 18 juin : création de la Région administrative spéciale et de la ZEESM ; nomination de Mari Alkatiri à la présidence de l'Autorité le 25 juillet."}
  - {annee: 2015, evenement: "Décret-loi n° 5/2015 du 22 janvier : statut de la Région."}
  - {annee: 2018, evenement: "Demande d'audit des comptes de la Région formulée en février par le Premier ministre."}
  - {annee: 2019, evenement: "Inauguration de l'aéroport international d'Oé-Cusse le 18 juin ; loi n° 3/2019 du 15 août, première modification de la loi n° 3/2014."}
  - {annee: 2022, evenement: "Loi n° 2/2022 du 10 février, loi-cadre sur le budget de l'État et la gestion des finances publiques, deuxième modification de la loi n° 3/2014."}
  - {annee: 2023, evenement: "Loi n° 18/2023 du 30 novembre : suppression de la ZEESM, tutelle renforcée du Premier ministre, fin des mandats des organes régionaux."}
  - {annee: 2024, evenement: "Nomination par le gouvernement, le 24 janvier, de Rogério Tiago Lobato à la présidence de l'Autorité et de six secrétaires régionaux."}
  - {annee: 2025, evenement: "Résolution du gouvernement n° 21/2025 du 3 avril : mandat donné au Premier ministre pour adopter, en consultation avec la population de l'enclave, un nouveau modèle d'administration de la Région."}
  - {annee: 2025, evenement: "Despacho du Premier ministre du 31 juillet : limites au recrutement et aux dépenses de la Région à partir du 1er août."}
  - {annee: 2025, evenement: "Résolutions du gouvernement n° 36 à 38/2025 du 28 août : révocation de Rogério Lobato et des secrétaires régionaux au 31 août, nomination de Régio da Cruz à la présidence de l'Autorité pour trois mois, suppression de la commission exécutive de la zone économique spéciale de développement."}
  - {annee: 2026, evenement: "Décret-loi n° 1/2026 du 2 février : nouveau régime d'organisation de la Région, tutelle déléguée au ministre de l'Administration de l'État, abrogation du décret-loi n° 5/2015 sauf ses art. 50 et 52."}
  - {annee: 2026, evenement: "Résolution du gouvernement n° 26/2026 du 22 avril : nomination du président (Régio da Cruz), de trois secrétaires régionaux et de vingt et un directeurs des services régionaux, soumis à une évaluation annuelle ; prestation de serment le 28 avril."}
fiabilite:
  verifie: ["Articles 2 à 5, 8 à 12, 15 à 17, 19, 23, 24, 26, 28, 29 et 32 de la loi n° 3/2014 (Jornal da República, texte portugais de 2014).", "Articles modifiés ou ajoutés par la loi n° 18/2023 (4, 8-A, 9, 10, 11, 12, 16, 17, 19, 24, 28, 29, 32) et articles 4, 5 et 8 de cette loi (Jornal da República, Série I, n° 45 A, 30 novembre 2023).", "Articles 5 (3) et 71 (2) de la Constitution de 2002 (texte portugais publié par le gouvernement).", "Population de 80 685 habitants et 18 sucos répartis en 4 postes administratifs au recensement de 2022 (City Population, données de l'Institut national de statistique).", "63 aldeias réparties dans les 18 sucos (annexe I-L du diplôme ministériel n° 16/2017, Jornal da República, Série I, n° 17 B).", "Titre de la résolution du gouvernement n° 6/2013 (Jornal da República).", "Dates de nomination de Mari Alkatiri et montants des dépenses 2013-2017 (La'o Hamutuk).", "Nomination de Rogério Tiago Lobato le 24 janvier 2024 (agence Tatoli).", "Articles 5, 11 à 13, 16, 22, 27, 29, 32, 34 et 35 du décret-loi n° 1/2026 (Jornal da República, Série I, n° 4 C, 2 février 2026).", "Résolution du gouvernement n° 21/2025 (Série I, n° 14 A) et résolutions n° 36, 37 et 38/2025 (Série I, n° 35 A) ; résolution n° 26/2026 (Série I, n° 16).", "Despacho n° 014/PM/VII/2025 du 31 juillet 2025 (communiqué du gouvernement)."]
  non_confirme: ["Le texte du décret-loi n° 5/2015 (statut de la Région), abrogé par le décret-loi n° 1/2026 sauf ses art. 50 et 52, n'a pas été consulté.", "Selon le vice-ministre Adérito Hugo (agence Tatoli, 22 avril 2026), le président de l'Autorité exerce jusqu'au 31 décembre 2026 ; la résolution n° 26/2026 ne fixe pas cette date.", "Le communiqué du gouvernement du 31 juillet 2025 attribue à la résolution n° 29/2025 du 18 juin la transition vers le modèle municipal et la fin des mandats ; au Jornal da República, ce numéro porte sur la commission exécutive de la zone économique spéciale.", "Superficie de 813,6 km² reprise d'une encyclopédie en ligne, sans accès direct à la source statistique.", "Résultats de l'audit demandé en 2018 non consultés.", "Aucun document d'un organe de l'ONU ou d'un système régional visant le régime d'Oé-Cusse n'a été trouvé ; la coopération du PNUD avec la ZEESM (2014) n'entre dans aucun mécanisme de la liste."]
