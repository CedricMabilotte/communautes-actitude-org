base_nationale:
  - {instrument: "Texte refondu de la loi sur les eaux (décret législatif royal 1/2001 du 20 juillet 2001), articles 81 à 91 (communautés d'usagers), 27 et 36 (représentation des usagers dans les organismes de bassin)", nature: "loi", annee: 2001, source: "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"}
  - {instrument: "Règlement du domaine public hydraulique (décret royal 849/1986 du 11 avril 1986), articles 198 à 231 (constitution, statuts, organes et jurys des communautés d'usagers), articles modifiés notamment par les décrets royaux 665/2023 et 1085/2024", nature: "loi", annee: 1986, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1986-10638"}
  - {instrument: "Loi 29/1985 du 2 août 1985 sur les eaux (régime repris par le texte refondu de 2001)", nature: "loi", annee: 1985, source: "https://www.boe.es/buscar/doc.php?id=BOE-A-1985-16661"}
droits:
  autogouvernement: {valeur: "partiel", note: "Toute communauté a une junta general (assemblée générale) de tous les usagers, organe souverain, une junta de gobierno élue par elle et un ou plusieurs jurys (texte refondu de la loi sur les eaux, art. 84 ; règlement du domaine public hydraulique, art. 216, qui confie à l'assemblée l'élection du président, des membres du conseil et du jury) ; la communauté reste rattachée à l'organisme de bassin, qui veille au respect de ses ordonnances (art. 82.1), et ses décisions peuvent être contestées en recours hiérarchique (recurso de alzada) devant cet organisme (art. 84.5).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"}
  pouvoir_normatif: {valeur: "partiel", note: "Les statuts et ordonnances sont rédigés et adoptés par les usagers et règlent l'exploitation des ouvrages « en régime d'autonomie interne » ; ils sont soumis à l'approbation de l'organisme de bassin, qui ne peut les refuser ni les modifier sans avis du Conseil d'État (texte refondu de la loi sur les eaux, art. 81.1) ; à défaut d'ordonnances, l'organisme de bassin peut les établir lui-même après avis du Conseil d'État (art. 82.4).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"}
  justice_propre: {valeur: "partiel", note: "Le jury d'irrigation de chaque communauté tranche les questions de fait entre usagers dans le cadre des ordonnances, impose les sanctions et fixe les indemnités, selon une procédure publique et orale réglée par la coutume ; ses décisions sont exécutoires (texte refondu de la loi sur les eaux, art. 84.6) ; les sanctions sont pécuniaires et plafonnées, et les décisions restent attaquables devant la juridiction administrative (règlement du domaine public hydraulique, art. 225 et 227).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1986-10638"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les communautés exercent, « par mandat de la loi et avec l'autonomie qu'elle leur reconnaît », la police, la distribution et l'administration des eaux qui leur sont concédées (règlement du domaine public hydraulique, art. 199.2) ; la junta de gobierno répartit l'eau « en respectant les droits acquis et les coutumes locales » (texte refondu de la loi sur les eaux, art. 84.4 b) ; l'eau reste dans le domaine public et l'organisme de bassin peut en suspendre l'usage si les travaux qu'il ordonne ne sont pas exécutés (art. 83.3).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"}
  consentement: {valeur: "partiel", note: "L'autorisation préalable de l'assemblée générale est requise, en plus de celle de l'organisme de bassin, pour que des usagers ou des tiers fassent des travaux sur les barrages, captages, conduites et installations de la communauté, ou utilisent les dénivelés de ses canaux pour produire de l'énergie ; l'assemblée émet un avis lorsque des usagers veulent quitter la communauté pour en former une autre (règlement du domaine public hydraulique, art. 216.3 g, h et i).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1986-10638"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les ordonnances obligent tous les titulaires à contribuer en proportion aux frais communs d'exploitation, de conservation, de réparation et d'amélioration (texte refondu de la loi sur les eaux, art. 82.2) ; l'assemblée vote le budget et les derramas (contributions extraordinaires) (règlement du domaine public hydraulique, art. 216.3 b et d) ; la communauté recouvre ses créances par la voie administrative d'exécution forcée (vía de apremio) et peut couper l'eau jusqu'au paiement (texte refondu, art. 83.4).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"}
  representation: {valeur: "partiel", note: "Les usagers de l'eau détiennent au moins un tiers des sièges de la Junta de Gobierno de chaque organisme de bassin et du Consejo del Agua (conseil de l'eau) de chaque district hydrographique (texte refondu de la loi sur les eaux, art. 27 c et 36.1 e) ; l'assemblée générale de chaque communauté élit ses représentants auprès de l'organisme de bassin (règlement du domaine public hydraulique, art. 216.3 a). Ces sièges reviennent à l'ensemble des usagers, pas aux seules communautés.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2001-14276"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Une étude de droit de l'Université de Murcie (Teresa María Navarro Caballero, 2007) décrit les communautés d'irrigants comme les principales titulaires du droit à l'irrigation et cite de nombreuses communautés générales constituées dans les bassins du Guadiana, du Duero, de l'Èbre et du Júcar ; le Plan national des regadíos de 2002 recense 7 196 communautés et autres collectifs d'irrigation qui gèrent 2 596 731 ha, soit environ 69 % des 3 761 034 ha irrigables d'Espagne. Aucune évaluation publique du fonctionnement des jurys d'irrigation à l'échelle nationale n'a été trouvée.", source: "https://ws168.juntadeandalucia.es/revistaselectronicas/raap/article/view/463"}
chronologie:
  - {annee: 1866, evenement: "L'exposé des motifs de la loi sur les eaux propose de maintenir l'administration des irrigations collectives par des juntas élues par les intéressés (sindicatos) et de la rendre obligatoire au-delà de 50 irrigants (selon Emilio Pérez Pérez)."}
  - {annee: 1879, evenement: "La loi sur les eaux du 13 juin, article 228, impose une communauté d'irrigants à partir de 20 irrigants et 200 hectares ; l'article 231 lui fait rédiger ses ordonnances, que le Gouvernement ne peut refuser ni modifier sans avis du Conseil d'État."}
  - {annee: 1955, evenement: "Création de la Fédération nationale des communautés d'irrigants (FENACORE) par arrêté du 30 juillet 1955."}
  - {annee: 1985, evenement: "La loi 29/1985 du 2 août sur les eaux étend le régime à toutes les communautés d'usagers et en fait des corporations de droit public."}
  - {annee: 1986, evenement: "Le règlement du domaine public hydraulique (décret royal 849/1986) fixe la procédure de constitution, les organes et les jurys des communautés."}
  - {annee: 2001, evenement: "Le texte refondu de la loi sur les eaux reprend le régime aux articles 81 à 91."}
  - {annee: 2002, evenement: "Le Plan national des regadíos (horizon 2008) recense 7 196 communautés et collectifs d'irrigation."}
  - {annee: 2023, evenement: "Le décret royal 665/2023 du 18 juillet modifie les articles du règlement sur les statuts, l'assemblée générale et les recours contre les décisions des communautés."}
fiabilite:
  verifie:
    - "Articles 27, 36 et 81 à 91 du texte refondu de la loi sur les eaux, texte consolidé du BOE."
    - "Articles 198 à 227 du règlement du domaine public hydraulique, texte consolidé du BOE (rédaction de 2023-2024)."
    - "7 196 communautés et collectifs d'irrigation, 2 596 731 ha gérés sur 3 761 034 ha irrigables : Plan national des regadíos, section 4.2, site du ministère de l'Agriculture."
    - "Seuils de 1866 (50 irrigants) et de 1879 (20 irrigants et 200 ha), article 231 de la loi de 1879 : étude d'Emilio Pérez Pérez (Université de Murcie) publiée par le ministère de l'Agriculture."
    - "Création de FENACORE en 1955, 700 000 irrigants et près de deux millions d'hectares : site de FENACORE ; arrêté du 30 juillet 1955 : étude de Teresa María Navarro Caballero (2007)."
    - "Communautés d'irrigants principales titulaires du droit à l'irrigation, communautés générales constituées dans plusieurs bassins : étude de Teresa María Navarro Caballero, Revista Andaluza de Administración Pública, 2007."
  non_confirme:
    - "Nombre actuel de communautés d'usagers : le chiffre de 7 196 date de 2002, inclut d'autres collectifs d'irrigation et exclut les communautés non agricoles ; aucun total récent issu des registres des organismes de bassin n'a été trouvé."
    - "Le chiffre de 700 000 irrigants n'est pas daté et ne couvre que les entités fédérées à FENACORE."
    - "Le texte de la loi de 1866 et celui de la loi de 1879 n'ont pas été lus directement : ils sont cités d'après l'étude d'Emilio Pérez Pérez ; pour 1866, la source cite l'exposé des motifs, pas un article de la loi, et une partie de cette loi a été abrogée en 1868."
    - "Le chiffre de 7 196 communautés est daté de l'année d'approbation du plan (2002) ; l'année de collecte des données n'est pas précisée dans la section consultée."
    - "Pas de liste officielle des communautés publiée à l'échelle nationale : pas de tableau des sites."
    - "Nombre de villages : non trouvé ; aucune source ouverte ne recense les localités desservies par les communautés d'usagers."
