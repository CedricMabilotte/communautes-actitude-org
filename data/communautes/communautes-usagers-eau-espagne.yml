villages: {valeur: null, annee: null, perimetre: "", source: ""}
resume: >-
  Fiche agrégée : elle couvre le régime général des communautés d'usagers de l'eau, appelées comunidades de regantes (communautés d'irrigants) lorsque l'eau sert surtout à l'irrigation. Le texte refondu de la loi sur les eaux de 2001, article 81, oblige les usagers d'une même prise ou concession à se constituer en communauté ; l'article 82 en fait des corporations de droit public (personnes morales de droit public) rattachées à l'organisme de bassin. Chaque communauté rédige et adopte ses statuts et ordonnances, élit une junta de gobierno (conseil de direction) en assemblée générale de tous les usagers et dispose d'un ou plusieurs jurados de riego (jurys d'irrigation) qui sanctionnent les infractions aux ordonnances. Ce régime, rendu obligatoire par la loi sur les eaux de 1879 à partir de 20 irrigants et 200 hectares, comptait 7 196 communautés et collectifs d'irrigation selon le Plan national des regadíos de 2002 ; les quatre tribunaux d'irrigants reconnus comme tribunaux coutumiers font l'objet de la fiche « Communautés d'irrigants des tribunaux des eaux (Espagne) ».
