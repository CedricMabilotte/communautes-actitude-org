population: {valeur: 700000, annee: null, perimetre: "irrigants (regantes) membres des entités fédérées à la Fédération nationale des communautés d'irrigants (FENACORE), qui déclare couvrir plus de 80 % du regadío (agriculture irriguée) national ; chiffre arrondi, non daté sur la page consultée ; les usagers non irrigants (industrie, eau potable) ne sont pas comptés", source: "https://fenacore.org/fenacore/"}
