  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La Constitution garantit le droit de participer aux décisions sur les affaires des minorités nationales (art. 34, al. 2 c), « dans les conditions fixées par la loi » ; selon le rapport du gouvernement pour 2021-2022, ce droit s'exerce par le Comité pour les minorités nationales et les groupes ethniques, organe d'experts consultatif du Conseil du gouvernement pour les droits de l'homme, les minorités nationales et l'égalité des genres, dont une chambre réunit des représentants des minorités (22 membres élus le 9 juillet 2021) ; le comité émet des avis, sans droit de veto ni consentement préalable.", source: "https://www.narodnostnemensiny.vlada.gov.sk/site/assets/files/3562/report_eng.pdf"}
  langue: {valeur: "partiel", note: "Dans les communes où la minorité atteint 15 % lors de deux recensements consécutifs, les citoyens peuvent s'adresser oralement et par écrit à l'administration locale en hongrois et recevoir une réponse dans les deux langues, la version slovaque faisant foi ; décisions administratives bilingues sur demande, usage au conseil municipal, noms de communes en hongrois (loi 184/1999, § 2 à 4) ; le slovaque reste seule langue d'État (Constitution, art. 6).", source: "https://static.slov-lex.sk/static/SK/ZZ/1999/184/20240901.html"}
  education: {valeur: "partiel", note: "Les enfants des minorités nationales ont droit, en plus de l'apprentissage du slovaque, à l'éducation dans la langue de leur minorité (Constitution, art. 34, al. 2 a ; loi scolaire 245/2008, § 12, al. 3 et 5) ; le slovaque y reste matière obligatoire (§ 12, al. 3) ; la loi garantit un enseignement dans la langue, pas un système scolaire géré par la minorité.", source: "https://static.slov-lex.sk/static/SK/ZZ/2008/245/20260901.html"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre (cinquième avis, 2 février 2022) relève que le nombre d'employés municipaux maîtrisant suffisamment les langues minoritaires reste limité et demande d'évaluer et de corriger les contradictions, dans la pratique, entre la loi sur la langue d'État et la loi sur les langues minoritaires. Selon le rapport du gouvernement pour 2021-2022, 430 des 509 communes à minorité hongroise interrogées affichent l'information sur l'usage du hongrois exigée par la loi, et 101 ont reçu des écrits en hongrois.", source: "https://rm.coe.int/5th-op-slovak-republic-fr/1680a6e534"}
