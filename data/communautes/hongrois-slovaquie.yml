resume: >-
  La Constitution slovaque de 1992 garantit aux citoyens appartenant aux minorités nationales l'éducation dans leur langue, l'usage de leur langue dans les relations avec l'administration et la participation aux décisions qui les concernent (art. 34). La loi n° 184/1999 Z. z. (Recueil des lois) sur l'usage des langues des minorités nationales ouvre l'usage officiel du hongrois dans les communes où la minorité atteint 15 % de la population lors de deux recensements consécutifs ; depuis le 1er mars 2023, le règlement gouvernemental n° 35/2023 Z. z. en compte 517 pour la minorité hongroise. La loi scolaire de 2008 garantit l'éducation en langue minoritaire. La minorité n'a pas d'organe d'autogouvernement propre ; le même régime vaut pour les Ruthènes, les Roms, les Ukrainiens et les Allemands.
