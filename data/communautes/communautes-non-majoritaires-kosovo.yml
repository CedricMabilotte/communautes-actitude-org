resume: >-
  La Constitution du Kosovo de 2008 reconnaît des « communautés » (groupes nationaux, ethniques, linguistiques ou religieux présents de longue date sur le territoire) et leur attribue des droits propres (art. 57 à 62). Elle garantit à l'Assemblée un nombre minimal de sièges aux communautés rom, ashkali, égyptienne, bosniaque, turque et gorani, soit dix sièges au total (art. 64), et soumet certaines lois, dites d'intérêt vital, à la majorité de l'ensemble des députés des sièges garantis aux communautés non majoritaires, communauté serbe comprise (art. 81). Le turc, le bosnien et le romani sont langues officielles au niveau municipal (art. 5). La loi de 2008 sur l'autonomie locale prévoit un comité des communautés dans chaque commune et un vice-président de l'assemblée municipale pour les communautés là où elles atteignent 10 % des habitants. Cette fiche regroupe les six communautés autres que la communauté serbe. Le Kosovo a déclaré son indépendance en 2008 ; la Serbie ne la reconnaît pas et la résolution 1244 (1999) du Conseil de sécurité reste en vigueur.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur le Kosovo, adopté le 16 février 2023 ; le Kosovo n'étant pas partie, l'avis est adopté en application de l'accord entre la MINUK et le Conseil de l'Europe. Résumé, § 1 : cadre juridique « solide » ; § 7 : mise en œuvre de la législation linguistique insuffisante.", annee: 2023, source: "https://rm.coe.int/5th-op-kosovo-en/1680ab6a79"}
