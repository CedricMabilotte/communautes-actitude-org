droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les lois d'intérêt vital (limites et compétences des communes, droits des communautés, usage des langues, élections locales, patrimoine culturel, liberté religieuse, éducation, symboles) exigent la majorité des députés et la majorité des députés des sièges garantis aux communautés non majoritaires, communauté serbe comprise, Constitution, art. 81 ; le Conseil consultatif des communautés, placé auprès du président, peut commenter tôt les projets du gouvernement, art. 60 ; le vice-président municipal pour les communautés peut saisir la Cour constitutionnelle d'un acte municipal contraire à leurs droits, art. 62.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  langue: {valeur: "partiel", note: "Le turc, le bosnien et le romani ont le statut de langues officielles au niveau municipal, Constitution, art. 5, al. 2 ; une langue est officielle dans une commune où la communauté atteint 5 % de la population et le turc l'est à Prizren, et « en usage officiel » au-delà de 3 % ou par tradition, loi n° 02/L-37, art. 2.3 et 2.4.", source: "https://gzk.rks-gov.net/ActDetail.aspx?ActID=2440"}
  education: {valeur: "partiel", note: "Enseignement public préscolaire, primaire et secondaire dans la langue de la communauté, avec des seuils d'ouverture de classes plus bas que la norme, et droit de créer des établissements privés pouvant recevoir des fonds publics, Constitution, art. 59, al. 3 et 4 ; loi n° 03/L-047, art. 8.1 ; pas de système éducatif géré par les communautés.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Sièges minimaux garantis à l'Assemblée de 120 membres : Roms 1, Ashkalis 1, Égyptiens 1, plus 1 siège à celle des trois qui obtient le plus de voix, Bosniaques 3, Turcs 2, Goranis 1, Constitution, art. 64, al. 2 ; au moins un ministre et deux vice-ministres issus d'une communauté non majoritaire autre que serbe, art. 96 ; un tiers du Comité des droits et intérêts des communautés, art. 78 ; vice-président de l'assemblée municipale et vice-maire pour les communautés dans les communes où elles atteignent 10 %, loi n° 03/L-040, art. 54 et 61.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2023, le Comité consultatif du Conseil de l'Europe juge la mise en œuvre de la législation linguistique insuffisante et demande davantage de moyens et d'engagement politique (résumé, § 7) ; il note que les effets de la stratégie 2017-2021 pour les Roms et les Ashkalis n'ont pas été évalués et que la stratégie 2022-2026, adoptée en juillet 2022, reste à appliquer pleinement (§ 5).", source: "https://rm.coe.int/5th-op-kosovo-en/1680ab6a79"}
