resume: >-
  Les communautés agricoles (comunidades agrícolas) regroupent des propriétaires d'un terrain rural commun, issu des concessions de terres (mercedes de tierras) de l'époque coloniale, surtout dans la région de Coquimbo. Le décret ayant force de loi n° 5 de 1968 du ministère de l'Agriculture, modifié par la loi 19.233 de 1993, organise ce régime : terrain commun, parcelles d'usage permanent attribuées à chaque comunero, c'est-à-dire chaque titulaire de droits inscrit sur la liste de la communauté (« goce singular ») et parcelles d'usage temporaire (« lluvias »). Chaque communauté a la personnalité juridique et se gouverne par une assemblée générale des comuneros (Junta General) et un conseil d'administration élu (Directorio). Le ministère des Biens nationaux compte 197 communautés ; aucune nouvelle communauté ne peut se constituer sous ce régime depuis le 5 août 1998.
