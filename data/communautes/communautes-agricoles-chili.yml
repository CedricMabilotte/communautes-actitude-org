base_nationale:
  - {instrument: "Décret ayant force de loi n° 5 (DFL 5) du ministère de l'Agriculture, texte refondu du DFL R.R.A. n° 19 de 1963, publié au Journal officiel le 17 janvier 1968", nature: "loi", annee: 1968, source: "https://www.bienesnacionales.cl/?page_id=1887"}
  - {instrument: "Loi 18.353 de 1984 modifiant le DFL 5", nature: "loi", annee: 1984, source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  - {instrument: "Loi 19.233, publiée au Journal officiel le 5 août 1993, modifiant le DFL 5", nature: "loi", annee: 1993, source: "https://www.bienesnacionales.cl/?page_id=1887"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Junta General (assemblée de tous les comuneros) est la première autorité de la communauté et ses décisions obligent tous les comuneros ; elle élit un Directorio de cinq à onze membres dont le président représente la communauté (DFL 5, art. 16 à 21) ; la loi 19.233 de 1993 donne la personnalité juridique aux communautés et supprime la présence obligatoire d'un avocat de l'administration aux assemblées.", source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque communauté a des statuts propres, modifiables par une assemblée extraordinaire aux deux tiers des présents représentant 50 % des droits inscrits ; la Junta General réglemente l'usage du terrain commun, fixe les quotas de bétail au pâturage et établit des sanctions pécuniaires (DFL 5, art. 16 et 18), dans les limites de la loi.", source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  justice_propre: {valeur: "partiel", note: "Les conflits entre comuneros, ou entre eux et la communauté, sur l'usage des terres et des biens communs sont soumis à l'arbitrage du Directorio, qui cherche à concilier les parties ; à défaut, le juge civil est saisi (DFL 5, art. 22).", source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio/10221/19924/1/COMUNIDADES%20AGRICOLAS.f_v4.doc"}
  terres: {valeur: "reconnu", note: "La communauté est propriétaire du terrain commun et a la personnalité juridique dès son inscription au registre foncier (Conservador de Bienes Raíces) ; l'aliénation ou la mise en gage des terres communes exige l'accord de tous les comuneros (DFL 5, art. 24), sauf clause statutaire à deux tiers des comuneros et 70 % des droits (art. 24, al. 2) ou projet d'un organisme public ou municipal (art. 25) ; le régime de régularisation individuelle des terres (décret-loi 2.695) ne s'y applique pas (art. 25, rédaction de 1993).", source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  ressources: {valeur: "partiel", note: "Les comuneros ont l'usage des droits d'eau inscrits au nom de la communauté, des eaux de pluie recueillies sur le terrain commun et des sources qui naissent et meurent dans le terrain (DFL 5, art. 1 bis) ; la Junta General approuve la répartition de ces droits et fixe des mesures de protection des sols, des eaux et des forêts (art. 18).", source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  consentement: {valeur: "partiel", note: "L'aliénation ou la mise en gage des terres communes et des droits d'eau exige le consentement de tous les comuneros (DFL 5, art. 24) ; pour un projet d'un organisme de l'État ou d'une commune, l'accord de la moitié des comuneros présents à la Junta General suffit (art. 25).", source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La Junta General fixe le budget de la communauté et les cotisations des comuneros, proportionnelles aux parcelles attribuées et à l'usage des biens communs (DFL 5, art. 18) ; le comunero qui ne paie pas depuis plus de 90 jours perd son poids dans le calcul des quorums (art. 42 bis) ; aucun pouvoir fiscal n'est prévu.", source: "https://doi.org/10.22199/issn.0718-9753-2294"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le ministère des Biens nationaux apporte un appui technique et juridique gratuit aux communautés (loi 19.233, art. 4) ; une étude de terrain sur les communautés de la vallée d'Atelcura (Jorquera et Santibáñez, Antípoda, 2026) relève des disputes sur les terres, l'eau et les puits, et des programmes publics contre la sécheresse qui modifient les modes de décision des communautés.", source: "https://doi.org/10.7440/antipoda.11730"}
chronologie:
  - {annee: 1544, evenement: "Premières concessions de terres (mercedes de tierras) dans le Norte Chico, à l'origine des terrains communs."}
  - {annee: 1963, evenement: "Le DFL R.R.A. n° 19, pris sous la loi de réforme agraire 15.020, encadre pour la première fois les communautés agricoles."}
  - {annee: 1968, evenement: "Publication du DFL 5 (17 janvier), texte refondu du DFL n° 19."}
  - {annee: 1984, evenement: "La loi 18.353 permet l'inscription individuelle des parcelles d'usage permanent sous le décret-loi 2.695."}
  - {annee: 1993, evenement: "La loi 19.233 (5 août) donne la personnalité juridique aux communautés, définit goce singular, lluvia et terrain commun, supprime la tutelle de l'administration sur les assemblées, rend au Directorio la conciliation des conflits internes et ferme la voie de l'inscription individuelle."}
  - {annee: 1998, evenement: "Fin du délai pour constituer de nouvelles communautés sous le DFL 5 (5 août)."}
fiabilite:
  verifie: ["Dates du DFL 5 (26 décembre 1967, publié le 17 janvier 1968) et de la loi 19.233 (5 août 1993), et vigueur des deux textes, d'après le ministère des Biens nationaux.", "Nombre de communautés par région (187, 2, 7, 1) et définitions légales de comunero, goce singular, lluvia et terrain commun, d'après le ministère des Biens nationaux.", "Organes (Junta General, Directorio), arbitrage du Directorio (art. 22), règles d'aliénation et droits d'eau, d'après le rapport de la Bibliothèque du Congrès national (2014) ; numéros des art. 1 bis, 18, 24 et 25 d'après Rabuco Ramírez (1996).", "Personnalité juridique, inapplicabilité du décret-loi 2.695 (art. 25), exception pour les projets publics (art. 25), quorums, cotisations (art. 18 g et 42 bis) et rétablissement de la conciliation par le Directorio (art. 22) en 1993, d'après Rabuco Ramírez (Revista de Derecho, Universidad Católica del Norte, 1996).", "Disputes sur les terres, l'eau et les puits dans les communautés de la vallée d'Atelcura, d'après Jorquera Álvarez et Santibáñez Yáñez (Antípoda, 2026)."]
  non_confirme: ["Le texte consolidé du DFL 5 n'a pas pu être ouvert sur le portail Ley Chile ; les articles sont cités d'après le rapport de la Bibliothèque du Congrès national et l'article de Rabuco Ramírez (1996), qui peut ne pas refléter des modifications postérieures.", "Écart entre 192 communautés (recensement agricole de 2007, cité par la Bibliothèque du Congrès national), 178 (Bibliothèque du Congrès national, 2014, qui l'explique par des ventes de goces singulares) et 197 (ministère des Biens nationaux, page non datée) ; la date du chiffre de 197 n'est pas indiquée et l'année 2026 est celle de la consultation.", "Surface : le million d'hectares (2014) est une approximation ; la part de 25 % de la surface du Norte Chico (Memoria Chilena) n'est pas datée.", "Nombre de comuneros et population : aucun chiffre officiel récent trouvé.", "Liste officielle des communautés : le site de l'Office technique des communautés agricoles (OTCA) n'a pas pu être ouvert ; aucun tableau des sites n'est joint.", "Nombre de villages : non trouvé ; aucune source ouverte ne donne le nombre de villages ou de localités situés sur les terrains des communautés agricoles."]
