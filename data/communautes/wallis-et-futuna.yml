resume: >-
  Population des îles Wallis et Futuna, collectivité d'outre-mer française régie par la loi statutaire du 29 juillet 1961. La loi garantit le respect des croyances et des coutumes tant qu'elles ne sont pas contraires aux principes généraux du droit. Trois rois coutumiers (le Lavelua à Uvea, le Tuiagaifo à Alo, le Keletaona à Sigave) siègent au conseil territorial et président les conseils des trois circonscriptions, calquées sur les royaumes. La chefferie règle les questions foncières et les différends entre familles.
reconnaissance_regionale: []
reconnaissance_onu: []
base_nationale:
  - {instrument: "Loi n° 61-814 du 29 juillet 1961 conférant aux îles Wallis et Futuna le statut de territoire d'outre-mer", nature: "statut_autonomie", annee: 1961, source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  - {instrument: "Décret n° 62-287 du 14 mars 1962 (attributions du conseil territorial)", nature: "loi", annee: 1962, source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  - {instrument: "Constitution française, art. 74 (collectivité d'outre-mer depuis la révision du 28 mars 2003)", nature: "constitution", annee: 2003, source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil territorial réunit les trois rois et trois membres nommés par le préfet après approbation de l'Assemblée territoriale ; chaque roi préside le conseil de sa circonscription (décret de 1962, loi de 1961). L'exécutif du territoire reste confié au représentant de l'État et le conseil territorial a un rôle consultatif.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "conteste", note: "L'article 5 de la loi de 1961 institue une juridiction de droit local ; faute de consensus local, elle n'a jamais été mise en place.", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  terres: {valeur: "partiel", note: "Le régime local des droits et biens fonciers relève de l'Assemblée territoriale ; l'essentiel des terres est divisé en propriétés familiales coutumières, perpétuelles et inaliénables, et la chefferie règle les litiges fonciers.", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le président de la République a rappelé en 2016 que toute réforme de l'équilibre institutionnel issu de la loi de 1961 est soumise à l'approbation des autorités coutumières.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les trois circonscriptions ont la personnalité morale et un budget autonome, mais aucune ressource fiscale propre ; elles dépendent des dotations de l'État. L'État verse une dotation annuelle aux rois et une indemnité aux ministres et chefs coutumiers.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Les personnes relevant du statut de droit local conservent un statut civil coutumier ; ce statut figure parmi les compétences de l'Assemblée territoriale.", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La loi de 1961 n'a pas fait l'objet de modifications majeures ; les projets de réforme se heurtent à l'attachement des autorités coutumières au texte d'origine. L'Assemblée territoriale a des attributions limitées : ses délibérations ne deviennent effectives qu'après approbation de l'administrateur supérieur.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
