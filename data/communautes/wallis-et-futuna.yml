resume: >-
  Population des îles Wallis et Futuna, collectivité d'outre-mer française régie par la loi statutaire du 29 juillet 1961. La loi garantit le respect des croyances et des coutumes tant qu'elles ne sont pas contraires aux principes généraux du droit. Trois rois coutumiers (le Lavelua à Uvea, le Tu'iagaifo à Alo, le Keleta'ona à Sigave) siègent au conseil territorial et président les conseils des trois circonscriptions, calquées sur les royaumes. Le préfet, administrateur supérieur, détient l'exécutif du territoire. La chefferie règle les questions foncières et les différends entre familles.
