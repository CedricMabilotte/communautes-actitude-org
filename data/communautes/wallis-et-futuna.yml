reconnaissance_onu: []
base_nationale:
  - {instrument: "Loi n° 61-814 du 29 juillet 1961 conférant aux îles Wallis et Futuna le statut de territoire d'outre-mer", nature: "statut_autonomie", annee: 1961, source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  - {instrument: "Décret du 14 mars 1962 fixant les attributions du conseil territorial", nature: "loi", annee: 1962, source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  - {instrument: "Constitution française, art. 74 (collectivité d'outre-mer depuis la révision du 28 mars 2003)", nature: "constitution", annee: 2003, source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil territorial réunit les trois rois et trois membres nommés par le préfet après approbation de l'Assemblée territoriale (20 membres élus) ; chaque roi préside le conseil de sa circonscription (loi de 1961, décret du 14 mars 1962). L'exécutif du territoire reste confié au représentant de l'État et le conseil territorial a en pratique un rôle consultatif.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée territoriale délibère dans des matières limitativement énumérées, dont le statut civil coutumier et le régime local des droits et biens fonciers ; ses délibérations ne sont exécutoires qu'après approbation de l'administrateur supérieur, ce que le Sénat qualifie de tutelle administrative.", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  justice_propre: {valeur: "conteste", note: "L'article 5 de la loi de 1961 institue une juridiction de droit local (tribunal pour les litiges entre personnes de statut coutumier) ; organisée par un arrêté de 1978, elle n'a jamais été constituée faute de consensus local. Les litiges fonciers sont tranchés en pratique par les autorités coutumières (chef de village, chef de district, conseil des ministres, roi).", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  terres: {valeur: "partiel", note: "L'Assemblée territoriale est compétente pour le régime local des droits et biens fonciers, mais n'a jamais exercé cette compétence ; l'essentiel des terres est divisé en propriétés familiales coutumières, perpétuelles et inaliénables, et la chefferie règle les litiges fonciers.", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  ressources: {valeur: "partiel", note: "L'Assemblée territoriale est compétente pour l'agriculture, la forêt, les eaux non maritimes et la pêche (liste limitative des compétences de l'Assemblée).", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le régime fiscal du territoire repose sur une délibération de l'Assemblée territoriale du 4 août 1977 ; l'Assemblée vote le budget, dont l'exécution revient au préfet. Les trois circonscriptions ont un budget autonome sans ressource fiscale propre et dépendent des dotations de l'État.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  representation: {valeur: "reconnu", note: "Le territoire élit un député et un sénateur qui lui sont propres.", source: "https://www.ieom.fr/IMG/pdf/rapport-annuel-economique-wallis-et-futuna-2020.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Les personnes relevant du statut de droit local conservent un statut civil coutumier ; ce statut figure parmi les compétences de l'Assemblée territoriale.", source: "https://www.senat.fr/rap/r14-103/r14-103_mono.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le préfet, « chef du territoire » (article 9 de la loi de 1961), détient seul l'exécutif ; l'Assemblée territoriale et les chefs coutumiers délibèrent sans décision finale. En 2016, l'administrateur supérieur ne reconnaît qu'un des deux rois intronisés à Uvea. Depuis 2014, l'Assemblée territoriale refuse de modifier le code minier pour ouvrir l'exploration des grands fonds, et en 2018 les rois d'Alo et de Sigave refusent l'exploitation et l'exploration (V. Muni Toke, Journal de la Société des Océanistes, 2024). Les tentatives de réforme du statut se heurtent à l'attachement des autorités coutumières au texte d'origine (IEOM, 2020).", source: "https://journals.openedition.org/jso/16161"}
chronologie:
  - {annee: 1842, evenement: "Première demande de protectorat émanant du roi de Wallis."}
  - {annee: 1888, evenement: "Protectorat français unifié sur Wallis et Futuna."}
  - {annee: 1959, evenement: "Référendum du 27 décembre : la population approuve le statut de territoire d'outre-mer."}
  - {annee: 1961, evenement: "Loi n° 61-814 du 29 juillet : statut de territoire d'outre-mer."}
  - {annee: 2003, evenement: "Révision constitutionnelle : collectivité d'outre-mer (art. 74)."}
  - {annee: 2014, evenement: "L'État demande à l'Assemblée territoriale de modifier le code minier pour accorder des permis d'exploration des grands fonds ; l'Assemblée refuse."}
  - {annee: 2016, evenement: "Deux rois sont intronisés à Uvea en avril ; l'administrateur supérieur ne reconnaît que Patalione Kanimoa comme Lavelua."}
  - {annee: 2018, evenement: "Les rois d'Alo et de Sigave refusent l'exploitation et l'exploration des grands fonds près de Futuna."}
  - {annee: 2022, evenement: "Démission du roi d'Alo en octobre ; le trône reste vacant au moins jusqu'en mai 2023."}
  - {annee: 2023, evenement: "Recensement : 11 151 habitants dans 36 villages."}
  - {annee: 2025, evenement: "Le 1er octobre, l'enseignement primaire, concédé depuis 1969 à la mission catholique, passe sous la direction du vice-rectorat."}
fiabilite:
  verifie: ["Composition du conseil territorial, organisation des circonscriptions et de la chefferie, régime fiscal (rapport annuel de l'IEOM 2020).", "Juridiction de droit local non constituée, compétences de l'Assemblée territoriale, propriété familiale (rapport du Sénat n° 103, 2014-2015).", "Population et liste des villages (Insee, 2023).", "Rôle exécutif du préfet, crise de succession de 2016, refus sur les grands fonds (Journal de la Société des Océanistes, 2024).", "Vacance du trône d'Alo (Wallis-et-Futuna la 1ère, 10 mai 2023) ; transfert de l'enseignement primaire (Wallis-et-Futuna la 1ère, 30 septembre 2025)."]
  non_confirme: ["Texte consolidé de la loi de 1961 (Légifrance inaccessible) : numéro exact des articles sur le statut personnel et les biens.", "Numéro du décret du 14 mars 1962 sur le conseil territorial : le rapport de l'IEOM cite tantôt le n° 62-287, tantôt le n° 62-288.", "Obligation juridique de consulter les autorités coutumières : le président de la République a déclaré en 2016 que toute réforme du statut de 1961 est soumise à leur approbation (IEOM, 2020), mais aucun texte en vigueur n'a été trouvé qui l'impose.", "Désignation d'un nouveau roi d'Alo après mai 2023 : non vérifié.", "Place des langues wallisienne et futunienne dans l'enseignement."]
