villages: {valeur: 304, annee: 2024, perimetre: "communautés autochtones et afrodescendantes des 23 territoires titrés de la RACCN, de la RACCS et de la zone de régime spécial de l'Alto Wangki et du Bocay (dont 235 dans les 16 territoires de la RACCN) ; les localités métisses ne sont pas comptées ; chiffre d'un rapport d'organisations de la société civile à l'Examen périodique universel", source: "https://upr-info.org/sites/default/files/country-document/2025-04/JS17_UPR47_Nicaragua.pdf"}
resume: >-
  Les deux régions autonomes de la côte caraïbe regroupent des peuples autochtones (Miskitu, Mayangna, Ulwa, Rama) et afrodescendants (Kriol, Garífuna). Le statut d'autonomie (loi 28 de 1987) y établit des conseils régionaux élus. La loi 445 de 2003 organise la démarcation et le titre collectif des terres communales. La Constitution publiée en février 2025 maintient le régime d'autonomie et l'usage officiel des langues de la côte, et place les organes régionaux sous la coordination de la présidence. Les territoires de l'Alto Wangki et du Bocay, hors des régions autonomes, ont leur propre fiche : « Territoires miskitu et mayangna de l'Alto Wangki et du Bocay ».
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communauté mayagna (sumo) Awas Tingni c. Nicaragua du 31 août 2001 : l'État doit délimiter, démarquer et titrer les terres de la communauté, située dans l'actuelle RACCN.", annee: 2001, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_79_esp.pdf"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Nicaragua ratifie la Convention 169 de l'OIT le 25 août 2010 (en vigueur le 25 août 2011). Il notifie le 28 février 2025 son retrait de l'OIT, effectif le 28 février 2027 ; selon l'article 1(5) de la Constitution de l'OIT, le retrait n'affecte pas les obligations des conventions ratifiées pour la période qu'elles prévoient.", annee: 2010, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Nicaragua vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Constitution politique du Nicaragua (texte publié à La Gaceta le 18 février 2025), art. 16, 18, 81, 82, 120, 161, 166, 167 et 170", nature: "constitution", annee: 2025, source: "https://www.asamblea.gob.ni/assets/constitucion.pdf"}
  - {instrument: "Loi 28, Statut d'autonomie des régions de la Côte caraïbe (texte consolidé 2016)", nature: "statut_autonomie", annee: 1987, source: "https://faolex.fao.org/docs/pdf/nic163854-2016.pdf"}
  - {instrument: "Loi 445 sur le régime de propriété communale des peuples autochtones et communautés ethniques", nature: "loi", annee: 2003, source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 28 (art. 19) institue dans chaque région un Conseil régional de 45 membres élus et la Constitution de 2025 (art. 166) fixe leur mandat à six ans ; la loi 445 de 2003 (art. 4 et 5) reconnaît l'assemblée communale et les autorités communales et territoriales traditionnelles. La Constitution de 2025 (art. 120) charge la présidence de la République de coordonner les organes régionaux et municipaux.", source: "https://www.asamblea.gob.ni/assets/constitucion.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 28 (art. 23) permet au Conseil régional de régler par résolutions et ordonnances les matières régionales de l'article 8, dans le cadre des politiques nationales.", source: "https://faolex.fao.org/docs/pdf/nic163854-2016.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi 28 (art. 18) prévoit une administration de la justice régie par des règles particulières aux cultures de la côte ; la loi 445 (art. 13) mentionne le juge communal (wihta).", source: "https://faolex.fao.org/docs/pdf/nic163854-2016.pdf"}
  terres: {valeur: "reconnu", note: "La loi 445 de 2003 (art. 3 et 24) rend les terres communales inaliénables, insaisissables et imprescriptibles (elles ne se perdent pas avec le temps) ; la Constitution de 2025 (art. 81 et 167) reconnaît la propriété communale.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  ressources: {valeur: "partiel", note: "La Constitution de 2025 (art. 167) soumet les concessions sur les ressources naturelles à l'approbation du Conseil régional ; la loi 445 (art. 34) attribue 25 % des droits perçus à la communauté concernée.", source: "https://www.asamblea.gob.ni/assets/constitucion.pdf"}
  consentement: {valeur: "partiel", note: "La loi 445 de 2003 (art. 16 et 17) impose la consultation préalable des communautés avant toute concession sur leur sous-sol ; la communauté répond positivement ou négativement.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  langue: {valeur: "reconnu", note: "La Constitution de 2025 (art. 18) fait du créole anglais, du miskitu, du mayangna, de l'ulwa, du garífuna et du rama des langues d'usage communautaire et officiel sur la côte caraïbe.", source: "https://www.asamblea.gob.ni/assets/constitucion.pdf"}
  education: {valeur: "partiel", note: "La loi 28 (art. 11) garantit l'éducation en langue maternelle et en espagnol, dans le cadre du système éducatif national.", source: "https://faolex.fao.org/docs/pdf/nic163854-2016.pdf"}
  fiscalite: {valeur: "partiel", note: "La loi 28 (art. 8 et 23) permet aux régions d'établir des impôts régionaux selon les lois nationales et d'élaborer un avant-projet de budget régional.", source: "https://faolex.fao.org/docs/pdf/nic163854-2016.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "En octobre 2023, le Conseil suprême électoral retire la personnalité juridique au parti autochtone YATAMA ; des colons ont pris environ 21 000 hectares aux Miskitu (Human Rights Watch, 2024). Le HCDH signale en décembre 2024 des attaques continues de colons dans la RACCN. L'IWGIA (2025) écrit que la réforme constitutionnelle de fin 2024 met fin à l'autonomie administrative et politique des régions. En juin 2026, le Groupe d'experts des droits de l'homme sur le Nicaragua (ONU) relie la mort en détention du député de YATAMA Brooklyn Rivera à des violations contre les peuples de la côte, dont l'infiltration de leurs structures d'autogouvernement.", source: "https://www.ohchr.org/es/press-releases/2026/06/nicaragua-un-group-experts-appalled-brooklyn-riveras-death-demands"}
chronologie:
  - {annee: 1987, evenement: "Adoption de la loi 28, Statut d'autonomie des régions de la côte atlantique."}
  - {annee: 2001, evenement: "Arrêt de la Cour interaméricaine des droits de l'homme dans l'affaire Awas Tingni."}
  - {annee: 2003, evenement: "Adoption de la loi 445 sur la propriété communale."}
  - {annee: 2010, evenement: "Ratification de la Convention 169 de l'OIT."}
  - {annee: 2023, evenement: "Retrait de la personnalité juridique du parti YATAMA."}
  - {annee: 2025, evenement: "Nouvelle Constitution publiée le 18 février ; le régime d'autonomie est maintenu à l'article 167, la présidence coordonne les organes régionaux (art. 120)."}
  - {annee: 2025, evenement: "Le Nicaragua notifie son retrait de l'OIT, effectif en février 2027."}
  - {annee: 2026, evenement: "Le gouvernement annonce le 31 mai la mort en détention de Brooklyn Rivera, dirigeant de YATAMA arrêté en septembre 2023."}
