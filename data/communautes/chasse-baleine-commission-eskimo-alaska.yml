effectivite: {valeur: "effective", note: "La gestion conjointe est appliquée sans interruption depuis 1981 : l'accord a été renouvelé en 1998, 2003, 2008, 2013, 2019 et 2026, et la CBI a fixé le quota en 2018 pour 2019-2025, puis l'a prolongé en 2024 pour 2026-2031. Un mémoire de l'université de Cambridge (Huntington, 1989) décrit la délégation de la gestion et de l'administration du quota à l'AEWC depuis 1981. Avant 2018, les chasseurs devaient obtenir de la CBI le renouvellement du quota tous les six ans (Åman, 2024) ; depuis, la prolongation est automatique si le comité scientifique de la CBI ne s'y oppose pas et si ni les États-Unis ni la Russie ne demandent de changement (avis de la NOAA, 2026).", source: "https://www.repository.cam.ac.uk/items/0f559803-4bb0-4155-adbb-cf288b0759b7"}
chronologie:
  - {annee: 1977, evenement: "La CBI supprime l'exemption de chasse aborigène pour la baleine boréale ; des capitaines baleiniers fondent l'AEWC."}
  - {annee: 1978, evenement: "La CBI reconnaît la chasse de subsistance à la baleine boréale et autorise le débarquement de 12 baleines, réparties entre neuf villages."}
  - {annee: 1981, evenement: "L'AEWC adopte son plan de gestion (4 mars) et conclut un premier accord de coopération avec la NOAA."}
  - {annee: 1992, evenement: "Little Diomede est reconnu comme village baleinier."}
  - {annee: 1994, evenement: "La section 119 du Marine Mammal Protection Act autorise les accords de cogestion avec les organisations autochtones d'Alaska."}
  - {annee: 2008, evenement: "Point Lay est reconnu comme village baleinier et reçoit son propre quota ; le nombre de villages passe à onze."}
  - {annee: 2024, evenement: "La 69e réunion de la CBI reconduit les quotas de chasse aborigène pour la période 2026-2031."}
  - {annee: 2026, evenement: "Nouvel accord NOAA–AEWC, signé les 30 mars et 3 avril, en vigueur jusqu'au 31 mars 2032 ; 93 coups attribués à l'AEWC pour 2026."}
