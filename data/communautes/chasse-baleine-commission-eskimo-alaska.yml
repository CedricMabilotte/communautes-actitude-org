resume: >-
  Fiche agrégée : elle couvre les onze villages baleiniers inupiat et yupik d'Alaska réunis dans la Commission eskimo baleinière d'Alaska (Alaska Eskimo Whaling Commission, AEWC), créée en 1977 après la suppression par la Commission baleinière internationale (CBI) de l'exemption de chasse aborigène pour la baleine boréale. Depuis 1981, l'AEWC applique son propre plan de gestion (Management Plan) et gère la chasse avec l'Agence nationale océanique et atmosphérique (NOAA) par des accords de coopération renouvelés, le dernier conclu en 2026 pour la période allant jusqu'à 2031. L'AEWC répartit entre les villages les coups autorisés (93 en 2026), enregistre les capitaines baleiniers et sanctionne les infractions par un mécanisme de recouvrement qui remplace, pendant la durée de l'accord, les poursuites fédérales. Le cadre juridique comprend l'exemption de subsistance des Autochtones d'Alaska du Marine Mammal Protection Act (loi sur la protection des mammifères marins), sa section 119 sur la cogestion, le Whaling Convention Act (loi d'application de la convention baleinière) et le quota de chasse aborigène fixé par la CBI.
