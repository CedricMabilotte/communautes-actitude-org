  - {instrument: "Marine Mammal Protection Act, section 119, 16 U.S.C. 1388 (Pub. L. 103-238, 1994) : accords de coopération avec les organisations autochtones d'Alaska pour la cogestion de l'usage de subsistance", nature: "loi", annee: 1994, source: "https://www.law.cornell.edu/uscode/text/16/1388"}
  - {instrument: "Whaling Convention Act (16 U.S.C. 916 et suiv.) et règlement 50 CFR part 230 (Whaling provisions) : licences délivrées aux capitaines désignés par l'organisation baleinière autochtone, quotas répartis par celle-ci entre villages ou capitaines", nature: "loi", annee: 1949, source: "https://www.ecfr.gov/current/title-50/chapter-II/subchapter-B/part-230"}
  - {instrument: "Accord de coopération entre la NOAA et l'AEWC, version modifiée de 2026, conclu en application du Marine Mammal Protection Act et du Whaling Convention Act (section 7), en vigueur jusqu'au 31 mars 2032 (accords antérieurs publiés par la NOAA : 1998, 2003, 2008, 2013, 2019)", nature: "loi", annee: 2026, source: "https://www.fisheries.noaa.gov/s3/2026-05/final-noaa-aewc-2026-2031-cooperative-agreement_signed.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'AEWC, « association gouvernant les chasseurs de baleines eskimo d'Alaska » selon l'accord de 2026 (section 2), est reconnue par la NOAA comme organisation baleinière autochtone (50 CFR 230.2) ; son conseil réunit un capitaine baleinier par village. Ses pouvoirs sont limités par l'accord, et la NOAA peut reprendre la gestion fédérale après préavis si l'AEWC ne remplit pas ses obligations.", source: "https://www.fisheries.noaa.gov/s3/2026-05/final-noaa-aewc-2026-2031-cooperative-agreement_signed.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le plan de gestion adopté par l'AEWC le 4 mars 1981 et modifié depuis s'impose aux capitaines enregistrés (accord de 2026, section 4(2)) ; il ne s'applique que dans la mesure où il est compatible avec l'accord (section 2) et doit réserver la viande et les produits comestibles à la consommation autochtone (section 4(4)).", source: "https://www.fisheries.noaa.gov/s3/2026-05/final-noaa-aewc-2026-2031-cooperative-agreement_signed.pdf"}
  justice_propre: {valeur: "partiel", note: "Les infractions des capitaines enregistrés et de leurs équipages au plan de gestion, au règlement de la CBI et aux lois fédérales sur la chasse aborigène relèvent d'un mécanisme exclusif : sanctions pécuniaires civiles fixées et recouvrées par l'AEWC ; en cas de désaccord avec la NOAA, un juge administratif fédéral tranche (accord de 2026, section 5).", source: "https://www.fisheries.noaa.gov/s3/2026-05/final-noaa-aewc-2026-2031-cooperative-agreement_signed.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'AEWC répartit entre les villages baleiniers les coups autorisés (accord de 2026, section 4(3) ; 50 CFR 230.6) ; le total (93 coups en 2026) est négocié chaque année avec la NOAA dans la limite du quota de la CBI pour 2026-2031.", source: "https://www.govinfo.gov/content/pkg/FR-2026-04-02/html/2026-06366.htm"}
  consentement: {valeur: "partiel", note: "La NOAA doit consulter l'AEWC sur toute action fédérale envisagée pouvant affecter la baleine boréale ou la chasse de subsistance (accord de 2026, section 9) ; il s'agit d'une consultation, sans exigence de consentement.", source: "https://www.fisheries.noaa.gov/s3/2026-05/final-noaa-aewc-2026-2031-cooperative-agreement_signed.pdf"}
