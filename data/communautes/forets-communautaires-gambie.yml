resume: >-
  Fiche agrégée : elle couvre les villages et groupes de villages de Gambie titulaires d'une forêt communautaire. La loi forestière de 1998 (Forest Act) définit la forêt communautaire comme une forêt « possédée et gérée » par une ou plusieurs communautés, la communauté étant un village ou une ville (art. 2). Un comité forestier villageois obtient d'abord un accord préliminaire de trois ans (Preliminary Community Forest Management Agreement, PCFMA), puis l'accord définitif (Community Forest Management Agreement, CFMA), qui confère la propriété de la forêt pour une durée indéterminée. La politique forestière nationale 2023-2032 cite une loi forestière et un règlement forestier de 2018, dont le texte n'a pas été consulté ; un programme distinct associe des villages à la cogestion des parcs forestiers de l'État (Joint Forest Park Management, JFPM). Selon la politique forestière nationale 2023-2032, 33 342,93 hectares étaient sous contrôle communautaire à la fin de la période 2010-2019.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2015-2020, transmis à la CDB : environ 18 000 hectares de forêts communautaires, introduction de la foresterie communautaire dans les Foni, accords de cogestion de 22 parcs forestiers de la région Centre (CRR), d'un parc en région du Haut-Fleuve (URR) et d'un parc en région du Bas-Fleuve (LRR) de 2000 à 2007, décentralisation du service forestier « pour faciliter le transfert de la propriété des forêts aux communautés locales »", annee: 2015, source: "https://www.cbd.int/doc/world/gm/gm-nbsap-v2-en.pdf"}
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national de la Gambie à la Convention sur la diversité biologique (mai 2014) : introduction de la foresterie communautaire et d'autres approches de gestion participative, 18 000 hectares de forêts communautaires, comités forestiers communautaires (Community Forest Committees)", annee: 2014, source: "https://www.cbd.int/doc/world/gm/gm-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Loi forestière de 1998 (Forest Act 1998), partie VII, articles 58 à 72 (création des forêts communautaires), articles 36 à 38 (fonds locaux) et article 89 (règlements des comités forestiers)", nature: "loi", annee: 1998, source: "https://faolex.fao.org/docs/pdf/gam19052.pdf"}
  - {instrument: "Règlement forestier de 1998 (Forest Regulations 1998), parties sur les plans de gestion et sur l'exploitation dans les forêts communautaires (articles 39 et 40)", nature: "loi", annee: 1998, source: "https://faolex.fao.org/docs/pdf/gam50110.pdf"}
  - {instrument: "Loi forestière de 2018 (Forest Act 2018) et règlement forestier de 2018, cités dans la liste des références de la politique forestière nationale 2023-2032 ; texte non consulté", nature: "loi", annee: 2018, source: "https://dspd.forte-data.com/d/7d5d8537-ed2e-11ef-b086-029254d29bb1"}
droits:
  autogouvernement: {valeur: "partiel", note: "Toute communauté qui veut gérer une forêt communautaire constitue un comité forestier, dont les membres viennent de tous les groupes d'intérêt de la communauté et parmi lesquels des responsables sont élus ; le comité est enregistré auprès du service forestier à l'approbation de l'accord préliminaire (loi forestière de 1998, art. 59) ; la gestion se fait « avec l'appui et sous la supervision » du service forestier (art. 11 b).", source: "https://faolex.fao.org/docs/pdf/gam19052.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les comités forestiers peuvent édicter des règlements (by-laws) pour leur forêt communautaire, qui ne peuvent contredire la loi ni ses règlements d'application (loi forestière de 1998, art. 2 et 89) ; l'usage non commercial par un membre requiert le consentement du comité, qui peut percevoir les redevances fixées par ces règlements (règlement forestier de 1998, art. 40).", source: "https://faolex.fao.org/docs/pdf/gam19052.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'accord définitif (CFMA) confère à la communauté la propriété de la forêt communautaire pour une durée indéterminée (loi forestière de 1998, art. 67, al. 5), mais le ministre peut retirer le statut si une évaluation conclut à une gestion non durable (art. 72), et un accord préliminaire non rempli fait retour à la forêt d'État sans indemnité (art. 63).", source: "https://faolex.fao.org/docs/pdf/gam19052.pdf"}
  ressources: {valeur: "partiel", note: "La forêt communautaire sert à la production de bois, de bois de feu et de produits forestiers non ligneux, au pâturage, à la protection et à la conservation (loi forestière de 1998, art. 9, al. 3) ; le comité est exempté des droits de licence et de permis pour les produits prélevés dans sa forêt (art. 90), mais l'exploitation commerciale suit le plan de gestion et exige un permis du service forestier (règlement forestier de 1998, art. 39).", source: "https://faolex.fao.org/docs/pdf/gam50110.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Chaque forêt communautaire sous CFMA a un fonds local alimenté par 85 % du produit des ventes de produits forestiers et 50 % des amendes, géré par trois membres élus du comité, dont au moins 40 % des dépenses vont à la forêt et au plus 60 % au développement du village (loi forestière de 1998, art. 36 à 38).", source: "https://faolex.fao.org/docs/pdf/gam19052.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Un article de la FAO (F. Romano, Unasylva) décrit l'approche par phases, la propriété permanente conférée par l'accord définitif et des effets documentés sur le couvert forestier et les feux selon un suivi gambien-allemand de 2003, et relève une dépendance partielle aux financements extérieurs. La politique forestière nationale 2023-2032 du ministère indique que la gestion participative a progressé « par à-coups » (stop-start) de 2005 à 2015, que 33 342,93 ha seulement étaient sous contrôle communautaire à la fin de la période 2010-2019 (16,67 % de l'objectif), que l'extension a été freinée par le manque de volonté politique de traiter les CFMA et par des conflits sur la propriété des terres forestières, et fixe pour stratégie de conclure les PCFMA et CFMA en attente.", source: "https://www.fao.org/4/a1346e/a1346e03.htm"}
chronologie:
  - {annee: 1991, evenement: "Introduction officielle de la foresterie communautaire, à titre pilote dans la région de la Côte Ouest et la division du Bas-Fleuve, avec le projet forestier gambien-allemand."}
  - {annee: 1995, evenement: "Première politique forestière nationale, orientée vers la gestion participative des forêts."}
  - {annee: 1998, evenement: "Loi forestière et règlement forestier : forêts communautaires possédées et gérées par les communautés, procédure PCFMA puis CFMA, fonds locaux."}
  - {annee: 2000, evenement: "Début des accords de cogestion de parcs forestiers avec des villages partenaires (22 parcs de la région Centre, un du Haut-Fleuve et un du Bas-Fleuve jusqu'en 2007)."}
  - {annee: 2011, evenement: "La politique forestière reçoit le prix d'argent du Future Policy Award du World Future Council pour sa disposition sur la foresterie communautaire."}
  - {annee: 2018, evenement: "Nouvelle loi forestière et nouveau règlement forestier."}
  - {annee: 2023, evenement: "Politique forestière nationale 2023-2032 : 33 342,93 ha sous contrôle communautaire à la fin de la période précédente."}
fiabilite:
  verifie: ["Loi forestière de 1998 (texte FAOLEX) : définition de la communauté (village ou ville) et de la forêt communautaire (art. 2, art. 9 al. 3) ; comité forestier (art. 59) ; PCFMA de trois ans prorogeable de deux ans (art. 60 à 63) ; CFMA conférant la propriété pour une durée indéterminée (art. 67 al. 5) ; ordre ministériel de désignation (art. 68) ; retrait possible (art. 72) ; fonds locaux à 85 % des ventes (art. 36 à 38) ; arbitrage des litiges entre communautés par le chef de district (art. 84) ; règlements des comités (art. 89) ; exemption de redevance (art. 90).", "Règlement forestier de 1998 : plans de gestion de trois ans sous PCFMA et de cinq ans sous CFMA ; permis du service forestier pour l'exploitation commerciale (art. 39) ; consentement du comité pour l'usage non commercial (art. 40).", "Politique forestière nationale 2023-2032 (ministère de l'Environnement, du Changement climatique et des Ressources naturelles) : 33 342,93 ha sous contrôle communautaire, 16,67 % de l'objectif de 200 000 ha ; mention de la loi forestière de 2018 ; stratégies sur les PCFMA, CFMA et le programme JFPM.", "Stratégie nationale pour la biodiversité 2015-2020 et cinquième rapport national à la CDB (2014) : 18 000 ha de forêts communautaires (chiffre repris d'un rapport de suivi 2004-2006).", "Article de F. Romano (FAO) : approche par phases, propriété transférée pour une durée indéterminée par l'accord définitif ; accord possible sur toute terre forestière hors parcs forestiers située dans les terres traditionnelles du village."]
  non_confirme: ["Le texte de la loi forestière de 2018 n'a pas pu être ouvert et n'est pas présent dans FAOLEX/ECOLEX : la grille repose sur la loi de 1998, que la politique 2023-2032 ne déclare pas abrogée ; l'abrogation de la loi de 1998 par celle de 2018 n'est pas vérifiée ; le maintien des articles cités (propriété indéterminée, part de 85 %, règlements des comités) dans la loi de 2018 n'est pas vérifié.", "Nombre de forêts communautaires sous PCFMA et sous CFMA, nombre de villages et population concernés : aucun chiffre officiel récent trouvé ; aucune liste officielle des sites, donc pas de tableau.", "Le chiffre de 33 342,93 ha « sous contrôle communautaire » ne précise pas s'il inclut les parcs forestiers cogérés (JFPM) ou les forêts sous accord préliminaire seulement.", "Écart entre les 18 000 ha cités par les documents transmis à la CDB (donnée 2004-2006) et les 33 342,93 ha de la politique 2023-2032 : périmètres et dates différents, non réconciliés.", "Aucune inscription au registre ICCA ou à la base WDPA n'a été vérifiée."]
