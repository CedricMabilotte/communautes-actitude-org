resume: >-
  Fiche agrégée : elle couvre les villages et groupes de villages de Gambie titulaires d'une forêt communautaire. La loi forestière de 1998 (Forest Act) définit la forêt communautaire comme une forêt « possédée et gérée » par une ou plusieurs communautés, la communauté étant un village ou une ville (art. 2). Un comité forestier villageois obtient d'abord un accord préliminaire de trois ans (Preliminary Community Forest Management Agreement, PCFMA), puis l'accord définitif (Community Forest Management Agreement, CFMA), qui confère la propriété de la forêt pour une durée indéterminée. Une loi forestière de 2018 (loi n° 3 de 2018) est en vigueur ; son texte n'a pas été consulté. Un ordre ministériel du 19 août 2024 pris en vertu de son article 34 (1) désigne 29 forêts communautaires, d'une surface totale de 2 331,2 ha selon ses annexes, remises aux communautés en mai 2025 ; un programme distinct associe des villages à la cogestion des parcs forestiers de l'État (Joint Forest Park Management, JFPM). Selon la politique forestière nationale 2023-2032, 33 342,93 hectares étaient sous contrôle communautaire à la fin de la période 2010-2019.
