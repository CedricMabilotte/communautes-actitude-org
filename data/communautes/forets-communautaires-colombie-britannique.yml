droits:
  autogouvernement: {valeur: "partiel", note: "L'accord n'est conclu qu'avec une première nation, une municipalité, un district régional ou une entité (société, coopérative, compagnie, société de personnes) qui remplit les conditions réglementaires (Forest Act, art. 43.2(3) ; Community Tenures Regulation, art. 2) ; la demande décrit le modèle de gouvernance, dont la structure et le mandat du conseil de gestion (art. 3(1)(c)(iii.2) du règlement). Le titulaire agit dans le cadre de l'accord et du plan d'aménagement approuvé par le ministre (Forest Act, art. 43.3(1)(f)).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/16_352_2004"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'accord décrit une zone de terres de la Couronne, qui peut inclure des terres de réserve au sens de la Loi sur les Indiens ou des terres privées, pour une durée de 25 à 99 ans (Forest Act, art. 43.3(1)(a) et (b)) ; le ministre doit offrir un accord de remplacement après la neuvième année, sauf clause contraire (art. 43.4(4)) ; le texte confère des droits de récolte sur ces terres et ne prévoit aucun transfert de propriété.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96157_03"}
  ressources: {valeur: "partiel", note: "L'accord donne au titulaire le droit exclusif de récolter le bois sur les terres de la Couronne de la zone et peut lui donner le droit de récolter, gérer et tarifer les produits forestiers non ligneux (botanical forest products) (Forest Act, art. 43.3(1)(c)) ; le titulaire paie les droits de coupe, soumet son plan d'aménagement à l'approbation du ministre, et l'accord peut réserver une part du bois à d'autres attributaires (art. 43.3(1)(d), (f), (g.2) et (g.3)).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96157_03"}
  consentement: {valeur: "partiel", note: "Le ministre ne peut modifier les limites ou la superficie de la zone d'un accord de remplacement, ni modifier les limites ou agrandir la zone d'un accord en cours, qu'avec le consentement du titulaire (Forest Act, art. 43.4(6) et 43.52) ; la demande d'accord doit documenter le soutien de la communauté et résumer un examen public mené par le demandeur (Community Tenures Regulation, art. 3(1)(c)(v)) ; le titulaire mène des consultations publiques sur la gestion de l'accord (Forest Act, art. 43.3(1)(g)(ii)).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96157_03"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'accord peut donner au titulaire le droit de récolter, de gérer et de tarifer (charge fees) les produits forestiers non ligneux (botanical forest products) de la zone (Forest Act, art. 43.3(1)(c)(ii)) ; le titulaire paie à la province les droits de coupe (stumpage) sur le bois de la Couronne (art. 43.3(1)(d)), et la loi ne lui attribue aucune part de ces droits.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96157_03"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le registre provincial de mars 2026 recense 62 accords en vigueur, pour une coupe annuelle autorisée cumulée de 2 187 599 m³. Une enquête auprès de tous les membres actifs de la BCCFA (Furness, Harshaw et Nelson, Forest Policy and Economics, 2015) conclut que les titulaires jugent le programme atteint pour la participation du public et la gestion environnementale, mais pas pour la diversification économique. Dans le rapport d'indicateurs 2026 de la BCCFA, 37 forêts communautaires déclarent 662 727 m³ récoltés et 10,4 millions de dollars de contributions en argent versées à leurs communautés.", source: "https://www.sciencedirect.com/science/article/abs/pii/S1389934114002330"}
chronologie:
  - {annee: 1997, evenement: "Accord sur l'emploi et le bois (Jobs and Timber Accord) : lancement du programme pilote de forêts communautaires."}
  - {annee: 1998, evenement: "Modification du Forest Act : création de l'accord de forêt communautaire."}
  - {annee: 2000, evenement: "Premiers accords en vigueur au registre actuel : Burns Lake (K1A) et Harrop-Procter (K1B)."}
  - {annee: 2003, evenement: "Forest Revitalization Act : davantage de superficie et de volume réservés aux accords de forêt communautaire."}
  - {annee: 2004, evenement: "Community Tenures Regulation (B.C. Reg. 352/2004) : conditions d'admissibilité, contenu des demandes, attribution directe."}
  - {annee: 2009, evenement: "Modification du Forest Act : suppression de la période probatoire, accords de longue durée remplaçables tous les dix ans."}
  - {annee: 2026, evenement: "62 accords au registre provincial ; mise à jour des objectifs du programme par la province avec la BCCFA."}
fiabilite:
  verifie:
    - "Article 43.3(1)(c) à (f) du Forest Act relu le 5 octobre 2026 (droit de tarifer les produits forestiers non ligneux, droits de coupe, plan d'aménagement)."
    - "Articles 43.2 à 43.53 (division 7.1) et 43.54 à 43.55 (division 7.11) du Forest Act, version consolidée publiée par l'imprimeur du Roi de la Colombie-Britannique."
    - "Articles 1 à 3 du Community Tenures Regulation (B.C. Reg. 352/2004), consolidé au 29 septembre 2026."
    - "62 lignes de type A28 (accords de forêt communautaire) et 27 lignes de type A29 (licences forestières des premières nations) dans le registre provincial de mars 2026 ; superficie cumulée des accords de 1 953 537 ha."
    - "62 accords en activité, total de 1 979 678 ha et dates d'entrée en vigueur dans la fiche d'état 2026 de la BCCFA."
  non_confirme:
    - "La part des accords détenus par des premières nations (« la moitié », seules ou en partenariat) vient de la BCCFA et de Ressources naturelles Canada ; aucun décompte officiel n'a été trouvé."
    - "Les années du tableau sont les dates d'entrée en vigueur données par la fiche d'état de la BCCFA ; les noms, districts et superficies viennent du registre provincial. Les superficies diffèrent pour quelques accords (ex. K1N : 21 495 ha au registre, 13 069 ha pour la BCCFA)."
    - "L'année de création du régime (1998) et la chronologie de 1997 à 2009 viennent de la BCCFA, de Ressources naturelles Canada et d'études universitaires ; la loi modificative de 1998 n'a pas été ouverte."
    - "Aucun document de l'ONU nommant ce régime n'a été trouvé."
    - "Valemount Community Forest Company Ltd. détient deux accords (K2T, 2007, et K5Q, 2016) de superficie presque identique au registre (71 722 ha et 71 720 ha) ; aucune source ne dit si les deux zones se superposent. Si c'est le cas, la superficie cumulée compte deux fois la même zone et le régime compte 61 titulaires distincts pour 62 accords."
    - "L'accord K3W (Three Rivers, 2024) figure au registre sans superficie ; la fiche d'état de la BCCFA lui attribue 38 223 ha."
    - "Population et nombre de localités concernées : aucune source trouvée ; la BCCFA indique seulement plus de 100 communautés de premières nations et rurales."
