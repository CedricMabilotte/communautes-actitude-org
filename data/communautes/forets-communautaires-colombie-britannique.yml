resume: >-
  Fiche agrégée : elle couvre les communautés titulaires d'un accord de forêt communautaire (community forest agreement, CFA) en Colombie-Britannique. Le Forest Act (RSBC 1996, ch. 157), partie 3, division 7.1 (art. 43.2 à 43.53), permet au ministre des Forêts de conclure cet accord avec une première nation, une municipalité, un district régional, ou une société, une coopérative, une compagnie ou une société de personnes répondant aux conditions du Community Tenures Regulation (B.C. Reg. 352/2004). L'accord, d'une durée de 25 à 99 ans et remplaçable tous les dix ans, donne au titulaire le droit exclusif de récolter le bois sur une zone de terres de la Couronne (terres publiques provinciales) et peut lui donner le droit de récolter, gérer et tarifer les produits forestiers non ligneux ; le titulaire paie les droits de coupe (stumpage, redevance due à la province pour le bois récolté) et met en œuvre un plan d'aménagement approuvé par le ministre. Créé en 1998, le régime compte 62 accords au registre provincial de mars 2026 ; selon l'association des forêts communautaires (BCCFA), la moitié sont détenus par des premières nations ou par des partenariats entre premières nations et autres collectivités. La licence forestière des premières nations (First Nations Woodland Licence, division 7.11, art. 43.54 et suivants), réservée aux premières nations, reprend le même régime ; le registre en compte 27.
