  terres: {valeur: "partiel", note: "Un tenancier aborigène ne peut céder ses droits sur sa terre qu'à un autre aborigène résidant au Bangladesh, sauf autorisation écrite de l'agent du revenu foncier ; toute cession contraire est nulle, l'agent peut expulser l'acquéreur et rendre la terre, et aucun tribunal ne peut ordonner la vente de ces terres, sauf pour arriérés de loyer ou remboursement de prêts agricoles consentis par l'État, un organisme public de crédit agricole ou une société coopérative, State Acquisition and Tenancy Act 1950, section 97 (2) à (9) ; l'application dépend d'une notification gouvernementale par district et par groupe, section 97 (1) et (10).", source: "http://bdlaws.minlaw.gov.bd/act-241/section-7077.html"}
