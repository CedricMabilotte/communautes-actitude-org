effectivite: {valeur: "partielle", note: "Le Comité des droits économiques, sociaux et culturels relève en 2018 des allégations répétées d'expropriation de terres ancestrales et l'absence de mécanismes de participation (E/C.12/BGD/CO/1, § 15). L'IWGIA, citant la Kapaeeng Foundation, rapporte au moins 17 atteintes aux droits fonciers dans des districts des plaines en 2023 et l'absence de commission foncière pour les plaines, demandée par ces peuples ; la Commission d'experts de l'OIT, citée par le même rapport, demande où en est cette commission prévue par le huitième plan quinquennal.", source: "https://www.iwgia.org/images/publications/indigenous-world/indigenous-world-2024.pdf"}
chronologie:
  - {annee: 1950, evenement: "Adoption de la loi sur l'acquisition par l'État et la location des terres ; la section 97 restreint l'aliénation des terres des aborigènes."}
  - {annee: 1972, evenement: "Le Bangladesh ratifie la convention n° 107 de l'Organisation internationale du travail relative aux populations aborigènes et tribales."}
  - {annee: 1974, evenement: "Une loi modificative ajoute les Banai à la liste de la section 97."}
  - {annee: 2010, evenement: "Loi sur les institutions culturelles des petits groupes ethniques."}
  - {annee: 2011, evenement: "Le quinzième amendement insère l'article 23A dans la Constitution."}
  - {annee: 2018, evenement: "Le Comité des droits économiques, sociaux et culturels vise les peuples autochtones des plaines dans ses observations finales."}
