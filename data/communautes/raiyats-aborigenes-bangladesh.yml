resume: >-
  Hors des Chittagong Hill Tracts, des peuples comme les Santal, Garo, Hajong, Oraon, Munda, Koch et Magh vivent dans les districts des plaines du Bangladesh. La section 97 de la loi de 1950 sur l'acquisition par l'État et la location des terres (State Acquisition and Tenancy Act, East Bengal Act XXVIII de 1951) interdit à un tenancier « aborigène » (aboriginal raiyat, exploitant inscrit) de céder sa terre à une personne qui n'appartient pas aux groupes énumérés, sauf autorisation écrite de l'agent du revenu foncier ; toute cession contraire est nulle. Le texte ne s'applique que dans les districts et aux groupes désignés par notification du gouvernement. L'État ne reconnaît pas ces groupes comme peuples autochtones ; aucun texte consulté ne leur attribue d'institution propre. L'article 23A de la Constitution (2011), placé parmi les principes fondamentaux de la politique de l'État, engage l'État à protéger et développer la culture des « tribes, minor races, ethnic sects and communities ».
