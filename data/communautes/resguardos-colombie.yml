  - {instrument: "Décret-loi 488 de 2025 (protocolisation des accords interculturaux, administration directe de l'allocation spéciale du système général de participations pour les resguardos, coordination interinstitutionnelle)", nature: "loi", annee: 2025, source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1367-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  - {instrument: "Décret 2164 de 1995 (définition et constitution des resguardos)", nature: "loi", annee: 1995, source: "https://geoactivismo.org/territorios-indigenas-en-colombia-2025/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les territoires autochtones sont gouvernés par des conseils formés et réglementés selon les usages et coutumes des communautés (Constitution, art. 330).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr011.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Les autorités appliquent leurs propres normes et procédures, à condition qu'elles ne soient pas contraires à la Constitution et aux lois (art. 246).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr008.html"}
  justice_propre: {valeur: "partiel", note: "Les autorités des peuples autochtones exercent des fonctions juridictionnelles dans leur territoire selon leurs propres normes et procédures, à condition qu'elles ne soient pas contraires à la Constitution et aux lois (juridiction spéciale, art. 246) ; la loi fixe la coordination avec le système judiciaire national. Cette limite, la même que pour leurs normes, fait coder ce droit « partiel ».", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr008.html"}
  terres: {valeur: "reconnu", note: "Les terres de resguardo sont inaliénables, imprescriptibles et insaisissables (Constitution, art. 63).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr001.html"}
  ressources: {valeur: "partiel", note: "Les conseils veillent à la préservation des ressources naturelles (art. 330.5) ; l'exploitation se fait sans atteinte à l'intégrité culturelle, sociale et économique des communautés (art. 330, paragraphe) ; l'État est propriétaire du sous-sol et des ressources non renouvelables (art. 332).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr011.html"}
  consentement: {valeur: "partiel", note: "Pour l'exploitation des ressources des territoires, le gouvernement favorise la participation des représentants des communautés (art. 330, paragraphe).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr011.html"}
  langue: {valeur: "reconnu", note: "Les langues et dialectes des groupes ethniques sont officiels dans leurs territoires (art. 10).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html"}
  education: {valeur: "partiel", note: "L'enseignement dans les communautés ayant leurs propres traditions linguistiques est bilingue (art. 10).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html"}
  fiscalite: {valeur: "partiel", note: "Les conseils perçoivent et répartissent leurs ressources (art. 330.4) ; la loi fait des resguardos des bénéficiaires du système général de participations tant qu'ils ne sont pas constitués en entités territoriales (art. 356, rédaction de l'acte législatif 3 de 2024).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr011.html"}
  representation: {valeur: "reconnu", note: "Deux sièges du Sénat sont réservés aux communautés autochtones, élus dans une circonscription nationale spéciale (art. 171).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr005.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Haut-Commissariat des Nations unies aux droits de l'homme relève pour 2023 des progrès dans l'extension et la restructuration des resguardos, mais note que la formalisation foncière n'a pas garanti la jouissance effective du territoire et de l'autogouvernement ; il documente 23 meurtres d'autorités traditionnelles, de gardes autochtones ou de gardes cimarronas et le maintien par la Cour constitutionnelle de l'état de choses inconstitutionnel pour les peuples autochtones et afrodescendants. Les entités territoriales prévues en 1991 n'ont été formalisées qu'en décembre 2025, pour huit territoires.", source: "https://www.ohchr.org/sites/default/files/documents/hrbodies/hrcouncil/sessions-regular/session55/advance-versions/A_HRC_55_23_English_unofficial_translation.pdf"}
chronologie:
  - {annee: 1991, evenement: "Nouvelle Constitution ; ratification de la Convention 169 de l'OIT (7 août)."}
  - {annee: 1995, evenement: "Décret 2164 sur la constitution des resguardos."}
  - {annee: 2014, evenement: "Décret 1953 sur le fonctionnement des territoires autochtones."}
  - {annee: 2024, evenement: "Acte législatif 3 : réforme du système général de participations (art. 356 de la Constitution)."}
  - {annee: 2025, evenement: "Décret-loi 488 sur le fonctionnement des territoires autochtones ; arrêt C-477 de la Cour constitutionnelle ; décrets 1367 à 1374 du 16 décembre formalisant huit territoires autochtones en Amazonas et Vaupés."}
