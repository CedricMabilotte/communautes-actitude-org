resume: >-
  Fiche agrégée. La Constitution colombienne de 1991 fait des resguardos une propriété collective autochtone inaliénable, imprescriptible et insaisissable. Les territoires autochtones sont gouvernés par des conseils formés selon les usages et coutumes des communautés ; leurs autorités exercent une juridiction spéciale selon leurs propres normes. Les langues des groupes ethniques sont officielles dans leurs territoires et deux sièges du Sénat leur sont réservés. Fin 2025, 959 titres couvrent environ 35 millions d'hectares. Le décret-loi 488 de 2025 règle la mise en fonctionnement des territoires autochtones comme entités territoriales ; les huit premiers, en Amazonas et Vaupés, ont été formalisés par décret le 16 décembre 2025. Les fiches « Nasa et resguardos du Cauca », « Territoires autochtones des zones non municipalisées (Amazonas, Guainía, Vaupés) » et « Régimes spéciaux de gestion des parcs nationaux (Colombie) » détaillent un cas ou un régime particulier.
