  non_confirme: ["Le chiffre des titres vient d'une compilation indépendante des données de l'Agence nationale des terres, pas d'une publication officielle ouverte ; une autre source donne environ 770 resguardos et 28,9 millions d'hectares.", "Actes de formalisation des entités territoriales de décembre 2025 (non ouverts).", "Texte du décret 2164 de 1995 (non ouvert)."]
