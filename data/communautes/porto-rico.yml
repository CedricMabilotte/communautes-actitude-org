  - {instrument: "Puerto Rico Oversight, Management, and Economic Stability Act (PROMESA), Public Law 114-187", nature: "loi", annee: 2016, source: "https://www.law.cornell.edu/uscode/text/48/2128"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le pouvoir politique « emana del pueblo » et s'exerce « dentro de los términos del convenio » avec les États-Unis ; gouvernement républicain à trois pouvoirs (Constitution de 1952, art. I, § 1 et 2) ; Assemblée législative de deux chambres élues (art. III, § 1).", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée législative adopte les lois du territoire (Constitution, art. III) ; toute révision constitutionnelle doit rester compatible avec la Constitution des États-Unis, la loi des relations fédérales et la Public Law 600 (art. VII, § 3) ; ni le gouverneur ni l'Assemblée législative ne peuvent adopter ou appliquer une norme qui compromettrait les objectifs de PROMESA, selon l'appréciation du conseil de supervision financière (48 U.S.C. § 2128).", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  justice_propre: {valeur: "reconnu", note: "Pouvoir judiciaire exercé par un Tribunal Supremo (Cour suprême), tribunal de dernière instance à Porto Rico, et par les tribunaux créés par la loi en un système unifié (Constitution, art. V, § 1 à 3). Les juges sont nommés par le gouverneur avec l'avis et le consentement du Sénat de Porto Rico (art. V, § 8).", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La conservation, le développement et l'exploitation des ressources naturelles sont une politique publique de l'État libre associé (Constitution, art. VI, § 19).", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "L'espagnol et l'anglais sont langues officielles du gouvernement de Porto Rico (Ley Núm. 1 de 1993, section 1) ; la loi rappelle que l'enseignement se fait en espagnol, l'anglais étant enseigné comme seconde langue.", source: "https://bvirtualogp.pr.gov/ogp/Bvirtual/leyesreferencia/PDF/2-ingles/1-1993.pdf"}
  education: {valeur: "reconnu", note: "La Constitution institue un système d'instruction publique gratuit et non confessionnel aux niveaux primaire et secondaire (art. II, § 5).", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  fiscalite: {valeur: "partiel", note: "Le pouvoir d'établir et de percevoir des impôts appartient à l'État libre associé et « nunca será rendido o suspendido » (Constitution, art. VI, § 2) ; depuis 2016, le gouverneur et l'Assemblée législative ne peuvent exercer aucun contrôle sur le conseil de supervision financière créé par PROMESA (48 U.S.C. § 2128).", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  representation: {valeur: "partiel", note: "Les électeurs de Porto Rico élisent pour quatre ans un commissaire résident auprès des États-Unis, reconnu officiellement par tous les départements du gouvernement fédéral (48 U.S.C. § 891) ; le Bureau du recensement le décrit comme un commissaire sans droit de vote, élu par l'ensemble du territoire.", source: "https://www.law.cornell.edu/uscode/text/48/891"}
  statut_personnel: {valeur: "partiel", note: "La Constitution exige des membres de l'Assemblée législative qu'ils soient citoyens « de los Estados Unidos y de Puerto Rico » (art. III, § 5) ; le préambule mentionne « nuestra ciudadanía de los Estados Unidos de América ».", source: "https://welcome.topuertorico.org/constitu-es.shtml"}
  autodetermination_externe: {valeur: "partiel", note: "La Ley 165-2020 (art. 2.1) autorise le gouverneur à convoquer par décret une votation « para resolver el estatus político futuro de Puerto Rico » ; le plébiscite du 5 novembre 2024, convoqué sur cette base par l'ordre exécutif OE-2024-016 du 1er juillet 2024, proposait l'État fédéré, la souveraineté en libre association et l'indépendance ; le résultat certifié est transmis au président et au Congrès des États-Unis avec un préambule fixé par la loi qui le présente comme une demande adressée à ces derniers pour qu'ils « reparen el agravio » (réparent le préjudice) de la condition territoriale (art. 5.10).", source: "https://bvirtualogp.pr.gov/ogp/Bvirtual/leyesreferencia/PDF/165-2020.pdf"}
effectivite: {valeur: "partielle", note: "La Cour suprême des États-Unis (Puerto Rico v. Sánchez Valle, 9 juin 2016) décrit Porto Rico comme une démocratie constitutionnelle « exercising local self-rule » (exerçant l'autogouvernement local), mais juge que la source ultime de son pouvoir de poursuite pénale reste le Congrès, qui a autorisé et approuvé la Constitution de 1952 ; depuis la loi PROMESA de 2016, le conseil de supervision financière nommé par le président des États-Unis échappe à tout contrôle du gouverneur et de l'Assemblée législative (48 U.S.C. § 2128).", source: "https://www.law.cornell.edu/supremecourt/text/15-108"}
chronologie:
  - {annee: 1898, evenement: "Intervention des États-Unis à Porto Rico (25 juillet)."}
  - {annee: 1950, evenement: "Public Law 600 du 81e Congrès, adoptée en forme de pacte, autorisant Porto Rico à se doter d'une constitution."}
  - {annee: 1952, evenement: "Entrée en vigueur de la Constitution de l'Estado Libre Asociado (25 juillet)."}
  - {annee: 1953, evenement: "Résolution 748 (VIII) de l'Assemblée générale : fin de la communication de renseignements au titre de l'article 73 e de la Charte."}
  - {annee: 1972, evenement: "Première résolution du Comité spécial de la décolonisation sur la question de Porto Rico."}
  - {annee: 2016, evenement: "Arrêt Puerto Rico v. Sánchez Valle (9 juin) ; loi PROMESA créant le conseil de supervision financière (30 juin)."}
  - {annee: 2020, evenement: "Ley 165-2020 autorisant le gouverneur à convoquer des votes sur le statut."}
  - {annee: 2024, evenement: "Ordre exécutif OE-2024-016 (1er juillet) convoquant un plébiscite sur le statut en vertu de la Ley 165-2020."}
  - {annee: 2024, evenement: "Plébiscite du 5 novembre : État fédéré 58,61 %, libre association 29,57 %, indépendance 11,82 % des votes valides (certifié le 17 janvier 2025)."}
  - {annee: 2025, evenement: "Projet de résolution A/AC.109/2025/L.7 du Comité spécial réaffirmant le droit inaliénable du peuple portoricain à l'autodétermination et à l'indépendance."}
