resume: >-
  Territoire des États-Unis organisé depuis 1952 en « Estado Libre Asociado » (État libre associé), sous une Constitution adoptée par la population en vertu de la loi fédérale du 3 juillet 1950 (Public Law 600), votée « en forme de pacte ». La Constitution déclare que le pouvoir politique « emana del pueblo » et institue des pouvoirs législatif, exécutif et judiciaire propres. En 1953, l'Assemblée générale de l'ONU met fin à la communication de renseignements au titre de l'article 73 e de la Charte ; le Comité spécial de la décolonisation adopte depuis 1972 des résolutions qui réaffirment le droit du peuple portoricain à l'autodétermination et à l'indépendance. Depuis 2016, un conseil de supervision financière nommé par le président des États-Unis contrôle le budget du territoire.
