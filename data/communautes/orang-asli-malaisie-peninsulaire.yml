resume: >-
  « Orang Asli » (en malais, « peuple originel ») désigne les populations autochtones de la péninsule malaise, distinctes des natifs du Sabah et du Sarawak. La loi sur les peuples aborigènes de 1954 (Act 134, révisée en 1974) permet aux États fédérés de déclarer par publication au journal officiel des aires aborigènes et des réserves aborigènes, protégées contre l'aliénation à des non-aborigènes, et reconnaît des chefs de communauté (headman), héréditaires ou choisis par la communauté, confirmés par le ministre. Ces déclarations sont révocables par l'État fédéré. La Constitution fédérale autorise des mesures de protection, dont la réservation de terres (art. 8(5)(c)), et la jurisprudence Sagong Tasi (2002, 2005) reconnaît un titre coutumier (native title) opposable devant les tribunaux.
