  non_confirme: ["Aucune reconnaissance onusienne propre (refus en V01) : la fiche entre par le niveau national.", "Loi foncière de 1992 lue à travers un article universitaire, pas sur un site officiel.", "Loi de 1985 sur les tribunaux de cadi : la source citée en V01 ne répond plus ; existence d'une loi plus récente non vérifiée. Les tribunaux de cadi sont attestés par la Constitution de Zanzibar (art. 99 et 102).", "Amendements de la Constitution de Zanzibar postérieurs à 2006 (dont celui de 2010 sur le gouvernement d'unité nationale) : texte non consulté.", "Transfert éventuel du pétrole et du gaz hors des affaires de l'Union après 2005 : non vérifié ; ressources laissées à non établi.", "Résultats des élections de Zanzibar d'octobre 2025 et composition du gouvernement d'unité qui a suivi : non vérifiés sur une source ouverte.", "Surface : chiffre d'une page officielle non datée ; d'autres sources donnent 2 449 km² (1 464 + 985)."]
