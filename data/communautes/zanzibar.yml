base_nationale:
  - {instrument: "Constitution de la République-Unie de Tanzanie (1977), art. 2, 4, 66, 98, 102-107, 133-134, première annexe (affaires de l'Union) et deuxième annexe", nature: "constitution", annee: 1977, source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  - {instrument: "Constitution de Zanzibar (1984, version révisée de 2006), art. 6, 78, 87, 93, 99, 100, 104-106", nature: "statut_autonomie", annee: 1984, source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  - {instrument: "Land Tenure Act (loi foncière) n° 12 de 1992, art. 3", nature: "loi", annee: 1992, source: "https://thelawbrigade.com/wp-content/uploads/2020/11/Mtaib-Abdulla-Othman-IJLDAI.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 4 de la Constitution tanzanienne : le pouvoir exécutif s'exerce par le gouvernement de l'Union et par le gouvernement révolutionnaire de Zanzibar ; art. 102-104 : ce gouvernement a autorité à Zanzibar sur toutes les matières qui ne sont pas des affaires de l'Union, son président est élu par la population de Zanzibar.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 106 de la Constitution tanzanienne et art. 78(1) de la Constitution de Zanzibar : le pouvoir législatif sur toutes les matières qui ne sont pas des affaires de l'Union appartient à la Chambre des représentants de Zanzibar.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  justice_propre: {valeur: "reconnu", note: "Art. 93 de la Constitution de Zanzibar : Haute Cour de Zanzibar ; art. 100 : la Chambre des représentants peut créer des juridictions subordonnées ; art. 99(1)(b) : les affaires de droit musulman engagées devant les tribunaux de cadi (juges musulmans) ne vont pas en appel devant la Cour d'appel de l'Union.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  terres: {valeur: "reconnu", note: "Art. 3 du Land Tenure Act de 1992 : toute la terre de Zanzibar est terre publique, confiée au président de Zanzibar « pour l'usage et le bénéfice commun du peuple de Tanzania Zanzibar » ; la terre ne figure pas dans la liste des affaires de l'Union (première annexe de la Constitution tanzanienne).", source: "https://thelawbrigade.com/wp-content/uploads/2020/11/Mtaib-Abdulla-Othman-IJLDAI.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Art. 98(1)(b) et deuxième annexe, liste deux, de la Constitution tanzanienne : la modification de l'existence de l'Union, des pouvoirs du gouvernement de Zanzibar, de la Haute Cour de Zanzibar, de la liste des affaires de l'Union et du nombre de députés de Zanzibar exige les deux tiers des députés du continent et les deux tiers des députés de Zanzibar à l'Assemblée nationale ; art. 2(2) : consultation du président de Zanzibar avant tout découpage administratif de Zanzibar. Le vote passe par l'Assemblée de l'Union, pas par la Chambre des représentants.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 87(1) de la Constitution de Zanzibar : le kiswahili est la langue officielle de la Chambre des représentants.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Art. 104-106 de la Constitution de Zanzibar : fonds consolidé du gouvernement révolutionnaire de Zanzibar et budget voté par la Chambre des représentants ; l'impôt sur le revenu, les droits de douane et d'accise sont des affaires de l'Union (première annexe de la Constitution tanzanienne) et le partage des recettes passe par une commission financière conjointe (art. 133-134).", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  representation: {valeur: "reconnu", note: "Art. 66(1) de la Constitution tanzanienne : l'Assemblée nationale comprend cinq membres élus par la Chambre des représentants de Zanzibar parmi ses membres, en plus des députés élus dans les circonscriptions de Zanzibar.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  statut_personnel: {valeur: "reconnu", note: "Art. 6 de la Constitution de Zanzibar (modifié par la loi n° 2 de 2002) : statut de « Zanzibari », dont l'acquisition, la perte et le recouvrement sont fixés par une loi de la Chambre des représentants ; art. 7 : droit de vote aux élections de Zanzibar réservé aux Zanzibaris.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Freedom House (2025) : Zanzibar élit son président et sa Chambre des représentants, la Commission électorale de Zanzibar organise ces élections ; les élections de 2020 ont été marquées par des accusations de fraude, la détention du candidat d'ACT-Wazalendo et des tirs mortels, puis ACT-Wazalendo est entré dans un gouvernement d'unité avec le CCM.", source: "https://freedomhouse.org/country/tanzania/freedom-world/2025"}
chronologie:
  - {annee: 1963, evenement: "Indépendance de Zanzibar."}
  - {annee: 1964, evenement: "Renversement du sultanat en janvier ; en avril, union avec le Tanganyika."}
  - {annee: 1977, evenement: "Constitution de la République-Unie de Tanzanie."}
  - {annee: 1984, evenement: "Constitution de Zanzibar."}
  - {annee: 1992, evenement: "Loi foncière de Zanzibar."}
  - {annee: 2010, evenement: "Référendum du 31 juillet à Zanzibar approuvant un gouvernement d'unité nationale : le parti arrivé second désigne le premier vice-président."}
  - {annee: 2020, evenement: "Élections contestées ; en novembre, ACT-Wazalendo entre dans un gouvernement d'unité avec le CCM."}
  - {annee: 2025, evenement: "Élections générales en Tanzanie fin octobre, suivies de manifestations et de violences d'État dans le pays (Freedom House, 2026)."}
