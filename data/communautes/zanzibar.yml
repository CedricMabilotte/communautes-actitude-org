droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 4 de la Constitution tanzanienne : l'autorité de l'État s'exerce par le gouvernement de l'Union et par le gouvernement de Zanzibar ; art. 102-107 : président et institutions de Zanzibar régis par la Constitution de Zanzibar de 1984.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 78(1) de la Constitution de Zanzibar : le pouvoir législatif sur toutes les matières qui ne sont pas des affaires de l'Union appartient à la Chambre des représentants.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  justice_propre: {valeur: "reconnu", note: "Art. 93 de la Constitution de Zanzibar : Haute Cour de Zanzibar ; loi n° 3 de 1985 : tribunaux de cadi (juges musulmans) compétents en statut personnel, mariage, divorce et succession entre musulmans.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  terres: {valeur: "reconnu", note: "Art. 3 du Land Tenure Act de 1992 : toute la terre de Zanzibar est terre publique, confiée au président de Zanzibar « pour l'usage et le bénéfice commun du peuple de Zanzibar » ; la terre n'est pas une affaire de l'Union.", source: "https://thelawbrigade.com/wp-content/uploads/2020/11/Mtaib-Abdulla-Othman-IJLDAI.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Art. 98 (1) (b) de la Constitution tanzanienne : la modification des matières de la liste deux de la deuxième annexe (existence de l'Union, pouvoirs du gouvernement de Zanzibar, Haute Cour de Zanzibar, liste des affaires de l'Union, nombre de députés de Zanzibar) exige les voix des deux tiers des députés du continent et des deux tiers des députés de Zanzibar à l'Assemblée nationale.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 87(1) de la Constitution de Zanzibar : le kiswahili est la langue officielle de la Chambre des représentants.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Art. 133-134 de la Constitution tanzanienne : compte commun et commission financière conjointe pour le partage des recettes entre l'Union et Zanzibar.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 66 de la Constitution tanzanienne : l'Assemblée nationale comprend cinq membres élus par la Chambre des représentants de Zanzibar parmi ses membres.", source: "https://www.constituteproject.org/constitution/Tanzania_2005?lang=en"}
  statut_personnel: {valeur: "reconnu", note: "Art. 6 de la Constitution de Zanzibar : statut de « Zanzibari », dont l'acquisition, la perte et le recouvrement sont fixés par une loi de la Chambre des représentants.", source: "https://www.ikuluzanzibar.go.tz/uploads/Zanzibar-Constitution-1984.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
