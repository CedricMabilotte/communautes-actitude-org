resume: >-
  Zanzibar est un archipel de l'océan Indien, État souverain jusqu'à son union avec le Tanganyika en 1964.
  Dans la République-Unie de Tanzanie, il conserve un gouvernement, un président, une Chambre des représentants et une Haute Cour propres, régis par la Constitution de Zanzibar de 1984.
  Les « affaires de l'Union » (défense, affaires étrangères, monnaie…) relèvent de l'État tanzanien ; les autres matières, dont la terre, relèvent de Zanzibar.
