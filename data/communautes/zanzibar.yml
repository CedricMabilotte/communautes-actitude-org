resume: >-
  Zanzibar est un archipel de l'océan Indien, État indépendant en 1963 puis uni au Tanganyika en 1964 pour former la République-Unie de Tanzanie.
  Il conserve un gouvernement (gouvernement révolutionnaire de Zanzibar), un président, une Chambre des représentants et une Haute Cour propres, régis par la Constitution de Zanzibar de 1984.
  Les « affaires de l'Union » (défense, affaires étrangères, police, monnaie, impôt sur le revenu, pétrole et gaz…) relèvent de l'État tanzanien ; les autres matières, dont la terre, relèvent de Zanzibar.
  La gestion forestière communautaire à Zanzibar fait l'objet de la fiche Forêts communautaires de Zanzibar.
