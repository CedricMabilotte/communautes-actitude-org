resume: >-
  Les musulmans représentent 10,7 % de la population du Sri Lanka au recensement de 2024. La loi sur le mariage et le divorce musulmans (Muslim Marriage and Divorce Act, MMDA, n° 13 de 1951) leur applique le droit musulman de leur école juridique (« sect ») et confie le contentieux familial à des quazis (juges de droit musulman, l'équivalent des cadis), avec appel devant un Conseil des quazis (Board of Quazis). L'ordonnance de 1931 sur les successions ab intestat (sans testament) et la loi de 1956 sur les mosquées et les wakfs (biens de mainmorte religieux) complètent ce régime. L'article 16 de la Constitution de 1978 maintient ces lois en vigueur même si elles contredisent les droits fondamentaux ; un comité de réforme est nommé en 2009 et aucune loi de réforme n'est adoptée en février 2026. Les Tamouls de la Province du Nord font l'objet de la fiche « Tamouls de la Province du Nord ».
