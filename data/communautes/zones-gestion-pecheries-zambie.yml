resume: >-
  Fiche agrégée : elle couvre les communautés de pêche riveraines des eaux déclarées zones de gestion des pêcheries (fisheries management areas) en Zambie. La loi n° 22 de 2011 sur les pêches (Fisheries Act), en vigueur le 18 avril 2011, permet au ministre de déclarer une telle zone par arrêté (statutory order, texte réglementaire), après consultation de la communauté riveraine (art. 26). Pour chaque zone, le ministre nomme un comité de gestion des pêcheries qui compte six représentants élus par la communauté de pêche riveraine, un représentant de l'autorité locale, un représentant de chaque chef coutumier concerné et des représentants des ONG, des pêcheurs commerciaux et de l'aquaculture (art. 29). Le comité gère les ressources halieutiques dans les quotas du plan de gestion, élabore ce plan avec le directeur des pêches, négocie avec lui les accords de cogestion avec les entreprises de pêche industrielle et tient un fonds alimenté par une part des recettes des licences (art. 28 et 30, annexe). Le nombre de zones déclarées n'a pas été trouvé.
