effectivite: {valeur: "effective", note: "Une étude de cas publiée par Local Biodiversity Outlooks (Forest Peoples Programme, 2020), écrite avec le comité « BioBudaya » de Melangkap, compte environ 400 systèmes de cogestion de rivière appliquant le tagal et décrit celui de Melangkap, où des sanctions frappent les contrevenants ; le nombre de sites passe à plus de 600 dans 17 districts en 2019 (rapport à la CDB) et à 642 dans 23 districts en 2025 (Borneo Post) ; le Département des pêches signe des protocoles d'accord avec les comités (Penampang 2023, Telupid 2025, Ranau 2026) ; une étude de l'Universiti Malaysia Sabah sur 15 sites tagal à vocation touristique (2024) trouve que, pour 87,3 % des 400 ménages interrogés, le revenu tiré de ces sites pèse peu dans le revenu total.", source: "https://localbiodiversityoutlooks.net/the-community-based-tagal-system-in-sabah-malaysia/"}
chronologie:
  - {annee: 1986, evenement: "Le village de Melangkap (Kota Belud) formalise son tagal de rivière ; des comités bombon de villageois élus le gèrent (bombon : zone soumise à des règles strictes)."}
  - {annee: 2000, evenement: "Début du programme de gestion communautaire des rivières selon le système tagal, selon le rapport de la Malaisie à la CDB."}
  - {annee: 2002, evenement: "Le Département des pêches finance le programme et ouvre en janvier un site modèle à la station de Babagon (Penampang) ; un peu plus de 40 sites tagal."}
  - {annee: 2003, evenement: "Adoption de l'Enactment sur la pêche continentale et l'aquaculture (30 juin), qui crée la zone de gestion communautaire des pêches (art. 35 à 37)."}
  - {annee: 2004, evenement: "Premier séminaire tagal (25 novembre), avec plus de 40 responsables communautaires et représentants de l'État ; zonage rouge, jaune et vert à la fin de l'année."}
  - {annee: 2016, evenement: "Premiers protocoles d'accord entre le Département des pêches et des comités tagal."}
  - {annee: 2019, evenement: "Entrée en vigueur de l'Enactment de 2003 le 1er avril ; le rapport national à la CDB compte plus de 600 zones tagal dans 17 districts."}
  - {annee: 2025, evenement: "642 sites dans 23 districts, sur plus de 232 rivières."}
fiabilite:
  verifie: ["Enactment de 2003, art. 1, 5 (2), 35, 36, 37 et 118 (t), sur la version de référence publiée par le Département des pêches du Sabah (octobre 2020).", "Native Courts (Native Customary Laws) Rules 1995, règle 58 et définition du sogit, sur le site du procureur général de l'État du Sabah.", "Sixième rapport national de la Malaisie à la CDB (2019), passage sur le tagal et note 7.", "Protocoles d'accord avec les comités depuis 2016 (Kampung Babagon Bawah, 2023) et signatures de 2025 (Telupid) et 2026 (Ranau), sur le site du Département des pêches.", "Étude de l'Universiti Malaysia Sabah (2024) : 15 sites, 400 ménages, 87,3 % à faible dépendance."]
  non_confirme: ["Aucun avis de déclaration d'une zone de gestion communautaire des pêches au journal officiel (art. 35) n'a été trouvé ; on ne sait pas combien des 642 sites sont déclarés selon la loi, liés par protocole d'accord ou reconnus comme tagal traditionnel.", "Le nombre de 642 sites vient d'un article d'un ancien directeur adjoint du Département des pêches, qui l'attribue au Département ; aucune publication officielle de ce chiffre n'a été consultée, et l'article ne dit pas combien de ces sites sont en activité.", "Aucune liste officielle des sites n'a été trouvée : pas de tableau par site.", "Le mode de désignation des comités (élection par le village ou nomination par le directeur) varie selon les sources ; l'élection n'est attestée que pour Melangkap.", "Population, nombre de villages et surface des zones : non trouvés."]
