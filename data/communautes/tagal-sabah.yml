resume: >-
  Fiche agrégée : elle couvre les communautés villageoises du Sabah qui gèrent un tronçon de rivière selon le système tagal. Le mot tagal signifie « interdit » en kadazan-dusun ; il désigne une interdiction de pêche décidée par le village, levée à des dates fixées, et sanctionnée par une amende coutumière (sogit). L'Enactment sur la pêche continentale et l'aquaculture de 2003 (loi de l'État du Sabah, en vigueur depuis le 1er avril 2019) permet au ministre de déclarer une « zone de gestion communautaire des pêches » et au directeur des pêches d'en confier la gestion à un comité formé de membres du village (art. 35 et 36). Depuis 2016, le Département des pêches signe aussi des protocoles d'accord avec les comités tagal. En 2025, le Département compte 642 sites dans 23 districts.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la Malaisie à la Convention sur la diversité biologique (décembre 2019) : le système tagal, gestion communautaire des poissons de rivière établie depuis 2000, repose sur l'art. 58 des Native Courts (Native Customary Laws) Rules 1995 et l'art. 36 de l'Enactment de 2003 ; plus de 600 zones tagal sur près de 200 rivières dans 17 districts", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/my-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Sabah Inland Fisheries and Aquaculture Enactment 2003 (Enactment n° 2 de 2003), art. 5 (2), 35, 36, 37 et 118 (t) ; entré en vigueur le 1er avril 2019 (GN. 89/2019)", nature: "loi", annee: 2003, source: "http://fishdept.sabah.gov.my/wp-content/uploads/2023/01/SabahInlandFisheriesAquacultureEnactment2003.pdf"}
  - {instrument: "Native Courts (Native Customary Laws) Rules 1995, règle 58 (pouvoirs propres des tribunaux autochtones pour les coutumes non prévues par le règlement)", nature: "coutume_reconnue", annee: 1995, source: "https://sagc.sabah.gov.my/sites/default/files/law/NativeCourts1992%28NativeCustomaryLaws1995%29.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le directeur des pêches peut nommer des agents ou des membres du village ou de la communauté locale pour former le comité qui administre la zone de gestion communautaire des pêches (Enactment de 2003, art. 36) ; il peut, par avis publié au journal officiel, déléguer certains de ses pouvoirs aux membres de ce comité (art. 5 (2)) ; le comité est donc nommé par l'administration, non élu de droit.", source: "http://fishdept.sabah.gov.my/wp-content/uploads/2023/01/SabahInlandFisheriesAquacultureEnactment2003.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les comités fixent les règles du tagal : périodes de fermeture et d'ouverture, interdiction du poison, des explosifs et de certains engins, entrée des personnes extérieures soumise à la permission de la communauté (exemple de Melangkap, Local Biodiversity Outlooks) ; les règlements opposables propres aux zones sont pris par le ministre (Enactment de 2003, art. 118 (t)) et leur violation est punie d'une amende jusqu'à 50 000 ringgits (art. 37).", source: "https://localbiodiversityoutlooks.net/the-community-based-tagal-system-in-sabah-malaysia/"}
  justice_propre: {valeur: "partiel", note: "Les contrevenants s'exposent à une sanction coutumière (sogit), amende ou bétail (Borneo Post, 2025) ; selon le rapport de la Malaisie à la CDB (2019), le régime s'appuie sur la règle 58 des Native Courts (Native Customary Laws) Rules 1995, qui préserve les pouvoirs propres des tribunaux autochtones (native courts) dans les affaires de droit coutumier non prévues par ces règles mais reconnues par la coutume de la communauté du district ; aucune décision de ces tribunaux sur un tagal n'a été consultée.", source: "https://www.cbd.int/doc/nr/nr-06/my-nr-06-en.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le comité administre la gestion et la conservation des ressources halieutiques de la zone (Enactment de 2003, art. 36) ; depuis fin 2004, le Département des pêches découpe les tronçons en zone rouge (protection, écotourisme, pêche avec remise à l'eau), jaune (pêche saisonnière encadrée) et verte (pêche toute l'année avec des pratiques traditionnelles) (Borneo Post, 2025) ; la zone reste déclarée par le ministre sur proposition du directeur (art. 35).", source: "http://fishdept.sabah.gov.my/wp-content/uploads/2023/01/SabahInlandFisheriesAquacultureEnactment2003.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
