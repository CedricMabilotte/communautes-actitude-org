resume: >-
  La loi n° 034-2009/AN du 16 juin 2009 portant régime foncier rural reconnaît la possession foncière rurale (pouvoir de fait exercé sur une terre selon les coutumes locales), à titre individuel ou collectif, et la constate par une attestation de possession foncière rurale (APFR) délivrée par la commune. Elle crée les chartes foncières locales, conventions inspirées des coutumes, adoptées en assemblée villageoise ou inter-villageoise puis validées par le conseil municipal, qui fixent les règles d'accès à la terre, de gestion des espaces de ressources naturelles d'utilisation commune et de conciliation des conflits. La loi prévoit dans chaque village une commission foncière villageoise, qui comprend de plein droit les autorités coutumières chargées du foncier, et un décret de 2012 y ajoute une commission de conciliation foncière villageoise ; la tentative de conciliation est obligatoire avant toute action en justice. Aucun décompte des chartes en vigueur et des APFR collectives postérieur à 2014 n'a été trouvé.
