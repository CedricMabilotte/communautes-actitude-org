effectivite: {valeur: "partielle", note: "Selon le Comité technique « Foncier et développement » (2014), les structures locales prévues par la loi n'étaient en place que dans 48 communes sur 351, 19 communes avaient une charte validée et 140 APFR avaient été délivrées pour 8 879 demandes, les APFR individuelles étant plus demandées que les APFR collectives. Selon une communication de mars 2023, 189 services fonciers ruraux étaient opérationnels en 2022 (53,84 % des communes), près de la moitié des villages n'étaient pas encore concernés par les commissions foncières villageoises et les commissions de conciliation restaient peu sollicitées.", source: "https://www.foncier-developpement.fr/wp-content/uploads/Burkina_Pierre-Aime-Ouedraogo_PPT_SFR-VF.pdf"}
chronologie:
  - {annee: 2007, evenement: "Adoption de la politique nationale de sécurisation foncière en milieu rural (décret n° 2007-610 du 4 octobre 2007)."}
  - {annee: 2009, evenement: "Loi n° 034-2009/AN du 16 juin 2009 portant régime foncier rural : possession foncière rurale, APFR, chartes foncières locales, commissions foncières villageoises, conciliation préalable obligatoire."}
  - {annee: 2010, evenement: "Décret n° 2010-404 du 29 juillet 2010 sur les structures locales de gestion foncière."}
  - {annee: 2012, evenement: "Décret n° 2012-263 du 3 avril 2012 sur la commission de conciliation foncière villageoise ; loi n° 034-2012/AN portant réorganisation agraire et foncière, qui range l'APFR parmi les titres de jouissance."}
  - {annee: 2014, evenement: "État des lieux de l'application de la loi (données de fin 2013 à mars 2014) : 48 communes équipées, 1 127 commissions foncières villageoises, 995 commissions de conciliation, 19 communes dotées d'une charte validée."}
  - {annee: 2017, evenement: "Décret n° 2017-0491 du 14 juin 2017 créant un Conseil national pour la sécurisation foncière en milieu rural."}
  - {annee: 2022, evenement: "189 services fonciers ruraux opérationnels, soit 53,84 % des communes."}
fiabilite:
  verifie:
    - "Texte de la loi n° 034-2009 (art. 6, 11 à 24, 32, 34 à 46, 81 et 82, 96 à 100, 107) sur le texte publié par FAOLEX."
    - "Chiffres de 2014 (48 communes, 1 127 CFV, 995 CCFV, 19 chartes validées, 140 APFR pour 8 879 demandes) dans la fiche pays du Comité technique « Foncier et développement »."
    - "Chiffres de 2022 sur les services fonciers ruraux et la couverture des villages par les commissions, dans la communication de Pierre Aimé Ouédraogo (Saint-Louis, mars 2023)."
    - "Mention de la loi de 2009 dans le quatrième rapport national à la Convention sur la diversité biologique."
    - "Nombre d'APFR délivrées en 2014 : 140 selon la fiche pays, 143 selon la note de synthèse n° 15 ; la fiche retient 140."
  non_confirme:
    - "Nombre actuel de chartes foncières locales et d'APFR collectives : aucune donnée publiée après 2014 trouvée ; une communication présentée en 2023 compte 21 291 APFR en 2020, procès-verbaux de constatation de possession foncière compris, sans distinguer APFR individuelles et collectives."
    - "Textes des décrets n° 2010-404 et n° 2012-263 non consultés : leur intitulé et la présidence des commissions foncières villageoises par les chefs coutumiers sont repris de sources secondaires (fiche pays, note de synthèse n° 15)."
    - "Modification éventuelle de la loi n° 034-2009 après 2023 non vérifiée ; aucune liste officielle des chartes par commune n'a été trouvée, d'où l'absence de tableau."
