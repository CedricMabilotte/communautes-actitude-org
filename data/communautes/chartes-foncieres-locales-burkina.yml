reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Quatrième rapport national du Burkina Faso à la Convention sur la diversité biologique (2010) : présente la loi de 2009 sur le régime foncier rural, adoptée après concertation des acteurs du monde rural, comme élément de la gestion durable des ressources naturelles.", annee: 2010, source: "https://www.cbd.int/doc/world/bf/bf-nr-04-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 034-2009/AN du 16 juin 2009 portant régime foncier rural", nature: "loi", annee: 2009, source: "https://faolex.fao.org/docs/pdf/bkf95496.pdf"}
  - {instrument: "Décret n° 2010-404 du 29 juillet 2010 portant attributions, composition, organisation et fonctionnement des structures locales de gestion foncière", nature: "loi", annee: 2010, source: "https://www.foncier-developpement.fr/wp-content/uploads/Fiche-pays-5_Burkina-Faso2.pdf"}
  - {instrument: "Décret n° 2012-263 du 3 avril 2012 portant composition, organisation et fonctionnement de la commission de conciliation foncière villageoise", nature: "loi", annee: 2012, source: "https://www.foncier-developpement.fr/wp-content/uploads/Fiche-pays-5_Burkina-Faso2.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Une commission foncière villageoise est créée dans chaque village sous l'égide du conseil villageois de développement ; elle comprend de plein droit les autorités coutumières et traditionnelles chargées du foncier (loi n° 034-2009, art. 81 et 82). Les chartes villageoises sont adoptées en assemblée villageoise ou inter-villageoise (art. 19), mais leur validité dépend d'une délibération du conseil municipal (art. 20).", source: "https://faolex.fao.org/docs/pdf/bkf95496.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les chartes foncières locales fixent les règles locales d'accès à la terre, de prêt de terres, de préservation d'espèces et de gestion des ressources communes (loi n° 034-2009, art. 13) ; elles ne peuvent déroger à la loi (art. 14) et, à défaut de charte, les us et coutumes fonciers locaux s'appliquent dans la limite des textes en vigueur (art. 107).", source: "https://faolex.fao.org/docs/pdf/bkf95496.pdf"}
  justice_propre: {valeur: "partiel", note: "Tout conflit foncier rural fait l'objet d'une tentative de conciliation devant les instances locales habituellement chargées de ces conflits, dont la procédure est fixée par les chartes (loi n° 034-2009, art. 96) ; le procès-verbal de conciliation est soumis à homologation (validation par le juge) du président du tribunal de grande instance (art. 97), qui garde la compétence contentieuse (art. 98).", source: "https://faolex.fao.org/docs/pdf/bkf95496.pdf"}
  terres: {valeur: "partiel", note: "La possession foncière rurale peut être collective, notamment familiale, et être constatée par une APFR qui a la valeur d'un titre de jouissance (droit d'usage reconnu par l'État) (loi n° 034-2009, art. 34, 39 et 44) ; les espaces locaux de ressources naturelles d'utilisation commune sont immatriculés (inscrits au livre foncier) au nom de la collectivité territoriale, déclarés inaliénables et peuvent être délégués en gestion aux utilisateurs locaux (art. 32).", source: "https://faolex.fao.org/docs/pdf/bkf95496.pdf"}
  ressources: {valeur: "partiel", note: "Les chartes déterminent les modalités d'accès et de gestion participative des forêts villageoises, bois sacrés, mares, pâtures et pistes à bétail d'utilisation commune (loi n° 034-2009, art. 6, 13 et 32) ; les forêts classées, aires fauniques, espaces pastoraux, mines et eaux restent régis par leurs lois propres (art. 3).", source: "https://faolex.fao.org/docs/pdf/bkf95496.pdf"}
