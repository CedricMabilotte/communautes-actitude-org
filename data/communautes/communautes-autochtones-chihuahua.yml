droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution de l'État (art. 8, fraction V) et la loi de 2013 (art. 9, fractions I, II et VII) reconnaissent aux communautés le droit de se régir selon leur organisation, de « commander et se faire obéir » et d'élire leurs autorités ; les municipalités doivent respecter les autorités désignées (art. 31, fraction IV).", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi de 2013 (art. 9, fraction IV) permet aux communautés de produire leurs systèmes normatifs internes, et l'article 8 donne à leurs décisions des effets équivalents à ceux des décisions de l'État ; leur validité est limitée aux relations familiales, à la vie civile et à la vie communautaire, dans le respect des constitutions et des droits humains (art. 10).", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution de l'État (art. 9) et la loi de 2013 (art. 9 VI, 10 et 33) reconnaissent une juridiction spéciale autochtone qui règle les conflits internes, si les parties en sont d'accord (art. 10) ; ses décisions sont validées par le juge à la demande d'une partie (art. 33), et depuis la réforme du 9 mai 2026 (art. 21 bis et 21 ter) le juge décide au cas par cas si l'affaire relève de cette juridiction.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  terres: {valeur: "partiel", note: "La Constitution de l'État (art. 8) déclare les terres des peuples autochtones inaliénables et imprescriptibles, sous réserve des formes de propriété agraire fédérales et des droits acquis par des tiers ; la loi de 2013 (art. 15) rend inaliénables les biens du patrimoine communautaire.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/constitucion/archivosConstitucion/actual.pdf"}
  ressources: {valeur: "partiel", note: "La loi de 2013 (art. 16) accorde un droit préférentiel d'usage des ressources naturelles et des services environnementaux des terres communautaires ; la Constitution de l'État (art. 8, fraction IX) en exclut les domaines déclarés stratégiques.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution de l'État (art. 8, fraction VI) et la loi de 2013 (art. 22 à 27) exigent le consentement libre, préalable et éclairé pour les travaux publics, expropriations, concessions et lois qui touchent les communautés, hors lois fiscales (art. 24, fraction V) ; faute d'accord, le projet peut être reformulé ou porté devant les instances compétentes (art. 26), sans droit de veto.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  langue: {valeur: "partiel", note: "La loi de 2013 (art. 12) rend les langues autochtones valables au même titre que l'espagnol pour toute démarche publique ; la loi générale de 2003 (art. 4) en fait des langues nationales.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  education: {valeur: "partiel", note: "La loi de 2013 (art. 9, fraction XII, et art. 20) reconnaît le droit de concevoir et mettre en œuvre des systèmes éducatifs propres et de recevoir un enseignement dans sa langue, dans les limites des lois sur l'éducation.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/leyes/archivosLeyes/1003.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution de l'État (art. 10, réforme de 2015) charge le Congrès et les municipalités de prévoir les crédits nécessaires et les procédures de participation des peuples à l'exercice et au contrôle de ces ressources ; aucun budget propre garanti n'a été trouvé.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/constitucion/archivosConstitucion/actual.pdf"}
  representation: {valeur: "partiel", note: "La Constitution de l'État (art. 10) reconnaît un droit à la représentation dans l'administration publique et la loi de 2013 (art. 32) un droit à la représentation politique, renvoyé aux lois électorales ; l'article quatrième transitoire de la réforme constitutionnelle du 30 juin 2026 (décret LXVIII/RFCNT/0557/2026) charge l'Institut électoral de l'État d'organiser l'élection de conseillers municipaux autochtones (regidurías indígenas) selon le système normatif interne.", source: "https://www.congresochihuahua2.gob.mx/biblioteca/constitucion/archivosConstitucion/actual.pdf"}
  statut_personnel: {valeur: "partiel", note: "La loi de 2013 (art. 10) donne effet aux systèmes normatifs internes dans les relations familiales et la vie civile ; l'arrêt de la Cour suprême du 5 mars 2026 (amparo en revisión 423/2025) oblige l'état civil du Chihuahua à donner valeur juridique aux constats de naissance et de décès du siríame de Tehuerichi.", source: "https://www.zonadocs.mx/2026/04/22/scjn-ordena-reconocer-a-autoridades-raramuri-para-emitir-actas-de-nacimiento-y-defuncion/"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Rapporteuse spéciale de l'ONU relève en 2018 que le régime agraire imposé dans la Sierra Tarahumara ne reflète pas la tenure des communautés rarámuri et ódami, qui mènent des procédures de reconnaissance de leurs terres pendant des années, ainsi que des déplacements forcés, des assassinats et des menaces (Choréachi), et des permis forestiers accordés sans consultation (annexe, cas 32 et 33) ; l'annexe cite aussi les difficultés d'enregistrement à l'état civil de la communauté de Tehuerichi (cas 36), tranchées par la Cour suprême le 5 mars 2026.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/39/17/Add.2&l=es&t=pdf"}
chronologie:
  - {annee: 1990, evenement: "Le Mexique ratifie la Convention 169 de l'OIT (5 septembre)."}
  - {annee: 2012, evenement: "Réforme du chapitre « Des droits autochtones » de la Constitution de l'État (art. 8 à 10), publiée le 11 août."}
  - {annee: 2013, evenement: "Publication de la Loi des droits des peuples autochtones de l'État de Chihuahua (29 juin)."}
  - {annee: 2016, evenement: "La Coordination de l'État pour la Tarahumara devient la Commission de l'État pour les peuples autochtones (décret publié le 3 octobre)."}
  - {annee: 2017, evenement: "La Cour interaméricaine des droits de l'homme ordonne des mesures provisoires pour la communauté de Choréachi (25 mars)."}
  - {annee: 2018, evenement: "Rapport de la Rapporteuse spéciale de l'ONU sur sa visite au Mexique, qui inclut le Chihuahua."}
  - {annee: 2026, evenement: "Arrêt de la Cour suprême sur l'état civil de Tehuerichi (5 mars) ; réforme de la loi sur la juridiction spéciale autochtone (9 mai) ; réforme constitutionnelle prévoyant des conseillers municipaux autochtones (30 juin)."}
