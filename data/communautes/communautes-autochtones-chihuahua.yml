resume: >-
  Fiche agrégée : elle couvre les communautés des peuples rarámuri (tarahumara), ódami (tepehuán du Nord), o'oba (pima) et warijó (guarijío) de l'État de Chihuahua. La Constitution de l'État (art. 8 à 10, réforme de 2012) et la Loi des droits des peuples autochtones de l'État de Chihuahua, publiée le 29 juin 2013, font de chaque communauté un sujet de droit public (personne morale de droit public) doté d'un patrimoine propre, qui élit ses autorités, applique ses systèmes normatifs internes (règles coutumières) et rend justice en son sein. Les biens communautaires sont inaliénables et le consentement libre, préalable et éclairé est requis pour les mesures qui les touchent. Le 5 mars 2026, la Cour suprême a ordonné de donner valeur juridique aux constats de naissance et de décès établis par le siríame (gouverneur traditionnel) de la communauté rarámuri de Tehuerichi.
