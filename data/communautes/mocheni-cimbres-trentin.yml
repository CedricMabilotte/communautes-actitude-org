droits:
  autogouvernement: {valeur: "partiel", note: "La loi provinciale 6/2008 reconnaît le Conseil mochène, formé par les trois communes, comme représentant de la population mochène et la commune de Luserna comme représentante de la population cimbre (art. 7) ; une Assemblée mochène réunit chaque année les trois conseils municipaux et fixe les orientations générales que doivent suivre les mesures des communes (art. 30), le conseil municipal de Luserna exerçant la même fonction (art. 31). Ces organes restent des communes ordinaires.", source: "https://www.axl.cefan.ulaval.ca/EtatsNsouverains/italietrento-6-2008.htm"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le Conseil mochène et le conseil municipal de Luserna rendent, à la majorité, un avis obligatoire et contraignant, limité aux mesures qui concernent exclusivement ou principalement leur communauté ; l'avis n'est pas pris en compte s'il est rendu après trente jours, loi provinciale 6/2008, art. 30 et 31. Les directives de la Junte provinciale aux instituts culturels leur sont soumises pour observations, art. 12.", source: "https://www.axl.cefan.ulaval.ca/EtatsNsouverains/italietrento-6-2008.htm"}
  langue: {valeur: "partiel", note: "Droit d'utiliser le mochène ou le cimbre à l'oral et à l'écrit avec les écoles, la province et les collectivités locales, réponse dans cette langue, documents publics rédigés en italien suivi du texte dans la langue de la minorité, procès-verbaux bilingues des conseils élus, loi provinciale 6/2008, art. 16 ; l'italien reste le texte officiel, art. 16, al. 2, et l'allemand est la langue de référence, art. 2, al. 4. Priorité absolue aux candidats qui attestent la connaissance de la langue dans les concours des collectivités des quatre communes, art. 32.", source: "https://www.axl.cefan.ulaval.ca/EtatsNsouverains/italietrento-6-2008.htm"}
  education: {valeur: "partiel", note: "Dans les écoles des communes où l'on parle le mochène ou le cimbre, le Statut garantit l'enseignement de la langue et de la culture allemandes, art. 102, al. 2 ; les établissements scolaires de ces territoires doivent garantir l'enseignement des langues et cultures propres aux communautés minoritaires et proposer des cours pour adultes, loi provinciale 6/2008, art. 17. Le système scolaire reste provincial.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  fiscalite: {valeur: "partiel", note: "La province doit affecter des crédits à la protection et au développement culturel, social et économique des populations mochène et cimbre, Statut, art. 15 ; la loi provinciale 6/2008 crée un fonds provincial dont la répartition est soumise à l'avis contraignant de la Conférence des minorités (art. 9 et 24). Aucun pouvoir fiscal propre.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  representation: {valeur: "partiel", note: "Le président du Conseil mochène et le maire de Luserna siègent au Conseil des autonomies locales de la province, loi provinciale 6/2008, art. 8 ; maires, présidents des communautés et représentants des instituts culturels siègent à la Conférence des minorités, art. 9. Le Conseil régional peut tenir des sessions extraordinaires sur les droits des groupes linguistiques mochène et cimbre, Statut, art. 27. Aucun siège réservé au Conseil provincial ou au Parlement.", source: "https://www.axl.cefan.ulaval.ca/EtatsNsouverains/italietrento-6-2008.htm"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Le Comité consultatif du Conseil de l'Europe signale en 2022 que, selon certains interlocuteurs, des enfants cimbrophones, sans préciser s'il s'agit du Trentin ou de la Vénétie, ont été empêchés de parler leur langue hors des heures de classe (§ 56) et relève en 2026 une enquête sociolinguistique provinciale de 2022 (§ 29) ; aucune évaluation publiée de l'application de la loi 6/2008 n'a été consultée.", source: "https://rm.coe.int/5th-op-italy-fr/1680aa21ab"}
chronologie:
  - {annee: 1972, evenement: "Texte unifié du Statut spécial du Trentin-Haut-Adige (décret présidentiel n° 670 du 31 août)."}
  - {annee: 1987, evenement: "Loi provinciale n° 18 du 31 août créant un institut culturel commun aux populations mochène et cimbre."}
  - {annee: 1993, evenement: "Décret législatif n° 592 du 16 décembre portant règles d'application du Statut pour la protection des populations ladine, mochène et cimbre."}
  - {annee: 1999, evenement: "Loi provinciale n° 4 du 30 août sur la protection des populations de langue minoritaire ; loi nationale n° 482 du 15 décembre."}
  - {annee: 2004, evenement: "Loi provinciale n° 7 du 23 juillet séparant l'institut mochène-cimbre en deux instituts."}
  - {annee: 2008, evenement: "Loi provinciale n° 6 du 19 juin sur les minorités linguistiques locales, qui abroge la loi de 1999."}
  - {annee: 2024, evenement: "Première année d'une session spéciale annuelle du Conseil provincial consacrée aux minorités linguistiques (art. 146 quinquies du règlement intérieur)."}
  - {annee: 2025, evenement: "Institution d'une Journée des minorités linguistiques ladine, mochène et cimbre."}
