resume: >-
  Les Mòchènes (Bersntoler) vivent dans trois communes de la vallée du Fersina et les Cimbres dans la commune de Luserna, sur le plateau au sud-est de Trente ; tous deux parlent des langues d'origine germanique. Le Statut spécial du Trentin-Haut-Adige leur reconnaît un droit à la valorisation de leurs activités culturelles et au respect de leur toponymie et de leurs traditions, et garantit l'enseignement de la langue et de la culture allemandes dans les écoles de leurs communes (art. 102), et oblige la province à leur affecter des crédits (art. 15). La loi provinciale de Trente n° 6 du 19 juin 2008 délimite leurs territoires d'établissement historique, garantit l'usage de leur langue devant les administrations, donne une priorité d'embauche aux personnes qui la parlent et institue une Assemblée et un Conseil mochènes ainsi qu'un avis contraignant du conseil municipal de Luserna. Deux instituts culturels, mochène et cimbre, relèvent de la province. La province autonome a sa propre fiche (« Trentins »).
