resume: >-
  Les Inuvialuit sont les Inuit de l'ouest de l'Arctique canadien. La Convention définitive des Inuvialuit, signée le 5 juin 1984 et mise en vigueur par la Loi sur le règlement des revendications des Inuvialuit de la région ouest de l'Arctique (L.C. 1984, ch. 24), leur attribue environ 35 000 milles carrés de terres en propriété collective, des droits de récolte exclusifs ou préférentiels et une place dans des organismes de cogestion de la faune et d'examen des projets. La Société régionale inuvialuit, contrôlée par six sociétés communautaires, gère les terres et les indemnités. Un accord d'autonomie gouvernementale est en négociation (accord de principe signé en 2015) ; depuis 2022, une loi inuvialuit sur le bien-être de l'enfance est en vigueur.
