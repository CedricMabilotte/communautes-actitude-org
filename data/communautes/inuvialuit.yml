  - {instrument: "Loi concernant la Déclaration des Nations Unies sur les droits des peuples autochtones (L.C. 2021, ch. 14), dont le préambule confirme que la Déclaration est une source d'interprétation du droit canadien", nature: "loi", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/page-1.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Convention institue la Société régionale inuvialuit, qui représente les Inuvialuit et administre leurs terres, et une société communautaire par collectivité, qui ensemble la contrôlent, art. 6(1) a) et b) (1984) ; ce sont des sociétés, sans pouvoir général de gouvernement, l'accord d'autonomie gouvernementale étant encore en négociation. La Société régionale inuvialuit agit aussi comme corps dirigeant autochtone pour la loi inuvialuit sur le bien-être de l'enfance, en vigueur depuis le 25 novembre 2022.", source: "https://irc.inuvialuit.com/wp-content/uploads/2023/10/Inuvialuit_Final_Agreement_2005.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque comité de chasseurs et de trappeurs adopte des règlements sur l'exercice des droits de récolte, art. 14(76) f) de la Convention, exécutoires en vertu de l'ordonnance sur la faune des Territoires du Nord-Ouest, art. 14(77). La loi inuvialuit sur le bien-être de l'enfance (Inuvialuit Qitunrariit Inuuniarnikkun Maligaksat), adoptée par la Société régionale inuvialuit au titre de la loi fédérale L.C. 2019, ch. 24, est en vigueur depuis le 25 novembre 2022 dans les Territoires du Nord-Ouest, au Yukon et en Alberta. Aucun pouvoir général de légiférer n'est prévu.", source: "https://www.sac-isc.gc.ca/fra/1608565826510/1608565862367"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les Inuvialuit reçoivent en pleine propriété (fee simple absolute, propriété sans limite de durée) environ 35 000 milles carrés de terres, art. 7(1) et 7(5), ainsi que le lit des lacs et rivières de ces terres, art. 7(2) ; la Société foncière inuvialuit détient ces terres, art. 6(1) c).", source: "https://irc.inuvialuit.com/wp-content/uploads/2023/10/Inuvialuit_Final_Agreement_2005.pdf"}
  ressources: {valeur: "partiel", note: "Le sous-sol (minéraux, pétrole, gaz) n'est inclus que sur environ 5 000 milles carrés, art. 7(1) a) ; l'État conserve les eaux, art. 7(3). Droit de récolte préférentiel sur toutes les espèces pour la subsistance et droit exclusif sur les animaux à fourrure, l'ours blanc et le bœuf musqué, art. 14(6), sans propriété sur la faune.", source: "https://irc.inuvialuit.com/wp-content/uploads/2023/10/Inuvialuit_Final_Agreement_2005.pdf"}
  consentement: {valeur: "partiel", note: "Les Inuvialuit nomment trois des sept membres du Comité d'étude des répercussions environnementales, qui examine les projets de la région, art. 11(5) ; sur les terres inuvialuit, un promoteur doit conclure un accord de participation (Participation Agreement) avec l'Administration des terres inuvialuit, avec arbitrage en cas de désaccord, art. 10(2) et 10(8) ; pas de droit de refus.", source: "https://irc.inuvialuit.com/wp-content/uploads/2023/10/Inuvialuit_Final_Agreement_2005.pdf"}
  langue: {valeur: "reconnu", note: "L'inuvialuktun figure parmi les onze langues officielles des Territoires du Nord-Ouest, Loi sur les langues officielles, art. 4 (L.R.T.N.-O. 1988, ch. 56 (Suppl.), modifiée en 2003) ; ce statut vient de la loi territoriale et non d'un pouvoir propre des Inuvialuit, et ne s'étend pas au versant nord du Yukon.", source: "https://www.axl.cefan.ulaval.ca/amnord/tno.htm"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La Convention définit qui peut s'inscrire comme bénéficiaire, art. 5(2), et confie aux sociétés communautaires ou à la Société régionale le soin de reconnaître les descendants, art. 5(3) ; il s'agit d'un statut de bénéficiaire, non d'une citoyenneté.", source: "https://irc.inuvialuit.com/wp-content/uploads/2023/10/Inuvialuit_Final_Agreement_2005.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune source indépendante sur l'application de la Convention n'a été consultée. La Société régionale inuvialuit énumère six organismes de cogestion prévus par la Convention, auxquels le Conseil inuvialuit de gestion du gibier nomme les membres inuvialuit, sans en décrire le fonctionnement ; le gouvernement des T.N.-O. indique qu'un accord de principe sur l'autonomie gouvernementale a été signé le 21 juillet 2015 et que l'accord définitif reste à conclure.", source: "https://irc.inuvialuit.com/lands/co-management/"}
chronologie:
  - {annee: 1984, evenement: "Signature de la Convention définitive le 5 juin ; loi fédérale sanctionnée le 28 juin ; date de la loi de règlement retenue par la Convention : 25 juillet."}
  - {annee: 1996, evenement: "Début des négociations d'autonomie gouvernementale, menées avec le Conseil tribal des Gwich'in."}
  - {annee: 2003, evenement: "Accord de principe conjoint Inuvialuit–Gwich'in, ensuite rejeté par le Conseil tribal des Gwich'in."}
  - {annee: 2007, evenement: "Entente sur le processus et le calendrier des négociations inuvialuit, signée le 4 mai."}
  - {annee: 2015, evenement: "Accord de principe sur l'autonomie gouvernementale signé le 21 juillet à Inuvik par la Société régionale inuvialuit, le Canada et les T.N.-O."}
  - {annee: 2022, evenement: "Entrée en vigueur, le 25 novembre, de la loi inuvialuit sur le bien-être de l'enfance dans les T.N.-O., au Yukon et en Alberta."}
  - {annee: 2024, evenement: "Accord de coordination sur les services à l'enfance conclu le 30 septembre pour les T.N.-O."}
