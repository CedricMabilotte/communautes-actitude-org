resume: >-
  Fiche agrégée : elle couvre les communautés rurales d'Angola titulaires de terrains ruraux communautaires. La loi sur les terres (Lei de Terras, loi n.º 9/04 du 9 novembre 2004) définit les communautés rurales comme des communautés de familles voisines qui détiennent des droits collectifs de possession, de gestion, d'usage et de jouissance de leurs terrains selon la coutume (art. 1 c)). Elle reconnaît à leurs familles le domaine utile coutumier (droit d'usage permanent sur une terre dont l'État garde la propriété), gratuit et imprescriptible, constaté par un titre ; ces terrains ne peuvent être concédés à des tiers sauf désaffectation (retrait du statut communautaire) après audition des autorités traditionnelles (art. 37). Les litiges internes sont tranchés au sein de la communauté selon la coutume (art. 82). Le nombre de titres délivrés n'a pas été trouvé.
