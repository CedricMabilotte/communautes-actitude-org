effectivite: {valeur: "non_etablie", note: "Aucune source donnant le nombre de titres de domaine utile coutumier délivrés n'a été trouvée. Le Comité des droits économiques, sociaux et culturels de l'ONU relève en 2016 que des activités de développement empêchent des peuples autochtones, que l'État ne reconnaît pas, d'accéder à leurs terres, l'absence de cadre légal de consultation préalable des communautés touchées et la persistance d'expulsions forcées sans garanties de procédure (E/C.12/AGO/CO/4-5, § 19 et 45).", source: "https://documents.un.org/api/symbol/access?s=E/C.12/AGO/CO/4-5&l=en&t=pdf"}
chronologie:
  - {annee: 2004, evenement: "Loi sur les terres n.º 9/04 du 9 novembre 2004 : terrains ruraux communautaires, domaine utile coutumier et justice communautaire (art. 23, 37 et 82)."}
  - {annee: 2010, evenement: "Constitution de la République : reconnaissance de la coutume (art. 7), de l'accès des communautés locales à la terre (art. 15) et des autorités traditionnelles (art. 223 à 225)."}
  - {annee: 2016, evenement: "Observations finales du Comité des droits économiques, sociaux et culturels sur l'Angola : il recommande de garantir les droits fonciers des peuples autochtones et de recueillir leur consentement préalable avant toute licence d'exploitation."}
