base_nationale:
  - {instrument: "Lei de Terras de Angola, loi n.º 9/04 du 9 novembre 2004, art. 1 c), 9, 19, 22, 23, 37, 51, 63 et 82", nature: "loi", annee: 2004, source: "https://pdac.ao/wp-content/uploads/2020/07/LEI_TERRAS_ANGOLA.pdf"}
  - {instrument: "Constitution de la République d'Angola, art. 7 (coutume), 15 (accès des communautés locales à la terre), 98 (droits fonciers des communautés rurales) et 223 à 225 (autorités traditionnelles)", nature: "constitution", annee: 2010, source: "https://www.constituteproject.org/constitution/Angola_2010"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 2004 définit les communautés rurales comme gérant leurs terrains selon les « princípios de auto-administração e auto gestão » (principes d'auto-administration et de gestion propre) (art. 1 c)) ; la Constitution de 2010 reconnaît le statut et les fonctions des institutions des autorités traditionnelles fondées sur le droit coutumier (art. 223 et 224), leurs attributions étant fixées par la loi (art. 225).", source: "https://www.constituteproject.org/constitution/Angola_2010"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution de 2010 reconnaît la force juridique de la coutume conforme à la Constitution et à la dignité humaine (art. 7) ; la loi de 2004 fait régir le domaine utile coutumier par la coutume, le Code civil ne s'appliquant qu'à défaut (art. 37 n.º 9), et son extinction par les normes coutumières (art. 37 n.º 7).", source: "https://pdac.ao/wp-content/uploads/2020/07/LEI_TERRAS_ANGOLA.pdf"}
  justice_propre: {valeur: "partiel", note: "Les litiges relatifs aux droits collectifs et au domaine utile coutumier des terrains ruraux communautaires sont tranchés au sein des communautés rurales selon la coutume ; une partie en désaccord peut saisir les tribunaux (loi n.º 9/04, art. 82, « Justiça comunitária »).", source: "https://pdac.ao/wp-content/uploads/2020/07/LEI_TERRAS_ANGOLA.pdf"}
  terres: {valeur: "partiel", note: "L'État reconnaît aux familles des communautés rurales l'occupation, la possession et l'usage des terrains ruraux communautaires, par un titre ; ce domaine utile coutumier est gratuit, imprescriptible, intransmissible sauf droit coutumier, et insaisissable sauf hypothèque garantissant un prêt bancaire pour mettre le terrain en valeur ; ces terrains ne sont pas concessibles (loi n.º 9/04, art. 19 n.º 7, 37 et 63). La propriété reste à l'État (Constitution, art. 98) ; une désaffectation suivie d'une concession reste possible après audition des autorités traditionnelles, avec attribution d'autres terres ou compensation (art. 37 n.º 4), et l'expropriation pour utilité publique est admise contre juste indemnisation (art. 9 n.º 2).", source: "https://pdac.ao/wp-content/uploads/2020/07/LEI_TERRAS_ANGOLA.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La délimitation des terrains ruraux communautaires est précédée de l'audition des familles et des institutions du pouvoir traditionnel (loi n.º 9/04, art. 23 n.º 2 et 51 n.º 2) ; la désaffectation est décidée après audition des autorités traditionnelles (art. 37 n.º 4). La loi prévoit une audition, non un consentement.", source: "https://pdac.ao/wp-content/uploads/2020/07/LEI_TERRAS_ANGOLA.pdf"}
