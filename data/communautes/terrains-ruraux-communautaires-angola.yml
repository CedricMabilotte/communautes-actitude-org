    - "Contenu du règlement d'application (Regulamento Geral de Concessão de Terrenos annoncé à l'art. 85 de la loi) sur la procédure de titre et de délimitation : texte non consulté."
    - "La copie de la loi consultée est une transcription ; elle n'a pas été comparée au Diário da República, et l'absence de modification de la loi depuis 2004 n'a pas été vérifiée."
    - "Le texte constitutionnel lu est la version de 2010 publiée par le Constitute Project ; la révision constitutionnelle de 2021 n'a pas été comparée pour les articles cités."
    - "L'IWGIA indique que le gouvernement ne reconnaît pas la notion de peuple autochtone au sens du droit international ; les communautés San ne sont pas visées comme telles par le régime, qui s'applique aux communautés rurales en général."
    - "Aucun document d'un mécanisme de l'ONU de la liste du cadre nommant le régime des terrains ruraux communautaires n'a été trouvé."
