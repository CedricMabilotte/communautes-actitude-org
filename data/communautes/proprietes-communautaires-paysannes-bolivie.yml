resume: >-
  Fiche agrégée. La propriété communautaire, appelée « propriété communaire » (propiedad comunaria) par la loi 1715 de 1996, est une terre titrée collectivement à une communauté paysanne ou à une ancienne hacienda (grand domaine) ; le décret 29215 de 2007 (art. 100.I) l'ouvre aussi aux communautés de colons et aux communautés autochtones ; elle est inaliénable, indivisible, irréversible, insaisissable et imprescriptible (art. 41.I.6). La Constitution de 2009 (art. 394.III) range les communautés paysannes dans la propriété communautaire ou collective, aux côtés des « territoires indígenas originarios campesinos » (TIOC, territoires des peuples autochtones et paysans). La base de titres de l'Institut national de réforme agraire (INRA) distingue les deux catégories : de 1996 à 2024, les propriétés communautaires couvrent 25 % de la surface assainie et titrée, les TCO/TIOC 39 %. Une communauté titrée inscrite au registre d'identité des peuples autochtones ou originaires peut demander, sur décision de son assemblée, la conversion de sa propriété communautaire en TCO (décret 29215 de 2007, art. 378 à 380).
