droits:
  autogouvernement: {valeur: "partiel", note: "Pour recevoir une propriété communautaire, la communauté paysanne justifie de sa personnalité juridique (décret 29215 de 2007, art. 100.III) ; elle agit par des représentants « organiques », élus selon ses us et coutumes (art. 8), peut attribuer à ses membres l'usage de parcelles familiales sans diviser la propriété collective (art. 99.II) et décide en assemblée de demander la conversion en TCO (art. 378). Aucun texte consulté ne lui confère de compétences de gouvernement au-delà de la gestion de la terre.", source: "https://www.lexivox.org/norms/BO-DS-29215.html"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Le décret 29215 de 2007 reconnaît la résolution des conflits à l'intérieur des communautés paysannes ou entre elles, adoptée selon leurs us et coutumes (art. 3), et l'INRA avalise les accords de conciliation conclus dans les communautés selon leur normativité traditionnelle (art. 473.II) ; la compétence se limite aux conflits de possession et de propriété agraires.", source: "https://www.lexivox.org/norms/BO-DS-29215.html"}
  terres: {valeur: "reconnu", note: "La loi 1715 de 1996 (art. 41.I.6) définit les propriétés communaires, titrées collectivement aux communautés paysannes, comme inaliénables, indivisibles, irréversibles, collectives, insaisissables et imprescriptibles ; la Constitution de 2009 (art. 394.III) reprend ces caractères pour la propriété collective des communautés paysannes et l'exempte de l'impôt sur la propriété agraire.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La loi 3545 de 2006 (art. 8, modifiant l'art. 11 de la loi 1715) réserve des sièges de la Commission agraire nationale à la CSUTCB (Confederación Sindical Única de Trabajadores Campesinos de Bolivia, principale organisation syndicale paysanne), à la Fédération nationale des femmes paysannes Bartolina Sisa et à la Confédération des colons ; ces sièges reviennent aux organisations nationales et non aux communautés titulaires, et la commission n'a qu'un rôle consultatif et de contrôle en matière agraire.", source: "https://www.lexivox.org/norms/BO-L-3545.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon une étude de cas de la Coalition internationale pour l'accès à la terre et de la Fondation TIERRA (2015), l'assainissement lancé par la loi 1715 n'avait titré que 8,73 % de la surface du pays en 2005 ; après la loi 3545, plus de 200 communautés de l'Altiplano de La Paz, environ 17 700 familles, ont mis à jour leurs droits par un « assainissement interne » (inventaire des droits mené par la communauté) que l'INRA valide ensuite. L'INRA relève de son côté que des communautés paysannes ont dénoncé, pendant la sous-traitance de l'assainissement (1996-2006), des travaux menés sans coordination territoriale ni respect de leurs usages.", source: "https://d1n0nj0ml605fq.cloudfront.net/media/documents/ilc_case_study_0060_bolivia_es.pdf"}
chronologie:
  - {annee: 1953, evenement: "Réforme agraire : distribution de terres, dont 12,3 millions d'hectares en propriétés communautaires jusqu'en 1994."}
  - {annee: 1996, evenement: "Loi 1715 : création de l'INRA et définition des propriétés communaires (art. 41.I.6)."}
  - {annee: 2006, evenement: "Loi 3545 de reconduction communautaire de la réforme agraire."}
  - {annee: 2007, evenement: "Décret 29215 : règlement de l'assainissement et de la titularisation, attributions familiales et conversion en TCO."}
  - {annee: 2009, evenement: "Constitution : propriété communautaire ou collective des communautés paysannes (art. 394.III)."}
  - {annee: 2024, evenement: "Bilan de l'INRA : les propriétés communautaires représentent 25 % de la surface assainie et titrée depuis 1996."}
