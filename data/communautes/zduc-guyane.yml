effectivite: {valeur: "partielle", note: "Les attributions ont été gelées entre 1996 et 2011 ; en 2014, deux demandes de zones (Palikur de Saint-Georges-de-l'Oyapock, Arawak-Lokono de Sainte-Rose-de-Lima) attendaient d'être traitées ; la gestion interne des zones repose sur la coutume. En 2020, le Sénat relève que l'attribution des 400 000 hectares prévue par l'Accord de Guyane de 2017 n'est pas réalisée ; en 2022, le CERD (Comité pour l'élimination de la discrimination raciale, ONU) juge que les droits à la terre des peuples autochtones des outre-mer ne sont pas pleinement respectés.", source: "https://gred.ird.fr/content/download/211426/3279907/version/1/file/2014_rapport_ZDUC_final.pdf"}
chronologie:
  - {annee: 1987, evenement: "Décret du 14 avril créant les zones de droits d'usage collectifs, concessions et cessions."}
  - {annee: 2005, evenement: "Le régime est inscrit dans la partie législative du code forestier."}
  - {annee: 2014, evenement: "Bilan IRD-CNRS : 15 zones de droits d'usage collectifs, 9 concessions et 3 cessions, 669 686 hectares."}
  - {annee: 2017, evenement: "Loi du 28 février : création du Grand conseil coutumier des populations amérindiennes et bushinengé. Accord de Guyane du 21 avril : engagement d'attribuer 400 000 hectares aux populations autochtones."}
  - {annee: 2018, evenement: "Désignation des membres du Grand conseil coutumier le 9 juin."}
  - {annee: 2022, evenement: "Le CERD recommande à la France de reconnaître les droits collectifs des peuples autochtones aux terres et aux ressources."}
