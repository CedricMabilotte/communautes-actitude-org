resume: >-
  La République française ne reconnaît pas de peuples autochtones, au nom de l'égalité des citoyens (art. 1er de la Constitution). En Guyane, un décret du 14 avril 1987 crée pourtant des zones de droits d'usage collectifs, des concessions et des cessions de terres domaniales au profit des « communautés d'habitants qui tirent traditionnellement leurs moyens de subsistance de la forêt ». Ce régime, élevé au rang législatif en 2005 (code forestier, art. L. 272-4 à L. 272-6), couvre 27 zones et environ 8 % du territoire guyanais ; 24 d'entre elles ont été demandées par des communautés amérindiennes. Un Grand conseil coutumier des populations amérindiennes et bushinengé (marronnes), créé par la loi du 28 février 2017 et installé en 2018, représente ces populations auprès des pouvoirs publics. L'Accord de Guyane du 21 avril 2017 prévoit l'attribution de 400 000 hectares aux populations autochtones. Les droits d'usage dans le cœur du Parc amazonien relèvent d'un régime distinct (fiche « Communautés d'habitants du Parc amazonien de Guyane »).
