resume: >-
  La République française ne reconnaît pas de peuples autochtones, au nom de l'égalité des citoyens (art. 1er de la Constitution). En Guyane, un décret du 14 avril 1987 crée pourtant des zones de droits d'usage collectifs, des concessions et des cessions de terres domaniales au profit des « communautés d'habitants qui tirent traditionnellement leurs moyens de subsistance de la forêt ». Ce régime, élevé au rang législatif en 2005 (code forestier, art. L. 272-4 à L. 272-6), couvre 27 zones et environ 8 % du territoire guyanais ; 24 d'entre elles ont été demandées par des communautés amérindiennes. Depuis 2017, un Grand conseil coutumier représente les populations amérindiennes et bushinengé (marronnes).
