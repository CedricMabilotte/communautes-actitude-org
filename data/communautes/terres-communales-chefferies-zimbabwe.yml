resume: >-
  La loi Communal Land Act (loi sur les terres communales, chap. 20:04) de 1982 attribue la propriété des terres communales au président, qui en permet l'occupation et l'usage selon la loi. La loi Traditional Leaders Act (loi sur les dirigeants traditionnels, chap. 29:17) de 1998, en vigueur depuis le 1er janvier 2000, institue dans chaque village une assemblée (dare ou inkundla) formée de tous les habitants de plus de 18 ans, qui traite des questions de terre, d'eau et de ressources naturelles. Les chefs, nommés par le président, veillent à l'attribution des terres et règlent les litiges fonciers ; le conseil de district rural garde le contrôle final de l'attribution. La Constitution de 2013 reconnaît l'institution des dirigeants traditionnels et leur confie l'administration des terres communales.
