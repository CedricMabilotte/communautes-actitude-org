  verifie: ["Art. 4 de la Communal Land Act (version consolidée au 31 décembre 2016, ZimLII).", "Art. 3, 5, 12, 14, 15, 26, 28, 37 et 39 de la Traditional Leaders Act et date d'entrée en vigueur (ZimLII).", "Art. 120, 162, 280 et 282 de la Constitution de 2013 (Constitute Project).", "Art. 10, 11, 15 et 16 de la Customary Law and Local Courts Act (ZimLII), dont l'exclusion des litiges fonciers de la compétence des tribunaux locaux (art. 16).", "Art. 283 de la Constitution : nomination des chefs par le président sur recommandation de l'assemblée provinciale des chefs."]
