reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Nicaragua ratifie la Convention 169 de l'OIT le 25 août 2010 (en vigueur le 25 août 2011).", annee: 2010, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Nicaragua vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295) ; le décret 19-2008 désigne les Miskitu et les Mayangna du bassin comme peuples autochtones.", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Loi 445 sur le régime de propriété communale des peuples autochtones et communautés ethniques des régions autonomes et des rivières Bocay, Coco, Indio et Maíz", nature: "loi", annee: 2003, source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  - {instrument: "Décret exécutif 19-2008 déclarant un régime spécial de développement pour les territoires Miskitu Indian Tasbaika Kum, Mayangna Sauni Bu et Kipla Sait Tasbaika (La Gaceta n° 83 du 5 mai 2008)", nature: "loi", annee: 2008, source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/3133c0d121ea3897062568a1005e0f89/ffea3331e50c127b06257452006b455c"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le décret 19-2008 (art. 2) confie le régime spécial au gouvernement territorial autochtone, formé des chefs des trois territoires qui élisent en leur sein un chef pour un an, à tour de rôle ; la loi 445 (art. 4 à 6) fait de l'assemblée communale et de l'assemblée territoriale les autorités suprêmes et prévoit l'élection des autorités communales et territoriales selon la coutume.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/3133c0d121ea3897062568a1005e0f89/ffea3331e50c127b06257452006b455c"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "La loi 445 (art. 13) charge le juge communal (wihta) de surveiller l'exploitation domestique du bois et laisse à la communauté le soin d'imposer la sanction en cas d'abus.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  terres: {valeur: "reconnu", note: "La loi 445 (art. 24) reconnaît le droit des communautés sur les terres qu'elles occupent traditionnellement et les rend inaliénables, insaisissables et imprescriptibles (elles ne se perdent pas avec le temps) ; selon le programme public de titrage (2023), les trois territoires sont titrés et les zones complémentaires de deux d'entre eux le sont en octobre 2021.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  ressources: {valeur: "partiel", note: "La loi 445 (art. 25) reconnaît la propriété de la communauté dans les contrats d'exploitation des ressources et (art. 27) impose une gestion conjointe entre communautés et État des aires protégées situées sur les terres communales ; les trois territoires se trouvent dans la réserve de biosphère de Bosawás.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  consentement: {valeur: "partiel", note: "La loi 445 (art. 12) impose à la municipalité de consulter la communauté avant tout avis sur une concession du sous-sol ; les articles 16 et 17, rédigés pour les conseils régionaux autonomes, prévoient une réponse positive ou négative de la communauté consultée et une négociation en cas d'opposition.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/($All)/F59730333B3F6FA5062571B200559533"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le décret 19-2008 (art. 3 et 4) oblige les ministères à inscrire à leur budget les actions du régime spécial, exécutées par ses instances et par les gouvernements territoriaux et communaux, et à financer l'équipe technique du gouvernement territorial ; aucun pouvoir fiscal propre n'est prévu.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/3133c0d121ea3897062568a1005e0f89/ffea3331e50c127b06257452006b455c"}
  representation: {valeur: "partiel", note: "Le décret 19-2008 (art. 5) fait du chef du gouvernement territorial autochtone un membre du Conseil de développement de la côte caraïbe.", source: "http://legislacion.asamblea.gob.ni/Normaweb.nsf/3133c0d121ea3897062568a1005e0f89/ffea3331e50c127b06257452006b455c"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude universitaire (Pardo et Hansell, 2017) observe de 2011 à 2016 le fonctionnement des gouvernements territoriaux autochtones de la région. Le FIDA (2022) relève, pour les territoires autochtones du pays, l'absence d'un assainissement (saneamiento : règlement de la situation des occupants non autochtones) réel et effectif. Selon le programme public de titrage (2023), la population des zones complémentaires de Miskitu Indian Tasbaika Kum et Mayangna Sauni Bu est à 80-90 % non autochtone ; le titre de 2021 prévoit une administration conjointe avec les familles non autochtones organisées et l'absence d'expulsions.", source: "https://www.ifad.org/documents/d/new-ifad.org/nicaragua_ctn_s-pdf"}
chronologie:
  - {annee: 2003, evenement: "Adoption de la loi 445, applicable aux bassins des rivières Coco, Bocay, Indio et Maíz."}
  - {annee: 2007, evenement: "Titrage des six territoires autochtones de la réserve de biosphère de Bosawás, sans les zones complémentaires de Miskitu Indian Tasbaika Kum et Mayangna Sauni Bu."}
  - {annee: 2008, evenement: "Décret 19-2008 : régime spécial de développement et gouvernement territorial autochtone de l'Alto Wangki et du Bocay."}
  - {annee: 2010, evenement: "Ratification de la Convention 169 de l'OIT par le Nicaragua."}
  - {annee: 2021, evenement: "Remise des titres des zones complémentaires de Miskitu Indian Tasbaika Kum et Mayangna Sauni Bu, dans le département de Jinotega (octobre)."}
fiabilite:
  verifie: ["Articles 1 à 6 du décret 19-2008 (texte de l'Assemblée nationale, La Gaceta n° 83 du 5 mai 2008).", "Articles 1, 4 à 6, 12, 13, 16, 17, 24, 25 et 27 de la loi 445.", "Superficies, familles et communautés des trois territoires (note technique du FIDA, 2022, d'après la CEPAL, 2020).", "Titrage des zones complémentaires achevé en octobre 2021 (PRODEP III, 2023 ; International Land Coalition)."]
  non_confirme: ["Année de délivrance du titre initial de chaque territoire (2007 selon la présentation PRODEP pour les territoires de Bosawás, sans détail par territoire).", "Superficies après le titrage des zones complémentaires de 2021 : les chiffres du FIDA (2022) reprennent ceux publiés en 2016 ; la présentation PRODEP donne 279,75 km² et 313,07 km² pour des zones dont le périmètre n'est pas précisé.", "Nombre de communautés : 48 dans le décret de 2008, 43 selon le FIDA en 2022.", "Population actuelle : le FIDA compte 4 424 familles autochtones, sans total d'habitants.", "Communes couvertes : Pardo et Hansell (2017) situent la région dans les communes de Jinotega, San José de Bocay et Waspam (cette dernière en région autonome de la Côte caraïbe nord) ; le programme de titrage la rattache au département de Jinotega.", "Fonctionnement actuel du Conseil de développement de la côte caraïbe et du budget prévu par le décret 19-2008."]
