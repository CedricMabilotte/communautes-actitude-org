resume: >-
  Trois territoires autochtones miskitu et mayangna du bassin du haut Coco (Wangki) et du Bocay, situés dans les communes de Jinotega, San José de Bocay et Waspam, dans la zone centrale de la réserve de biosphère de Bosawás. Ils sont titrés en propriété communale au titre de la loi 445 de 2003, qui s'applique aux régions autonomes de la côte caraïbe et aux bassins des rivières Coco, Bocay, Indio et Maíz. Le décret 19-2008 les place sous un régime spécial de développement administré par un gouvernement territorial autochtone formé des chefs des trois territoires, avec siège à San Andrés de Bocay. Les zones complémentaires (espaces occupés traditionnellement mais restés hors du titre initial) de deux territoires sont titrées en 2021.
