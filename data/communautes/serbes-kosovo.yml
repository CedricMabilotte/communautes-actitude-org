  non_confirme: ["Nombre de communes à majorité serbe : 7 au recensement de 2024 avec estimation ; Gračanica (46,3 %) et Klokot (43,7 %) sont sous la moitié, Novo Brdo à 13,5 % ; les sources politiques parlent souvent de dix communes. Les écarts entre les deux tableaux du recensement portent sur les quatre communes du Nord.", "Suite des événements après mars 2023 (élections communales du Nord, retour des représentants serbes) non vérifiée.", "Accord MINUK-Conseil de l'Europe de 2004 sur le suivi de la Convention-cadre non lu.", "Points 7 à 15 du premier accord de 2013 (commandant régional de police du Nord, division de la cour d'appel à Mitrovica) non lus dans un texte officiel.", "Surface des communes à majorité serbe : aucune source ouverte."]
