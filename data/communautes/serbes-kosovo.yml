resume: >-
  La Constitution du Kosovo de 2008 fait du serbe une langue officielle et réserve à la communauté serbe au moins dix sièges à l'Assemblée, au moins un ministre et deux vice-ministres. Les lois d'intérêt vital (communes, langues, éducation, patrimoine) exigent une double majorité, c'est-à-dire aussi la majorité des députés des communautés non majoritaires. La loi sur l'autonomie locale de 2008, issue de la proposition de règlement présentée au Conseil de sécurité en 2007, donne aux communes à majorité serbe des compétences renforcées en matière culturelle et religieuse et une participation au choix des commandants de poste de police ; trois d'entre elles gèrent la santé secondaire et Mitrovica-Nord l'enseignement supérieur. L'Association des communes à majorité serbe, prévue par le premier accord de normalisation entre le Kosovo et la Serbie de 2013, n'a pas été créée. Le Kosovo a déclaré son indépendance en 2008 ; la Serbie ne la reconnaît pas et la résolution 1244 (1999) du Conseil de sécurité reste en vigueur. Les autres communautés non majoritaires ont leur propre fiche (« Communautés non majoritaires du Kosovo »).
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "Association/Communauté des communes à majorité serbe convenue en 2013 dans le cadre du dialogue Belgrade-Pristina facilité par l'Union européenne (rapport du Secrétaire général S/2023/247, titre II et par. 6) ; premier accord sur les principes régissant la normalisation des relations, signé le 19 avril 2013 et ratifié par la loi n° 04/L-199 du 27 juin 2013 (arrêt KO130/15, par. 78 et 81).", annee: 2013, source: "https://undocs.org/S/2023/247"}
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur le Kosovo, adopté le 16 février 2023 (suivi propre, le Kosovo n'étant pas partie) : l'absence d'Association/Communauté des communes à majorité serbe reste un obstacle (par. 3) ; démissions coordonnées des Serbes du Kosovo en 2022 (par. 60 et 88) ; programme scolaire du Kosovo en serbe à développer (par. 12).", annee: 2023, source: "https://rm.coe.int/5th-op-kosovo-en/1680ab6a79"}
reconnaissance_onu:
  - {mecanisme: "mission_onu", detail: "Résolution 1244 du Conseil de sécurité créant la Mission d'administration intérimaire des Nations unies au Kosovo (MINUK) ; le rapport du Secrétaire général d'avril 2023 traite du retrait des Serbes du Kosovo des institutions et de l'Association/Communauté des communes à majorité serbe (par. 5 à 8 et 12).", annee: 2023, source: "https://undocs.org/S/2023/247"}
  - {mecanisme: "accord_sous_egide", detail: "Proposition globale de règlement portant statut du Kosovo, présentée par l'Envoyé spécial du Secrétaire général et transmise au Conseil de sécurité le 26 mars 2007 ; annexe III (décentralisation) : système d'autonomie locale établi « pour répondre aux préoccupations légitimes » de la communauté serbe du Kosovo et des autres communautés non majoritaires. Non approuvée par le Conseil ; la Constitution de 2008 lui donnait la primauté (art. 143, abrogé en 2012).", annee: 2007, source: "https://undocs.org/S/2007/168/Add.1"}
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, observations finales sur le Kosovo (Serbie) au vu du rapport de la MINUK : Serbes parmi les personnes disparues (par. 13), communautés minoritaires dans les micro-enclaves (par. 19), usage des langues officielles (par. 22).", annee: 2006, source: "https://undocs.org/CCPR/C/UNK/CO/1"}
base_nationale:
  - {instrument: "Constitution de la République du Kosovo (2008, modifiée), art. 5, 57 à 62, 64, 78, 81 et 96", nature: "constitution", annee: 2008, source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  - {instrument: "Loi n° 03/L-040 sur l'autonomie locale, art. 17 et 20 à 23, 30, 53 à 55", nature: "loi", annee: 2008, source: "https://mapl.rks-gov.net/wp-content/uploads/2017/10/Law-On-Local-Self-Government.pdf"}
  - {instrument: "Loi n° 04/L-199 portant ratification du premier accord international sur les principes régissant la normalisation des relations entre le Kosovo et la Serbie", nature: "traite", annee: 2013, source: "https://gjk-ks.org/wp-content/uploads/vendimet/gjk_ko_130_15_ang.pdf"}
  - {instrument: "Cour constitutionnelle, arrêt KO130/15 du 23 décembre 2015 sur les principes de l'Association/Communauté des communes à majorité serbe", nature: "jurisprudence", annee: 2015, source: "https://gjk-ks.org/wp-content/uploads/vendimet/gjk_ko_130_15_ang.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Pas d'institution propre de la communauté ; les communes à majorité serbe exercent des compétences renforcées : santé secondaire à Mitrovica-Nord, Gračanica et Štrpce (art. 20), enseignement supérieur à Mitrovica-Nord (art. 21), affaires culturelles et religieuses (art. 22), participation au choix des commandants de police (art. 23), loi n° 03/L-040 de 2008 ; l'Association/Communauté prévue en 2013 n'est pas créée.", source: "https://mapl.rks-gov.net/wp-content/uploads/2017/10/Law-On-Local-Self-Government.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les lois d'intérêt vital (limites et compétences des communes, droits des communautés, langues, élections locales, patrimoine culturel, liberté religieuse, éducation, symboles) exigent aussi la majorité des députés élus sur les sièges garantis aux communautés non majoritaires, Constitution, art. 81 ; toute révision constitutionnelle exige les deux tiers de ces députés, art. 65 ; Conseil consultatif des communautés auprès du président, art. 60.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  langue: {valeur: "reconnu", note: "L'albanais et le serbe sont les langues officielles de la République du Kosovo, Constitution, art. 5 ; droit d'user de sa langue et de son alphabet avec les autorités locales, art. 59.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  education: {valeur: "partiel", note: "Droit à l'enseignement public préscolaire, primaire et secondaire dans sa langue et à des établissements privés propres, Constitution, art. 59 ; les communes gèrent l'enseignement préuniversitaire (art. 17) et Mitrovica-Nord l'enseignement supérieur (art. 21), loi n° 03/L-040 ; les lois sur l'éducation sont des lois d'intérêt vital, art. 81.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  fiscalite: {valeur: "partiel", note: "Budget propre des communes (art. 24) ; les communes peuvent recevoir une aide financière et technique d'institutions de la République de Serbie dans leurs compétences, dans leurs compétences propres, après notification au ministère chargé de l'administration locale, loi n° 03/L-040, art. 30 (disposition ouverte à toutes les communes) ; aucun pouvoir fiscal propre à la communauté.", source: "https://mapl.rks-gov.net/wp-content/uploads/2017/10/Law-On-Local-Self-Government.pdf"}
  representation: {valeur: "reconnu", note: "Au moins dix sièges garantis à l'Assemblée pour les listes déclarées représenter la communauté serbe, Constitution, art. 64 ; au moins un ministre et deux vice-ministres serbes, art. 96 ; un tiers de la commission des droits des communautés, art. 78 ; vice-président de l'assemblée communale pour les communautés là où elles forment au moins 10 % des habitants, art. 62.", source: "https://www.constituteproject.org/constitution/Kosovo_2016"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "En novembre 2022, environ 3 500 Serbes du Kosovo ont démissionné des institutions (Assemblée, gouvernement, communes, police et justice du Nord) ; des élections anticipées ont été convoquées dans les quatre communes du Nord et les représentants serbes ont conditionné leur retour à la création de l'Association/Communauté (rapport du Secrétaire général, S/2023/247, par. 5 à 8). En 2015, la Cour constitutionnelle a jugé les principes de l'Association « pas entièrement conformes » à la Constitution (arrêt KO130/15) ; en 2023, le Comité consultatif du Conseil de l'Europe constate qu'elle n'est toujours pas créée.", source: "https://undocs.org/S/2023/247"}
