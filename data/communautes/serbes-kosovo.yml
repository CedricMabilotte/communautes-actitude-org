  - {annee: 2008, evenement: "Constitution du Kosovo ; loi n° 03/L-040 sur l'autonomie locale publiée le 4 juin."}
  - {annee: 2012, evenement: "Révision constitutionnelle (Journal officiel du 7 septembre) : fin des dispositions transitoires liées au règlement de 2007."}
  - {annee: 2013, evenement: "Premier accord de normalisation signé le 19 avril ; ratifié par la loi n° 04/L-199 le 27 juin, promulguée le 12 septembre."}
  - {annee: 2015, evenement: "Arrêt KO130/15 de la Cour constitutionnelle (23 décembre) sur les principes de l'Association/Communauté."}
  - {annee: 2022, evenement: "Retrait d'environ 3 500 Serbes des institutions du Kosovo (novembre)."}
  - {annee: 2024, evenement: "Recensement : 53 021 Serbes dans le tableau avec estimation."}
