resume: >-
  Fiche agrégée. La Constitution du Paraguay de 1992 (art. 62 à 67) reconnaît les peuples autochtones comme antérieurs à l'État, leur droit d'appliquer leurs propres systèmes d'organisation et leurs normes coutumières, et la propriété communautaire de leurs terres, fournies gratuitement par l'État. La loi 904 de 1981 (statut des communautés autochtones) donne la personnalité juridique aux communautés, fait de leurs leaders leurs représentants légaux et organise l'attribution de titres indivis. Le recensement de 2022 compte 19 peuples, 557 communautés et 234 hameaux ou quartiers. La Cour interaméricaine des droits de l'homme a condamné l'État dans trois affaires de restitution de terres du Chaco (Yakye Axa, Sawhoyamaxa, Xákmok Kásek).
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Comunidad Indígena Yakye Axa c. Paraguay du 17 juin 2005 (série C n° 125) : violation du droit de propriété (art. 21 de la Convention américaine) sur les terres ancestrales de la communauté, ainsi que des art. 4.1, 8 et 25.", annee: 2005, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_125_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Comunidad Indígena Sawhoyamaxa c. Paraguay du 29 mars 2006 (série C n° 146) : violation des art. 3, 4.1, 8, 21 et 25 de la Convention américaine ; l'État doit remettre aux membres de la communauté leurs terres traditionnelles dans un délai de trois ans.", annee: 2006, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_146_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Comunidad Indígena Xákmok Kásek c. Paraguay du 24 août 2010 (série C n° 214) : violation notamment des art. 3, 4 et 21 de la Convention américaine pour une revendication de 10 700 hectares.", annee: 2010, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_214_esp.pdf"}
