  - {mecanisme: "oit_169", detail: "Le Paraguay ratifie la Convention 169 de l'OIT le 10 août 1993 ; entrée en vigueur pour le pays le 10 août 1994.", annee: 1993, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Paraguay vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale Victoria Tauli-Corpuz sur la situation des peuples autochtones au Paraguay (A/HRC/30/41/Add.1).", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=A/HRC/30/41/Add.1&l=es&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République du Paraguay (1992), chapitre V, art. 62 à 67 ; art. 77 et 140", nature: "constitution", annee: 1992, source: "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"}
  - {instrument: "Loi 904/81, statut des communautés autochtones (adoptée le 10 décembre, promulguée le 18 décembre 1981)", nature: "loi", annee: 1981, source: "https://faolex.fao.org/docs/pdf/par46743.pdf"}
  - {instrument: "Arrêts de la Cour interaméricaine des droits de l'homme Yakye Axa (2005), Sawhoyamaxa (2006) et Xákmok Kásek (2010)", nature: "jurisprudence", annee: 2005, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_125_esp.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les peuples autochtones ont le droit d'appliquer librement leurs systèmes d'organisation politique, sociale et économique (Constitution, art. 63) ; les leaders exercent la représentation légale de la communauté et leur nomination est reconnue et inscrite par l'Institut paraguayen de l'autochtone, INDI (loi 904/81, art. 12).", source: "https://faolex.fao.org/docs/pdf/par46743.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les communautés peuvent appliquer leurs normes coutumières pour régler leur vie interne, si elles ne portent pas atteinte aux droits fondamentaux (Constitution, art. 63) ni à l'ordre public (loi 904/81, art. 5).", source: "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"}
  justice_propre: {valeur: "partiel", note: "Le code de procédure pénale (loi 1286 de 1998, art. 26) éteint l'action pénale pour les infractions qui touchent les biens d'une communauté autochtone ou de ses membres quand l'auteur et la victime acceptent la façon dont la communauté a réglé le conflit selon son droit coutumier ; le juge de paix déclare l'extinction. Le droit coutumier est aussi pris en compte dans les conflits de juridiction (Constitution, art. 63) et dans les procès qui concernent des autochtones (loi 904/81, art. 6).", source: "https://www.pensamientopenal.com.ar/system/files/2014/12/legislacion28735.pdf"}
  terres: {valeur: "reconnu", note: "Propriété communautaire de la terre fournie gratuitement par l'État, insaisissable, indivisible, incessible, imprescriptible et exempte d'impôt ; déplacement interdit sans consentement exprès (Constitution, art. 64) ; titres gratuits et indivis au nom de la communauté (loi 904/81, art. 17 et 20).", source: "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le consentement exprès de la communauté est requis pour la déplacer hors de son habitat (Constitution, art. 64) ; la loi 904/81 (art. 14) fait exception pour raisons de sécurité nationale. Aucune règle générale de consentement préalable n'a été vérifiée dans un texte ouvert.", source: "https://faolex.fao.org/docs/pdf/par46743.pdf"}
  langue: {valeur: "partiel", note: "Le castillan et le guarani sont langues officielles ; les langues autochtones font partie du patrimoine culturel de la Nation, sans statut officiel propre (Constitution, art. 140).", source: "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"}
  education: {valeur: "partiel", note: "L'État respecte les particularités culturelles des peuples autochtones dans l'éducation formelle (Constitution, art. 66) ; l'enseignement initial se fait dans la langue maternelle officielle de l'élève (art. 77).", source: "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Les membres des peuples autochtones sont exemptés des services sociaux, civils ou militaires et des charges publiques fixées par la loi (Constitution, art. 67).", source: "https://www.constituteproject.org/constitution/Paraguay_2011?lang=es"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2015, la Rapporteuse spéciale de l'ONU constate que le cadre constitutionnel ne s'est pas traduit en mesures effectives et relève un manquement généralisé au devoir de consulter. Selon le recensement de l'INE de 2022, 90 des 557 communautés recensées n'ont pas de terre propre et 61 des 467 qui en ont une n'ont pas de titre.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/30/41/Add.1&l=es&t=pdf"}
