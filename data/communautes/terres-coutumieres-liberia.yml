resume: >-
  Fiche agrégée : elle couvre l'ensemble des communautés rurales titulaires de terres coutumières au sens de la loi sur les droits fonciers de 2018 (Land Rights Act), approuvée le 19 septembre 2018. La loi range la terre coutumière parmi les quatre catégories de propriété foncière, à côté des terres privées, de l'État et publiques : elle appartient à la communauté, comme propriété commune (art. 33, al. 1), sans titre préalable, du seul fait d'une occupation de longue durée (art. 32). La communauté délimite sa terre, désigne ses membres, adopte des statuts et élit un comité communautaire de développement et de gestion foncière (CLDMC) ; elle acquiert ainsi la personnalité juridique (art. 34 et 35). La Liberia Land Authority, l'agence foncière nationale, confirme les limites par un levé et délivre un titre statutaire (Statutory Deed) à la communauté (art. 37, al. 2) ; aucun total national des titres délivrés n'est publié.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, observations finales sur le rapport initial du Liberia (CCPR/C/LBR/CO/1), § 46-47 « Customary land » : le Comité demande l'adoption du projet de loi sur les droits fonciers et des consultations des communautés locales occupant des terres coutumières en vue d'obtenir leur consentement libre, préalable et éclairé avant toute concession.", annee: 2018, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/LBR/CO/1&l=en&t=pdf"}
base_nationale:
  - {instrument: "Loi sur les droits fonciers de 2018 (An Act to Establish the Land Rights Law of 2018), approuvée le 19 septembre 2018, publiée le 10 octobre 2018 ; partie III, art. 32 à 51 (terres coutumières)", nature: "loi", annee: 2018, source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  - {instrument: "Règlement d'application de la loi sur les droits fonciers (Liberia Land Rights Act Regulations 2022), pris par la Liberia Land Authority en vertu de l'art. 71 de la loi, Journal officiel (Liberia Official Gazette) vol. XXII n° 57 du 15 novembre 2022", nature: "loi", annee: 2022, source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=202:lra-regulations-2022"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'autorité sur la terre coutumière appartient aux membres de la communauté agissant collectivement, qui forment l'organe de décision le plus élevé (art. 36, al. 1 et 2) ; ils élisent un comité communautaire de développement et de gestion foncière (CLDMC), composé à parts égales d'hommes, de femmes et de jeunes, les chefs en étant membres de droit (art. 35, al. 1 ; art. 36, al. 6) ; la communauté ainsi organisée a la personnalité juridique (art. 35, al. 2) ; la compétence se limite à la terre et à ses usages.", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  pouvoir_normatif: {valeur: "partiel", note: "Les membres de la communauté rédigent des statuts (by-laws) et un plan d'usage des terres (art. 35, al. 1, a et e) ; toute décision sur la terre coutumière suit les coutumes, traditions et pratiques de la communauté (art. 36, al. 8) ; toute restriction aux droits fonciers d'un membre doit suivre la coutume de la communauté et respecter la loi de 2018 et la Constitution (art. 34, al. 4).", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  justice_propre: {valeur: "partiel", note: "Chaque CLDMC crée un sous-comité de règlement des différends compétent pour tout litige portant sur la terre communautaire (règlement de 2022, sect. 21) ; il applique le droit coutumier de la communauté, dans le respect de la Constitution et des droits humains (sect. 27) ; ses décisions sont susceptibles d'appel devant l'agent de règlement des différends fonciers du comté (County Land Dispute Resolution Officer), puis devant le comité de règlement des différends de la Liberia Land Authority, puis de contrôle juridictionnel (judicial review) par le tribunal de circuit du comté (sect. 28 à 39 ; loi de 2018, art. 37, al. 9).", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=202:lra-regulations-2022"}
  terres: {valeur: "reconnu", note: "La propriété de la terre coutumière par une communauté est une propriété commune (art. 33, al. 1), opposable dès l'entrée en vigueur de la loi, même sans levé de confirmation (art. 32, al. 2 ; art. 37, al. 4) ; elle comprend le droit d'exclure les tiers, de posséder, d'utiliser et de gérer la terre (art. 33, al. 2) ; la terre coutumière ne peut être vendue ni aliénée définitivement à un particulier pendant cinquante ans après l'entrée en vigueur de la loi, sauf les parcelles d'habitation (art. 49, al. 3) ; la prescription acquisitive ne s'applique pas (art. 50, al. 1).", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  ressources: {valeur: "partiel", note: "La propriété comprend l'usage des ressources non minières, les cultures et la récolte des produits forestiers (art. 33, al. 2), et l'exploitation du bois des terres forestières communautaires selon la loi sur les droits communautaires de 2009 (art. 43) ; l'État garde le droit constitutionnel d'extraire les ressources minérales du sous-sol (art. 33, al. 3) ; les concessions accordées avant 2018 restent en vigueur jusqu'à leur terme (art. 48, al. 1).", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  consentement: {valeur: "partiel", note: "Toute ingérence dans la surface de la terre coutumière ou tout usage de celle-ci exige le consentement libre, préalable et éclairé (FPIC) de la communauté, sauf les concessions et permis accordés avant l'entrée en vigueur de la loi et le droit de l'État sur les ressources minérales (art. 33, al. 3) ; la vente, la location à des non-membres et les baux de plus de cinquante acres exigent un vote des deux tiers des membres (art. 36, al. 2) ; l'exception couvre toutes les concessions antérieures à 2018 et toute extraction minière, et le Comité des droits de l'homme relevait en 2018 des concessions conclues sur des terres coutumières sans consultation préalable.", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "Le loyer et les « avantages équitables » (equitable benefits) qu'un bail sur une terre coutumière doit prévoir pour la communauté (art. 49, al. 5) et la participation gratuite d'au moins 5 % que les communautés détiennent dans les concessions accordées après 2018 (art. 48, al. 3) sont des revenus que la communauté tire de sa terre ; la loi ne confère ni pouvoir fiscal, ni budget ou fonds propre.", source: "https://www.lla.gov.lr/index.php/downloadable-resources/policies-laws-regulations-repository?download=79:land-rights-act"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Liberia Land Authority a remis des titres statutaires à huit communautés en juillet 2023 et à 23 communautés en septembre 2025, et indique en avril 2026 que 35 communautés ont obtenu leur titre avec l'appui du PNUD ; une note d'avril 2026 de la coalition foncière nationale (MAP Liberia Land Platform) et du groupe de travail des organisations de la société civile indique que des milliers de communautés restent hors du processus de formalisation et que des acteurs cherchent à affaiblir la loi.", source: "https://drive.google.com/file/d/1Tc3v9qqDUEm6ALexqraUqcgEIJMWctHl/view"}
chronologie:
  - {annee: 2018, evenement: "En juillet, le Comité des droits de l'homme de l'ONU demande l'adoption du projet de loi sur les droits fonciers. Le 19 septembre, la loi sur les droits fonciers est approuvée ; elle est publiée le 10 octobre."}
  - {annee: 2022, evenement: "Le 15 novembre, la Liberia Land Authority publie au Journal officiel le règlement d'application de la loi."}
  - {annee: 2023, evenement: "En janvier, trois communautés du comté de Bong (Panta, Wrunah, Gahn) reçoivent un certificat d'autoidentification, première étape vers le titre. En juillet, huit communautés des comtés de Nimba, Sinoe, Maryland et Grand Cape Mount reçoivent un titre statutaire, avec l'appui du Fonds des Nations unies pour la consolidation de la paix."}
  - {annee: 2024, evenement: "En avril, la communauté de Fesibu (comté de Lofa) reçoit son titre statutaire. En juin, la Liberia Land Authority engage la formalisation dans 60 communautés de cinq comtés."}
  - {annee: 2025, evenement: "En septembre, à Ganta, des titres sont remis à 23 communautés des comtés de Nimba, Grand Cape Mount et Bomi."}
  - {annee: 2026, evenement: "La Liberia Land Authority indique que 35 communautés ont obtenu un titre avec l'appui du PNUD ; une note de la société civile demande la mise en œuvre complète de la loi."}
fiabilite:
  verifie: ["Texte officiel de la loi de 2018 (dépôt de la Liberia Land Authority) : art. 32 (identification de la terre coutumière, occupation d'au moins cinquante ans), art. 33 al. 1 à 3 (propriété commune, droits inclus, consentement libre, préalable et éclairé), art. 34 (délimitation et définition des membres), art. 35 et 36 (statuts, CLDMC, personnalité juridique, vote des deux tiers), art. 37 (levé de confirmation et titre statutaire), art. 43, 48, 49 al. 3 à 6 et 50.", "Règlement de 2022 publié au Journal officiel du 15 novembre 2022 : sous-comité de règlement des différends du CLDMC (sect. 21 et 22), application du droit coutumier (sect. 27).", "Communiqués de la Liberia Land Authority : huit titres statutaires (7 juillet 2023), certificats d'autoidentification de Panta, Wrunah et Gahn (30 janvier 2023), titre de Fesibu (avril 2024), 60 communautés engagées dans cinq comtés (10 juin 2024), 23 titres (26 septembre 2025), 35 communautés titrées avec l'appui du PNUD (21 avril 2026).", "Observations finales du Comité des droits de l'homme CCPR/C/LBR/CO/1 du 27 août 2018, § 46 et 47."]
  non_confirme: ["Le nombre total de communautés titulaires d'un titre statutaire, de communautés ayant achevé l'autoidentification et la surface des terres coutumières titrées ne sont publiés par aucune source officielle ouverte.", "La part du territoire national couverte par les terres coutumières et la population concernée ne sont pas chiffrées par une source officielle ouverte.", "Aucune liste officielle complète des communautés titrées n'a été trouvée ; aucun tableau des sites n'est donc publié.", "Aucun document de la CDB ni inscription au registre ICCA ou à la base WDPA visant ce régime n'a été trouvé.", "Nombre de villages : non trouvé ; les rapports du recensement de 2022 ne sont pas publiés sur le site du LISGIS consulté."]
