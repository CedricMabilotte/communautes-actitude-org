resume: >-
  La Constitution de la Ville de Mexico (2017) reconnaît les pueblos et barrios originaires, descendants des populations établies sur le territoire de la ville avant la colonisation, comme sujets collectifs de droit public dotés de la libre détermination (droit de décider de leur condition politique), exercée sous forme d'autonomie (art. 58 et 59). Leurs autorités sont élues selon leurs systèmes normatifs (règles propres de la communauté) et reconnues par la Ville. La loi des droits des pueblos et barrios originaires et des communautés autochtones résidentes, publiée le 20 décembre 2019, précise ces droits et confie au Secrétariat des pueblos et barrios originaires (SEPI) un système de registre. L'avis du 11 mai 2023 inscrit 50 pueblos à ce registre ; les listes administratives antérieures en comptaient 145 (2011) et 139 (2017).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Mexique ratifie la Convention 169 de l'OIT le 5 septembre 1990 ; la loi de la Ville de Mexico de 2019 (art. 2) vise les traités ratifiés par l'État comme cadre des droits qu'elle garantit.", annee: 1990, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Mexique vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295) ; la Constitution de la Ville de Mexico (art. 57) et la loi de 2019 (art. 2) la déclarent d'observance obligatoire dans la Ville.", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Constitution politique de la Ville de Mexico, art. 58 et 59 (publiée le 5 février 2017, texte à jour au 23 juillet 2026)", nature: "constitution", annee: 2017, source: "https://data.consejeria.cdmx.gob.mx/images/leyes/estatutos/CONSTITUCION_POLITICA_DE_LA_CDMX_14.6.pdf"}
  - {instrument: "Loi des droits des pueblos et barrios originaires et des communautés autochtones résidentes de la Ville de Mexico (Gaceta Oficial du 20 décembre 2019, dernière réforme du 22 décembre 2022)", nature: "loi", annee: 2019, source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution (art. 59 B.7 et C.4) prévoit que les autorités traditionnelles sont élues selon les systèmes normatifs propres et reconnues par les autorités de la Ville ; la loi de 2019 (art. 14 et 15) fixe un mandat de trois ans au plus et précise que ces charges sont honorifiques, hors des structures administratives et sans rémunération publique.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 59 B.2 et J.1) reconnaît des compétences politiques, administratives et judiciaires pour le régime interne et le droit d'appliquer les systèmes normatifs à la régulation des territoires ; la loi de 2019 (art. 17) limite cette autonomie aux affaires internes, dans l'ordre constitutionnel.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/estatutos/CONSTITUCION_POLITICA_DE_LA_CDMX_14.6.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution (art. 59 B.8.III et I.3) reconnaît l'administration de la justice interne par les institutions et systèmes normatifs propres ; la loi de 2019 (art. 19.III et 54) la ramène à la médiation et à la conciliation des conflits internes, à la demande expresse des parties.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  terres: {valeur: "partiel", note: "La Constitution (art. 59 J.1) protège la propriété et la possession des territoires reconnus par résolution présidentielle (biens communaux et dotations d'ejido, terres attribuées par la réforme agraire) et (art. 59 B.5) respecte aussi la propriété privée et publique ; la loi de 2019 (art. 48) reprend le droit de posséder et gérer les terres dans le cadre constitutionnel du droit de propriété et (art. 49) charge le gouvernement de la Ville de protéger ces territoires face aux projets urbains.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/estatutos/CONSTITUCION_POLITICA_DE_LA_CDMX_14.6.pdf"}
  ressources: {valeur: "partiel", note: "La Constitution (art. 59 B.8.VI et J.7) attribue la conception et la gestion des programmes relatifs aux forêts, lacs, nappes et rivières du territoire et une contrepartie annuelle pour les services environnementaux ; la loi de 2019 (art. 19.VI et 51) en fait une participation avec les services de la Ville.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 59 C.1) impose la consultation par l'exécutif, le Congrès et les alcaldías en vue du consentement libre, préalable et éclairé, sous peine de nullité de la mesure ; la loi de 2019 rend les accords issus de la consultation contraignants (art. 25.1), mais permet à l'autorité de poursuivre la mesure sans accord sur motifs fondés (art. 25.3 k) et exclut de la consultation les mesures fiscales, budgétaires, pénales et de sécurité (art. 26.3).", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  langue: {valeur: "partiel", note: "La loi de 2019 (art. 34) déclare les langues autochtones nationales parlées dans la Ville valables au même titre que l'espagnol pour toute démarche publique ; la Constitution (art. 59 L.6) charge les autorités d'établir leur statut officiel.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  education: {valeur: "partiel", note: "La Constitution (art. 59 G.1 et G.3) et la loi de 2019 (art. 35) prévoient que les pueblos se coordonnent avec les autorités pour établir des institutions d'enseignement dans leurs langues et un sous-système d'éducation communautaire.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/estatutos/CONSTITUCION_POLITICA_DE_LA_CDMX_14.6.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution (art. 59 B.4 et L.1) oblige les autorités à inscrire des crédits budgétaires spécifiques pour ces droits ; la loi de 2019 (art. 62) les rattache au projet de budget annuel de la Ville, sans pouvoir fiscal propre des pueblos.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  representation: {valeur: "partiel", note: "La Constitution (art. 59 C.3) prévoit un accès proportionnel aux charges électives ; la loi de 2019 (art. 24) le met en œuvre par des actions affirmatives (mesures de rattrapage) dans les listes de candidats des partis, sans sièges réservés.", source: "https://data.consejeria.cdmx.gob.mx/images/leyes/leyes/LEY_DERECHOS_DE_PUEBLOS_Y_BARRIOS_ORIGINARIOS_Y_COMUNIDADES_INDIGENAS_RESIDENTES_EN_LA_CDMX_2.4.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude publiée en 2024 relève que le registre ouvert par la SEPI en mai 2022 écarte les listes antérieures : l'avis du 11 mai 2023 inscrit 50 pueblos, tous situés au sud de la ville, contre 145 en 2011 ; un front de pueblos saisit le tribunal électoral de la Ville en juin 2022 (TECDMX-JLDC-057/2022) pour faire annuler le registre, adopté sans consultation ; l'étude cite des projets d'infrastructure réalisés sans consultation des pueblos concernés (ligne 3 du Metrobús vers Santa Cruz Atoyac, échangeur de Cuemanco à Xochimilco).", source: "https://argumentos.xoc.uam.mx/index.php/argumentos/article/view/1546"}
chronologie:
  - {annee: 2007, evenement: "Création du Conseil des pueblos et barrios originaires du District fédéral (Gaceta Oficial du 21 mars 2007)."}
  - {annee: 2011, evenement: "Première liste administrative de 145 pueblos originaires, dans le cadre d'un programme d'appui (Gaceta Oficial du 13 octobre 2011)."}
  - {annee: 2017, evenement: "Publication de la Constitution de la Ville de Mexico le 5 février (art. 58 et 59) ; une nouvelle liste administrative compte 139 pueblos (Gaceta Oficial du 17 avril 2017)."}
  - {annee: 2019, evenement: "Publication le 20 décembre de la loi des droits des pueblos et barrios originaires et des communautés autochtones résidentes."}
  - {annee: 2022, evenement: "Appel à inscription au système de registre de la SEPI (Gaceta Oficial du 30 mai) ; recours d'un front de pueblos devant le tribunal électoral de la Ville (3 juin) ; réforme de la loi le 22 décembre."}
  - {annee: 2023, evenement: "Avis du 11 mai : inscription de 50 pueblos originaires au système de registre."}
