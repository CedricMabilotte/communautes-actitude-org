  verifie: ["Texte des art. 57, 58 et 59 de la Constitution de la Ville de Mexico (version à jour au 23 juillet 2026, site de la Consejería jurídica).", "Texte de la loi de 2019 (publication du 20 décembre 2019, dernière réforme du 22 décembre 2022) : art. 2, 6, 9, 14, 15, 17, 19, 24, 25, 26, 34, 35, 48, 49, 51, 54 et 62.", "Création du système de registre et appel à inscription du 30 mai 2022 annoncés par la SEPI (communiqué du 16 juin 2022)."]
