  ressources: {valeur: "partiel", note: "Par exception à l'interdiction générale de pêcher (loi n° 2000-024, art. 10), les populations résidentes conservent la pêche de subsistance, dont la pêche à pied dite « pêche Imraguen » et la pêche à la lanche à voile, ainsi que des droits de culture, de cueillette et de ramassage du bois mort pour leurs besoins domestiques (art. 11) ; l'usage des embarcations motorisées est interdit sauf pour le transport, la surveillance et la recherche (art. 17) ; le nombre de lanches ne peut dépasser le nombre autorisé, les autorisations sont délivrées par le ministre chargé des pêches et la direction du parc peut prendre des mesures conservatoires sur ces droits d'usage (décret n° 2006-068, art. 8, 14 et 15).", source: "https://faolex.fao.org/docs/pdf/mau20609.pdf"}
  consentement: {valeur: "partiel", note: "Les plans d'aménagement et de gestion sont élaborés et mis en œuvre selon une approche participative qui inclut les communautés locales, et le conseil d'administration est chargé de créer un cadre de concertation (décret n° 2006-068, art. 2 et 3) ; il n'y a pas d'obligation de consentement : le conseil d'administration adopte les plans après avis du conseil scientifique (art. 4).", source: "https://faolex.fao.org/docs/pdf/mau170207.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "L'organe délibérant du parc, établissement public de l'État, comprend des représentants des populations résidant à l'intérieur du parc (loi n° 2000-024, art. 6) ; le décret n° 2006-058 (art. 5), abrogé en 2015, leur attribuait un siège, « un représentant des Communautés vivants à l'Intérieur du Parc », dans un conseil de quatorze membres et un président, dont dix membres représentaient des ministères et des instituts publics ; la composition fixée par le décret n° 2015-054 qui l'a remplacé n'a pas été consultée. Ce siège se trouve dans l'organe délibérant du parc, non dans un organe de l'État dont la compétence dépasse le parc ; aucun siège réservé de ce type n'a été trouvé.", source: "https://faolex.fao.org/docs/pdf/mau20609.pdf"}
