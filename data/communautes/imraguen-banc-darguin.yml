reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Quatrième rapport national de la Mauritanie à la Convention sur la diversité biologique, section 2.2.6 « Connaissances traditionnelles » : cite « le cas des Imraguens installés à l'intérieur des limites du PNBA et qui bénéficient des droits de pêche exclusifs » ; le sixième rapport national (février 2018) cite, au titre de l'objectif 18 (connaissances traditionnelles), les connaissances et pratiques traditionnelles des communautés imraguen et le « respect des pratiques de pêcheur Imraguine ».", annee: 2009, source: "https://www.cbd.int/doc/world/mr/mr-nr-04-fr.pdf"}
