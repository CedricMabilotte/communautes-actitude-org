resume: >-
  Les Imraguen sont des pêcheurs établis dans neuf villages du littoral du Parc national du Banc d'Arguin, créé en 1976. La loi n° 2000-024 du 19 janvier 2000 interdit la pêche dans le parc, sauf exceptions : les populations résidentes conservent la pêche de subsistance, dont la pêche à pied dite « pêche Imraguen » et la pêche à la lanche à voile (embarcation de pêche à voile latine) ; d'autres activités de pêche peuvent être autorisées par le parc, à la lanche à voile seulement. Les embarcations motorisées sont interdites pour la pêche dans le parc, et le nombre de lanches est plafonné. Le plan d'aménagement et de gestion 2025-2029 présente les communautés imraguen comme les seules autorisées à y pratiquer la pêche artisanale. La loi prévoit des représentants des populations résidentes dans le conseil d'administration du parc, établissement public sous tutelle de l'État.
