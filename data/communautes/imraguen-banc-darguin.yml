effectivite: {valeur: "partielle", note: "S. Boulay (CEPED, 2011) relève que les habitants du parc « semblent de fait exclus des instances décisionnelles » : un seul représentant des communautés résidentes sur quatorze sièges du conseil d'administration, autant que la Fondation internationale du Banc d'Arguin. Le plan d'aménagement et de gestion 2025-2029 du parc constate que la cogestion s'est érodée depuis plus de dix ans : règles de pêche non mises à jour, recul des investissements dans le développement communautaire, retour de pratiques interdites comme la pêche d'espèces menacées ; un recensement de juin 2023 compte 116 lanches, dont 93 plastifiées, alors que seules les lanches traditionnelles à voile sont autorisées à pêcher.", source: "https://hal.science/hal-01327593/document"}
chronologie:
  - {annee: 1976, evenement: "Décret n° 76-147 du 24 juin 1976 : création du Parc national du Banc d'Arguin."}
  - {annee: 1982, evenement: "Inscription du site sur la liste des zones humides d'importance internationale de la convention de Ramsar."}
  - {annee: 1989, evenement: "Inscription du parc sur la liste du patrimoine mondial de l'UNESCO."}
  - {annee: 2000, evenement: "Loi n° 2000-024 du 19 janvier 2000 : droits d'usage des populations résidentes, dont la « pêche Imraguen », et représentation de ces populations dans l'organe délibérant du parc."}
  - {annee: 2006, evenement: "Décret n° 2006-058 du 14 juin 2006 (organisation du parc, un siège pour les communautés résidentes) et décret n° 2006-068 (application de la loi : approche participative, plafonnement et registre des lanches à voile)."}
  - {annee: 2009, evenement: "Quatrième rapport national à la Convention sur la diversité biologique : les Imraguen y sont cités comme titulaires de droits de pêche exclusifs dans le parc."}
  - {annee: 2015, evenement: "Décret n° 2015-054 du 26 février 2015 : nouvelles règles d'organisation et de fonctionnement du parc, en remplacement du décret n° 2006-058."}
  - {annee: 2025, evenement: "Plan d'aménagement et de gestion 2025-2029 : neuf villages côtiers, 1025 habitants, constat d'érosion de la cogestion et objectif de redynamiser le système de cogestion avec les populations résidentes."}
fiabilite:
  verifie:
    - "Texte de la loi n° 2000-024 (FAOLEX) : art. 6 (représentants des populations résidentes dans l'organe délibérant), art. 7 (projets de développement communautaire, nombre de lanches), art. 10 (interdiction de pêcher), art. 11 (pêche de subsistance, « pêche Imraguen », lanches à voile), art. 12 (autres activités de pêche limitées aux lanches à voile), art. 17 (interdiction des embarcations motorisées sauf transport, surveillance et recherche)."
    - "Texte du décret n° 2006-068 (FAOLEX) : art. 2 et 3 (approche participative, cadre de concertation), art. 8 (mesures conservatoires sur les droits d'usage), art. 10 (activités touristiques au profit des communautés locales), art. 13 à 16 (définition, plafonnement, autorisation et registre des lanches)."
    - "Texte du décret n° 2006-058 (FAOLEX, J.O. n° 1127 du 30 septembre 2006) : art. 5, composition du conseil d'administration avec un représentant des communautés vivant à l'intérieur du parc."
    - "Plan d'aménagement et de gestion 2025-2029 publié par le PNBA : neuf villages côtiers nommés, 1025 habitants, 12 000 km² dont 5400 km² marins, comité local de concertation et de cogestion composé de représentants des neuf villages, des corps de métiers, du PNBA et du ministère des Pêches, recensement de 116 lanches en juin 2023."
    - "Mention des Imraguen dans les quatrième (2009) et sixième (2018) rapports nationaux de la Mauritanie à la Convention sur la diversité biologique."
    - "Boulay S., 2011 (HAL) : une étude de 2009 compte 1207 personnes (241 ménages) sur le littoral entre Mamghar et Agadir ; un seul représentant des communautés résidentes sur quatorze sièges (décret n° 2006-058, art. 5), autant que la FIBA."
    - "Plan d'aménagement et de gestion 2025-2029 : le décret n° 2006-058 a été abrogé et remplacé par le décret n° 2015-054 du 26 février 2015."
  non_confirme:
    - "Aucun texte trouvé ne définit les critères de la qualité de « population résidente » qui ouvre les droits d'usage de l'article 11 de la loi n° 2000-024, ni l'autorité qui la reconnaît : le droit « statut personnel » reste non établi."
    - "La composition du conseil d'administration fixée par le décret n° 2015-054, qui a remplacé le décret n° 2006-058, n'a pas été consultée : le nombre de sièges des communautés résidentes depuis 2015 n'est pas vérifié."
    - "Le chiffre de 1025 habitants n'est pas daté dans le plan ; le recensement de l'ANSADE de 2023 qu'il reproduit ne couvre que cinq des neuf villages (Mamghar 690, Akweijatt 57, Teichett 174, Iwik 183, Rgueiba 165) ; une étude de 2009 citée par S. Boulay comptait 1207 personnes (241 ménages) sur le littoral entre Mamghar et Agadir ; la valeur d'environ 500 personnes dans sept villages, donnée par Wikipédia en anglais sans source, n'est pas retenue."
    - "Le plafond de 114 lanches cité par le plan d'aménagement et de gestion n'a pas été rattaché à un arrêté consulté ; le comité local de concertation et de cogestion n'a pas de texte constitutif trouvé."
    - "Tous les habitants des villages du parc ne se rattachent pas au groupe imraguen ; le texte de loi vise les « populations résidentes » et ne nomme les Imraguen qu'à travers la « pêche Imraguen »."
