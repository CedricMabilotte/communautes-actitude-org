resume: >-
  Archipel de l'Atlantique Nord, les Açores forment une Région autonome de la République portugaise en vertu des articles 6 et 225 à 234 de la Constitution de 1976. Le Statut politico-administratif (loi 39/80, révisée en 1987, 1998 et 2009) lui donne la personnalité juridique de droit public (statut de personne publique distincte de l'État) et institue une Assemblée législative élue, siégeant à Horta, et un Gouvernement régional. La Constitution fonde ce régime sur les « historiques aspirations autonomistes des populations insulaires » et précise qu'il n'affecte pas l'intégrité de la souveraineté de l'État. L'Union européenne reconnaît les Açores comme région ultrapériphérique (région de l'Union où les traités s'appliquent avec des adaptations).
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "L'article 349 du Traité sur le fonctionnement de l'Union européenne nomme les Açores parmi les régions ultrapériphériques et permet au Conseil d'adopter des mesures spécifiques, notamment en matière douanière, commerciale et fiscale.", annee: 2009, source: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:12016E349"}
reconnaissance_onu: []
base_nationale:
  - {instrument: "Constitution de la République portugaise, art. 6, 142 et 225 à 234", nature: "constitution", annee: 1976, source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
  - {instrument: "Statut politico-administratif de la Région autonome des Açores (loi 39/80 du 5 août, modifiée par les lois 9/87, 61/98 et 2/2009)", nature: "statut_autonomie", annee: 2009, source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'Assemblée législative et le Gouvernement régional sont les organes de gouvernement propre de la Région, Constitution, art. 231, et Statut, art. 5 ; l'Assemblée est élue au suffrage universel direct à la représentation proportionnelle, chaque île formant une circonscription, Statut, art. 26 et 27.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée législative légifère pour le territoire régional dans les matières de compétence propre non réservées aux organes de souveraineté, Constitution, art. 227.1 a, et Statut, art. 37 ; le Représentant de la République signe les décrets législatifs régionaux ou y oppose son veto, Constitution, art. 233.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les biens historiquement compris dans le domaine public ou privé de l'État dans l'archipel, hors domaines militaire, maritime et aérien et biens affectés à des services de l'État non régionalisés, appartiennent au domaine public ou privé de la Région, Statut, art. 22 à 24 ; l'Assemblée légifère sur la réserve agricole régionale, les pâturages et les baldios (terres communes), art. 52.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
  ressources: {valeur: "partiel", note: "Cours d'eau, gisements minéraux, ressources hydrominérales et géothermiques relèvent du domaine public régional, Statut, art. 22 ; la Région délivre les licences de pêche, d'extraction d'agrégats et d'énergies renouvelables en mer et légifère sur la pêche et les ressources marines, art. 53 ; elle exerce « conjointement avec l'État » les pouvoirs de gestion sur les eaux intérieures et la mer territoriale, art. 8, ce partage avec l'État limitant la valeur à « partiel ».", source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
  consentement: {valeur: "partiel", note: "Les organes de souveraineté entendent toujours les organes de gouvernement régional sur les questions de leur compétence qui concernent la Région, Constitution, art. 229.2 ; toute loi ou décret-loi applicable aux Açores est précédé de l'audition de l'Assemblée législative sur les questions qui concernent la Région, Statut, art. 116 ; le projet de statut est élaboré par l'Assemblée régionale, Constitution, art. 226 ; il s'agit d'une audition obligatoire, sans accord requis de la Région pour modifier son statut.", source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "L'Assemblée législative légifère sur le système éducatif régional, son organisation, la gestion des établissements, l'évaluation et les plans d'études, Statut, art. 62.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
  fiscalite: {valeur: "reconnu", note: "La Région dispose pour ses dépenses « des recettes fiscales perçues ou générées » sur son territoire, Statut, art. 19, et Constitution, art. 227.1 j ; elle exerce un pouvoir fiscal propre dans les termes de la loi et peut adapter le système fiscal national aux spécificités régionales, Statut, art. 20 ; le statut lui attribuant la totalité des impôts perçus sur son territoire, la valeur est « reconnu ».", source: "https://www.cne.pt/sites/default/files/dl/legis_eparaa_2012.pdf"}
  representation: {valeur: "partiel", note: "Le président du Gouvernement régional siège au Conseil d'État, organe consultatif du président de la République, Constitution, art. 142 e.", source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Tribunal constitutionnel, saisi par le Provedor de Justiça (médiateur de la République), a contrôlé le Statut révisé en 2009 et en a déclaré plusieurs dispositions inconstitutionnelles avec force obligatoire générale, arrêt 403/2009 ; l'Assemblée législative a été renouvelée par l'élection de 2024, sous le contrôle de la Commission nationale des élections, organe national indépendant.", source: "https://www.tribunalconstitucional.pt/tc/acordaos/20090403.html"}
chronologie:
  - {annee: 1976, evenement: "La Constitution fait des archipels des Açores et de Madère des régions autonomes dotées de statuts et d'organes de gouvernement propre (art. 6)."}
  - {annee: 1980, evenement: "Loi 39/80 du 5 août portant Statut politico-administratif de la Région autonome des Açores."}
  - {annee: 1987, evenement: "Loi 9/87 du 26 mars modifiant le Statut."}
  - {annee: 1998, evenement: "Loi 61/98 du 27 août modifiant le Statut."}
  - {annee: 2009, evenement: "Loi 2/2009 du 12 janvier : troisième révision et renumérotation du Statut ; l'arrêt 403/2009 du Tribunal constitutionnel déclare plusieurs dispositions inconstitutionnelles avec force obligatoire générale. Entrée en vigueur de l'article 349 du TFUE, qui nomme les Açores parmi les régions ultrapériphériques."}
  - {annee: 2024, evenement: "Élection de l'Assemblée législative régionale."}
  - {annee: 2026, evenement: "Loi organique 3/2026 du 10 septembre, dixième modification de la loi électorale de l'Assemblée législative."}
fiabilite:
  verifie: ["Statut, art. 1, 2, 5, 7, 8, 19 à 24, 26, 27, 37, 43, 52, 53, 62, 116, 128, 133 et 136, et notes sur l'arrêt 403/2009 (texte consolidé publié par la Commission nationale des élections).", "Constitution, art. 6, 142, 225 à 227, 229 à 231, 233 et 234 (Assemblée de la République).", "Article 349 du TFUE (EUR-Lex).", "Arrêt 403/2009 du Tribunal constitutionnel, saisine du Provedor de Justiça et décision.", "Absence de juridiction régionale : le Statut renvoie à l'organisation judiciaire de l'État (art. 133) et à une section régionale de la Cour des comptes (art. 21).", "Population résidente estimée 2025, 19 municipalités, 155 freguesias (paroisses civiles) hors Corvo, 2 322 km² (Service régional de statistique des Açores, SREA)."]
  non_confirme: ["Aucun document onusien nommant le régime açorien n'a été trouvé.", "Le texte consolidé du Statut consulté date de 2012 ; aucune révision postérieure n'a été trouvée, sans vérification au Journal officiel (Diário da República).", "Nombre de sièges des Açores à l'Assemblée de la République non vérifié sur la loi électorale.", "Effectivité appuyée sur une décision de justice et une source électorale nationale, sans rapport d'évaluation indépendant (Conseil de l'Europe, université) consulté.", "Date exacte de l'élection de 2024 non relevée sur la source citée.", "Nombre de villages ou localités habitées : non trouvé ; le SREA compte 155 freguesias (paroisses civiles ; Corvo n'en a pas), unité administrative et non décompte des localités."]
