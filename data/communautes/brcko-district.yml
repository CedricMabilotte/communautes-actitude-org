resume: >-
  Le district de Brčko est une collectivité de Bosnie-Herzégovine qui n'appartient à aucune des deux entités (la Fédération de Bosnie-Herzégovine et la Republika Srpska) : son territoire est détenu en « condominium » (copropriété) par les deux, qui sont réputées lui avoir délégué de façon permanente leurs pouvoirs de gouvernement. Il a été créé par la sentence arbitrale finale du 5 mars 1999, rendue par le tribunal prévu à l'annexe 2 des accords de paix de Dayton, puis établi le 8 mars 2000 avec son statut. La Constitution de la Bosnie-Herzégovine, révisée en 2009, le définit comme une « unité d'autogouvernement local » dotée de ses propres institutions, lois et règlements (art. VI.4). Il dispose d'une Assemblée élue de 31 membres, d'un gouvernement dirigé par un maire, de tribunaux et d'une police propres ; la supervision internationale est suspendue depuis le 31 août 2012, mais le tribunal arbitral reste compétent.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Le Conseil de sécurité accueille et soutient l'accord-cadre général pour la paix (Dayton, 1995), dont l'annexe 2 prévoit l'arbitrage sur la région de Brčko, et annonce qu'il en suivra la mise en œuvre (résolution 1031 (1995), § 1 et 2) ; le président de la Cour internationale de justice a nommé le président du tribunal arbitral le 15 juillet 1996 ; la mise en œuvre de la sentence finale fait l'objet d'une section des rapports du Haut Représentant au Secrétaire général de l'ONU.", annee: 1995, source: "https://www.ohr.int/un-security-council-resolution-1031-1995-on-implementation-of-the-peace-agreement-for-bih-and-transfer-of-authority-from-the-un-protection-force-to-the-multinational-implementation-force-ifor/"}
base_nationale:
  - {instrument: "Constitution de la Bosnie-Herzégovine (annexe 4 des accords de Dayton), art. VI.4 issu de l'amendement de 2009", nature: "constitution", annee: 2009, source: "https://www.constituteproject.org/constitution/Bosnia_Herzegovina_2009"}
  - {instrument: "Sentence arbitrale finale du tribunal pour le différend sur la ligne de démarcation inter-entités dans la région de Brčko, 5 mars 1999, et son annexe", nature: "accord_paix", annee: 1999, source: "https://www.ohr.int/final-award/"}
  - {instrument: "Décision du Haut Représentant portant création du district de Brčko de Bosnie-Herzégovine, 8 mars 2000", nature: "accord_paix", annee: 2000, source: "https://www.ohr.int/decision-on-the-establishment-of-the-brcko-district-of-bih/"}
  - {instrument: "Statut du district de Brčko de Bosnie-Herzégovine (version publiée par le Bureau du Haut Représentant le 5 juin 2008)", nature: "statut_autonomie", annee: 2000, source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée de 31 conseillers élus au suffrage direct pour quatre ans, dont deux représentent les minorités nationales, qui élit le maire ; le gouvernement du district réunit le maire, le maire adjoint, le coordinateur en chef et les chefs de département (Statut, art. 22, 23, 45 et 46) ; la Constitution le définit comme « unité d'autogouvernement local avec ses propres institutions » (art. VI.4).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée adopte le statut, le budget et les lois du district (Statut, art. 22(2)(a) à (c)) dans les compétences énumérées à l'article 8(1) ; ces lois doivent être conformes au droit de l'État (art. 1(4)) et cèdent devant les sentences du tribunal et les ordres du superviseur (art. 1(6)) ; la Constitution reconnaît au district « ses propres lois et règlements » (art. VI.4).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  justice_propre: {valeur: "reconnu", note: "Pouvoir judiciaire propre composé d'un tribunal de base et d'une cour d'appel de compétence générale (Statut, art. 66), avec une commission judiciaire du district (art. 71) ; la sentence finale de 1999 prévoit une justice indépendante à deux degrés et une police unifiée (§ 36) ; le district dispose de sa propre police (Statut, art. 62).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  terres: {valeur: "partiel", note: "Les biens immobiliers publics situés sur le territoire au 5 mars 1999 appartiennent au district depuis cette date, qui doit privatiser ceux qui ne servent pas aux fonctions publiques (Statut, art. 8(5) et 8(6)) ; le territoire lui-même est détenu en copropriété par les deux entités (sentence finale, § 11 ; Constitution, art. VI.4).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Une entité ou une municipalité ne peut établir ni faire fonctionner un organe ou un bureau sur le territoire du district qu'avec l'accord du gouvernement du district (Statut, art. 9(3)) ; l'Assemblée peut saisir la Cour constitutionnelle d'un litige sur le statut et les pouvoirs du district (Constitution, art. VI.4).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  langue: {valeur: "reconnu", note: "Le bosnien, le croate et le serbe, ainsi que les alphabets latin et cyrillique, sont employés à égalité pour tous les usages officiels (Statut, art. 6(1)).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  education: {valeur: "reconnu", note: "L'éducation figure parmi les compétences des autorités du district (Statut, art. 8(1)(f)) ; l'enseignement primaire est obligatoire et gratuit, le secondaire gratuit (art. 15(1)).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  fiscalite: {valeur: "partiel", note: "L'Assemblée adopte le budget (Statut, art. 22(2)(b) et 41) ; aucun impôt ni redevance ne peut être perçu sans une loi qui l'autorise (art. 13(7)) ; une direction des finances du district comprend une administration fiscale et un trésor (art. 48) ; la fiscalité n'est pas énumérée parmi ses compétences, qui comprennent les « finances du district » (art. 8(1)), et aucune source consultée n'établit qu'il fixe les principaux impôts perçus sur son territoire, d'où « partiel ».", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  representation: {valeur: "partiel", note: "Un bureau du coordinateur pour le district de Brčko auprès du Conseil des ministres représente les intérêts du district devant les institutions de l'État (Statut, art. 50) ; la majorité des membres de l'Assemblée, dont au moins un cinquième des élus de chaque peuple constitutif, peut saisir la Cour constitutionnelle (Constitution, art. VI.4) ; aucun siège réservé au district au Parlement de l'État n'a été trouvé.", source: "https://www.constituteproject.org/constitution/Bosnia_Herzegovina_2009"}
  statut_personnel: {valeur: "partiel", note: "Le statut définit la qualité de résident du district (citoyen de Bosnie-Herzégovine ou personne en séjour légal ayant sa résidence permanente sur le territoire) et garantit aux résidents le droit de choisir ou de changer leur citoyenneté d'entité (Statut, art. 11 et 12).", source: "https://www.ohr.int/ohr_archive/statute-of-the-brcko-district-of-bosnia-and-herzegovina/"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le 69e rapport du Haut Représentant au Secrétaire général de l'ONU (période du 16 octobre 2025 au 15 avril 2026) relève que la « tendance positive générale » s'est poursuivie dans le district, malgré une tentative de la Republika Srpska d'y étendre ses activités, qualifiée d'écart à la mise en œuvre de la sentence finale, et note que les projets de développement local n'ont pas retrouvé leur rythme antérieur depuis les élections locales d'octobre 2024 ; le maire, son adjoint, le coordinateur en chef et la présidence de l'Assemblée ont réaffirmé le 3 mars 2026 leur attachement à la sentence et à la Constitution.", source: "https://www.ohr.int/69th-report-of-the-high-representative-for-implementation-of-the-peace-agreement-on-bosnia-and-herzegovina-to-the-secretary-general-of-the-un/"}
chronologie:
  - {annee: 1995, evenement: "Accords de Dayton : faute d'accord sur la ligne de démarcation dans la région de Brčko, les parties s'en remettent à un arbitrage obligatoire (annexe 2, art. V)."}
  - {annee: 1996, evenement: "Le président de la Cour internationale de justice nomme le président du tribunal arbitral (15 juillet)."}
  - {annee: 1997, evenement: "Première sentence (14 février) : création d'un régime de supervision internationale de la zone."}
  - {annee: 1999, evenement: "Sentence finale du 5 mars : création du district de Brčko, territoire en copropriété des deux entités."}
  - {annee: 2000, evenement: "Décision du Haut Représentant du 8 mars portant création du district et adoption du statut."}
  - {annee: 2009, evenement: "Révision de la Constitution de la Bosnie-Herzégovine : le district est inscrit à l'article VI.4 et la Cour constitutionnelle devient compétente pour les litiges sur son statut."}
  - {annee: 2012, evenement: "Fermeture du bureau du Haut Représentant à Brčko et suspension des fonctions du superviseur (31 août) ; le tribunal arbitral reste compétent."}
  - {annee: 2024, evenement: "Élections locales d'octobre."}
fiabilite:
  verifie: ["Sentence finale du 5 mars 1999 (§ 9 à 11 : délégation des pouvoirs des entités, copropriété, interdiction de toute subdivision du district sur une base ethnique), texte publié par le Bureau du Haut Représentant.", "Nomination du président du tribunal par le président de la Cour internationale de justice le 15 juillet 1996 (sentence du 14 février 1997).", "Décision du Haut Représentant du 8 mars 2000 portant création du district.", "Statut du district (version publiée le 5 juin 2008), art. 1, 6, 8, 9, 11, 12, 13, 15, 22, 23, 41, 45, 46, 48, 50, 62, 66 et 71.", "Article VI.4 de la Constitution de la Bosnie-Herzégovine (version révisée jusqu'en 2009), texte du Constitute Project.", "Suspension de la supervision au 31 août 2012 et maintien de la compétence du tribunal (page « Brčko Supervision » du Bureau du Haut Représentant).", "Population de 83 516 habitants et répartition par appartenance déclarée, recensement de 2013 (Agence de statistique de Bosnie-Herzégovine).", "59 localités recensées (naseljena mjesta) en 2013, toutes habitées, dont la somme des populations donne 83 516 (recensement de 2013, livre 2, tableau 2.2).", "69e rapport du Haut Représentant au Secrétaire général de l'ONU, section sur la sentence finale de Brčko.", "Résolution 1031 (1995) du Conseil de sécurité, § 1, 2 et 14 (copie du Bureau du Haut Représentant).", "Sentence finale du 5 mars 1999, § 36 (assemblée, exécutif, justice à deux degrés, police unifiée)."]
  non_confirme: ["Date exacte et texte de l'amendement I à la Constitution (2009) : seul le texte consolidé a été lu.", "Version du statut en vigueur : la version lue date de 2008 ; les révisions postérieures (dont celles qui ont suivi l'amendement de 2009) n'ont pas été consultées.", "Superficie : la sentence du 15 février 1997 (§ 52) donne 225 km² sous contrôle de la Republika Srpska (environ 48 %) et 239 km² sous contrôle de la Fédération (environ 52 %) en 1995 ; aucune superficie officielle actuelle du district n'a été lue.", "Nombre de communautés locales (mjesne zajednice), retenues comme unité de lieux : sites du gouvernement et de l'Assemblée du district inaccessibles lors de la recherche ; le district forme une seule unité administrative, sans municipalités (Agence de statistique de Bosnie-Herzégovine, bulletin Démographie 2024).", "Part des recettes de l'imposition indirecte de l'État versée au district : non vérifiée.", "Résolution 1031 (1995) du Conseil de sécurité : texte lu dans la copie du Bureau du Haut Représentant, la version de docs.un.org n'a pas pu être lue ; elle ne nomme pas Brčko."]
