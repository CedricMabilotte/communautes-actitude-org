effectivite: {valeur: "partielle", note: "Le régime est appliqué : en 2022, 111 permis d'exploitation forestière étaient actifs au nom de communautés autochtones ou tribales et les forêts communautaires couvraient 826 000 ha (surface que la SBB donne pour les forêts communautaires et les permis de coupe réunis), pour 23 % de la production de bois ; l'État reste propriétaire des terres et accorde aux communautés des droits d'exploitation de dix ans, et une grande part des revenus va aux entrepreneurs qui achètent le bois sur pied (Probos, 2025). En 2007, la Cour interaméricaine relevait l'absence de forêt communautaire accordée à un membre du peuple saramaka et l'absence de réponse aux plaintes adressées au Président au titre de l'art. 41(1)(b) (arrêt Saramaka, §§ 113 et 184).", source: "https://www.probos.nl/images/pdf/rapporten/251006_Final_Report_Forest_Management_Revenue_Suriname_V2.pdf"}
chronologie:
  - {annee: 1992, evenement: "Loi sur la gestion forestière (Wet Bosbeheer) du 18 septembre 1992 : définition des forêts communautaires et art. 41."}
  - {annee: 2007, evenement: "Arrêt Peuple saramaka c. Suriname de la Cour interaméricaine : les forêts communautaires ne valent pas reconnaissance de la propriété collective."}
  - {annee: 2015, evenement: "Arrêt Peuples kaliña et lokono c. Suriname : l'art. 41 ne garantit pas la participation effective."}
fiabilite:
  verifie:
    - "Art. 1(n) et 1(o) (définitions de gemeenschapsgrond et gemeenschapsbos) et art. 41 de la Wet Bosbeheer, S.B. 1992 no 80, lus sur les pages 2 et 14 du texte publié par FAOLEX."
    - "Traduction anglaise de l'art. 41 citée par la Cour interaméricaine (arrêt Kaliña et Lokono, note 243)."
    - "Arrêt Saramaka, §§ 112 à 114 et 184."
    - "Surface (826 000 ha en 2022), 111 permis actifs au nom de communautés et part de 23 % de la production : rapport Probos de juillet 2025, citant la SBB."
    - "Le projet de loi sur les droits collectifs des peuples autochtones et tribaux n'était pas adopté en 2025 (Probos, 2025) ; la loi sur la protection des zones d'habitat adoptée en 2017 n'était pas promulguée en septembre 2026 (Suriname Herald, 7 septembre 2026)."
  non_confirme:
    - "Le nombre et la liste des forêts communautaires désignées n'ont pas été trouvés ; les 111 permis actifs en 2022 ne correspondent pas forcément à autant de forêts communautaires ; pas de tableau par site."
    - "L'adoption, après 2007, du décret d'État sur l'utilisation et la gestion des forêts communautaires n'a pas été vérifiée."
    - "Lieux et surface : le tableau 11 de la SBB (2022) regroupe permis de coupe (HKV) et forêts communautaires (111 titres, 826 691 ha) ; le rapport Probos (2025) présente les 826 000 ha comme surface des forêts communautaires."
    - "Population des communautés titulaires : non trouvée."
    - "Nombre de villages : non trouvé."
