resume: >-
  Fiche agrégée : elle couvre les forêts communautaires (gemeenschapsbossen) prévues par la loi sur la gestion forestière (Wet Bosbeheer) du 18 septembre 1992. Le ministre chargé des forêts, après concertation avec le ministre du Développement régional, désigne des zones forestières situées autour des terres communautaires au profit des habitants de l'intérieur vivant en communautés tribales (in stamverband levende boslandbewoners), c'est-à-dire les villages autochtones et marrons. Ces forêts servent à leurs besoins propres en nourriture et en produits forestiers, ainsi qu'à une exploitation commerciale éventuelle du bois, à la collecte de produits forestiers autres que le bois et au défrichement agricole, sans redevance de concession. En 2022, les forêts communautaires et les permis de coupe (houtkapvergunningen) réunis couvraient 826 691 ha. La loi ne donne aucun titre de propriété ; la Cour interaméricaine des droits de l'homme a jugé en 2007 que ces permis sont révocables et ne reconnaissent pas la propriété collective.
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Peuple saramaka c. Suriname, 28 novembre 2007, §§ 112 à 114 : les forêts communautaires de la loi de 1992 sont accordées à la discrétion du ministre, sont des concessions forestières révocables aux droits d'usage restreints et ne donnent pas effet à la propriété collective ; § 184 : le recours au Président de l'article 41(1)(b) n'est pas un recours effectif.", annee: 2007, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_172_ing.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Peuples kaliña et lokono c. Suriname, 25 novembre 2015, § 209 et note 243 : l'article 41 de la loi de 1992 reconnaît les intérêts des peuples autochtones et tribaux lors de l'octroi des concessions, sans droit à une participation effective.", annee: 2015, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_309_ing.pdf"}
