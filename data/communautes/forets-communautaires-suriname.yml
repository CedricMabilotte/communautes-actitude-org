  terres: {valeur: "partiel", note: "Les droits coutumiers des habitants de l'intérieur vivant en communautés tribales sur leurs villages, établissements et terres de culture sont respectés « autant que possible » (zoveel als mogelijk), avec recours écrit au Président déposé par l'autorité traditionnelle (Wet Bosbeheer 1992, art. 41(1)(a)-(b)) ; la forêt communautaire est une désignation ministérielle sans titre de propriété, que la Cour interaméricaine a qualifiée en 2007 de concession révocable.", source: "https://faolex.fao.org/docs/pdf/sur32831.pdf"}
  ressources: {valeur: "partiel", note: "Le ministre désigne des forêts communautaires au profit des villages autochtones et marrons pour leurs besoins en bois, en nourriture et en produits forestiers et pour une exploitation commerciale éventuelle ; aucune redevance de concession n'est due, mais le bois et les produits sortis de la forêt communautaire ou destinés au commerce restent soumis aux taxes (retributies) des art. 32(1)(b) et 40 et à l'indemnité de l'art. 13 (Wet Bosbeheer 1992, art. 1(o) et 41(2)-(3)) ; l'utilisation et la gestion devaient être précisées par décret d'État.", source: "https://faolex.fao.org/docs/pdf/sur32831.pdf"}
