resume: >-
  Fiche agrégée : elle couvre les communautés de base (vondron'olona ifotony, en malgache) auxquelles l'État ou une collectivité territoriale a transféré la gestion de ressources naturelles renouvelables. La loi n° 96-025 du 30 septembre 1996, dite GELOSE (gestion locale sécurisée), permet de confier par contrat la gestion des forêts, de la faune et de la flore sauvages aquatiques et terrestres, de l'eau et des terrains de parcours situés dans le terroir d'une communauté de base dotée de la personnalité morale (art. 1 à 3) ; le contrat est conclu avec l'État ou la collectivité propriétaire, avec le concours de la commune de rattachement (art. 6 et 7). L'agrément vaut trois ans, puis peut être renouvelé pour dix ans (art. 39). Le décret n° 2000-027 du 13 janvier 2000 organise les communautés de base ; le décret n° 2001-122 du 14 février 2001 ajoute la gestion contractualisée des forêts de l'État (GCF). Le système d'information du ministère compte 1 581 communautés de base, dont 1 281 ont un contrat expiré, et 3 442 108 ha transférés.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national de Madagascar à la Convention sur la diversité biologique (avril 2014), p. 57-58 : la responsabilité des communautés locales (fokonolona) sur leurs ressources « a été reconnue officiellement » par le transfert de gestion des ressources naturelles aux communautés locales de base (loi 96-025, ses décrets d'application et décret sur la gestion contractualisée des forêts) ; près d'un million d'hectares font l'objet de près d'un millier de contrats.", annee: 2014, source: "https://www.cbd.int/doc/world/mg/mg-nr-05-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 96-025 du 30 septembre 1996 relative à la gestion locale des ressources naturelles renouvelables (GELOSE), art. 1 à 9, 12, 18, 38 à 54", nature: "loi", annee: 1996, source: "https://www.cms.int/sites/default/files/document/cms_nlp_mdg_loi_96-025_1996.pdf"}
  - {instrument: "Décret n° 2000-027 du 13 janvier 2000 relatif aux communautés de base chargées de la gestion locale des ressources naturelles renouvelables, art. 2 à 24 et modèle annexé de règlement intérieur ou dina", nature: "loi", annee: 2000, source: "https://www.e-voary.mg/tgrn/index.php/coba.php/readPDf?file=D%C3%A9cret%20n%C2%B02000-027%20relatif%20aux%20COBA%20charg%C3%A9es%20de%20la%20gestion%20locale%20de%20ressources%20naturelles%20renouvelables.pdf"}
  - {instrument: "Décret n° 2001-122 du 14 février 2001 fixant les conditions de mise en œuvre de la gestion contractualisée des forêts de l'État", nature: "loi", annee: 2001, source: "https://www.e-voary.mg/tgrn/assets/images/article_version%20finale_tgrn.pdf"}
  - {instrument: "Loi n° 2001-004 du 25 octobre 2001 portant réglementation générale des dina", nature: "loi", annee: 2001, source: "https://www.e-voary.mg/tgrn/assets/images/article_version%20finale_tgrn.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté de base a la personnalité morale (loi n° 96-025, art. 3) ; elle a une assemblée générale, qui adopte le statut et le dina, élit la structure de gestion et décide de l'affectation des fonds, et une structure de gestion élue (président, vice-président, trésorier, secrétaire) qui la représente auprès de l'administration (décret n° 2000-027, art. 7 à 14) ; le transfert dépend d'un agrément de l'autorité administrative, d'une durée de trois ans puis dix ans, qui peut être retiré en cas d'inexécution du contrat (loi n° 96-025, art. 4, 39 et 41).", source: "https://www.cms.int/sites/default/files/document/cms_nlp_mdg_loi_96-025_1996.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les rapports entre membres sont réglés par un dina (convention collective fondée sur la coutume) approuvé selon les règles coutumières de la communauté ; après visa du maire de la commune de rattachement, il a force de loi entre les membres (loi n° 96-025, art. 49 à 52) ; il doit être conforme à la Constitution, aux lois et règlements et aux usages non contestés de la commune, et le représentant de l'État peut le déférer au juge, ce qui en suspend l'application (art. 50 à 52) ; le maire doit délivrer le visa dans un délai de vingt jours (décret n° 2000-027, art. 18).", source: "https://www.cms.int/sites/default/files/document/cms_nlp_mdg_loi_96-025_1996.pdf"}
  justice_propre: {valeur: "partiel", note: "Le membre qui enfreint le dina est passible des vonodina (réparations ou sanctions prévues par le dina), sans préjudice des poursuites pénales, et le recours au juge n'est ouvert qu'après épuisement des procédures prévues par le dina (loi n° 96-025, art. 53) ; le modèle de dina annexé au décret n° 2000-027 prévoit des réparations pécuniaires, une remise en état ou l'exclusion, après que le membre a pu plaider sa cause devant l'assemblée générale (annexe, art. 6 à 10).", source: "https://www.cms.int/sites/default/files/document/cms_nlp_mdg_loi_96-025_1996.pdf"}
  terres: {valeur: "partiel", note: "Le transfert porte sur la gestion de ressources du domaine de l'État ou des collectivités territoriales comprises dans le terroir de la communauté, y compris les terrains de parcours, sans transfert de propriété (loi n° 96-025, art. 1 et 2) ; selon Ramamonjisoa, Rakoto Ramiarantsoa et Casse (2012), qui citent Sahler (2005), le dispositif apporte une « sécurité foncière relative » qui « n'accorde pas un titre inattaquable » mais « conforte les droits d'une communauté sur son patrimoine foncier ».", source: "https://journals.openedition.org/com/6476"}
  ressources: {valeur: "partiel", note: "L'agrément confère à la communauté de base, pour la durée indiquée, la gestion de l'accès, de la conservation, de l'exploitation et de la valorisation des ressources transférées, sous réserve des règles d'exploitation du contrat de gestion (loi n° 96-025, art. 43) ; en cas de refus ou de non-renouvellement, les ressources retournent au droit commun (art. 42) ; la communauté peut demander l'extension de l'agrément à d'autres ressources (art. 40).", source: "https://www.cms.int/sites/default/files/document/cms_nlp_mdg_loi_96-025_1996.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les ressources de la communauté proviennent des cotisations, des aides, des dons et legs et des produits de ses activités ; l'assemblée générale approuve les comptes et décide de l'affectation des fonds (décret n° 2000-027, art. 9, 20 et 21) ; la loi n° 96-025 annonce des avantages parafiscaux (prélèvements affectés) pour la commercialisation des produits, à instituer par une loi (art. 54), dont le texte n'a pas été trouvé.", source: "https://www.e-voary.mg/tgrn/index.php/coba.php/readPDf?file=D%C3%A9cret%20n%C2%B02000-027%20relatif%20aux%20COBA%20charg%C3%A9es%20de%20la%20gestion%20locale%20de%20ressources%20naturelles%20renouvelables.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le cinquième rapport national à la Convention sur la diversité biologique (2014) relève que « les problèmes liés à leurs capacités et surtout les motivations économiques subsistent ». Ramamonjisoa, Rakoto Ramiarantsoa et Casse (2012) rapportent qu'une évaluation de 2003 constatait une « légère dégradation » des ressources transférées, due à des exploitants extérieurs aux communautés, et que l'efficacité de la gestion contractualisée sur la conservation des ressources forestières « ne peut être mesurée faute d'indicateur objectif ». Selon le système d'information du ministère, 1 281 des 1 581 communautés de base ont un contrat expiré ; dans la liste publique, 189 communautés de base ont un dernier contrat dont la date de fin est postérieure au 1er octobre 2026 ; le nombre de communautés de base créées par an atteint 115 en 2013, puis 4 en 2024 et 7 en 2025. Si l'agrément n'est pas renouvelé, la gestion des ressources revient au droit commun (loi n° 96-025, art. 42).", source: "https://journals.openedition.org/com/6476"}
chronologie:
  - {annee: 1996, evenement: "Loi n° 96-025 du 30 septembre 1996 relative à la gestion locale des ressources naturelles renouvelables (GELOSE)."}
  - {annee: 1997, evenement: "Début de la mise en place des transferts de gestion avec la deuxième phase du Programme national d'action environnementale."}
  - {annee: 2000, evenement: "Décret n° 2000-027 du 13 janvier 2000 sur les communautés de base ; décret n° 2000-028 sur les médiateurs environnementaux."}
  - {annee: 2001, evenement: "Décret n° 2001-122 du 14 février 2001 sur la gestion contractualisée des forêts de l'État ; loi n° 2001-004 du 25 octobre 2001 sur les dina."}
  - {annee: 2002, evenement: "251 contrats de transfert de gestion, selon un bilan cité par Ramamonjisoa et al. (2012)."}
  - {annee: 2014, evenement: "Cinquième rapport national à la Convention sur la diversité biologique : près d'un millier de contrats pour près d'un million d'hectares."}
  - {annee: 2015, evenement: "Loi n° 2015-003 du 20 janvier 2015 portant Charte de l'environnement malagasy actualisée."}
  - {annee: 2026, evenement: "Le système d'information du ministère affiche 1 581 communautés de base, 2 189 contrats et 3 442 108 ha transférés."}
fiabilite:
  verifie:
    - "Articles 1 à 57 de la loi n° 96-025 dans le texte adopté par l'Assemblée nationale le 10 septembre 1996, publié par la Convention sur les espèces migratrices."
    - "Articles 1 à 28 et modèle de dina du décret n° 2000-027, dans la copie numérisée publiée par le système d'information du ministère (lecture par reconnaissance de caractères)."
    - "Passage de la page 58 du cinquième rapport national de Madagascar à la Convention sur la diversité biologique (2014)."
    - "Nombre de communautés de base (1 581), de contrats par rang (2 189), de membres affiliés (54 043), de communautés de base dont le contrat est expiré (1 281) et superficie totale actuelle (3 442 108 ha) affichés sur la page d'accueil du système d'information TGRNR, consultée le 1er octobre 2026."
    - "Liste des 1 565 communautés de base sous contrat, avec région, district, commune, type de contrat (955 GCF, 607 GELOSE, 3 non renseignés) et superficie, obtenue par le formulaire de recherche public du même système le 1er octobre 2026."
  non_confirme:
    - "Le texte du décret n° 2001-122 (gestion contractualisée des forêts) n'a pas été lu : le lien publié par le système d'information renvoie un fichier vide ; sa date et son objet sont repris de l'article du système d'information et de Ramamonjisoa et al. (2012)."
    - "Le texte de la loi n° 2001-004 sur les dina et celui du décret n° 98-610 sur la sécurisation foncière relative n'ont pas été lus ; la « sécurité foncière relative » est citée d'après Ramamonjisoa et al. (2012)."
    - "Les avantages parafiscaux annoncés par l'article 54 de la loi n° 96-025 : aucun texte d'application trouvé."
    - "Écart entre le compteur du système d'information (1 581 communautés de base, 3 442 108 ha) et la liste publique (1 565 communautés de base sous contrat, 3 439 236 ha pour 1 296 sites dont la superficie est renseignée)."
    - "Statut réel des contrats : le compteur indique 1 281 communautés de base dont le contrat est expiré ; dans la liste, 1 279 derniers contrats ont une date de fin antérieure au 1er octobre 2026, 189 une date postérieure et 97 aucune date ; des renouvellements non saisis ne sont pas exclus."
    - "Dans le tableau, la superficie est celle du contrat de rang le plus élevé ; l'année est celle du premier début de contrat enregistré, à défaut l'année de création de la communauté ; 74 sites n'ont aucune année exploitable et 269 n'ont pas de superficie."
    - "Nombre de villages concernés : aucune source trouvée."
