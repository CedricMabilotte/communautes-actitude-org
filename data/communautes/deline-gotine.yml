resume: >-
  Les Dénés et Métis du Sahtu de Délı̨nę, qui se nomment Sahtúot'ı̨nę (« peuple du Grand lac de l'Ours »), vivent sur la rive ouest du Grand lac de l'Ours, dans les Territoires du Nord-Ouest. L'Accord définitif sur l'autonomie gouvernementale de Délı̨nę, prévu par l'entente sur la revendication territoriale du Sahtu de 1993, a été signé le 18 février 2015 et est entré en vigueur le 1er septembre 2016. Il institue le Gouvernement got'ı̨nę de Délı̨nę, gouvernement autochtone et public à la fois, qui remplace la bande indienne, la société foncière et la collectivité à charte. Ce gouvernement légifère notamment sur la citoyenneté, la langue, l'éducation, les terres visées par le règlement et l'impôt direct de ses citoyens.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'appuie désormais ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien. Aucun document onusien nommant Délı̨nę n'a été consulté.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Entente sur la revendication territoriale globale des Dénés et Métis du Sahtu, chapitre 5 et annexe B (négociation de l'autonomie gouvernementale)", nature: "accord_revendication", annee: 1993, source: "https://laws-lois.justice.gc.ca/fra/lois/D-1.5/page-1.html"}
  - {instrument: "Accord définitif sur l'autonomie gouvernementale de Délı̨nę (Délı̨nę Final Self-Government Agreement)", nature: "accord_revendication", annee: 2015, source: "https://deline.ca/media/303/download?inline"}
  - {instrument: "Loi sur l'accord définitif sur l'autonomie gouvernementale de Deline (L.C. 2015, ch. 24)", nature: "loi", annee: 2015, source: "https://laws-lois.justice.gc.ca/fra/lois/D-1.5/page-1.html"}
  - {instrument: "Délı̨nę Got'ı̨nę Ɂeɂadó, constitution du Gouvernement got'ı̨nę de Délı̨nę", nature: "statut_autonomie", annee: 2016, source: "https://deline.ca/media/71/download?inline"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le Gouvernement got'ı̨nę de Délı̨nę se compose d'un chef (ɂekw'ahtı̨dǝ́), d'un conseil principal législatif de 8 à 12 membres, d'un conseil des aînés et d'un conseil de justice, Accord, art. 3.4.1 (2015) ; la loi fédérale lui donne la capacité d'une personne physique, L.C. 2015, ch. 24, art. 9.", source: "https://deline.ca/media/303/download?inline"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les lois de Délı̨nę adoptées conformément à l'Accord ont force de loi, L.C. 2015, ch. 24, art. 10 ; l'Accord, qualifié de traité au sens des articles 25 et 35 de la Loi constitutionnelle de 1982 (art. 3 de la loi), attribue des compétences législatives par chapitre (élections, citoyenneté, éducation, adoption, langue, terres, impôt).", source: "https://laws-lois.justice.gc.ca/fra/lois/D-1.5/page-1.html"}
  justice_propre: {valeur: "partiel", note: "Le conseil de justice (Dene K'ǝ Dats'eredı Kǝ), indépendant, peut appliquer les sanctions, les mesures de rechange et le règlement extrajudiciaire des différends, et entendre les appels, Accord, art. 17.1.1 et 17.1.2 ; les infractions aux lois de Délı̨nę relèvent de la Cour territoriale et la révision judiciaire de la Cour suprême des T.N.-O., art. 17.7 et 17.11.2.", source: "https://deline.ca/media/303/download?inline"}
  terres: {valeur: "reconnu", note: "Le titre sur les terres visées par le règlement (settlement lands) du district passe au Gouvernement got'ı̨nę à la date d'entrée en vigueur, Accord, art. 21.2.1 ; il en règle l'usage, la gestion et la protection, art. 21.1.1, dans le cadre réglementaire de l'entente du Sahtu, art. 21.1.2.", source: "https://deline.ca/media/303/download?inline"}
  ressources: {valeur: "partiel", note: "Le Gouvernement got'ı̨nę gère les droits de récolte de la faune, des plantes et des arbres prévus par l'entente du Sahtu pour ses citoyens, Accord, art. 3.2.6 ; la réglementation des terres, des eaux et de l'environnement reste dans le cadre fédéral et territorial, art. 21.1.2.", source: "https://deline.ca/media/303/download?inline"}
  consentement: {valeur: "partiel", note: "Le Canada et les T.N.-O. consultent le Gouvernement got'ı̨nę sur les lois de mise en œuvre, Accord, art. 2.5.2 ; l'Office des terres et des eaux du Sahtu le consulte avant de délivrer un permis sur les terres visées par le règlement, art. 21.1.7 ; consultation, sans droit de refus.", source: "https://deline.ca/media/303/download?inline"}
  langue: {valeur: "reconnu", note: "Compétence sur la langue et la culture des Dénés et Métis du Sahtu de Délı̨nę, la loi de Délı̨nę l'emportant en cas de conflit, Accord, art. 18.1.1 et 18.2.1 ; le slavey du Nord et l'anglais sont les langues officielles du Gouvernement got'ı̨nę, constitution, art. 11.1 ; le slavey du Nord est l'une des onze langues officielles des T.N.-O.", source: "https://deline.ca/media/71/download?inline"}
  education: {valeur: "partiel", note: "Compétence sur l'enseignement de la maternelle à la 12e année dans le district et sur la certification des enseignants, Accord, art. 6.1.1, la loi de Délı̨nę l'emportant en cas de conflit, art. 6.5.1 ; le cadre des programmes et les exigences du diplôme restent territoriaux, art. 6.1.2.", source: "https://deline.ca/media/303/download?inline"}
  fiscalite: {valeur: "partiel", note: "Compétence en matière d'impôt direct sur les citoyens de la Première Nation de Délı̨nę sur les terres de Délı̨nę, Accord, art. 22.2.1 ; une loi sur l'impôt sur le revenu des particuliers (Personal Income Tax Act) figure parmi les lois en vigueur ; l'extension aux non-citoyens exige un accord avec le Canada ou les T.N.-O., art. 22.2.2.", source: "https://deline.ca/media/303/download?inline"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Compétence sur la citoyenneté de la Première Nation de Délı̨nę, la loi de Délı̨nę l'emportant en cas de conflit, Accord, art. 5.1.1 et 5.2.1 ; cette citoyenneté ne donne aucun droit d'entrée au Canada ni la citoyenneté canadienne, art. 5.1.3 ; loi sur la citoyenneté (Citizenship Act) en vigueur depuis le 1er septembre 2016.", source: "https://deline.ca/sites/default/files/2024-07/citizenship_act.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune source indépendante ni onusienne propre à Délı̨nę n'a été trouvée. Selon le gouvernement fédéral (août 2026), le Gouvernement got'ı̨nę emploie plus de 70 personnes dans la collectivité et compte 12 directions ; il publie une liste de dix-neuf lois et règlements, dont deux pas encore en vigueur.", source: "https://www.canada.ca/en/crown-indigenous-relations-northern-affairs/news/2026/08/celebration-of-the-tenth-anniversary-of-the-establishment-of-the-delne-gotne-government.html"}
chronologie:
  - {annee: 1993, evenement: "Signature, le 6 septembre, de l'entente sur la revendication territoriale globale des Dénés et Métis du Sahtu, qui prévoit la négociation de l'autonomie gouvernementale."}
  - {annee: 2003, evenement: "Signature à Délı̨nę, le 23 août, de l'accord de principe sur l'autonomie gouvernementale."}
  - {annee: 2014, evenement: "Approbation de l'Accord définitif par vote des membres, du 10 au 12 mars."}
  - {annee: 2015, evenement: "Signature de l'Accord le 18 février ; loi territoriale sanctionnée le 12 mars et loi fédérale le 18 juin."}
  - {annee: 2016, evenement: "Entrée en vigueur le 1er septembre ; le Gouvernement got'ı̨nę remplace la bande, la société foncière et la collectivité à charte."}
