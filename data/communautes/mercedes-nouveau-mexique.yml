resume: >-
  Fiche agrégée : elle couvre les communautés d'héritiers des concessions de terres (mercedes) faites par l'Espagne et le Mexique à des villages entre la fin du XVIIe et le milieu du XIXe siècle, sur le territoire de l'actuel Nouveau-Mexique. Le chapitre 49 des New Mexico Statutes Annotated 1978 (recueil des lois de l'État) en fait des subdivisions politiques de l'État, gérées par leurs statuts et par un conseil de cinq trustees (administrateurs) élus par les héritiers. Le conseil gère les terres communes, fixe les règles de pâturage et les redevances, adopte un zonage et peut conclure des accords avec des gouvernements locaux, de l'État, fédéral ou de nations amérindiennes reconnues, notamment sur la protection des biens culturels. En 2025, le Land Grant Council de l'État compte 28 mercedes ayant ce statut.
