droits:
  autogouvernement: {valeur: "reconnu", note: "Les mercedes sont gérées par leurs statuts (bylaws), par le traité de Guadalupe Hidalgo et par les art. 49-1-1 à 49-1-18 « en tant que subdivisions politiques de l'État » (art. 49-1-1) ; le conseil de trustees compte cinq membres (art. 49-1-4), élus par les héritiers inscrits tous les deux ou quatre ans selon les statuts (art. 49-1-5) ; le conseil désigne les juges, les greffiers et la commission de recensement des votes des élections suivantes (art. 49-1-3 G).", source: "https://nmdoj.gov/wp-content/uploads/Land_Grant_Law_Book_2023_update.v2.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil adopte les statuts et des règlements pour la protection, l'amélioration et la gestion des terres communes, conformes au droit fédéral et de l'État, et fixe le zonage des terres communes selon un plan d'ensemble qu'il approuve (art. 49-1-3 A, H et J) ; ce pouvoir ne s'étend pas au-delà des terres communes.", source: "https://codes.findlaw.com/nm/chapter-49-land-grants/nm-st-sect-49-1-3/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le conseil « contrôle, entretient et gère » la merced et ses biens fonciers et fixe les conditions d'usage des terres communes (art. 49-1-3 A) ; toute vente ou hypothèque des terres communes exige une résolution du conseil, un bénéfice pour la merced et une ordonnance du tribunal de district qui la confirme ; les héritiers peuvent former opposition dans les trente jours puis faire appel (art. 49-1-11).", source: "https://codes.findlaw.com/nm/chapter-49-land-grants/nm-st-sect-49-1-11/"}
  ressources: {valeur: "partiel", note: "Le conseil fixe le nombre d'animaux admis au pâturage sur les terres communes et en autorise les autres usages (art. 49-1-3 D) ; il décide de l'usage des sols, des infrastructures locales et du développement économique des terres communes (art. 49-1-3 I) et réglemente l'usage des terres et des eaux communes de la merced (art. 49-1-3 H). Aucune disposition du chapitre 49 consultée ne lui attribue de droits d'eau ni le sous-sol.", source: "https://codes.findlaw.com/nm/chapter-49-land-grants/nm-st-sect-49-1-3/"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil fixe le prix d'usage des terres communes et peut en interdire l'accès en cas de non-paiement (art. 49-1-3 E). Un fonds d'aide aux mercedes (land grant-merced assistance fund) reçoit 0,05 % des recettes nettes de la taxe sur le chiffre d'affaires (gross receipts tax) de l'État (art. 7-1-6.70) et verse une part aux mercedes dont les comptes sont jugés conformes par l'auditeur de l'État ; pour l'exercice 2026, 18 des 24 mercedes éligibles étaient conformes, et 17 mercedes ont reçu une part pour l'exercice 2024.", source: "https://www.nmlegis.gov/Sessions/26%20Regular/firs/HB0088.PDF"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon le rapport du Government Accountability Office (GAO, organe de contrôle du Congrès) de 2004, 154 des 295 concessions espagnoles et mexicaines du Nouveau-Mexique étaient communautaires ; les demandes déposées pour elles couvraient 9,38 millions d'acres, dont 5,96 millions ont été confirmés, et la quasi-totalité des 5,3 millions d'acres confirmés aux 84 concessions communautaires hors pueblos semble avoir été transférée ensuite à d'autres propriétaires. En 2025, le rapport annuel du Land Grant Council (organisme de l'État) indique que les conseils de trustees gèrent plus de 250 000 acres de terres communes et que quatre mercedes (Las Vegas, Jacona, Mesilla Bend Colony et, jusqu'en juin 2025, Santa Cruz de la Cañada) n'avaient pas le statut de subdivision politique.", source: "https://www.gao.gov/assets/gao-04-59.pdf"}
chronologie:
  - {annee: 1848, evenement: "Traité de Guadalupe Hidalgo : le Mexique cède le territoire aux États-Unis, qui s'engagent à respecter les biens de ses habitants."}
  - {annee: 1891, evenement: "Création de la Court of Private Land Claims (tribunal fédéral des revendications foncières privées), qui confirme une partie des mercedes jusqu'en 1904."}
  - {annee: 1907, evenement: "Première loi territoriale sur la gestion des mercedes par un conseil de trustees (Laws 1907, chap. 42)."}
  - {annee: 2004, evenement: "Rapport GAO-04-59 sur les concessions communautaires ; modification de l'art. 49-1-1 (Laws 2004, chap. 124)."}
  - {annee: 2025, evenement: "Laws 2025, chap. 140 : la merced de Santa Cruz de la Cañada devient subdivision politique ; le Land Grant Council compte 28 mercedes ayant ce statut."}
fiabilite:
  verifie: ["Art. 49-1-1 (statut de subdivision politique), 49-1-4 (cinq trustees), 49-1-5 (élections tous les deux ou quatre ans) : recueil Land Grant-Merced Laws and Statutes, édition 2023, du ministère de la Justice du Nouveau-Mexique.", "Art. 49-1-3 (pouvoirs du conseil, paragraphes A à K) et 49-1-11 (restrictions de vente et d'hypothèque) : texte publié par FindLaw.", "Liste des 26 mercedes des paragraphes C à BB de l'art. 49-1-2 (texte à jour au 1er janvier 2024) ; ajout de Santa Cruz de la Cañada au paragraphe CC par la loi SB 47, adoptée à l'unanimité (34-0 au Sénat, 64-0 à la Chambre) et promulguée le 10 avril 2025 (Laws 2025, chap. 140), en vigueur le 1er juillet 2025.", "28 mercedes subdivisions politiques dans 12 comtés, plus de 250 000 acres de terres communes, quatre mercedes sans ce statut : rapport annuel 2025 du Land Grant Council.", "Chiffres de 2004 sur les concessions : rapport GAO-04-59."]
  non_confirme: ["Le décompte de 28 suppose 27 mercedes à l'art. 49-1-2 et Chililí (art. 4) ; Chaperito (art. 3) ne figure pas dans les mercedes suivies par le Land Grant Council en 2025 et son statut actuel n'a pas été vérifié.", "Superficie : seul le total de « plus de 250 000 acres » du rapport annuel 2025 a été trouvé ; aucune superficie par merced.", "Nombre d'héritiers et population des villages : aucun chiffre trouvé.", "Les comtés cités par l'art. 49-1-2 pour les 27 mercedes du tableau sont au nombre de dix ; le chiffre de douze comtés vient du rapport du Land Grant Council et n'a pas été recoupé. Le comté de Chililí n'est pas indiqué par l'art. 49-4-1.", "Années de confirmation et de brevet de chaque merced : données par l'art. 49-1-2 tel que reproduit dans la loi SB 47 (2025), non reprises dans le tableau.", "Exonération fiscale éventuelle des terres communes : non vérifiée.", "Aucun document de l'ONU ou de la Commission interaméricaine visant les mercedes n'a été trouvé."]
