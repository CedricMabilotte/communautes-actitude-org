reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, observations finales sur le troisième rapport du Kirghizstan (CCPR/C/KGZ/CO/3, paragraphes 39 et 40) : le Comité note que, selon l'État, les tribunaux d'aksakals ne font pas partie du système judiciaire et sont des organes publics électifs et autonomes ; il relève qu'ils exercent en pratique des fonctions juridictionnelles et demande qu'ils respectent les garanties du procès équitable et la non-discrimination.", annee: 2022, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/KGZ/CO/3&l=en&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination à l'égard des femmes, observations finales sur le quatrième rapport du Kirghizstan (CEDAW/C/KGZ/CO/4, paragraphes 17 et 18) : les violences faites aux femmes sont portées surtout devant les tribunaux d'aksakals ; le Comité recommande d'encourager leur signalement aux services de police.", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/KGZ/CO/4&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République kirghize (2021), article 115 : droit des citoyens de constituer des tribunaux d'aksakals, examen des affaires en vue de concilier les parties dans les limites fixées par la loi, recours contre leurs décisions", nature: "constitution", annee: 2021, source: "https://www.constituteproject.org/constitution/Kyrgyz_Republic_2021"}
  - {instrument: "Règlement type des tribunaux d'aksakals, approuvé par arrêté n° 01-25/342 du 17 décembre 2024 de l'Agence d'État chargée de la fonction publique et de l'autogouvernement local", nature: "loi", annee: 2024, source: "https://mkk.gov.kg/ru/wp-content/uploads/2024/12/Регламент-17.12.2024-1.pdf"}
  - {instrument: "Règlement sur l'enregistrement des tribunaux d'aksakals auprès des organes exécutifs de l'autogouvernement local et la délivrance de cartes à leurs membres, arrêté n° 01-25/93 du 25 mars 2025 pris en application de l'article 17 de la loi « sur les tribunaux d'aksakals »", nature: "loi", annee: 2025, source: "https://mkk.gov.kg/ru/wp-content/uploads/2025/04/порядок-регистрации-судов-аксакалов-2.pdf"}
  - {instrument: "Règlement sur le Conseil des tribunaux d'aksakals de la République kirghize, arrêté n° 01-25/47 du 25 février 2026 pris en application de l'article 42 de la loi « sur les tribunaux d'aksakals », qui abroge l'arrêté n° 01-25/298 du 15 août 2025", nature: "loi", annee: 2026, source: "https://mkk.gov.kg/ru/wp-content/uploads/2026/02/ПДФ-Буйрук-АС-Орусча.pdf"}
