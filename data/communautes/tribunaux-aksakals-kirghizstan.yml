resume: >-
  Fiche agrégée : elle couvre les tribunaux d'aksakals (tribunaux des anciens), organes sociaux non étatiques que les habitants d'un aïyl aïmak (commune rurale) ou d'une ville élisent en assemblée de citoyens du lieu de résidence pour régler des litiges entre eux par la conciliation. L'article 115 de la Constitution de 2021 reconnaît aux citoyens le droit de les créer ; ils examinent les affaires dans les limites fixées par la loi « sur les tribunaux d'aksakals », et leurs décisions sont susceptibles de recours. Le règlement type du 17 décembre 2024 les définit comme des organes fondés sur l'élection, l'autogestion et le volontariat, avec le soutien de la communauté locale ; le règlement du 25 mars 2025 organise leur enregistrement auprès des organes exécutifs de l'autogouvernement local (administration communale). Selon les données de la Cour suprême pour 2020 citées par CABAR, 795 tribunaux comptaient 4 385 membres.
