  justice_propre: {valeur: "partiel", note: "Les citoyens ont le droit de constituer des tribunaux d'aksakals, qui examinent les affaires en vue de concilier les parties, dans les limites fixées par la loi, avec recours contre leurs décisions (Constitution de 2021, article 115) ; le règlement type de 2024 les établit sur le territoire des aïyl aïmaks et des villes et leur fait rendre des décisions et des ordonnances par la persuasion et la conciliation (points 2, 3, 6 et 7), en 14 jours ouvrables (point 10). Limites : accord des parties requis pour les litiges de biens, familiaux, civils, de logement et fonciers (point 21), liste fermée de mesures (avertissement public, excuses publiques, blâme public, réparation du dommage ; point 34), recours selon le Code de procédure civile (point 35) et exécution forcée par le tribunal de district ou de ville (points 37 et 38). Selon CABAR, la loi leur attribue les litiges de biens et familiaux, y compris les violences domestiques, de rémunération du travail et d'irrigation, et les infractions mineures.", source: "https://www.constituteproject.org/constitution/Kyrgyz_Republic_2021"}
