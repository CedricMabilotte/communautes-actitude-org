effectivite: {valeur: "partielle", note: "En 2020, 795 tribunaux d'aksakals comptaient 4 385 membres selon les données de la Cour suprême ; le nombre d'affaires a augmenté jusqu'en 2018 et aucune donnée n'est disponible pour 2019 ; après décembre 2021, la décision d'un tribunal du district de Sokoulouk ordonnant à une famille de quitter son village a été déclarée illégale par le procureur de district (CABAR). En 2022, le Comité des droits de l'homme relève que leurs membres n'ont pas de connaissances juridiques et statuent selon des normes culturelles et morales traditionnelles (CCPR/C/KGZ/CO/3, paragraphe 39).", source: "https://cabar.asia/en/courts-of-elders-in-kyrgyzstan-arbitrariness-or-necessity"}
chronologie:
  - {annee: 2002, evenement: "Adoption d'une loi sur les tribunaux d'aksakals, selon CABAR."}
  - {annee: 2015, evenement: "Le Comité pour l'élimination de la discrimination à l'égard des femmes relève que les violences faites aux femmes sont portées surtout devant les tribunaux d'aksakals."}
  - {annee: 2020, evenement: "795 tribunaux d'aksakals et 4 385 membres, selon CABAR."}
  - {annee: 2021, evenement: "La nouvelle Constitution consacre les tribunaux d'aksakals à l'article 115."}
  - {annee: 2022, evenement: "Le Comité des droits de l'homme demande que les tribunaux d'aksakals respectent les garanties du procès équitable."}
  - {annee: 2024, evenement: "L'Agence d'État chargée de l'autogouvernement local lance le 5 décembre un appel à candidatures pour des tribunaux pilotes et approuve le 17 décembre le règlement type des tribunaux d'aksakals."}
  - {annee: 2025, evenement: "Arrêté du 25 mars sur l'enregistrement des tribunaux d'aksakals auprès des organes exécutifs de l'autogouvernement local ; arrêté du 15 août sur les conseils des tribunaux d'aksakals d'aïyl aïmak, de ville et de district."}
  - {annee: 2026, evenement: "Arrêté du 25 février approuvant le règlement du Conseil des tribunaux d'aksakals de la République kirghize et abrogeant l'arrêté du 15 août 2025."}
fiabilite:
  verifie:
    - "Article 115 de la Constitution de 2021 : Constitute Project."
    - "Règlement type du 17 décembre 2024 (points 2, 3, 6, 7, 10, 21, 34, 35, 37 et 38), arrêté n° 01-25/93 du 25 mars 2025 (élection en assemblée des citoyens du lieu de résidence, enregistrement auprès de l'organe exécutif local), arrêtés du 15 août 2025 et du 25 février 2026 (point 7 : abrogation du premier) : site de l'Agence d'État chargée de la fonction publique et de l'autogouvernement local."
    - "Appel à candidatures pour des tribunaux pilotes : page de l'Agence publiée le 5 décembre 2024."
    - "Paragraphes 39 et 40 de CCPR/C/KGZ/CO/3 (9 décembre 2022) et 17 et 18 de CEDAW/C/KGZ/CO/4 (11 mars 2015) : textes de l'ONU."
    - "795 tribunaux et 4 385 membres en 2020 (données de la Cour suprême), compétences, âge minimal de 50 ans des membres et affaire de Sokoulouk : CABAR."
  non_confirme:
    - "Loi « sur les tribunaux d'aksakals » en vigueur : numéro et date non lus sur le texte officiel (base de données juridique du ministère de la Justice inaccessible) ; les arrêtés de 2025 et 2026 citent ses articles 17, 38 et 42. Les compétences rapportées par CABAR peuvent relever de la loi de 2002."
    - "Entrée en vigueur de l'arrêté du 25 février 2026 : sept jours ouvrables après sa publication officielle, date de publication non vérifiée."
    - "Nombre de tribunaux après 2020 et liste officielle complète par aïyl aïmak : aucune source ouverte ; pas de tableau des sites."
    - "Date de l'article de CABAR : non indiquée sur la page consultée ; postérieur à décembre 2021."
