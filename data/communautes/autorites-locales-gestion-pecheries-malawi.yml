reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Malawi à la Convention sur la diversité biologique (mars 2019) : dans le secteur des pêches, les communautés locales sont organisées en comités de plage (Beach Village Committees) qui formulent des règlements locaux (by-laws) pour la gestion des ressources halieutiques ; le rapport cite aussi l'indice de performance communautaire du projet FISH, selon lequel ces structures de cogestion sont très faibles", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/mw-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Fisheries Conservation and Management Act 1997 (chap. 66:05), partie III, art. 7 à 9 ; art. 2 (définition de l'autorité de gestion des pêcheries) et art. 4 (agents des pêches honoraires)", nature: "loi", annee: 1997, source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
  - {instrument: "Fisheries Conservation and Management (Local Community Participation) Rules, G.N. 26/2000, prises en vertu de la loi de 1997 : comités de plage (règles 3 à 17) et associations de pêcheurs (règles 18 à 26)", nature: "loi", annee: 2000, source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les personnes engagées dans la pêche sur une plage peuvent former un comité, qui adopte sa propre constitution (statuts) et forme un sous-comité de onze membres, président, secrétaire, trésorier, leurs suppléants et cinq membres (règles 3, 7, 8 et 10 de 2000) ; les membres du bureau sont nommés agents des pêches honoraires (règle 9, art. 4 de la loi de 1997). Le directeur des pêches tranche les conflits de compétence entre comités (règle 4 (2)) et chaque comité lui remet tous les trois mois une copie de son registre des bateaux et un rapport sur les nouvelles immatriculations (règle 14).", source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La compétence d'un comité porte sur une plage déterminée (règle 4 (1) de 2000) ; nul ne pêche dans les eaux relevant d'un comité sans licence ou autorisation écrite de ce comité (règle 15), et la pêche commerciale à grande échelle y est interdite sauf autorisation écrite du directeur (règle 17). Les accords de 2018 portent sur des zones délimitées des lacs. Ces textes ne confèrent pas de propriété sur les eaux ou les rives.", source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
  ressources: {valeur: "partiel", note: "Le comité est responsable de la conservation et de la gestion des ressources halieutiques de sa zone (règle 6 (1) de 2000) ; il fait appliquer les règles sur les espèces, les tailles, les périodes de fermeture, les sanctuaires (zones fermées), les engins et les méthodes de pêche, et peut saisir bateaux et engins, à remettre sous 48 heures à un agent de protection des pêches (règle 6 (2) (d) et (f)). Il peut recommander au directeur la suspension ou l'annulation d'une licence (règle 13). L'accord de gestion peut être résilié par chacune des parties (art. 8 (2) de la loi).", source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
  consentement: {valeur: "partiel", note: "Le directeur entend le comité sur les demandes d'immatriculation et de licence de sa zone (règle 6 (3) de 2000). Sauf si c'est inutile ou impraticable, aucun plan de gestion ni règlement sur les pêches n'est pris ou modifié sans que le projet ait été transmis aux associations de pêcheurs formées par les comités (règle 21) ; il s'agit d'une consultation, non d'un consentement.", source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le conseil consultatif des pêches compte trois membres désignés par et parmi les pêcheurs commerciaux à petite échelle (art. 5 (1) (d) de la loi de 1997) ; ces sièges ne sont pas réservés aux comités de plage. Les associations de pêcheurs, à l'échelle du district, représentent la population de pêcheurs et transmettent leurs recommandations au conseil et au directeur (règles 19 et 20 de 2000).", source: "https://www.malawitradeportal.com/upload/files/fisheries_conservation_management_act_pdf_70735_.pdf"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le sixième rapport national à la CDB (2019) et la politique nationale des pêches de 2016 jugent que la gestion participative des pêches n'a pas atteint ses objectifs ; d'après l'indice de performance communautaire du projet FISH cité par le rapport, les structures de cogestion sont très faibles et leur composition ne représente ni les femmes ni toutes les catégories de personnes du secteur. Une étude de 2007 (F. Njaya, International Journal of the Commons) relève qu'autour du lac Malombe les pêcheurs ne formaient qu'environ 30 % des membres des comités, contre plus de 90 % au lac Chiuta.", source: "https://thecommonsjournal.org/articles/10.18352/ijc.21"}
chronologie:
  - {annee: 1993, evenement: "Début des programmes de gestion participative des pêches sur les lacs Malombe, Chilwa et Chiuta (1993-1995), avec formation des premiers comités de plage."}
  - {annee: 1997, evenement: "Loi sur la conservation et la gestion des pêcheries (chap. 66:05) : partie III sur la participation des communautés locales et accords de gestion des pêcheries."}
  - {annee: 2000, evenement: "Règles sur la participation des communautés locales (G.N. 26/2000) : comités de plage et associations de pêcheurs."}
  - {annee: 2016, evenement: "Politique nationale des pêches et de l'aquaculture : renforcement des régimes de gestion participative parmi ses objectifs."}
  - {annee: 2018, evenement: "Le 17 août, 36 autorités locales de gestion des pêcheries regroupant 119 comités de plage signent des accords de gestion sur des zones délimitées des lacs Malawi et Malombe."}
fiabilite:
  verifie: ["Texte de la loi de 1997 (art. 2, 4, 5, 7 à 9) et des règles G.N. 26/2000 (règles 1 à 26 et annexes), édition consolidée publiée par le Malawi Trade Portal.", "Fiche ECOLEX/FAOLEX de la loi de 1997 : accord de gestion avec l'autorité locale de gestion des pêcheries (partie III).", "Sixième rapport national à la CDB (mars 2019) : comités de plage formulant des règlements locaux ; structures de cogestion « très faibles » selon l'indice du projet FISH.", "Politique nationale des pêches et de l'aquaculture (2016, FAOLEX) : la gestion participative adoptée depuis les années 1990 n'a pas atteint ses objectifs.", "Article de Pact (3 septembre 2018) : 36 autorités locales, 119 comités, signature le 17 août 2018, lacs Malawi et Malombe.", "Njaya (2007) : programmes participatifs sur les lacs Malombe, Chilwa et Chiuta entre 1993 et 1995 ; composition des comités."]
  non_confirme: ["Pouvoir normatif : la loi de 1997 confie la préparation des plans de gestion au directeur des pêches (art. 3 (f)), avec avis du conseil consultatif (art. 6 (a)) ; l'accord de gestion « comporte » un plan de gestion (art. 8 (1)) sans dire qui l'édicte ; les règles de 2000 confient aux comités l'application des règles nationales, pas leur édiction (règle 6 (2) (d)). Le sixième rapport national à la CDB (2019) indique que les comités formulent des règlements locaux (by-laws), mais la politique nationale des pêches de 2016 range l'établissement de régimes où les communautés formulent ces règlements parmi les questions à régler. Aucun texte en vigueur attribuant ce pouvoir aux comités n'a été trouvé.", "Aucune liste officielle des 36 autorités locales et des zones couvertes par les accords de 2018 n'a été trouvée ; pas de tableau des sites.", "Le nombre total de comités de plage dans le pays, la population de pêcheurs concernée et la surface des zones délimitées n'ont pas été trouvés.", "Le texte des accords de gestion de 2018 et la procédure d'adoption des règlements locaux (par les conseils de district ou par décision ministérielle) n'ont pas été consultés.", "Une réforme de la loi de 1997 a pu intervenir après 2019 ; aucune loi nouvelle n'apparaît dans la base ECOLEX consultée."]
