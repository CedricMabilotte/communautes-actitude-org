resume: >-
  Fiche agrégée : elle couvre les communautés de pêcheurs du Malawi organisées en comités de plage (Beach Village Committees) et en autorités locales de gestion des pêcheries. La loi sur la conservation et la gestion des pêcheries de 1997 (chap. 66:05, partie III) permet au directeur des pêches de conclure avec une « autorité de gestion des pêcheries », définie comme une organisation communautaire locale, un accord de gestion qui comporte un plan de gestion (art. 8). Les règles de 2000 sur la participation des communautés locales (G.N. 26/2000) donnent à chaque comité une compétence sur une plage : avis sur les immatriculations de bateaux et les licences, application des règles sur les espèces, les tailles, les périodes de fermeture et les sanctuaires, saisie des engins. Le 17 août 2018, 36 autorités locales regroupant 119 comités ont signé des accords portant sur des zones délimitées des lacs Malawi et Malombe.
