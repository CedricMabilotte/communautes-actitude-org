resume: >-
  Fiche agrégée. Au Guyana, neuf peuples amérindiens vivent surtout dans l'intérieur du pays. La loi amérindienne de 2006 (Amerindian Act, n° 6 de 2006) confie à chaque village titré un conseil élu (Village Council), présidé par un toshao, qui détient les terres du village, en règle l'usage et fait des règles locales. Les terres de village ne peuvent être aliénées hors des cas prévus par la loi. Un conseil national des toshaos (National Toshaos Council) conseille le ministre. Le ministère des Affaires amérindiennes recense 96 communautés titrées.
reconnaissance_regionale: []
