resume: >-
  Fiche agrégée. Au Guyana, neuf peuples amérindiens vivent surtout dans l'intérieur du pays. La loi amérindienne de 2006 (Amerindian Act, n° 6 de 2006) confie à chaque village titré un conseil élu (Village Council), présidé par un toshao (chef de village élu), qui détient les terres du village, en règle l'usage et fait des règles locales. Les terres de village ne peuvent être aliénées hors des cas prévus par la loi. Un conseil national des toshaos (National Toshaos Council) conseille le ministre. Le ministère des Affaires amérindiennes recense 96 communautés titrées sur une page non datée ; huit titres ou actes de concession ont été remis en 2024. Une révision de la loi, en consultation depuis 2023, est annoncée de nouveau par le Premier ministre en septembre 2025 ; aucun nouveau texte adopté n'a été trouvé. Le village wai wai de Kanashen relève en outre d'un régime d'aire protégée (voir la fiche Aire protégée amérindienne de Kanashen).
