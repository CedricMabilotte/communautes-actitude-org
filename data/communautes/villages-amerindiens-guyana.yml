reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale relève que les décisions des conseils de village (recherche, grande mine, taxes) sont soumises à l'approbation du ministre et que les communautés sans titre n'ont pas de conseil de village (CERD/C/GUY/CO/14, § 15 et 16).", annee: 2006, source: "https://documents.un.org/api/symbol/access?s=CERD/C/GUY/CO/14&l=en&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits économiques, sociaux et culturels recommande de réviser l'Amerindian Act 2006 et de ratifier la Convention n° 169 de l'OIT ; il relève des retards dans l'octroi des titres (E/C.12/GUY/CO/2-4, § 14 à 17).", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=E/C.12/GUY/CO/2-4&l=en&t=pdf"}
  - {mecanisme: "dnudpa", detail: "Le Guyana vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Amerindian Act 2006 (loi n° 6 de 2006)", nature: "loi", annee: 2006, source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque village a un conseil composé d'un toshao et de conseillers élus (Amerindian Act 2006, art. 11 à 13) ; le conseil représente le village et en planifie le développement.", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil fait des règles sur la résidence, l'usage des terres, la faune, l'agriculture, l'ordre et le commerce (art. 14) ; une règle exige l'accord des deux tiers de l'assemblée du village, l'approbation du ministre et la publication officielle (art. 15).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  justice_propre: {valeur: "partiel", note: "Le conseil instruit les manquements à ses règles, entend la personne et peut infliger une amende ou des travaux communautaires (art. 16) ; le toshao est juge de paix d'office, sans fonction juridictionnelle (art. 21).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  terres: {valeur: "reconnu", note: "Le conseil détient pour le village les droits et titres sur les terres (art. 13) ; toute cession hors des cas prévus par la loi est nulle (art. 44) ; baux limités en surface et en durée (art. 46).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  ressources: {valeur: "partiel", note: "Les mineurs doivent négocier un tribut avec le village (art. 48 et 51) ; 20 % des redevances minières vont à un fonds pour les villages ; l'entrée et la recherche sur les terres exigent la permission du conseil (art. 5).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  consentement: {valeur: "partiel", note: "L'exploitation minière sur les terres de village exige le consentement des deux tiers de l'assemblée du village (art. 48) ; pour la grande mine, le refus peut être levé si les ministres déclarent le projet d'intérêt public (art. 50).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil peut, après consultation du village, lever des taxes sur les résidents ; la taxe est soumise au ministre, qui peut l'accepter, la refuser ou la modifier sans l'augmenter (art. 13(1) l et 18).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  representation: {valeur: "partiel", note: "Le conseil national des toshaos conseille le ministre sur les lois et politiques touchant les villages et nomme des membres de la Commission des peuples autochtones prévue par l'art. 212 S de la Constitution (art. 41 de la loi).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  statut_personnel: {valeur: "partiel", note: "Le conseil fixe par ses règles les conditions de la qualité de résident du village (art. 14(1) a).", source: "https://parliament.gov.gy/documents/acts/4680-act_no_6_of_2006.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2015, le Comité des droits économiques, sociaux et culturels relève des retards dans l'octroi des titres malgré les délais légaux, l'absence de contrôle de la mine et de l'exploitation forestière illégales dans l'intérieur, et des exceptions qui permettent l'exploitation sans consentement préalable. En 2025, l'Association des peuples amérindiens (APA) déclare devant l'Instance permanente de l'ONU que le consentement préalable n'est ni respecté ni exigé par la loi. En 2026, le conseil de district du haut Mazaruni attend depuis 2021 sa publication officielle.", source: "https://documents.un.org/api/symbol/access?s=E/C.12/GUY/CO/2-4&l=en&t=pdf"}
chronologie:
  - {annee: 1969, evenement: "Rapport de la commission des terres amérindiennes."}
  - {annee: 1976, evenement: "Amendement de la loi amérindienne de 1951 : 64 communautés reçoivent des terres."}
  - {annee: 1991, evenement: "Titres (absolute grants) pour ces communautés et dix autres."}
  - {annee: 2006, evenement: "Nouvelle loi amérindienne (Amerindian Act 2006) ; observations du Comité pour l'élimination de la discrimination raciale."}
  - {annee: 2013, evenement: "Signature du projet de titrage des terres amérindiennes (Amerindian Land Titling), financé par le fonds de la stratégie bas carbone et mis en œuvre avec le PNUD."}
  - {annee: 2015, evenement: "Le Comité des droits économiques, sociaux et culturels recommande la révision de la loi de 2006."}
  - {annee: 2023, evenement: "Lancement des consultations sur la révision de la loi amérindienne, à St Cuthbert's Mission."}
  - {annee: 2024, evenement: "Deux certificats de titre (Karasabai, Arau) et six actes de concession (Kobadia, Hotoquai, Akawini, Red Hill, Moco Moco, Sawariwau) remis."}
  - {annee: 2025, evenement: "Le Premier ministre annonce une révision complète de la loi amérindienne."}
  - {annee: 2026, evenement: "Différend sur la publication officielle du conseil de district du haut Mazaruni."}
