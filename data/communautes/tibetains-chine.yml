resume: >-
  Les Tibétains sont l'une des nationalités minoritaires reconnues par la Chine. La Région autonome du Tibet relève du système d'autonomie régionale des nationalités prévu par la Constitution (art. 4 et 112 à 122) et par la loi de 1984 sur l'autonomie régionale des nationalités, modifiée en 2001 ; la Région a été instituée en 1965. Le droit prévoit des organes d'autogouvernement, un pouvoir de réglementation soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale et l'usage des langues locales. Selon une étude universitaire de 2017, aucune des cinq régions autonomes n'a adopté de règlement d'autonomie. La loi sur la promotion de l'unité et du progrès des nationalités, en vigueur depuis le 1er juillet 2026, fait de la langue commune nationale (le mandarin) la langue de base de l'enseignement. Les préfectures et districts autonomes tibétains situés hors de la Région (Qinghai, Sichuan, Gansu, Yunnan) relèvent de la fiche « Préfectures et districts autonomes de Chine ».
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/CHN/CO/14-17, § 43-44 : liberté de circulation des Tibétains et enseignement du tibétain dans la Région autonome du Tibet", annee: 2018, source: "https://docs.un.org/fr/CERD/C/CHN/CO/14-17"}
  - {mecanisme: "organe_traite", detail: "Comité des droits économiques, sociaux et culturels, E/C.12/CHN/CO/3, § 27-28 (réinstallation des éleveurs tibétains sans consentement) et § 88-89 (internats imposés aux enfants tibétains)", annee: 2023, source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
base_nationale:
  - {instrument: "Constitution de la République populaire de Chine, art. 4 et 112 à 122", nature: "constitution", annee: 1982, source: "https://www.constituteproject.org/constitution/China_2018"}
  - {instrument: "Loi sur l'autonomie régionale des nationalités (1984, modifiée en 2001)", nature: "loi", annee: 2001, source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  - {instrument: "Loi sur la promotion de l'unité et du progrès des nationalités (2026), art. 8 (maintien du système des régions autonomes) et 15 (langue d'enseignement)", nature: "loi", annee: 2026, source: "https://www.chinalawtranslate.com/en/ethnic-unity-and-progress-law/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organes d'autogouvernement (assemblée populaire et gouvernement de la région), dont le président est un citoyen de la nationalité qui exerce l'autonomie, Constitution, art. 112 et 114 ; loi sur l'autonomie régionale, art. 17 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  pouvoir_normatif: {valeur: "conteste", note: "L'assemblée peut adopter des règlements d'autonomie et des règlements particuliers, soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale, Constitution, art. 116 ; loi sur l'autonomie régionale, art. 19 ; aucune des cinq régions autonomes n'en a adopté ; la Région autonome du Tibet a arrêté en 2001 son seizième projet de règlement d'autonomie, puis suspendu les travaux (Yang Feng, 2017).", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les organes d'autogouvernement définissent, conformément à la loi, la propriété et le droit d'usage des pâturages et des forêts, loi sur l'autonomie régionale, art. 27 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  ressources: {valeur: "partiel", note: "Gestion et protection des ressources naturelles et priorité d'exploitation dans le cadre des plans de l'État, loi sur l'autonomie régionale, art. 28 ; compensation due par l'État pour l'exploitation des ressources, art. 65 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  consentement: {valeur: "partiel", note: "La création d'une zone autonome, ses limites et son nom sont proposés après pleine consultation des représentants des nationalités concernées ; sa suppression, sa fusion ou la modification de ses limites exige la pleine consultation de ses organes d'autogouvernement, loi sur l'autonomie régionale, art. 14 (2001). Aucune obligation de consentement n'a été trouvée.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  langue: {valeur: "partiel", note: "Les organes d'autogouvernement utilisent les langues d'usage courant dans la région, la langue de la nationalité autonome pouvant être langue principale, Constitution, art. 121 ; loi sur l'autonomie régionale, art. 10, 21 et 47 (2001). La loi sur la promotion de l'unité et du progrès des nationalités (2026, art. 15) fait de la langue et de l'écriture communes nationales la langue de base de l'enseignement ; elle prévoit le respect de l'apprentissage et de l'usage des langues minoritaires.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  education: {valeur: "conteste", note: "Les organes d'autogouvernement décident, selon les orientations de l'État, des programmes et de la langue d'enseignement, loi sur l'autonomie régionale, art. 36 et 37 (2001) ; depuis le 1er juillet 2026, la langue commune nationale est la langue de base de l'enseignement dans tous les établissements, loi sur la promotion de l'unité et du progrès des nationalités, art. 15. Le Comité des droits économiques, sociaux et culturels relève la fermeture d'écoles enseignant en tibétain et un système d'internat forcé imposé aux enfants tibétains, et recommande que le mandarin ne soit pas la seule langue d'enseignement autorisée, E/C.12/CHN/CO/3, § 88 et 89 (2023).", source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
  fiscalite: {valeur: "partiel", note: "Autonomie de gestion des finances régionales dans le cadre du système financier de l'État, Constitution, art. 117 ; loi sur l'autonomie régionale, art. 32 (2001).", source: "https://www.constituteproject.org/constitution/China_2018"}
  representation: {valeur: "partiel", note: "Constitution, art. 59 : toutes les nationalités minoritaires ont droit à une représentation appropriée à l'Assemblée populaire nationale ; le texte ne fixe pas de nombre de sièges.", source: "https://www.constituteproject.org/constitution/China_2018"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le Comité pour l'élimination de la discrimination raciale (2018) relève des restrictions de circulation et un enseignement du tibétain restreint ; le Comité des droits économiques, sociaux et culturels (2023) relève la réinstallation d'éleveurs tibétains sans consentement préalable, libre et éclairé et un système d'internat imposé aux enfants tibétains (§ 27 et 88). En février 2023, trois rapporteurs spéciaux de l'ONU évaluaient à environ un million le nombre d'enfants tibétains en internat, l'enseignement s'y faisant principalement en mandarin.", source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
chronologie:
  - {annee: 1961, evenement: "Résolution 1723 (XVI) de l'Assemblée générale demandant qu'il soit mis fin aux pratiques privant le peuple tibétain de ses droits fondamentaux, notamment de son droit à l'autodétermination."}
  - {annee: 1965, evenement: "Première session de l'assemblée populaire de la Région et institution de la Région autonome du Tibet (septembre)."}
  - {annee: 1982, evenement: "La Constitution consacre l'autonomie régionale des nationalités (art. 4 et 112 à 122)."}
  - {annee: 1984, evenement: "Loi sur l'autonomie régionale des nationalités, modifiée en 2001."}
  - {annee: 2018, evenement: "Observations du Comité pour l'élimination de la discrimination raciale sur les Tibétains."}
  - {annee: 2023, evenement: "Observations du Comité des droits économiques, sociaux et culturels sur les éleveurs et les internats tibétains ; communiqué de trois rapporteurs spéciaux de l'ONU sur les internats."}
  - {annee: 2026, evenement: "L'Assemblée populaire nationale adopte le 12 mars la loi sur la promotion de l'unité et du progrès des nationalités, en vigueur le 1er juillet ; la langue commune nationale devient la langue de base de l'enseignement."}
