  - {annee: 2009, evenement: "Reprise des négociations entre les iwi et la Couronne."}
  - {annee: 2014, evenement: "Signature de l'accord Ruruku Whakatupua au marae de Ruakā, à Rānana, le 5 août ; création de la fiducie Ngā Tāngata Tiaki o Whanganui."}
  - {annee: 2017, evenement: "Te Awa Tupua (Whanganui River Claims Settlement) Act : le fleuve devient une personne juridique ; abrogation de la loi de 1988 sur le Whanganui River Trust Board (s. 120)."}
