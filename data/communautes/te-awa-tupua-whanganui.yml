effectivite: {valeur: "non_etablie", note: "La loi a été adoptée par le Parlement en mars 2017 (Radio New Zealand, 16 mars 2017). Aucune source indépendante sur le fonctionnement de Te Pou Tupua et de Te Kōpuka depuis lors n'a été trouvée.", source: "https://www.rnz.co.nz/news/te-ao-maori/326689/whanganui-river-to-gain-legal-personhood"}
