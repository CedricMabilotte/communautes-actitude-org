resume: >-
  Les iwi (peuples māori) et hapū (lignages) du fleuve Whanganui, dans l'ouest de l'île du Nord, descendent de Ruatipua, de Paerangi ou de Haunui-ā-Pāpārangi (loi de 2017, s. 8). L'accord de règlement Ruruku Whakatupua, signé avec la Couronne le 5 août 2014, a été mis en œuvre par le Te Awa Tupua (Whanganui River Claims Settlement) Act 2017. La loi fait du fleuve, des montagnes à la mer, une personne juridique, Te Awa Tupua, à qui revient la propriété du lit détenu par la Couronne. Te Pou Tupua, organe qui agit au nom du fleuve, compte deux membres, dont un désigné par les iwi ; la fiducie Ngā Tāngata Tiaki o Whanganui, créée par acte du 4 août 2014, reçoit et gère les biens du règlement pour les iwi.
