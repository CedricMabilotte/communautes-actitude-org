  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial décrit la revendication des iwi du Whanganui, le rapport du Tribunal de Waitangi de 1999 et l'ouverture de négociations en septembre 2009 en vue d'une cogestion du fleuve (A/HRC/18/35/Add.4, § 44 a ; rapport publié en anglais)", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010, à la session de l'Instance permanente (A/HRC/18/35/Add.4, § 3)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
base_nationale:
