  - {instrument: "Te Awa Tupua (Whanganui River Claims Settlement) Act 2017", nature: "accord_revendication", annee: 2017, source: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les iwi ayant des intérêts dans le fleuve désignent l'un des deux membres de Te Pou Tupua, « visage humain » du fleuve (loi de 2017, s. 18 et 20), et jusqu'à cinq des dix-sept membres au plus du groupe stratégique Te Kōpuka, les fiduciaires de Ngā Tāngata Tiaki o Whanganui en désignant un sixième (s. 29 et 32) ; Te Kōpuka élabore et approuve la stratégie Te Heke Ngahuru (s. 30).", source: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La pleine propriété des parties du lit du fleuve détenues par la Couronne est dévolue à Te Awa Tupua (loi de 2017, s. 41), et non aux iwi ; Te Pou Tupua, dont les iwi désignent un membre, exerce les fonctions de propriétaire (s. 19) ; les parties privées du lit ne sont pas touchées.", source: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
  ressources: {valeur: "partiel", note: "Les membres des iwi peuvent exercer des activités coutumières sur le fleuve : collecte de pierres, de galets, de sable et de pakohe (argilite) à des fins coutumières, pêcheries traditionnelles (pā tuna, barrages à anguilles ; utu piharau, barrages à lamproies) (loi de 2017, s. 75 et 77, sous les conditions de l'annexe 7) ; la dévolution du lit ne crée aucun droit de propriété sur l'eau ni sur la faune aquatique (s. 46).", source: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
  consentement: {valeur: "partiel", note: "Les décideurs agissant en vertu des lois listées à l'annexe 2 doivent reconnaître et prendre en compte (« recognise and provide for ») le statut de Te Awa Tupua et ses valeurs, Tupua te Kawa, et, lorsque la décision donne lieu à un document, indiquer comment (loi de 2017, s. 15) ; les iwi peuvent proposer des commissaires pour le registre Te Awa Tupua des auditions sur les autorisations environnementales, sans obligation pour les autorités d'y puiser (s. 61 et 62) ; la loi ne prévoit ni obligation de consulter les iwi ni droit de veto.", source: "https://www.legislation.govt.nz/act/public/2017/0007/latest/whole.html"}
