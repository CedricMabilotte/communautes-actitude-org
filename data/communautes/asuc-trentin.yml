resume: >-
  Fiche agrégée : elle couvre les collectivités d'habitants des frazioni du Trentin dont les biens d'uso civico (terres, forêts, pâturages et alpages appartenant en commun aux résidents) sont administrés par une ASUC, administration séparée de la commune. La loi provinciale n° 6 du 14 juin 2005 confie ces biens à un comité de trois à sept membres élu pour cinq ans par les ayants droit ; l'ASUC adopte un statut propre et dispose de l'autonomie administrative, comptable et financière ; son règlement d'exécution est le décret du président de la Province n° 6-59/Leg du 6 avril 2006. La Province exerce cette compétence en vertu de l'article 8, n° 7, du Statut spécial d'autonomie. En juin 2021, l'Association provinciale des ASUC comptait 113 domaines collectifs administrés par un comité ASUC.
