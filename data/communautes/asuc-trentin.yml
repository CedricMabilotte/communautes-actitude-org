base_nationale:
  - {instrument: "Loi provinciale de Trente n° 6 du 14 juin 2005, nouvelle discipline de l'administration des biens d'usage civique (Nuova disciplina dell'amministrazione dei beni di uso civico), texte à jour au 31 décembre 2025", nature: "loi", annee: 2005, source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  - {instrument: "Décret du président de la Province n° 6-59/Leg du 6 avril 2006, règlement d'exécution de la loi provinciale n° 6 de 2005", nature: "loi", annee: 2006, source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=14751"}
  - {instrument: "Statut spécial d'autonomie du Trentin-Haut-Adige, art. 8, n° 7 : compétence législative de la Province sur les usi civici", nature: "statut_autonomie", annee: 1972, source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  - {instrument: "Loi n° 168 du 20 novembre 2017, normes en matière de domaines collectifs, art. 1, al. 2 (entités représentatives de droit privé), à laquelle renvoie l'art. 4, al. 3, lettre a bis, de la loi provinciale n° 6 de 2005", nature: "loi", annee: 2017, source: "https://www.normattiva.it/eli/stato/LEGGE/2017/11/20/168/CONSOLIDATED"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les biens d'usage civique d'une frazione sont administrés par un comité élu par les ayants droit (loi provinciale n° 6 de 2005, art. 4, al. 3, a) ; le comité compte trois à sept membres, siège cinq ans et élit en son sein un président qui représente l'ASUC (art. 7) ; l'élection n'est valable qu'avec la participation d'au moins 40 % des ayants droit, seuil que le statut peut abaisser à 30 %, ou à 15 % au-delà de 5 000 majeurs résidents (art. 7, al. 3), et après trois scrutins sans quorum la commune reprend la gestion (art. 8, al. 2) ; en cas de violations graves de la loi ou d'impossibilité de fonctionner, le président de la Province, sur délibération conforme de la Junte provinciale, peut dissoudre le comité et nommer un commissaire (décret n° 6-59/Leg de 2006, art. 20).", source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque ASUC adopte un statut qui fixe ses organes, son fonctionnement et les formes de participation des ayants droit (loi provinciale n° 6 de 2005, art. 6, al. 3) ; le statut peut être soumis à référendum confirmatoire à la demande d'un cinquième des majeurs résidant dans la frazione (art. 6, al. 5) et la Junte provinciale peut en vérifier la conformité à la loi (art. 6, al. 4) ; un règlement de l'ASUC fixe les modalités d'exercice des droits d'usage, dans le respect de la loi (art. 2, al. 2).", source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La Province protège les droits d'usage civique comme droits inaliénables, imprescriptibles et insusceptibles d'usucapion (acquisition par possession prolongée) (loi provinciale n° 6 de 2005, art. 1, al. 1) ; l'ASUC administre les biens domaniaux d'appartenance originaire de la frazione décrits par le décret du commissaire aux usi civici (art. 6, al. 2) ; l'extinction du lien d'usage civique n'est admise qu'à titre exceptionnel et avec l'autorisation du service provincial (art. 16) ; l'expropriation pour cause d'utilité publique reste possible (art. 18, al. 4 et 5) ; le tribunal administratif régional de Trente (jugement n° 108 du 30 juin 2026) a appliqué ces dispositions pour écarter le recours de quatre ASUC contre l'expropriation de parcelles d'usage civique.", source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  ressources: {valeur: "partiel", note: "L'exercice des droits et la jouissance des biens appartiennent, selon leurs besoins, aux ménages résidant dans la frazione, en principe gratuitement (loi provinciale n° 6 de 2005, art. 2, al. 1 et 3) ; toute distribution d'argent aux ménages est interdite et les recettes vont d'abord à l'entretien et à la gestion du patrimoine (art. 2, al. 4, et art. 10) ; les changements d'usage liés à la construction ou à la transformation de bâtiments et les suspensions du lien de neuf ans ou plus exigent l'autorisation du service provincial (art. 14, al. 2, et art. 15, al. 6).", source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  consentement: {valeur: "partiel", note: "Une collectivité qui veut changer, dans un plan d'urbanisme, la destination de biens d'usage civique doit recueillir l'avis obligatoire de l'administration gestionnaire et motiver son choix au regard de cet avis (loi provinciale n° 6 de 2005, art. 18, al. 2) ; les associations les plus représentatives des administrations de biens d'usage civique donnent, sous quinze jours, un avis sur les projets de loi de la Junte et de règlement provinciaux relatifs à la gestion de l'usage civique (art. 1, al. 3 bis) ; il s'agit d'avis, sans droit de veto.", source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'ASUC a l'autonomie administrative, comptable et financière (loi provinciale n° 6 de 2005, art. 6, al. 1) ; ses ressources sont les produits du patrimoine agro-sylvo-pastoral, les rentes des biens inscrits au nom de la frazione et les contributions (art. 11, al. 1) ; elle adopte son budget sur un schéma approuvé par la Junte provinciale et le lui transmet (art. 11, al. 2 et 4) ; un fonds provincial concourt chaque année à ses charges (art. 12, al. 2) ; aucun pouvoir fiscal n'est prévu.", source: "https://www.consiglio.provincia.tn.it/_layouts/15/dispatcher/doc_dispatcher.aspx?app=clex&at_id=12402"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le tribunal administratif régional de Trente (jugement n° 108 du 30 juin 2026) a jugé le recours des ASUC de Mollaro, Priò, Segno et Tuenetto contre l'expropriation de 25, 528 et 753 m² de parcelles d'usage civique pour élargir une route desservant un centre de données à Predaia irrecevable et, en tout état de cause, non fondé ; il relève que les ASUC ont participé à la procédure et rendu leur avis en conférence de services, et que la loi provinciale n° 6 de 2005 permet ces expropriations. Le rapport de l'Association provinciale des ASUC (juillet 2021) compte 113 domaines collectifs administrés par un comité ASUC et analyse les comptes de 103 ASUC sur 110 pour 2017 à 2019 : la gestion du bois apporte en moyenne près de 4 millions d'euros par an et celle des concessions (pâturages, alpages, bâtiments, carrières) un peu moins de 3 millions, nets des coûts directs ; il relève les dégâts de la tempête Vaia d'octobre 2018, la charge administrative et l'accès limité aux contributions (20 ASUC sur 87 en ont reçu en cinq ans).", source: "https://www.demaniocivico.it/wp-content/uploads/2026/07/SENTENZA-TRENTO-1-2.pdf"}
chronologie:
  - {annee: 1927, evenement: "Loi nationale n° 1766 du 16 juin sur la réorganisation des usi civici ; le décret du commissaire prévu par l'article 42 du décret royal n° 332 de 1928 décrit les biens de chaque frazione."}
  - {annee: 1952, evenement: "Loi provinciale n° 1 du 16 septembre sur les administrations séparées des biens de frazione d'usage civique, citée par l'article 25 de la loi provinciale n° 6 de 2005."}
  - {annee: 1972, evenement: "Le Statut spécial d'autonomie attribue à la Province la compétence législative sur les usi civici (art. 8, n° 7)."}
  - {annee: 1987, evenement: "Fondation de l'Association provinciale des ASUC le 13 avril."}
  - {annee: 2002, evenement: "Loi provinciale n° 5 du 13 mars sur l'administration des biens d'usage civique, abrogée en 2005."}
  - {annee: 2005, evenement: "Loi provinciale n° 6 du 14 juin, nouvelle discipline de l'administration des biens d'usage civique."}
  - {annee: 2006, evenement: "Décret du président de la Province n° 6-59/Leg du 6 avril, règlement d'exécution."}
  - {annee: 2021, evenement: "L'Association provinciale des ASUC recense 113 domaines collectifs administrés par un comité ASUC (juin)."}
  - {annee: 2023, evenement: "La loi provinciale n° 9 du 8 août ajoute l'article 3 bis : une ASUC peut céder la place à une entité représentative de droit privé au sens de la loi nationale n° 168 de 2017, par vote de l'assemblée des ayants droit."}
  - {annee: 2026, evenement: "Le tribunal administratif régional de Trente rejette, le 30 juin (jugement n° 108), le recours de quatre ASUC contre l'expropriation de parcelles d'usage civique pour une route desservant un centre de données à Predaia."}
fiabilite:
  verifie:
    - "Articles 1 à 26 de la loi provinciale n° 6 de 2005, texte à jour au 31 décembre 2025, sur le Code provincial du Conseil de la province autonome de Trente."
    - "Articles 20 (dissolution du comité) et 29 (banque de données des biens d'usage civique) du décret n° 6-59/Leg de 2006."
    - "Article 8, n° 7, du Statut spécial d'autonomie."
    - "Parties, motifs et dispositif du jugement n° 108 du 30 juin 2026 du tribunal administratif régional de Trente (texte publié par demaniocivico.it)."
    - "Nombre et liste des 113 ASUC, surface des parcelles planifiées, nombre indicatif de 54 000 ayants droit et données financières : rapport de l'Association provinciale des ASUC, juillet 2021."
  non_confirme:
    - "Nombre d'ASUC en 2026 : plusieurs ASUC ont pu passer à une entité représentative de droit privé depuis 2023 ou revenir à la gestion communale ; aucune liste provinciale à jour trouvée."
    - "Surface totale des biens d'usage civique gérés par les ASUC : le chiffre retenu ne couvre que les parcelles soumises à un plan d'aménagement forestier ; la banque de données provinciale prévue par l'article 29 du décret de 2006 n'a pas été consultée."
    - "Population : le chiffre de 54 000 est indicatif, mêle résidents et chefs de famille et ne couvre que 87 ASUC sur 110."
    - "Nombre de villages : non trouvé. La liste de juin 2021 nomme 113 domaines ASUC, une entrée par domaine, et non des localités habitées ; certaines entrées portent un nom double (Rover-Carbonare, Mione-Corte, Laguna Mustè)."
    - "Commune de rattachement de chaque frazione : non indiquée dans la liste source ; la colonne subdivision du tableau reste vide."
    - "Inscription d'ASUC au registre ICCA ou à la base WDPA : non vérifiée."
