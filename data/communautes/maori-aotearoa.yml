resume: >-
  Peuple autochtone d'Aotearoa, 17,8 % de la population au recensement de 2023. Le Traité de Waitangi (Te Tiriti o Waitangi), signé en 1840 entre la Couronne britannique et des chefs māori, fonde leurs relations ; sa version māori garantit le tino rangatiratanga (pleine autorité) sur les terres et ressources. Le Tribunal de Waitangi, créé en 1975, examine les manquements de la Couronne aux principes du Traité. Des circonscriptions électorales māori existent au Parlement et le te reo Māori est langue officielle.
