  - {instrument: "Education and Training Act 2020, s. 10 et 201 (kura kaupapa Māori)", nature: "loi", annee: 2020, source: "https://www.legislation.govt.nz/act/public/2020/38/en/latest/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organisations d'iwi mandatées et reconnues au titre de la loi de 2004 sur les pêcheries māori (Māori Fisheries Act 2004), entités de gouvernance issues des règlements du Traité et autorités d'iwi au sens de la loi de 1991 sur la gestion des ressources (s. 35A), répertoriées par Te Puni Kōkiri ; chaque entité relève d'un iwi, sans institution commune à l'ensemble des Maoris. Voir les fiches Ngāi Tahu, Tūhoe (Te Urewera) et Iwi du fleuve Waikato.", source: "https://www.tkm.govt.nz/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Te Ture Whenua Māori Act 1993 (loi sur les terres māori) : les terres māori sont reconnues comme taonga tuku iho (bien transmis entre générations) ; la Cour foncière māori, juridiction d'enregistrement (court of record), documente leur succession et leur gestion et a pour but de maintenir ces terres entre les mains des Maoris.", source: "https://www.maorilandcourt.govt.nz/en/who-we-are"}
  ressources: {valeur: "partiel", note: "Loi de 2011 sur les zones marines et côtières (Takutai Moana) : droits coutumiers protégés (s. 51) et titre marin coutumier (s. 58), qui donne notamment le droit d'autoriser ou d'interdire certaines activités (s. 62) ; la loi modificative sanctionnée le 24 octobre 2025 exige une occupation et un usage exclusifs de 1840 à nos jours sans interruption substantielle (s. 58(1)). Voir les fiches Titre marin coutumier māori et Pêcheries coutumières māori.", source: "https://www.legislation.govt.nz/act/public/2011/3/en/latest/"}
  consentement: {valeur: "partiel", note: "« A local authority must establish and maintain processes to provide Māori with opportunities to contribute to the decision-making processes of the local authority » (Local Government Act 2002, s. 81(1)(a), version du 7 mai 2026) : obligation de consultation, sans droit de consentement.", source: "https://www.legislation.govt.nz/act/public/2002/84/en/latest/"}
  langue: {valeur: "reconnu", note: "« The Māori language is an official language of New Zealand » (Te Ture mō Te Reo Māori 2016, s. 5).", source: "https://www.legislation.govt.nz/act/public/2016/0017/latest/DLM6174518.html"}
  education: {valeur: "partiel", note: "Education and Training Act 2020 : les kura kaupapa Māori sont des écoles désignées au titre de l'article 201 qui suivent Te Aho Matua (charte pédagogique) ; le contenu de Te Aho Matua est fixé par Te Rūnanga Nui o Ngā Kura Kaupapa Māori o Aotearoa, désigné comme son gardien (s. 10). La loi modificative de 2025 a abrogé des dispositions relatives au Traité dans le système éducatif (CERD, 2025, par. 31).", source: "https://www.legislation.govt.nz/act/public/2020/38/en/latest/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "La Commission de représentation divise le pays en circonscriptions électorales māori « for the purpose of the representation of the Maori people in the House of Representatives » (Electoral Act 1993, s. 45(1), version du 1er janvier 2026) ; leur nombre reste de sept pour l'élection générale de 2026 (Stats NZ, 2024).", source: "https://www.legislation.govt.nz/act/public/1993/87/en/latest/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "En décembre 2025, le CERD relève des initiatives visant à réinterpréter le Traité et à réviser ou remplacer les références législatives à ses principes, des propositions qui affaiblissent la cogouvernance, élaborées pour la plupart sans consentement libre, préalable et éclairé des Maoris (par. 35) ; il note que seule une petite partie des terres prises a été restituée et s'inquiète de la modification de la loi Takutai Moana et de la loi de 2024 sur les autorisations accélérées (par. 37) ; il relève la suppression des circonscriptions et sièges māori dans 24 conseils locaux après les référendums locaux de 2025 (par. 41) et l'abrogation par la loi de 2025 de dispositions relatives au Traité dans l'éducation (par. 31).", source: "https://documents.un.org/api/symbol/access?s=CERD/C/NZL/CO/23-24&l=fr&t=pdf"}
chronologie:
  - {annee: 1840, evenement: "Signature du Traité de Waitangi (versions māori et anglaise)."}
  - {annee: 1975, evenement: "Treaty of Waitangi Act : création du Tribunal de Waitangi."}
  - {annee: 1993, evenement: "Electoral Act (circonscriptions māori) et Te Ture Whenua Māori Act."}
  - {annee: 2010, evenement: "La Nouvelle-Zélande soutient la DNUDPA (avril) ; visite du Rapporteur spécial (juillet)."}
  - {annee: 2011, evenement: "Loi sur les zones marines et côtières (Takutai Moana)."}
  - {annee: 2016, evenement: "Te Ture mō Te Reo Māori : le māori langue officielle."}
  - {annee: 2024, evenement: "Dissolution de l'Autorité sanitaire māori (février) ; dépôt du projet de loi sur les principes du Traité de Waitangi et marche (hīkoi) de protestation vers le Parlement (novembre)."}
  - {annee: 2025, evenement: "Abrogation de l'article 7AA de la loi Oranga Tamariki sur les enfants māori placés (sanction le 7 avril) ; rejet du projet de loi sur les principes du Traité en deuxième lecture, 112 voix contre 11 (10 avril) ; loi modifiant l'article 58 de la loi Takutai Moana (sanction le 24 octobre) ; référendums locaux : 24 des 42 conseils votent la suppression de leurs circonscriptions māori pour les élections locales de 2028 et 2031 (résultats du 17 octobre) ; observations finales du CERD (décembre)."}
  - {annee: 2026, evenement: "Révision des clauses relatives au Traité dans 18 lois, dont la loi sur les collectivités locales ; le Tribunal de Waitangi conclut à des manquements de la Couronne (rapport Te Tinihanga o Ngā Mātāpono, juillet) ; le gouvernement poursuit la révision, aucun texte n'est adopté avant l'élection générale de novembre."}
