effectivite: {valeur: "contestee", note: "En 2025, le CERD relève des initiatives visant à réinterpréter le Traité et à réviser les références législatives à ses principes sans consentement libre, préalable et éclairé des Maoris, la suppression des circonscriptions et sièges māori dans 24 conseils locaux après des référendums locaux, et l'abrogation de dispositions relatives au Traité dans la loi sur l'éducation.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/NZL/CO/23-24&l=fr&t=pdf"}
