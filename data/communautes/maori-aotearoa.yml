resume: >-
  Peuple autochtone d'Aotearoa, 17,8 % de la population au recensement de 2023. Le Traité de Waitangi (Te Tiriti o Waitangi), signé en 1840 entre la Couronne britannique et des chefs māori, fonde leurs relations ; sa version māori garantit le tino rangatiratanga (pleine autorité) sur les terres et ressources. Le Tribunal de Waitangi, créé en 1975, examine les manquements de la Couronne aux principes du Traité ; il formule des recommandations. Sept circonscriptions électorales māori élisent des députés au Parlement et le te reo Māori est langue officielle. Te Puni Kōkiri (ministère du Développement māori) recense 1 060 marae (lieux de réunion communautaires). Les régimes propres à certains iwi (groupes tribaux) font l'objet de fiches distinctes : Ngāi Tahu, Tūhoe (Te Urewera), Iwi du fleuve Waikato, Te Awa Tupua (Whanganui), Te Kāhui Tupua (Taranaki), Titre marin coutumier māori, Pêcheries coutumières māori.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande exprime en avril 2010, à l'Instance permanente, son soutien à la Déclaration des Nations Unies sur les droits des peuples autochtones, en revenant sur sa position antérieure ; le ministre des Affaires māori reconnaît alors aux Maoris un statut propre de peuple autochtone (A/HRC/18/35/Add.4, par. 3)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial sur les droits des peuples autochtones sur la situation du peuple maori (A/HRC/18/35/Add.4), après la visite du 18 au 23 juillet 2010", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/NZL/CO/23-24, adoptées le 3 décembre 2025) sur le Traité de Waitangi, les droits fonciers, l'éducation et la participation politique des Maoris (par. 31 et 35 à 42)", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=CERD/C/NZL/CO/23-24&l=fr&t=pdf"}
