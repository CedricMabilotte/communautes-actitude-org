resume: >-
  Le Gilgit-Baltistan, appelé Territoires du Nord (Northern Areas) jusqu'en 2009, est la partie nord de l'ancien État princier du Jammu-et-Cachemire administrée par le Pakistan depuis 1947-1949. Il n'est pas une province au sens de la Constitution pakistanaise. Son régime repose sur un ordre de l'exécutif fédéral : l'ordre de 2009 sur l'autonomisation et l'autogouvernance, remplacé par le Government of Gilgit-Baltistan Order 2018. Ce texte crée une assemblée élue de 33 sièges, un ministre en chef et un gouvernement propres, et des tribunaux propres ; le Premier ministre du Pakistan garde une compétence législative exclusive sur 68 matières et le Président peut modifier l'ordre par décret.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "mission_onu", detail: "Résolution 91 (1951) du Conseil de sécurité : le Groupe d'observateurs militaires des Nations unies dans l'Inde et le Pakistan (UNMOGIP), présent depuis janvier 1949, continue de surveiller le cessez-le-feu dans l'État de Jammu-et-Cachemire, dont le Gilgit-Baltistan faisait partie (§ 7) ; la résolution rappelle que le sort final de l'État sera décidé par un plébiscite libre et impartial. Le texte vise l'État dans son ensemble, pas le Gilgit-Baltistan nommément.", annee: 1951, source: "https://docs.un.org/en/S/RES/91(1951)"}
base_nationale:
  - {instrument: "Government of Gilgit-Baltistan Order, 2018 (ordre de l'exécutif fédéral qui abroge l'ordre de 2009, art. 119)", nature: "statut_autonomie", annee: 2018, source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  - {instrument: "Constitution de la République islamique du Pakistan (1973), art. 257 : relation entre le Pakistan et l'État de Jammu-et-Cachemire", nature: "constitution", annee: 1973, source: "https://www.pakistani.org/pakistan/constitution/part12.ch4.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée de 33 membres (24 élus au suffrage direct, 6 femmes et 3 technocrates élus selon le modèle des assemblées provinciales), ordre de 2018, art. 48 ; cabinet dirigé par un ministre en chef, art. 36 ; le gouverneur est nommé par le Président du Pakistan, art. 33.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée légifère sur les matières absentes de la liste législative (Third Schedule, 68 matières réservées au Premier ministre du Pakistan), ordre de 2018, art. 60 (2) ; une loi du Premier ministre l'emporte sur une loi de l'Assemblée en cas de conflit, art. 60 (4) ; le Président peut modifier l'ordre par décret, art. 116.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  justice_propre: {valeur: "partiel", note: "Cour suprême d'appel et Cour principale (Chief Court) du Gilgit-Baltistan, ordre de 2018, art. 75 et 84 ; le juge en chef de la Cour suprême d'appel et les juges de la Cour principale sont nommés par le Premier ministre du Pakistan sur avis du gouverneur, art. 75 (5) et 84 (6) ; aucun tribunal ne peut contester la validité de l'ordre, art. 118 (2) ; en janvier 2019, la Cour suprême du Pakistan a étendu sa propre compétence au territoire (HCDH, 2019, § 148).", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le pétrole, le gaz naturel, l'électricité et les grands stockages d'eau relèvent de la liste réservée au Premier ministre du Pakistan, ordre de 2018, Third Schedule, entrées 40 et 44 ; les autres ressources relèvent de la compétence résiduelle de l'Assemblée, art. 60 (2) (c).", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  consentement: {valeur: "partiel", note: "Le Premier ministre du Pakistan ne légifère sur une matière hors liste qu'après une résolution de l'Assemblée, ordre de 2018, art. 60 (5) ; le transfert de fonctions au gouvernement fédéral doit être ratifié par l'Assemblée sous 60 jours, art. 60 (7) ; aucun consentement n'est requis pour modifier l'ordre, art. 116.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  langue: {valeur: "partiel", note: "L'ourdou est la langue officielle ; l'Assemblée peut prévoir par la loi l'enseignement, la promotion et l'usage d'autres langues, ordre de 2018, art. 111 ; droit des citoyens de préserver leur langue, leur écriture et leur culture, art. 30.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  education: {valeur: "partiel", note: "L'éducation relève de la compétence résiduelle de l'Assemblée, mais les programmes, les contenus et les normes d'enseignement sont réservés au Premier ministre du Pakistan, ordre de 2018, Third Schedule, entrées 46 et 52.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds consolidé (Consolidated Fund) et budget annuel propres, ordre de 2018, art. 70 et 71 ; droits de douane, droits d'accise, impôt sur le revenu non agricole, impôt sur les sociétés et taxes sur les ventes réservés au Premier ministre du Pakistan, Third Schedule, entrées 37, 38 et 62 à 64.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  representation: {valeur: "partiel", note: "Le Conseil du Gilgit-Baltistan, présidé par le Premier ministre du Pakistan, comprend le gouverneur, six membres nommés par le Premier ministre parmi les ministres fédéraux et les parlementaires, le ministre en chef et six membres élus par l'Assemblée ; son rôle est consultatif, ordre de 2018, art. 60A (1) et (12).", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  statut_personnel: {valeur: "partiel", note: "L'ordre de 2018 définit le « citoyen » comme une personne domiciliée ou résidente au Gilgit-Baltistan et de nationalité pakistanaise, art. 2 (1) (b) ; seul ce citoyen vote, art. 48 (2). La règle du sujet d'État (State Subject Rule), qui réservait la terre aux habitants, a été abolie en 1974 (HCDH, 2019, § 149 et note 281).", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
  autodetermination_externe: {valeur: "conteste", note: "L'ordre de 2018 ne porte pas atteinte à la position du Pakistan sur le droit à l'autodétermination du peuple du Jammu-et-Cachemire « conformément aux résolutions des Nations unies », art. 115 ; la Constitution prévoit que, si le peuple de l'État choisit l'adhésion au Pakistan, la relation entre les deux sera fixée selon la volonté de ce peuple, art. 257 ; le plébiscite rappelé par la résolution 91 (1951) du Conseil de sécurité n'a pas eu lieu.", source: "https://gilgitbaltistan.gov.pk/storage/downloads/GB%20Order%202018.pdf"}
effectivite: {valeur: "partielle", note: "Le HCDH (2019) relève que l'ordre de 2018, suspendu par la Cour suprême d'appel du Gilgit-Baltistan le 20 juin 2018 puis rétabli par la Cour suprême du Pakistan le 17 janvier 2019, maintient des limites à la liberté d'association ; la Commission des droits humains du Pakistan (HRCP) écrit en mai 2018 que l'ordre réduit la liberté d'association et d'expression et laisse au Premier ministre des pouvoirs étendus. Des élections à l'Assemblée ont eu lieu le 7 juin 2026 (Dawn, 22 juin 2026).", source: "https://www.ohchr.org/Documents/Countries/IN/KashmirUpdateReport_8July2019.pdf"}
chronologie:
  - {annee: 1949, evenement: "Accord de Karachi entre le gouvernement du Pakistan et des représentants de l'Azad Jammu-et-Cachemire : l'administration des Territoires du Nord par le Pakistan est ratifiée ; un accord distinct, signé à Karachi le 27 juillet, fixe la ligne de cessez-le-feu."}
  - {annee: 1951, evenement: "Résolution 91 du Conseil de sécurité : l'UNMOGIP, présent depuis janvier 1949, continue de surveiller le cessez-le-feu."}
  - {annee: 1974, evenement: "Abolition de la règle du sujet d'État au Gilgit-Baltistan."}
  - {annee: 1999, evenement: "La Cour suprême du Pakistan ordonne d'étendre les libertés fondamentales aux Territoires du Nord."}
  - {annee: 2009, evenement: "Ordre sur l'autonomisation et l'autogouvernance : la région prend le nom de Gilgit-Baltistan ; première élection de l'Assemblée le 12 novembre."}
  - {annee: 2018, evenement: "Government of Gilgit-Baltistan Order promulgué le 22 mai ; suspendu le 20 juin par la Cour suprême d'appel du Gilgit-Baltistan."}
  - {annee: 2019, evenement: "Le 17 janvier, la Cour suprême du Pakistan rétablit l'ordre de 2018 et étend sa compétence au territoire."}
  - {annee: 2026, evenement: "Élection de l'Assemblée le 7 juin ; ministre en chef élu le 22 juin."}
fiabilite:
  verifie: ["Articles 2, 30, 33, 36, 48, 60, 60A, 70, 71, 75, 84, 111, 115, 116, 118 et 119 et Third Schedule de l'ordre de 2018 (PDF publié par le gouvernement du Gilgit-Baltistan, rubrique « Laws »).", "Article 257 de la Constitution du Pakistan.", "Résolution 91 (1951) du Conseil de sécurité.", "Rapports du HCDH sur le Cachemire de 2018 (§ 141 à 146) et de 2019 (§ 148 à 155).", "Superficie de 72 971 km² affichée par le portail officiel du Gilgit-Baltistan."]
  non_confirme: ["Le PDF officiel de l'ordre de 2018 contient un article 60A sur le Conseil du Gilgit-Baltistan : la date de cet ajout (version d'origine, Governance Reforms 2019 ou modification ultérieure) n'a pas été vérifiée.", "Texte de l'arrêt de la Cour suprême du Pakistan du 17 janvier 2019 non consulté (site inaccessible) ; son contenu est repris du rapport du HCDH de 2019.", "Population de 2023 (1 709 049 selon la publication « GB at a Glance 2024 ») non vérifiée, publication inaccessible ; la superficie diffère selon les sources (72 496 km² chez City Population).", "Le nombre de districts est passé de 10 (ordre de 2018) à 14 selon la presse ; non vérifié sur un texte officiel.", "Numéro d'ordre de l'Assemblée élue en 2026 : « quatrième » selon Wikipédia, « sixième » selon Dawn (22 juin 2026) ; non retenu.", "Aucune loi trouvée réservant la propriété foncière aux habitants (HCDH, 2019, § 149) : droit « terres » laissé sans source.", "Nombre de villages : non trouvé (résultats par mauza du recensement des mauzas de 2020 du Bureau de la statistique du Pakistan non accessibles en ligne)."]
