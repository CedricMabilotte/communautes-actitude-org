  statut_personnel: {valeur: "partiel", note: "Les tribunaux autochtones du Sarawak jugent les atteintes au droit ou à la coutume autochtone lorsque toutes les parties relèvent du même système autochtone de droit personnel, ainsi que les affaires matrimoniales ou sexuelles où une partie est native, Native Courts Ordinance 1992, s. 5.", source: "https://www.aseanlawassociation.org/wp-content/uploads/2019/11/ALA-MAL-legal-system-Part-3.pdf"}
