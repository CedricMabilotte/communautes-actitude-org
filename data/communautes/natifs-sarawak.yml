  pouvoir_normatif: {valeur: "partiel", note: "Le droit coutumier (adat) est appliqué par les tribunaux autochtones aux litiges entre natifs, Native Courts Ordinance 1992, s. 5 ; sa codification relève de l'État (Adat Iban Order 1993).", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_NATIVE%20LAWNET.pdf"}
  justice_propre: {valeur: "reconnu", note: "Tribunaux autochtones à plusieurs niveaux (tribunal du chef de village, du chef, du chef supérieur, tribunal de district) compétents pour le droit coutumier, les petits litiges civils et les litiges fonciers coutumiers entre natifs, Native Courts Ordinance 1992, s. 3 et 5 ; le chef du Majlis Adat Istiadat siège à la cour d'appel autochtone.", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_NATIVE%20LAWNET.pdf"}
  terres: {valeur: "partiel", note: "Des droits coutumiers autochtones peuvent être créés par défrichement, plantation ou occupation, Land Code, s. 5(1) ; la Cour fédérale (TR Sandah, 2016) a exclu les territoires coutumiers non cultivés (pemakai menoa, pulau galau).", source: "https://universityofmalaya-law-review.squarespace.com/lex1/a-travesty-to-native-rights-a-commentary-on-the-case-of-tr-sandah"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
