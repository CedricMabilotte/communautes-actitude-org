resume: >-
  La Constitution fédérale de Malaisie protège la « position spéciale » des natifs du Sarawak et du Sabah (art. 161A). Au Sarawak, des tribunaux autochtones (Native Courts), composés de chefs et de chefs de village, appliquent le droit coutumier (adat) entre natifs selon l'ordonnance de 1992. Le code foncier de 1957 reconnaît des droits coutumiers autochtones (Native Customary Rights, NCR) acquis par défrichement et occupation. En 2016, la Cour fédérale a jugé que ces droits ne couvrent pas les forêts non cultivées revendiquées comme territoire coutumier.
