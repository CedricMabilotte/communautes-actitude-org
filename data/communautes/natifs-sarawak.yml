  - {instrument: "Native Courts Ordinance 1992 (Sarawak)", nature: "loi", annee: 1992, source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_NATIVE%20LAWNET.pdf"}
  - {instrument: "Land Code (Cap. 81) du Sarawak, sections 5 et 6A (section 6A ajoutée en 2018), version à jour au 31 décembre 2024", nature: "loi", annee: 1957, source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_2025%20LANDCODE%20LAWNET%20%20(1).pdf"}
  - {instrument: "Director of Forest, Sarawak v TR Sandah ak Tabau, Cour fédérale, 20 décembre 2016", nature: "jurisprudence", annee: 2016, source: "https://universityofmalaya-law-review.squarespace.com/lex1/a-travesty-to-native-rights-a-commentary-on-the-case-of-tr-sandah"}
  - {instrument: "Constitution (Amendment) Act 2022 (Act A1642), art. 4 : un natif du Sarawak est un citoyen appartenant à l'un des peuples que la loi de l'État reconnaît comme autochtones ; suppression de la liste fédérale (art. 161A(7))", nature: "constitution", annee: 2022, source: "https://lom.agc.gov.my/ilims/upload/portal/akta/outputaktap/1721506_BI/Act%20A1642.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "Le droit et la coutume autochtones (adat) sont appliqués par les tribunaux autochtones aux litiges entre parties relevant du même système de droit coutumier, Native Courts Ordinance 1992, s. 5 ; les normes sont celles de la loi de l'État, les communautés n'en édictent pas.", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_NATIVE%20LAWNET.pdf"}
  justice_propre: {valeur: "partiel", note: "Quatre classes de tribunaux autochtones de premier degré (tribunal de district, tribunal du chef supérieur, tribunal du chef, tribunal du chef de village), le chef ou chef de village qui préside devant appartenir à la communauté concernée ; compétence pour le droit coutumier entre natifs, les litiges civils jusqu'à 2 000 ringgits et les terres coutumières (tribunal de district) ; le chef du Majlis Adat Istiadat (conseil des coutumes) peut siéger à la cour d'appel autochtone, Native Courts Ordinance 1992, s. 3 à 5 et composition de la cour d'appel. Ces tribunaux sont réservés aux natifs et leur compétence se limite au droit coutumier, aux petits litiges civils et aux terres coutumières.", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_NATIVE%20LAWNET.pdf"}
  terres: {valeur: "partiel", note: "Des droits coutumiers autochtones naissent du défrichement de la forêt primaire, de la plantation, de l'occupation ou de la culture, d'un cimetière ou d'un sanctuaire, ou de « toute autre méthode légale » ; ils se transmettent entre natifs, Land Code, s. 5 ; depuis 2018, un titre communal autochtone perpétuel, sans redevance et intransmissible hors de la communauté, peut être délivré pour des droits d'usage (cueillette, forêt communale) sur un domaine territorial autochtone de 500 hectares au plus, 1 000 avec l'accord du ministre et du gouvernement de l'État, s. 6A.", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_2025%20LANDCODE%20LAWNET%20%20(1).pdf"}
  ressources: {valeur: "partiel", note: "Le titre communal autochtone créé en 2018 porte sur des droits d'usage : se procurer de la nourriture, y compris par la pêche et la chasse, et exercer les droits prévus dans les forêts communales par l'ordonnance forestière de 2015 ; il ne peut être cédé à une personne extérieure à la communauté, Land Code, s. 6A.", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_2025%20LANDCODE%20LAWNET%20%20(1).pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Au Sabah et au Sarawak, une langue autochtone en usage peut être employée devant les tribunaux autochtones et pour tout code de droit et de coutume autochtones ; au Sarawak, un membre peut l'employer devant l'Assemblée législative de l'État, Constitution fédérale, art. 161(5).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Les tribunaux autochtones du Sarawak jugent les affaires de droit coutumier lorsque toutes les parties relèvent du même système de droit autochtone, ainsi que les affaires religieuses, matrimoniales ou sexuelles où une partie est native ; si les parties relèvent de communautés différentes, la coutume de la communauté de la femme s'applique, Native Courts Ordinance 1992, s. 5.", source: "https://lawnet.sarawak.gov.my/lawnet_file/Ordinance/ORD_NATIVE%20LAWNET.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Commission nationale des droits de l'homme (SUHAKAM) écrit en octobre 2025 que les codes fonciers du Sabah et du Sarawak ne reconnaissent pas de manière adéquate les droits fonciers coutumiers et que les notions de pemakai menoa (territoire coutumier), pulau galau (réserve forestière communautaire) et kawasan rayau (aire de parcours) restent non reconnues ; la Cour fédérale avait rejeté le 20 décembre 2016 (TR Sandah) une revendication de 5 639 hectares fondée sur ces notions. Au 30 septembre 2025, 938 342 hectares étaient publiés comme réserves communales autochtones et 47 443 hectares avaient reçu des titres individuels (déclaration du gouvernement de l'État).", source: "https://suhakam.org.my/2025/10/upholding-indigenous-land-rights-a-nations-test-of-justice/"}
chronologie:
  - {annee: 1957, evenement: "Code foncier du Sarawak (Cap. 81)."}
  - {annee: 1963, evenement: "Le Sarawak rejoint la Malaisie ; l'article 161A de la Constitution fédérale porte sur les natifs du Sabah et du Sarawak (réservation de terres, définition des natifs)."}
  - {annee: 1992, evenement: "Ordonnance sur les tribunaux autochtones."}
  - {annee: 2016, evenement: "Arrêt TR Sandah de la Cour fédérale sur les territoires coutumiers."}
  - {annee: 2018, evenement: "Modification du code foncier : rétablissement de « toute autre méthode légale » à la section 5 et création du domaine territorial autochtone (section 6A)."}
  - {annee: 2022, evenement: "Révision constitutionnelle (Act A1642, en vigueur le 11 février 2022) : la définition des natifs du Sarawak relève de la loi de l'État ; l'Assemblée du Sarawak ajoute les Saban, Lakiput et Berawan à la liste des natifs."}
  - {annee: 2025, evenement: "Le gouvernement du Sarawak annonce un projet de loi remplaçant l'ordonnance de 1992 sur les tribunaux autochtones, à présenter à l'Assemblée de l'État."}
