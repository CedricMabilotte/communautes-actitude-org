resume: >-
  L'article 161A de la Constitution fédérale de Malaisie (« position spéciale des natifs du Sabah et du Sarawak ») autorise la réservation de terres aux natifs ; depuis la révision constitutionnelle de 2022, la liste des peuples natifs du Sarawak relève de la loi de l'État. Au Sarawak, des tribunaux autochtones (Native Courts), présidés par des chefs et des chefs de village, appliquent le droit coutumier (adat) entre natifs selon l'ordonnance de 1992 ; un projet de refonte de ces tribunaux, approuvé dans son principe par le gouvernement de l'État, n'était pas adopté en mai 2025. Le code foncier de 1957 reconnaît des droits coutumiers autochtones (Native Customary Rights, NCR) acquis par défrichement, culture ou occupation ; depuis 2018, il permet aussi un titre communal d'usage sur un « domaine territorial autochtone » de 500 hectares au plus (1 000 avec l'accord du ministre et du gouvernement de l'État). En 2016, la Cour fédérale a jugé que les droits coutumiers ne couvrent pas les forêts non cultivées revendiquées comme territoire coutumier.
