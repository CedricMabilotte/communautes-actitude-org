  - {instrument: "Loi organique 13/1982 du 10 août, de réintégration et d'amélioration du régime foral de Navarre (LORAFNA)", nature: "loi_organique", annee: 1982, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  - {instrument: "Loi organique 7/2010 du 27 octobre, modifiant la LORAFNA", nature: "loi_organique", annee: 2010, source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2010-16435"}
  - {instrument: "Loi 28/1990 du 26 décembre, portant approbation du Convenio Económico entre l'État et la Communauté forale de Navarre", nature: "loi", annee: 1990, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1990-31117"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les institutions forales sont le Parlement ou Cortes de Navarre, le Gouvernement de Navarre ou Diputación Foral et le Président, LORAFNA, art. 10 ; le Parlement est élu au suffrage universel direct pour quatre ans, art. 15.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement représente le peuple navarrais et exerce la potestad legislativa (pouvoir de faire des lois), LORAFNA, art. 11 ; ses normes portent le nom de leyes forales (lois forales), art. 20 ; compétence exclusive sur le droit civil foral, art. 48.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  justice_propre: {valeur: "partiel", note: "Les juridictions situées en Navarre, qui relèvent du pouvoir judiciaire de l'État, jugent à toutes les instances, y compris en cassation, les affaires de droit civil foral de Navarre, LORAFNA, art. 61.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur les montes (terres boisées et pastorales) appartenant à la Communauté forale, aux communes, aux concejos et autres entités de Navarre, et sur les pâturages, LORAFNA, art. 50.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur l'agriculture, la chasse, la pêche fluviale et les aprovechamientos hidráulicos (usages de l'eau) quand les eaux coulent entièrement en Navarre, LORAFNA, art. 44 et 50 ; pour le régime minier et énergétique, la Navarre n'exerce que le développement législatif et l'exécution de la législation de base de l'État, art. 57.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  consentement: {valeur: "reconnu", note: "L'Amejoramiento ne peut être modifié unilatéralement ; toute réforme est proposée d'un commun accord par la Diputación Foral et le Gouvernement de l'Espagne, puis approuvée par le Parlement de Navarre et les Cortes Generales (Parlement espagnol), LORAFNA, art. 71.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  langue: {valeur: "partiel", note: "Le castillan est la langue officielle de la Navarre ; le basque (vascuence) est aussi langue officielle dans les zones bascophones fixées par une loi forale, LORAFNA, art. 9.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  education: {valeur: "reconnu", note: "La réglementation et l'administration de l'enseignement dans toute son extension relèvent de la compétence pleine de la Navarre, sous réserve des lois organiques et des compétences de l'État sur les diplômes, LORAFNA, art. 47.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  fiscalite: {valeur: "reconnu", note: "La Navarre peut maintenir, établir et régler son propre régime fiscal ; l'activité fiscale et financière suit le Convenio Económico, qui fixe la contribution de la Navarre aux charges générales de l'État, LORAFNA, art. 45 ; loi 28/1990, art. 1.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  representation: {valeur: "partiel", note: "Le Parlement de Navarre désigne les sénateurs revenant à la Navarre en tant que Communauté forale, LORAFNA, art. 12.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  statut_personnel: {valeur: "reconnu", note: "La condition politique de Navarrais est attribuée aux Espagnols domiciliés dans une commune de Navarre ; la condition civile forale de Navarrais est régie par la Compilation du droit civil foral (Fuero Nuevo), LORAFNA, art. 5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-20824"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité européen des régions range la Navarre, avec le Pays basque, parmi les communautés à régime foral, qui disposent d'une pleine autonomie fiscale hors droits de douane, à condition que la pression fiscale effective ne soit pas inférieure à celle du reste de l'Espagne. Le Comité d'experts de la Charte européenne des langues (rapport adopté le 18 juin 2024, § 12 et 14) relève que le basque n'est officiel que dans la zone bascophone, l'une des trois zones linguistiques de la Navarre, et demande de lever les obstacles nés de cette division.", source: "https://portal.cor.europa.eu/divisionpowers/Pages/Spain-Fiscal-Powers.aspx"}
chronologie:
