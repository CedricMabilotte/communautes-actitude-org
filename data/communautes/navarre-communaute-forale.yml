resume: >-
  La loi organique 13/1982 du 10 août, dite « Amejoramiento » (réintégration et amélioration du régime foral), fait de la Navarre une Communauté forale « avec un régime, une autonomie et des institutions propres ». Le régime foral désigne l'ordre juridique hérité des fueros (chartes et droits historiques) de l'ancien royaume, que la Constitution de 1978 protège dans sa disposition additionnelle première. Le Parlement de Navarre vote les lois forales et le budget. La Navarre lève ses propres impôts et verse à l'État une contribution fixée par un Convenio Económico (accord économique) négocié entre les deux parties. Les concejos et les corporations traditionnelles de Navarre ont leur propre fiche (« Concejos de Navarre »).
reconnaissance_regionale:
