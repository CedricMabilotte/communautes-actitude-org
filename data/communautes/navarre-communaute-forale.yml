  - {annee: 1982, evenement: "Loi organique 13/1982 du 10 août (LORAFNA), en vigueur le 16 août."}
  - {annee: 1990, evenement: "Loi 28/1990 portant approbation du Convenio Económico."}
  - {annee: 2010, evenement: "Loi organique 7/2010 : réforme des institutions, création des décrets-lois foraux, du Défenseur du peuple de Navarre et inscription de la Chambre des comptes."}
  - {annee: 2022, evenement: "Loi 22/2022 adaptant le Convenio Económico."}
fiabilite:
  verifie: ["LORAFNA, art. 1, 2, 4, 5, 9, 10, 11, 12, 15, 20, 44, 45, 47, 48, 50, 56, 61, 71 et dispositions additionnelles (BOE, texte consolidé).", "Constitution, disposition additionnelle première et disposition transitoire quatrième (BOE).", "Loi 28/1990, art. 1, et loi 22/2022, préambule (BOE).", "Population au 1er janvier 2025 et nombre de communes (INE, tableau 2884).", "Surface (Institut géographique national, tableau des communautés autonomes, révision 2025).", "Autonomie fiscale des communautés à régime foral (Comité européen des régions).", "Zones linguistiques et observations du Comité d'experts, rapport adopté le 18 juin 2024, § 12 et 14 (Conseil de l'Europe).", "Mention de la Navarre dans le rapport de la Charte publié le 24 septembre 2024 (Conseil de l'Europe)."]
  non_confirme: ["La disposition transitoire quatrième de la Constitution permet une incorporation de la Navarre au régime autonome basque après initiative du Parlement et référendum ; elle ne prévoit pas d'indépendance et n'a pas été classée comme autodétermination externe.", "La disposition additionnelle première de la LORAFNA dit que l'acceptation du régime n'implique pas la renonciation à d'autres droits originaires et historiques ; sa portée juridique est débattue.", "Les concejos et entités locales traditionnelles relèvent d'une autre fiche.", "Justice propre classée partiel : les juridictions de Navarre appartiennent au pouvoir judiciaire de l'État ; la Navarre exerce les attributions du Gouvernement de l'État en matière d'administration de la justice, LORAFNA, art. 60."]
