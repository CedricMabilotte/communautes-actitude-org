resume: >-
  La Province du Nord, à l'extrémité nord de Sri Lanka, est peuplée en 2024 de 1,28 million d'habitants, dont 89 % de Tamouls. Le 13e amendement de la Constitution et la loi sur les conseils provinciaux n° 42 de 1987, issus de l'accord indo-sri-lankais du 29 juillet 1987, créent dans chaque province un conseil élu qui adopte des statuts (lois provinciales) dans les matières de la liste provinciale ; le même amendement fait du tamoul une langue officielle, et le 16e amendement (1988) en fait la langue de l'administration dans les provinces du Nord et de l'Est. Le conseil provincial du Nord, séparé de celui de l'Est depuis le 1er janvier 2007, a été élu une seule fois, en 2013 ; aucune élection provinciale n'a eu lieu depuis 2014 dans le pays et la province est administrée par un gouverneur nommé par le président.
