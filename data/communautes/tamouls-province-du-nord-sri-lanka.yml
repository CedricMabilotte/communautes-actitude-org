  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, CCPR/C/LKA/CO/6, § 32 et 34 : accès des personnes de langue tamoule à la justice, accaparement de terres et présence militaire dans les provinces du Nord et de l'Est, réinstallation forcée de Tamouls", annee: 2023, source: "https://docs.un.org/fr/CCPR/C/LKA/CO/6"}
base_nationale:
  - {instrument: "Constitution de la République socialiste démocratique de Sri Lanka, 13e amendement (chapitre XVII A, art. 154A à 154T, huitième et neuvième annexes ; art. 18 (2))", nature: "constitution", annee: 1987, source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  - {instrument: "Constitution de la République socialiste démocratique de Sri Lanka, 16e amendement (art. 20 et 22 : langues de l'administration)", nature: "constitution", annee: 1988, source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  - {instrument: "Loi sur les conseils provinciaux n° 42 de 1987 (Provincial Councils Act)", nature: "loi", annee: 1987, source: "https://np.gov.lk/about/"}
droits:
  autogouvernement: {valeur: "conteste", note: "Conseil provincial élu et bureau des ministres responsable devant lui, art. 154A et 154F de la Constitution (1987) ; le pouvoir exécutif est exercé par un gouverneur nommé par le président, art. 154B et 154C ; aucun conseil élu depuis l'expiration du mandat issu de l'élection de 2013.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  pouvoir_normatif: {valeur: "conteste", note: "Le conseil adopte des statuts applicables à la province dans les matières de la liste I de la neuvième annexe (police, éducation, collectivités locales, logement, agriculture, santé, terres), art. 154G (1) ; faute de conseil élu, ce pouvoir n'est pas exercé par des représentants de la province.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les terres sont une matière provinciale (liste I, point 18), mais les terres domaniales restent la propriété de la République et leur aliénation se fait par le président sur avis du conseil provincial, neuvième annexe, appendice II, § 1:3.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  ressources: {valeur: "partiel", note: "Irrigation hors projets interprovinciaux, agriculture hors terres domaniales et plantations, élevage et protection de l'environnement dans la limite des lois du Parlement, liste I, points 9, 19, 20 et 37 ; impôts sur les droits miniers, point 36:18.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  consentement: {valeur: "conteste", note: "Tout projet de loi modifiant le chapitre XVII A ou la neuvième annexe, ou portant sur une matière de la liste provinciale, est soumis pour avis aux conseils provinciaux ; en cas de désaccord, il exige la majorité spéciale de l'art. 82, art. 154G (2) et (3) ; faute de conseil élu depuis le mandat issu de l'élection de 2013, cet avis n'est pas rendu par des représentants élus de la province.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  langue: {valeur: "reconnu", note: "Le tamoul est langue officielle et langue nationale, art. 18 (2) et 19 ; il est la langue de l'administration et des registres publics dans les provinces du Nord et de l'Est, art. 22 (1) dans sa rédaction issue du 16e amendement (1988).", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  education: {valeur: "partiel", note: "Écoles publiques hors écoles nationales, gestion et mutation des enseignants, liste I, point 3 et appendice III ; le ministère national de l'Éducation garde un droit d'inspection.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  fiscalite: {valeur: "partiel", note: "Taxes provinciales listées (chiffre d'affaires, droits de timbre, licences, taxes foncières), liste I, point 36 ; dotations de l'État sur recommandation de la Commission des finances, art. 154R.", source: "https://www.parliament.lk/files/pdf/constitution.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le Thesawalamai, droit coutumier des Tamouls de la péninsule de Jaffna codifié en 1707, rendu applicable par le règlement de 1806, s'applique aux Tamouls domiciliés dans la Province du Nord en matière de biens et de successions.", source: "https://en.wikipedia.org/wiki/Thesavalamai"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le Haut-Commissariat aux droits de l'homme relève en 2024 et 2025 qu'aucune élection de conseil de province prévue par le 13e amendement n'a eu lieu depuis 2014 (A/HRC/60/21, § 5) ; en mai 2026, le Centre for Policy Alternatives constate que les conseils restent administrés par des gouverneurs nommés par le gouvernement central et que la délimitation des circonscriptions exigée par la loi électorale de 2017 reste inachevée et contestée.", source: "https://www.cpalanka.org/statement-on-the-continued-delay-of-provincial-council-elections/"}
chronologie:
  - {annee: 1987, evenement: "Accord indo-sri-lankais du 29 juillet ; 13e amendement de la Constitution et loi n° 42 sur les conseils provinciaux en novembre."}
  - {annee: 1988, evenement: "Élection du conseil provincial du Nord-Est, constitué le 5 décembre ; il est dissous en juin 1990."}
  - {annee: 2006, evenement: "Arrêt de la Cour suprême du 16 octobre ; la province du Nord-Est est séparée en deux provinces le 1er janvier 2007."}
  - {annee: 2013, evenement: "Première élection du conseil provincial du Nord : 30 sièges sur 38 pour la Tamil National Alliance ; C. V. Vigneswaran ministre principal."}
  - {annee: 2017, evenement: "Loi modifiant les élections provinciales : nouveau mode de scrutin et nouvelle délimitation des circonscriptions, restée inachevée."}
  - {annee: 2025, evenement: "En août, le ministre Bimal Rathnayake annonce l'objectif d'élections provinciales au premier semestre 2026."}
  - {annee: 2026, evenement: "En mai, les élections provinciales n'ont toujours pas eu lieu."}
fiabilite:
