droits:
  autogouvernement: {valeur: "reconnu", note: "Nation tribale reconnue par l'État fédéral, gouvernée par trois pouvoirs séparés selon sa constitution ; le Congrès reconnaît le droit des nations tribales d'établir leur forme de gouvernement (25 U.S.C. 3601).", source: "https://www.cherokee.org/about-the-nation/"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Nation fait et applique ses propres lois et réglemente activités économiques, terres, environnement et faune dans sa juridiction.", source: "https://www.cherokee.org/about-the-nation/"}
  justice_propre: {valeur: "reconnu", note: "Depuis Hogner (2021), le tribunal de district de la Nation juge les affaires pénales impliquant des Autochtones dans toute la réserve ; 3 700 affaires déposées la première année.", source: "https://www.cherokeephoenix.org/news/year-old-court-case-was-milestone-for-reservation/article_890940de-b0fa-11ec-a613-3b92dc9f46d8.html"}
  terres: {valeur: "partiel", note: "La réserve est reconnue comme jamais supprimée par le Congrès (McGirt 2020, Hogner 2021) ; la reconnaissance vaut pour la compétence, la plupart des terres de la réserve n'appartenant pas à la Nation.", source: "https://www.cherokee.gov/about-the-nation/frequently-asked-questions/common-questions/"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Régime fédéral commun : consultation des gouvernements tribaux par les agences fédérales (décret 13175 de 2000), sans veto.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "partiel", note: "La loi fédérale de 1990 reconnaît le droit des nations tribales de donner un statut officiel à leurs langues (25 U.S.C. 2903) ; la Nation a un département de la langue cherokee.", source: "https://www.law.cornell.edu/uscode/text/25/2903"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "La Nation lève des impôts dans sa juridiction et dispose d'une commission fiscale ; la Cour suprême reconnaît ce pouvoir aux nations tribales (Merrion v. Jicarilla Apache Tribe, 1982).", source: "https://www.law.cornell.edu/supremecourt/text/455/130"}
  representation: {valeur: "conteste", note: "Les trois traités de la Nation affirment son droit à un délégué à la Chambre des représentants ; ce délégué n'y siège pas.", source: "https://www.cherokee.gov/our-government/delegate-to-congress/"}
  statut_personnel: {valeur: "reconnu", note: "Citoyenneté cherokee définie par la Nation ; droit des nations tribales de définir leurs membres reconnu par la Cour suprême (Santa Clara Pueblo v. Martinez, 1978).", source: "https://www.law.cornell.edu/supremecourt/text/436/49"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Après Hogner, la Nation a étendu ses tribunaux, son parquet et son service des marshals ; 90 accords de coopération policière avec les autorités locales, étatiques et fédérales.", source: "https://www.cherokeephoenix.org/news/year-old-court-case-was-milestone-for-reservation/article_890940de-b0fa-11ec-a613-3b92dc9f46d8.html"}
