droits:
  autogouvernement: {valeur: "reconnu", note: "Nation tribale reconnue par l'État fédéral, gouvernée par trois pouvoirs (législatif, exécutif, judiciaire) selon sa constitution ; le Congrès reconnaît l'autorité des nations tribales pour établir leur forme de gouvernement (25 U.S.C. 3601, 1993). Le chef principal est élu tous les quatre ans.", source: "https://www.cherokee.gov/about-the-nation"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Nation fait et applique ses propres lois et réglemente activités économiques, terres, environnement et faune dans sa juridiction ; en août 2026, elle interdit les centres de données de grande taille sur ses terres.", source: "https://www.cherokee.gov/about-the-nation"}
  justice_propre: {valeur: "reconnu", note: "Depuis Hogner v. State (2021 OK CR 4), le tribunal de district de la Nation juge les affaires pénales impliquant des Autochtones dans toute la réserve ; 3 700 affaires déposées la première année. L'État garde une compétence concurrente sur les crimes commis par des non-Autochtones contre des Autochtones (Oklahoma v. Castro-Huerta, 2022).", source: "https://www.cherokeephoenix.org/news/year-old-court-case-was-milestone-for-reservation/article_890940de-b0fa-11ec-a613-3b92dc9f46d8.html"}
  terres: {valeur: "partiel", note: "La réserve est reconnue comme jamais supprimée par le Congrès (McGirt 2020, Hogner 2021) ; la reconnaissance vaut pour la compétence. Sur environ 4,4 millions d'acres de réserve, la Nation détient environ 46 000 acres de terres restreintes, plus de 62 000 acres en fiducie (trust : propriété détenue par l'État fédéral au profit de la Nation) et plus de 5 100 acres en pleine propriété.", source: "https://www.kgou.org/indigenous-news/2026-08-10/cherokee-nation-bans-hyperscale-data-centers-on-tribally-owned-trust-lands"}
  ressources: {valeur: "partiel", note: "La loi de la Nation de 2021 sur les parcs, espaces naturels et réserves de chasse et de pêche affecte plus de 6 100 acres de terres de la Nation à la chasse, à la pêche et à la cueillette par les citoyens cherokees ; la portée se limite aux terres de la Nation.", source: "https://anadisgoi.com/index.php/government-stories/cherokee-lands-set-aside-as-hunting-fishing-and-gathering-reserves"}
  consentement: {valeur: "partiel", note: "Régime fédéral commun : consultation des gouvernements tribaux par les agences fédérales (décret 13175 de 2000), sans veto.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "partiel", note: "La loi fédérale de 1990 reconnaît le droit des nations tribales de donner un statut officiel à leurs langues (25 U.S.C. 2903) ; la Nation a un département de la langue cherokee.", source: "https://www.law.cornell.edu/uscode/text/25/2903"}
  education: {valeur: "partiel", note: "La Nation gère le lycée Sequoyah (Tahlequah), financé par le Bureau of Indian Education ; la loi fédérale de 1988 sur les écoles gérées par les nations tribales prévoit des subventions à ces écoles (25 U.S.C. 2502). La Nation gère aussi une école d'immersion en langue cherokee (de la maternelle à la 6e année).", source: "https://www.cherokee.gov/departments/education-services/sequoyah-high-school"}
  fiscalite: {valeur: "reconnu", note: "La Nation lève des impôts dans sa juridiction (carburants, plaques d'immatriculation) ; la Cour suprême reconnaît ce pouvoir aux nations tribales (Merrion v. Jicarilla Apache Tribe, 1982). L'État de l'Oklahoma impose toutefois le revenu des citoyens tribaux qui vivent et travaillent dans la réserve (Stroble, Cour suprême de l'Oklahoma, 2025).", source: "https://www.law.cornell.edu/supremecourt/text/455/130"}
  representation: {valeur: "conteste", note: "Le traité de New Echota (1835) prévoit un délégué de la Nation à la Chambre des représentants ; la déléguée désignée en 2019 n'y siège pas, faute de vote de la Chambre (page mise à jour en août 2026).", source: "https://www.cherokee.gov/our-government/delegate-to-congress/"}
  statut_personnel: {valeur: "partiel", note: "Citoyenneté cherokee définie par la Nation ; droit des nations tribales de définir leurs membres reconnu par la Cour suprême (Santa Clara Pueblo v. Martinez, 1978) ; aucune source trouvée ne fait de cette citoyenneté une condition de résidence sur la réserve.", source: "https://www.law.cornell.edu/supremecourt/text/436/49"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "En juin 2021, la Nation a déposé sa 1 000e affaire pénale devant ses tribunaux depuis McGirt, contre six par mois auparavant, et a ajouté juges, procureurs et marshals (KTUL). En 2025, la Cour suprême de l'Oklahoma confirme la compétence liée à la réserve en matière de protection de l'enfance, mais juge que McGirt ne dispense pas de l'impôt d'État sur le revenu (KOSU).", source: "https://ktul.com/news/local/cherokee-nation-files-1000th-case-in-tribal-court-since-mcgirt-ruling"}
chronologie:
  - {annee: 1838, evenement: "Déportation vers le Territoire indien (« Piste des larmes »)."}
  - {annee: 2020, evenement: "Arrêt McGirt v. Oklahoma (9 juillet) sur la réserve creek."}
  - {annee: 2021, evenement: "Hogner v. State (11 mars) : la réserve cherokee n'a jamais été supprimée."}
  - {annee: 2022, evenement: "Oklahoma v. Castro-Huerta (29 juin) : compétence pénale concurrente de l'État sur les non-Autochtones dans la réserve."}
  - {annee: 2025, evenement: "Opinion M-37084 du ministère de l'Intérieur (janvier) : la Bande unie keetoowah serait co-successeur de la réserve ; suspendue en février."}
  - {annee: 2025, evenement: "Cour suprême de l'Oklahoma : enfants domiciliés à Claremore réputés domiciliés dans la réserve (février) ; Stroble, impôt d'État sur le revenu des citoyens tribaux (juillet)."}
  - {annee: 2026, evenement: "La Cour suprême fédérale refuse d'examiner Stroble (avril) ; le ministère de l'Intérieur retire l'opinion M-37084 (mai)."}
