resume: >-
  La Nation cherokee est l'une des trois nations cherokees reconnues par l'État fédéral ; elle siège à Tahlequah (Oklahoma), où elle a été déportée en 1838. Elle a un gouvernement à trois pouvoirs (législatif, exécutif, judiciaire), une constitution, des tribunaux et une commission fiscale. Après l'arrêt McGirt v. Oklahoma de la Cour suprême (2020), la Cour d'appel pénale de l'Oklahoma juge en 2021 (Hogner v. Oklahoma) que sa réserve n'a jamais été supprimée. La Nation exerce depuis la compétence pénale sur les Autochtones (catégorie « Indiens » du droit fédéral) dans une réserve de 7 000 milles carrés.
