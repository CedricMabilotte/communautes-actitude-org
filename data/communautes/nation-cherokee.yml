reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis ont annoncé leur appui à la Déclaration en décembre 2010, après avoir voté contre en 2007.", annee: 2010, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Le rapport de mission aux États-Unis (A/HRC/21/47/Add.1) cite la déportation des Cherokees et une déclaration du chef principal de la Nation cherokee.", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
