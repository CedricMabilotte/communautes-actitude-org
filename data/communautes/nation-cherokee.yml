resume: >-
  La Nation cherokee est une nation tribale reconnue par l'État fédéral ; elle siège à Tahlequah (Oklahoma), dans le Territoire indien où les Cherokees ont été déportés en 1838. Elle figure aussi dans la fiche agrégée « Nations tribales reconnues par l'État fédéral (États-Unis) ». Elle a un gouvernement à trois pouvoirs (législatif, exécutif, judiciaire), une constitution et des tribunaux. Après l'arrêt McGirt v. Oklahoma de la Cour suprême (2020), la Cour d'appel pénale de l'Oklahoma juge en 2021 (Hogner v. State) que sa réserve n'a jamais été supprimée. La Nation exerce depuis la compétence pénale sur les Autochtones (catégorie « Indiens » du droit fédéral) dans une réserve de 7 000 milles carrés ; l'État de l'Oklahoma y garde une compétence concurrente sur les non-Autochtones (Castro-Huerta, 2022) et y lève l'impôt sur le revenu des citoyens tribaux (Stroble, 2025). La Bande unie keetoowah, autre nation cherokee reconnue, conteste que la Nation soit seule titulaire de la réserve.
