resume: >-
  Jersey est une île de la Manche, au large du Cotentin, qui forme avec Guernesey et l'île de Man les dépendances de la Couronne (« Crown Dependencies ») : elles relèvent du souverain britannique sans faire partie du Royaume-Uni. L'île est gouvernée par les États de Jersey, assemblée dont seuls les 49 membres élus votent, et par un Conseil des ministres responsable devant elle (States of Jersey Law 2005). Elle a sa législation, sa fiscalité et ses tribunaux, dont la Cour royale, et ne contribue pas au budget britannique. Le Royaume-Uni conserve la défense et les relations internationales.
