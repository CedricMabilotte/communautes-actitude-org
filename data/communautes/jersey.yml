reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur les dépendances de la Couronne de Jersey, Guernesey et l'île de Man (CCPR/C/79/Add.119), adoptées le 23 mars 2000 : examen distinct des rapports qui les concernent, le Comité salue des mesures prises à Jersey (§ 5 et 7) et adresse des recommandations aux autorités de Jersey (§ 12, 13 et 16).", annee: 2000, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/79/Add.119&l=en&t=pdf"}
