resume: >-
  La communauté du Richtersveld, d'ascendance nama, vit dans le nord-ouest du Cap-du-Nord. Le 14 octobre 2003, la Cour constitutionnelle a jugé qu'elle détenait sur la bande côtière diamantifère un droit de propriété communale selon son droit coutumier, minéraux et pierres précieuses compris, et qu'elle avait droit à sa restitution au titre de la loi de 1994 sur la restitution des droits fonciers. Un accord de règlement conclu en 2007 avec l'État et la société publique Alexkor, rendu exécutoire par décision de justice, organise la restitution de terres, le transfert à la communauté des droits miniers terrestres d'Alexkor et leur exploitation par une coentreprise avec Alexkor. Les terres sont détenues par une association de propriété communale. La communauté est aussi partie au parc national du Richtersveld, géré par un conseil de gestion conjoint, et ses terres de l'intérieur ont été transférées en 2023 au titre de la loi TRANCRAA.
  Les régimes généraux sont décrits dans les fiches « Zones rurales TRANCRAA d'Afrique du Sud » et « Terres restituées en parcs nationaux d'Afrique du Sud ».
