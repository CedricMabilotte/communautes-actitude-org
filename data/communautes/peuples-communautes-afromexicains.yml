resume: >-
  Depuis la réforme du 9 août 2019, l'article 2, apartado C (section C), de la Constitution mexicaine reconnaît les peuples et communautés afromexicains comme partie de la composition pluriculturelle de la Nation et leur étend « en lo conducente » (dans la mesure où ils s'appliquent) les droits reconnus aux peuples autochtones, afin de garantir leur libre détermination et leur autonomie. La réforme du 30 septembre 2024 en fait des sujets de droit public dotés de la personnalité juridique et d'un patrimoine propre, et leur ajoute trois droits propres : protection du patrimoine culturel, place de leurs apports dans le système éducatif, inscription dans les statistiques officielles. Le Catalogue national publié par l'Institut national des peuples autochtones (INPI) le 9 août 2024 compte 374 communautés afromexicaines, inscrites par leurs autorités avec l'accord de leur assemblée. La loi générale d'application prévue par la réforme de 2024 n'est pas adoptée début octobre 2026.
