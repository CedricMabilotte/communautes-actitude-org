  - {instrument: "Constitution politique des États-Unis mexicains, art. 2, apartados C et D (décret DOF du 30 septembre 2024)", nature: "constitution", annee: 2024, source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  - {instrument: "Loi de l'Institut national des peuples autochtones (Ley del Instituto Nacional de los Pueblos Indígenas), DOF 4 décembre 2018, art. 3", nature: "loi", annee: 2018, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LINPI.pdf"}
  - {instrument: "Loi fédérale de protection du patrimoine culturel des peuples et communautés autochtones et afromexicains, DOF 17 janvier 2022, art. 7 et 8", nature: "loi", annee: 2022, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPPCPCIA.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'apartado C (2024) étend « en lo conducente » le droit de décider des formes internes de gouvernement et d'élire les autorités selon les systèmes normatifs (apartado A, fractions I et III) ; la loi fédérale de 2022 sur le patrimoine culturel (art. 7) reconnaît les autorités des communautés afromexicaines élues selon leurs systèmes normatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Par renvoi de l'apartado C (2024), l'apartado A, fractions I et II, s'applique « en lo conducente » : application de systèmes normatifs propres dans le respect de la Constitution et des droits humains ; aucune loi d'application propre aux communautés afromexicaines.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  justice_propre: {valeur: "partiel", note: "Par le même renvoi, l'apartado A, fraction II (2024), prévoit le règlement des conflits internes selon les systèmes normatifs, avec validation par les juges selon la loi ; la portée de ce renvoi pour les communautés afromexicaines n'est pas fixée par une loi.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Par renvoi de l'apartado C, l'apartado A, fraction IX (2024), accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  consentement: {valeur: "partiel", note: "Par renvoi de l'apartado C, l'apartado A, fraction XIII (2024), impose une consultation visant le consentement ou un accord ; la loi fédérale de 2022 (art. 8) interdit l'usage du patrimoine culturel des communautés afromexicaines sans leur consentement libre, préalable et éclairé.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPPCPCIA.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'apartado C, fraction II (2024), impose l'insertion des connaissances et contributions afromexicaines dans le système éducatif national ; l'apartado A, fraction VI, prévoit par renvoi la participation à la construction des modèles éducatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  fiscalite: {valeur: "partiel", note: "Par renvoi de l'apartado C, l'apartado B, fraction II (2024), prévoit des dotations budgétaires administrées directement par les communautés ; depuis 2025, le Fonds d'apports pour l'infrastructure sociale des peuples autochtones et afromexicains (FAISPIAM), 10 % du FAIS, verse des fonds aux communautés inscrites au Catalogue national, dont l'assemblée décide des travaux.", source: "https://ciep.mx/coordinacion-fiscal-infraestructura-social-y-pueblos-indigenas-los-pendientes-que-nos-deja-el-ppef-2026/"}
  representation: {valeur: "partiel", note: "Pour l'élection fédérale de 2021, l'Institut national électoral impose aux partis quatre formules de candidatures afromexicaines à la Chambre des députés (trois en circonscription, une à la représentation proportionnelle parmi les dix premières places de la liste) ; c'est une action affirmative (mesure de rattrapage) décidée par l'Institut, sans sièges réservés.", source: "https://centralelectoral.ine.mx/2021/03/26/ine-implementara-por-primera-vez-acciones-afirmativas-en-favor-de-comunidades-afromexicanas-carla-humphrey/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le CERD (CERD/C/MEX/CO/18-21, 2019, § 16) constate l'absence d'informations sur des mesures concrètes ; Avendaño Villafuerte (2023) relève que l'apartado C renvoie aux droits autochtones « en lo conducente » sans définir de droits ni de mécanisme d'identification propres ; en octobre 2026, la loi générale prévue par la réforme de 2024 est encore à l'état d'initiative soumise à consultation.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/MEX/CO/18-21&l=fr&t=pdf"}
chronologie:
  - {annee: 1998, evenement: "L'article 16 de la Constitution de l'État d'Oaxaca mentionne la communauté afromexicaine."}
  - {annee: 2013, evenement: "La Constitution d'Oaxaca inscrit la population afromexicaine dans la composition pluriculturelle de l'État (Guerrero reconnaît le peuple afrodescendant dans sa Constitution en 2014)."}
  - {annee: 2018, evenement: "La loi de l'INPI (art. 3) reconnaît les peuples et communautés afromexicains comme sujets de droit public aux fins de l'Institut."}
  - {annee: 2019, evenement: "Ajout de l'apartado C à l'article 2 de la Constitution fédérale (DOF du 9 août) ; observations finales du CERD."}
  - {annee: 2020, evenement: "Le recensement de l'INEGI compte 2 576 213 personnes qui se reconnaissent comme afromexicaines ou afrodescendantes."}
  - {annee: 2021, evenement: "Première action affirmative de l'Institut national électoral en faveur de candidatures afromexicaines."}
  - {annee: 2022, evenement: "Loi fédérale de protection du patrimoine culturel des peuples et communautés autochtones et afromexicains (17 janvier)."}
  - {annee: 2024, evenement: "Publication du Catalogue national des peuples et communautés autochtones et afromexicains (9 août) ; réforme de l'article 2 qui fait des communautés afromexicaines des sujets de droit public (30 septembre)."}
  - {annee: 2025, evenement: "Premiers versements directs du FAISPIAM aux communautés autochtones et afromexicaines inscrites au Catalogue."}
  - {annee: 2026, evenement: "Consultation des communautés sur une initiative de loi générale des droits des peuples autochtones et afromexicains, dont un livre porte sur les peuples et communautés afromexicains."}
