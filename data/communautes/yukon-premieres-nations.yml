droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque Première Nation inscrite à l'annexe II est une entité juridique dotée d'une constitution qui fixe ses organes dirigeants, Loi sur l'autonomie gouvernementale des premières nations du Yukon (1994), art. 7 et 8.", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "Pouvoir d'édicter des textes législatifs de manière exclusive sur ses affaires internes et, au Yukon ou sur ses terres désignées, dans les domaines de l'annexe III (langue, santé, services sociaux, éducation, adoption, successions, terres), loi de 1994, art. 11 (1).", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  justice_propre: {valeur: "partiel", note: "Le pouvoir législatif en matière d'administration de la justice est subordonné à un accord particulier ou à l'échéance du délai prévu pour le conclure, loi de 1994, art. 11 (3) ; les Premières Nations peuvent fournir des services de règlement des différends hors tribunaux, annexe III, partie II, point 11.", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  terres: {valeur: "partiel", note: "L'accord-cadre de 1993 plafonne les terres visées par un règlement (terres désignées) des quatorze Premières Nations du Yukon à 41 439,81 km², plus 155,40 km² au titre de l'art. 4.3.2 (chapitre 9, art. 9.2.1) ; les droits ancestraux sur une parcelle sont réputés cédés dès l'enregistrement ou l'octroi de son titre en fief simple (art. 5.10.1).", source: "https://www.rcaanc-cirnac.gc.ca/eng/1297278586814/1542811130481"}
  ressources: {valeur: "partiel", note: "Les terres de catégorie A, au plus 25 899,88 km², comprennent la propriété des mines et minéraux (accord-cadre de 1993, art. 9.2.2) ; sur les terres de catégorie B et en fief simple, les mines et minéraux sont exclus du titre (art. 5.4.1.2 et 5.4.1.3).", source: "https://www.rcaanc-cirnac.gc.ca/eng/1297278586814/1542811130481"}
  consentement: {valeur: "partiel", note: "Les accords définitifs reconnaissent le droit des Premières Nations de participer à la gestion des ressources publiques de leurs territoires traditionnels ; en 2017, la Cour suprême a annulé l'approbation par le Yukon d'un plan d'aménagement du bassin de la Peel qui ne respectait pas le processus de l'accord (Nacho Nyak Dun). Aucun droit de refus n'est prévu.", source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/16890/1/document.do"}
  langue: {valeur: "partiel", note: "Chaque Première Nation peut légiférer sur les programmes et services destinés à ses citoyens qui se rapportent à leurs langues autochtones, loi de 1994, annexe III, partie II, point 2 ; les langues officielles du Yukon restent l'anglais et le français (Loi sur les langues, 1988).", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  education: {valeur: "partiel", note: "Pouvoir de légiférer sur les programmes et services d'éducation destinés aux citoyens qui choisissent d'en bénéficier, sauf l'agrément des services offerts hors des terres désignées, loi de 1994, annexe III, partie II, point 8.", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  fiscalite: {valeur: "partiel", note: "Pouvoir d'édicter des textes législatifs en matière de taxation dans les matières de l'annexe III, partie IV, sous réserve des restrictions de l'accord, loi de 1994, art. 11 (2).", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La constitution de chaque Première Nation comporte un code de citoyenneté ; toute personne inscrite aux termes de l'accord définitif peut devenir citoyen, loi de 1994, art. 8 (1) a) et 8 (2).", source: "https://laws-lois.justice.gc.ca/fra/lois/Y-2.6/TexteComplet.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Dans Première Nation des Nacho Nyak Dun c. Yukon (2017), la Cour suprême confirme l'annulation de l'approbation du plan de la Peel par le Yukon et renvoie les parties à l'étape 11.6.3.2 du processus prévu par les accords définitifs.", source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/16890/1/document.do"}
chronologie:
  - {annee: 1993, evenement: "Signature de l'accord-cadre définitif le 29 mai."}
  - {annee: 1994, evenement: "Lois fédérales sur le règlement des revendications et sur l'autonomie gouvernementale, sanctionnées le 7 juillet ; elles visent d'abord les accords conclus par Champagne et Aishihik, les Gwitchin Vuntut, les Nacho Nyak Dun et les Tlingits de Teslin."}
  - {annee: 1995, evenement: "Entrée en vigueur des quatre premiers accords définitifs et d'autonomie gouvernementale."}
  - {annee: 2017, evenement: "Arrêt de la Cour suprême sur le plan d'aménagement du bassin de la Peel."}
  - {annee: 2019, evenement: "Le plan d'aménagement du bassin de la Peel est approuvé par le Yukon, les Nacho Nyak Dun, les Tr'ondëk Hwëch'in, les Gwitchin Vuntut et le Conseil tribal des Gwich'in."}
  - {annee: 2024, evenement: "Le 28 mars, la Cour suprême rejette l'appel de Cindy Dickson contre la condition de résidence imposée aux conseillers par la constitution des Gwitchin Vuntut ; les juridictions inférieures avaient jugé que la Charte s'applique à cette condition mais que son art. 25 la soustrait au contrôle."}
