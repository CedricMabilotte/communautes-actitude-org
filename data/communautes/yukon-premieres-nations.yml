resume: >-
  L'accord-cadre définitif (Umbrella Final Agreement) a été signé le 29 mai 1993 par le Canada, le Yukon et le Conseil des Indiens du Yukon. Il sert de cadre aux accords définitifs et aux accords d'autonomie gouvernementale négociés par chaque Première Nation. Onze Premières Nations figurent à l'annexe II de la loi fédérale de 1994 sur l'autonomie gouvernementale : Carmacks/Little Salmon, Champagne et Aishihik, Gwitchin Vuntut, Nacho Nyak Dun, Selkirk, Ta'an Kwach'an, Tlingits de Teslin, Tr'ondëk Hwëch'in, Kluane, Kwanlin Dun et Carcross/Tagish. Chacune a une constitution, un code de citoyenneté et un pouvoir législatif ; la Loi sur les Indiens ne s'applique plus à elles ni à leurs citoyens, hors dispositions sur l'inscription (art. 17). Trois Premières Nations du Yukon (Liard, Ross River, White River) n'ont pas d'accord définitif et ne sont pas couvertes par cette fiche.
