resume: >-
  L'accord-cadre définitif (Umbrella Final Agreement) a été signé le 29 mai 1993 par le Canada, le Yukon et le Conseil des Indiens du Yukon. Il sert de cadre aux accords définitifs et aux accords d'autonomie gouvernementale négociés par chaque Première Nation. Onze Premières Nations figurent à l'annexe II de la loi fédérale de 1994 sur l'autonomie gouvernementale : Carmacks/Little Salmon, Champagne et Aishihik, Gwitchin Vuntut, Nacho Nyak Dun, Selkirk, Ta'an Kwach'an, Tlingits de Teslin, Tr'ondëk Hwëch'in, Kluane, Kwanlin Dun et Carcross/Tagish. Chacune a une constitution, un code de citoyenneté et un pouvoir législatif.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
