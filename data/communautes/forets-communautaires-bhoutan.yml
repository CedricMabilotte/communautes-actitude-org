resume: >-
  Fiche agrégée : elle couvre les groupes de gestion de forêt communautaire (Community Forest Management Groups), c'est-à-dire les groupes d'au moins cinq ménages d'une même communauté auxquels l'administration forestière confie une parcelle de la forêt domaniale. Le régime actuel vient de la loi de 2023 sur la conservation des forêts et de la nature (sections 51 à 56) et de son règlement de 2023 (sections 88 à 123). Le groupe utilise et gère les arbres et les produits forestiers non ligneux selon un plan de gestion de dix ans, adopte ses statuts et peut vendre le surplus dans le pays, à un prix plafonné ; il n'est propriétaire ni du sol ni de l'eau. En 2021, on comptait 839 forêts communautaires, 107 866 ha et 34 761 ménages membres.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Bhoutan à la Convention sur la diversité biologique : 553 forêts communautaires établies au titre de l'utilisation durable des ressources biologiques. Le plan d'action pour la biodiversité de 2009, établi par le ministère de l'Agriculture et mis en ligne par la Convention, décrivait déjà le programme (117 unités, 15 489 ha).", annee: 2016, source: "https://www.cbd.int/doc/world/bt/bt-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Forest and Nature Conservation Act of Bhutan 2023, sections 51 à 56 (forêts communautaires) et 142 à 146 (produits forestiers non ligneux)", nature: "loi", annee: 2023, source: "https://www.moenr.gov.bt/wp-content/uploads/2017/07/Forest-and-Nature-Conservation-Act-of-Bhutan-2023.pdf"}
  - {instrument: "Forest and Nature Conservation Rules and Regulations 2023, chapitre 4, sections 88 à 123 ; sections 252 à 255", nature: "loi", annee: 2023, source: "https://www.moenr.gov.bt/wp-content/uploads/2017/07/FNCRR-2023.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le groupe de gestion, d'au moins cinq ménages inscrits au registre foncier (thram) et au registre des foyers (gung) du lieu où ils sont recensés, adopte ses propres statuts (by-laws) et son président délivre les permis de récolte (règlement de 2023, sections 90, 91 à 95 et 106) ; la division forestière peut suspendre la forêt communautaire un an et le Département peut retirer au groupe ses droits (loi de 2023, section 56 ; règlement, sections 114 et 116).", source: "https://www.moenr.gov.bt/wp-content/uploads/2017/07/FNCRR-2023.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le groupe adopte des statuts et prépare le plan de gestion de dix ans qui encadre toute activité dans la forêt (loi de 2023, section 53 ; règlement, sections 95 et 101) ; le plan est soumis au chef du Département des forêts, qui l'approuve ou le renvoie pour modification (règlement, sections 97 à 99).", source: "https://www.moenr.gov.bt/wp-content/uploads/2017/07/FNCRR-2023.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire est une partie de la forêt domaniale désignée pour être gérée par une communauté locale ; ses membres n'ont aucune propriété sur le sol, l'eau, le sable, les pierres ni les matériaux de lit de rivière (loi de 2023, sections 52 et 251, définition 11) ; l'État peut reprendre la zone pour un projet d'importance nationale, et une indemnité fixée par le Département peut alors être versée au groupe (section 55).", source: "https://www.moenr.gov.bt/wp-content/uploads/2017/07/Forest-and-Nature-Conservation-Act-of-Bhutan-2023.pdf"}
  ressources: {valeur: "partiel", note: "Les membres ont l'usage et la gestion des arbres et des produits forestiers non ligneux (loi de 2023, section 52) ; le groupe couvre ses besoins en bois, vend les produits non ligneux selon le plan et peut vendre le surplus à tout acheteur dans le pays sans dépasser le tarif du comité de fixation des prix des ressources naturelles (Natural Resources Pricing Committee), après évaluation du surplus par la division forestière ; chaque arbre est marqué par le bureau de secteur forestier (Range Office) avant abattage (règlement de 2023, sections 104 à 111).", source: "https://www.moenr.gov.bt/wp-content/uploads/2017/07/FNCRR-2023.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
