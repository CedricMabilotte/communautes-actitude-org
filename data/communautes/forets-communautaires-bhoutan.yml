  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le nombre de forêts communautaires est passé d'une en 1997 à 839 en 2021 ; une étude de 2024 relève que les groupes de gestion exercent un contrôle sur le pâturage, la récolte des produits et l'accès des personnes extérieures, que le carbone de la biomasse et du sol n'y diffère pas de façon significative de celui des autres forêts et que la richesse en espèces y est plus élevée ; elle note que la propriété du carbone forestier et le partage des revenus de sa vente ne sont pas encore réglés.", source: "https://www.sciencedirect.com/science/article/pii/S2666719324000359"}
chronologie:
  - {annee: 1997, evenement: "Première forêt communautaire, avec le village de Dozam (gewog de Drametsi, district de Mongar)."}
  - {annee: 2000, evenement: "Règles de foresterie sociale intégrées au règlement sur la conservation des forêts et de la nature."}
  - {annee: 2003, evenement: "Lignes directrices pour la planification, l'établissement et la gestion des forêts communautaires."}
  - {annee: 2008, evenement: "66 unités créées dans l'année ; 117 unités et 15 489 ha au total depuis 2001."}
  - {annee: 2021, evenement: "839 forêts communautaires, 107 866 ha, 34 761 ménages."}
  - {annee: 2023, evenement: "Loi sur la conservation des forêts et de la nature (en vigueur le 24 juillet 2023), qui abroge la loi de 1995, et règlement d'application (en vigueur le 31 octobre 2023)."}
fiabilite:
  verifie:
    - "Sections 2, 4, 51 à 56, 142 à 146 et 251 (définitions 11 et 12) dans le texte de la loi de 2023 publié par le ministère de l'Énergie et des Ressources naturelles."
    - "Sections 88 à 123 et 252 à 255 du règlement de 2023 publié par le même ministère."
    - "Historique 1997-2008 (Dozam, règles de 2000, lignes directrices de 2003, 117 unités et 15 489 ha) dans le plan d'action pour la biodiversité de 2009 publié sur le site de la Convention sur la diversité biologique."
    - "553 forêts communautaires mentionnées dans le cinquième rapport national à la Convention sur la diversité biologique."
    - "Chiffres de 2021 (839 forêts, 107 866 ha, 34 761 ménages) dans Delma et al., Trees, Forests and People, 2024."
  non_confirme:
    - "Aucune liste officielle des forêts communautaires par site n'a été trouvée ; pas de tableau par site."
    - "L'année du cinquième rapport national n'est pas imprimée sur le document ; 2016 est la date du fichier publié par la Convention."
    - "Les chiffres de 2021 viennent d'une étude universitaire qui reprend les données du Département des forêts ; la statistique officielle n'a pas été consultée directement."
    - "Le nombre de personnes membres n'est pas connu : seuls les 34 761 ménages membres sont comptés."
    - "Le sort des revenus des ventes (fonds du groupe, contrôle des comptes) n'est pas précisé dans les sections consultées, hormis l'obligation de tenir des registres financiers (règlement, section 96)."
    - "Nombre de villages : non trouvé ; Delma et al. (2024) ne donnent que le nombre de groupes de gestion et de ménages."
