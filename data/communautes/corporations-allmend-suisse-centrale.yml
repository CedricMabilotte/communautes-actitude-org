resume: >-
  Fiche agrégée : elle couvre les corporations (Korporationen, Korporationsgemeinden ou Teilsamen), collectivités de droit public cantonal qui possèdent et gèrent en commun des alpages, des forêts et des terrains issus des anciens biens communaux (allmends, terres d'usage collectif). Le Code civil suisse (art. 59, al. 3) laisse les « sociétés d'allmends et autres semblables » au droit cantonal. Les constitutions d'Uri (art. 72 à 74 et 118), de Schwyz (§ 75), d'Obwald (art. 107 à 109), de Zoug (§ 11 et § 73) et de Lucerne (§ 75) les reconnaissent comme collectivités de droit public ; celles d'Uri, de Schwyz, d'Obwald et de Zoug garantissent leur patrimoine et sa gestion, sous contrôle du canton, et la loi lucernoise de 2013 leur garantit l'autonomie dans leur domaine de tâches. La qualité de membre (Korporationsbürgerrecht, droit de bourgeoisie de la corporation) se transmet en principe par filiation ; dans les corporations dites réelles du canton de Lucerne, elle est liée à la propriété d'un bien-fonds.
