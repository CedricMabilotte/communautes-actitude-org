droits:
  autogouvernement: {valeur: "reconnu", note: "Les corporations Uri et Ursern sont des collectivités autonomes de droit public qui s'organisent et s'administrent elles-mêmes selon des principes démocratiques, sous le contrôle de légalité du canton (constitution d'Uri, art. 72 et 118) ; à Schwyz, leur existence et leur autogestion sont garanties dans le cadre de l'ordre juridique (§ 75, al. 2) ; à Obwald, droit de vote et organisation sont fixés par leurs statuts, sous la surveillance du gouvernement (art. 108 et 109). La Korporation Uri a une assemblée de ses membres (Korporationsgemeinde), un conseil élu (Korporationsrat) et un exécutif (Engerer Rat).", source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1985/2_621_625_589_fga/20210921/de/html/fedlex-data-admin-ch-eli-cc-1985-2_621_625_589_fga-20210921-de-html-6.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Dans le canton de Lucerne, les corporations ont des compétences de puissance publique (hoheitliche Befugnisse) pour édicter des normes et décider dans leur domaine de tâches, dans le cadre du droit supérieur ; leurs membres votent des règlements et le Korporationsrat (conseil de la corporation) édicte des ordonnances (loi sur les corporations de 2013, § 2, al. 3, et § 3). À Uri, le droit de vote dans les affaires des corporations se règle selon le droit des corporations (constitution, art. 19) ; les lois de la Korporation Uri sont adoptées par l'assemblée des membres (Korporationsgemeinde) ou par le Korporationsrat. Ce pouvoir se limite à l'organisation, aux membres et aux biens de la corporation.", source: "https://srl.lu.ch/app/de/texts_of_law/170"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le patrimoine des corporations est garanti (constitution d'Uri, art. 73) ; à Zoug, le bien corporatif doit être conservé comme bien indivisible (§ 73, al. 2) ; à Lucerne, le patrimoine est propriété de la corporation et sa substance ne peut être répartie en propriété entre les membres (loi de 2013, § 5, al. 2) ; à Schwyz, les corporations administrent et utilisent leurs biens de façon autonome (§ 75, al. 3). La vente de terrains reste possible : à Obwald, la constitution encadre la vente de biens-fonds (art. 107, al. 3).", source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1894/2_278_126_278_fga/20240927/de/html/fedlex-data-admin-ch-eli-cc-1894-2_278_126_278_fga-20240927-de-html-1.html"}
  ressources: {valeur: "partiel", note: "À Uri, la régale des mines (droit exclusif de l'État sur le sous-sol) appartient au canton, sous réserve du droit des corporations d'accorder des droits de cristallier (Strahlerrechte) et des concessions d'exploitation de minerais et de carrières sur leur territoire d'allmend (constitution, art. 57, al. 2) ; les régales du sel, de la chasse et de la pêche reviennent au canton (art. 56). À Obwald, les droits antérieurs des corporations sur les régales sont réservés (art. 38). Selon la Korporation Uri, elle accorde aussi des droits d'eau sur les cours d'eau et lacs qui ne sont pas expressément réservés au canton. Les corporations d'Uri disposent du droit d'exproprier (constitution, art. 32, al. 2).", source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1985/2_621_625_589_fga/20210921/de/html/fedlex-data-admin-ch-eli-cc-1985-2_621_625_589_fga-20210921-de-html-6.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "À Obwald, l'administration de leur patrimoine et la disposition de son revenu sont garanties aux corporations (constitution, art. 107, al. 2) ; à Zoug, sous la haute surveillance de l'État (§ 11, al. 1). La loi d'organisation de la Korporation Uri de 1937 range « la perception d'impôts de corporation » parmi les compétences de l'assemblée (art. 9, lettre d). À Zoug, la constitution excepte les communes corporatives (Korporationsgemeinden) des communes qui lèvent l'impôt (§ 74, al. 1). Selon l'association des corporations d'Obwald citée par la SVBK, les corporations n'ont pas de souveraineté fiscale et sont imposées comme toute entreprise.", source: "https://www.korporation.ch/rb/101.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le droit de bourgeoisie de la corporation (Korporationsbürgerrecht) s'acquiert par filiation ou adoption, ou par admission (loi de la Korporation Uri du 6 mai 2007, art. 2 et 5 ; loi lucernoise de 2013, §§ 6 à 8) ; à Lucerne, il suppose le droit de cité de la commune (§ 6, al. 2). À Uri, seuls les membres domiciliés sur le territoire de la corporation votent à l'assemblée (loi d'organisation de 1937, art. 3) et, selon la corporation, ont droit à l'usage des biens. Ce statut ne confère que des droits au sein de la corporation.", source: "https://www.korporation.ch/rb/140.1.pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Dictionnaire historique de la Suisse (2008) indique que, dans la plupart des cantons, les corporations ont un statut de collectivité de droit public avec garantie de propriété et une large autonomie. Selon la Fédération suisse des bourgeoisies et corporations (SVBK), qui les représente, le canton de Schwyz comptait 81 corporations en 2025, propriétaires d'environ la moitié de la surface cantonale, et le canton de Lucerne en compte 81 ; les corporations Uri et Ursern possèdent au moins 85 % de la surface du canton d'Uri. Selon la Korporation Uri, son assemblée se réunit tous les deux ans à Altdorf.", source: "https://hls-dhs-dss.ch/fr/articles/010262/"}
chronologie:
  - {annee: 1814, evenement: "La corporation de l'Oberallmeind se sépare du district et du canton de Schwyz."}
  - {annee: 1882, evenement: "Les biens communaux de basse altitude de l'Oberallmeind sont attribués en propriété à 13 Genossamen (communautés d'ayants droit) des paroisses."}
  - {annee: 1888, evenement: "La révision totale de la constitution d'Uri sépare les corporations Uri et Ursern du canton et en fait des collectivités de droit public dotées d'une législation propre."}
  - {annee: 1902, evenement: "La constitution d'Obwald sépare les bourgeoisies et les corporations."}
  - {annee: 1907, evenement: "Le Code civil suisse (art. 59, al. 3) laisse les sociétés d'allmends au droit cantonal ; il entre en vigueur en 1912."}
  - {annee: 1937, evenement: "Loi sur l'organisation de la Korporation Uri."}
  - {annee: 1968, evenement: "Constitution d'Obwald : corporations, Teilsamen et Alpgenossenschaften reconnues comme institutions de droit public (art. 107)."}
  - {annee: 1980, evenement: "Adoption du § 73 de la constitution de Zoug sur les communes corporatives (en vigueur en 1982)."}
  - {annee: 1984, evenement: "Nouvelle constitution d'Uri (art. 72 à 74 et 118)."}
  - {annee: 2007, evenement: "Constitution de Lucerne (§ 75) ; la Korporation Uri cesse de faire perdre le droit de bourgeoisie aux femmes par le mariage (loi du 6 mai 2007)."}
  - {annee: 2010, evenement: "Constitution de Schwyz (§ 75)."}
  - {annee: 2014, evenement: "Entrée en vigueur de la loi lucernoise sur les corporations (1er juillet)."}
