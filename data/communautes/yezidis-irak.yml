reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale prend note de la décision n° 92 de 2014 qualifiant de génocide les crimes de Daech contre les Yézidis (par. 3 k), relève, d'après le Haut-Commissariat aux droits de l'homme, que Daech a pu commettre un génocide contre la communauté yézidie (par. 17 a), nomme les Yézidis parmi les groupes frappés par la violence armée et le déplacement (par. 17 d), traite des femmes yézidies victimes du conflit (par. 23), relève le risque d'apatridie des enfants yézidis (par. 35) et juge le système de quotas électoraux insuffisant pour les minorités (par. 25-26).", annee: 2019, source: "https://docs.un.org/en/CERD/C/IRQ/CO/22-25"}
