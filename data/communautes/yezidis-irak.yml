resume: >-
  Les Yézidis sont une communauté religieuse de langue kurde (kurmandji), établie surtout dans le district de Sinjar et à Cheikhan, où se trouve le sanctuaire de Lalish, dans le nord de l'Irak.
  La Constitution de 2005 les nomme parmi les groupes dont la liberté religieuse est garantie (art. 2). La loi électorale leur réserve un siège au Conseil des représentants, élu à Ninive.
  Dans la région du Kurdistan, la loi n° 5 de 2015 sur la protection des composantes les reconnaît comme composante religieuse, rend leurs fêtes officielles pour eux et prévoit leur participation aux institutions dans les zones où ils vivent.
