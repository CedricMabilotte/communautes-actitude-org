  - {instrument: "Loi n° 5 de 2015 de la région du Kurdistan sur la protection des composantes", nature: "loi", annee: 2015, source: "http://www.iraqicivilsociety.org/wp-content/uploads/2015/08/A-Reading-for-the-Law-of-Protecting-Components-in-Kurdistan-english.pdf"}
  - {instrument: "Loi n° 8 de 2021 sur les survivantes yézidies (réparations individuelles)", nature: "loi", annee: 2021, source: "https://minorityrights.org/communities/yezidis/"}
