  representation: {valeur: "reconnu", note: "Art. 49 de la Constitution de 2005 : représentation de toutes les composantes du peuple au Conseil des représentants ; la loi électorale réserve aux Yézidis un siège à Ninive sur les neuf sièges de minorités (élections de novembre 2025). Dans la région du Kurdistan, l'art. 6 de la loi n° 5 de 2015 prévoit la participation des composantes aux pouvoirs exécutif et législatif et aux institutions administratives des zones où elles vivent.", source: "https://shafaq.com/en/Report/Iraq-s-2025-Elections-Minority-quota-under-spotlight"}
  statut_personnel: {valeur: "partiel", note: "Art. 41 de la Constitution de 2005 : chacun est libre de suivre le statut personnel (règles de mariage, divorce, héritage) de sa religion, de sa confession ou de ses croyances, selon une loi ; la loi d'application n'a pas été trouvée.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le CERD juge en 2019 que le système de quotas ne permet pas une représentation des minorités proportionnelle à leur poids (par. 25). Minority Rights Group relève que la loi de 2021 sur les survivantes est appliquée avec lenteur et que vingt camps de déplacés, habités surtout par des Yézidis, restaient ouverts en 2026 ; Shafaq News compte jusqu'à 360 000 Yézidis encore déplacés en 2025.", source: "https://minorityrights.org/communities/yezidis/"}
chronologie:
  - {annee: 2005, evenement: "La Constitution nomme les Yézidis parmi les groupes dont la liberté religieuse est garantie (art. 2)."}
  - {annee: 2014, evenement: "Offensive de Daech sur Sinjar ; le Conseil des ministres qualifie de génocide les crimes commis contre les Yézidis et d'autres minorités (décision n° 92)."}
  - {annee: 2015, evenement: "Loi n° 5 de la région du Kurdistan sur la protection des composantes."}
  - {annee: 2019, evenement: "Observations finales du CERD sur l'Irak."}
  - {annee: 2020, evenement: "Accord sur Sinjar entre Bagdad et Erbil (9 octobre), signé en présence de la représentante spéciale du Secrétaire général, qui le salue ; il porte sur l'administration, les services et la sécurité du district, sans droit propre aux Yézidis."}
  - {annee: 2021, evenement: "Loi n° 8 sur les survivantes yézidies (réparations, logement, emploi public)."}
  - {annee: 2022, evenement: "Décision du Conseil des ministres du 12 décembre : titres de propriété individuels sur les logements de onze complexes de Sinjar et de la plaine de Ninive."}
  - {annee: 2025, evenement: "Élections au Conseil des représentants : un siège réservé aux Yézidis à Ninive."}
fiabilite:
  verifie: ["Art. 2, 41, 43, 49 et 125 de la Constitution (Constitute Project).", "Art. 1 (Yézidis nommés parmi les composantes religieuses), 4 et 6 de la loi kurde n° 5 de 2015, d'après la traduction anglaise publiée par Iraqi Civil Society.", "Par. 3 k), 17, 25-26 et 35 de CERD/C/IRQ/CO/22-25 (2019).", "Siège réservé à Ninive en 2025 (Shafaq News).", "Décision du Conseil des ministres du 12 décembre 2022 et onze complexes (Shafaq News, déclaration conjointe avec l'ONU du 4 janvier 2023).", "Accord sur Sinjar du 9 octobre 2020 et présence de la représentante spéciale (S/2020/1099, par. 25 et 47)."]
  non_confirme: ["Numéro et article de la loi électorale fédérale fixant le siège yézidi : texte non consulté.", "La décision de 2022 donne des titres individuels, non collectifs : droit « terres » laissé non établi.", "Art. 4, cinquième, de la loi kurde n° 5 de 2015 : les fêtes des composantes sont des jours fériés officiels pour elles ; fait non rattaché à un droit de la grille.", "En 2015, les quotas du Parlement de la région du Kurdistan visaient les chrétiens, les Turkmènes et les Arméniens, pas les Yézidis (lecture d'Iraqi Civil Society) ; situation postérieure non vérifiée.", "Art. 41 de la Constitution : application aux Yézidis non vérifiée.", "La loi kurde n° 5 de 2015 protège la langue maternelle des composantes (art. 3, huitième) ; la langue des Yézidis étant le kurde, langue officielle de la région, le droit « langue » n'a pas été retenu.", "Gestion des affaires religieuses yézidies par un organe d'État (art. 43 de la Constitution, dotations religieuses) : non vérifiée.", "Population : 500 000 avant 2014 selon Minority Rights Group, 500 000 à 550 000 selon Shafaq News en 2025 ; aucun recensement.", "Endonyme « Êzidî » : forme kurmandji usuelle, non vérifiée sur une source primaire.", "L'Irak a voté pour la DNUDPA en 2007 mais ne reconnaît pas les Yézidis comme peuple autochtone : mécanisme non retenu. L'accord sur Sinjar n'a pas été conclu sous l'égide de l'ONU : mécanisme non retenu."]
