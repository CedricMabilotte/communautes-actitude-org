  terres: {valeur: "partiel", note: "Art. 63 de la Constitution de 2010 : les terres communautaires appartiennent aux communautés identifiées par l'ethnie ou la culture, y compris les terres ancestrales et celles occupées traditionnellement par des chasseurs-cueilleurs. Aucun titre collectif ogiek n'a été délivré ; la Cour africaine l'a ordonné en 2022 et constate en 2025 qu'il ne l'est pas.", source: "https://www.constituteproject.org/constitution/Kenya_2010?lang=en"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Art. 56 de la Constitution de 2010 : programmes d'action positive pour que les minorités et groupes marginalisés participent et soient représentés dans la gouvernance ; l'art. 260 range parmi les « communautés marginalisées » les communautés autochtones vivant d'une économie de chasse ou de cueillette. Aucun siège réservé.", source: "https://www.constituteproject.org/constitution/Kenya_2010?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "La Cour africaine constate le 4 décembre 2025 que le Kenya n'a pas exécuté ses arrêts de 2017 et 2022 : indemnités non versées, terres ancestrales non délimitées ni titrées, fonds de développement non créé. Le Rapporteur spécial de l'ONU signale en juin 2025 des délimitations foncières engagées dans l'est de Mau sans consultation des Ogiek.", source: "https://www.african-court.org/afchpr/african-court-on-human-and-peoples-rights-issues-new-orders-to-kenya-over-non-compliance-in-the-ogiek-case/"}
chronologie:
  - {annee: 1974, evenement: "Classement de la forêt de Mau en forêt nationale ; expulsion des Ogiek sans consultation ni indemnisation, selon le Rapporteur spécial de l'ONU (2007)."}
  - {annee: 2001, evenement: "Avis légal n° 142 du 8 octobre : déclassement de 35 301 ha de l'est de la forêt de Mau pour des programmes d'installation."}
  - {annee: 2010, evenement: "Nouvelle Constitution : terres communautaires (art. 63) et communautés marginalisées (art. 260)."}
  - {annee: 2012, evenement: "La Commission africaine saisit la Cour africaine (requête 006/2012)."}
  - {annee: 2016, evenement: "Adoption de la loi sur les terres communautaires (n° 27 de 2016)."}
  - {annee: 2017, evenement: "Arrêt de la Cour africaine sur le fond (26 mai)."}
  - {annee: 2022, evenement: "Arrêt de la Cour africaine sur les réparations (23 juin)."}
  - {annee: 2023, evenement: "Expulsion de plus de 700 familles ogiek à Sasimwani, dans la forêt de Mau (novembre)."}
  - {annee: 2024, evenement: "Le Tribunal de l'environnement et des terres de Nakuru juge valide le déclassement de 2001 et les titres des personnes installées dans l'est de Mau, et se déclare sans compétence pour faire exécuter la décision africaine (30 septembre, Tonui c. Kenya Forest Service)."}
  - {annee: 2024, evenement: "Audience de la Cour africaine sur l'exécution ; le Kenya reçoit 90 jours à compter du 12 novembre pour rendre compte des mesures prises."}
  - {annee: 2025, evenement: "Début des opérations de délimitation foncière dans l'est de Mau (25 avril) ; titre de 250 000 acres sur la forêt de Maasai Mau délivré au comté de Narok (6 mai)."}
  - {annee: 2025, evenement: "Déclaration du Rapporteur spécial de l'ONU (4 juin)."}
  - {annee: 2025, evenement: "Le Tribunal de l'environnement et des terres rejette une requête ogiek sur l'installation dans des villages de l'est de Mau (août)."}
  - {annee: 2025, evenement: "La Cour africaine constate la non-exécution de ses arrêts et ordonne au Kenya de les exécuter sans délai (4 décembre)."}
fiabilite:
  verifie: ["Dispositif de l'arrêt de 2022 et rappel de l'arrêt de 2017 (site de la Cour africaine).", "Décision du 4 décembre 2025 sur l'exécution (communiqué de la Cour africaine).", "Déclaration du Rapporteur spécial du 4 juin 2025 (OHCHR) et A/HRC/60/29, par. 39.", "Paragraphes sur les Ogiek : Rapporteur spécial 2007, CCPR 2012 et 2021, CERD 2017.", "Jugement du 30 septembre 2024 du Tribunal de l'environnement et des terres (Kenya Law).", "Texte des art. 56, 63 et 260 de la Constitution.", "Le Kenya s'est abstenu lors du vote de la DNUDPA en 2007 (A/61/PV.107)."]
  non_confirme: ["Aucun instrument national ne nomme les Ogiek : la fiche repose sur des droits constitutionnels attribués à des catégories (communautés, communautés marginalisées).", "Population : chiffre du recensement de 2019 lu dans une encyclopédie et chez Peace Brigades International, site du Bureau national de la statistique inaccessible ; d'autres sources donnent 20 000 à 50 000.", "Une ONG (IPRI, 2026) cite un jugement du 30 mai 2024 (Ngusilo c. Kenya) favorable au titre collectif ; texte non trouvé.", "Rejet d'août 2025 : connu par un article de presse (Nation), jugement non consulté.", "Texte de la loi sur les terres communautaires non consulté ; existence attestée par le Comité des droits de l'homme (2021).", "Surface : celle du complexe forestier de Mau, pas d'un territoire ogiek délimité ; année de la mesure non indiquée par la source.", "Nombre de villages : non trouvé.", "Nombre de lieux : sans objet, aucun site enregistré sous un régime propre.", "Ogiek du mont Elgon : non visés par les arrêts de la Cour africaine ; situation non documentée dans la fiche."]
