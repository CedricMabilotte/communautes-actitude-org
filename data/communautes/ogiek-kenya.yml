resume: >-
  Les Ogiek sont un peuple de chasseurs-cueilleurs et d'apiculteurs des forêts de Mau et du mont Elgon ; le recensement de 2019 en compte environ 52 600.
  Le 26 mai 2017, la Cour africaine des droits de l'homme et des peuples a jugé que leur expulsion de la forêt de Mau violait sept articles de la Charte africaine.
  Le 23 juin 2022, elle a ordonné au Kenya de délimiter leurs terres ancestrales et de leur délivrer un titre collectif, de les reconnaître comme peuple autochtone et de créer un fonds de développement communautaire ; le 4 décembre 2025, elle a constaté que ces mesures n'étaient pas exécutées.
  En droit kenyan, ils relèvent des dispositions générales de la Constitution de 2010 sur les terres communautaires et les communautés marginalisées.
  Les régimes généraux sont décrits dans les fiches « Terres communautaires enregistrées du Kenya » et « Forêts communautaires du Kenya ».
reconnaissance_regionale:
  - {mecanisme: "cour_africaine", detail: "Arrêt sur le fond du 26 mai 2017 (requête 006/2012, Commission africaine c. Kenya) : violation des art. 1, 2, 8, 14, 17(2)-(3), 21 et 22 de la Charte africaine (rappel dans l'arrêt sur les réparations de 2022).", annee: 2017, source: "https://www.african-court.org/cpmt/storage/app/uploads/public/62b/aba/fd8/62babafd8d467689318212.pdf"}
  - {mecanisme: "cour_africaine", detail: "Arrêt sur les réparations du 23 juin 2022 : identifier, délimiter, borner et titrer les terres ancestrales ogiek sous deux ans (par. 116) ; reconnaissance comme peuple autochtone sous douze mois (par. 126) ; consultation et consentement libre, préalable et éclairé (par. 144-145) ; fonds de développement communautaire (par. 155) ; indemnisation de 57 850 000 KES pour préjudice matériel (par. 77).", annee: 2022, source: "https://www.african-court.org/cpmt/storage/app/uploads/public/62b/aba/fd8/62babafd8d467689318212.pdf"}
  - {mecanisme: "cour_africaine", detail: "Décision du 4 décembre 2025 sur l'exécution : indemnités non versées, identification, délimitation et titrage collectif des terres ancestrales non achevés, consultation insuffisante, fonds de développement communautaire non créé ; la Cour ordonne l'exécution sans délai.", annee: 2025, source: "https://www.african-court.org/afchpr/african-court-on-human-and-peoples-rights-issues-new-orders-to-kenya-over-non-compliance-in-the-ogiek-case/"}
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial Rodolfo Stavenhagen décrit l'expulsion des Ogiek de la forêt de Mau classée en 1974 et l'absence de reconnaissance comme groupe distinct (A/HRC/4/32/Add.3, par. 37-38).", annee: 2007, source: "https://docs.un.org/en/A/HRC/4/32/Add.3"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme relève les expulsions des Ogiek de la forêt de Mau et demande que l'inventaire de leurs droits fonciers repose sur leur consentement libre et éclairé (CCPR/C/KEN/CO/3, par. 24).", annee: 2012, source: "https://docs.un.org/fr/CCPR/C/KEN/CO/3"}
  - {mecanisme: "organe_traite", detail: "Le CERD demande de reconnaître juridiquement les droits collectifs des Sengwer, des Endorois et des Ogiek sur leurs terres, ressources et territoires (CERD/C/KEN/CO/5-7, par. 19-20).", annee: 2017, source: "https://docs.un.org/fr/CERD/C/KEN/CO/5-7"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme demande la publication des recommandations de l'équipe spéciale chargée de l'exécution de l'arrêt de la Cour africaine sur les Ogiek de Mau, et la mise en œuvre de la loi de 2016 sur les terres communautaires (CCPR/C/KEN/CO/4, par. 50-51).", annee: 2021, source: "https://docs.un.org/fr/CCPR/C/KEN/CO/4"}
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial Albert K. Barume demande le 4 juin 2025 l'arrêt immédiat des opérations de délimitation foncière engagées le 25 avril 2025 dans l'est de la forêt de Mau, qui menacent les droits de plus de 8 500 Ogiek de Nessuit, Mariashoni et Sururu.", annee: 2025, source: "https://www.ohchr.org/en/press-releases/2025/06/kenya-un-expert-urges-immediate-halt-land-demarcation-violating-ogiek-rights"}
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial range l'arrêt en faveur des Ogiek parmi trois décisions régionales « still unimplemented » (non appliquées) (A/HRC/60/29, par. 39).", annee: 2025, source: "https://docs.un.org/en/A/HRC/60/29"}
base_nationale:
