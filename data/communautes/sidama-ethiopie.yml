resume: >-
  Les Sidama sont une « nation, nationalité et peuple » au sens de la Constitution fédérale éthiopienne, dans le sud du pays.
  Ils formaient une zone de l'État régional des nations, nationalités et peuples du Sud.
  Après un référendum tenu le 20 novembre 2019 sur le fondement de l'article 47, le Conseil de cet État a approuvé en juin 2020 la constitution de la Sidama en État régional, le dixième de la fédération.
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme note la reconnaissance du droit des communautés ethniques et linguistiques à l'autodétermination au niveau de l'État régional, selon le fédéralisme ethnique de la Constitution (CCPR/C/ETH/CO/1, par. 26). Vise la catégorie, pas les Sidama nommément.", annee: 2011, source: "https://docs.un.org/en/CCPR/C/ETH/CO/1"}
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale note l'attribution de sièges parlementaires aux groupes minoritaires et leur reconnaissance dans la Constitution (CERD/C/ETH/CO/7-16, par. 9).", annee: 2009, source: "https://docs.un.org/en/CERD/C/ETH/CO/7-16"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme relève que de nombreuses constitutions des États régionaux ne confèrent des droits qu'aux groupes ethniques dominants et en écartent les minorités ; il demande leur mise en conformité avec l'article 25 de la Constitution fédérale (CCPR/C/ETH/CO/2, par. 45-46). Ne nomme pas les Sidama.", annee: 2022, source: "https://docs.un.org/en/CCPR/C/ETH/CO/2"}
base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 5, 39, 47, 50, 52, 61, 78 et 97", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 39(3) : droit de chaque nation, nationalité et peuple à l'autogouvernement et à ses propres institutions ; art. 47(2)-(3) : droit de former son propre État. Région Sidama constituée en juin 2020.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(2)(b) : chaque État adopte et applique sa propre constitution et ses lois.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  justice_propre: {valeur: "reconnu", note: "Art. 50(2) : les États détiennent le pouvoir judiciaire ; art. 78(5) : les Conseils des États peuvent créer ou reconnaître des tribunaux religieux et coutumiers.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  terres: {valeur: "partiel", note: "Art. 40(3) : la terre appartient à l'État et aux peuples d'Éthiopie, propriété commune des nations, nationalités et peuples, inaliénable ; art. 52(2)(d) : les États l'administrent selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "partiel", note: "Art. 43(2) de la Constitution fédérale : les nationaux ont le droit d'être consultés sur les politiques et projets qui touchent leur communauté ; aucune obligation de consentement.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 5(3) de la Constitution fédérale : chaque État membre fixe par la loi sa langue de travail ; art. 39(2) : droit de parler, écrire et développer sa langue. Le sidaamu afoo est une des langues de travail officielles de l'État régional sidama (mémoire de l'université d'Addis-Abeba, 2020) ; la constitution régionale de 2020 n'a pas été consultée.", source: "https://etd.aau.edu.et/items/2f44a85f-9b3c-4c3e-aaac-b782af4d9d97"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 97 : les États lèvent l'impôt sur le revenu des salariés de l'État et des entreprises privées, les redevances d'usufruit foncier et d'autres impôts.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 61(2) : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération (chambre haute), plus un par million d'habitants ; art. 39(3) : représentation équitable aux niveaux régional et fédéral.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) : droit inconditionnel à l'autodétermination, y compris la sécession (séparation d'avec l'État), par vote aux deux tiers du conseil législatif puis référendum organisé par l'État fédéral dans les trois ans. Jamais exercé à ce jour par les Sidama.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "effective", note: "Le Rift Valley Institute (2023) constate la formation de l'État Sidama en 2020, l'attribution de la ville multiethnique de Hawassa à la Région et un accès accru des Sidama aux transferts fédéraux et à la représentation ; il juge les bénéfices pour la population « difficiles à évaluer » et rapporte que les autorités régionales ont refusé d'adopter un cadre juridique de protection des minorités demandé par la Commission électorale. Le Comité des droits de l'homme (2022) exprime une préoccupation générale sur les constitutions régionales qui excluent les minorités.", source: "https://riftvalley.net/wp-content/uploads/2023/03/RVI-2023.03.21-Referendum-in-Ethiopias-Southern-Region.pdf"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale (art. 39 et 47)."}
  - {annee: 2018, evenement: "Le 18 juillet, le Conseil de la zone Sidama demande la création d'un État régional."}
  - {annee: 2019, evenement: "Le 20 novembre, référendum organisé par la Commission électorale nationale. Résultats définitifs du 4 décembre : 97,7 % pour la création de l'État, 98,9 % de participation, 248 097 votes annulés dans 164 bureaux pour irrégularités."}
  - {annee: 2020, evenement: "Mi-juin (session d'urgence d'un mercredi, rapportée le 18 juin), le Conseil de l'État régional du Sud approuve la constitution de la zone Sidama en État régional, le dixième de la fédération."}
  - {annee: 2022, evenement: "Le Comité des droits de l'homme de l'ONU s'inquiète des constitutions régionales qui ne confèrent des droits qu'aux groupes dominants."}
  - {annee: 2023, evenement: "La création de la Région Sidama est suivie de celles du Sud-Ouest (fiche « Peuples du Sud-Ouest éthiopien ») et d'Éthiopie du Sud (fiche « Peuples d'Éthiopie du Sud »)."}
fiabilite:
  verifie: ["Texte des art. 5, 39, 40, 47, 50, 52, 61, 78 et 97 de la Constitution (Constitute Project).", "Date et résultat définitif du référendum (communiqué de la Commission électorale du 4 décembre 2019 reproduit en annexe du rapport de l'European Institute of Peace).", "Paragraphe 26 de CCPR/C/ETH/CO/1 (2011), paragraphe 9 de CERD/C/ETH/CO/7-16 (2009), paragraphes 45-46 de CCPR/C/ETH/CO/2 (2022).", "Population recensée en 2007 par district (City Population, d'après le Service éthiopien de statistique)."]
  non_confirme: ["La reconnaissance onusienne vise la catégorie « nations, nationalités et peuples », non les Sidama nommément.", "Langue de travail adoptée par la Région Sidama et contenu de sa constitution régionale : non vérifiés.", "Taux du « oui » : 98,51 % selon l'annonce préliminaire du 23 novembre 2019, 97,7 % selon les résultats définitifs ; la page « Referendum » de la Commission électorale indique 98,9 %, chiffre qui correspond à la participation.", "Date exacte de la décision du Conseil de l'État régional du Sud : Borkena (18 juin 2020) la situe un mercredi, soit le 17 juin 2020 ; d'autres sources retiennent le 18 juin.", "Découpage actuel de la Région (quatre zones et la ville de Hawassa) : non vérifié sur un texte officiel ; le chiffre de 24 woredas date de 2019.", "Surface : 6 538,17 km² selon une source secondaire citant le recensement de 2007, non lue sur la source primaire.", "Nombre de villages : non trouvé.", "Septième élection générale (2026) : tenue et résultats dans la Région Sidama non vérifiés.", "Affrontements à la limite entre les régions Sidama et Oromia en 2022 et en mai 2026 : rapportés par la presse (Borkena), sans bilan établi."]
