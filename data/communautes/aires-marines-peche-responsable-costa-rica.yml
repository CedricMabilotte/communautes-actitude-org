effectivite: {valeur: "partielle", note: "Une analyse juridique du Consortium TICCA (2024) relève que les 13 aires fonctionnent en pratique comme une gouvernance partagée mais ne sont reconnues que par décret exécutif et non par une loi, que les pêcheurs de l'aire de Dominicalito n'ont pas de sécurité juridique sur l'espace marin et côtier qu'ils occupent, et qu'à Barra del Colorado l'accès à la pêche à la crevette passe par des licences de recherche. Depuis 2024, deux lois citent les aires parmi les espaces où des activités ouvrent droit à un paiement pour services écosystémiques (loi 10507, art. 3, qui ajoute l'article 36 bis à la loi de pêche 8436 ; loi 10533 sur le Fonds bleu) ; elles ne règlent pas la gouvernance des aires.", source: "https://www.iccaconsortium.org/wp-content/uploads/2024/10/analisis-legal-de-los-territorios-de-vida-marino-costeros-en-mesoamerica.pdf"}
chronologie:
  - {annee: 2008, evenement: "La Junta Directiva de l'INCOPESCA adopte le règlement AJDIP/138-2008 sur l'établissement des aires marines de pêche responsable (4 avril)."}
  - {annee: 2009, evenement: "Publication du décret exécutif 35502-MAG (La Gaceta n° 191, 1er octobre) ; création de l'aire de Palito, île de Chira (accord AJDIP/315-2009, La Gaceta du 20 novembre)."}
  - {annee: 2010, evenement: "Création de l'aire du golfe Dulce (accord AJDIP/191-2010, 11 juin)."}
  - {annee: 2011, evenement: "Création de l'aire de Tárcoles (accord AJDIP/193-2011, 27 mai)."}
  - {annee: 2012, evenement: "Création des aires de Puerto Níspero et d'Isla Caballo ; extension de l'aire de Palito vers Montero (accord AJDIP/154-2012)."}
  - {annee: 2013, evenement: "Création des aires de San Juanillo et d'Isla Venado."}
  - {annee: 2014, evenement: "Création des aires de Paquera-Tambor et de Costa de Pájaros."}
  - {annee: 2018, evenement: "Création de l'aire de Dominicalito (accord AJDIP/219-2018)."}
  - {annee: 2019, evenement: "Création de l'aire de Barra del Colorado, première sur la côte caraïbe, à la demande de deux associations de pêcheurs et de pêcheuses (accord AJDIP/549-2019)."}
  - {annee: 2021, evenement: "Décret exécutif 42955-MAG (La Gaceta n° 83 du 30 avril) : déclaration d'intérêt public du modèle de développement de la pêche artisanale porté par l'alliance public-privé pour la pêche à petite échelle dans les aires marines de pêche responsable et les territoires marins de vie."}
  - {annee: 2021, evenement: "Création des aires 201 (accord AJDIP/224-2021) et Papagayo (accord AJDIP/255-2021)."}
  - {annee: 2024, evenement: "La loi 10507 (La Gaceta n° 158 du 28 août) crée le Fonds de paiement pour services écosystémiques marins et côtiers ; elle cite la récupération de la biomasse halieutique dans les aires marines de pêche responsable parmi les activités rémunérées. La loi 10533 (La Gaceta n° 188 du 9 octobre) crée le Fonds bleu et cite aussi ces aires."}
  - {annee: 2025, evenement: "Règlement de la loi 10507 (décret exécutif 45141, La Gaceta n° 153 du 19 août)."}
  - {annee: 2026, evenement: "Le Conseil national des aires de conservation approuve le plan général de gestion de l'aire marine de gestion de Barra del Colorado (résolution R-SINAC-CONAC-0002-2026 du 10 février, La Gaceta n° 55 du 20 mars) ; son zonage tient compte de l'aire marine de pêche responsable du même nom et le contrôle y revient à l'aire de conservation et à l'INCOPESCA."}
  - {annee: 2026, evenement: "Le ministère de l'Environnement publie le manuel du programme pilote de paiement pour services écosystémiques destiné à la pêche artisanale (résolution 586 du 18 septembre, La Gaceta n° 179 du 23 septembre) : cent pêcheurs regroupés dans au plus dix organisations, dans les aires de pêche responsable et les aires protégées marines du golfe de Nicoya ; les organisations choisissent les participants et retiennent 12 % des paiements pour leurs frais (art. 4 et 5)."}
fiabilite:
  verifie:
    - "Texte du décret 35502-MAG (art. 1 à 16) dans la version publiée par l'INCOPESCA."
    - "Liste des 13 aires et accords de création, lus sur les pages de l'INCOPESCA (consultées en octobre 2026)."
    - "Surfaces de Puerto Níspero (2,6 km²), d'Isla Caballo (1,48 km²) et de Costa de Pájaros (1 056 ha) lues dans les accords de création."
    - "Mention des aires dans le cinquième rapport national à la CDB (2014), tableau 16."
    - "Décret 35502-MAG toujours en vigueur au 6 octobre 2026 : le système national de législation en vigueur (SINALEVI) le donne en version 1 de 1, sans norme modificatrice."
    - "Textes des lois 10507 (2024) et 10533 (2024), du décret 45141 (2025) et des résolutions R-SINAC-CONAC-0002-2026 et 586-2026, lus sur SINALEVI."
    - "Aucun accord de création ou de suppression d'aire postérieur à 2021 trouvé sur SINALEVI ni sur la page de l'INCOPESCA (13 aires listées en octobre 2026)."
  non_confirme:
    - "Composition de la commission de suivi : le décret (art. 11) prévoit des représentants de l'INCOPESCA et un représentant de la communauté de pêcheurs ; la présentation de l'INCOPESCA (2020) indique un représentant de l'INCOPESCA, un du SINAC (système national des aires de conservation) et deux des pêcheurs, sans citer le texte qui aurait modifié l'article 11 ; SINALEVI ne recense aucune modification du décret."
    - "Surface totale : chiffre arrondi « plus de 1 500 km² » de 2020, antérieur à la création des aires 201 et Papagayo."
    - "Nombre de pêcheurs et d'organisations membres : aucun chiffre agrégé trouvé."
    - "Fonctionnement actuel des commissions de suivi et remise des rapports semestriels prévus à l'article 13."
    - "Population : non trouvé."
    - "Nombre de villages : non trouvé."
    - "Veille de presse 2025-2026 : non faite par recherche générale ; seuls les sites officiels (SINALEVI, INCOPESCA) et les sources déjà citées ont été consultés."
    - "Mise en œuvre du programme pilote de paiement (résolution 586-2026) et des fonds créés par les lois 10507 et 10533 dans les aires : aucune donnée trouvée."
