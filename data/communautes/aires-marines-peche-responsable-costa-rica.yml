effectivite: {valeur: "partielle", note: "Une analyse juridique du Consortium TICCA (2024) relève que les 13 aires fonctionnent en pratique comme une gouvernance partagée mais ne sont reconnues que par décret exécutif et non par une loi, que les pêcheurs de l'aire de Dominicalito n'ont pas de sécurité juridique sur l'espace marin et côtier qu'ils occupent, et qu'à Barra del Colorado l'accès à la pêche à la crevette passe par des licences de recherche.", source: "https://www.iccaconsortium.org/wp-content/uploads/2024/10/analisis-legal-de-los-territorios-de-vida-marino-costeros-en-mesoamerica.pdf"}
chronologie:
  - {annee: 2008, evenement: "La Junta Directiva de l'INCOPESCA adopte le règlement AJDIP/138-2008 sur l'établissement des aires marines de pêche responsable (4 avril)."}
  - {annee: 2009, evenement: "Publication du décret exécutif 35502-MAG (La Gaceta n° 191, 1er octobre) ; création de l'aire de Palito, île de Chira (accord AJDIP/315-2009, La Gaceta du 20 novembre)."}
  - {annee: 2010, evenement: "Création de l'aire du golfe Dulce (accord AJDIP/191-2010, 11 juin)."}
  - {annee: 2011, evenement: "Création de l'aire de Tárcoles (accord AJDIP/193-2011, 27 mai)."}
  - {annee: 2012, evenement: "Création des aires de Puerto Níspero et d'Isla Caballo ; extension de l'aire de Palito vers Montero (accord AJDIP/154-2012)."}
  - {annee: 2013, evenement: "Création des aires de San Juanillo et d'Isla Venado."}
  - {annee: 2014, evenement: "Création des aires de Paquera-Tambor et de Costa de Pájaros."}
  - {annee: 2018, evenement: "Création de l'aire de Dominicalito (accord AJDIP/219-2018)."}
  - {annee: 2019, evenement: "Création de l'aire de Barra del Colorado, première sur la côte caraïbe, à la demande de deux associations de pêcheurs et de pêcheuses (accord AJDIP/549-2019)."}
  - {annee: 2021, evenement: "Création des aires 201 (accord AJDIP/224-2021) et Papagayo (accord AJDIP/255-2021)."}
fiabilite:
  verifie:
    - "Texte du décret 35502-MAG (art. 1 à 16) dans la version publiée par l'INCOPESCA."
    - "Liste des 13 aires et accords de création, lus sur les pages de l'INCOPESCA (consultées en octobre 2026)."
    - "Surfaces de Puerto Níspero (2,6 km²), d'Isla Caballo (1,48 km²) et de Costa de Pájaros (1 056 ha) lues dans les accords de création."
    - "Mention des aires dans le cinquième rapport national à la CDB (2014), tableau 16."
  non_confirme:
    - "Composition de la commission de suivi : le décret (art. 11) prévoit des représentants de l'INCOPESCA et un représentant de la communauté de pêcheurs ; la présentation de l'INCOPESCA (2020) indique un représentant de l'INCOPESCA, un du SINAC (système national des aires de conservation) et deux des pêcheurs, sans citer le texte qui aurait modifié l'article 11."
    - "Surface totale : chiffre arrondi « plus de 1 500 km² » de 2020, antérieur à la création des aires 201 et Papagayo."
    - "Nombre de pêcheurs et d'organisations membres : aucun chiffre agrégé trouvé."
    - "Fonctionnement actuel des commissions de suivi et remise des rapports semestriels prévus à l'article 13."
