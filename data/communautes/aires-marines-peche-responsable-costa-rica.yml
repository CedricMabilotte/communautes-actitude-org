resume: >-
  Fiche agrégée : elle couvre les organisations de pêcheurs artisanaux qui ont obtenu la création d'une aire marine de pêche responsable (AMPR). Le décret exécutif 35502-MAG (La Gaceta n° 191 du 1er octobre 2009) permet à l'Institut costaricien de la pêche et de l'aquaculture (INCOPESCA) de créer ces aires, en donnant la priorité à celles que proposent des organisations de pêcheurs inscrites à son registre. Chaque aire est délimitée par des coordonnées et régie par un plan d'aménagement des pêches (Plan de Ordenamiento Pesquero : zonage, engins autorisés, zones de fermeture) établi par zonage participatif et approuvé par la Junta Directiva (conseil d'administration) de l'INCOPESCA ; une commission de suivi associe l'INCOPESCA et des représentants des pêcheurs. La pêche dans l'aire reste ouverte à tout pêcheur titulaire d'une licence qui respecte le plan (art. 6). L'INCOPESCA recense 13 aires créées entre 2009 et 2021.
