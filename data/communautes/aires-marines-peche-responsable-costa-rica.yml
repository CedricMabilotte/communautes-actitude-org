reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Costa Rica à la Convention sur la diversité biologique (avril 2014) : il cite les aires marines de pêche responsable créées par accord de la Junta Directiva de l'INCOPESCA parmi les nouvelles modalités de gestion des ressources halieutiques et les compare aux aires marines protégées (tableau 16).", annee: 2014, source: "https://www.cbd.int/doc/world/cr/cr-nr-05-es.pdf"}
base_nationale:
  - {instrument: "Décret exécutif 35502-MAG, Reglamento para el establecimiento de las Áreas Marinas de Pesca Responsable (La Gaceta n° 191 du 1er octobre 2009)", nature: "loi", annee: 2009, source: "https://www.incopesca.go.cr/pesca/pesca_responsable/01-reglamento_areas_marinas_pesca_responsable.pdf"}
  - {instrument: "Accords de création de la Junta Directiva de l'INCOPESCA (AJDIP/315-2009 à AJDIP/255-2021), un par aire", nature: "loi", annee: 2009, source: "https://www.incopesca.go.cr/pesca/ampr.aspx"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'INCOPESCA crée les aires et donne la priorité à celles que propose une organisation de pêcheurs dotée de la personnalité juridique et inscrite à son registre (décret 35502-MAG, art. 1 d et 2) ; une commission de suivi nommée par la présidence exécutive de l'INCOPESCA comprend un représentant titulaire et un suppléant désignés par la communauté de pêcheurs, la coordination revenant aux deux représentants de l'INCOPESCA (art. 11) ; l'INCOPESCA promeut au sein des organisations des comités de surveillance formés de pêcheurs, qui appuient le Service national des garde-côtes (art. 7 et 8).", source: "https://www.incopesca.go.cr/pesca/pesca_responsable/01-reglamento_areas_marinas_pesca_responsable.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'organisation élabore un code d'éthique pour la pêche responsable qui devient obligatoire pour ses membres une fois approuvé (décret 35502-MAG, art. 5 b) ; les règles de l'aire (zones, engins, fermetures) sont fixées par zonage participatif en consensus avec les pêcheurs mais adoptées par la Junta Directiva de l'INCOPESCA (art. 1 f, 3 et 10).", source: "https://www.incopesca.go.cr/pesca/pesca_responsable/01-reglamento_areas_marinas_pesca_responsable.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Chaque plan d'aménagement des pêches fixe les engins et méthodes autorisés et les zones de fermeture totale ou partielle de l'aire (décret 35502-MAG, art. 10) ; l'accès n'est pas réservé aux membres de l'organisation : tout pêcheur titulaire d'une licence peut pêcher dans l'aire s'il respecte le plan (art. 6).", source: "https://www.incopesca.go.cr/pesca/pesca_responsable/01-reglamento_areas_marinas_pesca_responsable.pdf"}
  consentement: {valeur: "partiel", note: "Le zonage participatif (zonificación participativa) est défini comme l'aménagement de la pêche réalisé en consensus avec les pêcheurs des organisations ayant un intérêt légitime (décret 35502-MAG, art. 1 f) ; le texte ne prévoit pas de consentement de l'organisation aux autres décisions de l'INCOPESCA sur l'aire.", source: "https://www.incopesca.go.cr/pesca/pesca_responsable/01-reglamento_areas_marinas_pesca_responsable.pdf"}
