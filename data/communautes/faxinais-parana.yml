  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le décret fédéral 8.750 de 2016 (art. 4, § 2, IX) réserve un siège aux faxinalenses (un titulaire et deux suppléants élus sur appel public) au Conseil national des peuples et communautés traditionnels, organe consultatif.", source: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/decreto/d8750.htm"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
