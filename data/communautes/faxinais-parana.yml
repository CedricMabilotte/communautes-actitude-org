resume: >-
  Fiche agrégée : elle couvre les faxinais, communautés rurales du Centre-Sud du Paraná qui élèvent leurs animaux en liberté sur des terres d'usage commun (le criadouro comunitário, pâturage collectif sous forêt d'araucarias), cultivent des parcelles familiales et exploitent la forêt (maté, araucaria). Le décret de l'État du Paraná n° 3.446 du 14 août 1997 crée les Aires spéciales d'usage réglementé (ARESUR), délimitées faxinal par faxinal par le secrétaire d'État à l'Environnement. La loi de l'État n° 15.673 du 13 novembre 2007 reconnaît les faxinais et leur « territorialité spécifique », fondée sur l'usage commun de la terre, et protège leurs accords communautaires comme patrimoine culturel immatériel de l'État. Selon le ministère public du Paraná, ces accords fixent les activités permises dans chaque zone du faxinal et une commission locale en contrôle l'application.
