effectivite: {valeur: "partielle", note: "Hauresko, Correia et Gomes (2017) décrivent la vente de terres, l'appropriation illégale (grilagem) et l'absence d'appui de l'État ; ils relèvent que le faxinal d'Anta Gorda (Prudentópolis), réglementé comme ARESUR en 1997, dispose ainsi d'« un instrument de plus » pour défendre son mode de vie.", source: "https://revista.fct.unesp.br/index.php/pegada/article/download/4728/3726"}
chronologie:
  - {annee: 1997, evenement: "Décret de l'État n° 3.446 du 14 août : création des ARESUR et inscription possible des faxinais au registre des unités de conservation (CEUC)."}
  - {annee: 1997, evenement: "Résolution n° 72 du secrétariat d'État à l'Environnement : le faxinal d'Anta Gorda (612 ha, dont 252 ha de criadouro comunitário) devient ARESUR."}
  - {annee: 2004, evenement: "Relevé de l'Institut environnemental du Paraná (IAP) : 44 faxinais."}
  - {annee: 2005, evenement: "Création de l'Articulação Puxirão dos Povos Faxinalenses, mouvement des faxinalenses."}
  - {annee: 2007, evenement: "Loi de l'État n° 15.673 du 13 novembre : reconnaissance des faxinais, de leur territorialité et de leurs accords communautaires."}
  - {annee: 2009, evenement: "Relevé de Souza, aligné sur la Rede Puxirão : 227 faxinais."}
  - {annee: 2016, evenement: "Décret fédéral n° 8.750 : les faxinalenses figurent parmi les segments du Conseil national des peuples et communautés traditionnels."}
fiabilite:
  verifie: ["Texte de la loi 15.673 de 2007 (art. 1 à 4) et du décret 3.446 de 1997 (art. 1 et 2), lus sur le portail de législation de l'État du Paraná.", "Mention des faxinalenses à l'art. 4, § 2, IX du décret fédéral 8.750 de 2016 (portail Planalto).", "Description des accords communautaires et de la commission locale sur la page du ministère public du Paraná.", "Chiffres de 44 faxinais (IAP, Marques 2004) et de 227 faxinais (Rede Puxirão, Souza 2009 ; 2010), et données d'Anta Gorda (résolution n° 72 de 1997, 612 ha, 41 familles, 139 habitants), lus dans Hauresko, Correia et Gomes (2017)."]
  non_confirme: ["Nombre d'ARESUR délimitées et liste officielle des sites : non trouvés ; la page du Cadastre des unités de conservation (Institut Água e Terra) range les « Faxinais (ARESUR) » parmi les aires protégées sans en donner le nombre ; pas de tableau des sites.", "Nombre de faxinais : aucun total officiel ; 44 selon l'IAP (2004), 227 selon la Rede Puxirão (2009), écart que Hauresko et al. (2017) attribuent à des définitions différentes.", "Existence d'une base légale (loi municipale ou acte de l'État) donnant force obligatoire aux accords communautaires et pouvoirs aux commissions locales ; la description vient du ministère public, pas d'un texte.", "Nombre de certificats d'auto-reconnaissance faxinalense délivrés en application de l'art. 3 de la loi 15.673.", "Date du décret 3.446 : 14 août 1997 sur le portail officiel, 25 juillet 1997 dans Hauresko et al. (2017)."]
