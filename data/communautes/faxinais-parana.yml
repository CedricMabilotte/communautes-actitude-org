droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 15.673 de 2007 (art. 4) dispose que les pratiques sociales traditionnelles et les accords communautaires (acordos comunitários) des groupes faxinalenses doivent être conservés comme patrimoine culturel immatériel de l'État ; la loi ne leur donne pas expressément force obligatoire. Le ministère public du Paraná lit la loi comme une reconnaissance de la gestion du territoire par la communauté : les accords fixent les activités permises dans chaque zone du faxinal et une commission locale en contrôle l'application.", source: "https://www.legislacao.pr.gov.br/legislacao/pesquisarAto.do?action=exibir&codAto=105&indice=1&totalRegistros=1"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi 15.673 de 2007 (art. 1 et 2) reconnaît une territorialité fondée sur l'« usage commun des terres traditionnellement occupées », sans titre de propriété collective. Le décret 3.446 de 1997 (art. 1, § 3) prévoit la délimitation de chaque ARESUR par acte du secrétaire d'État à l'Environnement ; l'ARESUR suit, « no que couber » (dans la mesure applicable), les règles des aires de protection environnementale (APA).", source: "https://www.legislacao.pr.gov.br/legislacao/pesquisarAto.do?action=exibir&codAto=54005&indice=1&totalRegistros=1"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
