effectivite: {valeur: "partielle", note: "Selon le profil des pêches du Sri Lanka publié par la FAO (2006), sept zones de gestion avaient été déclarées en 2004. En 2020, le président du Forum sri-lankais pour la pêche artisanale, O. Amarasinghe, écrit qu'il faut encore établir des zones de gestion et des comités de pêche au titre de la loi de 1996 pour que les intérêts de la pêche soient représentés dans la gestion des zones spéciales (Special Area Management) prévue par le plan de gestion côtière de 2018, et que « ni les agents de l'État ni les communautés ne comprennent pleinement ce que signifie la cogestion » (Samudra Report no 84).", source: "https://icsf.net/samudra/path-to-a-policy-upgrade/"}
chronologie:
  - {annee: 1996, evenement: "Loi no 2 sur les pêches et les ressources aquatiques : zones de gestion des pêches, comités de pêche et autorités de gestion des pêches pouvant faire des recommandations au ministre sur les engins, les saisons de fermeture et les horaires de pêche."}
  - {annee: 1997, evenement: "Publication au Journal officiel (no 972/15 du 25 avril 1997) du comité de pêche du triton et de la langouste de la côte sud du district de Hambantota."}
  - {annee: 2004, evenement: "Sept zones de gestion des pêches déclarées selon la FAO."}
  - {annee: 2010, evenement: "Désignation de la zone de gestion de la côte sud du district de Hambantota (Journal officiel no 1665/18 du 4 août 2010) et de la zone de gestion de la lagune de Puttalam."}
  - {annee: 2012, evenement: "Règlement sur la pêche du triton et de la langouste dans la zone de Hambantota : licences délivrées sur recommandation du comité de pêche."}
  - {annee: 2013, evenement: "Loi modificative no 35 : les autorités de gestion des pêches sont remplacées par un comité de coordination par zone, nommé par le directeur général, chargé d'un plan de développement et de gestion ; le comité de pêche perd sa fonction de programme de pêche propre."}
fiabilite:
  verifie: ["Texte d'origine de la loi de 1996 (art. 31 à 33) : autorités de gestion des pêches et comités de pêche.", "Loi modificative no 35 de 2013 (art. 9 à 11) : nouveaux art. 31, 31A et 31B, abrogation de l'art. 32 (2) (a).", "Version consolidée de la loi (modifications jusqu'à la loi no 27 de 2023) : art. 31 à 33 dans la rédaction de 2013.", "Règlement de 2012 sur la zone de gestion de la côte sud du district de Hambantota (Journal officiel no 1774/36), avec renvoi à l'ordre no 1665/18 de 2010 et au comité publié sous le no 972/15 de 1997.", "Profil FAO des pêches du Sri Lanka (2006) : sept zones déclarées en 2004.", "UICN (avril 2025) : zone de gestion de la lagune de Puttalam désignée en 2010 ; 88 villages de pêcheurs et environ 165 000 personnes dépendent de la lagune.", "Rapport juridique FAO EAF-Nansen no 61 (2023) : description des art. 31 à 33 en vigueur."]
  non_confirme: ["Aucune liste officielle à jour des zones de gestion désignées ni des comités de pêche enregistrés n'a été trouvée ; pas de tableau des sites. Le nombre de 2004 précède les ordres de 2010 sur les zones de Hambantota et de Puttalam ; on ne sait pas si ces ordres désignent des zones nouvelles ou en redéfinissent d'anciennes (le comité de Hambantota est publié dès 1997).", "Aucun plan de développement et de gestion publié au Journal officiel en vertu de l'art. 31B n'a été consulté.", "Les règlements sur l'élection des bureaux des comités (art. 32 (5)) et sur la procédure du registre des pêcheurs (art. 33 (2)) n'ont pas été trouvés.", "La surface des zones et la population des pêcheurs inscrits aux registres n'ont pas été trouvées.", "Le pouvoir de recommandation sur les licences n'a été vérifié que pour la zone de Hambantota ; il n'est pas établi qu'il existe dans les autres zones.", "Aucun document de la Convention sur la diversité biologique nommant ce régime n'a été trouvé."]
