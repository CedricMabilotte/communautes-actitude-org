resume: >-
  La loi sur les pêches et les ressources aquatiques (Fisheries and Aquatic Resources Act) no 2 de 1996 permet de délimiter des zones de gestion des pêches (Fisheries Management Areas) dans les eaux du Sri Lanka et sur les terres adjacentes. Les pêcheurs enregistrés qui résident ou pêchent dans une zone peuvent former un comité de pêche (fisheries committee) ; une fois enregistré par le directeur des pêches et notifié au Journal officiel, le comité devient une personne morale et tient le registre des pêcheurs de sa zone (art. 32 et 33). Depuis la loi modificative no 35 de 2013, chaque zone est dotée d'un comité de coordination nommé par le directeur général, où siègent des membres élus par les comités de pêche aux côtés de fonctionnaires, et qui prépare un plan de gestion soumis au ministre (art. 31 à 31B). Selon la FAO, sept zones avaient été déclarées en 2004.
