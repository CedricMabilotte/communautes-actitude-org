  - {instrument: "Fisheries and Aquatic Resources Act no 2 de 1996, art. 31 à 34 (version d'origine : désignation des comités de pêche comme autorités de gestion des pêches)", nature: "loi", annee: 1996, source: "https://lk.chm-cbd.net/sites/lk/files/2022-06/Fisheries-and-Aquatic-Resources-Act-No.-2-of-1996.pdf"}
  - {instrument: "Fisheries and Aquatic Resources (Amendment) Act no 35 de 2013, art. 9 à 11 : nouvel art. 31, art. 31A (comité de coordination) et 31B (plan de développement et de gestion), modification de l'art. 32", nature: "loi", annee: 2013, source: "https://faolex.fao.org/docs/pdf/srl132448.pdf"}
  - {instrument: "Fishing Operations Regulations of catching Chank or Lobster in the South Coast (Hambantota District) Fisheries Management Area, 2012 (Journal officiel extraordinaire no 1774/36 du 7 septembre 2012)", nature: "loi", annee: 2012, source: "https://faolex.fao.org/docs/pdf/srl133798.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les pêcheurs enregistrés qui résident ou pêchent dans une zone de gestion, ou les pêcheurs migrants, peuvent former un comité de pêche ; enregistré par le directeur et notifié au Journal officiel, il devient une personne morale (body corporate) qui peut agir en justice (art. 32 (1), (3) et (4) de la loi de 1996). Il établit et révise le registre des pêcheurs de sa zone, le premier registre étant certifié par le directeur (art. 33 (1)). L'élection du bureau et la procédure relèvent de règlements, les comptes sont vérifiés par le directeur, qui peut annuler l'enregistrement d'un comité inactif ou qui n'agit pas dans l'intérêt de ses membres (art. 32 (5) et (6)).", source: "https://lankalaw.net/wp-content/uploads/2025/03/Fisheries-and-Aquatic-Resources-Act-Consolidated-2024.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Dans la zone de gestion de la côte sud du district de Hambantota, les licences de pêche du triton (chank) et de la langouste ne sont délivrées ou renouvelées que sur recommandation du comité de pêche dont le titulaire est membre ; le directeur général fixe le nombre de licences (règlement de 2012, art. 4, 5 et 7).", source: "https://faolex.fao.org/docs/pdf/srl133798.pdf"}
  consentement: {valeur: "partiel", note: "Les pêcheurs d'une zone peuvent demander par écrit sa désignation comme zone de gestion (art. 31 (1), version de 2013). Le comité de coordination de chaque zone comprend jusqu'à quatre membres élus par un comité de pêche, ou jusqu'à douze en nombre égal s'il y en a plusieurs, aux côtés de fonctionnaires, d'élus locaux, de la police, des garde-côtes et de la marine ; il soumet un plan de gestion que le directeur général peut modifier et que le ministre approuve (art. 31A et 31B). Il s'agit d'une participation, non d'un consentement.", source: "https://lankalaw.net/wp-content/uploads/2025/03/Fisheries-and-Aquatic-Resources-Act-Consolidated-2024.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
