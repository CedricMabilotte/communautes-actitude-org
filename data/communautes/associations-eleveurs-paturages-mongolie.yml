effectivite: {valeur: "non_etablie", note: "La loi est en vigueur depuis le 1er juillet 2024 ; les règles d'établissement des contrats d'usage des pâturages et le contrat type ont été préparés de mai à juillet 2025 par le Center for Policy Research, sur commande du ministère de l'Alimentation, de l'Agriculture et de l'Industrie légère ; aucune source indépendante trouvée ne donne le nombre d'associations enregistrées ni de contrats signés.", source: "https://cpr.mn/?lang=en&p=979"}
chronologie:
  - {annee: 1992, evenement: "La Constitution exclut les pâturages de l'attribution de terres en propriété privée (article 6.3)."}
  - {annee: 2024, evenement: "Le Grand Khoural d'État (Parlement) adopte le 5 juin la loi sur le statut juridique de l'association unifiée des ménages d'éleveurs, la loi sur les éleveurs et des modifications de la loi sur la terre."}
  - {annee: 2024, evenement: "Entrée en vigueur de la loi sur l'association des ménages d'éleveurs le 1er juillet."}
  - {annee: 2025, evenement: "Préparation, de mai à juillet, des règles d'établissement des contrats d'usage des pâturages et d'un contrat type pour le ministère chargé de l'agriculture."}
fiabilite:
  verifie:
    - "Date d'adoption (5 juin 2024) et d'entrée en vigueur (1er juillet 2024) de la loi, seuil de dix ménages (article 7.1), organes et pouvoirs de l'assemblée (articles 13 à 16), missions sur les pâturages sous contrat (article 10), financement (article 18) : traduction anglaise non officielle publiée sur legalinfo.mn."
    - "Article 6.3 de la Constitution excluant les pâturages de la propriété privée : Constitute Project."
    - "Article 52.2 de la loi sur la terre et préparation des règles types de contrat en 2025 : Center for Policy Research."
  non_confirme:
    - "Texte officiel de la loi sur la terre modifiée en 2024 : article 52.2 lu seulement dans la citation du Center for Policy Research."
    - "Nombre d'associations primaires enregistrées, de contrats signés et surface de pâturages sous contrat : aucune source trouvée."
    - "Adoption officielle des règles types de contrat de 2025 par arrêté ministériel : non vérifiée."
    - "Fiscalité et budget : la loi de 2024 ne prévoit que les cotisations fixées par l'assemblée, les fonds prévus par la loi, les revenus d'activité et les dons (article 18), et une aide publique possible en cas de catastrophe (article 27.1) ; aucun prélèvement sur des tiers ni budget public garanti trouvé."
    - "Le CAPA date l'adoption de la loi de juillet 2024 ; le texte publié sur legalinfo.mn donne le 5 juin 2024 et une entrée en vigueur le 1er juillet 2024."
    - "Le texte de la Constitution consulté est celui de 1992 modifié en 2001 ; les modifications de 2019 n'ont pas été vérifiées sur l'article 6.3."
