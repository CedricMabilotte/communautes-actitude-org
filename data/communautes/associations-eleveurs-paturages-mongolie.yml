base_nationale:
  - {instrument: "Constitution de la Mongolie (1992), article 6.2 et 6.3 : les terres non privées sont propriété de l'État ; les pâturages sont exclus de l'attribution en propriété privée", nature: "constitution", annee: 1992, source: "https://www.constituteproject.org/constitution/Mongolia_2001"}
  - {instrument: "Loi sur le statut juridique de l'association unifiée des ménages d'éleveurs (5 juin 2024, en vigueur le 1er juillet 2024), articles 5 à 18", nature: "loi", annee: 2024, source: "https://legalinfo.mn/en/edtl/17333371004191"}
  - {instrument: "Loi sur la terre, modifiée en juin 2024, article 52.2 : le gouverneur peut confier l'usage d'un pâturage par contrat à une association primaire de ménages d'éleveurs", nature: "loi", annee: 2024, source: "https://cpr.mn/?lang=en&p=979"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'association primaire, d'au moins dix ménages, est une personne morale administrée par ses membres (« self-governance ») ; elle est dirigée par l'assemblée de tous les membres (un ménage, une voix), qui adopte les statuts, élit pour deux ans le président et au plus cinq dirigeants, et décide des admissions et des exclusions (loi de 2024, articles 4.1.3, 7, 13, 14 et 16) ; l'admission de ménages nouveaux ou venus d'ailleurs tient compte de la capacité de charge des pâturages et des recommandations du gouverneur de sum (article 14.3).", source: "https://legalinfo.mn/en/edtl/17333371004191"}
  pouvoir_normatif: {valeur: "partiel", note: "Les statuts, enregistrés auprès de l'autorité d'enregistrement, fixent les droits et devoirs des membres, la suspension et l'exclusion et les sanctions en cas de manquement (loi de 2024, article 6) ; l'assemblée approuve le calendrier de rotation et de restauration des pâturages (article 14.1.5), dans le cadre du contrat signé avec le gouverneur (article 10.1).", source: "https://legalinfo.mn/en/edtl/17333371004191"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le gouverneur de sum peut, sur proposition de l'assemblée générale des citoyens du bag (subdivision du sum) et selon les caractéristiques locales et la capacité de charge, confier l'usage d'un pâturage par contrat à l'association primaire pour le protéger de la dégradation et le restaurer (loi sur la terre, article 52.2, cité par le Center for Policy Research) ; il s'agit d'un droit d'usage : les pâturages appartiennent à l'État et ne peuvent pas être donnés en propriété privée (Constitution, article 6.3), et un ménage non membre peut les utiliser à condition de les respecter (loi de 2024, article 10.5).", source: "https://cpr.mn/?lang=en&p=979"}
  ressources: {valeur: "partiel", note: "Selon le contrat avec le gouverneur, l'association organise l'usage des pâturages selon leur capacité de charge et un calendrier saisonnier, la restauration des pâturages dégradés, la surveillance de l'usage des plantes, de l'eau et de la faune sauvage, l'amélioration de l'approvisionnement en eau et l'usage des prairies de fauche ; la mise en culture des pâturages sous contrat est interdite (loi de 2024, articles 4.1.4, 10.1 et 10.3).", source: "https://legalinfo.mn/en/edtl/17333371004191"}
  consentement: {valeur: "partiel", note: "L'association primaire vote sur le projet de programme et de plan de protection de la nature à mettre en œuvre dans la zone (loi de 2024, article 10.1.12) ; l'association de sum donne des recommandations sur le plan annuel d'aménagement du territoire du sum et sur le budget local consacré à l'élevage et aux pâturages (article 20.1.4 et 20.1.5) ; la loi ne précise pas l'effet de ce vote et aucun texte trouvé ne prévoit de consentement préalable.", source: "https://legalinfo.mn/en/edtl/17333371004191"}
