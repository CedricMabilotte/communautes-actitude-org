resume: >-
  Fiche agrégée : elle couvre les associations primaires de ménages d'éleveurs, c'est-à-dire les groupes d'au moins dix ménages voisins d'un même sum (district rural) qui vivent de l'élevage pastoral toute l'année. La loi du 5 juin 2024 sur le statut juridique de l'association unifiée des ménages d'éleveurs, en vigueur le 1er juillet 2024, en fait des personnes morales sans but lucratif administrées par leurs membres (« self-governance » dans la traduction anglaise), regroupées au niveau du sum, de la province et du pays. Selon la loi sur la terre modifiée en 2024 (article 52.2), le gouverneur de sum peut, sur proposition de l'assemblée générale des citoyens du bag (subdivision du sum) et selon la capacité de charge, leur confier l'usage d'un pâturage par contrat ; l'association organise alors l'usage, la protection et la restauration de ce pâturage selon sa capacité de charge. Les pâturages restent propriété de l'État et ne peuvent pas être attribués en propriété privée (Constitution, article 6.3). Le régime est récent : des règles types de contrat ont été préparées en 2025 et aucun décompte national des associations ou des contrats n'a été trouvé.
