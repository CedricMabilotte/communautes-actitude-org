resume: >-
  Les Kurdes vivent surtout dans le nord et le nord-est de la Syrie. Le décret présidentiel n° 13 du 16 janvier 2026 reconnaît le kurde comme langue nationale,
  autorise son enseignement dans les écoles publiques et privées des zones où les Kurdes forment une part notable de la population, comme matière optionnelle ou dans le cadre d'activités culturelles et éducatives, accorde la nationalité syrienne
  aux personnes d'origine kurde privées de nationalité depuis le recensement de Hassaké de 1962 et fait de Norouz (21 mars) un jour férié.
  Une décision du ministre de l'Éducation du 27 août 2026 organise cet enseignement. L'Administration autonome du Nord et de l'Est de la Syrie, qui n'avait pas de base
  dans le droit de l'État, est en cours d'intégration dans les institutions de l'État en application de l'accord du 29 janvier 2026 ; la dissolution des Forces démocratiques syriennes a été annoncée le 25 août 2026.
