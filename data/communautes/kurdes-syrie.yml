chronologie:
  - {annee: 1962, evenement: "Recensement exceptionnel du gouvernorat de Hassaké (5 octobre, décret n° 93) : environ 120 000 Kurdes perdent la nationalité syrienne et sont inscrits comme « ajanib » (étrangers). Une partie de leurs descendants, absents des registres d'état civil, forme ensuite la catégorie des « maktoumin » (non enregistrés), sans papiers d'identité."}
  - {annee: 2011, evenement: "Le décret n° 49 ouvre la nationalité aux Kurdes inscrits comme « ajanib » à Hassaké ; environ 150 000 « maktoumin » en restent exclus."}
  - {annee: 2014, evenement: "Janvier : une administration transitoire est proclamée dans les cantons de Djézireh, Kobané et Afrin, sans reconnaissance par l'État."}
  - {annee: 2026, evenement: "16 janvier : décret présidentiel n° 13 (langue nationale, nationalité, Norouz). 29 janvier : accord entre le gouvernement et les Forces démocratiques syriennes sur l'intégration des institutions civiles et militaires."}
  - {annee: 2026, evenement: "25 août : annonce de la dissolution des Forces démocratiques syriennes. 27 août : décision du ministre de l'Éducation sur l'enseignement du kurde."}
