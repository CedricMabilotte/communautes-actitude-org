resume: >-
  Les commoners (titulaires de droits communaux) de la New Forest occupent des terres auxquelles sont attachés des droits d'usage sur la forêt : pâturage des poneys, bovins et ânes, glandée des porcs (common of mast), bois de chauffage. La Cour des Verderers, reconstituée par le New Forest Act de 1877 et réorganisée par celui de 1949, compte dix membres : un verderer officiel nommé par la Couronne, cinq verderers élus par les occupants d'au moins 0,40 hectare de terre dotée de droits communaux, et quatre verderers nommés par le ministère de l'Environnement (DEFRA), la Forestry Commission, l'autorité d'urbanisme et Natural England. La Cour adopte des règlements (byelaws) confirmés par le ministre, fixe les droits de marquage des animaux et emploie les agisters (gardes chargés du bétail). Son accord est requis pour certains enclos, réseaux, parkings, aires de loisirs et échanges de terres sur la forêt.
