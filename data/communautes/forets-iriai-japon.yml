droits:
  autogouvernement: {valeur: "partiel", note: "Le Code civil (art. 263 et 294, 1896) soumet les droits d'iriai aux coutumes locales ; la qualité de membre suit des règles internes adoptées par l'ensemble des membres ou la coutume du groupe. Le groupe d'iriai n'a pas la personnalité juridique : la Cour suprême le qualifie d'association sans personnalité (kenri nōryoku naki shadan) titulaire d'une propriété collective indivise (sōyū) et exige que l'action en reconnaissance du droit soit portée par tous les titulaires (arrêt du 25 novembre 1966).", source: "https://ja.wikipedia.org/wiki/入会権"}
  pouvoir_normatif: {valeur: "partiel", note: "Les droits d'iriai sont « régis par les coutumes locales » avant les règles du Code civil (art. 263 et 294, 1896). Les juges contrôlent ces règles coutumières : la Cour suprême (17 mars 2006) admet la limitation aux chefs de ménage mais déclare nulle, au titre de l'ordre public (art. 90 du Code civil), la règle qui réservait la qualité de titulaire aux descendants masculins et excluait les descendantes mariées à un homme extérieur au hameau.", source: "https://ja.wikipedia.org/wiki/入会権"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le Code civil distingue l'iriai « de nature de copropriété » (art. 263), où la terre appartient collectivement au groupe, et l'iriai sans copropriété sur la terre d'autrui (art. 294). La procédure de la loi de 1966 (art. 3 et 4) n'éteint le droit et ne le remplace par une propriété, un droit de superficie ou un bail qu'avec l'accord de tous les titulaires et l'autorisation du gouverneur de la préfecture.", source: "https://hourei.net/law/341AC0000000126"}
  ressources: {valeur: "reconnu", note: "Les titulaires « utilisent et tirent profit » (shiyō mata wa shūeki) des terres d'iriai consacrées à la croissance des arbres et bambous, à la coupe de foin ou au pâturage (art. 2 de la loi de 1966, qui renvoie aux art. 263 et 294 du Code civil).", source: "https://hourei.net/law/341AC0000000126"}
  consentement: {valeur: "non_etabli", note: "La conversion d'une forêt d'iriai exige l'accord unanime des titulaires sur un règlement et un plan, puis l'autorisation du gouverneur de la préfecture (art. 3 de la loi de 1966) : la décision appartient aux titulaires eux-mêmes. Pour les droits d'usage coutumiers sur des biens communaux, la modification ou la suppression relève d'une délibération du conseil municipal, sans consentement des usagers (art. 238-6 de la loi sur l'autonomie locale). Aucune obligation de consulter les titulaires avant une décision de l'État n'a été trouvée.", source: "https://hourei.net/law/341AC0000000126"}
