effectivite: {valeur: "partielle", note: "Les forêts communes coutumières couvraient 4,56 % de la surface forestière en 1990. Une étude de 2014 (International Journal of the Commons, vol. 8, n° 1) relève qu'après guerre la gestion collective a souvent cédé la place à une gestion individualisée, encouragée par le programme public de « modernisation » de 1966 ; elle décrit onze villages du district de Yamaguni (Kyoto) qui gèrent encore leurs forêts communes et en adaptent les règles.", source: "https://thecommonsjournal.org/articles/10.18352/ijc.348"}
chronologie:
  - {annee: 1896, evenement: "Code civil : les droits d'iriai sont régis par les coutumes locales (art. 263 et 294)."}
  - {annee: 1947, evenement: "Loi sur l'autonomie locale : usages coutumiers des biens communaux et circonscriptions patrimoniales (zaisanku)."}
  - {annee: 1966, evenement: "Loi sur la modernisation des droits d'iriai sur les forêts : conversion facultative, à l'unanimité des titulaires."}
  - {annee: 1966, evenement: "Cour suprême, 25 novembre : l'action en reconnaissance d'un droit d'iriai doit être portée par tous les titulaires."}
  - {annee: 1973, evenement: "Cour suprême, 13 mars : le classement en terre publique au début de l'ère Meiji n'a pas éteint le droit d'iriai."}
  - {annee: 1990, evenement: "Recensement forestier : 59 209 organisations communautaires, 4,56 % de la surface forestière."}
  - {annee: 2006, evenement: "Cour suprême, 17 mars : nullité de la règle coutumière excluant les descendantes mariées hors du hameau."}
