resume: >-
  Fiche agrégée : elle couvre les groupes villageois (iriai dantai, « groupes d'iriai ») titulaires d'un droit d'iriai, c'est-à-dire un droit collectif d'usage ou de propriété sur des forêts, prairies et terres communes. Le Code civil de 1896 (art. 263 et 294) soumet ce droit « aux coutumes locales » ; la loi sur l'autonomie locale de 1947 (art. 238-6) maintient un droit voisin, de droit public : l'usage coutumier de biens communaux par certains habitants. La loi de 1966 sur la modernisation des droits d'iriai permet aux titulaires, à l'unanimité et avec l'autorisation du gouverneur de la préfecture, d'éteindre ce droit et de le remplacer par une propriété, un droit de superficie, un bail ou un autre droit d'usage, avec apport possible à une coopérative forestière de production (art. 3 et 4). Selon le recensement forestier de 1990, 59 209 organisations communautaires géraient des forêts communes coutumières ; ces forêts représentaient 4,56 % de la surface forestière du pays.
