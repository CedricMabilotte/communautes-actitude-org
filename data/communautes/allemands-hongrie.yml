resume: >-
  Les Allemands de Hongrie (Ungarndeutsche) sont l'une des treize nationalités reconnues en Hongrie. La Loi fondamentale de 2011 leur reconnaît le droit de créer des autogouvernements locaux et nationaux (art. XXIX), organisés par la loi CLXXIX de 2011 sur les droits des nationalités. Les électeurs inscrits sur la liste allemande élisent 406 autogouvernements locaux (2019), 15 autogouvernements territoriaux (2019) et l'Autogouvernement national des Allemands de Hongrie (LdU), qui peut gérer des établissements scolaires et culturels. La liste allemande a obtenu un mandat préférentiel (siège attribué avec un quart des voix normalement requises) à l'Assemblée nationale en 2018 et en 2022, mais aucun siège en 2026.
