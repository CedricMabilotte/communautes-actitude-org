base_nationale:
  - {instrument: "Loi foncière (Land Law), art. 23 à 28", nature: "loi", annee: 2001, source: "https://faolex.fao.org/docs/pdf/cam27478.pdf"}
  - {instrument: "Sous-décret n° 83 sur les procédures d'enregistrement des terres des communautés autochtones", nature: "loi", annee: 2009, source: "https://cambodia.ohchr.org/iplands/wp-content/uploads/2021/05/CLT-RECOMMENDATION_ENG.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "En attendant une loi sur les communautés, les groupes existants continuent de gérer leur communauté et leurs biens immobiliers selon leurs coutumes, loi foncière de 2001, art. 23 ; l'exercice des droits de propriété relève des autorités traditionnelles et des mécanismes de décision de la communauté, art. 26.", source: "https://faolex.fao.org/docs/pdf/cam27478.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les conditions d'usage des terres collectives sont fixées selon les coutumes de la communauté, sous réserve des lois générales comme celle sur la protection de l'environnement, loi foncière de 2001, art. 26.", source: "https://faolex.fao.org/docs/pdf/cam27478.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Propriété collective accordée par l'État, avec les protections de la propriété privée, loi foncière de 2001, art. 26, qui ne fait pas obstacle aux travaux de l'État requis par l'intérêt national ; aucune autorité extérieure à la communauté ne peut acquérir de droits sur ces biens, art. 28 ; la communauté ne peut céder ce qui relève du domaine public de l'État.", source: "https://faolex.fao.org/docs/pdf/cam27478.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "L'appartenance à la communauté est reconnue par la majorité du groupe selon des critères ethniques, culturels et sociaux et ouvre les droits prévus par la loi, loi foncière de 2001, art. 24.", source: "https://faolex.fao.org/docs/pdf/cam27478.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En décembre 2025, 48 communautés sur 488 avaient un titre collectif enregistré (IWGIA, 2026) ; en 2025, 158 membres de communautés autochtones et défenseurs des droits ont fait l'objet de poursuites, dont plus de 100 Brao pour culture itinérante près du parc national de Virachey (IWGIA, 2026). Le Rapporteur spécial sur la situation des droits de l'homme au Cambodge indique que de nombreux groupes attendent toujours un titre et que les membres de peuples autochtones qui font valoir leurs droits s'exposent à des poursuites pénales (A/HRC/60/86, 2025, § 50). Le CERD (2019) relève un consentement préalable insuffisant.", source: "https://docs.un.org/fr/A/HRC/60/86"}
chronologie:
  - {annee: 2001, evenement: "Loi foncière reconnaissant la propriété collective des communautés autochtones."}
  - {annee: 2009, evenement: "Politique d'enregistrement des terres autochtones (avril) et sous-décret 83 (9 juin)."}
  - {annee: 2011, evenement: "Premiers titres fonciers collectifs."}
  - {annee: 2019, evenement: "Observations finales du CERD sur les peuples autochtones."}
  - {annee: 2023, evenement: "Code de l'environnement et des ressources naturelles (promulgué le 29 juin 2023) : le texte emploie « communauté locale » sans mentionner les peuples autochtones ; il n'abroge pas la loi foncière de 2001."}
  - {annee: 2025, evenement: "Rapport du Rapporteur spécial sur la situation des droits de l'homme au Cambodge consacré aux ressources naturelles (A/HRC/60/86) ; 48 communautés titrées en fin d'année selon l'IWGIA."}
