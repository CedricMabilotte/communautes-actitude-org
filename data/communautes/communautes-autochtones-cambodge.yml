resume: >-
  La loi foncière de 2001 définit les communautés autochtones et leur accorde la propriété collective des terres où elles résident et cultivent, y compris les réserves nécessaires à la culture itinérante. L'usage de ces terres relève des autorités traditionnelles de la communauté selon ses coutumes, et aucune autorité extérieure ne peut y acquérir de droits. Le sous-décret 83 de 2009 organise un enregistrement en trois étapes : reconnaissance de l'identité autochtone, enregistrement comme personne morale, titre foncier collectif. En juillet 2024, 43 communautés sur 458 avaient reçu un titre.
