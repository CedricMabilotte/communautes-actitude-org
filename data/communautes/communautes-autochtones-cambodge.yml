resume: >-
  La loi foncière de 2001 définit les communautés autochtones et leur accorde la propriété collective des terres où elles résident et cultivent, y compris les réserves nécessaires à la culture itinérante. L'usage de ces terres relève des autorités traditionnelles de la communauté selon ses coutumes, et aucune autorité extérieure ne peut y acquérir de droits. Le sous-décret 83 de 2009 organise un enregistrement en trois étapes : reconnaissance de l'identité autochtone, enregistrement comme personne morale, titre foncier collectif. En décembre 2025, 48 communautés sur 488 avaient reçu un titre selon l'IWGIA. Les forêts, aires protégées et pêcheries gérées par des communautés relèvent d'autres régimes (fiches « Forêts communautaires du Cambodge », « Aires protégées communautaires du Cambodge », « Pêcheries communautaires du Cambodge »).
