droits:
  autogouvernement: {valeur: "reconnu", note: "Le Parlement et le gouvernement écossais sont une partie permanente des institutions du Royaume-Uni et ne peuvent être abolis que sur décision du peuple d'Écosse par référendum, Scotland Act 1998, s. 63A (ajoutée en 2016).", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/63A"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement écossais fait des lois (Acts of the Scottish Parliament), sous réserve des matières réservées, Scotland Act 1998, s. 28, al. 1, et s. 29.", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/28"}
  justice_propre: {valeur: "reconnu", note: "La Cour de session et la Haute Cour de justiciary demeurent en Écosse et les cours de Westminster ne peuvent réviser leurs décisions, acte d'Union de 1707, art. XIX.", source: "https://www.legislation.gov.uk/aosp/1707/7/section/XIX"}
  terres: {valeur: "partiel", note: "Droit d'achat prioritaire des terres par les communautés locales (partie 2) et droit d'achat des communautés de crofters, petits exploitants agricoles (partie 3), Land Reform (Scotland) Act 2003.", source: "https://www.legislation.gov.uk/asp/2003/2/contents"}
  ressources: {valeur: "partiel", note: "La délivrance des licences pétrolières à terre est dévolue ; le pétrole et le gaz en mer et la gestion des biens de la Couronne restent en grande partie réservés, Scotland Act 1998, annexe 5.", source: "https://www.legislation.gov.uk/ukpga/1998/46/schedule/5"}
  consentement: {valeur: "partiel", note: "Le Parlement du Royaume-Uni ne légifère pas normalement dans les matières dévolues sans le consentement du Parlement écossais (convention Sewel), Scotland Act 1998, s. 28, al. 8 ; disposition sans force obligatoire devant les tribunaux.", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/28"}
  langue: {valeur: "reconnu", note: "Le gaélique a un statut officiel en Écosse, Scottish Languages Act 2025, s. 1 (en vigueur le 30 novembre 2025).", source: "https://www.legislation.gov.uk/asp/2025/10"}
  education: {valeur: "reconnu", note: "L'éducation n'est pas une matière réservée, Scotland Act 1998, annexe 5 ; la loi de 2025 impose aux autorités scolaires d'organiser l'accès à l'enseignement en gaélique.", source: "https://www.legislation.gov.uk/ukpga/1998/46/schedule/5"}
  fiscalite: {valeur: "partiel", note: "Le Parlement écossais fixe par résolution les taux de l'impôt sur le revenu des contribuables écossais, Scotland Act 1998, s. 80C (ajoutée en 2012).", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/80C"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "conteste", note: "L'Union des royaumes d'Écosse et d'Angleterre est une matière réservée, Scotland Act 1998, annexe 5, para. 1 ; la Cour suprême a jugé le 23 novembre 2022 que le Parlement écossais n'a pas compétence pour organiser un référendum d'indépendance ([2022] UKSC 31).", source: "https://www.supremecourt.uk/cases/uksc-2022-0098"}
effectivite: {valeur: "effective", note: "Le Comité consultatif de la Convention-cadre relève en 2016 des progrès visibles pour le scots et le gaélique en Écosse.", source: "https://cain.ulster.ac.uk/issues/europe/docs/coe_2017-02-27_fcnm-uk.pdf"}
