droits:
  autogouvernement: {valeur: "reconnu", note: "Le Parlement et le gouvernement écossais sont une partie permanente des institutions du Royaume-Uni et ne peuvent être abolis que sur décision du peuple d'Écosse par référendum, Scotland Act 1998, s. 63A (ajoutée en 2016).", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/63A"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement écossais fait des lois (Acts of the Scottish Parliament), sous réserve des matières réservées, Scotland Act 1998, s. 28, al. 1, et s. 29.", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/28"}
  justice_propre: {valeur: "reconnu", note: "La Cour de session et la Haute Cour de justiciary demeurent en Écosse et les cours de Westminster ne peuvent connaître des causes écossaises, acte d'Union de 1707, art. XIX ; les juges de la Cour de session et les shérifs sont nommés sur recommandation du premier ministre écossais, et le Lord President et le Lord Justice Clerk sur sa proposition, Scotland Act 1998, s. 95.", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/95"}
  terres: {valeur: "partiel", note: "Droit d'achat prioritaire des terres par les communautés locales (partie 2), droit d'achat des communautés de crofters, petits exploitants agricoles (partie 3), et droit d'achat des terres abandonnées ou négligées (partie 3A), Land Reform (Scotland) Act 2003. La loi de 2025 sur la réforme foncière (sanction royale le 16 décembre 2025) ajoute un droit d'enregistrer un intérêt sur les domaines de plus de 1 000 hectares (s. 2), non encore en vigueur à la date de consultation.", source: "https://www.legislation.gov.uk/asp/2003/2/contents"}
  ressources: {valeur: "partiel", note: "La délivrance des licences de recherche et d'exploitation du pétrole à terre n'est pas réservée ; l'exploration et l'exploitation du pétrole et du gaz en mer restent réservées au Royaume-Uni, Scotland Act 1998, annexe 5, partie II, section D. La gestion des biens de la Couronne situés en Écosse relève de Crown Estate Scotland, organisme écossais, Scottish Crown Estate Act 2019.", source: "https://www.legislation.gov.uk/ukpga/1998/46/schedule/5"}
  consentement: {valeur: "partiel", note: "Le Parlement du Royaume-Uni ne légifère pas normalement dans les matières dévolues sans le consentement du Parlement écossais (convention Sewel), Scotland Act 1998, s. 28, al. 8 (ajouté en 2016) ; le texte dit « will not normally » (ne le fera pas en temps normal).", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/28"}
  langue: {valeur: "reconnu", note: "Le gaélique (s. 1) et le scots (s. 33) ont un statut officiel en Écosse, Scottish Languages Act 2025, en vigueur le 30 novembre 2025.", source: "https://www.legislation.gov.uk/asp/2025/10/section/33"}
  education: {valeur: "reconnu", note: "L'éducation n'est pas une matière réservée, Scotland Act 1998, annexe 5 ; la loi de 2025 sur les langues écossaises impose aux autorités chargées de l'éducation de promouvoir, faciliter et soutenir l'enseignement en gaélique (partie 1, chapitre 2).", source: "https://www.legislation.gov.uk/ukpga/1998/46/schedule/5"}
  fiscalite: {valeur: "partiel", note: "Le Parlement écossais fixe par résolution les taux de l'impôt sur le revenu des contribuables écossais, Scotland Act 1998, s. 80C (ajoutée en 2012).", source: "https://www.legislation.gov.uk/ukpga/1998/46/section/80C"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "conteste", note: "L'Union des royaumes d'Écosse et d'Angleterre est une matière réservée, Scotland Act 1998, annexe 5, para. 1 ; une ordonnance de 2013 (SI 2013/242) a permis un seul référendum, avant le 31 décembre 2014 ; la Cour suprême a jugé le 23 novembre 2022 que le Parlement écossais n'a pas compétence pour organiser seul un nouveau référendum d'indépendance ([2022] UKSC 31).", source: "https://www.supremecourt.uk/cases/uksc-2022-0098"}
effectivite: {valeur: "effective", note: "Le Comité consultatif de la Convention-cadre relève en 2016 un soutien et des progrès visibles pour le scots et le gaélique en Écosse (éducation, culture, médias) ; en 2022, il relève un financement annuel du gouvernement écossais (5,125 millions de livres pour le Bòrd na Gàidhlig, 500 000 livres pour le scots) et demande des efforts supplémentaires pour répondre aux besoins des communautés de langue vernaculaire en Écosse.", source: "https://rm.coe.int/5th-op-uk-fr/1680ab55b5"}
chronologie:
  - {annee: 1707, evenement: "Acte d'Union : les juridictions écossaises sont maintenues (art. XIX)."}
  - {annee: 1998, evenement: "Scotland Act : création du Parlement écossais."}
  - {annee: 2003, evenement: "Land Reform (Scotland) Act : droit d'achat des communautés."}
  - {annee: 2012, evenement: "Scotland Act 2012 : taux écossais de l'impôt sur le revenu."}
  - {annee: 2013, evenement: "Ordonnance SI 2013/242 et Scottish Independence Referendum Act 2013 : transfert temporaire de compétence pour un référendum."}
  - {annee: 2014, evenement: "Référendum sur l'indépendance (18 septembre)."}
  - {annee: 2016, evenement: "Scotland Act 2016 : permanence du Parlement (s. 63A) et convention Sewel (s. 28, al. 8)."}
  - {annee: 2019, evenement: "Scottish Crown Estate Act : gestion des biens de la Couronne en Écosse par Crown Estate Scotland."}
  - {annee: 2022, evenement: "Arrêt [2022] UKSC 31 de la Cour suprême (23 novembre) ; cinquième avis du Comité consultatif de la Convention-cadre (8 décembre)."}
  - {annee: 2025, evenement: "Scottish Languages Act : statut officiel du gaélique et du scots (en vigueur le 30 novembre)."}
  - {annee: 2025, evenement: "Land Reform (Scotland) Act 2025 (sanction royale le 16 décembre) : règles sur les domaines de plus de 1 000 hectares."}
  - {annee: 2026, evenement: "Élection du Parlement écossais (7 mai) ; John Swinney réélu Premier ministre à la tête d'un gouvernement minoritaire (20 mai)."}
