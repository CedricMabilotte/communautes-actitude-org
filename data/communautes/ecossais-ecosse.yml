resume: >-
  Le Scotland Act 1998 a créé un Parlement et un gouvernement écossais. Depuis 2016, la loi déclare qu'ils ne peuvent être abolis que sur décision du « peuple d'Écosse » par référendum. Le Parlement vote des lois dans toutes les matières non réservées au Royaume-Uni et fixe les taux de l'impôt sur le revenu des contribuables écossais. Le gaélique et le scots ont un statut officiel en Écosse depuis le 30 novembre 2025. L'Écosse a gardé son propre système judiciaire depuis l'acte d'Union de 1707. Au titre de la Convention-cadre du Conseil de l'Europe pour la protection des minorités nationales, les Écossais sont reconnus comme minorité nationale sur la base de l'origine nationale (avis du Comité consultatif de 2016). Les communautés propriétaires de terres et les comités des pâturages communs ont leur propre fiche (« Communautés propriétaires de terres (Écosse) », « Crofters des pâturages communs (Écosse) »).
