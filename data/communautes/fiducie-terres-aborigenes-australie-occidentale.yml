base_nationale:
  - {instrument: "Aboriginal Affairs Planning Authority Act 1972 (Australie-Occidentale), loi no 24 de 1972, sanctionnée le 9 juin 1972, version consolidée du 28 mai 2026", nature: "loi", annee: 1972, source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/law_a1.html"}
  - {instrument: "Aboriginal Affairs Planning Authority Act Regulations 1972, règlement 8 (autorisations d'entrée sur les terres réservées)", nature: "loi", annee: 1972, source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_29665.htm"}
droits:
  autogouvernement: {valeur: "partiel", note: "La fiducie est une personne morale (s. 20) composée exclusivement de personnes d'ascendance aborigène, un président et six membres nommés par le ministre (s. 21) ; le ministre peut lui adresser des directives qu'elle doit suivre et n'est pas tenu par ses recommandations (s. 7).", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_49436.htm"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les terres de la partie III sont dévolues à l'Authority, c'est-à-dire au ministre constitué en personne morale (s. 8 et 27), et peuvent être placées sous la gestion de la fiducie par proclamation (s. 24) ; l'entrée d'une personne non aborigène sans autorisation constitue une infraction (s. 31) ; le gouverneur peut réserver l'usage exclusif d'une zone aux habitants aborigènes qui y résident ou y ont résidé et à leurs descendants (s. 32, tenure coutumière) ; la loi ne confère aucun titre de propriété aux communautés résidentes.", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_49436.htm"}
  ressources: {valeur: "partiel", note: "L'Authority peut percevoir, avec l'accord du Trésorier, loyers, redevances ou parts de bénéfices liés à l'usage des terres ou des ressources naturelles, au profit des personnes d'ascendance aborigène (s. 28(a)) ; le régime ne déroge pas au Mining Act 1978 ni aux lois sur le pétrole et les minéraux (s. 30(2)).", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_49436.htm"}
  consentement: {valeur: "partiel", note: "La fiducie doit gérer les terres conformément aux souhaits des habitants aborigènes, « dans la mesure où ils peuvent être connus et où c'est réalisable » (s. 23(c)) ; toute demande de droit sur une terre de la partie III est traitée en consultation avec l'Authority, c'est-à-dire le ministre, et non avec les habitants (s. 30(1)) ; le ministre consulte la fiducie avant de délivrer une autorisation d'entrée et, s'il s'écarte de son avis, en fait rapport aux deux chambres du Parlement de l'État (règlement 8(3) de 1972, s. 21A).", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_49436.htm"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Commission australienne de réforme du droit (rapport 126, 2015) indique que le titre des terres reste à la Couronne alors que l'objectif affiché est de remettre aux Aborigènes la gestion ou la propriété de toutes les terres de la fiducie (§ 3.32) ; le document de consultation publié par le gouvernement de l'État en 2026 recense encore 285 propriétés et présente un projet de loi destiné à lever les obstacles à leur transfert.", source: "https://www.alrc.gov.au/publication/connection-to-country-review-of-the-native-title-act-1993-cth-alrc-report-126/3-context-for-reform/land-rights-and-native-title-in-the-states-and-territories/"}
chronologie:
  - {annee: 1889, evenement: "L'Aborigines Act 1889 permet au gouverneur de réserver des terres de la Couronne aux Aborigènes ; en 1947, 15 millions d'hectares sont réservés."}
  - {annee: 1972, evenement: "Sanction de l'Aboriginal Affairs Planning Authority Act le 9 juin : création de l'Aboriginal Lands Trust et régime des terres réservées (partie III)."}
  - {annee: 1982, evenement: "Insertion de la section 21A : la fiducie peut déléguer sa consultation sur les autorisations d'entrée."}
  - {annee: 2010, evenement: "Insertion de la section 33A, qui confirme le pouvoir de consentir des baux sur les terres de la partie III."}
  - {annee: 2013, evenement: "Entrée en vigueur, le 7 août, de la loi no 38 de 2012, qui abroge la partie IV de la loi."}
  - {annee: 2026, evenement: "Consultation publique du 3 août au 4 septembre sur l'Aboriginal Affairs Planning Authority Amendment Bill 2026 : transfert des réserves de la partie III à des corporations aborigènes et délégation de la délivrance des autorisations."}
fiabilite:
  verifie: ["Sections 7, 8, 20, 21, 21A, 23, 24, 27, 28, 30, 31, 32 et 33A de la loi, version consolidée du 28 mai 2026 (legislation.wa.gov.au).", "285 propriétés distinctes, dont 81 réserves de la partie III, et 218 797 km² au total dans le jeu de données officiel DPLH-003, relevé le 1er octobre 2026.", "Chiffres du ministère (page mise à jour le 3 décembre 2025) : environ 22 millions d'hectares, 8,7 % de l'État, 12 000 habitants estimés, 142 établissements permanents, 81 réserves de la partie III.", "Règlement 8 des Aboriginal Affairs Planning Authority Act Regulations 1972 (autorisation d'entrée, consultation de la fiducie, rapport au Parlement).", "Aborigines Act 1889, 15 millions d'hectares réservés en 1947, titre maintenu à la Couronne : Commission australienne de réforme du droit, rapport 126, § 3.32.", "Objet du projet de loi de modification 2026 et dates de la consultation (haveyoursay.dplh.wa.gov.au)."]
  non_confirme: ["Nombre de propriétés : 285 dans le jeu de données et le document de consultation de 2026, 301 parcelles (243 réserves de la Couronne, 47 terres en pleine propriété, 6 baux à usage général, 5 baux pastoraux) sur la page du ministère.", "Surface des réserves de la partie III : 19 millions d'hectares selon le ministère, environ 20,7 millions selon le jeu de données ; la Commission de réforme du droit citait 27 millions d'hectares en 2015.", "Nombre de propriétés déjà transférées à des corporations aborigènes depuis 1972.", "Dépôt du projet de loi 2026 au Parlement de l'État après la consultation.", "Existence d'un document onusien visant ce régime."]
