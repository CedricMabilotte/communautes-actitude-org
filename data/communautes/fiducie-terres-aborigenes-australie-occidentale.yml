resume: >-
  Fiche agrégée : elle couvre les terres placées sous la gestion de l'Aboriginal Lands Trust (fiducie des terres aborigènes), personne morale créée par l'Aboriginal Affairs Planning Authority Act 1972 de l'État d'Australie-Occidentale ; elle compte un président et six autres membres, tous d'ascendance aborigène et nommés par le ministre. Selon le gouvernement de l'État (2026), le domaine compte 285 propriétés, environ 21,9 millions d'hectares, soit 8,7 % de la surface de l'État ; la plupart restent des terres de la Couronne. Sur les 81 réserves de la partie III de la loi, toute personne non aborigène doit détenir une autorisation d'entrée délivrée par le ministre après consultation de la fiducie, sauf les parlementaires et les agents agissant dans l'exercice d'une fonction légale. Un projet de loi de modification soumis à consultation jusqu'au 4 septembre 2026 prévoit de transférer ces réserves à des corporations aborigènes et de leur déléguer la délivrance des autorisations.
