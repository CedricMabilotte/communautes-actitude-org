base_nationale:
  - {instrument: "Motu Koita Assembly Act 2007 (loi n° 7 de 2007, certifiée le 3 juillet 2007)", nature: "loi", annee: 2007, source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
