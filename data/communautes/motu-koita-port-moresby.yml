droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée composée d'un président et de quatorze membres élus par les Motu-Koita, de deux élues des zones Est et Ouest et de trois membres désignés par l'assemblée (jeunes, entreprises, Églises) ; les élections sont organisées par la Commission électorale (Motu Koita Assembly Act 2007, art. 6, 10 et 11).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée légifère dans les zones motu-koita sur une liste de 29 matières (foncier, marchés, cimetières, mariages et adoptions coutumiers, sites sacrés, zones de pêche coutumières…) ; ses lois n'entrent en vigueur qu'avec l'accord écrit du ministre chargé des collectivités, réputé donné après 30 jours, et cèdent devant les lois du Parlement (art. 35 à 37).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi désigne les Motu et les Koita comme propriétaires fonciers coutumiers du district (art. 2) ; l'assemblée a pour fonction de protéger leurs terres coutumières et peut légiférer sur « land and land development » (le foncier et l'aménagement) dans les zones motu-koita (art. 4, 24 et 36).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  ressources: {valeur: "partiel", note: "Toute exploitation de ressources naturelles (minerais, pétrole, gaz, eau, bois, produits marins…) et tout projet industriel de grande échelle (500 000 kina ou plus) sur terre coutumière motu-koita exigent une licence d'accès délivrée par l'assemblée ; les droits d'accès sont reversés au village concerné et partagés à parts égales entre les propriétaires coutumiers, et un contrat de partage des bénéfices est obligatoire avant la licence (art. 2, 49 et 52).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  consentement: {valeur: "partiel", note: "Pour les projets de ressources naturelles et les grands projets industriels, le consentement préalable et éclairé des villages motu-koita et des propriétaires coutumiers directement touchés doit être obtenu par le promoteur et l'assemblée avant toute licence délivrée en vertu d'une autre loi (art. 50) ; aucune source trouvée sur l'application de cette règle.", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'assemblée peut lever des taxes (capitation, taxe foncière, licences) et reçoit des dotations nationales (art. 38 et 42) ainsi que 10 % de la taxe sur les produits et services (TPS) versée à la commission du district (art. 38 d) ; son budget et ses emprunts sont soumis à l'approbation du ministre des Finances (art. 43 et 46).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  representation: {valeur: "partiel", note: "Le président de l'assemblée siège de droit à la commission du district de la capitale nationale (art. 22) ; aucun siège réservé au Parlement national n'a été trouvé.", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  statut_personnel: {valeur: "partiel", note: "L'assemblée légifère sur les mariages et adoptions coutumiers, la compensation matrimoniale et l'état civil dans les zones motu-koita ; seule une personne dont le père ou la mère est motu koitabu et qui réside dans la zone depuis deux ans peut être candidate à un siège élu (art. 12 et 36).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/88031/PNG88031.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En décembre 2021, le président de l'assemblée écrit au Premier ministre que les parts de TPS dues à l'assemblée (2 % et 10 %, art. 33 et 33A de la loi sur la commission du district) et les dotations de l'art. 38 b de la loi de 2007 (taxes d'aéroport, droits de port, loyers des baux d'État) n'ont pas été versées, et conteste la loi d'amendement de 2021, qui fixe la part de l'assemblée à 2 % sans l'avoir consultée.", source: "https://www.thenational.com.pg/law-change-concerns-motu-koita-assembly/"}
chronologie:
  - {annee: 1982, evenement: "Le National Capital District Government Act crée la Motu Koitabu Interim Assembly, compétente pour légiférer dans dix villages et sur les terres coutumières associées."}
  - {annee: 1990, evenement: "La loi sur la commission du district de la capitale nationale fusionne l'assemblée intérimaire avec la commission."}
  - {annee: 1992, evenement: "Un amendement à la loi sur la commission du district crée le Motu Koitabu Council."}
  - {annee: 2004, evenement: "Un amendement attribue au conseil 2 % de la TPS perçue par la commission du district."}
  - {annee: 2007, evenement: "Le Motu Koita Assembly Act fait de l'assemblée une entité distincte de la commission du district."}
  - {annee: 2008, evenement: "Premières élections de l'assemblée."}
  - {annee: 2021, evenement: "La National Capital District Commission (Amendment) Law attribue 2 % de la TPS du district à l'assemblée ; son président, qui revendique 12 %, la conteste auprès du Premier ministre."}
