resume: >-
  Les Motu et les Koita (Koitabu) sont les propriétaires fonciers coutumiers de la région de Port Moresby, capitale de la Papouasie-Nouvelle-Guinée. Le Motu Koita Assembly Act 2007 établit pour eux « un système de gouvernement local » : une assemblée élue, compétente pour légiférer dans les villages et sur les terres coutumières motu-koita du district de la capitale nationale. La loi soumet tout projet d'exploitation de ressources naturelles ou tout grand projet industriel sur leurs terres coutumières à une licence d'accès délivrée par l'assemblée et au consentement préalable des villages concernés. L'institution succède à l'assemblée intérimaire créée en 1982, fusionnée avec la commission du district en 1990, puis au conseil motu koitabu (1992-2007).
