effectivite: {valeur: "contestee", note: "Projet d'amendement des lois CNT et SPT de 2016 renvoyé par la gouverneure ; banque foncière ayant reclassé des terres khuntkatti en terres publiques ; loi PESA appliquée 25 ans après son adoption ; responsables coutumiers critiques envers les règles de 2026.", source: "https://www.calj.in/post/from-protection-to-dispossession-how-jharkhand-s-executive-undermines-tribal-land-rights"}
chronologie:
