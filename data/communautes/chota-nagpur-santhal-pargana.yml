base_nationale:
  - {instrument: "Chota Nagpur Tenancy Act, 1908 (Bengal Act 6 de 1908), art. 46, 71A et 240", nature: "loi", annee: 1908, source: "https://www.lbsnaa.gov.in/storage/uploads/pdf_data/1740658547_23-Studies_in_the_Jharkhand_Tenancy_Laws.pdf"}
  - {instrument: "Santhal Pargana Tenancy (Supplementary Provisions) Act, 1949, art. 20", nature: "loi", annee: 1949, source: "https://www.lbsnaa.gov.in/storage/uploads/pdf_data/1740658547_23-Studies_in_the_Jharkhand_Tenancy_Laws.pdf"}
  - {instrument: "Mora Ho c. État du Bihar, Haute Cour de Patna, 2000 (règles de Wilkinson de 1837 reconnues comme coutume)", nature: "jurisprudence", annee: 2000, source: "https://www.drishtiias.com/daily-updates/daily-news-analysis/manki-munda-system-and-ho-tribe"}
  - {instrument: "Règles PESA du Jharkhand (Jharkhand PESA Rules, 2025), approuvées le 23 décembre 2025", nature: "loi", annee: 2025, source: "https://theprint.in/india/jharkhand-govt-notifies-pesa-rules-empowering-gram-sabhas/2817677/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Règles PESA de 2025 : assemblée de village présidée par une personne choisie selon la coutume, reconnaissance des systèmes manki-munda et majhi-pargana, indemnités pour plus de 28 500 responsables coutumiers.", source: "https://www.downtoearth.org.in/governance/pesa-act-implemented-in-jharkhand-after-25-years-but-will-it-change-tribal-lives"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Règles PESA de 2025 : l'assemblée de village règle les litiges de son ressort et peut infliger des amendes jusqu'à 2 000 roupies ; chez les Ho du Kolhan, le munda de village et le manki de groupe de villages tranchent les litiges selon la coutume reconnue par la Haute Cour de Patna en 2000.", source: "https://www.downtoearth.org.in/governance/pesa-act-implemented-in-jharkhand-after-25-years-but-will-it-change-tribal-lives"}
  terres: {valeur: "partiel", note: "Un tenancier tribal ne peut céder sa terre qu'à un autre membre de tribu du même ressort de police, avec l'accord du préfet de district, CNT 1908, art. 46 ; restitution des terres cédées en fraude, art. 71A ; terres khuntkatti des lignages fondateurs non vendables, art. 240 ; aucune cession d'une terre de tenancier n'est valable si le droit de céder n'est pas inscrit au registre des droits, SPT 1949, art. 20 (1).", source: "https://www.lbsnaa.gov.in/storage/uploads/pdf_data/1740658547_23-Studies_in_the_Jharkhand_Tenancy_Laws.pdf"}
  ressources: {valeur: "partiel", note: "Règles PESA de 2025 : l'assemblée de village gère les ressources naturelles et communes, les minéraux mineurs et les petits plans d'eau ; elle n'a pas de pouvoir sur les fonds miniers de district.", source: "https://www.downtoearth.org.in/governance/pesa-act-implemented-in-jharkhand-after-25-years-but-will-it-change-tribal-lives"}
  consentement: {valeur: "partiel", note: "La loi PESA impose la consultation de l'assemblée de village avant tout projet touchant les terres ; en l'absence de règles d'application, la Haute Cour du Jharkhand a suspendu les enchères de sable dans les zones répertoriées (Adivasi Buddhijeevi Manch c. État du Jharkhand) ; les règles de 2025 exigent l'accord préalable de l'assemblée pour l'acquisition de terres et la réinstallation (ThePrint).", source: "https://www.calj.in/post/from-protection-to-dispossession-how-jharkhand-s-executive-undermines-tribal-land-rights"}
