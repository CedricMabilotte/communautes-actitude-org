resume: >-
  Fiche agrégée : elle couvre les 32 tribus répertoriées du Jharkhand, dont les Santal, les Oraon, les Munda et les Ho. Deux lois foncières interdisent la cession des terres tribales à des non-tribaux : le Chota Nagpur Tenancy Act de 1908 (loi sur les baux du Chota Nagpur), qui protège aussi les terres des lignages fondateurs munda (khuntkatti), et le Santhal Pargana Tenancy Act de 1949. Les règles d'application de la loi PESA de 1996 (extension des conseils de village aux zones répertoriées), approuvées par le gouvernement de l'État le 23 décembre 2025, reconnaissent les systèmes coutumiers manki-munda et majhi-pargana et confient à l'assemblée de village la gestion de ressources et le règlement de litiges.
