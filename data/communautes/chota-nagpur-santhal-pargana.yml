  - {annee: 1949, evenement: "Santhal Pargana Tenancy (Supplementary Provisions) Act."}
  - {annee: 1969, evenement: "Insertion de l'art. 71A (restitution des terres) dans la loi de 1908."}
  - {annee: 2000, evenement: "Création de l'État du Jharkhand ; arrêt Mora Ho de la Haute Cour de Patna."}
  - {annee: 2016, evenement: "Projet d'amendement des lois CNT et SPT ; la gouverneure refuse son assentiment."}
  - {annee: 2025, evenement: "Règles PESA du Jharkhand approuvées par le gouvernement de l'État le 23 décembre."}
  - {annee: 2026, evenement: "Le 7 janvier, des responsables coutumiers contestent les règles devant le gouverneur."}
