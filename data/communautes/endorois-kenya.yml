effectivite: {valeur: "contestee", note: "Le CESCR relève en 2016 que le groupe de travail créé le 26 septembre 2014 pour appliquer la décision de la Commission africaine ne comprend pas d'Endorois ; le CERD signale en 2017 des attaques et expulsions ; le Rapporteur spécial note en 2025 que la décision n'est pas appliquée.", source: "https://docs.un.org/fr/E/C.12/KEN/CO/2-5"}
chronologie:
  - {annee: 1973, evenement: "Création de la réserve de chasse du lac Hannington sur les terres endorois."}
  - {annee: 1978, evenement: "Nouveau classement en réserve de chasse du lac Bogoria."}
  - {annee: 2009, evenement: "Décision de la Commission africaine des droits de l'homme et des peuples (communication 276/2003) : reconnaissance de la propriété, restitution, indemnisation, redevances."}
  - {annee: 2010, evenement: "Nouvelle Constitution : terres communautaires (art. 63) et communautés marginalisées (art. 260)."}
  - {annee: 2011, evenement: "Inscription de la réserve du lac Bogoria au patrimoine mondial de l'UNESCO, avec les lacs Nakuru et Elmenteita."}
  - {annee: 2014, evenement: "Création le 26 septembre d'un groupe de travail sur l'application de la décision."}
  - {annee: 2016, evenement: "Adoption de la loi sur les terres communautaires."}
  - {annee: 2017, evenement: "Avis légal n° 265 : plus de 13 000 ha revendiqués par les Endorois classés en forêt de Mukutani (comté de Baringo), selon une tribune publiée en 2025."}
  - {annee: 2017, evenement: "Le CERD signale des attaques et expulsions visant les Endorois et demande la reconnaissance juridique de leurs droits collectifs."}
  - {annee: 2025, evenement: "Le Rapporteur spécial de l'ONU constate que la décision de 2009 n'est pas appliquée (A/HRC/60/29)."}
