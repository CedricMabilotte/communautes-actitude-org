resume: >-
  Les Endorois sont une communauté pastorale de la région du lac Bogoria, dans la vallée du Rift ; le recensement de 2019 en compte un peu plus de 45 000, la requête déposée en leur nom environ 60 000.
  La création de la réserve de chasse du lac Hannington en 1973, puis de celle du lac Bogoria en 1978, les a privés de l'accès à ces terres.
  En 2009, la Commission africaine des droits de l'homme et des peuples a demandé au Kenya de reconnaître leur propriété et de leur restituer ces terres ; la décision n'est pas appliquée.
  En droit kenyan, ils relèvent des dispositions générales de la Constitution de 2010 sur les terres communautaires et les communautés marginalisées.
  Le régime général des terres communautaires enregistrées est décrit dans la fiche « Terres communautaires enregistrées du Kenya ».
reconnaissance_regionale:
  - {mecanisme: "commission_africaine", detail: "Décision de novembre 2009 (communication 276/2003, Endorois Welfare Council c. Kenya) : violation des art. 1, 8, 14, 17, 21 et 22 de la Charte africaine ; recommandations : reconnaître la propriété et restituer les terres ancestrales, garantir l'accès au lac Bogoria, indemniser, verser des redevances, enregistrer l'Endorois Welfare Committee.", annee: 2009, source: "https://www.hlrn.org/img/documents/achpr4627603eng.pdf"}
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial Rodolfo Stavenhagen cite les Endorois parmi les communautés pastorales autochtones du Kenya et décrit la division de leur territoire entre unités administratives (A/HRC/4/32/Add.3).", annee: 2007, source: "https://docs.un.org/en/A/HRC/4/32/Add.3"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme relève l'expulsion des Endorois de leurs terres ancestrales et la non-exécution de la décision de la Commission africaine (CCPR/C/KEN/CO/3, par. 24).", annee: 2012, source: "https://docs.un.org/fr/CCPR/C/KEN/CO/3"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits économiques, sociaux et culturels consacre une section aux Endorois et recommande d'appliquer sans délai la décision 276/2003 (E/C.12/KEN/CO/2-5, par. 15-16).", annee: 2016, source: "https://docs.un.org/fr/E/C.12/KEN/CO/2-5"}
  - {mecanisme: "organe_traite", detail: "Le CERD demande de reconnaître juridiquement les droits collectifs des Endorois sur leurs terres, ressources et territoires (CERD/C/KEN/CO/5-7, par. 20).", annee: 2017, source: "https://docs.un.org/fr/CERD/C/KEN/CO/5-7"}
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial Albert K. Barume range la décision en faveur des Endorois parmi trois décisions régionales « still unimplemented » (non appliquées) (A/HRC/60/29, par. 39).", annee: 2025, source: "https://docs.un.org/en/A/HRC/60/29"}
