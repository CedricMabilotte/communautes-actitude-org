resume: >-
  Le Nakhitchevan est une exclave de l'Azerbaïdjan, séparée du reste du pays par le territoire arménien. Autonome depuis 1924 sous le régime soviétique, il porte le nom de République autonome du Nakhitchevan depuis le 17 novembre 1990. La Constitution de l'Azerbaïdjan de 1995 (art. 134 à 141) lui reconnaît une assemblée législative, l'Ali Majlis (« Assemblée suprême ») de 45 membres élus pour cinq ans, un Cabinet des ministres et des tribunaux propres ; sa propre constitution a été approuvée par une loi constitutionnelle du 29 décembre 1998. L'autonomie ne repose sur aucune désignation ethnique. Une révision de mars 2026 crée une représentation du président de l'Azerbaïdjan, organe exécutif dirigé par un représentant qu'il nomme et qui lui est directement subordonné.
