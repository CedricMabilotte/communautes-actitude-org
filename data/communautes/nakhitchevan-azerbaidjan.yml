    - "Liste des législatures de l'Ali Majlis (VIIe depuis 2024) sur le site de l'Ali Majlis."
    - "Paragraphes 32 et 40 du document CCPR/C/AZE/CO/4."
    - "Démission de Vassif Talibov le 21 décembre 2022 (OCCRP)."
