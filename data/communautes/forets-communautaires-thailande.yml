resume: >-
  Fiche agrégée : elle couvre les communautés villageoises titulaires d'une forêt communautaire (pa chumchon) au titre de la loi sur la forêt communautaire de 2019 (Phra Ratchabanyat Pa Chumchon B.E. 2562), publiée au Journal officiel le 29 mai 2019. Au moins cinquante personnes d'une communauté située dans le même district (amphoe) que la forêt, domiciliées dans la zone depuis cinq ans, demandent l'établissement d'une forêt située hors des aires protégées ; une fois l'approbation publiée, les demandeurs deviennent membres et leur comité de gestion gère la forêt selon un plan de cinq ans approuvé par le comité provincial. La terre reste publique, le prélèvement de bois est limité à l'usage domestique ou collectif, et le directeur général du Département royal des forêts peut annuler la forêt. Au 31 juillet 2026, le Département recense 11 242 forêts communautaires, 12 857 villages et 6,24 millions de rai (environ 9 990 km²).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la Thaïlande à la Convention sur la diversité biologique (juin 2019) : présente la loi sur la forêt communautaire, qui « réaffirme les droits des communautés » à établir des plans de gestion et à utiliser les produits de leurs forêts, avec comités national, provinciaux et communautaires ; indique 10 144 km² de forêts communautaires dans 12 248 villages", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/th-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Constitution du Royaume de Thaïlande (2017), art. 43 : droit des personnes et des communautés de gérer, entretenir et utiliser les ressources naturelles « selon les procédures prévues par la loi »", nature: "constitution", annee: 2017, source: "https://www.constituteproject.org/constitution/Thailand_2017?lang=en"}
  - {instrument: "Loi sur la forêt communautaire B.E. 2562 (2019), Journal officiel vol. 136, partie 71 Kor, 29 mai 2019", nature: "loi", annee: 2019, source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le comité de gestion de la forêt communautaire est élu parmi les demandeurs (art. 33 (3) et 42 de la loi de 2019) et exprime la volonté de la communauté par résolution (art. 43) ; le comité provincial peut révoquer tout ou partie du comité à la majorité des trois quarts (art. 44) et lui donner des ordres (art. 74), et le directeur général du Département royal des forêts peut annuler la forêt (art. 78).", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité de gestion édicte les règles de gestion de la forêt, d'admission des membres et de gestion des biens communs (art. 44 (2) de la loi de 2019), dans le cadre des règlements du Comité national de politique (art. 17) ; ces règles et le plan de gestion de cinq ans sont soumis à l'approbation du comité provincial (art. 26 (5) et 46).", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  justice_propre: {valeur: "partiel", note: "Le comité de gestion peut ordonner à une personne qui enfreint ses règles de quitter la forêt, sert de médiateur dans les différends de gestion (art. 44 (6) et (7) de la loi de 2019) et peut exclure un membre à la majorité des trois quarts (art. 45) ; les sanctions pénales et les amendes administratives relèvent des agents de l'État (art. 82 à 95).", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  terres: {valeur: "partiel", note: "La forêt communautaire est établie sur une forêt ou une terre publique hors aires protégées (art. 4 de la loi de 2019), avec des limites publiées au Journal officiel (art. 40) ; son établissement ne change pas le statut de la terre (art. 7), nul ne peut l'occuper pour y résider ou en tirer sa subsistance (art. 63 (1)), et elle peut être annulée, notamment pour un motif de sécurité nationale (art. 78).", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  ressources: {valeur: "partiel", note: "Les membres récoltent les produits forestiers et utilisent le bois de la zone d'utilisation, sauf les bois précieux, pour l'usage domestique ou les activités collectives, selon le plan approuvé (art. 50 de la loi de 2019) ; ils peuvent pratiquer l'écotourisme (art. 51) et ne paient ni redevance ni droit d'entretien forestier sur ces produits (art. 54).", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La moitié des amendes perçues pour des infractions commises dans une forêt communautaire alimente le fonds de cette forêt (art. 55 de la loi de 2019) ; le comité peut percevoir des droits sur les non-membres aux taux fixés par le Comité national de politique ; ces recettes, les dons et les crédits publics forment les biens communs de la forêt, gérés selon les règles de ce comité (art. 56).", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  representation: {valeur: "partiel", note: "Le Comité national de politique, présidé par un vice-Premier ministre, compte au plus quatre représentants des présidents des réseaux provinciaux de forêts communautaires (art. 9 (4) de la loi de 2019) ; chaque comité provincial comprend le président du réseau provincial et au plus trois représentants des comités de gestion (art. 23 et 25), nommés sur liste.", source: "https://data.opendevelopmentmekong.net/en/laws_record/community-forestry-act-b-e-2562-2019"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En février 2025, le RECOFTC (Centre pour les populations et les forêts) indique que la plupart des communautés n'ont pas les moyens de rédiger un plan de gestion applicable ; un coordinateur cité dans la même publication indique que des aires gérées par des communautés, rangées dans de nouvelles catégories d'aires protégées, ne sont plus considérées comme forêts communautaires.", source: "https://www.recoftc.org/stories/thailand-community-forest-act-governance"}
chronologie:
  - {annee: 1987, evenement: "Le Département royal des forêts lance son projet de développement des forêts communautaires (sixième rapport national à la CDB)."}
  - {annee: 2017, evenement: "La Constitution reconnaît aux communautés le droit de gérer et d'utiliser les ressources naturelles selon la loi (art. 43)."}
  - {annee: 2019, evenement: "Sanction royale le 24 mai et publication au Journal officiel le 29 mai de la loi sur la forêt communautaire ; les chapitres 4 à 8 entrent en vigueur 180 jours après la publication. Les forêts communautaires existantes sont réputées approuvées au titre de la loi (art. 99 et 100)."}
  - {annee: 2019, evenement: "Le sixième rapport national à la CDB compte 10 144 km² de forêts communautaires dans 12 248 villages."}
  - {annee: 2025, evenement: "Le RECOFTC compte 11 984 forêts communautaires enregistrées et environ 1,07 million d'hectares."}
  - {annee: 2026, evenement: "Au 31 juillet, le Département royal des forêts recense 11 242 forêts communautaires, 12 857 villages et 6 242 459 rai."}
fiabilite:
  verifie: ["Texte de la loi de 2019 (traduction anglaise non officielle et texte thaï du Journal officiel, vol. 136, partie 71 Kor), art. 2, 4, 7, 9, 23, 25, 26, 32, 33, 40, 42 à 46, 50, 51, 54 à 57, 63, 74, 78, 99 à 102.", "Art. 43 de la Constitution de 2017 (Constitute Project).", "11 242 forêts communautaires, 12 857 villages et 6 242 459 rai : tableau récapitulatif « 7. ข้อมูลป่าชุมชนตามพรบ. อัพเว็บ 31 กรกฎาคม 2569 », données au 31 juillet 2026 (2569 du calendrier bouddhique), ventilées par bureau de gestion des ressources forestières du Département royal des forêts ; les 11 242 lignes du tableau par site correspondent aux fiches provinciales (68 provinces).", "Description de la loi et chiffres de 10 144 km² et 12 248 villages : sixième rapport national de la Thaïlande à la CDB (juin 2019).", "11 984 forêts enregistrées, 1,07 million d'hectares, difficultés des plans de gestion et reclassement en aires protégées : RECOFTC, février 2025."]
  non_confirme: ["Écart entre les 11 984 forêts du RECOFTC (2025) et les 11 242 forêts du Département royal des forêts (2026) : la cause (annulations, reclassements ou différence de périmètre) n'a pas été établie.", "Tableau par site : la somme des surfaces des fiches provinciales (6 236 100 rai) diffère de 0,1 % du total récapitulatif (6 242 459 rai) ; l'année indiquée est celle de l'approbation du projet par le directeur général du Département, convertie du calendrier bouddhique, souvent antérieure à la loi.", "Application de l'art. 102 (dépôt d'un nouveau plan de gestion dans les deux ans, sous peine d'annulation) : nombre de forêts annulées à ce titre non trouvé.", "Population : aucun nombre de membres ou de ménages trouvé dans le tableau du Département.", "Rattachement du tableau au Département royal des forêts : la page de téléchargement du site du Département (forest.go.th) n'a pas pu être consultée lors de la vérification ; l'attribution repose sur le titre du fichier et sur sa ventilation par bureaux du Département.", "Le sixième rapport national à la CDB donne deux séries de chiffres : 10 144 km² dans 12 248 villages, et un registre officiel de 2 757 sites couvrant 3 917 km² en 2018 ; l'écart n'est pas expliqué.", "Texte et date des règlements du Comité national de politique pris en application de la loi non consultés."]
