resume: >-
  Les Pnar, aussi appelés Jaintia, vivent à l'est du Meghalaya, avec les War, les Bhoi et les Biate. Le Jaintia Hills Autonomous District Council, issu le 1er décembre 1964 de la division du conseil des Khasi et Jaintia Hills créé en 1952 en application de la Sixième annexe de la Constitution, couvre deux districts. Il légifère sur les terres, les forêts non classées, les chefs et les coutumes, et fait fonctionner des tribunaux coutumiers. Ses recettes minières sont réduites depuis l'interdiction de l'extraction du charbon en 2014. Les fiches Khasi et Garo décrivent les deux autres conseils du Meghalaya.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître officiellement les peuples tribaux comme groupes distincts ayant droit à une protection spéciale ; § 12 : loi sur les pouvoirs spéciaux des forces armées dans les États du nord-est ; § 19 : demande le consentement préalable des communautés tribales touchées par les barrages du nord-est ; les Pnar ne sont pas nommés", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, art. 244 (2) et Sixième annexe", nature: "constitution", annee: 1950, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Jowai Autonomous District (Administration) Act, 1967, loi du conseil", nature: "loi", annee: 1967, source: "https://www.casemine.com/judgement/in/56b4952f607dba348f0114ee"}
  - {instrument: "Meghalaya (Taking Over the District Council Lower Primary Schools) Act, 1993, en vigueur le 2 juin 1994", nature: "loi", annee: 1993, source: "https://meghalayamonitor.com/jhadc-providing-salaries-to-over-300-teachers-audit-report/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, Sixième annexe (régime des districts tribaux autonomes), paragraphe 2 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 ; au Meghalaya, une loi de l'État contraire l'emporte sur la loi du conseil, paragraphe 12A (a). Le conseil a adopté en 1967 la Jowai Autonomous District (Administration) Act, publiée après l'assentiment du gouverneur (Haute Cour de Gauhati, 2012).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Tribunaux de village, tribunaux subordonnés et tribunal du conseil de district pour les litiges entre membres des tribus répertoriées, Sixième annexe, paragraphe 4 ; pour les Jaintia Hills, ces tribunaux relèvent de la Jowai Autonomous District (Administration) Act, 1967, et jugent selon les coutumes (communiqué du gouvernement du Meghalaya, 2019).", source: "https://www.meghalaya.gov.in/sites/default/files/press_release/Seminar_on_District_Council_Courts.pdf"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "conteste", note: "Le conseil peut créer et gérer des écoles primaires et fixer la langue et les modalités de l'enseignement primaire, avec l'accord préalable du gouverneur, Sixième annexe, paragraphe 6 (1). Une loi du Meghalaya de 1993, en vigueur en 1994, transfère à l'État les écoles primaires des conseils ; un audit de 2025 relève que le conseil gère encore 77 écoles et rémunère 327 enseignants, dépense qu'il juge irrégulière (Meghalaya Monitor, 2 février 2025).", source: "https://meghalayamonitor.com/jhadc-providing-salaries-to-over-300-teachers-audit-report/"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des personnes n'appartenant pas aux tribus répertoriées, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "partiel", note: "Sièges réservés aux tribus répertoriées (Scheduled Tribes, liste constitutionnelle) à l'Assemblée législative du Meghalaya, Constitution, art. 332 (1) et (3A) ; la réserve vise l'ensemble des tribus répertoriées de l'État, sans sièges propres aux Pnar.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j). En juin 2026, le comité exécutif du conseil a décidé de préparer une loi sur l'enregistrement et la protection des clans (Shillong Times, 28 juin 2026).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le conseil fonctionne : élu le 21 février 2025 (29 sièges), il vote son budget, déficitaire de 15,62 crores de roupies pour 2026-2027 (Highland Post, 18 mars 2026). L'interdiction de l'extraction du charbon par le Tribunal national vert en avril 2014 a tari les redevances perçues aux postes de contrôle ; en juin 2026, les 30 membres demandent sa levée et une modification présidentielle des lois minières au titre du paragraphe 12A (b) (Shillong Times, 25 juin 2026). Les salaires du personnel ont été versés avec retard, et le conseil a accepté en 2026 un programme de réformes proposé par l'État.", source: "https://theshillongtimes.com/2026/06/25/jhadc-resolution-demands-lifting-of-ban-on-coal-mining/"}
chronologie:
  - {annee: 1952, evenement: "Création du conseil des Khasi et Jaintia Hills."}
  - {annee: 1964, evenement: "Le 1er décembre, la subdivision de Jowai devient un district autonome distinct, doté de son conseil."}
  - {annee: 1967, evenement: "Loi du conseil sur l'administration du district de Jowai."}
  - {annee: 1973, evenement: "Le 14 juin, le district de Jowai prend le nom de Jaintia Hills."}
  - {annee: 1994, evenement: "Entrée en vigueur de la loi du Meghalaya de 1993 qui transfère à l'État les écoles primaires des conseils."}
  - {annee: 2012, evenement: "Le 31 juillet, le district de Jaintia Hills est divisé en West et East Jaintia Hills."}
  - {annee: 2014, evenement: "En avril, le Tribunal national vert interdit l'extraction du charbon au Meghalaya."}
  - {annee: 2025, evenement: "Élection du conseil le 21 février ; le parti NPP obtient 13 des 29 sièges élus."}
  - {annee: 2026, evenement: "En juin, le conseil demande la levée de l'interdiction de l'extraction du charbon, décide de préparer une loi sur les clans et accepte un programme de réformes proposé par l'État."}
