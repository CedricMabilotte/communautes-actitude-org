resume: >-
  Fiche agrégée : elle couvre les deux échelons inférieurs du système d'autonomie régionale des nationalités, les préfectures autonomes (30) et les districts ou bannières autonomes (120, chiffres de 2003). Les cinq régions autonomes ont leur propre fiche. Chaque zone porte le nom d'une ou de plusieurs nationalités minoritaires titulaires, par exemple les Coréens à Yanbian (Jilin), les Yi à Liangshan (Sichuan), les Dai à Xishuangbanna (Yunnan) ou les Tibétains dans six préfectures du Qinghai, deux du Sichuan, une du Gansu et une du Yunnan. La loi de 1984 sur l'autonomie régionale des nationalités, modifiée en 2001, réserve le poste de préfet ou de chef de district à un membre de la nationalité titulaire et permet à l'assemblée populaire locale d'adopter un règlement d'autonomie (texte fondateur propre à la zone) et des règlements particuliers, soumis à l'approbation de la province. Selon une étude universitaire de 2017, 25 des 30 préfectures et 110 des 120 districts autonomes avaient adopté un règlement d'autonomie, alors qu'aucune des cinq régions autonomes ne l'avait fait.
