reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/CHN/CO/14-17, § 18 (pauvreté dans toutes les régions autonomes ethniques) et § 26-27 (agriculteurs et éleveurs nomades de zones autonomes ethniques privés de leurs terres par des mesures de réinstallation, consentement éclairé non obtenu de manière systématique)", annee: 2018, source: "https://docs.un.org/fr/CERD/C/CHN/CO/14-17"}
  - {mecanisme: "organe_traite", detail: "Comité des droits économiques, sociaux et culturels, E/C.12/CHN/CO/3, § 27-28 : petits agriculteurs et éleveurs nomades ayant perdu leurs terres, notamment dans des zones ethniques autonomes, et réinstallation d'éleveurs tibétains sans consentement préalable, libre et éclairé", annee: 2023, source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
base_nationale:
  - {instrument: "Constitution de la République populaire de Chine, art. 4 et 112 à 122", nature: "constitution", annee: 1982, source: "https://www.constituteproject.org/constitution/China_2018"}
  - {instrument: "Loi sur l'autonomie régionale des nationalités (1984, modifiée en 2001)", nature: "loi", annee: 2001, source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
droits:
  autogouvernement: {valeur: "partiel", note: "Assemblée populaire et gouvernement de la préfecture ou du district sont les organes d'autogouvernement ; le préfet ou le chef de district est un citoyen de la nationalité titulaire, les autres nationalités ont droit à une représentation à l'assemblée, loi sur l'autonomie régionale, art. 15, 16 et 17 (2001).", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée adopte un règlement d'autonomie et des règlements particuliers, qui entrent en vigueur après approbation du comité permanent de l'assemblée de la province, loi sur l'autonomie régionale, art. 19 (2001) ; elle peut adapter ou suspendre une décision d'un organe supérieur avec l'accord de celui-ci, art. 20. Selon Yang Feng (2017), 25 préfectures et 110 districts avaient adopté un règlement d'autonomie et les préfectures avaient adopté 233 règlements particuliers.", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les organes d'autogouvernement définissent, conformément à la loi, la propriété et le droit d'usage des pâturages et des forêts, loi sur l'autonomie régionale, art. 27 (2001).", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  ressources: {valeur: "partiel", note: "Gestion et protection des ressources naturelles et priorité d'exploitation dans le cadre des plans de l'État, loi sur l'autonomie régionale, art. 28 ; compensation due par l'État pour les ressources transportées hors de la zone, art. 65 (2001).", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  consentement: {valeur: "partiel", note: "La création d'une zone autonome, ses limites et son nom sont proposés après pleine consultation des représentants des nationalités concernées ; sa suppression ou la modification de ses limites exige la consultation de ses organes d'autogouvernement, loi sur l'autonomie régionale, art. 14 (2001). Aucune obligation de consentement pour les projets n'a été trouvée.", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  langue: {valeur: "partiel", note: "Les organes d'autogouvernement utilisent une ou plusieurs langues d'usage courant dans la zone, la langue de la nationalité titulaire pouvant être langue principale ; tribunaux et parquets utilisent la langue locale, loi sur l'autonomie régionale, art. 21 et 47 (2001).", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  education: {valeur: "partiel", note: "Les organes d'autogouvernement décident, selon les orientations de l'État, des plans de développement de l'enseignement, des programmes et de la langue d'enseignement, loi sur l'autonomie régionale, art. 36 et 37 (2001).", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  fiscalite: {valeur: "partiel", note: "Finances propres gérées par les organes d'autogouvernement dans le système financier de l'État ; exonérations fiscales locales soumises à l'approbation du gouvernement de la province, loi sur l'autonomie régionale, art. 32 et 34 (2001).", source: "http://www.npc.gov.cn/zgrdw/englishnpc/Law/2007-12/13/content_1383908.htm"}
  representation: {valeur: "partiel", note: "Constitution, art. 59 : toutes les nationalités minoritaires ont droit à une représentation appropriée à l'Assemblée populaire nationale ; le texte ne fixe pas de nombre de sièges.", source: "https://www.constituteproject.org/constitution/China_2018"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La plupart des préfectures et districts ont adopté un règlement d'autonomie, mais ces textes reprennent pour l'essentiel la loi et deux modèles (Yanbian 1985, Xinhuang 1986) ; en 1992, la commission des affaires législatives du Comité permanent de l'Assemblée populaire nationale a jugé contraire à la loi la disposition du règlement de Yanbian qui réserve à la nationalité titulaire la présidence du comité permanent de l'assemblée, et aucune zone ne l'a reprise ensuite (Yang Feng, 2017). Le Comité pour l'élimination de la discrimination raciale (2018) et le Comité des droits économiques, sociaux et culturels (2023) relèvent des pertes de terres et des réinstallations sans consentement dans des zones autonomes ethniques.", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
chronologie:
  - {annee: 1952, evenement: "Création des zones autonomes coréenne de Yanbian et yi de Liangshan, alors dénommées « régions autonomes » ; elles deviennent des préfectures autonomes après la Constitution de 1954."}
  - {annee: 1982, evenement: "La Constitution consacre l'autonomie régionale des nationalités à trois échelons : régions, préfectures et districts (art. 4 et 112 à 122)."}
  - {annee: 1984, evenement: "Loi sur l'autonomie régionale des nationalités."}
  - {annee: 1985, evenement: "Règlement d'autonomie de la préfecture autonome coréenne de Yanbian, modèle repris par d'autres zones."}
  - {annee: 1992, evenement: "La commission des affaires législatives du Comité permanent de l'Assemblée populaire nationale juge contraire à la loi sur l'autonomie régionale la clause du règlement de Yanbian qui réserve à la nationalité coréenne la présidence du comité permanent de l'assemblée de la préfecture."}
  - {annee: 2001, evenement: "Modification de la loi sur l'autonomie régionale ; la plupart des zones révisent ensuite leur règlement d'autonomie."}
  - {annee: 2003, evenement: "155 zones autonomes : 5 régions, 30 préfectures et 120 districts ou bannières ; 133 règlements d'autonomie et 384 règlements particuliers adoptés."}
  - {annee: 2018, evenement: "Observations du Comité pour l'élimination de la discrimination raciale sur les zones autonomes ethniques."}
  - {annee: 2023, evenement: "Observations du Comité des droits économiques, sociaux et culturels sur les réinstallations dans les zones ethniques autonomes."}
fiabilite:
  verifie: ["Articles 2, 12, 14, 15, 16, 17, 19, 20, 21, 27, 28, 32, 34, 36, 37, 46, 47 et 65 de la loi sur l'autonomie régionale, version de 2001, sur le site anglais de l'Assemblée populaire nationale.", "Chiffres de 2003 (5 régions, 30 préfectures, 120 districts ou bannières ; 133 règlements d'autonomie et 384 règlements particuliers ; 71 % de la population des minorités vivant dans des zones autonomes où elle est titulaire ; 64 % du territoire) : livre blanc de 2005 reproduit par l'ambassade de Chine en Irlande.", "Règlements d'autonomie adoptés par 25 des 30 préfectures et 110 des 120 districts ; 233 règlements particuliers adoptés par 28 préfectures ; 256 règlements particuliers des districts en 2008 ; réponse de juin 1992 de la commission des affaires législatives : Yang Feng, Asian-Pacific Law & Policy Journal, 2017.", "CERD/C/CHN/CO/14-17, § 18 et 26-27, et E/C.12/CHN/CO/3, § 27-28."]
  non_confirme: ["Nombre actuel de districts et bannières autonomes : le chiffre de 120 date de 2003 ; des fusions ou transformations en villes ont pu le modifier depuis.", "Liste et années de création des 30 préfectures relevées sur Wikipédia en chinois, non recoupées une à une sur le site du ministère des Affaires civiles, inaccessible ; la liste des 120 districts et bannières n'est pas reproduite dans le tableau.", "Adoption après 2017 de règlements d'autonomie par les cinq préfectures du Xinjiang qui n'en avaient pas : non vérifiée.", "Population des nationalités titulaires et surface cumulée des préfectures et districts : aucun chiffre officiel consulté.", "Contenu du règlement d'autonomie de chaque zone (langue, terres, cadres) : seul celui de Yanbian est décrit par la source universitaire consultée.", "Les districts autonomes situés à l'intérieur des cinq régions autonomes (par exemple en Mongolie-Intérieure ou au Guangxi) relèvent de cette fiche ; leur répartition n'a pas été vérifiée.", "Nombre de villages : non trouvé."]
