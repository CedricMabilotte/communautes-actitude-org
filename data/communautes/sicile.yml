resume: >-
  La Sicile et ses îles forment une Région autonome dotée de la personnalité juridique, en vertu du Statut approuvé par le décret législatif royal n° 455 du 15 mai 1946 et converti en loi constitutionnelle n° 2 du 26 février 1948. L'Assemblée régionale, réduite de quatre-vingt-dix à soixante-dix députés par la loi constitutionnelle n° 2 de 2013, a la législation exclusive (compétence législative sans partage avec l'État) dans les dix-sept rubriques de l'article 14 du Statut, dont l'agriculture, les forêts, les usi civici (droits d'usage collectifs des habitants sur des terres), la pêche et le régime des collectivités locales. La Région pourvoit à ses besoins financiers par ses revenus patrimoniaux et par des impôts qu'elle délibère. Le Statut ne contient aucune disposition sur la langue ; le sicilien ne figure pas parmi les minorités linguistiques de la loi 482/1999.
