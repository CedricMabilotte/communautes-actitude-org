base_nationale:
  - {instrument: "Statut de la Région sicilienne (décret législatif royal n° 455 du 15 mai 1946, converti par la loi constitutionnelle n° 2 du 26 février 1948, modifié par les lois constitutionnelles n° 1 de 1972, n° 3 de 1989, n° 2 de 2001 et n° 2 de 2013), texte coordonné publié par l'Assemblée régionale", nature: "statut_autonomie", annee: 1948, source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  - {instrument: "Loi constitutionnelle n° 2 du 7 février 2013 modifiant l'article 3 du Statut (réduction du nombre de députés de l'Assemblée régionale)", nature: "statut_autonomie", annee: 2013, source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  - {instrument: "Cour constitutionnelle, arrêt n° 255 de 2014 (contrôle des lois régionales siciliennes)", nature: "jurisprudence", annee: 2014, source: "https://www.giurcost.org/decisioni/2014/0255s-14.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Sicile est constituée en Région autonome dotée de la personnalité juridique, Statut, art. 1 ; ses organes sont l'Assemblée régionale, élue au suffrage universel direct, la Junte et le Président de la Région, élu au suffrage universel direct, art. 2, 3 et 9 ; l'Assemblée compte soixante-dix députés depuis la loi constitutionnelle n° 2 de 2013.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée a la législation exclusive, dans les limites des lois constitutionnelles, sur l'agriculture et les forêts, les usi civici, les mines, les eaux publiques, la pêche et la chasse, l'urbanisme, le régime des collectivités locales et l'instruction élémentaire, Statut, art. 14 ; elle légifère dans le cadre des principes des lois de l'État sur les transports, la santé, l'enseignement secondaire et universitaire, le crédit et la législation sociale, art. 17.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  justice_propre: {valeur: "partiel", note: "La Région n'a pas de juridiction propre ; les organes juridictionnels centraux ont en Sicile des sections pour les affaires de la Région, les magistrats de la Cour des comptes sont nommés d'un commun accord par les gouvernements de l'État et de la Région, et les recours administratifs extraordinaires contre les actes régionaux sont tranchés par le Président de la Région après avis des sections régionales du Conseil d'État, Statut, art. 23 ; l'Alta Corte (Haute Cour) prévue aux art. 24 à 30 a vu sa compétence absorbée par la Cour constitutionnelle, arrêt n° 38 de 1957.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  terres: {valeur: "partiel", note: "Législation exclusive sur les usi civici et l'expropriation pour cause d'utilité publique, Statut, art. 14, lettres c et s ; les biens du domaine de l'État situés dans la Région lui sont attribués, sauf ceux qui intéressent la défense ou des services nationaux, art. 32 et 33 ; ces droits appartiennent à la Région, pas à un sujet collectif distinct.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  ressources: {valeur: "reconnu", note: "Législation exclusive sur les mines, carrières, tourbières et salines, les eaux publiques hors ouvrages d'intérêt national, la pêche et la chasse, Statut, art. 14, lettres h, i et l ; les eaux publiques sont attribuées à la Région, art. 32 ; les forêts domaniales et les mines dont la disposition est retirée au propriétaire du fonds font partie de son patrimoine indisponible, art. 33.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  consentement: {valeur: "partiel", note: "Le Président de la Région participe au Conseil des ministres avec voix délibérative dans les matières qui intéressent la Région, Statut, art. 21 ; les plafonds des tarifs douaniers qui intéressent la Région sont fixés après consultation du Gouvernement régional, art. 39 ; les projets de modification du Statut d'initiative gouvernementale ou parlementaire sont soumis à l'avis de l'Assemblée régionale, rendu dans les deux mois, qui détient aussi l'initiative, art. 41 ter ; il s'agit d'avis, sans droit de veto.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Législation exclusive sur l'instruction élémentaire, les musées, les bibliothèques et les académies, Statut, art. 14, lettre r ; législation dans le cadre des principes des lois de l'État sur l'instruction secondaire et universitaire, art. 17, lettre d.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  fiscalite: {valeur: "reconnu", note: "Les besoins financiers de la Région sont couverts par ses revenus patrimoniaux et par des impôts qu'elle délibère, les impôts de production et les recettes des tabacs et du loto restant à l'État, Statut, art. 36 ; l'impôt sur la part de revenu des établissements situés en Sicile d'entreprises ayant leur siège hors de l'île revient à la Région, art. 37 ; l'Assemblée approuve le budget régional, art. 19.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  representation: {valeur: "partiel", note: "Le Président de la Région participe, avec rang de ministre et voix délibérative, au Conseil des ministres pour les matières qui intéressent la Région, Statut, art. 21 ; la Région désigne un représentant pour la fixation des tarifs ferroviaires et l'organisation des services nationaux de transport qui l'intéressent, art. 22.", source: "https://www.ars.sicilia.it/sites/default/files/downloads/2019-06/Statuto2019.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Par l'arrêt n° 255 de 2014, déposé le 13 novembre 2014, la Cour constitutionnelle a rendu inopérantes les règles statutaires sur le contrôle préalable des lois siciliennes par le Commissaire de l'État, qui relèvent désormais du contrôle commun aux régions ; l'Assemblée régionale de soixante-dix membres a été renouvelée par l'élection du 25 septembre 2022 et a tenu sa première séance le 10 novembre 2022 (site de l'Assemblée régionale).", source: "https://www.giurcost.org/decisioni/2014/0255s-14.html"}
chronologie:
  - {annee: 1946, evenement: "Décret législatif royal n° 455 du 15 mai approuvant le Statut de la Région sicilienne."}
  - {annee: 1948, evenement: "Loi constitutionnelle n° 2 du 26 février : le Statut acquiert valeur constitutionnelle."}
  - {annee: 1957, evenement: "Arrêt n° 38 de la Cour constitutionnelle : la compétence de l'Alta Corte pour la Région sicilienne est absorbée par la Cour constitutionnelle."}
  - {annee: 1970, evenement: "Arrêt n° 6 de la Cour constitutionnelle : l'article 26 du Statut (compétence pénale de l'Alta Corte) et l'article 27, pour la partie qui s'y rapporte, sont déclarés inconstitutionnels."}
  - {annee: 2001, evenement: "Loi constitutionnelle n° 2 du 31 janvier : élection du Président de la Région au suffrage universel direct (Statut, art. 9)."}
  - {annee: 2013, evenement: "Loi constitutionnelle n° 2 du 7 février : l'Assemblée régionale passe de quatre-vingt-dix à soixante-dix députés."}
  - {annee: 2014, evenement: "Arrêt n° 255 de la Cour constitutionnelle : fin du contrôle préalable des lois siciliennes par le Commissaire de l'État."}
  - {annee: 2022, evenement: "Élection de l'Assemblée régionale le 25 septembre ; première séance le 10 novembre."}
