resume: >-
  Fiche agrégée : elle couvre les villages traditionnels (nu'u) du Samoa, gouvernés chacun par un conseil (fono) composé des matai, chefs des familles étendues du village. La Constitution de 1960 place les titres de matai et les terres coutumières sous la coutume et l'usage samoans (art. 100 et 101), interdit l'aliénation des terres coutumières (art. 102) et prévoit une Cour des terres et des titres (art. 103). La loi sur le fono de village de 1990 (Village Fono Act) reconnaît l'autorité exercée par chaque fono selon la coutume de son village ; la modification de 2017 y ajoute le bannissement, le couvre-feu, la classification des infractions et la protection des ressources naturelles. Les décisions du fono peuvent être portées devant la Cour des terres et des titres.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination à l'égard des femmes sur le sixième rapport du Samoa (CEDAW/C/WSM/CO/6), § 9, 10, 27 et 28 : le Comité nomme les fono de village et la loi modifiée en 2017, et recommande de la réviser pour donner aux comités de femmes un pouvoir de décision égal.", annee: 2018, source: "https://docs.un.org/en/CEDAW/C/WSM/CO/6"}
base_nationale:
  - {instrument: "Constitution de l'État indépendant du Samoa (1960, version de 2017), art. 100 à 103", nature: "constitution", annee: 1960, source: "https://www.constituteproject.org/constitution/Samoa_2017"}
  - {instrument: "Village Fono Act 1990 (loi sur le fono de village)", nature: "loi", annee: 1990, source: "https://www.usp.ac.fj/wp-content/uploads/sites/128/2022/02/Boodosingh_Codification_of_Custom_in_Samoa.pdf"}
  - {instrument: "Village Fono Amendment Act 2017 (loi modifiant la loi sur le fono de village), art. 5 et 5C", nature: "loi", annee: 2017, source: "https://www.usp.ac.fj/wp-content/uploads/sites/128/2022/02/Boodosingh_Codification_of_Custom_in_Samoa.pdf"}
  - {instrument: "Fisheries Management Act 2016 (aires de gestion des pêches villageoises)", nature: "loi", annee: 2016, source: "https://cbfm.spc.int/countries/samoa"}
  - {instrument: "Coutume et usage samoans régissant les titres de matai et les terres coutumières (Constitution, art. 100 et 101)", nature: "coutume_reconnue", annee: 1960, source: "https://www.constituteproject.org/constitution/Samoa_2017"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi sur le fono de village de 1990 reconnaît en droit l'exercice du pouvoir et de l'autorité du fono, conseil des matai de chaque village, selon « la coutume et l'usage » du village ; chaque fono élit un représentant (sui o nu'u) auprès du gouvernement.", source: "https://www.usp.ac.fj/wp-content/uploads/sites/128/2022/02/Boodosingh_Codification_of_Custom_in_Samoa.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'art. 5 de la loi, modifié en 2017, donne au fono le pouvoir d'édicter et de modifier les règles du village et de classer les infractions et les peines ; l'enregistrement des règlements de village est facultatif et l'enregistrement ne vaut pas conformité à la Constitution (art. 5C). Selon la même étude, les règles des villages sont rarement écrites et varient d'un village à l'autre.", source: "https://www.usp.ac.fj/wp-content/uploads/sites/128/2022/02/Boodosingh_Codification_of_Custom_in_Samoa.pdf"}
  justice_propre: {valeur: "partiel", note: "Le fono inflige des amendes en argent, en animaux ou en biens, ou des travaux sur les terres du village ; depuis 2017, il peut prononcer le bannissement et imposer un couvre-feu (art. 5). La loi de 1990 permet aux tribunaux de tenir compte de la peine infligée par le fono lorsqu'ils fixent la peine pénale, et les décisions du fono peuvent être portées en appel devant la Cour des terres et des titres.", source: "https://www.usp.ac.fj/wp-content/uploads/sites/128/2022/02/Boodosingh_Codification_of_Custom_in_Samoa.pdf"}
  terres: {valeur: "reconnu", note: "Les terres coutumières sont détenues selon la coutume et l'usage samoans (Constitution, art. 101) ; nul ne peut les aliéner par vente, hypothèque ou autrement, sauf bail ou prise pour cause d'utilité publique autorisés par une loi (art. 102). L'art. 103 institue une Cour des terres et des titres, dont la loi fixe la compétence sur les titres de matai et les terres coutumières. La Constitution ne désigne pas le village comme titulaire de ces terres.", source: "https://www.constituteproject.org/constitution/Samoa_2017"}
  ressources: {valeur: "partiel", note: "Depuis 2017, la loi range la protection des ressources naturelles parmi les compétences du fono (art. 5). La loi de 2016 sur la gestion des pêches permet au directeur général (Chief Executive Officer) du ministère de l'Agriculture et des Pêches de déclarer une aire villageoise de gestion des pêches après consultation du fono, qui peut y adopter des règlements de pêche et en assure le suivi ; 123 des 253 villages côtiers sont couverts par la gestion communautaire des pêches.", source: "https://cbfm.spc.int/countries/samoa"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le Comité CEDAW relève en 2018 que seuls les détenteurs d'un titre de matai peuvent se présenter aux élections législatives et recommande de modifier l'art. 5 de la loi électorale de 1963 qui pose cette condition. Aucun siège n'est attribué aux villages en tant que tels.", source: "https://docs.un.org/en/CEDAW/C/WSM/CO/6"}
  statut_personnel: {valeur: "partiel", note: "Les titres de matai, qui confèrent la qualité de membre du fono, sont détenus selon la coutume et l'usage samoans et selon la loi qui s'y rapporte (Constitution, art. 100) ; l'art. 103 confie à la Cour des terres et des titres la compétence que la loi lui attribue sur ces titres.", source: "https://www.constituteproject.org/constitution/Samoa_2017"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité CEDAW relève en 2018 que certains villages interdisent aux femmes de détenir un titre de matai et restreignent leur participation au fono, et que la loi modifiée en 2017 ne reconnaît pas les comités de femmes. Une étude publiée par l'Université du Pacifique Sud indique qu'avant 2017 des tribunaux ont accordé une indemnisation à des personnes bannies par un fono, la loi de 1990 n'autorisant pas cette peine, et que les règles des villages sont rarement écrites.", source: "https://docs.un.org/en/CEDAW/C/WSM/CO/6"}
chronologie:
  - {annee: 1903, evenement: "Création, sous l'administration allemande, d'une commission foncière qui devient la Cour des terres et des titres (nom adopté en 1937)."}
  - {annee: 1962, evenement: "Indépendance ; entrée en vigueur de la Constitution adoptée en 1960 (art. 100 à 103 sur les titres de matai, les terres coutumières et la Cour des terres et des titres)."}
  - {annee: 1990, evenement: "Le suffrage universel à partir de 21 ans, approuvé par plébiscite, est inscrit dans la loi et s'applique aux élections de 1991 ; la loi sur le fono de village reconnaît l'autorité des conseils de village."}
  - {annee: 2012, evenement: "Rapport de la Commission samoane de réforme du droit sur la loi relative au fono, recommandant l'écriture et l'enregistrement des règles des villages."}
  - {annee: 2016, evenement: "Loi sur la gestion des pêches : aires de gestion des pêches villageoises."}
  - {annee: 2017, evenement: "Entrée en vigueur de la modification de la loi sur le fono : bannissement, couvre-feu, classification des infractions, protection des ressources naturelles, enregistrement facultatif des règlements."}
  - {annee: 2018, evenement: "Le Comité CEDAW recommande la révision de la loi modifiée pour donner aux comités de femmes un pouvoir de décision égal au fono."}
  - {annee: 2020, evenement: "Modification constitutionnelle qui retire à la Cour suprême son contrôle sur la Cour des terres et des titres."}
fiabilite:
  verifie: ["Art. 100 à 103 de la Constitution (Constitute Project, version de 2017).", "§ 9, 10, 27 et 28 des observations finales du Comité CEDAW du 14 novembre 2018 (CEDAW/C/WSM/CO/6).", "Population de 205 557 personnes et 16 082 détenteurs d'un titre de matai de 21 ans et plus (recensement de 2021, fiche du Bureau samoan de la statistique).", "339 villages et localités de recensement, dont 72 dans la zone urbaine d'Apia (tableau 1 du recensement de 2021).", "123 villages côtiers sur 253 couverts par la gestion communautaire des pêches, 111 sites actifs (Communauté du Pacifique).", "Faits cités de l'étude de R. Boodoosingh et P. Schoeffel : reconnaissance légale du fono en 1990, environ 200 villages, élection du sui o nu'u, amendes du fono, prise en compte par les tribunaux, appel devant la Cour des terres et des titres, art. 5 et 5C de la loi modifiée, rapport de 2012 de la Commission de réforme du droit, indemnisation de personnes bannies.", "Création en 1903 et nom de 1937 de la Cour des terres et des titres ; appel des décisions du fono devant elle (art. 11 de la loi de 1990) : encyclopédie en ligne."]
  non_confirme: ["Contenu de la loi de 1990 et de sa modification de 2017 : textes officiels non consultés (PacLII et le site du Parlement inaccessibles) ; les articles cités (art. 5 et 5C) suivent l'étude de R. Boodoosingh et P. Schoeffel, qui date la modification de 2016 et son entrée en vigueur de 2017.", "Nombre de villages traditionnels : « environ 200 » selon l'étude citée ; une encyclopédie en ligne avance environ 360 conseils de matai. Aucune liste officielle des villages dotés d'un fono n'a été trouvée, d'où l'absence de tableau des sites.", "Surface des terres coutumières : environ 81 % des terres selon une encyclopédie en ligne, sans source officielle ouverte ; la surface indiquée couvre l'ensemble des terres du pays.", "Réforme de 2020 (Land and Titles Act 2020 et modification constitutionnelle) et révocation de juges de la Cour des terres et des titres en 2023 : connues par une encyclopédie en ligne, textes non consultés ; la version constitutionnelle consultée est antérieure à 2020.", "Aucun document de la Convention sur la diversité biologique ni inscription au registre des APAC visant le régime n'a été vérifié.", "Condition du titre de matai pour être candidat : citée par le Comité CEDAW d'après la loi électorale de 1963 ; une encyclopédie en ligne la donne comme toujours en vigueur d'après la Commission électorale (2023), sans que la loi électorale en vigueur ait été consultée.", "Régime des aires villageoises de gestion des pêches : décrit dans la fiche consacrée à ce régime ; ici seulement comme compétence du fono."]
