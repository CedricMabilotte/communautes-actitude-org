uid: "naso-tjer-di-panama"
nom: "Naso de la comarca Naso Tjër Di"
endonyme: "Naso Tjër Di"
territoire: "Comarca Naso Tjër Di (ouest de la province de Bocas del Toro, bassins des rivières Teribe et Changuinola, frontière avec le Costa Rica)"
etats: ["Panama"]
region: "ameriques"
coord: [9.3, -82.7]
type: "peuple_autochtone"
base: "territoriale"
types_secondaires: []
population: {valeur: 6899, annee: 2023, perimetre: "personnes se déclarant naso (5 568) ou teribe (1 331), nom espagnol des Naso, au recensement de 2023, dans tout le Panama ; le recensement de 2010 en comptait 4 046", source: "https://www.inec.gob.pa/archivos/P0289562520231009163041CUADRO%2020.pdf"}
lieux: {valeur: 4, unite: "corregimientos (subdivisions communales) du district spécial Naso Tjër Di", annee: 2020, source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
surface_km2: {valeur: 1606, annee: 2020, perimetre: "aire délimitée par la loi 188 de 2020 (art. 1 : 160 616 ha), dont 1 251 km² dans le parc international La Amistad et 217 km² dans la forêt protectrice de Palo Seco", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
villages: {valeur: 16, annee: 2023, perimetre: "communautés de la comarca dont les représentants ont été convoqués aux ateliers de rédaction de la Charte organique", source: "https://www.fscindigenousfoundation.org/es/comarca-naso-tjer-di-valida-el-borrador-de-su-carta-organica/"}
resume: >-
  Les Naso vivent à l'ouest du Panama, le long des rivières Teribe et Changuinola, près de la frontière du Costa Rica ; leur autorité principale est un roi. La loi 188 du 4 décembre 2020 crée pour eux la comarca (division territoriale autochtone à statut spécial) Naso Tjër Di, d'environ 1 606 km², détachée du district de Changuinola, avec Sieyic pour chef-lieu. Les terres y sont propriété collective du peuple naso et l'État reconnaît son gouvernement traditionnel : Conseil général naso, roi et assemblée du peuple. La loi avait été bloquée par une objection d'inconstitutionnalité de l'exécutif, rejetée par la Cour suprême en octobre 2020.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de James Anaya sur le Panama : il décrit l'autogouvernement naso dirigé par un roi, les conflits avec la société Ganadera Bocas à San San Druy et autour du barrage de Bonyic, et recommande d'examiner la demande de comarca naso (par. 10, 38, 47 et recommandation f).", annee: 2014, source: "https://documents.un.org/api/symbol/access?s=A/HRC/27/52/Add.1&l=es&t=pdf"}
  - {mecanisme: "dnudpa", detail: "Le Panama vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://press.un.org/en/2007/ga10612.doc.htm"}
base_nationale:
  - {instrument: "Loi 188 du 4 décembre 2020 qui crée la comarca Naso Tjër Di (Gaceta Oficial 29170-A du 7 décembre 2020), issue du projet de loi 656 de 2018", nature: "loi", annee: 2020, source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  - {instrument: "Constitution du Panama, art. 127 (propriété collective des terres des communautés autochtones)", nature: "constitution", annee: 2004, source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  - {instrument: "Loi 88 du 22 novembre 2010 sur les langues et alphabets des peuples autochtones", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  - {instrument: "Cour suprême de justice, plénière, arrêt du 28 octobre 2020 : les articles 1 et 8 du projet de loi 656 ne sont pas contraires à la Constitution", nature: "jurisprudence", annee: 2020, source: "https://www.organojudicial.gob.pa/noticias/el-pleno-de-la-csj-reitera-que-las-comarcas-indigenas-son-parte-de-la-herencia-historica-de-nuestra-nacion"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 188 de 2020 (art. 9 à 13) reconnaît le gouvernement traditionnel de la comarca : Conseil général naso formé du roi et de délégués élus par chaque communauté, avec le roi pour autorité suprême, et assemblée du peuple naso réunie une fois par an ; leurs attributions relèvent d'une Charte organique.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 188 de 2020 (art. 7) soumet l'usage, la transmission et la répartition des terres entre Naso à leurs coutumes ; la Charte organique qui doit régler les institutions est adoptée par l'exécutif avec une commission du Conseil naso (art. 33).", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi 188 de 2020 (art. 26) confie aux autorités traditionnelles le premier examen des conflits agraires, environnementaux et fonciers dans la comarca, l'Autorité nationale d'administration des terres intervenant ensuite ; la justice ordinaire reste compétente (art. 15 et 18). En 2023, la commission de la Charte organique relève que les Naso recourent encore à la justice ordinaire pour les affaires communautaires.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  terres: {valeur: "reconnu", note: "La loi 188 de 2020 (art. 5) fait des terres de la comarca la propriété collective du peuple naso, qui les administre et en détient les droits à perpétuité, en application de l'article 127 de la Constitution ; les titres et droits de possession antérieurs sont maintenus (art. 6), avec droit de préemption de la comarca en cas de vente (art. 8).", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  ressources: {valeur: "partiel", note: "La loi 188 de 2020 interdit l'exploitation des ressources qui menacerait la culture, la biodiversité ou la survie du peuple naso (art. 23), prévoit une cogestion des aires protégées incluses dans la comarca (art. 24) et laisse au ministère de l'Environnement l'autorisation des projets (art. 25).", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  consentement: {valeur: "reconnu", note: "La loi 188 de 2020 (art. 25) subordonne les projets d'exploration, d'exploitation et de bioprospection à la consultation et au consentement préalable, libre et éclairé des autorités naso.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  langue: {valeur: "partiel", note: "La loi 88 de 2010 reconnaît la langue naso tjërdi (art. 1) et en fixe l'alphabet en annexe (art. 2), sans lui donner le statut de langue officielle.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 188 de 2020 (art. 27) reconnaît le droit du peuple naso à une éducation interculturelle bilingue fondée sur sa langue ; l'article 28 impose le vêtement traditionnel dans les écoles de la comarca.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  fiscalite: {valeur: "partiel", note: "La loi 188 de 2020 (art. 19) oblige l'État à inscrire au budget général la part de la comarca ; l'article 20 prévoit une rémunération du roi et du président du Conseil général, l'article 22 l'autorise à recevoir dons et legs.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2020/2020/LEY/Administrador%20Legispan_29170-A_2020_12_7_ASAMBLEA%20NACIONAL_188.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La loi 188 de 2020 (art. 32) donnait 180 jours à la Commission nationale des limites politico-administratives pour vérifier les limites de la comarca ; en août 2026, cette commission examine encore l'avancement de la délimitation. Le projet de Charte organique est validé par le Conseil général naso le 2 mai 2023, sans adoption par l'exécutif trouvée. Les élus des corregimientos du district spécial reçoivent leurs certificats en octobre 2024.", source: "https://www.infobae.com/panama/2026/08/06/en-panama-analizan-limites-politicos-administrativo-de-las-comarcas-indigenas/"}
chronologie:
  - {annee: 1973, evenement: "Début de la demande naso de création d'une comarca, selon le Rapporteur spécial de l'ONU."}
  - {annee: 2004, evenement: "Le roi naso signe avec la société Hidro Ecológica del Teribe un accord de compensation pour le barrage de Bonyic, contesté par une partie des Naso."}
  - {annee: 2014, evenement: "Le Rapporteur spécial James Anaya recommande au Panama d'examiner la demande de comarca naso."}
  - {annee: 2019, evenement: "Le projet de loi 656 porte la date d'adoption en troisième lecture du 20 février 2019 ; l'exécutif de la période 2014-2019 lui oppose une objection d'inconstitutionnalité visant les articles 1 et 8."}
  - {annee: 2020, evenement: "Le 28 octobre, la Cour suprême déclare ces articles conformes à la Constitution."}
  - {annee: 2020, evenement: "Le 4 décembre, le président Laurentino Cortizo sanctionne la loi 188 à Sieyic, en présence du roi Reynaldo Alexis Santana."}
  - {annee: 2023, evenement: "Le 2 mai, à Bonyik, le Conseil général naso valide le projet de Charte organique (180 articles)."}
  - {annee: 2024, evenement: "Premiers élus des corregimientos du district spécial Naso Tjër Di ; le vice-ministère des Affaires autochtones leur remet leurs certificats en octobre."}
  - {annee: 2026, evenement: "En août, la Commission nationale des limites politico-administratives fait le point sur la délimitation de la comarca."}
fiabilite:
  verifie: ["Texte intégral de la loi 188 de 2020 (art. 1 à 34) dans la Gaceta Oficial 29170-A, surface de 160 616 ha (art. 1).", "Arrêt de la Cour suprême du 28 octobre 2020, cité en mention de sanction de la loi et résumé par l'Órgano Judicial.", "Paragraphes 6, 10, 38 et 47 du rapport A/HRC/27/52/Add.1.", "Article 1 de la loi 88 de 2010 et article 127 de la Constitution.", "Vote du Panama pour la résolution 61/295.", "Recensement de 2023 : 5 568 Naso et 1 331 Teribe (INEC, tableau 20).", "Validation du projet de Charte organique le 2 mai 2023 (Fundación Indígena FSC) et remise des certificats aux élus en octobre 2024 (ministère de Gouvernement)."]
  non_confirme: ["Adoption par l'exécutif de la Charte organique prévue par l'article 33 de la loi 188.", "Conclusions de la Commission nationale des limites et tracé définitif de la comarca.", "Population résidant dans la comarca : le tableau de division administrative de l'INEC (décembre 2023) ne mentionne pas encore le district spécial.", "Le chiffre de 16 communautés vient d'une source non gouvernementale."]
