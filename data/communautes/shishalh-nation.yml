reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le préambule de la loi fédérale, modifié en 2022, énonce l'engagement du gouvernement du Canada à mettre en œuvre la Déclaration des Nations unies sur les droits des peuples autochtones, y compris en ce qui touche l'autonomie gouvernementale de la Nation.", annee: 2022, source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
base_nationale:
  - {instrument: "Loi sur l'autonomie gouvernementale de la Nation shishalhe, L.C. 1986, ch. 27 (modifiée en 2022)", nature: "loi", annee: 1986, source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  - {instrument: "Constitution de la Nation shishalhe, prévue par l'art. 10 de la loi (modifiée par le décret C.P. 2019-1225 du 17 août 2019)", nature: "statut_autonomie", annee: 2019, source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi maintient le conseil de la Nation (hiwus), élu selon la constitution de la Nation (art. 8), et le district de l'administration de la Nation shishalhe, doté de la personnalité juridique (art. 17 à 20).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil édicte des lois shishalhes sur l'accès aux terres, le zonage, l'éducation, les services sociaux, la santé, l'ordre public, les successions et d'autres domaines (art. 14) ; la Charte canadienne s'applique (art. 37.1).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le titre en fief simple des anciennes terres de réserve a été transféré à la Nation (art. 23 de la loi antérieure, art. 24) ; une terre vendue cesse d'être terre shishalhe (art. 2(2)).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  ressources: {valeur: "partiel", note: "Le conseil légifère sur la conservation et la gestion des ressources naturelles, du poisson et du gibier de ses terres (art. 14(1) j et k) ; les minéraux restent soumis à l'accord Canada-Colombie-Britannique de 1943 (art. 24).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Compétence législative sur l'éducation des membres sur les terres shishalhes (art. 14(1) g).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  fiscalite: {valeur: "reconnu", note: "Compétence législative sur les impôts fonciers et taxes locales, y compris sur les occupants et locataires non membres (art. 14(1) e).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La constitution de la Nation comporte un code d'appartenance (art. 10(1) d)) ; cette attribution ne peut être transférée au district (art. 21(1)) ; le statut d'Indien reste déterminé par la Loi sur les Indiens (art. 35(2)).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "La base de données électorale localelections.ca recense en octobre 2026 l'élection de quatre conseillers consultatifs du district de l'administration de la Nation shishalhe (environ 450 électeurs estimés) ; la Nation a renouvelé son conseil par l'élection générale de février 2026 ; la province liste les accords conclus avec la Nation, dont l'accord de fondation de 2018 et son avenant du 16 août 2024.", source: "https://localelections.ca/election_candidates/178_2026_candidates.html"}
