resume: >-
  La bande indienne sechelte (aujourd'hui Nation shíshálh) est la première Première Nation à sortir du régime de la Loi sur les Indiens par une loi fédérale d'autonomie, adoptée le 17 juin 1986 après un référendum du 15 mars 1986. Les terres de réserve lui sont transférées en fief simple (pleine propriété). Son conseil (hiwus) légifère sur ses terres dans les domaines fixés par la loi. La loi a été modifiée en 2022 et renommée Loi sur l'autonomie gouvernementale de la Nation shishalhe.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada a appuyé la Déclaration après avoir voté contre en 2007 ; la loi fédérale L.C. 2021, ch. 14 et le préambule de la loi shishalhe modifiée en 2022 se réfèrent à sa mise en œuvre.", annee: 2022, source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
base_nationale:
  - {instrument: "Loi sur l'autonomie gouvernementale de la Nation shishalhe, L.C. 1986, ch. 27 (modifiée en 2022)", nature: "loi", annee: 1986, source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  - {instrument: "Constitution de la Nation shishalhe (modifiée par le décret C.P. 2019-1225)", nature: "coutume_reconnue", annee: 2019, source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi de 1986 maintient le conseil de la Nation (hiwus) et un district de l'administration de la Nation shishalhe doté de la personnalité juridique (art. 17 à 20).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil édicte des lois shishalhes sur l'accès aux terres, le zonage, l'éducation, les services sociaux, la santé, l'ordre public, les successions et d'autres domaines (art. 14) ; la Charte canadienne s'applique (art. 37.1).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le titre en fief simple des anciennes terres de réserve a été transféré à la Nation (art. 23 de la loi antérieure, art. 24) ; une terre vendue cesse d'être terre shishalhe (art. 2(2)).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  ressources: {valeur: "partiel", note: "Le conseil légifère sur la conservation et la gestion des ressources naturelles, du poisson et du gibier de ses terres (art. 14(1) j et k) ; les minéraux restent soumis à l'accord Canada-Colombie-Britannique de 1943 (art. 24).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Compétence législative sur l'éducation des membres sur les terres shishalhes (art. 14(1) g).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  fiscalite: {valeur: "reconnu", note: "Compétence législative sur les impôts fonciers et taxes locales, y compris sur les occupants et locataires non membres (art. 14(1) e).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "L'appartenance à la Nation relève de la Nation et de sa constitution ; elle ne peut être transférée au district (art. 21(1)).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-6.6/TexteComplet.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "La Nation administre elle-même ses 33 parcelles et y accorde baux et permis ; elle a signé un accord de fondation avec la Colombie-Britannique en 2018 et plusieurs accords forestiers.", source: "https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/consulting-with-first-nations/first-nations-negotiations/first-nations-a-z-listing/sechelt-sh-sh-lh-first-nation"}
