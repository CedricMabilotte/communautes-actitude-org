resume: >-
  La bande indienne sechelte (aujourd'hui Nation shíshálh) relève depuis 1986 d'une loi fédérale d'autonomie gouvernementale, sanctionnée le 17 juin 1986 après le référendum des membres du 15 mars 1986. Les terres de réserve lui ont été transférées en fief simple (pleine propriété). Son conseil (hiwus) légifère sur ses terres dans les domaines fixés par la loi ; la Loi sur les Indiens continue de s'appliquer sauf incompatibilité (art. 35). La loi, modifiée en 2022 (L.C. 2022, ch. 9), porte le nom de Loi sur l'autonomie gouvernementale de la Nation shishalhe. Pour les bandes restées sous ce seul régime, voir la fiche « Premières Nations et réserves sous la Loi sur les Indiens » ; pour un régime fédéral voisin, la fiche « Première Nation de Westbank (syilx) ».
