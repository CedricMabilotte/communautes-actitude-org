resume: >-
  Peuples aborigènes du Territoire du Nord, 25,2 % de la population du territoire au recensement de 2021. L'Aboriginal Land Rights (Northern Territory) Act 1976, loi fédérale entrée en vigueur le 26 janvier 1977, permet l’attribution de titres fonciers collectifs à des fiducies foncières aborigènes (Land Trusts) administrées sur instruction de conseils fonciers (Land Councils) élus. Les conseils fonciers doivent consentir à l'attribution de titres miniers sur ces terres. L'Australie a soutenu la Déclaration des Nations unies sur les droits des peuples autochtones en 2009.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "L'Australie a voté contre la Déclaration en 2007 puis l'a formellement soutenue en 2009 (IWGIA 2025) ; le CERD lui recommande en 2017 d'en appliquer les principes", annee: 2009, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du CERD (CERD/C/AUS/CO/18-20) sur les droits fonciers autochtones, le consentement préalable et la situation dans le Territoire du Nord", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Aboriginal Land Rights (Northern Territory) Act 1976 (loi fédérale n° 191 de 1976)", nature: "loi", annee: 1976, source: "https://www.foundingdocs.gov.au/resources/transcripts/nt7_doc_1976.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseils fonciers (Land Councils) institués par la loi de 1976 (partie III), organes représentatifs composés d'Aborigènes élus ; quatre conseils existent (Central, Northern, Anindilyakwa, Tiwi).", source: "https://www.clc.org.au/the-alra/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Titres fonciers accordés à des fiducies foncières aborigènes (Land Trusts), qui n'agissent que sur instruction du conseil foncier compétent ; baux et cessions soumis à l'instruction du conseil foncier et, selon les cas, au consentement du ministre (loi de 1976, s. 5, 12 et 19).", source: "https://www.foundingdocs.gov.au/resources/transcripts/nt7_doc_1976.pdf"}
  ressources: {valeur: "partiel", note: "Les revenus équivalents aux redevances minières sur les terres aborigènes alimentent l'Aboriginals Benefit Account, dont 30 % sont versés aux corporations aborigènes des zones touchées par l'exploitation.", source: "https://www.clc.org.au/the-alra/"}
  consentement: {valeur: "reconnu", note: "Aucun titre minier ne peut être accordé sur une terre aborigène sans le consentement écrit du ministre et du conseil foncier, sauf proclamation du gouverneur général fondée sur l'intérêt national (loi de 1976, s. 40) ; le consentement du conseil doit refléter l'avis des propriétaires traditionnels (s. 48).", source: "https://www.foundingdocs.gov.au/resources/transcripts/nt7_doc_1976.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
