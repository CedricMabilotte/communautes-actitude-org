effectivite: {valeur: "partielle", note: "L'Office national d'audit (ANAO) juge en 2023 les dispositifs de consultation et de consentement du Northern Land Council « largement appropriés » ; il relève en décembre 2022 environ 794 accords de la s. 19 et 258 accords de la partie IV en attente d'examen, et des versements aux propriétaires traditionnels hors du délai légal de six mois. Le CERD relève en 2017 des projets d'extraction menés sur des terres autochtones sans consentement préalable, libre et éclairé (par. 21).", source: "https://www.anao.gov.au/work/performance-audit/governance-the-northern-land-council"}
chronologie:
  - {annee: 1967, evenement: "Référendum national donnant au gouvernement fédéral le pouvoir de légiférer sur les affaires aborigènes."}
  - {annee: 1976, evenement: "Adoption de l'Aboriginal Land Rights (Northern Territory) Act (décembre)."}
  - {annee: 1977, evenement: "Entrée en vigueur de la loi (26 janvier)."}
  - {annee: 1997, evenement: "Fin du délai de dépôt des revendications foncières (30 juin)."}
  - {annee: 2009, evenement: "L'Australie soutient la DNUDPA."}
  - {annee: 2017, evenement: "Observations finales du CERD sur l'Australie."}
  - {annee: 2021, evenement: "Loi modificative n° 132 de 2021 : création de la Northern Territory Aboriginal Investment Corporation (Aboriginal Investment NT), qui reprend la gestion des subventions de l'Aboriginals Benefit Account."}
  - {annee: 2024, evenement: "Changement de gouvernement du Territoire en août ; le nouveau gouvernement n'annonce pas de politique sur le traité engagé en avril (IWGIA 2025)."}
  - {annee: 2024, evenement: "Loi Scheduling du 29 novembre : ajout de terres près de Canteen Creek à l'annexe 1, en vigueur le 30 novembre."}
