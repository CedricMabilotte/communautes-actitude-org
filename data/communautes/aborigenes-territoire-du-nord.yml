  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le CERD relève en 2017 des projets d'extraction menés sans consentement préalable, libre et éclairé sur des terres autochtones, ainsi que le mécanisme obligatoire de gestion des revenus qui touche de façon disproportionnée les peuples autochtones, notamment dans le Territoire du Nord.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
