resume: >-
  Peuples aborigènes du Territoire du Nord, 26,3 % de la population du territoire au recensement de 2021. L'Aboriginal Land Rights (Northern Territory) Act 1976, loi fédérale entrée en vigueur le 26 janvier 1977, permet l’attribution de titres fonciers collectifs à des fiducies foncières aborigènes (Land Trusts) administrées sur instruction de conseils fonciers (Land Councils) élus. Ces terres couvrent environ 48 % de la superficie du Territoire. Un permis d'exploration minière n'y est accordé qu'avec le consentement du conseil foncier, sauf proclamation fondée sur l'intérêt national. La loi a été modifiée en 2021 (création d'Aboriginal Investment NT) et en 2024. L'Australie a soutenu la Déclaration des Nations unies sur les droits des peuples autochtones en 2009. Les parcs territoriaux cogérés, les aires d'habitat sur baux pastoraux et les parcs fédéraux de Kakadu et d'Uluṟu-Kata Tjuṯa font l'objet de fiches distinctes.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "L'Australie a voté contre la Déclaration en 2007 puis l'a formellement soutenue en 2009 (IWGIA, The Indigenous World 2025) ; le CERD lui recommande en 2017 d'en respecter et appliquer les principes (par. 22)", annee: 2009, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du CERD (CERD/C/AUS/CO/18-20, adoptées en décembre 2017) : droits fonciers autochtones et consentement préalable, libre et éclairé (par. 21-22), logement dans le Territoire du Nord et mécanisme obligatoire de gestion des revenus (par. 23-24)", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Aboriginal Land Rights (Northern Territory) Act 1976 (loi fédérale n° 191 de 1976), version consolidée n° 48 du 30 novembre 2024", nature: "loi", annee: 1976, source: "https://www.legislation.gov.au/C2004A01620/2024-11-30/2024-11-30/text/original/epub/OEBPS/document_1/document_1.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseils fonciers (Land Councils) institués par la loi de 1976 (partie III, s. 21) ; leurs membres sont des Aborigènes choisis par les Aborigènes de leur zone selon une méthode approuvée par le ministre (s. 29) ; quatre conseils existent (Central, Northern, Tiwi, Anindilyakwa).", source: "https://www.legislation.gov.au/C2004A01620/2024-11-30/2024-11-30/text/original/epub/OEBPS/document_1/document_1.html"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Titres de pleine propriété détenus par des fiducies foncières aborigènes (Land Trusts), qui exercent leurs fonctions au bénéfice des Aborigènes concernés et sur instruction du conseil foncier (loi de 1976, s. 5) ; toute cession ou concession de droits exige l'instruction du conseil foncier et, selon les cas, le consentement du ministre (s. 19), et le conseil ne peut l'ordonner sans le consentement collectif des propriétaires traditionnels.", source: "https://www.legislation.gov.au/C2004A01620/2024-11-30/2024-11-30/text/original/epub/OEBPS/document_1/document_1.html"}
  ressources: {valeur: "partiel", note: "Des montants équivalents aux redevances minières perçues sur les terres aborigènes sont versés à l'Aboriginals Benefit Account (loi de 1976, s. 64) ; 30 % sont reversés au conseil foncier de la zone d'exploitation (s. 64(3)), qui les transmet aux corporations aborigènes des zones touchées ; depuis la loi de 2021, les subventions du compte sont gérées par Aboriginal Investment NT (partie VIA).", source: "https://www.legislation.gov.au/C2004A01620/2024-11-30/2024-11-30/text/original/epub/OEBPS/document_1/document_1.html"}
  consentement: {valeur: "reconnu", note: "Un permis d'exploration minière sur une terre aborigène n'est accordé qu'avec le consentement du conseil foncier ou sur proclamation du gouverneur général fondée sur l'intérêt national (loi de 1976 consolidée, s. 40 et 43) ; le conseil doit consulter les propriétaires traditionnels (s. 42) et ne peut agir sans leur consentement collectif (s. 23(3)) ; après un accord d'exploration, l'exploitation requiert un accord avec le conseil et le consentement du ministre (s. 45).", source: "https://www.legislation.gov.au/C2004A01620/2024-11-30/2024-11-30/text/original/epub/OEBPS/document_1/document_1.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
