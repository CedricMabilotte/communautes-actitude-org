resume: >-
  La Parks and Reserves (Framework for the Future) Act 2003 (loi-cadre du Territoire du Nord sur les parcs et réserves), en vigueur depuis le 14 avril 2004, organise la gestion conjointe de 27 parcs et réserves inscrits à ses annexes, en échange du retrait des revendications foncières aborigènes et d'accords sur le titre autochtone (native title, droits fonciers coutumiers reconnus par le droit australien). Treize de ces parcs ont vocation à devenir des terres aborigènes au sens de la loi fédérale de 1976 sur les droits fonciers, quatre reçoivent une pleine propriété inaliénable détenue par une fiducie foncière de parc (Park Land Trust) ; ces dix-sept parcs sont loués au Territoire pour 99 ans. Les dix autres relèvent d'un accord de gestion conjointe sans transfert de titre. La partie 3 de la Territory Parks and Wildlife Conservation Act 1976 (loi sur les parcs et la faune), insérée en 2005, rend le Territoire et les propriétaires traditionnels aborigènes conjointement responsables de la gestion, par un plan de gestion conjointe. Le gouvernement du Territoire compte 33 parcs sous gestion conjointe formelle, dont six hors des annexes de la loi de 2003, comme Nitmiluk (loi de 1989) et Garig Gunak Barlu (loi de 1981). Les terres aborigènes de la loi fédérale de 1976 font l'objet de la fiche « Aborigènes du Territoire du Nord ».
