  - {instrument: "Territory Parks and Wildlife Conservation Act 1976 (Territoire du Nord), partie 3 « Joint management of certain parks and reserves », insérée par la loi n° 4 de 2005 et modifiée en 2007 et 2024", nature: "loi", annee: 2005, source: "https://legislation.nt.gov.au/Legislation/TERRITORY-PARKS-AND-WILDLIFE-CONSERVATION-ACT-1976"}
  - {instrument: "Nitmiluk (Katherine Gorge) National Park Act 1989 (Territoire du Nord)", nature: "loi", annee: 1989, source: "https://legislation.nt.gov.au/Legislation/NITMILUK-KATHERINE-GORGE-NATIONAL-PARK-ACT-1989"}
  - {instrument: "Cobourg Peninsula Aboriginal Land, Sanctuary and Marine Park Act 1981 (Territoire du Nord)", nature: "loi", annee: 1981, source: "https://legislation.nt.gov.au/Legislation/COBOURG-PENINSULA-ABORIGINAL-LAND-SANCTUARY-AND-MARINE-PARK-ACT-1981"}
  - {instrument: "Baux de 99 ans, accords de gestion conjointe et accords d'usage des terres autochtones (indigenous land use agreements) conclus pour chaque parc inscrit (loi de 2003, s. 8 et 10, annexe 4)", nature: "accord_revendication", annee: 2004, source: "https://legislation.nt.gov.au/Legislation/PARKS-AND-RESERVES-FRAMEWORK-FOR-THE-FUTURE-ACT-2003"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Territoire et les propriétaires traditionnels aborigènes sont « partenaires de gestion conjointe », ensemble responsables de la gestion de chaque parc (Territory Parks and Wildlife Conservation Act 1976, s. 25AA) ; la loi renvoie aux processus de décision des propriétaires décrits à l'article 77A de la loi fédérale de 1976 (s. 22(2)) et maintient les responsabilités légales du ministre (s. 25AC(e)). À Nitmiluk, 8 des 13 membres du conseil du parc, nommés par le ministre, sont des propriétaires traditionnels proposés par la Jawoyn Association (loi de 1989, s. 10).", source: "https://legislation.nt.gov.au/Legislation/TERRITORY-PARKS-AND-WILDLIFE-CONSERVATION-ACT-1976"}
  pouvoir_normatif: {valeur: "partiel", note: "Les partenaires de gestion conjointe, Territoire compris, peuvent édicter des règlements (by-laws) propres à un parc, conformes à la partie 3, aux accords et au plan de gestion conjointe (s. 25AQ) ; le plan est préparé ensemble, soumis au public puis déposé devant l'Assemblée législative (s. 25AD à 25AF).", source: "https://legislation.nt.gov.au/Legislation/TERRITORY-PARKS-AND-WILDLIFE-CONSERVATION-ACT-1976"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Pour les parcs de l'annexe 1, le ministre en chef peut demander au ministre fédéral de les inscrire à l'annexe 1 de la loi fédérale de 1976 (terres aborigènes) (loi de 2003, s. 8(a)) ; ceux de l'annexe 2 reçoivent un titre de pleine propriété de parc (park freehold title) détenu par une fiducie foncière de parc, qui ne peut être ni vendu ni hypothéqué (loi de 2003, s. 8 et 9) ; dans les deux cas, la terre est louée au Territoire pour 99 ans et reste un parc ouvert au public sans droit d'entrée (s. 10(2), annexe 4).", source: "https://legislation.nt.gov.au/Legislation/PARKS-AND-RESERVES-FRAMEWORK-FOR-THE-FUTURE-ACT-2003"}
  ressources: {valeur: "partiel", note: "La loi sur les parcs ne limite pas le droit des Aborigènes de chasser, cueillir (hors vente) et accomplir des cérémonies sur leurs terres traditionnelles (s. 122) ; le plan de gestion conjointe organise la chasse et l'usage des ressources par les propriétaires traditionnels et ne peut restreindre ce droit que pour des raisons d'environnement ou de sécurité (s. 25AE(3)(j) et 25AJ). Pour un titre minier ou pétrolier, les partenaires ne donnent qu'un avis, que le ministre des Mines doit examiner (s. 25AM).", source: "https://legislation.nt.gov.au/Legislation/TERRITORY-PARKS-AND-WILDLIFE-CONSERVATION-ACT-1976"}
  consentement: {valeur: "partiel", note: "Pour les parcs des annexes 2 et 3, le conseil foncier (Land Council) ne peut agir, notamment consentir à un acte sur le titre de pleine propriété de parc, que si les propriétaires traditionnels comprennent l'acte et y consentent en tant que groupe (Territory Parks and Wildlife Conservation Act 1976, s. 25AO(2)) ; cette règle ne vaut pas pour la décision minière, soumise au seul avis des partenaires (s. 25AM).", source: "https://legislation.nt.gov.au/Legislation/TERRITORY-PARKS-AND-WILDLIFE-CONSERVATION-ACT-1976"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Toute somme reçue par un conseil foncier pour un parc, loyer compris, doit être versée aux propriétaires traditionnels ou à leur profit dans les six mois (Territory Parks and Wildlife Conservation Act 1976, s. 25AP) ; aucun pouvoir fiscal n'est attribué.", source: "https://legislation.nt.gov.au/Legislation/TERRITORY-PARKS-AND-WILDLIFE-CONSERVATION-ACT-1976"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Central Land Council indique que 16 parcs de sa région ont été rendus aux propriétaires traditionnels et loués pour 99 ans ; son conseil a décidé en 2010 d'affecter loyers et droits de camping à des projets communautaires, soit plus de 17 millions de dollars australiens et plus de 360 projets. Le 10 août 2021, il a demandé le retrait d'amendements à la loi sur les parcs qui donnaient au gouvernement le pouvoir d'autoriser des aménagements sans le consentement des propriétaires, au motif qu'ils menaçaient la gestion conjointe de 20 parcs et pouvaient enfreindre les baux.", source: "https://www.clc.org.au/nt-government-bill-threatens-joint-management-of-parks-and-water-reform/"}
chronologie:
  - {annee: 1981, evenement: "Loi sur la péninsule de Cobourg : terre aborigène, sanctuaire et parc marin (actuel Garig Gunak Barlu)."}
  - {annee: 1989, evenement: "Loi sur le parc national de Nitmiluk (Katherine Gorge), avec un conseil du parc à majorité de propriétaires traditionnels jawoyn."}
  - {annee: 2002, evenement: "En octobre, principes communs de gestion convenus entre le Northern Land Council, le Central Land Council et le Territoire (cités par la loi sur les parcs, s. 25AK)."}
  - {annee: 2004, evenement: "Sanction de la loi-cadre de 2003 le 7 janvier et entrée en vigueur le 14 avril ; avis au Journal officiel du 28 juillet modifiant les annexes 1, 3 et 5."}
  - {annee: 2005, evenement: "Loi de relance (Revival Act) fixant au 2 février 2005 la date limite des conditions ; le 31 mai, entrée en vigueur de la partie 3 de la loi sur les parcs (gestion conjointe)."}
  - {annee: 2007, evenement: "Le 31 octobre, entrée en vigueur d'un amendement permettant au ministre de conclure des accords de gestion conjointe pour d'autres parcs (s. 23A)."}
  - {annee: 2021, evenement: "Le Central Land Council conteste des amendements à la loi sur les parcs qui touchent l'autorisation des aménagements dans les parcs cogérés ; la loi n° 19 de 2021, sanctionnée le 31 août, insère l'article 21A, qui permet à la Commission des parcs d'autoriser l'usage et l'aménagement des terres d'un parc."}
  - {annee: 2024, evenement: "La Parks and Water Legislation Amendment Act 2024 insère les sections 25AKA à 25AKJ : l'usage et l'aménagement des terres d'un parc cogéré sont autorisés par les partenaires de gestion conjointe, et l'article 21A, modifié, exclut les parcs cogérés."}
