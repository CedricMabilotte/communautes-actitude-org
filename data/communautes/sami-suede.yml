resume: >-
  Depuis 2011, l'Instrument de gouvernement, l'une des lois fondamentales suédoises, reconnaît les Sámi comme un peuple. La Loi de 1992 sur le Sameting institue une assemblée élue qui est aussi une autorité administrative de l'État. Le droit à l'élevage des rennes est réservé aux Sámi membres des communautés villageoises (samebyar). La Loi de 2022 oblige l'État, les régions et les communes à consulter les représentants sâmes avant les décisions qui les concernent particulièrement.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Les Sámi font partie des minorités nationales reconnues par la Suède en application de la Convention-cadre du Conseil de l'Europe (SÖ 2000:2) et de la Charte européenne des langues régionales ou minoritaires (SÖ 2000:3), Loi 2009:724, art. 2.", annee: 2000, source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-2009724-om-nationella-minoriteter-och_sfs-2009-724/"}
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La Suède a voté pour la Déclaration en 2007 ; elle n'a pas ratifié la Convention OIT 169 (A/HRC/33/42/Add.3, § 35).", annee: 2007, source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale (CERD) a constaté en 2020 une violation des articles 5 (d) (v) et 6 de la Convention dans l'octroi de concessions minières sur le territoire de la sameby de Vapsten (communication no 54/2013, CERD/C/102/D/54/2013).", annee: 2020, source: "https://documents.un.org/doc/undoc/gen/g20/350/11/pdf/g2035011.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la situation du peuple sâme dans la région du Sápmi (A/HRC/33/42/Add.3), § 35 à 52.", annee: 2016, source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
base_nationale:
  - {instrument: "Instrument de gouvernement (1974:152), chap. 1, art. 2, et chap. 2, art. 17", nature: "constitution", annee: 2011, source: "https://www.constituteproject.org/constitution/Sweden_2012"}
  - {instrument: "Loi sur le Sameting (1992:1433)", nature: "loi", annee: 1992, source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/sametingslag-19921433_sfs-1992-1433/"}
  - {instrument: "Loi sur l'élevage des rennes (1971:437)", nature: "loi", annee: 1971, source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/rennaringslag-1971437_sfs-1971-437/"}
  - {instrument: "Loi sur les minorités nationales et les langues minoritaires (2009:724)", nature: "loi", annee: 2009, source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-2009724-om-nationella-minoriteter-och_sfs-2009-724/"}
  - {instrument: "Loi sur la consultation dans les questions concernant le peuple sâme (2022:66)", nature: "loi", annee: 2022, source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-202266-om-konsultation-i-fragor-som-ror-det_sfs-2022-66/"}
  - {instrument: "Cour suprême de Suède, arrêt Girjas (T 853-18), 2020", nature: "jurisprudence", annee: 2020, source: "https://www.domstol.se/en/supreme-court/news-archive/the-girjas-case--press-release/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Sameting est une autorité de l'État chargée de veiller aux questions de culture sâme, Loi de 1992, chap. 1, art. 1 ; ses 31 membres sont élus par les personnes inscrites sur la liste électorale sâme, chap. 2, art. 2, et chap. 3, art. 3.", source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/sametingslag-19921433_sfs-1992-1433/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le droit d'élevage des rennes (renskötselrätt) appartient à la population sâme, se fonde sur la possession immémoriale (urminnes hävd, usage depuis des temps très anciens) et comprend l'usage des terres et des eaux pour les éleveurs et leurs rennes ; seuls les membres d'une sameby l'exercent, Loi 1971:437, art. 1 et 3 ; l'Instrument de gouvernement, chap. 2, art. 17, renvoie à la loi ; les aires de pâturage ne sont pas délimitées (Rapporteur spécial, 2016, § 38).", source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/rennaringslag-1971437_sfs-1971-437/"}
  ressources: {valeur: "partiel", note: "La Cour suprême a jugé le 4 septembre 2020 (T 853-18) que la sameby de Girjas détient, par possession immémoriale, le droit exclusif d'accorder les droits de chasse et de pêche sur son aire au-dessus de la limite des cultures, dans le comté de Norrbotten ; l'État ne peut plus accorder ces droits sur cette aire.", source: "https://www.domstol.se/en/supreme-court/news-archive/the-girjas-case--press-release/"}
  consentement: {valeur: "partiel", note: "L'État, les régions et les communes doivent consulter le Sameting et, s'il y a lieu, les samebyar avant de décider dans les affaires de portée particulière pour les Sámi ; la consultation se poursuit jusqu'à accord ou constat qu'il est impossible, Loi 2022:66, art. 2, 7 et 11 ; la loi n'exige pas le consentement.", source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-202266-om-konsultation-i-fragor-som-ror-det_sfs-2022-66/"}
  langue: {valeur: "partiel", note: "Dans l'aire administrative du sâme (17 communes nommées à l'art. 6, d'autres pouvant y entrer sur décision du gouvernement, art. 7), toute personne peut employer le sâme avec les autorités administratives, qui répondent oralement dans cette langue, Loi 2009:724, art. 8 ; le Sameting fixe les objectifs du travail sur la langue sâme, Loi 1992:1433, chap. 2, art. 1 ; l'application reste partielle faute de personnel (Rapporteur spécial, 2016, § 49).", source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-2009724-om-nationella-minoriteter-och_sfs-2009-724/"}
  education: {valeur: "partiel", note: "Le Sameting nomme les membres du Conseil des écoles sâmes (Sameskolstyrelsen), Loi 1992:1433, chap. 2, art. 1, point 3 ; cinq écoles sâmes couvrent les six premières années de scolarité (Rapporteur spécial, 2016, § 50 et 51).", source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/sametingslag-19921433_sfs-1992-1433/"}
  fiscalite: {valeur: "partiel", note: "Le Sameting décide de la répartition des subventions de l'État et du Fonds sâme (Samefonden) destinés à la culture et aux organisations sâmes, Loi 1992:1433, chap. 2, art. 1, point 1 ; il n'a pas de pouvoir fiscal.", source: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/sametingslag-19921433_sfs-1992-1433/"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Conseil sâme et IWGIA (State of Sápmi, 2025) relèvent que le Sameting a surtout un rôle consultatif, que la loi de 2022 ne s'applique pas aux entreprises privées (mines, forêts) et qu'elle ne vise pas le consentement préalable ; le CERD a constaté en 2020 une violation des droits de la sameby de Vapsten dans l'octroi de concessions minières ; le Rapporteur spécial (2016, § 37 à 48) relevait le double rôle du Sameting et l'absence de délimitation des terres.", source: "https://indigenousnavigator.org/files/media/document/The+State+Of+Sa%CC%81pmi+01_2025.pdf"}
chronologie:
  - {annee: 1971, evenement: "Loi sur l'élevage des rennes."}
  - {annee: 1992, evenement: "Loi sur le Sameting."}
  - {annee: 2011, evenement: "L'Instrument de gouvernement reconnaît les Sámi comme un peuple (1er janvier)."}
  - {annee: 2020, evenement: "Arrêt Girjas de la Cour suprême (4 septembre)."}
  - {annee: 2020, evenement: "Avis du CERD constatant une violation des droits de la sameby de Vapsten (18 novembre)."}
  - {annee: 2022, evenement: "Loi sur la consultation du peuple sâme ; application aux régions et communes à partir de mars 2024."}
  - {annee: 2025, evenement: "Élection du Sameting ; la liste électorale compte 9 755 personnes."}
