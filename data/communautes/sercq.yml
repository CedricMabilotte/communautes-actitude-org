effectivite: {valeur: "effective", note: "La Cour suprême du Royaume-Uni décrit en 2014 les Chief Pleas comme législateur et exécutif de l'île et la Cour du sénéchal comme juridiction de première instance ; elle a jugé que les tribunaux du Royaume-Uni ont en principe compétence pour contrôler l'ordre en conseil qui donne la sanction royale à une loi de Sercq, mais qu'ils ne devaient pas l'exercer dans cette affaire, le contrôle relevant des tribunaux des îles.", source: "https://supremecourt.uk/uploads/uksc_2013_0155_judgment_fe5c3aa710.pdf"}
chronologie:
  - {annee: 1565, evenement: "Élisabeth Ire confirme la concession du fief de Sercq à Helier de Carteret, accordée en 1563, avec l'obligation d'entretenir 40 hommes armés."}
  - {annee: 1675, evenement: "La Couronne crée la charge de sénéchal, juge de l'île."}
  - {annee: 1922, evenement: "Douze députés élus rejoignent les Chief Pleas, jusque-là composés du seigneur, du sénéchal et des 40 tenanciers."}
  - {annee: 2008, evenement: "La Reform (Sark) Law, 2008, adoptée par les Chief Pleas en 2006, reçoit la sanction royale."}
  - {annee: 2009, evenement: "En janvier, les tenanciers et les députés perdent leurs sièges au profit des conseillers élus."}
  - {annee: 2010, evenement: "Après un arrêt de la Cour d'appel d'Angleterre (2008) sur la Convention européenne des droits de l'homme, une loi sépare la présidence des Chief Pleas de la fonction de juge du sénéchal ; elle reçoit la sanction royale le 12 octobre 2011."}
  - {annee: 2014, evenement: "Arrêt R (Barclay) v Secretary of State for Justice de la Cour suprême du Royaume-Uni sur le contrôle des lois de Sercq."}
  - {annee: 2022, evenement: "Premier recensement propre à l'île depuis cinquante ans : 562 résidents."}
fiabilite:
  verifie: ["Compétence civile des Chief Pleas et compétence pénale des États de délibération (Cour royale de Guernesey).", "Composition antérieure (seigneur, sénéchal, 40 tenanciers, 12 députés) et réforme de 2008 (Cour royale ; Cour suprême, 2014, § 22).", "Compétences de la Cour du sénéchal et voies d'appel (Cour royale de Guernesey ; Cour suprême, 2014, § 20).", "Séparation des rôles du sénéchal par la loi de 2010 (Cour suprême, 2014, § 24).", "Sercq comprend Brecqhou et forme une juridiction distincte au sein du bailliage (Bibliothèque de la Chambre des communes, CBP-8611).", "Population résidente de 562 au 27 avril 2022 (rapport de recensement des Chief Pleas).", "Impôt foncier, impôt sur le capital personnel et tribunal fiscal (Direct Taxes (Sark) Law, 2002, texte consolidé publié par les Chief Pleas, art. 1 et annexe 3).", "Lettres patentes de 1565 et création de la charge de sénéchal en 1675 (Cour suprême, 2014, § 19-20)."]
  non_confirme: ["Le texte consolidé de la Reform (Sark) Law, 2008 n'a pas pu être ouvert ; la liste des conseillers publiée par les Chief Pleas en 2026 compte 18 sièges (17 noms et un siège vacant) contre 28 prévus en 2008, sans que le texte modificatif ait été trouvé.", "Date de création de la charge de sénéchal : la Cour suprême indique 1675 ; la Cour royale de Guernesey mentionne un ordre en conseil de 1672 confiant sa nomination à la Cour royale, puis de 1685 la confiant au seigneur.", "Surface de l'île : aucune valeur officielle ouverte.", "Statut du français et du sercquiais dans les institutions non vérifié sur un texte.", "Compétence des Chief Pleas en matière d'éducation (un comité de l'éducation figure sur la liste officielle) non vérifiée sur un texte.", "Régime foncier des 40 tenements et droits du seigneur après 2008 non vérifiés sur un texte en vigueur.", "Nombre de villages : non trouvé."]
