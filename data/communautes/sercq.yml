droits:
  autogouvernement: {valeur: "reconnu", note: "Depuis janvier 2009, les Chief Pleas, parlement de l'île, sont composés de conseillers élus pour quatre ans (28 selon la Reform (Sark) Law, 2008) ; le seigneur y siège sans droit de vote.", source: "https://www.guernseyroyalcourt.gg/article/3424/Parliament---The-Chief-Pleas"}
  pouvoir_normatif: {valeur: "partiel", note: "Les Chief Pleas légifèrent en matière civile sans intervention des États de délibération de Guernesey ; le droit pénal applicable à Sercq est adopté par les États de délibération de Guernesey.", source: "https://www.guernseyroyalcourt.gg/article/3424/Parliament---The-Chief-Pleas"}
  justice_propre: {valeur: "reconnu", note: "La Cour du sénéchal, organisée par la Reform (Sark) Law, 2008, a une compétence civile illimitée et une compétence pénale limitée (un mois d'emprisonnement, amende de niveau 4) ; appel devant la Cour royale de Guernesey.", source: "https://www.guernseyroyalcourt.gg/article/4135/Court-of-the-Seneschal"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Selon la Cour suprême du Royaume-Uni (2014), le parlement de Guernesey légifère pour Sercq en matière pénale sans consentement des Chief Pleas et dans les autres matières avec leur consentement ; le Parlement britannique garde en droit un pouvoir de légiférer sans consentement.", source: "https://supremecourt.uk/uploads/uksc_2013_0155_judgment_fe5c3aa710.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Les Chief Pleas fixent par ordonnance un impôt foncier et un impôt sur le capital personnel, Direct Taxes (Sark) Law, 2002, art. 1 ; le tribunal fiscal de Sercq (Sark Tax Tribunal, annexe 3) tranche les litiges d'assiette.", source: "https://img1.wsimg.com/blobby/go/5ff82f30-38d7-4ae5-98f1-e93b4ee65820/downloads/448c00e8-92f6-42e6-8b05-cecf625c813f/The%20Direct%20Taxes%20(Sark)%20Law%2C%202002.pdf?ver=1790844625396"}
