resume: >-
  Sercq est l'une des trois juridictions du bailliage de Guernesey, avec Guernesey et Aurigny ; elle comprend l'île de Brecqhou. Le fief a été concédé à Helier de Carteret en 1563 et confirmé par Élisabeth Ire en 1565. Jusqu'en janvier 2009, le parlement local, les Chief Pleas (« Chefs Plaids »), réunissait le seigneur, le sénéchal (juge de l'île), les 40 tenanciers et 12 députés élus. Depuis la Reform (Sark) Law, 2008 (loi de réforme), les Chief Pleas sont composés de conseillers élus ; ils légifèrent en matière civile, tandis que les États de délibération (parlement de Guernesey) légifèrent pour Sercq en matière pénale.
