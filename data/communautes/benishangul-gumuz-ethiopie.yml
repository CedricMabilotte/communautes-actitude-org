droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 47(1) de la Constitution fédérale : Benishangul-Gumuz est un État membre ; art. 2 de la constitution régionale : la région appartient aux cinq peuples ; art. 74 et 75 : administrations et conseils de nationalités, dont cinq conseils de nationalités d'au plus 75 membres créés par la Proclamation 73/2008 (art. 8(2)).", source: "https://www.ecmi.de/fileadmin/redakteure/publications/JEMIE_Datens%C3%A4tze/Jemie_datens%C3%A4tze_2019/Dessalegn.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(2)(b) de la Constitution fédérale : l'État régional adopte sa constitution et ses lois. Les conseils de nationalités n'édictent que des directives conformes aux lois régionales (art. 75(3)(c) de la constitution régionale).", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  justice_propre: {valeur: "conteste", note: "Art. 74(2) de la constitution régionale : chaque administration de nationalité comprend un organe judiciaire ; selon Dessalegn (2019), ces administrations ne sont pas établies et, faute de loi d'application, les tribunaux coutumiers prévus par la Constitution fédérale (art. 34(5) et 78(5)) ne fonctionnent pas.", source: "https://www.ecmi.de/fileadmin/redakteure/publications/JEMIE_Datens%C3%A4tze/Jemie_datens%C3%A4tze_2019/Dessalegn.pdf"}
  terres: {valeur: "partiel", note: "Art. 40(3) de la Constitution fédérale : la terre appartient à l'État et aux peuples d'Éthiopie et ne peut être vendue ; art. 52(2)(d) : les États l'administrent selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) de la Constitution fédérale : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Art. 75(3)(a) et (b) de la constitution régionale : chaque conseil de nationalité fixe la langue de travail de son administration et protège le droit de parler, écrire et développer sa langue ; art. 5(3) de la Constitution fédérale : l'État fixe sa langue de travail ; selon Dessalegn (2019), la langue de travail de la région n'est aucune des cinq langues.", source: "https://www.ecmi.de/fileadmin/redakteure/publications/JEMIE_Datens%C3%A4tze/Jemie_datens%C3%A4tze_2019/Dessalegn.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 97 de la Constitution fédérale : les États lèvent des impôts propres. Le budget des conseils de nationalités dépend de celui voté par le parlement régional (art. 75(3)(d) de la constitution régionale).", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 61(2) de la Constitution fédérale : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération (chambre haute).", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "partiel", note: "Art. 2 de la constitution régionale : statut de « peuples propriétaires » de la région ; selon Dessalegn (2019), l'art. 34 réserve à ces cinq peuples le droit d'être élu à une fonction publique régionale.", source: "https://www.ecmi.de/fileadmin/redakteure/publications/JEMIE_Datens%C3%A4tze/Jemie_datens%C3%A4tze_2019/Dessalegn.pdf"}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) de la Constitution fédérale : droit inconditionnel à l'autodétermination, y compris la sécession (séparation d'avec l'État), par vote aux deux tiers du conseil législatif puis référendum. Jamais exercé.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "partielle", note: "Selon Dessalegn (2019), les administrations de nationalités prévues par la constitution régionale ne sont pas établies ; la région est découpée en trois zones (Assosa, Kamashi, Metekel) et un woreda spécial Mao-Komo ; les membres des conseils de nationalités sont choisis par le parti au pouvoir dans la région, affilié à l'EPRDF, sans élection distincte, et ces conseils restent « largement symboliques » ; ils ont toutefois fait préparer des manuels scolaires du primaire dans les cinq langues. Données de terrain de mai 2016.", source: "https://www.ecmi.de/fileadmin/redakteure/publications/JEMIE_Datens%C3%A4tze/Jemie_datens%C3%A4tze_2019/Dessalegn.pdf"}
chronologie:
  - {annee: 1979, evenement: "Début des réinstallations de paysans des hautes terres dans la région sous le régime du Derg, surtout au milieu des années 1980."}
  - {annee: 1995, evenement: "Entrée en vigueur de la Constitution fédérale ; création de l'État régional de Benishangul-Gumuz."}
  - {annee: 2002, evenement: "Constitution régionale révisée : art. 2 sur les cinq peuples « propriétaires », art. 74 et 75 sur les administrations et conseils de nationalités."}
  - {annee: 2008, evenement: "Le 1er novembre, Proclamation régionale 73/2008 créant les cinq conseils de nationalités."}
  - {annee: 2014, evenement: "En mai, les cinq conseils de nationalités commencent à fonctionner."}
  - {annee: 2019, evenement: "Début du conflit du Metekel."}
