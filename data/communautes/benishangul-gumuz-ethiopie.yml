resume: >-
  Benishangul-Gumuz est l'un des États membres de la fédération éthiopienne, créé en 1995 dans le nord-ouest du pays, à la frontière du Soudan et du Soudan du Sud.
  L'article 2 de sa constitution révisée attribue le « droit de propriété » sur la région aux Berta, Gumuz, Shinasha, Mao et Komo, malgré la présence d'autres groupes qui forment près de la moitié de la population.
  La Proclamation (loi) régionale 73/2008 crée cinq conseils de nationalités, un par peuple, compétents sans limite territoriale pour la langue et le patrimoine ; ils fonctionnent depuis mai 2014.
  Les Mao et les Komo ont un woreda (district) spécial, Mao-Komo, où ils ne forment pas la majorité de la population (recensement de 2007).
