resume: >-
  Le traité de paix de Lausanne du 24 juillet 1923 (section III, art. 38 à 44) garantit aux ressortissants turcs appartenant aux minorités non musulmanes le droit de fonder et gérer à leurs frais des écoles et des institutions religieuses, charitables et sociales, avec usage de leur langue (art. 40). La Turquie applique ce statut aux seules communautés arménienne, grecque orthodoxe (Rum) et juive. Leurs biens collectifs sont détenus par des fondations communautaires (cemaat vakıfları), régies par la loi n° 5737 sur les fondations de 2008, dont les administrateurs sont élus par les membres ; ce régime des fondations couvre aussi d'autres communautés non musulmanes, dont les Syriaques (art. provisoire 13, 2017). En 1926, lors de l'adoption du Code civil, les trois communautés ont renoncé aux droits de statut personnel prévus à l'art. 42.
