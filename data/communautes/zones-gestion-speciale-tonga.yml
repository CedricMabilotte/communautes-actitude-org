effectivite: {valeur: "partielle", note: "L'enquête de la Communauté du Pacifique publiée en décembre 2022 compte 59 sites actifs, chacun doté d'un plan de gestion, et relève l'absence d'inventaire national public. La revue de 2024 (Ford-Learner et al., Pacific Conservation Biology) recense 61 zones et conclut à des résultats écologiques variables : certaines zones montrent des poissons plus grands et plus nombreux, d'autres aucun effet mesurable ; trois études seulement ont mesuré l'effet écologique après la création des zones. Le rapport de 2020 établi avec le ministère des Pêches mesure un effet de la réserve sans prélèvement sur certains sites (Nomuka, ʻAtata) et aucun effet sur d'autres (ʻOʻua).", source: "https://connectsci.au/pc/article/30/5/PC24003/38198/Status-of-monitoring-and-evaluation-of-Tonga-s"}
chronologie:
  - {annee: 2002, evenement: "Loi sur la gestion des pêches : déclaration des zones de gestion spéciale et désignation des communautés côtières (art. 13 à 16)."}
  - {annee: 2006, evenement: "Première zone de gestion spéciale désignée en novembre à ʻOʻua (Haʻapai)."}
  - {annee: 2009, evenement: "Règlement sur les communautés côtières : comités de gestion, plans, registres des pêcheurs et des navires."}
  - {annee: 2010, evenement: "Brochure du ministère et de la Communauté du Pacifique : six communautés désignées."}
  - {annee: 2018, evenement: "Fin 2018 : 40 zones, environ 19,9 % des eaux tongiennes en zone de gestion spéciale et 3,3 % en réserve sans prélèvement (sixième rapport national à la CDB)."}
  - {annee: 2019, evenement: "Septembre : 46 communautés supplémentaires confirmées, soumises au Conseil des ministres, candidates ou proposées ; objectif d'inclure toutes les communautés côtières d'ici 2025."}
  - {annee: 2022, evenement: "Enquête de la Communauté du Pacifique : 59 sites actifs, 524,37 km² de zones, 53,8 km² de réserves."}
  - {annee: 2024, evenement: "61 zones établies selon la revue publiée dans Pacific Conservation Biology."}
fiabilite:
  verifie: ["Articles 13 (1), 14 (1), (2) et (5), 15 (1) de la loi de 2002 et règlements 5 à 9, 11, 12, 16 et 17 de 2009 : extraits reproduits dans le guide juridique de la Communauté du Pacifique (2023) ; art. 15 (2) de la loi, règl. 18 et art. 109 de la Constitution d'après le tableau de synthèse du même guide.", "Chiffres 2022 (59 sites actifs, 5 en cours, 54 communautés couvertes, 111 communautés côtières, 52 437 ha de sites, 5 380,43 ha de réserves) : rapport d'enquête de la Communauté du Pacifique (Govan et Lalavanua, décembre 2022).", "61 zones établies et composition d'une zone (espace réservé à la communauté et réserve permanente sans prélèvement) : Ford-Learner et al., 2024.", "Sixième rapport national des Tonga à la CDB (septembre 2020) : 40 zones fin 2018, 19,9 % des eaux.", "Première zone à ʻOʻua en novembre 2006 et liste des sites, années, îles et surfaces : rapport 2020 sur les zones de gestion spéciale, établi avec le ministère des Pêches et préfacé par son directeur général.", "Brochure 2010 du ministère et de la Communauté du Pacifique : six communautés désignées, règles générales des zones et des réserves.", "Tableau : nom, groupe d'îles, année et surface des 40 lignes contrôlés sur les pages par site du rapport de 2020 (49 sites décrits, dont 9 marqués « proposé »)."]
  non_confirme: ["Le texte officiel de la loi de 2002 et du règlement de 2009 n'a pas pu être ouvert directement (PacLII inaccessible) ; les articles sont cités d'après le guide juridique de la Communauté du Pacifique.", "Le tableau des sites reprend les 40 zones et réserves établies décrites dans le rapport de 2020 (hors 9 zones alors proposées) ; il ne couvre pas les zones créées depuis (61 en 2024) et aucune liste officielle à jour n'est publiée. Les surfaces sont celles de la zone ; pour trois sites sans zone de pêche réservée (Fafa, ʻEueiki de Vavaʻu, Pangaimotu de Tongatapu), il s'agit de la surface de la réserve.", "Écarts de chiffres entre sources : 59 sites actifs (Communauté du Pacifique, 2022 et portail non daté), 61 zones (2024) ; 54 communautés couvertes (2022) et 64 (portail non daté).", "Le contenu exact du règlement 18 (droits de pêche) n'a pas été lu ; seule sa mention dans le tableau du guide l'a été.", "Population : non trouvée. Aucun total publié pour les communautés couvertes ; le rapport de 2020 donne une population pour chacun des 49 sites décrits, sans année de référence, non additionnée ici.", "Inscription des zones dans la base mondiale des aires protégées (WDPA) : non vérifiée.", "Les études d'effectivité (rapport de 2020, revue de 2024) comptent des agents du ministère des Pêches parmi leurs auteurs ; aucune évaluation conduite sans le ministère n'a été trouvée."]
