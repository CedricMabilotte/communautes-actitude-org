resume: >-
  Fiche agrégée : elle couvre les communautés côtières des Tonga désignées pour gérer une zone de gestion spéciale (Special Management Area, SMA ; en tongien Feituʻu Puleʻi Makehe). La loi sur la gestion des pêches de 2002 (Fisheries Management Act) permet au ministre de déclarer une telle zone par arrêté publié au journal officiel et de désigner la communauté côtière qui en a la charge (art. 13 et 14). Le règlement sur les communautés côtières de 2009 (Fisheries (Coastal Communities) Regulations) institue pour chaque communauté un comité de gestion, en partie élu, qui prépare le plan de gestion et tient le registre des pêcheurs autorisés. Chaque zone comprend un espace où seules les personnes inscrites peuvent pêcher et une réserve d'habitat des poissons (Fish Habitat Reserve) fermée à toute pêche. La première zone, ʻOʻua (Haʻapai), date de 2006 ; 61 zones étaient établies en 2024.
