reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national des Tonga à la Convention sur la diversité biologique : il décrit le programme des zones de gestion spéciale, cite la loi sur la gestion des pêches de 2002, compte 40 zones fin 2018 couvrant environ 19,9 % des eaux et indique que les comités locaux contrôlent la pêche et déterminent qui peut pêcher", annee: 2020, source: "https://www.cbd.int/doc/nr/nr-06/to-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Fisheries Management Act 2002, art. 13 (déclaration des zones de gestion spéciale), 14 (désignation des communautés côtières), 15 (règlements propres à une zone, consultation avant toute licence de pêche) et 16 (texte cité par le guide juridique de la Communauté du Pacifique, 2023)", nature: "loi", annee: 2002, source: "https://purl.org/spc/digilib/doc/s5b7j"}
  - {instrument: "Fisheries (Coastal Communities) Regulations 2009, règl. 5 à 12 (comités de gestion), 16 (registres des pêcheurs et des navires), 17 (consultation sur les plans) et 18 (droits de pêche des communautés) (texte cité par le guide juridique de la Communauté du Pacifique, 2023)", nature: "loi", annee: 2009, source: "https://purl.org/spc/digilib/doc/s5b7j"}
droits:
  autogouvernement: {valeur: "partiel", note: "Un comité de gestion est établi pour chaque communauté côtière inscrite à l'annexe I du règlement de 2009 (règl. 5). Il réunit un président élu par la communauté, l'agent de la localité (Town Officer), l'agent du district, un représentant du ministère, deux représentants des pêcheurs et deux représentantes des femmes élus pour trois ans, et trois membres nommés par le président (règl. 6 et 8). Il fixe ses propres règles de procédure en suivant les orientations du directeur général (Chief Executive Officer) du ministère et décide par consensus, à défaut à la majorité (règl. 7 et 11).", source: "https://purl.org/spc/digilib/doc/s5b7j"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité prépare le plan de conservation et de gestion de la zone, soumis à l'approbation du directeur général du ministère (règl. 12 (2) (a), 2009). Les règlements propres à une zone sont pris par le ministre, en consultation avec le comité consultatif de gestion des pêches et la communauté côtière responsable (Fisheries Management Act 2002, art. 15 (1)). Selon l'enquête de la Communauté du Pacifique (2022), les communautés ne fixent des règles de gestion de la pêche que dans une zone déclarée.", source: "https://purl.org/spc/digilib/doc/s5b7j"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les droits de pêche des communautés côtières sont reconnus dans les zones de gestion spéciale (règl. 18, 2009). Le comité tient un registre des pêcheurs et un registre des navires autorisés à pêcher dans la zone, et en retire les personnes qui ne respectent pas les mesures de gestion jusqu'à ce qu'elles prennent les mesures correctives qu'il détermine (règl. 16). Le rivage et les ressources marines restent propriété de la Couronne (Constitution, art. 109). Hors des zones déclarées, les communautés n'ont pas de droit exclusif d'accès (enquête de la Communauté du Pacifique, 2022).", source: "https://purl.org/spc/digilib/doc/s5b7j"}
  consentement: {valeur: "partiel", note: "La communauté côtière est consultée avant toute délivrance par le ministre d'une licence de pêche dans sa zone (Fisheries Management Act 2002, art. 15 (2)) et avant tout règlement propre à sa zone (art. 15 (1)). Le texte prévoit une consultation, pas un consentement.", source: "https://purl.org/spc/digilib/doc/s5b7j"}
