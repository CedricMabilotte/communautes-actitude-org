resume: >-
  Le Tripura Tribal Areas Autonomous District Council (conseil autonome de district des zones tribales de Tripura), mis en place en 1982 et inscrit à la Sixième annexe de la Constitution par le 49e amendement (1984, en vigueur le 1er avril 1985), couvre 7 132,56 km² sur les 10 491,69 km² de l'État. Il est élu par les habitants de ces zones, où vit la majorité des membres des tribus répertoriées (Scheduled Tribes, liste constitutionnelle) de l'État. Le kokborok est langue officielle de l'État avec le bengali depuis 1979. Les lois de l'État sur les matières du conseil ne s'y appliquent que sur décision de celui-ci. L'accord tripartite du 2 mars 2024 avec le parti Tipra Motha porte sur l'histoire, les terres, les droits politiques, l'identité et la langue.
