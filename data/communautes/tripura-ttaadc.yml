lieux: {valeur: 527, unite: "villages (élections des comités de développement villageois)", annee: 2006, source: "https://twd.tripura.gov.in/institutional-framework-welfare-tribes-tripura"}
surface_km2: {valeur: 7132.56, annee: 2024, perimetre: "territoire du district autonome, environ 68 % de la superficie de l'État", source: "https://cag.gov.in/uploads/download_audit_report/2024/6-CH-1-Report-2018-19-068d151aeaea4a3.07334094.pdf"}
resume: >-
  Les tribus répertoriées de Tripura, dont les Tripuri, ont pour langue officielle commune le kokborok depuis 1979. Le Tripura Tribal Areas Autonomous District Council, mis en place en janvier 1982 et inscrit à la Sixième annexe de la Constitution par le 49e amendement (1984, en vigueur le 1er avril 1985), couvre environ 68 % de l'État. Les lois de l'État sur les matières du conseil ne s'y appliquent que sur décision de celui-ci. L'accord tripartite du 2 mars 2024 avec le parti Tipra Motha porte sur l'histoire, les terres, les droits politiques, l'identité et la langue.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître les peuples tribaux et les « tribus énumérées » comme groupes ayant droit à une protection spéciale ; § 12 et 19 sur les États du nord-est", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, art. 244 (2) et Sixième annexe", nature: "constitution", annee: 1950, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Constitution (49e amendement) Act, 1984, Partie IIA de la Table et paragraphe 12AA", nature: "constitution", annee: 1984, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Tripura Official Language Act, 1964, modifiée en 1979", nature: "loi", annee: 1979, source: "https://www.casemine.com/act/in/5a9cce3b4a93265347813367"}
  - {instrument: "Accord tripartite gouvernement de l'Inde, gouvernement de Tripura et TIPRA (Tipra Motha)", nature: "accord_paix", annee: 2024, source: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2010880"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de trente membres, dont vingt-huit élus au suffrage universel (vingt-cinq sièges réservés aux tribus répertoriées) et deux nommés par le gouverneur, Sixième annexe, paragraphe 2, Partie IIA de la Table (49e amendement, 1984).", source: "https://cag.gov.in/uploads/download_audit_report/2024/6-CH-1-Report-2018-19-068d151aeaea4a3.07334094.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 ; ses lois requièrent l'assentiment du gouverneur, et les lois de l'État sur ces matières ne s'y appliquent que sur décision du conseil, paragraphe 12AA (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Le conseil peut créer des conseils ou tribunaux de village pour les litiges entre membres des tribus répertoriées, à l'exclusion des autres tribunaux de l'État, et une juridiction d'appel ; seuls la Haute Cour et la Cour suprême restent compétentes, Sixième annexe, paragraphe 4.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Aucune loi de l'Assemblée de l'État (Tripura) sur les matières du paragraphe 3 ne s'applique au district autonome sans notification du conseil, qui peut l'adapter, Sixième annexe, paragraphe 12AA (a) ; les lois du Parlement restent applicables sauf décision du président ou du gouverneur.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  langue: {valeur: "reconnu", note: "Le kokborok (Kak-Barak) est langue officielle de l'État de Tripura avec le bengali, loi de 1964 sur la langue officielle, art. 2 (1), modifiée en 1979.", source: "https://www.casemine.com/act/in/5a9cce3b4a93265347813367"}
  education: {valeur: "partiel", note: "Le conseil peut créer et gérer des écoles primaires et fixer la langue et les modalités de l'enseignement primaire, avec l'accord préalable du gouverneur, Sixième annexe, paragraphe 6 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des non-tribaux, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Conseil renouvelé en avril 2026 (le Tipra Motha remporte 24 des 28 sièges élus) ; l'accord de 2024 renvoie à un groupe de travail commun dont les résultats n'ont pas été vérifiés.", source: "https://www.sentinelassam.com/topheadlines/ttaadc-election-results-2026-tipra-motha-wins-24-seats-in-landslide-bjp-slumps-to-just-4"}
chronologie:
  - {annee: 1979, evenement: "Le kokborok devient langue officielle de l'État."}
  - {annee: 1982, evenement: "Mise en place du conseil en janvier, en vertu d'une loi de l'État de 1979."}
  - {annee: 1985, evenement: "Le 49e amendement inscrit le district à la Sixième annexe (1er avril)."}
  - {annee: 2024, evenement: "Accord tripartite du 2 mars avec le Tipra Motha."}
  - {annee: 2026, evenement: "Élection du conseil en avril."}
