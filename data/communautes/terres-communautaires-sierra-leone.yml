resume: >-
  Fiche agrégée : elle couvre les communautés de ville, de village et de chefferie (circonscription coutumière dirigée par un chef suprême) qui détiennent des terres communales selon le droit coutumier dans les provinces de Sierra Leone. La loi n° 20 de 2022 sur les droits fonciers coutumiers (Customary Land Rights Act) dévolue le titre sur ces terres à la communauté entière (art. 13 (1) et 14 (1)) et en confie la gestion, pour le compte de la communauté, au comité foncier de ville ou de village ou au comité foncier de chefferie. Le comité de ville ou de village et la chefferie adoptent les règles d'usage des terres et des ressources (art. 13 (2), 14 (2) et 23 (4)), sous la supervision du conseil de chefferie (art. 9) ; la loi n° 19 de 2022 sur la Commission foncière nationale crée ces comités et fait élire par les résidents une partie des membres du comité de ville ou de village (art. 42, 49 et 50). Aucun investissement n'a lieu sur une terre coutumière sans le consentement libre, préalable et éclairé écrit d'au moins 60 % des membres adultes de la famille ou d'une représentation équitable de la communauté titulaire (art. 28).
