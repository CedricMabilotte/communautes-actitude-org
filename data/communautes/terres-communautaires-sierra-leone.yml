base_nationale:
  - {instrument: "Customary Land Rights Act 2022 (loi n° 20 de 2022), adoptée par le Parlement le 8 août 2022, signée le 6 septembre 2022, publiée au supplément de la Gazette extraordinaire n° 69 du 23 septembre 2022 ; art. 1, 8, 9, 13 à 19, 22, 23, 26, 28, 32, 43 à 46", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  - {instrument: "National Land Commission Act 2022 (loi n° 19 de 2022), adoptée le 8 août 2022, signée le 6 septembre 2022, publiée au supplément de la Gazette extraordinaire n° 69 du 23 septembre 2022 ; art. 42 à 56, 69, 73 à 76", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/sie212618.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les terres communales d'une ville ou d'un village sont gérées pour le compte de la communauté par le comité foncier de ville ou de village (art. 13 (1) de la loi de 2022), celles d'une chefferie par le comité foncier de chefferie (art. 14 (1)) ; tant qu'une ville ou un village n'a pas constitué son comité, ses terres et ressources sont gérées par le comité du conseil de chefferie (art. 18). Le conseil de chefferie exerce une responsabilité de supervision sur les terres par l'intermédiaire de ces comités (art. 9). Au moins 30 % des membres de chaque comité foncier sont des femmes (art. 8 (2)). Selon la loi n° 19 de 2022 sur la Commission foncière nationale, le comité de ville ou de village est présidé par le chef de ville ou de village et comprend quatre propriétaires et deux non-propriétaires résidents élus à la majorité des deux tiers des résidents de 18 ans et plus (art. 49 et 50) ; le comité foncier de chefferie est présidé par le chef suprême (Paramount Chief) et comprend un propriétaire et un usager par section, désignés par les comités de ville ou de village selon le droit coutumier (art. 42 et 43). Les deux comités rendent compte à la communauté (art. 46 et 53) et peuvent agir en justice pour leurs terres et ressources (art. 76).", source: "https://faolex.fao.org/docs/pdf/sie212618.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi de 2022 définit les règlements locaux (bye-laws) comme les règles adoptées par les communautés pour régir leurs terres et leurs ressources naturelles (art. 1). Le comité foncier de ville ou de village adopte des règles pour l'usage durable et équitable des terres communales (art. 13 (2)), la chefferie fait de même pour ses terres (art. 14 (2)), et les règlements du comité foncier de chefferie s'appliquent aux villages qui n'ont pas adopté les leurs (art. 19). Ces règlements doivent être conformes au droit coutumier et au droit national (art. 44 (2)).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  justice_propre: {valeur: "partiel", note: "Les différends fonciers nés dans la communauté peuvent être portés devant le comité foncier de ville ou de village ou devant le comité foncier de chefferie, qui les règle selon le droit coutumier et ses règlements (art. 44 (1) et (2) de la loi de 2022) ; l'appel va à la commission foncière de district, puis au siège de la Commission foncière nationale à Freetown (art. 44 (3) et (4)), et, à défaut de règlement, une partie peut saisir le tribunal local (art. 44 (10)). Les décisions sont rendues par écrit et peuvent être exécutées par le conseil de chefferie (art. 44 (9)).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  terres: {valeur: "reconnu", note: "Le titre sur les terres communales qui existent selon le droit coutumier dans une ville, un village ou une chefferie est dévolu à la communauté entière (art. 13 (1) et 14 (1) de la loi de 2022) ; tous les membres de la communauté ont accès à ces terres selon les règles de la communauté (art. 14 (3)) et tous les avantages des terres communales et de leurs ressources appartiennent à la communauté (art. 17 (2)). Un non-citoyen ou une société étrangère ne peut acquérir sur une terre coutumière qu'un bail de 50 ans au plus (art. 26 (1)), et la terre non utilisée par un investisseur dans les cinq ans revient aux propriétaires (art. 27 (5)). L'absence d'enregistrement d'une terre coutumière n'invalide ni le titre ni la propriété (loi n° 19 de 2022, art. 69). L'État travaille avec les comités fonciers pour faciliter l'acquisition de terres destinées à l'investissement (art. 15 (6)).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  ressources: {valeur: "partiel", note: "Une communauté qui dépend traditionnellement de forêts, pâturages, rivières ou marais situés sur ses terres ou à proximité a le droit de les utiliser (art. 23 (1) de la loi de 2022) ; l'État peut restreindre ou supprimer cet usage, en lien avec le conseil de chefferie, en cas de risque d'épuisement (art. 23 (2)). Les comités fonciers adoptent des règles d'usage durable, y compris pour interdire l'extraction de bois ou de sable destinée à l'extérieur de la communauté (art. 23 (4)). Les aires écologiquement sensibles peuvent être cogérées par la communauté, le comité du conseil de chefferie et l'administration (art. 22 (3)). Le loyer minier est versé directement aux familles ou communautés titulaires de droits sur la terre (art. 46, qui remplace l'art. 34A de la loi de 2009 sur les mines).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  consentement: {valeur: "reconnu", note: "Aucun investissement n'a lieu sur une terre coutumière sans le consentement libre, préalable et éclairé écrit d'au moins 60 % des membres adultes, hommes et femmes, de la famille, ou d'une représentation équitable de la communauté titulaire (art. 28 de la loi de 2022) ; l'acquisition d'une terre communautaire n'est valide qu'avec le consentement écrit d'une représentation équitable des membres adultes, recueilli lors d'une réunion communautaire dont le procès-verbal consigne la décision des hommes et des femmes (art. 32). L'investisseur fournit au préalable la nature, les risques et le plan d'affaires du projet (art. 29). Aucun déplacement de communauté n'a lieu sans nécessité impérieuse, consentement libre, préalable et éclairé des membres adultes et approbation du ministère (art. 43 (6)).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le comité foncier de chefferie lève, fait percevoir et gère les recettes de l'impôt foncier prélevé par les autorités de chefferie (loi n° 19 de 2022, art. 44 (e)). Tous les avantages des terres communales et de leurs ressources appartiennent à la communauté (art. 73 ; loi n° 20 de 2022, art. 17 (2)), et une communauté qui perçoit un loyer ouvre un compte bancaire dont les signataires lui rendent compte (loi n° 20 de 2022, art. 41).", source: "https://faolex.fao.org/docs/pdf/sie212618.pdf"}
