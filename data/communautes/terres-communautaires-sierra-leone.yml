effectivite: {valeur: "partielle", note: "Le résumé des communications des parties prenantes établi pour le quatrième Examen périodique universel de la Sierra Leone (A/HRC/WG.6/52/SLE/3, janvier 2026) rapporte qu'une coalition d'organisations (JS5) regrette les retards de mise en œuvre de la loi de 2022 et de la loi de 2022 sur la Commission foncière nationale, et relève des incohérences avec d'autres textes, dont la loi de 2022 sur le développement des mines et des minéraux. La compilation des informations des Nations unies (A/HRC/WG.6/52/SLE/2) indique que l'équipe de pays des Nations unies prend acte de l'adoption de la loi.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/WG.6/52/SLE/3&l=en&t=pdf"}
chronologie:
  - {annee: 2017, evenement: "Lancement, le 23 mars, de la Politique foncière nationale, qui vise l'égalité d'accès des femmes et des hommes à la terre."}
  - {annee: 2022, evenement: "Adoption par le Parlement, le 8 août, de la loi sur les droits fonciers coutumiers (n° 20 de 2022), signée le 6 septembre et publiée le 23 septembre."}
  - {annee: 2022, evenement: "Adoption de la loi sur la Commission foncière nationale (n° 19 de 2022), qui institue les comités fonciers de chefferie et de ville ou de village (art. 42 et 49)."}
  - {annee: 2023, evenement: "Règlement d'application de la loi n° 19 de 2022 (instrument statutaire n° 11 de 2023) sur les géomètres et parajuristes communautaires qui aident les communautés à enregistrer leurs terres coutumières."}
  - {annee: 2026, evenement: "Rapport national de la Sierra Leone au quatrième Examen périodique universel : la loi de 2022 y est présentée comme garantissant le consentement libre, préalable et éclairé pour l'usage des terres communautaires."}
fiabilite:
  verifie: ["Texte de la loi n° 20 de 2022, art. 1, 2, 8, 9, 13 à 19, 22, 23, 26 à 29, 32, 43 à 46, et dates d'adoption, de signature et de publication (FAOLEX, copie de la Gazette).", "Mention de la loi par l'équipe de pays des Nations unies, par. 52 de la compilation A/HRC/WG.6/52/SLE/2 (février 2026).", "Retards de mise en œuvre signalés par la coalition JS5, par. 18 du résumé A/HRC/WG.6/52/SLE/3 (janvier 2026).", "Présentation de la loi dans le rapport national A/HRC/WG.6/52/SLE/1 (mars 2026), par. 40 et 57.", "Lancement de la Politique foncière nationale le 23 mars 2017, par. 47 du rapport national A/HRC/WG.6/38/SLE/1 (2021).", "Loi n° 19 de 2022 sur la Commission foncière nationale, art. 42 à 56, 69, 73 à 76 (copie de la Gazette sur FAOLEX).", "Instrument statutaire n° 11 de 2023 pris en application de la loi n° 19 de 2022 (notice ECOLEX)."]
  non_confirme: ["Nombre de communautés titulaires de terres communales, nombre de comités fonciers constitués et surface des terres communales : aucune source publique trouvée, d'où l'absence de chiffres et de tableau des sites.", "Renvois internes : l'art. 1 de la loi n° 20 de 2022 situe les comités aux art. 49 et 56 de la loi sur la Commission foncière nationale, qu'il date de 2021 ; dans la loi n° 19 de 2022 publiée, ils sont créés aux art. 42 (chefferie) et 49 (ville ou village).", "Portée de l'art. 46 de la loi n° 20 de 2022 (loyer minier versé aux familles ou communautés) après l'adoption de la loi de 2022 sur le développement des mines et des minéraux : non vérifiée ; la coalition JS5 signale des incohérences entre les deux textes.", "Nombre de comités fonciers de ville ou de village effectivement élus : aucune source trouvée.", "Date d'entrée en vigueur de la loi n° 20 de 2022 : la date de commencement est laissée en blanc dans la copie publiée ; règlements d'application prévus à l'art. 47 non trouvés.", "Aucun document d'un mécanisme de la liste du cadre (organe de traité, Rapporteur spécial, Convention sur la diversité biologique) nommant ce régime n'a été trouvé ; les documents de l'Examen périodique universel ne font pas partie de cette liste.", "Nombre de villages : non trouvé."]
