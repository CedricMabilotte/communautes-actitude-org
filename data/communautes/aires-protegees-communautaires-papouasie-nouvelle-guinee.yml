effectivite: {valeur: "non_etablie", note: "La loi entre en vigueur par avis publié au Journal officiel (National Gazette) ; aucun avis ni règlement d'application n'a été trouvé. Le sixième rapport à la CDB (2019) relève la difficulté de tenir à jour le registre des aires protégées et la carte de leurs limites ; Mongabay (avril 2024) rapporte des doutes sur la capacité administrative de la CEPA et sur l'accès des communautés éloignées à la procédure.", source: "https://news.mongabay.com/2024/04/conservationists-welcome-new-png-protected-areas-act-but-questions-remain/"}
chronologie:
  - {annee: 1966, evenement: "Loi sur la protection et le contrôle de la faune : le ministre peut déclarer des aires de gestion de la faune et leur nommer un comité."}
  - {annee: 1975, evenement: "Déclaration de l'aire de gestion de la faune de Tonda (590 000 hectares), province occidentale."}
  - {annee: 1976, evenement: "Règles de l'aire de Tonda : chasse coutumière exclue des restrictions, guide coutumier obligatoire, moitié des redevances au propriétaire."}
  - {annee: 1978, evenement: "Loi sur les aires de conservation : comités de gestion représentant les propriétaires et les gouvernements locaux."}
  - {annee: 1993, evenement: "Tonda est inscrite sur la liste de la convention de Ramsar sur les zones humides."}
  - {annee: 2014, evenement: "Politique nationale sur les aires protégées de la CEPA."}
  - {annee: 2019, evenement: "Sixième rapport national à la CDB ; création d'un registre des aires protégées à la CEPA."}
  - {annee: 2024, evenement: "Loi sur les aires protégées, votée le 20 février et certifiée le 20 novembre ; abrogation des lois de 1966 et 1978."}
fiabilite:
  verifie: ["Texte de la loi de 2024 (FAOLEX, copie numérisée) : art. 1, 5 à 12, 22, 26 à 30, 38, 43, 47, 53, 55, 61, 80, 81 et annexe 2 (57 aires protégées existantes, dont 39 aires de gestion de la faune et l'aire de conservation YUS).", "Date de certification du 20 novembre 2024 (tampon sur la page de titre) ; vote du 20 février 2024 (Mongabay ; date du texte sur LEAP et InforMEA).", "Loi de 1978, art. 12 à 17 et 25 à 30 ; loi de 1966, art. 15 à 19 ; règles de Tonda de 1976, art. 1 à 6 (FAOLEX).", "Mentions de l'aire de conservation communautaire, des aires marines gérées localement et de l'aire YUS dans le sixième rapport national à la CDB (juin 2019).", "Tonda : 590 000 hectares, inscription Ramsar le 16 mars 1993 (fiche Ramsar n° 591)."]
  non_confirme: ["Numéro de la loi : 9 selon LEAP, FAOLEX et InforMEA ; le chiffre manuscrit de la copie numérisée est peu lisible.", "Entrée en vigueur : aucun avis de mise en vigueur au Journal officiel ni règlement d'application n'a été trouvé ; tant que la loi n'est pas en vigueur, les lois de 1966 et 1978 restent applicables. L'art. 81 ne maintient que les gardes ; le sort des comités de gestion et des règles propres à chaque aire n'est pas réglé par le texte.", "Aires marines gérées localement créées par les communautés : 22 dans l'archipel Bismarck entre 2016 et 2018 selon le rapport à la CDB, qui ne précise pas leur base juridique ; l'art. 30 (4) permet l'enregistrement de celles établies en vertu de la loi organique sur les gouvernements provinciaux et locaux, mais aucune liste officielle n'a été trouvée : elles ne figurent pas au tableau.", "Annexe 2 : l'aire de Hunstien Ranges est donnée pour « 220,000 » sans unité, Kavakuna Caves et Nuserang sans surface ; la date de l'aire YUS y est le 9 janvier 2019, alors que d'autres sources la datent de 2009 : l'année est laissée vide au tableau ; Tavalo n'a pas de date.", "Surfaces du tableau : reprises de l'annexe 2 sans contrôle sur d'autres sources (ex. Crater Mountain 27 000 hectares, Sulamesi 864 451 hectares).", "Population et nombre de villages : aucun chiffre pour l'ensemble du régime ; à titre d'exemple, environ 1 500 habitants à Tonda (fiche Ramsar) et 35 villages engagés dans l'aire YUS (Wikipédia, non vérifié sur source primaire).", "Le rapport à la CDB parle de « customary LMMA » ; la part des aires régionales effectivement gérées par des groupes coutumiers n'est pas connue."]
