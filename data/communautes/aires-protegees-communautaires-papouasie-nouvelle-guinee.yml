droits:
  autogouvernement: {valeur: "partiel", note: "Un groupe foncier incorporé peut établir une aire protégée sur la terre coutumière incorporée, et un propriétaire coutumier peut le faire, en consultation avec le clan, sur la terre non incorporée (loi de 2024, art. 53) ; les aires de conservation communautaires et les aires marines gérées localement peuvent être gérées par un groupe foncier incorporé ou un groupe coutumier (art. 28 (2)). L'Autorité de protection de la conservation et de l'environnement (CEPA) fixe les obligations de rapport en accord avec les parties prenantes et peut exercer sur une aire régionale les pouvoirs de contrôle nécessaires pour les faire respecter (art. 29) ; elle administre directement ou radie une aire dont le propriétaire ne produit pas de certificat d'audit (art. 65) ; le Conseil exécutif national, sur avis de la CEPA, peut radier une aire du registre (art. 55). Sous les lois abrogées, les comités de gestion étaient nommés par le ministre (loi de 1966, art. 16 ; loi de 1978, art. 25, avec des membres représentant les propriétaires).", source: "https://faolex.fao.org/docs/pdf/png233711.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité de gestion ou toute personne concernée soumet un plan de gestion à la CEPA, réputé approuvé si le public n'y fait pas objection dans un délai de 90 jours (loi de 2024, art. 38) ; les zones de gestion (management zones) figurent au plan, sont signées par les propriétaires et l'Autorité, prennent effet à leur publication au Journal officiel national ou provincial, et leur création requiert le consentement des groupes coutumiers (art. 2 et 43 (1)). Sous les lois de 1966 et 1978, les règles d'une aire étaient prises par le ministre après consultation du comité, qui ne faisait que les recommander (loi de 1966, art. 17 ; loi de 1978, art. 27 et 28).", source: "https://faolex.fao.org/docs/pdf/png233711.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le propriétaire ne cède aucun droit de propriété sur une aire protégée sans son consentement libre, préalable et éclairé, et ces droits comprennent ceux issus de la coutume (loi de 2024, art. 7 (1) et (3)) ; les droits acquis avant la loi ne sont pas affectés (art. 7 (4)). La loi se déclare toutefois compatible avec une prise de possession forcée pour cause d'utilité publique (art. 1 (3)), et la CEPA peut autoriser un aménagement dans une aire protégée « dans des circonstances spéciales » (art. 5).", source: "https://faolex.fao.org/docs/pdf/png233711.pdf"}
  ressources: {valeur: "partiel", note: "Dans l'aire de gestion de la faune de Tonda, les règles de 1976 ne s'appliquent pas aux détenteurs de droits coutumiers de chasse (art. 2), tout chasseur titulaire d'une licence doit être accompagné d'un guide détenteur de ces droits (art. 3) et la moitié des redevances revient au propriétaire de la terre (art. 5 (2)). La loi de 2024 exige un accord écrit entre le propriétaire et l'autorité compétente pour toute exploitation forestière ou tout projet carbone dans une aire protégée (art. 6) et prévoit des accords de partage des avantages, le signataire pour le clan étant réputé fiduciaire de ses membres (art. 61).", source: "https://faolex.fao.org/docs/pdf/png51821.pdf"}
  consentement: {valeur: "partiel", note: "La loi de 2024 définit le consentement libre, préalable et éclairé (art. 11 : information préalable, rédaction en langage simple, absence de contrainte, conseil d'un juriste) et l'exige pour la cession de droits de propriété (art. 7), le transfert d'une aire sur terre d'État (art. 10 (4)), les compensations de biodiversité sur terre coutumière (art. 25 (1) (e)) et la création des zones de gestion (art. 43). Elle ne l'exige pas pour les aménagements autorisés par la CEPA (art. 5). Les lois de 1966 et 1978 prévoyaient une simple consultation des propriétaires « dans la mesure du possible » (loi de 1966, art. 15 (2)).", source: "https://faolex.fao.org/docs/pdf/png233711.pdf"}
