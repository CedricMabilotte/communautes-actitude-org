resume: >-
  Fiche agrégée : elle couvre les groupes de propriétaires coutumiers (clans et groupes fonciers incorporés) qui établissent ou gèrent une aire protégée sur leur terre ou dans leurs eaux. La loi sur les aires protégées de 2024, votée le 20 février 2024 et certifiée le 20 novembre 2024, range parmi les « aires protégées régionales » les aires de conservation communautaires, les aires marines gérées localement et les aires de conservation gérées localement (art. 22), qui peuvent être gérées par un groupe foncier incorporé ou un groupe coutumier (art. 28). Elle abroge la loi sur les aires de conservation de 1978 et la loi sur la protection et le contrôle de la faune de 1966, dont les aires (aires de gestion de la faune, aire de conservation YUS) doivent être enregistrées comme aires de conservation communautaires (art. 30 (3) et 47). L'annexe 2 de la loi en recense 40. La loi entre en vigueur par avis publié au Journal officiel (National Gazette) ; aucun avis n'a été trouvé, et les lois de 1966 et 1978 restent applicables jusque-là.
