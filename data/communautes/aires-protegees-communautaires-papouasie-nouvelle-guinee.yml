reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la Papouasie-Nouvelle-Guinée à la Convention sur la diversité biologique (juin 2019) : l'aire de conservation communautaire y est rattachée à la catégorie V de l'UICN, les aires marines gérées localement et l'aire de conservation YUS y sont citées, ainsi que 22 aires marines gérées localement créées par des communautés entre 2016 et 2018 (120 km²)", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/pg-nr-06-en.pdf"}
