resume: >-
  Les Somali d'Éthiopie forment une « nation, nationalité et peuple » au sens de la Constitution fédérale de 1994, dans l'est du pays.
  Ils disposent d'un État régional, l'un des neuf États fondateurs de la fédération (art. 47), avec son conseil, son administration, ses tribunaux et le pouvoir d'adopter sa propre constitution.
  Comme les autres nations de la fédération, ils ont un droit constitutionnel à l'autodétermination, sécession comprise (art. 39).
  Les limites avec l'Oromia et l'État afar sont disputées : voir les fiches « Oromo (État régional d'Oromia) » et « Afar d'Éthiopie ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme relève de graves violations commises par la police et l'armée dans l'État régional somali, aussi appelé Ogaden (par. 16-17), et note la reconnaissance du droit des communautés ethniques à l'autodétermination au niveau de l'État régional (par. 26).", annee: 2011, source: "https://docs.un.org/en/CCPR/C/ETH/CO/1"}
base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 5, 34, 39, 40, 47, 50, 52, 61, 78 et 97", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 39(3) : droit de chaque nation, nationalité et peuple à l'autogouvernement et à ses propres institutions ; art. 47(1) : l'État somali est l'un des États membres de la fédération.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 50(5) : le conseil de l'État légifère sur les matières de sa compétence et adopte et modifie la constitution de l'État ; art. 52(1) et 52(2)(b) : les États exercent les pouvoirs non attribués à la fédération et adoptent leur constitution et leurs lois.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  justice_propre: {valeur: "reconnu", note: "Art. 50(2) et 50(7) : le pouvoir judiciaire de l'État appartient à ses tribunaux ; art. 78(3) : les États créent leurs cours suprême, hautes et de première instance ; art. 78(5) : les conseils des États peuvent créer ou reconnaître des tribunaux religieux et coutumiers ; art. 34(5) : le statut personnel et familial peut être jugé selon le droit religieux ou coutumier avec l'accord des parties.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  terres: {valeur: "partiel", note: "Art. 40(3) : la propriété de la terre et des ressources naturelles appartient exclusivement à l'État et aux peuples d'Éthiopie, propriété commune inaliénable ; art. 40(5) : droit des pasteurs à une terre gratuite pour le pâturage et à ne pas être déplacés ; art. 52(2)(d) : les États administrent la terre selon les lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales ; art. 97(8) et 97(10) : ils perçoivent des impôts et redevances sur l'exploitation minière et des redevances sur les forêts.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "partiel", note: "Art. 43(2) de la Constitution fédérale : les nationaux ont le droit d'être consultés sur les politiques et projets qui touchent leur communauté ; aucune obligation de consentement.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 5(3) de la Constitution fédérale : chaque État membre fixe par la loi sa langue de travail ; art. 39(2) : droit de parler, écrire et développer sa langue. Le portail du gouvernement éthiopien indique que le somali est la langue de travail de l'État régional.", source: "http://www.ethiopia.gov.et/somali-regional-state"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 52(2)(e) : les États lèvent les impôts sur les recettes qui leur sont réservées et établissent leur budget ; art. 97 : impôt sur le revenu des salariés de l'État et des entreprises privées, redevances d'usufruit foncier et autres impôts.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 39(3) : droit à une représentation équitable dans les gouvernements des États et fédéral ; art. 61(2) : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération, plus un par million d'habitants.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) : droit inconditionnel à l'autodétermination, y compris la sécession, par vote aux deux tiers du conseil législatif puis référendum organisé par l'État fédéral dans les trois ans. Jamais exercé.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "contestee", note: "Human Rights Watch documente de 2011 à début 2018, dans la prison dite « Jail Ogaden » à Jijiga, tortures, viols et décès imputés à la police spéciale régionale (Liyu) sous l'autorité du président régional ; en mars 2024, les poursuites contre cet ancien président sont abandonnées et il est libéré après plus de cinq ans de détention, sans avoir été jugé pour ces abus ; entre fin 2024 et début 2025, des affrontements entre communautés locales et milices régionales font des dizaines de victimes dans la zone de Dacawaley, et des journalistes sont détenus en 2025 par les autorités régionales. En octobre 2024, le Front national de libération de l'Ogaden (ONLF), signataire de l'accord de paix de 2018, suspend sa participation au dialogue national en reprochant au parti au pouvoir dans l'État somali d'en choisir seul les participants.", source: "https://www.hrw.org/world-report/2026/country-chapters/ethiopia"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale ; l'État somali figure parmi les neuf États membres (art. 47)."}
  - {annee: 2007, evenement: "Recensement national : 4 445 219 habitants dans l'État somali, dont 4 320 478 Somali."}
  - {annee: 2011, evenement: "Observations du Comité des droits de l'homme sur les violations dans l'État somali."}
  - {annee: 2018, evenement: "Rapport de Human Rights Watch sur la prison « Jail Ogaden » (juillet) ; accord de paix signé à Asmara entre le gouvernement fédéral et l'ONLF (octobre)."}
  - {annee: 2024, evenement: "Libération de l'ancien président régional, poursuites abandonnées (mars) ; l'ONLF suspend sa participation au dialogue national (octobre)."}
  - {annee: 2026, evenement: "Élections générales du 1er juin, fédérales et régionales, tenues dans l'État somali."}
