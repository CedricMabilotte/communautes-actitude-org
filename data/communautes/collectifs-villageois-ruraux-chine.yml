base_nationale:
  - {instrument: "Constitution de la République populaire de Chine (1982, révisée en 2018), art. 8, 9, 10 et 111", nature: "constitution", annee: 1982, source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2018-03/22/content_2052621.htm"}
  - {instrument: "Loi organique des comités de villageois (adoptée le 4 novembre 1998, révisée le 28 octobre 2010, modifiée le 29 décembre 2018)", nature: "loi_organique", annee: 1998, source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2019-01/07/content_2070268.htm"}
  - {instrument: "Loi sur les contrats de terres rurales (2002, modifiée en 2009 et 2018), art. 5, 13, 19, 21 et 28", nature: "loi", annee: 2002, source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2019-01/07/content_2070250.htm"}
  - {instrument: "Loi sur les organisations économiques collectives rurales (adoptée le 28 juin 2024, en vigueur le 1er mai 2025)", nature: "loi", annee: 2024, source: "http://www.npc.gov.cn/npc/c2/c30834/202406/t20240628_437883.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le comité de villageois est une organisation d'autogouvernement de base (art. 111 de la Constitution ; art. 2 de la loi organique révisée en 2010) ; ses membres sont élus directement par les villageois pour cinq ans et aucune organisation ne peut les désigner ni les remplacer (art. 11) ; l'organisation du Parti communiste au village exerce le « rôle de noyau dirigeant » (art. 4) et le gouvernement du canton guide le comité sans pouvoir intervenir dans les affaires relevant de l'autogouvernement (art. 5) ; l'organisation économique collective exerce ses fonctions « sous la direction » des organisations du Parti (art. 4 de la loi de 2024).", source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2019-01/07/content_2070268.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée des villageois adopte et modifie la charte d'autogouvernement (村民自治章程) et les règles du village (村规民约), déposées auprès du gouvernement du canton ; elles ne peuvent contredire la Constitution, les lois, les règlements ni « les politiques de l'État », et le gouvernement du canton ordonne la correction de celles qui les enfreignent (art. 27 de la loi organique) ; l'assemblée des membres de l'organisation économique collective adopte ses statuts, déposés auprès du canton et du service agricole du district (art. 20 et 26 de la loi de 2024).", source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2019-01/07/content_2070268.htm"}
  justice_propre: {valeur: "partiel", note: "Le comité de villageois règle les litiges civils par un comité de médiation populaire (art. 111 de la Constitution ; art. 2 et 7 de la loi organique) ; il s'agit de médiation, pas d'une juridiction ; les litiges internes à l'organisation économique collective vont à la médiation du gouvernement du canton ou du service agricole du district, à l'arbitrage des contrats fonciers ou au tribunal (art. 56 de la loi de 2024).", source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2019-01/07/content_2070268.htm"}
  terres: {valeur: "partiel", note: "Les terres rurales appartiennent aux collectifs, sauf celles que la loi attribue à l'État, et nul ne peut les vendre (art. 10 de la Constitution) ; l'organisation économique collective exerce la propriété au nom des membres et le bien collectif ne peut être divisé entre eux (art. 2 et 36 de la loi de 2024) ; les membres reçoivent des terres en contrat pour trente ans, prolongeables (art. 5 et 21 de la loi sur les contrats de terres rurales) ; l'État peut exproprier pour l'intérêt public (art. 10 de la Constitution).", source: "http://www.npc.gov.cn/npc/c2/c30834/202406/t20240628_437883.html"}
  ressources: {valeur: "partiel", note: "Les forêts, montagnes, prairies, terres en friche et estrans sont propriété de l'État sauf ceux que la loi attribue aux collectifs (art. 9 de la Constitution) ; l'organisation économique collective met en valeur et protège les terres cultivées, forestières et pastorales et attribue les contrats (art. 5 de la loi de 2024) ; les contrats de prairies durent trente à cinquante ans, ceux de forêts trente à soixante-dix ans (art. 21 de la loi sur les contrats de terres rurales).", source: "http://www.npc.gov.cn/npc/c2/c30834/202406/t20240628_437883.html"}
  consentement: {valeur: "partiel", note: "L'assemblée des villageois décide du plan de contrats fonciers, de l'usage des terrains à bâtir et de l'usage et de la répartition des indemnités d'expropriation (art. 24 de la loi organique) ; le plan de contrats fonciers exige l'accord des deux tiers des membres ou des représentants (art. 19 de la loi sur les contrats de terres rurales) ; aucun de ces textes ne soumet l'expropriation elle-même au consentement du collectif.", source: "http://www.npc.gov.cn/zgrdw/npc/xinwen/2019-01/07/content_2070268.htm"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'assemblée des villageois décide de l'usage des revenus de l'économie collective et des contributions en argent et en travail pour les équipements d'intérêt public (art. 24 et 37 de la loi organique) ; l'assemblée des membres de l'organisation économique collective approuve le budget annuel et le plan de répartition des revenus collectifs (art. 26 de la loi de 2024) ; aucun pouvoir fiscal.", source: "http://www.npc.gov.cn/npc/c2/c30834/202406/t20240628_437883.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "L'assemblée des membres confirme la qualité de membre de l'organisation économique collective (art. 12 et 26 de la loi de 2024), qui ouvre le droit de recevoir des terres en contrat, de demander un terrain à bâtir et de participer à la répartition des revenus collectifs et des indemnités d'expropriation (art. 13) ; la qualité de membre ne se perd pas pour cause d'études, de service militaire, d'emploi ou de commerce hors du village, de divorce, de veuvage ou d'exécution d'une peine (art. 18).", source: "http://www.npc.gov.cn/npc/c2/c30834/202406/t20240628_437883.html"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Commission du Congrès des États-Unis sur la Chine (CECC, rapport 2024, chapitre « Governance ») décrit la gestion par quadrillage (grid management), appliquée aux villages comme aux zones urbaines, comme un outil de contrôle social placé sous la direction du Parti. Le règlement du Parti communiste sur les organisations de base rurales (2019) prévoit que le secrétaire du Parti au village devient, « par les procédures légales », président du comité de villageois et responsable de l'organisation économique collective, et que les grandes décisions du village sont d'abord proposées par l'organisation du Parti (art. 19) ; la loi de 2024 soumet les décisions de l'assemblée des membres à l'examen préalable des organisations du Parti (art. 26). Aucune source indépendante chiffrée sur l'application de ces règles dans les villages n'a été trouvée.", source: "https://www.cecc.gov/sites/evo-subsites/cecc.house.gov/files/2024-12/2024-CH6-Governance.pdf"}
chronologie:
  - {annee: 1982, evenement: "La Constitution attribue aux collectifs la propriété des terres rurales (art. 10) et définit les comités de villageois comme organisations d'autogouvernement de base (art. 111)."}
  - {annee: 1998, evenement: "Le 4 novembre, le Comité permanent de l'Assemblée populaire nationale adopte la loi organique des comités de villageois."}
  - {annee: 2002, evenement: "Adoption de la loi sur les contrats de terres rurales (29 août)."}
  - {annee: 2010, evenement: "Révision de la loi organique des comités de villageois (28 octobre)."}
  - {annee: 2016, evenement: "Le troisième recensement agricole compte 596 450 villages administratifs, dont 556 264 comités de villageois, et 3,17 millions de villages naturels."}
  - {annee: 2018, evenement: "Le 29 décembre, modification de la loi organique (mandat de cinq ans) et de la loi sur les contrats de terres rurales (prolongation des contrats de terres cultivées de trente ans à leur échéance)."}
  - {annee: 2019, evenement: "Le règlement du Parti sur les organisations de base rurales prévoit le cumul des fonctions de secrétaire du Parti et de président du comité de villageois."}
  - {annee: 2024, evenement: "Le 28 juin, adoption de la loi sur les organisations économiques collectives rurales, qui leur confère une personnalité morale spéciale."}
  - {annee: 2025, evenement: "Entrée en vigueur de la loi sur les organisations économiques collectives rurales le 1er mai."}
