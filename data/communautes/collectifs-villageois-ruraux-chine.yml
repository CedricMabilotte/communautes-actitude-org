resume: >-
  Fiche agrégée : elle couvre les collectifs de villageois de la Chine rurale, à qui la Constitution de 1982 attribue la propriété des terres rurales (art. 10) et des comités de villageois élus, définis comme organisations d'autogouvernement de base (art. 111). La loi organique des comités de villageois (1998, révisée en 2010 et 2018) organise l'élection directe du comité, l'assemblée des villageois et l'adoption d'une charte d'autogouvernement et de règles du village. La loi sur les organisations économiques collectives rurales (adoptée le 28 juin 2024, en vigueur le 1er mai 2025) confie à ces organisations, au nom de leurs membres, l'exercice de la propriété collective de la terre, qui ne peut être divisée entre les membres. Les deux lois placent ces organes sous la direction du Parti communiste chinois et sous la supervision des gouvernements de canton. Le troisième recensement agricole compte 556 264 comités de villageois fin 2016.
