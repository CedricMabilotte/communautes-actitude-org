effectivite: {valeur: "non_etablie", note: "Selon une évaluation de RECOFTC et de l'Université nationale de Singapour (2022), plus de 7 000 forêts communautaires ont reçu un certificat depuis 1995, mais peu d'études disent combien fonctionnent ; dans quatre townships du delta de l'Ayeyarwady et de Yangon, environ 19 % des 73 forêts de mangrove certifiées étudiées sont inactives (groupes dissous, certificats retirés après le cyclone Nargis, conversion en terres agricoles). Aucune source consultée ne décrit l'application du régime depuis le coup d'État de février 2021.", source: "https://data.opendevelopmentmyanmar.net/en/dataset/b389b601-85f9-499e-8e0a-4c5494cbcc97/resource/79d5e493-a16f-48bb-b187-8cdd818ccf8b/download/6.9.22-report_cf-assessment_recoftc.pdf"}
chronologie:
  - {annee: 1995, evenement: "Premières Instructions sur la foresterie communautaire ; premières forêts communautaires dans le delta de l'Ayeyarwady."}
  - {annee: 2016, evenement: "Révision des Instructions en août : droits commerciaux sur le bois et les produits forestiers non ligneux."}
  - {annee: 2018, evenement: "Nouvelle loi forestière, qui abroge celle de 1992."}
  - {annee: 2019, evenement: "Instructions de 2019 (notification n° 69/2019, 8 mai) ; 5 426 groupes et 714 534 acres en décembre."}
  - {annee: 2021, evenement: "Coup d'État militaire du 1er février ; 7 010 groupes, 178 462 membres et 390 761 ha en novembre selon le Département des forêts."}
fiabilite:
  verifie:
    - "Paragraphes 2, 3, 7, 13 à 19, 22 à 33, 39, 42 à 45 et 48 des Instructions de 2019 (texte anglais publié avec le texte birman, préparé avec l'appui technique de la FAO)."
    - "Chiffres de décembre 2019 (5 426 groupes, 714 534 acres, 138 179 membres) et description du régime (usage du sol pendant trente ans, propriété et disposition des produits) dans Forestry in Myanmar 2019-2020 du Département des forêts."
    - "Objectif 15.1, date d'adoption de la loi de 2018 et chiffres de 2018 dans le sixième rapport national à la Convention sur la diversité biologique."
    - "Chiffres de novembre 2021 et état des forêts de mangrove certifiées dans l'évaluation RECOFTC-NUS de 2022."
  non_confirme:
    - "Le numéro de la notification de 2016 n'a pas été trouvé dans les sources ouvertes ; le Département des forêts date cette révision d'août 2016, RECOFTC indique qu'elle n'a été publiée officiellement qu'en 2019, après la loi de 2018."
    - "Le texte de la loi forestière de 2018 n'a pas été ouvert (dépôt MyLAFF accessible après connexion) ; les sections 7 (d), 12 (d) et 57 (b) sont citées d'après les Instructions de 2019."
    - "Les chiffres de 2021 viennent du Département des forêts, cités par RECOFTC ; la statistique officielle n'a pas été consultée directement. L'écart entre 714 534 acres (environ 289 000 ha) en 2019 et 390 761 ha en 2021 n'est pas expliqué."
    - "On ne sait pas si les « membres » comptés sont des personnes ou des ménages."
    - "Aucune liste officielle des forêts communautaires par site n'a été trouvée ; pas de tableau par site."
    - "Application du régime et délivrance de certificats depuis février 2021 : non établies."
