resume: >-
  Fiche agrégée : elle couvre les groupes d'usagers de forêt communautaire (Community Forest User Groups), formés de ménages qui vivent depuis cinq ans dans la forêt ou à moins de cinq miles de sa lisière. Le régime vient des Instructions sur la foresterie communautaire de 1995, révisées en 2016 puis en 2019 (notification n° 69/2019) au titre de la loi forestière de 2018. Le responsable forestier de district délivre au groupe un certificat de forêt communautaire, bail foncier de trente ans renouvelable par périodes de trente ans, après approbation de son plan de gestion ; le groupe récolte et vend les produits selon ce plan mais ne peut ni vendre ni hypothéquer la forêt. Le Département des forêts comptait 5 426 groupes et 714 534 acres en décembre 2019, puis 7 010 groupes, 178 462 membres et 390 761 ha en novembre 2021.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Myanmar à la Convention sur la diversité biologique (soumis le 27 décembre 2018) : objectif national 15.1 de placer plus de 130 000 ha de forêt sous foresterie communautaire d'ici 2020, présentation des Instructions de 1995 et de la loi forestière de 2018, et chiffres du Département des forêts pour 2018 (211 397 ha, 3 884 groupes d'usagers, 103 907 membres).", annee: 2018, source: "https://www.cbd.int/doc/world/mm/mm-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi forestière de 2018 (Forest Law, 1380 M.E.), section 7 (d) (forêts conservées par les communautés locales selon la tradition), section 12 (d) (permission de foresterie communautaire) et section 57 (b) (pouvoir réglementaire), citées par les Instructions de 2019", nature: "loi", annee: 2018, source: "https://data.opendevelopmentmyanmar.net/laws_record/mylaff-4462-1"}
  - {instrument: "Instructions sur la foresterie communautaire (Community Forestry Instructions), notification n° 69/2019 du ministère des Ressources naturelles et de la Conservation de l'environnement, 8 mai 2019", nature: "loi", annee: 2019, source: "https://data.opendevelopmentmyanmar.net/my/dataset/910fc697-d1f5-4075-9bd7-9161e5eb8157/resource/cc379796-fad3-4d35-b16e-f002f0367bd7/download/cfi-2019-mm-eng.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque groupe d'usagers élit à l'unanimité parmi ses membres un comité de gestion (président, secrétaire, trésorier et deux membres) et peut changer ce comité à la majorité (Instructions de 2019, para. 7 (a) et 23 (c)) ; le responsable forestier de district peut retirer le certificat avec l'accord du responsable forestier de l'État ou de la région, avec appel au directeur général dont la décision est définitive (para. 18 et 19) ; les responsables forestiers du township et du district inspectent la forêt et ses registres tous les trois mois (para. 45).", source: "https://data.opendevelopmentmyanmar.net/my/dataset/910fc697-d1f5-4075-9bd7-9161e5eb8157/resource/cc379796-fad3-4d35-b16e-f002f0367bd7/download/cfi-2019-mm-eng.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le groupe formule ses règles internes « sur la base des instructions du Département des forêts » et prépare le plan de gestion, que le responsable forestier de district confirme (Instructions de 2019, para. 15, 16 et 22 (h)).", source: "https://data.opendevelopmentmyanmar.net/my/dataset/910fc697-d1f5-4075-9bd7-9161e5eb8157/resource/cc379796-fad3-4d35-b16e-f002f0367bd7/download/cfi-2019-mm-eng.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Bail foncier (land lease, droit d'usage du sol) de trente ans, que le responsable forestier de district peut prolonger par périodes de trente ans, autant de fois qu'il le juge approprié, selon les résultats et le souhait du groupe (Instructions de 2019, para. 13 et 14) ; les membres transmettent à leurs héritiers légitimes leurs biens liés à la forêt communautaire et le groupe est exempté de redevance de bail pour les forêts établies sur des terres forestières (para. 23 (a) et (d)) ; la forêt ne peut être ni vendue, ni louée, ni hypothéquée, ni donnée (para. 39 (b)) et, en cas d'annulation, la terre retrouve son statut d'origine ou passe sous gestion du Département (para. 42 et 43).", source: "https://data.opendevelopmentmyanmar.net/my/dataset/910fc697-d1f5-4075-9bd7-9161e5eb8157/resource/cc379796-fad3-4d35-b16e-f002f0367bd7/download/cfi-2019-mm-eng.pdf"}
  ressources: {valeur: "partiel", note: "Le groupe récolte le bois et les autres produits selon le plan de gestion, sans permission pour l'usage personnel, agricole ou de pêche, avec permission préalable du Département pour la récolte commerciale (Instructions de 2019, para. 23 (g), 24 et 25) ; il vend librement aux prix du marché et peut transporter et vendre sur les marchés locaux et internationaux (para. 29 et 32) ; l'extraction de métaux, de pierres, de sable et de graviers est interdite (para. 39 (c)).", source: "https://data.opendevelopmentmyanmar.net/my/dataset/910fc697-d1f5-4075-9bd7-9161e5eb8157/resource/cc379796-fad3-4d35-b16e-f002f0367bd7/download/cfi-2019-mm-eng.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les produits récoltés pour l'usage personnel et les ventes dans le village sont exemptés de taxe, les ventes hors du village sont taxées (Instructions de 2019, para. 26 à 28) ; le groupe tient un fonds sur un compte bancaire et décide par consensus de sa répartition entre revenus des membres, développement communautaire, fonds renouvelable et réinvestissement (para. 31) ; il n'a pas de pouvoir fiscal.", source: "https://data.opendevelopmentmyanmar.net/my/dataset/910fc697-d1f5-4075-9bd7-9161e5eb8157/resource/cc379796-fad3-4d35-b16e-f002f0367bd7/download/cfi-2019-mm-eng.pdf"}
