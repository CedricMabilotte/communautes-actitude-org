resume: >-
  Fiche agrégée : elle couvre les communautés locales qui tiennent une forêt communautaire en Zambie. La loi forestière de 2015 (Forests Act, Act No. 4 of 2015, art. 29 à 35) et le règlement sur la gestion forestière communautaire (Statutory Instrument No. 11 of 2018) permettent à un groupe de gestion forestière communautaire, formé de citoyens résidant dans la zone depuis au moins deux ans et reconnu par le directeur des forêts avec l'accord du chef coutumier, d'obtenir l'usage exclusif d'une zone forestière (règl. 5, 6 et 9). Par l'accord de forêt communautaire conclu avec le département des forêts, le groupe reçoit des droits d'usage et de commerce des produits forestiers et le droit de délivrer des permis communautaires et d'en percevoir les recettes (règl. 11). Le registre en ligne du ministère compte 449 groupes, dont 297 au statut « Approved » et 98 au statut « Recognized ».
