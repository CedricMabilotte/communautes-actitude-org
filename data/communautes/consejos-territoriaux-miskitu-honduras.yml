reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Honduras partie à la Convention 169 de l'OIT depuis 1995 (A/HRC/33/42/Add.2, § 9).", annee: 1995, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {mecanisme: "dnudpa", detail: "Le Honduras a voté en faveur de la Déclaration de 2007 ; le recensement de 2001 compte les Miskitu parmi les peuples autochtones du pays (A/HRC/33/42/Add.2, § 6 et 9).", annee: 2007, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale sur sa visite au Honduras (novembre 2015) : titres accordés à 11 des 12 conseils territoriaux miskitu, occupation de terres titrées par des tiers (§ 37, 40 et 41).", annee: 2016, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
base_nationale:
  - {instrument: "Loi sur la propriété (Ley de Propiedad, décret 82-2004), titre V, chapitre III, art. 93 à 102", nature: "loi", annee: 2004, source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  - {instrument: "Loi sur les forêts, les aires protégées et la faune (décret 98-2007), art. 45", nature: "loi", annee: 2007, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {instrument: "Décret législatif 61-2013 (titrage des communautés miskitu et garifuna dans la réserve de biosphère du Río Plátano)", nature: "loi", annee: 2013, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les titres sont délivrés aux conseils territoriaux, constitués de plusieurs communautés selon leur propre organisation territoriale (A/HRC/33/42/Add.2, § 37, 2016) ; aucun texte consulté ne définit leurs compétences face à l'État et aux municipalités.", source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi sur la propriété de 2004 reconnaît les terres possédées traditionnellement (art. 93), les titre au nom de la collectivité (art. 94) les déclare inaliénables, insaisissables et imprescriptibles (art. 100) et interdit d'enregistrer un titre au profit de tiers (art. 102) ; l'art. 97 laisse toutefois aux tiers titrés qui occupent ces terres le droit de les garder, et l'art. 100 permet aux communautés de mettre fin au régime communal.", source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  ressources: {valeur: "partiel", note: "La loi forestière de 2007 (décret 98-2007, art. 45) reconnaît le droit des peuples autochtones et afrohonduriens sur les aires forestières de leurs terres traditionnelles (A/HRC/33/42/Add.2, § 10) ; la loi sur la propriété de 2004 impose une gestion conjointe avec l'État des aires protégées situées sur ces terres (art. 101) et réserve à l'État l'exploitation des ressources, après consultation (art. 95).", source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  consentement: {valeur: "partiel", note: "L'État doit informer et consulter ces peuples avant d'autoriser toute inspection ou exploitation de ressources sur leurs terres, et leur verser une indemnisation équitable pour les dommages subis (loi sur la propriété de 2004, art. 95) ; le texte ne prévoit pas de consentement.", source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
