  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Rapporteuse spéciale (2016) relève que des colons ont obtenu des titres et permis sur les terres de la communauté d'Auka (conseil Wamakklisinasta, titré en 2013), que ces terres ont été déboisées, et qu'un contrat d'exploration d'hydrocarbures signé en 2013 sur la côte de la Mosquitia l'a été sans consultation préalable ; une consultation avec les représentants miskitu n'a été ouverte qu'après leurs protestations (§ 40, 41 et 54).", source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
chronologie:
  - {annee: 1859, evenement: "Traité Cruz-Wyke : le Royaume-Uni reconnaît la souveraineté du Honduras sur la Mosquitia, avec garantie de la possession des terres par les peuples de la région."}
  - {annee: 1995, evenement: "Le Honduras ratifie la Convention 169 de l'OIT."}
  - {annee: 1998, evenement: "Organisation des conseils territoriaux miskitu au sein de MASTA."}
  - {annee: 2004, evenement: "Loi sur la propriété (décret 82-2004) : titrage collectif des terres autochtones et afrohonduriennes."}
  - {annee: 2012, evenement: "Premier titre intercommunautaire délivré à un conseil territorial miskitu par l'Institut national agraire."}
  - {annee: 2013, evenement: "Décret 61-2013 : titrage des terres miskitu situées dans la réserve de biosphère du Río Plátano."}
  - {annee: 2015, evenement: "En juin, l'Institut de conservation forestière délivre au conseil Bakinasta le premier titre situé dans la réserve du Río Plátano ; en novembre, visite de la Rapporteuse spéciale des Nations unies."}
  - {annee: 2016, evenement: "En avril, à Puerto Lempira, le président officialise la remise aux 12 conseils de 1,1 million d'ha par l'Institut national agraire et de 292 081 ha de terres forestières communautaires par l'Institut de conservation forestière ; accord de coopération entre cet institut et MASTA."}
fiabilite:
  verifie: ["Art. 93 à 102 de la loi sur la propriété (décret 82-2004) sur le texte publié par eRegulations Honduras.", "A/HRC/33/42/Add.2, § 6, 9, 10, 11, 34, 37, 40, 41 et 54 (version consultée sur documents.un.org).", "Tableau 1 de la note CONPAH-Forest Trends : 11 titres miskitu de 2012 à 2015, 1 097 182 ha (source INA 2015).", "Dépêche EFE publiée par La Prensa le 8 avril 2016, d'après un communiqué de la présidence : 12 conseils, 17 500 familles, 1,1 million d'ha de l'INA et 292 081 ha de l'ICF, « 1,4 million d'hectares » au titre."]
