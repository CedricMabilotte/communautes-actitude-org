resume: >-
  Fiche agrégée : elle couvre les douze conseils territoriaux (consejos territoriales, regroupements de communautés villageoises) du peuple miskitu, dans le département de Gracias a Dios. La loi sur la propriété de 2004 (décret 82-2004) prévoit le titrage collectif des terres traditionnelles des peuples autochtones et afrohonduriens et rend ces terres inaliénables. De 2012 à 2016, l'État a délivré à ces conseils des titres intercommunautaires (titres collectifs communs à plusieurs communautés) ; l'annonce officielle d'avril 2016 fait état d'environ 1,4 million d'hectares. Les conseils territoriaux, organisés depuis 1998, forment la structure de base de l'organisation Mosquitia Asla Takanka (MASTA).
