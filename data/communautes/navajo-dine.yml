resume: >-
  La Nation navajo est une nation autochtone reconnue par le gouvernement fédéral des États-Unis, sur une réserve établie par le traité de 1868 qui s'étend sur l'Arizona, le Nouveau-Mexique et l'Utah. Elle n'a pas adopté le régime de l'Indian Reorganization Act de 1934. Son Conseil légifère ; ses résolutions sont codifiées dans le Code de la Nation navajo en 26 titres. Un système judiciaire propre existe depuis 1959. La fiche « Nations tribales reconnues par l'État fédéral (États-Unis) » décrit le régime commun ; la Nation navajo y reste comptée.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis, qui avaient voté contre la Déclaration en 2007, ont déclaré leur appui le 16 décembre 2010 (Rapporteur spécial, A/HRC/21/47/Add.1, § 80).", annee: 2010, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission aux États-Unis (A/HRC/21/47/Add.1) : la Nation navajo a aidé à organiser la visite ; le rapport traite des San Francisco Peaks (§ 44) et de la contamination liée aux anciennes mines d'uranium sur la réserve navajo (annexe I).", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
base_nationale:
  - {instrument: "Liste fédérale des entités tribales reconnues (Federal Register, 30 janvier 2026, 575 entités) : « Navajo Nation, Arizona, New Mexico, & Utah »", nature: "loi", annee: 2026, source: "https://www.govinfo.gov/content/pkg/FR-2026-01-30/pdf/2026-01899.pdf"}
  - {instrument: "Traité de 1868 établissant la réserve navajo (tel qu'interprété dans Arizona c. Nation navajo, 2023)", nature: "traite", annee: 1868, source: "https://www.law.cornell.edu/supremecourt/text/21-1484"}
  - {instrument: "Kerr-McGee Corp. c. Navajo Tribe, 471 U.S. 195 (1985)", nature: "jurisprudence", annee: 1985, source: "https://www.law.cornell.edu/supremecourt/text/471/195"}
  - {instrument: "Décret présidentiel 13175 sur la consultation des gouvernements tribaux", nature: "loi", annee: 2000, source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  - {instrument: "Navajo Sovereignty in Education Act of 2005 (résolution CJY-37-05), titre 10 du Code de la Nation navajo", nature: "loi", annee: 2005, source: "https://www.nnols.org/wp-content/uploads/2022/05/5A-12.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Nation navajo figure sur la liste fédérale des 575 entités tribales reconnues publiée au Federal Register le 30 janvier 2026 ; l'État fédéral entretient avec ces entités des relations « de gouvernement à gouvernement » (Rapporteur spécial, 2012, § 3).", source: "https://www.govinfo.gov/content/pkg/FR-2026-01-30/pdf/2026-01899.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les résolutions du Conseil de la Nation navajo sont codifiées dans le Code de la Nation navajo (26 titres) ; par exemple, la Diné Natural Resources Protection Act de 2005 (18 N.N.C. § 1303) interdit l'extraction et le traitement de l'uranium en territoire navajo.", source: "https://www.nnols.org/navajo-nation-code/"}
  justice_propre: {valeur: "reconnu", note: "Système judiciaire créé en 1959, qui comprend des tribunaux de district, une Cour suprême et des services de médiation traditionnelle (peacemaking) ; ils appliquent le droit fondamental diné (Diné bi beenahaz'áanii), qui comprend le droit traditionnel et coutumier. La compétence pénale sur les non-Indiens est limitée à ceux qui ont noué des liens tribaux.", source: "https://courts.navajo-nsn.gov/publicguide.htm"}
  terres: {valeur: "partiel", note: "Réserve établie par le traité de 1868 ; la Cour suprême rappelle en 2023 que ce traité a réservé l'eau nécessaire à la réserve (Arizona c. Nation navajo). Les terres de réserve relèvent du régime fédéral de fiducie, non vérifié ici sur un texte.", source: "https://www.law.cornell.edu/supremecourt/text/21-1484"}
  ressources: {valeur: "partiel", note: "La Nation réglemente les ressources de son territoire (interdiction de l'uranium, 18 N.N.C. § 1303, 2005) ; la Cour suprême a jugé en 2023 que le traité de 1868 réserve l'eau nécessaire mais n'oblige pas l'État fédéral à prendre des mesures pour la garantir.", source: "https://www.law.cornell.edu/supremecourt/text/21-1484"}
  consentement: {valeur: "partiel", note: "Le décret présidentiel 13175 du 6 novembre 2000 impose une consultation « régulière et significative » des gouvernements tribaux sur les politiques fédérales qui les concernent ; il ne prévoit pas de consentement.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "partiel", note: "Aucun texte consulté ne fait du navajo une langue officielle. Le Code de la Nation navajo prévoit un enseignement en navajo à tous les niveaux dans toutes les écoles qui servent la Nation (10 N.N.C. § 111, 2005) et exige que le président et le vice-président parlent couramment le navajo (11 N.N.C. § 8).", source: "https://www.nnols.org/wp-content/uploads/2022/05/5A-12.pdf"}
  education: {valeur: "partiel", note: "La Navajo Sovereignty in Education Act de 2005 (10 N.N.C. § 1) affirme le pouvoir de la Nation de fixer les lois et politiques applicables à toutes les écoles qui la servent, tout en reconnaissant l'autorité des écoles fédérales, des États, à charte ou privées ; un conseil de l'éducation de la Nation navajo (11 membres) supervise ces écoles, directement ou par accords intergouvernementaux (10 N.N.C. § 106).", source: "https://www.nnols.org/wp-content/uploads/2022/05/5A-12.pdf"}
  fiscalite: {valeur: "reconnu", note: "La Cour suprême juge en 1985 que les impôts de la Nation navajo contestés par l'entreprise requérante n'avaient pas à être approuvés par le secrétaire à l'Intérieur, la Nation n'ayant pas adopté l'Indian Reorganization Act (Kerr-McGee c. Navajo Tribe).", source: "https://www.law.cornell.edu/supremecourt/text/471/195"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Pour l'essentiel, chaque nation ou village autochtone reconnu par l'État fédéral détermine lui-même ses membres (Rapporteur spécial, A/HRC/21/47/Add.1, § 3, 2012).", source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial (2012) relève la contamination liée aux anciennes mines d'uranium sur la réserve et les limites posées par les tribunaux fédéraux aux pouvoirs des autorités tribales sur les non-autochtones (§ 52-53). En 2023, la Cour suprême écarte l'obligation fédérale de garantir l'eau de la réserve ; le projet de loi de ratification de l'accord sur les droits d'eau du nord-est de l'Arizona (Northeastern Arizona Indian Water Rights Settlement Act, H.R. 2025 et S. 953), déposé le 11 mars 2025, n'était pas adopté à la date de consultation. Le 5 août 2026, un tribunal de district navajo a interdit au Conseil d'adopter la résolution qui visait à destituer le président et la vice-présidente de la Nation (Navajo Times).", source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
chronologie:
  - {annee: 1868, evenement: "Traité établissant la réserve navajo."}
  - {annee: 1959, evenement: "Création du système judiciaire de la Nation navajo."}
  - {annee: 1985, evenement: "Arrêt Kerr-McGee : pouvoir fiscal de la Nation sans approbation fédérale."}
  - {annee: 2005, evenement: "Diné Natural Resources Protection Act (19 avril) : interdiction de l'extraction de l'uranium."}
  - {annee: 2005, evenement: "Navajo Sovereignty in Education Act (19 juillet) : refonte du titre 10 du Code sur l'éducation."}
  - {annee: 2023, evenement: "Arrêt Arizona c. Nation navajo sur les droits d'eau."}
  - {annee: 2025, evenement: "Dépôt au Congrès (11 mars) du projet de loi ratifiant l'accord sur les droits d'eau des nations navajo et hopi et des Païutes du Sud de San Juan."}
  - {annee: 2026, evenement: "Liste fédérale du 30 janvier (575 entités) ; le 5 août, un tribunal de district navajo bloque la procédure de destitution du président engagée par le Conseil."}
