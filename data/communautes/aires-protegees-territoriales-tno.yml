uid: "aires-protegees-territoriales-tno"
nom: "Aires protégées territoriales à gestion autochtone des Territoires du Nord-Ouest"
endonyme: ""
territoire: "Aires protégées territoriales créées en vertu de la Loi sur les aires protégées des Territoires du Nord-Ouest : Thaıdene Nëné (bras est du Grand lac des Esclaves, Tu Nedhé) et Ts'udé Nilįné Tuyeta (district K'ásho Got'ı̨nę, région désignée du Sahtu)"
