villages: {valeur: 4, annee: 2025, perimetre: "collectivités où siègent les Premières Nations parties aux ententes de création (Łutsël K'é, Fort Resolution, Fort Good Hope, Colville Lake), situées hors des deux aires ; aucune localité habitée à l'intérieur des aires n'est mentionnée par le GTNO ; sièges de Deninu Kųę́ à Fort Resolution et de Behdzi Ahda\" à Colville Lake selon les adresses des ententes de création", source: "https://www.gov.nt.ca/ecc/en/services/conservation-network-planning/tsude-niline-tuyeta"}
resume: >-
  Fiche agrégée : elle couvre les gouvernements et organisations autochtones parties aux ententes de création des aires protégées territoriales des Territoires du Nord-Ouest (T.N.-O.). La Loi sur les aires protégées (LTN-O 2019, ch. 11), en vigueur depuis le 20 juin 2019, permet à un gouvernement ou une organisation autochtone de proposer une aire (art. 10(3)) et impose au ministre de conclure une « entente de création » (accord fixant la gestion de l'aire) avec les gouvernements ou organisations autochtones identifiés avant de créer l'aire, sauf si aucun d'eux n'adhère à l'entente ou si le Conseil exécutif constate entre eux des différences insurmontables (art. 14 et 15). Un conseil de gestion peut être chargé de la gestion de l'aire (art. 21). Deux aires ont été créées en 2019 : Thaıdene Nëné, avec la Première Nation dénée de Łutsël K'é et d'autres parties, et Ts'udé Nilįné Tuyeta, avec les K'ásho Got'ı̨nę de Fort Good Hope ; Dınàgà Wek'èhodì reste au stade d'aire proposée.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Stratégie pour la nature 2030 du Canada, déposée auprès de la Convention sur la diversité biologique : elle cite « l'aire protégée autochtone et territoriale Ts'udé Nilįné Tuyeta » et « l'aire protégée autochtone Thaidene Nëné » parmi les aires protégées et de conservation autochtones, « où les gouvernements autochtones jouent le rôle principal ».", annee: 2024, source: "https://www.cbd.int/doc/world/ca/ca-nbsap-v3-fr.pdf"}
base_nationale:
  - {instrument: "Loi sur les aires protégées (LTN-O 2019, ch. 11), art. 2 (objet), 3 (droits ancestraux ou issus de traités), 10 (mise en nomination), 14 et 15 (ententes de création), 21 (conseils de gestion), 26 (réduction ou désinscription), 27 (exercice des droits ancestraux)", nature: "loi", annee: 2019, source: "https://www.justice.gov.nt.ca/en/files/legislation/protected-areas/protected-areas.a.pdf"}
  - {instrument: "Règlement concernant l'aire protégée territoriale Ts'udé Nilįné Tuyeta (R-006-2022), art. 4 à 15", nature: "loi", annee: 2022, source: "https://www.gov.nt.ca/ecc/sites/ecc/files/protected-areas.r4.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Loi de 2019 permet d'établir pour chaque aire un conseil de gestion chargé de sa gestion (art. 21). À Ts'udé Nilįné Tuyeta, le conseil compte sept membres, dont quatre nommés par K'ásho Got'iné, deux par le ministre et un président nommé conjointement (règlement R-006-2022, art. 5) ; il fait des recommandations aux parties (art. 12) et ses membres ne représentent pas la partie qui les a nommés (art. 10). Sous réserve de l'entente de création et des règlements, le ministre reste chargé de l'administration, de la gestion et de l'exploitation de l'aire (Loi, art. 19).", source: "https://www.gov.nt.ca/ecc/sites/ecc/files/protected-areas.r4.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Une activité interdite ne porte pas atteinte à l'exercice des droits ancestraux ou issus de traités (droits des peuples autochtones protégés par l'article 35 de la Loi constitutionnelle de 1982), et leur titulaire n'a besoin d'aucun permis pour les exercer dans l'aire (Loi, art. 27 ; règlement R-006-2022, art. 2). À Ts'udé Nilįné Tuyeta, les résidents du district K'ásho Got'ı̨nę récoltent le bois sans permis (règlement, art. 17(3)) ; le conseil de gestion recommande l'octroi ou le refus des permis d'aire protégée, et un désaccord entre les parties passe par un processus de règlement des différends (art. 25 à 31) ; si la partie qui l'a engagé y met fin, le ministre applique la recommandation finale du conseil (art. 30(4)). Le ministre délivre les permis (art. 20 à 23).", source: "https://www.gov.nt.ca/ecc/sites/ecc/files/protected-areas.r4.pdf"}
  consentement: {valeur: "partiel", note: "Avant la création d'une aire, le ministre conclut une entente de création avec les gouvernements ou organisations autochtones identifiés (art. 14(1)) ; l'aire peut être créée sans entente si aucun d'eux n'adhère à l'entente, ou si le Conseil exécutif constate entre eux des différences insurmontables après que le ministre a fait de son mieux pour conclure les ententes ; le gouvernement territorial s'acquitte alors de son obligation de consulter avant la création (art. 15(1) à (3)). La réduction ou la désinscription d'une aire n'est possible qu'avec l'accord de tous les gouvernements et organisations autochtones parties à l'entente (art. 26(2)a)), ou si des terres y sont sélectionnées au titre d'un accord sur les terres, ou si un tribunal y reconnaît un titre ancestral (art. 26(2)b) et c)).", source: "https://www.justice.gov.nt.ca/en/files/legislation/protected-areas/protected-areas.a.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le rapport de 2025 du vérificateur général du Canada à l'Assemblée législative des T.N.-O. indique que les premiers plans de gestion de Ts'udé Nilįné Tuyeta et de Thaıdene Nëné n'étaient pas achevés et que le règlement complet de Thaıdene Nëné n'était que partiellement avancé. Le rapport de 2024 sur l'état du réseau de conservation précise que le règlement de 2019 de Thaıdene Nëné ne reprend pas encore les dispositions détaillées des ententes de création ; le conseil de gestion de Ts'udé Nilįné Tuyeta siège depuis 2020 et le conseil Thaıdene Nëné Xá Dá Yáłtı depuis 2021. Le registre des aires protégées publie en septembre 2026 le premier plan de gestion de Thaıdene Nëné (Thaıdene Nëné Badı Xá).", source: "https://www.canada.ca/fr/verificateur-general/notre-travail/rapports-daudit/nwt-202505-f.html"}
chronologie:
  - {annee: 2000, evenement: "Le groupe de travail conjoint du Sahtu sur les lieux et sites patrimoniaux recommande la protection de Ts'udé Nilįné Tuyeta (rapport Rakekée Go'ié Godi)."}
  - {annee: 2019, evenement: "Entrée en vigueur de la Loi sur les aires protégées (20 juin)."}
  - {annee: 2019, evenement: "Création de l'aire protégée territoriale Thaıdene Nëné, dans l'aire protégée autochtone désignée par la Première Nation dénée de Łutsël K'é selon le droit déné."}
  - {annee: 2019, evenement: "Création de l'aire protégée territoriale Ts'udé Nilįné Tuyeta (septembre), désignée aussi aire protégée autochtone selon le droit K'ásho Got'ı̨nę ; Dınàgà Wek'èhodì devient aire protégée proposée."}
  - {annee: 2020, evenement: "Formation du conseil de gestion de Ts'udé Nilįné Tuyeta."}
  - {annee: 2022, evenement: "Entrée en vigueur du règlement R-006-2022 (31 janvier), qui crée formellement l'aire protégée territoriale Ts'udé Nilįné Tuyeta au titre de l'article 17 de la Loi et désigne son conseil de gestion."}
  - {annee: 2025, evenement: "Rapport du vérificateur général du Canada sur les aires protégées et de conservation des T.N.-O. (mai)."}
  - {annee: 2026, evenement: "Publication au registre du premier plan de gestion de Thaıdene Nëné (Thaıdene Nëné Badı Xá)."}
fiabilite:
  verifie: ["Art. 2, 3, 10(3), 14, 15, 19, 21, 26(2) et 27 de la Loi sur les aires protégées (codification bilingue du ministère de la Justice des T.N.-O., en vigueur le 20 juin 2019, modifiée en 2020).", "Clauses 3.3.2, 4.1.3, 4.1.10, 4.1.11, 4.2.1, 4.3.1, 11.1, 11.2 et 11.4 de l'entente de création entre la Première Nation dénée de Łutsël K'é et le GTNO.", "Art. 4, 5, 10, 12 et 13 du règlement R-006-2022 (Ts'udé Nilįné Tuyeta), en vigueur le 31 janvier 2022.", "Deux aires protégées territoriales établies, 10 100 km² pour Ts'udé Nilįné Tuyeta, 790 km² pour Dınàgà Wek'èhodì encore proposée (rapport 2024 sur l'état du réseau de conservation, déposé en février 2025).", "Environ 9 105 km² pour l'aire protégée territoriale Thaıdene Nëné et liste des ententes de création signées avec Łutsël K'é, la Nation métisse des Territoires du Nord-Ouest et Deninu Kųę́ (page Thaıdene Nëné du GTNO).", "Citation des deux aires dans la Stratégie pour la nature 2030 du Canada (document CBD, 2024, p. 18 du PDF en français).", "Constats du vérificateur général du Canada (2025) sur les plans de gestion et le règlement de Thaıdene Nëné.", "Estimations au 1er juillet 2025 du Bureau de la statistique des T.N.-O. : Łutselk'e 315, Fort Resolution 523, Fort Good Hope 584, Colville Lake 154.", "Siège de la Première Nation Deninu Kųę́ à Fort Resolution (adresse de notification de l'entente de création Thaıdene Nëné avec Deninu Kųę́) ; siège de la Première Nation Behdzi Ahda\" à Colville Lake (entente de création de Ts'udé Nilįné Tuyeta, page de titre et liste des adresses)."]
  non_confirme: ["Le site de la Première Nation dénée de Łutsël K'é donne 8 906 km² pour l'aire protégée territoriale Thaıdene Nëné, contre environ 9 105 km² pour le GTNO ; la surface totale retient le chiffre du GTNO.", "Les chapitres 4 (conseil Thaıdene Nëné Xá Dá Yáłtı, examen des demandes d'utilisation des terres et des corridors, clause 4.1.3) et 7 de l'entente Thaidene Nëné ne s'appliquent qu'après l'adoption d'un règlement complet (clause 11.1) ; d'ici là, le GTNO doit rechercher l'accord de la Première Nation dénée de Łutsël K'é avant de délivrer certains permis (clauses 11.5 et 11.6). L'adoption du règlement complet après mai 2025 n'a pas été vérifiée.", "Les lignes directrices adoptées par le conseil Thaıdene Nëné Xá Dá Yáłtı (clause 4.1.3 b)) n'ont pas été examinées ; pouvoir normatif laissé « non établi ».", "Statut de Dınàgà Wek'èhodì : toujours aire proposée selon le GTNO à la date de consultation ; non inscrite au tableau.", "Population : le chiffre retenu compte tous les habitants des quatre collectivités, membres ou non des Premières Nations signataires ; le nombre de membres de chaque Première Nation n'a pas été trouvé.", "Le GTNO date la création de Ts'udé Nilįné Tuyeta de septembre 2019 ; le règlement R-006-2022 la crée au titre de l'article 17 de la Loi en 2022."]
