population: {valeur: 1576, annee: 2025, perimetre: "population totale (toutes origines) au 1er juillet 2025 des quatre collectivités où siègent les Premières Nations parties aux ententes de création : Łutsël K'é 315 (Thaıdene Nëné), Fort Resolution 523 (Deninu Kųę́, Thaıdene Nëné), Fort Good Hope 584 et Colville Lake 154 (Fondation K'ahsho Got'ine, Ts'udé Nilįné Tuyeta) ; les membres de la Nation métisse des Territoires du Nord-Ouest qui résident ailleurs ne sont pas comptés", source: "https://www.statsnwt.ca/population/population-estimates/bycommunity.php"}
