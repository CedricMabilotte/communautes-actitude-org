resume: >-
  Les commoners de Dartmoor (titulaires de droits d'usage, surtout de pâturage, sur les terres communes) élisent la majorité du Conseil des commoners de Dartmoor, institué par une loi locale du Parlement, le Dartmoor Commons Act du 30 octobre 1985. Le Conseil compte 26 à 28 membres, dont 20 commoners élus par quartier (nord, sud, est, ouest) ; les autres sièges reviennent à 2 membres nommés par l'autorité du parc national, 1 représentant du duché de Cornouailles, 2 représentants des propriétaires nommés par l'autorité du parc, 1 vétérinaire désigné par les autres membres et jusqu'à 2 membres cooptés. Il édicte des règlements sur le pâturage, le marquage, la santé du bétail et le brûlage de la lande, confirmés par le ministre, tient le registre des commoners et lève une contribution sur eux. Les terres communes couvrent près de 36 000 ha, environ 37 % du parc national de Dartmoor.
