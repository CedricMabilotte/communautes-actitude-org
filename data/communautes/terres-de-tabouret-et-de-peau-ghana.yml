resume: >-
  Fiche agrégée : elle couvre le régime des terres de tabouret et de peau du Ghana et les chefferies qui les détiennent. Le « tabouret » (stool) au sud et la « peau » (skin) au nord désignent la charge du chef, qui est « intronisé sur le tabouret ou sur la peau » selon le droit coutumier (Constitution de 1992, art. 277). La Constitution dévolue les terres de tabouret au tabouret « au nom et en fiducie pour les sujets du tabouret » (art. 267 (1)), interdit d'y créer une pleine propriété (freehold, art. 267 (5)) et fixe la part des revenus fonciers versée au tabouret et à l'autorité traditionnelle (art. 267 (6)) ; son chapitre 22 garantit la chefferie et ses conseils traditionnels, et institue une Maison nationale et des maisons régionales des chefs. La loi de 2008 sur la chefferie (Act 759) organise ces institutions et leurs comités judiciaires ; la loi foncière de 2020 (Act 1036) impose à chaque tabouret, peau, clan ou famille propriétaire de créer un secrétariat foncier coutumier.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination à l'égard des femmes sur les sixième et septième rapports du Ghana (CEDAW/C/GHA/CO/6-7), § 30, 40 et 41 (h) : le Comité note la participation des reines mères aux conseils traditionnels et aux maisons des chefs, s'inquiète de ce que la Maison nationale des chefs n'ait pas encore agi pour codifier le droit coutumier et éliminer les coutumes « dépassées et socialement néfastes » comme le prévoit l'article 272 (b) et (c) de la Constitution, et demande à l'État de l'y aider.", annee: 2014, source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/GHA/CO/6-7&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République du Ghana de 1992 (révisée en 1996), art. 11 (2) et (3), 36 (8), 89 (2) (b), 106 (3), 267 et chapitre 22 (art. 270 à 277)", nature: "constitution", annee: 1992, source: "https://www.constituteproject.org/constitution/Ghana_1996.pdf?lang=en"}
  - {instrument: "Chieftaincy Act 2008 (Act 759), sanctionnée le 16 juin 2008", nature: "loi", annee: 2008, source: "https://faolex.fao.org/docs/pdf/gha83760.pdf"}
  - {instrument: "Land Act 2020 (Act 1036), sanctionnée le 23 décembre 2020, s. 2 à 5, 9 et 13 à 18", nature: "loi", annee: 2020, source: "https://faolex.fao.org/docs/pdf/gha208918.pdf"}
  - {instrument: "Droit coutumier, défini comme « les règles de droit qui, par la coutume, s'appliquent à des communautés particulières du Ghana » et inclus dans la common law du Ghana (Constitution, art. 11 (2) et (3))", nature: "coutume_reconnue", annee: 1992, source: "https://www.constituteproject.org/constitution/Ghana_1996.pdf?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution garantit « l'institution de la chefferie, avec ses conseils traditionnels tels qu'établis par le droit et l'usage coutumiers » et interdit au Parlement d'adopter une loi qui donnerait à une personne ou à une autorité le droit d'accorder ou de retirer la reconnaissance d'un chef (art. 270 (1) et (2)) ; le chef est la personne désignée et intronisée selon le droit coutumier (art. 277). La loi de 2008 institue un conseil traditionnel dans chaque aire traditionnelle (s. 12), des maisons régionales des chefs et une Maison nationale des chefs dont les membres sont des chefs suprêmes (paramount chiefs) élus par les maisons régionales (s. 1 et 6 ; Constitution, art. 271 et 274).", source: "https://www.constituteproject.org/constitution/Ghana_1996.pdf?lang=en"}
  pouvoir_normatif: {valeur: "partiel", note: "Les règles du droit coutumier font partie de la common law du Ghana (Constitution, art. 11 (2) et (3)). La Maison nationale des chefs étudie, interprète et codifie le droit coutumier et compile les règles de succession de chaque tabouret ou peau (art. 272 (b)) ; une maison régionale peut rédiger une déclaration ou une modification d'une règle coutumière, mais celle-ci ne prend effet que par un instrument législatif du ministre, sur demande de la Maison nationale et après consultation du procureur général (loi de 2008, s. 51 et 52).", source: "https://faolex.fao.org/docs/pdf/gha83760.pdf"}
  justice_propre: {valeur: "partiel", note: "Le comité judiciaire de chaque conseil traditionnel a une compétence exclusive pour les affaires de chefferie nées dans son aire, sauf celles où l'Asantehene ou un chef suprême est partie (loi de 2008, s. 29), avec appel devant le comité judiciaire de la maison régionale, puis de la Maison nationale, puis la Cour suprême (Constitution, art. 273 et 274 ; loi de 2008, s. 22 à 28). La loi garantit le pouvoir du chef d'agir comme arbitre coutumier lorsque les parties y consentent (s. 30). Ces juridictions ne connaissent que des affaires de chefferie.", source: "https://faolex.fao.org/docs/pdf/gha83760.pdf"}
  terres: {valeur: "reconnu", note: "Les terres de tabouret sont dévolues au tabouret « au nom et en fiducie pour les sujets du tabouret, selon le droit et l'usage coutumiers » (Constitution, art. 267 (1)), et aucune pleine propriété (freehold) ne peut y être créée (art. 267 (5)). La loi de 2020 étend la même règle aux terres de peau, de clan et de famille (s. 9 (1) et (2)), range le tabouret ou la peau, avec l'État, le clan, la famille et le particulier, parmi les détenteurs possibles du titre allodial, « l'intérêt le plus élevé ou ultime sur la terre » (s. 2), et maintient le droit d'usufruit des sujets sur les parties vacantes (s. 9 (3)). Toute cession ou mise en valeur exige que la commission foncière régionale certifie sa conformité au plan d'aménagement de la zone (Constitution, art. 267 (3)).", source: "https://faolex.fao.org/docs/pdf/gha208918.pdf"}
  ressources: {valeur: "partiel", note: "Les rentes, droits et redevances (royalties) issus des terres de tabouret sont versés à un compte foncier propre à chaque tabouret, tenu par l'Office de l'administrateur des terres de tabouret (Constitution, art. 267 (2) (a)). Les minerais à l'état naturel appartiennent à la République et sont dévolus au président (art. 257 (6)) ; l'octroi d'une concession d'exploitation de minerais, d'eau ou d'autres ressources naturelles est soumis à la ratification du Parlement (art. 268) et à des commissions de l'État (art. 269).", source: "https://www.constituteproject.org/constitution/Ghana_1996.pdf?lang=en"}
  consentement: {valeur: "partiel", note: "L'administrateur des terres de tabouret et la commission foncière régionale consultent les tabourets et les autres autorités traditionnelles « sur toutes les questions relatives à l'administration et à la mise en valeur des terres de tabouret » (Constitution, art. 267 (7)). Une opération qui aliène ou engage un bien du tabouret est annulable sans le consentement du conseil traditionnel (loi de 2008, s. 45), et un projet de loi touchant à la chefferie ne peut être déposé sans saisine préalable de la Maison nationale des chefs (Constitution, art. 106 (3)).", source: "https://www.constituteproject.org/constitution/Ghana_1996.pdf?lang=en"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Après une retenue de 10 % pour frais d'administration, les revenus des terres de tabouret sont répartis à raison de 25 % au tabouret par l'intermédiaire de l'autorité traditionnelle, 20 % à l'autorité traditionnelle et 55 % à l'assemblée de district (Constitution, art. 267 (6)) ; l'Office de l'administrateur envoie chaque année à chaque tabouret ou peau un relevé de son compte (loi de 2008, s. 74). Un secrétariat foncier coutumier peut percevoir des frais pour ses services (loi de 2020, s. 17).", source: "https://lawsghana.com/constitution/Republic/constitution_content/272"}
  representation: {valeur: "partiel", note: "Le président de la Maison nationale des chefs siège au Conseil d'État, organe consultatif du président de la République (Constitution, art. 89 (2) (b)). Un chef ne peut pas se présenter au Parlement sans abdiquer (art. 94 (3) (c) et 276 (1)).", source: "https://www.constituteproject.org/constitution/Ghana_1996.pdf?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le rapport d'achèvement du deuxième projet d'administration foncière de la Banque mondiale (2020) indique qu'environ 80 % des terres du Ghana sont détenues sous régime coutumier, que 88 secrétariats fonciers coutumiers étaient établis et avaient enregistré les droits de 36 178 bénéficiaires, mais qu'ils couvrent « une petite partie du pays ». Le Comité pour l'élimination de la discrimination à l'égard des femmes (CEDAW/C/GHA/CO/6-7, 2014, § 40) s'inquiète de ce que la Maison nationale des chefs n'ait pas encore agi pour codifier le droit coutumier.", source: "https://documents.worldbank.org/curated/en/359771593704416028/pdf/Ghana-Second-Land-Administration-Project.pdf"}
chronologie:
  - {annee: 1969, evenement: "À compter du 22 août, l'acquisition d'une pleine propriété de common law sur les terres de tabouret et de peau est proscrite, ainsi que l'acquisition d'une pleine propriété coutumière par un non-citoyen (rappel dans la loi foncière de 2020, s. 3 (2) et 4 (2))."}
  - {annee: 1992, evenement: "La Constitution dévolue les terres de tabouret aux tabourets en fiducie pour leurs sujets (art. 267) et garantit la chefferie (chapitre 22)."}
  - {annee: 2008, evenement: "Sanction, le 16 juin, de la loi sur la chefferie (Act 759), qui remplace la loi de 1971 (Act 370)."}
  - {annee: 2014, evenement: "Le Comité pour l'élimination de la discrimination à l'égard des femmes demande à l'État d'aider la Maison nationale des chefs à codifier le droit coutumier."}
  - {annee: 2020, evenement: "La Banque mondiale recense 88 secrétariats fonciers coutumiers établis avec l'appui des deux projets d'administration foncière."}
  - {annee: 2020, evenement: "Sanction, le 23 décembre, de la loi foncière (Act 1036), qui impose la création de secrétariats fonciers coutumiers (s. 14)."}
fiabilite:
  verifie: ["Constitution de 1992 révisée en 1996, art. 11, 36 (8), 89, 94 (3) (c), 106 (3), 257 (6), 267 à 269 et 270 à 277 (Constitute Project) ; article 267 aussi lu sur lawsghana.com.", "Loi de 2008 sur la chefferie (Act 759), s. 1, 6, 12, 22 à 30, 44 à 52, 73 et 74, et date de sanction (FAOLEX).", "Loi foncière de 2020 (Act 1036), s. 1 à 10 et 13 à 18, et date de sanction (FAOLEX).", "CEDAW/C/GHA/CO/6-7 (14 novembre 2014), § 30, 40 et 41 (h).", "Nombre de 88 secrétariats fonciers coutumiers, 36 178 bénéficiaires et part d'environ 80 % des terres sous régime coutumier (rapport d'achèvement de la Banque mondiale, rapport n° ICR00005225, 2020)."]
  non_confirme: ["Liste officielle des tabourets, peaux, aires traditionnelles ou secrétariats fonciers coutumiers avec région et surface : non trouvée, d'où l'absence de tableau des sites. La loi de 2020 prévoit un registre public des secrétariats par district (s. 15 (4)), non consulté ; les sites de l'Office de l'administrateur des terres de tabouret et de la Maison nationale des chefs n'ont pas répondu.", "Nombre d'aires traditionnelles, de chefs suprêmes et de secrétariats fonciers coutumiers après 2020 ; population et surface des terres coutumières en km² : aucune source ouverte.", "Partage des redevances minières avec les tabourets par la loi sur les minerais et les mines : non vérifié.", "Le régime vise des communautés définies par l'allégeance à un tabouret ou à une peau, sans désignation ethnique dans les textes ; la Constitution vise les terres de tabouret à l'article 267 (1) et les terres de tabouret et de peau dans l'intitulé de la partie IV, la loi de 2020 vise expressément les deux."]
