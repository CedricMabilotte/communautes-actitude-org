uid: "territoires-communautaires-chasse-cameroun"
nom: "Zones de chasse communautaires du Cameroun"
endonyme: ""
territoire: "Zones d'intérêt cynégétique à gestion communautaire (ZICGC) et territoires communautaires de chasse, surtout dans le département de la Boumba-et-Ngoko (région de l'Est), ainsi que dans les régions du Centre, du Sud, de l'Adamaoua et du Nord"
etats: ["Cameroun"]
region: "afrique"
coord: [2.8, 15.1]
type: "communaute_locale"
base: "territoriale"
types_secondaires: []
population: {valeur: null, annee: null, perimetre: "", source: ""}
lieux: {valeur: 24, unite: "zones de chasse à gestion communautaire enregistrées dans la couche « Zones d'intérêt cynégétique » de l'atlas forestier du ministère des Forêts et de la Faune (MINFOF), hors zone cogérée de Buffle Noir ; 14 dans la région de l'Est, 4 dans le Centre, 4 dans le Nord, 1 dans le Sud et 1 dans l'Adamaoua", annee: 2022, source: "https://gis.forest-atlas.org/server/rest/services/cmr/open_data_fr/MapServer/126"}
surface_km2: {valeur: 14533.76, annee: 2022, perimetre: "somme des superficies administratives des 24 zones de chasse à gestion communautaire de la couche MINFOF (1 453 376 ha) ; les territoires communautaires de chasse et les aires protégées communautaires ne sont pas comptés", source: "https://gis.forest-atlas.org/server/rest/services/cmr/open_data_fr/MapServer/126"}
villages: {valeur: 131, annee: 2015, perimetre: "localités de la couche « Lieux habités » de l'atlas forestier du MINFOF (données saisies en 2015) situées à l'intérieur des polygones des 24 zones de chasse à gestion communautaire, par croisement avec la couche « Zones d'intérêt cynégétique » : 130 villages et 1 chef-lieu d'arrondissement ; la couche, numérisée au 1:200 000 à partir des cartes de l'Institut national de cartographie, n'est pas exhaustive selon sa description ; les villages riverains situés hors des limites des zones ne sont pas comptés", source: "https://gis.forest-atlas.org/server/rest/services/cmr/open_data_fr/MapServer/146"}
resume: >-
  Le droit camerounais confie à des communautés riveraines (villages situés à proximité d'une forêt) la gestion d'espaces de chasse sous trois formes. Le territoire communautaire de chasse, défini par le décret n° 95/466/PM du 20 juillet 1995, est un espace du domaine forestier non permanent de 5 000 ha au plus, géré par convention avec l'administration de la faune. La zone d'intérêt cynégétique à gestion communautaire (ZICGC, zone de chasse sportive confiée à la communauté plutôt qu'à un guide de chasse) a d'abord été créée par arrêté ministériel, sans base législative expresse, puis inscrite dans la loi n° 2024/008 du 24 juillet 2024 portant régime des forêts et de la faune (art. 49 à 52), qui institue aussi les aires protégées communautaires (art. 33). L'atlas forestier du MINFOF recense 24 zones de chasse à gestion communautaire, dont 14 dans la région de l'Est, créées entre 1998 et 2012.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Cameroun à la Convention sur la diversité biologique (mars 2014) : 22 zones d'intérêt cynégétique à gestion communautaire attribuées, dont 10 fonctionnelles ; les communautés en charge de ZICGC perçoivent 100 % des droits d'affermage (location du droit de chasse) de ces zones.", annee: 2014, source: "https://www.cbd.int/doc/world/cm/cm-nr-05-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 94/01 du 20 janvier 1994 portant régime des forêts, de la faune et de la pêche (dispositions contraires abrogées par la loi n° 2024/008, art. 190)", nature: "loi", annee: 1994, source: "https://faolex.fao.org/docs/pdf/cmr4845.pdf"}
  - {instrument: "Décret n° 95/466/PM du 20 juillet 1995 fixant les modalités d'application du régime de la faune, art. 2 (19) (territoire communautaire de chasse) et art. 27", nature: "loi", annee: 1995, source: "https://www.forestpeoples.org/fileadmin/uploads/fpp/migration/documents/Community%20conservation%20in%20Cameroon%20FR%20v5.pdf"}
  - {instrument: "Loi n° 2024/008 du 24 juillet 2024 portant régime des forêts et de la faune, art. 3, 33, 45 à 52, 120 et 153", nature: "loi", annee: 2024, source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
droits:
  autogouvernement: {valeur: "partiel", note: "La mise en œuvre des conventions de gestion des territoires communautaires de chasse et des ZICGC « relève des communautés concernées, sous le contrôle technique de l'Administration en charge de la faune », qui peut exécuter d'office les travaux ou résilier la convention (loi n° 2024/008, art. 47 et 51) ; pour prétendre aux quotes-parts des redevances et taxes prévues par la loi, les communautés riveraines doivent se constituer en entité légale (art. 148 (2)).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
  pouvoir_normatif: {valeur: "partiel", note: "L'aire protégée communautaire est définie comme une aire « gérée conformément aux usages locaux » (loi n° 2024/008, art. 3) ; ses modalités de gestion sont renvoyées à un texte réglementaire (art. 33 (4)) et la communauté ne peut pas en changer la vocation (art. 33 (3)). Pour les territoires communautaires de chasse, la liste des espèces dont la chasse est autorisée et les autres prescriptions de gestion sont fixées dans la convention avec l'administration (art. 46 (1)).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le territoire communautaire de chasse est un espace du domaine national et la ZICGC un espace « concédé » à une ou plusieurs communautés par convention de gestion (loi n° 2024/008, art. 3 et 45) ; les aires protégées communautaires, classées à la demande des communautés, relèvent du domaine privé de l'État (art. 33 (1) et (2)) : affectation et gestion, sans propriété du sol.", source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
  ressources: {valeur: "partiel", note: "Les revenus tirés des activités de chasse dans une ZICGC « appartiennent à la communauté riveraine concernée » (loi n° 2024/008, art. 50 (1)) ; la communauté dispose d'un droit de préemption (priorité d'achat, écrit « péremption » dans le texte) sur les produits naturels de la zone ou du territoire de chasse (art. 45 (2) et 50 (2)) ; la chasse rituelle, pratiquée au titre de la coutume, est reconnue (art. 120 (3)).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
  consentement: {valeur: "partiel", note: "Les zones et territoires de chasse sont attribués à une communauté « qui en manifeste l'intérêt » et l'aire protégée communautaire est classée « à leur demande » (loi n° 2024/008, art. 33 (1), 45 et 49) ; l'État ne peut suspendre ou restreindre les droits d'usage qu'après consultation des populations à travers leurs institutions représentatives (art. 6 (2)). Aucune clause de consentement libre, préalable et éclairé.", source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les revenus de la chasse dans une ZICGC reviennent à la communauté (loi n° 2024/008, art. 50 (1)) et la règle selon laquelle les bénéficiaires de conventions d'exploitation faunique ne sont pas exonérés des redevances, droits et taxes ne s'applique pas aux conventions passées avec les communautés riveraines (art. 153) ; la part des taxes fauniques attribuée aux communautés riveraines est versée à la commune pour financer leurs projets (art. 151 (3)).", source: "https://www.prc.cm/fr/actualites/actes/lois/7298-loi-n-2024-008-du-24-juillet-2024-portant-regime-des-forets-et-de-la-faune"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon une étude publiée par Forest Peoples Programme, le MINFOF dénombrait en 2012 vingt-six zones d'intérêt cynégétique à gestion communautaire ou cogérées, créées ou en cours de création, dont plusieurs non opérationnelles faute d'arrêté ; la même étude juge les procédures d'attribution des forêts communautaires et des territoires de chasse gérés par les communautés « longues et contraignantes » pour les peuples autochtones des forêts. Le cinquième rapport national du Cameroun à la Convention sur la diversité biologique (2014) compte 22 ZICGC attribuées, dont 10 fonctionnelles.", source: "https://www.forestpeoples.org/fileadmin/uploads/fpp/migration/documents/Community%20conservation%20in%20Cameroon%20FR%20v5.pdf"}
chronologie:
  - {annee: 1994, evenement: "Loi n° 94/01 du 20 janvier 1994 portant régime des forêts, de la faune et de la pêche."}
  - {annee: 1995, evenement: "Décret n° 95/466/PM du 20 juillet 1995 : définition du territoire communautaire de chasse (5 000 ha au plus, convention de gestion)."}
  - {annee: 1998, evenement: "Arrêté du 27 août 1998 portant sur la zone de Bel Eland (région du Nord), selon l'atlas forestier du MINFOF."}
  - {annee: 2000, evenement: "Arrêtés de septembre et décembre 2000 créant les premières zones de chasse à gestion communautaire de la Boumba-et-Ngoko (région de l'Est)."}
  - {annee: 2012, evenement: "Le MINFOF dénombre vingt-six zones à gestion communautaire ou cogérées, créées ou en cours de création."}
  - {annee: 2014, evenement: "Le cinquième rapport national à la Convention sur la diversité biologique compte 22 ZICGC attribuées, dont 10 fonctionnelles."}
  - {annee: 2024, evenement: "Loi n° 2024/008 du 24 juillet 2024 : inscription légale des ZICGC, des territoires communautaires de chasse, des aires protégées communautaires et de la chasse rituelle ; abrogation des dispositions contraires de la loi n° 94/01."}
fiabilite:
  verifie:
    - "Texte des art. 3, 6, 33, 35, 45 à 52, 120, 148, 151, 153 et 190 de la loi n° 2024/008, sur la copie scannée publiée par la présidence de la République."
    - "Liste, numéros, dates d'arrêté et superficies administratives des 24 zones de chasse à gestion communautaire, sur la couche « Zones d'intérêt cynégétique » de l'atlas forestier du MINFOF ; subdivisions établies par croisement avec la couche des arrondissements du même atlas."
    - "Décompte de 22 ZICGC attribuées dont 10 fonctionnelles et répartition des droits d'affermage, dans le cinquième rapport national à la Convention sur la diversité biologique (2014)."
  non_confirme:
    - "Texte du décret n° 95/466/PM consulté seulement à travers les extraits cités par Forest Peoples Programme ; ses textes d'application après 2024 (modalités d'attribution, de gestion des aires protégées communautaires, de la chasse rituelle) n'ont pas été trouvés."
    - "Le quatrième rapport national à la Convention sur la diversité biologique mentionne la création des comités de valorisation des ressources fauniques (COVAREF) ; leur rôle de gestionnaires des ZICGC n'est établi par aucun texte juridique consulté."
    - "Doublons possibles dans la couche MINFOF : deux zones nommées Mbock-Kaa portent le n° 19 (Adamaoua et Centre), deux zones Boumba Beuk (n° 13 et 14), et Bidjouki et Boumba-Dja-Nki ont la même superficie administrative (60 314 ha). Nombre de territoires communautaires de chasse et d'aires protégées communautaires non trouvé."
    - "Contradiction relevée par la note d'analyse d'organisations de la société civile publiée sur le site du PFBC (novembre 2024) : l'aire protégée communautaire relève du domaine national de la communauté selon l'art. 3 et du domaine privé de l'État selon l'art. 33 (2)."
    - "Population : non trouvée ; le champ population de la couche « Lieux habités » de l'atlas forestier est vide."
    - "Nombre de villages : 6 zones (Bel Eland, Salokomo, Doupa, Voko-Bantandje, Mana, une des deux Mbock-Kaa) ne contiennent aucune localité de la couche « Lieux habités » ; le décompte par zone n'a pas été vérifié sur le terrain ni sur une liste du MINFOF."
