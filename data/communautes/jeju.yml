base_nationale:
  - {instrument: "Loi spéciale sur l'établissement de la province autonome spéciale de Jeju et la création de la ville franche internationale (제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법), loi n° 7849, en vigueur le 1er juillet 2006 ; version en vigueur au 18 septembre 2026 (loi n° 21462)", nature: "loi", annee: 2006, source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Province établie sous l'autorité directe du gouvernement central avec un « statut spécial dans les limites de la loi » (Loi spéciale de 2006, art. 7) ; gouverneur et conseil provincial élus, le conseil comptant jusqu'à 45 membres dont au moins 25 % élus à la proportionnelle (art. 36) ; pouvoir d'organisation propre de l'administration et des effectifs fixé par ordonnance provinciale (art. 44).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil adopte des ordonnances provinciales (jorye, règlements locaux) dans les domaines que la loi lui ouvre, y compris, en fiscalité locale, des matières que les lois générales renvoient à un décret présidentiel (Loi spéciale de 2006, art. 5 et 121) ; il ne vote pas de lois. Le gouverneur peut, avec l'accord des deux tiers des membres du conseil, soumettre au Comité de soutien placé auprès du Premier ministre des propositions à inscrire dans la loi nationale ; les ministères ont deux mois pour les examiner, sans obligation de les retenir (art. 19).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le gouverneur désigne, avec l'accord du conseil, des zones de protection absolue où la construction et la modification des sols sont interdites (Loi spéciale de 2006, art. 355) ; il arrête les plans d'urbanisme et d'aménagement sans approbation du ministre chargé du territoire (art. 406).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  ressources: {valeur: "partiel", note: "Les eaux souterraines de l'île sont une « ressource publique » gérée par le gouverneur, qui délivre les autorisations de captage et perçoit une redevance (Loi spéciale de 2006, art. 377, 379 et 387) ; l'énergie éolienne est gérée comme ressource publique par la province (art. 304).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  consentement: {valeur: "partiel", note: "Une loi qui organiserait autrement le conseil et l'exécutif provinciaux ne peut s'appliquer qu'après un référendum local (Loi spéciale de 2006, art. 8, révisé en 2024) ; le ministre de l'Intérieur peut demander au gouverneur un référendum sur la réforme de l'organisation administrative de l'île (art. 10-2, 2024) ; pour les autres lois concernant la province, la loi prévoit un avis du gouverneur et non un consentement (art. 19).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Le responsable provincial de l'éducation (gyoyukgam) est élu au suffrage direct par les habitants (Loi spéciale de 2006, art. 74) ; la province reçoit une part fixe de 157/10 000 de la dotation nationale ordinaire pour l'éducation (art. 83).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  fiscalite: {valeur: "partiel", note: "Le gouverneur lève comme impôts provinciaux à la fois les impôts de province et ceux des communes (Loi spéciale de 2006, art. 120) ; le conseil peut moduler par ordonnance jusqu'à 100 % des taux de plusieurs impôts locaux, dont la taxe d'acquisition et la taxe foncière (art. 123) ; la province reçoit 3 % du total de la dotation ordinaire de péréquation versée par l'État aux collectivités (bot'ong gyobuse) (art. 124) et peut emprunter au-delà du plafond national après vote du conseil (art. 126).", source: "https://law.go.kr/LSW/lsInfoP.do?lsiSeq=284321&efYd=20260918"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon l'organisme public coréen de promotion des investissements, 4 660 catégories de compétences ont été transférées de l'État à la province dans les dix années suivant 2006. L'étude comparative de l'université de Caroline du Nord sur l'autorité régionale (Hooghe, Marks et al.) relève que ces transferts restent soumis à l'accord du gouvernement central, que le régime fiscal propre requiert l'approbation du ministère de l'Intérieur et que le contrôle du régime sans visa reste à l'État.", source: "https://garymarks.web.unc.edu/wp-content/uploads/sites/13018/2021/03/South-Korea_combined.pdf"}
chronologie:
  - {annee: 2006, evenement: "Adoption de la Loi spéciale par l'Assemblée nationale le 9 février ; établissement de la province autonome spéciale le 1er juillet."}
  - {annee: 2006, evenement: "Les communes élues de l'île sont remplacées par deux villes administratives, Jeju et Seogwipo (Loi spéciale, art. 10)."}
  - {annee: 2009, evenement: "Abrogation le 25 mars de la loi spéciale sur le régime administratif de Jeju (Loi spéciale, dispositions transitoires)."}
  - {annee: 2020, evenement: "Révision du 29 décembre : la police autonome est placée sous un comité de police autonome provincial (art. 88)."}
  - {annee: 2024, evenement: "Révision du 30 janvier : un référendum local est requis pour modifier la structure du conseil et de l'exécutif (art. 8)."}
fiabilite:
  verifie: ["Articles 1, 3 à 10, 10-2, 11, 16, 17, 19, 20, 28, 36, 44, 74, 83, 88 à 90, 104, 120 à 127, 131, 197, 198, 304, 355, 377, 379, 387 et 406 de la Loi spéciale, texte coréen en vigueur au 18 septembre 2026 (loi n° 21462), base nationale de la législation (law.go.kr).", "Numéro de la loi d'origine (n° 7849) et date d'entrée en vigueur (1er juillet 2006), dispositions transitoires du même texte.", "Population totale de 691 278 habitants en août 2026, dont 502 833 pour la ville de Jeju et 188 445 pour celle de Seogwipo (portail statistique de la province).", "Entrée sans visa des étrangers venus pour tourisme ou transit par les ports et aéroports de Jeju, sauf ressortissants des pays listés par le ministre de la Justice (art. 197)."]
  non_confirme: ["Superficie : une encyclopédie en ligne donne 1 850,3 km² d'après l'indicateur national des surfaces par subdivision (e-나라지표), dont le tableau, chargé par script, n'a pas pu être lu.", "Nombre de villages (ri) et de quartiers (dong) non retenu : la liste de « villages » du site provincial mêle quartiers et villages et ne constitue pas un décompte officiel.", "Le chiffre de 4 660 compétences transférées provient d'une page de promotion des investissements, non d'un rapport du Comité de soutien.", "Date de promulgation de la loi n° 7849 (21 février 2006 selon des sources secondaires) non vérifiée sur le Journal officiel.", "Langue de Jeju (jejueo) : aucune disposition de la Loi spéciale ne lui donne un statut officiel ; une ordonnance provinciale de protection existerait, non consultée.", "Aucun document de l'ONU ou d'un mécanisme régional visant ce statut n'a été trouvé.", "Projet de rétablissement de collectivités de base élues dans l'île, ouvert au référendum par l'art. 10-2 (2024) : état d'avancement non vérifié ; le texte en vigueur au 18 septembre 2026 maintient l'absence de communes élues (art. 10)."]
