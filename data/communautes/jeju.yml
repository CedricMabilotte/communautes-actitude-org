resume: >-
  La province de Jeju, île située au sud de la péninsule coréenne, est depuis le 1er juillet 2006 une « province autonome spéciale » placée directement sous le gouvernement central. Son statut repose sur la Loi spéciale sur l'établissement de la province autonome spéciale de Jeju et la création de la ville franche internationale (loi n° 7849, 2006), qui prévoit le transfert par étapes des compétences de l'État, hors diplomatie, défense et justice (art. 20). La province dispose d'un gouverneur et d'un conseil élus, d'une police autonome, d'un responsable de l'éducation élu, de règles fiscales propres et d'un régime d'entrée sans visa pour les visiteurs étrangers. Elle ne compte plus de communes élues : ses deux villes sont de simples circonscriptions administratives (art. 10).
