uid: "aire-marine-protegee-communautaire-urok"
nom: "Aire marine communautaire des îles Urok"
endonyme: "Urok"
territoire: "Îles Formosa, Nago et Chediã et îlots voisins (Acoco, Maramba, Papagaio, Quai, Ratum), nord de l'archipel des Bijagós, région de Bolama"
etats: ["Guinée-Bissau"]
region: "afrique"
coord: [11.5, -15.9]
type: "communaute_locale"
types_secondaires: []
base: "territoriale"
population: {valeur: 2928, annee: 2009, perimetre: "habitants des 33 tabancas (villages) de l'aire, recensement de 2009 cité par l'Institut de la biodiversité et des aires protégées (IBAP) ; le plan de gestion indique 2572 habitants au recensement de 1991", source: "https://ibapgbissau.org/urok/"}
lieux: {valeur: 3, unite: "îles principales habitées (Formosa, Nago, Chediã)", annee: 2005, source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
surface_km2: {valeur: 545, annee: 2005, perimetre: "ensemble des îles Urok et de leurs espaces côtiers : 147 km² de terres, 66 km² de mangrove, 203 km² de vasières intertidales et 8 km² de chenaux profonds (préambule du décret n° 8/2005)", source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
villages: {valeur: 33, annee: 2009, perimetre: "tabancas (villages) de l'aire, recensement de 2009 ; le même nombre figure pour 1991 dans le plan de gestion", source: "https://ibapgbissau.org/urok/"}
resume: >-
  Le décret n° 8/2005 crée l'Aire marine protégée communautaire (AMPC) des îles Urok, nom traditionnel du groupe Formosa, Nago et Chediã, au nord de l'archipel des Bijagós. Le décret n° 9/2005 du même jour approuve un plan de gestion fondé sur les règles traditionnelles de gestion des Bijagó, négocié depuis 2001 entre les habitants, les autorités coutumières et l'ONG Tiniguena. L'accès aux ressources de la zone centrale et de la zone tampon est réservé aux résidents. Un comité de gestion où siègent 12 représentants des trois îles et une assemblée générale formée des comités de gestion des tabancas (villages) dirigent l'aire ; un conseil des anciens, formé des régulos (chefs coutumiers) et des balobeiros (prêtres de la religion traditionnelle), valide les décisions de l'assemblée.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Quatrième rapport national à la Convention sur la diversité biologique (30 novembre 2009) : décrit l'« Aire Marine Protégée Communautaire des Îles Formosa, Nago et Chediã (AMP Complexe UROK) » et la cite, au titre de l'objectif 1.1.7 (aires protégées qui respectent les connaissances traditionnelles « conformément à l'article 8j »), comme aire protégée communautaire existante depuis avril 2005.", annee: 2009, source: "https://www.cbd.int/doc/world/gw/gw-nr-04-fr.pdf"}
base_nationale:
  - {instrument: "Décret n° 8/2005 portant création de l'Aire marine protégée communautaire des îles de Formosa, Nago et Chediã (îles Urok), Bulletin officiel n° 28, supplément, 12 juillet 2005", nature: "loi", annee: 2005, source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
  - {instrument: "Décret n° 9/2005 portant approbation du plan de gestion de l'Aire marine protégée communautaire des îles Urok, Bulletin officiel n° 28, supplément, 12 juillet 2005", nature: "loi", annee: 2005, source: "https://faolex.fao.org/docs/pdf/gbs120602.pdf"}
  - {instrument: "Décret-loi n° 5-A/2011 du 1er mars 2011 portant révision de la loi-cadre des aires protégées (art. 3, 4 i, 6, 7, 15, 16, 20 et 23)", nature: "loi", annee: 2011, source: "https://ibapgbissau.org/wp-content/uploads/2022/12/Lei-Quadro-das-APs-2011.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organes de l'aire : un comité de gestion (6 représentants de Formosa, 3 de Nago, 3 de Chediã, 2 de Tiniguena, 1 de la réserve de biosphère, 1 de l'administration de secteur) et une assemblée générale formée des membres des comités de gestion de chaque tabanca et de représentants de l'État et des partenaires (décret n° 8/2005, art. 9) ; le plan de gestion ajoute des assemblées insulaires et un conseil des anciens (régulos et balobeiros des trois îles) qui valide les décisions de l'assemblée (décret n° 9/2005, plan, § 6.4.1) ; l'IBAP oriente et contrôle les organes de chaque aire protégée sous la tutelle administrative du ministre (décret-loi n° 5-A/2011, art. 12 et 13) ; le conseil de gestion prévu par ce texte est présidé par un directeur nommé par l'IBAP et compte jusqu'à la moitié de représentants des communautés résidentes (art. 14 et 16).", source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les règles d'accès et d'usage du plan de gestion reprennent des règles traditionnelles bijagó négociées entre résidents et rendues obligatoires par le décret n° 9/2005 ; l'assemblée générale Urok approuve les futurs plans de gestion (plan, § 6.4.1.3) ; le droit traditionnel prévaut dans les zones sacrées : les îles de Quai, Ratum, Ramanssa et Manramba sont gérées par leurs propriétaires coutumiers et la rivière d'Uada par la tabanca d'Uada (plan, § 6.3.1.2).", source: "https://faolex.fao.org/docs/pdf/gbs120602.pdf"}
  justice_propre: {valeur: "partiel", note: "Les comités de gestion des tabancas, les assemblées insulaires et le comité de gestion Urok assurent la médiation des conflits entre usagers (plan, § 6.4.1) ; la qualité de membre d'une communauté résidente est appréciée en cas de contestation par le conseil de gestion « selon les us et coutumes en vigueur » (décret-loi n° 5-A/2011, art. 20) ; les sanctions relèvent de l'administration de secteur, sur proposition du comité de gestion (décret n° 8/2005, art. 7).", source: "https://faolex.fao.org/docs/pdf/gbs120602.pdf"}
  terres: {valeur: "partiel", note: "Le territoire de l'aire s'étend jusqu'aux limites des bancs et espaces maritimes gérés traditionnellement par les communautés des îles (décret n° 8/2005, art. 3) ; l'occupation, l'usage et la jouissance du sol restent régis par la loi foncière (art. 10) ; les îles sacrées de Quai, Ratum, Ramanssa et Manramba sont sous la gestion de leurs propriétaires traditionnels (plan, § 6.3.1.2).", source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
  ressources: {valeur: "partiel", note: "Dans la zone centrale, toute activité est interdite hors de l'accès aux ressources réservé aux résidents pour leurs besoins alimentaires et cérémoniels, ou à des fins scientifiques ; dans la zone tampon, l'accès est réservé exclusivement aux résidents à des fins alimentaires, cérémonielles et commerciales ; la zone de transition est ouverte aux résidents et non-résidents (décret n° 8/2005, art. 4 et 6) ; les licences relèvent de l'administration de secteur, sur proposition du comité de gestion (art. 8), et le directeur de l'IBAP peut réglementer les activités, fixer des quotas et fermer un secteur (décret-loi n° 5-A/2011, art. 22).", source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
  consentement: {valeur: "partiel", note: "Le projet de décret de classement d'une aire protégée doit être accompagné de l'accord des communautés sur le zonage, la réglementation et les compensations (décret-loi n° 5-A/2011, art. 6, al. 1 c) et préparé par un comité de pilotage qui négocie avec les communautés résidentes (art. 7) ; une licence ou concession temporaire exige l'avis contraignant du conseil de gestion et le procès-verbal de consultation des communautés résidentes (art. 32, al. 1) ; dans l'aire Urok, toute activité soumise à licence est autorisée par l'administration de secteur sur proposition du comité de gestion (décret n° 8/2005, art. 8).", source: "https://ibapgbissau.org/wp-content/uploads/2022/12/Lei-Quadro-das-APs-2011.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le produit des amendes et des taxes de licence va pour 40 % au fonds spécial de l'aire, 30 % à l'IBAP, 20 % à l'administration de secteur et 10 % au Trésor public (décret n° 8/2005, art. 11) ; le budget et le fonds spécial sont des instruments de gestion de l'aire (art. 10) ; le décret-loi n° 5-A/2011 attribue au fonds spécial 40 % des taxes de licence (art. 32, al. 3) et le produit des amendes après 20 % versés aux agents verbalisateurs (art. 42, al. 2), et place le fonds sous la tutelle du directeur de l'IBAP (art. 38).", source: "https://ibapgbissau.org/wp-content/uploads/2022/06/Decreto-Urok-1.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "La qualité de résident ouvre l'accès exclusif aux ressources des zones centrale et tampon (décret n° 8/2005, art. 6) ; en cas de doute ou de contestation, la qualité de membre d'une communauté résidente est appréciée par le conseil de gestion selon les us et coutumes en vigueur (décret-loi n° 5-A/2011, art. 20). Cette qualité de résident ouvre l'accès aux ressources (droit « ressources ») ; elle ne constitue ni un statut civil, ni une citoyenneté, ni un droit de domicile.", source: "https://ibapgbissau.org/wp-content/uploads/2022/12/Lei-Quadro-das-APs-2011.pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Une thèse soutenue en 2015, fondée sur trois campagnes de pêche expérimentale (2011-2013), conclut que les données ne permettent pas de confirmer l'effet du zonage en trois zones sur les peuplements de poissons ; elle ne traite pas du fonctionnement des organes de gestion. Le plan de gestion de 2003 relevait que les services chargés de la répression des infractions n'avaient ni représentation ni embarcation sur place. Aucune évaluation publiée du fonctionnement des organes de l'aire n'a été trouvée.", source: "https://theses.hal.science/tel-01960377v1/file/These-2015-EDSM-Ecologie_halieutique-SADIO_Oumar.pdf"}
chronologie:
  - {annee: 1993, evenement: "L'ONG Tiniguena engage un programme de développement participatif sur l'île de Formosa ; habitants et autorités coutumières demandent des mesures de protection des ressources côtières des trois îles."}
  - {annee: 1996, evenement: "L'UNESCO classe l'archipel de Bolama-Bijagós réserve de biosphère ; le groupe Urok est identifié comme zone centrale."}
  - {annee: 2001, evenement: "Début de deux ans d'expérimentation (2001-2002) de règles de gestion fondées sur les règles traditionnelles bijagó et d'un système de comités de gestion."}
  - {annee: 2003, evenement: "Plan de gestion de la zone côtière des îles Formosa, Nago et Chediã pour 2004-2008 (Bissau, novembre 2003), soumis au gouvernement."}
  - {annee: 2005, evenement: "Décrets n° 8/2005 (création de l'aire) et n° 9/2005 (plan de gestion), approuvés en Conseil des ministres le 15 avril, promulgués le 12 mai et publiés au Bulletin officiel n° 28 du 12 juillet."}
  - {annee: 2009, evenement: "Quatrième rapport national à la Convention sur la diversité biologique : l'aire est citée au titre des aires protégées qui respectent l'article 8 j ; recensement de 2009 : 2928 habitants dans 33 tabancas."}
  - {annee: 2011, evenement: "Décret-loi n° 5-A/2011 du 1er mars : révision de la loi-cadre des aires protégées, qui définit l'aire protégée communautaire (art. 4 i)."}
fiabilite:
  verifie:
    - "Texte du décret n° 8/2005 (Bulletin officiel n° 28, supplément, 12 juillet 2005, copie publiée par l'IBAP) : art. 1 à 16, dont les zones et l'accès réservé aux résidents (art. 4 et 6), la fiscalisation et les sanctions (art. 7), la composition des organes (art. 9) et la répartition des recettes (art. 11)."
    - "Texte du décret n° 9/2005 et du plan de gestion annexé (FAOLEX) : population de 2572 habitants dans 33 tabancas au recensement de 1991, surface de 545 km², organes de gestion (comités de tabanca, assemblées insulaires, assemblée générale, comité de gestion, conseil des anciens, comité technique)."
    - "Décret-loi n° 5-A/2011 (copie publiée par l'IBAP) : art. 3 et 4 i (aire protégée communautaire), 6 et 7 (accord et négociation avec les communautés résidentes), 15 et 16 (conseil de gestion), 20 (qualité de membre d'une communauté résidente), 23 (titres d'exploitation pouvant être attribués à une communauté résidente)."
    - "Mention de l'aire dans le quatrième rapport national (2009) et dans la stratégie nationale pour la biodiversité 2015-2020 transmis au secrétariat de la Convention sur la diversité biologique."
  non_confirme:
    - "Le quatrième rapport national attribue la création de l'aire au « décret-loi nº 9/2005 » ; le Bulletin officiel montre que la création relève du décret n° 8/2005 et l'approbation du plan du décret n° 9/2005."
    - "Le quatrième rapport national (2009) mentionne une évaluation indépendante de l'efficacité de gestion de toutes les aires protégées, conduite en mai et juin 2007 (personnel qualifié insuffisant, moyens financiers et matériels très limités), sans résultat propre à l'aire Urok ; cette évaluation n'a pas été consultée."
    - "La répartition des recettes fixée par le décret n° 8/2005 (art. 11) diffère de celle du décret-loi n° 5-A/2011 (art. 32 et 42), qui abroge les dispositions contraires (art. 55) ; la règle appliquée n'a pas été vérifiée."
    - "La composition des organes diffère entre le décret n° 8/2005 (comité de gestion de 16 membres) et le plan de gestion (assemblée générale de 167 membres de 28 comités de tabanca) ; leur fonctionnement actuel, le règlement intérieur cité par l'IBAP et l'adaptation au conseil de gestion prévu par la loi-cadre de 2011 n'ont pas été vérifiés."
    - "La base mondiale des aires protégées (WDPA) enregistre l'aire (désignation 2005) sans type de gouvernance déclaré ; aucune inscription au registre des aires du patrimoine autochtone et communautaire (ICCA) n'a été trouvée ; la page « Législation » de l'IBAP ne cite que cette aire marine protégée communautaire parmi les aires créées par décret."
