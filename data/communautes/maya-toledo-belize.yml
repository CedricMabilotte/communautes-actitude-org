resume: >-
  Les villages maya du district de Toledo, représentés par leurs alcaldes (autorités traditionnelles élues) et la Maya Leaders Alliance, ont obtenu la reconnaissance judiciaire de leur régime foncier coutumier. Par une ordonnance d'accord du 22 avril 2015, la Cour caribéenne de justice, dernière instance du Belize, confirme que la tenure coutumière maya existe dans les villages du Toledo et crée des droits de propriété collectifs et individuels protégés par la Constitution. Le gouvernement s'engage à créer, en consultation avec les Maya, un mécanisme pour identifier et protéger ces droits, et à s'abstenir d'ici là de tout acte affectant ces terres sans leur consentement éclairé.
