effectivite: {valeur: "contestee", note: "Le 31 octobre 2025, la Cour caribéenne met fin à dix ans de supervision de l'exécution de l'ordonnance ; le projet de loi reste inachevé et les représentants maya déclarent qu'aucun progrès n'a été obtenu.", source: "https://www.greaterbelize.com/ccj-ends-decade-long-monitoring-of-maya-land-rights-case/"}
chronologie:
  - {annee: 2004, evenement: "Rapport n° 40/04 de la Commission interaméricaine."}
  - {annee: 2007, evenement: "Jugement de la Cour suprême du Belize (18 octobre) pour les villages de Santa Cruz et Conejo."}
  - {annee: 2010, evenement: "La Cour suprême étend la reconnaissance de la tenure coutumière à tous les villages maya du Toledo."}
  - {annee: 2013, evenement: "La Cour d'appel du Belize confirme l'existence de la tenure coutumière maya (25 juillet)."}
  - {annee: 2015, evenement: "Ordonnance d'accord de la Cour caribéenne de justice (22 avril)."}
  - {annee: 2015, evenement: "Arrêt du 30 octobre : création d'un fonds de 300 000 dollars bélizéens comme premier pas vers l'exécution."}
  - {annee: 2022, evenement: "Protocole de consultation adopté par le gouvernement sans l'accord des Maya."}
  - {annee: 2023, evenement: "Trois villages ont achevé la délimitation de leurs limites ; projet de politique foncière maya du 8 décembre, rejeté par les villages."}
  - {annee: 2024, evenement: "L'Attorney General remplace l'alcalde et l'alcalde adjoint d'Indian Creek ; la Toledo Alcaldes Association saisit la justice."}
  - {annee: 2025, evenement: "La Cour caribéenne met fin à la supervision de l'exécution de l'ordonnance (31 octobre)."}
  - {annee: 2026, evenement: "La Cour caribéenne rejette la demande de clarification de l'ordonnance déposée par les organisations maya (30 juillet) ; la loi de codification est en cours d'examen par un comité mixte."}
