base_nationale:
  - {instrument: "Cour caribéenne de justice, Maya Leaders Alliance c. Attorney General of Belize, [2015] CCJ 15 (AJ) : ordonnance d'accord du 22 avril 2015 et arrêt du 30 octobre 2015", nature: "jurisprudence", annee: 2015, source: "https://elaw.org/wp-content/uploads/archive/bz.mayaleaders_0.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "La loi sur les tribunaux inférieurs (chap. 94, partie VII, éd. révisée 2000) institue des tribunaux d'alcalde dans les districts déclarés par le ministre : compétence civile limitée aux litiges de 25 à 100 dollars bélizéens, exclusion des litiges fonciers (art. 70), alcaldes nommés et révocables par l'Attorney General (art. 75).", source: "https://www.belizecitycouncil.org/uploads/acts/26384-Inferior_Courts_Act.pdf"}
  terres: {valeur: "partiel", note: "La tenure coutumière maya crée des droits de propriété collectifs et individuels au sens des art. 3(d) et 17 de la Constitution (ordonnance du 22 avril 2015, § 1) ; les terres ne sont pas encore délimitées ni titrées et l'autorité constitutionnelle du gouvernement sur toutes les terres est maintenue (§ 5).", source: "https://elaw.org/wp-content/uploads/archive/bz.mayaleaders_0.pdf"}
  ressources: {valeur: "partiel", note: "Le gouvernement s'engage à ne délivrer ni concession forestière, minière ou pétrolière ni bail sur les terres des villages sans consultation visant le consentement éclairé (ordonnance de 2015, § 4).", source: "https://elaw.org/wp-content/uploads/archive/bz.mayaleaders_0.pdf"}
  consentement: {valeur: "conteste", note: "L'ordonnance de 2015 (§ 4) subordonne les actes affectant les terres maya à une consultation visant le consentement éclairé ; le projet de politique foncière maya du 8 décembre 2023, qui réduit les terres de village à un rayon d'un à trois kilomètres, est rédigé sans consultation des Maya, qui le rejettent.", source: "https://www.culturalsurvival.org/news/belize-must-obtain-maya-peoples-free-prior-and-informed-consent-drafting-maya-customary-land"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
