  ressources: {valeur: "partiel", note: "Le gouvernement s'engage à ne délivrer ni concession forestière, minière ou pétrolière ni bail sur les terres des villages sans consultation visant le consentement éclairé (ordonnance de 2015, § 4).", source: "https://elaw.org/wp-content/uploads/archive/bz.mayaleaders_0.pdf"}
