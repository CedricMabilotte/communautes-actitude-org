resume: >-
  Dans l'État de Tlaxcala, une localité de plus de mille habitants distincte du chef-lieu peut être érigée par le Congrès en présidence de communauté (presidencia de comunidad), autorité auxiliaire de la municipalité dont le titulaire siège au conseil municipal (cabildo). La Constitution de l'État (art. 90) permet d'élire ce titulaire selon les usages et coutumes plutôt que par le scrutin des partis, et l'Institut électoral du Tlaxcala tient le catalogue des communautés concernées. Ce catalogue, établi en 2007, compte 94 présidences de communauté dans 24 municipalités en 2022, sur 393 présidences de communauté dans l'État ; leur assemblée générale communautaire désigne le titulaire selon ses propres règles (vote à main levée, en file derrière le candidat, sur tableau ou par bulletin). Le catalogue ne repose pas sur une appartenance ethnique : il réunit des localités nahuas et des localités sans désignation autochtone.
