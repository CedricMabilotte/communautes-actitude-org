base_nationale:
  - {instrument: "Constitution politique de l'État libre et souverain du Tlaxcala, art. 1 (pueblos náhuatl y otomí) et art. 90 (élection des présidents de communauté, modalité des usages et coutumes, réforme du 21 juillet 2015) ; texte à jour au 31 octobre 2023", nature: "constitution", annee: 2015, source: "https://tsjtlaxcala.gob.mx/transparencia/Fracciones_a63/I/leyes/4T23-CONSTITUCION-LOCAL-311023.pdf"}
  - {instrument: "Loi municipale de l'État de Tlaxcala, art. 3, 12, 112 à 120 et 153 (décret n° 135 du 12 octobre 2015 ; texte à jour au 31 décembre 2018)", nature: "loi", annee: 2015, source: "https://tetlax.org.mx/wp-content/uploads/2019/07/LEY-MUNICIPAL-DEL-ESTADO-DE-TLAXCALA.pdf"}
  - {instrument: "Loi des institutions et procédures électorales de l'État de Tlaxcala (LIPEET), art. 11, 142, 275 et 276 (3 septembre 2015 ; texte à jour au 25 avril 2022)", nature: "loi", annee: 2015, source: "https://www.ofstlaxcala.gob.mx/transparencia/uploads/doc_ofs/I/estatales/leyes/LEY%20DE%20INSTITUCIONES%20Y%20PROCEDIMIENTOS%20ELECTORALES%20PARA%20EL%20ESTADO%20DE%20TLAXCALA.pdf"}
  - {instrument: "Code financier de l'État de Tlaxcala et de ses municipalités, art. 510 (réformes du 31 décembre 2007 et du 3 novembre 2017)", nature: "loi", annee: 2007, source: "https://tsjtlaxcala.gob.mx/transparencia/Fracciones_a63/I/leyes/_codigofinanciero_tlaxcala_160321.pdf"}
  - {instrument: "Règlement d'assistance technique, juridique et logistique aux communautés qui élisent leur président de communauté par usages et coutumes, Conseil général de l'ITE, 10 novembre 2015 ; règlement et réformes laissés sans effet en décembre 2021 sur ordre de la justice électorale, dans l'attente d'une consultation des 94 communautés (SCM-JDC-808/2021)", nature: "loi", annee: 2015, source: "https://www.tetlax.org.mx/wp-content/uploads/2020/03/Reglamento-de-asistencia-t%C3%A9cnica-jur%C3%ADdica-y-log%C3%ADstica-a-las-comunidades-que-realizan-elecciones-de-Presidentes-de-Comunidad-por-el-sistema-de-usos-y-costumbres.pdf"}
  - {instrument: "Tribunal électoral fédéral, chambre régionale de Mexico, SCM-JDC-808/2021 et SCM-JDC-809/2021 joints, 2 décembre 2021", nature: "jurisprudence", annee: 2021, source: "https://www.te.gob.mx/media/SentenciasN/pdf/df/SCM-JDC-0808-2021.pdf"}
  - {instrument: "Cour suprême de justice de la Nation, controverse constitutionnelle 38/2019 (municipalité de Contla de Juan Cuamatzi), 3 novembre 2020", nature: "jurisprudence", annee: 2020, source: "https://dof.gob.mx/nota_detalle_popup.php?codigo=5617829"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution du Tlaxcala (art. 90) et la loi municipale (art. 116, I et VI) prévoient l'élection du président de communauté selon les usages et coutumes, par l'assemblée de la localité, dont l'acte vaut accréditation auprès de la municipalité ; la présidence reste un organe déconcentré (organe d'exécution délégué) subordonné au conseil municipal (art. 116 et 117).", source: "https://tetlax.org.mx/wp-content/uploads/2019/07/LEY-MUNICIPAL-DEL-ESTADO-DE-TLAXCALA.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La LIPEET (art. 11, dans son texte de 2015 remis en vigueur le 15 décembre 2020 après l'invalidation du décret n° 215 par la Cour suprême, AI 265/2020) prévoit que le vote se tient selon les modalités que déterminent les communautés, et interdit aux partis de présenter des candidats dans ces communautés (art. 142) ; la loi municipale (art. 118) admet une durée de mandat fixée par la coutume dans la limite du mandat municipal. Ce pouvoir se limite à la désignation des autorités.", source: "https://www.ofstlaxcala.gob.mx/transparencia/uploads/doc_ofs/I/estatales/leyes/LEY%20DE%20INSTITUCIONES%20Y%20PROCEDIMIENTOS%20ELECTORALES%20PARA%20EL%20ESTADO%20DE%20TLAXCALA.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi municipale (art. 153) permet au président de communauté d'exercer directement, en coordination avec le juge municipal, la fonction juridictionnelle municipale dans sa circonscription ; il s'agit de la justice municipale de droit commun, ouverte à toutes les présidences de communauté de l'État, non d'une justice coutumière.", source: "https://tetlax.org.mx/wp-content/uploads/2019/07/LEY-MUNICIPAL-DEL-ESTADO-DE-TLAXCALA.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le 2 décembre 2021, la chambre régionale de Mexico du Tribunal électoral fédéral, se fondant sur l'article 2 de la Constitution fédérale et l'article 6 de la Convention 169 de l'OIT, ordonne que le règlement de l'ITE et ses réformes, adoptés sans consultation préalable, soient laissés sans effet et que les 94 communautés soient consultées sur l'ensemble du texte (SCM-JDC-808/2021).", source: "https://www.te.gob.mx/media/SentenciasN/pdf/df/SCM-JDC-0808-2021.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le code financier (art. 510) oblige chaque municipalité à reverser à l'ensemble de ses présidences de communauté, quel que soit leur mode d'élection, 10 % des participations reçues du Fonds étatique partageable (Fondo Estatal Participable) ; la loi municipale (art. 120, VII, IX et X) charge le président de communauté de tenir le registre des contribuables et, si le conseil municipal l'approuve, de percevoir l'impôt foncier, et de rendre ses comptes chaque mois à la municipalité.", source: "https://tsjtlaxcala.gob.mx/transparencia/Fracciones_a63/I/leyes/_codigofinanciero_tlaxcala_160321.pdf"}
  representation: {valeur: "partiel", note: "Au niveau municipal seulement, comme dans toutes les présidences de communauté de l'État : les présidents de communauté ont la qualité de membres du conseil municipal (munícipes) (Constitution du Tlaxcala, art. 90 ; loi municipale, art. 3 et 12) et y siègent avec voix délibérative (art. 120, I, décret n° 149 de 2018) ; à Contla de Juan Cuamatzi, ils n'y ont plus que voix consultative depuis l'arrêt CC 38/2019.", source: "https://tetlax.org.mx/wp-content/uploads/2019/07/LEY-MUNICIPAL-DEL-ESTADO-DE-TLAXCALA.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'ITE consigne pour chaque communauté la date, le mode de vote et la durée du mandat, de 1 à 3 ans pour la plupart des élections de 2021 et 2022 ; certaines communautés ne le convoquent pas à leur assemblée. Une étude universitaire de 2023 relève que l'ITE a réformé son règlement en 2020 sans consultation préalable, que son protocole de consultation de 2022 a été contesté en justice par plusieurs communautés, et que la consultation des 94 communautés ordonnée au Congrès en décembre 2020 (SCM-JDC-165/2020) n'avait pas eu lieu en juin 2023. En 2024, le Tribunal électoral du Tlaxcala relève que les 94 communautés conservent ce mode d'élection (TET-JDC-025/2024).", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S1870-41152023000100114"}
chronologie:
  - {annee: 2007, evenement: "Le 14 avril, l'Institut électoral du Tlaxcala approuve le catalogue des communautés qui élisent leur président de communauté par usages et coutumes (accord CG 13/2007) : 94 présidences ; Ranchería Pocitos (Atltzayanca) en sort en mai à sa demande (accord CG 18/2007)."}
  - {annee: 2010, evenement: "Le 30 novembre, l'accord CG 275/2010 inscrit au catalogue la présidence du centre de Santa Cruz Tlaxcala (barrios El Alto, Tepetlazingo et Tetzotzocola)."}
  - {annee: 2015, evenement: "Réforme de l'article 90 de la Constitution du Tlaxcala (21 juillet), nouvelle loi électorale (3 septembre), réforme des articles 116 et 120 de la loi municipale (12 octobre) ; le 10 novembre, l'ITE adopte son règlement d'assistance aux élections par usages et coutumes."}
  - {annee: 2018, evenement: "Décret n° 149 (23 août) : les présidents de communauté siègent au conseil municipal avec voix délibérative."}
  - {annee: 2020, evenement: "Le 17 septembre, l'ITE réforme son règlement sans consultation des communautés (accord ITE-CG 31/2020). Le 3 novembre, la Cour suprême annule la réforme de 2018 pour la seule municipalité de Contla de Juan Cuamatzi, au motif que l'article 115 de la Constitution fédérale réserve le vote au conseil municipal à ses membres élus (CC 38/2019). Le 30 novembre, elle invalide la réforme électorale de 2020 (décret n° 215, AI 265/2020) ; l'ancien texte de la LIPEET sur les élections par usages et coutumes revit le 15 décembre. Le 18 décembre, la chambre régionale de Mexico du Tribunal électoral fédéral ordonne au Congrès de consulter les 94 communautés (SCM-JDC-165/2020)."}
  - {annee: 2021, evenement: "Le 2 décembre, la chambre régionale de Mexico du Tribunal électoral fédéral fait laisser sans effet le règlement de l'ITE et ordonne la consultation des 94 communautés sur l'ensemble du texte (SCM-JDC-808/2021 et 809/2021) ; la communauté d'Álvaro Obregón passe de la municipalité de Sanctórum à celle de Benito Juárez (décret n° 305)."}
  - {annee: 2022, evenement: "Le 30 avril, l'ITE adopte le protocole de consultation des communautés sur son règlement (accord ITE-CG 31/2022), contesté en justice par plusieurs communautés ; il publie la mise à jour du catalogue."}
  - {annee: 2024, evenement: "Le Tribunal électoral du Tlaxcala confirme la réponse de l'ITE à des présidents de communauté qui demandaient l'élection d'un député par usages et coutumes : ce mode d'élection n'est pas prévu par une loi du Congrès (TET-JDC-025/2024)."}
