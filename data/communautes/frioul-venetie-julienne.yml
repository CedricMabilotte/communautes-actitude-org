droits:
  autogouvernement: {valeur: "reconnu", note: "Le Frioul-Vénétie Julienne est constitué en Région autonome dotée de la personnalité juridique, Statut, art. 1 ; ses organes sont le Conseil régional élu au suffrage universel direct, la Junte (exécutif régional) et le Président de la Région, art. 12 et 13 ; une loi régionale adoptée à la majorité absolue fixe la forme de gouvernement, art. 12.", source: "https://www.consiglio.regione.fvg.it/cms/export/sites/consiglio/istituzione/allegati/Allegati_istituzione_statuto/Statuto-aggiornato-gennaio-2022.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Région a le pouvoir législatif primaire (dans le respect de la Constitution, des principes généraux de l'ordre juridique, des normes fondamentales des réformes économiques et sociales, des obligations internationales et des intérêts nationaux) sur les collectivités locales, l'agriculture et les forêts, la chasse et la pêche, les usi civici (droits d'usage collectifs), l'urbanisme et le tourisme, Statut, art. 4 ; elle légifère dans le cadre des principes des lois de l'État sur les matières de l'art. 5 ; le Statut, art. 29, prévoit que le Gouvernement peut contester une loi régionale devant la Cour constitutionnelle.", source: "https://www.consiglio.regione.fvg.it/cms/export/sites/consiglio/istituzione/allegati/Allegati_istituzione_statuto/Statuto-aggiornato-gennaio-2022.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Pouvoir législatif sur les usi civici et la tenue des livres fonciers, Statut, art. 4, n° 4 et 5 ; les forêts de l'État et les biens immobiliers disponibles de l'État situés dans la région sont transférés à la Région, art. 55 et 56 ; ces biens appartiennent à la Région, pas à un sujet collectif distinct.", source: "https://www.consiglio.regione.fvg.it/cms/export/sites/consiglio/istituzione/allegati/Allegati_istituzione_statuto/Statuto-aggiornato-gennaio-2022.pdf"}
  ressources: {valeur: "partiel", note: "Les forêts, les mines et les eaux minérales et thermales de l'État, ainsi que les carrières et tourbières dont le propriétaire du fonds n'a pas la disposition, passent au patrimoine indisponible de la Région (biens publics qui ne peuvent être cédés), Statut, art. 55 ; la Région légifère sur les mines et carrières et sur l'utilisation des eaux publiques, à l'exception des grandes dérivations, art. 5, n° 10 et 14 ; le régime douanier reste de compétence exclusive de l'État, art. 51.", source: "https://www.consiglio.regione.fvg.it/cms/export/sites/consiglio/istituzione/allegati/Allegati_istituzione_statuto/Statuto-aggiornato-gennaio-2022.pdf"}
  consentement: {valeur: "partiel", note: "Le Président de la Région assiste au Conseil des ministres pour y être entendu sur les questions qui concernent la Région, Statut, art. 44 ; la Junte est consultée sur les traités de commerce touchant le trafic frontalier ou le port de Trieste, art. 47 ; le Conseil régional donne un avis sur les projets de révision du Statut et le titre financier ne peut être modifié par loi ordinaire qu'après avis de la Région, art. 63 ; les normes d'application sont prises après avis d'une commission paritaire de six membres, art. 65.", source: "https://www.consiglio.regione.fvg.it/cms/export/sites/consiglio/istituzione/allegati/Allegati_istituzione_statuto/Statuto-aggiornato-gennaio-2022.pdf"}
  langue: {valeur: "partiel", note: "L'usage du frioulan est admis dans les rapports avec les collectivités locales du territoire délimité et la réponse est donnée aussi en frioulan, loi régionale n° 29/2007, art. 6 ; les élus des conseils communaux et les conseillers régionaux peuvent s'exprimer en frioulan, art. 9 ; la loi régionale n° 26/2007 protège le slovène, la loi régionale n° 20/2009 l'allemand ; le Statut ne fixe aucune langue co-officielle.", source: "https://lexview-int.regione.fvg.it/fontinormative/xml/xmlLex.aspx?anno=2007&legge=29"}
  education: {valeur: "partiel", note: "La Région adapte les lois de la République sur l'enseignement de l'école maternelle au secondaire par des normes d'intégration et d'application, Statut, art. 6 ; dans les communes du territoire délimité, le frioulan entre dans le parcours éducatif des écoles maternelles, primaires et secondaires du premier degré (collège), loi régionale n° 29/2007, art. 12 ; la garantie d'au moins une heure d'enseignement par semaine, art. 14, al. 2, a été annulée par la Cour constitutionnelle (arrêt n° 159 du 22 mai 2009).", source: "https://lexview-int.regione.fvg.it/fontinormative/xml/xmlLex.aspx?anno=2007&legge=29"}
  fiscalite: {valeur: "reconnu", note: "La Région dispose de finances propres, Statut, art. 48 ; elle reçoit 5,91 dixièmes de la TVA calculée sur la consommation régionale et de la plupart des autres impôts d'État perçus sur son territoire, art. 49 (texte en vigueur depuis 2018) ; elle peut créer des impôts propres et moduler les taux de certains impôts d'État, art. 51.", source: "https://www.consiglio.regione.fvg.it/cms/export/sites/consiglio/istituzione/allegati/Allegati_istituzione_statuto/Statuto-aggiornato-gennaio-2022.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2026 que les lois régionales du Frioul-Vénétie Julienne donnent des droits supplémentaires aux membres des minorités linguistiques historiques et que la Cour constitutionnelle a délimité les compétences de l'État et des régions en la matière (§ 20) ; il note aussi que, selon des représentants de la minorité slovène, plusieurs dispositions de la loi d'État n° 38/2001, en particulier dans le domaine culturel, ne sont pas appliquées (§ 63). La Cour constitutionnelle a annulé le 22 mai 2009 (arrêt n° 159) les art. 6, al. 2, 8, al. 1 et 3, 9, al. 3, 11, al. 5, 12, al. 3, et 14, al. 2 (dernière phrase) et 3, de la loi régionale n° 29/2007 sur le frioulan.", source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-en/48802bdf6e"}
chronologie:
  - {annee: 1963, evenement: "Loi constitutionnelle n° 1 du 31 janvier portant Statut spécial de la Région autonome Frioul-Vénétie Julienne."}
  - {annee: 1996, evenement: "Loi régionale n° 15 du 22 mars sur la protection et la promotion de la langue et de la culture frioulanes."}
  - {annee: 2001, evenement: "Loi constitutionnelle n° 2 du 31 janvier : la Région fixe par loi sa forme de gouvernement (Statut, art. 12)."}
  - {annee: 2007, evenement: "Lois régionales n° 17 (forme de gouvernement et système électoral), n° 26 (minorité slovène) et n° 29 (langue frioulane)."}
  - {annee: 2009, evenement: "La Cour constitutionnelle (arrêt n° 159) annule plusieurs dispositions de la loi régionale n° 29/2007 ; loi régionale n° 20 sur les minorités de langue allemande."}
  - {annee: 2016, evenement: "Loi constitutionnelle n° 1 du 28 juillet : suppression des provinces de la région, les communes deviennent la base de l'organisation locale (Statut, art. 59)."}
  - {annee: 2017, evenement: "Loi n° 182 du 5 décembre : la commune de Sappada/Plodn quitte la Vénétie et rejoint la Région."}
  - {annee: 2018, evenement: "Nouvel article 49 du Statut sur les quotes-parts des impôts d'État (loi n° 205/2017), en vigueur au 1er janvier ; loi régionale n° 4 du 9 février sur l'intégration de Sappada/Plodn."}
