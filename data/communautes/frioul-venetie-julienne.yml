resume: >-
  Le Frioul-Vénétie Julienne est une région autonome à statut spécial de l'Italie, régie par la loi constitutionnelle n° 1 du 31 janvier 1963. Elle couvre les territoires des anciennes provinces de Gorizia, Udine, Pordenone et Trieste ; Trieste en est le chef-lieu. L'article 3 du Statut garantit l'égalité de droits de tous les citoyens quel que soit leur groupe linguistique et la sauvegarde de leurs caractéristiques ethniques et culturelles. La Région légifère sur ses compétences propres, perçoit des quotes-parts des impôts d'État et met en œuvre des lois sur les langues frioulane, slovène et allemande. Les Frioulans et les Slovènes de la région ont chacun leur fiche (« Frioulans », « Slovènes du Frioul-Vénétie Julienne »).
