uid: "garifuna-honduras"
nom: "Communautés garífunas du Honduras"
endonyme: ""
territoire: "Littoral caraïbe du Honduras, des départements de Cortés à Gracias a Dios, et archipel de Cayos Cochinos"
etats: ["Honduras"]
region: "ameriques"
coord: [15.8, -86.5]
type: "peuple_autochtone"
types_secondaires: ["communaute_afrodescendante"]
base: "territoriale"
population: {valeur: 46448, annee: 2001, perimetre: "Garífunas recensés au Honduras (recensement de 2001, cité par la Rapporteuse spéciale des Nations unies) ; d'autres estimations citées par la Cour interaméricaine vont de 98 000 à 190 000 personnes", source: "https://undocs.org/en/A/HRC/33/42/Add.2"}
lieux: {valeur: 56, unite: "titres de propriété collective délivrés à des communautés garífunas de 1993 à 2015 (données de l'Institut national agraire, 2015)", annee: 2015, source: "https://www.forest-trends.org/wp-content/uploads/imported/honduras-brief_english_a4_final-pdf.pdf"}
surface_km2: {valeur: 323.63, annee: 2015, perimetre: "surface cumulée des 56 titres garífunas délivrés de 1993 à 2015 (32 363 ha, données de l'Institut national agraire)", source: "https://www.forest-trends.org/wp-content/uploads/imported/honduras-brief_english_a4_final-pdf.pdf"}
villages: {valeur: 47, annee: 2016, perimetre: "communautés garífunas, dont 26 situées dans une aire protégée ou à sa limite (A/HRC/33/42/Add.2, § 57)", source: "https://undocs.org/en/A/HRC/33/42/Add.2"}
resume: >-
  Les Garífunas descendent de populations caraïbes et africaines de l'île Saint-Vincent, déportées par la Grande-Bretagne vers l'île de Roatán en 1797, puis établies sur la côte caraïbe du Honduras. La loi sur la propriété de 2004 (décret 82-2004) reconnaît aux peuples autochtones et afrohonduriens la propriété collective de leurs terres traditionnelles et déclare ces terres inaliénables. De 1993 à 2015, 56 titres collectifs ont été délivrés à des communautés garífunas, pour 32 363 ha (données de l'Institut national agraire). Quatre arrêts de la Cour interaméricaine des droits de l'homme (2015, 2023, 2025) condamnent le Honduras pour atteinte à la propriété collective ou au droit de consultation de communautés garífunas.
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communauté garífuna Triunfo de la Cruz et ses membres c. Honduras (série C n° 305, 8 octobre 2015) : délimitation des terres titrées, titre collectif sur le « lot A1 », accès aux terres situées dans le parc national Punta Izopo, réforme du registre de la propriété, fonds de développement communautaire.", annee: 2015, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_305_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communauté garífuna de Punta Piedra et ses membres c. Honduras (série C n° 304, 8 octobre 2015) : assainissement (saneamiento, libération des terres occupées par des tiers) des terres titrées, arrêt du projet d'exploration Punta Piedra II non consulté, mise en conformité de la réglementation minière avec le droit à la consultation.", annee: 2015, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_304_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communauté garífuna de San Juan et ses membres c. Honduras (série C n° 496, 29 août 2023) : titre de propriété collective sur des terres de remplacement ou indemnisation, résolution des recours internes pendants, fonds de 800 000 dollars des États-Unis destiné à des projets choisis par la communauté.", annee: 2023, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_496_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communauté garífuna de Cayos Cochinos et ses membres c. Honduras (série C n° 576, 20 novembre 2025) : adoption sous trois ans d'une réglementation de la consultation préalable, libre et éclairée ; participation de la communauté au plan de gestion et à l'administration du monument naturel marin de Cayos Cochinos.", annee: 2025, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_576_esp.pdf"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Honduras partie à la Convention 169 de l'OIT depuis 1995 (A/HRC/33/42/Add.2, § 9) ; la Cour interaméricaine applique la Convention aux communautés garífunas (arrêt Cayos Cochinos, § 205).", annee: 1995, source: "https://undocs.org/en/A/HRC/33/42/Add.2"}
  - {mecanisme: "dnudpa", detail: "Le Honduras a voté en faveur de la Déclaration de 2007 ; le recensement de 2001 compte les Garífunas parmi les peuples autochtones du pays (A/HRC/33/42/Add.2, § 6 et 9).", annee: 2007, source: "https://undocs.org/en/A/HRC/33/42/Add.2"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale sur sa visite au Honduras (novembre 2015) : demandes d'extension des titres garífunas, 26 communautés sur 47 dans ou à la limite d'aires protégées, conflits liés au palmier à huile, au tourisme et aux zones d'emploi et de développement économique (§ 38, 55 à 57).", annee: 2016, source: "https://undocs.org/en/A/HRC/33/42/Add.2"}
base_nationale:
  - {instrument: "Constitution de 1982, art. 346 (devoir de l'État de protéger les droits et intérêts des communautés autochtones, en particulier sur leurs terres et forêts)", nature: "constitution", annee: 1982, source: "https://www.constituteproject.org/constitution/Honduras_2013?lang=es"}
  - {instrument: "Loi sur la modernisation et le développement du secteur agricole (décret 31-92), art. 65 : titres en pleine propriété aux communautés ethniques qui prouvent leur occupation", nature: "loi", annee: 1992, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_305_esp.pdf"}
  - {instrument: "Loi sur la propriété (Ley de Propiedad, décret 82-2004), titre V, chapitre III, art. 93 à 102", nature: "loi", annee: 2004, source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  - {instrument: "Arrêts de la Cour interaméricaine des droits de l'homme Triunfo de la Cruz (2015), Punta Piedra (2015), San Juan (2023) et Cayos Cochinos (2025)", nature: "jurisprudence", annee: 2025, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_576_esp.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi sur la propriété de 2004 reconnaît les terres possédées traditionnellement (art. 93), les titre au nom de la collectivité (art. 94) et les déclare inaliénables, insaisissables et imprescriptibles (art. 100) et interdit d'enregistrer un titre au profit de tiers (art. 102) ; l'art. 97 maintient toutefois les tiers titrés qui occupent la terre, et l'art. 100 permet aux communautés de mettre fin au régime communal ou d'affermer à des tiers.", source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  ressources: {valeur: "partiel", note: "Les aires protégées situées sur ces terres sont gérées conjointement avec l'État (loi sur la propriété de 2004, art. 101) ; en 2025, la Cour interaméricaine ordonne la participation de la communauté de Cayos Cochinos à la gestion du monument naturel marin (arrêt série C n° 576, point 8).", source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  consentement: {valeur: "partiel", note: "L'État doit informer et consulter ces peuples avant toute exploitation de ressources sur leurs terres (loi sur la propriété de 2004, art. 95) ; la Cour interaméricaine constate en 2025 l'absence de réglementation générale de la consultation et ordonne d'en adopter une sous trois ans (arrêt Cayos Cochinos, § 205 à 207) ; la loi ne prévoit pas de consentement.", source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_576_esp.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En septembre 2026, une délégation internationale demande au Honduras d'accélérer l'exécution des arrêts Triunfo de la Cruz, Punta Piedra, San Juan et Cayos Cochinos, en particulier l'assainissement du registre et le titrage des terres ancestrales ; selon les organisations qui l'accompagnent, des mesures restent en attente. L'Organisation fraternelle noire hondurienne (OFRANEH) campe alors depuis plus d'un mois devant la Cour suprême à Tegucigalpa. En 2016, la Rapporteuse spéciale des Nations unies relevait que 26 des 47 communautés garífunas se trouvent dans une aire protégée ou à sa limite, avec des restrictions d'accès et des expulsions (A/HRC/33/42/Add.2, § 57).", source: "https://www.infobae.com/america/america-latina/2026/09/20/mision-internacional-exige-a-honduras-cumplir-fallos-de-la-corte-idh-a-favor-del-pueblo-garifuna/"}
chronologie:
  - {annee: 1797, evenement: "La Grande-Bretagne déporte les Garífunas de l'île Saint-Vincent vers l'île de Roatán ; ils s'établissent ensuite sur la côte caraïbe du Honduras."}
  - {annee: 1982, evenement: "Constitution, art. 346 : devoir de l'État de protéger les terres et forêts des communautés autochtones."}
  - {annee: 1993, evenement: "Premiers titres collectifs garífunas de la série recensée par l'Institut national agraire (6 titres, 5 126 ha)."}
  - {annee: 1995, evenement: "Le Honduras ratifie la Convention 169 de l'OIT."}
  - {annee: 2002, evenement: "L'Institut national agraire délivre trois titres collectifs aux communautés de Chachahuate, East End et Bolaños (Cayos Cochinos) ; le registre refuse de les inscrire, l'inscription n'intervient qu'en 2006 et 2007 après un arrêt de la chambre constitutionnelle de la Cour suprême (2005)."}
  - {annee: 2004, evenement: "Loi sur la propriété (décret 82-2004) : titrage collectif et inaliénabilité des terres autochtones et afrohonduriennes."}
  - {annee: 2015, evenement: "Arrêts de la Cour interaméricaine Triunfo de la Cruz et Punta Piedra (8 octobre) ; visite de la Rapporteuse spéciale des Nations unies en novembre."}
  - {annee: 2023, evenement: "Arrêt de la Cour interaméricaine Communauté garífuna de San Juan (29 août)."}
  - {annee: 2025, evenement: "Arrêt de la Cour interaméricaine Communauté garífuna de Cayos Cochinos (20 novembre)."}
  - {annee: 2026, evenement: "Délégation internationale sur l'exécution des quatre arrêts ; campement de l'OFRANEH devant la Cour suprême."}
