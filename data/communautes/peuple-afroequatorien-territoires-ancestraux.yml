  - {instrument: "Loi organique des terres rurales et territoires ancestraux (supplément du Registre officiel n° 711, 14 mars 2016), art. 23 et 77 à 83", nature: "loi_organique", annee: 2016, source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  - {instrument: "Loi des droits collectifs des peuples noirs ou afroéquatoriens (2006), sans disposition sur la reconnaissance ou la titularisation des territoires", nature: "loi", annee: 2006, source: "https://law.utexas.edu/wp-content/uploads/sites/31/2016/02/ecuador-esp.pdf"}
  - {instrument: "Loi de développement agraire (codification de 2004), art. 49 : légalisation des terres afroéquatoriennes de possession ancestrale", nature: "loi", annee: 2004, source: "https://law.utexas.edu/wp-content/uploads/sites/31/2016/02/ecuador-esp.pdf"}
  - {instrument: "Loi d'organisation et de régime des communes (Ley de Comunas, 1937)", nature: "loi", annee: 1937, source: "https://law.utexas.edu/wp-content/uploads/sites/31/2016/02/ecuador-esp.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Formes propres d'organisation et d'exercice de l'autorité sur les territoires reconnus (Constitution, art. 57.9, applicable par l'art. 58) ; comunas reconnues comme forme ancestrale d'organisation territoriale (art. 60) ; administration et contrôle social du territoire par les autorités propres (loi de 2016, art. 23) ; aucune circonscription territoriale afroéquatorienne constituée selon l'art. 257 en 2009.", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Droit de créer et d'appliquer un droit propre ou coutumier sans porter atteinte aux droits constitutionnels (Constitution, art. 57.10, applicable par l'art. 58) ; les pratiques de droit propre sur l'accès à la terre valent normes d'administration interne (loi de 2016, art. 81 d).", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  justice_propre: {valeur: "partiel", note: "Les conflits de possession, d'usage et d'usufruit des terres communautaires et territoires ancestraux des comunas, communautés, peuples et nationalités sont résolus selon leurs pratiques et leur droit propre ou coutumier (loi organique de 2016, art. 83) ; la juridiction propre de l'art. 171 de la Constitution ne vise que les autorités autochtones.", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  terres: {valeur: "reconnu", note: "Propriété imprescriptible, inaliénable, insaisissable et indivisible des terres communautaires et adjudication gratuite des territoires ancestraux (Constitution, art. 57.4 et 57.5, applicables par l'art. 58) ; adjudication perpétuelle et gratuite aux afroéquatoriens (loi de 2016, art. 23) ; 38 titres collectifs dans la province d'Esmeraldas en 2009.", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  ressources: {valeur: "partiel", note: "Participation à l'usage, à l'usufruit, à l'administration et à la conservation des ressources naturelles renouvelables (Constitution, art. 57.6 ; loi de 2016, art. 23) ; pas de maîtrise des ressources non renouvelables.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  consentement: {valeur: "partiel", note: "Consultation préalable, libre et informée sur les ressources non renouvelables et consultation prélégislative (Constitution, art. 57.7 et 57.17) ; sans consentement, il est procédé « conformément à la Constitution et à la loi ». Le CERD relève en 2017 (par. 18) que ce droit, reconnu aux Afro-Équatoriens, manque d'application effective.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/ECU/CO/23-24&l=fr&t=pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Droit à un système d'éducation interculturelle bilingue dont l'administration est « collective et participative » (Constitution, art. 57.14, applicable par l'art. 58).", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Droit de participer par des représentants aux organismes officiels déterminés par la loi et à la définition des politiques publiques qui les concernent (Constitution, art. 57.16, applicable par l'art. 58) ; aucun siège réservé trouvé.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2017, le CERD se dit particulièrement préoccupé par la situation des Afro-Équatoriens d'Esmeraldas face à l'exploitation minière et aux coupes de bois illégales (par. 16). En 2009, une délégation du Rapoport Center (université du Texas) relève qu'aucune circonscription territoriale afroéquatorienne n'a été constituée, que la loi de 2006 n'a pas de règlement d'application et que les coupes de bois, les plantations de palmier à huile et l'élevage de crevettes réduisent les territoires ancestraux du nord d'Esmeraldas.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/ECU/CO/23-24&l=fr&t=pdf"}
chronologie:
  - {annee: 1937, evenement: "Loi d'organisation et de régime des communes : les communautés de plus de cinquante personnes usant collectivement de la terre peuvent être reconnues comme comunas."}
  - {annee: 1998, evenement: "La Constitution reconnaît les Afroéquatoriens comme peuple (art. 83 et 84) et prévoit des circonscriptions territoriales afroéquatoriennes (art. 224)."}
  - {annee: 2004, evenement: "Codification de la loi de développement agraire : l'art. 49 charge l'Institut national de développement agraire de légaliser les terres afroéquatoriennes de possession ancestrale."}
  - {annee: 2006, evenement: "Loi des droits collectifs des peuples noirs ou afroéquatoriens, adoptée sans volet foncier."}
  - {annee: 2008, evenement: "Constitution : droits collectifs du peuple afroéquatorien (art. 58), circonscriptions territoriales et comunas (art. 60 et 257)."}
  - {annee: 2009, evenement: "38 communautés afroéquatoriennes d'Esmeraldas détiennent un titre collectif ; aucune circonscription territoriale afroéquatorienne constituée."}
  - {annee: 2016, evenement: "Loi organique des terres rurales et territoires ancestraux : adjudication perpétuelle et gratuite aux afroéquatoriens (art. 23)."}
  - {annee: 2017, evenement: "Observations finales du CERD sur la situation des Afro-Équatoriens d'Esmeraldas."}
fiabilite:
  verifie: ["Articles 56, 57, 58, 60, 171 et 257 de la Constitution de 2008 (édition de l'Assemblée nationale).", "Articles 23 et 77 à 83 de la loi organique de 2016 (texte publié par la FAO, dernière réforme du 25 mars 2022).", "Paragraphes 16 à 18 des observations finales du CERD de 2017 et paragraphes 10 et 12 de celles de 2008.", "Chiffre de 38 communautés titulaires (titres obtenus en application de la loi de développement agraire de 1994 selon la même source), absence de circonscription territoriale, contenu de la loi de 2006 et de l'art. 49 de la loi de 2004, d'après le rapport du Rapoport Center (2009), qui cite J. Antón Sánchez (CODAE).", "Part de 43,9 % d'Afroéquatoriens dans la province d'Esmeraldas en 2010 (fiche provinciale de l'INEC)."]
  non_confirme: ["Aucune liste officielle des 38 titres collectifs ni surface totale n'a été trouvée ; le chiffre date de 2009 et n'a pas été actualisé.", "Le texte de la loi de 2006 et celui de l'art. 49 de la loi de 2004 n'ont pas été consultés directement.", "L'article 171 (juridiction propre) ne vise que les autorités autochtones ; son application aux communautés afroéquatoriennes n'est pas établie.", "Constitution d'une circonscription territoriale afroéquatorienne après 2009 : non vérifiée.", "Population afroéquatorienne du recensement de 2022 non consultée sur une source primaire."]
