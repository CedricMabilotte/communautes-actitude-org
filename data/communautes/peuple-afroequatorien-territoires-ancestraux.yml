resume: >-
  La Constitution équatorienne de 2008 nomme le peuple afroéquatorien parmi les composantes de l'État (art. 56) et lui reconnaît les droits collectifs établis par la Constitution, la loi et les instruments internationaux (art. 58), ce qui lui étend les droits de l'article 57 (lecture que retient le préambule de la loi organique de 2016 pour les numéros 4 à 6) : propriété imprescriptible et inaliénable des terres communautaires, adjudication gratuite des territoires ancestraux, formes propres d'autorité, consultation préalable. L'article 60 permet aux peuples afroéquatoriens de constituer des circonscriptions territoriales (régime d'administration spéciale d'une paroisse, d'un canton ou d'une province) et reconnaît les comunas (communes rurales à propriété collective de la terre) comme forme ancestrale d'organisation territoriale. Dans la province d'Esmeraldas, 38 communautés afroéquatoriennes détenaient en 2009 un titre collectif sur leurs terres ancestrales ; aucune circonscription territoriale afroéquatorienne n'avait été constituée.
