resume: >-
  Fiche agrégée : elle couvre les aires communautaires de gestion des ressources (Community Resource Management Areas, CREMA), c'est-à-dire des zones délimitées hors des aires protégées où plusieurs communautés voisines se regroupent pour gérer la faune, les arbres et les autres ressources naturelles. Le dispositif, lancé par la Division de la faune de la Commission des forêts à partir de la politique de gestion communautaire des ressources de 2000, repose sur une constitution, des règlements locaux (bylaws) et un plan de gestion ; le ministre chargé des ressources naturelles délègue l'autorité de gestion par un certificat de dévolution. La loi sur la gestion des ressources fauniques de 2023 (Wildlife Resources Management Act, 2023, Act 1115), promulguée le 1er mars 2024, donne une base législative aux CREMA (sections 16 à 18). En avril 2025, la Commission des forêts dénombrait 63 CREMA, dont 33 avec certificat de dévolution sur 784 999,75 ha.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Ghana à la Convention sur la diversité biologique (décembre 2018) : décrit les CREMA comme des aires délimitées hors des aires protégées gérées par des communautés dotées d'un organe exécutif et d'une constitution, et indique que 22 CREMA ont été créées depuis 2003.", annee: 2018, source: "https://www.cbd.int/doc/nr/nr-06/gh-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi sur la préservation des animaux sauvages de 1961 (Wild Animals Preservation Act, 1961, Act 43), section 1 : le ministre peut nommer des agents honoraires de la faune (honorary game officers), base invoquée pour la délivrance des certificats de dévolution", nature: "loi", annee: 1961, source: "https://faolex.fao.org/docs/pdf/gha40827.pdf"}
  - {instrument: "Loi sur la gestion des ressources fauniques de 2023 (Wildlife Resources Management Act, 2023, Act 1115), sections 16 à 18 sur les CREMA ; adoptée par le Parlement le 28 juillet 2023, promulguée le 1er mars 2024", nature: "loi", annee: 2023, source: "https://thedocs.worldbank.org/en/doc/4b347cebf3722a5af3500909c71ea022-0320052025/original/7-CREMA.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque CREMA se dote d'une constitution ratifiée par les représentants des communautés et les autorités coutumières, d'un comité de gestion des ressources (Community Resource Management Committee) nommé ou élu en assemblée de village dans chaque communauté, et d'un comité exécutif (CREMA Executive Committee) élu parmi ces comités ; le ministre délivre à ce comité un certificat de dévolution qui lui donne l'autorité de gestion des ressources naturelles. La Commission des forêts rattache ce certificat à la section 1 de la loi de 1961 (Act 43) et aux sections 16 à 18 de la loi de 2023 (Act 1115).", source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3720029/"}
  pouvoir_normatif: {valeur: "partiel", note: "Les règles d'usage de chaque CREMA sont rédigées sous forme de règlements de district (bylaws, c'est-à-dire des actes réglementaires de l'assemblée de district), puis débattues et ratifiées par l'assemblée générale de l'assemblée de district ; la norme obligatoire est donc adoptée par la collectivité locale, non par la CREMA.", source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3720029/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le certificat de dévolution délivré par le ministre donne au comité exécutif de la CREMA le droit de gérer les ressources forestières et la faune dans les limites de la CREMA, selon un plan de gestion ; la Constitution de 1992 laisse la propriété du sol aux autorités coutumières (stools et skins, c'est-à-dire les chefferies) et le droit de gérer les ressources naturelles à l'État. La loi de 2023 (Act 1115, sections 16 à 18) donne une base législative au dispositif.", source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3720029/"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
