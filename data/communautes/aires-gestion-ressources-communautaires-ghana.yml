effectivite: {valeur: "partielle", note: "Un article à comité de lecture de 2013 (Philosophical Transactions of the Royal Society B) rapporte des évaluations selon lesquelles des CREMA restent faibles ou sont abandonnées quand le processus est conduit par l'État ou une ONG tenus par des financements de projet, et une revue de six CREMA de la région occidentale relevant un manque de moyens humains, financiers et matériels. En avril 2025, la Commission des forêts indiquait que beaucoup de CREMA deviennent inactives à la fin des projets et que 33 des 63 CREMA avaient reçu un certificat de dévolution.", source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3720029/"}
chronologie:
  - {annee: 1961, evenement: "Loi sur la préservation des animaux sauvages (Act 43) : le ministre peut nommer des agents honoraires de la faune."}
  - {annee: 1994, evenement: "Politique forestière et faunique : principe d'une gestion des ressources par les communautés hors des aires protégées."}
  - {annee: 2000, evenement: "Politique de gestion communautaire des ressources de la Division de la faune, qui fonde le dispositif des CREMA."}
  - {annee: 2003, evenement: "Création des premières CREMA."}
  - {annee: 2010, evenement: "La Division de la faune suit 26 CREMA, dont 18 inaugurées."}
  - {annee: 2012, evenement: "Nouvelle politique forestière et faunique, qui retient les CREMA pour les forêts hors réserves."}
  - {annee: 2023, evenement: "Le 28 juillet, le Parlement adopte la loi sur la gestion des ressources fauniques (Act 1115)."}
  - {annee: 2024, evenement: "Promulgation de l'Act 1115 le 1er mars. En octobre, 30 CREMA sont en cours de constitution sur 1 393 257,18 ha."}
  - {annee: 2025, evenement: "En avril, la Commission des forêts recense 63 CREMA, dont 33 avec certificat de dévolution."}
  - {annee: 2026, evenement: "En février, le ministère des Terres et des Ressources naturelles ouvre une consultation sur un projet de règlement d'application (Legislative Instrument) relatif aux CREMA."}
fiabilite:
  verifie: ["Présentation de la Division de la faune de la Commission des forêts (avril 2025, publiée par la Banque mondiale) : base légale (section 1 de l'Act 43 de 1961 pour le certificat de dévolution ; sections 16 à 18 de l'Act 1115), constitution, règlements et plan de gestion, dévolution par publication ministérielle, 63 CREMA, 30 en constitution sur 1 393 257,18 ha, 33 avec certificat de dévolution sur 784 999,75 ha, règlements de 14 des 18 CREMA du projet de restauration des paysages publiés.", "Section 1 de l'Act 43 de 1961 (texte FAOLEX) : nomination d'agents honoraires de la faune par le ministre.", "Politique forestière et faunique de 2012 (texte FAOLEX) : mention des CREMA pour les forêts hors réserves et la gestion de la faune.", "Graphic Online, 10 avril 2024 : adoption par le Parlement le 28 juillet 2023, promulgation le 1er mars 2024, base légale donnée aux CREMA.", "Ministère des Terres et des Ressources naturelles, 17 février 2026 : consultation sur un projet de règlement d'application ; critères envisagés, dont le consentement des assemblées de district et des autorités coutumières.", "Sixième rapport national du Ghana à la CDB (2018) : description des CREMA, 22 CREMA créées depuis 2003.", "Asare, Kyei et Mason (2013) : comités communautaires et comité exécutif, règlements ratifiés par l'assemblée de district, 26 CREMA suivies en 2010."]
  non_confirme: ["Le texte de l'Act 1115 n'a pas pu être consulté directement : le contenu des sections 16 à 18 est rapporté d'après la Commission des forêts ; la mention d'une dévolution « par publication ministérielle » et les droits exacts conférés restent à vérifier sur le texte.", "L'intitulé officiel porte l'année 2023 selon le ministère et la Commission des forêts, 2024 selon Graphic Online.", "Le projet de règlement d'application de 2026 n'était pas adopté à la date de la fiche.", "Aucune liste officielle et complète des 63 CREMA avec leurs surfaces n'a été trouvée ; la présentation de 2025 ne donne que des listes partielles par projet, d'où l'absence de tableau.", "Des règlements de CREMA publiés au Journal officiel (Bosomtwe en 2014, Amenfi West et Amenfi Central en 2016, Wassa East en 2019) figurent dans l'index de GhaLII, mais les numéros n'ont pas pu être ouverts.", "Population et nombre de localités concernées non chiffrés par les sources ouvertes.", "Le sixième rapport national à la CDB porte la mention « Draft » sur sa couverture.", "La présentation de 2025 écrit « sixty (63) CREMAs » ; le total de 63 concorde avec 30 CREMA en constitution et 33 avec certificat de dévolution.", "L'article de 2013 qui source l'effectivité compte un coauteur de la Division de la faune ; aucune évaluation entièrement indépendante et récente n'a pu être ouverte."]
