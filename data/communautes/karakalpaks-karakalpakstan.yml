resume: >-
  La République souveraine du Karakalpakstan fait partie de l'Ouzbékistan, qui protège sa souveraineté. Elle a sa propre constitution, un parlement (Jokargy Kenes) et un gouvernement, et ses frontières ne peuvent être modifiées sans son consentement. La Constitution ouzbèke de 2023 lui reconnaît le droit de faire sécession par un référendum de son peuple (art. 89). En juillet 2022, un projet de révision qui supprimait ce droit a provoqué des manifestations à Noukous ; le projet a été abandonné.
