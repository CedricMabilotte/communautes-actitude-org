base_nationale:
  - {instrument: "Constitution de la République d'Ouzbékistan, art. 85 à 90", nature: "constitution", annee: 2023, source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  - {instrument: "Constitution de la République du Karakalpakstan", nature: "statut_autonomie", annee: 1993, source: "https://fpc.org.uk/the-curious-case-of-the-republic-of-karakalpakstan/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "République souveraine dotée de sa propre constitution, Constitution de 2023, art. 85 et 86 ; parlement (Jokargy Kenes) dont les élections sont prévues par la Constitution ouzbèke ; le chef du gouvernement du Karakalpakstan siège au Cabinet des ministres de l'Ouzbékistan.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Karakalpakstan adopte sa constitution et ses lois, qui ne peuvent contredire celles de l'Ouzbékistan, dont les lois s'appliquent sur son territoire, Constitution de 2023, art. 86 et 87 ; la Cour constitutionnelle contrôle leur conformité.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le territoire et les frontières du Karakalpakstan ne peuvent être modifiés sans son consentement ; il fixe seul son organisation administrative et territoriale, Constitution de 2023, art. 88.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Les procédures judiciaires se déroulent en ouzbek, en karakalpak ou dans la langue de la majorité locale, Constitution de 2023, art. 139 ; la Constitution du Karakalpakstan (art. 1) donne au karakalpak un statut égal à l'ouzbek (Foreign Policy Centre, 2020).", source: "https://fpc.org.uk/the-curious-case-of-the-republic-of-karakalpakstan/"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le budget du Karakalpakstan est une composante du budget de l'État, Constitution de 2023, art. 148 ; un seul système financier, monétaire et bancaire pour tout le pays.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  representation: {valeur: "reconnu", note: "Quatre sénateurs élus parmi les députés du Jokargy Kenes, un vice-président du Sénat représentant le Karakalpakstan, un juge de la Cour constitutionnelle issu du Karakalpakstan et droit d'initiative législative de son parlement, Constitution de 2023.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  statut_personnel: {valeur: "reconnu", note: "Citoyenneté du Karakalpakstan, qui vaut citoyenneté de l'Ouzbékistan, Constitution de 2023, chapitre sur la citoyenneté.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  autodetermination_externe: {valeur: "reconnu", note: "Le Karakalpakstan a le droit de faire sécession de l'Ouzbékistan sur la base d'un référendum de son peuple, Constitution de 2023, art. 89 (art. 74 de la Constitution de 1992) ; les litiges entre les deux républiques se règlent par voie diplomatique, art. 90.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
effectivite: {valeur: "contestee", note: "Selon le parquet général cité par la Haute-Commissaire aux droits de l'homme, les manifestations de juillet 2022 contre la suppression du droit de sécession ont fait 18 morts et 243 blessés ; Human Rights Watch (2024) compte au moins 21 morts et relève la condamnation du juriste et blogueur Dauletmurat Tazhimuratov, qui avait appelé aux manifestations, à 16 ans de prison ; le Foreign Policy Centre (2020) décrit un parlement qui entérine les décisions de Tachkent.", source: "https://www.ohchr.org/en/press-releases/2022/07/bachelet-calls-urgent-probe-deadly-protest-uzbek-city-nukus"}
chronologie:
  - {annee: 1990, evenement: "Déclaration de souveraineté du Karakalpakstan."}
  - {annee: 1992, evenement: "La Constitution de l'Ouzbékistan reconnaît le droit de sécession du Karakalpakstan (art. 74)."}
  - {annee: 1993, evenement: "Accord de rattachement à l'Ouzbékistan, prévoyant un référendum après vingt ans selon le Foreign Policy Centre."}
  - {annee: 2022, evenement: "Manifestations de Noukous (1er-2 juillet) contre la suppression de la souveraineté et du droit de sécession ; projet abandonné."}
  - {annee: 2023, evenement: "Nouvelle Constitution de l'Ouzbékistan ; le droit de sécession est maintenu (art. 89)."}
