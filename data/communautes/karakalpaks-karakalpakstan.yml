  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/UZB/CO/13-14, 4 juin 2026) : section sur la situation du groupe ethnique karakalpak et section sur la réponse de l'État aux manifestations de juillet 2022 ; le Comité demande de garantir le statut souverain et autonome de la République du Karakalpakstan prévu par la Constitution.", annee: 2026, source: "https://documents.un.org/api/symbol/access?s=CERD/C/UZB/CO/13-14&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République d'Ouzbékistan, art. 85 à 90", nature: "constitution", annee: 2023, source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  - {instrument: "Constitution de la République du Karakalpakstan, adoptée le 9 avril 1993 par le Conseil suprême, modifiée en dernier lieu le 12 février 2021", nature: "statut_autonomie", annee: 1993, source: "https://joqargikenes.uz/ru/constitution-of-the-republic-of-karakalpakstan/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "République souveraine dotée de sa propre constitution, Constitution de l'Ouzbékistan de 2023, art. 85 et 86 ; parlement (Jokargy Kenes, « Conseil suprême ») de 65 députés élus pour cinq ans et Conseil des ministres formé par lui, Constitution du Karakalpakstan, art. 68, 69, 86 et 87 ; le chef du gouvernement du Karakalpakstan siège au Cabinet des ministres de l'Ouzbékistan, Constitution de 2023, art. 114.", source: "https://joqargikenes.uz/ru/constitution-of-the-republic-of-karakalpakstan/"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Jokargy Kenes adopte et modifie la constitution et les lois du Karakalpakstan (Constitution du Karakalpakstan, art. 70) ; la Constitution du Karakalpakstan ne peut contredire celle de l'Ouzbékistan, dont les lois s'appliquent sur son territoire, Constitution de 2023, art. 86 et 87 ; la Cour constitutionnelle de l'Ouzbékistan se prononce sur leur conformité.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  justice_propre: {valeur: "partiel", note: "La Constitution du Karakalpakstan prévoit une Cour de la République du Karakalpakstan, plus haute juridiction civile, pénale et économique, et un tribunal administratif de la République (art. 102 et 105) ; l'organisation judiciaire est fixée par la loi de l'Ouzbékistan, Constitution de 2023, art. 131.", source: "https://joqargikenes.uz/ru/constitution-of-the-republic-of-karakalpakstan/"}
  terres: {valeur: "partiel", note: "Le territoire et les frontières du Karakalpakstan ne peuvent être modifiés sans son consentement ; il fixe seul son organisation administrative et territoriale, Constitution de 2023, art. 88 ; la terre, le sous-sol et les eaux sont une richesse nationale protégée par l'État, Constitution du Karakalpakstan, art. 53.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Le karakalpak et l'ouzbek sont langues d'État de la République du Karakalpakstan, Constitution du Karakalpakstan, art. 4 ; les procédures judiciaires se déroulent en ouzbek, en karakalpak ou dans la langue de la majorité locale, Constitution de l'Ouzbékistan de 2023, art. 139.", source: "https://joqargikenes.uz/ru/constitution-of-the-republic-of-karakalpakstan/"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le Jokargy Kenes approuve le budget de l'État du Karakalpakstan sur proposition du Conseil des ministres (Constitution du Karakalpakstan, art. 70) ; ce budget est une composante du budget de l'État de l'Ouzbékistan, qui a un seul système financier, monétaire et bancaire, Constitution de 2023, art. 147 et 148.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  representation: {valeur: "reconnu", note: "Quatre sénateurs élus parmi les députés du Jokargy Kenes (art. 92), un vice-président du Sénat représentant le Karakalpakstan (art. 101), droit d'initiative législative de son parlement (art. 98), un juge de la Cour constitutionnelle représentant le Karakalpakstan (art. 132) et des membres de la Commission électorale centrale proposés par le Jokargy Kenes (art. 129), Constitution de 2023.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  statut_personnel: {valeur: "reconnu", note: "Un citoyen de la République du Karakalpakstan est en même temps citoyen de l'Ouzbékistan, Constitution de 2023, art. 22.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
  autodetermination_externe: {valeur: "reconnu", note: "Le Karakalpakstan a le droit de faire sécession de l'Ouzbékistan par un référendum de l'ensemble du peuple du Karakalpakstan, Constitution de 2023, art. 89 (art. 74 de la Constitution de 1992 ; art. 1 de la Constitution du Karakalpakstan) ; les litiges entre les deux républiques se règlent par voie diplomatique, art. 90.", source: "https://www.constituteproject.org/constitution/Uzbekistan_2023"}
effectivite: {valeur: "contestee", note: "Le Comité pour l'élimination de la discrimination raciale (juin 2026) relève une participation limitée des Karakalpaks à la vie publique qui affecte dans la pratique le statut souverain et autonome de la République, des pouvoirs de décision locaux restreints, des ingérences des autorités centrales, un recul de l'usage du karakalpak et des obstacles à son usage dans les démarches administratives ; il compte au moins 21 manifestants tués en juillet 2022. Le parquet général, cité par la Haute-Commissaire aux droits de l'homme en 2022, comptait 18 morts et 243 blessés. Human Rights Watch relève la condamnation du juriste et blogueur Dauletmurat Tazhimuratov à 16 ans de prison (2024), l'avis du Groupe de travail de l'ONU sur la détention arbitraire qualifiant sa détention d'arbitraire et des poursuites en 2025 contre des militants karakalpaks pour « séparatisme » (2026). Le Foreign Policy Centre (2020) décrit un parlement qui entérine les décisions de Tachkent.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/UZB/CO/13-14&l=en&t=pdf"}
chronologie:
  - {annee: 1990, evenement: "Déclaration de souveraineté du Karakalpakstan."}
  - {annee: 1992, evenement: "La Constitution de l'Ouzbékistan reconnaît le droit de sécession du Karakalpakstan (art. 74)."}
  - {annee: 1993, evenement: "Adoption de la Constitution du Karakalpakstan par le Conseil suprême (9 avril) ; selon le Foreign Policy Centre, le rattachement à l'Ouzbékistan prévoyait un référendum sur l'indépendance vingt ans plus tard."}
  - {annee: 2022, evenement: "Manifestations de Noukous (1er-2 juillet) contre la suppression de la souveraineté et du droit de sécession ; projet abandonné."}
  - {annee: 2023, evenement: "Nouvelle Constitution de l'Ouzbékistan ; le droit de sécession est maintenu (art. 89)."}
  - {annee: 2024, evenement: "Une commission parlementaire créée en juillet 2022 remet en décembre son rapport sur les violations commises pendant les manifestations, selon la délégation ouzbèke devant le CERD."}
  - {annee: 2025, evenement: "Le Groupe de travail de l'ONU sur la détention arbitraire qualifie d'arbitraire la détention de Dauletmurat Tazhimuratov (avis no 62/2024)."}
  - {annee: 2026, evenement: "Observations finales du Comité pour l'élimination de la discrimination raciale sur l'Ouzbékistan, avec une section sur les Karakalpaks et une sur juillet 2022."}
