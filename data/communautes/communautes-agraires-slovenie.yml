droits:
  autogouvernement: {valeur: "partiel", note: "Chaque communauté a pour organes l'assemblée générale (občni zbor) composée de tous les membres, un président et son adjoint, un conseil d'administration et un conseil de surveillance ; à 25 membres ou moins, elle peut n'avoir que l'assemblée, le président et son adjoint, l'assemblée exerçant alors les fonctions des deux conseils (ZAgrS 2015, art. 19 et 20). La communauté règle librement les rapports entre membres dans les limites de la loi (art. 5). Elle n'est pas une personne morale (entité dotée de droits propres), mais peut agir en justice et devant l'administration, sauf en matière fiscale (art. 7) ; ses compétences se limitent aux biens détenus en copropriété ou en propriété commune par ses membres.", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2015-01-2871"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée adopte l'acte fondateur (temeljni akt), qui fixe les organes, les droits et obligations des membres, le règlement des litiges entre membres et l'usage des excédents (ZAgrS 2015, art. 13 et 20). Ces règles ne valent qu'entre membres et dans le cadre de la loi ; la vente d'un bien entier et l'achat de terres exigent la présence d'un agent de l'unité administrative ou d'un notaire à l'assemblée (art. 21, al. 6).", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2015-01-2871"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les membres sont inscrits au registre foncier comme copropriétaires ou propriétaires en commun des biens restitués (ZAgrS 2015, art. 2). Le bien en tant que tout ne peut être aliéné ni divisé, sauf exceptions limitées (art. 6 et 41). La communauté, puis les membres, puis les membres associés, puis les résidents de la commune ont un droit de préemption sur les parts vendues (art. 42). La part d'un membre ne passe qu'à un seul héritier (art. 49) ; sous la loi de 1994, seul un héritier membre pouvait hériter en nature (ZPVAS 1994, art. 8).", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2015-01-2871"}
  ressources: {valeur: "partiel", note: "La loi de 1994 restitue la propriété et les droits d'usage sur le bien d'autrui (pâturage, ramassage de litière, coupe de bois, abreuvement du bétail) retirés après 1945 (ZPVAS 1994, art. 1). Les membres exercent sur ces biens des activités agricoles et forestières ; la gestion courante couvre l'exploitation des forêts, l'usage des terres agricoles et leur mise en location (ZAgrS 2015, art. 40 et 46) ; les ventes autorisées restent soumises aux lois sur les terres agricoles et les forêts (art. 41, al. 2). L'article 11 de la loi de 1994, qui soumettait l'exploitation aux règlements applicables et aux règles de la communauté, a cessé de s'appliquer sept ans après l'entrée en vigueur de la loi de 2015 (ZAgrS, art. 63).", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2015-01-2871"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Toutes les recettes et dépenses passent par un compte propre de la communauté ; l'assemblée vote le programme annuel, le plan financier et la répartition de l'excédent entre membres, et l'acte fondateur peut créer un fonds de réserve (ZAgrS 2015, art. 12 et 20). La communauté n'a pas de pouvoir fiscal et ne peut être partie à une procédure fiscale (art. 7) ; chaque membre est imposé pour sa part, selon le manuel du ministère de l'Agriculture (2016, point 8.1).", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2015-01-2871"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de l'Institut de géographie Anton Melik (ZRC SAZU, 2025) relève que, début 2025, 44 des 638 communautés recensées en 2013 étaient inscrites au registre national créé par la loi de 2015. Dans le nord et le centre de la Haute-Carniole (Gorenjska), 52 des 108 communautés recensées sont actives ; l'activité des 56 autres n'a pu être établie. L'autrice note que l'absence de personnalité juridique gêne leur fonctionnement et que les communautés ont peu de poids dans la gestion du parc national du Triglav, dont leurs terres couvrent 23 %. L'Association des représentants des communautés agraires de Slovénie compte 114 communautés membres.", source: "https://ojs-gr.zrc-sazu.si/gv/article/view/9341"}
chronologie:
  - {annee: 1947, evenement: "Loi sur les communautés agraires (Uradni list LRS 52/47) : suppression des communautés agraires et nationalisation de leurs biens, environ un millier selon certaines estimations."}
  - {annee: 1965, evenement: "Loi sur la disposition des biens des anciennes communautés agraires (Uradni list SRS 7/65, texte consolidé)."}
  - {annee: 1994, evenement: "Loi ZPVAS (Uradni list RS 5/1994), adoptée le 25 janvier : rétablissement des communautés agraires et restitution de leurs biens et droits."}
  - {annee: 2005, evenement: "Décision de la Cour constitutionnelle U-I-217/03 : le régime successoral de la loi de 1994 ne s'applique qu'aux biens restitués selon cette loi, pas à ceux restitués par dénationalisation."}
  - {annee: 2015, evenement: "Loi sur les communautés agraires (ZAgrS, Uradni list RS 74/2015), adoptée le 23 septembre."}
  - {annee: 2016, evenement: "Ouverture du registre national des communautés agraires le 1er janvier (ZAgrS, art. 59)."}
  - {annee: 2022, evenement: "Fin de l'application de l'article 11 de la loi de 1994, sept ans après l'entrée en vigueur de la loi de 2015 (ZAgrS, art. 63)."}
fiabilite:
  verifie: ["Texte de la loi ZAgrS (Uradni list RS 74/2015), notamment art. 2, 5 à 7, 12, 13, 15, 19 à 21, 41, 42, 49, 59 et 63 : Uradni list.", "Texte de la loi ZPVAS (Uradni list RS 5/1994), art. 1 à 11 : Uradni list.", "638 communautés aux registres, 547 ayant récupéré des biens, 77 486,47 ha soit 3,67 % du territoire, concentration à Tolmin, Radovljica, Jesenice, Sežana et Postojna, 3 à 513 membres : manuel du ministère de l'Agriculture, avril 2016, citant Premrl (2013).", "La loi de 2015 ne s'applique pas aux communautés pastorales (pašne skupnosti) : manuel du ministère, point 13.1.", "Décision U-I-217/03 de la Cour constitutionnelle (Uradni list RS 37/2005) : commentaire de la Constitution, art. 67, par K. Zupančič sur e-KURS.", "44 communautés au registre national début 2025 (données du ministère), 52 actives sur 108 en Haute-Carniole, 114 membres de l'association nationale : M. Šmid Hribar, Geografski vestnik 97-1 (2025)."]
  non_confirme: ["Nombre de communautés actives à l'échelle nationale : aucun recensement postérieur à 2013 ; l'association nationale estime qu'environ la moitié sont actives (citée par Šmid Hribar, 2025). Aucune liste publique des communautés n'a été trouvée.", "Nombre total de membres : aucune source ; seule la moyenne de 34 membres par communauté est publiée.", "Nombre de communautés supprimées en 1947 : environ un millier selon le manuel du ministère, 1 000 à 1 500 selon Cerar et al. (2011), cités par Šmid Hribar (2025) ; aucune source primaire.", "L'acte fondateur règle les litiges entre membres (ZAgrS, art. 13), mais aucune instance propre de jugement reconnue par l'État n'a été trouvée ; les recours contre les décisions de l'assemblée vont au tribunal (art. 36).", "Aucun document de l'ONU, de la Convention sur la diversité biologique ou du Conseil de l'Europe visant ce régime n'a été trouvé."]
