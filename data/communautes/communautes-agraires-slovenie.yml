resume: >-
  Fiche agrégée : elle couvre les communautés agraires (agrarne skupnosti) de Slovénie, groupements de copropriétaires de forêts, de pâturages et d'alpages issus des anciennes communautés villageoises (soseske, srenje), supprimées par la loi de 1947 et dont les biens avaient été nationalisés. La loi de 1994 sur le rétablissement des communautés agraires et la restitution de leurs biens et droits (ZPVAS, Uradni list RS 5/1994) a permis leur reconstitution et la restitution des terres et des droits d'usage. La loi de 2015 sur les communautés agraires (ZAgrS, Uradni list RS 74/2015) fixe leur organisation : registre national tenu par le ministère de l'Agriculture, assemblée générale de tous les membres, règles propres (temeljni akt, acte fondateur), interdiction de vendre ou de diviser les biens sauf exceptions, héritage par un seul héritier. Une analyse de 2013, reprise par le ministère, compte 638 communautés aux registres des unités administratives, dont 547 ayant récupéré des biens, sur 77 486 ha ; début 2025, 44 d'entre elles figuraient au registre national ouvert en 2016. Les communautés pastorales (pašne skupnosti) relèvent d'un régime distinct, non couvert par cette fiche.
