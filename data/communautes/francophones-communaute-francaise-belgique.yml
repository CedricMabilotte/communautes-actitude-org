resume: >-
  La Constitution belge compte trois communautés, dont la Communauté française (art. 2), et quatre régions linguistiques, dont la région de langue française (art. 4). La Communauté française a un parlement de 94 membres et un gouvernement propres. Son parlement adopte des décrets (normes ayant force de loi) en matière culturelle, d'enseignement, de matières personnalisables (matières liées à la personne) et d'emploi des langues (art. 127 à 129). Ces décrets s'appliquent dans la région de langue française et aux institutions de Bruxelles-Capitale qui relèvent de cette seule communauté. Depuis 2011, la Communauté utilise le nom « Fédération Wallonie-Bruxelles ». La Communauté germanophone a sa propre fiche (« Communauté germanophone de Belgique »).
