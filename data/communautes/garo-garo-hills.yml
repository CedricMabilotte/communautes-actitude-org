resume: >-
  Les Garo vivent à l'ouest du Meghalaya. Le Garo Hills Autonomous District Council, créé en juin 1952 en application de la Sixième annexe de la Constitution, couvre cinq districts. Il légifère sur les terres, les forêts non classées, les chefferies et les coutumes, et fait fonctionner des tribunaux coutumiers. Au Meghalaya, une loi de l'État l'emporte sur une loi du conseil qui lui est contraire. Les fiches Khasi et Pnar (Jaintia) décrivent les deux autres conseils du Meghalaya.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître officiellement les peuples tribaux comme groupes distincts ayant droit à une protection spéciale ; § 12 et 19 sur les États du nord-est où vivent des peuples tribaux (loi sur les pouvoirs spéciaux des forces armées, barrages construits sans consentement préalable)", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, art. 244 (2) et Sixième annexe", nature: "constitution", annee: 1950, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Ordonnance de 2026 sur les langues officielles du Meghalaya (promulguée le 27 avril 2026, abroge la loi de 2005 sur la langue de l'État)", nature: "loi", annee: 2026, source: "https://hubnetwork.in/meghalaya-notifies-three-official-languages-via-ordinance-english-to-stay-for-courts-inter-district-work/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, Sixième annexe (régime des districts tribaux autonomes), paragraphe 2 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 ; au Meghalaya, une loi de l'État contraire l'emporte sur la loi du conseil, paragraphe 12A (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Tribunaux de village, tribunaux subordonnés et tribunal du conseil de district pour les litiges entre membres des tribus répertoriées, Sixième annexe, paragraphe 4 ; les trois conseils du Meghalaya les font fonctionner selon les coutumes (communiqué du gouvernement du Meghalaya, 2019).", source: "https://www.meghalaya.gov.in/sites/default/files/press_release/Seminar_on_District_Council_Courts.pdf"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "L'ordonnance de 2026 sur les langues officielles du Meghalaya, promulguée le 27 avril 2026, fait du garo une langue officielle à côté de l'anglais dans les bureaux de district, de subdivision et de bloc de la division des Garo Hills ; l'anglais reste la langue des tribunaux et des échanges entre districts. Elle abroge la loi de 2005 sur la langue de l'État.", source: "https://hubnetwork.in/meghalaya-notifies-three-official-languages-via-ordinance-english-to-stay-for-courts-inter-district-work/"}
  education: {valeur: "partiel", note: "Le conseil peut créer et gérer des écoles primaires et fixer la langue et les modalités de l'enseignement primaire, avec l'accord préalable du gouverneur, Sixième annexe, paragraphe 6 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des personnes n'appartenant pas aux tribus répertoriées, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "partiel", note: "Sièges réservés aux membres des tribus répertoriées (Scheduled Tribes, liste constitutionnelle qui inclut les Garo) à l'Assemblée législative du Meghalaya, Constitution, art. 332 (1) et (3A) ; aucun siège n'est réservé aux Garo en tant que tels.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "L'élection du conseil prévue le 10 avril 2026 a été reportée le 11 mars après des violences liées à la candidature de non-tribaux ; le gouverneur a prolongé le mandat du conseil du 19 avril au 18 octobre 2026. Le 29 septembre 2026, la Haute Cour du Meghalaya a refusé d'ordonner l'élection, un comité de redécoupage des circonscriptions disposant de six mois depuis avril 2026 (Hub News, 29 septembre 2026). Le 28 septembre 2026, le gouverneur a approuvé une modification des règles de 1951 sur la constitution des conseils de district : candidature réservée aux membres des tribus répertoriées, listes électorales propres à chaque circonscription, droit de vote à 18 ans au lieu de 21 (Hub News, 30 septembre 2026). Aucune date d'élection n'est fixée.", source: "https://hubnetwork.in/meghalaya-hc-disposes-pil-on-ghadc-polls-says-delimitation-panel-given-6-months/"}
chronologie:
  - {annee: 1952, evenement: "Création du conseil de district des Garo Hills en juin."}
  - {annee: 1972, evenement: "Le Meghalaya devient un État ; le paragraphe 12A fait primer les lois de l'État."}
  - {annee: 2025, evenement: "Quarante forêts de réserve villageoises, sur 6 753 ha de terres de clan (a·king) cédées par les nokma (chefs de village), sont recensées dans les Garo Hills (Wildlife Trust of India, décembre 2025)."}
  - {annee: 2026, evenement: "Report de l'élection du conseil (11 mars) et prolongation de son mandat jusqu'au 18 octobre par le gouverneur (18 mars)."}
  - {annee: 2026, evenement: "Ordonnance sur les langues officielles promulguée le 27 avril ; projet de loi déposé à l'Assemblée du Meghalaya le 24 août."}
  - {annee: 2026, evenement: "Le gouverneur approuve le 28 septembre des règles électorales qui réservent la candidature au conseil aux membres des tribus répertoriées ; la Haute Cour refuse le 29 septembre d'ordonner l'élection."}
