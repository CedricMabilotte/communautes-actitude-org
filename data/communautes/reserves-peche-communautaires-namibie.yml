resume: >-
  Fiche agrégée : elle couvre les communautés des conservancies communales (zones de gestion communautaire de la faune) qui gèrent une réserve de pêche sur un cours d'eau. La loi n° 1 de 2003 sur les ressources halieutiques continentales (Inland Fisheries Resources Act) permet au ministre, à son initiative ou à celle d'un conseil régional, d'un conseil municipal ou d'une autorité traditionnelle (chefferie reconnue par l'État), et en consultation avec eux, de déclarer une réserve de pêche par avis au Journal officiel (art. 22). Les avis de 2015, 2016 et 2020 reconnaissent l'accord de gestion rédigé par la conservancy avec l'autorité traditionnelle, le ministère et le conseil régional ; ceux de 2015, 2016 et les avis n° 65 et 66 de 2020 confient les patrouilles aux guides, gardes et suiveurs de pêche de la conservancy ; l'avis de 2021 soumet la pêche à l'autorisation d'un comité de pêche continentale. De 2015 à 2021, vingt réserves ont été déclarées : dix dans la région du Zambèze (conservancies de Sikunga, Impalila, Mayuni, Balyerwa, Lusese et Nakabolelwa) et dix dans la conservancy Joseph Mbambangandu, sur le Kavango.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la Namibie à la Convention sur la diversité biologique (décembre 2018) : il cite la déclaration du chenal de Kasaya, dans la conservancy d'Impalila, comme réserve de pêche (avis n° 298 de 2016), indique que deux aires de protection des poissons ont été déclarées dans les conservancies de Sikunga et d'Impalila et que huit autres ont été proposées à la déclaration", annee: 2018, source: "https://www.cbd.int/doc/nr/nr-06/na-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Inland Fisheries Resources Act, 2003 (loi n° 1 de 2003), art. 22 (réserves de pêche) et art. 29 (2) (c) (comités de pêche continentale) ; en vigueur le 6 juin 2003", nature: "loi", annee: 2003, source: "https://www.lac.org.na/laws/annoSTAT/Inland%20Fisheries%20Resources%20Act%201%20of%202003.pdf"}
  - {instrument: "Avis n° 276 de 2015 : déclaration du chenal de Sikunga comme réserve de pêche (Journal officiel n° 5883 du 25 novembre 2015)", nature: "loi", annee: 2015, source: "https://gazettes.africa/archive/na/2015/na-government-gazette-dated-2015-11-25-no-5883.pdf"}
  - {instrument: "Avis n° 298 de 2016 : déclaration du chenal de Kasaya, conservancy d'Impalila (Journal officiel n° 6197 du 15 décembre 2016)", nature: "loi", annee: 2016, source: "https://gazettes.africa/archive/na/2016/na-government-gazette-dated-2016-12-15-no-6197.pdf"}
  - {instrument: "Avis n° 65 à 68 de 2020 : déclaration de huit réserves dans les conservancies de Mayuni, Balyerwa, Lusese et Nakabolelwa (Journal officiel n° 7138 du 6 mars 2020)", nature: "loi", annee: 2020, source: "https://gazettes.africa/archive/na/2020/na-government-gazette-dated-2020-03-06-no-7138.pdf"}
  - {instrument: "Avis n° 206 de 2021 : déclaration de dix réserves dans la conservancy Joseph Mbambangandu (Journal officiel n° 7641 du 22 septembre 2021)", nature: "loi", annee: 2021, source: "https://gazettes.africa/archive/na/2021/na-government-gazette-dated-2021-09-22-no-7641.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les avis de déclaration reconnaissent formellement l'accord de gestion (management agreement) rédigé par la conservancy avec l'autorité traditionnelle, le ministère des Pêches et le conseil régional (avis n° 276 de 2015, n° 298 de 2016, n° 65 à 68 de 2020) ; l'avis n° 206 de 2021 confie les autorisations de pêche à un comité de pêche continentale « qui sera enregistré » ; la réserve reste déclarée et modifiable par le ministre (loi de 2003, art. 22).", source: "https://gazettes.africa/archive/na/2020/na-government-gazette-dated-2020-03-06-no-7138.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les règles de chaque réserve sont édictées par le ministre dans l'annexe de l'avis ; certaines décisions restent à la communauté : dates de la récolte annuelle de novembre fixées par la communauté (avis n° 67 de 2020), engins décidés par le comité de pêche en consultation avec les membres (avis n° 68 de 2020), autorisation de la pêche récréative avec remise à l'eau et montant de la redevance fixés par le comité (avis n° 65 de 2020).", source: "https://gazettes.africa/archive/na/2020/na-government-gazette-dated-2020-03-06-no-7138.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les redevances de pêche récréative et de capture de poissons trophées sont versées à la conservancy (avis n° 276 de 2015, n° 298 de 2016, n° 66 de 2020) ; seuls les membres récoltent en novembre, au filet maillant multifilament de 3,5 et 4 pouces (avis n° 67 et 68 de 2020) ; dans la conservancy Joseph Mbambangandu, toute pêche, toute récolte de végétaux ou d'animaux et l'accès des non-résidents (300 dollars namibiens par engin pour deux semaines) passent par l'autorisation du comité de pêche continentale (avis n° 206 de 2021).", source: "https://gazettes.africa/archive/na/2021/na-government-gazette-dated-2021-09-22-no-7641.pdf"}
  consentement: {valeur: "partiel", note: "Le ministre déclare une réserve de pêche à son initiative ou à celle d'un conseil régional, d'un conseil municipal ou d'une autorité traditionnelle, et toujours en consultation avec eux (loi de 2003, art. 22 (1)) ; la consultation vise ces institutions, non l'assemblée de la conservancy ; seul l'avis n° 68 de 2020 répond à une initiative écrite de la conservancy elle-même (Nakabolelwa).", source: "https://www.lac.org.na/laws/annoSTAT/Inland%20Fisheries%20Resources%20Act%201%20of%202003.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Dans les dix réserves du Zambèze, selon la fiche de Conservation Namibia (Chambre namibienne de l'environnement), environ 50 gardes-pêche formés sont employés et payés par les conservancies pour empêcher la pêche illégale, avec l'appui des inspecteurs du ministère et, au besoin, de la police ; selon la NACSO (association des organisations de gestion communautaire des ressources naturelles), des suiveurs de pêche relèvent les captures, et les autorités traditionnelles et le ministère poursuivent les contrevenants. Ces deux sources sont liées au programme de la Namibia Nature Foundation qui accompagne les réserves. Aucune source consultée ne décrit l'application des dix réserves de la conservancy Joseph Mbambangandu, dont le comité de pêche continentale « sera enregistré » selon l'avis n° 206 de 2021, ni une évaluation publiée des effets des réserves sur les stocks.", source: "https://conservationnamibia.com/factsheets/community-fisheries-reserves.php"}
chronologie:
  - {annee: 2003, evenement: "Adoption de la loi n° 1 de 2003 sur les ressources halieutiques continentales, en vigueur le 6 juin ; son article 22 crée les réserves de pêche."}
  - {annee: 2015, evenement: "Avis n° 276 du 9 novembre : déclaration du chenal de Sikunga, à l'initiative écrite du conseil régional du Zambèze et de l'autorité traditionnelle de Bukalo."}
  - {annee: 2016, evenement: "Avis n° 298 du 5 décembre : déclaration du chenal de Kasaya, conservancy d'Impalila ; avis n° 297 : fermeture de toute pêche sur le système Zambèze-Chobe du 1er décembre au 28 février de chaque année."}
  - {annee: 2020, evenement: "Avis n° 65 à 68 du 22 février : déclaration de Luhingi (Mayuni), Qhuqhumupa et Kalume (Balyerwa), Lwezuba et Kabweza (Lusese), Munga, Nsala et Makumbi (Nakabolelwa)."}
  - {annee: 2021, evenement: "Avis n° 206 : déclaration de dix réserves dans la conservancy Joseph Mbambangandu, sur le Kavango, à l'initiative du conseil régional du Kavango et de l'autorité traditionnelle de Shambyu."}
  - {annee: 2023, evenement: "Avis n° 418 du 18 décembre : retrait de la fermeture saisonnière du système Zambèze-Chobe (abrogation de l'avis n° 297 de 2016) ; les réserves déclarées par site ne sont pas visées."}
fiabilite:
  verifie: ["Loi n° 1 de 2003, art. 22 et 29 (2) (c), et date d'entrée en vigueur, sur la version annotée du Legal Assistance Centre.", "Texte intégral des avis n° 276 de 2015, n° 298 de 2016, n° 65 à 68 de 2020, n° 206 de 2021 et n° 418 de 2023, sur les numéros du Journal officiel de la Namibie.", "Liste des dix réserves du Zambèze, identique dans les avis du Journal officiel et sur la page de la NACSO.", "Passage du sixième rapport national de la Namibie à la CDB sur les réserves de pêche continentales."]
  non_confirme: ["La fiche de Conservation Namibia compte huit réserves enregistrées dans la région du Zambèze ; les avis du Journal officiel et la NACSO en comptent dix ; l'écart n'est pas expliqué.", "Les avis de 2015 et 2016 portent sur des chenaux qualifiés aussi d'aires de protection des poissons ; l'avis n° 276 de 2015 nomme le chenal de Kasaya dans son titre sans en donner les limites, reprises par l'avis n° 298 de 2016.", "Aucun règlement pris en application de l'art. 29 (2) (c) pour créer les comités de pêche continentale n'a été trouvé ; les avis de 2020 et 2021 renvoient pourtant à ces comités.", "Aucun avis postérieur à 2021 déclarant d'autres réserves n'a été consulté ; la liste peut être incomplète.", "La page de la NACSO compte dix réserves « toutes dans la région du Zambèze » et ne mentionne pas les dix réserves déclarées en 2021 dans la conservancy Joseph Mbambangandu.", "La région du Kavango-Est vient de la liste des conservancies de la NACSO ; l'avis n° 206 de 2021 nomme le conseil régional du Kavango.", "Le nombre d'environ 50 gardes-pêche vient d'une fiche non datée de Conservation Namibia.", "Les avis donnent le périmètre de chaque réserve, non sa surface : surface totale non trouvée.", "Population des communautés riveraines : non trouvée.", "Nombre de villages : non trouvé."]
