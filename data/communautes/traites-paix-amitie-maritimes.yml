reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14, art. 4 a)) confirme qu'elle « trouve application en droit canadien ».", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
  - {mecanisme: "organe_traite", detail: "Lettre du 30 avril 2021 du Comité pour l'élimination de la discrimination raciale (procédure d'alerte rapide et d'intervention d'urgence), saisi par des représentants de la Première Nation Sipekne'katik : le Comité demande au Canada comment il a enquêté sur les actes de racisme et de violence visant les pêcheurs mi'kmaq à l'automne 2020 et sur le manque de réaction reproché aux autorités et ce qu'il a fait pour garantir leurs droits de pêche ; le Canada a répondu le 14 mars 2022, réponse restée confidentielle (CBC, 10 mai 2021 et 1er avril 2022).", annee: 2021, source: "https://www.cbc.ca/lite/story/1.6020492"}
