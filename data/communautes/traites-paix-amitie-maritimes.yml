effectivite: {valeur: "contestee", note: "Selon F. Wien, S. D. Fuller et R. Williams (Options politiques, 2021), la quasi-totalité des 35 Premières Nations pêche commercialement au moyen de permis communautaires délivrés par Pêches et Océans Canada ; en 2020, quelques communautés mi'kmaq ont délivré leurs propres permis pour une pêche au homard hors des saisons réglementées, et des foules non autochtones ont menacé des pêcheurs mi'kmaq et brûlé des bateaux et des bâtiments d'usine. Les chefs des Premières Nations des Maritimes s'opposent à la politique fédérale de 2021, qui impose les saisons commerciales, faute des consultations et de la justification exigées par l'arrêt Marshall. Selon Pêches et Océans Canada (page modifiée le 13 juin 2025), 24 ententes provisoires ont été conclues depuis 2021 avec 17 Premières Nations, pour la civelle, le homard et le gaspareau.", source: "https://policyoptions.irpp.org/fr/2021/05/le-droit-issu-de-traites-des-mikmaq-et-des-malecites-a-la-peche-de-subsistance/"}
chronologie:
  - {annee: 1760, evenement: "Traités de paix et d'amitié avec les Wolastoqiyik et les Peskotomuhkati (février), puis avec des communautés mi'kmaq, dont le traité du 10 mars à Halifax."}
  - {annee: 1761, evenement: "À la fin de l'année, tous les villages mi'kmaq de la Nouvelle-Écosse ont conclu des traités distincts mais similaires, selon le juge du procès."}
  - {annee: 1982, evenement: "L'art. 35 de la Loi constitutionnelle reconnaît et confirme les droits existants issus de traités."}
  - {annee: 1993, evenement: "Donald Marshall Jr., de Membertou, pêche et vend 463 livres d'anguilles sans permis ; il est poursuivi."}
  - {annee: 1999, evenement: "17 septembre : la Cour suprême l'acquitte et reconnaît le droit issu des traités ; 17 novembre : elle en précise le caractère collectif et les limites."}
  - {annee: 2000, evenement: "Initiative de l'après-Marshall (2000-2007) : permis de pêche commerciale, bateaux, engins et formation ; accords avec 32 des Premières Nations admissibles."}
  - {annee: 2007, evenement: "Initiative des pêches commerciales intégrées de l'Atlantique."}
  - {annee: 2017, evenement: "Pêches et Océans Canada reçoit le mandat de négocier des ententes de réconciliation et de reconnaissance des droits de pêche de durée limitée ; la Nation Peskotomuhkati de Skutik est identifiée comme titulaire."}
  - {annee: 2020, evenement: "Septembre : Sipekne'katik lance une pêche au homard selon son propre plan ; en octobre, un vivier à homards de Middle West Pubnico (Nouvelle-Écosse) où des pêcheurs mi'kmaq stockaient leurs prises est saccagé puis incendié."}
  - {annee: 2021, evenement: "Rapport du représentant spécial fédéral (31 mars) ; lettre du Comité pour l'élimination de la discrimination raciale (30 avril) ; plan de pêche de Potlotek autorisé à titre provisoire (4 juin)."}
  - {annee: 2022, evenement: "Le Canada répond au Comité pour l'élimination de la discrimination raciale le 14 mars ; réponse confidentielle."}
  - {annee: 2023, evenement: "Le mandat de négociation expire en avril ; de 2019 à 2023, sept ententes de réconciliation et de reconnaissance des droits ont été conclues avec 15 Premières Nations."}
  - {annee: 2024, evenement: "Pêches et Océans Canada engage 259,4 millions de dollars sur trois ans (2024-2027) pour l'acquisition par les 35 nations d'accès aux pêches commerciales, de bateaux et d'engins."}
fiabilite:
  verifie: ["R. c. Marshall du 17 septembre 1999 : traité du 10 mars 1760, « biens nécessaires » assimilés à une subsistance convenable, protection par l'art. 35, limites de prises réglementaires : par. 5, 7, 27 et 61 (texte intégral de la Cour suprême).", "R. c. Marshall du 17 novembre 1999 : par. 17 (droit exercé sous l'autorité de la communauté, territoire traditionnel, traités similaires avec tous les villages mi'kmaq à la fin de 1761), par. 40 (conservation), par. 41 (équité économique et régionale), par. 43 et sommaire (consultation) (texte intégral de la Cour suprême).", "Population inscrite : somme des profils des bandes no 1 à 30 et 51 à 54 (septembre 2026) = 50 053.", "Tableau : les 35 noms et leur province correspondent à la liste de Pêches et Océans Canada.", "Art. 35 de la Loi constitutionnelle de 1982 (Justice Canada).", "Liste des 34 Premières Nations et de la Nation Peskotomuhkati de Skutik (Pêches et Océans Canada, page modifiée le 22 septembre 2022).", "Population inscrite des 34 bandes : profils des Premières Nations de Services aux Autochtones Canada, données de septembre 2026.", "Plan de Potlotek du 4 juin 2021, fondé sur le netukulimk, mesure provisoire, 700 casiers pendant la saison établie (déclaration de Pêches et Océans Canada).", "Initiative de l'après-Marshall, mandat de 2017, sept ententes avec 15 Premières Nations, 24 ententes provisoires avec 17 Premières Nations depuis 2021, 259,4 millions de dollars 2024-2027 (page « Notre réponse aux décisions Marshall », modifiée le 13 juin 2025).", "Wolastoqiyik Wahsipekuk = anciennement Première Nation malécite de Viger (même page) ; réserves de Cacouna et de Kataskomiq, à l'est de Québec (profil de la Première Nation)."]
  non_confirme: ["Lettre du Comité pour l'élimination de la discrimination raciale du 30 avril 2021 : connue par la presse (CBC), le document onusien n'a pas pu être ouvert ; la réponse du Canada est confidentielle.", "Surface : le droit s'exerce sur le territoire traditionnel de chaque communauté, que ni les arrêts ni les sources consultées ne délimitent ; aucune surface n'est donnée.", "Nombre de communautés disposant en 2026 d'un plan ou d'une entente de pêche de subsistance convenable : 17 Premières Nations selon une page modifiée en juin 2025, chiffre non actualisé.", "Correspondance des noms entre la liste de Pêches et Océans Canada et le registre des Indiens : Annapolis Valley = Jijiktukwej L'nue'kati (bande no 20), établie par le numéro de bande, sans texte officiel de changement de nom consulté.", "Dates exactes des traités de 1760 avec les Wolastoqiyik et les Peskotomuhkati : déduites de l'arrêt (réunion du 11 février 1760, signature douze jours plus tard)."]
