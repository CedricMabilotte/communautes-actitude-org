resume: >-
  En 1760 et 1761, la Couronne britannique conclut avec les Wolastoqiyik (Malécites), les Peskotomuhkati (Passamaquoddy) et les communautés mi'kmaq une série de traités de paix et d'amitié. Le 17 septembre 1999, dans l'arrêt R. c. Marshall, la Cour suprême du Canada juge que ces traités garantissent un droit de pêcher, chasser et cueillir pour en échanger les produits contre des « biens nécessaires », c'est-à-dire aujourd'hui une subsistance convenable (un revenu modeste, sans accumulation illimitée de richesses), protégé par l'article 35 de la Loi constitutionnelle de 1982. Le 17 novembre 1999, la Cour précise que ce droit appartient à la communauté et non à l'individu, s'exerce sur le territoire traditionnel de chaque communauté et peut être réglementé pour des raisons de conservation ou d'autres objectifs publics. Pêches et Océans Canada dénombre 35 Premières Nations titulaires en Nouvelle-Écosse, au Nouveau-Brunswick, à l'Île-du-Prince-Édouard et en Gaspésie.
