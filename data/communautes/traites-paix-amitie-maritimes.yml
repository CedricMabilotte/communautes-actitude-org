droits:
  autogouvernement: {valeur: "partiel", note: "Les droits issus des traités « n'appartiennent pas personnellement à l'individu, mais ils sont exercés sous l'autorité de la communauté à laquelle ce dernier appartient » (Marshall, 17 novembre 1999, par. 17) ; les communautés agissent par leurs conseils de bande, institués par la Loi sur les Indiens, et non par une institution créée par les traités. Depuis 2021, une Première Nation peut élaborer un plan de pêche de subsistance convenable ; Pêches et Océans Canada en autorise à titre provisoire les éléments conformes à la Loi sur les pêches, pendant les saisons commerciales et sans hausse de l'effort de pêche global (page « Notre réponse aux décisions Marshall », 2025) ; le plan de Potlotek, fondé sur le netukulimk (principe mi'kmaq de prélèvement mesuré), a été reconnu ainsi le 4 juin 2021.", source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/item/1740/index.do"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Droit issu de traité, protégé par l'art. 35 de la Loi constitutionnelle de 1982, de pêcher, chasser et cueillir pour se procurer une subsistance convenable (Marshall, 17 septembre 1999, par. 7 et 61) ; limité au territoire traditionnel de chaque communauté et réglementable pour la conservation ou d'autres objectifs publics réels et impérieux, dont l'équité économique et régionale (Marshall, 17 novembre 1999, par. 17, 40 et 41).", source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/item/1739/index.do"}
  consentement: {valeur: "partiel", note: "« Les peuples autochtones ont le droit d'être consultés à propos des restrictions à l'exercice des droits ancestraux ou issus de traités » (Marshall, 17 novembre 1999, sommaire et par. 43) ; il s'agit d'une obligation de consultation, non d'un consentement.", source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/item/1740/index.do"}
  langue: {valeur: "non_etabli", note: "", source: ""}
