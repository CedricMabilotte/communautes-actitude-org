resume: >-
  Fiche agrégée : elle couvre les groupes de propriétaires traditionnels (traditional owners, peuples aborigènes rattachés à un territoire par leurs liens culturels) représentés par une Registered Aboriginal Party (RAP, « partie aborigène enregistrée »), corporation aborigène que le Conseil du patrimoine aborigène de Victoria (Victorian Aboriginal Heritage Council) enregistre pour une zone en application de l'Aboriginal Heritage Act 2006. Dans sa zone, la RAP évalue et approuve ou refuse les plans de gestion du patrimoine culturel exigés avant certains aménagements, délivre ou refuse les permis touchant le patrimoine aborigène depuis 2016, et conclut des accords de patrimoine culturel. Les premières RAP ont été enregistrées en 2007 ; en décembre 2024, douze RAP couvrent environ 77,5 % de l'État. Le régime porte sur le patrimoine culturel, pas sur la propriété des terres.
