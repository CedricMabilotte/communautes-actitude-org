resume: >-
  Aruba est une île des Caraïbes, au large du Venezuela, qui forme l'un des quatre pays du Royaume des Pays-Bas depuis le 1er janvier 1986 (« status aparte », c'est-à-dire statut séparé des Antilles néerlandaises). Le Statut du Royaume de 1954 dispose que chaque pays gère seul ses affaires propres ; la défense, les relations extérieures et la nationalité restent des affaires du Royaume. Aruba dispose d'un Parlement (Staten van Aruba, 21 membres), d'un gouvernement et de lois propres appelées « landsverordeningen » (ordonnances nationales). Le Statut prévoit une procédure par laquelle Aruba peut mettre fin à ce lien par ordonnance et référendum.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur les Pays-Bas (CCPR/C/NLD/CO/5), § 5, 6, 11, 12 et 18 : le Comité traite Aruba comme pays constitutif du Royaume, relève des écarts de protection entre les quatre pays et recommande la création d'une institution nationale des droits de l'homme à Aruba.", annee: 2019, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/NLD/CO/5&l=en&t=pdf"}
base_nationale:
  - {instrument: "Statut du Royaume des Pays-Bas (Statuut voor het Koninkrijk der Nederlanden, 1954), version en vigueur au 1er janvier 2024", nature: "statut_autonomie", annee: 1954, source: "https://wetten.overheid.nl/jci1.3:c:BWBR0002154"}
  - {instrument: "Staatsregeling van Aruba (constitution d'Aruba), AB 1987 no. GT 1", nature: "constitution", annee: 1986, source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0101gt87.001.pdf"}
  - {instrument: "Landsverordening officiële talen (ordonnance sur les langues officielles), AB 2003 no. 38", nature: "loi", annee: 2003, source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/1311ab03.038.pdf"}
  - {instrument: "Landsverordening toelating en uitzetting (ordonnance sur l'admission et l'expulsion), AB 1993 no. GT 33", nature: "loi", annee: 1993, source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0503gt93.033_0.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Aruba gère seul ses affaires propres, Statut, art. 41 ; le gouvernement est formé du Roi, représenté par le Gouverneur, et des ministres responsables devant les Staten, élus au suffrage direct et composés de 21 membres, Staatsregeling, art. II.1, III.2 et III.5.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0101gt87.001.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Aruba gère seul ses affaires propres, Statut, art. 41 ; son organisation est fixée par la Staatsregeling, établie par ordonnance nationale (landsverordening), dont toute modification exige les deux tiers des voix des Staten, Statut, art. 42 ; les ordonnances nationales peuvent être suspendues ou annulées par le Roi en cas de contrariété avec le Statut ou les intérêts du Royaume, Statut, art. 50.", source: "https://wetten.overheid.nl/jci1.3:c:BWBR0002154"}
  justice_propre: {valeur: "partiel", note: "La justice est rendue par les juges membres de la Cour commune de justice (Gemeenschappelijk Hof van Justitie), commune aux Antilles néerlandaises et à Aruba dans le texte consulté et siégeant à Aruba, Staatsregeling, art. VI.2 et VI.7 ; la cassation relève du Hoge Raad des Pays-Bas, réglée par loi du Royaume, Statut, art. 23.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0101gt87.001.pdf"}
  terres: {valeur: "partiel", note: "Les terres du Land Aruba sont concédées en bail emphytéotique (erfpacht, droit d'usage de longue durée) par le ministre arubais des Travaux publics, en règle générale pour soixante ans au plus, Landsverordening uitgifte eigendommen, AB 1989 no. GT 21, art. 1 et 2. Il s'agit de la gestion du domaine foncier du pays, sans réservation de la propriété du sol à la population.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0210gt89.021.pdf"}
  ressources: {valeur: "partiel", note: "L'exportation de sable hors d'Aruba est soumise à un permis du ministre arubais des Travaux publics, Zandverordening, AB 1995 no. GT 24, art. 1 ; aucun autre texte sur les ressources (sous-sol, mer, eau) n'a été vérifié.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/1004gt95.024.pdf"}
  consentement: {valeur: "reconnu", note: "Les projets de loi du Royaume sont transmis aux Staten van Aruba, qui peuvent rendre un rapport écrit et envoyer des délégués, Statut, art. 15 à 18 ; toute modification du Statut exige l'acceptation d'Aruba par ordonnance nationale, Statut, art. 55.", source: "https://wetten.overheid.nl/jci1.3:c:BWBR0002154"}
  langue: {valeur: "reconnu", note: "Le papiamento et le néerlandais sont les langues officielles d'Aruba, Landsverordening officiële talen, AB 2003 no. 38, art. 2.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/1311ab03.038.pdf"}
  education: {valeur: "reconnu", note: "L'enseignement relève des ordonnances nationales d'Aruba, dont la Landsverordening basisonderwijs (enseignement primaire), AB 1989 no. GT 75.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/1302gt89.075_0.pdf"}
  fiscalite: {valeur: "reconnu", note: "Les impôts sont levés en vertu d'une ordonnance nationale et le budget du pays est fixé par ordonnance, Staatsregeling, art. V.11 et V.12.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0101gt87.001.pdf"}
  representation: {valeur: "partiel", note: "Un ministre plénipotentiaire nommé par le gouvernement d'Aruba siège au Conseil des ministres du Royaume et prend part aux débats des chambres des États généraux sur les lois du Royaume, Statut, art. 7, 8, 17 et 18 ; le Statut ne réserve aucun siège à Aruba aux États généraux.", source: "https://wetten.overheid.nl/jci1.3:c:BWBR0002154"}
  statut_personnel: {valeur: "reconnu", note: "La nationalité néerlandaise est commune au Royaume, Statut, art. 3 ; les Néerlandais nés hors d'Aruba sont soumis à admission, sauf après dix ans d'admission et de résidence principale ou si un parent est né à Aruba, y a acquis la nationalité ou y a résidé dix ans, Landsverordening toelating en uitzetting, art. 1. Cette attache par la naissance, la filiation ou la résidence ouvre un droit de séjour sans admission.", source: "https://cuatro.sim-cdn.nl/arubaoverheid2858bd/uploads/0503gt93.033_0.pdf"}
  autodetermination_externe: {valeur: "reconnu", note: "Aruba peut déclarer par ordonnance nationale, votée aux deux tiers des Staten puis approuvée par la majorité des électeurs inscrits lors d'un référendum, qu'il met fin à l'ordre juridique du Statut à son égard, Statut, art. 58 à 60.", source: "https://wetten.overheid.nl/jci1.3:c:BWBR0002154"}
effectivite: {valeur: "effective", note: "Aruba est un pays autonome du Royaume depuis 1986 ; depuis 2015, un collège de contrôle financier (College Aruba financieel toezicht, CAft) nommé par le Conseil des ministres du Royaume examine le processus budgétaire d'Aruba et rend des avis, en vertu de l'ordonnance nationale Landsverordening Aruba tijdelijk financieel toezicht.", source: "https://www.cft.cw/over-het-cft"}
chronologie:
  - {annee: 1954, evenement: "Entrée en vigueur du Statut du Royaume ; Aruba fait partie des Antilles néerlandaises."}
  - {annee: 1955, evenement: "Résolution 945 (X) de l'Assemblée générale : cessation de la transmission d'informations au titre de l'article 73 e de la Charte pour les Antilles néerlandaises et le Surinam."}
  - {annee: 1986, evenement: "Le 1er janvier, Aruba devient un pays distinct du Royaume (« status aparte »), avec sa Staatsregeling."}
  - {annee: 1995, evenement: "Le 1er juillet, entrée en vigueur de la loi du Royaume du 15 décembre 1994 (Stb. 1995, 1) qui abroge l'ancien art. 62 du Statut ; Aruba reste pays du Royaume pour une durée indéterminée à partir du 1er janvier 1996 ; la procédure de sortie par ordonnance et référendum figure aux art. 58 à 60."}
  - {annee: 2003, evenement: "Le papiamento et le néerlandais deviennent langues officielles par ordonnance nationale."}
  - {annee: 2015, evenement: "Le 2 septembre, entrée en vigueur de l'ordonnance nationale sur le contrôle financier temporaire (LAft), avec effet au 1er août, et création du collège CAft."}
fiabilite:
  verifie: ["Statut du Royaume, version au 1er janvier 2024 : art. 1, 3, 7, 8, 15 à 18, 23, 41, 42, 50, 55, 58 à 60 ; art. 62 « vervallen » (abrogé).", "Staatsregeling van Aruba : art. II.1, III.2, III.5, V.11, V.12, VI.2, VI.7.", "Landsverordening officiële talen, art. 2.", "Landsverordening toelating en uitzetting, art. 1.", "CCPR/C/NLD/CO/5, § 5, 6, 11, 12 et 18.", "Résolution 945 (X) du 15 décembre 1955, dispositif § 1 et 2.", "Métadonnées du Statut (version XML au 1er janvier 2024) : art. 62 abrogé par la loi du Royaume du 15 décembre 1994, Stb. 1995, 1, en vigueur le 1er juillet 1995 ; préambule : Aruba pays du Royaume depuis le 1er janvier 1986, pour une durée indéterminée depuis le 1er janvier 1996.", "Landsverordening uitgifte eigendommen, art. 1 et 2 ; Zandverordening, art. 1.", "Cft : LAft en vigueur le 2 septembre 2015 ; CAft à rôle de signalement et d'avis.", "Banque mondiale : 108 785 habitants (2025), 180 km² (2023)."]
  non_confirme: ["Critère d'entrée : aucun mécanisme onusien ne vise les Arubais comme peuple autochtone ou minorité ; la reconnaissance retenue est nationale (Statut) et le suivi distinct par un organe de traité.", "Statut de pays et territoire d'outre-mer associé à l'Union européenne non vérifié sur EUR-Lex.", "Le texte de la Staatsregeling consulté mentionne encore la Cour commune de justice « des Antilles néerlandaises et d'Aruba » ; sa dénomination après 2010 n'a pas été vérifiée sur un texte arubais.", "La réglementation arubaise de la pêche et des ressources du sous-sol n'a pas été consultée.", "La version de la Staatsregeling consultée est celle du registre central des lois (2013) ; les modifications postérieures n'ont pas été contrôlées.", "Nombre de villages : non trouvé ; les pages du recensement de 2020 du Bureau central de la statistique d'Aruba (cbs.aw) consultées ne donnent pas de nombre de localités habitées."]
