base_nationale:
  - {instrument: "Loi 2017-001 du 11 avril 2017 portant sur le foncier agricole (art. 4, 11, 12, 17, 19, 34 à 39, 42 à 44, 48 à 50), Journal officiel n° 16 du 21 avril 2017", nature: "loi", annee: 2017, source: "https://sgg-mali.ml/JO/2017/mali-jo-2017-16.pdf"}
  - {instrument: "Décret 2018-0333/P-RM du 4 avril 2018 fixant la composition et les modalités de fonctionnement de la commission foncière villageoise ou de fraction, Journal officiel n° 15 du 13 avril 2018", nature: "loi", annee: 2018, source: "https://sgg-mali.ml/JO/2018/mali-jo-2018-15.pdf"}
  - {instrument: "Ordonnance 2020-014/PT-RM du 24 décembre 2020 portant loi domaniale et foncière, modifiée et ratifiée par la loi 2021-056 du 7 octobre 2021 (art. 71, 73, 74 et 76), citée par le Comité technique « Foncier & développement »", nature: "loi", annee: 2020, source: "https://www.foncier-developpement.fr/wp-content/uploads/Cadre-juridique-institutionnel-MALI-VF.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Une commission foncière villageoise et de fraction, instance de concertation et de suivi de la gestion des terres agricoles, est créée dans tous les villages et fractions ; sa composition et son fonctionnement sont fixés par décret en Conseil des ministres (loi 2017-001, art. 43 et 44) ; elle assure la prévention des conflits (art. 48) et son avis favorable conditionne le visa du chef de village sur l'attestation de détention coutumière (art. 35) ; sa compétence se limite aux terres agricoles.", source: "https://sgg-mali.ml/JO/2017/mali-jo-2017-16.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les droits fonciers agricoles des communautés rurales issus d'une possession se transmettent et se cèdent selon les us et coutumes ; l'accès à leurs terres se fait par succession selon les dispositions coutumières ; donation et prêt suivent les règles et pratiques coutumières (loi 2017-001, art. 12, 19, 20 et 21) ; les droits coutumiers non immatriculables ne se transfèrent que dans les conditions et limites prévues par la coutume (ordonnance 2020-014, art. 74).", source: "https://sgg-mali.ml/JO/2017/mali-jo-2017-16.pdf"}
  justice_propre: {valeur: "partiel", note: "Tout différend sur les terres agricoles est obligatoirement soumis à la commission foncière villageoise et de fraction avant toute saisine des tribunaux ; le procès-verbal de conciliation est transmis au juge pour homologation (validation par le juge) (loi 2017-001, art. 48 à 50) ; la juridiction civile reste compétente pour les contestations relatives aux droits coutumiers (ordonnance 2020-014, art. 76).", source: "https://sgg-mali.ml/JO/2017/mali-jo-2017-16.pdf"}
  terres: {valeur: "partiel", note: "Les terres agricoles des communautés rurales, détenues en vertu d'une attestation de détention coutumière ou de possession foncière, comprennent les terres liées au droit foncier coutumier, les espaces vitaux villageois et les terres agricoles familiales (loi 2017-001, art. 4, 11 et 12) ; l'attestation de détention coutumière, visée par le chef de village sur avis favorable de la commission foncière villageoise (art. 35), peut, comme l'attestation de possession foncière, être individuelle ou collective (art. 38) ; les droits coutumiers exercés collectivement sont confirmés et nul ne peut être contraint de les céder hors utilité publique avec indemnisation (ordonnance 2020-014, art. 71), mais ils peuvent être « purgés » (éteints au profit de l'État) selon les articles 75 et 76.", source: "https://www.foncier-developpement.fr/wp-content/uploads/Cadre-juridique-institutionnel-MALI-VF.pdf"}
  ressources: {valeur: "partiel", note: "Les éleveurs et les pêcheurs peuvent se voir reconnaître un droit d'usage prioritaire sur les ressources naturelles de leur terroir d'attache, sans exclure les usages communs : accès des tiers aux points d'eau, droit de parcours, de pacage et de pêche (loi 2017-001, art. 3 et 42).", source: "https://sgg-mali.ml/JO/2017/mali-jo-2017-16.pdf"}
  consentement: {valeur: "non_etabli", note: "L'autorisation préalable du conseil de famille, composé de tous les ayants droit, pour toute transaction sur une terre détenue ou possédée collectivement (loi 2017-001, art. 17) est une décision de la communauté sur sa propre terre, non une consultation par l'État ; aucun texte consulté n'impose la consultation des communautés avant une décision de l'État.", source: "https://sgg-mali.ml/JO/2017/mali-jo-2017-16.pdf"}
