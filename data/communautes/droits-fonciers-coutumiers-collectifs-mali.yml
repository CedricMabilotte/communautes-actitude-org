resume: >-
  La loi 2017-001 du 11 avril 2017 sur le foncier agricole range parmi les terres agricoles celles des communautés rurales, détenues en vertu d'une attestation de détention coutumière (titre qui constate un droit fondé sur la coutume) ou de possession foncière, individuelle ou collective. Elle crée dans chaque village et chaque fraction une commission foncière villageoise et de fraction, dont l'avis conditionne ces attestations et qui doit être saisie de tout différend avant les tribunaux. Le décret 2018-0333 du 4 avril 2018 en fixe la composition et le fonctionnement. L'ordonnance 2020-014 portant Code domanial et foncier confirme les droits coutumiers exercés collectivement ou individuellement sur les terres non immatriculées.
