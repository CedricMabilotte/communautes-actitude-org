  - {annee: 2009, evenement: "Assises nationales du foncier."}
  - {annee: 2017, evenement: "Loi 2017-001 du 11 avril sur le foncier agricole : terres des communautés rurales, attestations de détention coutumière, commissions foncières villageoises et de fraction."}
  - {annee: 2018, evenement: "Décret 2018-0333 du 4 avril : composition et fonctionnement des commissions foncières villageoises ou de fraction."}
  - {annee: 2020, evenement: "Ordonnance 2020-014 du 24 décembre portant loi domaniale et foncière : confirmation des droits coutumiers exercés collectivement ou individuellement (art. 71)."}
  - {annee: 2021, evenement: "Loi 2021-056 du 7 octobre : modification et ratification de l'ordonnance 2020-014."}
fiabilite:
  verifie:
    - "Texte de la loi 2017-001 au Journal officiel n° 16 du 21 avril 2017 (p. 602 à 606) : articles 3, 4, 11, 12, 17, 19 à 21, 34 à 39, 42 à 44 et 47 à 51."
    - "Le sommaire du Journal officiel n° 15 du 13 avril 2018 annonce le décret 2018-0333 à la page 620."
    - "L'attestation de détention coutumière est visée par le chef de village sur avis de la commission à l'article 35 de la loi 2017-001 ; l'article 36 porte sur sa légalisation par le maire."
  non_confirme:
    - "Le texte du décret 2018-0333 (composition de la commission, durée du mandat, autorité de nomination, prise en charge des frais) n'a pas pu être relu : la copie du Journal officiel n° 15 de 2018 consultée s'arrête avant la page 620."
    - "Le texte de l'ordonnance 2020-014 et de la loi 2021-056 n'a pas été consulté directement : les articles 71, 73, 74 et 76 sont cités d'après l'étude de décembre 2022 du Comité technique « Foncier & développement »."
    - "Nombre de commissions foncières villageoises et de fraction installées, nombre d'attestations collectives délivrées et surface concernée : aucune source trouvée ; aucune liste officielle des commissions n'a été trouvée."
    - "L'arrêté conjoint prévu par l'article 34 (procédure de constatation des droits coutumiers) et l'arrêté sur les frais de fonctionnement des commissions (décret 2018-0333, art. 9) n'ont pas été trouvés."
    - "Population et nombre de villages : calculés par addition des effectifs des communes rurales du Répertoire des localités (INSTAT) ; le répertoire ne distingue pas les terres détenues selon la coutume ; le nombre de villages et fractions dotés d'une commission foncière installée n'est pas connu."
    - "Surface des terres détenues selon la coutume : non trouvée."
