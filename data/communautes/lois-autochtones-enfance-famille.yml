resume: >-
  La Loi concernant les enfants, les jeunes et les familles des Premières Nations, des Inuits et des Métis (L.C. 2019, ch. 24), en vigueur depuis le 1er janvier 2020, affirme que le droit inhérent à l'autonomie gouvernementale (droit de se gouverner qui ne découle pas d'une concession de l'État), reconnu par l'article 35 de la Loi constitutionnelle de 1982, comprend la compétence en matière de services à l'enfance et à la famille. Un corps dirigeant autochtone (conseil, gouvernement ou autre entité autorisé à agir pour un groupe titulaire de droits ancestraux ou issus de traités) peut adopter sa propre loi ; après un accord de coordination avec le Canada et la province, ou après un an d'efforts raisonnables sans accord, cette loi a force de loi fédérale et l'emporte sur les lois provinciales incompatibles. La Cour suprême du Canada a jugé la loi fédérale constitutionnelle dans son ensemble le 9 février 2024. Au 3 septembre 2026, Services aux Autochtones Canada recense 19 lois autochtones en vigueur, appliquées par 22 corps dirigeants, et 16 accords conclus.
