droits:
  autogouvernement: {valeur: "partiel", note: "La loi reconnaît le corps dirigeant autochtone, défini comme conseil, gouvernement ou autre entité autorisé à agir pour un groupe, une collectivité ou un peuple titulaire de droits reconnus par l'article 35 (art. 1) ; elle ne crée pas d'institution et la compétence affirmée se limite aux services à l'enfance et à la famille, y compris leur exécution et le contrôle d'application (art. 18(1)) ; la Charte canadienne des droits et libertés s'applique à ce corps dirigeant (art. 19).", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/TexteComplet.html"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi autochtone sur les services à l'enfance et à la famille a force de loi fédérale, avec ses modifications successives, une fois l'accord de coordination conclu ou après un an d'efforts raisonnables (art. 20(3), 21(1)) ; elle l'emporte sur les dispositions incompatibles des lois provinciales (art. 22(3)) et fédérales, sauf les articles 10 à 15 de la loi fédérale (normes minimales, dont l'intérêt de l'enfant) et la Loi canadienne sur les droits de la personne (art. 22(1)) ; la compétence se limite à ce domaine.", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/TexteComplet.html"}
  justice_propre: {valeur: "partiel", note: "La compétence affirmée comprend celle de prévoir des mécanismes de résolution des différends pour l'exécution des lois autochtones (art. 18(2)) ; la loi fédérale ne crée aucune juridiction autochtone ; dans les procédures judiciaires civiles relatives à un enfant autochtone, le corps dirigeant a le droit de faire des représentations (art. 13 b).", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/TexteComplet.html"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Avant toute mesure importante à l'égard d'un enfant autochtone, et dans la mesure où cela est compatible avec l'intérêt de l'enfant, le responsable de la fourniture des services avise le corps dirigeant autochtone qui agit pour le groupe de l'enfant et qui s'est fait connaître de lui (art. 12(1)) ; le corps dirigeant peut faire des représentations dans les procédures civiles (art. 13 b) ; les règlements ne peuvent être pris que si les corps dirigeants touchés ont eu l'occasion de collaborer de façon significative à leurs orientations (art. 32(1)) ; aucun droit de veto n'est prévu.", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/TexteComplet.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'accord de coordination peut porter sur des arrangements fiscaux (accords de financement) durables, fondés sur les besoins et conformes au principe de l'égalité réelle (art. 20(2) c) ; la loi ne garantit ni montant ni pouvoir d'imposition, et le financement dépend de la négociation de chaque accord.", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/TexteComplet.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Au 3 septembre 2026, Services aux Autochtones Canada a reçu 140 avis d'intention et 97 demandes d'accord de coordination ; 16 accords ont été conclus et 19 lois autochtones sont en vigueur. Une étude de Hadley Friedland (revue Genealogy, 2025) relève l'absence de règlements et de formule de financement, des corps dirigeants qui font état de pressions des gouvernements fédéral et provinciaux pour assumer en même temps législation, services et règlement des différends, et près de 200 affaires judiciaires liées à la loi depuis janvier 2020, que les tribunaux interprètent de façons diverses.", source: "https://www.mdpi.com/2313-5778/9/3/84"}
chronologie:
  - {annee: 2019, evenement: "Sanction, le 21 juin, de la Loi concernant les enfants, les jeunes et les familles des Premières Nations, des Inuits et des Métis ; la procureure générale du Québec saisit ensuite la Cour d'appel du Québec d'un renvoi sur sa constitutionnalité."}
  - {annee: 2020, evenement: "Entrée en vigueur de la loi le 1er janvier."}
  - {annee: 2021, evenement: "Le 8 janvier, le Code de soins conformes aux traditions des nations indépendantes de Wabaseemoong est la première loi autochtone inscrite comme entrée en vigueur ; le 6 juillet, la Première Nation de Cowessess signe le premier accord de coordination conclu."}
  - {annee: 2022, evenement: "Le 10 février, la Cour d'appel du Québec juge la loi valide sauf l'article 21 et le paragraphe 22(3) (2022 QCCA 185) ; en juin, le Comité des droits de l'enfant de l'ONU salue son entrée en vigueur."}
  - {annee: 2024, evenement: "Le 9 février, la Cour suprême du Canada juge, à l'unanimité, la loi constitutionnelle dans son ensemble (2024 CSC 5)."}
  - {annee: 2026, evenement: "Au 3 septembre, 19 lois autochtones sont en vigueur et 16 accords ont été conclus ; le 10 juillet, Innu Takuaikan Uashat mak Mani-utenam conclut un accord de coordination."}
fiabilite:
  verifie: ["Articles 1, 8, 12, 13, 18 à 26 et 32 de la loi (version à jour au 21 septembre 2026, site de la législation du Canada).", "Tableau des lois autochtones en vigueur, des avis d'intention et des demandes d'accord de coordination, avec dates (Services aux Autochtones Canada, page modifiée le 10 septembre 2026, données au 3 septembre 2026).", "Arrêt 2024 CSC 5 du 9 février 2024 : validité de l'ensemble de la loi, article 21 qualifié d'incorporation par renvoi, paragraphe 22(3) qualifié de reformulation de la prépondérance fédérale, avis contraire de la Cour d'appel du Québec sur ces deux dispositions (« La cause en bref », Cour suprême du Canada).", "Paragraphe 31 des observations finales du Comité des droits de l'enfant sur le Canada (CRC/C/CAN/CO/5-6, 23 juin 2022).", "Date de l'avis de la Cour d'appel du Québec, 10 février 2022 (2022 QCCA 185), tirée du sommaire publié par le Blogue du CRL, pas de la décision elle-même."]
  non_confirme: ["La Cour suprême n'a pas tranché si le droit inhérent à l'autonomie gouvernementale en matière de services à l'enfance est protégé par l'article 35 ; elle a fondé la validité de la loi sur le paragraphe 91(24) de la Loi constitutionnelle de 1867 (analyse du cabinet Langlois).", "Aucune loi métisse ni inuit hors Inuvialuit n'est inscrite comme entrée en vigueur ; la Fédération Métisse du Manitoba a donné avis dès 2019.", "Population des groupes concernés : aucune source consolidée trouvée.", "Base « personnelle » retenue parce que les lois autochtones s'appliquent aux enfants du groupe selon leurs liens (art. 23 et 24) ; la force de loi reste rattachée à chaque province ou territoire où le groupe est situé (art. 20).", "Les textes des 19 lois autochtones n'ont pas été lus un à un ; leurs mécanismes propres de règlement des différends ne sont pas décrits ici."]
