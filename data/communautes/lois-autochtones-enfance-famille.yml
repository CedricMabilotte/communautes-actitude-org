reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'enfant salue l'entrée en vigueur, en janvier 2020, de la loi qui reconnaît la compétence des peuples autochtones sur les services à l'enfance et à la famille, tout en relevant la surreprésentation persistante des enfants autochtones placés (observations finales sur le Canada, CRC/C/CAN/CO/5-6, par. 31).", annee: 2022, source: "https://documents.un.org/api/symbol/access?s=CRC/C/CAN/CO/5-6&l=en&t=pdf"}
  - {mecanisme: "dnudpa", detail: "La loi a pour objet de contribuer à la mise en œuvre de la Déclaration des Nations unies sur les droits des peuples autochtones (art. 8 c) ; son préambule rappelle l'engagement du gouvernement du Canada à mettre en œuvre la Déclaration.", annee: 2019, source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/TexteComplet.html"}
base_nationale:
  - {instrument: "Loi concernant les enfants, les jeunes et les familles des Premières Nations, des Inuits et des Métis, L.C. 2019, ch. 24 (sanctionnée le 21 juin 2019, en vigueur le 1er janvier 2020)", nature: "loi", annee: 2019, source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.73/page-1.html"}
