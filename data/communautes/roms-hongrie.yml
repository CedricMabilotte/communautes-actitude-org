droits:
  autogouvernement: {valeur: "reconnu", note: "Les nationalités ont le droit de créer des autogouvernements locaux et nationaux, Loi fondamentale, art. XXIX, al. 2 ; la loi CLXXIX de 2011 organise leur élection.", source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Les autogouvernements des nationalités donnent leur avis et leur consentement sur les questions d'éducation, de culture et d'usage de la langue qui concernent leur communauté, loi CLXXIX de 2011, selon le rapport de la Hongrie au Conseil de l'Europe (2019).", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  langue: {valeur: "partiel", note: "Droit d'utiliser sa langue maternelle et de recevoir un enseignement dans cette langue, Loi fondamentale, art. XXIX, al. 1 ; aucun statut de langue officielle territoriale.", source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  education: {valeur: "partiel", note: "Les nationalités peuvent créer des établissements ou reprendre des établissements culturels et scolaires gérés par d'autres entités, loi CLXXIX de 2011, selon le rapport de la Hongrie au Conseil de l'Europe (2019).", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  fiscalite: {valeur: "partiel", note: "Les autogouvernements des minorités sont financés par le budget de l'État ; le budget global alloué aux minorités nationales atteint 23 milliards de forints en 2024, contre 3,5 milliards en 2011, selon le Comité consultatif de la Convention-cadre (2025, § 59) ; aucune source consultée ne mentionne de pouvoir fiscal propre.", source: "https://rm.coe.int/acfc-op-vi-2025-4-6th-acfc-opinion-on-hungary-fr/48802ac9f6"}
  representation: {valeur: "partiel", note: "La participation des nationalités à l'Assemblée nationale est réglée par une loi cardinale, Loi fondamentale, art. 2, al. 2 ; la loi CCIII de 2011 accorde un mandat préférentiel à une liste de nationalité qui obtient un quart des voix normalement requises, sinon un porte-parole sans droit de vote.", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre (avis de 2025, § 8) relève que la coopération entre autogouvernements nationaux et locaux des minorités est limitée, que les autogouvernements locaux peinent à coopérer avec les autorités locales et que le système de représentation parlementaire des minorités reste insatisfaisant ; il signale aussi la ségrégation scolaire des élèves roms comme un enjeu systémique. Aux élections de 2024, 1 128 autogouvernements locaux roms ont été élus, contre 1 208 en 2019 (Dobos et Szabó, Comitatus, 2025).", source: "https://rm.coe.int/acfc-op-vi-2025-4-6th-acfc-opinion-on-hungary-fr/48802ac9f6"}
chronologie:
  - {annee: 1993, evenement: "Loi LXXVII sur les droits des minorités nationales et ethniques : premiers autogouvernements des minorités."}
  - {annee: 2011, evenement: "Loi fondamentale (art. XXIX) et loi CLXXIX sur les droits des nationalités."}
  - {annee: 2019, evenement: "Élection de 1 208 autogouvernements locaux roms."}
  - {annee: 2024, evenement: "Élections des autogouvernements des nationalités : 1 128 autogouvernements locaux roms et 20 territoriaux (2 146 locaux toutes nationalités confondues) ; 234 123 électeurs inscrits sur la liste rom."}
  - {annee: 2025, evenement: "Sixième avis du Comité consultatif de la Convention-cadre sur la Hongrie (adopté le 15 octobre, publié le 3 mars 2026)."}
