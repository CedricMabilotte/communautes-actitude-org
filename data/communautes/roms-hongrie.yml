resume: >-
  Les Roms sont l'une des treize nationalités reconnues en Hongrie. La Loi fondamentale leur reconnaît le droit de créer des autogouvernements locaux et nationaux (art. XXIX), organisés par la loi CLXXIX de 2011 sur les droits des nationalités. Les électeurs inscrits sur la liste rom élisent des autogouvernements locaux, territoriaux et l'Autogouvernement national rom. Ces organes donnent leur avis ou leur consentement sur les questions d'éducation, de culture et d'usage de la langue, et peuvent reprendre des établissements scolaires et culturels.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Sixième avis du Comité consultatif de la Convention-cadre (ACFC/OP/VI(2025)4, adopté le 15 octobre 2025, publié le 3 mars 2026) : il relève une coopération limitée entre autogouvernements nationaux et locaux des minorités, des difficultés des autogouvernements locaux avec les autorités locales et une représentation parlementaire jugée insatisfaisante.", annee: 2025, source: "https://rm.coe.int/acfc-op-vi-2025-4-6th-acfc-opinion-on-hungary-fr/48802ac9f6"}
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième rapport de la Hongrie au titre de la Convention-cadre (5 février 2019) : il décrit la loi CLXXIX de 2011, les droits de consentement des autogouvernements, le mandat préférentiel au Parlement et le financement des nationalités.", annee: 2019, source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
