droits:
  autogouvernement: {valeur: "reconnu", note: "Les nationalités ont le droit de créer des autogouvernements locaux et nationaux, Loi fondamentale, art. XXIX, al. 2 ; la loi CLXXIX de 2011 organise leur élection.", source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Les autogouvernements des nationalités donnent leur avis et leur consentement sur les questions d'éducation, de culture et d'usage de la langue qui concernent leur communauté, loi CLXXIX de 2011, selon le rapport de la Hongrie au Conseil de l'Europe (2019).", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  langue: {valeur: "partiel", note: "Droit d'utiliser sa langue maternelle et de recevoir un enseignement dans cette langue, Loi fondamentale, art. XXIX, al. 1 ; aucun statut de langue officielle territoriale.", source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  education: {valeur: "partiel", note: "Les nationalités peuvent créer des établissements ou reprendre des établissements culturels et scolaires gérés par d'autres entités, loi CLXXIX de 2011, selon le rapport de la Hongrie au Conseil de l'Europe (2019).", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  fiscalite: {valeur: "partiel", note: "Les autogouvernements reçoivent un financement normatif de l'État ; le soutien central est passé de 4 682,4 millions de forints en 2014 à 10 377,7 millions en 2018 pour l'ensemble des nationalités ; aucun pouvoir fiscal.", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  representation: {valeur: "partiel", note: "La participation des nationalités à l'Assemblée nationale est réglée par une loi cardinale, Loi fondamentale, art. 2, al. 2 ; la loi CCIII de 2011 accorde un mandat préférentiel à une liste de nationalité qui obtient un quart des voix normalement requises, sinon un porte-parole sans droit de vote.", source: "https://rm.coe.int/5th-sr-hungary-en/168092522f"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante consultée sur l'exercice effectif des droits de consentement ; le nombre d'autogouvernements locaux de nationalité a baissé de 42 entre 2019 et 2024 (2 146 au total), principalement du fait des autogouvernements roms (revue Comitatus).", source: "https://comitatus.sze.hu/a-2024-evi-nemzetisegi-onkormanyzati-valasztasok"}
