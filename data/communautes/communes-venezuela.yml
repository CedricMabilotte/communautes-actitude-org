  - {instrument: "Loi de réforme de la loi organique des communes, Gaceta Oficial n° 6.872 extraordinaire du 30 décembre 2024", nature: "loi_organique", annee: 2024, source: "https://faolex.fao.org/docs/pdf/ven100031.pdf"}
  - {instrument: "Loi de réforme partielle de la loi organique de la juridiction spéciale de justice de paix communale, Gaceta Oficial n° 6.854 extraordinaire du 14 novembre 2024", nature: "loi_organique", annee: 2024, source: "https://www.traviesoevans.com/travieso/wp-content/uploads/gacetas/2024/11-noviembre/2024-11-14-6854-extraordinario.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 2010 définit la commune comme entité locale (art. 5) chargée de « conformer l'autogouvernement » (art. 7) ; le parlement communal en est l'instance maximale (art. 21) ; il réunit un porte-parole (vocero) élu par chaque conseil communal, trois élus des organisations socio-productives et un représentant de la banque de la commune, pour trois ans (art. 23). La réforme de 2024 organise un « gouvernement de la commune » (art. 21-22) dont le parlement réunit un porte-parole par conseil communal élu au suffrage universel, direct et secret (art. 26) ; la personnalité juridique dépend de l'enregistrement auprès du ministère (art. 17-18), et les communes s'articulent aux unités de gestion territoriale fixées par l'État.", source: "https://faolex.fao.org/docs/pdf/ven100031.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le parlement communal sanctionne les chartes communales, normes qui règlent la vie sociale et communautaire, après débat dans les assemblées de citoyens (loi de 2010, art. 18 et 22) ; ces normes restent subordonnées à la Constitution et aux lois (art. 18). La réforme de 2024 qualifie le parlement d'« instance législative » du gouvernement de la commune (art. 26).", source: "https://www.comunas.gob.ve/wp-content/uploads/2022/05/Ley-Organica-de-las-Comunas.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi de 2010 prévoit une justice communale de règlement amiable (arbitrage, conciliation, médiation) sans empiéter sur la justice ordinaire (art. 56). La loi organique de justice de paix communale, réformée en novembre 2024, fait élire jusqu'à trois juges de paix communaux par ressort territorial pour trois ans (art. 4 et 15), avec pouvoir de connaître et de décider des affaires de leur compétence (art. 3) ; la réforme de la loi des communes ajoute un conseil de justice de paix de la commune (art. 22 et 49).", source: "https://www.traviesoevans.com/travieso/wp-content/uploads/gacetas/2024/11-noviembre/2024-11-14-6854-extraordinario.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "Le conseil de contrôle (contraloría, surveillance citoyenne) de la commune surveille les plans et projets exécutés dans son ressort par le pouvoir populaire ou les pouvoirs publics (loi de 2010, art. 45 et 47 ; réforme de 2024, art. 47) ; c'est un contrôle en cours d'exécution, et aucune obligation de consultation préalable ou de consentement n'est inscrite.", source: "https://www.comunas.gob.ve/wp-content/uploads/2022/05/Ley-Organica-de-las-Comunas.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La banque de la commune gère les ressources financières assignées ou captées par la commune, et finance des projets après approbation du parlement communal (loi de 2010, art. 40 et 43) ; la réforme de 2024 exempte les communes de tout tribut national et droit d'enregistrement (art. 65). Aucun pouvoir d'imposition ni budget garanti par la loi n'a été trouvé.", source: "https://faolex.fao.org/docs/pdf/ven100031.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le ministère chargé des communes compte 5 338 communes et circuits communaux en avril 2025 et organise des consultations populaires nationales qui priorisent des projets financés (2024-2026). L'organisation Acceso a la Justicia juge la justice de paix communale de constitutionnalité douteuse, rattachée au pouvoir exécutif plutôt qu'aux municipalités, et relève une élection de décembre 2024 préparée en un mois avec la participation déclarée de partis de la majorité gouvernementale. Après la capture de Nicolás Maduro en janvier 2026, le gouvernement par intérim maintient le ministère des Communes et ses consultations.", source: "https://accesoalajusticia.org/cinco-motivos-preocupacion-ley-justicia-paz-comunal/"}
chronologie:
  - {annee: 2010, evenement: "Loi organique des communes, sanctionnée le 13 décembre et promulguée le 21 décembre."}
  - {annee: 2024, evenement: "Réforme de la loi organique de justice de paix communale (14 novembre) ; élection des juges de paix communaux le 15 décembre."}
  - {annee: 2024, evenement: "Loi de réforme de la loi organique des communes, publiée le 30 décembre (Gaceta Oficial n° 6.872 extraordinaire)."}
  - {annee: 2025, evenement: "Le ministère compte 5 338 communes et circuits communaux regroupant 47 214 conseils communaux (avril)."}
  - {annee: 2026, evenement: "Le 3 janvier, les forces des États-Unis capturent le président Nicolás Maduro ; Delcy Rodríguez exerce la présidence par intérim à partir du 5 janvier. Aucune abrogation des lois sur les communes n'est relevée."}
  - {annee: 2026, evenement: "Première consultation populaire nationale de l'année le 8 mars dans 5 336 circuits communaux, en présence de la présidente par intérim et du ministre des Communes Ángel Prado ; une seconde est convoquée pour le 18 octobre."}
fiabilite:
  verifie: ["Articles 5 à 26, 40 à 44, 56 à 66 et dispositions transitoires et finales de la loi organique des communes de 2010 (édition de l'Imprenta Nacional publiée par le ministère).", "Réforme du 30 décembre 2024 (Gaceta Oficial n° 6.872 extraordinaire) : articles 17-18 (enregistrement), 21-22 (gouvernement de la commune), 26 (parlement), 49 (conseil de justice de paix), 65 (exemption fiscale).", "Loi de réforme partielle de la loi organique de la juridiction spéciale de justice de paix communale (Gaceta Oficial n° 6.854 extraordinaire du 14 novembre 2024), articles 3, 4 et 15.", "5 338 communes et circuits communaux et 47 214 conseils communaux (ministère, 27 avril 2025) ; 4 505 communes et circuits communaux en août 2024 (même page) ; 5 418 territoires communaux préparant la consultation du 18 octobre 2026 (Fundacomunal, 17 septembre 2026).", "Consultation du 8 mars 2026 dans 5 336 circuits communaux, avec Delcy Rodríguez, présidente par intérim, et le ministre des Communes Ángel Prado (ministère, 8 mars 2026)."]
  non_confirme: ["Nombre de communes au sens strict : le ministère publie des totaux qui mêlent communes et circuits communaux (regroupements de conseils communaux en voie de former une commune), et ses pages les nomment tantôt « comunas », tantôt « circuitos comunales ».", "Population, surface et liste des communes : le registre ministériel et l'observatoire des indicateurs communaux n'ont pas été consultés ; d'où l'absence de tableau.", "Nombre de juges de paix communaux élus le 15 décembre 2024 : plus de 30 000 selon Acceso a la Justicia, 28 486 selon Efecto Cocuyo.", "Les communes ne figurent pas dans la Constitution de 1999 ; leur fondement constitutionnel est discuté par des juristes vénézuéliens, sans décision de justice consultée.", "Aucun document onusien ou régional nommant ce régime n'a été trouvé.", "Effets du changement de direction de l'exécutif en 2026 sur le régime : aucune abrogation, suspension ou réforme des lois de 2010 et de 2024 n'a été relevée entre janvier et le 6 octobre 2026 ; le ministère des Communes et Fundacomunal poursuivent les consultations (8 mars, 18 octobre). La Gaceta Oficial de 2026 n'a pas été dépouillée en entier ; des décrets de 2026 ont supprimé ou réorganisé au moins sept missions et fondations sociales, sans lien établi avec les communes."]
