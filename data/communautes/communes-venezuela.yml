resume: >-
  La commune (comuna) est une entité locale formée par l'agrégation de communautés voisines organisées en conseils communaux (consejos comunales), créée par la loi organique des communes du 21 décembre 2010. Elle naît d'une charte fondatrice approuvée par référendum des habitants, puis acquiert la personnalité juridique par son enregistrement auprès du ministère chargé de la participation citoyenne. Elle se dote d'un parlement communal qui adopte des chartes communales (normes locales), d'un conseil exécutif, d'une banque de la commune et, depuis 2024, de juges de paix communaux élus. Son ressort peut ne pas suivre les limites des États et des municipalités ; le régime n'a pas de base ethnique et s'inscrit dans l'« État communal » que la loi de 2010 donne pour but à la commune (art. 6). La loi a été réformée le 30 décembre 2024. Les terres collectives autochtones font l'objet de la fiche « Peuples autochtones du Venezuela (habitat et terres collectives) ».
