resume: >-
  Les Ju|'hoansi sont un peuple san du nord-est de la Namibie, organisé en communautés réparties sur leurs territoires traditionnels.
  En février 1998, la zone de Nyae Nyae est devenue la première conservancy communale (zone de gestion communautaire de la faune) du pays, au titre de la loi de 1996 sur la conservation de la nature.
  Leur autorité traditionnelle, dont le chef a été désigné en 1998, exerce les fonctions prévues par la loi de 2000 sur les autorités traditionnelles et attribue les droits fonciers coutumiers au titre de la loi de 2002 sur la réforme des terres communales ; la terre communale reste propriété de l'État.
  Les régimes généraux sont décrits dans les fiches « Conservancies communales de Namibie », « Forêts communautaires de Namibie » et « Autorités traditionnelles et terres communales de Namibie ».
