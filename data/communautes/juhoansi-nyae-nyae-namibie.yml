reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial sur les droits des peuples autochtones sur la Namibie (A/HRC/24/41/Add.1, 2013), § 3, 22, 27 et 85 : visite aux Ju/’hoansi de la conservancy de Nyae Nyae ; droits de gestion des ressources naturelles et de chasse traditionnelle à l’arc ; empiètements par des groupes extérieurs et clôtures illégales, dont il recommande l’enquête.", annee: 2013, source: "https://documents.un.org/api/symbol/access?s=A/HRC/24/41/Add.1&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la Namibie, art. 66, 100 et 102(5)", nature: "constitution", annee: 1990, source: "https://www.constituteproject.org/constitution/Namibia_2014?lang=en"}
  - {instrument: "Nature Conservation Amendment Act (loi modifiant la loi sur la conservation de la nature) n° 5 de 1996, art. 3 insérant l'art. 24A dans l'ordonnance n° 4 de 1975", nature: "loi", annee: 1996, source: "https://faolex.fao.org/docs/pdf/nam18004.pdf"}
  - {instrument: "Traditional Authorities Act (loi sur les autorités traditionnelles) n° 25 de 2000, art. 3", nature: "loi", annee: 2000, source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  - {instrument: "Communal Land Reform Act (loi sur la réforme des terres communales) n° 5 de 2002, art. 17, 20 et 30", nature: "loi", annee: 2002, source: "https://faolex.fao.org/docs/pdf/nam64022.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Loi n° 25 de 2000 : l'autorité traditionnelle ju|'hoan, reconnue par l'État, veille au bien-être de la communauté et à l'observation de son droit coutumier (art. 3(1)) ; le comité de la conservancy gère la faune (loi de 1996, art. 24A).", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Art. 66 de la Constitution : le droit coutumier en vigueur à l’indépendance reste valide s’il ne contredit ni la Constitution ni la loi ; loi n° 25 de 2000 : l’autorité traditionnelle établit le droit coutumier après consultation et aide à sa codification (art. 3(1)(a)) et peut édicter des lois coutumières (art. 3(3)(c)).", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  justice_propre: {valeur: "partiel", note: "Loi n° 25 de 2000 : l’autorité traditionnelle administre et applique le droit coutumier de la communauté (art. 3(1)(b)) et peut entendre et régler les différends entre ses membres selon ce droit (art. 3(3)(b)).", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  terres: {valeur: "partiel", note: "Loi n° 5 de 2002 : les terres communales appartiennent à l’État, en fiducie au bénéfice des communautés traditionnelles qui y résident, et aucune propriété pleine et entière n’y est possible (art. 17) ; le chef ou l’autorité traditionnelle attribue et annule les droits fonciers coutumiers (art. 20).", source: "https://faolex.fao.org/docs/pdf/nam64022.pdf"}
  ressources: {valeur: "partiel", note: "Loi n° 5 de 1996, art. 24A : les résidents d’une terre communale constitués en conservancy obtiennent, par leur comité, des droits d’usage et de gestion du gibier ; Nyae Nyae est la seule terre communale où les San peuvent chasser selon leurs méthodes traditionnelles (Rapporteur spécial de l’ONU, 2013, par. 27). L’art. 100 de la Constitution attribue à l’État les ressources naturelles qui n’appartiennent pas légalement à un autre propriétaire.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/24/41/Add.1&l=en&t=pdf"}
  consentement: {valeur: "partiel", note: "Loi n° 5 de 2002, art. 30(4) à (6) : le conseil foncier communal (organe régional qui enregistre les droits) ne peut accorder un bail sur une terre communale qu’avec le consentement de l’autorité traditionnelle ; un arbitre peut passer outre un refus jugé déraisonnable.", source: "https://faolex.fao.org/docs/pdf/nam64022.pdf"}
  langue: {valeur: "partiel", note: "Art. 3(1)(c) de la loi de 2000 : l'autorité traditionnelle protège et promeut la culture, la langue, les traditions et les valeurs de la communauté. Pas de statut officiel de la langue.", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Art. 102(5) de la Constitution : Conseil des dirigeants traditionnels, consultatif, auprès du président.", source: "https://www.constituteproject.org/constitution/Namibia_2014?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial de l’ONU (2013) relève que la conservancy donne aux Ju/’hoansi une part de contrôle sur les ressources, mais qu’elle subit des empiètements sans intervention de l’État. Selon Hitchcock et Kelly (2026), des éleveurs herero entrés en avril 2009 avec plus d’un millier de bovins ont vu leur bétail confisqué par l’État, ont obtenu une indemnisation et le nombre de bovins a depuis augmenté ; l’autorité traditionnelle a demandé en 2018 une ordonnance de la Haute Cour contre le pâturage illégal ; une requête foncière de 2018 a été radiée pour vice de procédure, et une nouvelle requête de terres ancestrales a été déposée en 2025 devant la Haute Cour. La conservancy a perçu environ 7 millions de dollars namibiens en 2023 et 2024.", source: "https://nje.org.na/index.php/nje/article/view/volume12-hitchcock"}
chronologie:
  - {annee: 1981, evenement: "Début du retour des Ju|'hoansi de Tsumkwe vers leurs territoires traditionnels."}
  - {annee: 1990, evenement: "Indépendance et Constitution de la Namibie (art. 66 : droit coutumier)."}
  - {annee: 1996, evenement: "Loi sur les conservancies communales."}
  - {annee: 1998, evenement: "Enregistrement de la conservancy de Nyae Nyae en février, la première du pays."}
  - {annee: 1998, evenement: "Désignation de Tsamkxao ≠Oma comme chef de l’autorité traditionnelle ju|’hoan."}
  - {annee: 2000, evenement: "Loi sur les autorités traditionnelles."}
  - {annee: 2002, evenement: "Loi sur la réforme des terres communales."}
  - {annee: 2009, evenement: "Arrivée de troupeaux herero dans la conservancy (avril) ; confiscation du bétail par l’État un mois plus tard."}
  - {annee: 2013, evenement: "Rapport du Rapporteur spécial de l’ONU sur la Namibie, qui relève les empiètements à Nyae Nyae."}
  - {annee: 2018, evenement: "Demande d’ordonnance de l’autorité traditionnelle devant la Haute Cour contre le pâturage illégal ; requête foncière radiée pour vice de procédure."}
  - {annee: 2025, evenement: "Nouvelle requête de terres ancestrales portée devant la Haute Cour."}
