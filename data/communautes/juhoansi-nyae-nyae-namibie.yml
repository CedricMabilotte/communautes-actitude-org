  verifie: ["Art. 66, 100 et 102(5) de la Constitution (Constitute Project).", "Art. 3(1) et 3(3) de la loi n° 25 de 2000 (texte annoté du Legal Assistance Centre).", "Art. 17, 20 et 30 de la loi n° 5 de 2002 et art. 24A inséré par la loi n° 5 de 1996 (copies FAOLEX).", "Superficie (8 994 km²), date de déclaration (février 1998) et population approximative (3 400) : liste NACSO.", "36 communautés en juillet 2025, désignation du chef en 1998, procédures judiciaires de 2018 et 2025 : Hitchcock et Kelly (2026).", "Par. 3, 9, 22, 27 et 85 du rapport A/HRC/24/41/Add.1 (2013)."]
