  pouvoir_normatif: {valeur: "partiel", note: "Art. 66 de la Constitution : le droit coutumier en vigueur à l'indépendance reste valide s'il ne contredit ni la Constitution ni la loi ; art. 3(1)(a) de la loi de 2000 : l'autorité traditionnelle établit le droit coutumier après consultation et aide à sa codification.", source: "https://www.constituteproject.org/constitution/Namibia_2014?lang=en"}
  justice_propre: {valeur: "partiel", note: "Art. 3(1)(b) de la loi de 2000 : l'autorité traditionnelle administre et applique le droit coutumier de la communauté.", source: "https://www.nid.org.na/images/pdf/democracy/Traditional_Authorities_Acts.pdf"}
