resume: >-
  Fiche agrégée : elle couvre les communautés villageoises du Botswana qui ont constitué une fiducie (trust, entité qui gère des biens pour le compte de ses membres) ou une autre organisation communautaire pour gérer les ressources naturelles de leur zone. La politique de gestion communautaire des ressources naturelles (CBNRM), document gouvernemental n° 2 de 2007, permet à ces organisations d'obtenir de l'autorité foncière un bail de 15 ans sur une zone de chasse contrôlée et de sous-louer leurs droits d'usage commercial à des opérateurs privés. La première fiducie (Chobe Enclave Conservation Trust) date de 1993 ; 105 organisations étaient enregistrées en 2012. Les zones de gestion de la faune sur terres tribales et terres de l'État couvrent 22 % du territoire selon la politique de 2007. La base est une politique gouvernementale adoptée par le Parlement, mise en œuvre par des baux ; la fiche n'a pas trouvé de loi propre à ces organisations.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Botswana à la Convention sur la diversité biologique (2015) : il décrit les revenus des organisations communautaires de 1997 à 2012, relève leur baisse depuis la mise en œuvre de la politique CBNRM de 2007 et donne les revenus de cinq organisations du district de Ngamiland (Sankuyo, Khwai, Mababe, OCT, OKMCT) de 2000 à 2012", annee: 2015, source: "https://www.cbd.int/doc/world/bw/bw-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Wildlife Conservation and National Parks Act (loi sur la conservation de la faune et les parcs nationaux), chap. 38:01, loi n° 28 de 1992, art. 15 (zones de gestion de la faune), 16 (zones de chasse contrôlée) et 32 (quotas par zone)", nature: "loi", annee: 1992, source: "https://faolex.fao.org/docs/pdf/bot4728.pdf"}
  - {instrument: "Community Based Natural Resources Management Policy (politique de gestion communautaire des ressources naturelles), Government Paper No. 2 of 2007, ministère de l'Environnement, de la Faune et du Tourisme", nature: "loi", annee: 2007, source: "https://faolex.fao.org/docs/pdf/bot196849.pdf"}
  - {instrument: "National Environmental Fund Order (arrêté sur le Fonds national pour l'environnement), S.I. 70 de 2010, modifié par S.I. 11 de 2018, par. 4 (2) (b) et 7 (b)", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/BOT197178.pdf"}
  - {instrument: "Tribal Land Act (loi sur les terres tribales) n° 1 de 2018, art. 4 (dévolution des terres aux conseils fonciers) et 27 (concession par bail)", nature: "loi", annee: 2018, source: "https://faolex.fao.org/docs/pdf/bot204211.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Politique de 2007, définitions et par. 5.1.3.1 et 5.2 : pour exercer les droits d'usage, la communauté constitue une entité juridique représentative et responsable (fiducie, coopérative ou association) qui gère les ressources et les bénéfices pour le bien commun et doit fonctionner de façon démocratique ; par. 10.1 : le gouvernement se réserve le droit d'intervenir en cas d'activités illégales ou irrégulières dans la gestion des bénéfices et des biens.", source: "https://faolex.fao.org/docs/pdf/bot196849.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Politique de 2007, par. 5.1.1 : la communauté peut obtenir de l'autorité foncière un bail de 15 ans (Community Natural Resource Management Lease) pour l'usage commercial des ressources, soumis à un plan d'utilisation des terres et à un loyer annuel. Les terres tribales restent dévolues aux conseils fonciers « en fiducie » au profit des citoyens du Botswana (art. 4 de la loi de 2018, entrée en vigueur sur avis), qui concèdent des baux (art. 27) ; la politique précise que les droits d'usage ne sont pas des droits de propriété.", source: "https://faolex.fao.org/docs/pdf/bot196849.pdf"}
  ressources: {valeur: "partiel", note: "Politique de 2007, par. 5.1.2 : la communauté peut sous-louer ou céder ses droits d'usage commercial à des partenaires avec l'accord écrit de l'autorité foncière ; par. 6.4 : le gouvernement fixe les quotas de prélèvement ; par. 10.3 : la fiducie garde 35 % du produit de la vente des concessions et des quotas de chasse, 65 % vont au Fonds national pour l'environnement, que l'arrêté de 2010 (par. 7 (b)) alimente par les recettes de la vente des quotas de chasse et des concessions des communautés. La loi de 1992 (art. 32 (2)) confie au directeur de la faune la fixation des quotas par zone de chasse contrôlée.", source: "https://faolex.fao.org/docs/pdf/bot196849.pdf"}
  consentement: {valeur: "partiel", note: "Politique de 2007, par. 9.3 : la communauté de la zone où une concession est mise en adjudication est consultée sur le choix du partenaire ; la décision revient au comité technique consultatif de district, sous réserve de l'approbation écrite de l'autorité foncière.", source: "https://faolex.fao.org/docs/pdf/bot196849.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
