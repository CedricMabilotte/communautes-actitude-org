  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Mbaiwa (2015), les fiducies du nord sous-louent leurs zones à des sociétés de safari et leur ont ainsi transféré l'essentiel des droits d'usage et de gestion ; les partenariats n'ont pas fait des communautés les gestionnaires des entreprises touristiques, et la vente des quotas de chasse a cessé avec l'interdiction de la chasse de 2014. Selon IWGIA (2025), certaines fiducies peuvent chasser un nombre limité d'animaux avec leurs partenaires, surtout des sociétés de chasse. Le cinquième rapport national à la CDB (2015), source gouvernementale, indique une baisse des revenus des organisations communautaires après 2008 et une concentration de 68 % des revenus sur cinq organisations proches des parcs (moyenne 1997-2012).", source: "https://lawexplores.com/community-based-natural-resource-management-in-botswana/"}
chronologie:
  - {annee: 1986, evenement: "Politique de conservation de la faune : les zones réservées des plans d'utilisation des terres deviennent des zones de gestion de la faune."}
  - {annee: 1992, evenement: "Loi n° 28 de 1992 sur la conservation de la faune et les parcs nationaux (entrée en vigueur le 11 décembre 1992)."}
  - {annee: 1993, evenement: "Premier projet pilote : Chobe Enclave Conservation Trust."}
  - {annee: 1995, evenement: "Deuxième projet : Sankoyo Tshwaragano Management Trust."}
  - {annee: 2007, evenement: "Politique de gestion communautaire des ressources naturelles (document gouvernemental n° 2 de 2007), adoptée par le Parlement."}
  - {annee: 2009, evenement: "105 organisations communautaires enregistrées (83 en 2003, 96 en 2006)."}
  - {annee: 2010, evenement: "Arrêté du 6 avril 2010 créant le Fonds national pour l'environnement, alimenté par la vente des quotas de chasse et des concessions des communautés."}
  - {annee: 2014, evenement: "Adoption d'une interdiction de la chasse."}
  - {annee: 2018, evenement: "Loi n° 1 de 2018 sur les terres tribales (sanction le 19 février 2018, entrée en vigueur sur avis au Journal officiel)."}
fiabilite:
  verifie: ["Texte de la politique CBNRM de 2007 : bail de 15 ans, sous-location, partage 35 % / 65 %, consultation sur le partenaire (copie FAOLEX).", "Art. 15, 16 et 32 de la loi de 1992 et date d'entrée en vigueur (copie FAOLEX).", "Par. 4 et 7 de l'arrêté sur le Fonds national pour l'environnement de 2010 (copie FAOLEX).", "Art. 4 et 27 de la loi sur les terres tribales de 2018 (copie FAOLEX).", "105 organisations communautaires enregistrées en 2009 et 2012 ; 45 organisations, 123 villages et 283 123 personnes en 2012 (chapitre de Mbaiwa reproduit sur lawexplores.com).", "Revenus des organisations communautaires 1997-2012 (cinquième rapport national à la CDB, 2015).", "Sous-location des zones aux sociétés de safari, adoption de la politique par le Parlement en 2007 et interdiction de la chasse en 2014 (chapitre de Mbaiwa).", "Chasse limitée de certaines fiducies avec des partenaires et saison 2024-2025 avec 400 licences d'éléphant (IWGIA, 2025)."]
  non_confirme: ["Levée de l'interdiction de la chasse en 2019 : non vérifiée sur une source ouverte ; IWGIA (2025) atteste une saison de chasse 2024-2025 avec 400 licences d'éléphant.", "Date d'entrée en vigueur de la loi de 2018 sur les terres tribales et sort des baux accordés sous la loi précédente : non vérifiés.", "Application actuelle du partage 35 % / 65 % : le ministre peut faire varier ces taux (par. 10.3) ; pratique non vérifiée.", "Surface louée aux fiducies : aucun total trouvé ; les zones de gestion de la faune désignées en 2004 couvrent 66 750 km² (11,35 % du territoire) et 22 % avec les zones proposées, selon Mbaiwa.", "Liste officielle des fiducies et de leurs zones : non trouvée, d'où l'absence de tableau.", "Nombre de fiducies en activité après 2012 : non trouvé."]
