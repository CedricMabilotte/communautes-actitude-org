resume: >-
  Population d'Anguilla, île des Petites Antilles située à 8 km au nord de Saint-Martin, territoire britannique d'outre-mer inscrit sur la liste des territoires non autonomes de l'ONU. Rattachée à Saint-Christophe-et-Niévès, l'île fait sécession en 1967 ; le Royaume-Uni y rétablit son autorité en 1969 et l'en sépare formellement par l'Anguilla Act de 1980. La Constitution de 1982, modifiée en 1990, 2019 et 2020, institue une Chambre d'assemblée dont tous les membres non ex officio sont élus depuis 2020, et un Conseil exécutif dirigé par un Premier (chef du gouvernement), le gouverneur nommé par la Couronne gardant la défense, les relations extérieures, la sécurité intérieure, les services financiers internationaux et la fonction publique. Le statut d'« Anguillian » (Anguillais), redéfini en 2019, conditionne le vote, l'éligibilité et la détention de terres sans licence.
