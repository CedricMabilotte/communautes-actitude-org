droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution de 1982 institue une Chambre d'assemblée (s. 35) et un Conseil exécutif formé du Premier, de trois ministres au plus et de deux membres ex officio (s. 23) ; depuis l'ordonnance de 2019 (art. 4), applicable à la dissolution de 2020, l'Assemblée ne compte plus de membres nommés : au moins sept élus de circonscriptions à un siège et quatre élus à l'échelle de l'île, plus le procureur général et le gouverneur adjoint ; le gouverneur nomme Premier l'élu qui réunit une majorité (s. 24) et doit suivre l'avis du Conseil exécutif hors de ses domaines réservés (s. 28).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/2&l=en&t=pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le gouverneur, avec l'avis et le consentement de l'Assemblée, fait les lois « pour la paix, l'ordre et le bon gouvernement » d'Anguilla (Constitution de 1982, s. 47) ; la Couronne garde le pouvoir de légiférer par ordonnance en conseil (Order, s. 9), le gouverneur peut réserver un projet à Londres (s. 57) ou le déclarer adopté dans l'intérêt de l'ordre public ou de la « foi publique » (crédit de l'État), sur instructions écrites préalables d'un secrétaire d'État sauf urgence (s. 56), et toute loi peut être annulée par désaveu (disallowance, s. 59).", source: "https://www.legislation.gov.uk/uksi/1982/334/made"}
  justice_propre: {valeur: "partiel", note: "Le droit applicable combine la common law d'Angleterre et du pays de Galles, les lois héritées de Saint-Christophe-Niévès-Anguilla jusqu'en 1971 et les lois adoptées depuis ; il est appliqué par la Cour suprême de la Caraïbe orientale, juridiction régionale commune aux membres de l'Organisation des États de la Caraïbe orientale (Constitution Order 1982, s. 3), avec recours final au Comité judiciaire du Conseil privé, à Londres ; une Commission du service judiciaire propre au territoire intervient dans les nominations (Constitution, s. 67 et 68).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/2&l=en&t=pdf"}
  terres: {valeur: "partiel", note: "Aucune terre ne peut être détenue par un « alien » (étranger), défini comme toute personne qui n'a pas le statut d'Anguillais, sans licence accordée par le gouverneur en conseil, sous peine de confiscation au profit de la Couronne, sauf location annuelle de 3 acres au plus pour la résidence ou l'activité professionnelle (Aliens Land Holding Regulation Act, s. 1, 3 et 4, modifiés en 2019) ; les concessions de terres de la Couronne relèvent du gouverneur (Constitution de 1982, s. 75).", source: "https://laws.gov.ai/storage/pdfs/2022%20AXA%20Revised%20Statutes%20and%20Regulations/PDF%20%28Acts%29/A-R.S.A.s/A055-Aliens%20Land%20Holding%20Regulation%20Act.pdf"}
  ressources: {valeur: "partiel", note: "Le gouverneur prend les règlements de protection, de gestion et de développement des pêches, licences comprises (Fisheries Protection Act, R.S.A. c. F40, s. 7), sur avis du Conseil exécutif, la matière ne relevant pas de ses domaines réservés (Constitution de 1982, s. 28) ; selon le Secrétariat de l'ONU (A/AC.109/2025/2), le département des Ressources naturelles, créé en 2020, gère ces ressources, le Conseil exécutif a adopté en avril 2016 le plan de développement des pêches 2015-2025, et le territoire a rejoint en 2023 le programme britannique Blue Belt de conservation marine.", source: "https://laws.gov.ai/storage/pdfs/2022%20AXA%20Revised%20Statutes%20and%20Regulations/PDF%20%28Acts%29/F-R.S.A.s/F040-Fisheries%20Protection%20Act.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "L'Education Act (Act 5/2012, R.S.A. c. E26) confie au ministre territorial, membre élu du Conseil exécutif, l'organisation du système éducatif, la création des écoles publiques et des établissements de formation (s. 3 et 4) ; selon le Secrétariat de l'ONU (A/AC.109/2025/2), l'île compte six écoles primaires et une école secondaire, et le Conseil exécutif a approuvé le 12 mai 2022 le plan de développement de l'éducation 2020-2025.", source: "https://laws.gov.ai/storage/pdfs/2022%20AXA%20Revised%20Statutes%20and%20Regulations/PDF%20%28Acts%29/E-R.S.A.s/E026-Education%20Act.pdf"}
  fiscalite: {valeur: "partiel", note: "Les impôts sont créés par loi locale, comme la taxe sur les biens et services adoptée par l'Assemblée le 29 juillet 2021, mais l'Assemblée ne peut examiner un projet qui crée ou augmente un impôt que sur recommandation du gouverneur (Constitution de 1982, s. 55, al. 2) ; un cadre de responsabilité budgétaire convenu avec le Royaume-Uni, transposé en droit local en novembre 2013, engage le gouvernement territorial à l'équilibre budgétaire, à des règles d'emprunt et à un plan budgétaire pluriannuel.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/2&l=en&t=pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La Constitution définit l'« Anguillian » (Constitution, s. 80, al. 2, rédaction de l'ordonnance de 2019, art. 12) par l'ascendance, la naissance, la naturalisation dans l'île ou l'octroi par une Commission du statut d'Anguillais, et en fait une condition du droit de vote (s. 43) et de l'éligibilité (s. 36) ; l'Anguillian Status Act (Act 1/2020) organise la Commission et la procédure d'octroi et de retrait.", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/109063/GBR109063.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Des élections générales ont eu lieu le 29 juin 2020 puis le 26 février 2025, avec alternance au poste de Premier (Anguilla United Front, huit sièges sur onze en 2025) ; la seconde phase de la réforme constitutionnelle, en négociation avec le Royaume-Uni depuis novembre 2019, reste ouverte : la résolution 79/100 de l'Assemblée générale (décembre 2024) demande que ces discussions soient conclues au plus vite ; le gouverneur garde ses domaines réservés.", source: "https://www.jamaicaobserver.com/2025/02/27/anguillians-elect-first-female-head-government/"}
chronologie:
  - {annee: 1650, evenement: "Colonisation par des colons britanniques et irlandais ; l'île est ensuite rattachée par intermittence à Saint-Christophe-et-Niévès."}
  - {annee: 1967, evenement: "Saint-Christophe-Niévès-Anguilla devient État associé du Royaume-Uni ; le 30 mai, les Anguillais expulsent la police de Saint-Christophe, puis un référendum approuve la sécession."}
  - {annee: 1969, evenement: "Second référendum et proclamation unilatérale d'une république ; intervention de troupes britanniques en mars et rétablissement de l'autorité britannique."}
  - {annee: 1980, evenement: "Anguilla Act du 16 décembre ; la séparation d'avec Saint-Christophe-et-Niévès prend effet le 19 décembre, Anguilla devient une dépendance distincte du Royaume-Uni."}
  - {annee: 1982, evenement: "Constitution d'Anguilla, en vigueur le 1er avril."}
  - {annee: 2013, evenement: "Cadre de responsabilité budgétaire convenu avec le Royaume-Uni transposé en droit local."}
  - {annee: 2019, evenement: "Ordonnance constitutionnelle du 10 avril, en vigueur le 14 mai : le Chief Minister devient Premier, limite de deux mandats consécutifs, statut d'« Anguillian » redéfini, suppression des membres nommés de l'Assemblée."}
  - {annee: 2020, evenement: "Anguillian Status Act en vigueur le 21 février ; élections du 29 juin, les premières avec quatre élus à l'échelle de l'île."}
  - {annee: 2024, evenement: "Résolution 79/100 de l'Assemblée générale du 4 décembre réaffirmant le droit du peuple d'Anguilla à l'autodétermination."}
  - {annee: 2025, evenement: "Élections générales du 26 février ; Cora Richardson-Hodge devient la première femme Premier."}
fiabilite:
  verifie: ["Pouvoir de la Couronne de légiférer (Order 1982, s. 9), Cour suprême de la Caraïbe orientale (Order, s. 3), Conseil exécutif (s. 23), consultation du Conseil et domaines réservés du gouverneur (s. 28 et 29), Assemblée (s. 35), pouvoir législatif, réserve, assentiment et désaveu des lois (s. 47, 55 à 59), Commission du service judiciaire (s. 67), concessions de terres (s. 75), dans le texte de SI 1982/334 sur legislation.gov.uk.", "Titre de Premier, limite de mandats, suppression des membres nommés, définition de l'Anguillais (s. 80) et conditions de vote et d'éligibilité, dans le texte de SI 2019/852.", "Education Act, s. 3 et 4 (révision 2022) et Fisheries Protection Act, s. 7 (révision 2000), dans les textes publiés par le gouvernement d'Anguilla.", "Restriction de la détention de terres par les non-Anguillais et licence du gouverneur en conseil (Aliens Land Holding Regulation Act, révision 2022).", "Anguillian Status Act : Act 1/2020, en vigueur le 21 février 2020, Commission établie au sein du ministère (révision 2022).", "Inscription sur la liste des territoires non autonomes, population, surface, zone économique exclusive, composition de l'Assemblée, système juridique, budget, éducation, ressources naturelles, résolution 79/100 (A/AC.109/2025/2).", "Résultat des élections du 26 février 2025 (Jamaica Observer, dépêche CMC).", "Dates de 1967, 1969 et du 19 décembre 1980 (Wikipédia)."]
  non_confirme: ["Contenu de l'Anguilla Constitution (Amendment) Order 2020 (fonction de vice-président de l'Assemblée) connu seulement par le document du Secrétariat de l'ONU.", "Texte consolidé de la Constitution après les modifications de 1990 (remplacement du secrétaire permanent aux Finances par le gouverneur adjoint comme membre ex officio) non consulté.", "Nombre de villages et de localités : aucune liste officielle consultée.", "Statut du créole anguillais : aucune disposition sur la langue trouvée dans la Constitution ; l'anglais est la langue indiquée par l'ONU.", "Aucun texte en vigueur ne prévoit de référendum sur le statut ; la position britannique (livre blanc de 2012) est une déclaration de politique, rapportée par l'ONU."]
