resume: >-
  La loi de 1997 sur les droits des peuples autochtones (Indigenous Peoples' Rights Act, IPRA) reconnaît aux « communautés culturelles autochtones / peuples autochtones » (ICCs/IPs) la propriété de leurs domaines ancestraux, un droit à l'autogouvernance et l'exigence de leur consentement préalable pour les projets qui les concernent. Une Commission nationale des peuples autochtones (NCIP) délivre les titres de domaine ancestral (Certificate of Ancestral Domain Title, CADT) ; l'État déclare 244 titres enregistrés en 2019, couvrant plus de 5,7 millions d'hectares. En décembre 2000, la Cour suprême, partagée à sept voix contre sept, rejette le recours en inconstitutionnalité contre la loi, qui reste en vigueur. Le recensement de 2020 compte 9,84 millions de personnes appartenant à des peuples autochtones identifiés par la NCIP. Dans la Région autonome bangsamoro, les domaines ancestraux relèvent depuis 2024 d'une loi régionale, décrite dans la fiche « Peuples autochtones non moro du Bangsamoro » ; les accords de gestion forestière communautaire font l'objet de la fiche « Forêts en gestion communautaire des Philippines ».
