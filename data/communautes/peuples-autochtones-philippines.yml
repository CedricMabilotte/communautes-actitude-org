  - {instrument: "Republic Act No. 8371, loi sur les droits des peuples autochtones (IPRA)", nature: "loi", annee: 1997, source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  - {instrument: "Cour suprême, Cruz c. Secrétaire à l'Environnement, G.R. No. 135385 (6 décembre 2000) : recours en inconstitutionnalité rejeté à sept voix contre sept", nature: "jurisprudence", annee: 2000, source: "https://lawphil.net/judjuris/juri2000/dec2000/gr_135385_2000.html"}
  - {instrument: "Cour suprême, Ha Datu Tawahig c. Lapinid, G.R. No. 221139 (20 mars 2019) : la justice coutumière ne soustrait pas aux juridictions pénales", nature: "jurisprudence", annee: 2019, source: "https://lawphil.net/judjuris/juri2019/mar2019/gr_221139_2019.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'État reconnaît le droit inhérent à l'autogouvernance et le droit de maintenir des structures politiques autochtones, IPRA 1997, sections 13 et 16 ; aucune institution territoriale élue n'est créée.", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Le droit coutumier s'applique en priorité aux litiges impliquant des peuples autochtones, IPRA 1997, section 65 ; il doit rester compatible avec le système juridique national (section 15).", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  justice_propre: {valeur: "partiel", note: "Droit d'utiliser ses propres systèmes de justice et institutions de règlement des conflits au sein des communautés, compatibles avec le système juridique national et les droits de l'homme, IPRA 1997, section 15 ; la Cour suprême juge en 2019 (G.R. No. 221139) que ce droit ne prive pas les tribunaux de leur compétence pénale.", source: "https://lawphil.net/judjuris/juri2019/mar2019/gr_221139_2019.html"}
  terres: {valeur: "reconnu", note: "Propriété collective des domaines ancestraux, qui ne peuvent être vendus, et Certificate of Ancestral Domain Title (titre de domaine ancestral), IPRA 1997, sections 5, 7 et 11.", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  ressources: {valeur: "partiel", note: "Droits prioritaires sur l'exploitation des ressources naturelles des domaines ancestraux, IPRA 1997, section 57 ; les ressources minérales restent propriété de l'État (Constitution de 1987, art. XII, section 2).", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  consentement: {valeur: "reconnu", note: "Aucune concession, licence ou bail ne peut être accordé sans certification de la NCIP, délivrée après le consentement libre, préalable et éclairé écrit des communautés, IPRA 1997, section 59.", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Droit d'établir et de contrôler ses propres systèmes et institutions éducatifs, avec un enseignement dans sa langue, IPRA 1997, section 30 ; la loi n° 12027 de 2024 met fin à l'enseignement en langue maternelle de la maternelle à la 3e année, sauf dans les classes où tous les élèves parlent la même langue.", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Représentation obligatoire dans les organes de décision et les conseils législatifs locaux, IPRA 1997, section 16 ; sept commissaires issus des peuples autochtones à la NCIP, section 40 ; aucun siège réservé au Congrès.", source: "https://lawphil.net/statutes/repacts/ra1997/ra_8371_1997.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité des droits économiques, sociaux et culturels (2025) relève une mise en œuvre insatisfaisante de la loi de 1997 pour la délimitation et l'enregistrement des territoires, le non-respect du consentement préalable pour les changements d'usage des terres et l'absence de garantie de la représentation obligatoire dans les organes locaux ; le Comité des droits de l'homme (2022) rapporte des informations sur des processus de consentement obtenus par la tromperie, la menace ou la violence et sur la fermeture de 54 écoles autochtones à Mindanao.", source: "https://docs.un.org/fr/E/C.12/PHL/CO/7"}
chronologie:
  - {annee: 1987, evenement: "La Constitution reconnaît les droits des communautés culturelles autochtones sur leurs terres ancestrales."}
  - {annee: 1997, evenement: "Adoption de la loi sur les droits des peuples autochtones (Republic Act No. 8371)."}
  - {annee: 1998, evenement: "Premier titre de domaine ancestral, aux Tagbanua de l'île de Coron."}
  - {annee: 2000, evenement: "La Cour suprême, partagée à sept voix contre sept, rejette le recours en inconstitutionnalité contre la loi."}
  - {annee: 2002, evenement: "Visite du Rapporteur spécial des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2007, evenement: "Les Philippines votent pour la Déclaration des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2019, evenement: "La Cour suprême juge que la justice coutumière ne soustrait pas aux poursuites pénales (Ha Datu Tawahig c. Lapinid)."}
  - {annee: 2022, evenement: "Observations finales du Comité des droits de l'homme sur la mise en œuvre de la loi de 1997."}
  - {annee: 2023, evenement: "Observations finales du Comité pour l'élimination de la discrimination raciale sur les terres des peuples autochtones."}
  - {annee: 2024, evenement: "La loi n° 12027 met fin à l'enseignement en langue maternelle dans les premières classes ; la région bangsamoro adopte sa propre loi sur les peuples autochtones."}
  - {annee: 2025, evenement: "Observations finales du Comité des droits économiques, sociaux et culturels sur la mise en œuvre de la loi de 1997."}
