resume: >-
  Le peuple afrobolivien descend des personnes réduites en esclavage dans les haciendas et les mines de l'époque coloniale ; il vit surtout dans les Yungas du département de La Paz. La Constitution de 2009 (art. 3 et 32) le reconnaît comme partie du peuple bolivien et lui étend, « en todo lo que corresponda » (dans la mesure où ils s'appliquent), les droits des nations et peuples « indígena originario campesinos » (autochtones). La loi-cadre des autonomies de 2010 (art. 42 et 43) l'inclut dans le régime d'autonomie autochtone, et la loi électorale de 2010 lui ouvre une circonscription spéciale partagée avec cinq peuples du département de La Paz. Aucune autonomie afrobolivienne n'est constituée et aucun titre foncier collectif n'est établi ; le roi afrobolivien, reconnu par la préfecture de La Paz en 2007, n'exerce pas de pouvoir public.
