  - {instrument: "Loi 031 cadre des autonomies et de la décentralisation « Andrés Ibáñez », 19 juillet 2010, art. 42, 43 et 91", nature: "loi", annee: 2010, source: "https://www.lexivox.org/norms/BO-L-N31.html"}
  - {instrument: "Loi 070 de l'éducation « Avelino Siñani - Elizardo Pérez », 20 décembre 2010, art. 3 et 6", nature: "loi", annee: 2010, source: "https://www.lexivox.org/norms/BO-L-N70.html"}
  - {instrument: "Loi 045 contre le racisme et toute forme de discrimination, 8 octobre 2010", nature: "loi", annee: 2010, source: "https://www.lexivox.org/norms/BO-L-N45.html"}
