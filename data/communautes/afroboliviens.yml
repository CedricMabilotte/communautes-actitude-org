  - {instrument: "Loi 848 déclarant la décennie du peuple afrobolivien (2015-2024), 27 octobre 2016", nature: "loi", annee: 2016, source: "https://www.lexivox.org/norms/BO-L-N848.html"}
droits:
  autogouvernement: {valeur: "conteste", note: "La Constitution (art. 32, renvoi à l'art. 30.II.4 et 14 : libre détermination et systèmes politiques propres) et la loi 031 de 2010 (art. 42 et 43) ouvrent au peuple afrobolivien le régime d'autonomie autochtone ; ce droit n'est pas appliqué : aucune autonomie afrobolivienne n'est constituée et aucune loi ne précise la portée de ce renvoi.", source: "https://www.lexivox.org/norms/BO-L-N31.html"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "conteste", note: "La Constitution (art. 32, renvoi à l'art. 30.II.6 : titre collectif des terres et territoires) et l'art. 395.I (attribution de terres domaniales aux Afroboliviens) fondent un droit à la terre ; le titre collectif n'est pas appliqué : la Défenseure du peuple (2014) constate que la terre n'est détenue qu'en propriété individuelle ou familiale et qu'un territoire afrobolivien comparable aux terres communautaires d'origine (TCO) reste une revendication.", source: "https://www.defensoria.gob.bo/uploads/files/estado-de-situacion-sobre-el-ejercicio-de-los-derechos-humanos-del-pueblo-afroboliviano.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Par renvoi de l'art. 32, l'art. 30.II.15 de la Constitution prévoit une consultation préalable obligatoire ; le CERD (2023, § 31) relève un cadre sectoriel et fragmenté qui ne garantit pas le consentement préalable, libre et éclairé du peuple afro-bolivien.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/BOL/CO/21-24&l=fr&t=pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La loi 070 de 2010 (art. 3 et 6) inscrit les savoirs des communautés afroboliviennes dans le programme d'enseignement intraculturel (centré sur la culture propre) et interculturel ; le CERD (2023, § 41) constate une mise en œuvre limitée de ces programmes pour le peuple afro-bolivien.", source: "https://www.lexivox.org/norms/BO-L-N70.html"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La loi 026 de 2010 (art. 57.II et 61) inclut les Afroboliviens dans la circonscription spéciale du département de La Paz, partagée avec les Mosetén, Leco, Kallawaya, Tacana et Araona, qui élit un député.", source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le CERD (2023, § 23) note que les politiques publiques visant le peuple afro-bolivien « ne sont guère appliquées » ; la Défenseure du peuple (2014) indique que le peuple ne dispose d'aucun territoire collectif et que le roi « no ejerce ninguna influencia en las decisiones » (n'exerce aucune influence sur les décisions) ; un député afrobolivien a été élu dans la circonscription spéciale de La Paz en 2009.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/BOL/CO/21-24&l=fr&t=pdf"}
chronologie:
  - {annee: 1953, evenement: "La réforme agraire attribue à des familles afroboliviennes des titres de propriété sur certaines des parcelles qu'elles occupent."}
  - {annee: 1992, evenement: "Couronnement de Julio Pinedo comme roi afrobolivien à Mururata."}
  - {annee: 2007, evenement: "La préfecture de La Paz reconnaît le roi afrobolivien par résolution (décembre)."}
  - {annee: 2009, evenement: "La Constitution reconnaît le peuple afrobolivien (art. 3 et 32) ; élection du premier député afrobolivien dans la circonscription spéciale de La Paz (6 décembre)."}
  - {annee: 2010, evenement: "Loi 026 du régime électoral (circonscription spéciale) et loi 031 des autonomies (inclusion dans le régime d'autonomie autochtone)."}
  - {annee: 2011, evenement: "Loi 200 : journée nationale du 23 septembre ; création du Conseil national afrobolivien (CONAFRO)."}
  - {annee: 2016, evenement: "Loi 848 : décennie du peuple afrobolivien (2015-2024)."}
  - {annee: 2023, evenement: "Le CERD examine la Bolivie et constate une faible application des politiques visant le peuple afro-bolivien."}
