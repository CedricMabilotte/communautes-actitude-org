reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/BOL/CO/17-20, § 7 c et 14) : le Comité note la reconnaissance constitutionnelle des communautés afro-boliviennes et de leurs droits, et se déclare préoccupé par leur exclusion sociale et leur sous-représentation.", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=CERD/C/BOL/CO/17-20&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du CERD (CERD/C/BOL/CO/21-24, § 23-24, 31-32 et 41-42) : les politiques visant le peuple afro-bolivien « ne sont guère appliquées » ; le Comité recommande de garantir son droit à la consultation et au consentement préalable, libre et éclairé.", annee: 2023, source: "https://documents.un.org/api/symbol/access?s=CERD/C/BOL/CO/21-24&l=fr&t=pdf"}
  - {mecanisme: "oit_169", detail: "La Bolivie ratifie la Convention 169 de l'OIT en 1991 ; la loi 031 de 2010 (art. 43) inclut le peuple afrobolivien dans le champ de l'autonomie défini « en concordancia » (conformément) avec l'article 1 de la Convention.", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
