effectivite: {valeur: "partielle", note: "Une étude publiée en 2026 dans Conservation Biology, fondée sur deux enquêtes d'experts, relève plus de dix facteurs de risque potentiels pour l'extension des aires forestières villageoises et indique que de nombreux groupes locaux créent des aires de fait sans signer d'accord de gestion forestière, car la formalisation permet à l'État de limiter les droits d'usage.", source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC13036310/"}
chronologie:
  - {annee: 1997, evenement: "Loi sur les forêts (Forestry Act, chap. 63:01) : aires forestières villageoises, accords de gestion forestière, comités villageois de gestion des ressources naturelles et cogestion des réserves forestières."}
  - {annee: 2010, evenement: "Quatrième rapport national à la Convention sur la diversité biologique : participation des communautés par les comités villageois et partage de recettes dans la cogestion des réserves."}
  - {annee: 2016, evenement: "Loi sur les terres coutumières (Customary Land Act, loi n° 19 de 2016), en vigueur le 1er mars 2018 : elle définit les comités fonciers coutumiers auxquels renvoie la loi sur les forêts."}
  - {annee: 2020, evenement: "Loi de 2019 modifiant la loi sur les forêts (loi n° 7 de 2020), version consolidée du 19 juin 2020."}
