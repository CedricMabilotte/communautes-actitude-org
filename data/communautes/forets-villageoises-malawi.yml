resume: >-
  Fiche agrégée : elle couvre les communautés villageoises qui gèrent une aire forestière villageoise (village forest area) au Malawi. La loi sur les forêts de 1997 (chap. 63:01) permet à un comité foncier coutumier de délimiter, sur une terre coutumière non attribuée, une aire forestière gérée au profit de la communauté du village (s. 30). Le directeur des forêts peut conclure avec une autorité de gestion un accord de gestion forestière (forest management agreement) qui fixe les pratiques, l'usage des produits et des recettes, et prévoit la formation de comités villageois de gestion des ressources naturelles élus par les usagers (s. 31). La même loi ouvre la cogestion des réserves forestières de l'État avec les communautés locales (s. 25). La loi a été modifiée en 2020.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Quatrième rapport national du Malawi à la Convention sur la diversité biologique (2010) : il rend compte de l'action prioritaire 5 de la stratégie nationale, qui vise la participation des communautés locales, des chefs locaux et des ONG aux décisions de gestion de la biodiversité « par les comités villageois de gestion des ressources naturelles », et indique que la cogestion des réserves forestières procure aux communautés une part des recettes tirées de la confiscation des produits forestiers illégaux.", annee: 2010, source: "https://www.cbd.int/doc/world/mw/mw-nr-04-en.pdf"}
base_nationale:
  - {instrument: "Forestry Act, 1997 (chap. 63:01), partie V « Customary land forest », s. 29 à 34 ; s. 9(3), 11, 25 et 50 — version consolidée du 19 juin 2020", nature: "loi", annee: 1997, source: "https://malawilii.org/akn/mw/act/1997/11/eng@2020-06-19"}
  - {instrument: "Forestry (Amendment) Act, 2019 (loi n° 7 de 2020)", nature: "loi", annee: 2020, source: "https://malawilii.org/akn/mw/act/1997/11/eng@2020-06-19"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'accord de gestion forestière prévoit la formation de comités villageois de gestion des ressources naturelles (village natural resources management committees), définis comme des comités élus par les usagers de l'aire forestière villageoise, pour la gérer et l'exploiter (Forestry Act 1997, s. 2 et 31(1)(d)) ; l'accord, conclu avec le directeur des forêts, fixe les pratiques à suivre, et les litiges sont portés devant le ministre (s. 31(1)(a) et 31(3)).", source: "https://malawilii.org/akn/mw/act/1997/11/eng@2020-06-19"}
  pouvoir_normatif: {valeur: "partiel", note: "Les comités villageois de gestion des ressources naturelles édictent des règles (by-laws, règlements locaux) pour l'aire forestière villageoise, approuvées par le ministre (Forestry Act 1997, s. 33) ; un comité peut saisir et retenir les produits forestiers obtenus en violation de ses règles (s. 9(3) et 11).", source: "https://malawilii.org/akn/mw/act/1997/11/eng@2020-06-19"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Un comité foncier coutumier peut, sur l'avis du directeur des forêts, délimiter sur une terre coutumière non attribuée une aire forestière villageoise protégée et gérée « au profit de cette communauté villageoise » (Forestry Act 1997, s. 30) ; l'accord de gestion peut attribuer des parcelles à des personnes ou à des familles pour le reboisement et les leur retirer (s. 31(1)(c)) ; la loi ne confère pas de titre de propriété sur le sol.", source: "https://malawilii.org/akn/mw/act/1997/11/eng@2020-06-19"}
  ressources: {valeur: "partiel", note: "L'accord de gestion fixe l'usage et la destination des produits et des recettes (Forestry Act 1997, s. 31(1)(b)) ; toute cession de produits d'une aire forestière villageoise suit l'accord, et le bois excédant les besoins domestiques est cédé par le comité villageois au profit de la communauté (s. 50) ; la personne ou la communauté qui protège un arbre ou une forêt sur une terre qu'elle a le droit d'utiliser en acquiert la propriété avec un droit de récolte durable (s. 34(1)) ; la cogestion des réserves de l'État exclut l'extraction commerciale (s. 25(2)(a)).", source: "https://malawilii.org/akn/mw/act/1997/11/eng@2020-06-19"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
