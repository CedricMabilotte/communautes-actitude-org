  - {instrument: "Loi fédérale n° 104-FZ du 20 juillet 2000 sur les principes généraux d'organisation des obchtchinas (communautés familiales, claniques ou de voisinage) (version du 20 octobre 2022)", nature: "loi", annee: 2000, source: "https://legalacts.ru/doc/federalnyi-zakon-ot-20072000-n-104-fz-ob/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Droit d'exercer, dans les lieux d'habitat compact, une auto-administration territoriale à caractère associatif (territorialnoïe obchtchestvennoïe samooupravlenie) pour les questions d'intérêt local, loi 82-FZ, art. 11 ; droit de créer des obchtchinas (communautés familiales, claniques ou de voisinage), art. 12 et loi 104-FZ de 2000, art. 1 ; ces organes n'ont ni compétence législative ni pouvoir de puissance publique.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Les tribunaux peuvent tenir compte des traditions et coutumes de ces peuples qui ne contredisent pas les lois fédérales et régionales, et des représentants autorisés peuvent participer à la défense judiciaire, loi 82-FZ, art. 14.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  terres: {valeur: "partiel", note: "Usage gratuit des terres nécessaires aux activités traditionnelles dans les lieux d'habitat traditionnel, loi 82-FZ, art. 8(1)(1) ; territoires d'usage traditionnel de la nature de niveau fédéral, régional ou local, classés comme territoires spécialement protégés, loi 49-FZ de 2001, art. 5 ; aucune propriété collective.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  ressources: {valeur: "partiel", note: "Usage gratuit des minéraux communs et participation au contrôle de l'usage des terres et des ressources ; droit à réparation des dommages causés à l'habitat traditionnel, loi 82-FZ, art. 8(1)(1)-(3) et (8).", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  consentement: {valeur: "partiel", note: "Participation, par des représentants autorisés, aux décisions sur la protection de l'habitat traditionnel et aux expertises écologiques et ethnologiques des programmes d'exploitation, et délégation de représentants dans des conseils consultatifs auprès des exécutifs régionaux et municipaux, loi 82-FZ, art. 8(1)(5)-(7) ; pas d'obligation de consentement.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Droit à l'aide de l'État pour réformer l'éducation des jeunes en tenant compte du mode de vie traditionnel, loi 82-FZ, art. 8(1)(9).", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le CERD (2023, § 29) relève qu'aucun territoire d'usage traditionnel de niveau fédéral n'a été créé depuis 2001 et que le cadre du consentement préalable est insuffisant. IWGIA (2026) signale que la modification du Code des impôts entrée en vigueur en 2024 limite l'exonération de taxe foncière des terres d'usage traditionnel à une liste de localités fixée par le gouvernement, que des organisations autochtones ont été inscrites en 2024 sur les listes d'organisations « extrémistes » puis « terroristes », et qu'une vingtaine de défenseurs des droits autochtones étaient poursuivis fin 2025, dont Daria Egereva (Selkoupe), placée en détention le 17 décembre 2025.", source: "https://www.iwgia.org/images/publications/indigenous-world/indigenous-world-2026.pdf"}
chronologie:
  - {annee: 1993, evenement: "La Constitution garantit les droits des peuples autochtones peu nombreux (art. 69)."}
  - {annee: 1999, evenement: "Loi fédérale 82-FZ sur les garanties des droits des peuples autochtones peu nombreux."}
  - {annee: 2000, evenement: "Loi fédérale sur les obchtchinas."}
  - {annee: 2001, evenement: "Loi fédérale 49-FZ sur les territoires d'usage traditionnel de la nature."}
  - {annee: 2007, evenement: "La Russie s'abstient lors du vote de la Déclaration des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2009, evenement: "Visite du Rapporteur spécial James Anaya."}
  - {annee: 2023, evenement: "Selon IWGIA, décret présidentiel prévoyant la sortie de la Russie de la Convention-cadre pour la protection des minorités nationales."}
  - {annee: 2023, evenement: "Observations finales du CERD (CERD/C/RUS/CO/25-26)."}
  - {annee: 2024, evenement: "Des organisations autochtones sont inscrites sur la liste des organisations « extrémistes » ; entrée en vigueur d'une modification du Code des impôts qui restreint l'exonération de taxe foncière des terres d'usage traditionnel."}
  - {annee: 2025, evenement: "Décret présidentiel créant une journée des peuples autochtones peu nombreux (30 avril) ; perquisitions chez des militants autochtones et détention de Daria Egereva le 17 décembre."}
