resume: >-
  La Constitution russe garantit les droits des peuples autochtones peu nombreux (art. 69). La loi fédérale 82-FZ de 1999 les définit comme des peuples de moins de 50 000 personnes vivant sur les territoires de leurs ancêtres et menant un mode de vie traditionnel ; la liste officielle compte 47 peuples, dont 40 du Nord, de la Sibérie et de l'Extrême-Orient. La loi leur donne l'usage gratuit des terres nécessaires à leurs activités traditionnelles, le droit de créer des communautés (obchtchinas) et des organes d'auto-administration territoriale de quartier ou de village (territorialnoïe obchtchestvennoïe samooupravlenie), et permet aux tribunaux de tenir compte de leurs coutumes. Une loi de 2001 prévoit des territoires d'usage traditionnel de la nature de niveau fédéral, régional ou local ; selon le CERD (2023), aucun territoire de niveau fédéral n'a été créé. Fiche agrégée couvrant l'ensemble des peuples de la liste (nom officiel : peuples autochtones peu nombreux du Nord, de la Sibérie et de l'Extrême-Orient). Les régimes régionaux de Yougra et de Iakoutie font l'objet des fiches « Khantys, Mansis et Nénètses de Yougra », « Territoires d'usage traditionnel de Yougra » et « Peuples autochtones du Nord de la Iakoutie ».
