droits:
  autogouvernement: {valeur: "partiel", note: "Droit d'exercer un autogouvernement territorial dans les lieux d'habitat compact, loi 82-FZ, art. 11 ; droit de créer des obchtchinas (communautés) selon leurs traditions, art. 12 ; ces organes n'ont pas de compétence législative.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Les tribunaux peuvent tenir compte des traditions et coutumes de ces peuples qui ne contredisent pas les lois fédérales et régionales, et des représentants autorisés peuvent participer à la défense judiciaire, loi 82-FZ, art. 14.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  terres: {valeur: "partiel", note: "Usage gratuit des terres nécessaires aux activités traditionnelles dans les lieux d'habitat traditionnel, loi 82-FZ, art. 8(1)(1) ; territoires d'usage traditionnel de la nature prévus par la loi 49-FZ de 2001 ; aucune propriété collective.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  ressources: {valeur: "partiel", note: "Usage gratuit des minéraux communs et participation au contrôle de l'usage des terres et des ressources ; droit à réparation des dommages causés à l'habitat traditionnel, loi 82-FZ, art. 8(1)(1)-(3) et (8).", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  consentement: {valeur: "partiel", note: "Participation, par des représentants autorisés, aux décisions sur la protection de l'habitat traditionnel et aux expertises écologiques et ethnologiques des programmes d'exploitation, loi 82-FZ, art. 8(1)(5)-(6) ; pas d'obligation de consentement.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Droit à l'aide de l'État pour réformer l'éducation des jeunes en tenant compte du mode de vie traditionnel, loi 82-FZ, art. 8(1)(9).", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le CERD (2023) relève qu'aucun territoire d'usage traditionnel de statut fédéral n'a été créé depuis 2001 et que le cadre du consentement préalable est insuffisant ; IWGIA (2025) signale l'inscription en 2024 de l'Aborigen Forum et du Comité international des peuples autochtones de Russie sur la liste des organisations « extrémistes ».", source: "https://docs.un.org/fr/CERD/C/RUS/CO/25-26"}
