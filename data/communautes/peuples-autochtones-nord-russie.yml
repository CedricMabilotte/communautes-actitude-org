resume: >-
  La Constitution russe garantit les droits des peuples autochtones peu nombreux (art. 69). La loi fédérale 82-FZ de 1999 les définit comme des peuples de moins de 50 000 personnes vivant sur les territoires de leurs ancêtres et menant un mode de vie traditionnel ; la liste officielle compte 47 peuples, dont 40 du Nord, de la Sibérie et de l'Extrême-Orient. La loi leur donne l'usage gratuit des terres nécessaires à leurs activités traditionnelles, le droit de créer des communautés (obchtchinas) et un autogouvernement local, et la prise en compte de leurs coutumes par les tribunaux. Une loi de 2001 prévoit des territoires d'usage traditionnel de la nature ; aucun territoire de statut fédéral n'a été créé. Fiche agrégée couvrant l'ensemble des peuples de la liste.
