  - {instrument: "Loi fédérale n° 82-FZ du 30 avril 1999 sur les garanties des droits des peuples autochtones peu nombreux (version du 13 juillet 2020)", nature: "loi", annee: 1999, source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
