resume: >-
  Iwi (peuple māori) de Te Urewera, région de forêts et de collines de l'est de l'île du Nord. Le Tūhoe Claims Settlement Act 2014 contient les excuses de la Couronne, qui reconnaît avoir porté atteinte au mana motuhake (autorité autonome) de Tūhoe. Le Te Urewera Act 2014 retire Te Urewera de la propriété de la Couronne et du statut de parc national et en fait une entité juridique, gouvernée par un conseil dont Tūhoe Te Uru Taumatua nomme la majorité des membres après les trois premières années. Le cadre commun aux Māori est décrit dans la fiche Māori.
