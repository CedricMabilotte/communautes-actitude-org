droits:
  autogouvernement: {valeur: "partiel", note: "Tūhoe Te Uru Taumatua, fiducie créée en 2011 et entité de gouvernance du règlement (Tūhoe Claims Settlement Act 2014, s. 12), nomme six des neuf membres du conseil de Te Urewera après les trois premières années (quatre sur huit auparavant) (Te Urewera Act 2014, s. 16 et 21).", source: "https://www.legislation.govt.nz/act/public/2014/0051/latest/whole.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil de Te Urewera peut édicter des règlements (bylaws) sur la conduite des personnes dans Te Urewera, sanctionnés par des amendes ; ils doivent être approuvés par le ministre de la Conservation (Te Urewera Act 2014, s. 70).", source: "https://www.legislation.govt.nz/act/public/2014/0051/latest/whole.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La pleine propriété des terres de Te Urewera est dévolue à Te Urewera elle-même (Te Urewera Act 2014, s. 11 et 12), et non à Tūhoe ; ces terres sont inaliénables sauf dans les cas prévus par la loi (s. 13). Le conseil qui la gouverne, dont Tūhoe Te Uru Taumatua nomme six membres sur neuf, peut donner expression à la Tūhoetanga et aux notions tūhoe de gestion, dont le rāhui (interdiction temporaire d'usage) (s. 18).", source: "https://maorilawreview.co.nz/2014/10/tuhoe-crown-settlement-te-urewera-act-2014/"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
