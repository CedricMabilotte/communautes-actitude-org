effectivite: {valeur: "non_etablie", note: "Selon le Département de la Conservation, l'entretien de Te Urewera, sentiers et équipements compris, est assuré par Te Uru Taumatua, entité opérationnelle de Tūhoe. Aucune évaluation indépendante du fonctionnement du conseil de Te Urewera depuis 2014 n'a été trouvée.", source: "https://www.doc.govt.nz/parks-and-recreation/places-to-go/east-coast/places/te-urewera/"}
chronologie:
  - {annee: 1896, evenement: "Loi sur la réserve autochtone du district d'Urewera (Urewera District Native Reserve Act)."}
  - {annee: 1954, evenement: "Création du parc national d'Urewera."}
  - {annee: 2009, evenement: "Premier volume du rapport du Tribunal de Waitangi sur les confiscations de terres en Te Urewera (second volume en 2010)."}
  - {annee: 2010, evenement: "Le gouvernement renonce à transférer la propriété du parc national à Tūhoe."}
  - {annee: 2014, evenement: "Tūhoe Claims Settlement Act et Te Urewera Act (entrée en vigueur le 27 juillet)."}
  - {annee: 2017, evenement: "Le conseil de Te Urewera adopte Te Kawa o Te Urewera, plan de gestion."}
  - {annee: 2026, evenement: "Le conseil compte six membres nommés par Tūhoe et trois par la Couronne ; un siège est vacant."}
