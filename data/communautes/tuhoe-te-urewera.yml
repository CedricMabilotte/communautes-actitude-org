reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial décrit la revendication de Tūhoe sur Te Urewera et demande au gouvernement de reconsidérer son refus de lui rendre ses terres du parc national (A/HRC/18/35/Add.4, § 44 b) et § 76)", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010 (A/HRC/18/35/Add.4)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
