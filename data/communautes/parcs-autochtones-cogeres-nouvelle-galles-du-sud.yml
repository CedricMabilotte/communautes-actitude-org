resume: >-
  La partie 4A de la National Parks and Wildlife Act 1974 (loi de Nouvelle-Galles du Sud sur les parcs nationaux), ajoutée par la National Parks and Wildlife Amendment (Aboriginal Ownership) Act de décembre 1996, permet de rendre des parcs et réserves inscrits à l'annexe 14 de la loi à un conseil foncier aborigène local, qui en détient la pleine propriété inaliénable au nom des propriétaires aborigènes. Les terres sont aussitôt louées au ministre de l'Environnement pour 30 ans renouvelables et restent des aires protégées ouvertes au public. Un conseil de gestion (board of management) à majorité de propriétaires aborigènes en a la charge, et le loyer est affecté à la gestion du parc. Six ensembles relèvent de ce régime, de Mutawintji (1998) à Gaagal Wanggaan (2010) ; ce régime est distinct des revendications foncières de l'Aboriginal Land Rights Act 1983.
