resume: >-
  Aran est une vallée des Pyrénées rattachée à la Catalogne, où se parle l'aranais, variété de l'occitan.
  Le Statut d'autonomie de Catalogne de 2006 (art. 11) dispose que « le peuple aranais exerce l'autogouvernement » par le Conselh Generau d'Aran.
  La loi catalane 1/2015 du régime spécial d'Aran définit Aran comme « une réalité nationale occitane », lui attribue la personnalité juridique, un conseil de 13 membres élus dans six terçons et des compétences en langue, culture, environnement, forêts, chasse, pêche et tourisme.
  Sa disposition additionnelle première reconnaît le droit du peuple aranais à décider de son avenir.
  La loi 3/2026 dispose que la législation de régime local ne s'applique à Aran qu'en l'absence de règle spécifique.
