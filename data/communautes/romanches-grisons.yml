resume: >-
  Le romanche est l'une des quatre langues nationales de la Suisse (Constitution fédérale, art. 4) et une langue officielle de la Confédération dans les rapports avec les personnes de langue romanche (art. 70). Le canton des Grisons a trois langues officielles de même rang : l'allemand, le romanche et l'italien (Constitution cantonale de 2003, art. 3). La loi cantonale sur les langues, adoptée le 19 octobre 2006 et en vigueur depuis le 1er janvier 2008, classe comme monolingue une commune comptant au moins 40 % de membres de la communauté linguistique traditionnelle et comme plurilingue une commune qui en compte au moins 20 % ; la langue traditionnelle y est langue officielle communale (ou l'une d'elles) et langue d'enseignement de la première langue à l'école obligatoire. La Suisse applique au romanche la partie III de la Charte européenne des langues régionales ou minoritaires depuis 1998.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Convention-cadre signée le 1er février 1995, ratifiée le 21 octobre 1998, en vigueur pour la Suisse le 1er février 1999. Cinquième avis du Comité consultatif (adopté le 13 février 2023), § 30 : la Suisse reconnaît en pratique comme minorités nationales les personnes appartenant aux minorités de langue française, italienne et romanche.", annee: 2023, source: "https://rm.coe.int/5th-op-switzerland-en/1680ab9e02"}
  - {mecanisme: "charte_langues_regionales", detail: "Charte ratifiée le 23 décembre 1997, en vigueur pour la Suisse le 1er avril 1998 ; déclaration du Conseil fédéral désignant le romanche et l'italien comme langues officielles moins répandues, avec des engagements de la partie III pour le romanche en matière d'enseignement (art. 8), de justice (art. 9), d'autorités administratives et services publics (art. 10), de médias (art. 11), d'activités culturelles (art. 12), de vie économique et sociale (art. 13) et d'échanges transfrontaliers (art. 14).", annee: 1998, source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2003/382/20240926/fr/html/fedlex-data-admin-ch-eli-cc-2003-382-20240926-fr-html-7.html"}
