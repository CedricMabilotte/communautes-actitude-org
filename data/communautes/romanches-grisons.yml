  langue: {valeur: "reconnu", note: "Le romanche est langue officielle du canton (Constitution des Grisons, art. 3, al. 1) ; dans une commune comptant au moins 40 % de membres de la communauté linguistique traditionnelle, il est la langue officielle communale, et dans une commune qui en compte au moins 20 %, l'une des langues officielles (SpG, art. 16) ; les communes monolingues doivent l'employer à l'assemblée communale, dans les votations, les publications et la signalisation des bâtiments publics et des rues (art. 17) ; le passage à une catégorie inférieure exige un vote populaire communal, à la majorité des deux tiers pour devenir germanophone, et l'approbation du gouvernement (art. 24) ; devant le Tribunal cantonal supérieur, le Tribunal de justice et le Tribunal des mesures de contrainte, les parties peuvent rédiger leurs mémoires et écritures dans la langue officielle cantonale de leur choix (art. 8) ; les personnes de langue romanche peuvent s'adresser aux autorités fédérales dans leur idiome ou en rumantsch grischun (LLC, art. 6, al. 3).", source: "https://www.gr-lex.gr.ch/app/de/texts_of_law/492.100"}
  education: {valeur: "partiel", note: "Les communes fixent dans leur législation la langue scolaire de l'école obligatoire (SpG, art. 18), « en collaboration avec le canton » (Constitution des Grisons, art. 3, al. 3) ; l'enseignement reste régi par la loi scolaire cantonale ; dans les communes monolingues, l'enseignement de la première langue se fait dans la langue officielle de la commune, et dans les communes plurilingues dans la langue traditionnelle (art. 19 et 20) ; le Tribunal fédéral a jugé en 2014 que les communes disposent d'une autonomie (« relativ erhebliche Entscheidungsfreiheit », marge de décision notable) pour choisir entre le rumantsch grischun et l'idiome local comme langue scolaire, tout en validant la règle cantonale qui n'autorise ce changement que classe par classe à partir de la première année (ATF 141 I 36, consid. 5.5 à 5.7).", source: "https://www.gr-lex.gr.ch/app/de/texts_of_law/492.100"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le régime des langues scolaires est appliqué et contrôlé par les tribunaux : après des initiatives communales lancées dans le Val Müstair et la Surselva pour revenir du rumantsch grischun à l'idiome local, le Tribunal fédéral a rejeté en 2013 les recours de parents contre la décision du gouvernement fixant ce changement au début de la première année primaire, puis jugé en 2014 que la règle cantonale du changement progressif année par année respecte l'autonomie communale (ATF 139 I 229 ; ATF 141 I 36). Les recensements publiés par la Lia Rumantscha montrent un recul des locuteurs : 39,8 % de la population du canton en 1880 (langue maternelle), 15,4 % en 2017 (langue principale).", source: "https://entscheidsuche.ch/docs/CH_BGE/CH_BGE_001_BGE-141-I-36_2014-12-15.html"}
chronologie:
  - {annee: 1938, evenement: "Le romanche devient langue nationale de la Suisse par votation du 20 février, sans être langue officielle de la Confédération."}
  - {annee: 1996, evenement: "Révision de l'article constitutionnel sur les langues en mars : le romanche devient langue partiellement officielle de la Confédération."}
  - {annee: 1998, evenement: "La Charte européenne des langues régionales ou minoritaires entre en vigueur pour la Suisse (1er avril), avec des engagements de la partie III pour le romanche."}
  - {annee: 1999, evenement: "La Convention-cadre pour la protection des minorités nationales entre en vigueur pour la Suisse (1er février)."}
  - {annee: 2003, evenement: "Adoption de la Constitution du canton des Grisons (14 septembre), dont l'art. 3 pose l'égalité des trois langues cantonales ; entrée en vigueur le 1er janvier 2004."}
  - {annee: 2006, evenement: "Le Grand Conseil des Grisons adopte la loi sur les langues (19 octobre) ; un référendum est demandé."}
  - {annee: 2007, evenement: "Les électeurs des Grisons acceptent la loi sur les langues ; la loi fédérale sur les langues est adoptée le 5 octobre."}
  - {annee: 2008, evenement: "Entrée en vigueur de la loi cantonale sur les langues (1er janvier)."}
  - {annee: 2013, evenement: "Le Tribunal fédéral rejette les recours de parents du Val Müstair et de la Surselva contre la règle fixant au début de la première année primaire tout changement de langue scolaire entre rumantsch grischun et idiome (ATF 139 I 229, 12 juillet)."}
  - {annee: 2014, evenement: "Le Tribunal fédéral juge que l'art. 32 de la loi scolaire cantonale ne viole pas l'autonomie communale en matière de langue scolaire (ATF 141 I 36, 15 décembre)."}
  - {annee: 2023, evenement: "Cinquième avis du Comité consultatif de la Convention-cadre sur la Suisse (13 février)."}
  - {annee: 2026, evenement: "Entrée en vigueur de la nouvelle teneur de l'art. 22 de la loi fédérale sur les langues sur les aides financières aux Grisons et au Tessin (1er janvier)."}
