  verifie: ["Dispositif de l'arrêt de 2012 et faits établis (§ 52, 61-62).", "Articles 2, 57, 171 et 257 de la Constitution de 2008 (édition de l'Assemblée nationale).", "Déclaration Kawsak Sacha de 2018 (Territoires de vie)."]
