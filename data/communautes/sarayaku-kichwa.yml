population: {valeur: 1500, annee: 2021, perimetre: "habitants du peuple de Sarayaku selon sa propre présentation (« aproximadamente 1.500 habitantes ») dans le rapport Territoires de vie 2021 ; l'arrêt de la Cour interaméricaine de 2012 (§ 52) citait un recensement du peuple d'environ 1 200 habitants", source: "https://report.territoriesoflife.org/es/territorios/sarayaku-ecuador/"}
lieux: {valeur: 1, unite: "territoire de 135 000 ha attribué à Sarayaku par son statut (art. 47.b) à l'intérieur du titre collectif de 1992 aux communautés du Bobonaza", annee: 2012, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
surface_km2: {valeur: 1350, annee: 2012, perimetre: "territoire de Sarayaku (135 000 ha) selon l'article 47.b du statut de 2004, cité par la Cour interaméricaine (§ 61), à l'intérieur du titre collectif de 1992 (222 094 ou 264 625 ha selon les pièces) attribué aux communautés du Bobonaza", source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
villages: {valeur: 7, annee: 2021, perimetre: "centres communautaires du peuple (Kali Kali, Sarayakillu, Chuntayaku, Shiwakucha, Puma, Kushillu Urku, Mawka Llakta) selon le rapport Territoires de vie 2021 ; l'arrêt de 2012 (§ 52) en comptait cinq (Sarayaku Centro, Cali Cali, Sarayakillo, Shiwacocha, Chontayacu)", source: "https://report.territoriesoflife.org/es/territorios/sarayaku-ecuador/"}
resume: >-
  Sarayaku est un peuple kichwa d'Amazonie équatorienne. En 1992, l'État attribue un titre collectif aux communautés du fleuve Bobonaza ; le statut du peuple est enregistré par l'État en 2004. En 1996, l'État concède à une compagnie pétrolière un bloc couvrant son territoire sans le consulter ; entre octobre 2002 et février 2003, la compagnie charge 467 puits avec environ 1 433 kg d'explosif (pentolite) sur son territoire. Le 27 juin 2012, la Cour interaméricaine des droits de l'homme condamne l'Équateur pour violation des droits à la consultation, à la propriété communale et à l'identité culturelle. En 2018, l'assemblée du peuple déclare son territoire Kawsak Sacha (« forêt vivante »), être vivant et sujet de droits.
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Pueblo Indígena Kichwa de Sarayaku c. Équateur (série C n° 245) : violation des art. 21, 8 et 25 de la Convention américaine et mise en danger grave des droits à la vie et à l'intégrité (art. 4 et 5) ; ordre de retirer la pentolite, de consulter le peuple avant tout projet et d'adopter une loi sur la consultation préalable.", annee: 2012, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "L'Équateur ratifie la Convention 169 de l'OIT le 15 mai 1998.", annee: 1998, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "L'Équateur vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295, adoptée par 143 voix contre 4).", annee: 2007, source: "https://documents.un.org/api/symbol/access?s=A/61/PV.107&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République de l'Équateur (2008), art. 2, 57, 71 et 171", nature: "constitution", annee: 2008, source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  - {instrument: "Titre d'adjudication collective aux communautés du Bobonaza (12 mai 1992)", nature: "loi", annee: 1992, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
  - {instrument: "Statut du Peuple originaire kichwa de Sarayaku, enregistré par le CODENPE (accord n° 24, 10 juin 2004)", nature: "coutume_reconnue", annee: 2004, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution (art. 57.9) garantit les formes propres d'organisation et d'exercice de l'autorité sur les territoires reconnus ; le statut du peuple a été enregistré par un organe de l'État en 2004.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 57.10) reconnaît le droit de créer et d'appliquer un droit propre ou coutumier, qui ne peut porter atteinte aux droits constitutionnels.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  justice_propre: {valeur: "partiel", note: "Les autorités des communautés, peuples et nationalités autochtones exercent des fonctions juridictionnelles selon leurs traditions (Constitution, art. 171).", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  terres: {valeur: "reconnu", note: "Titre collectif de 1992 ; la Constitution (art. 57.4) garantit la propriété imprescriptible des terres communautaires, inaliénables, insaisissables et indivisibles.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  ressources: {valeur: "partiel", note: "Participation à l'usage et à la gestion des ressources renouvelables (art. 57.6) ; le titre de 1992 réserve le sous-sol à l'État.", source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 57.7) impose une consultation préalable, libre et informée sur les ressources non renouvelables ; sans consentement, il est procédé « conformément à la Constitution et à la loi ». La Cour interaméricaine ordonne en 2012 de consulter Sarayaku avant tout projet.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  langue: {valeur: "partiel", note: "Le kichwa et le shuar sont langues officielles de relation interculturelle (Constitution, art. 2).", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  education: {valeur: "partiel", note: "La Constitution (art. 57.14) garantit un système d'éducation interculturelle bilingue.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Selon la synthèse de supervision de la Cour interaméricaine (2023), trois mesures de l'arrêt de 2012 restent en attente d'exécution : neutraliser et retirer la pentolite, consulter le peuple avant tout projet sur son territoire, adopter les mesures législatives sur la consultation préalable ; la formation des fonctionnaires est partiellement exécutée (résolution du 22 juin 2016). En juin 2022, le CEJIL, représentant du peuple, indique qu'aucun kilogramme d'explosif n'a été retiré depuis l'arrêt. En 2025, le gouvernement lance la « Ronda Sur-Oriente », appel d'offres pétrolier sur environ 2 millions d'hectares en Pastaza et Morona Santiago, rejeté par les organisations autochtones de Pastaza (IWGIA, 2026).", source: "https://www.corteidh.or.cr/docs/supervisiones/SCS/ecuador/sarayaku/sarayakup.pdf"}
chronologie:
  - {annee: 1979, evenement: "Reconnaissance légale du Centro Alama Sarayacu, première personnalité juridique du peuple (Territoires de vie)."}
  - {annee: 1992, evenement: "Titre collectif aux communautés du Bobonaza (12 mai)."}
  - {annee: 1996, evenement: "Contrat de participation avec la compagnie CGC pour le bloc 23 (26 juillet), sans consultation."}
  - {annee: 2003, evenement: "Entre octobre 2002 et février 2003, la compagnie CGC laisse environ 1 433 kg de pentolite dans 467 puits sur le territoire (arrêt de 2012, § 101)."}
  - {annee: 2004, evenement: "Enregistrement du statut du peuple par le CODENPE (10 juin)."}
  - {annee: 2008, evenement: "Nouvelle Constitution : droits collectifs (art. 57) et droits de la nature (art. 71)."}
  - {annee: 2012, evenement: "Arrêt de la Cour interaméricaine (27 juin)."}
  - {annee: 2016, evenement: "Résolution de supervision de la Cour interaméricaine (22 juin) : acte public, publications et indemnisations déclarés exécutés ; l'examen du retrait de la pentolite, de la consultation et de la loi sur la consultation est reporté, l'audience prévue ayant été suspendue après le séisme du 16 avril 2016."}
  - {annee: 2018, evenement: "Déclaration Kawsak Sacha : le territoire est déclaré être vivant et sujet de droits."}
  - {annee: 2025, evenement: "Lancement de la « Ronda Sur-Oriente » (blocs pétroliers en Pastaza et Morona Santiago) ; en novembre, les réformes constitutionnelles soumises à référendum sont rejetées et la Constitution de 2008 reste en vigueur (IWGIA, 2026)."}
fiabilite:
  verifie: ["Dispositif de l'arrêt de 2012 et faits établis (§ 52, 61, 64, 101) : 1 200 habitants et cinq centres en 2012, 135 000 ha, environ 1 433 kg de pentolite dans 467 puits.", "Mesures en attente d'exécution : synthèse de supervision de la Cour interaméricaine.", "Environ 1 500 habitants, sept centres communautaires, 7 kurakas et 7 likuatikuna : Territoires de vie 2021.", "Vote de l'Équateur pour la résolution 61/295 : procès-verbal A/61/PV.107.", "Ronda Sur-Oriente et rejet du référendum de novembre 2025 : IWGIA, The Indigenous World 2026 (chapitre Équateur).", "Articles 2, 57, 171 et 257 de la Constitution de 2008 (édition de l'Assemblée nationale).", "Déclaration Kawsak Sacha de 2018 (Territoires de vie)."]
  non_confirme: ["La déclaration Kawsak Sacha n'a pas de reconnaissance légale par l'État trouvée.", "Aucune résolution de supervision de la Cour postérieure au 22 juin 2016 n'a été trouvée.", "Recouvrement entre les blocs de la Ronda Sur-Oriente et le territoire de Sarayaku : non vérifié.", "Les chiffres de population (1 200 en 2012, 1 500 en 2021) proviennent du peuple ; chiffre du recensement national de 2022 pour Sarayaku non trouvé."]
