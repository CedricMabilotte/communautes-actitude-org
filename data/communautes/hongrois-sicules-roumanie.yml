effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2023 que le Code administratif de 2019 ne garantit plus le maintien des droits linguistiques au-delà du recensement suivant là où la minorité passe sous 20 %, et demande d'interpréter ce seuil avec souplesse ; il signale les tensions de 2020 autour d'un projet de loi sur l'autonomie administrative du Pays sicule et les litiges sur les blasons de Covasna, Harghita et Mureș (cinquième avis, § 2, 49, 50 et 110).", source: "https://rm.coe.int/5th-op-romania-en/1680ac3917"}
chronologie:
  - {annee: 1952, evenement: "Création d'une Région autonome hongroise dans l'est de la Transylvanie ; ses pouvoirs restent nominaux."}
  - {annee: 1968, evenement: "Réforme territoriale : la région est supprimée et remplacée par des départements."}
  - {annee: 1991, evenement: "Constitution de la Roumanie : droits des minorités nationales à l'identité, à l'enseignement dans la langue maternelle et à la représentation parlementaire."}
  - {annee: 1995, evenement: "Ratification de la Convention-cadre pour la protection des minorités nationales (11 mai)."}
  - {annee: 2003, evenement: "Révision constitutionnelle : usage des langues minoritaires devant l'administration locale (art. 120) et les tribunaux (art. 128)."}
  - {annee: 2019, evenement: "Code administratif (ordonnance d'urgence 57/2019) : seuil de plus de 20 % (art. 94)."}
  - {annee: 2020, evenement: "Un projet de loi de l'UDMR sur l'autonomie du Pays sicule est adopté tacitement par la Chambre des députés en avril, faute de débat dans le délai de 45 jours ; il n'est pas devenu loi."}
  - {annee: 2023, evenement: "Cinquième avis du Comité consultatif de la Convention-cadre sur la Roumanie (3 avril)."}
