  education: {valeur: "partiel", note: "Droit des membres des minorités d'apprendre leur langue maternelle et d'être instruits dans cette langue, selon des modalités fixées par la loi, Constitution, art. 32 al. 3.", source: "https://www.constituteproject.org/constitution/Romania_2003"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Une organisation de citoyens appartenant à une minorité nationale qui n'atteint pas le nombre de voix nécessaire a droit à un siège de député, Constitution, art. 62 al. 2 ; la minorité hongroise n'y recourt pas : l'Union démocrate magyare de Roumanie (UDMR) franchit le seuil ordinaire de 5 % et obtient 21 députés et 9 sénateurs en 2020.", source: "https://odihr.osce.org/sites/default/files/f/documents/3/3/484562.pdf"}
