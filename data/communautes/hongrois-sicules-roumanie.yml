resume: >-
  Les Hongrois forment la principale minorité nationale de Roumanie : 1 002 151 personnes au recensement de 2021, majoritaires dans les départements de Harghita (232 157 sur 291 950 habitants) et de Covasna (133 444 sur 200 042). Les Sicules (Székelyek), groupe historique de langue hongroise, vivent dans l'est de la Transylvanie, au Pays sicule (Székelyföld). La Constitution de 1991, révisée en 2003, garantit l'enseignement dans la langue maternelle (art. 32) et l'usage de la langue minoritaire devant l'administration locale là où la minorité est « significative » (art. 120) ; le Code administratif de 2019 (art. 94) fixe ce seuil à plus de 20 % des habitants. Il n'existe pas d'autonomie territoriale : la Région autonome hongroise créée en 1952 a été supprimée en 1968, et le projet de loi sur l'autonomie du Pays sicule déposé en 2020 n'est pas devenu loi. Les sièges réservés aux autres minorités sont décrits dans la fiche « Minorités nationales de Roumanie ».
