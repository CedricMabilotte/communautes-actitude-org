resume: >-
  La partie nord de l'île de Saint-Martin, dans les Petites Antilles, a été détachée de la Guadeloupe et érigée en collectivité d'outre-mer (art. 74 de la Constitution) le 15 juillet 2007 par la loi organique n° 2007-223 du 21 février 2007, après une consultation du 7 décembre 2003 où 76,17 % des suffrages exprimés ont approuvé le changement. Un conseil territorial de 23 membres élus fixe les règles applicables en matière d'impôts et taxes, de circulation et de transports routiers, de ports, de voirie et de domaine, d'accès au travail des étrangers, de tourisme et de services publics de la collectivité, puis, à compter de 2012, d'urbanisme, d'habitation, de logement et d'énergie. Le sujet collectif est la population de la collectivité ; aucune désignation ethnique n'est retenue par le droit. La partie sud de l'île forme Sint Maarten, pays du Royaume des Pays-Bas ; la partie française reste une région ultrapériphérique (territoire intégré à l'Union européenne avec adaptations).
