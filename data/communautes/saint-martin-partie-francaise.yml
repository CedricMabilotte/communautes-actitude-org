droits:
  autogouvernement: {valeur: "reconnu", note: "La loi organique de 2007 institue un conseil territorial de 23 membres élus pour cinq ans, un président et un conseil exécutif élus par ce conseil.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "La loi organique du 21 février 2007 (CGCT, art. LO 6314-3) confie au conseil territorial la fixation des règles en matière d'impôts, droits et taxes, de circulation routière et de transports routiers, de desserte maritime et de ports, de voirie et de domaine, d'accès au travail des étrangers, de tourisme et de création des services publics de la collectivité, puis, à compter du 1er janvier 2012, d'urbanisme, d'habitation, de logement et d'énergie.", source: "https://www.senat.fr/rap/l09-055/l09-0551.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'article LO 6314-7 du CGCT permet à la collectivité de soumettre à déclaration les transferts entre vifs de propriétés foncières et d'exercer un droit de préemption (droit d'acheter en priorité) pour préserver la cohésion sociale et le droit au logement ; le Conseil constitutionnel a exigé que la durée de résidence retenue n'excède pas la mesure strictement nécessaire (décision 2007-547 DC, considérants 60 et 61).", source: "https://www.conseil-constitutionnel.fr/decision/2007/2007547DC.htm"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La loi organique de 2007 (CGCT, art. LO 6313-3) impose la consultation du conseil territorial sur les projets de loi, d'ordonnance et de décret qui introduisent, modifient ou suppriment des dispositions particulières à la collectivité, dans un délai d'un mois réduit à quinze jours en cas d'urgence ; l'avis ne lie pas l'État.", source: "https://www.senat.fr/rap/l09-055/l09-0551.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "La collectivité dispose de son propre code général des impôts, fixe les impôts, droits et taxes et perçoit le produit des impositions qu'elle établit (CGCT, art. LO 6314-3 ; décision 2007-547 DC, considérant 23) ; l'assiette, le contrôle et le recouvrement restent assurés par des agents de l'État.", source: "https://www.impots-saint-martin.fr/fr/38-impots-et-taxes.html"}
  representation: {valeur: "reconnu", note: "La loi organique de 2007 crée un siège de sénateur propre à Saint-Martin.", source: "https://www.senat.fr/rap/l06-025-1/l06-025-1_mono.html"}
  statut_personnel: {valeur: "partiel", note: "L'article LO 6314-4 du CGCT ne reconnaît le domicile fiscal à Saint-Martin aux personnes venant d'un département de métropole ou d'outre-mer qu'après cinq ans de résidence ; ce statut de résidence est limité à la fiscalité.", source: "https://www.impots-saint-martin.fr/fr/38-impots-et-taxes.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Un rapport du Sénat de 2009 constate que la collectivité exerce toutes les compétences transférées depuis la première réunion du conseil territorial le 15 juillet 2007 et qu'elle a adopté ses propres règles fiscales dès le 21 novembre 2007, tout en relevant des difficultés de recouvrement de l'impôt ; le conseil territorial a été renouvelé en 2012, 2017 et 2022.", source: "https://www.senat.fr/rap/l09-055/l09-0551.html"}
chronologie:
  - {annee: 2003, evenement: "Consultation du 7 décembre : 76,17 % des suffrages exprimés approuvent la création d'une collectivité d'outre-mer, avec 44,2 % de participation."}
  - {annee: 2007, evenement: "Loi organique n° 2007-223 du 21 février ; première réunion du conseil territorial le 15 juillet ; premières délibérations fiscales le 21 novembre."}
  - {annee: 2012, evenement: "Élection du conseil territorial ; transfert des compétences en urbanisme, habitation, logement et énergie prévu par la loi organique."}
  - {annee: 2017, evenement: "Élection du conseil territorial."}
  - {annee: 2022, evenement: "Élection du conseil territorial ; élection de son président le 3 avril."}
