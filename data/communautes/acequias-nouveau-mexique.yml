resume: >-
  Fiche agrégée : elle couvre les acequias, canaux d'irrigation gérés en commun par les détenteurs de droits d'eau (parciantes) selon un usage hérité de la période coloniale espagnole. Le chapitre 73, articles 2 et 3, des New Mexico Statutes Annotated 1978 (recueil des lois de l'État) en fait des personnes morales depuis 1895 et des subdivisions politiques de l'État depuis 1965. Chaque acequia élit trois commissaires et un mayordomo (responsable du partage de l'eau), lève des contributions et adopte ses règlements. Depuis 2004, l'acequia qui l'a prévu dans ses règlements doit approuver tout changement de point de dérivation ou d'usage d'un droit d'eau qu'elle dessert avant que l'ingénieur d'État ne statue.
