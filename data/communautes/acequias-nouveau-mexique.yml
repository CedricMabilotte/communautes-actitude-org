base_nationale:
  - {instrument: "NMSA 1978, art. 73-2-11 : les acequias et community ditches sont des personnes morales pouvant ester en justice (Laws 1895, ch. 1, § 1)", nature: "loi", annee: 1895, source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-11/"}
  - {instrument: "NMSA 1978, art. 73-2-28 : les associations d'acequias et de canaux communautaires sont des subdivisions politiques de l'État (Laws 1965, ch. 145 ; modifié en 2001)", nature: "loi", annee: 1965, source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-28/"}
  - {instrument: "NMSA 1978, art. 73-2-22.1 : l'acequia peut acquérir, détenir, transférer et utiliser des biens et des droits d'eau (Laws 1987, ch. 352)", nature: "loi", annee: 1987, source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-22-1/"}
  - {instrument: "NMSA 1978, art. 73-2-21 (pouvoirs des commissaires et du mayordomo) et art. 72-5-24.1 (approbation des changements de droits d'eau par l'acequia ; Laws 2003, ch. 82 et ch. 135, en vigueur le 1er mars 2004)", nature: "loi", annee: 2003, source: "https://law.justia.com/codes/new-mexico/chapter-72/article-5/section-72-5-24-1/"}
  - {instrument: "NMSA 1978, art. 73-2-55.1 : banques d'eau des acequias (Laws 2003, ch. 54 et ch. 132)", nature: "loi", annee: 2003, source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-55-1/"}
  - {instrument: "NMSA 1978, art. 3-27-2 B : interdiction faite aux municipalités d'exproprier l'eau et les droits d'eau des acequias (Laws 2009, ch. 269)", nature: "loi", annee: 2009, source: "https://law.justia.com/codes/new-mexico/chapter-3/article-27/section-3-27-2/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque acequia a trois commissaires et un mayordomo, détenteurs de droits sur le canal, élus tous les deux ans par les titulaires de droits d'eau à jour de leurs contributions (art. 73-2-12 et 73-2-14 NMSA 1978) ; l'acequia est une subdivision politique de l'État (art. 73-2-28, 1965).", source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-12/"}
  pouvoir_normatif: {valeur: "partiel", note: "Les commissaires adoptent des règlements (bylaws, rules and regulations) qui ne doivent pas contredire les lois de l'État (art. 73-2-21 NMSA 1978) ; la Cour suprême de l'État ne reconnaît aux acequias que les pouvoirs accordés par la loi ou qui en découlent nécessairement (Snow v. Abalos, 1914, sous l'art. 73-2-11).", source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-21/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le mayordomo répartit l'eau entre les membres et dirige les travaux (art. 73-2-21) ; depuis 1987, l'acequia peut acquérir et détenir des droits d'eau, qu'elle ne perd pas par prescription (art. 73-2-22.1) ; depuis 2003, elle peut créer une banque d'eau pour réallouer temporairement l'eau entre membres sans procédure devant l'ingénieur d'État (art. 73-2-55.1). Les droits d'eau des membres restent individuels et peuvent être cédés hors du canal, sous réserve de l'approbation prévue à l'art. 72-5-24.1.", source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-22-1/"}
  consentement: {valeur: "partiel", note: "L'ingénieur d'État ne peut approuver un changement de point de dérivation ou d'usage d'un droit d'eau desservi par une acequia sans preuve du respect des conditions fixées par celle-ci, lorsque ses règlements le prévoient ; l'acequia ne peut refuser que si le changement lui est préjudiciable ou l'est à ses membres, décide sous 120 jours (faute de quoi l'accord est réputé donné) et sa décision peut être contestée devant le tribunal de district dans les 30 jours (art. 72-5-24.1 et 73-2-21 E, en vigueur en 2004).", source: "https://law.justia.com/codes/new-mexico/chapter-72/article-5/section-72-5-24-1/"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les commissaires fixent les contributions en travail (fatiga, entretien du canal) ou en argent des titulaires de droits d'eau pour le salaire du mayordomo et l'entretien (art. 73-2-21 NMSA 1978) ; comme subdivisions politiques, les acequias ont accès aux prêts de l'Interstate Stream Commission (art. 73-2-28, 2001).", source: "https://law.justia.com/codes/new-mexico/chapter-73/article-2/section-73-2-21/"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation d'ensemble de l'application du régime n'a été trouvée. Le droit d'approbation des transferts est appliqué : en 2009, saisie de deux refus de transfert opposés par des acequias, la cour d'appel de l'État a jugé que ces décisions ne violaient pas la constitution de l'État et a validé le contrôle restreint du tribunal de district sur elles (Peña Blanca Partnership v. San José de Hernández Community Ditch, 2009-NMCA-016, selon le Utton Center de l'Université du Nouveau-Mexique). En 2023, l'Office of the State Engineer indiquait qu'il n'existait aucun nombre établi d'acequias en activité et qu'environ 73 % des systèmes figurant sur sa carte n'y portaient pas de nom (Source New Mexico, 8 juin 2023).", source: "https://uttoncenter.unm.edu/resources/research-resources/acequias.pdf"}
chronologie:
  - {annee: 1895, evenement: "Une loi territoriale fait des acequias et canaux communautaires des personnes morales dirigées par trois commissaires et un mayordomo."}
  - {annee: 1965, evenement: "Les associations d'acequias et de canaux communautaires deviennent des subdivisions politiques de l'État."}
  - {annee: 1987, evenement: "Les élections des commissaires et du mayordomo passent d'un rythme annuel à un rythme biennal ; les acequias peuvent acquérir et détenir des droits d'eau."}
  - {annee: 1993, evenement: "La loi institue la New Mexico Acequia Commission, rattachée au Department of Finance and Administration."}
  - {annee: 2003, evenement: "Lois sur les banques d'eau des acequias et sur l'approbation par l'acequia des changements de droits d'eau (en vigueur le 1er mars 2004 pour ce second volet)."}
  - {annee: 2009, evenement: "Les municipalités ne peuvent plus exproprier l'eau ni les droits d'eau des acequias établies avant le 1er juillet 2009 (art. 3-27-2 NMSA 1978)."}
  - {annee: 2009, evenement: "La cour d'appel de l'État juge conforme à la constitution de l'État le contrôle restreint des refus de transfert de droits d'eau opposés par deux acequias (Peña Blanca Partnership v. San José de Hernández Community Ditch)."}
