  verifie: ["Statut de subdivision politique de l'État (art. 73-2-28, 1965, modifié en 2001).", "Trois commissaires et un mayordomo élus tous les deux ans par les titulaires de droits d'eau (art. 73-2-12 et 73-2-14).", "Capacité de l'acequia à détenir des droits d'eau (art. 73-2-22.1, 1987).", "Approbation par l'acequia des changements de point de dérivation ou d'usage, délai de 120 jours, recours au tribunal de district (art. 72-5-24.1 et 73-2-21 E, 2003-2004).", "Banques d'eau des acequias (art. 73-2-55.1, 2003).", "Interdiction de l'expropriation municipale (art. 3-27-2 B, 2009) et Acequia Commission (art. 73-2-65, 1993).", "Présence dans 22 des 33 comtés (ministère de la Justice du Nouveau-Mexique)."]
  non_confirme: ["Nombre d'acequias : 640 dans la base de la New Mexico Acequia Association (2018), 600 à 700 selon une présentation de 2021, 721 vers 1987 selon une étude de 1996, environ 2 000 selon l'Office of the State Engineer en 2023.", "Surface irriguée : « plus de 100 000 acres », chiffre arrondi sans date de relevé.", "Nombre de familles titulaires de droits d'eau (« des dizaines de milliers ») non chiffré.", "Arrêt Peña Blanca (2009) lu dans la synthèse du Utton Center, pas dans le texte de la décision.", "Population (nombre de parciantes ou de familles desservies) : non trouvée.", "Nombre de villages : non trouvé."]
