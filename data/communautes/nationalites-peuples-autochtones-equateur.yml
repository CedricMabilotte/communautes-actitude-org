  - {mecanisme: "rapporteur_special", detail: "Rapport de mission en Équateur du Rapporteur spécial Rodolfo Stavenhagen (A/HRC/4/32/Add.2).", annee: 2006, source: "https://documents.un.org/api/symbol/access?s=A/HRC/4/32/Add.2&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/ECU/CO/23-24) sur la justice autochtone, la consultation préalable et les peuples en isolement.", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/ECU/CO/23-24&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République de l'Équateur (2008), art. 1, 2, 56, 57, 60, 171 et 257", nature: "constitution", annee: 2008, source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  - {instrument: "Loi organique des terres rurales et territoires ancestraux (supplément du Registre officiel n° 711, 14 mars 2016), art. 3, 23 et 77 à 83", nature: "loi_organique", annee: 2016, source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution (art. 57.9) garantit les formes propres d'organisation et d'exercice de l'autorité sur les territoires reconnus ; la loi de 2016 (art. 23) confie à ces autorités l'administration et le contrôle social du territoire ; les circonscriptions territoriales autochtones (art. 60 et 257) exigent une consultation approuvée aux deux tiers.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 57.10) reconnaît le droit de créer et d'appliquer un droit propre ou coutumier, sans porter atteinte aux droits constitutionnels ; la loi de 2016 (art. 81 d) fait des pratiques de droit propre sur l'accès à la terre des normes d'administration interne.", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  justice_propre: {valeur: "partiel", note: "Les autorités des communautés, peuples et nationalités exercent des fonctions juridictionnelles selon leur droit propre, dans leur ressort territorial et sous contrôle de constitutionnalité (Constitution, art. 171) ; en 2017, le projet de loi de coordination avec la justice ordinaire restait bloqué à l'Assemblée nationale (CERD, par. 12).", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  terres: {valeur: "reconnu", note: "Propriété imprescriptible, inaliénable, insaisissable et indivisible des terres communautaires et adjudication gratuite des territoires ancestraux (Constitution, art. 57.4 et 57.5) ; adjudication perpétuelle et gratuite (loi de 2016, art. 3 et 23).", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  ressources: {valeur: "partiel", note: "Participation à l'usage, à l'usufruit et à la gestion des ressources renouvelables (Constitution, art. 57.6) ; les ressources non renouvelables et le sous-sol sont propriété de l'État (art. 408).", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  consentement: {valeur: "partiel", note: "Consultation préalable, libre et informée sur les ressources non renouvelables (Constitution, art. 57.7) et consultation prélégislative (art. 57.17) ; sans consentement, il est procédé « conformément à la Constitution et à la loi ».", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  langue: {valeur: "partiel", note: "Le kichwa et le shuar sont langues officielles de relation interculturelle ; les autres langues ancestrales sont d'usage officiel pour les peuples dans les zones où ils vivent (Constitution, art. 2).", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  education: {valeur: "partiel", note: "La Constitution (art. 57.14) garantit un système d'éducation interculturelle bilingue, dont l'administration est « collective et participative ».", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Droit de participer par des représentants aux organismes officiels déterminés par la loi et à la définition des politiques publiques qui les concernent (Constitution, art. 57.16) ; aucun siège réservé à l'Assemblée nationale trouvé.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2017, le Comité pour l'élimination de la discrimination raciale relève le manque d'application effective du droit à la consultation, l'absence de règlement sectoriel et le blocage de la loi de coordination entre justice autochtone et justice ordinaire ; la Cour interaméricaine condamne l'État en 2012 (Sarayaku) et en 2024 (Tagaeri et Taromenane).", source: "https://documents.un.org/api/symbol/access?s=CERD/C/ECU/CO/23-24&l=fr&t=pdf"}
chronologie:
  - {annee: 1998, evenement: "Ratification de la Convention 169 de l'OIT (15 mai)."}
  - {annee: 2006, evenement: "Mission en Équateur du Rapporteur spécial sur les droits des peuples autochtones."}
  - {annee: 2007, evenement: "Vote de l'Équateur pour la Déclaration des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2008, evenement: "Constitution : État plurinational, 21 droits collectifs (art. 57), juridiction autochtone (art. 171)."}
  - {annee: 2012, evenement: "Arrêt de la Cour interaméricaine dans l'affaire Sarayaku (27 juin)."}
  - {annee: 2016, evenement: "Loi organique des terres rurales et territoires ancestraux (14 mars)."}
  - {annee: 2017, evenement: "Observations finales du CERD sur la consultation et la justice autochtone."}
  - {annee: 2023, evenement: "La cour provinciale de Sucumbíos ordonne au ministère de l'Environnement de remettre au peuple Siekopai un titre de propriété sur plus de 42 360 hectares ; le référendum sur l'arrêt de l'exploitation pétrolière du bloc 43 (Yasuní) recueille 60 % de « oui »."}
  - {annee: 2024, evenement: "Arrêt de la Cour interaméricaine dans l'affaire Tagaeri et Taromenane (4 septembre)."}
fiabilite:
  verifie: ["Articles 1, 2, 56, 57, 60, 171, 257 et 408 de la Constitution de 2008 (édition de l'Assemblée nationale).", "Articles 3, 23 et 77 à 83 de la loi organique de 2016 (texte publié par la FAO, dernière réforme du 25 mars 2022).", "Paragraphes 12, 13, 18 et 19 des observations finales du CERD de 2017.", "Dispositif de l'arrêt Tagaeri et Taromenane de 2024.", "Chiffres du recensement 2022 cités par IWGIA (El Mundo Indígena 2024)."]
  non_confirme: ["Aucune liste officielle ni nombre des territoires titrés, ni surface totale récente, n'a été trouvé ; le chiffre de 4 millions d'hectares date de 2006 et ne couvre que la Côte et l'Amazonie.", "Existence d'une circonscription territoriale autochtone effectivement constituée selon l'article 257.", "État de l'adoption d'une loi sur la consultation préalable et d'une loi de coordination des juridictions après 2017.", "Le recensement 2022 a été consulté par l'intermédiaire d'IWGIA, pas sur le site de l'INEC."]
