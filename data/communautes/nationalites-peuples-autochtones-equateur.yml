resume: >-
  La Constitution équatorienne de 2008 définit l'État comme plurinational et interculturel (art. 1). Son article 57 reconnaît aux communes, communautés, peuples et nationalités autochtones 21 droits collectifs, dont la propriété imprescriptible et inaliénable des terres communautaires, la consultation préalable et l'exercice de formes propres d'autorité ; l'article 171 attribue aux autorités autochtones des fonctions juridictionnelles. La loi organique des terres rurales et territoires ancestraux de 2016 organise l'adjudication gratuite et perpétuelle de ces territoires et confie leur administration aux autorités propres, selon leurs usages. Le recensement de 2022 retient 14 nationalités pour l'auto-identification (Tsáchila, Chachi, Épera, Awa, Kichwa, Shuar, Achuar, Shiwiar, Cofán, Siona, Secoya, Zápara, Andoa, Waorani) et compte 1 301 887 personnes autochtones. Les Waorani, le peuple de Sarayaku, les peuples en isolement Tagaeri et Taromenane, les communes (comunas) et le peuple afroéquatorien ont leur propre fiche.
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Pueblo Indígena Kichwa de Sarayaku c. Équateur (série C n° 245) : violation des droits à la consultation, à la propriété communale et à l'identité culturelle ; ordre d'adopter les mesures législatives, administratives ou autres nécessaires pour rendre effectif le droit à la consultation préalable (point 4 du dispositif).", annee: 2012, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_245_esp.pdf"}
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Pueblos Indígenas Tagaeri y Taromenane c. Équateur (série C n° 537, 4 septembre 2024) : violation des droits à la propriété collective et à la libre détermination (art. 21.1 et 26 de la Convention américaine) des peuples en isolement volontaire de l'Amazonie occidentale.", annee: 2024, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_537_esp.pdf"}
