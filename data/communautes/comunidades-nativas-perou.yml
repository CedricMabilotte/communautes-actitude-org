resume: >-
  Fiche agrégée. La Constitution péruvienne de 1993 donne aux « comunidades campesinas y nativas » une existence légale et la personnalité juridique ; elles sont autonomes dans leur organisation, le travail communal, l'usage et la libre disposition de leurs terres. Leurs autorités peuvent exercer des fonctions juridictionnelles selon le droit coutumier. Le recensement de 2017 compte 2 703 communautés natives amazoniennes appartenant à 44 peuples ; 77,1 % des communautés reconnues ont un titre de propriété. Les communautés paysannes andines, régies par les mêmes articles, feront l'objet d'une fiche distincte.
