villages: {valeur: 2703, annee: 2017, perimetre: "communautés natives recensées en 2017, chacune comptée comme une localité ; 241 d'entre elles déclarent des annexes ou hameaux (anexos o caseríos) dont le nombre n'est pas publié", source: "https://www.inei.gob.pe/media/MenuRecursivo/publicaciones_digitales/Est/Lib1598/TOMO_01.pdf"}
resume: >-
  Fiche agrégée. La Constitution péruvienne de 1993 donne aux « comunidades campesinas y nativas » une existence légale et la personnalité juridique ; elles sont autonomes dans leur organisation, le travail communal, l'usage et la libre disposition de leurs terres. Leurs autorités peuvent exercer des fonctions juridictionnelles selon le droit coutumier. Le recensement de 2017 compte 2 703 communautés natives amazoniennes appartenant à 44 peuples ; 77,1 % des 2 425 communautés reconnues ont un titre de propriété. En 2024, l'Instituto del Bien Común en répertorie 3 003, dont 2 286 titrées. Les communautés paysannes andines, régies par les mêmes articles, et les réserves communales cogérées par des communautés natives ont leur propre fiche (« Communautés paysannes du Pérou », « Réserves communales du Pérou ») ; les rondes paysannes citées à l'article 149 aussi (« Rondes paysannes du Pérou »).
