  - {annee: 1993, evenement: "Constitution : art. 89 (autonomie, terres imprescriptibles) et art. 149 (juridiction communale)."}
  - {annee: 2011, evenement: "Loi 29785 sur la consultation préalable."}
  - {annee: 2017, evenement: "IIIe recensement des communautés natives : 2 703 communautés."}
  - {annee: 2024, evenement: "Loi 31973 modifiant la loi forestière 29763 (11 janvier)."}
  - {annee: 2025, evenement: "Sentence 88/2025 du Tribunal constitutionnel : deux dispositions transitoires de la loi 31973 déclarées inconstitutionnelles, notamment faute de consultation préalable."}
