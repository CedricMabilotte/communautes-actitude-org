reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Pérou ratifie la Convention 169 de l'OIT le 2 février 1994 ; la loi 29785 de 2011 organise la consultation préalable qu'elle prévoit.", annee: 1994, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Pérou vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Constitution politique du Pérou (1993), art. 48, 89 et 149", nature: "constitution", annee: 1993, source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  - {instrument: "Décret-loi 22175, loi des communautés natives et du développement agraire de la forêt (1978)", nature: "loi", annee: 1978, source: "https://www.leyes.congreso.gob.pe/Documentos/Leyes/22175.pdf"}
  - {instrument: "Loi 29785 sur le droit à la consultation préalable des peuples autochtones (2011) et règlement (décret suprême 001-2012-MC)", nature: "loi", annee: 2011, source: "https://faolex.fao.org/docs/pdf/per198478.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les communautés sont autonomes dans leur organisation, dans le domaine économique et administratif, « dans le cadre établi par la loi » (Constitution, art. 89).", source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Les autorités des communautés, avec l'appui des rondes paysannes, exercent des fonctions juridictionnelles selon le droit coutumier sur leur territoire, sans violer les droits fondamentaux (Constitution, art. 149).", source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  terres: {valeur: "partiel", note: "La propriété des terres communales est imprescriptible, sauf abandon (Constitution, art. 89) ; l'article 89 ne les déclare pas inaliénables.", source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La loi 29785 (2011) impose la consultation préalable des peuples autochtones ; l'entité publique prend la décision finale, motivée au regard des droits collectifs. Le Tribunal constitutionnel qualifie la consultation préalable de droit fondamental (sentence 88/2025).", source: "https://faolex.fao.org/docs/pdf/per198478.pdf"}
  langue: {valeur: "partiel", note: "Dans les zones où elles prédominent, le quechua, l'aymara et les autres langues autochtones sont langues officielles aux côtés de l'espagnol (Constitution, art. 48).", source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon l'Instituto del Bien Común (2025), 717 des 3 003 communautés natives n'ont pas de titre de propriété (560 inscrites, 157 non inscrites). IWGIA (2026) relève que les concessions minières recouvrent 35 % du territoire des communautés paysannes et natives et signale l'absence de consultation préalable effective. En 2025, le Tribunal constitutionnel annule deux dispositions de la loi 31973 (2024) sur les forêts, adoptées sans consultation des peuples concernés.", source: "https://ibcperu.org/mapa-del-ibc-territorios-indigenas-y-areas-naturales-protegidas-en-peru-2024-se-encuentra-a-disposicion-del-publico"}
chronologie:
