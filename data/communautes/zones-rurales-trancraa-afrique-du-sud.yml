droits:
  autogouvernement: {valeur: "partiel", note: "La municipalité ou, à défaut d'avis de sa part, un comité élu par les résidents majeurs et représentant leur majorité fixe la manière de consulter les résidents (assemblée spéciale, enquête écrite) et recommande au ministre l'entité qui recevra les terres : municipalité, association de propriété communale (CPA, association de copropriétaires enregistrée selon la loi n° 28 de 1996) ou autre organisme agréé par le ministre (loi n° 94 de 1998, art. 1 (ii) et (iii), art. 3 (4) et (5)). Le ministre approuve le choix et peut décider seul si les résidents n'ont pas fait de recommandation dans le délai (art. 3 (6) et (12)).", source: "https://www.gov.za/sites/default/files/gcis_document/201409/a94-98.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les terres en fiducie (trust land, détenues par le ministre pour la communauté) hors zones urbanisées sont transférées en pleine propriété à l'entité choisie, sans droits de mutation (loi n° 94 de 1998, art. 3 (1) et (15)) ; le ministre doit vérifier que les règles de l'entité protègent la sécurité d'occupation des résidents (art. 3 (2)). Une municipalité attributaire ne peut vendre ou grever ces terres sans l'accord de la majorité des résidents réunis en assemblée publique (art. 4 (1) (d)). Les terres non transférées à la fin de la période de transition restent détenues en fiducie par le ministre (art. 3 (13)).", source: "https://www.gov.za/sites/default/files/gcis_document/201409/a94-98.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Une municipalité attributaire doit permettre aux résidents de participer aux décisions sur l'administration des terres, leur donner une préférence d'accès et obtenir l'accord de la majorité d'entre eux en assemblée publique avant toute vente ou charge (loi n° 94 de 1998, art. 4 (1) (a), (c) et (d)). L'art. 6, qui soumettait la prospection et l'exploitation minières à l'approbation de l'entité propriétaire, a été abrogé par la loi n° 28 de 2002 sur le développement des ressources minérales et pétrolières (annexe, art. 110).", source: "https://www.gov.za/sites/default/files/gcis_document/201409/a94-98.pdf"}
