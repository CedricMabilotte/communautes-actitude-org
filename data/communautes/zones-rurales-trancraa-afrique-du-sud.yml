resume: >-
  Fiche agrégée : elle couvre les résidents des 23 zones rurales régies par la loi sur les zones rurales n° 9 de 1987 (Rural Areas Act), abrogée par la loi de 1998 selon un calendrier fixé zone par zone. Ce sont d'anciennes réserves dites « coloured » (catégorie raciale « métis » de l'apartheid), issues pour la plupart de stations missionnaires et de réserves communales de 1909. La loi sur la transformation de certaines zones rurales (Transformation of Certain Rural Areas Act n° 94 de 1998, TRANCRAA) prévoit le transfert en pleine propriété des terres détenues en fiducie par le ministre à une entité recommandée après consultation des résidents : municipalité, association de propriété communale (CPA) ou autre organisme agréé. Les zones couvrent 1,4 million d'hectares dans quatre provinces, dont plus de 1,3 million au Cap-du-Nord (Namaqualand, Richtersveld, Mier). En octobre 2024, le ministère déclarait 603 000 ha transférés.
  La zone du Richtersveld fait aussi l'objet de la fiche « Communauté nama du Richtersveld ».
