effectivite: {valeur: "partielle", note: "Le 30 octobre 2024, le ministère a déclaré devant la commission parlementaire 603 099 ha transférés sur 1,4 million, avec neuf zones transférées en tout ou partie au titre de la loi (Oppermansgronde l'ayant été par la voie de la restitution) et les autres aux stades de résolution municipale, de création de l'entité ou de référendum (Komaggas) ; il cite le manque de personnel, le manque de coopération de certaines municipalités et des litiges internes. Des membres de la commission ont demandé un suivi des obligations des entités attributaires envers les communautés. Une étude de 2005 sur les six zones du Namaqualand, où la loi a été appliquée en 2001-2002, relève une consultation portée par la société civile, sans formation, financement ni appui au développement (Wisborg et Rohde, Development Southern Africa).", source: "https://pmg.org.za/committee-meeting/39779/"}
chronologie:
  - {annee: 1909, evenement: "Loi n° 29 sur les stations missionnaires et les réserves communales : constitution de la plupart des futures zones."}
  - {annee: 1987, evenement: "Loi n° 9 sur les zones rurales (Rural Areas Act, Chambre des représentants) : terres détenues en fiducie par le ministre et gérées par des conseils de zone."}
  - {annee: 1994, evenement: "Proclamation R. 154 : administration de la loi de 1987 confiée aux Premiers des provinces concernées."}
  - {annee: 1998, evenement: "Promulgation de la loi n° 94 sur la transformation de certaines zones rurales (20 octobre) ; abrogation programmée de la loi de 1987 et de la loi de 1990 sur la zone rurale de Mier."}
  - {annee: 2001, evenement: "Début de l'application de la loi dans les six zones du Namaqualand (2001-2002)."}
  - {annee: 2002, evenement: "La loi n° 28 sur le développement des ressources minérales et pétrolières (Journal officiel du 10 octobre 2002) abroge l'art. 6 (minerais) de la loi de 1998."}
  - {annee: 2013, evenement: "Transfert des terres de Mamre (Cap-Occidental)."}
  - {annee: 2019, evenement: "Transfert d'Ebenhaeser et d'une partie de Haarlem (Cap-Occidental)."}
  - {annee: 2022, evenement: "Transfert de 14 676 ha de la zone de Mier (Cap-du-Nord), le reste en cours."}
  - {annee: 2023, evenement: "Transfert de Concordia, du Richtersveld, de Leliefontein (Cap-du-Nord) et d'Enon-Bersheba (Cap-Oriental)."}
  - {annee: 2024, evenement: "Transfert de Zoar ; rapport du ministère à la commission parlementaire : 603 099 ha transférés sur 1,4 million."}
