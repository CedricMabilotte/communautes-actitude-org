resume: >-
  Fiche agrégée : elle couvre les communaux villageois (bygdeallmenninger), terres communes dont la propriété appartient à au moins la moitié des exploitations agricoles qui y exercent de longue date des droits d'usage (loi n° 59 du 19 juin 1992, § 1-1). Chaque communal est administré par un conseil (allmenningsstyre) de trois à sept membres élu par et parmi les propriétaires et les ayants droit, qui adopte des règles d'usage (bruksregler) approuvées par le ministère de l'Agriculture et de l'Alimentation. Les droits d'usage portent sur le bois, le pâturage, les alpages d'été (seter), la chasse et la pêche ; ils restent attachés à l'exploitation et ne peuvent être vendus séparément. Selon le Store norske leksikon (encyclopédie nationale), il existe un peu plus de cinquante communaux villageois, qui couvrent 7,5 millions de dekar (7 500 km²).
