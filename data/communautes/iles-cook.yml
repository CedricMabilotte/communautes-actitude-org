resume: >-
  État autonome en libre association avec la Nouvelle-Zélande depuis l'entrée en vigueur de sa Constitution le 4 août 1965, après des élections surveillées par un représentant de l'ONU. La Nouvelle-Zélande conserve des responsabilités pour les affaires extérieures et la défense, exercées après consultation du Premier ministre des Îles Cook ; les habitants conservent la citoyenneté néo-zélandaise. La Constitution institue une Chambre des Ariki (chefs coutumiers) consultative et reconnaît la coutume comme partie du droit. En 2025, la signature d'un partenariat avec la Chine sans consultation préalable de la Nouvelle-Zélande a conduit celle-ci à suspendre une partie de son aide budgétaire, rétablie en avril 2026.
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Résolution 2064 (XX) « Question des îles Cook » du 16 décembre 1965 : l'Assemblée générale prend acte du rapport du représentant de l'ONU chargé de surveiller les élections, note que la population a réservé son droit d'accéder à l'indépendance complète et juge que la communication de renseignements au titre de l'article 73 e de la Charte n'est plus nécessaire", annee: 1965, source: "https://documents.un.org/api/symbol/access?s=A/RES/2064%28XX%29&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Cook Islands Constitution Act 1964 (Nouvelle-Zélande) et Constitution des Îles Cook, version consolidée au 13 juin 2022", nature: "constitution", annee: 1965, source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "« The Cook Islands shall be self-governing » (Cook Islands Constitution Act 1964, s. 3) ; la Constitution, loi suprême (s. 4), institue Parlement, Cabinet et Chambre des Ariki.", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement légifère pour « la paix, l'ordre et le bon gouvernement » des Îles Cook (art. 39) ; aucune loi néo-zélandaise postérieure ne s'y applique sans loi du Parlement des Îles Cook (art. 46).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  justice_propre: {valeur: "reconnu", note: "Haute Cour et Cour d'appel propres (partie IV) ; la Cour foncière est déclarée être la même juridiction que la Native Land Court créée par le Cook Islands Act 1915 (art. 83). Depuis l'amendement constitutionnel n° 17 (en vigueur le 1er juillet 1995), l'avis ou la décision des Aronga Mana (autorités coutumières) de l'île ou du vaka sur l'existence et la portée d'une coutume est « définitif » et ne peut être contesté devant un tribunal (art. 66A, 4).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  terres: {valeur: "partiel", note: "Sur les îles de Mangaia, Mitiaro et Pukapuka, la division foncière de la Haute Cour n'exerce pas de compétence sur les terres (et, depuis l'amendement n° 17 de 1995, sur les titres de chef) au-delà de ce que la coutume lui reconnaissait, sauf demande des Aronga Mana de l'île ; la compétence exercée selon la coutume y est définitive (art. 48, 3 et 4). Ailleurs, les terres relèvent de la Cour foncière (art. 83).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Les débats du Parlement se tiennent en maori de Rarotonga et en anglais ; projets de loi et lois sont rédigés dans les deux langues, sauf résolution contraire ; en cas de divergence, la version anglaise prévaut (art. 35).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Partie V « Les revenus publics des Îles Cook » (art. 67 à 71) : fonds publics, règles sur l'impôt (art. 68), compte du gouvernement et audit.", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  representation: {valeur: "partiel", note: "La Constitution institue une Chambre des Ariki (chefs coutumiers) représentant les îles (art. 8) ; elle examine les questions relatives au bien-être de la population que le Parlement lui soumet et lui adresse avis et recommandations (art. 9). La coutume fait partie du droit sauf incompatibilité avec la Constitution ou une loi (art. 66A, 3).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  statut_personnel: {valeur: "partiel", note: "Statut de résident permanent des Îles Cook défini par la Constitution (art. 76A) ; il ouvre le droit de vote au même titre que la citoyenneté du Commonwealth (art. 28) ; la citoyenneté néo-zélandaise est maintenue (Constitution Act 1964, s. 6).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
  autodetermination_externe: {valeur: "reconnu", note: "Toute modification des sections 2 à 6 du Constitution Act 1964, dont la s. 5 sur les affaires extérieures et la défense, exige deux tiers des membres du Parlement et deux tiers des suffrages exprimés lors d'un scrutin populaire (art. 41, 2). La déclaration néo-zélandaise du 10 novembre 1988, reproduite dans l'édition consolidée, qualifie les Îles Cook d'« État autonome en libre association volontaire » issu d'actes d'autodétermination supervisés par l'ONU conformément à la résolution 1541 (XV).", source: "https://parliamentci.wpenginepowered.com/wp-content/uploads/2022/07/CONSTITUTION-OF-THE-COOK-ISLANDS-JUNE-2022.pdf"}
effectivite: {valeur: "effective", note: "Les élections générales se sont tenues le 12 août 2026 ; le Parti des Îles Cook a obtenu 13 des 24 sièges et Mark Brown reste Premier ministre (RNZ, 27 août 2026). En février 2025, le gouvernement a signé un partenariat stratégique avec la Chine sans en communiquer le texte à la Nouvelle-Zélande au préalable ; celle-ci a suspendu 18,2 millions de dollars néo-zélandais d'aide budgétaire en juin 2025, puis 29,8 millions sur deux exercices, et a rétabli ce financement le 2 avril 2026 avec la signature d'une déclaration sur la défense et la sécurité (RNZ ; New Zealand Herald).", source: "https://www.rnz.co.nz/news/pacific/1148865/mark-brown-s-cook-islands-party-set-to-govern-for-historic-fifth-consecutive-term"}
chronologie:
  - {annee: 1915, evenement: "Cook Islands Act (Nouvelle-Zélande) : création de la Native Land Court."}
  - {annee: 1965, evenement: "Élections surveillées par un représentant de l'ONU ; entrée en vigueur de la Constitution le 4 août ; résolution 2064 (XX) du 16 décembre."}
  - {annee: 1988, evenement: "Déclaration néo-zélandaise du 10 novembre transmise à l'ONU : les traités conclus par la Nouvelle-Zélande ne s'étendent aux Îles Cook et à Niue que si l'instrument le précise."}
  - {annee: 1995, evenement: "Amendement constitutionnel n° 17 (loi 1994-95 n° 36), en vigueur le 1er juillet : partie IVB « Coutume » (art. 66A) et compétence coutumière sur les terres et titres de chef à Mangaia, Mitiaro et Pukapuka (art. 48)."}
  - {annee: 2001, evenement: "Déclaration conjointe du centenaire : la Nouvelle-Zélande et les Îles Cook s'engagent à se consulter régulièrement sur la défense et la sécurité."}
  - {annee: 2025, evenement: "Février : partenariat stratégique global signé avec la Chine. Juin : la Nouvelle-Zélande suspend 18,2 millions de dollars néo-zélandais d'aide budgétaire ; en novembre, la suspension porte sur 29,8 millions sur deux exercices."}
  - {annee: 2026, evenement: "2 avril : déclaration sur la défense et la sécurité signée avec la Nouvelle-Zélande, qui rétablit son financement. 12 août : élections générales ; le Parti des Îles Cook obtient 13 sièges sur 24."}
