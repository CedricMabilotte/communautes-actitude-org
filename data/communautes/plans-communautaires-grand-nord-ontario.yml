effectivite: {valeur: "partielle", note: "Une analyse du Yellowhead Institute (Scott et Cutfeet, juillet 2019) relève que la loi entend donner au gouvernement l'autorité finale et unilatérale d'approuver des mines, des routes et d'autres infrastructures contraires aux plans communautaires lorsque les « intérêts socio-économiques de l'Ontario » sont en jeu (l'article cite le par. 12 (4) ; ce pouvoir de décret figure aujourd'hui au par. 14 (4)), et que la Nishnawbe Aski Nation la qualifiait de « nouvelle forme de colonialisme ». Au 1er août 2025, la page du ministère des Richesses naturelles recense quatre plans approuvés entre 2006 et 2014, un projet de plan (Deer Lake, 2015) et dix cadres de référence sans plan approuvé (dont celui de Deer Lake), signés entre 2013 et 2018 ; le projet de plan de Constance Lake a été soumis aux commentaires du public du 21 août au 6 octobre 2025. Les modifications de 2021 ont supprimé l'objectif de 225 000 km² de zones protégées et l'art. 12, qui interdisait la plupart des aménagements en l'absence de plan sauf arrêté ou décret.", source: "https://yellowheadinstitute.org/2019/after-the-far-north-act/"}
chronologie:
  - {annee: 2006, evenement: "Le 26 juin, approbation de « Keeping the Land », stratégie d'aménagement de la forêt Whitefeather et des zones adjacentes, élaborée par la Première Nation de Pikangikum (1 221 717 ha)."}
  - {annee: 2010, evenement: "Adoption de la Loi de 2010 sur le Grand Nord ; le par. 9 (21) répute la stratégie Whitefeather plan communautaire d'aménagement du territoire."}
  - {annee: 2011, evenement: "Entrée en vigueur de la loi le 31 janvier ; le 7 juillet, arrêtés désignant les zones d'aménagement et approuvant les plans de Cat Lake et Slate Falls et de Little Grand Rapids."}
  - {annee: 2014, evenement: "Le 8 septembre, arrêtés FN-03-2014-P et FN-06-2014-P désignant la zone d'aménagement de Pauingassi et approuvant son plan, en remplacement de l'arrêté de 2011."}
  - {annee: 2015, evenement: "Publication du projet de plan de la Première Nation de Deer Lake."}
  - {annee: 2018, evenement: "Inscription de Pimachiowin Aki sur la Liste du patrimoine mondial de l'UNESCO, qui couvre notamment les territoires traditionnels de Little Grand Rapids et de Pauingassi."}
  - {annee: 2021, evenement: "Le 9 décembre, la Loi de 2021 visant à bâtir l'Ontario (mesures budgétaires), annexe 10, abroge l'art. 12 et retire l'objectif de 225 000 km² de zones protégées."}
  - {annee: 2025, evenement: "Le projet de plan de la Première Nation de Constance Lake est soumis aux commentaires du public du 21 août au 6 octobre."}
fiabilite:
  verifie: ["Texte français codifié de la Loi de 2010 sur le Grand Nord (période de codification à compter du 22 février 2024, dernière modification 2021, chap. 40, annexe 10), art. 1 à 21, téléchargé depuis Lois-en-ligne.", "Liste des plans approuvés, projets et cadres de référence et chiffres du Grand Nord (page du ministère des Richesses naturelles mise à jour le 1er août 2025).", "Arrêtés FN-01-2011-P et FN-02-2011-P (par. 9 (4)) et FN-04-2011-P et FN-05-2011-P (al. 9 (14) a), 7 juillet 2011) ; arrêtés FN-03-2014-P (par. 9 (4)) et FN-06-2014-P (al. 9 (14) a), 8 septembre 2014), ce dernier révoquant et remplaçant l'arrêté FN-06-2011-P.", "Superficies des zones d'aménagement et des zones protégées dans chacun des quatre plans (Whitefeather : 1 221 717 ha dont 436 025 ha de zones protégées ; Cat Lake et Slate Falls : 1 462 975 ha dont 495 833 ha ; Pauingassi : 138 763 ha dont 108 493 ha ; Little Grand Rapids : 188 738 ha, entièrement en zone protégée).", "Approbation des plans de Cat Lake et Slate Falls, de Little Grand Rapids et de Pauingassi par résolution du conseil de bande, mentionnée dans les plans publiés.", "Analyse du Yellowhead Institute du 9 juillet 2019 (citations sur le par. 12 (4) et la position de la Nishnawbe Aski Nation)."]
  non_confirme: ["Aucun plan approuvé après 2014 n'a été trouvé ; la page ministérielle n'a pas été mise à jour depuis le 1er août 2025 et l'issue de la consultation de 2025 sur le plan de Constance Lake n'est pas connue.", "Population des Premières Nations titulaires des quatre plans : aucune source consolidée ouverte ; Pauingassi et Little Grand Rapids ont leurs réserves au Manitoba.", "Aucun règlement fixant les limites d'une zone protégée (art. 11) ni aucun décret pris en vertu du par. 14 (4) n'a été trouvé.", "Aucun document onusien visant nommément ce régime n'a été ouvert ; l'inscription de Pimachiowin Aki par l'UNESCO ne mentionne pas la loi ontarienne.", "La Loi de 2025 sur les zones économiques spéciales, sanctionnée le 5 juin 2025, permet d'exempter par règlement des projets désignés de lois provinciales nommées ; aucune désignation visant une zone d'aménagement du Grand Nord n'a été trouvée."]
