resume: >-
  La Loi de 2010 sur le Grand Nord (L.O. 2010, chap. 18), en vigueur depuis le 31 janvier 2011, organise un aménagement du territoire élaboré conjointement par les Premières Nations des zones des traités no 5 et no 9 et le ministre des Richesses naturelles sur les terres publiques du Grand Nord de l'Ontario. Un plan communautaire d'aménagement du territoire (plan qui fixe les usages permis et les zones protégées d'une zone donnée) n'a d'effet qu'après approbation de ses parties obligatoires par arrêté du ministre et adoption d'une résolution par le conseil de chaque Première Nation concernée (art. 9, par. 14). Toute décision d'affectation des terres et des ressources dans la zone doit ensuite être compatible avec le plan, et les zones protégées sont fermées à l'exploration minière et à la récolte commerciale de bois (art. 14). Quatre plans sont en vigueur : la stratégie de la forêt Whitefeather de Pikangikum (2006), réputée plan par la loi, et les plans de Cat Lake et Slate Falls et de Little Grand Rapids, approuvés en 2011, et celui de Pauingassi, approuvé de nouveau en 2014.
