droits:
  autogouvernement: {valeur: "partiel", note: "Le régime ne crée pas d'institution propre : il s'appuie sur le conseil de bande au sens de la Loi sur les Indiens (art. 2), dont la résolution est requise pour approuver le cadre de référence (par. 9 (4) b), le plan (par. 9 (14) b) et toute modification (art. 10) ; le plan est élaboré par une équipe mixte de planification Première Nation–ministère (par. 9 (3)).", source: "https://www.ontario.ca/fr/lois/loi/10f18"}
  pouvoir_normatif: {valeur: "partiel", note: "Le plan approuvé fixe les désignations d'utilisation du sol et les zones protégées (par. 9 (9)) ; nul ne peut prendre de décision d'affectation, d'aliénation ou d'utilisation des terres publiques et des ressources de la zone qui ne soit compatible avec le plan (par. 14 (1)). Le texte est conjoint et ses parties obligatoires sont approuvées par arrêté du ministre (par. 9 (14) a) ; le lieutenant-gouverneur en conseil (le gouvernement provincial) peut écarter le plan par décret au nom des intérêts socio-économiques de l'Ontario, neuf mois après une modification proposée par le ministre et non approuvée (par. 14 (4) et (5)).", source: "https://www.ontario.ca/fr/lois/loi/10f18"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi ne s'applique qu'aux terres publiques, à l'exclusion des réserves et des municipalités (art. 3) ; elle ne transfère aucun titre : la Première Nation codécide du zonage de la zone d'aménagement (par. 9 (6) à (9)) et peut demander une zone de protection provisoire en l'absence de plan (art. 13). Les conseils peuvent demander conjointement que les limites d'une zone protégée soient fixées par règlement (art. 11).", source: "https://www.ontario.ca/fr/lois/loi/10f18"}
  ressources: {valeur: "partiel", note: "Dans une zone protégée désignée par le plan sont interdits la prospection et l'exploration minières, l'ouverture d'une mine (sauf si un plan de fermeture a été reçu avant le 31 janvier 2011), la récolte commerciale de bois, la prospection et la production de pétrole et de gaz et, sauf exception, les centrales éoliennes ou hydroélectriques (par. 14 (2)) ; les claims et baux miniers antérieurs au plan restent valides et leurs titulaires peuvent y poursuivre l'exploration et la mise en valeur (par. 14 (3)) et les droits acquis avant le plan sont maintenus (par. 14 (6)).", source: "https://www.ontario.ca/fr/lois/loi/10f18"}
  consentement: {valeur: "partiel", note: "Un plan n'a d'effet qu'après une résolution du conseil de chaque Première Nation concernée (par. 9 (14) b), et l'aménagement doit respecter les droits ancestraux ou issus de traités de l'article 35 de la Loi constitutionnelle de 1982, y compris l'obligation de consulter (art. 1 c). Le décret prévu au par. 14 (4) permet de passer outre au refus d'une modification ; depuis l'abrogation de l'art. 12 en 2021, un nouvel aménagement dans une zone sans plan n'exige plus d'arrêté du ministre ni de décret au titre de la loi.", source: "https://www.ontario.ca/fr/lois/loi/10f18"}
