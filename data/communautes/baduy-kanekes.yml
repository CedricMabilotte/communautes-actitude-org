  - {instrument: "Règlement régional du kabupaten de Lebak n° 32 de 2001 sur la protection du droit foncier coutumier (hak ulayat) de la communauté baduy (cité dans le préambule des règlements n° 38 et 98 de 2023)", nature: "loi", annee: 2001, source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-98-tahun-2023"}
  - {instrument: "Règlement régional du kabupaten de Lebak n° 1 de 2015 sur les villages, art. 228 (1) : Kanekes est un village coutumier (cité dans le préambule du règlement n° 38 de 2023)", nature: "loi", annee: 2015, source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  - {instrument: "Règlement régional de la province de Banten n° 2 de 2022 sur les institutions, la désignation et le mandat des chefs de village coutumier, art. 3 à 6", nature: "loi", annee: 2022, source: "https://pasal.id/peraturan/perda/perda-prov-banten-2-2022"}
  - {instrument: "Règlement du chef de district (Peraturan Bupati) de Lebak n° 38 de 2023 sur le gouvernement du village coutumier de Kanekes", nature: "loi", annee: 2023, source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  - {instrument: "Règlement du chef de district de Lebak n° 98 de 2023 modifiant le règlement n° 38 de 2023, art. 12A (enregistrement de la terre coutumière)", nature: "loi", annee: 2023, source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-98-tahun-2023"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le gouvernement du village coutumier comprend le chef de village (Jaro Pamarentah), le secrétaire et les agents du village, et une institution coutumière de décision formée du Jaro Tangtu (représentant du Puun, chef coutumier, pour les affaires extérieures) et du Jaro 7, chargé de l'ordre coutumier (art. 4 et définitions de l'art. 1 du règlement n° 38 de 2023) ; le chef de village est désigné par l'institution coutumière, qui contrôle le gouvernement du village (art. 5 et 7). Le chef de village relaie les instructions du gouvernement « dans la mesure où elles ne sont pas contraires à la coutume » (art. 6 (3)). Le chef de district exerce une tutelle (art. 13). L'institution coutumière est reconnue par un règlement du chef de district, qui en garde la tutelle.", source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  pouvoir_normatif: {valeur: "partiel", note: "« Le système de droit coutumier du village coutumier de Kanekes applique le droit coutumier baduy » (art. 8 (1) du règlement n° 38 de 2023), qui comprend des interdits oraux (pantangan ou buyut, art. 8 (2) et (3)) ; les biens propres du village sont gérés selon le droit coutumier (art. 10 (1)). Les droits et obligations du chef de village suivent à la fois la législation et le droit coutumier (art. 6).", source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  justice_propre: {valeur: "partiel", note: "Les sanctions des infractions aux interdits coutumiers sont prononcées par l'institution coutumière, qui règle aussi les litiges qui s'y rapportent (art. 8 (4) et (5) du règlement n° 38 de 2023) ; la compétence est limitée à ces interdits.", source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  terres: {valeur: "partiel", note: "Le territoire du village coutumier (5 212,41 ha, limites décrites à l'art. 2 (2)) est le territoire de la communauté baduy « qui détient le droit foncier coutumier » sur la terre, l'eau et les ressources (art. 2 (3) du règlement n° 38 de 2023) ; l'art. 12A ajouté par le règlement n° 98 de 2023 charge le gouvernement du district d'inscrire la terre coutumière (mesure, cartographie, inscription sur la liste foncière) pour reconnaître le droit foncier coutumier baduy ; cette inscription ne peut servir des intérêts individuels (art. 12A (3)). Protection du droit foncier coutumier par le règlement régional n° 32 de 2001. Le règlement prescrit l'inscription de la terre coutumière sans attribuer de titre de propriété au nom de la communauté.", source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-98-tahun-2023"}
  ressources: {valeur: "partiel", note: "Le droit foncier coutumier s'étend à « la terre, l'eau et les ressources naturelles qui s'y trouvent » (art. 2 (3) a du règlement n° 38 de 2023) ; aucun texte ouvert ne règle le sous-sol ni les permis d'exploitation.", source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le village coutumier dispose d'un budget alimenté par ses revenus propres, le fonds de village de l'État (Dana Desa), une part des impôts du district et des transferts ; sa gestion requiert l'accord de l'institution coutumière (art. 11 du règlement n° 38 de 2023). Le contrôle des fonds publics revient à l'inspection administrative (art. 14).", source: "https://pasal.id/peraturan/perbup/perbup-kab-lebak-no-38-tahun-2023"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de 2025 relève des empiètements sur les terres liés à des mines illégales, au pillage forestier et à la création de rizières irriguées par des groupes ou réseaux illégaux, qui menacent le sanctuaire et les sources d'eau, ainsi que 300 à 500 visiteurs chaque fin de semaine dans les hameaux de Baduy Luar (Hasim, Faisal et Sudradjat, SAAAK e-journal, 2025) ; la communauté a refusé le label de « village touristique » et demandé la coupure des signaux de télécommunication sur son territoire.", source: "https://www.archi-texts.com/SAAAK/PDF/2-2/SAAAKej_2.2.1.pdf"}
chronologie:
  - {annee: 1990, evenement: "Règlement régional de Lebak n° 13 sur l'institution coutumière baduy."}
  - {annee: 2001, evenement: "Règlement régional de Lebak n° 32 sur la protection du droit foncier coutumier de la communauté baduy."}
  - {annee: 2015, evenement: "Règlement régional de Lebak n° 1 sur les villages : Kanekes devient village coutumier (art. 228)."}
  - {annee: 2022, evenement: "Règlement régional de la province de Banten n° 2 : les chefs de village coutumier sont désignés selon le droit coutumier ; les districts doivent établir les villages coutumiers dans un délai de douze mois."}
  - {annee: 2023, evenement: "Règlement du chef de district de Lebak n° 38 (26 avril) sur le gouvernement du village coutumier de Kanekes, en vigueur huit mois après sa promulgation."}
  - {annee: 2023, evenement: "Règlement n° 98 (13 décembre) : enregistrement de la terre coutumière baduy au registre foncier (art. 12A)."}
fiabilite:
  verifie: ["Texte des art. 1 à 15 du règlement du chef de district de Lebak n° 38 de 2023 (pasal.id, source BPK) : surface de 5 212,41 ha, limites, liste des 3 hameaux de Baduy Dalam et des 64 hameaux de Baduy Luar, institutions, droit coutumier, finances.", "Texte de l'art. 12A ajouté par le règlement n° 98 de 2023 (pasal.id).", "Intitulés des règlements régionaux de Lebak n° 13 de 1990, n° 32 de 2001 et n° 1 de 2015 (art. 228) d'après les préambules des règlements n° 38 et 98 de 2023.", "Texte des art. 1 à 6 du règlement régional de la province de Banten n° 2 de 2022 (pasal.id)."]
  non_confirme: ["Texte du règlement régional n° 32 de 2001 non ouvert : son contenu (interdiction d'appropriation des terres par des tiers, reconnaissance de l'autorité coutumière sur le territoire) n'est connu que par une source secondaire (Permata, 2025).", "Les surfaces varient selon les textes : 5 212,41 ha (règlement n° 38 de 2023), 5 101,85 ha (article de 2025, sans référence), 4 564,12 ha de « zone de droit foncier coutumier baduy » dans un plan d'aménagement de la province de Banten dont la version en vigueur n'a pas été établie.", "Population : environ 16 518 personnes selon une estimation citée dans un article de 2025 sans année de comptage ; un chiffre de 11 699 personnes en 2017 attribué à l'office statistique n'a pas été vérifié sur la source.", "Le règlement compte 64 hameaux de Baduy Luar ; la source secondaire en donne 61.", "Règlement régional n° 1 de 2015 non ouvert (cité seulement).", "L'inscription de la terre coutumière sur la liste foncière prévue par l'art. 12A (2023) n'est confirmée par aucune source consultée.", "Aucun document onusien nommant les Baduy n'a été trouvé ; l'Indonésie ne reconnaît pas de peuples autochtones au sens de la DNUDPA."]
