resume: >-
  Les Baduy, qui se nomment Urang Kanekes, vivent dans le village de Kanekes, au sud de la province de Banten, sur l'île de Java. Le règlement régional du kabupaten (district) de Lebak n° 32 de 2001 protège leur droit foncier coutumier (hak ulayat). Le règlement régional n° 1 de 2015 sur les villages fait de Kanekes un village coutumier (desa adat), et le règlement du chef de district n° 38 de 2023 en organise le gouvernement : le chef du village (Jaro Pamarentah) est désigné par l'institution coutumière, le droit coutumier baduy s'applique sur un territoire de 5 212,41 hectares, et ce territoire est soumis au droit foncier coutumier. Le règlement n° 98 de 2023 charge le gouvernement du district d'inscrire cette terre coutumière (mesure, cartographie, inscription sur la liste foncière) en vue de la reconnaissance du droit foncier de la communauté.
