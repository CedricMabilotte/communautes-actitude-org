resume: >-
  Une zone cynégétique villageoise (ZCV, zone de chasse villageoise) est une portion de zone d'intérêt cynégétique (zone réservée à la chasse) ou de zone banale, définie par arrêté du ministre chargé de la faune à la demande des populations riveraines, pour servir de support aux activités économiques liées à la faune. Les ZCV se situent surtout dans le Nord et le Nord-Est, en périphérie des parcs du Bamingui-Bangoran et du Manovo-Gounda Saint-Floris : la zone est louée à des sociétés de chasse sportive, avec un quota d'abattage et une part annuelle des taxes versée aux populations riveraines. La loi n° 20.026 du 30 novembre 2020 portant code de gestion de la faune et des aires protégées en fait une catégorie d'aire faunique communautaire, gérée par des associations des populations ayants droit ; le terrain reste dans le domaine forestier de l'État. Dix ZCV étaient en activité en 2011 selon la direction de la faune ; un état régional de 2021 en recense douze, pour 34 287 km², la plupart sans activité.
