resume: >-
  Les Guna vivent sur la côte caraïbe du Panama et dans l'archipel voisin. La comarca (division territoriale autochtone à statut spécial) de San Blas est créée en 1938 et organisée par la loi 16 de 1953, qui reconnaît le Congrès général guna. La loi 99 de 1998 la renomme Kuna Yala. L'INEC estime sa population à 50 734 habitants en 2023 ; le recensement de 2023 compte 112 319 Guna dans l'ensemble du pays. Les Guna des comarcas Madungandí et Wargandí relèvent de lois distinctes (fiches « Guna de la comarca Madungandí » et « Guna de la comarca Wargandí »).
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Panama vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Visite du Rapporteur spécial James Anaya, qui rencontre des représentants guna dans la comarca Gunayala ; il présente le système des comarcas comme une affirmation des droits des peuples autochtones, sur une base « fragile et précaire ».", annee: 2013, source: "https://www.ohchr.org/es/press-releases/2013/07/experto-de-la-onu-urge-panama-no-dar-marcha-atras-en-los-derechos-de-los"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de mission A/HRC/27/52/Add.1 : la comarca Gunayala est la première comarca créée ; ses règlements internes n'ont pas été adoptés par l'État mais servent de base aux accords entre le gouvernement et le Congrès général guna (§ 13).", annee: 2014, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.1-MissionPanama_AUV.pdf"}
base_nationale:
  - {instrument: "Constitution politique du Panama (1972, révisée en 2004), art. 88, 90, 108, 127 et 147", nature: "constitution", annee: 1972, source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  - {instrument: "Loi 16 du 19 février 1953 qui organise la comarca de San Blas", nature: "loi", annee: 1953, source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  - {instrument: "Loi 99 du 23 décembre 1998 qui dénomme la comarca Kuna Yala", nature: "loi", annee: 1998, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
  - {instrument: "Loi 88 du 22 novembre 2010 qui reconnaît les langues et les alphabets des peuples autochtones et organise l'éducation interculturelle bilingue", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  - {instrument: "Loi 1 du 3 février 1994 (loi forestière), art. 44", nature: "loi", annee: 1994, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
  - {instrument: "Loi 37 de 2016 sur la consultation et le consentement préalable, libre et éclairé", nature: "loi", annee: 2016, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 16 de 1953 (art. 13) reconnaît le Congrès général guna et les congrès de village selon leur tradition et leur charte organique ; l'art. 11 renvoie à cette charte pour les fonctions des trois caciques principaux et des sahilas (chefs de village).", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 16 de 1953 (art. 11 et 13) renvoie à la charte organique de la communauté, sous réserve de compatibilité avec la Constitution et les lois ; en 2014, le Rapporteur spécial de l'ONU indique que les règlements de la comarca n'ont pas été adoptés par l'État.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi 16 de 1953 (art. 12) reconnaît la juridiction du Congrès général guna et des congrès de village sur les infractions, hors application des lois pénales et sous réserve de compatibilité avec la Constitution et les lois.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  terres: {valeur: "reconnu", note: "La Constitution (art. 127) garantit aux communautés autochtones la propriété collective de leurs terres ; la loi 16 de 1953 (art. 21) interdit d'attribuer des terres de la réserve à une personne extérieure à la communauté sans l'accord de deux congrès guna.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  ressources: {valeur: "partiel", note: "La loi forestière 1 de 1994 (art. 44) soumet les permis et concessions d'exploitation forestière dans les comarcas à une autorisation conjointe de l'État et des congrès autochtones ; pour les mines, la loi 16 de 1953 (art. 23) prévoit seulement l'indemnisation des dommages.", source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
  consentement: {valeur: "partiel", note: "La loi 37 de 2016 (art. 1 à 3) rend obligatoire la consultation préalable, libre et éclairée des comarcas, par leurs institutions propres, avant toute mesure législative ou administrative qui les touche.", source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
  langue: {valeur: "partiel", note: "La loi 88 de 2010 (art. 1, 2 et 4) reconnaît la langue kuna et son alphabet et impose son enseignement à côté de l'espagnol dans les comarcas, sans statut de langue officielle ; la Constitution (art. 88) prévoit l'étude et la diffusion des langues autochtones.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 88 de 2010 (art. 7, 9 et 11) rend obligatoire l'éducation interculturelle bilingue dans les écoles des comarcas ; le ministère de l'Éducation conçoit et supervise le plan national (art. 8). La loi 16 de 1953 (art. 18 et 19) adapte les programmes aux coutumes locales et confie les premières classes à des enseignants autochtones.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La Constitution (art. 147) garantit à chaque comarca le nombre de députés dont elle disposait à l'entrée en vigueur de la règle ; ces sièges sont territoriaux et non réservés aux Guna.", source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2014, le Rapporteur spécial de l'ONU relève que le tourisme de la comarca Gunayala est administré par le Congrès guna (§ 61), que l'État contrôle les dépenses publiques et les recettes fiscales dans les comarcas (§ 51), et que le Service national des frontières ne coordonne pas ses activités avec les autorités autochtones de Gunayala (§ 54).", source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.1-MissionPanama_AUV.pdf"}
chronologie:
  - {annee: 1938, evenement: "La loi 2 crée la comarca de San Blas."}
  - {annee: 1953, evenement: "La loi 16 organise la comarca de San Blas et reconnaît le Congrès général guna."}
  - {annee: 1957, evenement: "La loi 20 déclare la comarca de San Blas réserve autochtone : terres possédées en commun, inaliénables et non adjudicables."}
  - {annee: 1998, evenement: "La loi 99 renomme la comarca Kuna Yala."}
  - {annee: 2014, evenement: "Rapport du Rapporteur spécial de l'ONU James Anaya sur sa mission au Panama."}
  - {annee: 2016, evenement: "La loi 37 rend obligatoire la consultation préalable des comarcas."}
  - {annee: 2024, evenement: "Environ 300 familles de l'île Gardi Sugdub (Carti Sugtupu) sont relogées sur la terre ferme, à Nuevo Cartí, dans des logements construits par le ministère du Logement."}
  - {annee: 2025, evenement: "Consultation à Agguadub (Narganá) au titre de la loi 37 de 2016, puis adoption par l'Assemblée nationale, le 30 avril, du nom « Gunayala » ; l'exécutif formule une objection reçue le 25 juin, et le nom légal reste Kuna Yala à la date de cette objection (juillet 2025)."}
