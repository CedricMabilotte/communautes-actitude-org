resume: >-
  Les Guna vivent sur la côte caraïbe du Panama et dans l'archipel voisin. La comarca (division territoriale autochtone à statut spécial) de San Blas est créée en 1938 et organisée par la loi 16 de 1953, qui reconnaît le Congrès général guna. La loi 99 de 1998 la renomme Kuna Yala. Le recensement de 2023 compte 112 319 personnes du peuple guna dans l'ensemble du pays, sans chiffre propre à la comarca dans les sources consultées.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Panama vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Visite du Rapporteur spécial James Anaya ; il présente les comarcas comme une protection des droits de propriété et d'autogouvernement, sur une base « fragile et précaire ».", annee: 2013, source: "https://www.ohchr.org/es/press-releases/2013/07/experto-de-la-onu-urge-panama-no-dar-marcha-atras-en-los-derechos-de-los"}
base_nationale:
  - {instrument: "Constitution politique du Panama (1972, révisée en 2004), art. 88, 90, 108, 127 et 147", nature: "constitution", annee: 1972, source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  - {instrument: "Loi 16 du 19 février 1953 qui organise la comarca de San Blas", nature: "loi", annee: 1953, source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  - {instrument: "Loi 99 du 23 décembre 1998 qui dénomme la comarca Kuna Yala", nature: "loi", annee: 1998, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
  - {instrument: "Loi 88 du 22 novembre 2010 sur les langues et alphabets des peuples indigènes et l'éducation interculturelle bilingue", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  - {instrument: "Loi 37 de 2016 sur la consultation et le consentement préalable, libre et éclairé", nature: "loi", annee: 2016, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 16 de 1953 (art. 12 et 13) reconnaît le Congrès général guna et les congrès de village, qui fonctionnent selon leur charte traditionnelle.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 16 de 1953 (art. 13) renvoie à la charte organique propre de la communauté pour les fonctions des congrès ; la portée de ces normes face au droit national n'est pas précisée.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi 16 de 1953 (art. 12) reconnaît la juridiction du Congrès général guna sur les infractions, sauf en matière pénale.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  terres: {valeur: "reconnu", note: "La Constitution (art. 127) garantit la propriété collective des terres indigènes ; la loi 16 de 1953 (art. 21) interdit d'attribuer des terres de la réserve à une personne extérieure à la communauté sans double accord du Congrès guna.", source: "https://faolex.fao.org/docs/pdf/pan205628.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La loi 37 de 2016 (art. 1 à 3) rend obligatoire la consultation préalable, libre et éclairée des comarcas, par leurs institutions propres, avant toute mesure législative ou administrative qui les touche.", source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
  langue: {valeur: "partiel", note: "La loi 88 de 2010 (art. 1) reconnaît la langue kuna et son alphabet, sans statut de langue officielle ; la Constitution (art. 88) prévoit l'étude et la diffusion des langues indigènes.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 88 de 2010 (art. 7) organise l'éducation interculturelle bilingue dans les comarcas, sous la direction du ministère de l'Éducation.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La Constitution (art. 147) garantit à chaque comarca le nombre de députés dont elle disposait à l'entrée en vigueur de la règle ; ces sièges sont territoriaux et non réservés aux Guna.", source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2013, le Rapporteur spécial de l'ONU relève la présence de tiers (exploitants forestiers, mineurs, entreprises agricoles) sur les territoires indigènes et un manque de déférence de l'État envers les autorités indigènes.", source: "https://www.ohchr.org/es/press-releases/2013/07/experto-de-la-onu-urge-panama-no-dar-marcha-atras-en-los-derechos-de-los"}
chronologie:
  - {annee: 1938, evenement: "La loi 2 crée les comarcas de San Blas et de Barú."}
  - {annee: 1953, evenement: "La loi 16 organise la comarca de San Blas et reconnaît le Congrès général guna."}
  - {annee: 1957, evenement: "La loi 20 déclare la comarca de San Blas réserve indigène."}
  - {annee: 1998, evenement: "La loi 99 renomme la comarca Kuna Yala."}
  - {annee: 2025, evenement: "L'Assemblée nationale adopte le nom « Gunayala » ; le président oppose son veto en juillet, le nom légal reste Kuna Yala."}
fiabilite:
  verifie: ["Texte de la loi 16 de 1953 (art. 12, 13, 21, 23).", "Articles 88, 127 et 147 de la Constitution.", "Articles 1 et 7 de la loi 88 de 2010.", "Veto présidentiel de 2025 sur le changement de nom."]
