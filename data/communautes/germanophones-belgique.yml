droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement de la Communauté germanophone et gouvernement propre, Constitution, art. 115 et 121 ; le parlement compte 25 membres élus au suffrage universel direct.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le parlement règle par décret les matières culturelles, les matières personnalisables, l'enseignement et l'emploi des langues dans l'enseignement, Constitution, art. 130 § 1 ; il peut exercer des compétences de la Région wallonne par accord, art. 139.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les limites des régions linguistiques, dont la région de langue allemande, ne peuvent être modifiées que par une loi adoptée à la majorité dans chaque groupe linguistique des chambres, Constitution, art. 4 ; la Communauté germanophone n'a pas de groupe linguistique propre au Parlement fédéral.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  langue: {valeur: "reconnu", note: "La région de langue allemande est une des quatre régions linguistiques, Constitution, art. 4 ; le parlement de la Communauté règle l'emploi des langues dans l'enseignement, art. 130 § 1, 5°.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  education: {valeur: "reconnu", note: "L'enseignement relève du parlement de la Communauté, dans les limites de l'article 127 (âge de l'obligation scolaire, diplômes, pensions des enseignants restent fédéraux), Constitution, art. 130 § 1, 3°.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Le parlement de la Communauté germanophone désigne un sénateur parmi ses membres, Constitution, art. 67.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Conseil de l'Europe décrit une communauté de près de 77 000 habitants dotée d'un parlement et d'un gouvernement, compétente pour la culture, l'enseignement, la formation et l'emploi, la famille, les affaires sociales et la tutelle des pouvoirs locaux.", source: "https://www.coe.int/fr/web/portal/belgianchairmanship-germanspeakingcommunity"}
chronologie:
  - {annee: 1919, evenement: "Les cantons d'Eupen et de Malmedy sont rattachés à la Belgique par le traité de Versailles."}
