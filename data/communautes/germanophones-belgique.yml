base_nationale:
  - {instrument: "Constitution de la Belgique (1994), art. 2, 4, 67, 115, 121, 130, 139, 170 et 176, texte révisé jusqu'en 2014", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Belgium_2014"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement et gouvernement de la Communauté germanophone, Constitution, art. 115 et 121 ; le parlement compte 25 membres élus au suffrage direct à la proportionnelle, dernières élections le 9 juin 2024.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le parlement règle par décret (loi fédérée) les matières culturelles, les matières personnalisables (santé, aide aux personnes, famille), l'enseignement et l'emploi des langues dans l'enseignement, Constitution, art. 130 ; il exerce par décrets concordants avec la Région wallonne des compétences de celle-ci, art. 139.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "La région de langue allemande est une des quatre régions linguistiques, Constitution, art. 4 ; le parlement de la Communauté règle l'emploi des langues dans l'enseignement, art. 130 § 1, 5°.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  education: {valeur: "reconnu", note: "L'enseignement relève du parlement de la Communauté, dans les limites de l'article 127 (âge de l'obligation scolaire, diplômes, pensions des enseignants restent fédéraux), Constitution, art. 130 § 1, 3°.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  fiscalite: {valeur: "partiel", note: "Un impôt au profit d'une communauté ne peut être établi que par décret, sous réserve des exceptions fixées par la loi, Constitution, art. 170 § 2 ; le système de financement de la Communauté germanophone est fixé par une loi fédérale et son parlement décide de l'affectation de ses recettes, art. 176.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  representation: {valeur: "reconnu", note: "Le parlement de la Communauté germanophone désigne un sénateur parmi ses membres, Constitution, art. 67.", source: "https://www.constituteproject.org/constitution/Belgium_2014"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'Université Laval décrit un Conseil créé en 1984, devenu Parlement en 2004, et l'usage exclusif de l'allemand par les services locaux de la région de langue allemande dans leurs rapports avec les particuliers, avec des facilités en français dans les neuf communes (page mise à jour le 1er juin 2024).", source: "https://www.axl.cefan.ulaval.ca/europe/belgiqueger.htm"}
chronologie:
  - {annee: 1919, evenement: "Les cantons d'Eupen et de Malmedy sont attribués à la Belgique par le traité de Versailles."}
  - {annee: 1970, evenement: "Révision constitutionnelle : création des communautés culturelles."}
  - {annee: 1984, evenement: "Création du Conseil de la Communauté germanophone."}
  - {annee: 1994, evenement: "Constitution coordonnée ; premier transfert de compétences wallonnes (monuments et sites)."}
  - {annee: 2004, evenement: "Le Conseil prend le nom de Parlement de la Communauté germanophone."}
  - {annee: 2019, evenement: "Transfert par la Région wallonne de l'aménagement du territoire, du logement et d'une partie de la politique de l'énergie."}
  - {annee: 2024, evenement: "Élection du Parlement de la Communauté germanophone le 9 juin (25 sièges)."}
fiabilite:
  verifie: ["Constitution belge, art. 2, 4, 67, 115, 121, 130, 139, 170 et 176 (Constitute Project, texte révisé en 2014).", "Population au 1er janvier 2021, neuf communes (Amel, Büllingen, Burg-Reuland, Bütgenbach, St. Vith, Eupen, Kelmis, Lontzen, Raeren) et 853,64 km² (Ostbelgien Statistik, mise à jour du 2 juillet 2021).", "25 sièges, élection à la proportionnelle avec seuil de 5 %, élections du 9 juin 2024 (Parlement de la Communauté germanophone).", "Compétences reprises de la Région wallonne et années de transfert (Parlement de la Communauté germanophone).", "Création du Conseil en 1984 et nom de Parlement depuis 2004 (Université Laval)."]
  non_confirme: ["Nombre de villages : non trouvé.", "Population après le 1er janvier 2021 : non trouvée sur une page ouverte.", "Consultation ou consentement : aucun texte trouvé qui oblige à consulter la Communauté ; les limites des régions linguistiques (art. 4) se modifient à la majorité des groupes linguistiques néerlandais et français des chambres fédérales, sans groupe germanophone.", "Montant et structure du financement fédéral (loi prévue à l'art. 176) : texte non consulté.", "Date de 1970 : la source ouverte mentionne la révision constitutionnelle de 1970 sans détailler la création de la communauté culturelle allemande.", "Composition du gouvernement issu des élections de 2024 : non vérifiée."]
