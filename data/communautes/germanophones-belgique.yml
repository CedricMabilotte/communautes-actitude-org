resume: >-
  La Constitution belge compte trois communautés, dont la Communauté germanophone (art. 2), et quatre régions linguistiques, dont la région de langue allemande (art. 4). La Communauté a un parlement et un gouvernement propres. Son parlement adopte des décrets (lois fédérées) en matière culturelle, d'enseignement, de matières personnalisables (santé, aide sociale, famille) et d'emploi des langues dans l'enseignement (art. 130). Elle exerce aussi, par accord avec la Région wallonne (art. 139), des compétences régionales : monuments et sites (1994), emploi (1999), tutelle et financement des communes (2004), tourisme (2014), aménagement du territoire, logement et une partie de la politique de l'énergie (2019). Les communautés flamande et française ont leur propre fiche (« Flamands », « Francophones de Belgique »).
