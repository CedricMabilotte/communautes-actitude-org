resume: >-
  La Constitution belge compte trois communautés, dont la Communauté germanophone (art. 2), et quatre régions linguistiques, dont la région de langue allemande (art. 4). La Communauté a un parlement et un gouvernement propres. Son parlement adopte des décrets (lois fédérées) en matière culturelle, d'enseignement, de matières personnalisables (santé, aide sociale, famille) et d'emploi des langues dans l'enseignement (art. 130). Elle exerce aussi des compétences transférées par la Région wallonne (art. 139). Les communautés flamande et française ont leur propre fiche (« Flamands », « Francophones de Belgique »).
