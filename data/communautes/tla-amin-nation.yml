resume: >-
  Les terres de la Nation Tla'amin (anciennement bande indienne des Sliammon) se trouvent autour de Powell River, au nord du détroit de Georgia. L'Accord définitif concernant les Tla'amins, conclu avec le Canada et la Colombie-Britannique, est en vigueur depuis le 5 avril 2016. La loi fédérale de 2014 le reconnaît comme un traité au sens de l'article 35 de la Loi constitutionnelle de 1982. Il institue un gouvernement tla'amin doté d'un pouvoir législatif, attribue à la Nation la propriété de ses terres et met fin à l'application de la Loi sur les Indiens.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La loi fédérale de 2021 (L.C. 2021, ch. 14) confirme que la Déclaration, adoptée par l'Assemblée générale le 13 septembre 2007 (résolution 61/295), est une source d'interprétation du droit canadien et qu'elle doit être mise en œuvre au Canada ; la loi fédérale de 2014 (L.C. 2014, ch. 11, préambule) énonce que la Nation des Tlaamins est un peuple autochtone du Canada.", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/page-1.html"}
base_nationale:
  - {instrument: "Accord définitif concernant les Tla'amins (Tla'amin Final Agreement)", nature: "traite", annee: 2016, source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  - {instrument: "Loi sur l'accord définitif concernant les Tlaamins (L.C. 2014, ch. 11)", nature: "loi", annee: 2014, source: "https://laws-lois.justice.gc.ca/fra/lois/T-11.2/page-1.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Nation des Tla'amins a droit à l'autonomie gouvernementale ; le gouvernement tla'amin, prévu par la constitution tla'amine, est son gouvernement, Accord définitif, chapitre 15, art. 1 et 2 ; la constitution prévoit des élections au moins tous les cinq ans et une majorité de membres élus, art. 9 et 11.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Nation des Tla'amins a le pouvoir de faire des lois, chapitre 15, art. 1 ; ses lois sur le gouvernement tla'amin, ses institutions et ses élections l'emportent en cas de conflit avec une loi fédérale ou provinciale, art. 47 et 52 ; les lois tla'amines sont admises d'office (reconnues par les tribunaux sans qu'il faille en prouver l'existence), loi fédérale, art. 17.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  justice_propre: {valeur: "partiel", note: "Le pouvoir législatif tla'amin ne comprend pas la création d'un tribunal, chapitre 15, art. 170 ; la Cour provinciale juge les infractions aux lois tla'amines, art. 161 ; la Nation conduit les poursuites, art. 168, et peut proposer des candidats aux postes de juge de paix judiciaire, art. 162 ; elle établit des procédures d'appel des décisions administratives de ses institutions, art. 14.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  terres: {valeur: "reconnu", note: "La Nation des Tla'amins est propriétaire en fief simple (pleine propriété) des terres tla'amines, sans les conditions prévues par la Land Act, Accord définitif, chapitre 3, art. 3 et 4 ; loi fédérale, art. 7.", source: "https://laws-lois.justice.gc.ca/fra/lois/T-11.2/page-1.html"}
  ressources: {valeur: "reconnu", note: "La Nation possède les ressources tréfoncières (sous-sol) des terres tla'amines, chapitre 3, art. 67, et leurs ressources forestières, chapitre 8, art. 1 ; elle détient un droit inaliénable de pêche et de récolte de la faune à des fins domestiques, limité par les mesures de conservation, de santé et de sécurité publiques, chapitre 9, art. 1 à 3, chapitre 10, art. 1, 2 et 4 ; le ministre fédéral reste responsable de la gestion du poisson, chapitre 9, art. 5.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  consentement: {valeur: "partiel", note: "L'Accord définit la consultation, chapitre 1, et énumère des cas où le Canada ou la Colombie-Britannique consultent la Nation, par exemple la création d'une zone de protection marine en territoire tla'amin, chapitre 9, art. 133, ou la modification des limites de Powell River, chapitre 16, art. 4 ; il ne prévoit pas de droit de refus.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  langue: {valeur: "partiel", note: "La Nation a le droit d'employer la langue tla'amine, chapitre 14, art. 1, et peut faire des lois sur sa préservation et sa promotion sur les terres tla'amines, art. 4 ; le registre des lois est tenu en anglais et, au choix de la Nation, en langue tla'amine, chapitre 15, art. 19 ; ce n'est pas une langue officielle.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  education: {valeur: "partiel", note: "La Nation peut faire des lois sur l'enseignement de la langue et de la culture tla'amines, qui l'emportent en cas de conflit, chapitre 15, art. 101 et 102, et sur l'éducation de la maternelle à la 12e année pour ses citoyens sur les terres tla'amines, art. 103 ; ces lois fixent des normes qui permettent le passage au système provincial, art. 104.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  fiscalite: {valeur: "partiel", note: "La Nation peut faire des lois sur les impôts directs à l'égard des citoyens tla'amins sur les terres tla'amines, chapitre 21, art. 1 ; ce pouvoir ne limite pas celui du Canada et de la province, art. 2 ; un accord sur le traitement fiscal distinct a force de loi, loi fédérale, art. 8.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  representation: {valeur: "non_etabli", note: "Aucun siège réservé au niveau de l'État ; les terres tla'amines ne font partie d'aucune municipalité ni d'aucun district régional, sauf adhésion de la Nation, qui nomme alors un administrateur au conseil du district, Accord définitif, chapitre 16, art. 1, 9 et 10.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  statut_personnel: {valeur: "partiel", note: "La Nation peut faire des lois en matière de citoyenneté tla'amine, qui l'emportent en cas de conflit, chapitre 15, art. 53 et 55 ; cette citoyenneté ne confère ni la citoyenneté canadienne ni le statut d'Indien, art. 54.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1397152724601/1542999321074"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le rapport annuel 2025 de la Commission des traités de la Colombie-Britannique relève la neuvième année de mise en œuvre du traité, l'ouverture d'un centre culturel tla'amin en juin 2025, un projet de logement sur le site de tiskʷat et un protocole d'entente conclu avec la province en octobre 2023 ; il compte environ 1 220 citoyens tla'amins.", source: "https://bctreaty.ca/wp-content/uploads/2025/10/BCTC-Annual-Report-2025-1.pdf"}
chronologie:
  - {annee: 1994, evenement: "Déclaration d'intention de négocier déposée auprès de la Commission des traités de la Colombie-Britannique (20 mai)."}
  - {annee: 1996, evenement: "Signature de l'accord-cadre de négociation (27 mai)."}
  - {annee: 2003, evenement: "Signature de l'accord de principe de Sliammon (6 décembre)."}
  - {annee: 2011, evenement: "Paraphe de l'Accord définitif (21 octobre)."}
  - {annee: 2014, evenement: "Signature de l'Accord par la Nation et la province (15 mars) puis par le Canada (11 avril) ; loi fédérale sanctionnée le 19 juin."}
  - {annee: 2016, evenement: "Entrée en vigueur de l'Accord (5 avril) ; la Loi sur les Indiens cesse de s'appliquer à la Nation, sauf pour établir le statut d'Indien."}
fiabilite:
  verifie: ["Loi fédérale L.C. 2014, ch. 11, sanctionnée le 19 juin 2014, en vigueur le 5 avril 2016 (TR/2016-4) : préambule, art. 3 (traité au sens des art. 25 et 35 de la Loi constitutionnelle de 1982), art. 7 (fief simple), art. 8 (accord sur le traitement fiscal), art. 10 (Loi sur les Indiens), art. 17 (lois tla'amines).", "Accord définitif, version française (RCAANC) : chapitre 3 art. 1, 3, 4 et 67 ; chapitre 8 art. 1 ; chapitre 9 art. 1 à 3 et 133 ; chapitre 10 art. 1 et 2 ; chapitre 14 art. 1 et 4 ; chapitre 15 art. 1, 2, 9, 11, 14, 19, 47, 52 à 55, 101 à 104, 161, 162, 168 et 170 ; chapitre 16 art. 1, 4, 9 et 10 ; chapitre 21 art. 1 et 2.", "Étapes de négociation et date d'entrée en vigueur : Commission des traités de la Colombie-Britannique.", "Population inscrite rattachée à la Nation (bande n° 554) : 1 283 personnes en septembre 2026, dont 617 dans leur propre réserve (Profils des Premières Nations, RCAANC).", "Recensement 2021, subdivision « Sliammon 1 (Tla'amin Lands) » : 797 habitants, 8,14 km² de superficie des terres."]
  non_confirme: ["Superficie : l'Accord donne des superficies approximatives totalisant environ 8 323 ha ; la subdivision de recensement 2021 ne couvre que 8,14 km² ; l'écart n'est pas expliqué.", "Nombre de citoyens : environ 1 200 selon la Commission des traités, 1 220 selon son rapport 2025 ; aucun registre de citoyenneté tla'amine consulté.", "Endonyme et nom de la langue dans sa graphie propre : aucune source primaire consultée.", "Loi provinciale d'approbation (Tla'amin Final Agreement Act) et constitution tla'amine : non consultées directement ; le site de la Nation n'était pas accessible."]
