reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'appuie depuis ; la loi fédérale de 2021 (L.C. 2021, ch. 14, art. 4 a)) confirme qu'elle trouve application en droit canadien. Le communiqué du 13 juillet 2022 publié par la province (texte du First Nations Education Steering Committee) rattache les quatre premiers accords au droit des peuples autochtones d'établir et de contrôler leurs systèmes et établissements scolaires, affirmé par la Déclaration (art. 14).", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Loi sur la compétence des premières nations en matière d'éducation en Colombie-Britannique (L.C. 2006, ch. 10), en vigueur le 22 novembre 2007 (TR/2007-91)", nature: "loi", annee: 2006, source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.75/TexteComplet.html"}
  - {instrument: "First Nations Education Act (Colombie-Britannique, SBC 2007, ch. 40)", nature: "loi", annee: 2007, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07040_01"}
  - {instrument: "Décret mettant en vigueur des accords spécifiques conclus avec des premières nations (DORS/2022-158) : accords Canada-First Nation Education Jurisdiction Agreement avec ʔaq'am, Cowichan, Lil'wat et Seabird Island, en vigueur le 1er juillet 2022", nature: "accord_revendication", annee: 2022, source: "https://laws-lois.justice.gc.ca/fra/reglements/DORS-2022-158/TexteComplet.html"}
  - {instrument: "Décret mettant en vigueur des accords spécifiques conclus avec des premières nations (DORS/2023-128) : accords avec Canim Lake, Ditidaht et Squamish, en vigueur le 1er juillet 2023", nature: "accord_revendication", annee: 2023, source: "https://laws-lois.justice.gc.ca/fra/reglements/DORS-2023-128/TexteComplet.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "La compétence est exercée par le conseil de bande au sens de la Loi sur les Indiens, loi fédérale de 2006, art. 2(1) ; chaque Première Nation participante nomme deux administrateurs de l'Autorité scolaire des premières nations, art. 11 et 13, et peut constituer seule ou avec d'autres une administration scolaire communautaire, art. 22. La reconnaissance se limite à l'éducation.", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.75/TexteComplet.html"}
  pouvoir_normatif: {valeur: "partiel", note: "La Première Nation participante peut, conformément à son accord spécifique, établir des lois en matière d'éducation sur ses terres et déléguer ce pouvoir à l'Autorité scolaire, loi fédérale de 2006, art. 9(1) ; l'accord a force de loi et l'emporte sur toute loi fédérale, art. 3(1) et 5(2) ; la loi provinciale de 2007 reconnaît ce pouvoir, art. 2, et l'emporte sur toute autre loi provinciale, art. 4.", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.75/TexteComplet.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi s'applique aux réserves mises de côté pour la Première Nation et aux terres régies par la Loi sur l'Accord-cadre relatif à la gestion des terres de premières nations, loi de 2006, art. 2(1) ; les réserves sont détenues par la Couronne à l'usage et au profit des bandes, Loi sur les Indiens, art. 18(1), régime commun non modifié par la loi sur l'éducation.", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/page-3.html"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La province consulte l'Autorité scolaire des premières nations lors de toute consultation générale sur un projet de changement de politique, de loi ou de normes scolaires pouvant toucher de façon substantielle un programme d'une Première Nation participante, l'évaluation, la certification des enseignants, les exigences du diplôme ou les programmes d'études, First Nations Education Act, 2007, art. 3. L'obligation se limite à l'éducation et ne prévoit pas de consentement.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07040_01"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "Les Premières Nations participantes légifèrent sur l'éducation de la maternelle à la 12e année dans leurs réserves, loi fédérale de 2006, art. 2(1) et 9(1) ; l'Autorité scolaire fixe, par accord de cogestion, les normes de programmes et d'examens, la certification des enseignants et l'agrément des écoles, art. 19(2) ; les articles 114 à 122 de la Loi sur les Indiens (écoles) cessent de s'appliquer à l'entrée en vigueur d'une loi de la Première Nation, art. 23.", source: "https://laws-lois.justice.gc.ca/fra/lois/F-11.75/TexteComplet.html"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Les sept accords sont en vigueur (DORS/2022-158, DORS/2023-128). L'Autorité scolaire des premières nations est opérationnelle depuis le 1er juillet 2022 ; selon son site, elle a adopté ses règles sur la certification des écoles et les certificats de fin d'études le 12 décembre 2022, sur la certification des enseignants le 19 avril 2023 et sur l'approbation des cours requis pour le diplôme le 14 juillet 2025. Windspeaker annonçait en juillet 2022 que les quatre premières Premières Nations exploiteraient leurs écoles sous ce régime à partir de septembre 2022. Aucune évaluation indépendante des résultats n'a été trouvée.", source: "https://windspeaker.com/news/windspeaker-news/four-bc-first-nations-reach-end-long-journey-educate-their-children"}
chronologie:
  - {annee: 2003, evenement: "Protocole d'entente qui ouvre les négociations sur la compétence en éducation entre le Canada, la province et le First Nations Education Steering Committee (FNESC)."}
  - {annee: 2006, evenement: "Accord-cadre sur la compétence en éducation (Education Jurisdiction Framework Agreement) signé le 5 juillet par le Canada, la province et le FNESC ; loi fédérale sanctionnée le 12 décembre."}
  - {annee: 2007, evenement: "First Nations Education Act provinciale sanctionnée le 29 novembre ; loi fédérale en vigueur le 22 novembre."}
  - {annee: 2018, evenement: "Entente tripartite sur l'éducation (BC Tripartite Education Agreement) entre le Canada, la province et le FNESC, datée et en vigueur le 1er juillet ; elle porte sur le financement et les services scolaires des Premières Nations."}
  - {annee: 2022, evenement: "Accords spécifiques signés les 25 et 26 mai avec ʔaq'am, Cowichan, Lil'wat et Seabird Island, en vigueur le 1er juillet (DORS/2022-158) ; l'Autorité scolaire des premières nations devient opérationnelle le même jour."}
  - {annee: 2023, evenement: "Accords spécifiques signés en mars avec Canim Lake, Ditidaht et Squamish, en vigueur le 1er juillet (DORS/2023-128) ; l'accord-cadre de 2006 est remplacé par un nouvel accord-cadre auquel l'Autorité scolaire est partie."}
