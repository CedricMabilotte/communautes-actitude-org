resume: >-
  La Loi sur la compétence des premières nations en matière d'éducation en Colombie-Britannique (L.C. 2006, ch. 10), en vigueur depuis le 22 novembre 2007, permet à une Première Nation qui conclut un accord spécifique avec le Canada de légiférer sur l'éducation de la maternelle à la 12e année dans ses réserves. La province reconnaît ce pouvoir par sa First Nations Education Act (loi provinciale sur l'éducation des Premières Nations, 2007, ch. 40). Aucun accord n'a pris effet avant 2022. Sept Premières Nations figurent à l'annexe de la loi : ʔaq'am, Cowichan, Lil'wat et Seabird Island depuis le 1er juillet 2022 ; Tsq'escen' (Canim Lake), Ditidaht et Sḵwx̱wú7mesh Úxwumixw (Squamish) depuis le 1er juillet 2023. Elles exercent en commun, par l'Autorité scolaire des premières nations (First Nations Education Authority), la certification des enseignants et des écoles, les exigences d'obtention du diplôme et l'approbation des cours. Un régime voisin fait l'objet de la fiche « Mi'kmaq de Nouvelle-Écosse (compétence en éducation) ».
