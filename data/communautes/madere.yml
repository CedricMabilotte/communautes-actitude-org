resume: >-
  L'archipel de Madère, dans l'Atlantique au large du Maroc, forme une Région autonome de la République portugaise, personne morale territoriale de droit public, en vertu des articles 6 et 225 à 234 de la Constitution de 1976. Le Statut politico-administratif (loi 13/91, révisée par les lois 130/99 et 12/2000) institue une Assemblée législative élue, qui légifère pour la Région, et un Gouvernement régional. Le Statut fonde ce régime sur les « historiques aspirations autonomistes de son peuple » et précise qu'il n'affecte pas l'intégrité de la souveraineté de l'État. L'Union européenne reconnaît Madère comme région ultrapériphérique (région de l'Union où les traités s'appliquent avec des adaptations).
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "L'article 349 du Traité sur le fonctionnement de l'Union européenne nomme Madère parmi les régions ultrapériphériques et permet au Conseil d'arrêter des mesures spécifiques fixant les conditions d'application des traités à ces régions.", annee: 2009, source: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:12016E349"}
reconnaissance_onu: []
base_nationale:
  - {instrument: "Constitution de la République portugaise, art. 6, 142, 214, 225 à 234 et 288", nature: "constitution", annee: 1976, source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
  - {instrument: "Statut politico-administratif de la Région autonome de Madère (loi 13/91 du 5 juin, modifiée par les lois 130/99 du 21 août et 12/2000 du 21 juin)", nature: "statut_autonomie", annee: 2000, source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'Assemblée législative et le Gouvernement régional sont les organes de gouvernement propre de la Région, Constitution, art. 231, et Statut, art. 6 ; l'Assemblée est élue au suffrage universel direct à la représentation proportionnelle, Statut, art. 13 et 14 ; le Gouvernement régional est responsable devant elle, Constitution, art. 231.3.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée législative adopte des décrets législatifs régionaux (lois régionales) dans les matières énumérées par le Statut et non réservées aux organes de souveraineté, Constitution, art. 227.1 a et 228 ; le Statut dresse la liste de ces « matières d'intérêt spécifique », art. 37 et 40 ; le Représentant de la République (délégué de l'État dans la Région) les signe ou y oppose son veto, Constitution, art. 233.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  justice_propre: {valeur: "non_etabli", note: "La Région n'a pas de juridiction propre : l'organisation judiciaire nationale tient compte des besoins de la Région, Statut, art. 149, et la section régionale de la Cour des comptes est une formation de cette juridiction de l'État, Constitution, art. 214.4.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  terres: {valeur: "partiel", note: "Les biens du domaine public et privé de l'État situés dans l'archipel, hors défense nationale et services non régionalisés, appartiennent au domaine de la Région, Statut, art. 143 à 145 ; le régime juridique et l'exploitation de la terre, la politique des sols et l'aménagement du territoire sont des matières d'intérêt spécifique, art. 40 h et i.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  ressources: {valeur: "partiel", note: "La pêche, l'aquaculture, les forêts, les ressources hydriques, minérales et thermales et l'énergie produite localement sont des matières d'intérêt spécifique relevant de la compétence législative régionale, Statut, art. 40 f, g, j, l et jj ; la Région s'étend à la mer environnante, aux eaux territoriales et à la zone économique exclusive « dans les termes de la loi » de l'État, art. 3.2.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  consentement: {valeur: "partiel", note: "L'Assemblée et le Gouvernement de la République entendent les organes régionaux chaque fois qu'ils exercent un pouvoir législatif ou réglementaire, dans leurs domaines de compétence, sur une matière qui concerne la Région, Statut, art. 89, et Constitution, art. 229.2 ; l'absence d'audition entraîne l'inconstitutionnalité ou l'illégalité de l'acte, Statut, art. 92 ; le projet de statut et ses modifications sont élaborés par l'Assemblée régionale, Constitution, art. 226, et Statut, art. 148 ; il s'agit d'une audition obligatoire, sans accord requis de la Région pour modifier son statut.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "L'éducation préscolaire, l'enseignement de base, secondaire, supérieur et spécialisé sont des matières d'intérêt spécifique relevant de la compétence législative régionale, Statut, art. 40 o ; l'État garantit un quota d'accès à l'enseignement supérieur, art. 150.", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  fiscalite: {valeur: "reconnu", note: "Les impôts perçus ou générés sur son territoire constituent des recettes régionales, Statut, art. 108 ; la Région exerce un pouvoir fiscal propre et peut adapter le système fiscal national à ses spécificités dans les termes de la loi, Statut, art. 107, et Constitution, art. 227.1 i ; le statut lui attribuant la totalité des impôts perçus sur son territoire, la valeur est « reconnu ».", source: "https://www.cne.pt/sites/default/files/dl/legis_eparam_2012.pdf"}
  representation: {valeur: "partiel", note: "Le président du Gouvernement régional siège au Conseil d'État, organe consultatif du président de la République, Constitution, art. 142 e ; des représentants de l'Assemblée régionale peuvent participer aux commissions de l'Assemblée de la République qui examinent ses propositions, Statut, art. 88.", source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Gouvernement régional, renversé par une motion de censure de l'Assemblée législative en décembre 2024, a été remplacé après l'élection anticipée du 23 mars 2025 : le Représentant de la République a désigné le chef du parti arrivé en tête, qui gouverne avec un accord de majorité (RTP, 28 mars 2025). Les 47 sièges ont été attribués avec une participation de 55,98 % (Commission nationale des élections, Mapa oficial n.º 2/2025).", source: "https://www.rtp.pt/noticias/politica/madeira-miguel-albuquerque-indigitado-presidente-do-governo-regional_n1644205"}
chronologie:
  - {annee: 1976, evenement: "La Constitution fait des archipels des Açores et de Madère des régions autonomes dotées de statuts politico-administratifs et d'organes de gouvernement propre (art. 6)."}
  - {annee: 1991, evenement: "Loi 13/91 du 5 juin portant Statut politico-administratif de la Région autonome de Madère."}
  - {annee: 1999, evenement: "Loi 130/99 du 21 août modifiant le Statut."}
  - {annee: 2000, evenement: "Loi 12/2000 du 21 juin modifiant le Statut."}
  - {annee: 2009, evenement: "Entrée en vigueur de l'article 349 du TFUE, qui nomme Madère parmi les régions ultrapériphériques."}
  - {annee: 2024, evenement: "L'Assemblée législative adopte en décembre une motion de censure qui renverse le Gouvernement régional."}
  - {annee: 2025, evenement: "Élection anticipée de l'Assemblée législative régionale le 23 mars ; nouveau Gouvernement régional."}
fiabilite:
  verifie: ["Statut, art. 1 à 9, 13 à 15, 37, 40, 88, 89, 92, 104, 107, 108, 143 à 145, 148 à 150 (texte consolidé publié par la Commission nationale des élections).", "Constitution, art. 6, 142, 214, 225, 226, 231 et 288 o, qui range l'autonomie politico-administrative des archipels parmi les limites matérielles de la révision constitutionnelle (Assemblée de la République).", "Constitution, art. 227, 228, 229, 233 et 234 (pouvoirs de la Région, audition, veto du Représentant de la République, dissolution).", "Article 349 du TFUE (EUR-Lex).", "Élection du 23 mars 2025 : 47 sièges, 55,98 % de votants (Mapa oficial n.º 2/2025 de la Commission nationale des élections).", "Population résidente estimée au 31 décembre 2025 : 266 130 ; 801,1 km², 11 municipalités, 54 freguesias (paroisses civiles) en 2024 et 639 lugares en 2021 (Direction régionale de statistique de Madère, DREM)."]
  non_confirme: ["Aucun document onusien nommant le régime madérien n'a été trouvé.", "Le texte consolidé du Statut consulté (publié en 2012) intègre les modifications de 1999 et 2000 et emploie encore le terme « Ministre de la République », remplacé par « Représentant de la République » lors de la révision constitutionnelle de 2004 ; aucune révision postérieure du Statut n'a été trouvée, sans vérification au Journal officiel (Diário da República).", "L'article 15 du Statut prévoit une circonscription par municipalité ; l'élection est régie par la loi organique 1/2006 (citée par la Commission nationale des élections), dont les règles de circonscription n'ont pas été consultées.", "Effectivité appuyée sur des sources de presse et électorales ; aucun rapport académique sur le fonctionnement de l'autonomie n'a été consulté."]
