resume: >-
  La loi d'organisation et de régime des communes (Registre officiel n° 558, 6 août 1937, codifiée en 2004) permet à tout établissement d'au moins cinquante habitants d'obtenir la personnalité juridique de commune (comuna), administrée par un cabildo (conseil) de cinq membres élu chaque année, et protège ses biens collectifs. La Constitution de 2008 reconnaît « les communes qui ont la propriété collective de la terre, comme une forme ancestrale d'organisation territoriale » (art. 60) et leur garantit les droits collectifs de l'article 57, dont la propriété inaliénable des terres communautaires. La loi organique des terres rurales et territoires ancestraux de 2016 (art. 3, 23 et 77 à 83) organise l'adjudication (attribution du titre) gratuite de ces terres par l'autorité agraire et confie leur administration aux instances de la commune. Le régime concerne des communes autochtones, afroéquatoriennes, montubias et paysannes métisses ; un catastre (registre) publié en 1987 recense 1 426 communes enregistrées depuis les années 1930, dont 166 sans date d'enregistrement.
