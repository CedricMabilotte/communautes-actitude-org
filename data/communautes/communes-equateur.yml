droits:
  autogouvernement: {valeur: "partiel", note: "Chaque commune est représentée par un cabildo (conseil) de cinq membres (président, vice-président, trésorier, syndic, secrétaire) élu en décembre pour un an par l'assemblée des habitants inscrits (loi des communes, art. 8, 11 et 12) ; la commune dépend administrativement du ministère de l'Agriculture, qui approuve le règlement électoral du cabildo, peut désigner un autre cabildo en cas de vacance ou de dissensions et révoquer un de ses membres (art. 4, 12, 13 et 14) ; la loi de 2016 (art. 23) confie aux autorités propres l'administration et le contrôle social du territoire.", source: "https://faolex.fao.org/docs/pdf/ecu67418.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le cabildo édicte des dispositions et peut « réformer librement » les usages et coutumes relatifs à l'administration, à l'usage et à la jouissance des biens communs (loi des communes, art. 7 et 17 a) ; les pratiques de droit propre sur l'accès à la terre constituent des normes d'administration interne (loi de 2016, art. 81 d) ; la portée se limite aux biens communs.", source: "https://faolex.fao.org/docs/pdf/ecu67418.pdf"}
  justice_propre: {valeur: "partiel", note: "Les conflits sur la possession, l'usage et l'usufruit des terres communautaires sont résolus selon les pratiques, coutumes et procédures propres de la commune ; les conflits entre communes sur la légalisation des terres passent par la médiation, puis par le juge (loi de 2016, art. 83).", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  terres: {valeur: "reconnu", note: "Propriété imprescriptible, inaliénable, insaisissable et indivisible des terres communautaires, exemptée de taxes (Constitution, art. 57.4 et 60) ; adjudication gratuite et à perpétuité, titre au nom de l'entité collective de la commune (loi de 2016, art. 3, 23 et 85 f).", source: "https://faolex.fao.org/Docs/Pdf/Ecu166211.Pdf"}
  ressources: {valeur: "partiel", note: "Participation à l'usage, à l'usufruit, à l'administration et à la conservation des ressources naturelles renouvelables des terres (Constitution, art. 57.6 ; loi de 2016, art. 78 d et 81 c) ; les ressources non renouvelables restent à l'État.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  consentement: {valeur: "partiel", note: "Consultation préalable, libre et informée sur la prospection et l'exploitation de ressources non renouvelables situées sur leurs terres (Constitution, art. 57.7) ; sans consentement, il est procédé « conformément à la Constitution et à la loi ».", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le cabildo peut fixer une cotisation obligatoire pour les membres et une contribution pour l'usage des biens collectifs, après approbation du ministre de l'Agriculture (loi des communes, art. 17 h) ; les terres communautaires sont exemptées de taxes et d'impôts (Constitution, art. 57.4).", source: "https://faolex.fao.org/docs/pdf/ecu67418.pdf"}
  representation: {valeur: "partiel", note: "La Constitution (art. 248) reconnaît les communes comme unités de base de participation dans les gouvernements autonomes décentralisés et dans le système national de planification ; aucun siège réservé n'est prévu.", source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de 2021 sur les quinze communes enregistrées du canton de San Lorenzo (Esmeraldas) relève des divisions de territoires communaux malgré l'interdiction légale, la présence d'entreprises de palmier à huile, de mineurs et de colons, et l'absence du registre des habitants exigé par l'article 9 de la loi des communes.", source: "https://www.redalyc.org/journal/280/28069360019/html/"}
chronologie:
  - {annee: 1937, evenement: "Publication de la loi d'organisation et de régime des communes (Registre officiel n° 558, 6 août)."}
  - {annee: 1964, evenement: "Jusqu'à cette date, 931 enregistrements de communes concernent des communautés situées hors des haciendas (grands domaines)."}
  - {annee: 1987, evenement: "Publication d'un catastre des communes légalement constituées : 1 426 communes enregistrées depuis les années 1930, dont 1 116 dans la Sierra, 305 sur la Côte, 5 en Amazonie et 166 sans date."}
  - {annee: 2004, evenement: "Codification de la loi des communes par le Congrès national (loi n° 2004-04, 16 avril)."}
  - {annee: 2008, evenement: "La Constitution reconnaît les communes à propriété collective comme forme ancestrale d'organisation territoriale (art. 60)."}
  - {annee: 2016, evenement: "Loi organique des terres rurales et territoires ancestraux (14 mars) : adjudication gratuite des terres communales."}
  - {annee: 2022, evenement: "Réforme de la loi de 2016 (Registre officiel n° 29, deuxième supplément, 25 mars)."}
