resume: >-
  Fiche agrégée : elle couvre les desa adat de Bali, que le règlement régional (Peraturan Daerah, loi provinciale) n° 4 de 2019 définit comme des « communautés de droit coutumier » (kesatuan masyarakat hukum adat) dotées d'un territoire, de biens propres et du droit de régler leurs propres affaires, liées à des temples de village (kahyangan tiga). Le desa adat est sujet de droit dans le système de gouvernement de la province ; ses membres (krama) sont les Balinais de religion hindoue inscrits à son registre. Chaque desa adat a ses dirigeants (prajuru), dirigés par un bandesa adat choisi par les membres, son assemblée (paruman), ses normes coutumières (awig-awig et pararem), une instance de règlement des litiges coutumiers (Kerta Desa Adat) et un budget alimenté par une dotation provinciale annuelle. L'annexe du règlement en reconnaît 1 493 ; sept autres, fixés par décision du gouverneur, portent le total à environ 1 500 en 2026. Le desa adat coexiste avec le village administratif (desa dinas).
