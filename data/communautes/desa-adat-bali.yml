base_nationale:
  - {instrument: "Peraturan Daerah Provinsi Bali n° 4 de 2019 sur les desa adat à Bali (règlement régional du 28 mai 2019), qui abroge le règlement n° 3 de 2001 sur les desa pakraman ; annexe : liste des 1 493 desa adat reconnus", nature: "loi", annee: 2019, source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  - {instrument: "Peraturan Gubernur Bali n° 34 de 2019 sur la gestion financière des desa adat (arrêté du gouverneur), modifié par les arrêtés n° 55 de 2022 et n° 2 de 2023", nature: "loi", annee: 2019, source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERGUB_NOMOR_34_TAHUN_2019-PENGELOLAAN-KEUANGAN-DESA-ADAT-DI-BALI.pdf"}
  - {instrument: "Peraturan Daerah Provinsi Bali n° 5 de 2025 sur les Bale Kerta Adhyaksa (instances de règlement amiable des affaires de droit commun dans le territoire des desa adat), en vigueur le 18 février 2026", nature: "loi", annee: 2025, source: "https://cloud-ng.baliprov.go.id/dpma/2026/01/PERDA-5-TAHUN-2025-BALE-KERTA-ADHYAKSA.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le desa adat est « sujet de droit dans le système de gouvernement de la province de Bali » (art. 5 du règlement n° 4 de 2019) ; il est gouverné par ses prajuru (dirigeants), dont le bandesa adat choisi par les membres par délibération consensuelle (art. 28 et 29), un conseil consultatif (Sabha Desa Adat, art. 35) et l'assemblée (Paruman Desa Adat), instance de décision la plus haute dont les décisions lient tous les membres (art. 41) ; le gouverneur encadre et contrôle le développement des desa adat (art. 93), le contrôle général revenant à l'inspection provinciale et le contrôle technique aux membres (art. 94).", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque desa adat a des awig-awig (règles coutumières), écrites ou non, de même force juridique (art. 13 du règlement n° 4 de 2019), adoptées en assemblée (art. 16) et applicables aux membres, aux Hindous non inscrits et aux autres résidents (art. 1 (29)), ainsi que des pararem (décisions d'application, règles nouvelles ou décisions sur les litiges, art. 18 et 19) ; leur objet est limité à la vie religieuse, sociale et territoriale du village (parahyangan, pawongan, palemahan, art. 14) et elles sont enregistrées auprès du service provincial (art. 17 et 19 (3)).", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  justice_propre: {valeur: "partiel", note: "La Kerta Desa Adat, présidée par le bandesa adat, reçoit, examine et règle les litiges coutumiers (perkara adat, wicara) selon le droit coutumier, en cherchant d'abord la conciliation (art. 36 et 37 du règlement n° 4 de 2019) ; à défaut, les parties s'adressent aux conseils des desa adat (Majelis Desa Adat, MDA) du sous-district, qui fait de la médiation, puis du district ; la décision du district peut être portée devant le MDA de la province, dont la décision est définitive (art. 37 (4), 76 (2) (e), 77, 78 et 79). Le règlement n° 5 de 2025 ajoute des Bale Kerta Adhyaksa, créées par le gouverneur et le procureur général de Bali, pour régler à l'amiable les infractions légères et litiges civils simples, hors affaires coutumières ; elles ne font pas partie des institutions du desa adat (art. 5, 6 et 12).", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  terres: {valeur: "partiel", note: "Le territoire du desa adat comprend les terres du desa adat et les terres d'usage (tanah guna kaya), communales ou individuelles (art. 10 du règlement n° 4 de 2019) ; les terres du desa adat sont enregistrées à son nom et exonérées d'impôt quand elles n'ont pas d'usage commercial (art. 58) ; tout changement de statut ou toute cession exige l'accord de l'assemblée et s'enregistre selon le droit national (art. 11 et 59 (5)).", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  ressources: {valeur: "partiel", note: "Le desa adat gère, à l'échelle locale, les lieux sacrés, la forêt coutumière (hutan adat), les sources d'eau, la côte et la mer, l'agriculture, la pêche, les marchés et les sites touristiques (art. 25 (1) du règlement n° 4 de 2019), « dans la mesure où cela relève de sa compétence » (art. 25 (2)) ; les ressources naturelles font partie de ses biens (padruwen, art. 55 (3)).", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  consentement: {valeur: "partiel", note: "Le desa adat participe aux décisions sur les projets de développement dans son territoire (art. 24 (j) du règlement n° 4 de 2019) ; son assemblée statue sur les projets d'investissement dans le desa adat (art. 41 (3) (e)) ; les projets d'aménagement rural couvrant plusieurs districts, menés par les collectivités ou des tiers, qui utilisent ses biens ou touchent à l'organisation de son espace doivent l'associer, et l'usage de ses biens pour ces projets s'appuie sur les décisions de l'assemblée (art. 91). Le texte ne prévoit pas de droit de refus.", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Le desa adat peut ouvrir des pasraman (écoles d'enseignement religieux hindou) formels, de la petite enfance au niveau universitaire, ou non formels, selon les usages de Bali et avec le Parisada Hindu Dharma Indonesia (conseil hindou) et les administrations concernées (art. 50 du règlement n° 4 de 2019) ; le financement vient de l'État, de la province, des districts ou d'autres sources.", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  fiscalite: {valeur: "partiel", note: "Le desa adat adopte son budget annuel (art. 24 (c) et 31 (b) du règlement n° 4 de 2019), alimenté par ses revenus propres, ses biens, la province, les districts, l'État et des dons (art. 65) ; la province doit lui allouer un budget (art. 97), versé sous forme de dotation annuelle (arrêté du gouverneur n° 2 de 2023, art. 9 et 20), de 300 millions de roupies par desa adat selon le Bali Post (2026). Ses revenus propres comprennent les cotisations des membres (iuran, paturunan) et les amendes coutumières (pamidanda), ainsi qu'une contribution obligatoire (dudukan) des résidents non membres, dont la collecte est fixée par pararem (arrêté du gouverneur n° 34 de 2019, art. 1 (22), 7 et 13) ; il n'a pas de pouvoir d'imposition au sens du droit fiscal national.", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERGUB_NOMOR_34_TAHUN_2019-PENGELOLAAN-KEUANGAN-DESA-ADAT-DI-BALI.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Les membres du desa adat (krama desa adat) sont les Balinais hindous inscrits à son registre (mipil) ; le règlement distingue les Hindous résidents non inscrits (krama tamiu) et les autres résidents (tamiu), tous soumis aux awig-awig (art. 1 (10) à (13) et (29) du règlement n° 4 de 2019).", source: "https://cloud-ng.baliprov.go.id/dpma/2022/02/PERDA-NOMOR-4-TAHUN-2019-TTG-DESA-ADAT-DI-BALI.pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Une étude de terrain sur le desa adat de Kastala (district de Karangasem) constate que le budget est préparé avec les membres, exécuté par le bandesa adat et ses dirigeants, puis rendu en assemblée (paruman) selon l'arrêté du gouverneur n° 34 de 2019 (Sugita, Vyavahara Duta, 2023). Le service provincial déclare en septembre 2026 que l'inventaire est achevé avec environ 1 500 desa adat, dont sept fixés par décision du gouverneur hors annexe, tous dotés de la subvention provinciale annuelle (Bali Post, 30 septembre 2026). Une analyse juridique juge le règlement n° 4 de 2019 contraire au partage des compétences en matière religieuse et discriminatoire envers les non-hindous (Iswantoro et Tobroni, 2023) ; aucune annulation du texte n'a été trouvée.", source: "https://ojs.uhnsugriwa.ac.id/index.php/vd/article/view/2229"}
chronologie:
  - {annee: 2001, evenement: "Règlement régional n° 3 de 2001 sur les desa pakraman (ancien nom des desa adat), modifié en 2003."}
  - {annee: 2019, evenement: "Règlement régional n° 4 de 2019 (28 mai) : le desa pakraman devient desa adat, sujet de droit ; annexe de 1 493 desa adat."}
  - {annee: 2019, evenement: "Arrêté du gouverneur n° 34 de 2019 sur la gestion financière des desa adat."}
  - {annee: 2023, evenement: "Arrêté du gouverneur n° 2 de 2023 : la dotation provinciale aux desa adat peut être versée chaque année."}
  - {annee: 2025, evenement: "Règlement régional n° 5 de 2025 sur les Bale Kerta Adhyaksa, en vigueur le 18 février 2026."}
  - {annee: 2026, evenement: "Fin de l'inventaire : environ 1 500 desa adat, dont sept ajoutés par décision du gouverneur."}
fiabilite:
  verifie: ["Texte du règlement n° 4 de 2019 (copie du service provincial de la promotion des communautés coutumières) : art. 1, 5, 10, 11, 13 à 19, 24, 25, 28 à 41, 50, 53, 55, 58, 59, 65, 72 à 79, 91, 93, 94, 97.", "Annexe du règlement : 1 493 desa adat, répartis entre 9 districts et villes et leurs sous-districts (tableau joint, relevé ligne à ligne, total conforme aux totaux par district et sous-district).", "Arrêté du gouverneur n° 2 de 2023 : art. 9 et 20 (dotation provinciale annuelle).", "Règlement n° 5 de 2025 : art. 5 à 8 et 12 (Bale Kerta Adhyaksa).", "Environ 1 500 desa adat, sept ajoutés par décision du gouverneur, dotation de 300 millions de roupies : déclaration du chef du service provincial (Bali Post, 30 septembre 2026), le montant étant une précision ajoutée par la rédaction.", "Changement de nom de desa pakraman en desa adat pour suivre la terminologie nationale (Bali Post, 3 février 2019).", "Arrêté du gouverneur n° 34 de 2019 : art. 1 (22), 4, 7 et 13 (revenus propres, contribution obligatoire des résidents non membres).", "Étude de terrain sur la gestion financière du desa adat de Kastala (Sugita, 2023) et analyse critique du règlement n° 4 de 2019 (Iswantoro et Tobroni, 2023) : résumés des articles."]
  non_confirme: ["Aucun document onusien ou régional nommant les desa adat de Bali n'a été trouvé.", "Population des membres inscrits (krama) et surface cumulée des territoires coutumiers : aucun chiffre officiel trouvé.", "Enregistrement effectif des terres au nom des desa adat auprès de l'administration foncière nationale : non vérifié.", "L'annexe porte deux fois le nom Pukuh dans le sous-district de Susut (n° 10 et 32), reproduit tel quel ; le sous-district du district de Jembrana écrit « Pakutatan » est reproduit tel quel.", "Montant de la dotation (300 millions de roupies) : précision de la rédaction du Bali Post ; le texte de l'arrêté de 2023 ne fixe pas de somme (montant « fixe et/ou proportionnel », art. 20 (3)).", "Recours éventuel contre le règlement n° 4 de 2019 devant la Cour suprême (contrôle de légalité) : non vérifié.", "Les noms et la date des décisions du gouverneur pour les sept desa adat ajoutés (districts de Klungkung, Bangli et Badung) ne sont pas publiés dans la source ; ils ne figurent pas au tableau."]
