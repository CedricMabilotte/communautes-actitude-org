base_nationale:
  - {instrument: "Décret 87/2007 du 12 avril créant la réserve marine d'intérêt halieutique Os Miñarzos (DOG n° 88 du 8 mai 2007)", nature: "loi", annee: 2007, source: "https://www.pescadegalicia.gal/reservas/2026/Resolucion%20Organos%20de%20Goberno%20Os%20Mi%C3%B1arzos.pdf"}
  - {instrument: "Décret 241/2008 du 2 octobre modifiant le décret 87/2007 : plan de gestion intégrale (art. 6 bis) et recensement des professionnels (DOG n° 210 du 29 octobre 2008)", nature: "loi", annee: 2008, source: "https://www.xunta.gal/dog/Publicados/2008/20081029/Anuncio40382_es.html"}
  - {instrument: "Décret 28/2009 du 29 janvier créant la réserve marine d'intérêt halieutique Ría de Cedeira (DOG n° 33 du 17 février 2009)", nature: "loi", annee: 2009, source: "https://www.xunta.gal/dog/Publicados/2009/20090217/AnuncioA442_es.html"}
  - {instrument: "Plans de gestion intégrale 2024-2026 des réserves Os Miñarzos et Ría de Cedeira, approuvés par résolution de la Direction générale de la pêche, de l'aquaculture et de l'innovation technologique", nature: "loi", annee: 2024, source: "https://www.pescadegalicia.gal/gl/reservas-marinas"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque réserve est dirigée par un organe de gestion, de suivi et de contrôle de huit membres nommés par la consellería (ministère régional) de la pêche : à Cedeira, trois sièges pour la confrérie de Cedeira et un pour la Fédération galicienne des confréries (décret 28/2009, art. 10) ; à Os Miñarzos, deux pour la confrérie de Lira et deux pour la Fédération (ordre du 22 juin 2026) ; la présidence et le secrétariat reviennent à l'administration, dont le président tranche les égalités de voix (décret 28/2009, art. 10.3).", source: "https://www.xunta.gal/dog/Publicados/2009/20090217/AnuncioA442_es.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Les associations qui représentent les professionnels recensés rédigent la proposition de plan de gestion intégrale (de six mois à trois ans), qui peut déroger aux règlements de pêche ; le plan n'entre en vigueur qu'après approbation par la Direction générale compétente, sur avis de l'organe de gestion (décret 28/2009, art. 7 ; décret 87/2007, art. 6 bis, introduit par le décret 241/2008).", source: "https://www.xunta.gal/dog/Publicados/2009/20090217/AnuncioA442_es.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La pêche et le ramassage professionnels dans la réserve sont réservés aux titulaires de permis inscrits à un recensement propre, approuvé et mis à jour par la Direction générale après avis de l'organe de gestion, et limités aux embarcations de 1,5 GT (jauge brute) au plus, sauf dérogations (décret 28/2009, art. 8 et 9) ; la récolte du naissain de moule passe par un accord entre les confréries et les concessionnaires de cultures (art. 4 d).", source: "https://www.xunta.gal/dog/Publicados/2009/20090217/AnuncioA442_es.html"}
  consentement: {valeur: "partiel", note: "Le plan de gestion intégrale 2024-2026 d'Os Miñarzos prévoit que la proposition de plan est soumise aux professionnels recensés, par leurs associations ou en assemblée, avant l'avis de l'organe de gestion (point 4.2.1) ; aucune obligation légale de consentement n'a été trouvée.", source: "https://www.pescadegalicia.gal/reservas/2024/P.%20X.%20I.%20Minarzos.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
