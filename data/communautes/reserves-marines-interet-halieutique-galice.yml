  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Des plans de gestion intégrale sont approuvés chaque année ou par période depuis 2010 pour Os Miñarzos et depuis 2011 pour la ria de Cedeira (mesures de gestion en 2010), et les organes de gestion des deux réserves ont été renouvelés par ordres du 25 octobre 2023 et du 22 juin 2026 ; une étude publiée dans Ecology and Society (2024) décrit Os Miñarzos comme placée sous un régime de gouvernance partagée entre le gouvernement régional et le secteur de la pêche, et n'y relève, dans les publications analysées jusqu'en 2019, qu'un conflit, entre pêcheurs professionnels et de loisir, au sujet de la procédure de création. Aucune source indépendante sur la ria de Cedeira n'a été consultée.", source: "https://www.ecologyandsociety.org/vol29/iss4/art19/"}
chronologie:
  - {annee: 2007, evenement: "Décret 87/2007 du 12 avril : création de la réserve Os Miñarzos au large de Lira ; un ordre du 27 novembre en règle l'usage et la gestion."}
  - {annee: 2008, evenement: "Décret 241/2008 du 2 octobre modifiant le décret 87/2007 (plan de gestion intégrale, recensement des professionnels)."}
  - {annee: 2009, evenement: "Décret 28/2009 du 29 janvier : création de la réserve Ría de Cedeira sur proposition de la confrérie de Cedeira."}
  - {annee: 2011, evenement: "Résolution du 3 novembre (DOG du 7 décembre) fixant le recensement des professionnels de la réserve Os Miñarzos."}
  - {annee: 2024, evenement: "Approbation des plans de gestion intégrale 2024-2026 des deux réserves."}
  - {annee: 2026, evenement: "Ordres du 22 juin renouvelant les membres des deux organes de gestion, de suivi et de contrôle (DOG du 1er juillet)."}
