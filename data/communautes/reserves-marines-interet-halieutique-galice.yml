resume: >-
  Fiche agrégée : elle couvre les communautés de pêcheurs artisanaux de Lira et de Cedeira, regroupées dans leurs confréries de pêcheurs (cofradías ou confrarías : corporations professionnelles de droit public), titulaires des deux réserves marines d'intérêt halieutique (REMIP) de Galice. La réserve Os Miñarzos, créée par le décret 87/2007 du 12 avril sur proposition des pêcheurs de Lira, et la réserve Ría de Cedeira, créée par le décret 28/2009 du 29 janvier sur proposition de la confrérie de Cedeira, réservent la pêche professionnelle aux titulaires de permis inscrits à un recensement propre à chaque réserve. Chaque réserve est dirigée par un organe de gestion, de suivi et de contrôle de huit membres, où le secteur de la pêche dispose de quatre sièges et l'administration des quatre autres, dont la présidence. Les professionnels recensés rédigent la proposition de plan de gestion intégrale, que la Direction générale de la pêche approuve.
