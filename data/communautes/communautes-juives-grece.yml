resume: >-
  La loi 2456/1920 sur les communautés israélites fait de chaque communauté juive de Grèce une personne morale de droit public (organisme public doté de la personnalité juridique), habilitée à percevoir les cotisations de ses membres et à fonder des écoles.
  Le règlement intérieur de chaque communauté est approuvé par décret présidentiel (art. 17 de la loi de 1920) ; à Ioannina, l'assemblée des membres élit un conseil d'administration. Les communautés relèvent de la tutelle du ministère de l'Éducation et des Cultes.
  Le Conseil central israélite de Grèce (KIS), créé en 1945 pour reconstituer les communautés après la Shoah, coordonne huit communautés en activité.
  La loi 4301/2014 sur la forme juridique des communautés religieuses maintient ce régime particulier (art. 16). La minorité musulmane fait l'objet de la fiche « Musulmans de Thrace occidentale ».
