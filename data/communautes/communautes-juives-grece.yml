base_nationale:
  - {instrument: "Loi 2456/1920 sur les communautés israélites (FEK A 173/1920)", nature: "loi", annee: 1920, source: "https://www.ipaideia.gr/paideia/12-01-15-anakoinosi-genikou-gramatea-thriskeumaton-k-g-kalantzi/"}
  - {instrument: "Loi de nécessité (acte législatif pris par le gouvernement) 367/1945 (FEK A 143/1945) sur la reconstitution des communautés israélites et la création du Conseil central israélite ; loi 1657/1951 (Conseil rendu permanent) ; décret-loi 301/1969 (Conseil reconnu personne morale de droit public depuis 1945)", nature: "loi", annee: 1945, source: "https://www.ipaideia.gr/paideia/12-01-15-anakoinosi-genikou-gramatea-thriskeumaton-k-g-kalantzi/"}
