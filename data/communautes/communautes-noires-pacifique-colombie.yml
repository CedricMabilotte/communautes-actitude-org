resume: >-
  La loi 70 de 1993 reconnaît aux communautés noires qui occupent les terres riveraines des fleuves du bassin du Pacifique un droit de propriété collective. Chaque communauté forme un conseil communautaire (consejo comunitario) pour recevoir et administrer le titre. La loi applique l'article transitoire 55 de la Constitution de 1991. La Cour constitutionnelle a jugé en 2001 que ces communautés relèvent de la Convention 169 de l'OIT en tant que peuple tribal. La protection du fleuve Atrato comme sujet de droits fait l'objet de la fiche « Communautés gardiennes du fleuve Atrato ». Le même régime s'applique hors du Pacifique : le conseil communautaire Ma Kankamaná de San Basilio de Palenque (Mahates, Bolívar) a reçu son titre collectif en 2012. En 2025, l'arrêt T-105 de la Cour constitutionnelle écarte, pour le conseil communautaire Esfuerzo Pescador (Nariño), l'exclusion des biens d'usage public (zones de basse mer) prévue à l'article 6 de la loi 70. Le tableau reprend les 336 titres collectifs de l'Agence nationale des terres, dont la date est celle du dernier acte administratif.
