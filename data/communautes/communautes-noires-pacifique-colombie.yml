reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "La Colombie ratifie la Convention 169 de l'OIT le 7 août 1991 ; l'arrêt C-169 de 2001 de la Cour constitutionnelle l'applique aux communautés noires.", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits économiques, sociaux et culturels relève les inégalités d'accès à la terre que subissent les Afro-Colombiens (E/C.12/COL/CO/7, § 6) et demande une réglementation de la consultation préalable des peuples autochtones et des communautés ethniques (§ 10 et 11).", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=E/C.12/COL/CO/7&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Constitution politique de la Colombie (1991), art. 7, 63 et 176", nature: "constitution", annee: 1991, source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  - {instrument: "Loi 70 du 27 août 1993, qui développe l'article transitoire 55 de la Constitution", nature: "loi", annee: 1993, source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
  - {instrument: "Cour constitutionnelle, arrêt C-169 de 2001", nature: "jurisprudence", annee: 2001, source: "https://www.corteconstitucional.gov.co/relatoria/2001/C-169-01.htm"}
  - {instrument: "Décret 1384 du 25 août 2023, qui réglemente le chapitre IV de la loi 70 (ressources naturelles renouvelables et environnement)", nature: "loi", annee: 2023, source: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=217070"}
  - {instrument: "Cour constitutionnelle, arrêt T-105 du 25 mars 2025", nature: "jurisprudence", annee: 2025, source: "https://www.corteconstitucional.gov.co/relatoria/2025/T-105-25.htm"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 70 de 1993 (art. 5) fait du conseil communautaire la forme d'administration interne des terres collectives ; il choisit le représentant légal de la communauté.", source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Le décret 1384 de 2023 (art. 2.2.12.2.3) définit le règlement interne comme l'ensemble des normes édictées par le conseil communautaire, « autorité d'administration interne », sur la conservation, l'usage et l'exploitation des ressources naturelles du territoire collectif ; la gestion s'articule avec les autorités environnementales (art. 2.2.12.2.5).", source: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=217070"}
  justice_propre: {valeur: "partiel", note: "La loi 70 de 1993 (art. 5) charge le conseil communautaire d'agir en « amigable componedor » (conciliateur) dans les conflits internes.", source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
  terres: {valeur: "reconnu", note: "La loi 70 de 1993 (art. 1 et 7) reconnaît la propriété collective et rend la partie à usage collectif inaliénable, imprescriptible et insaisissable ; la Constitution (art. 63) rend inaliénables les terres communales des groupes ethniques.", source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
  ressources: {valeur: "partiel", note: "La loi 70 de 1993 (art. 6) inclut les sols et les forêts dans le titre collectif mais exclut le sous-sol et les autres ressources ; l'article 19 dispense d'autorisation les usages traditionnels.", source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
  consentement: {valeur: "partiel", note: "La loi 70 de 1993 (art. 44) prévoit la participation des communautés aux études des effets environnementaux, socio-économiques et culturels des projets sur leurs terres ; l'arrêt C-169 de 2001 leur applique la Convention 169 de l'OIT.", source: "https://www.corteconstitucional.gov.co/relatoria/2001/C-169-01.htm"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La loi 70 de 1993 (art. 32 et 35) garantit une éducation adaptée aux communautés noires et leur droit de créer leurs propres institutions éducatives, sous réserve des normes nationales.", source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0070_1993.html"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La Constitution (art. 176) réserve deux sièges de la Chambre des représentants à la circonscription nationale des communautés afrodescendantes.", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'arrêt T-105 de 2025 relève, d'après l'Agence nationale des terres, 527 demandes de titre collectif présentées par des communautés noires jusqu'en novembre 2023, dont 249 accordées ; la Cour ordonne à l'Agence de statuer sous six mois sur la demande du conseil communautaire Esfuerzo Pescador, déposée en 2004.", source: "https://www.corteconstitucional.gov.co/relatoria/2025/T-105-25.htm"}
chronologie:
  - {annee: 1991, evenement: "L'article transitoire 55 de la Constitution prévoit une loi sur les terres des communautés noires."}
  - {annee: 1993, evenement: "Adoption de la loi 70."}
  - {annee: 2001, evenement: "L'arrêt C-169 de la Cour constitutionnelle qualifie les communautés noires de peuple tribal au sens de la Convention 169."}
  - {annee: 2012, evenement: "Titre collectif du conseil communautaire Ma Kankamaná de San Basilio de Palenque (résolution 466 du 30 mars 2012)."}
  - {annee: 2023, evenement: "Le décret 1384 réglemente le chapitre IV de la loi 70 (ressources naturelles et environnement des territoires collectifs)."}
  - {annee: 2025, evenement: "L'arrêt T-105 ordonne d'écarter, pour le conseil communautaire Esfuerzo Pescador, l'article 6 a) de la loi 70 qui exclut du titre collectif les biens d'usage public ; la Cour invite le Congrès et le gouvernement à revoir le régime des zones de basse mer avec les communautés."}
  - {annee: 2026, evenement: "Élection des deux représentants de la circonscription afrodescendante le 8 mars ; le Conseil d'État suspend à titre provisoire, en août, l'élection de l'un d'eux, dont la liste n'avait pas atteint le seuil."}
