  - {instrument: "Arrêté n° 09.021 du 30 avril 2009 fixant les modalités d'application de la loi n° 08.022 portant Code forestier", nature: "loi", annee: 2009, source: "https://www.ilo.org/fr/media/364646/download"}
  - {instrument: "Décret n° 15.463 du 3 décembre 2015 fixant les modalités d'attribution et de gestion des forêts communautaires en République centrafricaine (Manuel de procédure d'attribution)", nature: "loi", annee: 2015, source: "https://www.ilo.org/fr/media/364646/download"}
  - {instrument: "Arrêté n° 14/MEFCP/DIR.CAB/DGEFCP/19 du 25 avril 2019 portant attribution des forêts communautaires pilotes de Lomba", nature: "loi", annee: 2019, source: "https://www.rainforestfoundationuk.org/media.ashx/arrte-dattribution-forts-communautaire-de-lomba201904260001.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La gestion d'une forêt communautaire relève de la communauté villageoise organisée (Code forestier de 2008, art. 135) ; le Manuel de procédure d'attribution (§ 2.6) impose une structure composée d'un conseil coutumier, d'un comité de gestion et, selon le cas, d'un conseil autochtone, dans le cadre d'une convention de gestion conclue avec l'État (art. 133).", source: "https://www.ilo.org/fr/media/364646/download"}
  pouvoir_normatif: {valeur: "non_etabli", note: "Le Code forestier de 2008 (art. 139) autorise dans la forêt communautaire les activités inscrites au plan simple de gestion (document qui programme les activités dans la forêt) élaboré par la ou les communautés et examiné par l'administration forestière, et le Manuel de procédure d'attribution renvoie à un manuel des normes de gestion à élaborer ; aucun texte trouvé ne donne à la structure de gestion le pouvoir d'adopter des règles d'accès, d'usage ou de sanction qui s'imposent aux membres ou aux tiers.", source: "https://fr.readkong.com/page/l-attribution-des-forets-communautaires-en-republique-2600596"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire fait partie du domaine forestier non permanent et est confiée par convention de gestion avec l'État (Code forestier de 2008, art. 133) ; la superficie est plafonnée à 5 000 ha par forêt (décret n° 15.463 et arrêté n° 09.021) ; selon l'OIT, les peuples autochtones peuvent obtenir des forêts communautaires mais ne peuvent pas être propriétaires de leurs terres.", source: "https://www.ilo.org/fr/media/364646/download"}
  ressources: {valeur: "partiel", note: "Les produits forestiers de toute nature résultant de l'exploitation des forêts communautaires (ressources ligneuses, espèces animales et végétales, produits des pêches, produits spéciaux) appartiennent entièrement aux populations concernées, sauf ceux réglementés ou interdits par la loi (Code forestier de 2008, art. 139).", source: "https://www.ilo.org/fr/media/364646/download"}
  consentement: {valeur: "partiel", note: "Le Manuel de procédure d'attribution, adopté par le décret n° 15.463 de 2015, prescrit des réunions destinées à s'assurer que les parties concernées par le projet de forêt communautaire sont parvenues à un consensus ; il permet au conseil autochtone de délibérer séparément et de s'opposer à tout projet qui ne prend pas en compte les préoccupations des peuples autochtones.", source: "https://fr.readkong.com/page/l-attribution-des-forets-communautaires-en-republique-2600596"}
