effectivite: {valeur: "partielle", note: "Selon Rainforest Foundation UK (septembre 2019), la quasi-totalité des forêts du sud-ouest est attribuée à des concessions d'exploitation ou à des aires protégées ; les communautés des deux sites pilotes (quatorze villages accompagnés depuis 2016) n'étaient pas éligibles sans l'autorisation administrative du 29 janvier 2018, qui permet de tester l'attribution de forêts communautaires au sein des concessions d'exploitation sous réserve de protocoles de collaboration avec les acteurs concernés ; le dossier de demande est jugé trop complexe pour être élaboré sans accompagnement, et le plafond de 5 000 ha est inférieur à l'étendue des territoires coutumiers. En septembre 2019, Lomba est la seule attribution documentée.", source: "https://fr.readkong.com/page/l-attribution-des-forets-communautaires-en-republique-2600596"}
chronologie:
  - {annee: 2008, evenement: "Loi n° 08.022 du 17 octobre 2008 portant Code forestier : création des forêts communautaires (art. 133 à 139)."}
  - {annee: 2009, evenement: "Arrêté n° 09.021 du 30 avril 2009 fixant les modalités d'application du Code forestier."}
  - {annee: 2010, evenement: "Ratification de la Convention n° 169 de l'OIT ; adoption par le gouvernement du document « Concepts et Vision de la Foresterie Communautaire en République Centrafricaine »."}
  - {annee: 2011, evenement: "Le ministère des Eaux, Forêts, Chasse et Pêche établit le Manuel de procédure d'attribution des forêts communautaires."}
  - {annee: 2015, evenement: "Décret n° 15.463 du 3 décembre 2015 fixant les modalités d'attribution et de gestion des forêts communautaires."}
  - {annee: 2016, evenement: "Quatorze villages, regroupés en deux sites pilotes du sud-ouest, engagent la procédure avec l'appui d'organisations de la société civile."}
  - {annee: 2018, evenement: "Autorisation administrative n° 03 du 29 janvier 2018 : reprise du test des forêts communautaires dans le massif du sud-ouest, y compris dans les concessions ; dépôt du dossier de Lomba le 29 décembre."}
  - {annee: 2019, evenement: "Convention de gestion n° 02 du 28 février 2019 ; arrêté du 25 avril 2019 attribuant aux communautés de Moloukou, Lokombé et Moalé les trois forêts pilotes de Lomba (14 975 ha) pour cinq ans."}
fiabilite:
  verifie:
    - "Texte de l'arrêté n° 14 du 25 avril 2019 (visas, art. 1 à 6) : 14 975 ha, trois forêts pilotes, sous-préfecture de M'Baïki, durée provisoire de cinq ans, protocoles avec la société SCAD et le parc national Mbaéré-Bodingué, possibilité d'annulation pour non-respect du plan simple de gestion (art. 4)."
    - "Citations des articles 133, 135 et 139 du Code forestier, plafond de 5 000 ha, § 2.5 et 2.6 du Manuel et entrée en vigueur de la Convention n° 169 (août 2011) dans le profil pays de l'OIT (avril 2023) ; ratification en 2010 dans le rapport de Rainforest Foundation UK (septembre 2019)."
    - "Composition des organes de gestion, pouvoir d'opposition du conseil autochtone, autorisation de 2018 et difficultés de mise en œuvre dans le rapport de Rainforest Foundation UK (septembre 2019)."
  non_confirme:
    - "Le texte du Code forestier et celui du décret n° 15.463 n'ont pas été consultés directement ; les articles sont cités d'après l'OIT et Rainforest Foundation UK. L'OIT date le Code du 10 octobre 2008 dans sa liste des textes et du 17 octobre 2008 ailleurs ; l'arrêté de 2019 retient le 17 octobre."
    - "Nombre total de forêts communautaires attribuées après 2019 (dont le second site pilote, Mbunza-Boffi) : aucune liste officielle trouvée ; aucun tableau des sites n'est donc publié."
    - "Suite donnée à l'attribution provisoire de Lomba après 2024 (échéance des cinq ans) : non vérifiée."
    - "Population des villages attributaires : aucune source trouvée."
