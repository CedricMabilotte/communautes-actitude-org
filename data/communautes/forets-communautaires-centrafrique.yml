resume: >-
  Fiche agrégée : elle couvre les communautés villageoises et autochtones titulaires d'une forêt communautaire en République centrafricaine. La loi n° 08.022 du 17 octobre 2008 portant Code forestier (art. 133 à 139) range les forêts communautaires dans le domaine forestier non permanent (forêts qui ne sont pas réservées à la production ou à la conservation par l'État) ; chacune fait l'objet d'une convention de gestion (contrat entre la communauté organisée et l'administration des forêts), et les produits forestiers qui en sont tirés appartiennent entièrement aux populations concernées. Le décret n° 15.463 du 3 décembre 2015 fixe les modalités d'attribution et de gestion et adopte le Manuel de procédure d'attribution établi en 2011 par le ministère des Eaux, Forêts, Chasse et Pêche ; la superficie est plafonnée à 5 000 ha par forêt. La première attribution, par arrêté ministériel du 25 avril 2019, porte sur trois forêts pilotes réunies sous le nom de Lomba (14 975 ha), au profit des communautés locales et autochtones de Moloukou, Lokombé et Moalé, pour une durée provisoire de cinq ans ; cette forêt est située dans une concession d'exploitation, et l'arrêté impose des protocoles de collaboration avec la société concessionnaire et le gestionnaire du parc national Mbaéré-Bodingué.
  La situation des Aka et des Mbororo au regard de la Convention n° 169 relève de la fiche « Peuples autochtones de Centrafrique (Aka et Mbororo) ».
