reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "La Convention n° 169 de l'OIT, ratifiée par la République centrafricaine, y est en vigueur depuis août 2011. Le profil pays de l'OIT (avril 2023) décrit le régime des forêts communautaires (Code forestier, art. 133 à 139 ; décret n° 15.463) et relève que le Manuel de procédure d'attribution se réfère expressément à la convention (consultation, droit coutumier, droits sur les terres et les ressources).", annee: 2023, source: "https://www.ilo.org/fr/media/364646/download"}
