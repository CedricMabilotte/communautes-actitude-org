resume: >-
  Les Dénés et Métis du Sahtu vivent autour du Grand lac de l'Ours et de la vallée du Mackenzie, au centre des Territoires du Nord-Ouest. Le préambule de la loi fédérale nomme les Dénés Esclaves, Lièvres et Montagnards de la région. L'Entente sur la revendication territoriale globale, signée le 6 septembre 1993 à Tulita et approuvée par la loi fédérale sanctionnée le 23 juin 1994, leur attribue 41 437 km² de terres, dont 1 813 km² avec le sous-sol, des droits de récolte, une part des redevances sur les ressources et la moitié des sièges, hors présidence, des offices de gestion des terres, des eaux et de la faune. Elle prévoit la négociation d'accords d'autonomie gouvernementale par collectivité : celui de Délı̨nę est en vigueur depuis le 1er septembre 2016, les autres sont en négociation.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien. Aucun document onusien nommant les Dénés et Métis du Sahtu n'a été consulté.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Entente sur la revendication territoriale globale des Dénés et Métis du Sahtu (Sahtu Dene and Metis Comprehensive Land Claim Agreement)", nature: "accord_revendication", annee: 1993, source: "https://www.eia.gov.nt.ca/sites/eia/files/sahtu_dene_and_metis_comprehensive_land_claim_agreement_0.pdf"}
  - {instrument: "Loi sur le règlement de la revendication territoriale des Dénés et Métis du Sahtu (L.C. 1994, ch. 27)", nature: "loi", annee: 1994, source: "https://laws-lois.justice.gc.ca/fra/lois/S-1.5/page-1.html"}
  - {instrument: "Loi sur l'accord définitif sur l'autonomie gouvernementale de Deline (L.C. 2015, ch. 24)", nature: "loi", annee: 2015, source: "https://laws-lois.justice.gc.ca/fra/lois/D-1.5/page-1.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les organisations désignées du Sahtu détiennent le titre des terres (Loi de 1994, art. 4(3)) et les participants en gèrent l'usage, Entente, art. 19.1.6 ; un conseil des ressources renouvelables par collectivité, art. 13.9.1 ; l'Entente prévoit la négociation d'accords d'autonomie gouvernementale, chapitre 5 et annexe B ; seul le gouvernement Got'ı̨nę de Délı̨nę est en place (Loi de 2015, art. 9), depuis le 1er septembre 2016.", source: "https://www.eia.gov.nt.ca/sites/eia/files/sahtu_dene_and_metis_comprehensive_land_claim_agreement_0.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Limité à Délı̨nę : les lois de Délı̨nę adoptées selon l'accord définitif de 2015 ont force de loi (Loi de 2015, art. 10) ; l'Entente du Sahtu et sa loi l'emportent sur elles en cas d'incompatibilité (art. 8).", source: "https://laws-lois.justice.gc.ca/fra/lois/D-1.5/page-1.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Titre en pleine propriété (fee simple, propriété sans réserve) sur 39 624 km² sans le sous-sol et 1 813 km² avec le sous-sol, dévolu aux organisations désignées du Sahtu, Entente, art. 19.1.2 et 19.1.4 ; ces terres ne peuvent être cédées qu'à l'État en échange d'autres terres ou à une organisation désignée, ni saisies ni hypothéquées, art. 19.1.5, 19.1.7 et 19.1.8.", source: "https://www.eia.gov.nt.ca/sites/eia/files/sahtu_dene_and_metis_comprehensive_land_claim_agreement_0.pdf"}
  ressources: {valeur: "reconnu", note: "Titre sur le sous-sol de 1 813 km², art. 19.1.2 b) ; droit de récolter toutes les espèces sauvages dans la région désignée en toute saison, art. 13.4.1, et droit exclusif de récolte sur les terres du Sahtu, art. 13.4.3 ; versement annuel de 7,5 % des premiers 2 millions de dollars de redevances perçues par l'État et de 1,5 % au-delà, art. 10.1.1 ; cogestion par l'Office des ressources renouvelables du Sahtu, art. 13.8.1.", source: "https://www.eia.gov.nt.ca/sites/eia/files/sahtu_dene_and_metis_comprehensive_land_claim_agreement_0.pdf"}
  consentement: {valeur: "partiel", note: "Consultation obligatoire du Conseil tribal du Sahtu avant l'ouverture de terres à l'exploration pétrolière et gazière et avant l'exploration ou la production minière, Entente, art. 22.1.2 à 22.1.5 ; moitié des membres, hors président, de l'Office des ressources renouvelables, de l'office d'aménagement et de l'office des terres et des eaux proposés par le Conseil tribal, art. 13.8.3, 25.2.2 et 25.4.7 ; le plan d'aménagement et ses modifications doivent être agréés par la première nation, ici le Sahtu Secretariat Incorporated, avant les ministres, Loi sur la gestion des ressources de la vallée du Mackenzie, art. 43 et 48(2) (plan en vigueur depuis le 8 août 2013) ; aucun droit de refus sur les projets.", source: "https://www.eia.gov.nt.ca/sites/eia/files/sahtu_dene_and_metis_comprehensive_land_claim_agreement_0.pdf"}
  langue: {valeur: "reconnu", note: "L'esclave du Nord (North Slavey), parlé à Colville Lake, Délı̨nę, Tulita et Fort Good Hope, figure parmi les onze langues officielles des Territoires du Nord-Ouest selon la législation territoriale ; l'Entente ne confère pas de pouvoir propre en matière de langue.", source: "https://www.axl.cefan.ulaval.ca/amnord/tno.htm"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Inscription des participants (bénéficiaires) : citoyens canadiens dénés ou métis du Sahtu, ou personnes d'ascendance autochtone résidant dans la région et acceptées par une collectivité du Sahtu, Entente, art. 4.2.1 à 4.2.3 ; à Délı̨nę, la Loi sur les Indiens cesse de s'appliquer aux citoyens de la Première Nation de Délı̨nę, Loi de 2015, art. 11(2).", source: "https://www.eia.gov.nt.ca/sites/eia/files/sahtu_dene_and_metis_comprehensive_land_claim_agreement_0.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante consultée. Les institutions prévues par l'Entente fonctionnent : le plan d'aménagement du Sahtu est en vigueur depuis 2013 et sa révision quinquennale a été approuvée en 2023 ; le gouvernement Got'ı̨nę de Délı̨nę existe depuis 2016 ; selon le gouvernement des T.N.-O., les autres collectivités sont en négociation.", source: "https://sahtulanduseplan.org/about-slupb"}
chronologie:
  - {annee: 1921, evenement: "Signature du Traité 11 à Fort Norman (Tulita) le 15 juillet et à Fort Good Hope le 21 juillet avec des chefs dénés du Sahtu."}
  - {annee: 1993, evenement: "Les Dénés et Métis du Sahtu approuvent l'Entente par un vote tenu du 5 au 8 juillet ; signature le 6 septembre à Tulita."}
  - {annee: 1994, evenement: "Loi fédérale sanctionnée et en vigueur le 23 juin ; création du Sahtu Secretariat Incorporated par les sept sociétés foncières."}
  - {annee: 2013, evenement: "Le plan d'aménagement du Sahtu entre en vigueur le 8 août après approbation du Sahtu Secretariat Incorporated, du gouvernement des T.N.-O. et du Canada."}
  - {annee: 2015, evenement: "Signature le 18 février de l'accord définitif sur l'autonomie gouvernementale de Délı̨nę, approuvé par les électeurs de Délı̨nę en mars 2014 ; loi fédérale sanctionnée le 18 juin."}
  - {annee: 2016, evenement: "Entrée en vigueur de l'accord de Délı̨nę le 1er septembre ; création du gouvernement Got'ı̨nę de Délı̨nę."}
