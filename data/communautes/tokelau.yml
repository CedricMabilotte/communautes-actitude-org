resume: >-
  Trois atolls administrés par la Nouvelle-Zélande depuis 1926 et intégrés à son territoire par le Tokelau Act de 1948. Le Fono général (assemblée nationale des trois villages) édicte des règles depuis 1996. Les référendums d'autodétermination de 2006 et 2007 sur la libre association avec la Nouvelle-Zélande n'atteignent pas la majorité des deux tiers fixée par le Fono général. Les Tokélaou restent inscrites sur la liste des territoires non autonomes.
reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Résolution 79/110 « Question des Tokélaou » : rappel des référendums de 2006 et 2007 et de la relance du dialogue sur l'autodétermination décidée par le Fono général le 23 mai 2022", annee: 2024, source: "https://documents.un.org/api/symbol/access?s=A/RES/79/110&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Tokelau Act 1948 (Nouvelle-Zélande), modifié par le Tokelau Amendment Act 1996", nature: "loi", annee: 1948, source: "https://faolex.fao.org/docs/pdf/tok151698.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Gouvernement national dirigé par le Fono général et son comité permanent, le Conseil pour le gouvernement permanent (Council for the Ongoing Government), composé de six élus des trois villages, qui dirige la fonction publique des Tokélaou.", source: "https://www.wgtn.ac.nz/law/research/publications/about-nzacl/publications/cljpjdcp-journals/volume-15,-2009/Tokelau.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Fono général peut édicter des règles « pour la paix, l'ordre et le bon gouvernement des Tokélaou » (Tokelau Act 1948, s. 3A, inséré en 1996) ; ces règles cèdent devant les lois néo-zélandaises applicables (s. 3B) et peuvent être désavouées (s. 3F).", source: "https://faolex.fao.org/docs/pdf/tok151698.pdf"}
  justice_propre: {valeur: "partiel", note: "Commissaires tokélaouans nommés pour chaque atoll après consultation des anciens, compétents pour les petits litiges civils et pénaux (Tokelau Act 1948, s. 5 à 7) ; la coutume est une source du droit (Custom as a Source of Law Rules 2004, selon Angelo, 2009).", source: "https://faolex.fao.org/docs/pdf/tok151698.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le pouvoir réglementaire du Fono général comprend celui d'établir péages, redevances, amendes, impôts et autres charges (Tokelau Act 1948, s. 3A(2)(a)).", source: "https://faolex.fao.org/docs/pdf/tok151698.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Référendums d'autodétermination de février 2006 et octobre 2007 sur un projet de constitution et de traité de libre association, organisés par décision du Fono général ; seuil des deux tiers non atteint.", source: "https://documents.un.org/api/symbol/access?s=A/RES/79/110&l=fr&t=pdf"}
effectivite: {valeur: "partielle", note: "Le pouvoir législatif reste en dernier ressort au Parlement néo-zélandais (Angelo, 2009) ; le Fono général a relancé en 2022 le dialogue sur l'autodétermination en vue du centenaire de l'administration néo-zélandaise en février 2026 (résolution 79/110).", source: "https://documents.un.org/api/symbol/access?s=A/RES/79/110&l=fr&t=pdf"}
chronologie:
  - {annee: 1926, evenement: "Début de l'administration néo-zélandaise, depuis Apia."}
  - {annee: 1948, evenement: "Tokelau Act : les Tokélaou font partie de la Nouvelle-Zélande."}
  - {annee: 1996, evenement: "Tokelau Amendment Act : pouvoir réglementaire du Fono général."}
  - {annee: 2003, evenement: "Déclaration conjointe sur les principes de partenariat (21 novembre)."}
  - {annee: 2006, evenement: "Premier référendum d'autodétermination (février) : seuil des deux tiers non atteint."}
  - {annee: 2007, evenement: "Second référendum (octobre) : seuil des deux tiers non atteint."}
  - {annee: 2022, evenement: "Le Fono général décide de relancer le dialogue sur l'autodétermination (23 mai)."}
