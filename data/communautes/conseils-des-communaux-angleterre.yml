resume: >-
  Fiche agrégée : elle couvre les conseils des communaux (commons councils), personnes morales créées par ordonnance ministérielle en vertu de la partie 2 de la loi de 2006 sur les communaux (Commons Act 2006). Un conseil réunit des membres élus par les titulaires de droits d'usage sur une terre commune (commoners, « usagers des communaux »), éleveurs actifs ou non, et des représentants des propriétaires du sol. Il gère les activités agricoles, la végétation et les droits communaux, et peut édicter des règles dont la violation est une infraction pénale si le ministre y consent. Deux conseils sont établis en Angleterre : Brendon Commons (Devon, ordonnance de 2013, en fonction depuis le 1er avril 2014) et Bodmin Moor (Cornouailles, ordonnance de 2015, en fonction depuis le 1er mars 2016, 71 unités du registre des terres communes).
