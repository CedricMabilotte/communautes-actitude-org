droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil des communaux est une personne morale (body corporate) qui n'agit pas pour le compte de la Couronne (Commons Act 2006, art. 26 et 28). À Bodmin Moor, 24 à 26 membres : 16 élus par les éleveurs actifs (deux par section), 4 élus par les autres commoners, 4 nommés par les propriétaires, et jusqu'à deux membres cooptés sans droit de vote (ordonnance de 2015, art. 4 et annexe 3). À Brendon, 5 à 7 membres : 3 élus par les éleveurs actifs, 1 par les autres commoners, 1 nommé par le propriétaire, et jusqu'à deux cooptés (ordonnance de 2013, art. 4). Limites : compétences restreintes à l'agriculture, à la végétation et aux droits communaux (art. 31), sièges réservés aux propriétaires du sol, et le ministre peut révoquer l'ordonnance si le conseil cesse de fonctionner ou néglige l'intérêt public (art. 37).", source: "https://www.legislation.gov.uk/uksi/2015/1515/made"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil peut édicter des règles sur les activités agricoles, la gestion de la végétation et l'exercice des droits communaux, y compris limiter le nombre d'animaux et les périodes de pâturage (Commons Act 2006, art. 31). Les règles n'entrent en vigueur qu'après confirmation du ministre (art. 7 des ordonnances de 2013 et 2015) ; leur violation n'est une infraction pénale, punie d'une amende de niveau 4, que si la règle est prise avec l'accord du ministre et le précise (art. 34). Le ministre peut révoquer toute règle par une directive motivée (art. 35, al. 3).", source: "https://www.legislation.gov.uk/ukpga/2006/26/part/2"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le conseil ne possède pas la terre commune, qui reste la propriété des propriétaires du sol. Il peut établir et entretenir les limites, retirer les clôtures illégales et autres empiètements (Commons Act 2006, art. 31, al. 3), et acquérir ou céder des terres (art. 32, al. 2 d).", source: "https://www.legislation.gov.uk/ukpga/2006/26/part/2"}
  ressources: {valeur: "partiel", note: "Le conseil gère le pâturage et la végétation, tient un registre du pâturage (grazing register) et retire les animaux qui pâturent illégalement (Commons Act 2006, art. 31) ; il doit tenir compte de l'intérêt public : conservation de la nature, paysage, accès du public, patrimoine archéologique (art. 31, al. 6 et 7).", source: "https://www.legislation.gov.uk/ukpga/2006/26/part/2"}
  consentement: {valeur: "partiel", note: "Le ministre publie le projet d'ordonnance, recueille les observations et ne peut créer le conseil que s'il constate un « soutien substantiel » (substantial support), en tenant compte en particulier des titulaires de droits communaux et des propriétaires (Commons Act 2006, art. 27) ; la même procédure s'applique à la modification ou à la révocation de l'ordonnance (art. 37, al. 3), et le ministre doit consulter le conseil avant de révoquer une de ses règles (art. 35, al. 5). Consultation de Brendon (2013) : 47 réponses favorables sur 53 ; de Bodmin Moor (2015) : 195 sur 202.", source: "https://www.legislation.gov.uk/uksi/2015/1515/pdfs/uksiem_20151515_en.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil peut lever des fonds, y compris des redevances liées à l'exercice des droits communaux et à la participation au conseil, recouvrables comme une dette (Commons Act 2006, art. 32, al. 3). La décision d'instituer ou de modifier une redevance exige une majorité des deux tiers des membres présents (statuts types de 2010, annexe, art. 19) ; une personne qui ne paie pas la redevance due ne peut être membre, voter aux élections ni participer aux affaires du conseil (même annexe, art. 4).", source: "https://www.legislation.gov.uk/uksi/2010/1204/made"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Les notes explicatives du ministère de l'Environnement (Defra) décrivent la procédure de création des deux conseils ; aucune source consultée ne décrit leur fonctionnement après 2016 ni les règles confirmées par le ministre.", source: "https://www.legislation.gov.uk/uksi/2013/2959/pdfs/uksiem_20132959_en.pdf"}
chronologie:
  - {annee: 2006, evenement: "Commons Act 2006 : la partie 2 prévoit la création de conseils des communaux par ordonnance."}
  - {annee: 2010, evenement: "Entrée en vigueur de la partie 2 en Angleterre (20 janvier) ; statuts types des conseils."}
  - {annee: 2010, evenement: "Natural England commande, en août, des travaux de préparation de propositions de conseil pour trois associations d'usagers volontaires : Brendon, Cumbria et Bodmin."}
  - {annee: 2013, evenement: "Ordonnance établissant le conseil de Brendon Commons, premier usage du pouvoir prévu à l'art. 26."}
  - {annee: 2014, evenement: "Le conseil de Brendon Commons entre en fonction (1er avril)."}
  - {annee: 2015, evenement: "Ordonnance établissant le conseil de Bodmin Moor (14 juillet)."}
  - {annee: 2016, evenement: "Le conseil de Bodmin Moor entre en fonction (1er mars)."}
