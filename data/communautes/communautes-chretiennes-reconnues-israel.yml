resume: >-
  Dix Églises chrétiennes ont en Israël le statut de « communauté religieuse reconnue » : neuf figurent sur la liste de la période du mandat britannique, annexée en 1939 au Palestine Order in Council de 1922 (décret royal servant de constitution au mandat), et l'Église évangélique épiscopale est reconnue en 1970.
  L'État d'Israël a conservé ce régime en 1948.
  Les tribunaux ecclésiastiques de ces Églises ont une compétence exclusive sur le mariage et le divorce de leurs membres, selon le droit religieux de chaque Église.
  Les chrétiens membres d'Églises non reconnues (coptes, luthériens, baptistes, orthodoxes russes) n'ont pas de juridiction propre.
