droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée législative de l'État, Constitution, art. 371A (1963) ; conseils de village composés de membres choisis selon les pratiques coutumières, avec les chefs héréditaires, loi de 1978 sur les conseils de village, art. 4.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les lois du Parlement sur les pratiques religieuses ou sociales des Naga, le droit coutumier et sa procédure, et la propriété des terres et de leurs ressources ne s'appliquent au Nagaland que si l'Assemblée le décide par résolution, Constitution, art. 371A (1) (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Protection de la justice civile et pénale rendue selon le droit coutumier naga, Constitution, art. 371A (1) (a) (iii) ; les conseils de village rendent la justice selon le droit et les usages coutumiers, loi de 1978, art. 14.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  terres: {valeur: "reconnu", note: "Les lois du Parlement sur la propriété et la cession des terres ne s'appliquent qu'après résolution de l'Assemblée, Constitution, art. 371A (1) (a) (iv) ; aucune cession d'immeuble sans l'accord du conseil de village, loi de 1978, art. 15.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  ressources: {valeur: "reconnu", note: "La propriété et la cession des terres « et de leurs ressources » relèvent de la même clause, Constitution, art. 371A (1) (a) (iv).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Résolution de l'Assemblée du 14 septembre 2023 : l'amendement fédéral de 2023 à la loi sur la conservation des forêts ne s'applique au Nagaland que sous réserve des garanties de l'art. 371A.", source: "https://ipr.nagaland.gov.in/nla-passes-resolution-forest-conservation-amendment-act-2023"}
