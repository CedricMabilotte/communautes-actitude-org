  - {instrument: "Nagaland Communitisation of Public Institutions and Services Act, 2002", nature: "loi", annee: 2002, source: "https://vikalpsangam.org/wp-content/uploads/migrate/Resources/nagaland_communitisation_neema.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée législative de l'État, Constitution, art. 371A (1963) ; conseils de village composés de membres choisis selon les pratiques coutumières, avec les chefs héréditaires, loi de 1978 sur les conseils de village, art. 4 ; chaque conseil crée un comité de développement (Village Development Board) dont tous les résidents permanents sont membres, art. 12 ; en 2014, 1 225 villages étaient administrés par ces conseils (Kalpavriksh).", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les lois du Parlement sur les pratiques religieuses ou sociales des Naga, le droit coutumier et sa procédure, et la propriété des terres et de leurs ressources ne s'appliquent au Nagaland que si l'Assemblée le décide par résolution, Constitution, art. 371A (1) (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Protection de la justice civile et pénale rendue selon le droit coutumier naga, Constitution, art. 371A (1) (a) (iii) ; les conseils de village rendent la justice selon le droit et les usages coutumiers, loi de 1978, art. 14.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  terres: {valeur: "reconnu", note: "Les lois du Parlement sur la propriété et la cession des terres ne s'appliquent qu'après résolution de l'Assemblée, Constitution, art. 371A (1) (a) (iv) ; aucune cession d'immeuble sans l'accord du conseil de village, loi de 1978, art. 15.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  ressources: {valeur: "reconnu", note: "La propriété et la cession des terres « et de leurs ressources » relèvent de la même clause, Constitution, art. 371A (1) (a) (iv).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Aucune cession d'immeuble sans l'accord du conseil de village, loi de 1978 sur les conseils de village, art. 15 (g) ; l'Assemblée a décidé par résolution du 14 septembre 2023 que l'amendement fédéral de 2023 à la loi sur la conservation des forêts ne s'applique au Nagaland que sous réserve des garanties de l'art. 371A ; aucune obligation générale de consultation des communautés n'a été trouvée.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Les conseils de village supervisent notamment l'éducation, l'eau, les routes et les forêts du village, loi de 1978, art. 12 ; la loi de 2002 sur la « communitisation » (transfert aux communautés de la gestion des institutions et services publics) confie les écoles élémentaires à des comités d'éducation de village présidés par un représentant du conseil de village, qui versent les salaires des enseignants selon la règle « pas de travail, pas de salaire » et donnent un avis sur les mutations ; 12 % des écoles en 2002, 94 % en 2004 (Kalpavriksh, 2014).", source: "https://vikalpsangam.org/wp-content/uploads/migrate/Resources/nagaland_communitisation_neema.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Les pratiques religieuses et sociales et le droit coutumier des Naga sont soustraits aux lois du Parlement sauf résolution de l'Assemblée, Constitution, art. 371A (1) (a) (i) et (ii). Les citoyens indiens non résidents doivent obtenir un permis d'entrée (Inner Line Permit) délivré par l'État, Bengal Eastern Frontier Regulation de 1873, art. 2 ; une personne qui n'est pas originaire de la zone ne peut y acquérir de droit sur la terre sans l'accord du gouvernement, art. 7 ; le ministère de l'Intérieur présente ce régime comme une protection contre l'installation d'autres Indiens (2013).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "En 2014, 1 225 villages étaient administrés par des conseils de village et des comités de développement (Kalpavriksh). L'Assemblée a invoqué l'art. 371A en 2023 (loi forestière fédérale) et a demandé en 2024, à l'unanimité, le maintien du régime de libre circulation à la frontière avec le Myanmar (IWGIA, 2025). Des organisations tribales ont invoqué l'art. 371A contre la réservation d'un tiers des sièges municipaux aux femmes ; aucune élection municipale n'a eu lieu entre 2004 et juin 2024, date du scrutin tenu après des injonctions de la Cour suprême (2017, 2023), où des femmes ont obtenu 102 des 278 sièges (EADI, 2024).", source: "https://www.developmentresearch.eu/?p=1941"}
chronologie:
  - {annee: 1873, evenement: "Bengal Eastern Frontier Regulation : « ligne intérieure » et permis d'entrée dans les Naga Hills."}
  - {annee: 1963, evenement: "Le Nagaland devient un État ; l'art. 371A entre en vigueur le 1er décembre."}
  - {annee: 1979, evenement: "Loi sur les conseils de village et de zone (1978) publiée comme loi 1 de 1979."}
  - {annee: 2002, evenement: "Loi sur la « communitisation » : écoles, centres de santé, eau et électricité confiés à des comités de village ; tous les sous-centres de santé la même année, 40 % des habitations pour l'électricité en 2007."}
  - {annee: 2023, evenement: "Résolution de l'Assemblée sur la loi forestière fédérale (14 septembre) ; loi municipale réservant un tiers des sièges aux femmes."}
  - {annee: 2024, evenement: "Élections municipales en juin, les premières depuis 2004 ; résolution de l'Assemblée contre la suppression du régime de libre circulation à la frontière du Myanmar."}
  - {annee: 2026, evenement: "Accord du 5 février entre le gouvernement de l'Inde, le gouvernement du Nagaland et l'Eastern Nagaland Peoples' Organisation (ENPO) sur une Autorité territoriale du Nagaland frontalier (FNTA) pour six districts de l'est ; loi adoptée par l'Assemblée le 3 septembre (46 domaines, 40 membres élus)."}
