resume: >-
  Les Naga du Nagaland se répartissent en plusieurs tribus répertoriées. L'article 371A de la Constitution, inséré par le 13e amendement (1962, en vigueur le 1er décembre 1963), soumet à une résolution de l'Assemblée du Nagaland l'application des lois du Parlement sur les pratiques religieuses et sociales des Naga, le droit coutumier, la justice coutumière, la propriété et la cession des terres et de leurs ressources. La loi de 1978 sur les conseils de village confie à des conseils choisis selon la coutume la justice coutumière et l'autorisation des cessions de terres. Une loi adoptée par l'Assemblée le 3 septembre 2026 crée une Autorité territoriale du Nagaland frontalier (FNTA) pour six districts de l'est. D'autres Naga vivent en Assam, en Arunachal Pradesh, au Manipur (voir la fiche « Peuples des collines du Manipur ») et au Myanmar (voir la fiche « Zones auto-administrées du Myanmar ») sous d'autres régimes ; les réserves communautaires du Nagaland relèvent de la fiche « Communautés gestionnaires de réserves communautaires (Inde) ».
