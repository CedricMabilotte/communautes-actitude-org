  education: {valeur: "partiel", note: "Les conseils de village supervisent notamment l'éducation, l'eau, les routes et les forêts du village, loi de 1978, art. 12.", source: "https://www.indiacode.nic.in/bitstream/123456789/11037/1/the_nagaland_village_area_and_area_councils_act_1979.pdf"}
