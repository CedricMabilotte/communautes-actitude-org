resume: >-
  Les Naga du Nagaland se répartissent en plusieurs tribus répertoriées. L'article 371A de la Constitution, inséré par le 13e amendement (1962, en vigueur le 1er décembre 1963), soumet à une résolution de l'Assemblée du Nagaland l'application des lois du Parlement sur les pratiques religieuses et sociales des Naga, le droit coutumier, la justice coutumière, la propriété et la cession des terres et de leurs ressources. La loi de 1978 sur les conseils de village confie à des conseils choisis selon la coutume la justice coutumière et l'autorisation des cessions de terres. D'autres Naga vivent au Manipur, en Assam, en Arunachal Pradesh et au Myanmar sous d'autres régimes.
