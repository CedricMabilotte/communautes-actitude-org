resume: >-
  Depuis la loi 96-07 du 22 mars 1996 sur le transfert de compétences aux collectivités locales, une communauté rurale (aujourd'hui commune) peut créer par délibération du conseil élu une réserve naturelle sur son terroir. La délibération confie certains pouvoirs à une organisation des habitants : comité villageois ou intervillageois, association de pêcheurs, d'éleveurs ou d'écogardes. En 2012, une étude de cas publiée par le secrétariat de la Convention sur la diversité biologique recensait 33 réserves, dont les dates connues de création vont de 1999 à 2010, pour 758 880 hectares. Le Code forestier de 2018 range les réserves naturelles communautaires dans le domaine forestier protégé, dont la gestion est transférée aux collectivités territoriales.
