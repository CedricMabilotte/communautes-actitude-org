reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Stratégie nationale et plan national d'actions pour la biodiversité (août 2015), transmis au secrétariat de la Convention sur la diversité biologique : le réseau d'aires protégées compte 22 réserves naturelles communautaires ; le cinquième rapport national attribue la création de 22 de ces réserves au projet de gestion intégrée des écosystèmes (PGIES).", annee: 2015, source: "https://www.cbd.int/doc/world/sn/sn-nbsap-v2-fr.pdf"}
  - {mecanisme: "registre_apac", detail: "La réserve de Kawawana (commune de Mangagoulack, Ziguinchor), l'une des réserves du régime, est inscrite au registre des aires et territoires conservés par les peuples autochtones et les communautés locales (registre ICCA) ; l'association des pêcheurs y obtient en 2010 des droits de gestion de la zone côtière par des actes signés par le conseil régional et le gouverneur.", annee: 2010, source: "https://www.iccaregistry.org/en/explore/Senegal/kawawana"}
base_nationale:
  - {instrument: "Loi 96-07 du 22 mars 1996 portant transfert de compétences aux régions, aux communes et aux communautés rurales (art. 30, création de réserves par la communauté rurale), citée par l'étude de cas de la Convention sur la diversité biologique", nature: "loi", annee: 1996, source: "https://www.cbd.int/pa/doc/ts64-case-studies/senegal-en.pdf"}
  - {instrument: "Décret 96-1134 du 27 décembre 1996 portant application de la loi de transfert de compétences en matière d'environnement et de gestion des ressources naturelles (art. 2, 48 et 50), cité par l'étude de cas de la Convention sur la diversité biologique", nature: "loi", annee: 1996, source: "https://www.cbd.int/pa/doc/ts64-case-studies/senegal-en.pdf"}
  - {instrument: "Loi 2018-25 du 12 novembre 2018 portant Code forestier (art. 2, définitions 16 et 39 ; art. 9, 13, 16, 17 et 29)", nature: "loi", annee: 2018, source: "https://faolex.fao.org/docs/pdf/Sen191599.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La réserve est créée par délibération du conseil de la communauté rurale (aujourd'hui commune), approuvée par le représentant de l'État ou exécutoire 15 jours après sans refus motivé (loi 96-07, art. 30 ; décret 96-1134, art. 2, 48 et 50) ; la délibération confie certains pouvoirs à une organisation des habitants (comité villageois ou intervillageois, association de pêcheurs, d'éleveurs ou d'écogardes) ; le titulaire juridique reste la commune. Le Code forestier de 2018 maintient les réserves naturelles communautaires dans le domaine forestier protégé, géré par les collectivités territoriales (art. 2, définition 16, et art. 9).", source: "https://www.cbd.int/pa/doc/ts64-case-studies/senegal-en.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les collectivités territoriales peuvent conclure des conventions locales (accords sur les règles d'usage des ressources de leur terroir), approuvées par le représentant de l'État après avis du service des Eaux et Forêts (Code forestier 2018, art. 17) ; les compétences transférées s'exercent selon un plan simple de gestion ou un plan d'aménagement approuvé par le représentant de l'État (art. 16).", source: "https://faolex.fao.org/docs/pdf/Sen191599.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les réserves naturelles communautaires font partie du domaine forestier protégé, dont la gestion est confiée aux collectivités territoriales (Code forestier 2018, art. 2, définition 16, et art. 9) ; les droits d'exploitation des forêts du domaine national appartiennent à l'État (art. 9) et les droits d'usage n'entraînent aucun droit de disposer des lieux (art. 29).", source: "https://faolex.fao.org/docs/pdf/Sen191599.pdf"}
  ressources: {valeur: "partiel", note: "Les populations riveraines disposent de droits d'usage (bois mort, fruits, gommes, miel, parcours du bétail, bois de construction, bois sacré pour le culte) (Code forestier 2018, art. 29) ; l'exploitation des forêts relevant des collectivités territoriales exige l'autorisation du conseil départemental après avis du conseil municipal (art. 13).", source: "https://faolex.fao.org/docs/pdf/Sen191599.pdf"}
