  - {titre: "Cinquième rapport national sur la mise en œuvre de la Convention sur la diversité biologique — Sénégal", url: "https://www.cbd.int/doc/world/sn/sn-nr-05-fr.pdf"}
  - {titre: "Kawawana — registre ICCA", url: "https://www.iccaregistry.org/en/explore/Senegal/kawawana"}
