effectivite: {valeur: "partielle", note: "L'étude de cas de 2012 rapporte que beaucoup d'agents des services techniques ne comptent pas ces réserves parmi les aires protégées, que le sous-préfet de Bandafassi a refusé en 2010 d'approuver la délibération créant la réserve de Dindéfélo, devenue exécutoire après 15 jours, et que la rémunération des écogardes n'est pas assurée de façon durable (32 écogardes bénévoles à Boundou ; ailleurs, écogardes payés par l'État, des projets ou la commune). Le registre ICCA rapporte qu'à Kawawana l'association des pêcheurs applique un zonage et des règles de pêche depuis 2010.", source: "https://www.cbd.int/pa/doc/ts64-case-studies/senegal-en.pdf"}
chronologie:
  - {annee: 1996, evenement: "Loi 96-07 du 22 mars et décret 96-1134 du 27 décembre : transfert aux collectivités locales de compétences en matière d'environnement et de gestion des ressources naturelles."}
  - {annee: 1998, evenement: "Déclaration de l'aire du patrimoine communautaire de Teunguène, île de Yoff (5 juin) ; l'étude de 2012 la range parmi les aires non encore déclarées officiellement."}
  - {annee: 1999, evenement: "Création de la réserve de Malidino Dialimakan (communauté rurale de Dialakoto)."}
  - {annee: 2003, evenement: "Premières délibérations de la série soutenue par le projet de gestion intégrée des écosystèmes (PGIES, PNUD-FEM) dans les régions de Matam, Tambacounda, Kolda, Kédougou, Fatick, Thiès et Louga."}
  - {annee: 2009, evenement: "Réserve intercommunautaire du Boundou (120 000 hectares), créée par quatre communautés rurales de la région de Tambacounda."}
  - {annee: 2010, evenement: "Création des réserves de Dindéfélo (janvier) et de Kawawana (délibération du 20 mars, approbation du gouverneur le 1er juin)."}
  - {annee: 2012, evenement: "Étude de cas publiée par le secrétariat de la Convention sur la diversité biologique : 33 réserves, 758 880 hectares."}
  - {annee: 2015, evenement: "La stratégie nationale pour la biodiversité compte 22 réserves naturelles communautaires dans le réseau d'aires protégées."}
  - {annee: 2018, evenement: "Code forestier (loi 2018-25 du 12 novembre) : réserves naturelles communautaires et réserves naturelles communales dans le domaine forestier protégé géré par les collectivités territoriales."}
fiabilite:
  verifie:
    - "Code forestier de 2018 (texte promulgué, FAOLEX) : définition 16 de l'article 2 (domaine forestier protégé incluant les réserves naturelles communautaires et les réserves naturelles communales), définition 39 (réserve naturelle communale créée par la commune), articles 9, 13, 16, 17 et 29."
    - "Liste de 33 réserves avec communauté rurale, date de délibération et surface, et total de 758 880,42 hectares, dans l'annexe 1 de l'étude de cas publiée par le secrétariat de la Convention sur la diversité biologique (2012)."
    - "Mention de 22 réserves naturelles communautaires dans la stratégie nationale pour la biodiversité d'août 2015 et dans le cinquième rapport national à la Convention."
  non_confirme:
    - "Les textes de la loi 96-07 et du décret 96-1134 n'ont pas été consultés directement : la portée des articles 30, 2, 48 et 50 est rapportée par l'étude de cas de 2012. Le maintien en vigueur de ces textes après le Code général des collectivités locales de 2013, auquel renvoie le Code forestier de 2018 (art. 2, définition 10), n'a pas été vérifié ; le Code forestier de 2018 est le texte en vigueur consulté."
    - "L'étude de cas de 2012 est cosignée par le directeur des Parcs nationaux du Sénégal (Soulèye Ndiaye) : elle n'est pas une source indépendante de l'administration ; seul le registre ICCA (pour Kawawana) l'est."
    - "Le nombre de réserves diffère selon les sources (33 en 2012, 22 en 2015) ; la somme des surfaces site par site (799 649 hectares) ne correspond pas au total publié (758 880 hectares) ; aucune liste officielle à jour n'a été trouvée."
    - "La structure de gestion (comité villageois, association) et ses pouvoirs varient d'une réserve à l'autre et n'ont pas été vérifiés site par site ; l'effet de la réforme de 2013 (communautés rurales devenues communes) sur les délibérations antérieures n'a pas été établi."
sources:
