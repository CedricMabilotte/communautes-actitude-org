droits:
  autogouvernement: {valeur: "reconnu", note: "La Chambre d'assemblée compte un président (Speaker), treize membres élus et le procureur général sans droit de vote (Constitution de 2007, s. 63) ; le gouverneur nomme Premier ministre l'élu recommandé par le parti majoritaire ou, à défaut, l'élu le plus à même de réunir une majorité (s. 52), et le Cabinet formule la politique dans tous les domaines hors des responsabilités du gouverneur (s. 47).", source: "https://www.legislation.gov.uk/uksi/2007/1678/made/data.xht?view=snippet&wrap=true"}
  pouvoir_normatif: {valeur: "partiel", note: "La Législature fait les lois « pour la paix, l'ordre et le bon gouvernement » des îles (Constitution de 2007, s. 71) ; toute loi peut être annulée (désaveu) par la Couronne (s. 80), le gouverneur peut donner effet à un projet de loi rejeté pour respecter une obligation internationale (s. 81) et la Couronne garde le plein pouvoir de légiférer pour le territoire (s. 119).", source: "https://www.legislation.gov.uk/uksi/2007/1678/made/data.xht?view=snippet&wrap=true"}
  justice_propre: {valeur: "partiel", note: "La justice relève de la Cour suprême de la Caraïbe orientale, juridiction régionale siégeant à Sainte-Lucie, avec trois juges de la Haute Cour résidents ; un tribunal de magistrats, un tribunal pour mineurs et une juridiction sommaire siègent dans le territoire ; l'administration des tribunaux revient au gouverneur (Constitution de 2007, s. 60, al. 1 e) et le dernier recours au Conseil privé, à Londres.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/4&l=en&t=pdf"}
  terres: {valeur: "partiel", note: "Les terres de la Couronne sont administrées par le ministre territorial chargé de ce domaine, et toute concession ou cession exige l'approbation préalable du Cabinet (Constitution de 2007, s. 41) ; le préambule mentionne « la propriété de la terre » comme source du sentiment d'appartenance aux îles.", source: "https://www.legislation.gov.uk/uksi/2007/1678/made/data.xht?view=snippet&wrap=true"}
  ressources: {valeur: "partiel", note: "La loi territoriale de 1997 sur la pêche et son règlement de 2003 encadrent la pêche commerciale, de loisir et sportive ; le territoire a adopté en 2015 une loi sur le fonds fiduciaire pour le changement climatique ; le gouvernement territorial a élaboré avec l'appui du PNUD une feuille de route de l'économie bleue 2020-2025.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/4&l=en&t=pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "Le système éducatif relève de la loi territoriale de 2004 sur l'éducation, modifiée en 2014 ; l'enseignement primaire et secondaire est gratuit et obligatoire de 5 à 17 ans, l'enseignement supérieur est gratuit pour les « Virgin Islanders » au H. Lavity Stoutt Community College ; une Commission du service enseignant est prévue par la Constitution (s. 93).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/4&l=en&t=pdf"}
  fiscalite: {valeur: "reconnu", note: "Aucun projet créant ou augmentant un impôt ne peut être examiné sans la recommandation du ministre des Finances (Constitution de 2007, s. 78, al. 2) ; ce ministre présente chaque année à la Chambre d'assemblée les prévisions de recettes et de dépenses et un projet de loi de finances (s. 104).", source: "https://www.legislation.gov.uk/uksi/2007/1678/made/data.xht?view=snippet&wrap=true"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La Constitution définit qui « appartient » aux îles (belonger : naissance, ascendance, adoption, enregistrement, certificat délivré en vertu de la loi de 1977 sur l'immigration et les passeports, mariage) (s. 2, al. 2) ; seuls les belongers votent (s. 68), l'éligibilité est réservée aux « Virgin Islanders » par naissance ou ascendance (s. 65), et l'interdiction des discriminations ne s'applique pas aux lois qui encadrent l'entrée, l'emploi et la résidence des autres personnes (s. 26, al. 4 b).", source: "https://www.legislation.gov.uk/uksi/2007/1678/made/data.xht?view=snippet&wrap=true"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La commission d'enquête de 2022 sur la gouvernance avait conduit le Royaume-Uni à tenir en réserve une ordonnance permettant d'imposer une administration directe ; le 22 septembre 2025, le ministre britannique chargé des territoires d'outre-mer a annoncé sa révocation, en relevant des progrès dans les réformes et des inquiétudes persistantes sur leur mise en œuvre ; le gouverneur doit publier des revues semestrielles de la gouvernance. L'ordonnance est abrogée à compter du 13 mars 2026 (SI 2026/100).", source: "https://bvinews.com/doughty-recommends-lifting-order-in-council/"}
chronologie:
  - {annee: 1648, evenement: "Premier établissement européen permanent, néerlandais."}
  - {annee: 1666, evenement: "Des planteurs britanniques prennent le contrôle des îles, qui deviennent colonie britannique."}
  - {annee: 1967, evenement: "La Constitution instaure un gouvernement ministériel dirigé par un ministre en chef (Chief Minister)."}
  - {annee: 1977, evenement: "Loi sur l'immigration et les passeports : certificats d'appartenance au territoire (s. 16)."}
  - {annee: 2007, evenement: "Constitution des Îles Vierges (SI 2007/1678) : Premier ministre, Cabinet, Chambre d'assemblée et préambule sur la volonté d'autonomie."}
  - {annee: 2022, evenement: "Rapport de la commission d'enquête sur la gouvernance (29 avril) ; ordonnance permettant une administration intérimaire par le gouverneur, adoptée sans mise en vigueur."}
  - {annee: 2023, evenement: "Élections générales du 24 avril."}
  - {annee: 2024, evenement: "Mission de visite du Comité spécial de la décolonisation (26 et 27 août) ; résolution 79/102 de l'Assemblée générale (4 décembre)."}
  - {annee: 2025, evenement: "Le Royaume-Uni annonce le 22 septembre la révocation de l'ordonnance de 2022."}
  - {annee: 2026, evenement: "Abrogation de l'ordonnance de 2022 (SI 2026/100), en vigueur le 13 mars."}
fiabilite:
  verifie: ["Préambule de la Constitution de 2007 (« self-governing people »), définition du belonger (s. 2, al. 2), Chambre d'assemblée (s. 63 et 64), Cabinet (s. 47), nomination du Premier ministre (s. 52), responsabilités du gouverneur (s. 60), pouvoir législatif (s. 71), désaveu (s. 80), pouvoir réservé du gouverneur (s. 81), pouvoir réservé de la Couronne (s. 119), terres de la Couronne (s. 41), finances (s. 78 et 104), sur legislation.gov.uk.", "Abrogation de l'ordonnance SI 2022/627 par SI 2026/100, avec note explicative indiquant que l'ordonnance de 2022 n'est jamais entrée en vigueur.", "Annonce de la révocation de l'ordonnance de 2022 par le ministre britannique chargé des territoires d'outre-mer, lettre du 22 septembre 2025 (BVI News).", "Inscription sur la liste des territoires non autonomes, population, surface, vingt îles habitées, justice, éducation, pêche, budget, suites de la commission d'enquête et résolution 79/102 (A/AC.109/2025/4)."]
  non_confirme: ["Une loi territoriale sur la détention de terres par les non-belongers (licence obligatoire) est citée par plusieurs sources secondaires, mais son texte n'a pas été consulté.", "L'anglais est la langue d'usage selon l'ONU ; aucun texte lui donnant un statut officiel n'a été trouvé.", "La distinction entre belonger et « BVIslander » décrite par des sources secondaires n'a pas été vérifiée sur un texte de loi territorial.", "Les suites données au rapport de 2024 de la Commission de révision constitutionnelle ne sont pas connues."]
