resume: >-
  Population de l'archipel des Îles Vierges britanniques, dans la mer des Caraïbes, à environ 100 km à l'est de Porto Rico. Colonie britannique depuis 1666, le territoire figure sur la liste des territoires non autonomes de l'ONU, avec le Royaume-Uni comme puissance administrante. La Constitution de 2007 affirme dans son préambule que le peuple des îles a exprimé le souhait de devenir un peuple autonome (« self-governing people ») ; elle institue une Chambre d'assemblée élue, un Cabinet dirigé par un Premier ministre (Premier) et réserve au gouverneur nommé par la Couronne les affaires extérieures, la défense, la sécurité intérieure, les conditions d'emploi de la fonction publique et l'administration des tribunaux. Le statut de « belonger » (appartenance au territoire, Constitution, s. 2, al. 2) conditionne le droit de vote.
