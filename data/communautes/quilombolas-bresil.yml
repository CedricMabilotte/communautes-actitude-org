resume: >-
  Le décret 4.887 de 2003 définit les communautés rémanentes de quilombos comme des groupes ethno-raciaux auto-identifiés, dotés d'une trajectoire historique propre et d'une ascendance noire liée à la résistance à l'oppression. L'article 68 des dispositions transitoires de la Constitution de 1988 leur reconnaît la propriété définitive des terres qu'ils occupent. Le même décret organise l'identification et le titre collectif. Le recensement de 2022 compte 1 327 802 quilombolas, dont 12,6 % vivent dans les 494 territoires officiellement délimités.
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Visite au Brésil de la Rapporteuse spéciale sur les formes contemporaines de racisme ; elle demande d'accélérer la démarcation des terres quilombolas et d'appliquer le consentement préalable.", annee: 2024, source: "https://www.ohchr.org/sites/default/files/documents/issues/racism/sr/statements/20240816-eom-stm-brazil-sr-racism.pdf"}
