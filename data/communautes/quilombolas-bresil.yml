resume: >-
  Le décret 4.887 de 2003 définit les communautés rémanentes de quilombos (communautés issues des refuges de personnes réduites en esclavage) comme des groupes ethno-raciaux auto-identifiés, dotés d'une trajectoire historique propre, de relations territoriales spécifiques et d'une ascendance noire présumée liée à la résistance à l'oppression. L'article 68 des dispositions transitoires de la Constitution de 1988 leur reconnaît la propriété définitive des terres qu'ils occupent ; le décret 4.887 organise l'identification et le titre collectif. Le recensement de 2022 compte 1 327 802 quilombolas, dont 12,6 % vivent dans les 494 territoires officiellement délimités. En juin 2026, l'INCRA (Institut national de colonisation et de réforme agraire) recense 428 titres délivrés à 255 territoires. Voir aussi la fiche Communautés de fundo et fecho de pasto (Bahia) : la loi de l'État de Bahia de 2013 qu'elle cite vise aussi les terres publiques occupées par les quilombos.
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Communautés quilombolas d'Alcântara c. Brésil du 21 novembre 2024 : la Cour déclare l'État responsable de la violation du droit à la propriété collective (absence de délimitation, de démarcation et de titre) et du défaut de consultation préalable, libre et éclairée.", annee: 2024, source: "https://corteidh.or.cr/docs/casos/articulos/seriec_548_esp.pdf"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Brésil a ratifié la Convention 169 de l'OIT (dépôt du 25 juillet 2002), promulguée en dernier lieu par le décret 10.088 de 2019 ; le décret 11.786 de 2023 en applique l'obligation de consultation aux communautés quilombolas.", annee: 2002, source: "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/decreto/d10088.htm"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/BRA/CO/18-20, § 51-53) : il recommande de reprendre et d'accélérer la démarcation des terres quilombolas et d'appliquer le consentement préalable, libre et éclairé.", annee: 2022, source: "https://documents.un.org/doc/undoc/gen/g22/607/39/pdf/g2260739.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de visite au Brésil de la Rapporteuse spéciale sur les formes contemporaines de racisme (A/HRC/59/62/Add.1) : elle demande d'accélérer la démarcation des terres quilombolas, d'inclure les droits fonciers dans la politique nationale quilombola et d'appliquer le consentement préalable.", annee: 2025, source: "https://documents.un.org/doc/undoc/gen/g25/063/02/pdf/g2506302.pdf"}
base_nationale:
  - {instrument: "Constitution de la République fédérative du Brésil (1988), dispositions transitoires (ADCT), art. 68", nature: "constitution", annee: 1988, source: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}
  - {instrument: "Décret 4.887 du 20 novembre 2003 sur l'identification et le titre des terres quilombolas", nature: "loi", annee: 2003, source: "https://www.planalto.gov.br/ccivil_03/decreto/2003/d4887.htm"}
  - {instrument: "Tribunal fédéral suprême, ADI 3239 (constitutionnalité du décret 4.887)", nature: "jurisprudence", annee: 2018, source: "https://www.gov.br/mdh/pt-br/noticias_seppir/noticias/2018/02-fevereiro-1/vitoria-no-julgamento-da-adi-3239-se-torna-uma-referencia-historica-dos-direitos-quilombolas-1"}
  - {instrument: "Décret 10.088 du 5 novembre 2019 consolidant la promulgation des conventions de l'OIT, dont la Convention 169", nature: "traite", annee: 2019, source: "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/decreto/d10088.htm"}
  - {instrument: "Décret 11.786 du 20 novembre 2023 instituant la Politique nationale de gestion territoriale et environnementale quilombola (PNGTAQ)", nature: "loi", annee: 2023, source: "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/d11786.htm"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le décret 4.887 de 2003 (art. 17, parágrafo único) prévoit que les communautés sont représentées par leurs associations légalement constituées ; il ne crée pas d'institution publique propre.", source: "https://www.planalto.gov.br/ccivil_03/decreto/2003/d4887.htm"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "L'article 68 de l'ADCT (1988) reconnaît la propriété définitive ; le décret 4.887 de 2003 (art. 17) prévoit un titre collectif inaliénable, imprescriptible et insaisissable, jugé constitutionnel par le Tribunal fédéral suprême en 2018.", source: "https://www.planalto.gov.br/ccivil_03/decreto/2003/d4887.htm"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le décret 11.786 de 2023 (art. 4, IX) inscrit parmi les directives de la politique nationale de gestion territoriale quilombola la garantie du droit à la consultation et au consentement libre, préalable et éclairé selon la Convention 169 de l'OIT, avec recours aux protocoles de consultation propres aux communautés ; le décret 4.887 de 2003 (art. 6) assure leur participation à toutes les phases de la procédure de titre.", source: "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/d11786.htm"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Seuls 12,6 % des quilombolas vivent dans un territoire officiellement délimité (IBGE, 2022). La Rapporteuse spéciale de l'ONU sur le racisme note en 2025 qu'au rythme actuel la démarcation des terres quilombolas prendrait des centaines d'années et que la consultation préalable est déléguée, au Maranhão, aux entreprises intéressées par les projets. La Cour interaméricaine a condamné l'État en 2024 pour l'absence de titre à Alcântara ; l'INCRA y a délivré un premier titre de 45 931 ha sur 78 105 ha le 12 novembre 2025.", source: "https://documents.un.org/doc/undoc/gen/g25/063/02/pdf/g2506302.pdf"}
chronologie:
  - {annee: 1988, evenement: "L'article 68 de l'ADCT reconnaît la propriété des terres occupées par les communautés quilombolas."}
  - {annee: 1995, evenement: "Premier titre quilombola, délivré par l'INCRA à la communauté de Boa Vista (Oriximiná, Pará), le 20 novembre."}
  - {annee: 2002, evenement: "Le Brésil ratifie la Convention 169 de l'OIT (dépôt du 25 juillet)."}
  - {annee: 2003, evenement: "Le décret 4.887 organise la procédure de titre collectif."}
  - {annee: 2018, evenement: "Le Tribunal fédéral suprême rejette l'action ADI 3239 contre le décret 4.887 (8 février)."}
  - {annee: 2022, evenement: "Le recensement de l'IBGE inclut la population quilombola ; le CERD recommande de reprendre la démarcation des terres quilombolas."}
  - {annee: 2023, evenement: "Le décret 11.786 institue la Politique nationale de gestion territoriale et environnementale quilombola (20 novembre)."}
  - {annee: 2024, evenement: "Accord de conciliation de septembre sur le titre de 78 105 ha à Alcântara ; arrêt de la Cour interaméricaine Communautés quilombolas d'Alcântara c. Brésil (21 novembre)."}
  - {annee: 2025, evenement: "L'INCRA délivre aux communautés d'Alcântara un titre de 45 931 ha, soit 59 % du territoire (12 novembre)."}
fiabilite:
  verifie: ["Texte de l'article 68 de l'ADCT.", "Articles 2, 6 et 17 du décret 4.887 de 2003.", "Article 4 du décret 11.786 de 2023.", "Chiffres du recensement de 2022 (IBGE).", "Relevé des titres quilombolas de l'INCRA (mise à jour du 15 juin 2026).", "Dispositif de l'arrêt de la Cour interaméricaine du 21 novembre 2024 ; au § 67, la Cour cite l'ADI 3239 selon laquelle les quilombolas sont des communautés tribales relevant de la Convention 169."]
