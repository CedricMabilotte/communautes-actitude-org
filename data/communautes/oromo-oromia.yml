  non_confirme: ["Population : le rapport statistique final du recensement donnerait 26 993 933 habitants selon l'encyclopédie ; le rapport de synthèse retenu donne 27 158 471.", "Nombre de zones : liste de 2020 ; la ville de Sheger, créée en 2022 autour d'Addis-Abeba, a pu modifier le découpage de la zone spéciale entourant Finfinne.", "Langue de travail régionale et langue de l'enseignement primaire : attestées par une encyclopédie, loi régionale non consultée.", "Surface : 353 690 km² ou 353 006,81 km² selon les passages de la même encyclopédie ; le rapport national du recensement de 2007 (Ethiopian Statistics Service) ne donne pas la surface ; aucune valeur retenue.", "Constitution régionale de l'Oromia (adoptée en 1992 selon l'encyclopédie, révisée ensuite), nom du conseil régional (Caffee) et loi fixant la langue de travail : non consultés.", "Statut de l'afaan oromo comme langue de travail fédérale : décision du 29 février 2020 rapportée par Africanews (4 mars 2020), texte non consulté.", "La reconnaissance onusienne vise la catégorie « nations, nationalités et peuples » ; l'Oromia est nommée pour des violations, pas pour son statut.", "Conflit armé avec l'Armée de libération oromo depuis 2018 : non documenté ici par une source ouverte.", "Nombre de villages : non trouvé ; le recensement de 2007 publie la population urbaine de l'Oromia sans publier le nombre de kebeles ou de localités."]
