resume: >-
  Les Oromo forment une « nation, nationalité et peuple » au sens de la Constitution fédérale éthiopienne de 1994, dans le centre, l'ouest et le sud du pays.
  Ils disposent de l'État régional d'Oromia, l'un des neuf États fondateurs de la fédération (art. 47), avec son conseil, son gouvernement, sa constitution et l'afaan oromo (langue oromo) comme langue de travail.
  La Constitution reconnaît un « intérêt particulier » de l'Oromia à Addis-Abeba (Finfinne), ville fédérale enclavée dans son territoire (art. 49(5)).
  Comme les autres nations de la fédération, les Oromo ont un droit constitutionnel à l'autodétermination, sécession comprise (art. 39).
