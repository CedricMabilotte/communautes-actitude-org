resume: >-
  Fiche agrégée : elle couvre les groupes coutumiers (clans, lignages et groupes apparentés) qui détiennent la terre coutumière de Papouasie-Nouvelle-Guinée, soit environ 97 % des terres du pays, et ceux d'entre eux reconnus comme groupes fonciers incorporés (incorporated land groups, ILG, c'est-à-dire des personnes morales créées sur la base d'un groupe coutumier). La loi sur la terre de 1996 définit la terre coutumière comme la terre possédée par des citoyens ou des communautés de citoyens en vertu de droits issus de la coutume, et interdit de la céder autrement qu'à des citoyens selon la coutume (art. 132). La loi sur l'incorporation des groupes fonciers de 1974 (chap. 147) permet au Registraire de reconnaître un groupe coutumier comme personne morale pouvant détenir, gérer et exploiter la terre selon sa constitution et la coutume, avec une autorité propre de règlement des différends internes. Les amendements de 2009, en vigueur depuis 2012, ont durci la procédure (liste des membres, croquis des limites, comité de gestion avec au moins deux femmes) et ouvert l'enregistrement volontaire de la terre de clan ; environ 1 600 ILG ont été reconnus depuis 2012, dont moins de 130 ont obtenu un titre enregistré.
