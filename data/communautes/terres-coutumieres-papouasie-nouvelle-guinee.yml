effectivite: {valeur: "contestee", note: "Dans Kawira v Bone [2017] PGNC 164, la Cour nationale constate que de nombreux groupes sont incorporés sans l'accord de l'ensemble du clan ou sous-clan et qu'en pratique les amendements de 2009 n'ont pas changé la situation (ACT NOW, 2019) ; des baux spéciaux agricoles et commerciaux (SABL, baux d'une durée allant jusqu'à 99 ans), dans lesquels des groupes incorporés interviennent comme bailleurs ou comme destinataires des loyers, ont été accordés sur plus de 5 millions d'hectares, environ 12 % des terres coutumières (ACT NOW). En 2026, moins de 130 des quelque 1 600 groupes reconnus depuis 2012 avaient obtenu un titre enregistré (Filer, Devpolicy).", source: "https://api.actnowpng.org/documents/371/ILG_Paper_June_2019_AunwZjk.pdf"}
chronologie:
  - {annee: 1973, evenement: "Rapport de la Commission d'enquête sur les questions foncières (CILM), qui recommande l'enregistrement de titres de groupe."}
  - {annee: 1974, evenement: "Loi sur l'incorporation des groupes fonciers : les groupes coutumiers peuvent devenir personnes morales pour détenir et gérer la terre."}
  - {annee: 1975, evenement: "Constitution de l'indépendance : la coutume fait partie du droit sous-jacent (annexe 2.1)."}
  - {annee: 1991, evenement: "Loi forestière : les accords de gestion forestière passent par les groupes incorporés."}
  - {annee: 1996, evenement: "Loi sur la terre n° 45 : la terre coutumière ne peut être cédée qu'à des citoyens selon la coutume (art. 132)."}
  - {annee: 2009, evenement: "Amendements à la loi sur l'incorporation des groupes fonciers et à la loi sur l'enregistrement foncier (« registered clan land »), sur recommandation de la Commission de réforme constitutionnelle et législative (2008)."}
  - {annee: 2012, evenement: "Entrée en vigueur des amendements de 2009 le 1er mars ; les groupes antérieurs doivent demander une nouvelle incorporation."}
  - {annee: 2013, evenement: "Rapport de la Commission d'enquête sur les baux spéciaux agricoles et commerciaux (SABL)."}
  - {annee: 2025, evenement: "Consultations nationales de la Commission parlementaire spéciale sur la terre coutumière et la réforme foncière."}
  - {annee: 2026, evenement: "Projet de loi sur la tenure coutumière (Customary Land Tenure Bill) : autorité de la terre coutumière, registre national des clans, abrogation des amendements de 2009 ; adoption par le Parlement en mars 2026 selon une source, statut de certification non confirmé."}
fiabilite:
  verifie: ["Texte consolidé de la loi de 1974 (chap. 147), art. 1, 2, 5, 8, 11 à 15, 19 à 25 (FAOLEX, version antérieure aux amendements de 2009).", "Texte de la loi sur la terre de 1996, art. 2 (définition de la terre coutumière), 7, 9 à 12 et 132 (FAOLEX).", "Annexe 2.1 et art. 53 (5) (d) de la Constitution (Constitute Project, version de 2016).", "97 % des terres en terre coutumière non enregistrée, entrée en vigueur des amendements de 2009 le 1er mars 2012 (avis au Journal officiel du 20 février 2012), contenu des amendements (liste des membres, actes de naissance, croquis des limites, comité de six à dix membres dont deux femmes, quorum de 60 %), arrêt Kawira v Bone [2017] PGNC 164 : ACT NOW, A Critique of Incorporated Land Groups in Papua New Guinea (26 juin 2019).", "Environ 1 600 groupes reconnus depuis 2012, moins de 130 titres enregistrés, contenu du projet de loi de 2026 : C. Filer, Devpolicy (28 mai 2026)."]
  non_confirme: ["Texte officiel des amendements de 2009 non consulté (PacLII inaccessible) ; leur contenu est repris de l'analyse d'ACT NOW (2019).", "Statut de la loi sur la tenure coutumière de 2026 : A. Donigi (Devpolicy, 1er avril 2026) écrit que le Parlement l'a adoptée à l'unanimité en mars 2026 ; C. Filer (Devpolicy, 28 mai 2026) la traite encore comme un projet dont l'adoption et la certification restent à venir. Si elle entre en vigueur, les groupes incorporés devront se reconstituer en « clans » dans un délai de trois ans.", "Nombre de groupes : environ 2 000 selon le Post-Courier cité par ACT NOW (2019), environ 1 600 selon Filer (2026) ; environ 18 000 groupes antérieurs à 2012, dont la plupart auraient expiré ; prolongation du délai d'expiration jusqu'au 28 février 2022 rapportée par ACT NOW sans texte vérifié.", "Les articles des lois forestière (1991), sur le pétrole et le gaz (1998) et sur le changement climatique (2015) sont cités d'après ACT NOW, sans consultation du texte officiel.", "Surface : 97 % du territoire selon ACT NOW ; aucune surface officielle en km² n'a été trouvée.", "Le seul document onusien trouvé qui nomme le régime est le sixième rapport national à la CDB (2019), qui le cite parmi les axes de la réforme foncière ; aucune liste officielle publique des groupes incorporés n'a été trouvée, d'où l'absence de tableau des sites."]
