reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la Papouasie-Nouvelle-Guinée à la Convention sur la diversité biologique (2019), p. 56 : parmi les axes du plan stratégique de développement 2010-2030, la réforme foncière vise l'administration de la terre coutumière et le renforcement de l'institution des groupes fonciers incorporés", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/pg-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Constitution de 1975, annexe 2.1 : la coutume est adoptée comme partie du droit sous-jacent (underlying law) ; art. 53 (5) (d) : une prise de possession conforme à la coutume n'est pas une privation injuste de propriété", nature: "constitution", annee: 1975, source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016"}
  - {instrument: "Land Groups Incorporation Act 1974 (chap. 147), art. 1, 5, 8, 11 à 13 et 20 à 25", nature: "loi", annee: 1974, source: "https://faolex.fao.org/docs/pdf/png20852.pdf"}
  - {instrument: "Land Act 1996 (n° 45 de 1996), art. 2 (définition de la terre coutumière), 7, 9 à 12 et 132", nature: "loi", annee: 1996, source: "https://faolex.fao.org/docs/pdf/png20843.pdf"}
  - {instrument: "Land Groups Incorporation (Amendment) Act 2009 et Land Registration (Amendment) Act 2009 (« registered clan land »), en vigueur depuis le 1er mars 2012 (avis publié au Journal officiel du 20 février 2012)", nature: "loi", annee: 2009, source: "https://api.actnowpng.org/documents/371/ILG_Paper_June_2019_AunwZjk.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Registraire peut reconnaître un groupe coutumier comme groupe foncier incorporé (art. 5 de la loi de 1974) ; la constitution du groupe fixe la composition et le mode de désignation de son comité ou organe dirigeant (art. 8 (1) (c)) ; le groupe est une personne morale à succession perpétuelle (art. 11). Le Registraire peut refuser la reconnaissance (art. 5 (4) et (6)) et ordonner la liquidation du groupe (art. 15) ; depuis 2009, le comité de gestion compte six à dix membres dont au moins deux femmes et tient une assemblée générale annuelle (ACT NOW, 2019).", source: "https://faolex.fao.org/docs/pdf/png20852.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La coutume est adoptée comme partie du droit sous-jacent, sauf si elle contredit une loi constitutionnelle ou une loi, ou heurte les principes généraux d'humanité (annexe 2.1 de la Constitution) ; les pouvoirs du groupe s'exercent selon sa constitution et « toute coutume pertinente » (art. 13 (1) de la loi de 1974), et la constitution peut contenir les règles de conduite des affaires du groupe (art. 8 (1) (i)), approuvées par le Registraire.", source: "https://faolex.fao.org/docs/pdf/png20852.pdf"}
  justice_propre: {valeur: "partiel", note: "Chaque groupe doit avoir au moins une autorité de règlement des différends désignée par sa constitution (art. 21 de la loi de 1974) ; elle tranche les différends internes sur les biens, les affaires et l'appartenance au groupe (art. 20), aucun tribunal n'est compétent sauf renvoi (art. 23), et elle statue selon la loi, la constitution et la coutume (art. 24). Le réexamen passe par une autorité ad hoc puis un tribunal de village (art. 25) ; les différends avec des non-membres sont exclus sauf accord.", source: "https://faolex.fao.org/docs/pdf/png20852.pdf"}
  terres: {valeur: "reconnu", note: "La terre coutumière appartient à des citoyens de naissance (automatic citizens) ou à leurs communautés en vertu de droits issus de la coutume (art. 2 de la loi sur la terre de 1996) ; le propriétaire coutumier ne peut la vendre, la louer ni la céder qu'à des citoyens selon la coutume, à peine de nullité, sous réserve des acquisitions par l'État (art. 132, 10 et 11). Le groupe incorporé peut acquérir, détenir et céder la terre coutumière dans la mesure permise par la coutume (art. 13 (2) de la loi de 1974) ; à sa dissolution, la terre revient aux propriétaires coutumiers (art. 19). Le bail-retour (lease-leaseback, art. 11 de la loi de 1996) suspend les droits coutumiers pendant la durée du bail.", source: "https://faolex.fao.org/docs/pdf/png20843.pdf"}
  ressources: {valeur: "partiel", note: "Le groupe incorporé peut utiliser et gérer la terre et en distribuer les produits et profits (art. 13 (2) (c) et (e) de la loi de 1974) ; la loi forestière de 1991 (art. 55, 56 et 60) impose que l'Autorité forestière acquière d'abord les droits sur le bois auprès des propriétaires coutumiers par un accord de gestion forestière avant de les céder à un exploitant ; sous la loi sur le pétrole et le gaz de 1998, les redevances sont versées à l'État (art. 159) et placées dans un fonds fiduciaire géré par l'État, dont les groupes incorporés de la zone du projet sont bénéficiaires (art. 176), selon l'analyse d'ACT NOW (2019).", source: "https://api.actnowpng.org/documents/371/ILG_Paper_June_2019_AunwZjk.pdf"}
  consentement: {valeur: "partiel", note: "L'État n'acquiert la terre coutumière par accord que s'il établit qu'elle n'est pas nécessaire aux propriétaires coutumiers (art. 10 (3) de la loi sur la terre de 1996), mais il peut aussi l'acquérir par voie forcée (art. 7 et 12). La loi forestière de 1991 exige le consentement des groupes incorporés à l'accord de gestion forestière, ou, lorsque l'incorporation est impraticable, le consentement écrit de 75 % des membres adultes des groupes claniques vivant sur la terre (art. 57) ; la loi de 2015 sur la gestion du changement climatique prévoit un consentement libre, préalable et éclairé (art. 87) dont le règlement d'application n'existait pas en 2018, selon ACT NOW (2019).", source: "https://api.actnowpng.org/documents/371/ILG_Paper_June_2019_AunwZjk.pdf"}
