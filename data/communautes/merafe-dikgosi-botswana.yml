resume: >-
  Fiche de régime : elle couvre les communautés que le droit du Botswana reconnaît comme « tribe » (morafe, pluriel merafe, en setswana) ou comme « tribal community », et leurs chefs (kgosi, pluriel dikgosi). La loi Bogosi Act (loi sur la chefferie) n° 9 de 2008, en vigueur depuis le 30 avril 2008, permet au ministre de reconnaître une communauté après l'avoir consultée en kgotla (assemblée coutumière) ; la communauté réunie en kgotla désigne le kgosi, que le ministre reconnaît par avis au Journal officiel, la question étant tranchée par le ministre après enquête d'une commission judiciaire en cas de doute (art. 6 et 9). Le kgosi préside le tribunal coutumier de son ressort et la Constitution institue une chambre consultative des chefs, la Ntlo ya Dikgosi. Les terres coutumières (« tribal land ») sont dévolues aux conseils fonciers (Land Boards) au bénéfice des citoyens du Botswana, et non des communautés (Tribal Land Act n° 1 de 2018, art. 4) ; le gouvernement tient tous les citoyens, hors certains naturalisés, pour autochtones et ne distingue pas de peuple autochtone (Rapporteur spécial, 2010, par. 15). La gestion des ressources naturelles par les villages fait l'objet de la fiche « Fiducies communautaires du Botswana ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de James Anaya sur la situation des peuples autochtones au Botswana (A/HRC/15/37/Add.2, version avancée non éditée du 22 février 2010), par. 10 à 13, 16 et 50 à 53 : il décrit la Bogosi Act, la Ntlo ya Dikgosi, les tribunaux coutumiers et le système de la kgotla, et rapporte des préoccupations selon lesquelles le mode de désignation des membres de la Ntlo ya Dikgosi désavantage les communautés non tswana (par. 51)", annee: 2010, source: "https://www2.ohchr.org/english/issues/indigenous/rapporteur/docs/ReportVisitBotswana.pdf"}
base_nationale:
  - {instrument: "Constitution du Botswana de 1966, art. 15 (4) (c) et (d), 77 à 85 (Ntlo ya Dikgosi) et 88 (2), dans la version modifiée par la loi n° 9 de 2005", nature: "constitution", annee: 1966, source: "https://www.parliament.gov.bw/images/constitution.pdf"}
  - {instrument: "Bogosi Act (loi sur la chefferie), chap. 41:01, loi n° 9 de 2008, art. 2, 3, 6, 9, 13, 17, 18, 20, 22 et 27", nature: "loi", annee: 2008, source: "https://faolex.fao.org/docs/pdf/bot91578.pdf"}
  - {instrument: "Customary Courts Act (loi sur les tribunaux coutumiers), chap. 04:05, art. 2, 7, 8, 9, 11, 12, 13 et 15", nature: "loi", annee: 1968, source: "https://faolex.fao.org/docs/pdf/bot115284.pdf"}
  - {instrument: "Tribal Land Act (loi sur les terres coutumières), chap. 32:02, loi n° 1 de 2018, en vigueur depuis le 20 avril 2022, art. 4 et 7", nature: "loi", annee: 2018, source: "https://botswanalaws.com/consolidated-statutes/principle-legislation/tribal-land"}
droits:
  autogouvernement: {valeur: "partiel", note: "En cas de vacance, la communauté réunie en kgotla sous la présidence du membre qui, selon la coutume, en a la charge en l'absence du kgosi (« senior member of the tribe ») désigne le successeur selon le droit coutumier ou la pratique établie, que le ministre reconnaît par avis au Journal officiel (Bogosi Act 2008, art. 6) ; en cas de doute, le ministre tranche après enquête d'une commission judiciaire (art. 9). Le kgosi convoque la kgotla pour recueillir son avis (art. 17 (c)) mais exécute aussi les instructions du ministre (art. 17 (b) et 20), qui peut le suspendre ou le destituer (art. 13) ; aucun tribunal n'est compétent sur la désignation ou la reconnaissance d'un kgosi (art. 27).", source: "https://faolex.fao.org/docs/pdf/bot91578.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Bogosi Act définit le droit coutumier d'une communauté comme sa loi ou sa coutume, hors ce qui est contraire à la morale, à l'humanité, à la justice naturelle, à la Constitution ou à une loi (art. 2) ; la Constitution admet les lois qui appliquent le droit coutumier aux membres d'une communauté (art. 15 (4) (d)). Aucun texte consulté ne confère aux dikgosi ou à la kgotla un pouvoir d'édicter des normes écrites.", source: "https://faolex.fao.org/docs/pdf/bot91578.pdf"}
  justice_propre: {valeur: "partiel", note: "Le chef peut recommander au ministre la reconnaissance ou la création de tribunaux coutumiers, que le ministre reconnaît ou crée par mandat (warrant) (Customary Courts Act, art. 7) ; ils sont constitués selon le droit coutumier (art. 8), mais le ministre peut en suspendre ou en révoquer les membres (art. 9). Ils appliquent le droit coutumier (art. 15) en matière civile et pénale dans les limites de leur mandat (art. 11 et 12), hors une liste d'infractions et de causes exclues (art. 13) ; au pénal, seules les infractions prévues par le code pénal ou une loi écrite peuvent être poursuivies (art. 12 (6)). Le kgosi préside les affaires selon le mandat de son tribunal (Bogosi Act 2008, art. 17 (e)).", source: "https://faolex.fao.org/docs/pdf/bot115284.pdf"}
  terres: {valeur: "non_etabli", note: "Aucune propriété collective des communautés n'a été trouvée : les droits sur les terres de chaque aire sont dévolus au conseil foncier « in trust for the benefit and advantage of the citizens of Botswana » (Tribal Land Act 2018, art. 4) ; un kgosi ou son représentant (Moemela Kgosi) y siège comme membre de droit (art. 7 (1) (b)).", source: "https://botswanalaws.com/consolidated-statutes/principle-legislation/tribal-land"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le ministre consulte la communauté en kgotla avant de la reconnaître (Bogosi Act 2008, art. 3). L'Assemblée nationale ne peut examiner un projet de loi touchant la désignation, la reconnaissance ou les pouvoirs des dikgosi, les tribunaux coutumiers, le droit coutumier ou l'organisation et la propriété des communautés (« tribal organization or tribal property ») qu'après l'avoir transmis à la Ntlo ya Dikgosi et attendu 30 jours (Constitution, art. 88 (2)) ; cet avis n'est pas contraignant.", source: "https://www.parliament.gov.bw/images/constitution.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La Ntlo ya Dikgosi compte de 33 à 35 membres : les personnes exerçant la fonction de kgosi dans douze zones nommées (dix au minimum), cinq membres nommés par le président et jusqu'à vingt membres choisis par des collèges régionaux de chefs (Constitution, art. 77 et 78). Elle adopte des résolutions sur les projets de loi qui lui sont transmis et peut adresser des représentations au président ou des messages à l'Assemblée nationale (art. 85).", source: "https://www.parliament.gov.bw/images/constitution.pdf"}
  statut_personnel: {valeur: "partiel", note: "La Constitution soustrait à l'interdiction de discrimination les lois sur l'adoption, le mariage, le divorce, les funérailles, la succession et le statut personnel (art. 15 (4) (c)) et celles qui appliquent le droit coutumier aux membres d'une communauté (art. 15 (4) (d)). Le kgosi facilite, après consultation de la communauté selon la coutume, l'intégration des personnes qui veulent s'y établir (Bogosi Act 2008, art. 18).", source: "https://www.parliament.gov.bw/images/constitution.pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial des Nations unies (2010, par. 50 à 53) indique que la gouvernance locale passe par les dikgosi et la kgotla, système d'origine tswana qui peut ne pas correspondre aux structures d'autres communautés, et rapporte des témoignages selon lesquels les consultations en kgotla influent peu sur les décisions de développement. Minority Rights Group relève que les Wayeyi n'ont obtenu la reconnaissance de l'État qu'en 2016 et celle de leur chef en mars 2017.", source: "https://www2.ohchr.org/english/issues/indigenous/rapporteur/docs/ReportVisitBotswana.pdf"}
chronologie:
  - {annee: 1933, evenement: "Loi sur la chefferie (Chieftainship Act) : « chief » et « tribe » définis par référence aux huit communautés tswana (Rapporteur spécial, 2010, par. 10)."}
  - {annee: 1966, evenement: "Indépendance ; la Constitution institue une chambre des chefs (House of Chiefs) consultative de 15 membres, dont les chefs des huit communautés tswana."}
  - {annee: 2001, evenement: "Affaire Kamanakao et autres c. procureur général : la Haute Cour juge discriminatoire l'art. 2 de la loi sur la chefferie (Chieftainship Act) à l'égard des Wayeyi."}
  - {annee: 2005, evenement: "Loi constitutionnelle n° 9 : la chambre devient la Ntlo ya Dikgosi et passe de 15 à 33-35 membres."}
  - {annee: 2008, evenement: "Bogosi Act (loi n° 9), en vigueur le 30 avril : abrogation de la Chieftainship Act, procédure de reconnaissance de nouvelles communautés."}
  - {annee: 2017, evenement: "Reconnaissance officielle du chef des Wayeyi, après la reconnaissance de la communauté en 2016."}
  - {annee: 2022, evenement: "Entrée en vigueur, le 20 avril, de la Tribal Land Act (loi sur les terres coutumières) n° 1 de 2018."}
  - {annee: 2024, evenement: "Rejet en troisième lecture, le 4 septembre, du projet de révision constitutionnelle de 2024, qui portait notamment de cinq à dix les membres de la Ntlo ya Dikgosi nommés par le président."}
