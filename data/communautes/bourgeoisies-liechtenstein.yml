base_nationale:
  - {instrument: "Loi sur les coopératives bourgeoises (Gesetz über die Bürgergenossenschaften, BüGG) du 20 mars 1996, LGBl. 1996 n° 77, version du 1er septembre 2011", nature: "loi", annee: 1996, source: "https://www.gesetze.li/konso/pdf/1996.077"}
  - {instrument: "Loi sur les communes (Gemeindegesetz, GemG) du 20 mars 1996, LGBl. 1996 n° 76, art. 1 al. 3", nature: "loi", annee: 1996, source: "https://www.gesetze.li/konso/pdf/1996.076"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les coopératives règlent et administrent leurs affaires de façon autonome sous la surveillance de l'État (BüGG 1996, art. 14) ; organes propres : assemblée coopérative, organe suprême, comité élu pour quatre ans et réviseurs des comptes (art. 8 à 12).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée coopérative adopte les statuts d'administration et de jouissance (BüGG 1996, art. 9 al. 2 a et art. 14 al. 4) ; ces statuts et leurs modifications sont soumis à l'approbation de la commission de règlement (Regelungskommission), autorité de l'État (art. 17 al. 2 c).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Le bien coopératif (terres, forêts, pâturages, bâtiments) appartient à la coopérative, inscrit au registre foncier après la procédure de règlement (BüGG 1996, art. 19, 23 et 26) ; toute répartition des biens ou du produit des ventes entre les membres est interdite (art. 5 al. 6) ; en cas de vente, la commune a un droit de préemption (priorité d'achat) à la valeur vénale, et en cas de dissolution les biens fonciers reviennent à la commune (art. 9 al. 2 h et k).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  ressources: {valeur: "partiel", note: "La coopérative attribue à ses membres la jouissance du bois et des terres agricoles et d'alpage, selon les statuts, à condition, pour le bois, d'un besoin propre et d'un ménage dans la commune, et, pour les terres, d'une exploitation agricole dans la commune, les statuts pouvant étendre ces conditions aux autres communes du pays (BüGG 1996, art. 5 al. 3 à 5) ; les revenus excédentaires vont à l'entretien de la forêt et des pâturages (art. 2 al. 2) ; la gestion reste sous surveillance de l'État (art. 14 al. 3).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  consentement: {valeur: "partiel", note: "Lors de la procédure de règlement, close par le délai du 13 juin 2004 (art. 30), le partage des biens entre coopérative et commune exigeait l'accord de l'assemblée des bourgeois (Bürgerversammlung) et de l'assemblée communale, puis l'approbation de la commission de règlement (BüGG 1996, art. 21) ; à défaut d'accord après trois ans, chaque partie pouvait demander à la commission de trancher (art. 22).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  langue: {valeur: "non_applicable", note: "Corporation de jouissance de biens fonciers ; la loi de 1996 ne traite pas de langue (BüGG 1996, art. 2).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  education: {valeur: "non_applicable", note: "Corporation de jouissance de biens fonciers ; la loi de 1996 ne lui confie aucune compétence scolaire (BüGG 1996, art. 2).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  fiscalite: {valeur: "partiel", note: "Budget propre arrêté par le comité (BüGG 1996, art. 10 al. 3 d) ; l'assemblée fixe les prestations et taxes dues à la coopérative (art. 9 al. 2 e) ; les frais non couverts sont à la charge des membres en proportion de leur jouissance (art. 7) ; aucun pouvoir d'imposer les non-membres.", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Qualité de membre acquise de plein droit par les bourgeois ayants droit lors de la constitution, puis sur demande par filiation directe, adoption, mariage ou partenariat enregistré avec un membre ; elle est réservée aux citoyens liechtensteinois (Landesbürger) et se perd avec la citoyenneté (BüGG 1996, art. 3 et 4). Elle ne se confond pas avec le droit de cité communal : les étrangers naturalisés n'en sont pas membres de plein droit et ne peuvent être admis que si les statuts le prévoient (rapport de consultation du gouvernement, 25 mars 2025).", source: "https://www.gesetze.li/konso/pdf/1996.077"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Cinq communes sur onze ont une coopérative selon l'Historisches Lexikon (état 2011) ; la loi prévoit que, sans règlement avant le 13 juin 2004, les biens deviennent patrimoine communal sans droit de jouissance (BüGG 1996, art. 30). À Mauren, la coopérative a été fondée le 22 juin 2004 après un vote partagé en 2001 et une décision de la commission de règlement de juillet 2003 ; selon le règlement de 2004, la commune y assure l'essentiel des tâches d'administration (site de la coopérative).", source: "https://historisches-lexikon.li/B%C3%BCrgergenossenschaft"}
chronologie:
  - {annee: 1849, evenement: "Première tentative de séparer les ayants droit au bien des bourgeois de la commune politique, sans suite."}
  - {annee: 1926, evenement: "Deuxième tentative, sans suite."}
  - {annee: 1996, evenement: "Loi du 20 mars 1996 sur les coopératives bourgeoises (LGBl. 1996 n° 77) et loi sur les communes (LGBl. 1996 n° 76)."}
  - {annee: 1997, evenement: "Mauren : l'assemblée communale et l'assemblée des bourgeois ouvrent la procédure de règlement."}
  - {annee: 2003, evenement: "Mauren : la commission de règlement approuve le partage des biens après le refus des habitants en 2001."}
  - {annee: 2004, evenement: "Expiration du délai du 13 juin 2004 ; Balzers, Triesen, Eschen et Mauren ont fondé une coopérative (Mauren : assemblée constitutive du 22 juin 2004)."}
  - {annee: 2010, evenement: "Constitution de la coopérative bourgeoise de Vaduz."}
  - {annee: 2019, evenement: "Motion du 8 avril 2019 « Gleichberechtigung aller Landesbürger*innen in den Gemeinden » au Landtag (parlement)."}
  - {annee: 2025, evenement: "Rapport de consultation du gouvernement du 25 mars 2025 : la réforme du droit de cité communal n'a pas d'effet direct sur la qualité de membre des coopératives."}
fiabilite:
  verifie:
    - "Texte de la loi sur les coopératives bourgeoises, version consolidée au 1er septembre 2011 (gesetze.li), art. 1 à 32."
    - "Renvoi de la loi sur les communes aux dispositions spéciales sur les coopératives bourgeoises (GemG 1996, art. 1 al. 3)."
    - "Liste des coopératives constituées (Balzers, Triesen, Eschen, Mauren jusqu'en 2004 ; Vaduz en 2010) : Historisches Lexikon, article de B. Marquardt, état 2011."
    - "Historique de la coopérative de Mauren, date de fondation (22 juin 2004) et prise en charge de l'administration par la commune : site de la coopérative."
    - "Rapport de consultation du 25 mars 2025 : les coopératives n'existent pas dans toutes les communes ; pas d'effet direct de la réforme sur la qualité de membre ; les étrangers naturalisés ne sont admis que si les statuts le prévoient."
  non_confirme:
    - "Aucune liste officielle des coopératives n'a été trouvée ; la liste repose sur l'Historisches Lexikon (état 2011). Pas de tableau des sites pour cette raison."
    - "Nombre de membres et surface des biens coopératifs : aucun chiffre trouvé."
    - "Nombre de villages : non trouvé."
    - "Vaduz : constitution en 2010, après le délai de 2004, sans source primaire ouverte sur la procédure suivie."
    - "Aucune source onusienne ou régionale ne vise ces coopératives."
