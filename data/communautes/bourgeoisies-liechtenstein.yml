resume: >-
  Fiche agrégée : elle couvre les coopératives bourgeoises (Bürgergenossenschaften), corporations de droit public qui réunissent les anciens ayants droit au « bien des bourgeois » (Bürgernutzen, droit de jouissance des citoyens d'origine de la commune) et sont séparées de la commune politique. La loi du 20 mars 1996 (LGBl. 1996 n° 77) leur confie la gestion du bien coopératif « en continuation des anciens droits et usages » : forêts, terres agricoles, alpages, bâtiments, avec attribution du bois et des terres aux membres. Chaque coopérative est née d'une procédure de règlement (Regelungsverfahren) qui partage les biens entre elle et la commune ; faute de règlement ou de demande de décision avant le 13 juin 2004, les biens tombaient dans le patrimoine communal et les droits de jouissance s'éteignaient (art. 30). Selon l'Historisches Lexikon, Balzers, Triesen, Eschen et Mauren ont fondé une coopérative en 2004 au plus tard, Vaduz en 2010 ; les six autres communes n'en ont pas.
