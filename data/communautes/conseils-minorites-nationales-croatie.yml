resume: >-
  La Constitution croate nomme 22 minorités nationales. La loi constitutionnelle sur les droits des minorités nationales de 2002 leur ouvre des conseils élus tous les quatre ans dans les communes, villes et comtés où la minorité atteint 1,5 % de la population ou compte plus de 200 membres (500 au niveau du comté), et un représentant élu à partir de 100 membres. Ces conseils sont des personnes morales sans but lucratif, financées par les collectivités, qui proposent des mesures et donnent leur avis sur les actes locaux. La loi électorale réserve quatre des huit sièges de minorités au Sabor (Parlement) aux minorités autres que serbe et italienne. Cette fiche regroupe ces 20 minorités ; les Serbes et les Italiens ont chacun une fiche.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Croatie (2021) : la Croatie applique la Convention aux 22 minorités nommées dans le préambule de la Constitution ; § 9 sur les conseils de minorité et la représentation au Parlement.", annee: 2021, source: "https://rm.coe.int/5th-op-croatia-fr/1680a2cb4a"}
  - {mecanisme: "charte_langues_regionales", detail: "Septième rapport périodique de la Croatie sur la Charte européenne des langues régionales ou minoritaires (2023) : la Croatie applique la Charte à sept langues (italien, serbe, hongrois, tchèque, slovaque, ruthène, ukrainien) ; le rapport recense aussi l'usage officiel du tchèque, du hongrois, du ruthène et de l'albanais dans des collectivités locales, et le seuil d'un tiers atteint par la minorité rom à Orehovica.", annee: 2023, source: "https://rm.coe.int/croatiapr7-en/1680aa5f42"}
