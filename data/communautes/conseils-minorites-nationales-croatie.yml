droits:
  autogouvernement: {valeur: "partiel", note: "Conseils de minorité nationale (vijeća, 10 membres en commune, 15 en ville, 25 en comté) élus pour quatre ans là où la minorité atteint 1,5 % de la population ou compte plus de 200 membres (500 en comté), représentant élu à partir de 100 membres, loi constitutionnelle de 2002, art. 24 ; personnes morales sans but lucratif, art. 25 ; coordinations possibles, art. 33 ; droits de proposition et d'information, sans pouvoir de décision, art. 31.", source: "https://www.zakon.hr/z/295/Ustavni-zakon-o-pravima-nacionalnih-manjina"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "L'exécutif de la collectivité doit demander l'avis et les propositions du conseil sur les dispositions des projets d'actes généraux qui règlent les droits et libertés des minorités ; si le conseil estime un acte contraire à la Constitution ou à la loi, il en informe le ministère de l'administration, qui en suspend l'application dans les huit jours s'il partage cette analyse, loi constitutionnelle, art. 32 ; avis, non consentement.", source: "https://www.zakon.hr/z/295/Ustavni-zakon-o-pravima-nacionalnih-manjina"}
  langue: {valeur: "partiel", note: "Usage officiel égal de la langue d'une minorité dans la collectivité où elle forme au moins un tiers de la population ou si le statut local le prévoit, loi constitutionnelle, art. 12 ; en 2023, tchèque à Končanica, Daruvar et Dežanovac, hongrois à Kneževi Vinogradi, Ernestinovo et Tordinci, ruthène à Bogdanovci, albanais (avec le tchèque, le hongrois et le serbe) dans le comté de Bjelovar-Bilogora, et langue de la minorité rom à Orehovica, où celle-ci forme 33,68 % de la population ; la variante (romani ou roumain des Bayash) n'est pas précisée (septième rapport sur la Charte).", source: "https://rm.coe.int/croatiapr7-en/1680aa5f42"}
  education: {valeur: "partiel", note: "Droit des membres de la minorité à l'enseignement dans leur langue et leur écriture, avec des seuils d'effectifs plus bas que pour les classes en croate, une partie propre du programme (langue maternelle, littérature, histoire, géographie, culture) et l'apprentissage obligatoire du croate, loi constitutionnelle de 2002, art. 11 ; écoles dans le cadre d'une loi de l'État, sans maîtrise du système par les conseils.", source: "https://aceproject.org/ero-en/regions/europe/HR/croatia-constitutional-act-on-the-rights-of"}
  fiscalite: {valeur: "partiel", note: "Les collectivités financent le travail des conseils, y compris leurs frais administratifs ; le budget de l'État peut financer leurs programmes, loi constitutionnelle, art. 28 ; le Conseil national des minorités (Savjet) répartit les crédits de l'État, art. 35. Aucun pouvoir fiscal.", source: "https://www.zakon.hr/z/295/Ustavni-zakon-o-pravima-nacionalnih-manjina"}
  representation: {valeur: "reconnu", note: "Cinq à huit députés des minorités au Sabor, loi constitutionnelle, art. 19 ; la loi électorale (art. 17) attribue un siège aux Hongrois, un aux Tchèques et Slovaques ensemble, un aux Albanais, Bosniaques, Monténégrins, Macédoniens et Slovènes ensemble, un aux Autrichiens, Bulgares, Allemands, Polonais, Roms, Roumains, Ruthènes, Russes, Turcs, Ukrainiens, Valaques et Juifs ensemble ; sièges garantis dans les assemblées locales, art. 20.", source: "https://www.zakon.hr/z/355/Zakon-o-izboru-zastupnika-u-Hrvatski-sabor"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En mai 2019, 352 conseils et 108 représentants ont été élus (septième rapport sur la Charte, 2023). Le Comité consultatif de la Convention-cadre juge en 2021 la représentation et la consultation « globalement satisfaisantes », mais relève que « les conseils des minorités régionaux et locaux ne sont pas tous efficaces, leur pouvoir d'intervention étant trop limité et insuffisamment clair », et que les minorités moins nombreuses sont représentées au Parlement par des membres d'une autre minorité.", source: "https://rm.coe.int/5th-op-croatia-fr/1680a2cb4a"}
chronologie:
  - {annee: 2002, evenement: "Loi constitutionnelle sur les droits des minorités nationales (13 décembre) : conseils et représentants de minorité."}
  - {annee: 2010, evenement: "Modifications de la loi constitutionnelle (NN 47/10, 80/10) et de la Constitution, dont le préambule nomme 22 minorités."}
  - {annee: 2019, evenement: "Élections de mai : 352 conseils et 108 représentants élus."}
  - {annee: 2021, evenement: "Recensement : 240 079 membres déclarés des minorités nationales ; cinquième avis du Comité consultatif de la Convention-cadre."}
  - {annee: 2023, evenement: "Septième rapport de la Croatie sur la Charte européenne des langues régionales ou minoritaires."}
