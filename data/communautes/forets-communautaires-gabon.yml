base_nationale:
  - {instrument: "Loi n° 016/01 du 31 décembre 2001 portant Code forestier en République gabonaise, art. 12, 13, 156 à 162, 212, 251 à 261", nature: "loi", annee: 2001, source: "https://faolex.fao.org/docs/pdf/gab29255.pdf"}
  - {instrument: "Décret n° 1028/PR/MEFEPEPN du 1er décembre 2004 fixant les conditions de création des forêts communautaires", nature: "loi", annee: 2004, source: "https://faolex.fao.org/docs/pdf/gab143377.pdf"}
  - {instrument: "Arrêté n° 018/MEF/SG/DGF/DFC du 31 janvier 2013 fixant les procédures d'attribution et de gestion des forêts communautaires", nature: "loi", annee: 2013, source: "https://faolex.fao.org/docs/pdf/gab143378.pdf"}
  - {instrument: "Ordonnance n° 11/2008 du 25 juillet 2008 modifiant et complétant certaines dispositions de la loi n° 16/2001 portant Code forestier, art. 2, 4 et 16 (droits d'usage des communautés locales)", nature: "loi", annee: 2008, source: "https://faolex.fao.org/docs/pdf/gab144592.pdf"}
  - {instrument: "Arrêté n° 106/MFEPRN du 6 mai 2014 portant droit de réservation d'une forêt par une communauté villageoise", nature: "loi", annee: 2014, source: "https://faolex.fao.org/docs/pdf/gab160072.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté villageoise se constitue en entité juridique de gestion ; son assemblée générale choisit les membres du bureau, et la réunion de concertation, présidée par l'autorité administrative locale, adopte les statuts et le règlement intérieur et élit le bureau exécutif et le comité des sages (arrêté n° 018 de 2013, art. 5 et 10 ; décret n° 1028 de 2004, art. 3) ; la gestion reste soumise au contrôle de l'administration des Eaux et Forêts (décret n° 1028, art. 11).", source: "https://faolex.fao.org/docs/pdf/gab143378.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les opérations de gestion, de conservation et d'exercice des droits d'usage coutumiers dans la forêt doivent être conformes au plan simple de gestion (décret n° 1028 de 2004, art. 11) ; la communauté peut élaborer ce plan si elle dispose de l'expertise nécessaire, mais il est approuvé par la Direction générale des forêts et validé par le ministre, le silence gardé deux mois valant validation (arrêté n° 018 de 2013, art. 14 et 15).", source: "https://faolex.fao.org/docs/pdf/gab143378.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Toute forêt est la propriété exclusive de l'État (Code forestier, art. 13) ; le domaine forestier rural est constitué des terres et forêts dont la jouissance est réservée aux communautés villageoises (art. 12) ; la convention de gestion dure le temps d'une rotation (cycle de coupe) et aussi longtemps que les engagements sont respectés (arrêté n° 018 de 2013, art. 17) et peut être suspendue en cas de non-respect du plan simple de gestion (décret n° 1028 de 2004, art. 10) ; une forêt réservée par une communauté est exemptée de toute autre attribution de titre d'exploitation (arrêté n° 106 de 2014, art. 5).", source: "https://faolex.fao.org/docs/pdf/gab29255.pdf"}
  ressources: {valeur: "partiel", note: "L'exploitation est réalisée en régie ou en fermage par les communautés villageoises et les revenus de l'exploitation sont la propriété de la communauté (Code forestier, art. 160 et 161) ; elle est subordonnée à un plan simple de gestion et à un ou plusieurs contrats d'approvisionnement avec des sociétés de transformation locale (art. 158) ; les droits d'usage coutumiers des communautés locales (bois, produits forestiers, chasse et pêche artisanales, agriculture de subsistance) s'exercent librement et gratuitement dans le domaine forestier rural, sous réserve des règlements restrictifs (art. 252, modifié par l'ordonnance n° 11/2008, et art. 253) ; l'ordonnance de 2008 prévoit leur extension par voie réglementaire à des droits d'usage économiques (vente locale, sans intermédiaire, d'une partie de la récolte).", source: "https://faolex.fao.org/docs/pdf/gab29255.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les revenus de l'exploitation de la forêt communautaire sont la propriété de la communauté (Code forestier, art. 161) ; une contribution alimentée par les titulaires de concessions, destinée aux actions de développement d'intérêt collectif des communautés, est gérée par leurs assemblées représentatives (art. 251) ; cette contribution ne vise pas les seules communautés titulaires d'une forêt communautaire.", source: "https://faolex.fao.org/docs/pdf/gab29255.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
