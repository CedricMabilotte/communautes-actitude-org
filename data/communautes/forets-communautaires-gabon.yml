resume: >-
  Fiche agrégée : elle couvre les communautés villageoises qui gèrent une forêt communautaire au Gabon. La loi n° 016/01 du 31 décembre 2001 portant Code forestier (art. 156 à 162) définit la forêt communautaire comme une portion du domaine forestier rural (terres et forêts dont la jouissance est réservée aux communautés villageoises) affectée à une communauté villageoise, qui la gère selon un plan simple de gestion (document qui programme les activités dans la forêt) et l'exploite en régie ou en fermage (par elle-même ou en confiant l'exploitation à un tiers) ; les revenus de l'exploitation sont sa propriété. Le décret n° 1028/PR/MEFEPEPN du 1er décembre 2004 et l'arrêté n° 018/MEF/SG/DGF/DFC du 31 janvier 2013 fixent la procédure : constitution d'une entité juridique de gestion, cartographie participative, réunion de concertation présidée par le préfet ou le sous-préfet, convention provisoire puis convention de gestion signée avec le ministre chargé des Eaux et Forêts. En 2024, la presse compte 85 conventions définitives, 39 conventions provisoires et 45 décisions de réservation.
