effectivite: {valeur: "partielle", note: "Une enquête de Gabonreview (décembre 2023 à février 2024) relève, à côté des 85 conventions définitives, un manque d'information des communautés, des conflits de direction, la superposition avec des permis miniers, l'absence de plan d'affectation des terres, de budget dédié et de présence de l'administration sur le terrain. Dans la couche cartographique « Forêts communautaires » de l'atlas forestier du Gabon (2023), plusieurs forêts portent une observation de superposition avec des permis forestiers.", source: "https://www.gabonreview.com/enquete-la-foresterie-communautaire-une-realite-a-double-facette-au-gabon-et-en-rdc/"}
chronologie:
  - {annee: 2001, evenement: "Loi n° 016/01 du 31 décembre 2001 portant Code forestier : création des forêts communautaires (art. 156 à 162) et des droits d'usage coutumiers (art. 252 à 261)."}
  - {annee: 2004, evenement: "Décret n° 1028/PR/MEFEPEPN du 1er décembre 2004 fixant les conditions de création des forêts communautaires."}
  - {annee: 2008, evenement: "Ordonnance n° 11/2008 du 25 juillet 2008 : les droits d'usage coutumiers sont reconnus aux « communautés locales », définies comme les communautés autochtones et villageoises (art. 4 et 252 modifiés)."}
  - {annee: 2013, evenement: "Arrêté n° 018/MEF/SG/DGF/DFC du 31 janvier 2013 : procédure d'attribution en sept étapes, convention provisoire puis convention de gestion."}
  - {annee: 2014, evenement: "Arrêté n° 106/MFEPRN du 6 mai 2014 : droit de réservation d'une forêt par une communauté villageoise."}
  - {annee: 2023, evenement: "Loi organique n° 039/2023 du 2 novembre 2023 : modification des articles 163, 184, 207, 215, 258 et 275 du Code forestier ; les articles 156 à 162 ne sont pas modifiés."}
  - {annee: 2024, evenement: "85 conventions définitives, 39 conventions provisoires et 45 décisions de réservation, pour plus de 750 000 ha, selon Gabonreview."}
  - {annee: 2026, evenement: "Le 3 avril 2026, le ministre des Eaux et Forêts remet six forêts communautaires, plus de 28 000 ha, à des communautés du Komo-Océan."}
fiabilite:
  verifie:
    - "Articles 12, 13, 156 à 162, 212, 251 à 261 du Code forestier dans le texte publié par FAOLEX."
    - "Articles 1 à 15 du décret n° 1028 de 2004, articles 1 à 20 de l'arrêté n° 018 de 2013 et articles 1 à 12 de l'arrêté n° 106 de 2014 dans les copies publiées par FAOLEX."
    - "Ordonnance n° 11/2008 dans la copie du Journal officiel publiée par FAOLEX : elle modifie les articles 4, 10, 14, 70, 86, 108, 112, 138, 139, 149, 234, 235 et 252 du Code forestier, pas les articles 12, 13, 156 à 162, 251 et 253 ; l'ordonnance n° 006/PR/2002 ne modifie que l'article 81."
    - "Objet de la loi organique n° 039/2023 (articles modifiés) d'après la notice ECOLEX et le texte publié par FAOLEX."
    - "Chiffres de 2024 (85 conventions définitives, 39 provisoires, 45 décisions de réservation, plus de 750 000 ha) dans l'article de Gabonreview du 27 février 2024."
    - "Couche « Forêts communautaires » de l'atlas forestier du Gabon, interrogée le 1er octobre 2026 : 177 entrées, dont 41 « definitif », 39 « provisiore », 66 « encours », 9 « rejete » et 22 sans statut ; le tableau reprend les 80 forêts notées définitives ou provisoires (3 209 km² de superficie administrative)."
  non_confirme:
    - "Le décret n° 1028 de 2004 se dit pris en application de l'article 151 du Code forestier, alors que son en-tête vise l'article 197 et que les forêts communautaires relèvent des articles 156 à 162 ; la copie publiée ne porte pas de date de signature lisible."
    - "Le texte de l'ordonnance n° 008/PR/2010 modifiant et abrogeant certaines dispositions du Code forestier n'a pas été trouvé ; les articles qu'elle touche ne sont pas vérifiés."
    - "Une révision du Code forestier est annoncée ; aucune nouvelle édition n'a été vérifiée. Si un nouveau code est en vigueur, les articles cités peuvent avoir changé."
    - "Les chiffres de 2024 viennent de la presse, sans document du ministère ouvert ; ils diffèrent de la couche cartographique de 2023 (41 forêts notées définitives)."
    - "Les champs de date de la couche cartographique (plan simple de gestion, convention provisoire, convention définitive) sont vides ; la colonne année du tableau reste vide. Les libellés des champs (nom_ass « Nom de l'association », nom_com « Nom communauté ») semblent inversés par rapport aux valeurs (ex. nom_com « CDR », nom_ass « MINDZI », alors que Gabonreview nomme l'association CDR et le village Mindzi) : le tableau donne nom_com suivi de nom_ass entre parenthèses. Trois forêts notées définitives portent l'observation « F.C rejeté pour superposition » avec des permis."
    - "Aucun document de la Convention sur la diversité biologique nommant le régime n'a été trouvé (le cinquième rapport national ne le mentionne pas)."
    - "Population et nombre de villages concernés : aucune source trouvée."
