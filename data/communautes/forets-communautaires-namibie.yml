resume: >-
  Fiche agrégée : elle couvre les communautés qui gèrent une forêt communautaire sur les terres communales de Namibie (terres qui appartiennent à l'État, en fiducie au profit des communautés traditionnelles qui y résident : loi de 2002 sur la réforme des terres communales, art. 17). La loi sur les forêts (Forest Act n° 12 de 2001, art. 15) permet au ministre de conclure, avec l'accord du chef ou de l'autorité traditionnelle, une convention avec un organe qui représente les titulaires de droits sur ces terres, puis de déclarer la zone forêt communautaire au Journal officiel. L'organe devient l'autorité de gestion : il gère et utilise les produits forestiers, contrôle le pâturage, perçoit et conserve des redevances, selon un plan de gestion. Le régime vise les ressources végétales (bois, fruits, griffe du diable, résine) ; tous les résidents de la zone en sont membres. Une source de suivi compte 43 forêts communautaires enregistrées ou en cours, sur environ 72 537 km² dans dix régions du nord du pays.
  La forêt communautaire de Nyae Nyae correspond pour l'essentiel à la conservancy décrite dans la fiche « Ju|'hoansi de Nyae Nyae ».
