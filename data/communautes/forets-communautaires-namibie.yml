reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national de la Namibie à la Convention sur la diversité biologique (mars 2014) : les droits d'usage, sous conditions, des ressources forestières ont été dévolus aux communautés locales par les forêts communautaires en 2001 ; leur nombre passe de 13 à 32 entre 2010 et 2013 et leur superficie de 1 486 km² à plus de 3 000 km².", annee: 2014, source: "https://www.cbd.int/doc/world/na/na-nr-05-en.pdf"}
  - {mecanisme: "registre_apac", detail: "La base mondiale des aires protégées (WDPA, PNUE-WCMC) inscrit 38 sites namibiens sous la désignation nationale « Community Forest », avec le type de gouvernance « communautés locales ».", annee: 2026, source: "https://www.protectedplanet.net/country/NAM"}
base_nationale:
  - {instrument: "Forest Act n° 12 de 2001 (loi sur les forêts), art. 15, 19 et 31 ; entrée en vigueur le 15 août 2002 ; modifiée par le Forest Amendment Act n° 13 de 2005", nature: "loi", annee: 2001, source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  - {instrument: "Communal Land Reform Act n° 5 de 2002 (loi sur la réforme des terres communales), art. 17 : les terres communales appartiennent à l'État, en fiducie au profit des communautés traditionnelles qui y résident", nature: "loi", annee: 2002, source: "https://faolex.fao.org/docs/pdf/nam64022.pdf"}
  - {instrument: "Avis gouvernementaux n° 170 et 171 de 2022 : déclaration des forêts communautaires Ozonahi et Ambrosius Haingura (Journal officiel n° 7828 du 15 juin 2022)", nature: "loi", annee: 2022, source: "https://nacso.org.na/wp-content/uploads/2025/06/Gazette-7828-Jun-2022-Community-Forests.pdf"}
  - {instrument: "Avis gouvernemental n° 274 de 2022 : déclaration de la forêt communautaire Aminuis (Journal officiel n° 7904 du 15 septembre 2022)", nature: "loi", annee: 2022, source: "https://nacso.org.na/wp-content/uploads/2025/06/Gazette-7904-Sep-2022-Community-Forests.pdf"}
  - {instrument: "Avis gouvernemental n° 145 de 2023 : déclaration de la forêt communautaire Otjinene (Journal officiel n° 8089 du 15 mai 2023)", nature: "loi", annee: 2023, source: "https://nacso.org.na/wp-content/uploads/2025/06/Gazette-8089-May-2023-Community-Forests.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La convention désigne l'organe représentant les titulaires de droits sur la terre communale comme autorité de gestion de la forêt communautaire (Forest Act de 2001, art. 15, al. 1 et 2 e) ; le ministre peut révoquer la déclaration si l'autorité ne gère pas selon la convention ou ne représente plus la communauté, et le directeur des forêts peut suspendre la convention (art. 19).", source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La convention confère à l'autorité de gestion le droit d'autoriser des tiers à exercer les droits d'usage et d'« imposer des conditions » à l'utilisation des produits forestiers et des ressources naturelles, sous réserve du plan de gestion (Forest Act de 2001, art. 15, al. 2 d) ; le plan de gestion est inclus dans la convention avec le ministre (art. 15, al. 2 c).", source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La terre communale reste propriété de l'État, en fiducie pour les communautés traditionnelles (loi de 2002 sur la réforme des terres communales, art. 17) ; l'autorité de gestion peut, selon la convention, autoriser le pâturage, l'activité agricole ou toute autre activité licite dans la forêt communautaire (Forest Act de 2001, art. 31) ; la convention garantit aux membres de la terre communale un usage égal de la forêt (art. 15, al. 2 f).", source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  ressources: {valeur: "partiel", note: "La convention confère le droit de gérer et d'utiliser les produits forestiers et les autres ressources naturelles de la forêt et de faire paître les animaux, sous réserve du plan de gestion (Forest Act de 2001, art. 15, al. 2 d) ; l'autorité de gestion peut céder les produits forestiers (art. 31).", source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  consentement: {valeur: "partiel", note: "La convention de forêt communautaire ne peut être conclue qu'avec le consentement du chef ou de l'autorité traditionnelle de la zone, ou de l'autorité habilitée à accorder des droits sur la terre communale (Forest Act de 2001, art. 15, al. 1) ; l'article 15 n'exige pas le consentement des résidents eux-mêmes.", source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'autorité de gestion perçoit et conserve des redevances pour l'utilisation des produits forestiers et des ressources naturelles (Forest Act de 2001, art. 15, al. 2 d) ; la convention prévoit le réinvestissement des recettes de la forêt et l'usage ou la répartition équitable de l'excédent (art. 15, al. 2 g).", source: "https://www.lac.org.na/laws/annoSTAT/Forest%20Act%2012%20of%202001.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une thèse de l'université de Wageningen (Lubilo, 2018) décrit, dans la région du Zambèze, la forêt communautaire de Kwandu, gérée par le même comité élu que la conservancy (zone de gestion communautaire de la faune) qui la recouvre : la concession d'exploitation du bois lui apporte 20 % de revenus supplémentaires ; à Sobbe, un comité distinct gère la forêt ; les autorités traditionnelles pèsent sur les décisions. Le cinquième rapport national de la Namibie à la Convention sur la diversité biologique (2014) relève que de nombreuses conservancies et forêts communautaires doivent encore renforcer leurs capacités de gestion, leur gouvernance, le partage des bénéfices et la reddition de comptes.", source: "https://edepot.wur.nl/446408"}
chronologie:
  - {annee: 2001, evenement: "Adoption du Forest Act n° 12 de 2001 : l'article 15 crée les forêts communautaires sur terre communale."}
  - {annee: 2002, evenement: "Entrée en vigueur de la loi sur les forêts le 15 août 2002."}
  - {annee: 2005, evenement: "Forest Amendment Act n° 13 de 2005."}
  - {annee: 2006, evenement: "Année de désignation inscrite dans la base WDPA pour les douze premières forêts communautaires (dont Bukalo, Kwandu, Mbeyo, Okongo et Uukolonkadhi)."}
  - {annee: 2013, evenement: "32 forêts communautaires, contre 13 en 2010, selon le cinquième rapport national à la Convention sur la diversité biologique."}
  - {annee: 2022, evenement: "Déclaration des forêts communautaires Ozonahi, Ambrosius Haingura et Aminuis au Journal officiel."}
  - {annee: 2023, evenement: "Déclaration de la forêt communautaire Otjinene au Journal officiel."}
fiabilite:
  verifie:
    - "Texte des articles 15, 19 et 31 du Forest Act n° 12 de 2001 dans la version annotée du Legal Assistance Centre (Journal officiel n° 2667 ; entrée en vigueur le 15 août 2002 ; modification de 2005)."
    - "Avis de déclaration des forêts communautaires Ozonahi (321 045 ha), Ambrosius Haingura (31 259 ha), Aminuis (214 213,13 ha) et Otjinene (486 525 ha) aux Journaux officiels n° 7828, 7904 et 8089."
    - "Liste des 38 sites désignés « Community Forest » en Namibie, superficie déclarée et année de statut, dans la base WDPA (Protected Planet)."
    - "Passages sur les forêts communautaires dans le cinquième rapport national de la Namibie à la Convention sur la diversité biologique (mars 2014)."
    - "Article 17 de la loi de 2002 sur la réforme des terres communales (Journal officiel n° 2787, version FAOLEX)."
    - "Passages de la thèse de R. Lubilo (université de Wageningen, 2018) sur la gestion des forêts communautaires de Kwandu et de Sobbe."
    - "43 forêts communautaires enregistrées ou en cours, environ 72 537 km² dans dix régions, constitution et comité de gestion élu, permis de récolte et de pâturage : fiche de Conservation Namibia."
  non_confirme:
    - "La fiche de Conservation Namibia porte la date de publication du 25 septembre 2020 ; on ne sait pas si le compte de 43 forêts a été mis à jour depuis. Le site de la NACSO donne le même compte et « environ 8 % du pays »."
    - "Le tableau réunit 42 forêts (38 de la base WDPA et 4 déclarées en 2022 et 2023) pour une somme de 69 845 km² ; la liste officielle complète des 43 forêts du ministère n'a pas été trouvée et les forêts « en cours » ne sont pas distinguées des forêts déclarées."
    - "L'année de la base WDPA est l'année de statut déclarée, pas forcément la date de l'avis au Journal officiel ; la région des sites WDPA n'est pas publiée sur leurs pages et la colonne subdivision reste vide pour ces lignes."
    - "L'avis de 2022 donne pour Ozonahi 321 045 ha et « 3 204 km² » ; le tableau retient la valeur en hectares (3 210,45 km²)."
    - "Le rapport de 2014 donne « plus de 3 000 km² » pour 32 forêts en 2013, alors que les 32 sites WDPA désignés en 2006 et 2013 totalisent 31 134 km² : les deux sources ne mesurent pas la même chose ou l'une des valeurs est erronée."
    - "L'avis de 2022 sur Aminuis donne 214 213,13 ha dans une phrase dont le sujet grammatical est la circonscription ; le tableau retient cette valeur comme surface de la forêt."
    - "Population et nombre de villages concernés : aucune source trouvée."
