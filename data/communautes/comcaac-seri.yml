  - {instrument: "Ley de Derechos de los Pueblos y Comunidades Indígenas de Sonora (loi n° 82, Boletín Oficial du 16 décembre 2010, art. 3 et 5 modifiés par le décret n° 95 du 6 mars 2023)", nature: "loi", annee: 2010, source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=54c0c561-c5f3-4d4d-b8e2-71747cd184c1"}
