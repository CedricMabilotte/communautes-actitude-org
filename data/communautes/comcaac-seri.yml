droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution du Sonora (art. 1 bis) reconnaît les peuples et communautés autochtones comme « sujetos de derecho público » (sujets de droit public) et leur garantit le droit de décider de leurs formes internes de gouvernement (A I) et d'élire selon leurs systèmes normatifs les autorités de leur gouvernement interne (A III) ; la loi n° 82 de 2010 (art. 12) fait exercer les droits collectifs par les autorités traditionnelles. L'Atlas de l'INPI cite parmi leurs autorités un conseil suprême, le comisariado ejidal (bureau de l'ejido) et un conseil des biens communaux.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=77e40b59-0c63-40b3-a48f-29f0529a617a"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution du Sonora (art. 1 bis A I et II) reconnaît l'application des systèmes normatifs propres, dans le cadre des constitutions fédérale et de l'État.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=77e40b59-0c63-40b3-a48f-29f0529a617a"}
  justice_propre: {valeur: "partiel", note: "La loi n° 82 de 2010 (art. 65 à 67) confie aux autorités traditionnelles les conflits internes sur la tenure individuelle (en conciliation), les infractions administratives et certaines affaires familiales ; leurs décisions valent élément de preuve devant les juges.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=54c0c561-c5f3-4d4d-b8e2-71747cd184c1"}
  terres: {valeur: "reconnu", note: "Résolution présidentielle de 1970 : dotation définitive d'ejido de 91 322 ha au poblado El Desemboque et à son annexe Punta Chueca ; île Tiburón : titres de propriété communale remis le 11 octobre 1999.", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S1665-44202023000200164&lng=es&nrm=iso"}
  ressources: {valeur: "partiel", note: "Le décret du 11 février 1975 (art. 1 à 3) réserve la pêche dans les esteros et baies du littoral de la dotation et de l'île Tiburón aux membres du peuple seri (espèces non réservées) et à leur coopérative (aussi les espèces réservées), sauf la pêche sportive, et impose le libre passage des embarcations ; la loi n° 82 de 2010 (art. 47) reconnaît l'usage préférentiel des ressources naturelles du territoire.", source: "https://dof.gob.mx/nota_detalle.php?codigo=4749758&fecha=11/02/1975"}
  consentement: {valeur: "partiel", note: "La Constitution du Sonora (art. 1 bis A XIII) impose une consultation visant le consentement ; la loi n° 82 de 2010 (art. 49 et 50) exige l'accord préalable des communautés pour les actions touchant leurs ressources et pour la création d'aires naturelles protégées.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=54c0c561-c5f3-4d4d-b8e2-71747cd184c1"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (art. 4, 2003) fait des langues autochtones des langues nationales ayant la même validité que l'espagnol ; l'article septième transitoire de la loi du Sonora de 2010 prescrit sa traduction dans la langue des Konkaak (seri).", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution du Sonora (art. 1 bis A VI) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=77e40b59-0c63-40b3-a48f-29f0529a617a"}
  fiscalite: {valeur: "partiel", note: "La Constitution du Sonora (art. 1 bis B II) prévoit des dotations budgétaires administrées directement par les peuples et communautés.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=77e40b59-0c63-40b3-a48f-29f0529a617a"}
  representation: {valeur: "partiel", note: "La loi n° 82 de 2010 (art. 14) donne aux communes comptant des établissements autochtones un conseiller municipal (regidor étnico) désigné selon les systèmes normatifs propres ; la Constitution du Sonora (art. 1 bis A X) prévoit des représentants auprès des conseils municipaux. Aucun siège réservé au niveau fédéral ou de l'État n'a été trouvé.", source: "https://gestion.api.congresoson.gob.mx/publico/descarga?uuid=54c0c561-c5f3-4d4d-b8e2-71747cd184c1"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Rubio-Mejía et Moreno-Vázquez (2023) documentent de 1985 à 2002 l'occupation de 3 888 puis environ 10 000 ha du territoire par un ranch de chasse privé, malgré des jugements du tribunal agraire de 1993 et 2000, et des incursions de pêcheurs extérieurs dans les eaux réservées ; la Commission nationale des droits humains émet en mai 1999 une recommandation au ministère de l'Environnement pour des permis de chasse délivrés sur ces terres. L'accès maritime est mieux contrôlé après un accord de 2002 avec les pêcheurs de Puerto Libertad. L'Observatoire des conflits miniers d'Amérique latine (OCMAL) relève une concession minière de 200 ha (La Peineta) accordée sans consentement préalable du peuple seri, explorée à partir de 2014 puis arrêtée par un recours en amparo (recours constitutionnel).", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S1665-44202023000200164&lng=es&nrm=iso"}
chronologie:
  - {annee: 1963, evenement: "L'île Tiburón est déclarée zone de réserve naturelle et refuge de la faune sauvage."}
  - {annee: 1970, evenement: "Résolution présidentielle du 12 novembre, publiée le 28 novembre : dotation d'ejido de 91 322 ha à El Desemboque et Punta Chueca."}
  - {annee: 1975, evenement: "Décret du 11 février réservant la pêche des eaux de l'île Tiburón aux membres du peuple seri et à leur coopérative ; création le même jour d'une commission de développement pour ce peuple."}
  - {annee: 1999, evenement: "Remise, le 11 octobre, des titres de biens communaux de l'île Tiburón (environ 120 000 ha)."}
  - {annee: 2010, evenement: "Loi n° 82 du Sonora sur les droits des peuples et communautés autochtones, qui nomme le peuple konkaak (seri)."}
  - {annee: 2025, evenement: "Loi n° 77 du Sonora ajoutant à la Constitution de l'État l'article 1 bis sur la libre détermination et l'autonomie des peuples et communautés autochtones."}
