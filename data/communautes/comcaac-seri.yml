resume: >-
  Les Comcáac, appelés Seris en espagnol, vivent sur la côte du Sonora face à l'île Tiburón, dans le golfe de Californie. Une résolution présidentielle de novembre 1970 leur attribue en ejido (terre collective de droit agraire) 91 322 hectares autour d'El Desemboque et de Punta Chueca. Un décret de février 1975 réserve la pêche dans les esteros (lagunes côtières) et baies du littoral du golfe de Californie et de l'île Tiburón aux membres du peuple seri et à leur coopérative. Le 11 octobre 1999, les titres de propriété communale (propriété collective de droit agraire) de l'île Tiburón, environ 120 000 hectares, sont remis aux Comcáac.
