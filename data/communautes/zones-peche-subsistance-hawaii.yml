  non_confirme: ["Surface des zones : aucune donnée officielle trouvée ; une lettre jointe au dossier de Kīpahulu avance 5,7 milles de côte et 1 650 acres de fonds marins, chiffre non repris ici.", "Population concernée : seule une note d'information de 2023 indique environ 150 habitants à Kīpahulu ; aucun chiffre pour Hā'ena ni Miloli'i.", "Autres propositions en cours (Mo'omomi, Moloka'i, citée par la note d'information de 2023) : statut non vérifié.", "Aucun document de la Convention sur la diversité biologique ni du registre des aires gouvernées par la communauté visant ces zones n'a été trouvé."]
