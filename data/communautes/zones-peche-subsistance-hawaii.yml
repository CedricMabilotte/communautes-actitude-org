  ressources: {valeur: "partiel", note: "Le § 188-22.6 (1994) permet à un groupe communautaire de proposer la désignation d'une zone, avec un plan de gestion (activités, suivi, financement, contrôle) ; dans les zones désignées, les règles limitent les prises et ferment des sous-zones, interdisent la vente des produits de la pêche à Hā'ena (HAR 13-60.8, 2015) et la pêche pour aquarium à Miloli'i (HAR 13-60.10, 2022). Les règles restent adoptées par le département des Terres et Ressources naturelles selon la procédure du chapitre 91 (loi sur la procédure administrative) ; la communauté n'a pas de pouvoir réglementaire propre.", source: "https://data.capitol.hawaii.gov/sessions/session2017/HRS-Chapter-PDF's/HRS_0188.pdf"}
  consentement: {valeur: "partiel", note: "Le § 188-22.9 (2006) oblige le département à consulter « un groupe aussi large que possible » des habitants de l'ahupua'a (division territoriale traditionnelle, de la montagne à la mer) de Hā'ena pour fixer les règles de la zone ; le chapitre 13-60.8 (2015) impose au département de tenir une réunion annoncée publiquement dans l'ahupua'a cinq, dix et vingt ans après son entrée en vigueur pour évaluer la zone et réviser le plan de gestion. Il s'agit d'une consultation, pas d'un consentement.", source: "https://dlnr.hawaii.gov/dar/files/2015/08/ch60.8.pdf"}
