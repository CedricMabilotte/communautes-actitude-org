resume: >-
  Fiche agrégée : elle couvre les zones de pêche de subsistance gérées par la communauté (Community-Based Subsistence Fishing Areas, CBSFA) de l'État d'Hawaï. Une loi de 1994 (Hawaii Revised Statutes, § 188-22.6) permet au département des Terres et Ressources naturelles de désigner de telles zones par règlement « pour réaffirmer et protéger les pratiques de pêche exercées de manière coutumière et traditionnelle à des fins de subsistance, de culture et de religion hawaïennes » ; un groupe communautaire peut lui soumettre une proposition accompagnée d'un plan de gestion. Le législateur a désigné lui-même Miloli'i (2005) et Hā'ena (2006) ; les règles de Hā'ena sont en vigueur depuis 2015, celles de Miloli'i depuis 2022 et celles de Kīpahulu, proposées par l'association Kīpahulu 'Ohana, depuis 2024. Les règles restent adoptées par l'État ; la communauté propose, est consultée et participe au suivi.
