effectivite: {valeur: "non_etablie", note: "Aucune évaluation publique de l'application des règles n'a été trouvée. Pour Kīpahulu, le dossier soumis au conseil des Terres et Ressources naturelles en janvier 2024 fait état de dix ans de concertation menée par Kīpahulu 'Ohana et de 88 témoignages recueillis lors de l'enquête publique de 2023.", source: "https://dlnr.hawaii.gov/wp-content/uploads/2024/01/F-2.pdf"}
chronologie:
  - {annee: 1994, evenement: "Loi créant la procédure de désignation des zones de pêche de subsistance gérées par la communauté (HRS § 188-22.6)."}
  - {annee: 1995, evenement: "Création de l'association Kīpahulu 'Ohana, Maui."}
  - {annee: 2005, evenement: "La loi désigne la zone de gestion des pêches de Miloli'i comme zone de pêche de subsistance (HRS § 188-22.7)."}
  - {annee: 2006, evenement: "La loi désigne la zone de pêche de subsistance de Hā'ena, Kaua'i, et prescrit la consultation des habitants de l'ahupua'a (HRS § 188-22.9)."}
  - {annee: 2015, evenement: "Entrée en vigueur des règles de Hā'ena (HAR 13-60.8), le 14 août."}
  - {annee: 2022, evenement: "Entrée en vigueur des règles de Miloli'i (HAR 13-60.10), le 13 août."}
  - {annee: 2024, evenement: "Entrée en vigueur des règles de Kīpahulu (HAR 13-60.11), le 25 mars."}
