resume: >-
  La Constitution roumaine de 1991, révisée en 2003, garantit aux membres des minorités nationales le droit de préserver leur identité (art. 6) et d'être instruits dans leur langue maternelle (art. 32). Son article 62 attribue un siège de député à l'organisation de chaque minorité qui n'atteint pas le seuil électoral ; la loi électorale de 2015 fixe ce seuil spécial à 5 % du nombre moyen de voix nécessaire pour un mandat. Vingt minorités sont reconnues par leur présence au Conseil des minorités nationales, organe consultatif du gouvernement ; l'appartenance au Conseil, le statut de minorité et l'accès aux sièges réservés sont liés. En 2020, 18 sièges étaient pourvus ainsi : la minorité hongroise est représentée par un parti qui franchit le seuil ordinaire, et les Slovaques et les Tchèques présentent une organisation commune. Là où une minorité dépasse 20 % des habitants d'une commune, sa langue peut être employée devant l'administration locale (Code administratif de 2019, art. 94). Les Hongrois ont leur propre fiche (« Hongrois de Roumanie »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Convention-cadre pour la protection des minorités nationales ratifiée le 11 mai 1995, en vigueur le 1er février 1998 ; cinquième avis du Comité consultatif adopté le 3 avril 2023 : il relève la faible représentation des Roms au Parlement, les défaillances de la procédure d'inscription des associations aux élections et les risques que le seuil de 20 % fait peser sur les droits linguistiques après le recensement.", annee: 2023, source: "https://rm.coe.int/5th-op-romania-fr/1680ac3918"}
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/ROU/CO/16-19), § 9 et 19 : le Comité demande à être informé du sort du projet de loi sur les minorités nationales ; il relève que les personnes appartenant aux minorités nationales, en particulier les Roms, ne peuvent pas toujours s'exprimer dans leur langue à tous les stades de la procédure faute d'interprètes, et recommande d'appliquer la loi n° 304/2004 sur l'organisation judiciaire, qui leur reconnaît le droit de s'exprimer dans leur langue maternelle devant les tribunaux.", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=CERD/C/ROU/CO/16-19&l=en&t=pdf"}
