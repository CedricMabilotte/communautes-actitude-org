resume: >-
  Fiche agrégée limitée au Connecticut et à la Virginie, deux États fédérés qui reconnaissent des nations autochtones et leur réservent des terres, en dehors de la reconnaissance fédérale. Au Connecticut, la loi de 1989 (P.A. 89-368) déclare les Schaghticoke, les Paucatuck Eastern Pequot et les Golden Hill Paugussett « entités autonomes » : elles fixent leurs membres, leur forme de gouvernement et la résidence sur des réserves que l'État détient en fiducie (trust, propriété gérée pour leur compte) à perpétuité. En Virginie, la réserve Mattaponi, dont le statut remonte au traité de Middle Plantation (1677) et que l'Assemblée générale a séparée de la réserve Pamunkey en 1894, est détenue par l'État au profit de la nation, qui en a l'usage. Les Mashantucket Pequot, Mohegan et Pamunkey, reconnus aussi au niveau fédéral, relèvent de la fiche des nations reconnues par l'État fédéral.
