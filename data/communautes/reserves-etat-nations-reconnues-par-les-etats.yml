  - {instrument: "Code de Virginie § 29.1-301 (I) : chasse, piégeage et pêche sans permis pour les personnes résidant sur une réserve et pour les membres des nations reconnues par la Virginie", nature: "loi", annee: null, source: "https://law.lis.virginia.gov/vacode/title29.1/chapter3/section29.1-301/"}
