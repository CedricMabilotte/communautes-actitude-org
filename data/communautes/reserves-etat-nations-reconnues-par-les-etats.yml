  - {instrument: "Connecticut General Statutes § 47-59b : Conseil des affaires autochtones (Indian Affairs Council)", nature: "loi", annee: 1989, source: "https://law.justia.com/codes/connecticut/title-47/chapter-824/section-47-59b/"}
