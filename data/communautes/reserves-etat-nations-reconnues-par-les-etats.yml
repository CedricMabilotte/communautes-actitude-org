reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de mission aux États-Unis de James Anaya (A/HRC/21/47/Add.1) : certains groupes autochtones non reconnus par l'État fédéral ont obtenu une reconnaissance au niveau des États fédérés (§ 3) ; seule la reconnaissance fédérale rend leurs pouvoirs d'autogouvernement effectifs dans l'ordre juridique des États-Unis (§ 56).", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
