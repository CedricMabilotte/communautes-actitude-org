resume: >-
  Les Lickanantay, nommés « Atacameños » par la loi chilienne, vivent dans les villages de l'intérieur de la région d'Antofagasta, autour du salar d'Atacama et du río Loa. La loi 19.253 de 1993 (loi autochtone) les nomme parmi les peuples autochtones du Chili et leur consacre un paragraphe : protection des terres communautaires et des pâturages partagés entre plusieurs communautés (art. 63), propriété des eaux situées sur les terres des communautés (art. 64), et un siège atacameño au conseil national de la Corporation nationale de développement autochtone (CONADI, art. 41). Le décret n° 70 de 1997 crée l'aire de développement autochtone (Área de Desarrollo Indígena, zone où l'administration concentre son action) Atacama La Grande, dans la commune de San Pedro de Atacama. La réserve nationale Los Flamencos est coadministrée par la Corporation nationale forestière (CONAF) avec des communautés lickanantay.
