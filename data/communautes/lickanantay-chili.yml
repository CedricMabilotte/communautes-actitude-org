reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Chili ratifie la Convention 169 de l'OIT le 15 septembre 2008 (en vigueur le 15 septembre 2009) ; la loi 19.253 range les communautés atacameñas parmi les peuples autochtones du pays.", annee: 2008, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial James Anaya sur le Chili (A/HRC/12/34/Add.6, § 30) : il fait état d'informations sur un retard dans la restitution des terres patrimoniales atacameñas (lickanantay) prévue par l'art. 63 de la loi 19.253, avec environ 400 000 ha restitués sur plus de 3 000 000 ha recensés.", annee: 2009, source: "https://documents.un.org/doc/undoc/gen/g09/162/39/pdf/g0916239.pdf"}
base_nationale:
  - {instrument: "Loi 19.253 de 1993 établissant des normes de protection, de promotion et de développement des peuples autochtones et créant la CONADI (art. 1, 9 à 15, 26, 34, 35, 41, 54, 62 à 65), dernière modification par la loi 21.273 de 2020", nature: "loi", annee: 1993, source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  - {instrument: "Décret n° 70 du 10 mars 1997 du ministère de la Planification et de la Coopération (publié le 23 avril 1997) déclarant aire de développement autochtone Atacama La Grande un territoire de la commune de San Pedro de Atacama (art. 26 de la loi 19.253)", nature: "loi", annee: 1997, source: "https://www.bcn.cl/leychile/navegar?idNorma=70826"}
  - {instrument: "Décret suprême n° 50 du 17 octobre 1990 du ministère de l'Agriculture créant la réserve nationale Los Flamencos (73 986,5 ha), coadministrée avec des communautés lickanantay", nature: "loi", annee: 1990, source: "https://www.conaf.cl/parques/reserva-nacional-los-flamencos/"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 19.253 reconnaît la communauté autochtone (comunidad indígena) fondée sur un tronc familial, une autorité traditionnelle, des terres communes ou un village ancien (art. 9) ; elle adopte ses statuts et élit sa direction en assemblée et obtient la personnalité juridique par simple dépôt de l'acte constitutif (art. 10). Ces communautés n'exercent pas de compétences publiques.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La coutume invoquée en justice entre autochtones d'une même ethnie « constituera droit » si elle n'est pas contraire à la Constitution ; en matière pénale, elle peut servir de circonstance exonératoire ou atténuante (art. 54 de la loi 19.253). Les communautés n'édictent pas de normes.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Pour les communautés atacameñas et aymaras, la loi 19.253 (art. 63) impose à la CONADI, lors de la régularisation des titres, de préserver trois formes de propriété : terres individuelles, terres de la communauté et terres patrimoniales de plusieurs communautés (pâturages, bofedales ou zones humides d'altitude, collines, vegas ou prairies humides). Les terres autochtones sont inaliénables, insaisissables et imprescriptibles sauf entre communautés ou personnes autochtones d'une même ethnie, et celles des communautés ne peuvent être louées ni cédées en usage (art. 13). La protection ne s'applique qu'aux terres dont le titre est régularisé.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  ressources: {valeur: "partiel", note: "Les eaux situées sur les terres de la communauté (rivières, canaux, puits, sources) sont la propriété de la communauté, sous réserve des droits inscrits par des tiers selon le Code des eaux ; aucun nouveau droit d'eau ne peut être accordé sur les eaux qui alimentent celles appartenant à plusieurs communautés sans garantir d'abord leur approvisionnement (art. 64, modifié par la loi 21.273 de 2020). Dans les aires protégées situées dans une aire de développement autochtone, la CONAF ou le Service agricole et d'élevage, d'un commun accord avec la CONADI, fixent la participation des communautés (art. 35).", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  consentement: {valeur: "partiel", note: "Les services de l'État doivent « écouter et prendre en compte » l'avis des organisations autochtones sur les questions qui les concernent (art. 34 de la loi 19.253) ; la Convention 169 de l'OIT, en vigueur au Chili depuis 2009, impose la consultation. Aucun texte ne prévoit de consentement.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  langue: {valeur: "partiel", note: "La loi 19.253 (art. 28 a) prévoit l'usage et la conservation des langues autochtones aux côtés de l'espagnol dans les zones de forte densité autochtone, sans statut officiel.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  education: {valeur: "partiel", note: "La CONADI développe, dans les zones de forte densité autochtone, un système d'éducation interculturelle bilingue avec les services de l'État (art. 32 de la loi 19.253) ; il n'est pas administré par les communautés.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le conseil national de la CONADI compte huit représentants autochtones, dont un atacameño, nommés par le président de la République sur proposition des communautés et associations autochtones pour quatre ans (art. 41 d de la loi 19.253). Aucun siège n'est réservé au Congrès.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2009, le Rapporteur spécial de l'ONU fait état d'informations selon lesquelles le délai de trois ans fixé par la loi 19.253 pour restituer les terres patrimoniales atacameñas a expiré en 1996 et environ 400 000 ha ont été restitués sur plus de 3 000 000 ha recensés par le ministère des Biens nationaux ; il signale aussi des pertes de droits d'eau liées à des projets miniers dans le nord du pays.", source: "https://documents.un.org/doc/undoc/gen/g09/162/39/pdf/g0916239.pdf"}
chronologie:
  - {annee: 1990, evenement: "Décret suprême n° 50 créant la réserve nationale Los Flamencos, commune de San Pedro de Atacama."}
  - {annee: 1993, evenement: "Loi 19.253 (publiée le 5 octobre) : reconnaissance des communautés atacameñas, régime des terres et des eaux des art. 62 à 65, siège atacameño à la CONADI."}
  - {annee: 1994, evenement: "Constitution, le 25 septembre, de l'association autochtone Conseil des peuples atacameños."}
  - {annee: 1997, evenement: "Décret n° 70 créant l'aire de développement autochtone Atacama La Grande, commune de San Pedro de Atacama."}
  - {annee: 2002, evenement: "Début de l'administration de la lagune Chaxa (secteur Soncor de la réserve Los Flamencos) par des communautés atacameñas."}
  - {annee: 2008, evenement: "Ratification de la Convention 169 de l'OIT par le Chili (en vigueur en 2009)."}
  - {annee: 2009, evenement: "Rapport du Rapporteur spécial James Anaya sur le Chili : informations sur le retard de restitution des terres patrimoniales atacameñas."}
  - {annee: 2018, evenement: "Le Conseil des peuples atacameños forme un recours en protection contre l'accord Corfo-SQM sur le lithium du salar d'Atacama, faute de consultation ; la cour d'appel le rejette en septembre comme tardif."}
  - {annee: 2019, evenement: "En avril, la Cour suprême rejette le recours du Conseil des peuples atacameños contre l'accord Corfo-SQM."}
  - {annee: 2020, evenement: "Loi 21.273 : modification de l'art. 64 sur les eaux des communautés aymaras et atacameñas."}
