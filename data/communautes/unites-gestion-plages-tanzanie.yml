resume: >-
  Fiche agrégée : elle couvre les communautés de pêche de la Tanzanie continentale organisées en unités de gestion des plages (Beach Management Units, BMU). La loi sur les pêches n° 22 de 2003 (Fisheries Act, chap. 279) définit la BMU comme un groupe d'acteurs d'une communauté de pêche chargé de gérer et de protéger la ressource de sa localité avec l'État, et autorise le directeur des Pêches à conclure avec elle des accords de gestion (art. 18). Le règlement sur les pêches de 2009 (G.N. n° 308) impose à chaque communauté de pêche de former une BMU avec le gouvernement du village, lui donne une assemblée et un comité élus, des règlements internes (by-laws) opposables aux pêcheurs et un avis sur l'immatriculation des bateaux de moins de 11 mètres. Plusieurs BMU qui exploitent les mêmes fonds de pêche se regroupent en aires de gestion halieutique collaborative (Collaborative Fisheries Management Areas, CFMA), dotées de plans de gestion par zone, notamment dans les districts de Mafia et de Kilwa. En 2018, 174 des 274 sites de débarquement du littoral continental avaient une BMU, dont 75 enregistrées ; le cinquième rapport national à la Convention sur la diversité biologique compte 739 BMU dans tout le pays en 2013. Zanzibar relève d'un régime distinct (comités de pêche de shehia).
