reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national de la Tanzanie à la Convention sur la diversité biologique (mars 2014) : il présente les BMU parmi les mesures de gestion du littoral et des rives des lacs, signale l'adoption de lignes directrices sur leur création et leur gestion et compte 739 BMU établies dans le pays en 2013.", annee: 2014, source: "https://www.cbd.int/doc/world/tz/tz-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Fisheries Act (loi sur les pêches) n° 22 de 2003, chap. 279, art. 2 (définitions de « beach management unit » et d'« authorized officer »), 11, 17 (s) et 18 ; applicable à la Tanzanie continentale", nature: "loi", annee: 2003, source: "https://faolex.fao.org/docs/pdf/tan53024.pdf"}
  - {instrument: "Fisheries Regulations (règlement sur les pêches), G.N. n° 308 du 28 août 2009, pris en application de l'art. 57 de la loi, règles 4, 25, 84 et 133 à 136", nature: "loi", annee: 2009, source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  - {instrument: "Fisheries (Amendment) Regulations (règlement modificatif), G.N. n° 492 du 3 juillet 2020 : ajout de la règle 25A sur les coopératives de pêche ; les règles 133 à 136 sur les BMU ne sont pas modifiées", nature: "loi", annee: 2020, source: "https://faolex.fao.org/docs/pdf/tan208268.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les membres de la BMU forment une assemblée qui approuve sa constitution, élit le comité, le président, le secrétaire et le trésorier, adopte les budgets et peut révoquer à la majorité les membres du comité pour violation de la loi, du règlement ou des lignes directrices ; mandat de trois ans renouvelable une fois (règle 133 (5), (13) et (14) du règlement de 2009). La BMU est soumise à un suivi externe annuel par le directeur exécutif du district et à des contrôles inopinés du directeur des Pêches (règle 133 (11) et (12)).", source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La BMU élabore des règlements internes (by-laws) avec le conseil de village (règle 134 (1) (d) du règlement de 2009) ; « chaque pêcheur respecte les règlements internes et les conditions fixés par les BMU dans leur zone » (règle 133 (15)). Ces règlements visent la pêche illégale, le commerce illégal du poisson et la dégradation du milieu dans la zone de la BMU.", source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  justice_propre: {valeur: "partiel", note: "La BMU a pour fonction d'arbitrer les litiges de pêche entre ses membres, entre BMU et entre une BMU et d'autres institutions (règle 134 (1) (i) du règlement de 2009) ; les amendes pour infraction à ses règlements internes sont une de ses ressources (règle 133 (9) (e)).", source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  terres: {valeur: "partiel", note: "La zone de juridiction à terre de chaque BMU est fixée d'un commun accord entre la communauté de pêche, le conseil de village, l'autorité locale et l'État, et peut comprendre plusieurs sites de débarquement (règle 133 (2) et (3) du règlement de 2009) ; le directeur des Pêches, avec les autorités locales, conclut avec les BMU des accords de gestion des sites de débarquement (règle 84 (1)). Aucun texte consulté ne leur confère la propriété de la plage.", source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  ressources: {valeur: "partiel", note: "Le directeur des Pêches peut conclure avec une BMU un accord de gestion d'une pêcherie ou d'une zone, qui fixe l'aire couverte, les mesures de gestion et les règles d'accès des autres pêcheurs (art. 18 de la loi de 2003). La BMU élabore un plan de gestion des pêches conforme aux plans de niveau supérieur et participe à la sélection pour l'octroi des licences de pêche dans sa zone (règle 134 (1) (a) et (g) du règlement de 2009) ; les BMU peuvent s'associer pour la planification et la gestion (règle 133 (10)).", source: "https://faolex.fao.org/docs/pdf/tan53024.pdf"}
  consentement: {valeur: "partiel", note: "Le propriétaire d'un bateau de moins de 11 mètres dépose sa demande d'immatriculation par l'intermédiaire de la BMU ou de l'autorité villageoise, qui donne un avis favorable ou défavorable à l'agent des licences (règle 4 (4) et (5) du règlement de 2009). La loi de 2003 punit le fait de priver sans motif une communauté locale de son accès aux zones de pêche (art. 11 (2)).", source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La BMU ouvre un compte bancaire et peut acquérir des biens ; ses ressources comprennent les cotisations fixées par son assemblée, les redevances d'usage des sites de débarquement, les recettes de marchés attribués par appel d'offres de l'autorité locale, les redevances sur ses biens et les amendes prévues par ses règlements internes (règle 133 (8) et (9) du règlement de 2009). Elle veille au paiement des droits de licence par ses membres à l'agent des pêches de l'autorité locale (règle 134 (1) (h)).", source: "https://faolex.fao.org/docs/pdf/tan171548.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une revue du programme ECOFISH (2022) relève que, sur les 174 sites de débarquement du littoral continental dotés d'une BMU, 75 sont enregistrés, et que la plupart des BMU n'ont pas les moyens de gérer la ressource dans leur zone. Une note de REPOA (2025), fondée sur une enquête de terrain de juin 2025 dans les régions de Tanga, de la Côte et de Lindi et à Unguja (Zanzibar), relève le manque de moyens de l'administration pour suivre les BMU, réduit à des appels téléphoniques, l'absence de règles sur la responsabilité des BMU et des interventions politiques en faveur de contrevenants.", source: "https://repoa.or.tz/wp-content/uploads/2025/12/Sustaining-Tanzanias-Marine-Resources-Opportunities-and-Challenges-for-Strengthening-Co-Management-in-Coastal-Communities_PB-11-September-2025.pdf"}
chronologie:
  - {annee: 2003, evenement: "Loi sur les pêches n° 22 : définition de la BMU et accords de gestion entre le directeur des Pêches et les BMU (art. 18)."}
  - {annee: 2008, evenement: "Premiers plans de gestion des huit aires de gestion halieutique collaborative de Rufiji, Mafia et Kilwa, préparés de 2008 à 2011."}
  - {annee: 2009, evenement: "Règlement sur les pêches (G.N. n° 308 du 28 août) : obligation de former des BMU, assemblée, comité, règlements internes, registre national des BMU."}
  - {annee: 2013, evenement: "739 BMU établies dans le pays, selon le cinquième rapport national à la Convention sur la diversité biologique (2014)."}
  - {annee: 2018, evenement: "Enquête-cadre : 274 sites de débarquement sur le littoral continental, dont 174 avec une BMU et 75 BMU enregistrées."}
  - {annee: 2020, evenement: "Règlement modificatif G.N. n° 492 : ajout des coopératives de pêche (règle 25A), sans modification des règles sur les BMU."}
fiabilite:
  verifie: ["Art. 1 (2), 2, 11, 17 (s), 18 et 30 (b) de la loi sur les pêches de 2003, texte FAOLEX.", "Règles 4 (4) et (5), 25, 84 et 133 à 136 du règlement sur les pêches de 2009 (G.N. n° 308), texte FAOLEX.", "Absence de modification des règles 133 à 136 par le règlement modificatif de 2020 (G.N. n° 492).", "739 BMU établies en 2013 : cinquième rapport national à la CDB (2014).", "174 sites avec BMU, 75 enregistrées, 274 sites et 53 035 pêcheurs sur le littoral continental : revue ECOFISH (2022) citant l'enquête-cadre de 2018.", "Six plans de gestion par zone à Mafia (BK, DOKICHUNDA, JOJIBAKI) et à Kilwa (NYAMANJISOPOJA, SOMAKI, TIM4SI) : revue ECOFISH (2022).", "Huit aires de gestion halieutique collaborative sur 3 750 km² dans le paysage marin Rufiji-Mafia-Kilwa : document de projet WWF 2019-2023."]
  non_confirme: ["Date d'entrée en vigueur de la loi de 2003 (fixée par avis ministériel non consulté) et existence d'une édition révisée postérieure de la loi.", "Les lignes directrices nationales sur les BMU, auxquelles renvoie la règle 133 (1), n'ont pas été consultées.", "Statut juridique des aires de gestion halieutique collaborative : aucun des textes consultés ne les nomme ; la publication de leurs plans de gestion par zone au Journal officiel n'a pas été vérifiée (la revue ECOFISH recommande de publier les plans de gestion des pêches par avis gouvernemental).", "Nombre total de BMU après 2013, y compris sur les lacs Victoria, Tanganyika et Nyasa : aucun chiffre officiel récent trouvé.", "L'année 2018 de l'effectif de 53 035 pêcheurs est déduite de la revue ECOFISH, qui le rattache à « l'enquête-cadre la plus récente » et cite le rapport de l'enquête-cadre de 2018.", "Contenu du règlement modificatif de 2022 (G.N. n° 478B) : texte non consulté.", "Le document de projet WWF compte huit aires de gestion halieutique collaborative ciblées (3 750 km²) mais en mentionne neuf dans la zone tampon du paysage marin.", "Aucune liste officielle des BMU ou des aires de gestion halieutique collaborative n'a été trouvée : pas de tableau des sites."]
