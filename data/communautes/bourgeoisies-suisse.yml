  - {instrument: "Regolamento di applicazione della Legge organica patriziale (RALOP) du canton du Tessin, 11 octobre 1994 (RL 188.110)", nature: "loi", annee: 1994, source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/83"}
  - {instrument: "Legge sulle elezioni patriziali (LElPatr, loi sur les élections patriziales) du canton du Tessin, 10 novembre 2008 (RL 188.200)", nature: "loi", annee: 2008, source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/85"}
  - {instrument: "Gemeindegesetz (GG, loi sur les communes) du canton de Berne, 16 mars 1998 (BSG 170.11), art. 2 et 112 à 122", nature: "loi", annee: 1998, source: "https://www.belex.sites.be.ch/app/de/texts_of_law/170.11"}
  - {instrument: "Loi sur les communes (LCo) du canton du Valais, 5 février 2004 (RS/VS 175.1), art. 1 et 48 à 58", nature: "loi", annee: 2004, source: "https://lex.vs.ch/app/fr/texts_of_law/175.1"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Au Tessin, les organes du patriziato sont l'assemblée des membres ayant le droit de vote, le conseil patrizial là où il existe et le bureau patrizial (ufficio patriziale), élus tous les quatre ans (LOP 1992, art. 64, 65 et 68). En Valais, la commune bourgeoisiale a une assemblée bourgeoisiale et un conseil bourgeoisial de trois à neuf membres (LCo 2004, art. 50). À Berne, les Burgergemeinden sont « les bourgeoisies organisées en communes » (GG 1998, art. 112). Le canton exerce une surveillance de légalité et d'opportunité limitée à l'arbitraire (LOP, art. 130 et 131) et peut se substituer au bureau en cas de carence (art. 138).", source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/82"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée patriziale adopte, modifie et abroge les règlements du patriziato (LOP 1992, art. 68, let. b), qui n'entrent en vigueur qu'après approbation du Conseil d'État (art. 128). Le bureau patrizial inflige des amendes jusqu'à 10 000 francs pour les infractions aux règlements patriziaux, avec recours au Conseil d'État puis au Tribunal cantonal administratif (art. 118 et 121).", source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/82"}
  justice_propre: {valeur: "partiel", note: "Au Tessin, le bureau patrizial inflige des amendes jusqu'à 10 000 francs pour les contraventions aux règlements patriziaux et aux lois dont l'application lui est confiée (LOP 1992, art. 118 et 121) ; sa décision peut être portée devant le Conseil d'État puis devant le Tribunal cantonal administratif (art. 121). Il n'existe pas de juridiction propre.", source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/82"}
  terres: {valeur: "reconnu", note: "Au Tessin, les biens administratifs du patriziato (forêts, alpages, mayens, prés, pâturages, carrières, bâtiments patriziaux) sont inaliénables et ne peuvent être mis en gage (LOP 1992, art. 5, 8 et 16) ; toute aliénation d'immeuble n'est valable qu'après ratification du Conseil d'État (art. 9), et la commune puis le canton disposent d'un droit de préemption en cas de vente à des particuliers de fonds destinés à des fins publiques (art. 10).", source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/82"}
  ressources: {valeur: "partiel", note: "Le patriziato gère ses forêts et biens agricoles et règle les droits de coupe de bois, de litière et de pâture (LOP 1992, art. 6 et 7) ; il verse au plus 10 % du revenu net de chaque coupe à son fonds de réserve forestier (art. 22). La jouissance des biens doit se faire en commun par les membres et les non-membres dans les limites de la loi, et l'usage public est garanti (art. 4, al. 2, et art. 7, al. 1). À Berne, les Burgergemeinden tiennent compte des besoins des communes d'habitants dans l'usage de leur patrimoine (GG 1998, art. 114).", source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/82"}
  consentement: {valeur: "partiel", note: "En Valais, les assemblées bourgeoisiales sont consultées le même jour que les assemblées primaires sur tout projet de fusion de communes municipales, et les autorités bourgeoisiales font rapport au Conseil d'État (LCo 2004, art. 139). À Berne, le patrimoine bourgeoisial affecté à des fins purement bourgeoisiales ne peut être employé à d'autres fins sans l'accord de l'assemblée bourgeoisiale de la commune mixte (GG 1998, art. 120, al. 2).", source: "https://lex.vs.ch/app/fr/texts_of_law/175.1"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'assemblée ou le conseil patrizial approuve chaque année le budget et les comptes (LOP 1992, art. 68, let. d) ; en cas de déficit de la gestion courante, et seulement après usage de la réserve disponible, il peut lever un impôt patrizial réparti à parts égales entre les foyers patriziaux, payable en tout ou partie en travail commun si le règlement le prévoit (art. 20 et 21). Les patriziati sont exonérés de l'impôt immobilier et des impôts sur la fortune et le revenu, sauf pour leurs entreprises forestières (art. 23). Aucune compétence fiscale comparable n'a été trouvée dans les lois de Berne et du Valais consultées.", source: "https://www3.ti.ch/CAN/RLeggi/public/index.php/raccolta-leggi/legge/num/82"}
  representation: {valeur: "non_etabli", note: "En Valais, les communes bourgeoisiales ont droit à une représentation équitable au sein des organismes régionaux, qui regroupent des communes d'une région, dans la mesure où elles démontrent un intérêt (LCo 2004, art. 57) ; aucune représentation garantie au niveau cantonal ou fédéral n'a été trouvée.", source: "https://lex.vs.ch/app/fr/texts_of_law/175.1"}
  statut_personnel: {valeur: "reconnu", note: "La Constitution fédérale permet de déroger à l'égalité entre titulaires de droits de cité pour les droits politiques dans les bourgeoisies et les corporations et la participation à leurs biens, sauf disposition cantonale contraire (Cst. 1999, art. 37, al. 2). À Berne, les Burgergemeinden accordent le droit de cité communal sous la forme du droit de bourgeoisie (GG 1998, art. 112, al. 2, let. a) ; en Valais, la commune bourgeoisiale octroie le droit de bourgeoisie et tient le rôle des bourgeois (LCo 2004, art. 49). Au Tessin, la qualité de patrizio, réservée aux citoyens tessinois, s'acquiert par filiation, par mariage ou par concession de l'assemblée ou du conseil patrizial (LOP 1992, art. 40 à 43).", source: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1999/404/20240303/fr/html/fedlex-data-admin-ch-eli-cc-1999-404-20240303-fr-html-10.html"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Selon le Dictionnaire historique de la Suisse (Basil Sieber, version remaniée en 2005), la bourgeoisie est généralement propriétaire de biens qu'elle administre elle-même ; elle gère des hôpitaux, des maisons de retraite et des bourses d'études, ses ressources viennent du rendement de sa fortune et parfois de l'impôt, et dans quelques cantons elle confère encore le droit de bourgeoisie préalable à la naturalisation. Au Tessin, l'étude stratégique du canton (2020) recense 197 patriziati, dont 56 qualifiés de « fragiles », 109 de « moyens » et 32 de « solides » sur le plan financier, et indique que 68 % d'entre eux ont des difficultés à tenir à jour le registre des patrizi.", source: "https://hls-dhs-dss.ch/fr/articles/026443/"}
chronologie:
