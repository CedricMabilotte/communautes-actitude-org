resume: >-
  Fiche agrégée : elle couvre les bourgeoisies (Bürgergemeinden ou Burgergemeinden en allemand, communes bourgeoisiales en Valais, patriziati au Tessin), collectivités de droit public cantonal qui regroupent les personnes titulaires du droit de cité (appartenance héréditaire) d'une commune, quel que soit leur lieu de domicile. Elles sont nées après 1798, quand la République helvétique a ouvert la commune à tous les habitants : les anciens bourgeois ont conservé à part la propriété des biens communs (forêts, alpages, pâturages). La Constitution fédérale de 1999 (art. 37, al. 2) permet de déroger à l'égalité entre titulaires de droits de cité pour régler les droits politiques dans les bourgeoisies et les corporations et la participation à leurs biens, si la législation cantonale n'en dispose pas autrement. Le régime relève des cantons : au Tessin, la loi organique patriziale du 28 avril 1992 fait du patriziato une corporation de droit public « autonome dans les limites fixées par la Constitution et les lois » ; l'association faîtière nationale représente environ 1 700 bourgeoisies et corporations, propriétaires d'environ 41 % de la forêt suisse.
