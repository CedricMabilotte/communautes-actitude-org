  non_confirme: ["Nombre de villages : non trouvé.", "Nombre total de bourgeoisies en Suisse sans les corporations, nombre de membres et surface possédée : aucune statistique officielle trouvée ; le chiffre de 1 700 inclut les corporations et provient de l'association faîtière, celui de « près de 1 650 » de Wikipédia en allemand.", "La liste des quatorze cantons provient de Wikipédia en allemand ; les lois des cantons autres que Berne, Valais et Tessin n'ont pas été consultées.", "Le tableau des sites ne couvre que le Tessin, seul canton dont une liste officielle a été trouvée ; l'étude stratégique de 2020 compte 197 patriziati contre 198 entités dans la liste en ligne.", "Rôle exact des bourgeoisies dans la naturalisation selon les cantons : établi pour Berne et le Valais par la loi, repris de Wikipédia pour Zoug, Bâle-Ville, Bâle-Campagne, Grisons et Engelberg.", "L'effectivité hors du Tessin repose sur une source historique générale (Dictionnaire historique de la Suisse), sans données récentes par canton.", "Aucun document de l'ONU, de la Convention sur la diversité biologique ou du Conseil de l'Europe visant ce régime n'a été trouvé."]
