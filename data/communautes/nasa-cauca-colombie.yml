resume: >-
  Les Nasa vivent dans des resguardos (territoires autochtones en propriété collective) de plusieurs zones du Cauca (Tierradentro, nord, ouest), dans le sud-ouest de la Colombie. Le Consejo Regional Indígena del Cauca (CRIC, conseil régional autochtone du Cauca) est fondé le 24 février 1971 à Toribío par cinq cabildos (conseils de communauté) et cinq resguardos. La Constitution de 1991 reconnaît les resguardos, les autorités autochtones et une juridiction spéciale autochtone. Le décret-loi 1953 de 2014 permet aux territoires autochtones d'administrer directement des ressources publiques et un système éducatif propre ; le décret-loi 1275 de 2024 leur attribue des compétences environnementales. Le régime général fait l'objet de la fiche « Peuples autochtones des resguardos de Colombie ».
reconnaissance_regionale:
  - {mecanisme: "commission_interamericaine", detail: "Le 10 novembre 2011, la Commission interaméricaine des droits de l'homme demande à la Colombie des mesures conservatoires en faveur du peuple nasa des resguardos de Toribío, San Francisco, Tacueyó et Jambaló (communiqué du CRIC).", annee: 2011, source: "https://www.cric-colombia.org/portal/cauca-otorgan-medidas-cautelares-al-pueblo-nasa-del-norte-del-cauca/"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "La Colombie ratifie la Convention 169 de l'OIT le 7 août 1991.", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
base_nationale:
  - {instrument: "Constitution politique de la Colombie (1991), art. 7, 10, 63, 171, 176, 246, 286, 329 et 330", nature: "constitution", annee: 1991, source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  - {instrument: "Décret-loi 1953 de 2014, régime spécial de fonctionnement des territoires autochtones", nature: "loi", annee: 2014, source: "http://www.secretariasenado.gov.co/senado/basedoc/decreto_1953_2014.html"}
  - {instrument: "Décret-loi 1275 de 2024, compétences environnementales des autorités autochtones (validé sous conditions par l'arrêt C-478 de 2025)", nature: "loi", annee: 2024, source: "https://www.minambiente.gov.co/wp-content/uploads/2024/12/01.-Decreto-1275-de-2024.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les territoires autochtones sont gouvernés par des conseils formés selon les usages et coutumes des communautés (Constitution, art. 330) ; le décret-loi 1953 de 2014 (art. 11) confie leur gouvernement à des conseils ou autres structures de gouvernement propre, dont les désignations sont enregistrées au ministère de l'Intérieur.", source: "http://www.secretariasenado.gov.co/senado/basedoc/decreto_1953_2014.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Les autorités autochtones appliquent leurs propres normes et procédures, à condition qu'elles ne soient pas contraires à la Constitution et aux lois (Constitution, art. 246).", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  justice_propre: {valeur: "reconnu", note: "Les autorités des peuples autochtones exercent des fonctions juridictionnelles dans leur territoire (juridiction spéciale autochtone, Constitution, art. 246) ; la loi de coordination avec le système judiciaire national prévue par cet article n'est pas promulguée à la date de consultation.", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  terres: {valeur: "reconnu", note: "Les terres de resguardo sont inaliénables, imprescriptibles et insaisissables (Constitution, art. 63) ; les resguardos sont une propriété collective non aliénable (art. 329).", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  ressources: {valeur: "partiel", note: "Les conseils veillent à la préservation des ressources naturelles (Constitution, art. 330.5) ; le décret-loi 1275 de 2024 (art. 5 et 6) fait des autorités autochtones des resguardos des autorités environnementales membres du Système national de l'environnement ; l'arrêt C-478 de 2025 de la Cour constitutionnelle valide ces articles mais leur interdit de sanctionner des personnes extérieures aux communautés.", source: "https://www.corteconstitucional.gov.co/relatoria/2025/C-478-25.htm"}
  consentement: {valeur: "partiel", note: "Pour l'exploitation des ressources des territoires autochtones, le gouvernement favorise (« propiciará ») la participation des représentants des communautés (Constitution, art. 330, paragraphe) ; aucun texte lu n'impose un consentement.", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  langue: {valeur: "reconnu", note: "Les langues et dialectes des groupes ethniques sont officiels dans leurs territoires (Constitution, art. 10) ; la langue des Nasa est le nasa yuwe.", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  education: {valeur: "partiel", note: "Le décret-loi 1953 de 2014 (titre III, art. 39 et suivants) organise l'administration du Sistema Educativo Indígena Propio (SEIP, système éducatif autochtone propre) par les territoires autochtones ; la Constitution (art. 10) impose un enseignement bilingue dans les communautés de langue propre.", source: "http://www.secretariasenado.gov.co/senado/basedoc/decreto_1953_2014.html"}
  fiscalite: {valeur: "partiel", note: "Les conseils perçoivent et répartissent leurs ressources (Constitution, art. 330.4) ; le décret-loi 1953 de 2014 (art. 25 et 29) permet aux resguardos de demander au Département national de planification l'administration directe de leur allocation spéciale du Système général de participations.", source: "http://www.secretariasenado.gov.co/senado/basedoc/decreto_1953_2014.html"}
  representation: {valeur: "partiel", note: "Deux sénateurs (Constitution, art. 171) et un représentant (art. 176) sont élus dans des circonscriptions nationales spéciales des communautés autochtones, communes à tous les peuples autochtones.", source: "https://www.constituteproject.org/constitution/Colombia_2015.pdf?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le HCDH recense en 2023 des assassinats d'autorités traditionnelles et de gardes autochtones, notamment dans le peuple nasa (A/HRC/55/23) ; pour 2025, il signale l'usage d'écoles du Cauca par des groupes armés non étatiques pour recruter des élèves nasa et demande à l'État de protéger le peuple nasa, ses territoires et la juridiction autochtone (A/HRC/61/20, § 22 et recommandations).", source: "https://documents.un.org/api/symbol/access?s=A/HRC/61/20&l=en&t=pdf"}
chronologie:
  - {annee: 1971, evenement: "Fondation du Consejo Regional Indígena del Cauca (CRIC) à Toribío."}
  - {annee: 1991, evenement: "Nouvelle Constitution ; ratification de la Convention 169 de l'OIT."}
  - {annee: 2011, evenement: "La Commission interaméricaine des droits de l'homme demande des mesures conservatoires pour les Nasa de Toribío, San Francisco, Tacueyó et Jambaló."}
  - {annee: 2014, evenement: "Le décret-loi 1953 permet le fonctionnement transitoire des territoires autochtones, dans l'attente de la loi organique d'aménagement territorial."}
  - {annee: 2024, evenement: "Le décret-loi 1275 attribue des compétences environnementales aux autorités autochtones."}
  - {annee: 2025, evenement: "La Cour constitutionnelle valide le décret-loi 1275 sous conditions (arrêt C-478 du 26 novembre)."}
  - {annee: 2026, evenement: "Le projet de loi statutaire sur la coordination entre juridiction autochtone et justice nationale est inscrit à l'ordre du jour de la plénière de la Chambre des représentants (16 juin)."}
