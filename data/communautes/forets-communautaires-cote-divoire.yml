effectivite: {valeur: "non_etablie", note: "Une note de ClientEarth (août 2020) relève que les communautés rurales n'ont pas la personnalité juridique en droit ivoirien et ne peuvent posséder une forêt qu'après s'être constituées en organisation dotée de la personnalité morale ; elle signale que les textes d'application du Code forestier étaient alors en cours d'élaboration. Aucune liste ni aucun nombre de forêts communautaires enregistrées n'a été trouvé.", source: "https://www.clientearth.org/media/0djpicht/briefing-propri%C3%A9t%C3%A9-de-l-arbre-et-de-la-for%C3%AAt-cote-d-ivoire.pdf"}
chronologie:
  - {annee: 1998, evenement: "Loi n° 98-750 relative au domaine foncier rural : certificat foncier collectif au nom d'une personne morale ou d'un groupement d'ayants droit."}
  - {annee: 2019, evenement: "Code forestier (loi n° 2019-675 du 23 juillet 2019) : définition de la forêt communautaire et obligation d'enregistrement de toutes les forêts."}
  - {annee: 2019, evenement: "Décret n° 2019-980 du 27 novembre 2019 : coupe libre de bois à usage domestique dans les forêts communautaires ; arrêté n° 861/MINEF/CAB du 13 décembre 2019 sur les plans d'aménagement simplifiés et les plans de gestion."}
  - {annee: 2021, evenement: "Arrêté n° 007/MINEF/CAB du 6 janvier 2021 : procédure d'enregistrement des forêts, dont les forêts communautaires, et registres local et central."}
  - {annee: 2022, evenement: "Décret n° 2022-781 du 12 octobre 2022 : pas d'autorisation pour l'exploitation conforme au plan d'aménagement simplifié ou au plan de gestion ; pas d'agrément pour le propriétaire qui exploite à titre non professionnel."}
  - {annee: 2023, evenement: "Arrêté n° 0511/MINEF/DGFF/DPIF du 19 mai 2023 : pour trois ans, forêts enregistrées dotées d'un plan exclues des périmètres d'exploitation forestière ; accord écrit des propriétaires des forêts non encore enregistrées exigé pour leur exploitation dans ces périmètres."}
fiabilite:
  verifie:
    - "Définition de la forêt communautaire (art. 1) et art. 2, 17, 24, 27, 34, 56 et 58 du Code forestier dans le texte diffusé par le ministère des Eaux et Forêts."
    - "Art. 4, 6, 7 et 8 de l'arrêté n° 007/MINEF/CAB du 6 janvier 2021 (dossier de la forêt communautaire, attestation, registres) dans la copie publiée par FAOLEX."
    - "Art. 5 et 6 du décret n° 2019-980 au Journal officiel du 23 décembre 2019 (copie lexterra.ci) ; art. 4 et 8 du décret n° 2022-781 dans la copie publiée par FAOLEX."
    - "Art. 13 à 15 de l'arrêté n° 861/MINEF/CAB de 2019 et art. 1 à 4 de l'arrêté n° 0511/MINEF/DGFF/DPIF de 2023 dans les copies publiées par FAOLEX."
    - "Art. 8 à 10 de la loi n° 98-750 dans la copie publiée par ClientEarth."
    - "Absence de personnalité juridique des communautés rurales : note de ClientEarth d'août 2020."
  non_confirme:
    - "Aucun texte consulté ne prévoit de consultation ni de consentement de la communauté propriétaire d'une forêt communautaire enregistrée ; l'accord écrit exigé par l'arrêté n° 0511/MINEF/DGFF/DPIF de 2023 ne vise que les forêts non encore enregistrées (art. 1)."
    - "Aucune forêt communautaire enregistrée n'a été identifiée ; nombre de sites, surface, population et villages concernés restent inconnus, et aucun tableau des sites n'est joint."
    - "La copie de la loi n° 98-750 consultée intègre la modification de 2004 (loi n° 2004-412) ; les modifications de 2013 et 2019 n'ont pas été vérifiées pour les art. 8 à 10."
    - "Le sixième rapport national à la Convention sur la diversité biologique (2018) mentionne des « forêts communautaires ou privées » sans viser le régime du Code de 2019 ; il n'a pas été retenu comme reconnaissance onusienne."
    - "La concession de la gestion de forêts du domaine privé de l'État aux communautés rurales (Code, art. 56 ; décret n° 2019-978 du 27 novembre 2019, art. 5 et 6) relève d'un autre régime et n'a pas été analysée ici."
