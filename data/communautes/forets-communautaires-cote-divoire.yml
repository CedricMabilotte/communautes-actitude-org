resume: >-
  Le Code forestier de 2019 (loi n° 2019-675 du 23 juillet 2019) crée la catégorie de forêt communautaire : toute forêt du domaine forestier national appartenant à une communauté donnée et enregistrée en son nom (art. 1). Ces forêts relèvent du domaine forestier des personnes morales de droit privé, c'est-à-dire des organismes privés dotés d'une existence juridique propre, comme une association (art. 24). L'arrêté n° 007/MINEF/CAB du 6 janvier 2021 fixe la procédure d'enregistrement : la communauté prépare le dossier, qui comprend le procès-verbal de la réunion tenue pour constituer la forêt et les pièces de son enregistrement en entité juridique (association ou autre personne morale). Les communautés rurales n'ayant pas la personnalité juridique en droit ivoirien, la propriété suppose cette constitution préalable. Aucune forêt communautaire enregistrée n'a été trouvée dans les sources publiques.
