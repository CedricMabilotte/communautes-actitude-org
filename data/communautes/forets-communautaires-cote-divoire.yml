  - {instrument: "Décret n° 2019-980 du 27 novembre 2019 relatif à l'exploitation forestière dans le domaine forestier national, art. 5 et 6", nature: "loi", annee: 2019, source: "https://lexterra.ci/data/domaine/forestier/Exploitation/2019-11-27%20D2019-980%20Exploitation%20forestiere.pdf"}
  - {instrument: "Décret n° 2022-781 du 12 octobre 2022 déterminant les conditions d'obtention de l'agrément en qualité d'exploitant forestier et de l'autorisation pour l'exploitation forestière, art. 4 et 8", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/ivc217298.pdf"}
