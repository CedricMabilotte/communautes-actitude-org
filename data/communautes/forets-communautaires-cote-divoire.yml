  - {instrument: "Loi n° 98-750 du 23 décembre 1998 relative au domaine foncier rural, art. 8 à 10 (certificat foncier collectif)", nature: "loi", annee: 1998, source: "https://www.clientearth.fr/media/4jjbh5pk/1998-12-23-loi-98-750-du-23-decembre-1998-ext-fr.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le dossier d'enregistrement d'une forêt communautaire est préparé par la communauté et comprend le procès-verbal de la réunion tenue pour constituer la forêt et les pièces justificatives de l'enregistrement de la communauté en entité juridique (arrêté n° 007/MINEF/CAB de 2021, art. 4) ; aucun organe propre à la forêt communautaire n'est défini par les textes, la communauté agit par une personne morale de droit commun.", source: "https://faolex.fao.org/docs/pdf/ivc204797.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire appartient à la communauté et est enregistrée en son nom (Code forestier de 2019, art. 1) ; elle fait partie du domaine forestier des personnes morales de droit privé (art. 24) ; la propriété d'une forêt naturelle revient au propriétaire de la terre (art. 27) ; tout changement d'affectation d'une parcelle enregistrée exige l'autorisation du ministre chargé des forêts (arrêté n° 007/MINEF/CAB de 2021, art. 7). Sur le plan foncier, un certificat foncier collectif peut être établi au nom d'une entité dotée de la personnalité morale ou d'un groupement informel d'ayants droit dûment identifiés (loi n° 98-750 de 1998, art. 8 et 9).", source: "https://eauxetforets.gouv.ci/sites/default/files/communique/le_code_forestier1.pdf"}
  ressources: {valeur: "partiel", note: "La coupe de bois à usage domestique dans les forêts communautaires se fait librement par le propriétaire, dans le respect de la gestion durable et des espèces protégées (décret n° 2019-980, art. 6) ; l'exploitation suit un plan d'aménagement simplifié (forêts de 25 ha et plus) ou un plan de gestion (5 à 25 ha), rédigé par le propriétaire et approuvé pour dix ans, sous le contrôle de l'administration forestière (Code forestier, art. 58 ; arrêté n° 861/MINEF/CAB de 2019, art. 13 à 15) ; l'exploitation conforme à ce plan ne nécessite pas d'autorisation et le propriétaire qui exploite ses produits à titre non professionnel n'a pas besoin d'agrément d'exploitant forestier (décret n° 2022-781, art. 4 et 8) ; les droits d'usage forestier des tiers ne s'appliquent pas aux forêts des personnes morales de droit privé (Code forestier, art. 34) ; pendant une période transitoire de trois ans, les forêts enregistrées dotées, si leur taille l'exige, d'un plan sont exclues des périmètres d'exploitation forestière attribués aux entreprises (arrêté n° 0511/MINEF/DGFF/DPIF de 2023, art. 2).", source: "https://lexterra.ci/data/domaine/forestier/Exploitation/2019-11-27%20D2019-980%20Exploitation%20forestiere.pdf"}
