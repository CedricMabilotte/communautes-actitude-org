resume: >-
  Fiche agrégée : elle couvre les communautés locales qui possèdent et gèrent des baldios, terrains utilisés en commun (pâturage, bois de chauffe, broussailles, cultures, chasse) par les habitants d'un ou plusieurs villages. La Constitution portugaise range les « moyens de production communautaires, possédés et gérés par des communautés locales » dans le secteur coopératif et social (art. 82, al. 4, b). La loi 75/2017 du 17 août fixe le régime : les ayants droit (compartes) élisent une assemblée, un conseil directeur et une commission de contrôle, et les baldios sont hors commerce juridique (ils ne peuvent être appropriés par des tiers, y compris par prescription). Une étude publiée en 2020 dans la revue Silva Lusitana estime leur surface à environ un demi-million d'hectares et indique que 71,6 % des baldios sont cogérés avec l'État.
