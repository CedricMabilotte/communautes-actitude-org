base_nationale:
  - {instrument: "Constitution de la République portugaise, art. 82, al. 4, b (secteur coopératif et social : moyens de production communautaires possédés et gérés par des communautés locales)", nature: "constitution", annee: 1976, source: "https://www.parlamento.pt/Legislacao/Paginas/ConstituicaoRepublicaPortuguesa.aspx"}
  - {instrument: "Loi n° 75/2017 du 17 août, régime applicable aux baldios et aux autres moyens de production communautaires (abroge la loi n° 68/93 du 4 septembre)", nature: "loi", annee: 2017, source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  - {instrument: "Décrets-lois n° 39/76 et n° 40/76 du 19 janvier 1976 (restitution des baldios aux compartes ; annulation des appropriations), remis en vigueur pour les renvois de la loi 75/2017 (art. 58, al. 3)", nature: "loi", annee: 1976, source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les compartes s'organisent en assemblée des compartes (assembleia de compartes), qui élit un conseil directeur (conselho diretivo) de trois à cinq membres et une commission de contrôle (comissão de fiscalização) pour un à quatre ans (loi 75/2017, art. 17, 24, 28 et 30) ; l'usage et l'administration suivent la loi, les usages et coutumes locaux et les décisions de ces organes « démocratiquement élus » (art. 3, al. 3). L'assemblée peut déléguer l'administration à la paroisse civile (freguesia), à la commune ou à un service de l'État, et révoquer cette délégation à tout moment (art. 35). Leur compétence porte sur l'usage et l'administration du baldio (art. 3, al. 3), sans prérogative de puissance publique au-delà de cette gestion.", source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée approuve le règlement intérieur, réglemente l'usage du baldio par les compartes et adopte le plan d'utilisation (loi 75/2017, art. 24, al. 1, d à f) ; elle peut adopter des règlements dans ses compétences s'ils ne sont pas contraires à la loi (art. 24, al. 3). Les plans d'utilisation suivent les règles des plans de gestion forestière (art. 10, al. 2, et art. 11, al. 5).", source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les compartes sont les titulaires des baldios (loi 75/2017, art. 7, al. 1). Les terrains sont hors commerce juridique, ne peuvent être appropriés par des tiers, y compris par prescription acquisitive (usucapião), et ne peuvent être saisis ni hypothéqués (art. 6, al. 2 et 3). Exceptions : sortie du régime communautaire votée à l'unanimité par une assemblée réunissant au moins deux tiers des compartes (art. 38, al. 1, a) ; vente de parcelles limitées pour un intérêt local, décidée par l'assemblée à la majorité des deux tiers (art. 40 et art. 24, al. 2) ; expropriation pour utilité publique (art. 41) ; intégration au domaine public de la paroisse civile après 15 ans d'abandon constaté par un juge (art. 38, al. 2 et 3).", source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  ressources: {valeur: "partiel", note: "Les baldios servent au pâturage, au bois de chauffe, aux broussailles, aux cultures, à la chasse, à la production électrique et à leurs autres potentiels économiques, selon la loi et les usages locaux (loi 75/2017, art. 3, al. 1) ; les compartes ne peuvent être privés des eaux souterraines ou de source du baldio (art. 15). Les recettes ne sont pas distribuables et sont réinvesties, dont au moins 20 % des résultats en réserve (art. 14). Les baldios administrés en association avec l'État le restent jusqu'au terme convenu ou, à défaut, 50 ans après l'entrée en vigueur du décret-loi 39/76, sauf renouvellement voté par l'assemblée ou fin demandée par elle avec trois mois de préavis (art. 46, al. 1 et 4).", source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  consentement: {valeur: "partiel", note: "Avant toute déclaration d'utilité publique, l'entité intéressée doit chercher à acquérir le baldio à l'amiable ; l'assemblée des compartes dispose de 60 jours pour se prononcer, sans droit de veto sur l'expropriation (loi 75/2017, art. 41, al. 3 et 4). Le règlement d'application de la loi exige la consultation préalable des organisations associatives des compartes (art. 55, al. 1).", source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'assemblée vote chaque année le plan d'activités, le budget, les comptes et l'affectation des résultats (loi 75/2017, art. 24, al. 1, k et l). Les communautés locales sont exonérées d'impôt sur les sociétés pour l'exploitation directe des terrains communautaires et d'impôt municipal sur les immeubles (art. 16, al. 1 et 3). Aucun pouvoir fiscal.", source: "https://files.diariodarepublica.pt/1s/2017/08/15800/0472204734.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de l'Institut supérieur d'agronomie (université de Lisbonne) et de l'Institut polytechnique de Bragance, publiée en 2020 dans Silva Lusitana, indique qu'à l'échelle nationale 71,6 % des baldios sont cogérés avec l'État et qu'environ 60 % sont gérés par des conseils directeurs ; sur 776 plans d'utilisation recueillis à l'ICNF (Institut de la conservation de la nature et des forêts), 664 étaient approuvés en 2018 ; la présence moyenne aux assemblées des compartes est de 25 participants.", source: "https://silva-lusitana.edpsciences.org/articles/silu/pdf/2020/02/silu2020282p91.pdf"}
chronologie:
  - {annee: 1936, evenement: "Décret-loi n° 27207 du 16 novembre : des baldios sont soumis au régime forestier ou de réserve."}
  - {annee: 1938, evenement: "Loi n° 1971 du 15 juin : des baldios sont soumis au régime forestier."}
  - {annee: 1939, evenement: "Le relevé des baldios du continent de la Junta de Colonização Interna (office de colonisation intérieure) en recense 7 638, sur 407 544 ha."}
  - {annee: 1954, evenement: "Loi n° 2069 du 24 avril : autre base de la soumission de baldios au régime forestier ou de réserve."}
  - {annee: 1976, evenement: "Décrets-lois n° 39/76 et 40/76 du 19 janvier : restitution des baldios à l'usage et à l'administration des compartes, possible en association avec l'État."}
  - {annee: 1993, evenement: "Loi n° 68/93 du 4 septembre sur les baldios, modifiée en 1997 (loi n° 89/97) et en 2014 (loi n° 72/2014)."}
  - {annee: 2017, evenement: "Loi n° 75/2017 du 17 août : nouveau régime des baldios et des autres moyens de production communautaires."}
fiabilite:
  verifie: ["Art. 82, al. 4, b de la Constitution : texte sur le site de l'Assemblée de la République.", "Définitions, titularité, hors commerce, organes, compétences de l'assemblée, délégation, cession d'exploitation, extinction, expropriation, fiscalité, juridiction des tribunaux de droit commun (art. 1 à 58) : texte de la loi 75/2017 au Diário da República.", "Loi 75/2017 sans modification à ce jour selon la base législative de la PGD de Lisbonne.", "Surface d'environ un demi-million d'hectares, 71,6 % des baldios cogérés avec l'État, 664 plans d'utilisation approuvés sur 776 recueillis (2018), relevé de 1939 (7 638 baldios, 407 544 ha) : article de Skulska, Monteiro et Rego, Silva Lusitana, 28(2), 2020, p. 91-130."]
  non_confirme: ["Nombre total de baldios et de compartes : aucune source officielle trouvée ; la plateforme électronique nationale prévue par l'art. 9 de la loi 75/2017 n'a pas été localisée en ligne, et aucune liste officielle des sites n'a été trouvée (pas de tableau).", "Le relevé de 1939 est connu par l'article de 2020, pas par le document d'origine.", "La surface d'un demi-million d'hectares est une estimation ; elle n'a pas été recoupée sur un document de l'ICNF.", "Aucun document de l'ONU (CDB, registre APAC) ni du Conseil de l'Europe visant les baldios n'a été trouvé.", "Les litiges relèvent des tribunaux de droit commun (loi 75/2017, art. 54) : aucune juridiction propre.", "Nombre de villages : non trouvé.", "Nombre de baldios : seul un sous-ensemble est chiffré (776 plans d'utilisation recueillis à l'ICNF, dont 664 approuvés en 2018), pas le total."]
