resume: >-
  Les Frisons sont la seule minorité nationale à laquelle les Pays-Bas appliquent la Convention-cadre du Conseil de l'Europe, ratifiée en 2005. La loi sur l'usage de la langue frisonne (Wet gebruik Friese taal), en vigueur depuis le 1er janvier 2014, fait du frison et du néerlandais les deux langues officielles de la province de Fryslân. Toute personne peut employer le frison avec les administrations établies dans la province et, si elle y réside, devant le tribunal de Noord-Nederland et la cour d'appel d'Arnhem-Leeuwarden. L'État et la province concluent des accords administratifs périodiques sur la langue et la culture frisonnes ; l'assemblée provinciale fixe, sous réserve d'approbation du ministre, les objectifs d'enseignement du frison à l'école primaire.
