effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2023 un manque persistant d'enseignants qualifiés et un enseignement du frison limité, dans la plupart des cas, à la première année du secondaire (§ 11), des difficultés dans les procédures pénales faute de juges, greffiers et procureurs maîtrisant le frison et d'interprètes (§ 12), et une radiodiffusion publique en frison qui n'est garantie ni par la loi sur les médias ni par la loi sur l'usage du frison, ce qui fragilise le diffuseur régional Omrop Fryslân (§ 13).", source: "https://rm.coe.int/4th-op-netherlands-en/1680ac509f"}
chronologie:
  - {annee: 1995, evenement: "Les Pays-Bas signent la Convention-cadre pour la protection des minorités nationales (1er février)."}
  - {annee: 1998, evenement: "La Charte européenne des langues régionales ou minoritaires entre en vigueur pour les Pays-Bas (1er mars), le frison relevant de la partie III."}
  - {annee: 2005, evenement: "Ratification de la Convention-cadre (16 février), en vigueur le 1er juin ; elle est appliquée aux Frisons."}
  - {annee: 2014, evenement: "Entrée en vigueur de la loi sur l'usage de la langue frisonne (1er janvier) ; la province reçoit la compétence de fixer les objectifs d'enseignement du frison."}
  - {annee: 2019, evenement: "Entrée en vigueur de l'accord administratif État-province sur la langue et la culture frisonnes 2019-2023 (1er janvier)."}
  - {annee: 2023, evenement: "Quatrième avis du Comité consultatif de la Convention-cadre sur les Pays-Bas (3 avril)."}
