  langue: {valeur: "reconnu", note: "Le néerlandais et le frison sont les langues officielles de la province de Fryslân (Wet gebruik Friese taal, art. 2) ; toute personne peut employer le frison avec les administrations établies dans la province (art. 3) et, si elle réside dans la province, à l'audience du tribunal de Noord-Nederland et de la cour d'appel d'Arnhem-Leeuwarden (art. 11) ; un Organe pour la langue frisonne de cinq membres, établi à Leeuwarden, promeut l'égalité des deux langues (art. 18 à 20).", source: "https://wetten.overheid.nl/BWBR0034047/"}
  education: {valeur: "partiel", note: "Les écoles primaires de la province enseignent aussi le frison ; les États provinciaux (Provinciale Staten, assemblée de la province) fixent par règlement les objectifs fondamentaux (kerndoelen) du frison, sous réserve d'approbation du ministre, et la députation provinciale accorde les dérogations ; le frison peut servir de langue d'enseignement, Wet op het primair onderwijs, art. 9, al. 8, 9 et 16.", source: "https://wetten.overheid.nl/BWBR0003420/"}
