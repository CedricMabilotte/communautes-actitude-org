resume: >-
  La Metlakatla Indian Community regroupe des descendants de Tsimshian venus de Colombie-Britannique en 1887 sur l'île Annette, dans le sud-est de l'Alaska. Une loi du Congrès du 3 mars 1891 a réservé les îles Annette « à l'usage des Indiens Metlakahtla » ; une proclamation présidentielle de 1916 y a ajouté les eaux situées à moins de 3 000 pieds (environ 900 m) des côtes. La loi de 1971 sur le règlement des revendications des autochtones d'Alaska (ANCSA) a révoqué les autres réserves de l'Alaska mais pas celle des îles Annette, qui est la seule de l'État ; les membres de la communauté sont exclus des avantages de cette loi. Elle se gouverne selon une constitution de 1944 ; en 2022, une cour d'appel fédérale a jugé que la loi de 1891 emporte aussi un droit de pêche hors de la réserve.
