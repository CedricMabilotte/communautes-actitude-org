droits:
  autogouvernement: {valeur: "reconnu", note: "La constitution de 1944 institue un maire, un secrétaire, un trésorier et un conseil de 12 membres élus parmi les membres de la communauté ; la communauté figure sur la liste fédérale des entités reconnues du 8 janvier 2024.", source: "https://thorpe.law.ou.edu/IRA/metlacons.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil adopte les règlements (ordinances) de gouvernement local qui ne contredisent pas les lois fédérales et peut appliquer le droit fédéral comme droit de la communauté là où aucune règle propre n'existe ; copie en est remise dans les trois jours au représentant local du Bureau des affaires indiennes (constitution de 1944, art. IV, sect. 1).", source: "https://thorpe.law.ou.edu/IRA/metlacons.html"}
  justice_propre: {valeur: "reconnu", note: "Sur les îles Annette, la communauté exerce la compétence pénale sur les infractions commises par des Indiens, dans les mêmes conditions que les nations autochtones des territoires où la compétence n'a pas été transférée à un État (18 U.S.C. § 1162 (a), modifié par la loi publique 91-523 du 25 novembre 1970) ; la constitution de 1944 prévoit un magistrat qui sanctionne les infractions aux règlements du conseil (art. V). La communauté dispose d'un tribunal de magistrat et d'une cour d'appel, dont des décisions de 1988 à 2001 sont publiées.", source: "https://www.law.cornell.edu/uscode/text/18/1162"}
  terres: {valeur: "partiel", note: "La loi de 1891 réserve les îles Annette à l'usage des Indiens Metlakahtla « jusqu'à ce que la loi en dispose autrement » ; la Cour suprême a jugé en 1962 que l'autorité fédérale sur la réserve, confiée au secrétaire à l'Intérieur en 1891, n'a pas été retirée par la loi d'admission de l'Alaska comme État (Statehood Act). Le conseil attribue par permis les lots et les terres cultivables (constitution de 1944, art. IV, sect. 6 et art. VI) et peut empêcher toute vente, location ou charge des terres de la communauté sans son consentement (art. IV, sect. 2).", source: "https://www.law.cornell.edu/supremecourt/text/369/45"}
  ressources: {valeur: "reconnu", note: "Les eaux de la réserve sont « exclusivement réservées à la pêche » des membres de la communauté et des autres autochtones d'Alaska résidant avec eux, sans permis de l'État d'Alaska (25 CFR § 241.2) ; les minerais et autres ressources sont des biens de la communauté, les baux restant soumis à l'approbation du secrétaire à l'Intérieur (constitution de 1944, art. VII, sect. 3 et 4). En 2022, la cour d'appel du 9e circuit a reconnu un droit implicite de pêche hors réserve, non exclusif, dont l'étendue reste à fixer.", source: "https://www.law.cornell.edu/cfr/text/25/241.2"}
  consentement: {valeur: "partiel", note: "Le décret présidentiel 13175 du 6 novembre 2000 impose une consultation « régulière et significative » des représentants des nations autochtones reconnues sur les politiques fédérales qui les concernent ; il ne prévoit pas de consentement.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La constitution de 1944 autorise le conseil à lever une taxe annuelle de 3 dollars au plus sur chaque homme valide de 21 à 60 ans membre de la communauté (art. IV, sect. 3) et à percevoir des redevances sur le bois coupé dans la réserve, versées au budget de la communauté (art. VII, sect. 5 et 6).", source: "https://thorpe.law.ou.edu/IRA/metlacons.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La constitution de 1944 fixe les conditions d'admission des membres (autochtones d'Alaska de plus de 21 ans, un an de résidence dans la réserve, vote des trois quarts du conseil) et la perte de la qualité de membre après deux ans d'absence (art. II, sect. 4 et 6).", source: "https://thorpe.law.ou.edu/IRA/metlacons.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les institutions de la communauté fonctionnent : un maire dirige la Metlakatla Indian Community, seule réserve de l'Alaska, qui compte environ 1 500 habitants. Le droit de pêche hors réserve reconnu en 2022 n'est pas encore appliqué : l'État d'Alaska s'oppose à ce que les pêcheurs de la communauté soient dispensés de ses permis et, en juin 2024, l'étendue des zones de pêche (districts 1 et 2) restait à fixer par un procès ; la procédure se poursuivait en novembre 2025 (décision du tribunal fédéral d'Alaska du 10 novembre 2025).", source: "https://alaskapublic.org/news/2024-06-11/suit-asserting-metlakatla-tribal-members-right-to-fish-off-reservation-heads-for-trial"}
chronologie:
  - {annee: 1887, evenement: "823 Metlakatlans s'installent sur les îles Annette à l'invitation du président Cleveland."}
  - {annee: 1891, evenement: "Loi du Congrès du 3 mars : les îles Annette deviennent une réserve à l'usage des Indiens Metlakahtla."}
  - {annee: 1916, evenement: "Proclamation présidentielle du 28 avril réservant les eaux sur 3 000 pieds autour des îles."}
  - {annee: 1944, evenement: "Adoption de la constitution de la Metlakatla Indian Community."}
  - {annee: 1958, evenement: "Loi publique 85-615 : le Territoire de l'Alaska reçoit la compétence pénale sur les infractions commises par ou contre des Indiens dans tout le territoire indien (Indian country, terres sous régime fédéral autochtone) de l'Alaska."}
  - {annee: 1962, evenement: "Arrêt Metlakatla c. Egan : l'autorité fédérale sur la réserve, confiée au secrétaire à l'Intérieur en 1891, n'a pas été retirée par la loi d'admission de l'Alaska comme État."}
  - {annee: 1970, evenement: "Loi publique 91-523 : la communauté peut exercer la compétence pénale sur les infractions commises par des Indiens sur les îles Annette."}
  - {annee: 1971, evenement: "L'ANCSA révoque les réserves de l'Alaska, à l'exception de celle des îles Annette."}
  - {annee: 2020, evenement: "La communauté saisit le tribunal fédéral d'Alaska pour faire reconnaître son droit de pêche hors réserve."}
  - {annee: 2022, evenement: "Arrêt Metlakatla c. Dunleavy (9e circuit) : la loi de 1891 emporte un droit implicite de pêche hors réserve."}
  - {annee: 2025, evenement: "Le 10 novembre, le tribunal fédéral d'Alaska rejette la demande de six gouvernements autochtones du sud-est de l'Alaska, dont le Conseil central des Tlingit et Haida, qui demandaient le rejet de l'action faute d'y avoir été appelés."}
