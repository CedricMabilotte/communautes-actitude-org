resume: >-
  Fiche agrégée : elle couvre les États des Palaos (subdivisions dotées d'un gouvernement propre), qui gèrent les aires protégées inscrites au réseau national, et les chefs traditionnels, qui peuvent en désigner. La loi sur le réseau des aires protégées (RPPL n° 6-39, novembre 2003 ; RPPL désigne une loi publique de la République des Palaos), codifiée au titre 24, chapitre 34 du Code national des Palaos et refondue par la loi RPPL n° 7-42 de 2008, laisse aux États la propriété des ressources et la gestion des sites ; l'État national fixe les catégories, les règles et les critères. Le réseau est financé par une taxe environnementale perçue sur les visiteurs (« Green Fee ») et administré financièrement par une société à but non lucratif, le PAN Fund, ouverte en mars 2012. Le PAN Fund recense 39 sites, dont 29 marins, dans les 16 États.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national des Palaos à la Convention sur la diversité biologique (2014) : il décrit le réseau créé en novembre 2003, le rôle des États et des chefs traditionnels, les interdits coutumiers de pêche (« bul ») et indique que le réseau « permet aux communautés de gérer leur environnement local » ; il compte alors 13 sites dotés d'un plan de gestion", annee: 2014, source: "https://www.cbd.int/doc/world/pw/pw-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Constitution de la République des Palaos, art. I sect. 2 (propriété des ressources par les États jusqu'à 12 milles marins), art. V (droits traditionnels), art. XI (gouvernements des États), art. XII sect. 6 (revenus des ressources)", nature: "constitution", annee: 1981, source: "https://www.constituteproject.org/constitution/Palau_1992"}
  - {instrument: "Protected Areas Network Act (RPPL n° 6-39), 24 PNC chap. 34", nature: "loi", annee: 2003, source: "https://www.cbd.int/doc/world/pw/pw-nr-05-en.pdf"}
  - {instrument: "Amendement à la loi sur le réseau des aires protégées et Micronesia Challenge (RPPL n° 7-42), 24 PNC § 3401 à 3445", nature: "loi", annee: 2008, source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  - {instrument: "RPPL n° 10-02 (Pristine Paradise Environmental Fee), modifiant 24 PNC § 3413", nature: "loi", annee: 2017, source: "https://faolex.fao.org/docs/pdf/pau181820.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque État gère les sites du réseau situés sur son territoire selon ses propres plans de gestion (24 PNC § 3402 (a) et § 3407 (d) et (e), version RPPL 7-42 de 2008) ; la loi précise que les sites « ne sont pas contrôlés par le gouvernement national » et que les États en gardent « la propriété et la gouvernance » (RPPL 7-42, sect. 1). Les plans doivent suivre les critères fixés par le ministre (§ 3407 (d)).", source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les États peuvent adopter leurs propres lois sur les aires protégées et en poursuivre les infractions (24 PNC § 3410) et approuvent les premières règles du réseau (§ 3407 (g)) ; la Constitution donne à la loi traditionnelle la même autorité que la loi écrite (art. V sect. 2). Le ministre édicte les règles du réseau, qui ont force de loi (§ 3404 (a) et (b)).", source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La propriété des ressources situées dans les limites d'un État reste à cet État et n'est pas transférée au gouvernement national (24 PNC § 3402 (a)) ; une terre privée n'entre au réseau qu'à la demande et avec le consentement écrit de son propriétaire (§ 3407 (b)). La loi ne crée pas de titre foncier collectif ; la terre appartient, selon le cinquième rapport à la CDB, à des citoyens, à des clans, aux États ou à l'État national.", source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  ressources: {valeur: "reconnu", note: "Chaque État a la propriété exclusive des ressources vivantes et non vivantes, sauf les poissons grands migrateurs, jusqu'à 12 milles marins, sans atteinte aux droits et pratiques de pêche traditionnels (Constitution, art. I sect. 2), et perçoit les revenus de leur exploitation (art. XII sect. 6) ; la loi de 2008 confirme cette propriété pour les sites du réseau (24 PNC § 3402 (a)).", source: "https://www.constituteproject.org/constitution/Palau_1992"}
  consentement: {valeur: "partiel", note: "Les catégories d'aires sont fixées avec l'approbation des responsables des États (24 PNC § 3403) ; une aire désignée par la loi nationale n'entre au réseau qu'en « accord mutuel » avec l'État concerné (§ 3404 (d)) ; une terre privée exige le consentement écrit du propriétaire (§ 3407 (b)). Aucune consultation des communautés ou des propriétaires coutumiers n'est prévue en dehors de ces cas.", source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Sur la taxe environnementale perçue sur chaque visiteur, 20 dollars vont au fonctionnement du réseau (24 PNC § 3413, 2008) ; le PAN Fund reverse ces sommes aux sites selon les plans de gestion (§ 3421 et 3422). Les États peuvent percevoir leurs propres droits de visite sur les sites (§ 3413 (a)) et reçoivent les amendes pénales, moins 25 % versés au Trésor national (§ 3411). La loi RPPL n° 10-02 de 2017 crée une taxe de départ de 100 dollars (« Pristine Paradise Environmental Fee ») : 30 dollars y restent affectés à la « Green Fee » de 24 PNC § 3413, désormais perçue au départ, et 12,50 dollars sont répartis entre les États (70 % à parts égales, 30 % selon la population) ; la part de la « Green Fee » réservée au réseau après 2017 n'a pas été vérifiée.", source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  representation: {valeur: "partiel", note: "Le comité de gestion du réseau, qui conseille le ministre sur les candidatures, le budget et le plan d'ensemble, comprend un représentant de chaque État doté de sites, un représentant de l'association des gouverneurs et un représentant du Conseil des chefs (24 PNC § 3404 (f)).", source: "https://faolex.fao.org/docs/pdf/pau147780.pdf"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le cinquième rapport national à la CDB (2014) compte 13 sites dotés d'un plan de gestion appliqué par des agents de conservation employés par les États, et relève que plusieurs États n'ont ni agents de conservation à plein temps ni agents de contrôle. Une étude universitaire (Gruby et Basurto, 2013) conclut que le réseau a donné au gouvernement national et aux organisations non gouvernementales une influence dans les décisions locales, et que l'ensemble est devenu plus emboîté et moins polycentrique (moins de centres de décision autonomes). La Communauté du Pacifique compte, avec les États pour unité, 16 communautés côtières, dont 2 couvertes par une gestion communautaire des pêches et 1 site actif.", source: "https://doi.org/10.1016/j.envsci.2013.06.006"}
chronologie:
  - {annee: 1981, evenement: "Constitution des Palaos : propriété des ressources marines par les États et reconnaissance des chefs traditionnels."}
  - {annee: 2003, evenement: "Loi sur le réseau des aires protégées (RPPL n° 6-39), votée en novembre."}
  - {annee: 2008, evenement: "Loi RPPL n° 7-42 : refonte du chapitre 34, comité de gestion, création du PAN Fund et taxe de 30 dollars sur les visiteurs à partir du 1er octobre."}
  - {annee: 2012, evenement: "Ouverture du PAN Fund en mars."}
  - {annee: 2014, evenement: "Cinquième rapport national à la CDB : 13 sites du réseau dotés d'un plan de gestion."}
  - {annee: 2016, evenement: "Plan de gestion des pêches des récifs du Nord adopté par les États de Kayangel et de Ngarchelong."}
  - {annee: 2017, evenement: "Loi RPPL n° 10-02, adoptée le 27 mars : taxe de départ de 100 dollars, dont 30 dollars affectés à la « Green Fee » et 12,50 dollars répartis entre les États."}
fiabilite:
  verifie: ["Texte de la loi RPPL n° 7-42 de 2008 (FAOLEX) : sect. 1 (constats législatifs) et 24 PNC § 3401 à 3413, 3421 et 3422.", "Constitution des Palaos (Constitute Project) : art. I sect. 2, art. V sect. 1 et 2, art. VIII (Conseil des chefs), art. XI, art. XII sect. 6.", "Cinquième rapport national à la CDB (2014) : création du réseau en novembre 2003, 13 sites dotés d'un plan de gestion, interdits coutumiers « bul », capacités des États.", "Loi RPPL n° 10-02 adoptée le 27 mars 2017 (FAOLEX) : 40 PNC § 2706 (répartition de la taxe de 100 dollars) et modification de 24 PNC § 3413 (« Green Fee » de 30 dollars perçue au départ).", "Pages des sites du PAN Fund : 14 sites nommés, un par État ; la page de Koror (« Southern Lagoon ») regroupe deux sites, Ngerumkaol et Ngerukuid ; la page d'Angaur donne 0,72 km² pour l'aire marine d'Iuaiu.", "Page du PAN Fund : 39 sites, 29 marins et 10 terrestres, dans les 16 États ; ouverture du fonds en mars 2012."]
  non_confirme: ["Texte original de la loi RPPL n° 6-39 de 2003 : non consulté ; la date de novembre 2003 vient du cinquième rapport à la CDB.", "Nombre de sites : la page du PAN Fund n'est pas datée ; la liste publiée ne nomme qu'un site par État (14 noms, Ngatpang et Merir sans information), pas les 39 sites ; le tableau reprend ces 14 noms.", "Surface totale du réseau : non trouvée ; le chiffre de 458 km² cité par le rapport à la CDB porte sur l'ensemble des aires protégées par les États et les chefs depuis 1992.", "Rôle des propriétaires coutumiers dans la gestion des sites : affirmé par la Communauté du Pacifique, sans disposition correspondante trouvée dans la loi de 2008.", "Règlements d'application du réseau (catégories, procédure de désignation, médiation) : non trouvés.", "Plan des récifs du Nord (2016) : connu par la seule fiche de la Communauté du Pacifique, texte non consulté.", "Répartition de la « Green Fee » entre le réseau et le Trésor depuis la loi RPPL n° 9-49 et la loi de 2017 : le paragraphe (c) modifié de 24 PNC § 3413 n'a pas été consulté.", "Effectivité : l'étude de Gruby et Basurto (2013) n'a été lue que dans son résumé.", "Nombre de villages : non trouvé.", "Population : chiffre national de 2012 ; les dates d'adhésion des États au réseau n'ont pas été trouvées et le rapport de 2014 compte 13 sites dotés d'un plan de gestion, de sorte que la couverture des 16 États à la date du recensement n'est pas établie."]
