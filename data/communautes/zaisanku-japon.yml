resume: >-
  Le zaisanku (« circonscription de biens ») est une collectivité publique spéciale formée par une partie d'une commune, le plus souvent un ancien village, qui possède en propre des biens ou des équipements : forêts surtout, canaux d'irrigation, marais, cimetières, terrains, sources chaudes.
  La loi sur l'autonomie locale de 1947 (art. 1-3 et 294 à 297) lui donne la personnalité juridique, un compte séparé et, au choix de la commune, une assemblée, une assemblée générale des habitants ou un conseil de gestion de sept membres au plus.
  Le maire de la commune gère ces biens, avec le consentement du conseil de gestion pour les décisions désignées par arrêté municipal.
  Au 25 août 2026, l'Agence nationale des impôts recense 3 913 zaisanku actifs ; les préfectures d'Osaka, de Hyogo et d'Okayama en comptent le plus.
