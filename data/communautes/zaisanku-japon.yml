  - {instrument: "Loi sur l'autonomie locale, art. 238-6 : usage des biens publics selon les « usages anciens » (旧慣)", nature: "loi", annee: 1947, source: "https://hourei.net/law/322AC0000000067"}
droits:
  autogouvernement: {valeur: "partiel", note: "Art. 295 et 296 de la loi sur l'autonomie locale : le gouverneur de préfecture peut faire créer par arrêté municipal une assemblée élue ou une assemblée générale du zaisanku ; art. 296-2 : à défaut, la commune peut instituer par arrêté un conseil de gestion (財産区管理会) de sept membres au plus, non permanents, nommés pour quatre ans ; art. 296-3 : le maire peut lui déléguer la gestion des biens et le conseil peut contrôler les comptes. Ces organes restent facultatifs et l'exécutif est le maire de la commune ; au 1er avril 2025, 1 495 zaisanku sur 3 883 n'avaient aucun organe propre (enquête du ministère de l'Intérieur).", source: "https://hourei.net/law/322AC0000000067"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Art. 1-3 al. 3, art. 2 et art. 294 de la loi sur l'autonomie locale : le zaisanku est une personne morale de droit public qui possède des biens ou des équipements publics ; leur gestion et leur aliénation suivent le droit des biens des collectivités, et l'art. 296-5 al. 1 lui impose de s'efforcer d'accroître le bien-être de ses habitants sans porter atteinte à l'unité de la commune.", source: "https://hourei.net/law/322AC0000000067"}
  ressources: {valeur: "partiel", note: "Art. 294 al. 2 : les dépenses propres aux biens sont à la charge du zaisanku ; art. 296-5 al. 2 : la commune peut, après concertation avec le zaisanku, affecter tout ou partie des revenus de ces biens à ses propres dépenses ; elle peut alors, dans la limite du montant affecté, appliquer aux habitants du zaisanku une imposition ou des redevances différenciées.", source: "https://hourei.net/law/322AC0000000067"}
  consentement: {valeur: "partiel", note: "Art. 296-3 al. 1 : le maire doit obtenir le consentement du conseil de gestion pour les actes de gestion ou d'aliénation importants fixés par arrêté municipal ; art. 296-5 al. 3 : l'accord sur l'affectation des revenus à la commune exige une délibération de l'assemblée ou le consentement du conseil de gestion.", source: "https://hourei.net/law/322AC0000000067"}
  langue: {valeur: "non_applicable", note: "Le zaisanku est une entité de gestion de biens, sans dimension linguistique.", source: ""}
  education: {valeur: "non_applicable", note: "Le zaisanku est une entité de gestion de biens, sans compétence éducative.", source: ""}
  fiscalite: {valeur: "partiel", note: "Art. 294 al. 3 : la commune tient un compte séparé pour les recettes et les dépenses du zaisanku ; la loi ne lui donne pas de pouvoir fiscal propre.", source: "https://hourei.net/law/322AC0000000067"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "Le zaisanku se compose d'un territoire et de l'ensemble de ses habitants ; il ne crée pas de statut personnel.", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "Sans objet pour une subdivision communale de gestion de biens.", source: ""}
effectivite: {valeur: "effective", note: "Une étude universitaire sur le district de Yamaguni (Kyoto) indique qu'en 2003 le zaisanku de Yamaguni gérait 5 % des forêts du district, puis qu'il a été dissous en 2005 et remplacé par des associations de quartier agréées (Shimada, International Journal of the Commons, 2014). Le registre de l'Agence nationale des impôts liste 3 913 zaisanku actifs au 25 août 2026 et 56 fermetures entre 2015 et 2025.", source: "https://thecommonsjournal.org/articles/10.18352/ijc.348"}
chronologie:
  - {annee: 1889, evenement: "Entrée en vigueur du régime municipal de l'ère Meiji : les fusions de villages laissent des biens aux anciens villages, origine des zaisanku."}
  - {annee: 1947, evenement: "La loi sur l'autonomie locale désigne le zaisanku comme collectivité publique spéciale."}
  - {annee: 1954, evenement: "Révision de la loi : création du conseil de gestion et principes de l'art. 296-5 (bien-être des habitants, unité de la commune)."}
  - {annee: 2005, evenement: "Dissolution du zaisanku de Yamaguni (Kyoto), remplacé par des associations de quartier agréées."}
  - {annee: 2026, evenement: "Le registre de l'Agence nationale des impôts compte 3 913 zaisanku actifs (25 août)."}
