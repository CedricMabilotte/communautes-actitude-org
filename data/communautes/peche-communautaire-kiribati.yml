effectivite: {valeur: "partielle", note: "En août 2024, un article de la Communauté du Pacifique co-signé par des agents du ministère des Pêches indique que le plan de Nanikaai est le premier soumis à la procédure du règlement de 2019, engagée en 2020 et close par l'approbation du ministre le 31 janvier 2024, et que d'autres communautés attendent l'approbation de leur plan. L'enquête de 2022 compte 27 sites actifs, 40 sites en cours et 5 sites inactifs, et indique que l'exigence d'enregistrement comme association déclarée fait partie des conditions à remplir.", source: "https://www.spc.int/updates/blog/2024/08/overcoming-legal-barriers-advancing-community-based-fisheries-management-in"}
chronologie:
  - {annee: 2010, evenement: "Loi sur les pêches (n° 6 de 2010) : plans de gestion des pêches et protection des zones de pêche coutumières des kainga et utu (art. 18)."}
  - {annee: 2014, evenement: "Lancement en mai du projet de gestion communautaire des pêches, avec des sites pilotes à Butaritari et Tarawa-Nord."}
  - {annee: 2018, evenement: "Le Conseil des ministres approuve l'extension du programme à Marakei, Aranuka et Tabiteuea-Nord."}
  - {annee: 2019, evenement: "Règlement sur la conservation et la gestion des ressources marines côtières : conditions d'approbation des plans communautaires de gestion des pêches."}
  - {annee: 2020, evenement: "Début de la procédure d'approbation du plan du village de Nanikaai, premier plan soumis au règlement de 2019."}
  - {annee: 2022, evenement: "Enquête de la Communauté du Pacifique : 27 sites actifs, 40 en cours, 5 inactifs."}
  - {annee: 2021, evenement: "Loi modificative n° 22 de 2021 : l'art. 6 de la loi sur les pêches vise désormais les plans préparés par les conseils d'île ou les communautés locales et permet au règlement de fixer la préparation, l'approbation et l'exécution des plans communautaires ; entrée en vigueur à la date fixée par avis du ministre."}
  - {annee: 2024, evenement: "Le 31 janvier, le ministre des Pêches, le maire du conseil urbain de Teinainano et le président du village signent le plan de Nanikaai."}
fiabilite:
  verifie: ["Texte du règlement de 2019 (FAOLEX) : art. 1 à 6, définitions de « coastal community » et de « community-based fisheries management plan », amende de 100 000 dollars (art. 6).", "Texte de la loi sur les pêches de 2010 (FAOLEX) : art. 6 (2) g, 6 (3) et 18.", "Texte de la loi modificative n° 22 de 2021 (FAOLEX) : art. 1 (entrée en vigueur par avis du ministre) et art. 9 (nouvel art. 6 (1) c et 6 (8) de la loi de 2010).", "Approbation du plan de Nanikaai le 31 janvier 2024 et attente d'autres communautés : article de la Communauté du Pacifique co-signé par des agents du ministère des Pêches (août 2024).", "Chiffres 2022 (27 sites actifs, 40 en cours, 5 inactifs, 41 521 ha au moins, 8 965 ha de zones fermées au moins) : rapport Govan et Lalavanua (2022) ; 29 communautés couvertes sur 187 : page Kiribati du portail de la Communauté du Pacifique.", "Sixième rapport national à la CDB : tableau 6 des communautés engagées (2019) et mention du règlement de 2019."]
  non_confirme: ["Nombre de plans approuvés après août 2024 : non trouvé ; la valeur de « lieux » peut être dépassée.", "Le registre public des plans approuvés prévu à l'art. 4 (4) a du règlement n'a pas été trouvé en ligne ; pas de tableau des sites pour cette raison.", "Date de publication du règlement au bureau du Beretitenti (président), qui fixe son entrée en vigueur (art. 1 (2)) : non trouvée ; l'article de 2024 situe sa mise en application en 2020.", "Texte de la loi sur les associations de 2002 et de la loi sur les collectivités locales de 1984 (compétence des conseils d'île jusqu'à trois milles marins) : non ouverts directement, cités d'après la Communauté du Pacifique et le rapport à la CDB.", "Date de transmission du sixième rapport national à la CDB : le contenu porte sur 2019, le fichier publié date de 2022.", "Population des 29 communautés couvertes par la gestion communautaire : non trouvée ; la valeur retenue ne compte que le village de Nanikaai.", "Avis du ministre fixant l'entrée en vigueur de la loi modificative de 2021 : non trouvé ; elle n'est donc pas retenue en base nationale.", "Lois modificatives de 2015 et 2017 de la loi sur les pêches : non ouvertes ; la rédaction actuelle de l'art. 18 n'a pas été contrôlée sur un texte consolidé.", "Effectivité : les sources disponibles émanent de la Communauté du Pacifique, partenaire du programme, et d'agents du ministère ; aucune évaluation universitaire n'a été ouverte."]
