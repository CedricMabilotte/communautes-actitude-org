reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de Kiribati à la Convention sur la diversité biologique : étude de cas sur le programme de gestion communautaire des pêches (section 2.6.1.3), tableau des communautés et îles engagées (tableau 6, données 2019) et mention du règlement de 2019, auquel les plans communautaires doivent se conformer (section 2.5)", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/ki-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Fisheries (Conservation and Management of Coastal Marine Resources) Regulations 2019, pris en vertu de l'art. 45 de la loi sur les pêches de 2010 : art. 2 (3), 3 (définitions de « coastal community » et de « community-based fisheries management plan »), 4 (préparation et conditions d'approbation), 5 (contenu et révision) et 6 (infraction)", nature: "loi", annee: 2019, source: "https://faolex.fao.org/docs/pdf/kir201949.pdf"}
  - {instrument: "Fisheries Act 2010 (n° 6 de 2010) : art. 6 (plans de gestion des pêches, prise en compte des méthodes de pêche traditionnelles, consultation des pêcheurs et autorités locales) et art. 18 (protection des droits coutumiers sur les zones de pêche des kainga et utu)", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/kir109024.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le règlement de 2019 ne reconnaît comme communauté côtière qu'une communauté constituée en association déclarée selon la loi sur les associations de 2002 (Incorporated Societies Act), dont l'objet inclut la gestion des ressources marines côtières (art. 3 et 4 (3) b) ; le plan désigne la communauté qui a conduit son élaboration et fixe les modalités de surveillance et de contrôle (art. 5 (1) a et f). L'approbation et la révision du plan relèvent du ministre (art. 4 (2) et 5 (2)).", source: "https://faolex.fao.org/docs/pdf/kir201949.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le plan est préparé à l'initiative du directeur des pêches côtières, à la demande d'une communauté côtière ou d'office (art. 4 (1), règlement de 2019), avec la participation de la communauté riveraine (art. 4 (3) a) ; ses mesures de conservation et de gestion deviennent obligatoires après approbation écrite du ministre (art. 4 (2)) ; toute modification doit être approuvée par la communauté et par le ministre (art. 5 (2)). La communauté n'édicte pas seule de normes obligatoires.", source: "https://faolex.fao.org/docs/pdf/kir201949.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La violation d'un plan approuvé est punie d'une amende pouvant atteindre 100 000 dollars et, à défaut, d'un emprisonnement de cinq ans au plus, ou des deux (art. 6, règlement de 2019). La loi sur les pêches de 2010 soumet à licence la pêche d'une personne extérieure dans la zone de pêche coutumière ancienne d'un kainga ou d'un utu (groupes de parenté) (art. 18 (1)). Les licences de pêche commerciale dans les pêcheries côtières désignées restent délivrées par le directeur des pêches côtières, avec l'approbation du ministre et après consultation du conseil d'île (art. 15 (3), règlement de 2019).", source: "https://faolex.fao.org/docs/pdf/kir201949.pdf"}
  consentement: {valeur: "partiel", note: "Un plan ne peut être approuvé que si la communauté riveraine a participé à sa préparation et si la communauté côtière et le conseil d'île l'ont approuvé (art. 4 (3) a et d, règlement de 2019) ; ses modifications exigent l'accord de la communauté (art. 5 (2)). Ce consentement porte sur le plan lui-même ; pour les autres plans de gestion des pêches, la loi de 2010 impose seulement de consulter les pêcheurs et autorités locales (art. 6 (3)).", source: "https://faolex.fao.org/docs/pdf/kir201949.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
