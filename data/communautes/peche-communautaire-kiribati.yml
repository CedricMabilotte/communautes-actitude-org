resume: >-
  Fiche agrégée : elle couvre les communautés côtières de Kiribati dont le plan de gestion des pêches a reçu, ou peut recevoir, une valeur juridique. Le règlement de 2019 sur la conservation et la gestion des ressources marines côtières, pris en application de la loi sur les pêches de 2010, permet au ministre des Pêches d'approuver par écrit un plan communautaire de gestion des pêches (community-based fisheries management plan) préparé avec une communauté côtière constituée en association déclarée (incorporated society) et approuvé par elle et par le conseil d'île (art. 4). La violation d'un plan approuvé est une infraction pénale (art. 6). Le programme national, nommé Nei Tengarengare, a débuté en 2014 ; le premier plan approuvé au titre du règlement est celui du village de Nanikaai (Tarawa-Sud), signé le 31 janvier 2024.
