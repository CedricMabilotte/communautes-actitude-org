resume: >-
  La Corse est une collectivité à statut particulier (collectivité dont l'organisation est fixée par une loi propre) au sens de l'article 72 de la Constitution. Depuis le 1er janvier 2018, la Collectivité de Corse remplace la collectivité territoriale de Corse et les départements de Corse-du-Sud et de Haute-Corse ; elle est dotée d'une Assemblée de Corse élue et d'un Conseil exécutif responsable devant elle. L'Assemblée est consultée sur les projets et propositions de loi ou de décret comportant des dispositions spécifiques à la Corse et peut proposer des modifications ou adaptations des lois et règlements (CGCT, art. L. 4422-16). Le Conseil constitutionnel a censuré en 1991 la mention d'un « peuple corse » ; le sujet collectif retenu par le droit est la population de l'île. Un projet de loi constitutionnelle créant un article 72-5 sur l'autonomie de la Corse a fait l'objet d'un avis du Conseil d'État le 17 juillet 2025.
