  - {instrument: "Loi n° 2002-92 du 22 janvier 2002 relative à la Corse, examinée par le Conseil constitutionnel (décision n° 2001-454 DC du 17 janvier 2002)", nature: "loi", annee: 2002, source: "https://www.conseil-constitutionnel.fr/decision/2002/2001454DC.htm"}
  - {instrument: "Loi n° 2015-991 du 7 août 2015 (NOTRe), art. 30 et suivants, et ordonnances n° 2016-1561, 2016-1562 et 2016-1563 du 21 novembre 2016 créant la Collectivité de Corse", nature: "loi", annee: 2015, source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
  - {instrument: "Code général des collectivités territoriales, art. L. 4421-1 et suivants (dont L. 4422-16, L. 4424-2, L. 4424-6, L. 4424-9, L. 4424-36)", nature: "loi", annee: 2018, source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée de Corse élue au suffrage universel dans une circonscription formée de l'île, et Conseil exécutif élu par l'Assemblée et responsable devant elle (CGCT, art. L. 4421-1 et suivants ; collectivité créée par la loi n° 2015-991 et les ordonnances du 21 novembre 2016, en place depuis le 1er janvier 2018).", source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
  pouvoir_normatif: {valeur: "partiel", note: "Le pouvoir réglementaire de la collectivité s'exerce dans le cadre des compétences que la loi lui attribue ; elle peut demander à être habilitée par le législateur à fixer des règles adaptées aux spécificités de l'île, hors libertés individuelles et droits fondamentaux (CGCT, art. L. 4424-2). La décision n° 2001-454 DC du 17 janvier 2002 a censuré la possibilité de prendre des mesures relevant du domaine de la loi et n'a admis que l'adaptation des règlements.", source: "https://www.conseil-constitutionnel.fr/decision/2002/2001454DC.htm"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'Assemblée adopte le plan d'aménagement et de développement durable de Corse (PADDUC, document de planification de l'usage des sols), auquel les schémas de cohérence territoriale doivent être compatibles (CGCT, art. L. 4424-9 et suivants) ; il ne confère aucune propriété collective des terres.", source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
  ressources: {valeur: "partiel", note: "La collectivité met en œuvre la gestion des ressources en eau : la Corse forme un bassin hydrographique dont le schéma directeur d'aménagement et de gestion des eaux (plan de gestion de l'eau), élaboré par le comité de bassin, est approuvé par l'Assemblée de Corse (CGCT, art. L. 4424-36 et suivants) ; elle définit ses actions de protection de l'environnement, mises en œuvre par l'Office de l'environnement de la Corse, dans le cadre de la politique nationale (art. L. 4424-35).", source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
  consentement: {valeur: "partiel", note: "L'Assemblée de Corse est consultée sur les projets et propositions de loi ou de décret comportant des dispositions spécifiques à la Corse et peut proposer la modification ou l'adaptation de dispositions législatives ou réglementaires (CGCT, art. L. 4422-15 et L. 4422-16) ; l'avis n'engage pas le Gouvernement ni le Parlement.", source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
  langue: {valeur: "partiel", note: "La loi n° 2002-92 (art. 7, code de l'éducation, art. L. 312-11-1) fait de la langue corse une matière enseignée dans l'horaire normal des écoles maternelles et élémentaires de Corse ; la décision n° 2001-454 DC précise que cet enseignement ne peut être obligatoire ni pour les élèves ni pour les enseignants. Le corse n'a pas de statut officiel : l'article 2 de la Constitution fait du français la langue de la République (décision n° 2021-818 DC).", source: "https://www.conseil-constitutionnel.fr/decision/2002/2001454DC.htm"}
  education: {valeur: "partiel", note: "La collectivité établit le schéma prévisionnel des formations (collèges, lycées, enseignement professionnel et agricole) et le programme prévisionnel des investissements, et arrête chaque année la structure pédagogique générale des établissements du second degré, sous réserve d'une convention avec l'État sur les moyens attribués à l'académie de Corse (CGCT, art. L. 4424-1 et suivants).", source: "https://encyclopedie.wikiterritorial.cnfpt.fr/xwiki/bin/view/fiches/Les%20collectivit%C3%A9s%20territoriales%20%C3%A0%20statut%20particulier%20:%20la%20collectivit%C3%A9%20de%20Corse/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon l'avis du Conseil d'État du 17 juillet 2025, la collectivité a tenté à plusieurs reprises d'user de son pouvoir de proposition (CGCT, art. L. 4422-16) sans que les pouvoirs publics y donnent systématiquement suite ; la Corse bénéficie toutefois d'adaptations, notamment en matière fiscale.", source: "https://www.conseil-etat.fr/avis-consultatifs/derniers-avis-rendus/au-gouvernement/avis-relatif-au-projet-de-loi-constitutionnelle-pour-une-corse-autonome-au-sein-de-la-republique"}
chronologie:
  - {annee: 1991, evenement: "Décision n° 91-290 DC du 9 mai : le Conseil constitutionnel censure la mention du « peuple corse, composante du peuple français » dans la loi portant statut de la collectivité territoriale de Corse."}
  - {annee: 2002, evenement: "Décision n° 2001-454 DC du 17 janvier, puis loi n° 2002-92 du 22 janvier relative à la Corse : habilitation à adapter les règlements admise, dérogation à la loi censurée."}
  - {annee: 2003, evenement: "Consultation des électeurs de Corse du 6 juillet : rejet d'une nouvelle collectivité se substituant à la collectivité territoriale de Corse et aux deux départements."}
  - {annee: 2015, evenement: "Loi n° 2015-991 du 7 août (NOTRe) prévoyant la création de la Collectivité de Corse."}
  - {annee: 2016, evenement: "Ordonnances n° 2016-1561, 2016-1562 et 2016-1563 du 21 novembre (finances, institutions, élections)."}
  - {annee: 2018, evenement: "1er janvier : la Collectivité de Corse remplace la collectivité territoriale de Corse et les deux départements."}
  - {annee: 2021, evenement: "Décision n° 2021-818 DC du 21 mai : censure de l'enseignement immersif en langue régionale (loi nationale sur les langues régionales)."}
  - {annee: 2025, evenement: "Projet de loi constitutionnelle « pour une Corse autonome au sein de la République » (article 72-5) : saisine du Conseil d'État le 30 mai, avis du 17 juillet."}
