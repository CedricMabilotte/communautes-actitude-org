resume: >-
  Les Chakma vivent au sud-ouest du Mizoram, à la frontière du Bangladesh ; d'autres Chakma relèvent de la fiche « Peuples des Chittagong Hill Tracts » (Bangladesh). Le Chakma Autonomous District Council (conseil autonome de district chakma) a été créé le 29 avril 1972 par la division en trois du conseil régional Pawi-Lakher, avec les conseils des Lai et des Mara, en application de la Sixième annexe de la Constitution. Les lois de l'État du Mizoram sur les matières du conseil ne s'y appliquent que sur décision de celui-ci. Selon le conseil, deux tiers des Chakma du Mizoram vivent hors de son territoire. Le conseil a été placé sous administration du gouverneur de juillet 2025 à juillet 2026.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître les peuples tribaux et les « tribus énumérées » comme groupes ayant droit à une protection spéciale ; § 12 et 19 sur les États du nord-est ; le Mizoram et le conseil chakma ne sont pas nommés", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, art. 244 (2) et Sixième annexe", nature: "constitution", annee: 1950, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Mizoram District Councils (Miscellaneous Provisions) Order, 1972 ; Partie III de la Table de la Sixième annexe", nature: "constitution", annee: 1972, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, Sixième annexe (régime des districts tribaux autonomes), paragraphe 2 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 ; ses lois requièrent l'assentiment du gouverneur, et les lois de l'État sur ces matières ne s'y appliquent que sur décision du conseil, paragraphe 12B (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Le conseil peut créer des conseils ou tribunaux de village pour les litiges entre membres des « tribus répertoriées » (Scheduled Tribes), à l'exclusion des autres tribunaux de l'État, et une juridiction d'appel ; seuls la Haute Cour et la Cour suprême restent compétentes, Sixième annexe, paragraphe 4.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Aucune loi de l'Assemblée de l'État (Mizoram) sur les matières du paragraphe 3 ne s'applique au district autonome sans notification du conseil, qui peut l'adapter, Sixième annexe, paragraphe 12B (a) ; les lois du Parlement restent applicables sauf décision du président ou du gouverneur.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Le conseil peut créer et gérer des écoles primaires et fixer la langue et les modalités de l'enseignement primaire, avec l'accord préalable du gouverneur, Sixième annexe, paragraphe 6 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et licences de commerce pour toute personne résidant dans le district, paragraphe 10 tel que modifié pour le Mizoram en 1988, Sixième annexe ; ses règlements fiscaux requièrent l'assentiment du gouverneur, paragraphe 8 (4).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Après le renversement du chef de l'exécutif par une motion de censure le 16 juin 2025, le gouverneur a assumé les pouvoirs du conseil le 7 juillet 2025 ; un exécutif issu du conseil élu en 2023 a obtenu la confiance de 18 membres sur 20 le 9 juillet 2026, ce qui a mis fin à cette administration.", source: "https://assamtribune.com/north-east/bjpzpm-alliance-wins-mizoram-chakma-council-floor-test-with-18-votes-1614086"}
chronologie:
  - {annee: 1972, evenement: "Création du conseil chakma le 29 avril."}
  - {annee: 2025, evenement: "Motion de censure contre le chef de l'exécutif le 16 juin ; le gouverneur assume les pouvoirs du conseil le 7 juillet (Sixième annexe, paragraphe 16 (2))."}
  - {annee: 2026, evenement: "Prolongation de l'administration du gouverneur le 7 janvier ; investiture d'un chef de l'exécutif le 8 juillet et vote de confiance le 9 juillet."}
  - {annee: 2026, evenement: "Le 21 août, le conseil rétablit l'interdiction du double mandat (conseil et Assemblée de l'État) dans son règlement, en application d'un arrêt de la Cour suprême (Rustom Chakma c. État du Mizoram, appel civil n° 9212 de 2026)."}
