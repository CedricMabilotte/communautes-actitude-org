reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le préambule de l'Accord-cadre, dans sa version modifiée en 2022, rappelle l'engagement du Canada à mettre en œuvre la Déclaration des Nations unies sur les droits des peuples autochtones d'une manière conforme à la Constitution canadienne ; le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée.", annee: 2022, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
