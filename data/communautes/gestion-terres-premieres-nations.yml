droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil de la Première Nation ou son délégué administre les terres, les revenus, les redevances et les droits qui s'y rattachent, à l'usage et au profit de la Première Nation (Accord-cadre, art. 12.5) ; le conseil conserve le pouvoir d'adopter des règlements administratifs (règles locales) au titre de la Loi sur les Indiens (art. 22.1). Les conseils des Premières Nations qui ont ratifié l'accord nomment un Conseil consultatif des terres d'au moins trois membres (art. 38.1).", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil édicte des textes législatifs sur l'aménagement, la conservation, la protection, la gestion, l'utilisation et la possession des terres (Accord-cadre, art. 18.1 et 18.2), sur les foyers familiaux en cas de rupture ou de décès (art. 18.3) et sur l'environnement (art. 23.1) ; ces textes sont admis d'office (les tribunaux les tiennent pour connus sans preuve) et échappent à la Loi sur les textes réglementaires (loi de 2022, art. 11 et 13). Les lois fédérales s'appliquent sur ces terres sauf incompatibilité avec la loi de 2022 (Accord-cadre, art. 20.1) ; l'imposition des biens est exclue du code foncier (art. 18.8).", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  justice_propre: {valeur: "partiel", note: "Le code foncier crée ou désigne une instance chargée des différends sur les droits fonciers (Accord-cadre, art. 5.2 h) ; la Première Nation peut créer des infractions ; elle ou le gouverneur en conseil (le gouvernement fédéral) peut nommer des juges de paix compétents pour les juger, et elle protège l'indépendance de ceux qu'elle nomme (art. 19.1, 19.4, 19.5 et 19.7) ; à défaut de juge de paix, les poursuites sont portées devant les tribunaux provinciaux ou territoriaux et les décisions sont susceptibles d'appel (art. 19.4 et 19.6).", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  terres: {valeur: "partiel", note: "Le titre n'est pas modifié et les terres restent des terres réservées aux Indiens au sens du paragraphe 91(24) de la Loi constitutionnelle de 1867 (Accord-cadre, art. 2.3 et 13.1) ; avec un code foncier en vigueur, la Première Nation exerce sur ses terres les droits, pouvoirs et privilèges d'un propriétaire et attribue droits fonciers et permis (art. 12.1 et 12.2) ; les terres ne peuvent être vendues, échangées ou transférées que par échange approuvé par les membres ou par expropriation selon l'accord (art. 13.3 et 14.1.2).", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  ressources: {valeur: "partiel", note: "La Première Nation gère les ressources naturelles de ses terres et reçoit les sommes perçues en vertu de son code foncier (Accord-cadre, art. 12.2 b et 12.7) ; la Loi sur le pétrole et le gaz des terres indiennes continue de s'appliquer (art. 3.1) et l'accord ne crée aucun droit en matière de pêche (art. 18.10).", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  consentement: {valeur: "partiel", note: "Le code foncier et l'accord distinct avec le Canada doivent être approuvés par la majorité des membres votants âgés d'au moins 18 ans, résidant ou non dans la réserve (Accord-cadre, art. 7.2 et 7.3) ; le Canada ne peut exproprier des terres que pour une fin d'intérêt public national de compétence fédérale, avec le consentement du gouverneur en conseil (le gouvernement fédéral), après s'être efforcé de conclure un accord avec la Première Nation et avoir publié un rapport ; la Première Nation peut soumettre son opposition à une tierce partie indépendante (art. 32.2 à 32.6) ; aucun droit de veto n'est prévu.", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "À l'entrée en vigueur du code foncier, les revenus et les capitaux détenus par le Canada pour la Première Nation cessent d'être « de l'argent des Indiens » et lui sont transférés ; pour un code en vigueur au 13 décembre 2018, les capitaux sont transférés après modification de l'accord distinct (Accord-cadre, art. 12.8 et 12.10) ; elle peut imposer des frais aux usagers des services locaux (art. 18.2 d) ; le code foncier ne traite pas de l'imposition des biens (art. 18.8) ; le financement opérationnel est fixé par accord avec le Canada (art. 30).", source: "https://labrc.com/wp-content/uploads/2023/03/Framework-Agreement-on-First-Nation-Land-Management-Dec-2022.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Au 6 août 2026, 128 Premières Nations appliquent un code foncier, 46 sont en phase d'élaboration active et 4 anciennes signataires opérationnelles sont passées à l'autonomie gouvernementale (Centre de ressources sur la gestion des terres des Premières Nations). En 2016, la revue Options politiques de l'Institut de recherche en politiques publiques rapporte, d'après deux études KPMG (2010 et 2014), une hausse des investissements, des recettes et des emplois chez les Premières Nations participantes, et des délais de traitement des transactions foncières jusqu'à 35 fois plus courts que sous la Loi sur les Indiens. Une analyse du Yellowhead Institute (2019) relève que le code foncier peut accroître en partie la compétence sur les terres de réserve sans remettre en cause la répartition des terres hors réserve, et que l'ouverture des terres de réserve au marché peut contribuer à la dépossession foncière.", source: "https://policyoptions.irpp.org/fr/magazines/aout-2016/an-unsung-success-the-first-nations-land-management-act/"}
chronologie:
  - {annee: 1996, evenement: "Le 12 février, le Canada et treize Premières Nations signent l'Accord-cadre relatif à la gestion des terres de premières nations."}
  - {annee: 1999, evenement: "Sanction, le 17 juin, de la Loi sur la gestion des terres des premières nations, qui ratifie l'accord et le met en vigueur."}
  - {annee: 2018, evenement: "Sixième modification de l'Accord-cadre."}
  - {annee: 2022, evenement: "Septième modification de l'Accord-cadre ; la Loi sur l'Accord-cadre relatif à la gestion des terres de premières nations (L.C. 2022, ch. 19, art. 121) remplace la loi de 1999 et entre en vigueur à sa sanction, le 15 décembre."}
  - {annee: 2026, evenement: "Au 6 août, l'accord compte 224 signataires, dont 128 en phase opérationnelle."}
