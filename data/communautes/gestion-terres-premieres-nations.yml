resume: >-
  L'Accord-cadre relatif à la gestion des terres de premières nations, signé le 12 février 1996 par le Canada et treize Premières Nations, permet à une Première Nation de soustraire ses terres de réserve aux dispositions de la Loi sur les Indiens (loi fédérale qui régit les bandes et les réserves) qui portent sur la gestion des terres. La Première Nation adopte par vote de ses membres un code foncier (texte qui fixe ses propres règles d'usage, d'attribution et de transfert des terres) ; dès son entrée en vigueur, 44 articles de la Loi sur les Indiens cessent de s'appliquer et le conseil légifère sur les terres, l'environnement et les ressources. La Loi sur l'Accord-cadre relatif à la gestion des terres de premières nations (L.C. 2022, ch. 19, art. 121), en vigueur depuis le 15 décembre 2022, a remplacé la loi de ratification de 1999 et donne force de loi à l'accord. Au 6 août 2026, l'accord compte 224 signataires, dont 128 Premières Nations en phase opérationnelle. Hors du domaine foncier, ces Premières Nations restent soumises à la Loi sur les Indiens (fiche « Premières Nations et réserves sous la Loi sur les Indiens »).
