  non_confirme: ["Population totale des Premières Nations opérationnelles : aucune source officielle consolidée trouvée. Superficie cumulée : seul le chiffre global du Conseil consultatif des terres (« plus de 1,2 million d'acres ») a été trouvé, sans détail par Première Nation.", "Année d'entrée en vigueur de chaque code foncier : la liste du Centre de ressources ne la donne pas ; la colonne « annee » du tableau reste vide.", "Liste ouverte par le Centre de ressources, organisme créé par les Premières Nations signataires : elle n'a pas été recoupée avec un registre fédéral ; la région indiquée est celle du Centre (Ouest, Prairies, Est), pas la province. La liste nominative de la page compte 220 entrées, le décompte en tête de page 224 signataires (écart sur les signataires inactives).", "Aucun document onusien précis visant ce régime n'a pu être ouvert : le rapport du Rapporteur spécial sur le Canada (A/HRC/27/52/Add.2, 2014) n'a pas été lu en texte intégral.", "Nombre de villages : non trouvé (aucun décompte des réserves ou localités placées sous code foncier)."]
