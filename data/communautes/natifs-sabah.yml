reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La Malaisie vote pour la résolution 61/295 adoptant la Déclaration des Nations unies sur les droits des peuples autochtones (A/61/PV.107) ; la Commission des droits de l'homme de Malaisie (SUHAKAM) range les natifs du Sabah parmi les peuples autochtones visés par cette adhésion", annee: 2007, source: "https://docs.un.org/fr/A/61/PV.107"}
base_nationale:
