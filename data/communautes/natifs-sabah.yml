resume: >-
  La Constitution fédérale de Malaisie protège la « position spéciale » des natifs du Sabah et du Sarawak (art. 161A). Au Sabah, des tribunaux autochtones à trois niveaux, composés de chefs autochtones, jugent les atteintes au droit coutumier entre natifs selon la loi de 1992. L'ordonnance foncière du Sabah définit les droits coutumiers autochtones, permet des titres communaux et des réserves autochtones et interdit les transactions foncières entre natifs et non-natifs sans autorisation.
