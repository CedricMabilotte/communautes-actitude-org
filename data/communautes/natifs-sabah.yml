resume: >-
  La Constitution fédérale de Malaisie définit les natifs du Sabah et autorise les réserves foncières à leur profit (art. 161A). Au Sabah, des tribunaux autochtones (Native Courts) à trois niveaux appliquent le droit coutumier entre natifs selon la loi de 1992 ; le premier niveau réunit des chefs nommés par l'État, les niveaux supérieurs sont présidés par le chef de district administratif (District Officer) et par un juge de la Haute Cour. L'ordonnance foncière de 1930 définit les droits coutumiers autochtones, permet des titres communaux et des réserves autochtones et soumet à autorisation les transactions foncières entre natifs et non-natifs. Une nouvelle loi sur les tribunaux autochtones, adoptée en juillet 2026, doit remplacer celle de 1992 à partir de 2027. La gestion villageoise des rivières est traitée dans la fiche « Zones de pêche tagal du Sabah » ; le statut de l'État dans la fédération, dans la fiche « Sabah et Sarawak (Accord de Malaisie de 1963) ».
