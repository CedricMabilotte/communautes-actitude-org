  - {instrument: "Land Ordinance (Cap. 68) du Sabah, sections 15 à 17, 76 et 78", nature: "loi", annee: 1930, source: "https://sagc.sabah.gov.my/sites/default/files/law/Land%20Ordinance%20(Cap.68)_2.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "Les tribunaux autochtones appliquent le droit et la coutume autochtones (native law or custom) aux affaires entre natifs et peuvent prononcer les peines qu'ils prévoient, Native Courts Enactment 1992, s. 6 et 10 ; ils n'ont pas compétence sur les matières des tribunaux civils et islamiques (s. 9).", source: "https://jheans.sabah.gov.my/wp-content/uploads/2026/07/THE-NATIVE-COURTS-ENACTMENT-1992.pdf"}
  justice_propre: {valeur: "partiel", note: "Tribunal autochtone (chef de district et deux chefs autochtones ou chefs de village), tribunal autochtone de district (présidé par le District Officer) et cour d'appel autochtone (présidée par un juge de la Haute Cour), Native Courts Enactment 1992, s. 3 à 5 ; les chefs sont nommés par la commission de la fonction publique de l'État et toute peine de prison doit être visée par un magistrat (s. 2 et 11).", source: "https://jheans.sabah.gov.my/wp-content/uploads/2026/07/THE-NATIVE-COURTS-ENACTMENT-1992.pdf"}
  terres: {valeur: "partiel", note: "Droits coutumiers autochtones définis par l'ordonnance foncière, s. 15, réglés par l'octroi d'un titre ou par une indemnité en argent, s. 16 ; titres communaux « pour l'usage commun des natifs » inscrits au nom du Collector (administrateur foncier) comme fiduciaire, sans pouvoir de vente, s. 76 ; réserves autochtones déclarées par le gouverneur, s. 78 ; transactions entre natifs et non-natifs interdites sans autorisation ministérielle, s. 17. La Constitution permet ces réserves au profit des natifs, art. 161A (5).", source: "https://sagc.sabah.gov.my/sites/default/files/law/Land%20Ordinance%20(Cap.68)_2.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Une langue autochtone en usage au Sabah peut être employée devant les tribunaux autochtones et pour tout code de droit coutumier autochtone, Constitution fédérale, art. 161 (5).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Les tribunaux autochtones sont compétents, selon le droit coutumier, pour les fiançailles, le mariage, le divorce, l'adoption, la tutelle, la garde des enfants et les successions, Native Courts Enactment 1992, s. 6 (1) c.", source: "https://jheans.sabah.gov.my/wp-content/uploads/2026/07/THE-NATIVE-COURTS-ENACTMENT-1992.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Commission des droits de l'homme de Malaisie (SUHAKAM) écrit en 2025 que les codes fonciers du Sabah et du Sarawak ne reconnaissent pas de façon suffisante les droits coutumiers, que des projets avancent sans consentement libre, préalable et éclairé et que la plupart des recommandations de son enquête nationale de 2013 restent sans suite.", source: "https://suhakam.org.my/2025/10/upholding-indigenous-land-rights-a-nations-test-of-justice/"}
chronologie:
  - {annee: 1930, evenement: "Ordonnance foncière du Nord-Bornéo (13 décembre), qui définit les droits coutumiers autochtones."}
  - {annee: 1963, evenement: "Le Sabah rejoint la Malaisie ; la Constitution fédérale définit les natifs du Sabah et autorise les réserves foncières à leur profit (art. 161A)."}
  - {annee: 1993, evenement: "Entrée en vigueur (1er avril) de la loi de 1992 sur les tribunaux autochtones, qui remplace l'ordonnance de 1953."}
  - {annee: 2013, evenement: "Rapport de l'enquête nationale de la SUHAKAM sur les droits fonciers des peuples autochtones."}
  - {annee: 2018, evenement: "Le ministre en chef annonce le remplacement des titres communaux par des titres autochtones individuels ; la section 76 figure toujours dans la version de référence de décembre 2025."}
  - {annee: 2026, evenement: "L'assemblée du Sabah adopte (juillet) une nouvelle loi sur les tribunaux autochtones (tribunal de district, haute cour et cour d'appel autochtones, registre des anciens) et une loi sur les chefs de district, chefs autochtones et chefs de village ; mise en œuvre annoncée à partir de 2027."}
