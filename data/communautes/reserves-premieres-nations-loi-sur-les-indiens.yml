droits:
  autogouvernement: {valeur: "partiel", note: "Chaque bande a un conseil, élu selon la Loi sur les Indiens (art. 74) ou la Loi sur les élections au sein de premières nations, élu selon un code électoral communautaire, ou choisi selon la coutume de la bande, Loi sur les Indiens, art. 2(1), définition de « conseil de la bande ». Le ministre peut imposer par arrêté le régime électoral de la loi lorsqu'il le juge utile à « la bonne administration d'une bande », art. 74(1).", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil prend des règlements administratifs (normes locales) non incompatibles avec la loi sur une liste fermée de domaines : santé, circulation, ordre public, zonage, construction, puits et réservoirs publics, faune et poisson, résidence sur la réserve, art. 81(1), avec une amende de 1 000 dollars et trente jours d'emprisonnement au plus, art. 81(1)r) ; il peut interdire l'alcool sur la réserve avec le consentement préalable de la majorité des électeurs votants, art. 85.1. Le pouvoir du ministre d'annuler ces règlements (art. 82) a été abrogé en 2014 (L.C. 2014, ch. 38, art. 7).", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La Couronne détient les réserves à l'usage et au profit des bandes, art. 18(1) ; les terres de réserve ne peuvent être vendues qu'après une cession à la Couronne (transfert définitif à l'État), ni louées qu'après une désignation (mise à disposition pour un bail), art. 37 ; la cession exige l'approbation de la majorité des électeurs de la bande et l'acceptation du gouverneur en conseil, art. 39, la désignation un référendum et l'acceptation du ministre, art. 39.1 ; les biens situés sur une réserve sont insaisissables par des personnes autres qu'un Indien ou une bande, art. 89. La possession individuelle d'une parcelle exige l'approbation du ministre, art. 20(1). Une bande peut remplacer ces règles par un code foncier en vertu de la loi de 2022 sur l'Accord-cadre relatif à la gestion des terres.", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  ressources: {valeur: "partiel", note: "Le conseil réglemente la conservation, la protection et la régie des animaux à fourrure, du poisson et du gibier dans la réserve, art. 81(1)o), et l'établissement et l'usage des puits et réservoirs, art. 81(1)l) ; le ministre peut, avec le consentement du conseil, mettre en valeur ou louer des terres incultes, art. 58(1).", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  consentement: {valeur: "partiel", note: "La cession de terres de réserve exige l'approbation de la majorité des électeurs de la bande, art. 39, et leur désignation celle de la majorité des votants à un référendum, art. 39.1 ; plusieurs usages de la réserve exigent le consentement du conseil, art. 18(2), 28(2) et 58(1). Hors de ces cas, la Couronne a une obligation de consulter les peuples autochtones lorsqu'une mesure peut porter atteinte à des droits revendiqués ou établis, arrêt Nation haïda c. Colombie-Britannique, 2004 CSC 73 ; selon les lignes directrices fédérales de 2011, les groupes autochtones n'ont pas de droit de veto.", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil peut, avec l'approbation du ministre, prendre des règlements sur l'imposition de taxes foncières à des fins locales dans la réserve et sur la délivrance de permis d'affaires, art. 83(1) ; la Loi sur la gestion financière des premières nations (2005), art. 5(1), offre un régime de taxation foncière distinct. Les droits d'un Indien ou d'une bande sur une réserve et leurs biens meubles situés sur une réserve sont exemptés de taxes, Loi sur les Indiens, art. 87.", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le statut d'Indien inscrit est fixé par la loi fédérale et tenu dans le registre des Indiens par l'État ; une bande peut décider de l'appartenance à ses effectifs (liste de bande) si elle en fixe les règles par écrit avec l'accord de la majorité de ses électeurs, art. 10(1) ; à la fin de 2022, 230 bandes, environ 40 % de celles régies par la loi, avaient exercé ce droit selon Services aux Autochtones Canada.", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/TexteComplet.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2021, la vérificatrice générale du Canada constate qu'au 1er novembre 2020, 60 avis à long terme sur la qualité de l'eau potable restaient en vigueur dans des collectivités des Premières Nations, dont 28 depuis plus de dix ans, et qu'aucun régime de réglementation de l'eau potable ne s'y appliquait. En 2023, le Rapporteur spécial de l'ONU relève la discrimination fondée sur le sexe que maintiennent les règles d'inscription (A/HRC/54/31/Add.2, par. 40 et 41).", source: "https://www.canada.ca/content/canadasite/fr/verificateur-general/notre-travail/rapports-daudit/parl-oag-202102-03-f.html"}
chronologie:
  - {annee: 1876, evenement: "Première Loi sur les Indiens, qui réunit des ordonnances coloniales antérieures."}
  - {annee: 1951, evenement: "Nouvelle version de la loi ; la définition actuelle de la bande renvoie aux terres mises de côté avant ou après le 4 septembre 1951."}
  - {annee: 1982, evenement: "L'art. 35 de la Loi constitutionnelle reconnaît et confirme les droits ancestraux et issus de traités."}
  - {annee: 1985, evenement: "Refonte (L.R.C. 1985, ch. I-5) ; la modification L.R. 1985, ch. 32 (1er suppl.) permet aux bandes de fixer les règles d'appartenance à leurs effectifs (art. 10)."}
  - {annee: 1996, evenement: "Signature de l'Accord-cadre relatif à la gestion des terres de premières nations par le Canada et treize premières nations, le 12 février."}
  - {annee: 2004, evenement: "Arrêt Nation haïda c. Colombie-Britannique de la Cour suprême : obligation de consulter de la Couronne."}
  - {annee: 2005, evenement: "Loi sur la gestion financière des premières nations."}
  - {annee: 2014, evenement: "Loi sur les élections au sein de premières nations ; abrogation du pouvoir du ministre d'annuler les règlements administratifs des bandes (art. 82)."}
  - {annee: 2018, evenement: "Le Comité des droits de l'homme de l'ONU conclut au caractère discriminatoire des règles d'inscription (affaire McIvor et Grismer c. Canada, constatations du 1er novembre 2018)."}
  - {annee: 2021, evenement: "Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones ; rapport de la vérificatrice générale sur l'eau potable."}
  - {annee: 2022, evenement: "Loi sur l'Accord-cadre relatif à la gestion des terres de premières nations (L.C. 2022, ch. 19, art. 121)."}
  - {annee: 2023, evenement: "Rapport du Rapporteur spécial de l'ONU sur sa visite au Canada (A/HRC/54/31/Add.2)."}
fiabilite:
  verifie: ["Loi sur les Indiens, à jour au 21 septembre 2026 : art. 2(1) (bande, conseil de la bande), 10(1), 18, 20(1), 28, 37 à 39, 58(1), 74, 81(1), 82 (abrogé, 2014, ch. 38, art. 7), 83(1), 85.1, 87, 89.", "Population inscrite au 31 décembre 2022 : 521 373 personnes dans les réserves et sur les terres de la Couronne, 1 063 043 au total, 619 bandes, 3 414 réserves, 230 bandes ayant leurs propres règles d'appartenance (Services aux Autochtones Canada, page modifiée le 28 août 2024).", "Couche fédérale des limites législatives des terres autochtones : 3 288 entités de type « Réserve indienne » (IR) au service ArcGIS de Ressources naturelles Canada, consulté en octobre 2026 ; elle inclut les réserves de Kahnawake no 14, Akwesasne no 15 et no 59, Six Nations no 40, Sheshatshiu no 3 et Natuashish no 2. Le tableau reprend ces 3 288 entités une à une (noms et provinces identiques à la couche).", "McIvor et Grismer c. Canada (CCPR/C/124/D/2020/2010) : constatations adoptées le 1er novembre 2018, violation des art. 3 et 26 lus avec l'art. 27 du Pacte (par. 8).", "Loi sur la Déclaration des Nations Unies (L.C. 2021, ch. 14), art. 5.", "A/HRC/54/31/Add.2, par. 7, 10, 40, 41 et 93.", "Vérificatrice générale, rapport 3 de 2021 : 60 avis à long terme au 1er novembre 2020, 28 depuis plus de dix ans, absence de régime de réglementation."]
  non_confirme: ["Le tableau des réserves reprend toutes les entités « Réserve indienne » de la couche fédérale, y compris celles de bandes dotées d'un accord sectoriel ou d'un code foncier ; il ne distingue pas les bandes sans accord d'autonomie.", "Surface totale des réserves et nombre de localités habitées : non établis à partir d'une source officielle consultée.", "Nombre de bandes ayant un code foncier en vigueur, de bandes au conseil coutumier et de bandes inscrites à l'annexe de la Loi sur les élections au sein de premières nations : non vérifiés.", "Écart entre les 3 414 réserves de Services aux Autochtones Canada (2022) et les 3 288 réserves indiennes de la couche cartographique fédérale (2026) : non expliqué.", "Le rapport du Rapporteur spécial date de 2019 les constatations McIvor et Grismer ; le texte du Comité indique une adoption le 1er novembre 2018 et une diffusion le 20 novembre 2019.", "La Loi sur les Indiens s'applique aussi aux bandes du Yukon et à des terres de la Couronne hors réserve ; ces situations ne sont pas détaillées ici."]
