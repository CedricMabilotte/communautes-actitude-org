resume: >-
  La Loi sur les Indiens (L.R.C. 1985, ch. I-5), dont la première version date de 1876, régit les bandes (groupes reconnus par la loi) de Premières Nations et leurs réserves (terres de l'État mises de côté à l'usage d'une bande). La Couronne détient les réserves « à l'usage et au profit » des bandes (art. 18) ; elles ne peuvent être vendues ou louées qu'après un vote de la bande (art. 37 à 39.1). Chaque bande est dirigée par un conseil élu ou choisi selon la coutume (art. 2 et 74), qui prend des règlements administratifs (normes locales) (art. 81) et peut, avec l'approbation du ministre, lever des taxes foncières (art. 83). Au 31 décembre 2022, le registre fédéral compte 619 bandes et 3 414 réserves ; la couche fédérale des limites législatives recense 3 288 réserves indiennes. Cette fiche couvre les Premières Nations qui restent sous ce régime faute d'accord d'autonomie gouvernementale ; le tableau inclut les réserves de Kahnawake, d'Akwesasne, des Six Nations de la rivière Grand et des Innus du Labrador (Sheshatshiu, Natuashish) ; les nations dotées d'un accord sectoriel, comme les Mi'kmaq de Nouvelle-Écosse en éducation, y restent soumises hors du domaine de l'accord. Les Premières Nations dont le code foncier est en vigueur ne relèvent plus de la loi pour la gestion des terres (fiche « Premières Nations sous l'Accord-cadre relatif à la gestion des terres ») ; le tableau et le décompte des réserves incluent aussi celles des nations qui ont une fiche propre en raison d'un accord d'autonomie gouvernementale (Westbank, Sioux Valley, Whitecap, Nation des Anishinabes).
