reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada a adopté en 2021 la Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones (L.C. 2021, ch. 14) ; l'art. 5 oblige le gouvernement à veiller, en consultation avec les peuples autochtones, à ce que les lois fédérales soient compatibles avec la Déclaration. Le Rapporteur spécial de l'ONU relève en 2023 que cette obligation vise notamment la Loi sur les Indiens (A/HRC/54/31/Add.2, par. 10).", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/page-1.html"}
  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial sur les droits des peuples autochtones sur sa visite au Canada (A/HRC/54/31/Add.2) : les Premières Nations sans traité sont en général soumises à la Loi sur les Indiens (par. 7) ; la section D (par. 40 et 41) et la recommandation du par. 93 portent sur la discrimination fondée sur le sexe dans les règles d'inscription de la loi.", annee: 2023, source: "https://documents.un.org/doc/undoc/gen/g23/139/13/pdf/g2313913.pdf"}
  - {mecanisme: "organe_traite", detail: "Constatations du Comité des droits de l'homme dans l'affaire McIvor et Grismer c. Canada (CCPR/C/124/D/2020/2010) : les dispositions d'inscription de la Loi sur les Indiens violent les art. 3 et 26 du Pacte international relatif aux droits civils et politiques (égalité entre hommes et femmes, égale protection de la loi), lus avec l'art. 27 (droit des minorités à leur culture). Constatations adoptées le 1er novembre 2018, diffusées le 20 novembre 2019.", annee: 2018, source: "https://tbinternet.ohchr.org/_layouts/15/treatybodyexternal/Download.aspx?symbolno=CCPR%2FC%2F124%2FD%2F2020%2F2010&Lang=fr"}
