resume: >-
  Les cinq premières nations maanulthes font partie des Nuu-chah-nulth, peuple autochtone de la côte ouest de l'île de Vancouver : Huu-ay-aht, Ka:'yu:'k't'h'/Che:k'tles7et'h', Toquaht, Uchucklesaht et Yuułuʔiłʔatḥ (Première Nation des Ucluelets). L'Accord définitif concernant les premières nations maanulthes, conclu avec le Canada et la Colombie-Britannique, est un traité au sens de l'article 35 de la Loi constitutionnelle de 1982. Il est entré en vigueur le 1er avril 2011. Chaque nation dispose de son propre gouvernement, de sa constitution, d'un pouvoir législatif et de terres en fief simple (pleine propriété) ; un seul accord couvre les cinq nations, d'où une fiche commune.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien. La loi de 2009 sur l'accord désigne les Nuu-chah-nulth comme « un peuple autochtone du Canada ».", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Accord définitif concernant les premières nations maanulthes (Maa-nulth First Nations Final Agreement)", nature: "traite", annee: 2011, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  - {instrument: "Maa-nulth First Nations Final Agreement Act (SBC 2007, ch. 43), Colombie-Britannique", nature: "loi", annee: 2007, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_01"}
  - {instrument: "Loi sur l'accord définitif concernant les premières nations maanulthes (L.C. 2009, ch. 18)", nature: "loi", annee: 2009, source: "https://laws-lois.justice.gc.ca/fra/lois/M-0.55/page-1.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque première nation maanulthe a droit à l'autonomie gouvernementale et dispose d'un gouvernement établi selon sa constitution, Accord définitif, par. 13.1.1 et 13.1.2 ; la constitution prévoit un gouvernement élu au moins tous les cinq ans et peut intégrer les chefs héréditaires (Ha'wiih), par. 13.3.1 et 13.3.2.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  pouvoir_normatif: {valeur: "reconnu", note: "Chaque gouvernement maanulth légifère dans les domaines fixés par l'Accord (gouvernement, citoyenneté, terres, éducation, ressources forestières…), par. 13.1.1 et 13.11.1 ; en matière de citoyenneté, la loi maanulthe l'emporte sur les lois fédérales et provinciales, par. 13.13.3 ; les lois maanulthes sont admises d'office par les tribunaux, loi fédérale de 2009, art. 16.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  justice_propre: {valeur: "partiel", note: "Chaque gouvernement nomme des agents chargés de faire appliquer ses lois, par. 13.32.1, et établit des procédures d'appel ou de révision de ses décisions administratives, par. 13.3.1 o ; les poursuites pour infraction aux lois maanulthes relèvent de la Cour provinciale de la Colombie-Britannique, par. 13.33.1.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  terres: {valeur: "reconnu", note: "À l'entrée en vigueur, chaque première nation maanulthe est propriétaire en fief simple (pleine propriété) de ses terres, Accord définitif, par. 2.1.1, et loi fédérale de 2009, art. 7 ; chaque gouvernement légifère sur l'usage, l'aménagement et la cession de ses terres, par. 13.14.1.", source: "https://laws-lois.justice.gc.ca/fra/lois/M-0.55/page-1.html"}
  ressources: {valeur: "reconnu", note: "Chaque nation possède les ressources du sous-sol de ses terres (sauf une parcelle uchucklesaht), par. 4.1.1, et leurs ressources forestières, par. 9.1.1 ; elle a un droit de pêche à des fins domestiques dans la zone de pêche définie, limité par les mesures de conservation, de santé et de sécurité publiques, par. 10.1.1 et 10.1.2.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  consentement: {valeur: "partiel", note: "L'Accord définit l'obligation de consulter (préavis, information, délai pour formuler un avis) et l'applique à des cas précis, par exemple les changements de limites d'un district régional, par. 14.1.3, ou la levée d'une protection de bassin versant, par. 22.6.3 ; il ne prévoit pas de droit de refus.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  langue: {valeur: "partiel", note: "Chaque gouvernement légifère sur l'enseignement de la langue et de la culture nuu-chah-nulth et sur la certification de ses enseignants, et cette loi l'emporte sur les lois fédérales et provinciales, par. 13.19.1 et 13.19.2 ; le registre des lois peut être tenu en nuu-chah-nulth, la version anglaise faisant foi, par. 13.5.1.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  education: {valeur: "partiel", note: "Chaque gouvernement légifère sur l'enseignement de la maternelle à la 12e année qu'il dispense sur ses terres, par. 13.20.1, sous réserve de normes permettant le passage vers le système provincial et de la certification provinciale des enseignants, par. 13.20.2.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  fiscalite: {valeur: "partiel", note: "Chaque gouvernement peut lever des impôts directs sur ses citoyens sur ses terres, par. 19.1.1 ; ce pouvoir ne limite pas celui du Canada et de la Colombie-Britannique, par. 19.1.2. Un accord sur le traitement fiscal a force de loi, loi fédérale de 2009, art. 8.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Chaque gouvernement légifère sur la citoyenneté de sa nation, par. 13.13.1 ; cette citoyenneté ne confère ni la citoyenneté canadienne ni le statut d'Indien au sens de la Loi sur les Indiens, par. 13.13.2.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07043_00_multi"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Selon le rapport annuel 2025 de la Commission des traités de la Colombie-Britannique, organisme indépendant des trois parties, chaque nation met en œuvre l'Accord depuis le 1er avril 2011 ; la Nation Huu-ay-aht exerce son pouvoir législatif depuis cette date et siège avec droit de vote au conseil du district régional d'Alberni-Clayoquot. Des modifications de l'Accord, en vigueur le 23 juin 2023, ont rétabli les exemptions fiscales de l'article 87 de la Loi sur les Indiens sur les anciennes réserves.", source: "https://bctreaty.ca/wp-content/uploads/2025/10/BCTC-Annual-Report-2025-1.pdf"}
chronologie:
  - {annee: 1994, evenement: "Quatorze nations nuu-chah-nulth entrent ensemble en négociation de traité."}
  - {annee: 2007, evenement: "Ratification de l'Accord par les cinq nations maanulthes (octobre) ; loi d'approbation de la Colombie-Britannique (SBC 2007, ch. 43)."}
  - {annee: 2009, evenement: "Loi fédérale sur l'accord, sanctionnée le 18 juin (L.C. 2009, ch. 18)."}
  - {annee: 2011, evenement: "Entrée en vigueur de l'Accord le 1er avril ; la Loi sur les Indiens cesse de s'appliquer aux nations maanulthes, sauf pour établir le statut d'Indien."}
  - {annee: 2023, evenement: "Modifications de l'Accord en vigueur le 23 juin : rétablissement des exemptions fiscales de la Loi sur les Indiens sur les anciennes réserves."}
  - {annee: 2025, evenement: "Renouvellement de l'accord de gouvernement à gouvernement entre les nations maanulthes et la Colombie-Britannique (communiqué provincial du 1er avril 2026)."}
  - {annee: 2026, evenement: "Quinzième anniversaire de l'Accord, le 1er avril, marqué avec le gouvernement de la Colombie-Britannique."}
fiabilite:
  verifie: ["Loi fédérale L.C. 2009, ch. 18 : art. 3 (traité au sens de l'art. 35), art. 7 (fief simple), art. 12 (Loi sur les Indiens), art. 16, note d'entrée en vigueur (sanction le 18 juin 2009, en vigueur le 1er avril 2011).", "Accord définitif (annexe de la loi SBC 2007, ch. 43) : par. 2.1.1, 4.1.1, 9.1.1, 10.1.1-10.1.2, 13.1.1-13.3.2, 13.5.1, 13.13.1-13.13.3, 13.14.1, 13.19.1-13.20.2, 13.32.1, 13.33.1, 14.1.3, 14.3.1, 19.1.1-19.1.2, 22.6.3.", "Superficies par nation au par. 2.1.1 (exprimées en hectares, « more or less ») ; total de 24 551 ha, cohérent avec les 24 550 ha cités par la Commission des traités.", "Rapport annuel 2025 de la Commission des traités : nombres approximatifs de citoyens, mise en œuvre par chaque nation, modifications fiscales de 2023."]
  non_confirme: ["Population : chiffres arrondis de citoyens (membres résidant ou non sur les terres), repris par la Commission des traités ; pas de chiffre de résidents.", "Nombre de villages habités : non établi.", "Année de ratification par les nations : 2007 selon la Commission des traités de la C.-B., 2009 selon la Société du traité maanulth.", "Adhésion effective aux districts régionaux (par. 14.3.1) : vérifiée pour la Nation Huu-ay-aht seulement.", "Fonctionnement du tribunal de la Nation Huu-ay-aht (Tribunal Act, HFNA 13/2011, en vigueur) : décisions non consultées."]
