effectivite: {valeur: "partielle", note: "La Stratégie relative aux pêches autochtones (1992) conduit à la signature d'environ 125 ententes par an, dont deux tiers dans la région du Pacifique, et environ 900 permis de pêche commerciale ont été délivrés à des groupes autochtones par le Programme de transfert des allocations depuis 1994-1995 (MPO). En mars 2020, 174 groupes autochtones participaient aux programmes de pêches commerciales autochtones, regroupés dans 67 entreprises de pêche commerciale (évaluation du MPO, mars 2021). Selon F. Wien, S. D. Fuller et R. Williams (Options politiques, 2021), la quasi-totalité des 35 Premières Nations des Maritimes et du Québec visées par l'arrêt Marshall pratiquent une pêche commerciale au moyen de permis communautaires délivrés par le MPO ; en 2020, quelques communautés mi'kmaq ont délivré leurs propres permis à leurs membres hors de ce cadre, et des foules non autochtones ont menacé des pêcheurs mi'kmaq et brûlé des bateaux et des bâtiments d'usine en Nouvelle-Écosse.", source: "https://policyoptions.irpp.org/fr/2021/05/le-droit-issu-de-traites-des-mikmaq-et-des-malecites-a-la-peche-de-subsistance/"}
chronologie:
  - {annee: 1990, evenement: "Arrêt R. c. Sparrow : la Cour suprême reconnaît le droit ancestral des Musqueam de pêcher à des fins alimentaires, sociales et rituelles, protégé par l'article 35."}
  - {annee: 1992, evenement: "Lancement de la Stratégie relative aux pêches autochtones et Règlement sur les accords de pêche autochtones (DORS/92-415)."}
  - {annee: 1993, evenement: "Le Règlement sur les permis de pêche communautaires des Autochtones (DORS/93-332) remplace le règlement de 1992 (16 juin)."}
  - {annee: 1994, evenement: "Début du Programme de transfert des allocations (exercice 1994-1995)."}
  - {annee: 1999, evenement: "Arrêt Marshall : droit issu de traités des Mi'kmaq et des Wolastoqiyik de pêcher pour assurer une « subsistance convenable »."}
  - {annee: 2000, evenement: "Initiative de l'après-Marshall (2000-2007) : 354 millions de dollars pour des permis communautaires commerciaux, des bateaux et la formation ; ententes avec 32 des 34 Premières Nations admissibles (permis, bateaux, engins et formation)."}
  - {annee: 2019, evenement: "Modification de la Loi sur les pêches : prise en compte des droits de l'article 35 (art. 2.4) et accords avec les corps dirigeants autochtones (art. 4.1)."}
  - {annee: 2020, evenement: "Quelques communautés mi'kmaq délivrent leurs propres permis à leurs membres pour une pêche commerciale du homard à petite échelle ; à l'automne, des foules non autochtones menacent des pêcheurs mi'kmaq et brûlent des bateaux et des bâtiments d'usine en Nouvelle-Écosse."}
  - {annee: 2021, evenement: "Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones."}
fiabilite:
  verifie: ["Texte des art. 2 à 9 du DORS/93-332 (Site Web de la législation, règlement à jour au 21 septembre 2026, dernière modification le 1er avril 2009).", "Art. 2.4, 2.5, 4.1 et 43 de la Loi sur les pêches (Site Web de la législation).", "Lien entre le règlement et les permis ASR, préséance des pêches ASR sous réserve de la conservation, interdiction de vente des prises ASR (page « Pêche à des fins ASR » du MPO).", "Environ 125 ententes par an et environ 900 permis délivrés par le Programme de transfert des allocations depuis 1994-1995 (page « Stratégie relative aux pêches autochtones » du MPO).", "174 groupes autochtones participant aux programmes de pêches commerciales autochtones (AICFI, PICFI, NICFI), par 67 entreprises de pêche commerciale, en mars 2020 (évaluation du MPO, rapport final de mars 2021).", "354 millions de dollars et ententes avec 32 des 34 Premières Nations admissibles (note d'information du MPO au Sénat, 2021, version anglaise).", "Par. 64 et 73 du rapport A/HRC/27/52/Add.2.", "Définitions de la Loi sur la Déclaration des Nations Unies (art. 2) et objet (art. 4).", "Pratique commerciale par permis communautaires de la quasi-totalité des 35 Premières Nations visées par Marshall, permis délivrés par des communautés mi'kmaq en 2020 et violences de l'automne 2020 (Options politiques, 19 mai 2021)."]
  non_confirme: ["Nombre total de permis communautaires en vigueur et nombre d'organisations titulaires : aucun chiffre national publié trouvé ; pas de tableau.", "Règles internes adoptées par les organisations titulaires (plans de pêche communautaires) : non documentées par une source ouverte ; pouvoir normatif laissé « non établi ».", "Population des collectivités titulaires et surface des zones de pêche : aucun chiffre sourcé.", "L'art. 3 ne mentionne ni l'Alberta, ni la Saskatchewan, ni les eaux sans marée du Manitoba, ni le Nunavut, et exclut les parcs nationaux ; l'application aux eaux du Nunavut (détachées des Territoires du Nord-Ouest en 1999) n'a pas été vérifiée ; les régimes de pêche prévus par les traités modernes relèvent d'autres fiches.", "Aucun document d'un organe de traité de l'ONU visant nommément ce règlement n'a été trouvé.", "Base réglementaire des permis commerciaux communautaires attribués après l'arrêt Marshall (DORS/93-332 ou autre règlement) : non établie par les sources ouvertes.", "Texte intégral de l'arrêt Sparrow non lu (la page de la Cour suprême répond, mais le texte n'y est pas chargé hors navigateur) ; contenu repris des pages ASR et SRAPA du MPO.", "Nombre de villages : non trouvé."]
