resume: >-
  Fiche agrégée : elle couvre les Premières Nations et autres collectivités autochtones titulaires d'un permis de pêche communautaire délivré en vertu du Règlement sur les permis de pêche communautaires des Autochtones (DORS/93-332), pris en 1993 en vertu de la Loi sur les pêches. Le ministre (fédéral ; provincial pour certaines eaux du Québec et les eaux sans marée de l'Ontario, art. 2) délivre le permis à une « organisation autochtone » (bande, conseil de bande, « conseil de tribu » ou association représentant une collectivité territoriale autochtone), qui désigne par écrit les pêcheurs et les bateaux lorsque le ministre ne le fait pas (art. 4) ; le ministre fixe les conditions : espèces, quantités, engins, débarquement, aliénation des prises (art. 5). Les permis de pêche à des fins alimentaires, sociales et rituelles (ASR), droit protégé par l'article 35 de la Loi constitutionnelle de 1982 selon l'arrêt Sparrow (1990), sont délivrés en vertu de ce règlement. Après l'arrêt Marshall (1999), des permis commerciaux communautaires ont aussi été attribués à des Premières Nations des Maritimes et du Québec. Les droits issus des traités de paix et d'amitié des Maritimes et le droit de pêche commerciale des nations nuu-chah-nulth ont leur propre fiche.
