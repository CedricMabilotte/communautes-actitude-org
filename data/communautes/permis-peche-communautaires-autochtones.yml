reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de mission au Canada du Rapporteur spécial James Anaya (A/HRC/27/52/Add.2, 2014) : le par. 73 relève, parmi les griefs des représentants autochtones, la fixation sans consultation de la part de la pêche du saumon attribuée aux usages autochtones (sociaux et commerciaux) ; le par. 64 cite le litige des Nuu-chah-nulth sur un droit de pêche commerciale.", annee: 2014, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
  - {mecanisme: "dnudpa", detail: "Le Canada a adopté en 2021 la Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones, qui confirme que la Déclaration « trouve application en droit canadien » (art. 4) et vise les peuples autochtones au sens du paragraphe 35(2) de la Loi constitutionnelle de 1982 (art. 2).", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/TexteComplet.html"}
base_nationale:
  - {instrument: "Loi constitutionnelle de 1982, art. 35 (droits ancestraux et issus de traités), tel qu'interprété dans R. c. Sparrow, [1990] 1 RCS 1075", nature: "jurisprudence", annee: 1990, source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/item/609/index.do"}
  - {instrument: "Règlement sur les permis de pêche communautaires des Autochtones (DORS/93-332), art. 2 (organisation autochtone), 3 (application), 4 (permis et désignations), 5 (conditions), 7 et 8 (interdictions)", nature: "loi", annee: 1993, source: "https://laws-lois.justice.gc.ca/fra/reglements/DORS-93-332/page-1.html"}
  - {instrument: "Loi sur les pêches (L.R.C. 1985, ch. F-14), art. 2.4 (effets préjudiciables sur les droits de l'article 35), 2.5 (connaissances autochtones), 4.1 (accords avec un corps dirigeant autochtone), 43 (règlements), modifiée en 2019 (L.C. 2019, ch. 14)", nature: "loi", annee: 2019, source: "https://laws-lois.justice.gc.ca/fra/lois/f-14/TexteComplet.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le permis est délivré à une « organisation autochtone », terme qui « s'entend notamment d'une bande indienne, d'un conseil de bande indienne, d'un conseil de tribu et d'une association qui représente une collectivité territoriale autochtone » (art. 2 et 4(1) du DORS/93-332). L'organisation désigne les pêcheurs et les bateaux lorsque le ministre ne le fait pas (art. 4(3) et 4(4)), sous l'autorité du ministre qui délivre le permis à sa discrétion et peut en fixer les conditions (art. 5). Le règlement ne crée pas d'institution propre : il s'appuie sur les bandes et conseils existants.", source: "https://laws-lois.justice.gc.ca/fra/reglements/DORS-93-332/page-1.html"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le permis autorise l'organisation autochtone à pratiquer la pêche et les activités connexes ; elle peut désigner par écrit les pêcheurs et les bateaux lorsque le ministre ne les désigne pas (art. 4 du DORS/93-332). Le ministre peut fixer les espèces et quantités, les engins, les lieux et moments de débarquement et l'aliénation des prises (art. 5). Selon l'arrêt Sparrow (1990), le droit de pêche à des fins alimentaires, sociales et rituelles a préséance, sous réserve de la conservation ; les prises ASR ne peuvent pas être vendues (MPO).", source: "https://www.dfo-mpo.gc.ca/fisheries-peches/aboriginal-autochtones/fsc-asr-fra.html"}
  consentement: {valeur: "partiel", note: "Le ministre prend toute décision en vertu de la Loi sur les pêches « en tenant compte des effets préjudiciables que la décision peut avoir sur les droits des peuples autochtones du Canada reconnus et confirmés par l'article 35 » (art. 2.4, ajouté en 2019) et peut prendre en considération les connaissances autochtones (art. 2.5). Il s'agit d'une obligation de prise en compte : la loi n'inscrit ni obligation de consulter ni consentement.", source: "https://laws-lois.justice.gc.ca/fra/lois/f-14/TexteComplet.html"}
  langue: {valeur: "non_applicable", note: "", source: ""}
