resume: >-
  La Première Nation de Tsawwassen appartient aux Salishs de la côte ; ses terres se trouvent à Roberts Bank, au sud de Vancouver. L'Accord définitif concernant la Première Nation de Tsawwassen, conclu avec le Canada et la Colombie-Britannique, est en vigueur depuis le 3 avril 2009. La loi fédérale de 2008 le reconnaît comme un traité au sens de l'article 35 de la Loi constitutionnelle de 1982. Il institue un gouvernement tsawwassen doté d'un pouvoir législatif, attribue à la Première Nation la propriété de ses terres et met fin à l'application de la Loi sur les Indiens.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien. La loi fédérale de 2008 désigne la Première Nation de Tsawwassen comme partie des Salishs de la côte, « un peuple autochtone du Canada ».", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Accord définitif concernant la Première Nation de Tsawwassen (Tsawwassen First Nation Final Agreement)", nature: "traite", annee: 2009, source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  - {instrument: "Tsawwassen First Nation Final Agreement Act (SBC 2007, ch. 39), Colombie-Britannique", nature: "loi", annee: 2007, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/07039_00_multi"}
  - {instrument: "Loi sur l'accord définitif concernant la Première Nation de Tsawwassen (L.C. 2008, ch. 32)", nature: "loi", annee: 2008, source: "https://laws-lois.justice.gc.ca/fra/lois/T-21.5/page-1.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Première Nation de Tsawwassen a droit à l'autonomie gouvernementale ; le gouvernement tsawwassen, prévu par la Constitution tsawwassenne, est son gouvernement, Accord définitif, chapitre 16, art. 1 et 2 ; la Constitution prévoit un gouvernement démocratique élu au moins tous les cinq ans, art. 8.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le gouvernement tsawwassen légifère sur ses institutions, ses élections et l'appartenance à la Première Nation ; ces lois l'emportent en cas de conflit avec une loi fédérale ou provinciale, sauf en matière de protection des renseignements personnels, chapitre 16, art. 43, 47, 48 et 49 ; les lois tsawwassennes sont admises d'office (reconnues sans preuve de leur existence), loi fédérale, art. 17.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  justice_propre: {valeur: "partiel", note: "Le pouvoir législatif tsawwassen ne comprend pas la création d'un tribunal, chapitre 16, art. 141 ; la Cour provinciale juge les infractions aux lois tsawwassennes, art. 147, et la Première Nation conduit les poursuites, art. 149 ; la Constitution tsawwassenne doit prévoir une procédure de contestation de la validité des lois tsawwassennes, art. 8.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  terres: {valeur: "reconnu", note: "La Première Nation de Tsawwassen possède les Terres tsawwassennes en fief simple (pleine propriété), « soit le domaine le plus complet en droit », sans condition tirée de la Land Act ; aucune expropriation hors des cas prévus par l'Accord, chapitre 4, art. 2 ; loi fédérale, art. 7.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  ressources: {valeur: "reconnu", note: "Les ressources du sous-sol font partie des Terres tsawwassennes, chapitre 4, art. 1 ; la Première Nation possède les ressources forestières de ces terres, chapitre 8, art. 1 ; elle détient un droit de pêche à des fins domestiques, limité par les mesures de conservation, de santé et de sécurité publiques, chapitre 9, art. 1 et 2.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  consentement: {valeur: "partiel", note: "L'Accord définit la consultation (préavis, information, délai, examen des points de vue), chapitre 1 ; le Canada ou la Colombie-Britannique doivent consulter la Première Nation dans des cas énumérés, par exemple la création d'une aire marine protégée dans le territoire tsawwassen, chapitre 9, art. 99 ; l'Accord ne prévoit pas de droit de refus.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  langue: {valeur: "partiel", note: "La Première Nation a le droit d'utiliser la langue hun'qum'i'num, chapitre 14, art. 1 ; ses lois sur la promotion de cette langue l'emportent en cas de conflit, art. 2 et 3 ; le registre des lois est tenu en anglais et, à son choix, en hun'qum'i'num, chapitre 16, art. 16 ; ce n'est pas une langue officielle.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  education: {valeur: "partiel", note: "Le gouvernement tsawwassen légifère sur l'enseignement de la culture et de la langue, et sur l'enseignement de la maternelle à la 12e année et l'enseignement à domicile sur les Terres tsawwassennes, chapitre 16, art. 77, 78 et 80 ; ces lois doivent fixer des normes qui permettent le passage au système provincial, art. 79.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  fiscalite: {valeur: "partiel", note: "Le gouvernement tsawwassen peut légiférer en matière d'impôts directs sur ses membres sur les Terres tsawwassennes, chapitre 20, art. 1 ; ce pouvoir ne limite pas celui du Canada et de la province, art. 2.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le gouvernement tsawwassen légifère sur l'appartenance à la Première Nation, et cette loi l'emporte en cas de conflit, chapitre 16, art. 48 et 49 ; l'appartenance ne confère ni la citoyenneté canadienne ni le statut d'Indien, art. 50.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1100100022706/1617822212568"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le rapport annuel 2025 de la Commission des traités de la Colombie-Britannique, organisme statutaire tripartite indépendant des parties, relève l'adoption par la Législature tsawwassenne d'une loi de crédits (Appropriations Act) le 9 mars 2023, l'achèvement en septembre 2024 de l'incorporation de 11 parcelles de Brunswick Point prévue par le traité, et la consultation des membres sur la révision périodique du traité, possible depuis son 15e anniversaire ; le rapport de mise en œuvre 2015-2017 des trois parties relevait des désaccords sur l'accord de financement budgétaire et le partage des recettes de taxe de vente.", source: "https://bctreaty.ca/wp-content/uploads/2025/10/BCTC-Annual-Report-2025-1.pdf"}
chronologie:
  - {annee: 2003, evenement: "Les membres de la Première Nation approuvent l'accord de principe (10 décembre)."}
  - {annee: 2006, evenement: "Paraphe de l'Accord définitif (8 décembre)."}
  - {annee: 2007, evenement: "Loi provinciale d'approbation (sanction le 22 novembre) ; signature de l'Accord par les trois parties (6 décembre)."}
  - {annee: 2008, evenement: "Loi fédérale sur l'accord définitif (sanction le 26 juin)."}
  - {annee: 2009, evenement: "Entrée en vigueur de l'Accord (3 avril) ; la Loi sur les Indiens cesse de s'appliquer à la Première Nation."}
  - {annee: 2024, evenement: "Incorporation de 11 parcelles de Brunswick Point (environ 173 acres) prévue par le traité, achevée en septembre ; le traité peut faire l'objet d'une révision périodique depuis son 15e anniversaire (3 avril)."}
fiabilite:
  verifie: ["Loi fédérale L.C. 2008, ch. 32, sanctionnée le 26 juin 2008 : art. 3 (traité au sens des art. 25 et 35 de la Loi constitutionnelle de 1982), art. 7 (fief simple), art. 12 (Loi sur les Indiens), art. 17 (lois tsawwassennes).", "Loi provinciale SBC 2007, ch. 39, sanctionnée le 22 novembre 2007, avec le texte de l'Accord en annexe.", "Accord définitif : chapitre 4 art. 1 et 2, chapitre 8 art. 1, chapitre 9 art. 1, 2 et 99, chapitre 14 art. 1 à 3, chapitre 16 art. 1, 2, 8, 16, 43, 47 à 50, 77 à 81, 141, 147 et 149, chapitre 17 art. 1, chapitre 20 art. 1 et 2.", "Date d'entrée en vigueur du 3 avril 2009 : Accord, annexe 1 du chapitre 18 (version française), et Commission des traités de la Colombie-Britannique.", "Population inscrite rattachée à la Première Nation (bande n° 577) : 431 personnes en septembre 2026, dont 195 dans leur propre réserve (Profils des Premières Nations, RCAANC).", "Accord définitif, chapitre 17, art. 1 : la Première Nation est membre du district régional du Grand Vancouver (Metro Vancouver).", "Le Conseil judiciaire tsawwassen entend les contestations de validité des lois tsawwassennes et les appels de décisions administratives (page Gouvernance de la Première Nation ; rapport de mise en œuvre 2015-2017).", "Rapport annuel 2025 de la Commission des traités : loi de crédits du 9 mars 2023, incorporation de 11 parcelles de Brunswick Point achevée en septembre 2024."]
  non_confirme: ["Superficie : le rapport de mise en œuvre 2015-2017 indique « plus de 724 hectares » transférés ; le recensement 2021 donne 6,57 km² de terres pour la subdivision ; l'écart n'est pas expliqué ; l'incorporation de 11 parcelles (environ 173 acres) en 2024 n'est pas comprise dans le chiffre de 2021.", "Nombre de membres : 477 selon le rapport de mise en œuvre 2015-2017 ; environ 505 citoyens selon la page de la Commission des traités (non datée).", "Endonyme : la graphie « sc̓əwaθən məsteyəxʷ » figure sur Wikipédia, sans confirmation sur une source de la Première Nation.", "Texte de la Constitution tsawwassenne et loi instituant le Conseil judiciaire : non consultés directement."]
