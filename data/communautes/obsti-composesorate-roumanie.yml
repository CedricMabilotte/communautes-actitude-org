effectivite: {valeur: "partielle", note: "Selon M. Vasile (International Journal of the Commons, 2018), environ 1 500 communs ont été reconstitués après 2000 ; sur 40 communs du département de Hunedoara interrogés en 2016, 67 % avaient des procès liés à la restitution et 20 % n'avaient pu récupérer de grandes surfaces réclamées ; les communs de moins de 100 ha ne peuvent obtenir de plan d'aménagement propre. Sorea et al. (2022) relèvent que plus de la moitié des communs étaient en procès avec des autorités en 2018, le coût des plans d'aménagement et des contrats obligatoires avec les districts forestiers, la dispersion des droits par héritage qui gêne la participation aux assemblées, et l'éviction des jeunes des décisions.", source: "https://thecommonsjournal.org/articles/10.18352/ijc.805"}
chronologie:
  - {annee: 1871, evenement: "En Transylvanie austro-hongroise, la loi 53/1871 répartit les communs en quotes-parts indivises par foyer."}
  - {annee: 1910, evenement: "Le Code forestier roumain formalise les droits sur les communs de Valachie et reconnaît les communautés d'ayants droit comme personnes morales."}
  - {annee: 1948, evenement: "Les forêts et pâturages communs passent sous propriété et gestion de l'État."}
  - {annee: 2000, evenement: "La loi n° 1/2000 restitue les forêts aux formes associatives et leur rend la personnalité juridique."}
  - {annee: 2001, evenement: "L'ordonnance d'urgence n° 102/2001 limite les demandes à 20 ha par ayant droit."}
  - {annee: 2005, evenement: "La loi n° 247/2005 prévoit la restitution intégrale des surfaces."}
  - {annee: 2008, evenement: "Adoption du Code forestier (loi n° 46/2008)."}
  - {annee: 2025, evenement: "Le nouveau Code forestier (loi n° 331/2024), publié le 9 janvier, abroge celui de 2008 et qualifie la propriété des formes associatives de garantie, indivisible et inaliénable (art. 8)."}
fiabilite:
  verifie:
    - "Loi n° 1/2000, art. 26, 27 et 28, lus dans la version consolidée de legeaz.net (modifications de l'ordonnance d'urgence n° 102/2001 et de la loi n° 247/2005) : titre de propriété commun, restitution intégrale, statut, personnalité juridique par décision du tribunal, indivision, interdiction d'aliéner terres et parts, retour à la commune en cas de dissolution."
    - "Loi n° 331/2024 portant Code forestier (Monitorul Oficial n° 7 du 9 janvier 2025), art. 8, 23, 25, 26, 63 et 167 (abrogation de la loi n° 46/2008), lus sur legeaz.net."
    - "Vasile (2018) : environ 1 500 communs, 873 000 ha de forêts (14 % du pays), environ 330 000 ha de pâturages (estimation), plus de 400 000 ayants droit (estimation) ; enquête 2015-2017 sur 330 communs ; 40 communs de Hunedoara interrogés en 2016 ; chiffre forestier tiré d'un rapport de la Cour des comptes de 2014."
    - "Sorea, Roșculeț et Rățulea (2022) : 873 000 ha, environ 300 000 ha de pâturages, organes (assemblée générale, conseil de cinq membres, président élu parmi eux, commission de contrôle de trois membres), plus de la moitié des communs en procès en 2018, départements concernés (Arad, Hunedoara, Brașov, Sibiu, Covasna, Harghita, Sălaj, Maramureș, Bihor)."
  non_confirme:
    - "Site officiel legislatie.just.ro inaccessible : textes lus sur un site de consolidation privé ; la version de la loi n° 1/2000 n'intègre que les modifications de 2001 et 2005 (le Code de 2024 renvoie à l'art. 27 pour l'inaliénabilité, que cette version place à l'art. 28)."
    - "Date d'entrée en vigueur du Code forestier de 2024 non vérifiée. Contenu du Code forestier de 2008 sur les formes associatives non vérifié."
    - "Nombre de composesorate dans les départements de Harghita et Covasna : aucune source chiffrée consultée. Aucune liste officielle des communs trouvée : pas de tableau des sites."
    - "Aucun document de l'ONU (CDB, registre APAC) ni du Conseil de l'Europe visant nommément ce régime n'a été consulté."
