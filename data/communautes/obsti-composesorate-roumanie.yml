resume: >-
  Les obști (communautés de copropriétaires de forêts et de pâturages : obști de moșneni en Valachie, obști de răzeși en Moldavie) et les composesorate (leur équivalent en Transylvanie) sont des propriétés communes de villages, détenues en indivision par des ayants droit qui en héritent des parts. Formalisées au XIXe siècle et par le Code forestier de 1910, elles ont été placées sous propriété d'État de 1948 à 1989. La loi n° 1/2000 leur restitue leurs forêts et pâturages sous un seul titre de propriété, leur rend la personnalité juridique sur décision du tribunal et interdit toute aliénation des terres comme des parts hors de l'association. Le Code forestier de 2024 (loi n° 331/2024) les qualifie de personnes morales dont la propriété est « garantie, indivisible et inaliénable ». Selon une estimation publiée en 2018, environ 1 500 communs détiennent 873 000 ha de forêts, gérées sous le régime forestier de l'État.
