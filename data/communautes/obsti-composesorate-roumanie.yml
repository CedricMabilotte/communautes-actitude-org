base_nationale:
  - {instrument: "Loi n° 1/2000 sur la reconstitution du droit de propriété sur les terres agricoles et forestières, art. 26 à 28 (restitution aux formes associatives : obști de moșneni, obști de răzeși, composesorate, forêts des anciens régiments frontaliers, forêts urbariales), modifiée par l'ordonnance d'urgence n° 102/2001", nature: "loi", annee: 2000, source: "https://legeaz.net/legea-1-2000/art-28"}
  - {instrument: "Loi n° 247/2005 sur la réforme dans les domaines de la propriété et de la justice (restitution intégrale des surfaces aux formes associatives, art. 26 al. 2 de la loi n° 1/2000 modifié)", nature: "loi", annee: 2005, source: "https://legeaz.net/legea-1-2000/art-26"}
  - {instrument: "Loi n° 331/2024 portant Code forestier, art. 8 (formes associatives spéciales de propriété du fonds forestier), publiée au Monitorul Oficial n° 7 du 9 janvier 2025 ; abroge le Code forestier de 2008 (loi n° 46/2008)", nature: "loi", annee: 2024, source: "https://legeaz.net/monitorul-oficial-7-2025/codul-silvic"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les ayants droit se reconstituent dans leurs formes associatives d'origine ; un comité ad hoc présente au tribunal un statut fixant les organes de direction, et la décision du tribunal rend à l'association sa personnalité juridique (loi n° 1/2000, art. 28 al. 1 à 4) ; le Code forestier de 2024 les déclare personnes morales et impose de notifier au district forestier (ocol silvic) tout changement des organes de représentation (art. 8 al. 1 et 3). L'assemblée générale des membres décide, avec un conseil de cinq membres, un président et une commission de contrôle (Sorea et al., 2022). Limite : la gestion forestière relève d'un district forestier sous contrat obligatoire.", source: "https://legeaz.net/legea-1-2000/art-28"}
  pouvoir_normatif: {valeur: "partiel", note: "L'administration et l'exploitation des forêts restituées se font selon les statuts des formes associatives admis par le droit roumain entre 1921 et 1946, dans la mesure où ils ne contredisent pas la législation en vigueur (loi n° 1/2000, art. 27) ; le statut fixe les droits et obligations des membres, les responsabilités et les sanctions (art. 28 al. 3). Ces statuts n'obligent que les membres.", source: "https://legeaz.net/legea-1-2000/art-27"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Un seul titre de propriété au nom de l'obște ou du composesorat et restitution de toute la surface détenue avant 1948 (loi n° 1/2000, art. 26 al. 1 et 2, version issue de la loi n° 247/2005) ; les forêts restent en propriété indivise, les membres ne peuvent céder leurs parts à des personnes extérieures et les terres ne peuvent être aliénées en aucune manière (art. 28 al. 5 à 7) ; le Code forestier de 2024 qualifie cette propriété de « garantie, indivisible et inaliénable » (art. 8 al. 2). En cas de dissolution, les terres passent dans la propriété publique des conseils locaux du lieu (art. 28 al. 8).", source: "https://legeaz.net/legea-1-2000/art-28"}
  ressources: {valeur: "partiel", note: "L'association, propriétaire privé de forêts, récolte le bois selon le plan d'aménagement forestier (amenajament silvic), obligatoire au-delà de 10 ha (Code forestier de 2024, art. 23 al. 2, art. 25 al. 2 et art. 63) ; elle doit conclure un contrat avec un district forestier (ocol silvic) : garde et services minimaux dans tous les cas, administration ou services techniques pour exercer ses droits de récolte (art. 26 al. 1 à 3), et respecter le régime forestier (art. 23 al. 1).", source: "https://legeaz.net/monitorul-oficial-7-2025/codul-silvic"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
