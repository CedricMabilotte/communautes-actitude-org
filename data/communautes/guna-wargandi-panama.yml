resume: >-
  Les Guna de Wargandí vivent dans le haut bassin du fleuve Chucunaque, dans la province de Darién, à l'est du Panama. La loi 34 du 25 juillet 2000 crée pour eux la comarca (division territoriale autochtone à statut spécial) Kuna de Wargandí, de 77 500 ha, détachée des districts de Chepigana et Pinogana. Les terres sont une propriété collective qui ne peut être cédée ni louée, et le Congrès général est reconnu comme autorité traditionnelle suprême. La comarca a rang de corregimiento (plus petite division administrative) ; son régime est distinct de ceux de Guna Yala et de Madungandí. Le recensement de 2023 y compte 2 781 habitants dans quatre localités.
