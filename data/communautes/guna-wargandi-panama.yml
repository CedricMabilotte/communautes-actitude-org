droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 34 de 2000 reconnaît le Congrès général comme autorité traditionnelle suprême et les congrès locaux (art. 3), ainsi que les caciques et les sahilas (chefs de village) comme autorités et représentants (art. 5).", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 34 de 2000 (art. 4) rend obligatoires dans la comarca les résolutions du Congrès général, à condition qu'elles ne contredisent ni la Constitution ni les lois ; la Charte organique est reconnue par décret de l'exécutif (art. 23).", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi 34 de 2000 (art. 7) soumet la justice à la Constitution et à la loi, avec prise en compte de la culture guna, et renvoie à la Charte organique les formes coutumières de règlement des conflits ; la Charte organique de 2008 (art. 75 à 77) applique les modes traditionnels de règlement des conflits, dans le respect des droits humains.", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  terres: {valeur: "reconnu", note: "La loi 34 de 2000 (art. 2) fait des terres de la comarca une propriété collective qui ne peut être attribuée, cédée ni louée ; les droits de possession des occupants non autochtones antérieurs à la loi sont maintenus hors de cette propriété.", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  ressources: {valeur: "partiel", note: "La loi 34 de 2000 confie au Congrès général l'élaboration d'un plan de gestion soumis à l'approbation de l'Autorité nationale de l'environnement (art. 9) et la protection des ressources en coordination avec l'État (art. 11 et 12) ; elle interdit l'exploitation forestière intensive (art. 13). La Charte organique de 2008 (art. 53 et 54) fait des ressources naturelles un « patrimoine collectif » du peuple guna de Wargandí, utilisé selon le droit national de l'environnement et les pratiques traditionnelles.", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  consentement: {valeur: "partiel", note: "La loi 37 de 2016 rend obligatoires la consultation et le consentement préalable, libre et éclairé des peuples des comarcas, conduits par les entités de l'État avant toute mesure législative ou administrative (art. 1 à 3) ; son article 10 permet aux autorités traditionnelles de conclure avec l'État et les entreprises des accords qui obligent les parties.", source: "https://faolex.fao.org/docs/pdf/pan164369.pdf"}
  langue: {valeur: "partiel", note: "La loi 88 de 2010 reconnaît la langue kuna (guna) (art. 1), fixe son alphabet (art. 2) et prévoit son enseignement à côté de l'espagnol dans toutes les comarcas (art. 4), sans statut de langue officielle.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 34 de 2000 (art. 14) prévoit une éducation bilingue interculturelle conduite par le ministère de l'Éducation en coordination avec les autorités traditionnelles.", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  fiscalite: {valeur: "partiel", note: "La loi 34 de 2000 (art. 20) oblige l'État à inscrire au budget national les crédits des programmes de développement de la comarca, conduits en coordination avec le Congrès général ; elle ne prévoit pas de pouvoir fiscal propre.", source: "https://docs.panama.justia.com/federales/leyes/34-de-2000-jul-28-2000.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les caciques de la comarca, reçus en août 2025 par la vice-ministre des Affaires autochtones, dénoncent l'occupation de terres de la comarca, notamment à Asnatí, par des éleveurs et des cultivateurs venus d'autres régions du pays ; le ministère de Gouvernement renvoie le dossier à la Commission nationale des limites et à l'Autorité nationale d'administration des terres. Le Rapporteur spécial de l'ONU (2014) relevait déjà, pour l'ensemble des Guna, un manque de consultation et l'arrivée de colons sur leurs terres. En août 2026, le Congrès général, réuni en session ordinaire du 15 au 19 août, approuve le projet d'interconnexion électrique entre le Panama et la Colombie à l'issue d'une procédure de consentement préalable, libre et éclairé ; Wargandí est la première des trois comarcas concernées à se prononcer (ministère de Gouvernement, 26 août 2026).", source: "https://www.diaadia.com.pa/el-pais/caciques-de-la-comarca-guna-de-wargandi-denuncian-invasiones-y-falta-de-electricidad-785539"}
chronologie:
  - {annee: 2000, evenement: "La loi 34 du 25 juillet crée la comarca Kuna de Wargandí sur 77 500 ha détachés des districts de Chepigana et Pinogana."}
  - {annee: 2008, evenement: "Le décret exécutif 414 du 22 octobre adopte la Charte organique administrative de la comarca."}
  - {annee: 2010, evenement: "La loi 88 reconnaît les langues et alphabets des peuples autochtones, dont le guna."}
  - {annee: 2014, evenement: "Le Rapporteur spécial de l'ONU sur les droits des peuples autochtones publie son rapport sur le Panama, qui cite la comarca."}
  - {annee: 2016, evenement: "La loi 37 instaure la consultation et le consentement préalable, libre et éclairé des peuples autochtones."}
  - {annee: 2023, evenement: "Le recensement compte 2 781 habitants dans quatre localités de la comarca."}
  - {annee: 2025, evenement: "Les caciques dénoncent auprès du ministère de Gouvernement l'occupation de terres de la comarca par des éleveurs et des cultivateurs."}
  - {annee: 2026, evenement: "Le Congrès général, réuni du 15 au 19 août, approuve le projet d'interconnexion électrique entre le Panama et la Colombie dans le cadre d'une procédure de consentement préalable, libre et éclairé."}
