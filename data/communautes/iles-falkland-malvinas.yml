resume: >-
  Population de l'archipel des îles Falkland (Malvinas), appelé Malouines en français courant, situé dans l'Atlantique Sud à environ 480 km des côtes de l'Amérique du Sud. Le territoire figure depuis 1946 sur la liste des territoires non autonomes de l'ONU, avec le Royaume-Uni comme puissance administrante ; l'Argentine revendique la souveraineté sur l'archipel, et l'Assemblée générale constate depuis 1965 un différend de souveraineté entre les deux États (résolution 2065 (XX)). La Constitution de 2008, en vigueur depuis le 1er janvier 2009, institue une Assemblée législative de huit élus et un Conseil exécutif dont trois membres sont choisis parmi ces élus, à côté d'un gouverneur nommé par la Couronne ; elle rappelle le droit des peuples à disposer d'eux-mêmes et définit le statut d'habitant des Falkland (Falkland Islands status). La résolution adoptée en 2025 par le Comité spécial de la décolonisation demande aux deux États de négocier en tenant compte des « intérêts de la population locale », sans mentionner le droit à l'autodétermination ; le Royaume-Uni affirme ce droit pour les habitants de l'archipel, l'Argentine le juge inapplicable.
