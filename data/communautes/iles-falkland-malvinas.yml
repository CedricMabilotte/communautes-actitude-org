reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Territoire non autonome administré par le Royaume-Uni, inscrit depuis 1946 ; document de travail du Secrétariat du Comité spécial de la décolonisation (A/AC.109/2025/6), qui rappelle le différend de souveraineté constaté par la résolution 2065 (XX) de l'Assemblée générale ; résolution A/AC.109/2025/L.8 du Comité spécial, adoptée sans vote en 2025, qui demande à l'Argentine et au Royaume-Uni de reprendre leurs négociations pour trouver une solution pacifique au conflit de souveraineté", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/L.8&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Falkland Islands Constitution Order 2008 (SI 2008/2846) : Constitution des îles Falkland", nature: "constitution", annee: 2008, source: "https://www.legislation.gov.uk/uksi/2008/2846/schedule/made"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée législative de huit élus, cinq pour Stanley et trois pour le Camp (Constitution de 2008, s. 26 et 27) ; Conseil exécutif de trois élus désignés chaque année par l'Assemblée et de deux membres de droit sans vote (s. 57 et 58) ; le gouverneur consulte ce Conseil et suit son avis (s. 66), sauf pour les affaires extérieures, la défense, la sécurité intérieure, la justice, l'audit et la fonction publique, ou au nom de la bonne gouvernance (s. 67).", source: "https://www.legislation.gov.uk/uksi/2008/2846/schedule/made"}
  pouvoir_normatif: {valeur: "partiel", note: "Le gouverneur fait les lois pour la paix, l'ordre et le bon gouvernement de l'archipel « avec l'avis et le consentement » de l'Assemblée législative (Constitution de 2008, s. 37) ; il peut refuser son assentiment ou réserver un projet à la Couronne (s. 52), toute ordonnance peut être désavouée (annulée) par la Couronne (s. 54), le gouverneur peut faire adopter un texte refusé par l'Assemblée sur instruction de Londres (s. 55), et la Couronne garde le plein pouvoir de légiférer pour le territoire (ordonnance de 2008, art. 11).", source: "https://www.legislation.gov.uk/uksi/2008/2846/made"}
  justice_propre: {valeur: "partiel", note: "Cour suprême et Cour d'appel propres aux îles Falkland (Constitution de 2008, s. 86 et 87) ; l'administration de la justice fait partie des domaines où le gouverneur peut passer outre à l'avis du Conseil exécutif (s. 67, al. 2 d).", source: "https://www.legislation.gov.uk/uksi/2008/2846/schedule/made"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution de 2008 (s. 1 a) rappelle que les peuples disposent librement de leurs richesses et ressources naturelles ; selon le Royaume-Uni, la gestion des pêcheries et de l'exploration des hydrocarbures est confiée au gouvernement des îles Falkland, qui attribue des quotas individuels transférables ; l'Argentine conteste ces activités au titre de la résolution 31/49 de l'Assemblée générale.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/6&l=fr&t=pdf"}
  consentement: {valeur: "partiel", note: "Le gouverneur consulte le Conseil exécutif pour la formulation des politiques et l'exercice de ses fonctions (Constitution de 2008, s. 66) ; il peut agir contre son avis et en rend compte au secrétaire d'État britannique, l'avis des membres étant consigné au procès-verbal (s. 67) ; avant d'imposer un texte refusé par l'Assemblée, il en informe le Conseil exécutif et entend ses membres (s. 55, al. 2).", source: "https://www.legislation.gov.uk/uksi/2008/2846/schedule/made"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "L'éducation ne figure pas parmi les domaines réservés au gouverneur (Constitution de 2008, s. 67, al. 2) et relève donc de la politique arrêtée avec le Conseil exécutif (s. 66) ; l'enseignement est gratuit et obligatoire de 5 à 16 ans, et selon le Royaume-Uni les études post-secondaires, y compris universitaires, sont financées en totalité par le gouvernement des îles Falkland ; la Constitution garantit un enseignement primaire gratuit (s. 12).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/6&l=fr&t=pdf"}
  fiscalite: {valeur: "partiel", note: "Les recettes publiques alimentent un fonds consolidé (Consolidated Fund) dont les dépenses sont autorisées par une loi de finances votée par l'Assemblée législative (Constitution de 2008, s. 74 à 76) ; l'Assemblée ne peut examiner un projet qui crée ou modifie un impôt que sur recommandation du gouverneur (s. 51, al. 2).", source: "https://www.legislation.gov.uk/uksi/2008/2846/schedule/made"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La Constitution de 2008 définit le statut d'habitant des Falkland (Falkland Islands status) par la naissance, l'ascendance ou l'octroi par ordonnance après une période de résidence (s. 22, al. 5) ; ce statut, avec la citoyenneté britannique et la résidence, ouvre l'inscription sur les listes électorales (s. 32) ; un droit de demander le statut est reconnu au conjoint et aux enfants mineurs d'une personne qui le détient (s. 22, al. 7).", source: "https://www.legislation.gov.uk/uksi/2008/2846/schedule/made"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le gouverneur, nommé par le Royaume-Uni, garde la responsabilité des affaires extérieures, de la défense, de la sécurité intérieure et de la justice, et la Couronne britannique reste investie des pleins pouvoirs législatifs ; l'Argentine conteste la Constitution de 2008 et, tenant la question pour bilatérale, s'oppose à la participation en leur nom propre des habitants de l'archipel aux instances internationales.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/6&l=fr&t=pdf"}
chronologie:
  - {annee: 1833, evenement: "Le 3 janvier, le Royaume-Uni prend le contrôle de l'archipel : il dit en avoir expulsé un détachement militaire argentin, l'Argentine dit que sa population et ses autorités en ont été chassées ; l'Argentine proteste et revendique depuis la souveraineté."}
  - {annee: 1946, evenement: "Le Royaume-Uni transmet des renseignements au titre de l'article 73 e de la Charte ; inscription sur la liste des territoires non autonomes, avec réserves croisées de l'Argentine et du Royaume-Uni sur la souveraineté."}
  - {annee: 1965, evenement: "Résolution 2065 (XX) de l'Assemblée générale : constat d'un différend de souveraineté et invitation à négocier."}
  - {annee: 1982, evenement: "Conflit armé entre l'Argentine et le Royaume-Uni d'avril à juin ; résolutions 502 et 505 du Conseil de sécurité."}
  - {annee: 2009, evenement: "Entrée en vigueur le 1er janvier de la Constitution établie par l'ordonnance de 2008."}
  - {annee: 2013, evenement: "Référendum sur le statut politique : selon le Royaume-Uni, 99,8 % des votants, pour une participation de 92 %, choisissent le maintien comme territoire d'outre-mer du Royaume-Uni ; l'Argentine considère ce vote comme un acte unilatéral sans effet sur le différend."}
  - {annee: 2025, evenement: "Le Comité spécial de la décolonisation adopte sans vote la résolution A/AC.109/2025/L.8, qui demande la reprise des négociations sur le conflit de souveraineté."}
fiabilite:
  verifie: ["Rappel du droit des peuples à disposer d'eux-mêmes (s. 1), définition du statut d'habitant des Falkland (s. 22), composition de l'Assemblée et circonscriptions (s. 26 et 27), conditions d'électorat (s. 32), pouvoir législatif, assentiment, désaveu et pouvoir réservé du gouverneur (s. 37, 51, 52, 54, 55), Conseil exécutif et domaines réservés (s. 57, 58, 66, 67), finances (s. 74 à 76), juridictions (s. 86 et 87), pouvoir législatif réservé à la Couronne (art. 11 de l'ordonnance) : texte sur legislation.gov.uk.", "Inscription sur la liste depuis 1946, surface, population au recensement de 2021, enseignement, gestion des pêcheries, positions britannique et argentine, résultat du référendum de 2013 tel que rapporté par le Royaume-Uni : document A/AC.109/2025/6.", "Texte de la résolution A/AC.109/2025/L.8 et adoption sans vote (communiqué de presse GA/COL/3394)."]
  non_confirme: ["Base juridique locale du référendum de 2013 non consultée : la Constitution de 2008 ne prévoit de référendum que pour modifier les circonscriptions (s. 27, al. 3) ; le droit à l'autodétermination n'y figure que dans le rappel de la section 1, d'où la valeur « non établi » pour l'autodétermination externe.", "Aucune résolution de l'Assemblée générale ou du Comité spécial ne mentionne le principe d'autodétermination pour ce territoire, selon l'Argentine ; le Royaume-Uni soutient que ce principe s'applique.", "Nombre de personnes ayant le statut d'habitant des Falkland non trouvé.", "Texte de la Constitution consulté dans sa version d'origine (2008) ; modifications de 2017 et 2020 signalées par legislation.gov.uk non intégrées au texte consulté.", "Régime foncier (concessions de la Couronne, s. 73) et lois sur l'immigration non consultés.", "Aucune source universitaire ou associative consultée sur le fonctionnement des institutions.", "Nombre de villages : non trouvé."]
