droits:
  autogouvernement: {valeur: "reconnu", note: "L'art. 2, apartado A, fractions I et III (réforme de 2024) garantit le droit de décider des formes internes de gouvernement et d'élire les autorités selon les systèmes normatifs propres.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'art. 2, A, fraction II reconnaît l'application des systèmes normatifs propres pour régler les conflits internes, sous réserve des principes de la Constitution et des droits humains.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  justice_propre: {valeur: "partiel", note: "L'art. 2, A, fraction II prévoit une juridiction autochtone exercée par les autorités communautaires dans le cadre de l'ordre juridique en vigueur ; une loi doit fixer les cas et procédures de validation par les juges ou tribunaux.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  terres: {valeur: "partiel", note: "L'art. 27, fraction VII reconnaît la personnalité juridique des noyaux ejidaux et communaux et protège leur propriété ; le même article dispose que « la loi protégera l'intégrité des terres des groupes autochtones ». L'art. 2, A, fraction VIII vise l'intégrité des terres et des lieux sacrés.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  ressources: {valeur: "partiel", note: "L'art. 2, A, fraction IX garantit l'usage et la jouissance préférentiels des ressources naturelles des lieux habités, sauf dans les secteurs stratégiques et sous réserve des droits acquis par des tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  consentement: {valeur: "partiel", note: "L'art. 2, A, fraction XIII impose une consultation sur les mesures législatives ou administratives qui peuvent avoir des effets significatifs sur leur vie ou leur environnement, en vue d'obtenir leur consentement ou un accord ; un bénéfice équitable est dû par la personne qui en tire profit.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  langue: {valeur: "partiel", note: "L'art. 4 de la loi générale de 2003 fait des langues autochtones des langues nationales ayant la même validité que l'espagnol ; l'art. 2, A, fraction V (2024) prévoit une politique linguistique multilingue.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "L'art. 2, A, fraction VI prévoit la participation des peuples, selon l'art. 3, à la construction des modèles éducatifs à partir de leurs cultures, langues et méthodes d'enseignement ; l'apartado B, fraction IV oblige l'État à une éducation autochtone interculturelle et plurilingue.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  fiscalite: {valeur: "partiel", note: "L'art. 2, apartado B, fraction II et dernier alinéa (2024) prévoit des crédits budgétaires administrés et exercés directement par les communautés ; aucun pouvoir fiscal propre. Le FAISPIAM, créé par des lignes directrices publiées au DOF le 13 mars 2025 et non inscrit dans la loi de coordination fiscale, applique ce principe depuis 2025.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  representation: {valeur: "partiel", note: "L'art. 2, A, fraction X (2024) donne aux peuples le droit d'élire des représentants dans les conseils municipaux (ayuntamientos) des municipalités à population autochtone ; les constitutions et lois des États fédérés règlent ce droit. Aucun siège réservé au niveau fédéral n'est inscrit dans la Constitution.", source: "https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_260_30sep24.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le volet autochtone du FAIS fonctionne depuis 2025 (12 374,3 millions de pesos approuvés), mais près de 80 % des fonds ont été versés en août 2025, hors du calendrier prévu. Selon La Jornada (10 août 2026), la loi générale exigée sous 180 jours par le décret de 2024 n'est pas adoptée : sa proposition est soumise aux assemblées régionales de consultation du 7 août au 13 septembre 2026.", source: "https://ciep.mx/coordinacion-fiscal-infraestructura-social-y-pueblos-indigenas-los-pendientes-que-nos-deja-el-ppef-2026/"}
