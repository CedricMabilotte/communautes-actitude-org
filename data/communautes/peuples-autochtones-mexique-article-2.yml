resume: >-
  Fiche agrégée. La réforme de l'article 2 de la Constitution fédérale, publiée au Journal officiel (DOF) le 30 septembre 2024, reconnaît les peuples et communautés autochtones et afromexicains comme « sujetos de derecho público con personalidad jurídica y patrimonio propio » (sujets de droit public dotés de la personnalité juridique et d'un patrimoine propre). Elle garantit leur libre détermination dans un cadre constitutionnel d'autonomie, leurs systèmes normatifs, l'usage préférentiel des ressources naturelles, la consultation et des crédits budgétaires administrés directement par les communautés. Depuis 2025, 10 % du Fonds d'apports pour l'infrastructure sociale (FAIS) forme un volet autochtone (FAISPIAM) versé aux communautés inscrites au Catalogue national, qui choisissent leurs projets en assemblée. Ont leur propre fiche : les peuples et communautés afromexicains (apartado C), la propriété agraire des ejidos et communautés, les régimes propres à un État fédéré (Oaxaca, Michoacán, Morelos, Chihuahua, San Luis Potosí, Quintana Roo, Mexico) et les cas de Cherán, Ayutla de los Libres, Oxchuc, des Yoeme, des Comcáac et de la police communautaire du Guerrero.
