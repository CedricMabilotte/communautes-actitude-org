effectivite: {valeur: "partielle", note: "En 2016, le ministère de l'Intérieur recensait 16 dina homologués et 14 dina non homologués pour non-respect de la procédure ; en 2011, 250 personnes ont été arrêtées à Manakara pour l'exécution d'un dina non homologué (CCPR/C/MDG/Q/4/Add.1, § 98-99). Le Comité contre la torture (2011) relève des informations selon lesquelles le recours au dina aurait donné lieu à des décisions en matière pénale, dont des tortures et des exécutions sommaires et extrajudiciaires ; le Comité des droits de l'homme (2017) relève des informations selon lesquelles des dina traiteraient de cas excédant le champ civil. Le Dinan'i Androy, créé en 2008 et homologué jusque-là par des tribunaux situés hors de la région, a été homologué à Ambovombe le 17 juin 2025 (PNUD).", source: "https://www.undp.org/fr/madagascar/actualites/androy-le-dina-une-institution-coutumiere-reinventee-pour-une-paix-durable"}
chronologie:
  - {annee: 2001, evenement: "Loi n° 2001-004 du 25 octobre 2001 portant réglementation générale des dina en matière de sécurité publique."}
  - {annee: 2008, evenement: "Création du Dinan'i Androy, dina régional de l'Androy."}
  - {annee: 2010, evenement: "Constitution de la IVe République : le fokonolona, organisé en fokontany au sein des communes, est la base du développement (art. 152)."}
  - {annee: 2011, evenement: "Observations finales du Comité contre la torture : section « Justice traditionnelle (Dina) »."}
  - {annee: 2016, evenement: "Le ministère de l'Intérieur recense 16 dina homologués et 14 non homologués."}
  - {annee: 2017, evenement: "Observations finales du Comité des droits de l'homme : l'État devrait veiller à ce que les dina ne traitent que d'affaires civiles."}
  - {annee: 2025, evenement: "Homologation du Dinan'i Androy par ordonnance du tribunal de première instance d'Ambovombe, le 17 juin ; comités locaux présents dans 58 communes."}
fiabilite:
  verifie:
    - "Description de la loi n° 2001-004 (élaboration, homologation par le président du tribunal de première instance, refus en cas de dispositions pénales contraires à la loi) dans le quatrième rapport périodique de Madagascar au Comité des droits de l'homme (CCPR/C/MDG/4, § 240-242)."
    - "Réponses de l'État (CCPR/C/MDG/Q/4/Add.1, § 97-99) : homologation, appel devant le tribunal, 16 dina homologués et 14 non homologués recensés en 2016."
    - "CAT/C/MDG/CO/1, § 11, et CCPR/C/MDG/CO/4, § 45-46, lus dans le texte français."
    - "Adoption du dina par l'assemblée générale du fokonolona, d'après l'article du système d'information TGRNR du ministère de l'Environnement."
    - "Homologation du Dinan'i Androy le 17 juin 2025 et comités dans 58 communes, d'après la page du PNUD Madagascar."
    - "Article 152 de la Constitution de 2010, lu dans la traduction anglaise du Constitute Project."
  non_confirme:
    - "Le texte de la loi n° 2001-004 n'a pas été lu directement : son contenu est repris des rapports de l'État aux organes de traités et de l'article du système d'information TGRNR."
    - "Le nombre de dina homologués après 2016 et la liste des dina homologués : aucune source publique trouvée ; pas de tableau des sites."
    - "Population, surface et nombre de villages concernés : aucune source trouvée."
    - "Effet sur la Constitution de 2010 du changement de pouvoir d'octobre 2025 : non vérifié."
    - "Le rapport entre ce régime et les dina des communautés de base prévus par la loi n° 96-025 (GELOSE), traités dans la fiche « Transferts de gestion des ressources naturelles à Madagascar »."
