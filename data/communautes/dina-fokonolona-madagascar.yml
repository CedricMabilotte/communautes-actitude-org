resume: >-
  Fiche agrégée : elle couvre les communautés villageoises (fokonolona, en malgache) qui adoptent un dina, convention collective fondée sur les règles coutumières, dans le cadre de la loi n° 2001-004 du 25 octobre 2001 portant réglementation générale des dina en matière de sécurité publique. Le dina est adopté par l'assemblée générale du fokonolona (hameau, village ou fokontany, subdivision de la commune) ; il n'a d'effet légal qu'après homologation (validation par le juge) par le président du tribunal de première instance du lieu, et ses décisions peuvent être portées en appel devant ce tribunal. La Constitution de 2010 (art. 152) fait du fokonolona, organisé en fokontany au sein des communes, la base du développement et de la cohésion socioculturelle et environnementale. En 2016, le ministère de l'Intérieur recensait 16 dina homologués ; le Dinan'i Androy, dont les comités sont présents dans 58 communes, a été homologué le 17 juin 2025 par le tribunal de première instance d'Ambovombe.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité contre la torture, observations finales sur Madagascar (CAT/C/MDG/CO/1, 21 décembre 2011), § 11 « Justice traditionnelle (Dina) » : préoccupation devant le recours systématique au dina, qui aurait donné lieu à des décisions en matière pénale ; l'État devrait suivre les décisions du dina en vertu de la loi n° 2001-004, qui exige leur homologation par les tribunaux de droit commun, et garantir un recours devant ces tribunaux.", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=CAT/C/MDG/CO/1&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, observations finales sur le quatrième rapport de Madagascar (CCPR/C/MDG/CO/4, 22 août 2017), § 45 et 46 « Administration de la justice et justice traditionnelle (dina) » : l'État devrait veiller à ce que les dina ne traitent que d'affaires civiles et à ce qu'aucune décision de dina contraire au Pacte ne soit mise en œuvre.", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/MDG/CO/4&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la IVe République (2010), préambule et art. 152 (fokonolona organisé en fokontany au sein des communes)", nature: "constitution", annee: 2010, source: "https://www.constituteproject.org/constitution/Madagascar_2010.pdf"}
  - {instrument: "Loi n° 2001-004 du 25 octobre 2001 portant réglementation générale des dina en matière de sécurité publique (texte décrit par l'État dans ses rapports au Comité des droits de l'homme)", nature: "loi", annee: 2001, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/MDG/4&l=fr&t=pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le dina est adopté à la majorité des membres du fokonolona âgés de 18 ans révolus présents à l'assemblée générale du hameau, du village ou du fokontany (loi n° 2001-004, selon le système d'information du ministère de l'Environnement) ; la Constitution de 2010 (art. 152) reconnaît le fokonolona organisé en fokontany comme base du développement, et les responsables des fokontany participent à l'élaboration du programme de développement de leur commune ; le dina n'a d'effet qu'après homologation par le juge, ce qui limite l'autonomie de ces assemblées ; pour le Dinan'i Androy, des comités locaux (Komity Mpiandraikitra ny Dina) sont présents dans 58 communes (PNUD, 2025).", source: "https://www.e-voary.mg/tgrn/assets/images/article_version%20finale_tgrn.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le dina est une convention collective qui présente un ensemble de règles coutumières d'organisation de la société ; selon l'État, la loi n° 2001-004 en fait une partie du droit interne, mais il n'est légal qu'après homologation par le tribunal de première instance compétent, refusée s'il contient des dispositions pénales contraires à la loi (CCPR/C/MDG/4, § 240-241, 2015 ; CCPR/C/MDG/Q/4/Add.1, § 97, 2017).", source: "https://documents.un.org/api/symbol/access?s=CCPR/C/MDG/Q/4/Add.1&l=fr&t=pdf"}
  justice_propre: {valeur: "partiel", note: "Les instances du dina rendent des décisions sur la base du dina homologué ; toute décision est susceptible d'appel devant le tribunal de première instance (CCPR/C/MDG/Q/4/Add.1, § 97, 2017) ; le Comité des droits de l'homme s'inquiète d'informations selon lesquelles les dina traiteraient de cas excédant leur compétence, limitée au champ civil (CCPR/C/MDG/CO/4, § 45, 2017).", source: "https://documents.un.org/api/symbol/access?s=CCPR/C/MDG/CO/4&l=fr&t=pdf"}
