base_nationale:
  - {instrument: "Loi 8.629 du 25 février 1993 (réforme agraire), art. 18 (concession d'usage et CDRU, individuelles ou collectives, incessibles dix ans) et art. 18 § 14 (pas de titre collectif au nom d'une personne morale) et art. 19 § 2 (sélection restreinte aux familles résidentes dans les projets à vocation environnementale, issu de la mesure provisoire 759 de 2016 et de la loi 13.465 de 2017)", nature: "loi", annee: 1993, source: "https://www.planalto.gov.br/ccivil_03/leis/l8629.htm"}
  - {instrument: "Loi 11.284 du 2 mars 2006 sur la gestion des forêts publiques, art. 3 X (définition des communautés locales) et art. 6 II (concession d'usage par projets d'établissement agroextractivistes)", nature: "loi", annee: 2006, source: "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11284.htm"}
  - {instrument: "Décret 9.311 du 15 mars 2018 portant règlement de la loi 8.629, art. 10 (définition du PAE), art. 24 (titres provisoires et définitifs, individuels ou collectifs), art. 30 et 31 (CDRU)", nature: "loi", annee: 2018, source: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/decreto/d9311.htm"}
  - {instrument: "Décret 11.637 du 16 août 2023 modifiant le décret 9.311 : titre possible au nom d'associations ou de coopératives constituées par les bénéficiaires (art. 24 § 5)", nature: "loi", annee: 2023, source: "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/d11637.htm"}
