effectivite: {valeur: "partielle", note: "Selon les données de l'INCRA de 2017 reprises par Almeida (Revista NERA, université d'État de São Paulo, 2021), 403 PAE et 102 581 familles sont recensés dans quatre États de l'Amazonie légale. Dans le PAE Maracá (Amapá), la même étude constate que le plan d'utilisation, document de gestion du projet, a été rédigé par des techniciens de l'INCRA à partir d'un plan conçu pour l'Acre, et que l'INCRA reste gestionnaire permanent aux côtés de l'association. Dans le PAE Porto Dias (Acrelândia, Acre, 22 000 ha), la Police fédérale a mené en 2024 et 2025 des opérations contre des invasions et des ventes de lots, et 55 familles font l'objet depuis 2021 d'une action en réintégration de possession (Varadouro, octobre 2025, archive de l'Instituto Socioambiental). La création de projets se poursuit : la portaria (arrêté) INCRA 2.194 du 14 septembre 2026 crée le PAE Baixo Acará Genipaúba (Acará, Pará), 1 152 ha pour 189 familles, au bénéfice de pêcheurs artisanaux, de riverains et de caiçaras (communautés côtières traditionnelles) qui occupent des terres de l'Union.", source: "https://revista.fct.unesp.br/index.php/nera/article/download/8208/6087/0"}
chronologie:
  - {annee: 1993, evenement: "La loi 8.629 sur la réforme agraire prévoit la distribution des terres par titre de propriété ou concession d'usage."}
  - {annee: 2006, evenement: "La loi 11.284 sur les forêts publiques prévoit l'affectation gratuite des forêts occupées par des communautés locales, entre autres par des projets d'établissement agroextractivistes (art. 6 II)."}
  - {annee: 2017, evenement: "Selon l'INCRA, 403 PAE ont été créés dans l'Amazonie légale depuis l'apparition de la modalité."}
  - {annee: 2017, evenement: "La loi 13.465 restreint la sélection aux familles déjà résidentes dans les projets à vocation environnementale (art. 19 § 2 de la loi 8.629)."}
  - {annee: 2018, evenement: "Le décret 9.311 définit le PAE (art. 10) et fixe les titres : concession d'usage, CDRU, titre de propriété (art. 24)."}
  - {annee: 2023, evenement: "Le décret 11.637 permet d'établir le titre au nom d'associations ou de coopératives de bénéficiaires."}
  - {annee: 2026, evenement: "Portaria INCRA 2.194 du 14 septembre 2026 : création du PAE Baixo Acará Genipaúba (Pará), 189 familles."}
fiabilite:
  verifie: ["Loi 8.629 de 1993, art. 18 § 1 à § 3 et § 14, art. 19 § 2 (texte consolidé, Planalto) ; l'art. 19 § 2 vient de la mesure provisoire 759 de 2016, reprise par la loi 13.465 de 2017.", "Loi 11.284 de 2006, art. 3 X et art. 6 II, § 1 et § 3 (Planalto).", "Décret 9.311 de 2018, art. 10 (définition du PAE), art. 24, 30 et 31 (Planalto) ; l'alinéa de l'art. 30, qui réservait la CDRU aux projets à vocation environnementale, a été abrogé par le décret 11.637 de 2023.", "Décret 11.637 de 2023, art. 24 § 5 du décret 9.311 (titre au nom d'associations ou de coopératives de bénéficiaires).", "Page « Assentamentos » de l'INCRA : le PAE figure parmi les modalités créées actuellement, avec « Titulação (Concessão de Uso) de responsabilidade da União » et des bénéficiaires « geralmente oriundos de comunidades extrativistas ».", "Création du PAE Baixo Acará Genipaúba par la portaria INCRA 2.194 du 14 septembre 2026 (Journal officiel de l'Union) : 1 152,1380 ha, 189 unités familiales, pêcheurs artisanaux, riverains et caiçaras.", "Nombre, surface et familles des PAE de l'Acre, de l'Amapá, de l'Amazonas et du Pará (INCRA 2017, tableau 1 d'Almeida, Revista NERA, 2021) ; la somme des quatre États est égale au total de 403 donné par l'article.", "PAE Porto Dias : opérations de la Police fédérale et action en réintégration de possession (Varadouro, octobre 2025)."]
  non_confirme: ["Le texte fondateur de la modalité (portaria INCRA 268 de 1996) n'a pas été consulté ; l'année de création de la modalité n'est donc pas vérifiée.", "L'instruction normative INCRA 136 de 2023, citée pour la procédure actuelle, n'a pas été consultée.", "Le nombre de PAE hors Amazonie légale (Paraíba, Sergipe, Rio Grande do Sul selon la presse) et un total national à jour ne sont pas établis : le tableau de bord de l'INCRA (painel.incra.gov.br) n'a pas répondu ; aucun tableau des sites n'est publié.", "Le plan d'utilisation (norme INCRA de 1996, citée par Almeida) et le rôle de l'association de bénéficiaires n'ont pas été lus dans un texte en vigueur : l'autogouvernement reste non établi.", "La validité du titre établi au nom d'une association (décret 11.637 de 2023) face à la loi 8.629, art. 18 § 14, n'a pas été tranchée par une source consultée.", "Aucun document de l'ONU (rapport national à la Convention sur la diversité biologique, organe de traité) visant les PAE n'a été trouvé ; aucun mécanisme onusien n'est donc indiqué.", "La part des PAE dont la concession est collective plutôt qu'individuelle n'est pas connue.", "Population : non trouvée en nombre de personnes ; l'INCRA (2017, repris par Almeida dans la Revista NERA en 2021) compte 102 581 familles installées dans les 403 PAE de l'Acre (1 395), de l'Amapá (6 862), de l'Amazonas (21 928) et du Pará (72 396).", "Nombre de villages : non trouvé."]
