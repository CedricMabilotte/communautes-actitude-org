  terres: {valeur: "partiel", note: "La terre reste dans le domaine public fédéral ; l'INCRA accorde un contrat de concession d'usage gratuit et incessible, « de forma individual ou coletiva », puis une CDRU gratuite et définitive (loi 8.629 de 1993, art. 18 § 1 à § 3 ; décret 9.311 de 2018, art. 24 et 30), incessible entre vifs pendant dix ans, puis cessible avec l'accord de l'INCRA à un agriculteur familial (art. 31) ; le titre peut être collectif « com fração ideal » (en quote-part indivise) ; le décret 11.637 de 2023 (art. 24 § 5) permet de l'établir au nom d'une association ou d'une coopérative de bénéficiaires, alors que la loi 8.629 (art. 18 § 14) exclut le titre collectif au nom d'une personne morale ; dans les PAE, seules les familles qui résident déjà dans la zone sont sélectionnées (loi 8.629, art. 19 § 2 ; décret 9.311, art. 10).", source: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/decreto/d9311.htm"}
  ressources: {valeur: "partiel", note: "La loi 11.284 de 2006 (art. 6) impose, avant toute concession forestière, d'identifier les forêts publiques occupées ou utilisées par des communautés locales et de les leur affecter gratuitement, entre autres par « concessão de uso, por meio de projetos de assentamento florestal, de desenvolvimento sustentável, agroextrativistas ou outros similares » (art. 6 II et § 1) ; le décret 9.311 de 2018 (art. 10) destine le PAE à l'exploitation des ressources extractives par les populations qui occupent la zone ; la CDRU reste conditionnée à l'exploitation rurale (art. 30).", source: "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11284.htm"}
