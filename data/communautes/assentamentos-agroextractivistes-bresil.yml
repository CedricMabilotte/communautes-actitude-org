resume: >-
  Fiche agrégée : elle couvre les communautés titulaires des projets d'établissement agroextractivistes (Projetos de Assentamento Agroextrativista, PAE), une modalité de la réforme agraire fédérale gérée par l'INCRA. Le décret 9.311 de 2018 (art. 10) définit le PAE comme un projet destiné à l'exploitation de zones dotées de ressources extractives par les populations qui occupent traditionnellement la zone, et le range parmi les projets « ambientalmente diferenciados » (à vocation environnementale). Seules les familles qui résident déjà dans la zone peuvent être sélectionnées (loi 8.629 de 1993, art. 19 § 2). La terre reste à l'Union : les familles reçoivent une concession d'usage gratuite, individuelle ou collective, puis une concession de droit réel d'usage (CDRU, titre ayant la force d'un acte authentique), incessible entre vifs pendant dix ans. La loi 11.284 de 2006 sur les forêts publiques (art. 6 II) prévoit l'affectation gratuite des forêts publiques occupées par des communautés locales au moyen de ces projets. Selon les données de l'INCRA de 2017, 403 PAE couvraient 104 276 km² dans quatre États de l'Amazonie légale, pour 102 581 familles installées. L'INCRA crée encore des PAE en 2026.
