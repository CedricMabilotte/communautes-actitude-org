resume: >-
  Fiche agrégée : elle couvre les communautés qui ont mis de côté une partie de leurs terres pour la conservation de la faune sous forme de conservancy communautaire. La loi sur la conservation et la gestion de la faune de 2013 (Wildlife Conservation and Management Act, en vigueur le 10 janvier 2014) donne la première définition légale de la conservancy : une terre mise de côté par un propriétaire, un groupe de propriétaires ou une communauté pour la conservation de la faune (art. 3). Toute personne ou communauté propriétaire d'une terre où vit la faune peut en créer une (art. 39) ; les communautés peuvent constituer une association communautaire de faune, dotée de statuts et d'un plan de gestion, approuvée par le ministre (art. 40 et 41). La Constitution de 2010 (art. 63) et la loi sur les terres communautaires de 2016 attribuent la terre communautaire aux communautés. En 2023, la KWCA comptait 99 conservancies communautaires parmi ses membres.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Kenya à la Convention sur la diversité biologique : il indique que la loi de 2013 reconnaît les conservancies comme une forme d'usage des terres pour la faune, compte plus de 160 conservancies sur plus de 63 600 km², dont 76 communautaires, et note que le règlement d'enregistrement n'a pas encore été publié au Journal officiel", annee: 2020, source: "https://www.cbd.int/doc/nr/nr-06/ke-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Constitution du Kenya (2010), art. 63 : la terre communautaire appartient aux communautés identifiées par l'ethnie, la culture ou une communauté d'intérêt similaire", nature: "constitution", annee: 2010, source: "https://www.constituteproject.org/constitution/Kenya_2010"}
  - {instrument: "Wildlife Conservation and Management Act (loi sur la conservation et la gestion de la faune) n° 47 de 2013, art. 3, 8, 18, 19, 39 à 43, 76 et 80 ; sanction le 24 décembre 2013, en vigueur le 10 janvier 2014", nature: "loi", annee: 2013, source: "https://new.kenyalaw.org/akn/ke/act/2013/47/eng@2022-12-31"}
  - {instrument: "Community Land Act (loi sur les terres communautaires) n° 27 de 2016, art. 4, 15, 20, 35 et 36 ; en vigueur le 21 septembre 2016", nature: "loi", annee: 2016, source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les communautés peuvent constituer une association communautaire de faune, enregistrée avec des statuts fixant sa gouvernance et un projet de plan (art. 40 de la loi de 2013) ; approuvée par le ministre sur recommandation du Service kényan de la faune (KWS), elle protège et gère les conservancies selon leur plan de gestion (art. 41). Le comité de comté peut recommander la radiation des droits d'usage si la gestion est inférieure au plan (art. 43).", source: "https://new.kenyalaw.org/akn/ke/act/2013/47/eng@2022-12-31"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La terre communautaire appartient aux communautés (Constitution, art. 63 ; loi sur les terres communautaires de 2016, art. 4) ; la terre non enregistrée est détenue en fiducie (trust, gestion pour le compte d'autrui) par les comtés (art. 6 de la loi de 2016). La conservancy est créée par la communauté propriétaire de la terre (art. 39 de la loi de 2013), sans transfert de propriété.", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  ressources: {valeur: "partiel", note: "Le plan déposé à l'enregistrement décrit les droits d'usage de la faune proposés (art. 40 (3) (c) de la loi de 2013) ; ces droits sont accordés par le ministre sous forme de permis (tourisme, recherche) ou de licences (élevage de gibier, capture, prélèvement) après enregistrement auprès du comité de comté (art. 80). Les ressources naturelles de la terre communautaire sont gérées au profit de toute la communauté, sous réserve des autres lois (art. 35 de la loi de 2016).", source: "https://new.kenyalaw.org/akn/ke/act/2013/47/eng@2022-12-31"}
  consentement: {valeur: "partiel", note: "Loi sur les terres communautaires de 2016, art. 36 : un accord d'investissement sur une terre communautaire est conclu entre l'investisseur et la communauté après une consultation libre et ouverte ; il n'est valide qu'approuvé par les deux tiers des membres adultes en assemblée communautaire, avec un quorum des deux tiers, et doit prévoir une évaluation des effets environnementaux, sociaux, culturels et économiques, des compensations et des redevances. La règle vise la terre communautaire, pas la conservancy en tant que telle.", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Quatre membres de chaque comité de comté pour la conservation de la faune et l'indemnisation sont désignés sur proposition des associations communautaires de faune (art. 18 (1) (f) de la loi de 2013) ; un des cinq experts du conseil d'administration du KWS vient des zones communautaires de faune (art. 8). Ces organes sont présidés ou nommés par l'État.", source: "https://new.kenyalaw.org/akn/ke/act/2013/47/eng@2022-12-31"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude publiée en 2024 (Frontiers in Conservation Science) relève l'absence de droits fonciers sûrs pour les conservancies communautaires, qui entraîne morcellement et subdivision des terres autour d'Amboseli, et la lenteur d'application de la loi sur les terres communautaires de 2016. Le sixième rapport national du Kenya à la CDB (2020) indique de son côté que le règlement d'enregistrement des conservancies n'a pas été publié et que toutes fonctionnent de façon ad hoc, le plus souvent comme organisations communautaires, fiducies ou sociétés privées.", source: "https://www.frontiersin.org/journals/conservation-science/articles/10.3389/fcosc.2024.1385959/full"}
chronologie:
  - {annee: 2010, evenement: "Constitution du Kenya : l'art. 63 attribue la terre communautaire aux communautés."}
  - {annee: 2013, evenement: "Création de l'Association kényane des conservancies de faune (KWCA) ; loi sur la conservation et la gestion de la faune sanctionnée le 24 décembre."}
  - {annee: 2014, evenement: "Entrée en vigueur de la loi de 2013 le 10 janvier : définition légale de la conservancy et des associations communautaires de faune."}
  - {annee: 2016, evenement: "Loi sur les terres communautaires, en vigueur le 21 septembre."}
  - {annee: 2020, evenement: "Sixième rapport national à la CDB : plus de 160 conservancies, dont 76 communautaires ; règlement d'enregistrement non publié."}
  - {annee: 2023, evenement: "La KWCA recense 230 conservancies sur 9,04 millions d'ha, dont 99 conservancies communautaires membres sur 8,9 millions d'ha."}
fiabilite:
  verifie: ["Texte des art. 3, 8, 18, 19, 39 à 43, 76 et 80 de la loi de 2013 et dates de sanction et d'entrée en vigueur (Kenya Law).", "Art. 4, 6, 15, 35 et 36 de la loi sur les terres communautaires de 2016 et date d'entrée en vigueur (Kenya Law).", "Art. 63 de la Constitution de 2010 (Constitute Project).", "Sixième rapport national à la CDB (2020) : reconnaissance des conservancies par la loi de 2013, plus de 160 conservancies dont 76 communautaires, règlement d'enregistrement non publié.", "Chiffres de 2023 (230 conservancies, 9,04 millions d'ha ; 99 conservancies communautaires membres de la KWCA, 8 927 751 ha) : article de Frontiers in Conservation Science (2024), d'après le rapport 2023 de la KWCA.", "Définition des conservancies communautaires et des quatre types de conservancies : site de la KWCA."]
