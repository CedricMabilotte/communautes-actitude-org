resume: >-
  La loi 22 de 1983, publiée au Journal officiel le 17 janvier 1984, crée la comarca (division territoriale autochtone à statut spécial) Emberá sur deux zones prises sur la province de Darién, qui forment les districts de Cémaco et de Sambú. Les terres y forment un patrimoine à usage collectif des Emberá et des Wounaan, et le Congrès général est reconnu comme organe traditionnel suprême de décision. L'INEC estime la population de la comarca à 13 788 personnes en 2023. Selon le Rapporteur spécial de l'ONU, 44 communautés emberá et wounaan sont restées hors des limites de la comarca en 1983.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Panama vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
