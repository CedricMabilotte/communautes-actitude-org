base_nationale:
  - {instrument: "Constitution politique du Panama (1972, révisée en 2004), art. 127 et 147", nature: "constitution", annee: 1972, source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  - {instrument: "Loi 22 du 8 novembre 1983 qui crée la comarca Emberá de Darién (Gaceta Oficial 19976 du 17 janvier 1984)", nature: "loi", annee: 1983, source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  - {instrument: "Loi 88 du 22 novembre 2010 sur les langues et alphabets des peuples autochtones", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 22 de 1983 (art. 10) institue le Congrès général comme organe traditionnel suprême de décision et d'expression, avec des congrès régionaux et locaux ; les articles 11 à 13 prévoient un cacique général et des caciques régionaux élus par les congrès pour cinq ans ; le gouverneur de la comarca est nommé par l'exécutif sur une liste de trois noms proposée par le Congrès général (art. 14).", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 22 de 1983 (art. 7 et 10) soumet l'administration de la comarca aux dispositions du Congrès général, prises par résolutions, dans le cadre de la Constitution et des lois nationales.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi 22 de 1983 (art. 12) habilite les caciques régionaux à connaître, en concurrence avec la police, des actes de « superchería y hechicería » (charlatanerie et sorcellerie) et à les sanctionner de dix à soixante jours d'arrêt ; les tribunaux de la comarca (art. 15) relèvent de l'organisation judiciaire nationale.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  terres: {valeur: "reconnu", note: "La loi 22 de 1983 (art. 2) fait des terres délimitées, hors propriétés privées existantes, un patrimoine de la comarca à usage collectif des Emberá et des Wounaan et en interdit l'appropriation privée et l'aliénation (cession) ; l'article 3 donne à la comarca un droit de préemption (priorité d'achat) sur les fonds privés.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  ressources: {valeur: "partiel", note: "La loi 22 de 1983 (art. 19) confie la conservation des ressources renouvelables à l'administration nationale conjointement avec la communauté et soumet leur exploitation à l'autorisation du cacique général et du cacique régional, accompagnée de l'avis favorable de l'administration des ressources naturelles ; l'article 20 réserve l'exploitation du sous-sol à l'autorisation de l'exécutif, chaque contrat fixant le pourcentage des revenus versé à la comarca.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  consentement: {valeur: "partiel", note: "La loi 22 de 1983 (art. 24) oblige le gouvernement à consulter les autorités emberá avant d'exécuter des projets nationaux dans la comarca, sans exiger leur accord ; l'article 20 prévoit un représentant de la comarca dans la négociation des contrats miniers.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  langue: {valeur: "partiel", note: "La loi 88 de 2010 (art. 1) reconnaît les langues emberá et wounaan et en fixe les alphabets, sans statut de langue officielle.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 22 de 1983 (art. 21) prévoit un programme d'enseignement bilingue planifié et conduit en coordination entre les autorités autochtones et les services éducatifs de l'État.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  fiscalite: {valeur: "partiel", note: "La loi 22 de 1983 (art. 16) oblige l'État à inscrire au budget national les crédits de la comarca, utilisés en coordination avec les autorités autochtones ; l'article 18 donne aux communes de la comarca les recettes municipales ordinaires.", source: "https://utp.ac.pa/documentos/2010/pdf/EMBERA.pdf"}
  representation: {valeur: "non_etabli", note: "La Constitution (art. 147) maintient le nombre de députés de chaque comarca et de la province de Darién, mais la comarca n'a pas de circonscription propre : selon le Rapporteur spécial (2014, par. 50), elle élit ses députés avec la province de Darién ; le projet de loi 700, adopté en troisième débat le 24 septembre 2026, rattache Sambú à la circonscription 5-1 et Cémaco à la circonscription 5-2, avec des districts de Darién.", source: "https://docs.un.org/es/A/HRC/27/52/Add.1"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial de l'ONU (2014, par. 9 et 33) relève l'invasion des terres de la comarca et des terres collectives, avec des affrontements violents, et l'absence de titre pour une partie des communautés restées hors de la comarca.", source: "https://docs.un.org/es/A/HRC/27/52/Add.1"}
chronologie:
  - {annee: 1983, evenement: "La loi 22 crée la comarca Emberá dans la province de Darién."}
  - {annee: 1984, evenement: "Publication de la loi 22 au Journal officiel (Gaceta Oficial 19976, 17 janvier)."}
  - {annee: 2010, evenement: "La loi 88 reconnaît les langues emberá et wounaan et fixe leurs alphabets."}
  - {annee: 2013, evenement: "Visite du Rapporteur spécial de l'ONU James Anaya, qui rencontre des représentants emberá et wounaan."}
  - {annee: 2014, evenement: "Rapport du Rapporteur spécial sur le Panama (A/HRC/27/52/Add.1)."}
  - {annee: 2026, evenement: "Août : les autorités de la comarca annoncent le renouvellement des autorités traditionnelles, avec des congrès régionaux en novembre et décembre 2026 et l'élection du cacique général par le Congrès général en mars 2027."}
  - {annee: 2026, evenement: "24 septembre : l'Assemblée nationale adopte en troisième débat le projet de loi 700 sur les circonscriptions 2029-2034 ; les districts de Sambú et de Cémaco restent rattachés à des circonscriptions de Darién."}
