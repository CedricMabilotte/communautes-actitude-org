resume: >-
  Hong Kong est une région administrative spéciale de la République populaire de Chine depuis le 1er juillet 1997. Le régime découle de la Déclaration conjointe sino-britannique de 1984 et de la Loi fondamentale (texte constitutionnel de la Région) adoptée par l'Assemblée populaire nationale le 4 avril 1990. La Loi fondamentale confère à la Région un « haut degré d'autonomie », avec des pouvoirs exécutif, législatif et judiciaire propres, des finances et un système fiscal distincts, l'anglais comme langue officielle à côté du chinois et un statut de résident permanent. Depuis 2020, la loi sur la sécurité nationale, la révision du système électoral de 2021 et l'ordonnance de 2024 sur la sécurité nationale encadrent l'exercice de cette autonomie ; le Comité des droits de l'homme de l'ONU en a demandé l'abrogation pour la première. Les droits des habitants autochtones des Nouveaux Territoires font l'objet de la fiche « Habitants autochtones des Nouveaux Territoires (Hong Kong) ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, quatrièmes observations finales sur Hong Kong (Chine) (CCPR/C/CHN-HKG/CO/4), adoptées le 22 juillet 2022 : préoccupation sur la loi sur la sécurité nationale de 2020, qui prime sur le droit local, et sur les interprétations de la Loi fondamentale par le Comité permanent de l'Assemblée populaire nationale (§ 4-5) ; demande d'abroger cette loi et de ne plus l'appliquer d'ici là (§ 14) ; préoccupation sur la conformité du système électoral à l'article 25 du Pacte depuis les changements de 2021 (§ 51-52).", annee: 2022, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/CHN-HKG/CO/4&l=en&t=pdf"}
base_nationale:
  - {instrument: "Déclaration conjointe du gouvernement du Royaume-Uni et du gouvernement de la République populaire de Chine sur la question de Hong Kong, signée à Pékin le 19 décembre 1984, § 3", nature: "traite", annee: 1984, source: "https://www.cmab.gov.hk/en/issues/jd2.htm"}
  - {instrument: "Loi fondamentale de la Région administrative spéciale de Hong Kong de la République populaire de Chine (1990, en vigueur le 1er juillet 1997)", nature: "statut_autonomie", annee: 1990, source: "https://www.cecc.gov/resources/legal-provisions/basic-law-of-the-hong-kong-special-administrative-region-of-the-peoples"}
  - {instrument: "Loi fondamentale, annexe II (mode de formation du Conseil législatif), modifiée par le Comité permanent de l'Assemblée populaire nationale le 30 mars 2021", nature: "statut_autonomie", annee: 2021, source: "https://www.basiclaw.gov.hk/en/basiclaw/annex2.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Région dispose d'un exécutif propre qui conduit seul ses affaires administratives (Loi fondamentale, art. 16) et d'un Conseil législatif (art. 66) ; le chef de l'exécutif est choisi par élection ou consultation locale puis nommé par le gouvernement central, qui nomme aussi les principaux responsables de l'exécutif (art. 15 et 45).", source: "https://www.cecc.gov/resources/legal-provisions/basic-law-of-the-hong-kong-special-administrative-region-of-the-peoples"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Conseil législatif légifère (Loi fondamentale, art. 17) ; ses lois sont transmises au Comité permanent de l'Assemblée populaire nationale, qui peut renvoyer, sans la modifier, une loi qu'il juge contraire aux dispositions sur les affaires relevant du pouvoir central, la loi renvoyée étant alors invalidée (art. 17) ; il peut ajouter des lois nationales à l'annexe III (art. 18) et détient le pouvoir d'interprétation de la Loi fondamentale (art. 158).", source: "https://www.cecc.gov/resources/legal-provisions/basic-law-of-the-hong-kong-special-administrative-region-of-the-peoples"}
  justice_propre: {valeur: "reconnu", note: "La Région exerce un pouvoir judiciaire indépendant, y compris le jugement en dernier ressort, confié à la Cour d'appel final (Loi fondamentale, art. 19 et 82) ; la common law et le droit coutumier antérieurs sont maintenus (art. 8).", source: "https://www.cecc.gov/resources/legal-provisions/basic-law-of-the-hong-kong-special-administrative-region-of-the-peoples"}
  terres: {valeur: "partiel", note: "Les terres de la Région sont propriété de l'État ; le gouvernement de la Région en assure la gestion, la location et la concession, et les revenus lui reviennent exclusivement (Loi fondamentale, art. 7).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter1.html"}
  ressources: {valeur: "partiel", note: "Les ressources naturelles sont propriété de l'État, gérées et mises en valeur par le gouvernement de la Région, qui dispose seul des revenus (Loi fondamentale, art. 7).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter1.html"}
  consentement: {valeur: "partiel", note: "Le Comité permanent de l'Assemblée populaire nationale consulte le gouvernement de la Région avant d'ajouter une loi nationale à l'annexe III (Loi fondamentale, art. 18) ; une proposition de révision venant de la Région requiert l'accord des deux tiers de ses députés nationaux, des deux tiers du Conseil législatif et du chef de l'exécutif, mais le pouvoir de révision appartient à l'Assemblée populaire nationale (art. 159).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter8.html"}
  langue: {valeur: "reconnu", note: "En plus du chinois, l'anglais peut être employé comme langue officielle par l'exécutif, le législatif et les tribunaux de la Région (Loi fondamentale, art. 9).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter1.html"}
  education: {valeur: "reconnu", note: "Le gouvernement de la Région fixe seul la politique d'éducation, y compris la langue d'enseignement, les examens et la reconnaissance des diplômes (Loi fondamentale, art. 136).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter6.html"}
  fiscalite: {valeur: "reconnu", note: "La Région a des finances indépendantes et garde ses recettes ; le gouvernement central n'y lève pas d'impôt (Loi fondamentale, art. 106) ; elle pratique un système fiscal propre et fixe par ses lois les types et taux d'impôt (art. 108).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter5.html"}
  representation: {valeur: "partiel", note: "Les citoyens chinois résidents de la Région élisent localement les députés de la Région à l'Assemblée populaire nationale ; le nombre de sièges et le mode d'élection sont fixés par l'Assemblée populaire nationale, non par la Région (Loi fondamentale, art. 21).", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter2.html"}
  statut_personnel: {valeur: "reconnu", note: "La Loi fondamentale définit les résidents permanents, titulaires du droit de résidence (right of abode) et du droit de vote et d'éligibilité (art. 24 et 26) ; sur autorisation du gouvernement central, la Région délivre les passeports de la Région aux citoyens chinois résidents permanents et contrôle l'entrée des personnes venant de l'étranger (art. 154).", source: "https://www.cecc.gov/resources/legal-provisions/basic-law-of-the-hong-kong-special-administrative-region-of-the-peoples"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le Comité des droits de l'homme de l'ONU s'est dit préoccupé en 2022 de ce que la loi sur la sécurité nationale de 2020 prime sur le droit local et prévaut sur les droits garantis par le Pacte, et a relevé que la non-conformité du système électoral à l'article 25 du Pacte s'est aggravée depuis 2021 ; Freedom House relève en 2025 la réduction des sièges élus au suffrage direct à 22 %, le filtrage des candidats et la démission de cinq juges étrangers de la Cour d'appel final en 2024 et l'adoption en mars 2024 de l'ordonnance sur la sécurité nationale.", source: "https://freedomhouse.org/country/hong-kong/freedom-world/2025"}
chronologie:
  - {annee: 1984, evenement: "Signature à Pékin, le 19 décembre, de la Déclaration conjointe sino-britannique : haut degré d'autonomie garanti pour 50 ans."}
  - {annee: 1990, evenement: "L'Assemblée populaire nationale adopte la Loi fondamentale le 4 avril."}
  - {annee: 1997, evenement: "Transfert de souveraineté le 1er juillet ; entrée en vigueur de la Loi fondamentale."}
  - {annee: 2020, evenement: "Loi sur la sauvegarde de la sécurité nationale dans la Région, adoptée à Pékin sans consultation du public de Hong Kong selon le Comité des droits de l'homme de l'ONU."}
  - {annee: 2021, evenement: "Le Comité permanent de l'Assemblée populaire nationale modifie l'annexe II de la Loi fondamentale (30 mars) : Conseil législatif de 90 sièges, dont 20 élus au suffrage direct."}
  - {annee: 2022, evenement: "Observations finales du Comité des droits de l'homme de l'ONU demandant l'abrogation de la loi sur la sécurité nationale."}
  - {annee: 2024, evenement: "Le Conseil législatif adopte en mars l'ordonnance sur la sauvegarde de la sécurité nationale (article 23 de la Loi fondamentale)."}
fiabilite:
  verifie: ["Loi fondamentale, art. 2, 7, 8, 9, 15 à 19, 21, 24, 26, 45, 66, 82, 106, 108, 136, 154, 158 et 159 (site officiel basiclaw.gov.hk et Congressional-Executive Commission on China).", "Annexe II modifiée le 30 mars 2021 : 40 sièges élus par le Comité électoral, 30 par les circonscriptions fonctionnelles, 20 au suffrage direct.", "Déclaration conjointe de 1984, § 3 (2), 3 (3) et 3 (12) (Bureau des affaires constitutionnelles et continentales).", "Observations finales CCPR/C/CHN-HKG/CO/4 (2022), § 4-5, 12-14 et 51-52.", "Population résidente de 7 508 700 à fin décembre 2025, chiffre définitif ; 7 518 300 à fin juin 2026, chiffre provisoire (Département du recensement et des statistiques) ; surface terrestre de 1 114,57 km², données arrêtées en octobre 2025 (Lands Department).", "Freedom House 2025 : 20 sièges sur 90 au suffrage direct, soit 22 % ; démission de cinq juges étrangers de la Cour d'appel final en 2024 ; ordonnance au titre de l'article 23 adoptée en mars 2024."]
  non_confirme: ["Le texte de la loi sur la sécurité nationale de 2020 et de l'ordonnance de 2024 n'a pas été lu sur le site officiel de la législation (accès refusé) ; leur description repose sur le Comité des droits de l'homme et Freedom House.", "Le nombre de sièges de la Région à l'Assemblée populaire nationale n'a pas été vérifié.", "L'enregistrement de la Déclaration conjointe au Secrétariat de l'ONU n'a pas été vérifié sur la Collection des traités."]
