resume: >-
  La zone administrative du Grand Pibor regroupe les anciens comtés de Pibor et de Pochalla, détachés de l'État du Jonglei, dans l'est du Soudan du Sud, près de la frontière éthiopienne.
  Elle est habitée surtout par les Murle, les Jie, les Kachipo et les Anyuak.
  Créée par l'accord de paix du 9 mai 2014 entre le gouvernement et la faction Cobra du SSDM/A (Mouvement démocratique du Soudan du Sud), puis par un décret présidentiel du 24 juillet 2014, elle a été absorbée par l'État de Boma en 2015 et rétablie comme zone administrative en février 2020.
  Elle est dirigée par un administrateur en chef nommé par le président, avec un conseil des ministres et un conseil législatif de zone ; le droit coutumier murle y est appliqué.
