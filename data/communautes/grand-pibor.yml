effectivite: {valeur: "partielle", note: "La zone est dirigée par un administrateur au statut comparable à celui d'un gouverneur d'État, nommé par le président ; les payams érigés en comtés par l'administrateur en chef ne sont pas reconnus dans la politique et les statistiques nationales ; des violences intercommunautaires répétées y sont documentées (au moins 738 morts en 2020, plus de 300 morts fin 2022 et début 2023, d'après la Division des droits de l'homme de la mission des Nations unies, UNMISS) ; des parties des communautés kachipo et anyuak demandent à quitter la zone (Conflict Sensitivity Resource Facility, profil du comté de Pibor, 2025).", source: "https://csrf-southsudan.org/county_profile/pibor/"}
chronologie:
  - {annee: 2014, evenement: "Accord de paix du 9 mai (Addis-Abeba) entre le gouvernement et la faction Cobra du SSDM/A ; décret présidentiel du 24 juillet créant la zone ; David Yau Yau nommé administrateur en chef le 30 juillet."}
  - {annee: 2015, evenement: "Création de l'État de Boma ; la zone administrative est dissoute."}
  - {annee: 2020, evenement: "Décision présidentielle du 15 février : retour à dix États et trois zones administratives, dont Pibor."}
  - {annee: 2024, evenement: "Décret présidentiel nommant Gola Boyoi administrateur en chef."}
  - {annee: 2026, evenement: "Le conseil des ministres de la zone approuve la création d'une cour d'appel coutumière des chefs murle."}
