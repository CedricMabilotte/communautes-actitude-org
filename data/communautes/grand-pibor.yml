droits:
  autogouvernement: {valeur: "partiel", note: "Décret présidentiel du 24 juillet 2014 : zone autonome au sein de l'État du Jonglei, dirigée par un administrateur en chef (S/2014/708, par. 11) ; l'accord du 9 mai 2014 lui donne le rang de gouverneur d'État. L'administrateur en chef est nommé et révoqué par décret présidentiel (2024) ; la zone a un conseil des ministres et un conseil législatif de zone (2026).", source: "https://documents.un.org/api/symbol/access?s=S/2014/708&l=en&t=pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil législatif de zone délibère les textes, dont l'amendement au droit coutumier murle approuvé par le conseil des ministres en septembre 2026 ; l'administrateur en chef les promulgue.", source: "https://www.eyeradio.org/article/pibor-council-approves-establishment-of-murle-customary-court-of-appeal"}
  justice_propre: {valeur: "partiel", note: "Des affaires sont jugées selon le droit coutumier murle (Murle Customary Law) ; en septembre 2026 le conseil des ministres de la zone a approuvé la création d'une cour d'appel coutumière des chefs murle, encore soumise au conseil législatif.", source: "https://www.eyeradio.org/article/pibor-council-approves-establishment-of-murle-customary-court-of-appeal"}
