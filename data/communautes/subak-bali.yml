resume: >-
  Fiche agrégée : elle couvre les subak de Bali, que le règlement régional (Peraturan Daerah, loi provinciale) n° 9 de 2012 définit comme des « organisations traditionnelles » de gestion de l'eau d'irrigation et des cultures, au niveau des exploitations, « dans la communauté coutumière de Bali » ; le subak a pour fondements la Pancasila (doctrine d'État), la Constitution et le concept du Tri Hita Karana (harmonie avec le divin, entre les personnes et avec l'environnement), « animé par la religion hindoue » (art. 2). Chaque subak fixe ses limites (palemahan) avec les subak voisins, adopte ses règles coutumières écrites (awig-awig), élit ses dirigeants (prajuru), menés par un pekaseh ou kelian subak, et décide en assemblée (paruman) de l'usage de l'eau par des tiers. Les pekaseh peuvent former des conseils (Majelis Subak) au niveau du sous-district, du district et de la province, qui servent de médiateurs entre subak. La loi nationale n° 15 de 2023 sur la province de Bali mentionne les subak à son article 6. En 2026, la province affecte une aide de 15 millions de roupies à chacun des 2 883 subak et subak abian (associations de cultures sèches) recensés, versée par l'intermédiaire des budgets des villages et des districts. Les villages coutumiers de l'île font l'objet de la fiche « Villages coutumiers de Bali (desa adat) ».
