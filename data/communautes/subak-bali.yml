base_nationale:
  - {instrument: "Peraturan Daerah Provinsi Bali n° 9 de 2012 sur les subak (règlement régional du 17 décembre 2012), qui abroge le règlement provincial n° 02/PD/DPRD/1972 sur l'irrigation", nature: "loi", annee: 2012, source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  - {instrument: "Undang-Undang n° 15 de 2023 sur la province de Bali (loi nationale du 4 mai 2023), art. 6 : « Dans le territoire de la province de Bali se trouvent des desa adat et des subak, régis par règlement régional de la province »", nature: "loi", annee: 2023, source: "https://lovebali.baliprov.go.id/gubernur/v4/7.LawNumber15of2023.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le subak est dirigé par un pekaseh ou kelian subak ; ses dirigeants (prajuru) sont choisis et désignés par les membres (krama subak), la composition et les tâches étant fixées par les awig-awig (art. 12 du règlement n° 9 de 2012) ; le gouverneur assure l'encadrement et l'appui (pembinaan) avec les districts (art. 13) ; les relations avec le village administratif, le desa pakraman (village coutumier) et les autres institutions sont de coordination et de consultation (art. 14).", source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque subak doit avoir des awig-awig, adoptés et validés par les membres et enregistrés au bureau du chef de district ou du maire (art. 9 et 10 du règlement n° 9 de 2012) ; ils fixent les conditions d'adhésion, les cotisations et les sanctions (art. 6, 16 et 19 (6)) ; ils ne doivent pas contredire la Pancasila (doctrine d'État), la Constitution et les lois, et leurs sanctions doivent respecter les lois et le « sens de la justice » de la société (art. 9 (2) et 11).", source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  justice_propre: {valeur: "partiel", note: "Le subak applique le droit coutumier en son sein (art. 8 (b) du règlement n° 9 de 2012) ; toute personne qui obstrue ou endommage un canal est sanctionnée selon les awig-awig (art. 19 (6)) ; les Majelis Subak (conseils de pekaseh) de sous-district, de district et de province servent de médiateurs dans les litiges entre subak (art. 21 et 23). Le texte ne crée pas de juridiction.", source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  terres: {valeur: "partiel", note: "Chaque subak fixe les limites de son territoire (palemahan) par accord avec les subak voisins (art. 4 du règlement n° 9 de 2012) ; toute modification des limites ou de la fonction de ce territoire exige l'accord des membres et l'approbation du chef de district ou du maire (art. 5 (1)) ; un membre qui veut changer l'usage agricole d'une parcelle doit obtenir l'accord de l'assemblée (art. 18 (2)) ; le subak peut posséder des biens immobiliers, gérés selon les awig-awig (art. 15). Le texte ne crée pas de propriété collective des rizières.", source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  ressources: {valeur: "partiel", note: "Le subak a pour objet de régler l'irrigation et l'organisation des cultures (art. 3 du règlement n° 9 de 2012), ses membres se coordonnent sur les modes de culture dans son territoire (art. 20) et entretient les canaux et autres ouvrages d'irrigation (art. 8 (e)) ; toute utilisation de l'eau au profit d'usagers extérieurs au subak passe par l'assemblée des membres, faute de quoi elle « n'est pas valide » (art. 19 (1) à (3)).", source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  consentement: {valeur: "partiel", note: "L'utilisation de l'eau du subak par des tiers exige une coordination avec l'ensemble des membres en assemblée (paruman), sans laquelle elle n'est pas valide (art. 19 (1) à (3) du règlement n° 9 de 2012) ; le changement de limites ou de fonction du territoire du subak suppose l'accord des membres (art. 5 (1)). Le texte ne vise pas les projets d'infrastructure de l'État.", source: "https://jariungu.com/peraturan/pdf/20/20462.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les revenus du subak comprennent les contributions des membres (urunan, iuran) et la part de récolte qui lui est remise (sawinih), fixées par les awig-awig, les revenus de ses biens et les aides publiques (art. 16 du règlement n° 9 de 2012) ; les districts peuvent réduire ou supprimer l'impôt foncier (PBB) des subak qui maintiennent l'usage agricole de leur territoire (art. 5 (2)). En 2026, l'aide financière spéciale (BKK) de la province est de 15 millions de roupies par subak ou subak abian, soit 43,245 milliards de roupies au total ; elle transite par les budgets des villages (desa) et des districts, qui l'exécutent sur la base d'un budget présenté par le pekaseh avec le procès-verbal de l'assemblée du subak ; au moins 13 millions vont aux rites, aux temples, aux bâtiments du subak et aux cultures, au plus 1,5 million aux indemnités des dirigeants et au fonctionnement (instructions techniques BKK 2026, §1.6, 4.1 et 4.2).", source: "https://cloud-ng.baliprov.go.id/dpma/2026/03/FINAL-Juknis-BKK-Subak-Tahun-2026.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Wayan Windia (université Udayana, Bali Membangun Bali, 2018), tous les subak reçoivent une aide publique depuis 2006, mais l'eau d'irrigation est prélevée par le tourisme et l'usage domestique, la conversion des rizières atteint environ 750 ha par an, l'organe de gestion du bien du patrimoine mondial annoncé à l'UNESCO n'a pas été créé, et les subak ne peuvent se maintenir sans politique publique ; il demande une révision du règlement n° 9 de 2012. Dans le même numéro, Made Putra Suryawan relève une baisse de la surface en rizières de la province de 81 625 ha (2012) à 79 480 ha (2016).", source: "https://ejournal.baliprov.go.id/index.php/jbmb/article/download/27/23"}
chronologie:
  - {annee: 1972, evenement: "Règlement provincial n° 02/PD/DPRD/1972 sur l'irrigation, qui traite des subak."}
  - {annee: 2012, evenement: "Inscription du « Paysage culturel de la province de Bali : le système des subak comme manifestation de la philosophie du Tri Hita Karana » sur la Liste du patrimoine mondial de l'UNESCO."}
  - {annee: 2012, evenement: "Règlement régional n° 9 de 2012 sur les subak (17 décembre), qui abroge le règlement de 1972."}
  - {annee: 2023, evenement: "Loi nationale n° 15 de 2023 sur la province de Bali : l'article 6 mentionne les subak."}
  - {annee: 2026, evenement: "Aide financière spéciale de la province à 2 883 subak et subak abian, 15 millions de roupies chacun."}
fiabilite:
  verifie: ["Texte du règlement n° 9 de 2012 (copie publiée par jariungu.com) : art. 1, 3 à 23, date du 17 décembre 2012, Lembaran Daerah 2012 n° 9.", "Loi n° 15 de 2023, art. 6 (copie officielle publiée par la province).", "Instructions techniques de l'aide financière spéciale 2026 : 2 883 subak et subak abian (161 dans 46 kelurahan, dont 146 subak et 15 subak abian ; 2 722 dans 596 desa, dont 1 462 subak et 1 260 subak abian), 15 millions de roupies par bénéficiaire, 43,245 milliards au total.", "Inscription UNESCO de 2012, bien de 19 519,9 ha avec zone tampon de 1 454,8 ha (page de l'UNESCO).", "Base de données juridiques de la Cour des comptes (BPK) : règlement n° 9 de 2012 « en vigueur », adopté et promulgué le 17 décembre 2012, sans modification ni abrogation enregistrée (consultée en octobre 2026).", "Chiffres de surface en rizières 2012-2016 : article de Made Putra Suryawan, Bali Membangun Bali, 2018, publié dans le même fichier que l'article de Wayan Windia."]
  non_confirme: ["La copie du règlement n° 9 de 2012 porte la mention « RANCANGAN » (projet) en tête, mais contient la date de promulgation, les signatures et le numéro au journal officiel provincial ; la base de la BPK confirme la date et le statut, mais son fichier PDF n'a pas pu être téléchargé et le texte n'a pas été comparé.", "Autre décompte : 2 711 subak (1 604 subak de rizière, 1 107 subak abian) selon Suryawan (2018), sans année de référence, contre 2 883 dans les instructions techniques de 2026.", "Le règlement ne qualifie pas le subak de « communauté de droit coutumier » (kesatuan masyarakat hukum adat) ; cette qualification est soutenue par une étude juridique (Artatik et al., Vidya Wertta, 2019), non par le texte.", "Nombre de membres (krama subak) et surface totale irriguée par les subak : aucun chiffre officiel trouvé ; les chiffres de surface de l'étude de 2018 portent sur les rizières de la province.", "Liste nominative officielle des subak : elle figure dans les décisions du gouverneur n° 1/03-O-HK/2026 et n° 2/03-O/HK/2026 du 2 janvier 2026 sur les bénéficiaires de l'aide, citées par les instructions techniques mais non trouvées en ligne, d'où l'absence de tableau.", "Inscription au registre des aires du patrimoine autochtone et communautaire ou mention dans un document de la Convention sur la diversité biologique : non recherchée de façon exhaustive.", "Surface : non trouvée ; la surface du bien UNESCO (19 519,9 ha) ne couvre que cinq sites et n'est pas reprise comme surface du régime."]
