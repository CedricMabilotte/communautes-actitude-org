droits:
  autogouvernement: {valeur: "conteste", note: "La loi fondamentale de 2005 (art. 4) prévoit que l'État reconnaît et soutient le statut autonome des peuples autochtones ; la loi sur l'autonomie autochtone qui devait l'organiser n'a pas été adoptée.", source: "https://www.apc.gov.tw/portal/docDetail.html?CID=74DD1F415708044A&DID=3E651750B4006467D4B40DD3AC1D7378"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Les procédures administratives et judiciaires doivent respecter les langues, coutumes et pratiques autochtones, loi fondamentale de 2005, art. 30 ; aucune juridiction autochtone propre.", source: "https://www.apc.gov.tw/portal/docDetail.html?CID=74DD1F415708044A&DID=3E651750B4006467D4B40DD3AC1D7378"}
  terres: {valeur: "partiel", note: "L'État reconnaît les droits des peuples autochtones sur les terres et les ressources naturelles et crée une commission d'enquête et de gestion des terres autochtones, loi fondamentale de 2005, art. 20.", source: "https://www.apc.gov.tw/portal/docDetail.html?CID=74DD1F415708044A&DID=3E651750B4006467D4B40DD3AC1D7378"}
  ressources: {valeur: "partiel", note: "Droit de chasser, de cueillir, d'extraire pierres et terre et d'utiliser l'eau à des fins non lucratives dans les régions autochtones, loi fondamentale de 2005, art. 19.", source: "https://www.apc.gov.tw/portal/docDetail.html?CID=74DD1F415708044A&DID=3E651750B4006467D4B40DD3AC1D7378"}
  consentement: {valeur: "reconnu", note: "L'État et les personnes privées doivent consulter les peuples autochtones ou leurs communautés locales (buluo) et obtenir leur consentement libre, préalable et éclairé pour tout développement de terres ou de ressources dans leurs régions, loi fondamentale, art. 21 (modifié en 2015).", source: "https://www.cip.gov.tw/en/news/data-list/74DD1F415708044A/2D9680BFECBE80B64D07914C026D3D28-info.html"}
  langue: {valeur: "partiel", note: "Les autochtones peuvent utiliser leur langue dans les démarches administratives et les procédures judiciaires, avec traduction assurée ; dans les 55 cantons autochtones, les documents officiels peuvent être rédigés en langue autochtone et en chinois, loi sur le développement des langues autochtones de 2017.", source: "https://www.loc.gov/item/global-legal-monitor/2017-06-21/taiwan-new-indigenous-languages-act/"}
  education: {valeur: "partiel", note: "L'État protège le droit à l'éducation des peuples autochtones et adapte l'enseignement à leurs besoins, loi fondamentale de 2005, art. 7 ; loi sur l'éducation des peuples autochtones de 2004.", source: "https://www.apc.gov.tw/portal/docDetail.html?CID=74DD1F415708044A&DID=3E651750B4006467D4B40DD3AC1D7378"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Trois députés élus par les autochtones de plaine et trois par les autochtones de montagne au Yuan législatif, articles additionnels à la Constitution, art. 4.", source: "https://www.constituteproject.org/constitution/Taiwan_2005"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "IWGIA (2025) relève que onze peuples pingpu restent non reconnus, que la Cour constitutionnelle a exigé en octobre 2022 une loi sur leur statut avant octobre 2025 et que les droits fonciers subissent des atteintes liées aux projets commerciaux et miniers.", source: "https://iwgia.org/en/taiwan/5676-iw-2025-taiwan.html"}
