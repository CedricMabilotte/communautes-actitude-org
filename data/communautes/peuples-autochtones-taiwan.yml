resume: >-
  Taïwan reconnaît 16 peuples autochtones, dont les Amis, Atayal, Paiwan, Bunun et Truku. La loi fondamentale sur les peuples autochtones, promulguée le 5 février 2005 et modifiée en 2015 et en 2018, reconnaît leurs droits sur les terres et les ressources, impose la consultation et le consentement des peuples ou des communautés-villages (部落) pour les projets qui les concernent et fait de chaque 部落 approuvé une personne morale de droit public dotée d'une assemblée. Les articles additionnels à la Constitution réservent six sièges du Yuan législatif (parlement) aux autochtones. Taïwan n'étant pas membre de l'ONU, la reconnaissance est nationale. Les chefs des cantons de montagne et des districts autochtones de montagne des municipalités spéciales doivent être autochtones de montagne (loi sur le système local, art. 57 et 58). Une loi du 23 octobre 2025 ouvre une procédure distincte de reconnaissance des groupes pingpu (autochtones des plaines) ; les Siraya ont été reconnus à ce titre le 31 juillet 2026. Plusieurs cantons autochtones sont aussi des zones de développement culturel hakka (voir la fiche Hakka de Taïwan).
