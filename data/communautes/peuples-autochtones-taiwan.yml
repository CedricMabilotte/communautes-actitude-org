resume: >-
  Taïwan reconnaît 16 peuples autochtones, dont les Amis, Atayal, Paiwan, Bunun et Truku. La loi fondamentale sur les peuples autochtones, promulguée le 5 février 2005 et modifiée en 2015, reconnaît leurs droits sur les terres et les ressources et impose leur consentement préalable pour les projets qui les concernent. Les articles additionnels à la Constitution réservent six sièges du Yuan législatif (parlement) aux autochtones. Taïwan n'étant pas membre de l'ONU, la reconnaissance est nationale.
