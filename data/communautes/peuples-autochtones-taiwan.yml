droits:
  autogouvernement: {valeur: "partiel", note: "Chaque 部落 (communauté-village) approuvé par le Conseil des peuples autochtones est une personne morale de droit public et doit avoir une assemblée (部落會議), loi fondamentale, art. 2-1 (ajouté en décembre 2015). Les chefs des cantons de montagne et des districts autochtones de montagne, collectivités autonomes, doivent être autochtones de montagne (loi sur le système local, art. 57, 58 et 83-2). L'autonomie des peuples autochtones prévue par l'art. 4 de la loi fondamentale renvoie à une loi qui n'a pas été adoptée.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130003"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Les procédures législatives, judiciaires, administratives, de médiation et d'arbitrage doivent respecter les langues, coutumes et valeurs autochtones, avec interprète ; l'État peut créer des tribunaux ou chambres autochtones, loi fondamentale, art. 30. Aucune juridiction autochtone propre n'est prévue par la loi.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130003"}
  terres: {valeur: "partiel", note: "L'État reconnaît les droits des peuples autochtones sur les terres et les ressources naturelles et crée une commission d'enquête et de traitement des terres autochtones ; le régime des terres renvoie à une loi distincte, loi fondamentale, art. 20.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130003"}
  ressources: {valeur: "partiel", note: "Droit de chasser, de cueillir, d'extraire minéraux, pierres et terre et d'utiliser l'eau à des fins non lucratives dans les régions autochtones et les zones maritimes désignées, limité aux usages culturels, rituels ou personnels, loi fondamentale, art. 19 (modifié en 2018).", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130003"}
  consentement: {valeur: "reconnu", note: "L'État et les personnes privées doivent consulter les peuples autochtones ou les 部落 et obtenir leur consentement ou leur participation pour le développement des terres, l'exploitation des ressources, la conservation et la recherche sur les terres autochtones (art. 21, modifié en 2015) ; la création de parcs nationaux et d'aires protégées dans les régions autochtones requiert leur consentement et une gestion conjointe (art. 22).", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130003"}
  langue: {valeur: "partiel", note: "Les langues autochtones sont langues nationales (art. 1) ; les autochtones peuvent s'exprimer dans leur langue dans les procédures administratives, législatives et judiciaires avec interprète (art. 13) ; dans les régions autochtones, les administrations et écoles peuvent rédiger des documents officiels dans la langue locale (art. 14), loi sur le développement des langues autochtones de 2017.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130037"}
  education: {valeur: "partiel", note: "L'État protège le droit des peuples autochtones à l'éducation selon leur volonté, loi fondamentale de 2005, art. 7 ; les écoles offrent des cours de langues autochtones, loi sur le développement des langues autochtones, art. 19.", source: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0130003"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Trois députés élus par les autochtones de plaine et trois par les autochtones de montagne au Yuan législatif, articles additionnels à la Constitution, art. 4.", source: "https://www.constituteproject.org/constitution/Taiwan_2005"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "IWGIA (2025) relève que des contradictions entre les lois et leur application partielle freinent l'autonomie des peuples autochtones, que onze peuples pingpu restaient non reconnus en 2024 et que la politique de neutralité carbone prévoit d'utiliser jusqu'à 20 000 hectares de terres réservées autochtones comme puits de carbone.", source: "https://iwgia.org/en/taiwan/5676-iw-2025-taiwan.html"}
chronologie:
  - {annee: 2005, evenement: "Promulgation de la loi fondamentale sur les peuples autochtones (5 février)."}
  - {annee: 2015, evenement: "Modification de l'article 21 sur la consultation et le consentement (24 juin) ; ajout de l'article 2-1 sur les 部落 personnes morales (16 décembre)."}
  - {annee: 2017, evenement: "Loi sur le développement des langues autochtones (14 juin)."}
  - {annee: 2018, evenement: "Modification des articles 18 et 19 de la loi fondamentale, droits d'usage étendus aux zones maritimes (20 juin)."}
  - {annee: 2022, evenement: "La Cour constitutionnelle (arrêt 111年憲判字第17號, 28 octobre) exige une loi sur le statut des peuples pingpu."}
  - {annee: 2025, evenement: "Loi sur le statut des groupes autochtones pingpu (23 octobre)."}
  - {annee: 2026, evenement: "Le Yuan exécutif reconnaît les Siraya comme groupe autochtone pingpu (31 juillet)."}
