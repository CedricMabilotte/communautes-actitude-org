resume: >-
  Fiche agrégée : elle couvre les forêts communales régies par la loi (1952:167) sur les forêts communales du Norrland et de Dalécarlie. Ces forêts ont été mises en réserve au XIXe siècle lors du remembrement (storskifte) en Dalécarlie et dans le Gävleborg, sous le nom de besparingsskogar (« forêts d'épargne »), ou lors du partage des terres entre la Couronne et les paysans (avvittring) dans le Västerbotten et le Norrbotten, sous le nom d'allmänningar (communaux). Elles appartiennent en commun aux propriétaires des immeubles pour lesquels elles ont été constituées ; la part est attachée à l'immeuble et ne peut être cédée seule. Chaque forêt est administrée par un conseil (allmänningsstyrelse) élu par l'assemblée des copropriétaires (allmänningsstämma), selon un règlement que fixe le conseil d'administration du comté (länsstyrelse, représentation de l'État dans le comté).
