  verifie: ["Articles 1 à 19 de la loi 72 de 2008 (texte de la Gaceta Oficial 26193, FAOLEX).", "Remise des premiers titres le 6 juin 2012 à Puerto Lara et Caña Blanca, 1 382 ha (Bureau régional du HCDH pour l'Amérique centrale).", "Paragraphes 9, 16, 32 à 37 et 52 du rapport A/HRC/27/52/Add.1.", "Paragraphes 80 à 83 et 158 à 160 et points résolutifs 4, 5 et 12 de l'arrêt de la Cour interaméricaine (série C n° 284), dont le décret exécutif 223 de 2010.", "25 territoires reconnus aux fins de titrage en 2019 et résolution DM-0612-2019 du 29 novembre 2019 (IWGIA, The Indigenous World 2020, chapitre Panama).", "Articles 1 à 9 de la loi 88 de 2010 (Gaceta Oficial 26669-A)."]
  non_confirme: ["Nombre total de titres collectifs délivrés depuis 2012, surface titrée et population concernée : aucune liste officielle consultée.", "Adoption du décret exécutif prévu à l'article 15 de la loi 72 sur la reconnaissance des autorités traditionnelles.", "Application aux terres collectives de la loi 37 de 2016 sur la consultation et le consentement préalables.", "Nombre de villages : non trouvé. Le rapport A/HRC/27/52/Add.1 (2014) indique que 44 communautés emberá et wounaan sont restées hors de la comarca Emberá Wounaan en 1983 ; aucun total national des communautés des terres collectives n'a été trouvé."]
