resume: >-
  Fiche agrégée : elle couvre le régime créé par la loi sur la protection et la promotion du mode de vie des groupes ethniques B.E. 2568 (2025), publiée au Journal royal (Ratchakitcha) le 18 septembre 2025 et en vigueur le lendemain. La loi reconnaît aux groupes ethniques des droits sur les terres et les ressources nécessaires à leur subsistance, un droit à l'éducation dans leur langue et un droit à l'information et à la participation ; elle crée un Conseil national élu par les groupes enregistrés et des « aires protégées du mode de vie des groupes ethniques » (zones d'habitat, de culture et de lieux spirituels), gérées par un comité où les représentants de la communauté sont majoritaires. Le Centre d'anthropologie Princesse Maha Chakri Sirindhorn a publié en juillet 2026 une liste de 60 groupes ethniques admis à s'enregistrer (dont Pgaz K'nyau et Pwo [Karen], Moken, Moklen, Urak Lawoi, Mlabri, Mani, Hmong, Akha, Lisu) ; le Conseil compte 211 membres issus de 51 groupes depuis le 28 septembre 2026. La loi n'emploie pas la notion de peuple autochtone et ne modifie pas le statut des terres d'État.
