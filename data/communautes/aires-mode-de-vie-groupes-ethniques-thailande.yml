  verifie: ["Texte de la loi B.E. 2568 lu sur le PDF du Journal royal (20 pages) : sections 1 à 4, 5 à 13, 17, 20, 21, 26, 28, 29, 31, 37 à 43, 47 ; comité de gestion d'une aire : 7 à 15 membres (section 40).", "Date de publication (18 septembre 2025) et entrée en vigueur au lendemain (section 2).", "Section 47 : renvoi aux résolutions du Conseil des ministres du 2 juin 2010 (Chao Le) et du 3 août 2010 (Karen) pour la déclaration des aires dans l'année suivant les règlements de la section 37.", "Liste de 60 groupes ethniques annexée à la notification du Centre d'anthropologie du 28 juillet 2026 (enregistrement ouvert du 28 juillet au 27 août 2026).", "Notification du ministère de la Culture B.E. 2569 signée le 23 juillet 2026 (première et dernière pages lues).", "Annonce du 28 septembre 2026 : 211 membres du Conseil issus de 51 groupes.", "CERD/C/THA/CO/4-8, § 25 à 28 : Karen, Lahu, Mani, Moken et Urak Lawoi nommés.", "Position du Bureau régional du HCDH pour l'Asie du Sud-Est (notion de peuple autochtone absente, consentement préalable partiellement reflété, limites des lois forestières)."]
  non_confirme: ["Nombre d'aires protégées du mode de vie déclarées : aucune déclaration trouvée ; pas de tableau des sites faute de liste officielle.", "Règlements du comité national prévus aux sections 37, 39, 41 et 42 : non trouvés.", "Population : le chiffre de 6 millions est une estimation reprise par la presse, sans recensement officiel par groupe.", "Texte des résolutions du Conseil des ministres de 2010 : non consulté directement ; dates reprises de la section 47 de la loi.", "Type secondaire « peuple autochtone » : l'État ne reconnaît pas cette notion ; il suit la terminologie du CERD.", "Liste nominative des 51 groupes enregistrés : annexe de l'annonce du 28 septembre 2026 non lue en détail.", "Surface des aires protégées du mode de vie : non trouvé.", "Nombre de villages : non trouvé."]
