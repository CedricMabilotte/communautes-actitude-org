reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, observations finales CERD/C/THA/CO/4-8 (10 février 2022), § 25 à 28 : discriminations visant notamment les Karen, Lahu, Mani, Moken et Urak Lawoi ; recommandation de reconnaître dans la loi le statut et les droits des peuples autochtones et de protéger leurs terres contre les expulsions liées aux lois forestières.", annee: 2022, source: "https://documents.un.org/doc/undoc/gen/g22/254/66/pdf/g2225466.pdf"}
base_nationale:
  - {instrument: "Constitution du Royaume de Thaïlande de 2017, section 70 : l'État promeut et protège les groupes ethniques dans leur droit de vivre selon leur culture, leurs coutumes et leur mode de vie traditionnel", nature: "constitution", annee: 2017, source: "https://www.constituteproject.org/constitution/Thailand_2017"}
  - {instrument: "Loi sur la protection et la promotion du mode de vie des groupes ethniques B.E. 2568 (Phraratchabanyat khumkhrong lae songsoem withichiwit klum chatiphan), Journal royal vol. 142, partie 61 kor, 18 septembre 2025, 47 sections", nature: "loi", annee: 2025, source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  - {instrument: "Notification du ministère de la Culture sur les critères d'enregistrement des groupes ethniques et l'élection des membres du Conseil, B.E. 2569 (23 juillet 2026)", nature: "loi", annee: 2026, source: "https://www.sac.or.th/portal/uploads/news/2026_20260731125659-2.pdf"}
  - {instrument: "Notification du Centre d'anthropologie Princesse Maha Chakri Sirindhorn du 28 juillet 2026 : liste de 60 groupes ethniques admis à s'enregistrer (section 21 et 46 de la loi)", nature: "loi", annee: 2026, source: "https://www.sac.or.th/portal/uploads/news/2026_20260731123804-1.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque groupe enregistré élit au plus cinq représentants au Conseil de protection et de promotion du mode de vie des groupes ethniques de Thaïlande (au plus 300 membres), qui élit son président et son bureau (sections 21 et 26 de la loi de 2025) ; dans chaque aire protégée, un comité de gestion de 7 à 15 membres compte au plus un tiers de représentants de l'État et son président est choisi parmi les représentants de la communauté (section 40). Le Conseil a un rôle de proposition et de coordination (section 28).", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité de gestion de chaque aire rédige le règlement de l'aire, « accord commun de la communauté » sur l'habitat, les cultures, les lieux spirituels et la conservation, avec ses mesures d'application ; ce règlement ne doit contredire ni l'ordre public, ni la sécurité de l'État, ni le plan directeur de l'aire, et il est soumis à l'approbation du Bureau du secrétaire permanent du ministère de la Culture (section 42 (1) de la loi de 2025). Le Conseil adopte son règlement intérieur (section 29).", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi reconnaît aux groupes ethniques un droit sur les terres nécessaires à leur subsistance et le droit d'être protégés contre l'éviction de leurs terres sans information préalable (section 9 (1) et (4)) ; dans une aire protégée déclarée, la population a le droit d'habiter et d'utiliser les terres selon le règlement de l'aire (sections 38 et 39). La déclaration de l'aire n'a « pas pour effet de changer les limites ou le statut, ni de retirer le statut des terres de l'État » (section 37, al. 3) : aucun titre collectif n'est attribué.", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  ressources: {valeur: "partiel", note: "Droit de gérer, conserver, restaurer et utiliser les ressources naturelles (terres, eau, forêts, mer et littoral) de façon équilibrée et durable (section 9 (1) de la loi de 2025) ; dans une aire protégée, droit d'utiliser les ressources pour la consommation des ménages, l'économie communautaire et les usages collectifs, sous réserve des lois applicables à la zone et des règles fixées par le comité national (section 39).", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  consentement: {valeur: "partiel", note: "Droit à l'information, à la participation et à l'avis sur les décisions, les évaluations des effets et les projets de l'État ou autorisés par lui qui peuvent toucher le mode de vie de la communauté (section 11 de la loi de 2025) ; avant la déclaration d'une aire, la communauté élabore le plan directeur avec les services de l'État et les parties intéressées sont consultées (section 37, al. 2). Le texte ne prévoit pas de consentement préalable ; le Bureau régional du HCDH note que ce principe n'est que « partiellement reflété ».", source: "https://bangkok.ohchr.org/thailand-new-law-ethnic-groups"}
  langue: {valeur: "partiel", note: "Droit d'utiliser, de promouvoir, de conserver et de restaurer sa langue, sa culture et ses coutumes ; l'assimilation forcée est interdite (section 7 de la loi de 2025). Le texte ne donne pas de statut officiel aux langues.", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  education: {valeur: "partiel", note: "Droit d'organiser un enseignement dans sa propre langue, adapté à la culture, conjointement avec l'enseignement public à tous les niveaux ; l'État « devrait » le soutenir (section 8 de la loi de 2025).", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  fiscalite: {valeur: "partiel", note: "Le Centre d'anthropologie Princesse Maha Chakri Sirindhorn examine chaque année l'attribution d'une subvention de fonctionnement au Conseil (section 31 (2) de la loi de 2025) ; le comité de gestion de chaque aire présente au Centre un plan, des projets et un budget pour financement (section 42 (2)). Aucun pouvoir fiscal.", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  representation: {valeur: "partiel", note: "Le comité national de protection et de promotion, présidé par le Premier ministre, comprend le président du Conseil comme quatrième vice-président et neuf représentants des groupes ethniques proposés par le Conseil (section 13 (5) et (8) de la loi de 2025). Aucun siège réservé au Parlement.", source: "https://ratchakitcha.soc.go.th/documents/83911.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Bureau régional du HCDH pour l'Asie du Sud-Est relève en septembre 2025 que le principe de consentement libre, préalable et éclairé n'est que « partiellement reflété » et que les droits fonciers des communautés « restent limités » par les lois forestières. Le Conseil est constitué : 211 membres issus de 51 groupes ethniques enregistrés, liste publiée le 28 septembre 2026 par le comité chargé de l'enregistrement. Aucune déclaration d'aire protégée du mode de vie n'a été trouvée au 1er octobre 2026 : les déclarations dépendent de règlements du comité national (section 37), que le comité transitoire ne peut pas adopter (section 43, al. 2).", source: "https://bangkok.ohchr.org/thailand-new-law-ethnic-groups"}
chronologie:
  - {annee: 2010, evenement: "Résolutions du Conseil des ministres du 2 juin 2010 (mode de vie des Chao Le, populations de la mer) et du 3 août 2010 (mode de vie des Karen) sur des zones culturelles spéciales."}
  - {annee: 2017, evenement: "Constitution, section 70 : l'État promeut et protège le mode de vie des groupes ethniques."}
  - {annee: 2022, evenement: "Le Comité pour l'élimination de la discrimination raciale recommande de reconnaître dans la loi les droits des peuples autochtones (CERD/C/THA/CO/4-8)."}
  - {annee: 2025, evenement: "Adoption par l'Assemblée (5 février, puis accord sur les amendements du Sénat le 6 août) ; publication au Journal royal le 18 septembre, entrée en vigueur le 19 septembre."}
  - {annee: 2026, evenement: "Notification du ministère de la Culture sur l'enregistrement (23 juillet) ; liste de 60 groupes ethniques (28 juillet) ; liste des 211 membres du Conseil issus de 51 groupes (28 septembre)."}
