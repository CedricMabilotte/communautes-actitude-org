  verifie: ["Sections 4 à 10, 14, 15, 28 à 30, 33, 33A, 38 à 39, 43 à 45 et 52A de la loi (compilation n° 14, legislation.gov.au).", "Changement de titre de la loi en 2023 (endnotes de la compilation et loi de modification n° 57 de 2023).", "Propriété du parc, bail de 99 ans, loyer et part de 25 % des recettes, majorité de la communauté au conseil de gestion (plan de gestion 2015-2025).", "152 Aborigènes ou insulaires du détroit de Torres dans la zone Wreck Bay au recensement de 2021 (ABS).", "Constats de l'audit ANAO de 2019 sur Booderee.", "Entrée en vigueur des règlements de 2026 le 1er octobre 2026 et expiration du plan de gestion 2015-2025 le 19 novembre 2025 (registre fédéral).", "Règlements de 2026 datés du 21 mai 2026, pris en vertu de la s. 52A, applicables aux terres aborigènes hors Booderee (note explicative enregistrée le 20 août 2026).", "Variation du bail de Booderee : part des recettes de 25 % à 50 % et objectif de gestion par le seul conseil au 31 mai 2028 (communiqué du 2 juin 2026).", "Projet de plan de gestion 2026-2036 soumis à consultation du 5 mars au 7 avril 2026 (DCCEEW) ; aucun plan 2026-2036 enregistré au registre fédéral au 6 octobre 2026."]
