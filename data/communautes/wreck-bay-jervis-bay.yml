  - {instrument: "Aboriginal Land and Waters (Jervis Bay Territory) By-Laws 2026", nature: "loi", annee: 2026, source: "https://www.legislation.gov.au/F2026L01062/asmade/text"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Wreck Bay Aboriginal Community Council est une personne morale (s. 4) composée des membres inscrits (s. 5) ; un comité exécutif de neuf membres élus en assemblée générale exerce ses pouvoirs (s. 28 à 30) ; ses fonctions portent sur les terres et les services aux membres (s. 6) ; le ministre peut révoquer un membre de l'exécutif (s. 33(1)) et doit approuver tout contrat de plus d'un million de dollars (s. 7(3)) ; le registrar (registraire nommé par le ministre, s. 15) administre le conseil si tous les membres de l'exécutif sont révoqués (s. 33A, 2023).", source: "https://www.legislation.gov.au/C2004A03405/latest/text"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil peut édicter des règlements (by-laws) sur l'usage, l'accès, la chasse, la pêche, la coupe de bois et les sites sacrés des terres aborigènes hors parc de Booderee (s. 52A) ; ils ne peuvent contredire le droit fédéral ou territorial et sont enregistrés comme actes du ministre ; les règlements de 2026, pris par le conseil le 21 mai 2026, entrent en vigueur le 1er octobre 2026 et remplacent ceux de 2016.", source: "https://www.legislation.gov.au/F2026L01062/asmade/text"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les terres déclarées terres aborigènes sont dévolues au conseil (s. 8 à 10) ; le conseil ne peut en disposer que par baux encadrés (s. 38) et ne peut les rétrocéder à la Couronne qu'avec l'accord écrit du ministre (s. 39) ; titre de pleine propriété (freehold) sur 403 ha depuis 1986 et sur le parc de Booderee depuis 1995 ; le parc doit être loué au Directeur des parcs nationaux (s. 38B), le ministre pouvant consentir le bail à la place du conseil (s. 38C).", source: "https://www.legislation.gov.au/C2004A03405/latest/text"}
  ressources: {valeur: "partiel", note: "Les minéraux restent propriété de l'État fédéral (s. 14) ; aucune extraction sans accord entre l'État fédéral, le conseil et l'exploitant (s. 44) ; le conseil peut régler la coupe de bois, la chasse et la pêche sur ses terres hors parc (s. 52A).", source: "https://www.legislation.gov.au/C2004A03405/latest/text"}
  consentement: {valeur: "partiel", note: "Les lois minières du territoire n'autorisent aucune entrée sur les terres aborigènes (s. 43) et l'exploitation exige l'accord du conseil (s. 44) ; en revanche, le ministre peut consentir lui-même le bail du parc de Booderee au Directeur si le conseil refuse (s. 38C).", source: "https://www.legislation.gov.au/C2004A03405/latest/text"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil est exonéré des taxes foncières sur les terres aborigènes (s. 45) ; le bail de Booderee, qui expire le 10 octobre 2094 (plan de gestion 2015-2025), prévoit un loyer annuel et une part des recettes du parc versés au conseil ; la variation du bail de juin 2026, approuvée au titre de l'EPBC Act 1999 et de la loi de 1986, porte cette part de 25 % à 50 % et révise le loyer.", source: "https://www.andrewleigh.com/media_release_lease_variation_strengthens_wreck_bay_aboriginal_community_council_s_role_in_national_park_management_2_june_2026"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'audit de l'Australian National Audit Office (Cour des comptes fédérale) de 2019 relève que le conseil de gestion de Booderee s'est réuni en moyenne trois fois par an au lieu de quatre, qu'aucune révision du bail demandée depuis 2017 n'a commencé et que ce conseil a émis un avis formel de différend ; le plan de gestion du parc a expiré le 19 novembre 2025 (registre fédéral de la législation) ; le projet de plan 2026-2036 a été soumis à consultation du 5 mars au 7 avril 2026 et n'est pas enregistré au 6 octobre 2026 ; la révision du bail a abouti en juin 2026 à une première variation depuis 2003 (communiqué du 2 juin 2026).", source: "https://www.anao.gov.au/work/performance-audit/management-commonwealth-national-parks"}
chronologie:
  - {annee: 1986, evenement: "Adoption de l'Aboriginal Land Grant (Jervis Bay Territory) Act : création du Wreck Bay Aboriginal Community Council et attribution de 403 ha."}
  - {annee: 1992, evenement: "Proclamation du parc national de Jervis Bay ; la communauté refuse les deux sièges proposés au conseil de gestion."}
  - {annee: 1995, evenement: "Loi de modification ; le parc est déclaré terre aborigène le 11 octobre, puis loué pour 99 ans au Directeur des parcs nationaux en décembre."}
  - {annee: 1996, evenement: "Création du conseil de gestion du parc, à majorité de représentants de la communauté."}
  - {annee: 1997, evenement: "Le parc prend le nom de Booderee, mot de la langue dhurga."}
  - {annee: 2023, evenement: "Loi de modification : la loi devient l'Aboriginal Land and Waters (Jervis Bay Territory) Act et ajoute un directeur général (Chief Executive Officer) et une condition d'aptitude (fit and proper person) pour les membres de l'exécutif."}
  - {annee: 2025, evenement: "Expiration du plan de gestion 2015-2025 du parc de Booderee le 19 novembre."}
  - {annee: 2026, evenement: "Projet de plan de gestion de Booderee 2026-2036 soumis à consultation publique du 5 mars au 7 avril."}
  - {annee: 2026, evenement: "Le 13 avril, lors d'une célébration des 30 ans du parc, la présidente du conseil de gestion annonce le passage à une gestion de Booderee par le seul conseil en mai 2028."}
  - {annee: 2026, evenement: "Nouveaux règlements (by-laws) pris par le conseil le 21 mai, enregistrés le 20 août et en vigueur le 1er octobre, en remplacement de ceux de 2016."}
  - {annee: 2026, evenement: "Variation du bail de Booderee annoncée le 2 juin, la première depuis 2003 : part des recettes du parc portée de 25 % à 50 %, loyer révisé, passage à une gestion par le seul conseil prévu d'ici le 31 mai 2028."}
