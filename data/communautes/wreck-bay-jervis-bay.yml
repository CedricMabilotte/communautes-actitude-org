resume: >-
  Communauté koori établie à Wreck Bay, sur la péninsule de Bherwerre, dans le territoire fédéral de la baie de Jervis. La loi fédérale de 1986, nommée Aboriginal Land and Waters (Jervis Bay Territory) Act depuis 2023, crée le Wreck Bay Aboriginal Community Council, personne morale dont les membres inscrits forment le conseil, et lui attribue 403 ha de terres en pleine propriété inaliénable. Depuis 1995, le conseil est aussi propriétaire du parc national de Booderee, loué pour 99 ans au Directeur des parcs nationaux et cogéré par un conseil de gestion où les représentants de la communauté sont majoritaires. Le bail et la cogestion de Booderee sont aussi décrits dans la fiche « Parcs nationaux cogérés de Kakadu, Uluṟu-Kata Tjuṯa et Booderee ». Une variation du bail signée en juin 2026 porte la part des recettes du parc versée au conseil de 25 % à 50 % et prévoit le passage à une gestion du parc par le seul conseil d'ici le 31 mai 2028.
