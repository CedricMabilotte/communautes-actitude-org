effectivite: {valeur: "non_etablie", note: "Aucune donnée publique sur le nombre d'inscriptions au registre spécial des communes n'a été trouvée. L'analyse du Comité technique « Foncier & développement » (2023) relève que l'accès à la terre en zone rurale passe presque toujours par une autorité coutumière, souligne des incohérences de rédaction des art. 625, 626 et 640 du Code et note, à propos du rôle des communes dans l'enregistrement des droits coutumiers, qu'« il n'est pas évident de s'assurer que cela fonctionne vraiment ».", source: "https://www.foncier-developpement.fr/wp-content/uploads/Cadre-juridique-TOGO_Version-finale.pdf"}
chronologie:
  - {annee: 1926, evenement: "Décret du 13 mars 1926 posant le principe du respect des terroirs villageois sous mandat français."}
  - {annee: 1974, evenement: "Ordonnance n° 12 portant réforme agro-foncière : garantie de la propriété à toute personne ou collectivité se prévalant d'un droit coutumier sur les terres exploitées (art. 2), avec un délai de cinq ans pour la confirmation des droits."}
  - {annee: 1992, evenement: "Constitution : reconnaissance de la chefferie traditionnelle (art. 143)."}
  - {annee: 2024, evenement: "Nouvelle Constitution (régime parlementaire) : la reconnaissance de la chefferie traditionnelle est maintenue (art. 88)."}
  - {annee: 2007, evenement: "Loi n° 2007-002 du 8 janvier relative à la chefferie traditionnelle : pouvoir d'arbitrage et de conciliation en matière coutumière (art. 20)."}
  - {annee: 2018, evenement: "Loi n° 2018-005 du 14 juin portant Code foncier et domanial : constatation des droits coutumiers, registre spécial communal, conventions locales ; abrogation du décret de 1906 sur la propriété foncière en Afrique occidentale française (art. 722)."}
  - {annee: 2019, evenement: "Loi n° 2019-006 du 26 juin modifiant la loi n° 2007-011 relative à la décentralisation ; en juin, premières élections municipales depuis 32 ans."}
fiabilite:
  verifie: ["Texte des art. 6 à 8, 29 à 31, 588 à 600, 624 à 660, 673 à 678 et 719 à 724 du Code foncier et domanial (version droit-afrique.com diffusée par FAOLEX).", "Rédaction de l'art. 640, al. 2, telle que relevée par l'analyse du Comité technique « Foncier & développement » (2023) et constatée dans le texte.", "Art. 3, 4, 8 à 10 et 20 de la loi n° 2007-002 et art. 143 de la Constitution de 1992, cités dans l'analyse du Comité technique « Foncier & développement » (2023).", "Art. 88 de la Constitution de 2024 (traduction anglaise du Constitute Project)."]
  non_confirme: ["Texte officiel de la loi n° 2007-002 sur la chefferie traditionnelle : non consulté directement.", "Maintien en vigueur de la loi n° 2007-002 après la Constitution de 2024, qui renvoie à la loi le statut du chef traditionnel (art. 88) : non vérifié.", "Adoption des décrets d'application relatifs aux commissions de gestion foncière et aux sections villageoises (art. 29 à 31) : non vérifiée.", "Nombre de terres inscrites au registre spécial et surface concernée : aucune source publique trouvée, d'où l'absence de tableau des sites.", "Aucun document onusien ou régional visant nommément ce régime n'a été trouvé ; le cinquième rapport national du Togo à la Convention sur la diversité biologique (2014) mentionne seulement l'élaboration du Code foncier."]
