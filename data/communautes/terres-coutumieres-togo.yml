base_nationale:
  - {instrument: "Loi n° 2018-005 du 14 juin 2018 portant Code foncier et domanial, art. 6 à 8, 29 à 31, 588 à 600, 624 à 660 et 673 à 678", nature: "loi", annee: 2018, source: "https://faolex.fao.org/docs/pdf/Tog182170.pdf"}
  - {instrument: "Loi n° 2007-002 du 8 janvier 2007 relative à la chefferie traditionnelle et au statut des chefs traditionnels, art. 3, 4, 8 à 10 et 20", nature: "loi", annee: 2007, source: "https://www.foncier-developpement.fr/wp-content/uploads/Cadre-juridique-TOGO_Version-finale.pdf"}
  - {instrument: "Constitution de 2024, art. 88 (chefferie traditionnelle)", nature: "constitution", annee: 2024, source: "https://www.constituteproject.org/constitution/Togo_2024"}
droits:
  autogouvernement: {valeur: "partiel", note: "La République reconnaît la chefferie traditionnelle, gardienne des us et coutumes, dont la désignation et l'intronisation suivent les coutumes de la localité et les textes en vigueur (Constitution de 2024, art. 88, qui reprend l'art. 143 de la Constitution de 1992 ; loi n° 2007-002, art. 3, 4 et 10) ; le chef est placé à la tête du canton, du village ou du quartier. Lors de la constatation des droits coutumiers, le maire prévient les chefs et les notables du lieu, et le chef est invité à signer le procès-verbal (art. 630 du Code foncier). La gestion foncière communale repose sur une commission consultative et, en milieu rural, sur des sections villageoises de gestion foncière (art. 29 à 31). Aucune institution propre aux détenteurs de terres coutumières n'est créée.", source: "https://www.foncier-developpement.fr/wp-content/uploads/Cadre-juridique-TOGO_Version-finale.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les membres d'une communauté gestionnaire peuvent adopter une convention locale qui fixe les règles d'accès et d'utilisation des ressources naturelles ; elle est approuvée selon les règles coutumières de la communauté, à défaut par un vote (art. 593 et 594 du Code foncier), puis visée par le maire et devient alors obligatoire pour les membres et opposable aux tiers (art. 597 à 600). Les titulaires d'un droit d'usage exercent leurs prérogatives conformément aux règles et pratiques locales (art. 645), et la délégation de droits d'usage est régie par la coutume et les usages (art. 651).", source: "https://faolex.fao.org/docs/pdf/Tog182170.pdf"}
  justice_propre: {valeur: "partiel", note: "La saisine d'un tribunal pour un différend sur l'accès aux terres rurales ou aux ressources naturelles doit être précédée d'une tentative de règlement amiable auprès d'une autorité traditionnelle territorialement compétente, consignée dans un procès-verbal (art. 675 à 678 du Code foncier). Le chef traditionnel dispose d'un pouvoir d'arbitrage et de conciliation en matière coutumière (loi n° 2007-002, art. 20). Les tribunaux de première instance sont seuls compétents pour les litiges nés de la constatation des droits coutumiers (art. 638 du Code foncier).", source: "https://faolex.fao.org/docs/pdf/Tog182170.pdf"}
  terres: {valeur: "partiel", note: "L'État garantit le droit de propriété des personnes physiques et des collectivités acquis suivant les règles coutumières (art. 6) ; les terres rurales comprennent celles des collectivités familiales (art. 625). L'inscription au registre spécial établit la propriété (art. 640, al. 1), et nul ne peut être contraint de céder une terre de tenure coutumière, sauf pour des politiques de développement ou pour cause d'utilité publique, contre une juste et préalable indemnité (art. 646). Limites : l'État « peut les attribuer aux collectivités territoriales » (art. 640, al. 2, sans précision sur l'objet) ; toute acquisition à titre onéreux ou par donation exige l'approbation préalable du conseil communal (art. 648) ; l'Agence nationale du domaine et du foncier dispose d'un droit de préemption (priorité d'achat) sur toute transaction (art. 650) ; une terre non mise en valeur pendant cinq ans peut être confiée à un tiers (art. 658 et 659).", source: "https://faolex.fao.org/docs/pdf/Tog182170.pdf"}
  ressources: {valeur: "partiel", note: "La convention locale permet à une communauté gestionnaire de fixer les règles d'accès aux ressources naturelles en vue de leur conservation et de leur exploitation durable (art. 588 et 593 du Code foncier). Les forêts protégées et classées, les aires fauniques, les espaces pastoraux, les ressources minières et l'eau restent soumis à leurs lois spéciales (art. 624, al. 3).", source: "https://faolex.fao.org/docs/pdf/Tog182170.pdf"}
  consentement: {valeur: "partiel", note: "Les personnes physiques, les collectivités familiales et les personnes morales de droit privé ont le droit de participer à la définition des règles de gestion des terres rurales, fixées par arrêté communal après consultation des populations (art. 626 du Code foncier). La consultation de la section villageoise de gestion foncière est requise, à peine de nullité, pour tout transfert de droit d'usage sur une terre coutumière, dans les localités où une section existe déjà (art. 651). L'expropriation pour cause d'utilité publique ne requiert pas le consentement du détenteur (art. 7 et 646).", source: "https://faolex.fao.org/docs/pdf/Tog182170.pdf"}
