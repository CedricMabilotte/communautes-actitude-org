resume: >-
  Fiche agrégée : elle couvre les détenteurs de terres rurales de tenure foncière coutumière (terres détenues selon les règles non écrites de la coutume) au Togo, dont les collectivités familiales. Le Code foncier et domanial (loi n° 2018-005 du 14 juin 2018) garantit le droit de propriété des personnes et des collectivités acquis suivant les règles coutumières (art. 6) et ouvre aux détenteurs une procédure de constatation (reconnaissance officielle) de leurs droits devant le maire (art. 628 à 639). L'inscription au registre spécial tenu dans chaque commune établit la propriété (art. 640). Le même Code permet aux communautés gestionnaires d'adopter des conventions locales sur l'accès aux ressources naturelles (art. 588 à 600) et impose une tentative de règlement amiable devant une autorité traditionnelle avant tout procès sur les terres rurales (art. 675).
