resume: >-
  La Constitution équatorienne de 2008 fait de la province de Galápagos un régime spécial (art. 242) doté d'un Conseil de gouvernement chargé de la planification, de la gestion des ressources et de l'organisation des activités dans l'archipel (art. 258). Pour protéger l'archipel, le même article limite les droits de migration interne, de travail et d'activité, et donne aux résidents permanents touchés par ces limites un accès préférentiel aux ressources naturelles. La loi organique (loi adoptée à la majorité absolue de l'Assemblée nationale, supérieure aux lois ordinaires, Constitution, art. 133) du régime spécial de la province de Galápagos (Registre officiel, 2e supplément n° 520, 11 juin 2015) fixe les catégories de résidence, réserve la pêche artisanale aux résidents permanents et remplace la loi spéciale de 1998. Le Conseil réunit le représentant du président de la République, trois ministres et le responsable de l'organe national de planification ou leurs délégués, les trois maires et un représentant des conseils de paroisse rurale.
