base_nationale:
  - {instrument: "Constitution de la République de l'Équateur (2008), art. 242 et 258, disposition transitoire 15", nature: "constitution", annee: 2008, source: "https://www.asambleanacional.gob.ec/sites/default/files/documents/old/constitucion_de_bolsillo.pdf"}
  - {instrument: "Loi organique du régime spécial de la province de Galápagos (LOREG), Registre officiel, 2e supplément n° 520, 11 juin 2015", nature: "loi_organique", annee: 2015, source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  - {instrument: "Ordonnance provinciale n° 001-CGREG-V-V-2017 du 9 mai 2017 portant règlement de migration et de résidence du régime spécial (citée par la résolution CGREG-ST-2025-0304-R)", nature: "loi", annee: 2017, source: "https://www.gobiernogalapagos.gob.ec/wp-content/uploads/downloads/2025/10/CGREG-ST-2025-0304-R.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseil de gouvernement doté de la personnalité juridique et de l'autonomie technique, administrative et financière (LOREG 2015, art. 4) ; son assemblée plénière compte le représentant du président de la République, qui la préside avec voix prépondérante, quatre membres de l'exécutif national, les trois maires des cantons et un représentant des présidents de conseils de paroisse rurale (art. 10 ; Constitution, art. 258) : les élus locaux y sont minoritaires.", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée plénière adopte des ordonnances provinciales, accords et résolutions dans le champ de ses compétences : aménagement du territoire, usage du sol, transports, entrée des véhicules et des biens, contrôle des flux migratoires et de la résidence (LOREG 2015, art. 5 et 11) ; ces normes restent subordonnées à la loi et aux politiques des autorités nationales.", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le Conseil fixe les orientations d'usage et de gestion du sol et le plan de développement durable et d'aménagement du territoire, hors aires protégées (LOREG 2015, art. 5.1, 5.2 et 11.4) ; le Parc national (97 % des terres émergées) et la Réserve marine relèvent de l'autorité environnementale nationale (art. 17 et 20).", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  ressources: {valeur: "partiel", note: "Accès préférentiel des résidents permanents aux ressources naturelles (Constitution, art. 258 ; LOREG 2015, art. 3.7) ; seule la pêche artisanale commerciale est permise dans la Réserve marine et elle est réservée aux résidents permanents (art. 58 et 59) ; permis d'opération touristique accordés de préférence aux résidents permanents (art. 64 à 66) ; l'autorité environnementale nationale fixe le calendrier de pêche, les espèces et les volumes (art. 58).", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  consentement: {valeur: "partiel", note: "Un conseil consultatif de gestion participative donne des avis non contraignants (« asesoramiento no vinculante ») sur la gestion de la Réserve marine (LOREG 2015, art. 22) ; les autorités aéronautique et maritime doivent obtenir un rapport technique favorable de l'assemblée plénière avant d'accorder autorisations, routes et fréquences de transport aérien et maritime de fret vers l'archipel (disposition générale 6).", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'assemblée plénière adopte le budget du Conseil (LOREG 2015, art. 11.5) et fixe par ordonnance des taxes et contributions, dont la taxe d'entrée et de conservation des aires protégées (art. 27 à 29) ; les ressources propres ne peuvent être inférieures aux crédits de l'ancien conseil provincial et de l'ancien Institut national Galápagos (disposition générale 12), et le budget dépend aussi du budget général de l'État (art. 6).", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Nul ne peut séjourner dans la province sans l'une des quatre catégories de la loi : résident permanent, résident temporaire, touriste, transitaire (LOREG 2015, art. 36 et 39) ; la résidence permanente, qui autorise à vivre et travailler sans limite de durée, s'acquiert par filiation ou après dix ans de mariage ou d'union de fait avec un résident permanent (art. 40) ; seuls les résidents permanents et les résidents temporaires présents depuis deux ans peuvent être inscrits sur les listes électorales de la province (art. 45).", source: "https://www.galapagos.gob.ec/wp-content/uploads/downloads/2017/01/Ley_organica_de_regimen_especial_de_la_provincia_de_galapagos_ro_2do_s_11_06_2015.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le contrôle de la résidence est appliqué : selon le quotidien El Universo (6 avril 2026), le Conseil de gouvernement a révoqué 45 résidences temporaires dans le canton de San Cristóbal après des visites de vérification des mariages et unions de fait prévues par le règlement de migration et de résidence (art. 8.6) et la LOREG (art. 41.1). Un mémoire de l'Université polytechnique salésienne (2026) soutient que certaines résolutions du Conseil sur le contrôle de la résidence doivent être revues au regard du droit constitutionnel à la mobilité.", source: "https://www.eluniverso.com/noticias/ecuador/45-residencias-temporales-revocadas-en-galapagos-por-vinculos-conyugales-dudosos-nota/"}
chronologie:
  - {annee: 1959, evenement: "Décret exécutif n° 17 du 4 juillet : création du Parc national Galápagos sur 97 % des terres émergées."}
  - {annee: 1986, evenement: "Déclaration d'une réserve de ressources marines autour de l'archipel."}
  - {annee: 1998, evenement: "Loi organique spéciale pour la conservation et le développement durable de la province de Galápagos (Registre officiel n° 278, 18 mars) : contrôle de la résidence et création de la Réserve marine."}
  - {annee: 2008, evenement: "Nouvelle Constitution : régime spécial (art. 242 et 258) et Conseil de gouvernement, qui reprend l'ancien conseil provincial et l'Institut national Galápagos (disposition transitoire 15)."}
  - {annee: 2015, evenement: "Loi organique du régime spécial de la province de Galápagos (11 juin), qui abroge la loi de 1998."}
  - {annee: 2017, evenement: "Ordonnance provinciale n° 001-CGREG-V-V-2017 (9 mai) portant règlement de migration et de résidence."}
  - {annee: 2025, evenement: "Résolution CGREG-ST-2025-0304-R (7 août) révisant les procédures de demande des catégories migratoires."}
fiabilite:
  verifie: ["Texte de la LOREG publié au Registre officiel (2e supplément n° 520, 11 juin 2015) : art. 1 à 14, 16 à 31, 35 à 46, 56 à 66, dispositions générales, transitoires, réformatrices et abrogatoires, dont l'abrogation de la loi publiée au Registre officiel n° 278 du 18 mars 1998.", "Constitution de 2008, art. 118, 242 et 258 et disposition transitoire 15, édition de l'Assemblée nationale.", "Population de 28 583 habitants au recensement de 2022, fiche provinciale de l'INEC.", "Répartition en 3 cantons et 8 paroisses, présentation du recensement de Galápagos 2015 (INEC), qui compte 25 244 résidents habituels.", "Dates de création du Parc national (1959), de la réserve de ressources marines (1986) et de la Réserve marine (1998), et superficie de 143 000 km² de la Réserve marine, pages de la Direction du Parc national Galápagos.", "Ordonnance n° 001-CGREG-V-V-2017 et ses articles cités, d'après les considérants de la résolution CGREG-ST-2025-0304-R.", "Chiffres de résidence de 2025 publiés par le Conseil de gouvernement (rapport de reddition des comptes 2025) : 718 résidences permanentes approuvées et 24 refusées, 7 823 résidences temporaires approuvées et 626 refusées ; sept sessions de l'assemblée plénière.", "Révocation de 45 résidences temporaires à San Cristóbal, El Universo, 6 avril 2026."]
  non_confirme: ["Superficie des terres émergées de la province : 8 010 km² selon l'encyclopédie Wikipédia ; aucune source officielle consultée.", "Nombre de cartes de résidence délivrées en 2025 : le rapport de reddition des comptes du Conseil donne 7 019 dans un passage et 7 933 dans un autre.", "Nombre de villages ou de localités habitées : non trouvé dans une source officielle (le recensement de 2015 compte 8 paroisses, ce qui n'équivaut pas à des villages).", "Texte du règlement général d'application de la LOREG et de l'ordonnance de 2017 : non lus directement.", "Règles de composition du conseil consultatif de gestion participative de la Réserve marine : non consultées.", "Inscription de l'archipel sur la Liste du patrimoine mondial en péril de l'UNESCO de 2007 à 2010 : lue dans un résumé de la page de l'UNESCO, page elle-même inaccessible en accès direct ; aucun document des mécanismes onusiens de la liste du cadre ne vise ce régime."]
