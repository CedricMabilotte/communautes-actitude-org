resume: >-
  La Constitution slovène de 1991 reconnaît la communauté nationale italienne comme communauté autochtone, avec la communauté hongroise. Elle vit sur la côte de l'Istrie slovène, dans les communes de Koper, Izola, Piran et Ankaran. L'article 64 de la Constitution garantit l'éducation dans sa langue, la création de communautés nationales autogérées et un député à l'Assemblée nationale. Chaque commune bilingue a une communauté autogérée de nationalité italienne, coordonnées par la Communauté autogérée côtière (CAN Costiera) de Koper. La communauté italienne de Croatie relève d'un autre régime (fiche « Communauté nationale italienne de Croatie »).
