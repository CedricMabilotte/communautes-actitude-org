resume: >-
  La Constitution slovène de 1991 reconnaît la communauté nationale italienne comme communauté autochtone, avec la communauté hongroise. Elle vit sur la côte de l'Istrie slovène, dans les communes de Koper, Izola, Piran et Ankaran. L'article 64 de la Constitution garantit l'éducation dans sa langue, la création de communautés nationales autogérées et un député à l'Assemblée nationale. Chaque commune bilingue a une communauté autogérée de nationalité italienne, coordonnées par la Communauté autogérée côtière (CAN Costiera) de Koper. La communauté hongroise relève du même régime constitutionnel (fiche « Communauté nationale hongroise de Slovénie ») ; la communauté italienne de Croatie relève d'un autre régime (fiche « Communauté nationale italienne de Croatie »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Slovénie, adopté le 18 mai 2022 : les minorités hongroise et italienne « continuent de bénéficier d'une protection juridique complète » (§ 48) ; crédits de 356 191 € pour le programme culturel italien en 2021 (§ 75).", annee: 2022, source: "https://rm.coe.int/5th-op-slovenia-fr/1680a830d9"}
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale sur la Slovénie (CERD/C/SVN/CO/8-11), § 10 : le Comité distingue les minorités italienne et hongroise, représentées au Parlement, des autres minorités.", annee: 2016, source: "https://documents.un.org/doc/undoc/gen/g16/003/44/pdf/g1600344.pdf"}
base_nationale:
  - {instrument: "Constitution de la République de Slovénie (1991), art. 5, 11, 64 et 80", nature: "constitution", annee: 1991, source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  - {instrument: "Loi sur les communautés nationales autogérées (1994)", nature: "loi", annee: 1994, source: "https://www.culturalpolicies.net/country_profile/slovenia-2-6/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les membres de la communauté créent des communautés autogérées dans leur aire d'implantation ; l'État peut leur confier des fonctions et les finance, Constitution, art. 64, al. 2 ; loi de 1994 sur les communautés nationales autogérées.", source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Les lois et actes qui concernent exclusivement l'exercice des droits constitutionnels et la situation des communautés nationales ne peuvent être adoptés sans le consentement de leurs représentants, Constitution, art. 64, dernier alinéa.", source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  langue: {valeur: "reconnu", note: "L'italien est langue officielle dans les communes où vit la communauté italienne, Constitution, art. 11.", source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  education: {valeur: "reconnu", note: "Droit à l'éducation et à la scolarité dans sa langue et à créer des établissements, Constitution, art. 64, al. 1.", source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  fiscalite: {valeur: "partiel", note: "L'État apporte un soutien matériel à l'exercice des droits et finance les fonctions qu'il délègue aux communautés autogérées, Constitution, art. 64, al. 1 et 2 ; aucun pouvoir fiscal.", source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  representation: {valeur: "reconnu", note: "Un député de la communauté italienne est toujours élu à l'Assemblée nationale, Constitution, art. 80 ; représentation directe dans les conseils municipaux, art. 64, al. 3.", source: "https://www.constituteproject.org/constitution/Slovenia_2021"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité consultatif de la Convention-cadre du Conseil de l'Europe constate en 2022 que l'enseignement en italien est proposé à tous les niveaux et que les entités de droit public des communes concernées sont tenues de communiquer en italien sur demande (§ 123) ; il relève des lacunes dans la pratique et recommande de recruter davantage de fonctionnaires maîtrisant l'italien et le hongrois. Le siège réservé à la communauté italienne à l'Assemblée nationale a été pourvu aux élections du 22 mars 2026.", source: "https://rm.coe.int/5th-op-slovenia-fr/1680a830d9"}
