resume: >-
  L'Aboriginal Lands Trust (fiducie des terres aborigènes) d'Australie-Méridionale, créé par une loi de l'État de 1966 et maintenu par l'Aboriginal Lands Trust Act 2013, détient des terres pour le bénéfice continu des Aborigènes d'Australie-Méridionale. Il est composé de huit membres aborigènes et détient 65 titres fonciers, soit environ 5 420 km². Les terres sont inaliénables sauf résolution des deux chambres du Parlement ; le Trust les loue à des conseils communautaires, notamment ceux des neuf communautés désignées, anciennes missions et réserves. Le Trust autorise ou refuse les activités minières sur ses terres, sous réserve d'un arbitrage demandé par l'entreprise, et reçoit les deux tiers des redevances.
