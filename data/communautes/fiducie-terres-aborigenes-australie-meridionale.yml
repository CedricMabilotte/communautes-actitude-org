  - {instrument: "Aboriginal Lands Trust Act 1966 (Australie-Méridionale), abrogé", nature: "loi", annee: 1966, source: "https://alt.sa.gov.au/documents/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Trust compte huit membres aborigènes nommés par le gouverneur sur proposition du ministre, après recommandation d'un comité de sélection composé d'Aborigènes (loi de 2013, s. 11 et 12) ; les terres des communautés désignées sont louées à des conseils communautaires (registre des terres, s. 42). Le ministre peut adresser des directives au Trust et le suspendre en nommant un administrateur (s. 29 et 30).", source: "https://alt.sa.gov.au/wp-content/uploads/2025/11/ALT_Act_2013.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les terres du Trust sont inaliénables (loi de 2013, s. 43) ; leur cession en pleine propriété exige une résolution des deux chambres du Parlement (s. 44(2)). Le titre appartient au Trust ; les communautés détiennent des baux de longue durée, par exemple le conseil communautaire de Koonibba sur l'ensemble de la terre de Koonibba (registre, entrée 11).", source: "https://alt.sa.gov.au/wp-content/uploads/2025/11/ALT_Act_2013.pdf"}
  ressources: {valeur: "partiel", note: "Nul ne peut mener d'activité minière sur les terres du Trust sans sa permission (loi de 2013, s. 53) ; les deux tiers des redevances minières lui reviennent (s. 55), dont la moitié doit servir à la terre concernée ou à la communauté qui y vit (s. 21(3)), dans un plafond annuel fixé par règlement (s. 55(2)). En cas de refus du Trust, le demandeur peut obtenir du ministre des Mines la saisine d'un arbitre (s. 54).", source: "https://alt.sa.gov.au/wp-content/uploads/2025/11/ALT_Act_2013.pdf"}
  consentement: {valeur: "partiel", note: "Avant toute opération sur une terre ou toute décision sur une demande minière, le Trust consulte les détenteurs de liens traditionnels avec la terre, dont les titulaires du titre autochtone, les résidents et les autres intéressés (loi de 2013, s. 8, 44(5) et 53(4)) ; il s'agit d'une consultation, pas d'un consentement des communautés.", source: "https://alt.sa.gov.au/wp-content/uploads/2025/11/ALT_Act_2013.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le Trésorier verse au Trust une somme égale aux deux tiers des redevances minières perçues sur ses terres (loi de 2013, s. 55) ; toutes ses recettes vont au fonds du Trust (s. 21(1)), et la moitié des sommes issues des redevances doit servir à la terre concernée ou à la communauté qui y vit (s. 21(3)) ; aucun pouvoir fiscal.", source: "https://alt.sa.gov.au/wp-content/uploads/2025/11/ALT_Act_2013.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2021, le Trust a nommé un gestionnaire qui a remplacé le conseil communautaire de Davenport comme preneur à bail, en invoquant l'état des bâtiments et la gestion du conseil (ABC News, 8 juin 2021). Le rapport annuel 2024-2025 du Trust fait état de difficultés de gouvernance, d'un audit du vérificateur général sur les contrôles internes, d'un programme de révision des baux, de l'exclusion du Trust et de ses communautés du plan d'État Closing the Gap, et d'une proposition de SA Native Title Services (mai 2025) de dissoudre le Trust et de transférer ses terres aux titulaires du titre autochtone.", source: "https://www.abc.net.au/news/2021-06-08/aboriginal-lands-trust-davenport-community-council-housing/100199664"}
chronologie:
  - {annee: 1966, evenement: "Aboriginal Lands Trust Act 1966 : création du Trust, composé d'Aborigènes, qui reçoit des terres de la Couronne."}
  - {annee: 2013, evenement: "Adoption de l'Aboriginal Lands Trust Act 2013, qui remplace la loi de 1966."}
  - {annee: 2014, evenement: "Entrée en vigueur de la loi de 2013 (1er juillet)."}
  - {annee: 2021, evenement: "Le Trust nomme un gestionnaire des terres de Davenport à la place du conseil communautaire (juin)."}
  - {annee: 2025, evenement: "SA Native Title Services propose au ministre des Affaires aborigènes de dissoudre le Trust et de transférer ses terres aux titulaires du titre autochtone (mai)."}
