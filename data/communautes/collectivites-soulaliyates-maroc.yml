droits:
  autogouvernement: {valeur: "partiel", note: "Art. 9 de la loi n° 62-17 : chaque collectivité choisit parmi ses membres des représentants qui forment une assemblée des délégués, pour six ans renouvelables ; art. 32-33 : tutelle d'un conseil central présidé par le ministre de l'Intérieur et de conseils provinciaux présidés par les gouverneurs.", source: "https://adala.justice.gov.ma/api/uploads/2024/07/22/Dahir%20n%C2%B0%201%E2%80%9119%E2%80%91115%20portant%20promulgation%20de%20la%20loi%20n%C2%B0%2062%E2%80%9117%20relative%20%C3%A0%20la%20...-1721659890185.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Art. 4 de la loi n° 62-17 : les collectivités peuvent gérer leurs biens selon leurs us et coutumes, s'ils ne contredisent pas la loi.", source: "https://adala.justice.gov.ma/api/uploads/2024/07/22/Dahir%20n%C2%B0%201%E2%80%9119%E2%80%91115%20portant%20promulgation%20de%20la%20loi%20n%C2%B0%2062%E2%80%9117%20relative%20%C3%A0%20la%20...-1721659890185.pdf"}
  justice_propre: {valeur: "partiel", note: "Art. 8 de la loi n° 62-17 : l'assemblée des délégués entend le membre en cause et rend une décision motivée pouvant suspendre son droit de jouissance ; recours devant le conseil provincial de tutelle dans les quinze jours (art. 8 et 33).", source: "https://adala.justice.gov.ma/api/uploads/2024/07/22/Dahir%20n%C2%B0%201%E2%80%9119%E2%80%91115%20portant%20promulgation%20de%20la%20loi%20n%C2%B0%2062%E2%80%9117%20relative%20%C3%A0%20la%20...-1721659890185.pdf"}
  terres: {valeur: "partiel", note: "Art. 15 de la loi n° 62-17 : les biens des collectivités ne peuvent être acquis par possession ou prescription ni saisis, et ne sont cédés que selon la loi ; art. 6 : les membres n'ont qu'un droit d'exploitation personnelle et directe ; art. 2 : la loi s'applique aussi aux terres guich dont la nue-propriété a été transférée aux collectivités.", source: "https://adala.justice.gov.ma/api/uploads/2024/07/22/Dahir%20n%C2%B0%201%E2%80%9119%E2%80%91115%20portant%20promulgation%20de%20la%20loi%20n%C2%B0%2062%E2%80%9117%20relative%20%C3%A0%20la%20...-1721659890185.pdf"}
  ressources: {valeur: "partiel", note: "Art. 27 de la loi n° 62-17 : les ressources financières de la collectivité peuvent être distribuées à ses membres, hommes et femmes.", source: "https://adala.justice.gov.ma/api/uploads/2024/07/22/Dahir%20n%C2%B0%201%E2%80%9119%E2%80%91115%20portant%20promulgation%20de%20la%20loi%20n%C2%B0%2062%E2%80%9117%20relative%20%C3%A0%20la%20...-1721659890185.pdf"}
