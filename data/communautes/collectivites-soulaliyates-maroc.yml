resume: >-
  Les collectivités soulaliyates (ou « collectivités ethniques ») sont des groupements qui détiennent en commun des terres au Maroc, sous la tutelle du ministère de l'Intérieur.
  La loi n° 62-17 de 2019 fixe leur organisation : une assemblée de délégués élus répartit la jouissance des biens entre les membres, hommes et femmes, qui n'ont qu'un droit d'exploitation personnelle.
  Les biens collectifs ne peuvent être acquis par prescription ni saisis, et ne sont cédés que dans les cas prévus par la loi.
