base_nationale:
  - {instrument: "Loi n° 62-17 relative à la tutelle administrative sur les collectivités ethniques (soulaliyates) et la gestion de leurs biens, promulguée par le dahir n° 1-19-115 du 9 août 2019 (texte arabe au Bulletin officiel n° 6807 du 26 août 2019 ; traduction officielle française au Bulletin officiel n° 7258 du 21 décembre 2023)", nature: "loi", annee: 2019, source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Art. 9 et 10 de la loi n° 62-17 : chaque collectivité choisit parmi ses membres, hommes et femmes, par élection ou par consensus, des délégués (naïbs) qui forment une assemblée des délégués, pour six ans renouvelables une fois ; à défaut, le gouverneur les nomme. Art. 13 et 14 : le gouverneur peut déchoir un délégué par arrêté motivé. Art. 30 à 33 : tutelle du ministre de l'Intérieur, d'un conseil de tutelle central et de conseils provinciaux présidés par les gouverneurs.", source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Art. 4 de la loi n° 62-17 : les collectivités peuvent gérer leurs biens selon leurs us et coutumes s'ils ne contredisent pas les textes législatifs et réglementaires, sous la tutelle de l'État.", source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
  justice_propre: {valeur: "partiel", note: "Art. 8 de la loi n° 62-17 : après mise en demeure de l'autorité locale, l'assemblée des délégués entend le membre en cause et peut, par décision motivée, le priver du droit de jouissance (usufruit) pour un an au plus ; recours devant le conseil de tutelle provincial dans les quinze jours. Art. 33 : ce conseil, présidé par le gouverneur, statue sur les litiges entre collectivités et entre une collectivité et ses membres.", source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
  terres: {valeur: "partiel", note: "Art. 15 de la loi n° 62-17 : les biens des collectivités ne peuvent être acquis par possession ou prescription ni saisis, et ne sont cédés que selon la loi ; ils restent expropriables pour cause d'utilité publique. Art. 6 et 16 : les membres n'ont qu'un droit de jouissance personnel, réparti par l'assemblée des délégués. Art. 17 : les terres agricoles hors périmètres irrigués peuvent être attribuées aux membres en propriété privée. Art. 20 : cessions à l'État, aux établissements publics ou à des opérateurs privés après approbation du conseil de tutelle central. Art. 2 : la loi s'applique aussi aux terres guich (terres concédées à des groupes en échange d'un service militaire) dont la nue-propriété a été transférée aux collectivités.", source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
  ressources: {valeur: "partiel", note: "Art. 21 et 23 de la loi n° 62-17 : les produits forestiers et récoltes sont vendus par appel à la concurrence et l'autorité de tutelle gère les ressources financières en coordination avec les assemblées des délégués ; art. 27 : ces ressources peuvent être distribuées aux membres, hommes et femmes, à la demande de l'assemblée des délégués et après approbation du conseil de tutelle central.", source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "Les collectivités soulaliyates sont des groupements fonciers, pas des communautés linguistiques.", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Art. 6 de la loi n° 62-17 : la qualité de membre, ouverte aux hommes et aux femmes, donne droit à la jouissance des biens selon la répartition de l'assemblée des délégués ; art. 33 : la liste des membres, établie par l'assemblée des délégués, est approuvée par le conseil de tutelle provincial.", source: "https://www.sgg.gov.ma/BO/FR/2873/2023/BO_7258_Fr.pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "Sans objet pour des groupements fonciers.", source: ""}
effectivite: {valeur: "partielle", note: "Une enquête de terrain menée de décembre 2022 à avril 2023 dans quatre collectivités du Gharb (Hind Ftouhi, INAU Rabat, 2024) constate un décalage entre la loi n° 62-17 et son application : des femmes membres n'obtiennent pas leur part de jouissance, et une collectivité compte 1 200 ayants droit pour 60 hectares restant à partager. En janvier 2024, selon le ministre de l'Intérieur, 17 des 7 731 délégués sont des femmes et 5,1 millions d'hectares sont immatriculés au registre foncier.", source: "https://research.lcieducation.com/sites/default/files/2024-collectif-MAi-08-web%20hind%20ftouhi.pdf"}
chronologie:
  - {annee: 1919, evenement: "Dahir du 27 avril organisant la tutelle administrative des collectivités ethniques, abrogé en 2019."}
  - {annee: 2019, evenement: "Dahir du 9 août promulguant la loi n° 62-17 et la loi n° 63-17 sur la délimitation administrative des terres collectives."}
  - {annee: 2022, evenement: "La Cour de cassation juge contraire à l'égalité entre les sexes la coutume qui prive les filles de la jouissance des terres collectives."}
  - {annee: 2023, evenement: "Traduction officielle française de la loi n° 62-17 au Bulletin officiel n° 7258 du 21 décembre."}
  - {annee: 2024, evenement: "Bilan du ministre de l'Intérieur devant la Chambre des représentants : 4 908 collectivités, 76 % recensées, 15,6 millions d'hectares."}
  - {annee: 2025, evenement: "Circulaire du ministre de l'Intérieur interdisant aux services communaux de légaliser les signatures de contrats portant sur des terres collectives occupées sans droit ; plus de 138 000 hectares occupés recensés."}
