resume: >-
  Aceh est une province de l'extrémité nord de Sumatra. Le mémorandum d'entente signé à Helsinki le 15 août 2005 entre le gouvernement indonésien et le Mouvement pour un Aceh libre (GAM) met fin au conflit armé. La loi 11/2006 sur le gouvernement d'Aceh (UUPA) donne à la province un parlement qui adopte des qanun (lois locales), des partis politiques locaux, des tribunaux islamiques et une part accrue des recettes pétrolières et gazières. Le texte vise « la population d'Aceh » et reconnaît une direction coutumière, le Wali Nanggroe. Les forêts et territoires coutumiers d'Aceh reconnus au titre des régimes nationaux figurent aussi dans les fiches « Forêts coutumières d'Indonésie » et « Territoires coutumiers d'Indonésie ».
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, CCPR/C/IDN/CO/2, § 10 et 26 : victimes identifiées par la Commission vérité et réconciliation d'Aceh, peines de flagellation prévues par la loi spéciale sur l'autonomie d'Aceh", annee: 2024, source: "https://docs.un.org/fr/CCPR/C/IDN/CO/2"}
base_nationale:
  - {instrument: "Mémorandum d'entente entre le gouvernement de la République d'Indonésie et le Mouvement pour un Aceh libre (Helsinki)", nature: "accord_paix", annee: 2005, source: "http://acehpeaceprocess.net/pdf/mou_final.pdf"}
  - {instrument: "Loi n° 11 de 2006 sur le gouvernement d'Aceh (Undang-Undang Nomor 11 Tahun 2006 tentang Pemerintahan Aceh)", nature: "statut_autonomie", annee: 2006, source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Gouvernement et parlement d'Aceh (DPRA) compétents dans tous les secteurs publics sauf ceux réservés à l'État, loi 11/2006, art. 7 et 23 ; partis politiques locaux autorisés, art. 75.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Le DPRA adopte avec le gouverneur les qanun d'Aceh, loi 11/2006, art. 23 (1) (a) ; la charia (droit islamique) en matière familiale, civile et pénale est mise en œuvre par qanun, art. 125 ; le qanun est un texte « de même nature qu'un règlement régional de province » (art. 1, point 21) et le gouvernement central peut annuler un qanun contraire à l'intérêt général ou aux textes de rang supérieur, sauf les qanun sur la charia, que seule la Cour suprême peut annuler (art. 235), d'où « partiel ».", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  justice_propre: {valeur: "partiel", note: "Tribunaux islamiques (Mahkamah Syar'iyah) compétents pour les musulmans d'Aceh en droit de la famille, droit civil et droit pénal, qui font partie du système judiciaire national dans l'ordre des juridictions religieuses, loi 11/2006, art. 128 ; règlement coutumier des différends sociaux par les institutions adat (coutumières), art. 98. Juridiction intégrée à l'ordre judiciaire national, d'où « partiel ».", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  terres: {valeur: "partiel", note: "Le gouvernement d'Aceh et les districts règlent l'affectation et l'usage des terres en reconnaissant les droits existants, y compris les droits adat (coutumiers), selon les normes, standards et procédures nationaux, loi 11/2006, art. 213 (2) et (3).", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  ressources: {valeur: "partiel", note: "Gestion conjointe du pétrole et du gaz par l'État et Aceh, contrats soumis à l'accord des deux, loi 11/2006, art. 160 ; 80 % des recettes forestières, halieutiques et minières générales, et part additionnelle de 55 % (pétrole) et 40 % (gaz), art. 181.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  consentement: {valeur: "partiel", note: "Les accords internationaux et les lois nationales qui concernent directement Aceh sont préparés « avec la consultation et l'avis » du DPRA, loi 11/2006, art. 8 ; le mémorandum de 2005 prévoyait son consentement (§ 1.1.2).", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'éducation en Aceh fait partie du système national, adaptée aux caractéristiques locales, loi 11/2006, art. 215 ; Aceh et les districts fixent le programme de base et les normes de qualité de l'enseignement formel et de l'enseignement religieux (dayah), art. 218 (1) ; langues régionales enseignées comme contenu local, art. 221 (4).", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  fiscalite: {valeur: "partiel", note: "Fonds d'autonomie spéciale égal à 2 % du fonds général national d'allocation pendant quinze ans puis 1 % jusqu'à la vingtième année, loi 11/2006, art. 183 (versé depuis 2008, il passe à 1 % en 2023 et prend fin en 2027 si la loi n'est pas modifiée) ; parts de 90 % de la taxe foncière et de 80 % des droits de mutation, art. 181 ; il s'agit d'une dotation et d'impôts cédés fixés par la loi de l'État, sans système fiscal propre, d'où « partiel ».", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Tout musulman d'Aceh est tenu d'observer la charia, loi 11/2006, art. 126 ; le droit de la famille (ahwal al-syakhsiyah) relève des tribunaux islamiques, art. 128.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2006/11TAHUN2006UU.htm"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Conciliation Resources (Bernhard May, 2008) relève que la loi remplace le consentement prévu par le mémorandum par une simple consultation et élargit les compétences de l'État ; en 2024, le Comité des droits de l'homme note que les 5 195 victimes identifiées par la Commission vérité et réconciliation d'Aceh n'ont pas de recours utile. Le fonds d'autonomie spéciale arrive à échéance en 2027 ; le 8 septembre 2026, l'Assemblée nationale (DPR) adopte comme proposition de loi un projet de révision de la loi 11/2006 qui le porte à 2,5 % du fonds général d'allocation, encore à discuter avec le gouvernement.", source: "https://www.c-r.org/accord/aceh-indonesia/law-governing-aceh-way-forward-or-source-conflicts"}
chronologie:
  - {annee: 2005, evenement: "Mémorandum d'entente d'Helsinki signé le 15 août ; mission de surveillance de l'Union européenne et de pays de l'ASEAN."}
  - {annee: 2006, evenement: "Loi 11/2006 sur le gouvernement d'Aceh."}
  - {annee: 2024, evenement: "Observations du Comité des droits de l'homme sur les victimes du conflit et les peines de flagellation."}
  - {annee: 2025, evenement: "Le 17 juin, le président tranche que les îles Panjang, Lipan, Mangkir Gadang et Mangkir Ketek relèvent d'Aceh, après un décret ministériel du 25 avril (n° 300.2.2-2138) qui les rattachait à Sumatra du Nord."}
  - {annee: 2026, evenement: "Le 8 septembre, le DPR adopte comme proposition de loi la révision de la loi 11/2006 (fonds d'autonomie spéciale porté à 2,5 % du fonds général d'allocation) ; texte en attente de discussion avec le gouvernement."}
