resume: >-
  L'Accord d'Arusha pour la paix et la réconciliation au Burundi, signé le 28 août 2000, a fondé un partage du pouvoir entre les composantes hutu et tutsi de la population.
  La Constitution de 2018, qui révise celle de 2005, attribue aux Tutsi 40 % des sièges de l'Assemblée nationale, avec cooptation si le scrutin ne donne pas cette proportion, et au plus 40 % des ministres et des magistrats ; elle impose au Sénat deux délégués par province issus de communautés ethniques différentes et plafonne à 50 % la part d'une même ethnie dans les corps de défense et de sécurité.
  Le régime ne donne aux Batutsi ni institution propre ni territoire : il porte sur leur représentation dans les institutions de l'État.
  L'article 289 charge le Sénat d'évaluer, dans un délai de cinq ans, s'il faut mettre fin aux quotas ethniques ou les maintenir.
