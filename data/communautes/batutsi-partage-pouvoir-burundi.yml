  representation: {valeur: "reconnu", note: "Constitution de 2018 : Assemblée nationale d'au moins 100 députés « à raison de 60 % de Hutu et de 40 % de Tutsi », avec cooptation (désignation complémentaire de membres) si le scrutin ne donne pas ces proportions (art. 169) ; listes où deux candidats sur trois au plus sont de la même ethnie (art. 173) ; au Sénat, deux délégués par province issus de communautés ethniques différentes (art. 185) ; au plus 40 % de ministres tutsi (art. 128) et de magistrats tutsi (art. 213) ; président et vice-président d'ethnies différentes (art. 124) ; au plus 50 % de membres d'une même ethnie dans les corps de défense et de sécurité, pendant une période fixée par le Sénat (art. 263) ; 60 % de Hutu et 40 % de Tutsi dans les entreprises publiques (art. 148) ; au plus 67 % d'administrateurs communaux d'une même ethnie au niveau national (art. 273).", source: "https://www.constituteproject.org/constitution/Burundi_2018?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le CERD se dit préoccupé par des informations selon lesquelles les quotas « n'auraient été que partiellement appliqués, notamment au sein de l'administration publique », et par l'absence de mécanisme transparent pour en suivre le respect (CERD/C/BDI/CO/11-19, § 27, 2025) ; une analyse publiée par ConstitutionNet (International IDEA) le 4 septembre 2023 relève que les quotas n'ont pas empêché la concentration du pouvoir au sein du parti au pouvoir, le CNDD-FDD.", source: "https://documents.un.org/api/symbol/access?s=CERD/C/BDI/CO/11-19&l=fr&t=pdf"}
chronologie:
  - {annee: 2000, evenement: "Signature de l'Accord d'Arusha pour la paix et la réconciliation au Burundi, le 28 août."}
  - {annee: 2004, evenement: "Résolution 1545 du Conseil de sécurité (21 mai) : création de l'ONUB pour appuyer la mise en œuvre de l'Accord d'Arusha."}
  - {annee: 2005, evenement: "Constitution adoptée par référendum le 28 février et promulguée le 18 mars : quotas ethniques dans les institutions."}
  - {annee: 2018, evenement: "Constitution révisée par référendum le 17 mai : maintien des quotas (art. 128, 169, 185, 213) et délai de cinq ans donné au Sénat pour les évaluer (art. 289)."}
  - {annee: 2023, evenement: "Ouverture par le Sénat, le 31 juillet, de l'évaluation des quotas ethniques, avec un délai de deux ans pour remettre son rapport."}
  - {annee: 2025, evenement: "Observations finales du CERD sur le Burundi (décembre) : application partielle des quotas hutu et tutsi."}
