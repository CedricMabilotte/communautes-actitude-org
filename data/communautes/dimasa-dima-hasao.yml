  verifie: ["Texte de la Sixième annexe, dont les paragraphes 3A et 12 et la clause de dénomination du conseil (édition officielle, 2024).", "Superficie, population et nombre de villages cadastraux (portail du district) ; 676 villages habités sur 695 et 151 843 membres des tribus répertoriées (70,92 %) en 2011 (étude de l'université de Delhi d'après le recensement).", "Création du conseil en 1952 et composition de 30 membres dont 28 élus (site du conseil).", "Clauses principales de l'accord de 2023 (communiqué du gouvernement indien).", "Élection du 8 janvier 2024 et attribution de terres de 2024 (presse)."]
