resume: >-
  Le district de Dima Hasao, au sud de l'Assam, est un district autonome de la Sixième annexe de la Constitution, dont le conseil existe depuis 1952 ; les Dimasa y forment le groupe principal parmi treize groupes tribaux. Le conseil, nommé North Cachar Hills Autonomous Council dans la Sixième annexe, dispose depuis 1995 de quinze domaines législatifs supplémentaires ; une notification du 18 mai 2026 l'a renommé Dima Hasao Autonomous Council. Le mémorandum d'accord du 27 avril 2023 avec le Dimasa National Liberation Army prévoit un conseil de bien-être pour les Dimasa hors du district et l'examen de l'extension du territoire du conseil.
