droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, Sixième annexe (régime des districts tribaux autonomes), paragraphe 2 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 et, en Assam, sur quinze domaines supplémentaires (industrie, éducation primaire et secondaire, agriculture, eau, santé, cession des terres…), paragraphe 3A inséré en 1995 ; ses lois requièrent l'assentiment du gouverneur, et celles qui touchent la liste concurrente (matières partagées entre l'Union et les États) sont réservées au président, paragraphe 3A (2), et les lois de l'État sur ces matières ne s'y appliquent que sur décision du conseil, paragraphe 12 (1) (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Le conseil peut créer des conseils ou tribunaux de village pour les litiges entre membres des tribus répertoriées, à l'exclusion des autres tribunaux de l'État, et une juridiction d'appel ; seuls la Haute Cour et la Cour suprême restent compétentes, Sixième annexe, paragraphe 4.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "partiel", note: "Aucune loi de l'Assemblée de l'Assam sur les matières des paragraphes 3 et 3A ne s'applique au district autonome sans notification du conseil, qui peut l'adapter, Sixième annexe, paragraphe 12 (1) (a), modifié en 1995 ; les lois du Parlement s'appliquent sauf notification contraire du gouverneur, paragraphe 12 (1) (b).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "Compétence législative sur l'enseignement primaire et secondaire, Sixième annexe, paragraphe 3A (1) (d) inséré en 1995 ; création et gestion d'écoles primaires et choix de la langue d'enseignement, paragraphe 6 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des non-tribaux, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "partiel", note: "Sièges réservés aux districts autonomes à l'Assemblée de l'Assam, en proportion au moins égale à leur population, dans des circonscriptions limitées au district où seuls les membres des tribus répertoriées des districts autonomes sont éligibles, Constitution, art. 332 (2), (4), (5) et (6) ; les sièges sont garantis au district et non aux Dimasa en tant que tels.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Compétence législative sur l'héritage, le mariage, le divorce et les coutumes sociales, Sixième annexe, paragraphe 3 (1) (h) à (j).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le conseil a été renouvelé le 8 janvier 2024 (28 sièges élus, dont 6 sans opposant). En mars et avril 2024, il a attribué 3 000 bighas (unité de surface locale) à la société Mahabal Cement par bail de 30 ans ; des villageois de Nobdi Longukro et Choto Larpheng ont saisi la Haute Cour de Gauhati (requête d'intérêt public 49/2024), qui a mis en cause l'attribution le 12 août 2025 et demandé les autorisations forestières et environnementales le 1er septembre 2025. La mise en œuvre du mémorandum de 2023 n'a pas été vérifiée.", source: "https://m.thewire.in/article/rights/dima-hasao-assam-tribal-villagers-bjp-council"}
chronologie:
  - {annee: 1952, evenement: "Création du conseil de district des North Cachar Hills."}
  - {annee: 1995, evenement: "Paragraphe 3A : le conseil prend le nom de North Cachar Hills Autonomous Council et reçoit quinze domaines supplémentaires."}
  - {annee: 2010, evenement: "Le district des North Cachar Hills devient le district de Dima Hasao."}
  - {annee: 2023, evenement: "Mémorandum d'accord avec le DNLA le 27 avril."}
  - {annee: 2024, evenement: "Élection du conseil le 8 janvier ; attribution de 3 000 bighas à une cimenterie en mars et avril."}
  - {annee: 2025, evenement: "La Haute Cour de Gauhati met en cause l'attribution de terres à la cimenterie (12 août)."}
  - {annee: 2026, evenement: "Notification du 18 mai renommant le conseil Dima Hasao Autonomous Council ; ordre d'application du 1er septembre."}
