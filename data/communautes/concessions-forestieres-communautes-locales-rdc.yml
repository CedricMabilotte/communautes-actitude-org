effectivite: {valeur: "partielle", note: "Selon l'État des forêts du bassin du Congo 2021 (OFAC, CIFOR, 2022), 70 des 101 forêts communautaires recensées en RDC étaient attribuées (tableau 2.2) ; le chapitre 13 indique que les CFCL attribuées dépendent presque toutes d'un appui technique et financier extérieur et qu'il est trop tôt pour en tirer un bilan. Une enquête de presse (Gabonreview, 27 février 2024) compte 166 forêts communautaires sur environ 3 millions d'hectares en RDC ; elle juge la procédure d'attribution fonctionnelle dans les cas étudiés, mais relève l'enclavement, qui limite l'accès aux forêts et le suivi par l'État et les ONG.", source: "https://www.cifor.org/publications/pdf_files/Books/Etat-des-forets-2021.pdf"}
chronologie:
  - {annee: 2002, evenement: "Loi n° 011/2002 du 29 août portant Code forestier : une communauté locale peut obtenir en concession les forêts qu'elle possède en vertu de la coutume (art. 22)."}
  - {annee: 2014, evenement: "Décret n° 14/018 du 2 août fixant les modalités d'attribution des concessions forestières aux communautés locales."}
  - {annee: 2016, evenement: "Arrêté ministériel n° 025 du 9 février sur la gestion et l'exploitation des CFCL."}
  - {annee: 2018, evenement: "Adoption de la stratégie nationale relative à la foresterie communautaire."}
  - {annee: 2021, evenement: "70 forêts communautaires attribuées sur 101 recensées (État des forêts du bassin du Congo 2021)."}
fiabilite:
  verifie:
    - "Texte du décret n° 14/018 (art. 1 à 24), dont les art. 2, 15, 18, 19 et 20 (FAOLEX)."
    - "Art. 7, 22 et 111 à 113 du Code forestier, lus sur la copie numérisée publiée par Leganet."
    - "Art. 3 à 18, 27, 34 à 41, 62 à 67 et 81 à 82 de l'arrêté n° 025 du 9 février 2016, lus sur la copie numérisée publiée par Leganet."
    - "Chiffres de 2021 (101 forêts communautaires recensées, 2 039 625 ha ; 70 attribuées, 1 344 420 ha) : État des forêts du bassin du Congo 2021, tableau 2.2, sources AGEDUFOR 2018 et FRMi 2021."
    - "Citation du décret n° 14/018 et de l'arrêté n° 025 dans le sixième rapport national de la RDC à la CDB (octobre 2019)."
    - "Constat du chapitre 13 de l'État des forêts 2021 : CFCL dépendantes d'un appui extérieur ; stratégie nationale relative à la foresterie communautaire adoptée en 2018 (chapitre 2)."
    - "Tableau des sites : 192 lignes tirées de la couche « Forêt communautaire » de l'Atlas forestier de la RDC (ministère de l'Environnement et du Développement durable, licence CC-BY), après retrait de trois doublons (même nom, même subdivision et même superficie administrative ; 195 entités dans la couche) ; surfaces = superficie administrative ; année lue dans le numéro d'arrêté quand il figure (42 sites) ; noms de province harmonisés (« Kasai », « Maniena » dans la couche) et province du site Asu'u, vide dans la couche, renseignée d'après son territoire (Mwenga, Sud-Kivu)."
  non_confirme:
    - "Chiffre de 166 CFCL sur environ 3 millions d'hectares : enquête de presse (Gabonreview, 2024), sans source officielle citée."
    - "Statut d'attribution de chaque site de la couche cartographique : non précisé ligne par ligne ; 150 sites n'ont pas de numéro d'arrêté dans la couche, qui ne porte pas de date de mise à jour."
    - "Deux sites (Imoma, Basimbi) figurent deux fois dans la couche avec des surfaces différentes ; les deux lignes sont conservées."
    - "Inscription de CFCL au registre ICCA ou à la base WDPA : non vérifiée."
    - "Population des communautés attributaires : non trouvée."
    - "Nombre de villages : non trouvé."
