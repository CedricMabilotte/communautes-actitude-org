reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Le sixième rapport national de la RDC à la Convention sur la diversité biologique cite le décret n° 14/018 et l'arrêté n° 025 de 2016 ; il rattache l'article 19 du décret (gestion des concessions selon les coutumes locales) à l'article 8 j de la Convention.", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/cd-nr-06-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 011/2002 du 29 août 2002 portant Code forestier, art. 22 et 111 à 113", nature: "loi", annee: 2002, source: "https://www.leganet.be/Legislation/Droit%20economique/Code%20Forestier/rdc-loiforets.pdf"}
  - {instrument: "Décret n° 14/018 du 2 août 2014 fixant les modalités d'attribution des concessions forestières aux communautés locales", nature: "loi", annee: 2014, source: "https://faolex.fao.org/docs/pdf/cng140362.pdf"}
  - {instrument: "Arrêté ministériel n° 025/CAB/MIN/ECN-DD/CJ/00/RBM/2016 du 9 février 2016 portant dispositions spécifiques relatives à la gestion et à l'exploitation de la concession forestière des communautés locales", nature: "loi", annee: 2016, source: "https://www.leganet.be/Legislation/Droit%20economique/Code%20Forestier/AM.025.9.02.2016.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'arrêté n° 025 de 2016 (art. 4 à 18) laisse à la communauté le choix entre une entité distincte (association, coopérative) et une organisation interne composée d'une assemblée communautaire, organe de décision, d'un comité local de gestion, d'un comité local de contrôle et de suivi-évaluation et d'un conseil des sages ; l'assemblée en désigne les membres par élection, cooptation ou toute autre voie prévue par la coutume locale (art. 6) ; l'exploitation se fait sous la supervision technique de l'administration forestière locale (Code forestier, art. 111).", source: "https://www.leganet.be/Legislation/Droit%20economique/Code%20Forestier/AM.025.9.02.2016.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée communautaire adopte les règles pratiques de gestion et de contrôle de la concession « conformément à la réglementation en vigueur et aux us et coutumes » (arrêté n° 025 de 2016, art. 6) ; les coutumes s'appliquent tant qu'elles ne sont pas contraires aux lois et à l'ordre public (décret n° 14/018, art. 19 ; arrêté n° 025, art. 3) ; le plan simple de gestion est approuvé par le chef de secteur, le chef de chefferie ou le bourgmestre urbano-rural (art. 27).", source: "https://www.leganet.be/Legislation/Droit%20economique/Code%20Forestier/AM.025.9.02.2016.pdf"}
  justice_propre: {valeur: "partiel", note: "Le conseil des sages prévient et règle les conflits liés à la gestion de la concession et au partage des bénéfices ; tout différend portant sur la concession entre membres ou entre communautés est résolu suivant les us et coutumes, sans préjudice de la loi (arrêté n° 025 de 2016, art. 15 et 18).", source: "https://www.leganet.be/Legislation/Droit%20economique/Code%20Forestier/AM.025.9.02.2016.pdf"}
  terres: {valeur: "partiel", note: "La concession est attribuée gratuitement et à perpétuité, comme un bien indivis de toute la communauté, qui ne peut être divisé en titres individuels (décret n° 14/018, art. 2, 15 et 20 ; arrêté n° 025, art. 37) ; plafond de 50 000 ha par communauté, les droits coutumiers étant conservés sur la partie non concédée (décret, art. 18) ; les forêts restent propriété de l'État (Code forestier, art. 7).", source: "https://faolex.fao.org/docs/pdf/cng140362.pdf"}
  ressources: {valeur: "partiel", note: "La communauté a le droit d'exploiter sa forêt elle-même ou par des exploitants artisanaux sous contrat, et les produits lui reviennent après déduction des frais de l'administration (Code forestier, art. 112 et 113) ; la coupe de bois d'œuvre exige un permis de coupe communautaire soumis à taxe (arrêté n° 025 de 2016, art. 41) ; les contrats d'exploitation, de récolte de produits forestiers non ligneux et de cogestion n'entrent en vigueur qu'après approbation de l'administration forestière locale (art. 36, 38, 51 et 66).", source: "https://www.leganet.be/Legislation/Droit%20economique/Code%20Forestier/AM.025.9.02.2016.pdf"}
