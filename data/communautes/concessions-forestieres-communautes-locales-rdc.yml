resume: >-
  Fiche agrégée : elle couvre les communautés locales titulaires d'une concession forestière de communauté locale (CFCL) en République démocratique du Congo.
  La loi n° 011/2002 du 29 août 2002 portant Code forestier (art. 22) permet à une communauté locale d'obtenir à titre gratuit, en concession, tout ou partie des forêts protégées qu'elle possède régulièrement en vertu de la coutume.
  Le décret n° 14/018 du 2 août 2014 définit la CFCL comme une forêt attribuée gratuitement et perpétuellement par l'État, par arrêté du gouverneur de province, dans la limite de 50 000 ha par communauté ; l'arrêté ministériel n° 025 du 9 février 2016 fixe les organes de gestion et le plan simple de gestion (document qui programme les usages de la forêt).
  En 2021, 70 forêts communautaires étaient attribuées (1 344 420 ha) sur 101 recensées ; la couche « Forêt communautaire » de l'Atlas forestier de la RDC, publiée par le ministère de l'Environnement et du Développement durable, compte 192 sites distincts.
  Les droits propres aux peuples autochtones pygmées (loi n° 22/030 de 2022) relèvent de la fiche « Peuples autochtones pygmées de RDC ».
