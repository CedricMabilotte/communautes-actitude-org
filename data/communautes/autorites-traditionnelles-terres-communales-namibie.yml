reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial sur les droits des peuples autochtones (James Anaya) sur la Namibie, A/HRC/24/41/Add.1, par. 20 et 51 à 54 : il décrit l'administration des terres communales par les autorités traditionnelles au titre de la loi de 2002 et la procédure de reconnaissance de la loi de 2000.", annee: 2013, source: "https://documents.un.org/api/symbol/access?s=A/HRC/24/41/Add.1&l=en&t=pdf"}
base_nationale:
  - {instrument: "Traditional Authorities Act (loi sur les autorités traditionnelles) n° 25 de 2000, art. 2, 3, 5, 6, 14 et 18", nature: "loi", annee: 2000, source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  - {instrument: "Communal Land Reform Act (loi sur la réforme des terres communales) n° 5 de 2002, art. 4, 15, 17, 19 à 24, 26 à 31 et annexe 1", nature: "loi", annee: 2002, source: "https://namiblii.org/akn/na/act/2002/5/eng@2016-12-01"}
  - {instrument: "Droit coutumier des communautés traditionnelles, établi et appliqué par les autorités traditionnelles (loi n° 25 de 2000, art. 3 (1) (a) et (b))", nature: "coutume_reconnue", annee: 2000, source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque communauté traditionnelle peut instituer une autorité traditionnelle composée du chef et de conseillers (loi n° 25 de 2000, art. 2) ; la désignation du chef est soumise à l'approbation du ministre (art. 5 (1) et (2)) puis reconnue par proclamation du président au Journal officiel (art. 6 (2)). Sur avis du ministre et après saisine du Conseil des dirigeants traditionnels, le président peut rejeter la désignation (art. 5 (3) à (6)).", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'autorité traditionnelle constate le droit coutumier de la communauté après consultation de ses membres, aide à sa codification (loi n° 25 de 2000, art. 3 (1) (a)) et peut édicter des règles de droit coutumier (art. 3 (3) (c)) ; ce droit ne s'applique qu'aux membres de la communauté et cesse de s'appliquer s'il est contraire à la Constitution ou à la loi (art. 14). Le chef ou l'autorité traditionnelle fixe les conditions d'usage des pâturages communs (commonage) (loi n° 5 de 2002, art. 29 (1)).", source: "https://namiblii.org/akn/na/act/2002/5/eng@2016-12-01"}
  justice_propre: {valeur: "partiel", note: "L'autorité traditionnelle administre et applique le droit coutumier de la communauté (loi n° 25 de 2000, art. 3 (1) (b)) et peut entendre et régler les différends entre ses membres selon ce droit (art. 3 (3) (b)).", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  terres: {valeur: "partiel", note: "Les terres communales appartiennent à l'État, en fiducie au bénéfice des communautés traditionnelles qui y résident et du développement économique et social de la population namibienne, et aucune propriété pleine et entière (freehold) ne peut y être acquise (loi n° 5 de 2002, art. 17). Le chef ou l'autorité traditionnelle attribue les droits fonciers coutumiers (droit sur une unité agricole ou résidentielle, art. 20 et 21) et peut les annuler (art. 27) ; ces décisions n'ont d'effet qu'après ratification par le conseil foncier communal (art. 24 et 27 (2)). Le droit coutumier est viager ; au décès du titulaire, il revient au chef ou à l'autorité traditionnelle, qui le réattribue au conjoint survivant ou à un enfant (art. 26).", source: "https://namiblii.org/akn/na/act/2002/5/eng@2016-12-01"}
  ressources: {valeur: "partiel", note: "Les pâturages communs sont ouverts aux résidents légaux du territoire de la communauté, aux conditions fixées par la réglementation ou par le chef ou l'autorité traditionnelle, qui peut retirer un droit de pâturage (loi n° 5 de 2002, art. 29). L'autorité traditionnelle veille à un usage durable des ressources naturelles par les membres de la communauté (loi n° 25 de 2000, art. 3 (2) (c)).", source: "https://namiblii.org/akn/na/act/2002/5/eng@2016-12-01"}
  consentement: {valeur: "partiel", note: "Le conseil foncier communal ne peut accorder un bail (leasehold) sur une terre communale qu'avec le consentement de l'autorité traditionnelle de la communauté concernée (loi n° 5 de 2002, art. 30 (4)) ; si ce consentement est refusé sans motif raisonnable, un arbitre nommé par le ministre peut le donner à sa place (art. 30 (5) et (6)). Le ministre consulte l'autorité traditionnelle avant de délimiter la zone où des baux agricoles peuvent être accordés (art. 30 (2)).", source: "https://namiblii.org/akn/na/act/2002/5/eng@2016-12-01"}
  langue: {valeur: "partiel", note: "L'autorité traditionnelle défend, promeut et préserve la culture, la langue et les traditions de la communauté (loi n° 25 de 2000, art. 3 (1) (c)). Aucun statut officiel des langues.", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'autorité traditionnelle peut, avec le consentement des membres de la communauté, créer un fonds fiduciaire communautaire (Community Trust Fund) et lever des fonds au nom de la communauté, versés à ce fonds (loi n° 25 de 2000, art. 3 (3) et 18). Aucun pouvoir d'imposition.", source: "https://www.lac.org.na/laws/annoSTAT/Traditional%20Authorities%20Act%2025%20of%202000.pdf"}
  representation: {valeur: "partiel", note: "Chaque autorité traditionnelle du ressort d'un conseil foncier communal y propose un représentant, nommé par le ministre (loi n° 5 de 2002, art. 4 (1) (a)) ; les autorités traditionnelles conseillent le Conseil des dirigeants traditionnels, organe consultatif national (loi n° 25 de 2000, art. 3 (1) (f)).", source: "https://namiblii.org/akn/na/act/2002/5/eng@2016-12-01"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon une étude du Legal Assistance Centre (Werner, 2021), en 2018 seuls 39 % des quelque 245 000 droits fonciers coutumiers existants étaient enregistrés ; des clôtures illégales subsistent malgré une décision de la Haute Cour de 2016, et des attributions doubles ont lieu là où les ressorts de plusieurs autorités traditionnelles se chevauchent. Le Rapporteur spécial de l'ONU relève en 2013 que la reconnaissance de plusieurs autorités traditionnelles a été refusée, dont celles de chefs himba et ovazemba et celle des Khwe, qui la demandent depuis 1997 (A/HRC/24/41/Add.1, par. 52 et 53).", source: "https://www.lac.org.na/projects/lead/Pdf/Land_Governance_on_Communal_Land.pdf"}
chronologie:
