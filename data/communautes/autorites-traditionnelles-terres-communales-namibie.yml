  - {annee: 2000, evenement: "Loi n° 25 sur les autorités traditionnelles."}
  - {annee: 2002, evenement: "Loi n° 5 sur la réforme des terres communales : propriété de l'État en fiducie, attribution des droits coutumiers par les autorités traditionnelles, conseils fonciers communaux."}
