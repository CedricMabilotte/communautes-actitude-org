resume: >-
  Fiche agrégée : elle couvre les communautés traditionnelles de Namibie dont l'autorité traditionnelle est reconnue par l'État et qui résident sur les terres communales. La loi sur les autorités traditionnelles (Traditional Authorities Act n° 25 de 2000) permet à chaque communauté traditionnelle d'instituer une autorité composée du chef et de conseillers, dont la désignation est reconnue par proclamation présidentielle au Journal officiel. La loi sur la réforme des terres communales (Communal Land Reform Act n° 5 de 2002) place les terres communales sous la propriété de l'État, en fiducie au bénéfice des communautés traditionnelles qui y résident ; le chef ou l'autorité traditionnelle attribue et annule les droits fonciers coutumiers, sous ratification du conseil foncier communal (Communal Land Board, l'organe régional qui enregistre les droits). Les terres communales couvrent 39 % du territoire national. La situation des Ju|'hoansi de Nyae Nyae fait l'objet d'une fiche distincte.
