resume: >-
  L'article 65 de la Constitution slovène de 1991 renvoie à la loi le statut et les droits spéciaux de la communauté rom. La loi de 2007 sur la communauté rom (ZRomS-1) crée le Conseil de la communauté rom de la République de Slovénie, personne de droit public de 21 membres qui représente la communauté auprès de l'État et dont l'avis préalable est obligatoire pour les textes qui la concernent. Dans 20 communes du Prekmurje, de la Dolenjska, de la Bela krajina et du Posavje, la loi sur l'autonomie locale garantit un conseiller municipal rom et un organe municipal de suivi. Les Roms installés hors de ces communes, dits « non autochtones », n'ont pas de siège garanti.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Slovénie, adopté le 21 juin 2017 : examen de la loi de 2007, du Conseil de la communauté rom et des conseillers municipaux roms (§ 4, 8, 24-25).", annee: 2017, source: "https://rm.coe.int/fourth-opinion-on-slovenia-adopted-on-21-june-2017/16807843c7"}
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/SVN/CO/8-11), § 6-7 et 10-11 : le Comité vise la distinction entre Roms « autochtones » et « non autochtones » et recommande de revoir la composition et les fonctions du Conseil de la communauté rom.", annee: 2016, source: "https://documents.un.org/doc/undoc/gen/g16/003/44/pdf/g1600344.pdf"}
base_nationale:
