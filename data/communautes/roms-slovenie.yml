  - {annee: 1993, evenement: "Loi sur l'autonomie locale."}
  - {annee: 2002, evenement: "Élections locales : échéance fixée par l'article 101.a de la loi sur l'autonomie locale pour garantir un représentant rom au conseil municipal de 20 communes."}
  - {annee: 2007, evenement: "Loi sur la communauté rom (ZRomS-1), adoptée le 30 mars et publiée le 13 avril : création du Conseil de la communauté rom de la République de Slovénie."}
  - {annee: 2016, evenement: "Observations finales du Comité pour l'élimination de la discrimination raciale sur la Slovénie."}
  - {annee: 2017, evenement: "Quatrième avis du Comité consultatif de la Convention-cadre sur la Slovénie."}
  - {annee: 2020, evenement: "Loi sur la réduction des coûts des communes : financement dédié de l'État aux communes ayant des établissements roms enregistrés."}
  - {annee: 2021, evenement: "Programme national de mesures du gouvernement pour les Roms 2021-2030, adopté le 23 décembre."}
