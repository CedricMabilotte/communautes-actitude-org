  - {instrument: "Loi sur la communauté rom en République de Slovénie (ZRomS-1), Uradni list RS n° 33/2007", nature: "loi", annee: 2007, source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2007-01-1762"}
  - {instrument: "Loi sur l'autonomie locale (ZLS, 1993 ; texte consolidé Uradni list RS n° 94/2007), art. 39 et 101.a : représentant rom au conseil municipal dans les zones d'implantation autochtone et liste des 20 communes", nature: "loi", annee: 1993, source: "https://zakonodaja.com/zakon/zls/39-clen"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil de la communauté rom de la République de Slovénie, personne de droit public, représente la communauté auprès de l'État ; 14 de ses 21 membres sont désignés par l'Union des Roms de Slovénie et 7 élus par les conseillers municipaux roms, ZRomS-1 (2007), art. 9 et 10 ; ses fonctions sont consultatives.", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2007-01-1762"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les organes de l'État, les titulaires de prérogatives publiques et les communes doivent recueillir l'avis préalable du Conseil avant d'adopter des textes généraux relatifs à la situation de la communauté rom, ZRomS-1 (2007), art. 12, al. 2 ; l'avis ne lie pas l'autorité.", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2007-01-1762"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le fonctionnement du Conseil est financé par le budget de l'État et les fonds communaux consacrés à la communauté rom sont couverts par le budget de l'État selon la loi sur le financement des communes, ZRomS-1 (2007), art. 13 à 15 ; aucun pouvoir fiscal.", source: "https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2007-01-1762"}
  representation: {valeur: "partiel", note: "La loi sur l'autonomie locale garantit aux Roms au moins un représentant au conseil municipal là où la communauté est implantée de manière autochtone (art. 39) et énumère 20 communes tenues de l'assurer (art. 101.a) ; la ZRomS-1 (2007), art. 7, y impose un organe municipal de suivi ; aucun siège réservé à l'Assemblée nationale.", source: "https://www.gov.si/teme/romska-skupnost/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité pour l'élimination de la discrimination raciale relève en 2016 que le Conseil de la communauté rom ne fonctionne pas de manière effective et que les Roms installés hors des communes d'implantation autochtone ne sont pas représentés de manière effective dans les conseils municipaux (CERD/C/SVN/CO/8-11, § 10) ; le Comité consultatif de la Convention-cadre juge en 2017 le Conseil non représentatif de l'ensemble de la communauté (§ 8).", source: "https://documents.un.org/doc/undoc/gen/g16/003/44/pdf/g1600344.pdf"}
chronologie:
