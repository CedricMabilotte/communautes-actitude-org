droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi républicaine n° 370-З de 2006 prévoit des territoires d'usage traditionnel de la nature de niveau républicain et local ; la loi n° 2934-З de 2026 (art. 9.1 et 10.1) permet de les supprimer en cas de reprise des terrains pour les besoins de l'État ou d'une commune, et soumet le modèle de règlement des territoires de niveau local à l'accord de l'Association des peuples autochtones peu nombreux du Nord de la République (art. 13 § 1.3).", source: "http://publication.pravo.gov.ru/document/1400202603170018"}
  ressources: {valeur: "partiel", note: "L'expertise vérifie le calcul des pertes subies par les usagers des terres et des ressources et par les communautés (obchtchinas, artels), loi n° 820-З de 2010, art. 3 et 5 (version de 2022) ; la conclusion positive approuvée par le gouvernement de la République est transmise au Conseil des représentants des peuples autochtones peu nombreux auprès du chef de la République en vue d'un accord d'indemnisation, art. 8 § 7.2 (version de 2025). Aucun partage des revenus des ressources.", source: "http://publication.pravo.gov.ru/document/1400202505160029"}
  consentement: {valeur: "partiel", note: "L'expertise ethnologique est conduite avant toute décision de réaliser une activité économique dans les lieux d'habitat traditionnel et sur les territoires d'usage traditionnel, loi n° 820-З de 2010, art. 5 § 9 (version de 2022) ; sa conclusion se prononce sur l'admissibilité du projet et n'acquiert force juridique qu'après approbation par le gouvernement de la République, art. 8 § 1 et 5 ; l'exploration géologique de moins de cinq ans et la plupart des constructions dans les localités sont exclues du champ de l'expertise, art. 1 § 6 ; aucune exigence de consentement des communautés.", source: "http://publication.pravo.gov.ru/document/1400202211250011"}
  langue: {valeur: "partiel", note: "Les langues dolgane, tchouktche, évenke, évène et youkaguire sont officielles dans les lieux d'habitat et d'activité traditionnels de ces peuples et peuvent être employées dans les usages officiels à égalité avec les langues d'État de la République, loi n° 111-З de 2004, art. 3 (version de 2019).", source: "https://yakutia-lang.nlrs.ru/2022/11/14/%D0%B7%D0%B0%D0%BA%D0%BE%D0%BD-%D0%BE-%D1%81%D1%82%D0%B0%D1%82%D1%83%D1%81%D0%B5-%D1%8F%D0%B7%D1%8B%D0%BA%D0%BE%D0%B2-%D0%BA%D0%BE%D1%80%D0%B5%D0%BD%D0%BD%D1%8B%D1%85-%D0%BC%D0%B0%D0%BB%D0%BE%D1%87/"}
  education: {valeur: "partiel", note: "Droit à l'enseignement préscolaire, primaire et de base dans la langue maternelle et au choix de la langue d'enseignement dans la limite des possibilités du système éducatif, selon la législation sur l'éducation, loi n° 111-З de 2004, art. 6 (version de 2014) ; pas de système scolaire géré par les communautés.", source: "https://yakutia-lang.nlrs.ru/2022/11/14/%D0%B7%D0%B0%D0%BA%D0%BE%D0%BD-%D0%BE-%D1%81%D1%82%D0%B0%D1%82%D1%83%D1%81%D0%B5-%D1%8F%D0%B7%D1%8B%D0%BA%D0%BE%D0%B2-%D0%BA%D0%BE%D1%80%D0%B5%D0%BD%D0%BD%D1%8B%D1%85-%D0%BC%D0%B0%D0%BB%D0%BE%D1%87/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Vingt-deux expertises en dix ans, 513,2 millions de roubles de pertes évaluées et 103,3 millions versés aux communautés claniques, dont plus de 87 millions pour le gazoduc « Force de Sibérie » (Rossiïskaïa Gazeta, 2020) ; le président de l'Union des communautés claniques de Iakoutie, cité dans le même article, indique que des entreprises titulaires de licences fédérales se soustraient à l'expertise ; les recommandations parlementaires de 2017 relèvent que son caractère obligatoire pour les projets industriels reste non réglé ; le Comité consultatif de la Convention-cadre (2018, § 145) note qu'en Russie la participation des peuples autochtones aux décisions n'est pas toujours assurée en pratique et cite la République de Sakha comme seule à avoir adopté une loi sur l'expertise ethnologique.", source: "https://www.ecoi.net/en/document/2002328.html"}
chronologie:
  - {annee: 2004, evenement: "Loi républicaine sur le statut des langues des peuples autochtones peu nombreux du Nord."}
  - {annee: 2006, evenement: "Loi républicaine sur les territoires d'usage traditionnel de la nature."}
  - {annee: 2009, evenement: "Liste fédérale des lieux d'habitat et d'activité traditionnels ; la version en vigueur inclut 21 districts de la République."}
  - {annee: 2010, evenement: "Loi républicaine sur l'expertise ethnologique."}
  - {annee: 2011, evenement: "Le gouvernement de la République fixe la procédure de l'expertise (décision n° 428)."}
  - {annee: 2015, evenement: "Conclusion positive de l'expertise sur le gazoduc « Force de Sibérie » (districts d'Olekminsk, d'Aldan et de Neriungri)."}
  - {annee: 2017, evenement: "Audition parlementaire : huit expertises réalisées de 2010 à 2016 ; le caractère obligatoire de l'expertise des projets industriels reste non réglé."}
  - {annee: 2020, evenement: "La loi sur l'expertise est étendue aux territoires d'usage traditionnel de la nature."}
  - {annee: 2022, evenement: "L'expertise doit précéder la décision de réaliser un projet ; obligation de suivi ethnologique pour le maître d'ouvrage."}
  - {annee: 2025, evenement: "Les conclusions sont transmises au Conseil des représentants des peuples autochtones peu nombreux en vue des accords d'indemnisation."}
  - {annee: 2026, evenement: "Une modification permet la suppression des territoires d'usage traditionnel en cas de reprise des terrains pour les besoins publics."}
