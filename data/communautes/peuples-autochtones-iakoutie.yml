resume: >-
  La République de Sakha (Iakoutie) applique aux Évenks, Évènes, Youkaguirs, Dolganes et Tchouktches un régime régional qui s'ajoute à la loi fédérale sur les peuples autochtones peu nombreux. La loi républicaine n° 820-З du 14 avril 2010 impose une expertise ethnologique (évaluation, par une commission d'experts, des effets d'un projet sur le milieu de vie et le mode de vie de ces peuples) avant les décisions sur les projets situés dans leurs lieux d'habitat traditionnel, et sert de base au calcul des pertes à indemniser. Une loi de 2006 crée des territoires d'usage traditionnel de la nature de niveau républicain et local, et une loi de 2004 rend les cinq langues officielles dans les lieux d'habitat de ces peuples. Le dispositif couvre 21 districts et 70 localités de la liste fédérale.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre sur la Fédération de Russie, ACFC/OP/IV(2018)001, § 145 : seule la République de Sakha a adopté une loi sur l'expertise ethnologique ; § 37 : institution distincte du médiateur pour les droits des peuples autochtones peu nombreux en Sakha ; la Russie a cessé d'être membre du Conseil de l'Europe en 2022", annee: 2018, source: "https://www.ecoi.net/en/document/2002328.html"}
