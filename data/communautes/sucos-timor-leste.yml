resume: >-
  Fiche agrégée : elle couvre les sucos (suku en tétoum), communautés de base du Timor-Leste. La loi n° 9/2016 du 8 juillet 2016, dite loi des sucos, les définit comme des personnes morales de droit public de nature associative (associations publiques), formées sur la base de circonstances historiques, culturelles et traditionnelles, dont les membres sont liés par des liens familiaux ou traditionnels dans un espace déterminé (art. 3 et 4). Chaque suco a un conseil de suco, organe délibérant qui comprend un lian-na'in (gardien de la parole coutumière) élu par le conseil selon la tradition du suco, un chef de suco élu au suffrage direct pour sept ans, et des aldeias (hameaux) dotées d'une assemblée et d'un chef. Le suco promeut le règlement des conflits selon les usages de la communauté et préserve les maisons sacrées (uma-lulik) ; les actes du chef de suco n'engagent ni l'État ni la municipalité et le suco est soumis à une tutelle administrative de légalité. L'État reconnaît les sucos par diplôme ministériel : 451 sucos et 2 233 aldeias en 2017, 461 sucos et 2 233 aldeias en 2023, cinq sucos de plus en décembre 2024. Le tableau reproduit la liste de 2017.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination à l'égard des femmes sur le quatrième rapport du Timor-Leste (CEDAW/C/TLS/CO/4, 31 mai 2023), § 31 et 43 : seuls 5 % des chefs de village (Xefe Suku) et 4 % des chefs de sous-village (Xefe Aldeia) sont des femmes ; § 14 : recommande d'adopter le projet de loi sur la justice traditionnelle.", annee: 2023, source: "https://tbinternet.ohchr.org/_layouts/15/treatybodyexternal/Download.aspx?symbolno=CEDAW%2FC%2FTLS%2FCO%2F4&Lang=en"}
