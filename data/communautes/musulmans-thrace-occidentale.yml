resume: >-
  Les musulmans de Thrace occidentale, dans le nord-est de la Grèce, ont été exclus de l'échange obligatoire de populations entre la Grèce et la Turquie de 1923. L'art. 45 du traité de Lausanne du 24 juillet 1923 oblige la Grèce à leur accorder les droits que la section III du traité confère aux minorités non musulmanes de Turquie : écoles et institutions propres, usage de leur langue, statut personnel. La Grèce les reconnaît comme minorité religieuse, et non comme minorité ethnique. Trois muftis (juristes religieux musulmans) nommés par l'État, à Komotini, Xanthi et Didymotique, exercent une compétence en droit de la famille et des successions ; depuis la loi 4511/2018, adoptée pendant l'examen de l'affaire Molla Sali c. Grèce, ce recours au mufti est facultatif, règle reprise par la loi 4964/2022 qui régit aujourd'hui les muftiats. Les waqfs (fondations pieuses) sont gérés par des comités élus par les musulmans (loi 3647/2008). Les minorités non musulmanes de Turquie ont leur propre fiche (« Minorités du traité de Lausanne en Turquie »).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Traité de Lausanne : l'art. 44 place sous la garantie de la Société des Nations les obligations de la section III envers les minorités non musulmanes de Turquie ; l'art. 45 oblige la Grèce à conférer les mêmes droits à la minorité musulmane de son territoire.", annee: 1923, source: "https://www.svi-bz.org/uploads/tx_bh/141/treaty_of_peace_with_turkey_signed_at_lausanne_july_24_1923.pdf"}
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale (CERD), observations finales CERD/C/GRC/CO/20-22, par. 10 et 11 : les musulmans de Thrace couverts par le traité de Lausanne sont reconnus seulement comme minorité religieuse ; le traité n'empêche pas l'auto-identification des personnes appartenant à divers groupes ethniques.", annee: 2016, source: "https://www.statewatch.org/media/documents/news/2016/sep/un-greece-crd-periodic-report-8-16.pdf"}
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination à l'égard des femmes (CEDAW), observations finales sur le septième rapport de la Grèce, par. 36 et 37 : non-application du droit général à la communauté musulmane de Thrace en matière de mariage et de succession (cité par la CEDH, Molla Sali c. Grèce, § 71).", annee: 2013, source: "https://hudoc.echr.coe.int/app/conversion/pdf/?library=ECHR&id=001-188985&filename=001-188985.pdf"}
base_nationale:
  - {instrument: "Traité de paix de Lausanne (24 juillet 1923), section III, art. 37 à 45, ratifié par le décret législatif du 25 août 1923", nature: "traite", annee: 1923, source: "https://www.svi-bz.org/uploads/tx_bh/141/treaty_of_peace_with_turkey_signed_at_lausanne_july_24_1923.pdf"}
  - {instrument: "Loi 3647/2008 sur l'administration et la gestion des waqfs de la minorité musulmane de Thrace occidentale et de leurs biens", nature: "loi", annee: 2008, source: "https://www.lawspot.gr/nomikes-plirofories/nomothesia/nomos-3647-2008"}
  - {instrument: "Loi 4964/2022 (FEK A 150/30.7.2022), partie C, art. 137 à 162 : modernisation des muftiats de Thrace ; abroge la loi 1920/1991 et la loi 4511/2018 (art. 162)", nature: "loi", annee: 2022, source: "https://www.minedu.gov.gr/publications/docs2024/ggth/N._4964-2022__%CE%86%CF%81%CE%B8%CF%81%CE%B1_137-162_%CE%95%CE%BB%CE%BB%CE%B7%CE%BD%CE%B9%CE%BA%CE%AC.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les biens des waqfs (fondations pieuses) de Xanthi, Komotini et Didymotique sont administrés par des comités de gestion de cinq membres élus au scrutin secret par les musulmans, hommes et femmes, inscrits sur les listes électorales de ces communes ; dans les villages, des comités de trois membres sont élus par les habitants musulmans, loi 3647/2008, art. 6, 7 et 10 ; le mufti valide les élections des comités de village et le secrétaire général de région peut prononcer la déchéance des membres (art. 16).", source: "https://www.lawspot.gr/nomikes-plirofories/nomothesia/nomos-3647-2008"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Le mufti exerce une juridiction entre citoyens grecs membres de la minorité musulmane de Thrace en matière de mariage, divorce, pensions alimentaires, tutelle, curatelle, émancipation des mineurs, testaments islamiques et successions ab intestat (sans testament), loi 4964/2022, art. 146 § 8 ; cette juridiction suppose la demande des deux parties, le droit commun s'appliquant par défaut (art. 146 § 10) ; ses décisions ne sont exécutoires qu'après déclaration du tribunal de première instance, qui contrôle leur conformité à la Constitution et à la Convention européenne des droits de l'homme (art. 146 § 9) ; le mufti est un fonctionnaire choisi par le ministre de l'Éducation et des Cultes après avis d'un comité consultatif de 33 membres de la minorité, et nommé par décret présidentiel pour cinq ans (art. 143, 147, 153 et 156).", source: "https://www.minedu.gov.gr/publications/docs2024/ggth/N._4964-2022__%CE%86%CF%81%CE%B8%CF%81%CE%B1_137-162_%CE%95%CE%BB%CE%BB%CE%B7%CE%BD%CE%B9%CE%BA%CE%AC.pdf"}
  terres: {valeur: "partiel", note: "Les waqfs dotés de biens immobiliers sont des personnes morales de droit privé, et les cimetières musulmans publics des districts de Xanthi, Rhodope et Évros sont assimilés à des waqfs, loi 3647/2008, art. 4 ; la vente ou l'hypothèque de ces biens requiert l'avis conforme du mufti (art. 3 § 5) ; ces biens sont exonérés d'impôt (loi 3554/2007, selon la Law Library of Congress).", source: "https://www.lawspot.gr/nomikes-plirofories/nomothesia/nomos-3647-2008"}
  ressources: {valeur: "non_applicable", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Droit d'utiliser sa langue dans ses écoles et institutions, traité de Lausanne, art. 40 et 41, applicables par l'art. 45 ; les écoles primaires minoritaires enseignent en grec et en turc selon la Law Library of Congress (2012) ; aucune langue co-officielle.", source: "https://tile.loc.gov/storage-services/service/ll/llglrd/2013417418/2013417418.pdf"}
  education: {valeur: "partiel", note: "Droit de fonder et gérer à ses frais des écoles, traité de Lausanne, art. 40, applicable par l'art. 45 ; lois 694/1977 et 695/1977 sur les écoles minoritaires ; 198 écoles primaires minoritaires bilingues gérées par des comités scolaires élus par les parents, deux collèges-lycées minoritaires à Komotini et Xanthi et deux écoles religieuses, enseignants rémunérés par le ministère (Law Library of Congress, 2012) ; les waqfs scolaires sont gérés par le comité scolaire élu, loi 3647/2008, art. 19.", source: "https://tile.loc.gov/storage-services/service/ll/llglrd/2013417418/2013417418.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le droit de la famille et des successions peut relever de la loi religieuse islamique (charia) sur option : les successions suivent le Code civil sauf déclaration notariée du testateur choisissant la charia, et le mufti ne statue que sur demande des deux parties, loi 4964/2022, art. 146 § 10, qui reprend la règle introduite par la loi 4511/2018 (CEDH, Molla Sali c. Grèce, § 57).", source: "https://www.minedu.gov.gr/publications/docs2024/ggth/N._4964-2022__%CE%86%CF%81%CE%B8%CF%81%CE%B1_137-162_%CE%95%CE%BB%CE%BB%CE%B7%CE%BD%CE%B9%CE%BA%CE%AC.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon la Law Library of Congress (2012), une partie de la minorité a élu ses propres muftis, non reconnus, poursuivis pour usurpation de fonctions ; Minority Rights Group relève la fermeture de plus de 60 écoles primaires minoritaires en douze ans (2019) et la fermeture par les autorités d'associations portant le mot « turc » dans leur nom ; la CEDH relève qu'entre 2007 et 2014 les tribunaux de Xanthi et de Rhodope ont déclaré exécutoires 866 décisions des muftis et en ont refusé 51 (Molla Sali c. Grèce, § 48) ; le CERD a noté en 2016 que la minorité est reconnue seulement comme religieuse.", source: "https://minorityrights.org/the-turkish-minority-in-western-thrace/"}
chronologie:
  - {annee: 1913, evenement: "Traité d'Athènes entre la Grèce et l'Empire ottoman : compétence des muftis en droit de la famille entre musulmans."}
  - {annee: 1920, evenement: "Loi 2345/1920 sur les muftis ; traité de Sèvres sur la protection des minorités en Grèce."}
  - {annee: 1923, evenement: "Traité de Lausanne : la minorité musulmane de Thrace occidentale est exclue de l'échange de populations ; art. 45 sur ses droits, sous garantie de la Société des Nations."}
  - {annee: 1977, evenement: "Lois 694/1977 et 695/1977 sur les écoles minoritaires et l'Académie pédagogique spéciale de Thessalonique."}
  - {annee: 1991, evenement: "Loi 1920/1991 : nomination des muftis par décret présidentiel et définition de leur juridiction."}
  - {annee: 2008, evenement: "Loi 3647/2008 : comités élus pour la gestion des waqfs."}
  - {annee: 2016, evenement: "Observations finales du CERD sur la reconnaissance seulement religieuse de la minorité."}
  - {annee: 2018, evenement: "Loi 4511/2018 (15 janvier) : compétence du mufti rendue facultative ; arrêt de Grande Chambre Molla Sali c. Grèce (19 décembre), violation de l'art. 14 de la Convention combiné avec l'art. 1 du Protocole n° 1."}
  - {annee: 2022, evenement: "Loi 4964/2022 (30 juillet), art. 137 à 162 : nouveau statut des muftiats de Thrace ; abrogation des lois 1920/1991 et 4511/2018."}
