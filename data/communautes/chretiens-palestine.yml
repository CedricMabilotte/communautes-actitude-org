resume: >-
  Les chrétiens de Palestine appartiennent à 13 Églises reconnues par un décret présidentiel de 2008, dont le patriarcat grec orthodoxe, le patriarcat latin et la Custodie de Terre sainte.
  La Loi fondamentale modifiée de 2003 (texte à valeur constitutionnelle) confie le statut personnel aux tribunaux religieux (art. 101) ; chaque Église applique ses propres règles de statut personnel dans son tribunal ecclésiastique.
  Le décret-loi n° 6 du 10 août 2026 (décret présidentiel ayant force de loi) réserve au moins 7 des 132 sièges du Conseil législatif à des chrétiens pour l'élection du 28 novembre 2026 ; un décret-loi du 11 janvier 2026 répartit les sièges de 11 conseils locaux entre chrétiens et musulmans et réserve la présidence de 9 d'entre eux à un chrétien.
  Le décret-loi n° 9 de 2014 exonère les Églises reconnues de taxes et de redevances.
