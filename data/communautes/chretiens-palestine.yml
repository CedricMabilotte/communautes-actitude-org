droits:
  autogouvernement: {valeur: "partiel", note: "Décret présidentiel de 2008 : reconnaissance officielle de 13 Églises (patriarcats, exarchats, Custodie) ; selon le rapport de l'État au Comité des droits de l'homme (2021, par. 319 et 321), les communautés religieuses règlent elles-mêmes leurs affaires spirituelles et leur statut personnel ; un décret présidentiel de 2012 crée un comité supérieur des affaires des Églises (par. 323).", source: "https://docs.un.org/en/CCPR/C/PSE/1"}
  pouvoir_normatif: {valeur: "partiel", note: "Loi fondamentale, art. 101 ; selon le rapport de l'État au Comité des droits de l'homme (2021, par. 383), chaque communauté chrétienne applique ses propres règles de statut personnel dans son tribunal ecclésiastique ; ce pouvoir se limite au statut personnel.", source: "https://docs.un.org/en/CCPR/C/PSE/1"}
  justice_propre: {valeur: "reconnu", note: "Loi fondamentale modifiée, art. 101 : les matières de statut personnel relèvent des tribunaux de la charia et des tribunaux religieux, « conformément à la loi » ; des tribunaux ecclésiastiques jugent le statut personnel des chrétiens (rapport CCPR/C/PSE/1, par. 275).", source: "https://www.constituteproject.org/constitution/Palestine_2005"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Décret-loi n° 9 de 2014, art. 2 : les transactions, réclamations et biens des communautés chrétiennes reconnues sont exonérés de taxes et de redevances de toute nature (rapport CCPR/C/PSE/1, par. 322) ; pas de pouvoir fiscal propre.", source: "https://docs.un.org/en/CCPR/C/PSE/1"}
  representation: {valeur: "reconnu", note: "Décret-loi du 11 janvier 2026, art. 1 : sièges réservés aux chrétiens dans 11 conseils locaux (Ramallah 8 sur 15, Bethléem 8 sur 15, Beit Sahour 10 sur 13, Beit Jala 10 sur 13, Birzeit 7 sur 13, Zababdeh 7 sur 11, Aboud 5 sur 9, Jifna 7 sur 9, Ein Arik 5 sur 9, Birqin 1 sur 11, Jéricho 1 sur 15) ; art. 2 : président chrétien sauf à Jéricho et Birqin ; décret-loi n° 23 de 2025, art. 52 : mode d'attribution de ces sièges. Décret-loi n° 6 de 2026, art. 1 : au moins 7 sièges du Conseil législatif.", source: "https://www.elections.ps/Portals/0/christian%20seats%20LE2026%20EN.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Loi fondamentale, art. 101 ; le statut personnel des chrétiens (mariage, divorce) relève des tribunaux ecclésiastiques de leur communauté, qui appliquent ses propres règles (rapport CCPR/C/PSE/1, par. 275 et 383).", source: "https://docs.un.org/en/CCPR/C/PSE/1"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les élections législatives convoquées en 2021 ont été reportées par décret du 30 avril 2021 ; aucun Conseil législatif n'a été élu depuis 2006 et l'élection convoquée pour le 28 novembre 2026 n'a pas encore eu lieu. Les sièges réservés dans les conseils locaux ont été appliqués aux élections de 2021-2022 (Cisjordanie seulement) et du 25 avril 2026 (Cisjordanie et Deir al-Balah). Le Comité pour l'élimination de la discrimination raciale relève en 2019 le manque d'information sur la représentation des minorités dans les organes élus (CERD/C/PSE/CO/1-2, par. 23).", source: "https://docs.un.org/en/CERD/C/PSE/CO/1-2"}
chronologie:
  - {annee: 2003, evenement: "Loi fondamentale modifiée : les tribunaux religieux sont compétents en matière de statut personnel (art. 101)."}
  - {annee: 2008, evenement: "Décret présidentiel de reconnaissance de 13 Églises."}
  - {annee: 2012, evenement: "Décret présidentiel créant un comité supérieur des affaires des Églises."}
  - {annee: 2014, evenement: "Décret-loi n° 9 : exonération fiscale des communautés chrétiennes reconnues."}
  - {annee: 2015, evenement: "Accord global entre l'État de Palestine et le Saint-Siège sur les droits des membres de l'Église catholique."}
  - {annee: 2021, evenement: "Décret du 20 février : au moins 7 sièges du Conseil législatif pour les chrétiens ; report des élections générales par décret du 30 avril ; décret du 27 septembre sur les sièges réservés dans 10 conseils locaux."}
  - {annee: 2022, evenement: "Seconde phase des élections locales en Cisjordanie (26 mars)."}
  - {annee: 2025, evenement: "Décret-loi n° 23 sur l'élection des conseils locaux : règles d'attribution des sièges réservés (art. 52)."}
  - {annee: 2026, evenement: "Décret-loi du 11 janvier : sièges réservés dans 11 conseils locaux ; élections locales du 25 avril ; décret-loi n° 6 du 10 août : au moins 7 sièges du Conseil législatif ; élection législative convoquée pour le 28 novembre."}
