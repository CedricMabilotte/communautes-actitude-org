resume: >-
  Les Zhuang sont l'une des nationalités minoritaires reconnues par la Chine. La Région autonome zhuang du Guangxi, créée en 1958, relève du système d'autonomie régionale des nationalités prévu par la Constitution (art. 4 et 112 à 122) et par la loi de 1984 modifiée en 2001. Le droit prévoit des organes d'autogouvernement, un pouvoir de réglementation soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale et l'usage des langues locales. Le Guangxi a rédigé dix-neuf projets de règlement d'autonomie de 1958 à 1993 ; aucun n'a été approuvé. La loi sur la promotion de l'unité et du progrès des nationalités, en vigueur depuis le 1er juillet 2026, fait de la langue commune nationale (le mandarin standard) la langue de base de l'enseignement et de l'administration. Les districts autonomes situés dans la région relèvent de la fiche « Préfectures et districts autonomes de Chine ».
