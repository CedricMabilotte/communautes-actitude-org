droits:
  autogouvernement: {valeur: "partiel", note: "Organes d'autogouvernement (assemblée populaire et gouvernement de la région) ; le président de la région est un citoyen de la nationalité qui exerce l'autonomie (zhuang), Constitution, art. 112 et 114 ; loi sur l'autonomie régionale, art. 16 et 17 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  pouvoir_normatif: {valeur: "conteste", note: "L'assemblée peut adopter des règlements d'autonomie et des règlements séparés soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale, Constitution, art. 116 ; loi sur l'autonomie régionale, art. 19 (2001). Le projet de règlement d'autonomie de 1958 a été interrompu par les campagnes politiques ; ceux de 1987 et 1991, soumis au pouvoir central, ont été bloqués au stade de la consultation des ministères ; le dix-neuvième projet (1993) n'a pas été soumis. En 2017, aucune des cinq régions autonomes n'avait adopté de règlement d'autonomie ni de règlement séparé (Yang Feng, 2017).", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les organes d'autogouvernement définissent, conformément à la loi, la propriété et le droit d'usage des pâturages et des forêts, loi sur l'autonomie régionale, art. 27 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  ressources: {valeur: "partiel", note: "Gestion et protection des ressources naturelles et priorité d'exploitation dans le cadre des plans de l'État, loi sur l'autonomie régionale, art. 28 ; compensation due par l'État pour les ressources transférées hors de la région, art. 65 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Les organes d'autogouvernement emploient la ou les langues d'usage courant dans la localité, Constitution, art. 121 ; les tribunaux et parquets des zones autonomes utilisent la langue d'usage courant, loi sur l'autonomie régionale, art. 47 (2001). Depuis le 1er juillet 2026, les organes de l'État utilisent la langue commune nationale ; un document publié en langue minoritaire doit l'être aussi en langue commune, placée en premier dans l'espace public, loi sur la promotion de l'unité et du progrès des nationalités, art. 15 (2026).", source: "http://www.npc.gov.cn/npc/c2/c30834/202603/t20260313_453201.html"}
  education: {valeur: "partiel", note: "Les organes d'autogouvernement décident, selon les orientations de l'État, des programmes, des écoles et de la langue d'enseignement, loi sur l'autonomie régionale, art. 36 et 37 (2001). Depuis le 1er juillet 2026, la langue commune nationale est la langue de base de l'enseignement et les écoles utilisent les manuels nationaux unifiés, loi sur la promotion de l'unité et du progrès des nationalités, art. 15 et 16 (2026).", source: "http://www.npc.gov.cn/npc/c2/c30834/202603/t20260313_453201.html"}
  fiscalite: {valeur: "partiel", note: "Les finances de la zone autonome forment un niveau propre ; les recettes qui lui reviennent sont gérées par les organes d'autogouvernement, loi sur l'autonomie régionale, art. 32 (2001) ; Constitution, art. 117.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation onusienne ou indépendante de l'ensemble du régime d'autonomie au Guangxi n'a été trouvée. Une étude universitaire documente la non-application du pouvoir normatif : aucun règlement d'autonomie ni règlement séparé de la région n'a été approuvé depuis 1958, en raison notamment des objections des ministères centraux (Yang Feng, 2017).", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
chronologie:
  - {annee: 1958, evenement: "Création de la Région autonome du Guangxi (5 mars) ; premier projet de règlement d'autonomie adopté par l'assemblée du Guangxi."}
  - {annee: 1965, evenement: "Le caractère chinois désignant les Zhuang (僮) est remplacé par 壮 ; la région prend son nom actuel."}
  - {annee: 1982, evenement: "La Constitution consacre l'autonomie régionale des nationalités."}
  - {annee: 1987, evenement: "Un projet de règlement d'autonomie est soumis au pouvoir central, puis bloqué par les objections des ministères."}
  - {annee: 1991, evenement: "Dix-huitième projet de règlement d'autonomie, soumis puis rejeté."}
  - {annee: 1993, evenement: "Dix-neuvième projet, non soumis ; les travaux sont suspendus."}
  - {annee: 2001, evenement: "Révision de la loi sur l'autonomie régionale."}
  - {annee: 2026, evenement: "Adoption le 12 mars de la loi sur la promotion de l'unité et du progrès des nationalités, en vigueur le 1er juillet : langue commune nationale en langue de base de l'enseignement et de l'administration."}
