effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2018 qu'à la suite du conflit de 2017 entre le gouvernement fédéral et les républiques, l'enseignement obligatoire de leurs secondes langues officielles n'est plus possible, malgré les protestations du Tatarstan. Le suivi par le Conseil de l'Europe a pris fin avec le retrait de la Russie de la Convention-cadre le 1er août 2024.", source: "https://www.ecoi.net/en/file/local/2002328/4_OP_RussianFederation_en.docx.pdf"}
chronologie:
  - {annee: 1992, evenement: "Adoption de la Constitution de la République du Tatarstan (6 novembre)."}
  - {annee: 1993, evenement: "La Constitution fédérale inscrit le Tatarstan parmi les républiques de la Fédération."}
  - {annee: 2004, evenement: "La Cour constitutionnelle admet l'étude obligatoire du tatar (16 novembre)."}
  - {annee: 2017, evenement: "Inspections du parquet sur l'enseignement obligatoire des langues des républiques."}
  - {annee: 2018, evenement: "Avis du Comité consultatif de la Convention-cadre (20 février) ; loi fédérale 317-FZ rendant facultative l'étude des langues d'État des républiques (3 août)."}
  - {annee: 2021, evenement: "Loi fédérale interdisant le titre de président pour les chefs des sujets de la Fédération."}
  - {annee: 2023, evenement: "Révision de la Constitution du Tatarstan : le président devient raïs (chef) de la République à compter du 6 février."}
  - {annee: 2024, evenement: "Retrait de la Russie de la Convention-cadre pour la protection des minorités nationales (1er août)."}
  - {annee: 2025, evenement: "Première élection du raïs : Roustam Minnikhanov réélu avec 88,09 % des voix (résultats validés le 16 septembre)."}
