resume: >-
  Le Tatarstan est l'une des républiques de la Fédération de Russie (art. 65 de la Constitution fédérale). Son statut est fixé par la Constitution fédérale et par sa propre constitution, adoptée le 6 novembre 1992 (art. 66) ; hors des compétences fédérales et conjointes, il exerce le plein pouvoir d'État (art. 73). Le tatar et le russe y sont langues d'État (art. 8 de la Constitution du Tatarstan). En 2004, la Cour constitutionnelle a admis l'étude obligatoire du tatar dans les écoles de la République ; la loi fédérale de 2018 l'a rendue facultative. Depuis le 6 février 2023, le chef de la République porte le titre de raïs (chef) et non plus de président. Les autres républiques font l'objet de la fiche « Républiques nationales de Russie ».
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Fédération de Russie, ACFC/OP/IV(2018)001, adopté le 20 février 2018 : Tatars deuxième groupe national (3,87 % de la population de la Fédération au recensement de 2010) ; le Tatarstan a protesté contre la fin de l'enseignement obligatoire des secondes langues officielles des républiques. Aucun cinquième avis n'a été adopté : la Russie s'est retirée de la Convention-cadre avec effet au 1er août 2024.", annee: 2018, source: "https://www.ecoi.net/en/file/local/2002328/4_OP_RussianFederation_en.docx.pdf"}
