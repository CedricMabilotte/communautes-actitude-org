droits:
  autogouvernement: {valeur: "partiel", note: "La République a sa propre constitution, qui fixe son statut avec la Constitution fédérale (art. 66) ; ses institutions (Conseil d'État, raïs élu) sont territoriales et non réservées aux Tatars.", source: "https://www.consultant.ru/document/cons_doc_LAW_28399/d91fc17db4e2a338f5d23f6e14c724a338483baa/"}
  pouvoir_normatif: {valeur: "partiel", note: "Hors des compétences fédérales et des compétences conjointes, les sujets de la Fédération exercent le plein pouvoir d'État (Constitution fédérale, art. 73) ; les lois fédérales priment dans les domaines conjoints.", source: "https://www.consultant.ru/document/cons_doc_LAW_28399/cfb954800fba644bd8d1873945545cd9ac92ea34/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Le tatar et le russe sont langues d'État de la République, à égalité, dans ses organes de l'État et de l'autogouvernement local (Constitution du Tatarstan, art. 8) ; la Constitution fédérale permet aux républiques d'établir leurs langues d'État (art. 68-2).", source: "https://constitution.garant.ru/region/cons_tatar/chapter/31de5683116b8d79b08fa2d768e33df6/"}
  education: {valeur: "conteste", note: "La Cour constitutionnelle a admis en 2004 l'étude obligatoire du tatar et du russe à parts égales dans les écoles de la République ; depuis la loi fédérale 317-FZ du 3 août 2018, l'étude des langues d'État des républiques se fait sur demande des parents.", source: "https://eprints.gla.ac.uk/208165/1/208165.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
