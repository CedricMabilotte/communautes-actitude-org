resume: >-
  Le Tatarstan est l'une des républiques de la Fédération de Russie. Son statut est fixé par la Constitution fédérale et par sa propre constitution (art. 66), et il exerce le plein pouvoir d'État hors des compétences fédérales et conjointes (art. 73). Le tatar y est langue d'État aux côtés du russe (art. 68 de la Constitution fédérale). En 2004, la Cour constitutionnelle a admis l'étude obligatoire du tatar dans les écoles de la République ; la loi fédérale de 2018 l'a rendue facultative.
