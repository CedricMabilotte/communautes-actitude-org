  verifie: ["Art. 65, 66, 68 et 73 de la Constitution fédérale dans le texte révisé en 2020 (ConsultantPlus).", "Art. 8 de la Constitution du Tatarstan et date du 6 novembre 1992 (Garant ; date confirmée par Tatar-inform).", "Arrêt de la Cour constitutionnelle de 2004 et loi 317-FZ de 2018 (Jankiewicz, Knyaginina et Prina, 2020 ; texte de la loi publié par la Rossiïskaïa Gazeta).", "Quatrième avis du Comité consultatif, adopté le 20 février 2018 (texte intégral, ecoi.net) ; retrait de la Russie de la Convention-cadre au 1er août 2024 (Conseil de l'Europe).", "Changement de titre en raïs (RFE/RL, 23 décembre 2022 ; Radio Svoboda, 26 janvier 2023) et résultats de l'élection de 2025 (Tatar-inform).", "Nombre de Tatars au Tatarstan en 2021 (Tatar-inform, 10 janvier 2023)."]
