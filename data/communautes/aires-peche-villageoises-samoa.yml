resume: >-
  Fiche agrégée : elle couvre les villages côtiers du Samoa qui gèrent une aire villageoise de gestion des pêches (village fisheries management area). La loi sur la gestion des pêches de 2016 (Fisheries Management Act, n° 8 de 2016) permet au directeur général (Chief Executive Officer) du ministère de l'Agriculture et des Pêches de déclarer une telle aire par arrêté publié au Savali (journal officiel), après consultation du fono (conseil des chefs du village) concerné et des villages voisins (art. 19). Le fono adopte des règlements de pêche (by-laws) pour l'aire, approuvés par le Conseil des ministres ; un comité villageois de gestion, institué par le fono dans son plan de gestion approuvé, en assure le suivi (art. 2 et 86 à 89). Le régime prolonge le programme de gestion communautaire des pêches lancé en 1995 ; en 2022, 111 sites étaient actifs et 123 villages couverts. Il est distinct du régime général des conseils de village fixé par la loi sur le fono de village de 1990.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Samoa à la Convention sur la diversité biologique (daté de 2018, mis en ligne par le secrétariat en 2019) : il décrit le programme de gestion communautaire des pêches (Community Based Fisheries Management Program), 106 villages participants et 78 règlements villageois approuvés, 109 plans villageois de gestion des pêches, et cite la loi sur la gestion des pêches de 2016 ; le même rapport indique que le Samoa n'a pas de groupes autochtones au sens de la définition onusienne", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/ws-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Fisheries Management Act 2016 (n° 8 de 2016), art. 2 (définitions), 19 (aires villageoises de gestion des pêches), 22 (communautés villageoises sans accès direct à la mer), 41 (aquaculture dans les aires villageoises) et 86 à 89 (règlements villageois de pêche) ; abroge la loi sur les pêches de 1988 (art. 93)", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
  - {instrument: "Village Fono Act 1990, art. 2 (définition du fono de village, à laquelle renvoie la loi de 2016) et art. 3 (registre des fono, validation de leur autorité exercée selon la coutume du village) ; les sanctions infligées par le fono en vertu de cette loi sont prises en compte par l'art. 88 (3) de la loi de 2016 (articles cités par le guide juridique de la Communauté du Pacifique)", nature: "loi", annee: 1990, source: "https://purl.org/spc/digilib/doc/s5b7j"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le fono de village, défini par la loi sur le fono de village de 1990, adopte les règlements de l'aire ; le comité villageois de gestion des pêches est institué par le fono dans le cadre de son plan de gestion approuvé (Fisheries Management Act 2016, art. 2) et suit l'application des règlements (art. 87). La déclaration de l'aire relève du directeur général du ministère (art. 19 (1)).", source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le fono peut adopter des règlements de pêche pour l'aire : interdiction de certaines espèces ou méthodes, fermetures périodiques, tailles minimales, maillage des filets, restrictions à l'importation ou à l'exportation de poisson, activités nuisibles au milieu marin (art. 86 (1), loi de 2016). Ces règlements doivent être examinés par l'Attorney General (procureur général), approuvés par le Conseil des ministres, signés par le directeur général et publiés au Savali (art. 86 (2)) ; le directeur général peut les suspendre ou les abroger sur avis du fono (art. 89) ; leur violation est punie jusqu'à 1 000 unités de pénalité ou douze mois d'emprisonnement (art. 88 (1)).", source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
  justice_propre: {valeur: "partiel", note: "La sanction infligée par le fono en vertu de la loi sur le fono de village de 1990 doit être prise en compte par le directeur général ou le commissaire de police avant de poursuivre, et par le tribunal comme circonstance atténuante (art. 88 (3), loi de 2016) ; le tribunal peut ordonner que l'amende soit versée au fonds du fono dont le règlement a été violé (art. 88 (2)). Les poursuites pénales relèvent des tribunaux de l'État.", source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
  terres: {valeur: "partiel", note: "Le directeur général du ministère déclare et balise l'aire de gestion villageoise des pêches par arrêté publié au Savali (journal officiel), après consultation du fono (conseil de village) et des villages voisins, en tenant compte de la propriété coutumière des terres et des pratiques de pêche traditionnelles (Fisheries Management Act 2016, art. 19) ; la gestion de la pêche côtière y passe par les règlements du fono (art. 86) ; la loi ne confère pas de propriété sur les eaux.", source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
  ressources: {valeur: "partiel", note: "La gestion de la pêche côtière dans l'aire passe par les règlements du fono (art. 86) ; le comité villageois de gestion délivre les autorisations d'aquaculture dans l'aire et peut proposer des règlements à ce sujet (art. 41 (2)). Une communauté villageoise qui doit traverser les terres d'un village côtier pour accéder à la mer a droit à une participation égale à la gestion de l'aire lorsqu'existent des liens traditionnels, familiaux ou claniques, la propriété de terres riveraines ou d'autres arrangements avec le village côtier (art. 22). Le sous-sol et la pêche hauturière ne sont pas visés.", source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
  consentement: {valeur: "partiel", note: "Avant de déclarer une aire, le directeur général doit consulter le fono du village et ceux des villages voisins, en tenant compte notamment de la propriété coutumière des terres et des pratiques de pêche traditionnelles (art. 19 (2), loi de 2016). La loi impose une consultation, pas un consentement ; les litiges sur la déclaration sont tranchés par le ministre (art. 19 (3)).", source: "https://faolex.fao.org/docs/pdf/sam164690.pdf"}
