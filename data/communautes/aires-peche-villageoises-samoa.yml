effectivite: {valeur: "partielle", note: "L'enquête de la Communauté du Pacifique publiée en décembre 2022 compte 111 sites actifs, tous dotés d'un plan villageois de gestion des pêches, 97 sites en cours et 14 sites inactifs, soit 123 villages couverts sur 253 villages côtiers ; elle relève qu'aucun inventaire public des sites n'existe et que la liste n'est disponible que sur demande auprès de la division des pêches. Le sixième rapport national à la CDB (2019) compte 78 règlements villageois approuvés pour 106 à 109 villages participants.", source: "https://purl.org/spc/digilib/doc/H_uNgzxUo7kB36r"}
chronologie:
  - {annee: 1988, evenement: "Loi sur les pêches : les règles des villages peuvent recevoir une valeur juridique sous forme de règlements de pêche (by-laws)."}
  - {annee: 1990, evenement: "Loi sur le fono de village : définition du fono comme assemblée des chefs (alii et faipule) du village."}
  - {annee: 1995, evenement: "Lancement par la division des pêches, avec l'aide australienne, du programme de vulgarisation qui devient le programme de gestion communautaire des pêches."}
  - {annee: 2001, evenement: "Une revue de la Communauté du Pacifique compte 71 villages ayant travaillé avec le programme depuis 1995, dont 67 encore actifs."}
  - {annee: 2016, evenement: "Loi sur la gestion des pêches (n° 8, sanctionnée le 9 février 2016) : aires villageoises de gestion des pêches, comités villageois et règlements de pêche ; abrogation de la loi de 1988."}
  - {annee: 2019, evenement: "Sixième rapport national à la CDB : 106 villages participants et 78 règlements villageois approuvés."}
  - {annee: 2022, evenement: "Enquête de la Communauté du Pacifique : 111 sites actifs, 123 villages couverts sur 253 villages côtiers, 566,1 ha de sites."}
fiabilite:
  verifie: ["Texte de la loi sur la gestion des pêches de 2016 (FAOLEX et site du ministère de l'Agriculture et des Pêches) : art. 2, 19, 22, 41, 86 à 89 et 93 ; date de sanction le 9 février 2016.", "Chiffres 2022 (111 sites actifs, 97 en cours, 14 inactifs, 123 villages couverts, 253 villages côtiers, 566,1 ha dont 507,6 ha fermés) : rapport d'enquête de la Communauté du Pacifique (Govan et Lalavanua, décembre 2022) ; mêmes chiffres sur la page Samoa du portail CBFM de la Communauté du Pacifique.", "Sixième rapport national à la CDB (2019) : 106 villages participants et 78 règlements approuvés (section 2.3.3), 109 plans de gestion et 76 villages dotés de règlements (tableau des indicateurs).", "Revue de 2001 (Fa'asili et Taua) : rôle de la loi de 1988, 71 villages depuis 1995, 67 actifs.", "Page de la division des pêches du ministère : plus de 120 villages côtiers ont rejoint le programme, 80 % pleinement actifs."]
  non_confirme: ["Date d'entrée en vigueur de la loi de 2016, fixée par le ministre (art. 1 (2)) : non trouvée.", "Nombre d'aires formellement déclarées par arrêté au Savali au titre de l'art. 19 : non trouvé ; les chiffres disponibles portent sur les sites du programme, pas sur les arrêtés.", "Aucune liste officielle publique des sites : l'enquête de 2022 indique que la liste n'est disponible que sur demande ; pas de tableau des sites pour cette raison.", "Le texte de la loi sur le fono de village de 1990 n'a pas pu être ouvert directement ; sa définition du fono est citée d'après le guide juridique de la Communauté du Pacifique (2023).", "Population des villages couverts : aucun chiffre trouvé.", "Le programme de droits d'usage du district de Safata (dix réserves sans prélèvement, d'après Climate Champions, 2024) n'a pas été rattaché avec certitude à un arrêté de l'art. 19."]
