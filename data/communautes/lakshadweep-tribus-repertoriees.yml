base_nationale:
  - {instrument: "Constitution (Scheduled Tribes) (Union Territories) Order, 1951, partie I (Lakshadweep), prise au titre de l'article 342 de la Constitution, telle que modifiée", nature: "loi", annee: 1951, source: "https://indiankanoon.org/doc/34302524/"}
  - {instrument: "Laccadive, Minicoy and Amindivi Islands (Protection of Scheduled Tribes) Regulation, 1964, promulgué par le Président au titre de l'article 240 de la Constitution, modifié en 1973", nature: "loi", annee: 1964, source: "https://indiankanoon.org/doc/1820687/"}
  - {instrument: "Laccadive, Minicoy and Amindivi Islands (Restrictions on Entry and Residence) Rules, 1967, pris au titre de l'article 9 du règlement no 8 de 1965", nature: "loi", annee: 1967, source: "https://cdn.s3waas.gov.in/s358238e9ae2dd305d79c2ebc8c1883422/uploads/2018/05/2018050467.pdf"}
  - {instrument: "Lakshadweep Panchayat Regulation, 2022 (règlement no 5 de 2022, promulgué par le Président le 19 septembre 2022 au titre de l'article 240 de la Constitution)", nature: "loi", annee: 2022, source: "https://cdnbbsr.s3waas.gov.in/s32b8eba3cb0d0f1d761cb74d94a5ace36/uploads/2024/08/202408271408443684.pdf"}
droits:
  autogouvernement: {valeur: "conteste", note: "Le règlement de 2022 prévoit une assemblée de village (Gram Sabha), un panchayat de village élu au suffrage direct (art. 4 et 12) et un panchayat de district (art. 57 et 58), avec sièges et présidences réservés aux tribus répertoriées (art. 12 (6) et (10), 58 (5), 66 (5)) ; ces conseils sont ceux de toute la population du territoire. Les élections prévues après l'expiration des mandats en décembre 2022 n'ont pas eu lieu en raison d'un recours devant la Haute Cour du Kerala, et l'administrateur a nommé des fonctionnaires spéciaux (Special Officers) qui dirigent les panchayats, selon la direction des panchayats du territoire.", source: "https://lakshadweep.gov.in/departments/directorate-of-panchayats/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Aucun membre des tribus répertoriées ne peut céder une terre (vente, hypothèque, bail, échange, don) sans autorisation préalable de l'administrateur, sauf à l'État, à une banque, à une coopérative ou à un autre membre (art. 3 (1)) ; toute cession contraire est nulle (art. 3 (3)) ; nul ne peut acquérir un droit sur une terre sans cette autorisation (art. 3 (4)) ; seuls les membres peuvent enchérir lors d'une vente forcée (art. 4), règlement de 1964 tel que cité par la Haute Cour du Kerala en 2008 ; la propriété reste individuelle.", source: "https://indiankanoon.org/doc/1820687/"}
  ressources: {valeur: "partiel", note: "Les revenus des pêcheries gérées par le panchayat de village alimentent son fonds (art. 38 (2) (g)) ; l'administrateur peut placer sous la gestion du panchayat les terrains vagues et de pâture, puits, étangs et réservoirs publics (art. 40), règlement de 2022 ; la pêche figure parmi ses compétences (deuxième annexe, B 5). Ces compétences sont exercées, faute d'élection, par des fonctionnaires désignés par l'administrateur.", source: "https://cdnbbsr.s3waas.gov.in/s32b8eba3cb0d0f1d761cb74d94a5ace36/uploads/2024/08/202408271408443684.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'enseignement, écoles primaires et secondaires comprises, figure parmi les compétences du panchayat de village dans la limite de son fonds (art. 31 et deuxième annexe, B 17), et l'assemblée de village forme un comité de l'éducation (art. 11), règlement de 2022 ; faute d'élection, ces compétences sont exercées par des fonctionnaires désignés par l'administrateur.", source: "https://cdnbbsr.s3waas.gov.in/s32b8eba3cb0d0f1d761cb74d94a5ace36/uploads/2024/08/202408271408443684.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds propre de chaque panchayat de village (art. 38) ; taxes sur les bâtiments, les professions, les spectacles, redevances de pâture et autres taxes approuvées par l'administrateur (art. 41), règlement de 2022 ; le directeur général (Chief Executive Officer) du panchayat de district peut suspendre une taxe (art. 43) ; faute d'élection, le panchayat est dirigé par un fonctionnaire désigné par l'administrateur.", source: "https://cdnbbsr.s3waas.gov.in/s32b8eba3cb0d0f1d761cb74d94a5ace36/uploads/2024/08/202408271408443684.pdf"}
  representation: {valeur: "reconnu", note: "La seule circonscription du Lakshadweep à la Lok Sabha (chambre basse du Parlement) est réservée aux tribus répertoriées, selon l'administration du territoire.", source: "https://lakshadweep.gov.in/about-lakshadweep/administrative-setup/constituencies/"}
  statut_personnel: {valeur: "reconnu", note: "Sont tribus répertoriées les habitants des îles qui, ainsi que leurs deux parents, y sont nés, ainsi que les enfants d'habitants des îles nés sur le continent indien s'ils s'installent durablement dans les îles (ordonnance de 1951, partie I, telle que modifiée) ; sauf exceptions (fonctionnaires, militaires, résidents installés avant 1967, visiteurs autorisés), aucune personne non native ne peut entrer ou résider dans les îles sans permis (règle 3, règles de 1967).", source: "https://indiankanoon.org/doc/34302524/"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Haute Cour du Kerala applique le règlement de 1964 : en 2008 elle déclare nuls des baux consentis sans autorisation à une société de tourisme, et en 2025 elle refuse d'annuler les poursuites engagées pour des baux consentis à une fondation enregistrée à Calicut, sur le continent ; les panchayats élus prévus par le règlement de 2022 n'ont pas été constitués et sont dirigés par des fonctionnaires désignés ; en 2026, l'administration soumet à consultation un projet d'article 2A qui permettrait au collecteur de district d'autoriser des cessions de terres agricoles à des entreprises industrielles et à des usages non agricoles, contesté par le député du territoire et des avocats des îles.", source: "https://thesouthfirst.com/beyond-south/lakshadweep-land-amendment-triggers-fears-over-tribal-land-and-demographic-change/"}
chronologie:
  - {annee: 1951, evenement: "Ordonnance présidentielle inscrivant les habitants nés dans les îles, et dont les deux parents y sont nés, comme tribus répertoriées."}
  - {annee: 1956, evenement: "Les îles, jusque-là rattachées à l'État de Madras, forment un territoire de l'Union le 1er novembre."}
  - {annee: 1964, evenement: "Règlement présidentiel sur la protection des tribus répertoriées : cessions de terres soumises à autorisation ; le siège de l'administration passe de Calicut à Kavaratti en mars."}
  - {annee: 1967, evenement: "Règles sur l'entrée et la résidence, en vigueur le 1er octobre : permis obligatoire pour les non-natifs ; première élection du député du territoire."}
  - {annee: 1973, evenement: "La Haute Cour du Kerala rejette un recours contre le régime de permis (Kanjirakkade Koya c. Union indienne, 27 novembre)."}
  - {annee: 1994, evenement: "Premier règlement sur les panchayats, promulgué le 23 avril ; premiers panchayats de village constitués en décembre 2002."}
  - {annee: 2008, evenement: "La Haute Cour du Kerala déclare nuls des baux consentis sans autorisation de l'administrateur à une société de tourisme (14 novembre)."}
  - {annee: 2022, evenement: "Règlement présidentiel sur les panchayats du 19 septembre ; le mandat des conseils en place expire le 17 décembre, le découpage des circonscriptions est contesté devant la Haute Cour du Kerala."}
  - {annee: 2026, evenement: "Projet d'amendement du règlement de 1964 (nouvel article 2A) soumis à consultation publique pendant 30 jours ; objections du député du territoire."}
fiabilite:
  verifie: ["Définition des tribus répertoriées du Lakshadweep dans l'ordonnance de 1951 et sa clause sur les enfants nés sur le continent (Haute Cour du Kerala, 31 mai 2024, et 3 avril 2008, Indian Kanoon).", "Articles 3 (1), 3 (3), 3 (4), 4, 5 et 6 du règlement de 1964 tels que cités par la Haute Cour du Kerala (14 novembre 2008, Indian Kanoon).", "Règle 3 des règles de 1967 sur l'entrée et la résidence (texte publié par l'administration du territoire).", "Règlement de 2022 sur les panchayats : art. 11, 12, 31, 38, 40, 41, 43, 54, 66 et deuxième annexe (Gazette of India, 19 septembre 2022).", "Population 2011, surface, 36 îles dont 10 habitées, circonscription réservée (site de l'administration du territoire).", "Abrogation du règlement de 1994, élections des panchayats non tenues et nomination de fonctionnaires spéciaux (page de la direction des panchayats du territoire).", "Projet d'article 2A et objections (The South First, 29 mai 2026)."]
  non_confirme: ["Texte intégral du règlement de 1964 et texte officiel du projet d'amendement de 2026 : non consultés ; contenu connu par la jurisprudence et par une source de presse.", "Nombre de membres des tribus répertoriées au recensement de 2011 : non trouvé sur une source officielle ouverte.", "Nombre de panchayats de village notifiés en novembre 2022 sous le règlement de 2022 : non trouvé ; un arrêt de la Haute Cour du Kerala du 20 décembre 2022 indique qu'une île peut désormais être partagée entre plusieurs panchayats.", "Date de nomination des fonctionnaires spéciaux et état du recours devant la Haute Cour du Kerala : non vérifiés.", "Aucun document onusien nommant les insulaires du Lakshadweep n'a été trouvé.", "Langues (malayalam, jeseri, mahl à Minicoy) : aucun statut officiel propre trouvé."]
