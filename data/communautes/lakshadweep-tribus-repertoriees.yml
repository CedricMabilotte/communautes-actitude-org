resume: >-
  Les habitants nés dans les îles Laquedives, Minicoy et Amindivi, ainsi que leurs deux parents, sont inscrits comme tribus répertoriées (Scheduled Tribes, catégorie protégée par la Constitution indienne) par l'ordonnance présidentielle de 1951. Le règlement présidentiel de 1964 sur la protection des tribus répertoriées soumet toute cession de terre par un membre de ces tribus à l'autorisation de l'administrateur, sauf au profit de l'État, d'une banque, d'une coopérative ou d'un autre membre, et déclare nulle toute cession contraire. Les règles de 1967 soumettent l'entrée et la résidence des non-natifs à un permis. Le règlement de 2022 sur les panchayats (conseils locaux élus) réserve aux tribus répertoriées des sièges et des présidences en proportion de leur population ; faute d'élection, les panchayats sont administrés par des fonctionnaires désignés par l'administrateur. Un projet d'amendement du règlement de 1964 publié en 2026 ouvrirait des exceptions aux restrictions foncières et est contesté.
