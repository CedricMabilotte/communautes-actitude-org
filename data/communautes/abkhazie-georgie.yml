resume: >-
  La Constitution de la Géorgie de 2018 fait de l'Abkhazie une république autonome, où l'abkhaze est langue officielle à côté du géorgien (art. 2, al. 3), et renvoie la fixation de ses pouvoirs à une loi constitutionnelle (art. 7, al. 2). L'organe représentatif suprême de la république autonome a l'initiative législative au Parlement géorgien et ses membres siègent au collège électoral qui élit le président. Depuis la guerre de 1992-1993, le territoire est contrôlé par des autorités de fait qui ont proclamé l'indépendance en 1999 ; la loi géorgienne de 2008 le qualifie de territoire occupé. Le Conseil suprême et le gouvernement de la république autonome reconnus par la Géorgie siègent à Tbilissi.
