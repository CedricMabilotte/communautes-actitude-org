reconnaissance_onu:
  - {mecanisme: "mission_onu", detail: "Mission d'observation des Nations unies en Géorgie (MONUG), créée par la résolution 858 du Conseil de sécurité du 24 août 1993 pour vérifier l'Accord de cessez-le-feu du 27 juillet 1993 entre la République de Géorgie et les forces en Abkhazie ; la résolution 1808 (2008), § 12, appuie les principes énoncés dans la « Note sur les principes de base concernant la répartition des compétences entre Tbilissi et Soukhoumi ». Mission close en juin 2009 faute de consensus au Conseil de sécurité sur la prolongation du mandat.", annee: 1993, source: "https://documents.un.org/doc/undoc/gen/n93/466/04/pdf/n9346604.pdf"}
base_nationale:
  - {instrument: "Constitution de la Géorgie, art. 2 (al. 3), 7 (al. 2 et 3), 37, 45 (al. 1) et 50 (al. 3)", nature: "constitution", annee: 2018, source: "https://www.constituteproject.org/constitution/Georgia_2018"}
  - {instrument: "Constitution de la République autonome d'Abkhazie, art. 1, 3, 11, 12 et 13 (texte publié par le gouvernement de la république autonome, signé le 21 novembre 2019)", nature: "statut_autonomie", annee: 2019, source: "https://abkhazia.gov.ge/law/11"}
  - {instrument: "Loi de la Géorgie sur les territoires occupés (n° 431, 23 octobre 2008)", nature: "loi", annee: 2008, source: "https://matsne.gov.ge/en/document/view/19132"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution géorgienne de 2018 mentionne l'organe représentatif suprême de la république autonome (art. 45, al. 1) et renvoie ses pouvoirs à une loi constitutionnelle (art. 7, al. 2) ; la Constitution de la république autonome institue un Conseil suprême (art. 3) et un gouvernement responsable devant le gouvernement géorgien et le Conseil suprême, dont le président est nommé avec l'accord du gouvernement géorgien (art. 11 et 12) ; ces organes siègent à Tbilissi.", source: "https://abkhazia.gov.ge/law/11"}
  pouvoir_normatif: {valeur: "partiel", note: "Le gouvernement de la république autonome publie une constitution de la république autonome, une loi sur sa structure et ses pouvoirs et une loi sur les actes normatifs ; ces textes ne s'appliquent pas sur le territoire contrôlé par les autorités de fait.", source: "https://abkhazia.gov.ge/law"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "L'abkhaze est langue officielle en République autonome d'Abkhazie à côté du géorgien, Constitution de 2018, art. 2, al. 3.", source: "https://www.constituteproject.org/constitution/Georgia_2018"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le Conseil suprême adopte chaque année une loi de budget de la république autonome, Constitution de la république autonome, art. 13 ; les finances publiques et la législation fiscale relèvent de la compétence exclusive de l'État géorgien, Constitution de la Géorgie, art. 7, al. 1, e.", source: "https://abkhazia.gov.ge/law/11"}
  representation: {valeur: "partiel", note: "L'organe représentatif suprême de la république autonome a l'initiative législative (art. 45, al. 1) et ses membres siègent au collège électoral qui élit le président (art. 50, al. 3) ; le Sénat prévu à l'art. 37, al. 1, avec des membres élus en Abkhazie, ne sera créé qu'après le rétablissement de la juridiction géorgienne sur tout le territoire.", source: "https://www.constituteproject.org/constitution/Georgia_2018"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Minority Rights Group décrit une sécession de fait depuis la guerre de 1992-1993 et la reconnaissance de l'indépendance par la Russie en août 2008, puis par le Nicaragua ; les institutions de la république autonome reconnues par la Géorgie n'exercent pas de compétence sur le territoire, que la loi géorgienne de 2008 (art. 2 et 8) qualifie de territoire occupé.", source: "https://minorityrights.org/country/abkhazia/"}
chronologie:
  - {annee: 1931, evenement: "Création de la République socialiste soviétique autonome d'Abkhazie au sein de la Géorgie."}
  - {annee: 1993, evenement: "Fin de la guerre de 1992-1993 ; création de la Mission d'observation des Nations unies en Géorgie (résolution 858, 24 août)."}
  - {annee: 1994, evenement: "Accord de Moscou sur le cessez-le-feu et la séparation des forces (14 mai)."}
  - {annee: 1999, evenement: "Les autorités de fait proclament l'indépendance."}
  - {annee: 2006, evenement: "Le gouvernement reconnu par la Géorgie s'installe dans la haute vallée de la Kodori ; il revient à Tbilissi en 2008."}
  - {annee: 2008, evenement: "Résolution 1808 du Conseil de sécurité (15 avril) ; guerre d'août ; reconnaissance de l'indépendance par la Russie ; loi géorgienne sur les territoires occupés (23 octobre)."}
  - {annee: 2009, evenement: "Fin de la mission d'observation des Nations unies (juin)."}
  - {annee: 2018, evenement: "Entrée en vigueur de la nouvelle rédaction de la Constitution de la Géorgie (art. 2, 7, 37, 45, 50)."}
  - {annee: 2024, evenement: "Démission d'Aslan Bjania, président des autorités de fait, après des manifestations contre un accord ouvrant l'achat de biens immobiliers à des investisseurs russes (novembre)."}
  - {annee: 2025, evenement: "Badra Gounba élu président par les autorités de fait au second tour du 1er mars ; Guiorgui Jintcharadzé nommé président du gouvernement de la république autonome reconnu par la Géorgie (11 juin)."}
