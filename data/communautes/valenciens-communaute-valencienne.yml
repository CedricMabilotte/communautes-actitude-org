resume: >-
  Le Statut d'autonomie de 1982 (loi organique 5/1982), réformé en 2006 (loi organique 1/2006), constitue le « peuple valencien » en Communauté autonome ; la réforme de 2006 le qualifie de nationalité historique. Les Corts valencianes (Parlement régional) exercent le pouvoir législatif et votent le budget de la Generalitat. Le valencien est langue propre et officielle avec le castillan ; la loi 4/1983 délimite des communes de prédominance linguistique valencienne et castillane. Le Statut prévoit la récupération du droit foral (droit historique propre) du royaume de Valence ; le Tribunal constitutionnel a annulé en 2016 la loi valencienne sur le régime matrimonial.
reconnaissance_regionale:
  - {mecanisme: "charte_langues_regionales", detail: "La Charte européenne des langues régionales ou minoritaires, ratifiée par l'Espagne en 2001, couvre le catalan, « appelé valencien dans la Communauté valencienne » ; rapport du Comité d'experts publié le 24 septembre 2024.", annee: 2024, source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
