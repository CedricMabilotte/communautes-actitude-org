droits:
  autogouvernement: {valeur: "reconnu", note: "La Generalitat réunit les institutions d'autogouvernement : Corts valencianes, President et Consell (gouvernement), Statut, art. 20 ; les Corts comptent au moins 99 députés élus au suffrage universel direct, art. 23.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le pouvoir législatif appartient aux Corts, qui représentent le peuple, Statut, art. 21 ; compétence exclusive sur la conservation, le développement et la modification du droit civil foral valencien, art. 49.1.2 ; l'arrêt 82/2016 du Tribunal constitutionnel limite cette compétence aux règles légales ou coutumières valenciennes en vigueur à l'entrée en vigueur de la Constitution de 1978 et aux institutions qui leur sont liées.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  justice_propre: {valeur: "partiel", note: "Le Tribunal supérieur de justice de la Communauté valencienne, juridiction de l'État, est l'organe où culmine l'organisation judiciaire sur le territoire, Statut, art. 33 ; il juge en cassation de façon exclusive les affaires de droit civil foral valencien, art. 37.2 ; la Generalitat concourt à l'organisation des tribunaux coutumiers et traditionnels, en particulier du Tribunal des Eaux de la Vega de Valence, art. 36.1.3ª.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur les montes (terres boisées et pastorales), les aménagements forestiers, les voies de transhumance et les pâturages, dans le cadre de la législation de base de l'État, Statut, art. 49.1.10.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur les aménagements hydrauliques lorsque les eaux coulent entièrement sur le territoire, sur les eaux minérales, thermales et souterraines, Statut, art. 49.1.16, et sur la pêche en eaux intérieures et le ramassage des coquillages, art. 49.1.17 ; régime minier et énergétique en développement de la législation de l'État, art. 50.5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige un vote des Corts à la majorité des deux tiers (majorité simple pour une seule extension de compétences), son adoption par les Cortes Generales (Parlement de l'État) en loi organique, puis un référendum de ratification des électeurs, facultatif pour une seule extension de compétences, Statut, art. 81 et disposition transitoire cinquième.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  langue: {valeur: "reconnu", note: "Le valencien est la langue propre de la Communauté valencienne et langue officielle avec le castillan, Statut, art. 6 ; l'Acadèmia Valenciana de la Llengua en fixe la norme, art. 6.8 ; la loi 4/1983 liste les communes de prédominance linguistique valencienne et castillane, art. 35 et 36.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  education: {valeur: "reconnu", note: "Compétence exclusive sur la réglementation et l'administration de l'enseignement à tous les niveaux, sous réserve de l'article 27 de la Constitution et de la haute inspection de l'État, Statut, art. 53 ; l'enseignement du valencien est obligatoire à tous les niveaux, loi 4/1983, art. 18, avec une incorporation progressive dans les communes de langue castillane ; la loi 1/2024 donne aux familles le choix de la langue de base (valencien ou castillan) de l'enseignement, art. 9, et ouvre dans les communes de prédominance castillane une exemption sans limite de durée de l'évaluation du valencien, art. 14.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  fiscalite: {valeur: "partiel", note: "Finances de la Generalitat fondées sur les principes d'autonomie, de suffisance et de solidarité, Statut, art. 67 ; ressources composées d'impôts propres, de rendements des impôts cédés par l'État et de surtaxes, art. 72 ; le Servei Tributari Valencià gère les impôts propres, art. 69.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  representation: {valeur: "partiel", note: "Les Corts désignent les sénateurs qui représentent la Communauté valencienne au Sénat, Statut, art. 22, lettre j.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  statut_personnel: {valeur: "partiel", note: "La condition politique de Valencien est attribuée aux citoyens espagnols ayant leur domicile administratif dans une commune de la Communauté, Statut, art. 3.1 ; le droit civil foral valencien s'applique aux personnes de vecindad civil (rattachement civil) valencienne, quel que soit leur lieu de résidence, art. 3.4.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1982-17235"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Tribunal constitutionnel a déclaré inconstitutionnelle et nulle en totalité la loi valencienne 10/2007 sur le régime économique matrimonial (arrêt 82/2016), faute de rattachement au droit civil historique ou coutumier valencien ; le Comité d'experts de la Charte relève en 2024 des lacunes dans l'usage des langues régionales dans la justice, la santé et l'administration de l'État.", source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2016-5194"}
chronologie:
  - {annee: 1982, evenement: "Statut d'autonomie de la Communauté valencienne (loi organique 5/1982 du 1er juillet)."}
  - {annee: 1983, evenement: "Loi 4/1983 du 23 novembre sur l'usage et l'enseignement du valencien."}
  - {annee: 2001, evenement: "L'Espagne ratifie la Charte européenne des langues régionales ou minoritaires, qui couvre le valencien."}
  - {annee: 2006, evenement: "Réforme du Statut (loi organique 1/2006 du 10 avril) : nationalité historique, récupération du droit foral."}
  - {annee: 2007, evenement: "Les Corts adoptent la loi 10/2007 du 20 mars sur le régime économique matrimonial valencien."}
  - {annee: 2016, evenement: "Arrêt 82/2016 du Tribunal constitutionnel (28 avril) : nullité de la loi 10/2007."}
  - {annee: 2019, evenement: "Loi organique 3/2019 du 12 mars : ajout de l'article 52.4 sur la part des investissements de l'État dans la Communauté."}
  - {annee: 2024, evenement: "Loi 1/2024 du 27 juin sur la liberté éducative : choix de la langue de base par les familles, abrogation de la loi 4/2018 sur le plurilinguisme."}
