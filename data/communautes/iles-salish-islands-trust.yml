resume: >-
  L'Islands Trust est un organe de gouvernement local à objet spécial (special purpose government) créé en 1974 par la Colombie-Britannique pour les îles situées entre l'île de Vancouver et le continent. Sa loi (Islands Trust Act, RSBC 1996, ch. 239) lui donne pour objet de « préserver et protéger » la zone, ses agréments et son environnement, au bénéfice de ses résidents et de la province. Dans chacune des 12 zones de fiducie locales, les électeurs élisent 2 administrateurs (trustees) qui forment, avec un membre du comité exécutif, un comité local chargé de l'aménagement du territoire à la place du district régional. Le conseil du Trust réunit ces 24 élus et 2 représentants de la municipalité de Bowen Island ; les réserves au sens de la Loi sur les Indiens et, si le traité le prévoit, les terres des Premières Nations signataires de traités sont exclues de la zone.
