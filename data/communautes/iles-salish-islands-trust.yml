base_nationale:
  - {instrument: "Islands Trust Act (RSBC 1996, ch. 239), loi de Colombie-Britannique adoptée en 1974, modifiée notamment en 1977, 1989, 2000, 2002 et 2021", nature: "loi", annee: 1974, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96239_01"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque zone de fiducie locale élit 2 administrateurs (art. 6) qui siègent au comité local avec un membre du comité exécutif nommé par la présidence du conseil (art. 23) ; le district régional ne peut ni exercer ces compétences ni adopter un règlement contraire à ceux du comité local (art. 35-36) ; le conseil peut toutefois recevoir des instructions du ministre ou du lieutenant-gouverneur en conseil (art. 8(1)(f)), et l'inspecteur des municipalités peut ouvrir une enquête (art. 51).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96239_01"}
  pouvoir_normatif: {valeur: "partiel", note: "Les comités locaux ont les pouvoirs d'un district régional en matière d'aménagement, de zonage et de lotissement (Islands Trust Act, art. 29) ; leurs règlements n'ont d'effet qu'après approbation du comité exécutif ou du conseil du Trust, doivent respecter la déclaration de politique du Trust (trust policy statement, art. 15), et ceux qui adoptent ou modifient un plan d'urbanisme (official community plan) exigent l'approbation du ministre (art. 27), comme certains règlements de zonage (art. 56) ; le Trust doit aussi approuver les règlements d'urbanisme de la municipalité de Bowen Island (art. 38).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96239_01"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les comités locaux exercent les pouvoirs du district régional sur l'extraction et le dépôt de sable, de gravier et de terre (Islands Trust Act, art. 29(1)(a)(ii)) ; l'Islands Trust Conservancy (organe de conservation du Trust) peut acquérir et détenir des terres pour l'objet du Trust (art. 41) ; la loi ne confère pas d'autre compétence sur les ressources naturelles.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96239_01"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil adopte chaque année un budget par règlement, soumis à l'approbation du ministre (art. 14) ; les coûts sont recouvrés par un impôt foncier (property value tax, impôt sur la valeur des biens) que le ministre des Finances ou la municipalité de Bowen Island prélève dans la zone du Trust sur réquisition du ministre (art. 47-49) ; dans les zones qu'il désigne par règlement avec le consentement du district régional, le conseil peut accorder des exonérations d'impôt foncier aux terrains grevés d'un engagement de protection (covenant, art. 219 du Land Title Act) en faveur d'un organe du Trust (art. 49.1-49.8) ; les comités locaux ne peuvent pas emprunter (art. 24(3)).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96239_01"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le conseil, le comité exécutif et les comités locaux du Trust siègent et exercent leurs compétences ; par une lettre datée du 28 avril 2025, le ministre du Logement et des Affaires municipales a refusé la révision du mandat et de la gouvernance demandée par le conseil en octobre 2024, en rappelant que l'aménagement du territoire pour « préserver et protéger » la zone est la responsabilité centrale du Trust (Gulf Islands Driftwood, 21 mai 2025).", source: "https://gulfislandsdriftwood.com/province-turns-down-trust-review-request-again/"}
chronologie:
  - {annee: 1974, evenement: "La Colombie-Britannique crée l'Islands Trust par l'Islands Trust Act."}
  - {annee: 1977, evenement: "La loi confie au Trust la compétence d'aménagement du territoire."}
  - {annee: 1987, evenement: "Création du fonds du Trust, habilité à recevoir des dons de terres et d'argent."}
  - {annee: 1989, evenement: "Création du conseil du fonds, obligation d'adopter une déclaration de politique, outils de protection du patrimoine."}
  - {annee: 1994, evenement: "Le conseil du Trust adopte sa déclaration de politique."}
  - {annee: 2000, evenement: "La loi permet des accords de protocole avec les Premières Nations."}
  - {annee: 2002, evenement: "Programme d'exonération fiscale pour la protection des espaces naturels."}
  - {annee: 2018, evenement: "Le conseil du fonds (Trust Fund Board) prend le nom d'Islands Trust Conservancy."}
  - {annee: 2019, evenement: "Le conseil adopte une déclaration de réconciliation et déclare l'urgence climatique."}
  - {annee: 2021, evenement: "Modification de l'article 3 : les Premières Nations sont ajoutées aux partenaires de coopération du Trust."}
  - {annee: 2022, evenement: "Le conseil demande une révision provinciale du mandat, de la gouvernance et de la structure du Trust ; la province ne donne pas suite."}
  - {annee: 2023, evenement: "Le conseil publie une déclaration sur la portée de l'article 3 de la loi (objet du Trust)."}
  - {annee: 2025, evenement: "Le ministre refuse la révision demandée en octobre 2024 ; le conseil débat en séance publique de sa déclaration de 2023 ; un avis juridique sur l'article 3, dont il avait décidé la publication en décembre 2024, est rendu public."}
