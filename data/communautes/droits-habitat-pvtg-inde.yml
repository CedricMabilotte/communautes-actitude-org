resume: >-
  Fiche agrégée : elle couvre les groupes tribaux particulièrement vulnérables (Particularly Vulnerable Tribal Groups, 75 groupes dans 18 États et un territoire) dont le territoire coutumier a été reconnu au titre de l'article 3 (1) (e) de la loi de 2006 sur les droits forestiers. Ce droit d'« habitat » couvre l'usage et la protection d'un territoire : pratiques religieuses, sites sacrés, collecte, culture, déplacements saisonniers. Les Baiga du Madhya Pradesh l'ont obtenu les premiers en 2015, sur sept villages et 9 300 ha ; ont suivi les Bharia (2022), les Kamar et les Baiga du Chhattisgarh (2023) et six groupes d'Odisha (2024).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 (reconnaître les peuples tribaux comme groupes distincts) et § 19 (respect de la propriété collective des terres occupées traditionnellement)", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006, art. 2 (h) et 3 (1) (e)", nature: "loi", annee: 2006, source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les titulaires, l'assemblée de village (gram sabha) et les institutions villageoises veillent à protéger l'habitat de toute pratique destructrice, loi de 2006, art. 5 (c) ; les demandes de droits d'habitat sont portées par les institutions traditionnelles du groupe (Mongabay India, 2025).", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les titulaires de droits, l'assemblée de village (gram sabha) et les institutions villageoises sont habilités à faire respecter les décisions prises par l'assemblée pour réguler l'accès aux ressources forestières communautaires et arrêter toute activité qui nuit à la faune, à la forêt et à la biodiversité (loi de 2006, art. 5 (d)) ; cette disposition vaut dans les zones où des droits d'habitat sont reconnus.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Droit aux « tenures communautaires d'habitat et d'habitation » des « primitive tribal groups and pre-agricultural communities » (texte officiel), loi de 2006, art. 3 (1) (e) ; l'habitat comprend l'habitat coutumier en forêt classée ou protégée, art. 2 (h) ; droits héréditaires, inaliénables et incessibles, art. 4 (4) ; pas de propriété du sol.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  ressources: {valeur: "partiel", note: "Collecte, pêche, culture et accès aux terres de déplacement saisonnier dans l'habitat reconnu ; la chasse reste interdite par la loi sur la faune.", source: "http://india.mongabay.com/2025/01/explainer-what-are-habitat-rights-under-the-forest-rights-act-and-why-are-they-being-discussed-now/"}
  consentement: {valeur: "partiel", note: "La loi exige le consentement libre et éclairé, donné par écrit, des assemblées de village concernées avant toute réinstallation de titulaires de droits hors d'un habitat faunique critique (loi de 2006, art. 4 (2) (e)) ; aucune autre obligation de consentement propre aux droits d'habitat n'a été trouvée.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une dizaine de groupes sur 75 ont un habitat reconnu en 2024 ; procédure jugée floue, terme « habitat » parfois traduit par « maison », recouvrements avec des mines et des aires protégées.", source: "http://india.mongabay.com/2025/01/explainer-what-are-habitat-rights-under-the-forest-rights-act-and-why-are-they-being-discussed-now/"}
chronologie:
  - {annee: 2006, evenement: "Loi sur les droits forestiers, art. 3 (1) (e)."}
  - {annee: 2014, evenement: "Étude du ministère des Affaires tribales et de l'ONG Vasundhara sur la notion d'habitat des PVTG."}
  - {annee: 2015, evenement: "Premiers titres : Baiga de Baiga Chak (Dindori, Madhya Pradesh), sept villages, 9 300 ha."}
  - {annee: 2022, evenement: "Bharia de Patalkot (Chhindwara, Madhya Pradesh), 12 villages, 9 276 ha."}
  - {annee: 2023, evenement: "Kamar (22 villages, Dhamtari) en août et Baiga (19 villages, 6 483 habitants) en octobre au Chhattisgarh."}
  - {annee: 2024, evenement: "Paudi Bhuyan (32 villages) puis cinq autres groupes en Odisha, dont les Mankidia le 22 septembre."}
fiabilite:
  verifie: ["Articles 4 (2) (e) et 5 (d) de la loi de 2006, relus le 5 octobre 2026 (texte publié par PRS).", "Articles 2 (h), 3 (1) (e), 4 (4) et 5 de la loi de 2006 (texte publié par PRS).", "Baiga du Madhya Pradesh, 2015 (Down To Earth).", "Bharia, 2022 (ETV Bharat).", "Kamar et Baiga du Chhattisgarh, 2023 (Down To Earth).", "Groupes d'Odisha, 2024 (Down To Earth, The Statesman).", "75 PVTG dans 18 États et un territoire (Press Information Bureau, 15 novembre 2023)."]
  non_confirme: ["Aucun décompte officiel national des droits d'habitat n'a été trouvé.", "Surface totale et nombre total de villages : non publiés ; seuls cinq cas sont chiffrés (92 villages au total pour ces cinq cas).", "Reconnaissance des Maria Gond au Maharashtra : date et étendue non vérifiées.", "Lignes directrices nationales propres aux droits d'habitat : non trouvées ; Mongabay India (2025) relève l'absence de directives adaptées aux pratiques des groupes.", "Population : non trouvée pour l'ensemble des groupes titulaires de droits d'habitat ; seuls des chiffres partiels sont publiés (19 villages baiga du Chhattisgarh, 6 483 habitants, Down To Earth 2023) ; les chiffres de l'ensemble des PVTG (11 lakh familles, soit 1,1 million, Press Information Bureau 2024) ne correspondent pas au périmètre de la fiche.", "Nombre de villages : non trouvé à l'échelle nationale ; les 92 villages des cinq cas chiffrés (Baiga du Madhya Pradesh 7, Bharia 12, Kamar 22, Baiga du Chhattisgarh 19, Paudi Bhuyan 32) proviennent de sources distinctes."]
