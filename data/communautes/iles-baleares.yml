resume: >-
  Archipel de la Méditerranée occidentale, les îles Baléares forment une Communauté autonome espagnole depuis le Statut de 1983. Le Statut réformé en 2007 (loi organique 1/2007) désigne Majorque, Minorque, Ibiza et Formentera comme une « nationalité historique » qui exerce le droit à l'autogouvernement. Le Parlement vote les lois, y compris sur le droit civil propre des îles ; Majorque, Minorque, Ibiza et Formentera ont chacune leur consell insular, institution de gouvernement de l'île. Le catalan est langue propre et co-officielle avec le castillan.
reconnaissance_regionale:
  - {mecanisme: "charte_langues_regionales", detail: "La Charte européenne des langues régionales ou minoritaires couvre le catalan dans la Communauté autonome des Îles Baléares ; rapport du Comité d'experts publié le 24 septembre 2024.", annee: 2024, source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
