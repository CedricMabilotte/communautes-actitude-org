  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Loi n° 5 de 2015 du Kurdistan, art. 3, premier : le gouvernement régional associe les composantes aux décisions qui les concernent ; art. 3, sixième : le tracé des unités administratives et des circonscriptions tient compte de la gouvernance locale et des coutumes des composantes.", source: "http://www.iraqicivilsociety.org/wp-content/uploads/2015/08/A-Reading-for-the-Law-of-Protecting-Components-in-Kurdistan-english.pdf"}
  langue: {valeur: "partiel", note: "Art. 4, quatrième, de la Constitution de 2005 : le turkmène et le syriaque sont langues officielles dans les unités administratives où leurs locuteurs forment une densité de population.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  education: {valeur: "partiel", note: "Art. 4, premier, de la Constitution de 2005 : le droit d'instruire les enfants dans leur langue maternelle, dont le turkmène, est garanti dans les établissements publics selon les règles éducatives. Loi n° 5 de 2015 du Kurdistan, art. 3, huitième : le gouvernement régional garantit l'enseignement en langue maternelle et ouvre des départements universitaires pour les langues des composantes ; la loi n° 7 de 2014 du Kurdistan sur les langues officielles reconnaît le turkmène.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Art. 36 de la loi électorale du Kurdistan (loi n° 1 de 1992, modifiée en 2013) : cinq sièges réservés aux Turkmènes sur 111. En février 2024, l'arrêt n° 83 de la Cour suprême fédérale déclare ces sièges contraires à la Constitution ; le 21 mai 2024, la chambre électorale du Conseil supérieur de la magistrature attribue cinq sièges aux minorités sur 100, dont deux aux Turkmènes (Erbil et Souleimaniye). Aucun siège réservé aux Turkmènes au Conseil des représentants fédéral n'a été trouvé.", source: "https://www.rudaw.net/english/kurdistan/21052024"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le 1er mars 2023, le gouvernement retire le turkmène des langues officielles de la province de Kirkouk ; le 2 mars, le Premier ministre ordonne son maintien dans la correspondance officielle (Anadolu). En 2019, le CERD regrette l'absence d'information sur l'enseignement dans les langues minoritaires (par. 21). Le Minority Rights Group relève que l'état du système éducatif prive dans de nombreux cas les enfants turkmènes d'un enseignement en langue maternelle. En 2024, la Cour suprême fédérale supprime les sièges réservés au Parlement du Kurdistan, rétablis en partie en mai.", source: "https://www.aa.com.tr/en/middle-east/iraq-retracts-decision-to-curb-use-of-turkmen-language/2835393"}
chronologie:
  - {annee: 2005, evenement: "Constitution : turkmène langue officielle locale (art. 4), droits des Turkmènes (art. 125) ; cinq sièges réservés au Parlement du Kurdistan."}
  - {annee: 2014, evenement: "Décision n° 92 du Conseil des ministres qualifiant de génocide les crimes de Daech contre les Yézidis, Turkmènes, chrétiens, Shabaks et autres minorités ; loi n° 7 du Kurdistan sur les langues officielles."}
  - {annee: 2015, evenement: "Loi n° 5 du Kurdistan sur la protection des droits des composantes."}
  - {annee: 2019, evenement: "Observations finales du CERD sur l'Irak."}
  - {annee: 2023, evenement: "Retrait du turkmène des langues officielles de Kirkouk le 1er mars, annulé le 2 mars."}
  - {annee: 2024, evenement: "La Cour suprême fédérale supprime en février les sièges de minorités au Parlement du Kurdistan ; cinq sièges sont rétablis en mai, dont deux pour les Turkmènes."}
