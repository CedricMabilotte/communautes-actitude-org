reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale nomme les Turkmènes parmi les groupes frappés par la violence armée et le déplacement (par. 17 d)) et recommande des moyens pour l'enseignement en turkmène et dans les autres langues minoritaires (par. 22).", annee: 2019, source: "https://documents.un.org/api/symbol/access?s=CERD/C/IRQ/CO/22-25&l=en&t=pdf"}
