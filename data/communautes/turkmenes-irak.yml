resume: >-
  Les Turkmènes d'Irak sont une population de langue turcique établie surtout à Kirkouk, Tal Afar, Touz Khourmatou et Erbil.
  La Constitution de 2005 fait du turkmène une langue officielle dans les unités administratives où ses locuteurs sont concentrés (art. 4) et leur garantit des droits administratifs, politiques, culturels et éducatifs, selon une loi (art. 125).
  Dans la région du Kurdistan, la loi n° 5 de 2015 sur la protection des composantes (groupes nationaux et religieux) les nomme et leur garantit l'enseignement en langue maternelle et la participation aux institutions locales.
  Des sièges leur sont réservés au Parlement du Kurdistan depuis 2005 : cinq jusqu'en 2024, deux depuis les élections d'octobre 2024.
