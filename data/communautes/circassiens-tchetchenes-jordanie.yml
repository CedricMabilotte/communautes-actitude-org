resume: >-
  Les Circassiens (Adyguéens) et les Tchétchènes de Jordanie descendent de populations du Caucase du Nord expulsées vers l'Empire ottoman au XIXe siècle et installées en Transjordanie entre 1878 et 1906, notamment à Amman, Wadi es-Sir, Jerash, Zarqa, Russeifa, Sweileh et Sukhna.
  La loi n° 4 de 2022 sur l'élection de la Chambre des députés leur réserve conjointement au moins 3 des 138 sièges : un dans le gouvernorat d'Amman, un dans celui de Zarqa et au moins un dans la circonscription nationale des listes de partis.
  Aucun autre droit collectif n'a été trouvé dans un texte en vigueur.
