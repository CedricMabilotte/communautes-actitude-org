effectivite: {valeur: "effective", note: "Aux élections du 10 septembre 2024, premières tenues sous la loi de 2022, les trois sièges réservés ont été pourvus : un dans la circonscription nationale (liste du Parti de la Charte nationale), un dans la circonscription Amman 3 et un dans celle de Zarqa (listes du Front d'action islamique), selon le tableau des résultats établi d'après la Commission électorale indépendante.", source: "https://en.wikipedia.org/wiki/2024_Jordanian_general_election"}
chronologie:
  - {annee: 1878, evenement: "Des Circassiens s'installent à Amman ; Wadi es-Sir suit en 1880 et Jerash en 1884."}
  - {annee: 1903, evenement: "Les autorités ottomanes installent en Transjordanie les 700 premières familles tchétchènes."}
  - {annee: 1906, evenement: "Fondation de Sukhna, dernier des établissements mixtes circassiens et tchétchènes créés depuis 1901 (Naour, Zarqa, Russeifa, Sweileh)."}
  - {annee: 2010, evenement: "Le règlement de 2010 sur les circonscriptions électorales prévoit un quota (sièges réservés) pour les chrétiens, les Circassiens et les Tchétchènes à la Chambre des députés, selon le rapport de la Jordanie au Comité pour l'élimination de la discrimination raciale."}
  - {annee: 2022, evenement: "Loi électorale n° 4 : au moins 3 sièges sur 138 réservés aux Circassiens et Tchétchènes ; elle abroge la loi n° 6 de 2016 (art. 73)."}
  - {annee: 2024, evenement: "Élections du 10 septembre, premières sous la loi de 2022 ; les trois sièges réservés sont pourvus."}
fiabilite:
  verifie: ["Texte arabe de la loi n° 4 de 2022 (version consolidée, site de la Commission électorale indépendante) : art. 8(a) 138 sièges, art. 8(b)(1) Amman et 8(b)(6) Zarqa, un siège chacun pour les Circassiens et Tchétchènes, art. 8(d) au moins un siège national, art. 9(b) choix entre quota et concurrence libre, art. 73 abrogation de la loi n° 6 de 2016.", "Répartition 2 sièges locaux + 1 siège national (base Parline de l'Union interparlementaire ; fiche de la Fondation internationale pour les systèmes électoraux, IFES).", "Mention d'un quota pour les chrétiens, Circassiens et Tchétchènes depuis le règlement de 2010 (rapport de la Jordanie au CERD, CERD/C/JOR/13-17, 2011, § 48)."]
  non_confirme: ["Population : aucun chiffre officiel ; les estimations (100 000 à 170 000 Circassiens, environ 30 000 Tchétchènes) ne proviennent pas d'une source primaire.", "Date d'origine de la représentation réservée avant 2010 non établie sur un texte.", "Aucune observation d'un organe de l'ONU nommant ces communautés n'a été trouvée ; le rapport de 2011 au CERD émane de l'État, il n'est donc pas retenu comme reconnaissance onusienne.", "Attribution des trois sièges réservés en 2024 (national, Amman 3, Zarqa) lue sur un tableau secondaire ; le Journal officiel n° 5950 des résultats n'a pas pu être ouvert.", "Associations culturelles (Association caritative circassienne, 1932) sans statut de droit collectif dans un texte consulté.", "Surface : sans objet (communauté sans territoire propre), aucun chiffre.", "Villages : chiffre historique (fondations de 1878 à 1906) lu sur Wikipédia ; ouvrages de Hamed-Troyansky et de Rogan non consultés."]
