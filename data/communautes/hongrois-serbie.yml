resume: >-
  La Constitution serbe de 2006 garantit aux minorités nationales des droits individuels et collectifs, dont l'élection de conseils nationaux pour exercer l'autogouvernement (gestion de leurs affaires par des organes élus) dans la culture, l'éducation, l'information et l'usage officiel de la langue (art. 75). La loi de 2009 sur les conseils nationaux des minorités nationales en fait des organisations investies de compétences publiques pour exercer le « droit collectif d'une minorité nationale à l'autogouvernement » dans ces domaines. Le Conseil national hongrois, élu au suffrage direct, compte 35 membres, nombre fixé par la loi pour les minorités de plus de 100 000 membres (art. 9) ; un arrêt de la Cour constitutionnelle de 2014 a supprimé une partie des compétences des conseils. Le hongrois est aussi en usage officiel dans les organes de la province ; la province et les autres conseils ont leur propre fiche (« Province autonome de Voïvodine », « Minorités nationales de Serbie »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Suivi de la Serbie au titre de la Convention-cadre pour la protection des minorités nationales ; avis du cinquième cycle du Comité consultatif adopté le 26 février 2025 et publié le 5 mai 2025, qui compte 184 442 Hongrois, soit 2,77 % de la population (§ 38) ; commentaires du gouvernement reçus le 17 juillet 2025 ; résolution du Comité des ministres adoptée le 7 novembre 2025.", annee: 2025, source: "https://www.coe.int/en/web/minorities/serbia"}
reconnaissance_onu: []
base_nationale:
  - {instrument: "Constitution de la République de Serbie (2006), art. 75, 79, 100 et 182", nature: "constitution", annee: 2006, source: "https://www.constituteproject.org/constitution/Serbia_2006"}
  - {instrument: "Loi sur les conseils nationaux des minorités nationales (Journal officiel n° 72/09, 20/14 décision de la Cour constitutionnelle, 55/14 et 47/18)", nature: "loi", annee: 2009, source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  - {instrument: "Statut de la Province autonome de Voïvodine (Journal officiel de la province n° 20/2014), art. 24", nature: "statut_autonomie", annee: 2014, source: "https://www.skupstinavojvodine.gov.rs/Strana.aspx?s=statut&j=EN"}
  - {instrument: "Loi sur l'élection des députés (Journal officiel n° 14/22), art. 137 à 140", nature: "loi", annee: 2022, source: "https://www.rik.parlament.gov.rs/extfile/sr/41916/Zakon%20o%20izboru%20narodnih%20poslanika.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les membres d'une minorité nationale élisent un conseil national pour exercer leur droit à l'autogouvernement dans la culture, l'éducation, l'information et l'usage officiel de la langue, Constitution, art. 75 ; loi sur les conseils nationaux, art. 1a et 2.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil national fixe les noms traditionnels des communes, localités et lieux dans la langue de la minorité ; ces noms deviennent officiels avec les noms serbes, loi sur les conseils nationaux, art. 22, al. 1.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le conseil national donne son consentement préalable à l'approbation des manuels et matériels pédagogiques dans la langue de la minorité ; sans réponse sous 30 jours, l'approbation est réputée donnée, loi sur les conseils nationaux, art. 14.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  langue: {valeur: "partiel", note: "Droit d'utiliser sa langue et, dans les zones où la minorité forme une part importante de la population, d'obtenir des procédures dans cette langue devant les organes de l'État, Constitution, art. 79 ; le conseil national propose l'usage officiel de la langue dans une commune, loi sur les conseils nationaux, art. 22, al. 3 ; le hongrois est en usage officiel dans les organes de la Province autonome de Voïvodine, Statut de 2014, art. 24.", source: "https://www.skupstinavojvodine.gov.rs/Strana.aspx?s=statut&j=EN"}
  education: {valeur: "partiel", note: "Le conseil national propose au ministre les programmes d'enseignement pour les contenus propres à la minorité et les programmes de langue, loi sur les conseils nationaux, art. 13 ; enseignement dans la langue de la minorité, Constitution, art. 79.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  fiscalite: {valeur: "partiel", note: "Les conseils nationaux sont financés par les budgets de la République, de la province autonome et des communes ; 30 % des crédits de l'État sont répartis à parts égales et 70 % selon la population et le nombre d'institutions, loi sur les conseils nationaux, art. 114 et 115 ; aucun pouvoir fiscal.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  representation: {valeur: "partiel", note: "La représentation des minorités nationales à l'Assemblée nationale est assurée conformément à la loi, Constitution, art. 100 ; une liste de minorité nationale participe à la répartition des sièges sous le seuil de 3 % des votants et ses quotients sont alors majorés de 35 %, loi sur l'élection des députés de 2022, art. 140 ; aucun siège réservé.", source: "https://www.rik.parlament.gov.rs/extfile/sr/41916/Zakon%20o%20izboru%20narodnih%20poslanika.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Un arrêt de la Cour constitutionnelle de février 2014 (IUz-882/2010) a déclaré inconstitutionnelles les dispositions qui donnaient aux conseils des compétences dans la gestion des médias et la reprise des droits de fondateur de maisons d'édition ; la participation à l'élection du Conseil national hongrois est passée de 55,45 % en 2010 à 40,60 % en 2014 (Beretka et Székely, World Autonomies, 2016). Minority Rights Group (mise à jour de mai 2026) relève que l'enseignement en hongrois existe à tous les niveaux, y compris dans le supérieur à Subotica et Novi Sad.", source: "https://www.world-autonomies.info/non-territorial-autonomies/serbia"}
chronologie:
  - {annee: 2006, evenement: "Constitution de la Serbie : art. 75 sur les conseils nationaux."}
  - {annee: 2009, evenement: "Loi sur les conseils nationaux des minorités nationales."}
  - {annee: 2010, evenement: "Première élection directe du Conseil national hongrois."}
  - {annee: 2014, evenement: "Arrêt de la Cour constitutionnelle (Journal officiel 20/14) annulant plusieurs articles de la loi ; Statut de la Voïvodine (22 mai) ; élection du Conseil national hongrois, participation de 40,60 %."}
  - {annee: 2018, evenement: "Modification de la loi (Journal officiel 47/18)."}
  - {annee: 2022, evenement: "Loi sur l'élection des députés (Journal officiel 14/22) : listes de minorités exemptées du seuil de 3 %."}
  - {annee: 2025, evenement: "Cinquième avis du Comité consultatif de la Convention-cadre sur la Serbie (26 février) ; résolution du Comité des ministres (7 novembre)."}
  - {annee: 2026, evenement: "Élections des conseils nationaux convoquées le 18 septembre pour le 8 novembre ; le Conseil national hongrois est élu au suffrage direct."}
