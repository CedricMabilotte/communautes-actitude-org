resume: >-
  La Constitution serbe de 2006 garantit aux minorités nationales des droits individuels et collectifs, dont l'élection de conseils nationaux dans la culture, l'éducation, l'information et l'usage officiel de la langue (art. 75). La loi de 2009 sur les conseils nationaux des minorités nationales en fait des organes investis de compétences publiques pour exercer le « droit collectif d'une minorité nationale à l'autogouvernement » dans ces domaines. Le Conseil national hongrois compte 35 membres. Un arrêt de la Cour constitutionnelle de 2014 a supprimé plusieurs de ses compétences. La Province autonome de Voïvodine et les conseils nationaux des autres minorités ont leur propre fiche (« Province autonome de Voïvodine », « Minorités nationales de Serbie »).
