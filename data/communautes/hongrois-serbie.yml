base_nationale:
  - {instrument: "Constitution de la République de Serbie (2006), art. 75, 79, 100 et 182", nature: "constitution", annee: 2006, source: "https://www.constituteproject.org/constitution/Serbia_2006"}
  - {instrument: "Loi sur les conseils nationaux des minorités nationales (Journal officiel n° 72/09, 20/14, 55/14 et 47/18)", nature: "loi", annee: 2009, source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les membres d'une minorité nationale élisent un conseil national pour exercer leur droit à l'autogouvernement dans la culture, l'éducation, l'information et l'usage officiel de la langue, Constitution, art. 75 ; loi sur les conseils nationaux, art. 1a et 2.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil national fixe les noms traditionnels des communes, localités et lieux dans la langue de la minorité ; ces noms deviennent officiels avec les noms serbes, loi sur les conseils nationaux, art. 22, al. 1.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le conseil national donne son consentement préalable à l'approbation des manuels et matériels pédagogiques dans la langue de la minorité ; sans réponse sous 30 jours, l'approbation est réputée donnée, loi sur les conseils nationaux, art. 14.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  langue: {valeur: "partiel", note: "Droit d'utiliser sa langue et d'obtenir des procédures dans cette langue devant les organes de l'État, Constitution, art. 79 ; le conseil national propose l'usage officiel de la langue dans une commune, loi sur les conseils nationaux, art. 22, al. 3.", source: "https://www.constituteproject.org/constitution/Serbia_2006"}
  education: {valeur: "partiel", note: "Le conseil national propose au ministre les programmes d'enseignement pour les contenus propres à la minorité et les programmes de langue, loi sur les conseils nationaux, art. 13 ; enseignement dans la langue de la minorité, Constitution, art. 79.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  fiscalite: {valeur: "partiel", note: "Les conseils nationaux sont financés par les budgets de la République, de la province autonome et des communes ; 30 % des crédits de l'État sont répartis à parts égales et 70 % selon la population et le nombre d'institutions, loi sur les conseils nationaux, art. 114 et 115 ; aucun pouvoir fiscal.", source: "https://www.rik.parlament.gov.rs/extfile/en/170/ZoNSNM-eng.pdf"}
  representation: {valeur: "partiel", note: "L'Assemblée nationale assure la représentation des minorités nationales conformément à la loi, Constitution, art. 100.", source: "https://www.constituteproject.org/constitution/Serbia_2006"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Un arrêt de la Cour constitutionnelle de 2014 a supprimé les compétences du Conseil national hongrois sur la création d'institutions et la gestion des médias ; la participation aux élections du conseil est passée de 55,45 % en 2010 à 40,60 % en 2014 (World Autonomies).", source: "https://www.world-autonomies.info/non-territorial-autonomies/serbia"}
