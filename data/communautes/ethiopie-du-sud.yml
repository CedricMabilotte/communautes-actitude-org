resume: >-
  Plusieurs « nations, nationalités et peuples » au sens de la Constitution fédérale éthiopienne, dont les Wolayta, Gamo, Gofa, Gedeo, Konso et les peuples de l'Omo du Sud, forment depuis le 19 août 2023 l'État régional d'Éthiopie du Sud.
  Six zones et cinq woredas spéciaux (districts à statut particulier) de l'ancien État régional des nations, nationalités et peuples du Sud ont voté le 6 février 2023, sur le fondement de l'article 47, pour former un État commun ; la zone Wolayta a revoté le 19 juin 2023 après annulation de son scrutin.
  La Chambre de la Fédération (chambre haute) a approuvé la création le 5 juillet 2023. L'État compte douze zones ; son siège est à Wolayta Sodo, avec des bureaux répartis à Arba Minch, Dilla, Jinka, Sawla et Karat (Konso).
