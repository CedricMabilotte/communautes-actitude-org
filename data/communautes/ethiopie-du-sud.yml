  verifie: ["Texte des art. 39, 46, 47, 50, 61 et 78 de la Constitution (Constitute Project).", "Date du référendum, liste des six zones et cinq woredas spéciaux, nombre d'inscrits et annulation dans la zone Wolayta (Commission électorale nationale).", "Adoption de la constitution régionale le 18 août 2023, langue de travail et siège (Fana).", "Constitution de l'État le 19 août 2023 (ENA, Borkena).", "Regroupement des zones à la demande des gouvernements régional et fédéral, et répression dans la zone Wolayta en 2020 (Rift Valley Institute)."]
