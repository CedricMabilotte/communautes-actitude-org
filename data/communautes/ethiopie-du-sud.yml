reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme note la reconnaissance du droit des communautés ethniques et linguistiques à l'autodétermination au niveau de l'État régional, selon le fédéralisme ethnique de la Constitution (CCPR/C/ETH/CO/1, par. 26). Vise la catégorie, pas les peuples de la fiche nommément.", annee: 2011, source: "https://docs.un.org/en/CCPR/C/ETH/CO/1"}
base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 5, 39, 40, 46, 47, 50, 52, 61, 78 et 97", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  - {instrument: "Décision de la Chambre de la Fédération du 5 juillet 2023 approuvant la création de l'État régional d'Éthiopie du Sud", nature: "loi", annee: 2023, source: "https://www.africanews.com/2023/07/06/ethiopia-upper-house-votes-to-form-12th-regional-state/"}
  - {instrument: "Constitution de l'État régional d'Éthiopie du Sud, adoptée à Arba Minch le 18 août 2023 par la conférence de ratification de la constitution", nature: "constitution", annee: 2023, source: "https://www.fanamc.com/archives/207796"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 39(3) : droit de chaque nation, nationalité et peuple à l'autogouvernement ; art. 47(2)-(3) : droit de former un État. Conseil régional réuni à Arba Minch le 19 août 2023, qui désigne l'administrateur en chef.", source: "https://www.ena.et/web/eng/w/eng_3222547"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(2)(b) de la Constitution fédérale : chaque État adopte sa constitution et ses lois. Constitution régionale adoptée à la majorité (10 voix contre, 2 abstentions) le 18 août 2023.", source: "https://www.fanamc.com/archives/207796"}
  justice_propre: {valeur: "reconnu", note: "Art. 50(2) : les États détiennent le pouvoir judiciaire ; art. 78(5) : les Conseils des États peuvent créer ou reconnaître des tribunaux religieux et coutumiers.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  terres: {valeur: "partiel", note: "Art. 40(3) : la terre est propriété commune des nations, nationalités et peuples, inaliénable ; art. 52(2)(d) : les États l'administrent selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Art. 39(2) : droit de parler, écrire et développer sa langue ; art. 5(3) : chaque État fixe sa langue de travail. La constitution régionale de 2023 retient l'amharique comme langue de travail et prévoit la promotion des autres langues.", source: "https://www.fanamc.com/archives/207796"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 97 : les États lèvent l'impôt sur le revenu des salariés de l'État et des entreprises privées, les redevances d'usufruit foncier et d'autres impôts.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 61(2) : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération, plus un par million d'habitants.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) : droit inconditionnel à l'autodétermination, y compris la sécession (séparation d'avec l'État), par vote aux deux tiers du conseil législatif puis référendum fédéral dans les trois ans. Jamais exercé à ce jour.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "partielle", note: "Les conseils des zones Wolayta, Gamo, Gofa, Omo du Sud, Gedeo et Konso avaient voté à plus des deux tiers pour un État propre à chacune ; les gouvernements régional et fédéral les ont conduits à demander un État commun. Le conseil de la zone Wolayta a maintenu sa demande, puis a cédé après l'arrestation de l'administrateur de la zone et la mort de manifestants en août 2020 (Rift Valley Institute, 2023). La Commission électorale nationale a annulé le vote de février 2023 dans cette zone (337 registres irréguliers sur 350 examinés). Aucune évaluation du fonctionnement de l'État depuis août 2023 n'a été consultée.", source: "https://riftvalley.net/wp-content/uploads/2023/03/RVI-2023.03.21-Referendum-in-Ethiopias-Southern-Region.pdf"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale (art. 39 et 47), entrée en vigueur en 1995."}
  - {annee: 2020, evenement: "En août, arrestation de l'administrateur de la zone Wolayta et mort de manifestants, après la demande d'un État propre par le conseil de la zone."}
  - {annee: 2022, evenement: "Par lettre du 18 août, la Chambre de la Fédération demande à la Commission électorale nationale d'organiser un référendum dans six zones et cinq woredas spéciaux de l'État régional du Sud."}
  - {annee: 2023, evenement: "Le 6 février, référendum : 3 028 770 électeurs inscrits ; résultats approuvés sauf pour la zone Wolayta, où le scrutin est annulé."}
  - {annee: 2023, evenement: "Le 19 juin, nouveau vote dans la zone Wolayta ; le 5 juillet, la Chambre de la Fédération approuve la création de l'État."}
  - {annee: 2023, evenement: "Le 18 août, adoption de la constitution régionale ; le 19 août, constitution de l'État régional d'Éthiopie du Sud."}
