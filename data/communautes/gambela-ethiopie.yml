resume: >-
  Les Anywaa (Anuak), Nuer, Majang, Opo et Komo vivent dans les basses terres de l'ouest de l'Éthiopie, à la frontière du Soudan du Sud.
  L'article 47 de la Constitution fédérale de 1994 fait de « l'État des peuples de Gambela » l'un des États membres de la fédération.
  Le préambule de la Constitution régionale révisée de 2003 désigne ces cinq nationalités comme titulaires du pouvoir régional, à l'exclusion des autres groupes, soit environ un quart de la population régionale selon Mohammed Dejen Assen (2023).
  La région est divisée en zones de nationalité, dont trois portent le nom des Anywaa, des Nuer et des Majang.
