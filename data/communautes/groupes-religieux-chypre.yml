  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Dans les matières autrefois confiées à la Chambre communale grecque, la loi n° 58 de 1970 (art. 4, révisé en 2011) oblige les commissions parlementaires compétentes à inviter les représentants des groupes religieux aux séances où ces matières sont examinées, et l'administration à les informer par écrit et à recueillir leur avis avant de décider ; une autorité qui s'écarte de cet avis doit motiver sa décision par écrit. Il s'agit d'une consultation (avis préalable), sans obligation de consentement.", source: "https://cylaw.org/nomoi/enop/non-ind/1970_1_58/full.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Chaque groupe élit un représentant pour la durée de la législature (loi n° 58 de 1970, art. 3) ; ce représentant ne peut pas être député (art. 9) et exprime l'avis de son groupe devant la Chambre des représentants et l'administration dans les matières autrefois confiées à la Chambre communale grecque (art. 4). La représentation à la Chambre communale grecque prévue par l'article 109 de la Constitution a disparu avec la suppression de cette Chambre en 1965.", source: "https://cylaw.org/nomoi/enop/non-ind/1970_1_58/full.html"}
  statut_personnel: {valeur: "partiel", note: "Les fiançailles, le mariage et la nullité du mariage des membres d'un groupe religieux relèvent du droit de l'Église du groupe (Constitution, art. 111, al. 1) ; le divorce et les relations familiales relèvent d'un tribunal de la famille créé par la loi (art. 111, al. 2 révisé). L'Église de chaque groupe conserve les droits en matière religieuse qu'elle détenait sous le droit colonial (art. 110, al. 3).", source: "https://www.constituteproject.org/constitution/Cyprus_2013"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les représentants des trois groupes sont élus et participent aux réunions de la Chambre des représentants (délégation chypriote devant le CERD, 2026) ; Minority Rights Group les décrit comme trois observateurs sans droit de vote et indique que la population maronite restée dans les villages du nord, hors du contrôle du gouvernement, est âgée et décroît, et seuls quatre villages comptent encore une population maronite traditionnelle.", source: "https://minorityrights.org/country/cyprus/"}
chronologie:
  - {annee: 1960, evenement: "Entrée en vigueur de la Constitution ; les groupes arménien, latin et maronite optent pour la communauté grecque (référendum du 13 novembre)."}
  - {annee: 1965, evenement: "Suppression de la Chambre communale grecque, où les groupes religieux devaient être représentés (art. 109)."}
  - {annee: 1970, evenement: "Loi n° 58 sur la représentation des groupes religieux : un représentant élu par groupe."}
  - {annee: 1986, evenement: "Loi n° 70 : élection des représentants en même temps que les élections législatives."}
  - {annee: 1996, evenement: "Ratification de la Convention-cadre pour la protection des minorités nationales (entrée en vigueur en 1998)."}
  - {annee: 2002, evenement: "L'arménien est reconnu comme langue minoritaire au titre de la Charte européenne (1er décembre)."}
  - {annee: 2008, evenement: "L'arabe maronite chypriote est reconnu comme langue minoritaire au titre de la Charte européenne."}
  - {annee: 2025, evenement: "Dernière modification de la loi n° 58/1970 (loi 85(I)/2025) ; avis du sixième cycle du Comité consultatif de la Convention-cadre (1er juillet)."}
  - {annee: 2026, evenement: "Examen du rapport de Chypre par le CERD (avril)."}
fiabilite:
  verifie: ["Constitution de 1960, art. 2 (al. 3 et 5), 87, 109, 110 (al. 3) et 111 (Constitute Project).", "Loi n° 58/1970 : définition du groupe religieux par les trois groupes nommés (art. 2), un représentant élu par groupe (art. 3), consultation obligatoire par les commissions parlementaires et l'administration avec motivation écrite en cas de désaccord (art. 4), inéligibilité des députés (art. 9), liste des lois modificatives jusqu'à 85(I)/2025 (CyLaw).", "Ratification de la Convention-cadre le 4 juin 1996 et avis du Comité consultatif du 1er juillet 2025 (Conseil de l'Europe).", "Déclarations de la délégation chypriote au CERD sur le statut de minorité nationale et la représentation, avril 2026 (résumé du HCDH)."]
  non_confirme: ["Population : Minority Rights Group donne 4 940 Maronites, 2 600 Arméniens et 900 Latins sans année ; Wikipédia cite 3 656 Maronites au recensement de 2011 dans la zone contrôlée par le gouvernement ; aucun chiffre officiel daté consulté.", "Dates de reconnaissance de l'arménien (2002) et de l'arabe maronite chypriote (2008) au titre de la Charte européenne vérifiées sur Wikipédia seulement, pas sur le site du Conseil de l'Europe (inaccessible).", "Absence de droit de vote des représentants à la Chambre : rapportée par Minority Rights Group et Wikipédia, non lue dans la loi n° 58/1970 ni sur le site de la Chambre (inaccessible).", "Exemption fiscale des groupes religieux reconnus, hors activités commerciales, rapportée par Minority Rights Group sans référence au texte ; l'article correspondant n'a pas été trouvé dans la Constitution.", "Financement public des écoles arméniennes, maronite et latine non vérifié sur une source primaire.", "Option collective de 1960 pour la communauté grecque datée d'après Wikipédia (référendum de novembre 1960).", "Une fiche distincte pour les Maronites des villages du nord (Kormakitis) reste à examiner : aucun régime juridique propre à ces villages n'a été trouvé."]
