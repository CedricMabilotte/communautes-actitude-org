resume: >-
  La Constitution de Chypre de 1960 (art. 2, al. 3) définit le « groupe religieux » (personnes résidant à Chypre et professant la même religion, au nombre de plus de mille) et l'oblige à opter pour la communauté grecque ou turque ; les Arméniens, les Latins (catholiques romains) et les Maronites ont opté en 1960 pour la communauté grecque.
  Chaque groupe devait être représenté à la Chambre communale grecque (art. 109) ; après la suppression de cette Chambre en 1965, la loi n° 58 de 1970, qui nomme les trois groupes, leur donne un représentant élu chacun ; ce représentant n'est pas député, et les commissions parlementaires et l'administration doivent recueillir son avis.
  Le mariage de leurs membres relève du droit de leur Église (art. 111). L'État les traite comme minorités nationales au titre de la Convention-cadre du Conseil de l'Europe.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Chypre a ratifié la Convention-cadre pour la protection des minorités nationales le 4 juin 1996 (entrée en vigueur le 1er février 1998) ; selon la délégation chypriote devant le CERD en 2026, les groupes arménien, latin et maronite détiennent les droits des minorités nationales prévus par la Convention-cadre. Avis du sixième cycle du Comité consultatif adopté le 1er juillet 2025.", annee: 2025, source: "https://www.coe.int/en/web/minorities/cyprus"}
  - {mecanisme: "charte_langues_regionales", detail: "Au titre de la Charte européenne des langues régionales ou minoritaires, l'arménien est reconnu comme langue minoritaire de Chypre depuis le 1er décembre 2002.", annee: 2002, source: "https://en.wikipedia.org/wiki/Armenians_in_Cyprus"}
  - {mecanisme: "charte_langues_regionales", detail: "L'arabe maronite chypriote est reconnu comme langue minoritaire de Chypre depuis 2008.", annee: 2008, source: "https://en.wikipedia.org/wiki/Cypriot_Maronite_Arabic"}
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, examen du vingt-cinquième rapport périodique de Chypre (CERD/C/CYP/25), 17 avril 2026 : la délégation présente les communautés arménienne, latine et maronite comme groupes religieux de la Constitution de 1960, titulaires des droits des minorités nationales au titre de la Convention-cadre, qui élisent des représentants à la Chambre des représentants et participent à ses réunions.", annee: 2026, source: "https://www.ohchr.org/en/meeting-summaries/2026/04/experts-committee-elimination-racial-discrimination-commend-cyprus"}
base_nationale:
  - {instrument: "Constitution de la République de Chypre, art. 2 (al. 3 et 5), 109, 110 (al. 3) et 111", nature: "constitution", annee: 1960, source: "https://www.constituteproject.org/constitution/Cyprus_2013"}
  - {instrument: "Loi de 1970 sur les groupes religieux (représentation), n° 58/1970 (Ο περί Θρησκευτικών Ομάδων (Εκπροσώπηση) Νόμος), modifiée en dernier lieu par la loi 85(I)/2025", nature: "loi", annee: 1970, source: "https://cylaw.org/nomoi/enop/non-ind/1970_1_58/full.html"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
