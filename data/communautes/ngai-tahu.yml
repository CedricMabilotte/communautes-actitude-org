  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010 devant l'Instance permanente (A/HRC/18/35/Add.4)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
