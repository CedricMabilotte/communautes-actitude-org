droits:
  autogouvernement: {valeur: "partiel", note: "Te Rūnanga o Ngāi Tahu, constitué par la loi de 1996, administre les biens de l'iwi pour l'ensemble des Ngāi Tahu ; chacun des 18 papatipu rūnanga y élit un représentant. C'est l'entité de gouvernance du règlement de 1998, sans pouvoirs de puissance publique.", source: "https://www.tkm.govt.nz/iwi/ngai-tahu/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Droit de préemption : les organismes de la Couronne doivent proposer à Te Rūnanga o Ngāi Tahu l'achat de certaines terres avant de les vendre à des tiers (Ngāi Tahu Claims Settlement Act 1998, partie 9, s. 47 à 101).", source: "https://www.legislation.govt.nz/act/public/1998/0097/latest/whole.html"}
  ressources: {valeur: "reconnu", note: "Te Rūnanga o Ngāi Tahu possède tout le pounamu (jade) à l'état naturel dans le takiwā ; les titulaires de permis miniers n'ont aucun droit sur lui et son extraction sans accord de Ngāi Tahu est illégale (Ngāi Tahu (Pounamu Vesting) Act 1997).", source: "https://www.nzpam.govt.nz/permits/minerals/compliance/pounamu-management-areas"}
  consentement: {valeur: "partiel", note: "Les autorités locales et le tribunal de l'environnement doivent tenir compte des « reconnaissances statutaires » des liens de Ngāi Tahu avec des sites (s. 206 à 222, dont s. 208) ; des conseillers statutaires et les zones tōpuni imposent consultation dans la gestion de la conservation (s. 231 à 253).", source: "https://www.legislation.govt.nz/act/public/1998/0097/latest/whole.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Te Rūnanga o Ngāi Tahu nomme jusqu'à deux membres du conseil régional de Canterbury, avec plein droit de vote (Canterbury Regional Council (Ngāi Tahu Representation) Act 2022) ; représentation régionale, pas nationale.", source: "https://www.ecan.govt.nz/about/your-council/our-team/mana-whenua-representation"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante de l'application du règlement de 1998 n'a été consultée. Les deux sièges au conseil régional de Canterbury sont pourvus pour 2025-2028.", source: "https://www.ecan.govt.nz/about/your-council/our-team/mana-whenua-representation"}
