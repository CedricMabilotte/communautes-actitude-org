reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Le rapport du Rapporteur spécial sur la situation du peuple maori mentionne le règlement des pêcheries maories qui a suivi le rapport de 1992 du Tribunal de Waitangi sur la revendication de Ngāi Tahu (A/HRC/18/35/Add.4, § 43)", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010 devant l'Instance permanente (A/HRC/18/35/Add.4, § 3)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
