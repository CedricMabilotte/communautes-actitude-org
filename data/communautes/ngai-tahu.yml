droits:
  autogouvernement: {valeur: "partiel", note: "Te Rūnanga o Ngāi Tahu, dont la loi de 1996 fixe le statut, les membres de Ngāi Tahu Whānui et l'élection des représentants, représente l'ensemble des Ngāi Tahu ; chacun des 18 papatipu rūnanga y désigne un représentant. C'est l'entité de gouvernance du règlement de 1998, sans pouvoirs de puissance publique.", source: "https://ngaitahu.iwi.nz/te-runanga-o-ngai-tahu/our-people/ngai-tahu-governance/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Droit de préemption : les organismes de la Couronne doivent proposer à Te Rūnanga o Ngāi Tahu l'achat de certaines terres avant de les vendre à des tiers (Ngāi Tahu Claims Settlement Act 1998, partie 9, s. 47 à 101).", source: "https://www.legislation.govt.nz/act/public/1998/0097/latest/whole.html"}
  ressources: {valeur: "partiel", note: "Te Rūnanga o Ngāi Tahu possède tout le pounamu (jade) à l'état naturel dans le takiwā ; les titulaires de permis miniers n'ont aucun droit sur lui et son extraction sans accord de Ngāi Tahu est illégale (Ngāi Tahu (Pounamu Vesting) Act 1997). Cette propriété porte sur une seule catégorie de ressource.", source: "https://www.nzpam.govt.nz/permits/minerals/compliance/pounamu-management-areas"}
  consentement: {valeur: "partiel", note: "Les autorités qui délivrent les autorisations au titre de la loi de 1991 sur la gestion des ressources doivent tenir compte des « reconnaissances statutaires » (statutory acknowledgements, reconnaissance par la loi des liens de Ngāi Tahu avec des sites), et le tribunal de l'environnement aussi (Ngāi Tahu Claims Settlement Act 1998, s. 206 à 222, dont s. 208 et 209) ; des conseillers statutaires (s. 231 à 236) et les zones tōpuni (s. 237 à 253) imposent la consultation de Ngāi Tahu dans la gestion de la conservation.", source: "https://www.legislation.govt.nz/act/public/1998/0097/latest/whole.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Te Rūnanga o Ngāi Tahu nomme jusqu'à deux membres du conseil régional de Canterbury, avec plein droit de vote (Canterbury Regional Council (Ngāi Tahu Representation) Act 2022) ; représentation régionale, pas nationale.", source: "https://www.ecan.govt.nz/about/your-council/our-team/mana-whenua-representation"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les deux sièges au conseil régional de Canterbury sont pourvus pour 2025-2028 (Environment Canterbury). En novembre 2025, Te Rūnanga o Ngāi Tahu a saisi la Haute Cour contre un projet de réforme de la loi sur la conservation qui transférerait au ministre des décisions des conseils de conservation et de l'Autorité de la conservation, où le règlement garantit sa représentation (RNZ) ; une note du ministère de la Conservation du 14 août 2025 indique que la réforme pourrait affecter la durabilité du règlement. La Haute Cour a suspendu l'instance en 2026 ([2026] NZHC 722) jusqu'à l'adoption du projet, toujours en commission en septembre 2026.", source: "https://www.rnz.co.nz/news/national/579703/ngai-tahu-takes-crown-to-high-court-over-proposed-changes-to-conservation-act"}
chronologie:
  - {annee: 1992, evenement: "Rapport du Tribunal de Waitangi sur la revendication de Ngāi Tahu relative aux pêcheries maritimes (Wai 27), 6 août."}
  - {annee: 1996, evenement: "Te Rūnanga o Ngāi Tahu Act : statut de Te Rūnanga et définition du takiwā (s. 5)."}
  - {annee: 1997, evenement: "Ngāi Tahu (Pounamu Vesting) Act."}
  - {annee: 1998, evenement: "Ngāi Tahu Claims Settlement Act : excuses de la Couronne (s. 6)."}
  - {annee: 2022, evenement: "Loi sur la représentation de Ngāi Tahu au conseil régional de Canterbury."}
  - {annee: 2025, evenement: "Février à avril : audience devant la Haute Cour de Christchurch sur la demande de Ngāi Tahu de reconnaissance de son autorité (rangatiratanga) sur l'eau douce, introduite en 2020 ; jugement en attente."}
  - {annee: 2025, evenement: "Novembre : Te Rūnanga o Ngāi Tahu saisit la Haute Cour contre le projet de réforme de la loi sur la conservation."}
  - {annee: 2026, evenement: "La Haute Cour suspend l'instance sur la réforme de la conservation ([2026] NZHC 722) ; le projet de loi (Conservation Amendment Bill) passe en première lecture le 12 mai et reste en commission."}
