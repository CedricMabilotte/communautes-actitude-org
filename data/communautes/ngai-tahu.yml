resume: >-
  Iwi (peuple māori) de Te Waipounamu, l'île du Sud, dont le takiwā (territoire) est défini par une loi de 1996. Te Rūnanga o Ngāi Tahu, personne morale créée par une loi de 1996, représente l'ensemble des Ngāi Tahu et réunit un représentant de chacun des 18 papatipu rūnanga (conseils locaux). Le règlement de 1998 comprend des excuses de la Couronne, un droit de préemption sur des terres publiques et des mécanismes de reconnaissance culturelle ; une loi de 1997 attribue à Te Rūnanga la propriété du pounamu (jade). Une loi de 2022 permet à Ngāi Tahu de nommer deux membres votants du conseil régional de Canterbury. En 2025 et 2026, Te Rūnanga a contesté en justice un projet de réforme de la loi sur la conservation qu'il estime contraire au règlement de 1998.
