reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010 et reconnu aux Māori le statut de peuple autochtone du pays (A/HRC/18/35/Add.4)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Te Ruruku Pūtakerongo, accord de réparation collective (Collective Redress Deed) entre la Couronne et Ngā Iwi o Taranaki", nature: "accord_revendication", annee: 2023, source: "https://whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/taranaki-maunga"}
  - {instrument: "Te Ture Whakatupua mō Te Kāhui Tupua 2025 / Taranaki Maunga Collective Redress Act 2025", nature: "loi", annee: 2025, source: "https://ecojurisprudence.org/wp-content/uploads/2022/02/Thursday-30-January-2025-Volume-781-New-Zealand-Parliament.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Te Tōpuni Ngārahu, entité collective créée par les huit iwi, exerce des fonctions fixées par la loi de 2025 : elle nomme quatre des huit membres de Te Tōpuni Kōkōrangi, « visage et voix » de Te Kāhui Tupua, les quatre autres étant nommés par le ministre de la Conservation (accord Te Ruruku Pūtakerongo, 2023).", source: "https://whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/taranaki-maunga"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les terres de l'ancien parc national détenues par la Couronne sont dévolues à Te Kāhui Tupua, personne juridique, et non aux iwi ; la Couronne cesse d'en être propriétaire. Le parc reste soumis au National Parks Act 1980 (loi sur les parcs nationaux) et ouvert au public. Te Tōpuni Ngārahu doit approuver tout ajout ou retrait de terres du parc (accord de 2023, loi de 2025).", source: "https://whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/taranaki-maunga"}
  ressources: {valeur: "partiel", note: "Te Tōpuni Ngārahu peut autoriser les membres des iwi ou leurs entités de gouvernance à prélever dans le parc, à des fins culturelles non commerciales, des végétaux et, à la main dans le lit des rivières, des minéraux culturels ; la dévolution à Te Kāhui Tupua inclut cinq minéraux culturels : kōkōwai (ocre rouge), kōkawa (andésite du Taranaki), pākohe (argilite), onewa (basalte ou grauwacke) et matā (obsidienne) (accord de 2023, loi de 2025).", source: "https://whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/taranaki-maunga"}
  consentement: {valeur: "partiel", note: "Le plan de gestion du parc (He Kawa Ora) est préparé par Te Tōpuni Kōkōrangi et approuvé conjointement par le ministre de la Conservation et Te Tōpuni Ngārahu ; les droits fonciers dans le parc (baux, par exemple) sont accordés conjointement par Te Tōpuni Kōkōrangi et le ministre ; Te Tōpuni Ngārahu est associée aux autres décisions de concession (accord de 2023, loi de 2025).", source: "https://whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/taranaki-maunga"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Loi adoptée en troisième lecture le 30 janvier 2025 ; aucune évaluation indépendante du fonctionnement de Te Tōpuni Kōkōrangi ou de Te Tōpuni Ngārahu n'a été trouvée. Le ministère de la Conservation indique que Te Tōpuni Kōkōrangi recueille jusqu'au 20 octobre 2026 des premières observations pour préparer He Kawa Ora, le plan de gestion du parc. The Indigenous World 2025 (IWGIA) décrivait en 2024 le projet de loi, alors en deuxième lecture, comme un dispositif de cogouvernance du parc national.", source: "https://www.doc.govt.nz/parks-and-recreation/places-to-go/taranaki/places/te-papa-kura-o-taranaki/"}
chronologie:
  - {annee: 1865, evenement: "La Couronne confisque environ 1,2 million d'acres de terres de Taranaki, dont Taranaki Maunga."}
  - {annee: 1900, evenement: "Création du parc national d'Egmont, deuxième parc national du pays."}
  - {annee: 1978, evenement: "Le Mount Egmont Vesting Act dévolue la montagne au Taranaki Māori Trust Board, qui doit la rendre aussitôt à la Couronne."}
  - {annee: 2017, evenement: "Termes de négociation (14 mars) et protocole d'accord Te Anga Pūtakerongo (20 décembre) entre la Couronne et Ngā Iwi o Taranaki."}
  - {annee: 2023, evenement: "Signature de l'accord collectif Te Ruruku Pūtakerongo le 1er septembre, après ratification par les membres des huit iwi."}
  - {annee: 2025, evenement: "Adoption en troisième lecture de Te Ture Whakatupua mō Te Kāhui Tupua le 30 janvier : personnalité juridique de Te Kāhui Tupua, abrogation de la loi de 1978, parc renommé Te Papa-Kura-o-Taranaki."}
