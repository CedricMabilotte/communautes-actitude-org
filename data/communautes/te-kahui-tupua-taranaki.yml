resume: >-
  Les huit iwi (peuples māori) de la région de Taranaki, sur la côte ouest de l'île du Nord, négocient ensemble depuis 2017 sous le nom de Ngā Iwi o Taranaki la réparation liée à leurs montagnes ancestrales, dont Taranaki Maunga, comprise dans les terres confisquées par la Couronne en 1865. L'accord collectif Te Ruruku Pūtakerongo, signé le 1er septembre 2023, est mis en œuvre par la loi Te Ture Whakatupua mō Te Kāhui Tupua 2025 (Taranaki Maunga Collective Redress Act), adoptée en troisième lecture le 30 janvier 2025. Te Kāhui Tupua, formé de Taranaki Maunga et des autres montagnes ancestrales, devient une personne juridique propriétaire des terres de la Couronne situées dans le parc national, renommé Te Papa-Kura-o-Taranaki. Une instance de huit membres, dont quatre nommés par l'entité collective des iwi Te Tōpuni Ngārahu, agit en son nom.
