resume: >-
  Les régions du Nord-Ouest et du Sud-Ouest correspondent à l'ancien Cameroun méridional sous tutelle britannique, rattaché au Cameroun après le plébiscite de 1961. La loi n° 2019/024 du 24 décembre 2019 portant Code général des collectivités territoriales décentralisées leur reconnaît un statut spécial « fondé sur leur spécificité linguistique et leur héritage historique » (art. 3), sur la base de l'article 62, alinéa 2, de la Constitution. Chaque région a une Assemblée régionale de 90 membres en deux chambres, une House of Divisional Representatives (chambre des représentants des départements, 70 élus) et une House of Chiefs (chambre des chefs, 20 membres issus du commandement traditionnel), un Conseil exécutif régional et un Public Independent Conciliator (médiateur indépendant). Le gouverneur, nommé par le président de la République, exerce la tutelle de l'État (contrôle administratif sur la région) et approuve au préalable le budget, les emprunts et les affaires domaniales.
