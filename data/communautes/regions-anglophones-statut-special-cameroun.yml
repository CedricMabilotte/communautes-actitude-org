    - "Public Independent Conciliator nommé par décret pour six ans, art. 367 et 368."
    - "Constitution, art. 1, al. 3 et art. 62 (Constitute Project)."
    - "Population (recensement de 2005) et surface des 13 départements des deux régions (City Population) ; chiffres de l'effectivité relus sur le briefing n° 188 de Crisis Group."
