reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2020-2025, transmis à la Convention sur la diversité biologique : ils décrivent le droit des propriétaires coutumiers de pêcher sans permis dans les zones inscrites au registre des droits de pêche coutumiers iTaukei, le rôle de la Commission des terres et pêcheries iTaukei, les 410 iQoliqoli et les 415 aires tabu (protégées) du réseau des aires marines gérées localement dans 143 d'entre elles en 2013 ; le cinquième rapport national (2014) décrit les qoliqoli comme des zones de pêche sous le contrôle des communautés riveraines", annee: 2020, source: "https://www.cbd.int/doc/world/fj/fj-nbsap-v2-en.pdf"}
