resume: >-
  Fiche agrégée : elle couvre les unités sociales iTaukei (mataqali, lignages ou clans, et autres subdivisions) titulaires de droits de pêche coutumiers enregistrés à Fidji. La loi sur les pêches (chap. 158, en vigueur depuis le 1er janvier 1942) charge une Commission des pêcheries autochtones (aujourd'hui Commission des pêcheries iTaukei) d'établir quels droits de pêche coutumiers sont la propriété héréditaire de ces unités et d'en inscrire les limites et les titulaires dans un registre tenu par le conservateur des titres (art. 14 à 20). Sur un récif ou un banc de coquillages inscrit au registre, une personne extérieure au groupe doit obtenir un permis du commissaire de division, qui consulte le groupe titulaire (art. 13). La Constitution de 2013 donne aux titulaires de droits de pêche coutumiers enregistrés une part des redevances minières perçues sur le fond marin de leur zone (art. 30). Ce régime est distinct de celui des terres iTaukei.
