effectivite: {valeur: "partielle", note: "Selon le profil de la FAO (2009), dans chacune des 406 zones de gestion traditionnelle, une autorité coutumière, le plus souvent un chef héréditaire, prend les décisions de gestion : limitation de l'accès des personnes extérieures, interdiction des filets maillants, des compresseurs de plongée ou de la pêche commerciale le dimanche ; la plupart de ces zones n'ont pas d'objectifs de gestion formels. Le cinquième rapport national à la CDB (2014) indique qu'au moins 70 des 400 qoliqoli sont surexploités et 250 autres « pleinement développés ».", source: "https://www.fao.org/fishery/docs/DOCUMENT/fcp/en/FI_CP_FJ.pdf"}
chronologie:
  - {annee: 1942, evenement: "Entrée en vigueur de la loi sur les pêches (1er janvier) : création de la Commission des pêcheries autochtones et du registre des droits de pêche coutumiers."}
  - {annee: 1947, evenement: "Règles d'enquête de la Commission (9 mai) : procédure en langue fidjienne et formulaires d'enregistrement des limites et des titulaires."}
  - {annee: 1964, evenement: "Nouvelle rédaction de l'art. 13 : permis obligatoire pour pêcher dans une zone coutumière enregistrée, après consultation du groupe titulaire."}
  - {annee: 2000, evenement: "Création du réseau des aires marines gérées localement de Fidji (FLMMA) à l'échelle des qoliqoli."}
  - {annee: 2013, evenement: "Constitution : part des redevances minières pour les titulaires de droits de pêche coutumiers enregistrés (art. 30)."}
  - {annee: 2020, evenement: "La stratégie nationale pour la biodiversité 2020-2025 recense 410 iQoliqoli."}
