droits:
  autogouvernement: {valeur: "partiel", note: "Chaque fiducie est gérée par un comité de gestion de sept personnes élues par les actionnaires en assemblée générale, seul habilité à exercer les pouvoirs de la fiducie (s. 15 et 16) ; la fiducie tient au moins une assemblée générale par an en plus de l'assemblée annuelle (s. 22(7)) ; depuis 2025, la fiducie soumet au ministre un plan stratégique triennal qu'il approuve ou modifie (s. 21A et 21B), et le ministre peut remplacer le comité par un administrateur (s. 23B et 23F).", source: "https://www.legislation.vic.gov.au/in-force/acts/aboriginal-lands-act-1970/1970"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Concession de la Couronne (Crown grant) des terres de chaque réserve à la fiducie (s. 8 et 9) ; la fiducie ne peut vendre ou céder de terres que par résolution unanime de ses membres et ne peut louer pour plus de 21 ans qu'à la majorité des trois quarts (s. 11(3) et 11(4)) ; droit à une licence perpétuelle et gratuite sur la bande de 200 chaînons d'arpenteur (links, environ 40 m) le long de la Hopkins et du lac Tyers exclue de la concession, où seuls la fiducie, ses membres et les personnes qu'elle autorise peuvent entrer (s. 9(4), 9(5) et 9(7)).", source: "https://www.legislation.vic.gov.au/in-force/acts/aboriginal-lands-act-1970/1970"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le ministre consulte les membres de la fiducie et les résidents de Lake Tyers avant de désigner un lieu de la réserve ouvert aux agents publics et aux prestataires de services de santé et sociaux (s. 24A(2) et 24A(3)) ; avant de nommer un administrateur, il consulte la First Peoples' Assembly (s. 23B(4A), 2025) et peut solliciter les observations des résidents (s. 23B(5)) ; consultation sans droit de veto.", source: "https://www.legislation.vic.gov.au/in-force/acts/aboriginal-lands-act-1970/1970"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon le rapport de révision indépendante de 2021, la fiducie de Lake Tyers a été placée sous administration de 2004 à 2015 et rendue au contrôle de la communauté avec l'élection d'un comité en octobre 2015, la fiducie de Framlingham a reçu un administrateur (s. 23B) pendant la deuxième phase des consultations de la révision, une part des actions de Lake Tyers (jusqu'à 40 % selon le rapport) reste bloquée dans des successions et la loi ne garantit aucun financement aux fiducies.", source: "https://www.firstpeoplesrelations.vic.gov.au/sites/default/files/2023-10/Final-report-for-the-review-of-the-Act.pdf"}
chronologie:
  - {annee: 1970, evenement: "Sanction de l'Aboriginal Lands Act le 8 décembre : création des deux fiducies et attribution des réserves en pleine propriété."}
  - {annee: 1971, evenement: "Gazette du 9 juin : publication des registres (17 membres fondateurs à Framlingham, 92 à Lake Tyers)."}
  - {annee: 2002, evenement: "Révision interne de la loi par Aboriginal Affairs Victoria."}
  - {annee: 2004, evenement: "Loi modificative (en vigueur le 4 novembre) : pouvoir de nommer un administrateur à Lake Tyers, routes de la réserve déclarées publiques ; Lake Tyers placée sous administration."}
  - {annee: 2013, evenement: "Loi modificative (en vigueur le 1er juillet) : administrateur possible pour les deux fiducies, rapports financiers et sociaux au ministre."}
  - {annee: 2015, evenement: "Fin de l'administration de Lake Tyers ; élection d'un comité de gestion en octobre."}
  - {annee: 2018, evenement: "Nomination de deux réviseurs indépendants, Jason Behrendt et Timothy Goodwin."}
  - {annee: 2021, evenement: "Rapport final de la révision (septembre) : 42 recommandations."}
  - {annee: 2023, evenement: "Réponse du gouvernement de Victoria (août) : mise en œuvre en deux phases."}
  - {annee: 2025, evenement: "Entrée en vigueur le 28 mai de l'Aboriginal Land Legislation Amendment Act 2024 (transmission des parts, assemblées, plan stratégique) et des Aboriginal Lands Regulations 2025."}
  - {annee: 2026, evenement: "Entrée en vigueur le 1er mai de la s. 238 du Statewide Treaty Act 2025 : consultation de la First Peoples' Assembly avant toute nomination d'administrateur."}
