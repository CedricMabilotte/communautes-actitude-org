resume: >-
  Fiche agrégée : l'Aboriginal Lands Act 1970, loi de l'État de Victoria sanctionnée le 8 décembre 1970, révoque le statut de réserve des anciennes missions de Lake Tyers et de Framlingham et en attribue la pleine propriété (freehold, propriété sans limite de durée) à deux personnes morales, le Lake Tyers Aboriginal Trust et le Framlingham Aboriginal Trust. Les membres de chaque fiducie sont des actionnaires : à l'origine, les Aborigènes résidant sur la réserve à l'entrée en vigueur de la loi et déjà présents au 1er janvier 1968 (à Lake Tyers, également ceux arrivés avant le 1er octobre 1970 avec l'accord du conseil aborigène local), ainsi que leurs enfants nés avant cette date (s. 3), soit 17 personnes à Framlingham et 92 à Lake Tyers selon la Gazette du 9 juin 1971. Chaque fiducie est gérée par un comité de gestion de sept personnes élues par les actionnaires, sous le contrôle du ministre, qui peut nommer un administrateur. Le rapport de révision de 2021 compte environ 160 à 170 actionnaires et 120 à 130 résidents à Lake Tyers, environ 20 à 25 actionnaires et 71 résidents (décembre 2017) à Framlingham ; la loi modificative de 2024, en vigueur depuis le 28 mai 2025, encadre la transmission des parts et la gouvernance.
