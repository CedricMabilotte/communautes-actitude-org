  - {instrument: "Loi sur l'agriculture et le développement rural du 8 février 2007, RS/VS 910.1, art. 51 et 99", nature: "loi", annee: 2007, source: "https://lex.vs.ch/app/fr/texts_of_law/910.1"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les consortages sont régis par leurs statuts et règlements tels qu'approuvés par le Conseil d'État (LACC de 1998, art. 126, al. 2, let. a) et acquièrent la personnalité morale par cette approbation (art. 127) ; ils ont une assemblée générale qui peut décider leur dissolution (art. 128) et tiennent un registre des consorts (art. 130, al. 2). Le Conseil d'État ne peut refuser l'approbation que « pour des motifs importants », et ce refus ne peut être attaqué par la voie civile ou administrative (art. 127, al. 3).", source: "https://lex.vs.ch/app/fr/texts_of_law/211.1"}
  pouvoir_normatif: {valeur: "partiel", note: "Les statuts et règlements approuvés s'appliquent en premier, sous réserve des dispositions légales impératives ; la loi ne vient qu'ensuite, puis l'usage local (LACC, art. 126, al. 2) ; là où la loi ne règle pas tout, les coutumes et usages locaux gardent force obligatoire et sont appliqués d'office par le juge (art. 125). Ces règles ne valent que pour le consortage, ses biens et ses membres.", source: "https://lex.vs.ch/app/fr/texts_of_law/211.1"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le but d'exploitation des alpages, forêts, fontaines et bisses ne peut être modifié et les biens sociaux ne peuvent être aliénés ou engagés de façon à entraver cette exploitation (LACC, art. 129) ; le partage et la vente des forêts des consortages exigent une autorisation forestière (loi sur les forêts de 2011, art. 28). Ce n'est pas une inaliénabilité absolue : l'assemblée générale peut décider la dissolution, le solde de la liquidation revient alors aux consorts (art. 128), et chaque consort dispose librement de sa part dans les limites de la loi et des statuts (art. 131).", source: "https://lex.vs.ch/app/fr/texts_of_law/211.1"}
  ressources: {valeur: "partiel", note: "Chaque consort a une part de jouissance des biens sociaux ; lorsque ces droits portent sur des droits d'alpage ou de bisse, le vote à l'assemblée est proportionnel aux parts, sauf disposition contraire des statuts (LACC, art. 130, al. 1 et 3). Les statuts peuvent réserver le droit de vote à certains consorts, les allodiateurs (consorts titulaires de tous les droits sociaux), les autres gardant un droit d'information sur la gestion (art. 130, al. 4).", source: "https://lex.vs.ch/app/fr/texts_of_law/211.1"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
