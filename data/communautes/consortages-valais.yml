effectivite: {valeur: "effective", note: "Selon la fiche de l'Office fédéral de la culture (Thomas Antonietti, février 2022), de nombreux bisses sont encore gérés par des consortages, organisés autour d'un comité, d'un garde du bisse et des consorts qui participent à la remise en eau, et 80 % des surfaces irriguées du canton le sont par l'eau des bisses. La version de 2012 du même auteur indique que le recul de l'agriculture a réduit le travail collectif, que des communes ont repris par endroits les charges d'anciens consortages, et que la plupart des consortages ont toujours pour but l'irrigation et les alpages.", source: "https://www.lebendige-traditionen.ch/dam/fr/sd-web/dtmv4dYDE2hr/geteilschaften_imwallis.pdf"}
chronologie:
  - {annee: 1240, evenement: "Statut écrit de l'alpage d'Eginen, en Valais, cité par le Dictionnaire historique de la Suisse parmi les premiers statuts de communautés."}
  - {annee: 1483, evenement: "À Törbel, des paysans concluent un contrat sur l'usage de l'eau et des pâturages."}
  - {annee: 1907, evenement: "Le Code civil suisse (art. 59, al. 3) laisse les sociétés d'allmends au droit cantonal ; il entre en vigueur en 1912."}
  - {annee: 1990, evenement: "Elinor Ostrom publie « Governing the Commons », qui s'appuie notamment sur les travaux de Robert McC. Netting à Törbel."}
  - {annee: 1998, evenement: "Loi valaisanne d'application du Code civil du 24 mars (art. 126 à 131 sur les consortages), en vigueur le 1er janvier 1999."}
  - {annee: 2007, evenement: "Loi cantonale sur l'agriculture et le développement rural : soutien au maintien des bisses (art. 51 et 99)."}
  - {annee: 2011, evenement: "Loi cantonale sur les forêts : autorisation forestière pour le partage et la vente des forêts des consortages (art. 28)."}
  - {annee: 2012, evenement: "Fiche « Consortages en Valais » publiée dans la liste des traditions vivantes en Suisse."}
fiabilite:
  verifie: ["Texte des art. 125 à 131 de la LACC du 24 mars 1998 (recueil systématique du Valais, RS/VS 211.1), en vigueur depuis le 1er janvier 1999.", "Art. 59, al. 3, du Code civil suisse (Fedlex).", "Art. 28 de la loi cantonale sur les forêts de 2011 et art. 51 et 99 de la loi cantonale sur l'agriculture de 2007 (recueil systématique du Valais).", "Organisation des consortages de bisses (comité, garde, consorts) et part de 80 % des surfaces irriguées : fiche de l'Office fédéral de la culture, version de février 2022, en ligne le 6 août 2024 à une nouvelle adresse.", "Statut de l'alpage d'Eginen (1240) et organes des communautés : Dictionnaire historique de la Suisse, article « Communauté ».", "Contrat de Törbel de 1483 : swissinfo.ch, 20 juin 2025."]
  non_confirme: ["Nombre de consortages, de consorts et surface totale : aucune source officielle trouvée ; aucune liste publique des statuts approuvés par le Conseil d'État n'a été trouvée, donc aucun tableau des sites.", "La part de 80 % des surfaces irriguées n'a pas d'année de mesure ni de source primaire citée dans la fiche de l'Office fédéral de la culture.", "Les contestations des décisions sociales vont au juge ordinaire (LACC, art. 130, al. 6) ; aucune juridiction propre n'a été trouvée.", "Les consortages qui relèvent de la loi sur l'agriculture ou de la loi sur les bourgeoisies sont exclus du régime de la LACC (art. 126, al. 1) ; leur part n'a pas été établie.", "Inscription de l'irrigation traditionnelle suisse sur une liste de l'UNESCO : non vérifiée.", "Aucun document de l'ONU, de la Convention sur la diversité biologique ou du Conseil de l'Europe visant ce régime n'a été trouvé."]
