resume: >-
  Fiche agrégée : elle couvre les consortages (en allemand Geteilschaften), corporations dont les membres, les consorts, possèdent ou exploitent en commun un alpage, un bisse (canal d'irrigation), une forêt ou une fontaine. Le Code civil suisse (art. 59, al. 3) laisse les sociétés d'allmends (biens d'usage collectif) au droit cantonal. La loi valaisanne d'application du Code civil du 24 mars 1998 (art. 126 à 131) les soumet à leurs statuts et règlements approuvés par le Conseil d'État, leur donne par cette approbation la personnalité juridique (existence comme personne distincte de ses membres, qui peut posséder des biens) et interdit de modifier leur but d'exploitation. L'assemblée des consorts, un comité et, pour les bisses, un garde du bisse administrent le bien ; les statuts fixent les devoirs des consorts, dont la participation aux travaux collectifs (corvées). Selon l'Office fédéral de la culture, 80 % des surfaces irriguées du canton reçoivent l'eau des bisses, dont beaucoup sont gérés par des consortages.
