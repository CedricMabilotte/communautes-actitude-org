resume: >-
  Mendha-Lekha est un village gond du district de Gadchiroli. Son assemblée de village (gram sabha) décide par consensus. En décembre 2009, elle a été l'une des deux premières en Inde à obtenir un titre de droits forestiers communautaires, sur environ 1 800 ha, au titre de la loi de 2006 ; elle vend elle-même son bambou depuis la remise du permis de transport le 27 avril 2011. Le village a été notifié en 2013 comme village « gramdan » (terres mises en commun au nom de l'assemblée), mais les registres fonciers n'avaient pas été modifiés en 2022.
