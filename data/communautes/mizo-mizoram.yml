droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée législative du Mizoram d'au moins quarante membres, Constitution, art. 371G (b), 1986 ; c'est l'assemblée de l'État, élue par l'ensemble des habitants, qui exerce les pouvoirs de l'art. 371G (a) sur les matières mizo.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les lois du Parlement sur les pratiques religieuses ou sociales des Mizo, le droit coutumier mizo et la propriété foncière ne s'appliquent au Mizoram que si l'Assemblée le décide par résolution, Constitution, art. 371G (a), 1986.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Protection de l'administration de la justice civile et pénale rendue selon le droit coutumier mizo, Constitution, art. 371G (a) (iii), 1986.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "reconnu", note: "Les lois du Parlement sur la propriété et la cession des terres ne s'appliquent qu'après résolution de l'Assemblée, Constitution, art. 371G (a) (iv), 1986.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "L'application des lois fédérales dans les quatre domaines de l'art. 371G (1986) dépend d'une résolution de l'Assemblée : rejet de l'amendement de 2023 à la loi sur la conservation des forêts le 22 août 2023, puis résolution d'août 2025 qui l'applique au Mizoram en citant l'art. 371G (a) (iv).", source: "https://mizoramassembly.in/storage/bulletins/August2025/0ued9P7JyG2335mmGiAy.pdf"}
  langue: {valeur: "reconnu", note: "Le mizo est la langue des usages officiels, Mizoram Official Language Act, 1975, art. 3 ; l'anglais peut aussi être employé, art. 4. L'Assemblée a demandé le 10 mars 2026 l'inscription du mizo à la huitième annexe de la Constitution (liste des langues reconnues au niveau de l'Union).", source: "https://www.legitquest.com/act/mizoram-official-language-act-1975/602D"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le siège du Mizoram à la Chambre du peuple (Lok Sabha) et 39 des 40 sièges de l'Assemblée de l'État sont réservés aux tribus répertoriées, catégorie qui inclut les Mizo avec d'autres groupes, Delimitation Order, 2008, tableaux A et B (Constitution, art. 330 et 332).", source: "https://www.eci.gov.in/Documents/Delimitation/DelimitationofParliamentaryAssemblyConstituenciesOrder-2008(English).pdf"}
  statut_personnel: {valeur: "reconnu", note: "Les pratiques religieuses et sociales et le droit coutumier des Mizo sont soustraits aux lois du Parlement sauf résolution de l'Assemblée, Constitution, art. 371G (a) (i) et (ii), 1986. Les citoyens indiens non résidents doivent obtenir un permis d'entrée (Inner Line Permit) délivré par l'État, Bengal Eastern Frontier Regulation de 1873, art. 2 ; une personne qui n'est pas originaire de la zone ne peut y acquérir de droit sur la terre sans l'accord du gouvernement, art. 7 ; le ministère de l'Intérieur présente ce régime comme une protection contre l'installation d'autres Indiens (2013).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'Assemblée du Mizoram a rejeté par résolution unanime le 22 août 2023 l'amendement fédéral de 2023 à la loi sur la conservation des forêts (Morung Express), puis l'a rendu applicable au Mizoram par une résolution d'août 2025 qui se fonde sur l'art. 371G (Assam Tribune, 28 août 2025) ; la loi principale de 1980, antérieure à 1986, s'applique sans résolution.", source: "https://morungexpress.com/mizoram-assembly-adopts-resolution-opposing-forest-conservation-amendment-act"}
chronologie:
  - {annee: 1986, evenement: "Accord du Mizoram signé le 30 juin avec le Mizo National Front ; 53e amendement insérant l'art. 371G."}
  - {annee: 1987, evenement: "Le Mizoram devient un État ; l'art. 371G entre en vigueur le 20 février."}
  - {annee: 1975, evenement: "Le Mizoram Official Language Act fait du mizo la langue des usages officiels."}
  - {annee: 2023, evenement: "L'Assemblée rejette l'application de l'amendement fédéral à la loi sur la conservation des forêts."}
  - {annee: 2025, evenement: "L'Assemblée rend cet amendement applicable au Mizoram à compter de 2025."}
  - {annee: 2026, evenement: "Le 10 mars, l'Assemblée adopte à l'unanimité une résolution demandant l'inscription du mizo à la huitième annexe de la Constitution."}
