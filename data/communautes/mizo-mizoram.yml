resume: >-
  Les Mizo vivent au Mizoram, au nord-est de l'Inde. L'accord du 30 juin 1986 entre le gouvernement indien et le Mizo National Front met fin à l'insurrection et prévoit la création de l'État. L'article 371G de la Constitution, inséré par le 53e amendement (1986, en vigueur le 20 février 1987), soumet à une résolution de l'Assemblée législative du Mizoram l'application des lois du Parlement sur les pratiques religieuses et sociales des Mizo, leur droit coutumier, la justice coutumière et la propriété foncière. L'Assemblée a exercé ce pouvoir en 2023 et en 2025 sur la loi forestière fédérale.
