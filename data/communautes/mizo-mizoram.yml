  statut_personnel: {valeur: "reconnu", note: "Les pratiques religieuses et sociales et le droit coutumier des Mizo sont soustraits aux lois du Parlement sauf résolution de l'Assemblée, Constitution, art. 371G (a) (i) et (ii), 1986. Les citoyens indiens non résidents doivent obtenir un permis d'entrée (Inner Line Permit) délivré par l'État, Bengal Eastern Frontier Regulation de 1873, art. 2 ; une personne qui n'est pas originaire de la zone ne peut y acquérir de droit sur la terre sans l'accord du gouvernement, art. 7 ; le ministère de l'Intérieur présente ce régime comme une protection contre l'installation d'autres Indiens (2013).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'Assemblée du Mizoram a rejeté par résolution unanime le 22 août 2023 l'amendement fédéral de 2023 à la loi sur la conservation des forêts, puis l'a rendu applicable par résolution en août 2025, en invoquant l'art. 371G.", source: "https://morungexpress.com/mizoram-assembly-adopts-resolution-opposing-forest-conservation-amendment-act"}
chronologie:
  - {annee: 1986, evenement: "Accord du Mizoram signé le 30 juin avec le Mizo National Front ; 53e amendement insérant l'art. 371G."}
  - {annee: 1987, evenement: "Le Mizoram devient un État ; l'art. 371G entre en vigueur le 20 février."}
  - {annee: 2023, evenement: "L'Assemblée rejette l'application de l'amendement fédéral à la loi sur la conservation des forêts."}
  - {annee: 2025, evenement: "L'Assemblée rend cet amendement applicable au Mizoram à compter de 2025."}
