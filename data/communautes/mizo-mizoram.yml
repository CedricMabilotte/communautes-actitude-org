resume: >-
  Les Mizo vivent au Mizoram, au nord-est de l'Inde. L'accord du 30 juin 1986 entre le gouvernement indien et le Mizo National Front met fin à l'insurrection et prévoit la création de l'État. L'article 371G de la Constitution, inséré par le 53e amendement (1986, en vigueur le 20 février 1987), soumet à une résolution de l'Assemblée législative du Mizoram l'application des lois du Parlement sur les pratiques religieuses et sociales des Mizo, leur droit coutumier, la justice coutumière et la propriété foncière. L'Assemblée a exercé ce pouvoir en 2023 et en 2025 sur la loi forestière fédérale. Le mizo est langue officielle de l'État depuis 1975. Trois conseils autonomes de district couvrent le sud de l'État (voir les fiches « Chakma du Mizoram », « Lai » et « Mara »).
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître officiellement les peuples tribaux comme groupes distincts ayant droit à une protection spéciale et de préciser les critères d'inscription sur la liste des tribus « énumérées » ; § 12 et 19 sur les États du nord-est ; les Mizo et le Mizoram ne sont pas nommés", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
