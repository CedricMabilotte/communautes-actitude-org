  pouvoir_normatif: {valeur: "reconnu", note: "Les lois du Parlement sur les pratiques religieuses ou sociales des Mizo, le droit coutumier mizo et la propriété foncière ne s'appliquent au Mizoram que si l'Assemblée le décide par résolution, Constitution, art. 371G (a), 1986.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Protection de l'administration de la justice civile et pénale rendue selon le droit coutumier mizo, Constitution, art. 371G (a) (iii), 1986.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  terres: {valeur: "reconnu", note: "Les lois du Parlement sur la propriété et la cession des terres ne s'appliquent qu'après résolution de l'Assemblée, Constitution, art. 371G (a) (iv), 1986.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
