  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur le huitième rapport du Royaume-Uni (CCPR/C/GBR/CO/8), adoptées en mars 2024, qui couvrent aussi les dépendances de la Couronne : le § 54 relève que l'âge de la responsabilité pénale reste fixé à 10 ans dans l'île de Man.", annee: 2024, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/GBR/CO/8&l=en&t=pdf"}
