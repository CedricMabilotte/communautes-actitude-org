droits:
  autogouvernement: {valeur: "reconnu", note: "Tynwald comprend la House of Keys (24 membres, deux par circonscription, élus tous les cinq ans) et le Conseil législatif (président de Tynwald, évêque, procureur général et 8 membres élus par la House of Keys, Isle of Man Constitution Amendment Act 1919, art. 7) ; le ministre en chef est nommé par le lieutenant-gouverneur sur désignation d'au moins 13 membres de la House of Keys, Council of Ministers Act 1990, art. 2.", source: "https://legislation.gov.im/cms/images/LEGISLATION/PRINCIPAL/1990/1990-0003/1990-0003_7.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Tynwald adopte les lois de l'île ; la sanction royale (« Royal Assent », approbation du souverain) est déléguée au lieutenant-gouverneur pour de nombreuses matières non réservées, après examen par le ministère britannique de la Justice ; le Parlement britannique ne légifère pas pour l'île en matière fiscale ou interne sans son accord, par convention et non par texte (note CBP-8611, 2025, sections 1.4 et 3.1) ; en avril 2026, le ministère britannique de la Justice a refusé de recommander pour la sanction royale l'Assisted Dying Bill (projet de loi sur l'aide à mourir) adopté par Tynwald, et Tynwald a voté le 16 juin 2026 les amendements demandés avant une nouvelle transmission (ITV, 17 avril et 16 juin 2026).", source: "https://researchbriefings.files.parliament.uk/documents/CBP-8611/CBP-8611.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Haute Cour de justice de l'île de Man (« High Court ») a une division d'appel, la Staff of Government Division ; ses juges sont les deemsters (juges de l'île), un juge d'appel et des juges auxiliaires (« Judicial Officers »), High Court Act 1991, art. 1 à 3.", source: "https://legislation.gov.im/cms/images/LEGISLATION/PRINCIPAL/1991/1991-0012/1991-0012_7.pdf"}
  terres: {valeur: "partiel", note: "En 1991, le gouvernement de l'île a acheté au gouvernement britannique la mer territoriale jusqu'à 12 milles, avec les droits sur les hydrocarbures, le charbon et les minéraux ; la propriété en est confiée au Department of Infrastructure ; aucune source sur un régime collectif des terres émergées n'a été trouvée.", source: "https://www.gov.im/about-the-government/departments/infrastructure/harbours-information/territorial-seas/"}
  ressources: {valeur: "reconnu", note: "Le département compétent peut, par règlement, interdire la pêche dans une zone des eaux territoriales de l'île sans licence de pêche en mer qu'il délivre, Fisheries Act 2012, art. 37 et 38 ; depuis l'achat de la mer territoriale en 1991, l'île perçoit les recettes des câbles, des pipelines et des licences d'exploration pétrolière et gazière (gov.im, page « Territorial Seas »).", source: "https://www.gov.im/media/1347777/fisheriesact2012_2.pdf"}
  consentement: {valeur: "partiel", note: "Le Parlement britannique ne légifère pas pour les dépendances de la Couronne en matière fiscale ou interne sans leur accord, et le Royaume-Uni s'engage depuis les cadres de 2007-2008 à ne pas agir sur le plan international en leur nom sans consultation préalable ; ces engagements relèvent de la convention et non de la loi (note CBP-8611, 2025, sections 3.1 et 4.4).", source: "https://researchbriefings.files.parliament.uk/documents/CBP-8611/CBP-8611.pdf"}
  langue: {valeur: "partiel", note: "Depuis 2020, le mannois relève de la partie III de la Charte européenne des langues régionales ou minoritaires (37 engagements) ; le programme scolaire fixé par le département de l'Éducation doit comprendre l'enseignement du mannois, Education Act 2001, art. 8(2)(b) ; aucune loi conférant au mannois un statut de langue officielle n'a été trouvée.", source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/news/-/asset_publisher/t9sWxmY5eZkv/content/protection-of-manc-gaelic-under-the-ecrml-extended"}
  education: {valeur: "reconnu", note: "Le département de l'Éducation, des Sports et de la Culture de l'île fixe par arrêté le programme des élèves d'âge scolaire obligatoire des écoles publiques et subventionnées, qui comprend le mannois, la culture et l'histoire de l'île, Education Act 2001, art. 8.", source: "https://legislation.gov.im/cms/images/LEGISLATION/PRINCIPAL/2001/2001-0033/2001-0033_13.pdf"}
  fiscalite: {valeur: "reconnu", note: "L'impôt sur le revenu des résidents est établi par la loi de l'île, Income Tax Act 1970, art. 1 ; les habitants ne paient pas l'impôt britannique ; l'île verse au Royaume-Uni une contribution annuelle pour la défense et les services communs (accord de 1994) et partage les recettes douanières et de TVA selon l'accord de 1979 (note CBP-8611, 2025, section 2.2).", source: "https://legislation.gov.im/cms/images/LEGISLATION/PRINCIPAL/1970/1970-0003/1970-0003_50.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Seul un « Isle of Man worker » (travailleur de l'île) peut occuper un emploi dans l'île sans permis : personne née dans l'île, ou y ayant résidé ordinairement au moins 5 ans sans interruption, ou membre de la famille d'une telle personne, Control of Employment Act 2014, art. 4 et 6.", source: "https://legislation.gov.im/cms/images/LEGISLATION/PRINCIPAL/2014/2014-0011/2014-0011_5.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Une étude universitaire décrit l'île comme une dépendance de la Couronne « presque entièrement autonome » (P. W. Edge, Oxford Brookes) ; la note de la Bibliothèque de la Chambre des communes (CBP-8611, 12 septembre 2025) confirme le financement de l'île par ses propres recettes fiscales. En avril 2026, le refus du ministère britannique de la Justice de recommander la sanction royale de l'Assisted Dying Bill a retardé l'entrée en vigueur de cette loi de l'île (ITV, 17 avril 2026).", source: "https://radar.brookes.ac.uk/radar/file/bcb6c409-57ff-4034-af92-85c65c0d174c/1/Lisvanes%20legacy%20-%202020%20-%20Edge.pdf"}
chronologie:
  - {annee: 1406, evenement: "Début de la période des seigneurs de Man, qui gouvernent l'île jusqu'en 1765."}
  - {annee: 1765, evenement: "La Couronne britannique acquiert l'île."}
  - {annee: 1919, evenement: "Loi de révision constitutionnelle (Isle of Man Constitution Amendment Act 1919) sur la composition du Conseil législatif."}
  - {annee: 1970, evenement: "Loi sur l'impôt sur le revenu (Income Tax Act 1970)."}
  - {annee: 1979, evenement: "Accord de partage des recettes douanières et de TVA avec le Royaume-Uni."}
  - {annee: 1990, evenement: "Le 1er octobre, le Conseil exécutif devient le Conseil des ministres (Council of Ministers Act 1990)."}
  - {annee: 1991, evenement: "Achat de la mer territoriale au gouvernement britannique ; loi sur la Haute Cour (High Court Act 1991)."}
  - {annee: 1994, evenement: "Accord sur la contribution annuelle de l'île au Royaume-Uni pour la défense et les services communs."}
  - {annee: 2000, evenement: "Le Comité des droits de l'homme de l'ONU adopte ses observations finales sur les dépendances de la Couronne (CCPR/C/79/Add.119)."}
  - {annee: 2001, evenement: "Loi sur l'éducation (Education Act 2001) : le mannois entre au programme scolaire."}
  - {annee: 2014, evenement: "Loi sur le contrôle de l'emploi (Control of Employment Act 2014)."}
  - {annee: 2020, evenement: "Le 23 décembre, extension de la partie III de la Charte européenne des langues régionales ou minoritaires au mannois ; le 31 décembre, fin de l'application du protocole n° 3 qui liait l'île à l'Union européenne."}
  - {annee: 2021, evenement: "Recensement : 84 069 habitants."}
  - {annee: 2024, evenement: "Le Comité des droits de l'homme de l'ONU adopte ses observations finales sur le Royaume-Uni et ses dépendances (CCPR/C/GBR/CO/8), qui nomment l'île de Man."}
  - {annee: 2026, evenement: "En avril, le ministère britannique de la Justice refuse de recommander pour la sanction royale l'Assisted Dying Bill adopté par Tynwald ; le 16 juin, Tynwald adopte les amendements demandés en vue d'une nouvelle transmission."}
  - {annee: 2026, evenement: "Élections générales à la House of Keys le 24 septembre : 15 des 24 membres élus siègent pour la première fois ; trois ministres sortants sont battus."}
fiabilite:
  verifie: ["Council of Ministers Act 1990, art. 1 à 3 : désignation du ministre en chef par au moins 13 membres de la House of Keys, 9 ministres au plus.", "Isle of Man Constitution Amendment Act 1919, art. 7 et 8 : composition du Conseil législatif.", "Site de Tynwald : 24 membres de la House of Keys, deux par circonscription, 12 circonscriptions ; sanction royale par le lieutenant-gouverneur pour la plupart des projets.", "Note CBP-8611 (12 septembre 2025) : délégation de la sanction royale, convention de non-législation, accords de 1979 et 1994, absence de représentation au Parlement britannique, fin du protocole n° 3.", "CCPR/C/79/Add.119, § 1, 6, 10, 11, 12 et 15.", "Recensement 2021 (tableau 2.1) : 84 069 résidents ; 4 villes, 4 villages, 16 paroisses historiques (la paroisse d'Onchan figure sous le village d'Onchan).", "gov.im : surface de 572 km² ; achat de la mer territoriale en 1991.", "High Court Act 1991, art. 1 à 3 ; Income Tax Act 1970, art. 1 ; Education Act 2001, art. 8 ; Fisheries Act 2012, art. 37 et 38 ; Control of Employment Act 2014, art. 4 et 6.", "Conseil de l'Europe : partie III de la Charte appliquée au mannois depuis le 23 décembre 2020.", "CCPR/C/GBR/CO/8 (2024), § 54 : île de Man nommée.", "ITV (17 avril 2026) : le ministère britannique de la Justice ne recommande pas la sanction royale de l'Assisted Dying Bill ; ITV (16 juin 2026) : amendements adoptés par Tynwald.", "Manx Radio (25 septembre 2026) : 15 nouveaux membres de la House of Keys, trois ministres battus."]
  non_confirme: ["Isle of Man Constitution Act 1990 et ordonnance de 2022 sur la sanction royale cités par la note CBP-8611, non consultés.", "Date du passage de la House of Keys à l'élection directe (1866 selon plusieurs sources secondaires) non vérifiée sur un texte primaire.", "Date d'extension à l'île de la partie II de la Charte des langues régionales non vérifiée.", "Issue de la seconde demande de sanction royale de l'Assisted Dying Bill après le 16 juin 2026 non trouvée.", "Élection du ministre en chef par la House of Keys annoncée pour le 13 octobre 2026, non encore tenue au 6 octobre 2026.", "Endonyme des habitants en mannois non vérifié sur une source."]
