resume: >-
  L'île de Man, en mer d'Irlande, est une dépendance de la Couronne (« Crown Dependency ») : elle relève du souverain britannique, « seigneur de Man », sans faire partie du Royaume-Uni. Son parlement, Tynwald, réunit la House of Keys, dont les 24 membres sont élus au suffrage direct dans 12 circonscriptions, et le Conseil législatif, élu pour l'essentiel par la House of Keys. Le chef du gouvernement est désigné par la House of Keys et forme avec ses ministres le Conseil des ministres (Council of Ministers Act 1990). L'île a ses lois, ses tribunaux et sa fiscalité ; le Royaume-Uni conserve la défense et les relations internationales.
reconnaissance_regionale:
  - {mecanisme: "charte_langues_regionales", detail: "Le 23 décembre 2020, le Royaume-Uni notifie au Conseil de l'Europe l'application de la partie III de la Charte européenne des langues régionales ou minoritaires au mannois (gaélique de l'île) : 37 engagements des autorités de l'île, dont l'enseignement préscolaire en mannois et le dépôt de documents dans cette langue.", annee: 2020, source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/news/-/asset_publisher/t9sWxmY5eZkv/content/protection-of-manc-gaelic-under-the-ecrml-extended"}
reconnaissance_onu:
