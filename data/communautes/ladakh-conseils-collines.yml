reconnaissance_onu: []
base_nationale:
  - {instrument: "Ladakh Autonomous Hill Development Councils Act, 1997 (loi du Jammu-et-Cachemire, modifiée en 2002)", nature: "loi", annee: 1997, source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  - {instrument: "Règlements présidentiels pour le Ladakh de juin 2025 (domicile, réservations, Ladakh Official Languages Regulation 2025)", nature: "loi", annee: 2025, source: "https://m.thewire.in/article/government/issue-of-statehood-and-sixth-schedule-unresolved-ladakh-leaders-as-union-govt-notifies-new-rules"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseil de 26 membres élus au suffrage direct et jusqu'à 4 nommés, loi de 1997, art. 4 ; conseil exécutif dirigé par le Chief Executive Councillor, art. 29 ; pouvoirs exercés sous réserve des directives du gouvernement, art. 23 ; dissolution possible par le gouverneur, art. 52 ; un tiers des sièges réservés aux femmes depuis un règlement de juin 2025.", source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil adopte, avec l'approbation préalable du gouvernement, des règlements (regulations et bye-laws, règlements locaux) applicables dans le district sur les matières prévues par la loi, loi de 1997, art. 61 (1), dont le barème des taxes et redevances, art. 24 (3), et le recrutement aux postes du district, art. 41 ; ils prennent effet à leur publication au journal officiel, art. 61 (2).", source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Toute la terre du district est transférée au conseil à sa constitution, loi de 1997, art. 42 (1) ; le conseil décide de l'attribution et de l'usage des terres, art. 23 (i) ; le gouvernement garde le pouvoir d'exproprier pour un usage public ou la défense, art. 42 (3).", source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non délimitées et usage des canaux pour l'agriculture, loi de 1997, art. 23 (xi) et (xii).", source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Le bhoti et le purgi sont langues officielles avec l'anglais, le hindi et l'ourdou, Ladakh Official Languages Regulation 2025 ; le conseil a la charge de la promotion des langues et de la culture, loi de 1997, art. 23 (x).", source: "https://m.thewire.in/article/government/issue-of-statehood-and-sixth-schedule-unresolved-ladakh-leaders-as-union-govt-notifies-new-rules"}
  education: {valeur: "partiel", note: "Pouvoirs exécutifs du conseil en matière d'éducation et de formation professionnelle, loi de 1997, art. 23 (xvi) et (xx).", source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  fiscalite: {valeur: "partiel", note: "Le conseil peut lever certaines taxes et redevances fixées par règlement local, art. 24, et gère un fonds propre, art. 43 ; il prépare le budget du district, art. 23 (iv).", source: "https://faolex.fao.org/docs/pdf/IND227527.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Domicile accordé après 15 ans de résidence continue depuis le 31 octobre 2019 ; 85 % des emplois publics réservés aux castes et tribus répertoriées et autres classes défavorisées, règlements de juin 2025.", source: "https://m.thewire.in/article/government/issue-of-statehood-and-sixth-schedule-unresolved-ladakh-leaders-as-union-govt-notifies-new-rules"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les conseils fonctionnent et sont élus ; les organisations de Leh et de Kargil jugent les règlements de 2025 insuffisants et maintiennent leurs demandes d'État et de Sixième annexe.", source: "https://m.thewire.in/article/government/issue-of-statehood-and-sixth-schedule-unresolved-ladakh-leaders-as-union-govt-notifies-new-rules"}
chronologie:
  - {annee: 1995, evenement: "Conseil autonome de développement des collines de Leh."}
  - {annee: 1997, evenement: "Loi du Jammu-et-Cachemire sur les conseils du Ladakh, assentiment du 8 octobre."}
  - {annee: 2003, evenement: "Conseil de Kargil, juillet."}
  - {annee: 2019, evenement: "Le Ladakh devient territoire de l'Union le 31 octobre."}
  - {annee: 2025, evenement: "Règlements de juin sur le domicile, les réservations et les langues officielles."}
  - {annee: 2024, evenement: "Le ministère de l'Intérieur porte le nombre de districts de deux à sept (août)."}
  - {annee: 2026, evenement: "Les cinq nouveaux districts deviennent opérationnels en avril ; le 14 juillet, l'administration annonce un conseil dans chacun des sept districts."}
