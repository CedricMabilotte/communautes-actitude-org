resume: >-
  Le Ladakh, peuplé à plus de 83 % de membres de tribus répertoriées, a deux conseils autonomes de développement des collines, à Leh depuis 1995 et à Kargil depuis 2003, régis par une loi de 1997. Chaque conseil compte 26 membres élus au suffrage direct ; la terre du district lui est transférée et il décide de son attribution, de l'éducation, de la santé et du budget de développement. Devenu territoire de l'Union en 2019, le Ladakh a reçu en 2025 des règles de domicile, de réservation d'emplois et de langues officielles ; la demande d'inscription à la Sixième annexe reste ouverte.
