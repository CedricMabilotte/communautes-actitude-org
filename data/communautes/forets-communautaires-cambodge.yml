resume: >-
  Fiche agrégée : elle couvre les communautés rurales titulaires d'une forêt communautaire au titre de la loi forestière de 2002 (art. 40 à 47) et du sous-décret (anukret, décret du gouvernement) n° 79 du 2 décembre 2003 sur la gestion des forêts communautaires. Des habitants d'un ou plusieurs villages forment une communauté, élisent un comité de gestion et signent avec le chef de cantonnement (service territorial) de l'Administration forestière un accord de forêt communautaire (contrat d'usage) de quinze ans renouvelable, qui leur donne le droit d'accéder à la forêt, de l'utiliser, de la gérer et d'en tirer profit selon un plan de gestion approuvé. La forêt reste propriété publique de l'État et ne peut être exploitée en concession ni cédée. Fin 2017, l'Administration forestière comptait 610 communautés sur 506 600 hectares, 1 082 villages et 151 622 familles membres ; 414 avaient signé un accord et 81 disposaient d'un plan de gestion approuvé.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Cambodge à la Convention sur la diversité biologique (juin 2019) : présente la loi forestière de 2002 et le sous-décret de 2003 comme base juridique de la gestion des forêts par les communautés rurales, compte 610 forêts communautaires en 2017, dont 464 enregistrées, et rappelle l'objectif du Programme forestier national de deux millions d'hectares attribués à environ 1 000 groupes de foresterie communautaire", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/kh-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi forestière, promulguée par Kram NS/RKM/0802/016 du 31 août 2002, chapitre 9 (art. 40 à 47) : droits d'usage coutumiers et forêts communautaires", nature: "loi", annee: 2002, source: "https://data.opendevelopmentcambodia.net/dataset/5ad7c28f-b585-41b7-880e-26fe6a79064e/resource/bdf49aaf-e0aa-4013-950c-1ecfe925940a/download/d46d4a9f-f8b3-494f-9717-fabbcbd80234.pdf"}
  - {instrument: "Sous-décret n° 79 ANKr.BK du 2 décembre 2003 sur la gestion des forêts communautaires", nature: "loi", annee: 2003, source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  - {instrument: "Code de l'environnement et des ressources naturelles (Royal Kram du 29 juin 2023) : art. 485 (2) (forêts hors aires protégées confiées au ministère chargé des forêts), art. 499 et 500 (droits d'usage traditionnels des communautés locales), art. 864 (abrogation limitée à trois lois et aux dispositions incompatibles des autres lois)", nature: "loi", annee: 2023, source: "https://data.opendevelopmentcambodia.net/en/dataset/15618852-c2af-4d8c-950e-dea975724bbe/resource/0894d3f7-051f-4235-8206-375efe4d98a4/download/code-on-environment-and-natural-resources.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque communauté est dirigée par un comité de gestion de cinq à onze membres élus à bulletin secret, pour cinq ans, par au moins les deux tiers des membres en assemblée publique (art. 16 à 20 du sous-décret de 2003) ; les membres suivent les instructions de l'Administration forestière (art. 10), qui reconnaît, rejette ou dissout les communautés (art. 24).", source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité de gestion adopte le règlement de la forêt communautaire (droits d'accès, redevances d'usage, partage des bénéfices, amendes) et ses statuts internes (art. 5, points 4 et 8, et art. 21 du sous-décret de 2003), dans le format fixé par arrêté du ministère (art. 23) et en conformité avec le plan de gestion approuvé par l'Administration forestière, qui peut en exiger la modification (art. 29 et 30).", source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  justice_propre: {valeur: "partiel", note: "Le règlement adopté par le comité peut prévoir des amendes pour les infractions (art. 5, point 8, du sous-décret de 2003) et le comité représente la communauté dans le règlement des différends (art. 21) ; les infractions au sous-décret sont poursuivies selon la loi en vigueur (art. 32) et le comité signale les délits forestiers à l'Administration forestière (art. 21).", source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  terres: {valeur: "partiel", note: "La forêt communautaire est propriété publique de l'État (art. 3 du sous-décret de 2003) et une partie du domaine forestier permanent attribuée par le ministre (art. 41 de la loi de 2002) ; l'accord dure au plus quinze ans, renouvelable (art. 42 de la loi, art. 27 du sous-décret) ; la communauté ne peut ni l'exploiter en concession ni céder ses droits (art. 44 de la loi, art. 15 du sous-décret), et l'État peut résilier l'accord pour un usage d'intérêt public supérieur, avec un préavis de six mois (art. 28).", source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  ressources: {valeur: "partiel", note: "Les communautés exercent sans permis les droits d'usage coutumiers (bois mort, fruits, miel, résine, bois de construction, pâturage, vente de produits forestiers non ligneux) (art. 40 de la loi de 2002) et récoltent les produits forestiers de la zone délimitée selon le plan de gestion (art. 44) ; la vente de produits forestiers est interdite pendant les cinq premières années du plan et soumise aux redevances légales (art. 11 et 12 du sous-décret de 2003).", source: "https://data.opendevelopmentcambodia.net/dataset/5ad7c28f-b585-41b7-880e-26fe6a79064e/resource/bdf49aaf-e0aa-4013-950c-1ecfe925940a/download/d46d4a9f-f8b3-494f-9717-fabbcbd80234.pdf"}
  consentement: {valeur: "partiel", note: "Les redevances sont fixées après consultation de la communauté (art. 13 du sous-décret de 2003), le comité participe à la consultation sur les règlements qui concernent ses membres (art. 21) et, avant une résiliation pour motif d'intérêt public, l'Administration forestière négocie avec le comité une indemnisation (art. 28) ; aucun texte ne subordonne ces décisions au consentement de la communauté.", source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les usages coutumiers sont exemptés de redevance et les activités prévues par le plan de gestion de permis (art. 13 du sous-décret de 2003) ; le comité ouvre un compte bancaire, gère les finances de la communauté (art. 21), peut percevoir des redevances d'usage prévues par son règlement (art. 5, point 8) et rechercher des financements directs (art. 31).", source: "https://faolex.fao.org/docs/pdf/cam81979.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Fin 2017, sur 610 communautés établies, 464 étaient reconnues par arrêté du ministère, 414 avaient signé un accord et 81 disposaient d'un plan de gestion approuvé, condition de la récolte prévue par l'accord (Administration forestière, 2017) ; une étude indépendante de neuf forêts communautaires de Prey Long relève moins de traces de coupe, une biomasse plus élevée et plus de régénération que dans les forêts de production témoins, mais davantage d'essences de valeur commerciale dans les zones témoins (Lambrick et al., Conservation Biology, 2014).", source: "https://data.opendevelopmentmekong.net/dataset/c5827fb3-bbb5-48ee-a368-13fb5d118ac3/resource/8354e8a4-4b07-440c-88d2-72bfaf4f09ec/download/1acfb253-1bbf-47f0-9e06-8bb062feeb16.pdf"}
chronologie:
  - {annee: 1991, evenement: "Début de la foresterie communautaire dans le pays, selon le cinquième rapport national du Cambodge à la CDB."}
  - {annee: 2002, evenement: "Promulgation de la loi forestière le 31 août : le chapitre 9 reconnaît les droits d'usage coutumiers et crée la forêt communautaire."}
  - {annee: 2003, evenement: "Sous-décret n° 79 du 2 décembre sur la gestion des forêts communautaires."}
  - {annee: 2007, evenement: "Premiers arrêtés du ministère de l'Agriculture recensés dans le jeu de données d'Open Development Cambodia pour la reconnaissance de forêts communautaires (37 sites)."}
  - {annee: 2012, evenement: "Le cinquième rapport national à la CDB compte 453 forêts communautaires sur 399 880 hectares."}
  - {annee: 2017, evenement: "L'Administration forestière compte 610 communautés, 506 600,86 hectares, 1 082 villages et 151 622 familles membres dans 21 provinces."}
  - {annee: 2019, evenement: "Le sixième rapport national à la CDB présente le régime et l'objectif de deux millions d'hectares de forêts communautaires."}
  - {annee: 2023, evenement: "Code de l'environnement et des ressources naturelles (29 juin), applicable un an après son entrée en vigueur : il abroge trois lois, dont celle de 2008 sur les aires protégées, mais pas la loi forestière, et reprend les droits d'usage traditionnels (art. 499 et 500)."}
fiabilite:
  verifie: ["Loi forestière de 2002, art. 37 et 40 à 47 (traduction anglaise, Open Development Cambodia).", "Sous-décret n° 79 de 2003, art. 1 à 34 (traduction non officielle du 20 décembre 2003, FAOLEX).", "Chiffres de 2017 (610 communautés, 506 600,86 ha, 102 districts, 296 communes, 1 082 villages, 151 622 familles ; 464 reconnues, 414 accords, 81 plans de gestion) : tableaux 1 et 2 des statistiques de l'Administration forestière, publiées en khmer en avril 2018.", "Sixième rapport national du Cambodge à la CDB (juin 2019) et cinquième rapport (2014) : passages sur la foresterie communautaire.", "Code de l'environnement et des ressources naturelles de 2023, traduction anglaise : art. 485, 499, 500, 864 et 865 ; la loi forestière de 2002 n'est pas dans la liste des lois abrogées.", "Terme khmer សហគមន៍ព្រៃឈើ : employé dans le titre et les tableaux des statistiques de l'Administration forestière (2018).", "Tableau par site : 339 forêts communautaires reconnues par arrêté entre 2007 et 2017, jeu de données « Community forestry (2008-2017) » d'Open Development Cambodia (CC BY-SA 4.0).", "Résultats de Lambrick et al. (2014) sur neuf sites de Prey Long."]
  non_confirme: ["Dispositions du sous-décret de 2003 jugées incompatibles avec le Code de 2023 (art. 864 (2)) : aucune liste officielle trouvée ; le texte final du Code ne nomme pas les forêts communautaires, alors que le projet décrit dans le sixième rapport à la CDB (2019) les soumettait aux principes de cogestion.", "Chiffres postérieurs à 2017 non trouvés.", "Tableau par site : 339 lignes pour 337 noms distincts (deux paires de sites homonymes dans la même commune) ; il ne couvre que les arrêtés recensés par Open Development Cambodia, pas les 464 forêts reconnues en 2017 ; l'année indiquée est celle de l'arrêté.", "Population : l'Administration forestière publie le nombre de familles membres (151 622 en 2017), pas le nombre de personnes.", "Transcription latine de l'endonyme non vérifiée sur une source."]
