villages: {valeur: 11, annee: 2024, perimetre: "chefs-lieux et centres peuplés codifiés par le DANE (Divipola, mise à jour au 30 décembre 2024) dans les deux municipalités de l'archipel : San Andrés (chef-lieu), La Loma, San Luis, Punta Sur ; Santa Isabel (chef-lieu de Providencia), Fresh Water Bay, South West Bay, Botton House (graphie de la source), San Felipe, Rocky Point, Santa Catalina ; la Divipola ne distingue pas les secteurs à population raizale", source: "https://www.datos.gov.co/resource/xaxy-8nri.json?codigo_departamento=88"}
resume: >-
  Les Raizales sont la population native de l'archipel colombien de San Andrés, Providencia et Santa Catalina, dans la mer des Caraïbes, de langue créole à base anglaise (Creole ou Kriol). L'article 310 de la Constitution de 1991 dote l'archipel d'un régime spécial qui permet de limiter la circulation et la résidence pour protéger l'identité culturelle des communautés natives ; le décret-loi 2762 de 1991 crée à cette fin un office de contrôle de la circulation et de la résidence (OCCRE). La loi 47 de 1993 fait de l'anglais une langue officielle de l'archipel ; depuis la loi 2471 de 2025, le Creole ou Kriol, « langue maternelle du peuple ethnique raizal », l'est aussi. La Cour constitutionnelle qualifie les Raizales de groupe ethnique depuis 1994 et leur reconnaît le droit à la consultation préalable.
