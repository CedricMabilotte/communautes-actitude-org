resume: >-
  Les Croates du Burgenland sont une des six minorités (« Volksgruppen », groupes ethniques) que l'Autriche reconnaît nommément ; le Land estime leur nombre à environ 35 000 personnes.
  L'article 7 du traité d'État de 1955 leur garantit l'enseignement primaire en croate, l'usage du croate comme langue officielle et une signalisation bilingue dans les districts concernés.
  Le Volksgruppengesetz (loi sur les groupes ethniques) de 1976 met en œuvre ces garanties dans 28 communes du Burgenland et institue un conseil consultatif auprès de la Chancellerie fédérale.
  La loi de 1994 sur les écoles des minorités du Burgenland organise l'enseignement en croate et bilingue.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Convention-cadre pour la protection des minorités nationales en vigueur pour l'Autriche depuis le 1er juillet 1998 (BGBl. III n° 120/1998) ; cinquième avis du Comité consultatif adopté le 8 juin 2023, qui cite l'article 7 du traité d'État pour le croate au Burgenland, la loi scolaire des minorités du Burgenland et une émission hebdomadaire de 30 minutes en croate sur l'ORF (radio-télévision publique) au Burgenland.", annee: 2023, source: "https://rm.coe.int/5th-op-austria-fr/1680acfc2f"}
  - {mecanisme: "charte_langues_regionales", detail: "Charte européenne des langues régionales ou minoritaires ratifiée par l'Autriche le 28 juin 2001 ; le croate du Burgenland relève des parties II et III. Sixième rapport d'évaluation du Comité d'experts, 2026.", annee: 2026, source: "https://rm.coe.int/min-lang-2026-11-6th-ecrml-evaluation-report-on-austria-fr/48802da8d9"}
