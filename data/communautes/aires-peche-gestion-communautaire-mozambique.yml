resume: >-
  Fiche agrégée : elle couvre les communautés locales de pêche titulaires d'une « área de pesca de gestão comunitária » (APGC, aire de pêche à gestion communautaire) au Mozambique. La loi des pêches de 2013 adopte un régime de gestion participative qui doit assurer aux communautés de pêche l'accès aux ressources et la participation à leur gestion ; le règlement de la pêche maritime de 2020 définit l'APGC comme une aire délimitée du domaine public communautaire gérée par une ou plusieurs communautés locales, et fait des Conselhos Comunitários de Pesca (CCP, conseils communautaires de pêche) des organisations dotées de la personnalité juridique. Le diplôme ministériel n° 83/2023 du 6 juin 2023 fixe la procédure : proposition par les organisations communautaires ou par l'administration, consultations et consensus avec les communautés, plan de gestion, puis création par diplôme du ministre chargé des pêches. Au 31 mai 2024, un inventaire national recensait 107 aires marines à gestion locale, dont 28 en attente d'approbation ministérielle, et aucune aire publiée au Boletim da República (journal officiel).
