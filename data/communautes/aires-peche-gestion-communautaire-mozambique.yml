effectivite: {valeur: "partielle", note: "Selon l'inventaire national des aires marines à gestion locale (Pereira, Litulo et Fernandes, fondation Likhulu, juin 2024), 107 aires existantes ou proposées étaient recensées au 31 mai 2024, dont 61 établies formellement au niveau local et 28 en attente d'approbation et de publication, aucune n'étant publiée au Boletim da República ; 79 de ces initiatives sont portées par des conseils communautaires de pêche et 63,2 % n'ont pas de plan de gestion ; les auteurs relèvent une procédure longue et coûteuse, liée à l'exigence de plans de gestion des pêcheries de district publiés.", source: "https://biblioteca.biofund.org.mz/wp-content/uploads/2024/10/1728570656-1.%20Likhulu%20Report%20Moz%20LMMA%20Assessment%20Moz%20Aug%202024.pdf"}
chronologie:
  - {annee: 2013, evenement: "Loi des pêches n° 22/2013 du 1er novembre : régime de gestion participative, accès des communautés de pêche aux ressources."}
  - {annee: 2019, evenement: "Le sixième rapport national du Mozambique à la Convention sur la diversité biologique recense 307 conseils communautaires de pêche."}
  - {annee: 2020, evenement: "Règlement de la pêche maritime (décret n° 89/2020 du 8 octobre) : définition de l'APGC et des CCP."}
  - {annee: 2023, evenement: "Diplôme ministériel n° 83/2023, signé le 13 avril et publié le 6 juin : procédure de création, de modification et d'extinction des APGC."}
  - {annee: 2024, evenement: "Inventaire national au 31 mai : 107 aires marines à gestion locale, 28 dossiers en attente d'approbation ministérielle, aucune APGC publiée au Boletim da República."}
fiabilite:
  verifie: ["Diplôme ministériel n° 83/2023 : articles 1 à 15 et annexe, lus sur le Boletim da República n° 108 du 6 juin 2023.", "Loi n° 22/2013 : articles 23 (gestion participative), 25 (organes consultatifs) et 27 (zone réservée à la pêche à petite échelle jusqu'à 3 milles marins), lus sur le Boletim da República n° 88.", "Décret n° 89/2020 (REPMAR) : articles 22, 23, 24 et 160, lus sur le Boletim da República n° 192 du 8 octobre 2020.", "307 conseils communautaires de pêche en 2019 selon le sixième rapport national à la Convention sur la diversité biologique.", "Inventaire national des aires marines à gestion locale (fondation Likhulu, juin 2024) : tableaux 2, 3, 4 et 5 et conclusions, lus sur le rapport ; au 31 mai 2024, aucune aire publiée au Boletim da República."]
  non_confirme: ["Publication d'APGC au Boletim da República après le 31 mai 2024 : aucune source trouvée ; la valeur « remis en cause » du droit sur les terres repose sur la situation à cette date. Pas de tableau des sites, faute d'aire créée par diplôme.", "La surface de 1 168 564 ha couvre toutes les aires marines à gestion locale recensées (réserves communautaires, sanctuaires, APGC proposées), pas seulement des APGC.", "Étendue d'un éventuel droit d'accès exclusif des communautés dans l'aire : les textes réservent l'aire à certaines catégories de pêche, sans réserver l'accès aux seuls membres de la communauté.", "La loi de 2013 prévoit qu'une part des recettes de la pêche bénéficie aux communautés locales (art. 23, n° 2 d) ; aucun texte d'application fixant cette part n'a été trouvé.", "Le rapport de 2019 à la Convention sur la diversité biologique cite les conseils communautaires de pêche, mais il est antérieur au régime des APGC et ne le vise pas ; il n'est donc pas retenu comme reconnaissance onusienne.", "Population : non trouvé.", "Nombre de villages : non trouvé."]
