droits:
  autogouvernement: {valeur: "partiel", note: "Les Conselhos Comunitários de Pesca sont des organisations communautaires dotées de la personnalité juridique, régies par leurs statuts, qui participent à la gestion des pêcheries, veillent au respect des mesures de gestion et appuient le règlement des conflits liés à la pêche (REPMAR 2020, art. 22 ; diplôme n° 83/2023, art. 3 b) ; dans l'aire, les organisations communautaires mettent en œuvre le plan de gestion sous la supervision de l'administration des pêches (REPMAR, art. 23) ; le ministre approuve le statut type des CCP et le représentant de l'État au district autorise le début de leurs activités et peut y mettre fin (REPMAR, art. 22).", source: "https://adnap.gov.mz/download/aprovacao-do-regulamento-geral-da-pesca-maritima-repmar"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "conteste", note: "L'APGC est une aire délimitée du domaine public communautaire placée sous la gestion d'une ou plusieurs communautés locales, sur leur aire d'usage coutumier (REPMAR 2020, art. 23 ; diplôme n° 83/2023, art. 5) ; il s'agit d'un espace aquatique du domaine public et non d'une propriété ; le ministre la crée, la modifie et peut l'éteindre, notamment pour non-respect de ses objectifs (diplôme n° 83/2023, art. 4, 9 et 10) ; au 31 mai 2024, aucune aire n'avait été publiée au Boletim da República selon cette procédure et 28 dossiers attendaient l'approbation ministérielle (inventaire national Pereira, Litulo et Fernandes, fondation Likhulu, 2024) : le texte n'était pas appliqué à cette date.", source: "https://biblioteca.biofund.org.mz/wp-content/uploads/2024/10/1728570656-1.%20Likhulu%20Report%20Moz%20LMMA%20Assessment%20Moz%20Aug%202024.pdf"}
  ressources: {valeur: "partiel", note: "La loi des pêches de 2013 impose de tenir compte, dans la gestion participative, de la nécessité d'assurer le droit des communautés de pêche d'accéder aux ressources halieutiques et de participer à leur planification et à leur gestion (art. 23, n° 2 a) ; la bande des 3 milles marins est réservée à la pêche à petite échelle, de subsistance, de recherche, récréative et sportive (art. 27) ; dans l'APGC, seules la pêche artisanale, de subsistance, récréative et sportive, de recherche, expérimentale et de formation sont permises, et les CCP participent à la mise en œuvre des mécanismes d'accès et de restriction, y compris la détermination du nombre de pêcheurs et d'engins (REPMAR 2020, art. 22 et 23) ; la délivrance des licences et le contrôle restent à l'administration centrale et à ses services provinciaux et de district (REPMAR, art. 23).", source: "https://adnap.gov.mz/download/lei-n-22-2013-de-1-de-novembro-aprova-a-lei-das-pescas-e-revoga-a-lei-3-90-de-26-de-setembro-2"}
  consentement: {valeur: "partiel", note: "La demande de création doit joindre le document attestant les consensus obtenus avec les communautés locales concernées (diplôme n° 83/2023, art. 6, n° 1 b vi) et le proposant doit organiser des consultations communautaires avec l'administration du district (art. 7, n° 4) ; la décision appartient au ministre, dans un délai de 30 jours (art. 7, n° 6).", source: "https://sibmoz.gov.mz/content/uploads/2023/09/Diploma-Ministerial-n.o-83_2023-de-6-de-Junho-Estabelece-o-Regime-Juridico-de-APGCs.pdf"}
