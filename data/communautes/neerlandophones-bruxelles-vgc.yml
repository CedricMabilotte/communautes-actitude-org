resume: >-
  La Constitution belge prévoit au Parlement de la Région de Bruxelles-Capitale des groupes linguistiques et des collèges compétents pour les matières communautaires (art. 136). La loi spéciale du 12 janvier 1989 réserve 17 des 89 sièges de ce parlement au groupe linguistique néerlandais et fixe la parité linguistique au gouvernement régional, président excepté. Le groupe néerlandais et ses membres du gouvernement forment la Commission communautaire flamande (Vlaamse Gemeenschapscommissie), qui gère depuis 1989 les institutions néerlandophones de Bruxelles en matière de culture, d'enseignement et d'aide aux personnes. Elle adopte des règlements (verordeningen) sous la tutelle de la Communauté flamande.
