base_nationale:
  - {instrument: "Constitution de la Belgique coordonnée le 17 février 1994, art. 4, 136, 166 § 3 et 178", nature: "constitution", annee: 1994, source: "https://www.senate.be/doc/const_fr.html"}
  - {instrument: "Loi spéciale du 12 janvier 1989 relative aux institutions bruxelloises (Bijzondere wet met betrekking tot de Brusselse instellingen), art. 20, 31, 34, 35, 41, 60, 64, 65, 76, 83 et 83bis à 83quater", nature: "loi_organique", annee: 1989, source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Commission communautaire flamande, dotée de la personnalité juridique, a pour organes le groupe linguistique néerlandais du Parlement bruxellois (17 membres) et un collège formé des membres néerlandophones du gouvernement régional et des secrétaires d'État régionaux néerlandophones, loi spéciale du 12 janvier 1989, art. 60 ; un membre bruxellois du gouvernement flamand assiste au collège avec voix consultative (art. 76) ; la Communauté flamande organise par décret la tutelle (contrôle administratif) sur la Commission (art. 83).", source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
  pouvoir_normatif: {valeur: "partiel", note: "La Commission adopte des règlements (verordeningen) dans les matières culturelles, d'enseignement et personnalisables, avec les mêmes compétences que les autres pouvoirs organisateurs, et exerce les compétences réglementaires que lui délègue le Parlement flamand, loi spéciale de 1989, art. 64 et 65, Constitution, art. 166 § 3 ; ces règlements n'ont pas force de loi et restent soumis aux décrets flamands et à la tutelle (art. 83).", source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les membres du gouvernement bruxellois sont élus sur une liste signée par la majorité absolue des membres de chaque groupe linguistique ; à défaut d'accord, chaque candidat néerlandophone doit être présenté par la majorité absolue des membres du groupe linguistique néerlandais, loi spéciale de 1989, art. 35 ; les trois quarts des membres d'un groupe linguistique peuvent suspendre l'examen d'un projet d'ordonnance (norme régionale ayant force de loi) jugé nuisible aux relations entre communautés (procédure dite de la « sonnette d'alarme »), budgets exceptés, art. 31.", source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
  langue: {valeur: "reconnu", note: "La région bilingue (français et néerlandais) de Bruxelles-Capitale est une des quatre régions linguistiques, Constitution, art. 4 ; les règlements et arrêtés de la Commission sont publiés au Moniteur belge en néerlandais avec une traduction française, loi spéciale de 1989, art. 70bis.", source: "https://www.senate.be/doc/const_fr.html"}
  education: {valeur: "partiel", note: "La Commission exerce les compétences d'un pouvoir organisateur (autorité qui crée et gère des établissements) : programmation des infrastructures, création, gestion et subvention d'institutions d'enseignement et culturelles, loi spéciale de 1989, art. 64 § 1er ; elle a repris en 1995 l'enseignement néerlandophone organisé à Bruxelles par l'ancienne province de Brabant (art. 79bis et 80bis) ; le contenu de l'enseignement relève des décrets de la Communauté flamande (Constitution, art. 127).", source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
  fiscalite: {valeur: "partiel", note: "La Commission dispose d'un budget propre, de dotations annuelles inscrites au budget du Parlement flamand et des revenus des biens qu'elle gère, loi spéciale de 1989, art. 60 et 82 § 2 ; le gouvernement flamand fixe par arrêté son régime budgétaire et comptable (art. 82 § 1er) ; le Parlement bruxellois lui transfère des moyens, Constitution, art. 178, selon une clé de 20 % pour la Commission flamande et de 80 % pour la Commission française (art. 83bis), et des dotations spéciales (art. 83ter et 83quater) ; aucun pouvoir fiscal propre n'a été trouvé.", source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
  representation: {valeur: "reconnu", note: "17 des 89 sièges du Parlement de la Région de Bruxelles-Capitale sont répartis entre les listes du groupe linguistique néerlandais, quel que soit le résultat du vote, loi spéciale de 1989, art. 20 § 2 ; le gouvernement régional compte, président excepté, autant de membres néerlandophones que francophones (art. 34), et au moins un des secrétaires d'État régionaux appartient au groupe linguistique le moins nombreux (art. 41).", source: "https://codex.vlaanderen.be/PrintDocument.ashx?id=1006967"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'assemblée de la Commission est composée des 17 membres néerlandophones du Parlement bruxellois issus des élections régionales du 9 juin 2024, répartis entre neuf formations ; le Collège réunit les deux ministres et le secrétaire d'État néerlandophones du gouvernement bruxellois ; la Commission n'a pas reçu de compétences législatives de la Communauté flamande et reste sous sa tutelle (Wikipédia). L'Université Laval situe la part des néerlandophones autour de 10 % des électeurs, pour au moins 20 % des sièges.", source: "https://fr.wikipedia.org/wiki/Commission_communautaire_flamande"}
chronologie:
  - {annee: 1971, evenement: "Création de la Commission néerlandaise de la culture (Nederlandse Cultuurcommissie) de l'agglomération bruxelloise."}
  - {annee: 1989, evenement: "Loi spéciale du 12 janvier 1989 relative aux institutions bruxelloises ; installation du Raad van de VGC le 14 juillet."}
  - {annee: 1995, evenement: "Scission de la province de Brabant ; la Commission reprend l'enseignement néerlandophone provincial à Bruxelles."}
  - {annee: 2001, evenement: "Accord du Lombard : Parlement bruxellois porté à 89 membres, dont 17 sièges garantis au groupe linguistique néerlandais."}
  - {annee: 2014, evenement: "Sixième réforme de l'État ; modification des articles 60, 61 et 63 de la loi spéciale."}
fiabilite:
  verifie: ["Constitution belge, art. 4, 127, 136, 166 § 3 et 178 (texte coordonné du Sénat).", "Loi spéciale du 12 janvier 1989, art. 20 § 2 (72 et 17 sièges), 31, 34, 35, 41, 60, 64, 65, 70bis, 76, 79bis, 80bis, 82, 83 et 83bis à 83quater (version consolidée de la Vlaamse Codex).", "Composition de l'assemblée après les élections du 9 juin 2024 (17 membres, site du Raad van de VGC et Wikipédia).", "Raad de 17 membres, collège de deux ministres et d'un secrétaire d'État néerlandophones, décision par consensus (site de la VGC).", "Installation du Raad le 14 juillet 1989, accord du Lombard de 2001 et sixième réforme de l'État de 2014 (site du Raad van de VGC) ; création de la commission de la culture en 1971 (loi du 26 juillet 1971, citée par la loi spéciale, art. 78 et 80)."]
  non_confirme: ["Nombre de néerlandophones à Bruxelles : aucun recensement linguistique ; l'Université Laval cite une estimation d'environ 10 %, non reprise comme chiffre.", "Surface de 162 km² et 19 communes : chiffres de l'IBSA, année de référence non précisée sur la page ; 162 km² non recoupé avec une publication statistique détaillée.", "L'article 60, alinéa 5, de la loi spéciale ajoute cinq membres au groupe linguistique pour les compétences que la Commission exerce seule (art. 60bis) ; le site du Raad ne fait état que de 17 membres.", "Six sièges du Parlement flamand élus par les électeurs des listes néerlandophones de Bruxelles : indiqué par le site du Raad van de VGC, texte de la loi spéciale du 8 août 1980 non consulté.", "Aucune reconnaissance onusienne ou régionale nommant les néerlandophones de Bruxelles n'a été trouvée ; la Belgique n'a pas ratifié la Convention-cadre pour la protection des minorités nationales (non vérifié sur le site du Conseil de l'Europe).", "Recouvrement partiel avec la fiche de la Communauté flamande, dont les décrets s'appliquent aux institutions néerlandophones de Bruxelles."]
