resume: >-
  La Nation haïda vit sur l'archipel de Haida Gwaii, au large de la côte nord de la Colombie-Britannique. Son gouvernement, le Conseil de la Nation haïda, est reconnu par une loi provinciale de 2023 et par une loi fédérale de 2024. La Colombie-Britannique reconnaît par la loi depuis 2024 le titre ancestral haïda (droit collectif sur la terre issu de l'occupation antérieure) sur l'ensemble de l'archipel ; la Cour suprême de la province l'a déclaré par consentement des parties en septembre 2025. Gwaii Haanas, au sud de l'archipel, est cogéré avec le Canada depuis 1993.
