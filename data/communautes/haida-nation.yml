reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Devant le Comité permanent des affaires autochtones et du Nord de la Chambre des communes (INAN), le gouvernement du Canada présente le projet de loi S-16, devenu la Loi sur la reconnaissance de la Nation haïda (L.C. 2024, ch. 29), comme conforme à ses obligations au titre de la Loi sur la Déclaration des Nations unies sur les droits des peuples autochtones (2021).", annee: 2024, source: "https://www.rcaanc-cirnac.gc.ca/eng/1733348293891/1733348316005"}
  - {mecanisme: "rapporteur_special", detail: "Le rapport du Rapporteur spécial sur la situation au Canada (A/HRC/27/52/Add.2) cite l'arrêt Nation haïda c. Colombie-Britannique (2004) comme fondement de l'obligation de consulter.", annee: 2014, source: "https://undocs.org/A/HRC/27/52/Add.2"}
