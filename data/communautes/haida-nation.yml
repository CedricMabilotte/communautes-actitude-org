droits:
  autogouvernement: {valeur: "reconnu", note: "Le Canada reconnaît le Conseil de la Nation haïda comme gouvernement autorisé à agir pour la Nation (L.C. 2024, ch. 29, art. 3 b) et 4) ; la loi provinciale de 2023 le reconnaît comme gouvernement de la Nation haïda (art. 1).", source: "https://laws-lois.justice.gc.ca/fra/lois/H-0.3/page-1.html"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi provinciale prend acte de « lois de la Nation haïda » à concilier avec le droit provincial (S.B.C. 2023, ch. 24, art. 4.4(1)) ; à titre provisoire, les lois provinciales sur les terres publiques continuent de s'appliquer aux terres de titre haïda (art. 4.4(2)). L'accord « Rising Tide » de 2024 fixe à cette conciliation une transition estimée à deux ans (annexe A).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/23024"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi provinciale reconnaît le titre ancestral haïda sur les terres de Haida Gwaii (S.B.C. 2023, ch. 24, art. 4.1, ajouté en 2024) ; la Cour suprême de la Colombie-Britannique l'a déclaré sur les terres de l'archipel le 5 septembre 2025 ; les propriétés privées en fief simple (pleine propriété) sont maintenues.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/23024"}
  ressources: {valeur: "partiel", note: "Le Conseil de gestion de Haida Gwaii (deux membres nommés par la Nation haïda, deux par la province, un président nommé par les deux) fixe la possibilité annuelle de coupe (volume de bois récoltable chaque année) et approuve les plans de gestion des aires protégées (S.B.C. 2010, ch. 17, art. 3, 5 et 6) ; ses compétences excluent les réserves, les municipalités et les terres privées (art. 1).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/10017_01"}
  consentement: {valeur: "partiel", note: "L'arrêt Nation haïda c. Colombie-Britannique (2004 CSC 73) impose à l'État l'obligation de consulter et d'accommoder (adapter la mesure) un peuple autochtone dont les droits sont revendiqués ; selon l'arrêt (par. 48), ce processus ne donne pas de droit de veto tant que la revendication n'est pas établie.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20041118-2004CSC73"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La loi fédérale définit la Nation haïda comme la collectivité des citoyens haïdas visés à l'article 2 de la constitution de la Nation (L.C. 2024, ch. 29, art. 2) ; l'inscription au registre des Indiens reste fédérale.", source: "https://laws-lois.justice.gc.ca/fra/lois/H-0.3/page-1.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le titre est reconnu par la province et déclaré par la cour en 2025, mais la déclaration est suspendue 24 mois à l'égard du Canada pour certains parcs nationaux, aires de conservation et lieux patrimoniaux, les intérêts fonciers fédéraux et les réserves au sens de la Loi sur les Indiens ; les droits marins et les dommages pour atteinte au titre restent à juger.", source: "https://cassels.com/insights/bc-supreme-court-confirms-aboriginal-title-over-haida-gwaii/"}
chronologie:
  - {annee: 1974, evenement: "Création du Conseil de la Nation haïda (7 décembre)."}
  - {annee: 1985, evenement: "Le Conseil désigne Gwaii Haanas site patrimonial haïda."}
  - {annee: 1993, evenement: "Accord de Gwaii Haanas avec le Canada : cogestion par le Conseil de gestion de l'archipel."}
  - {annee: 2002, evenement: "La Nation engage une action en reconnaissance de titre ancestral."}
  - {annee: 2004, evenement: "Arrêt Nation haïda c. Colombie-Britannique de la Cour suprême du Canada sur l'obligation de consulter."}
  - {annee: 2010, evenement: "Haida Gwaii Reconciliation Act : Conseil de gestion paritaire, l'archipel prend officiellement le nom de Haida Gwaii ; accord marin de Gwaii Haanas."}
  - {annee: 2023, evenement: "Accord de reconnaissance tripartite (18 juillet) ; loi provinciale reconnaissant le Conseil de la Nation haïda."}
  - {annee: 2024, evenement: "Accord « Rising Tide » (14 avril) ; loi provinciale de reconnaissance du titre (sanction 16 mai, en vigueur 5 juillet) ; loi fédérale de reconnaissance (sanction 7 novembre) ; accord fédéral « Big Tide » (4 décembre)."}
  - {annee: 2025, evenement: "Déclaration du titre ancestral haïda sur les terres de Haida Gwaii par la Cour suprême de la Colombie-Britannique, par consentement (5 septembre)."}
fiabilite:
  verifie: ["Articles 2 à 5 de la loi fédérale L.C. 2024, ch. 29 (version codifiée, sanction 7 novembre 2024).", "Articles 1, 2 et 4.1 de la loi provinciale S.B.C. 2023, ch. 24.", "Composition et attributions du Conseil de gestion de Haida Gwaii (S.B.C. 2010, ch. 17).", "Paragraphe 48 de l'arrêt 2004 CSC 73 (absence de droit de veto).", "Annexe A de l'accord « Rising Tide » (transition estimée à deux ans).", "Population inscrite des bandes 669 et 670 (registre fédéral, septembre 2026)."]
