  verifie: ["Art. 61 (2) et 63 de la Constitution de 2010 (Constitute Project).", "Art. 4 (1), 5 (3), 6, 15, 20, 21, 35, 36, 37, 39 et 47 de la loi n° 27 de 2016 et date d'entrée en vigueur (Kenya Law, version au 31 décembre 2022).", "Nombre de 64 terres enregistrées (48 anciens group ranches, 16 anciennes trust lands), répartition par comté, objectif de 348 communautés, date de 2017 du règlement d'application et délai de novembre 2021 pour les group ranches : plan directeur d'enregistrement de masse 2026-2031 (ministère des Terres, section 1.1, tableau 2 et section 2.4.4).", "Par. 23 des observations finales du CERD (CERD/C/KEN/CO/5-7, 8 juin 2017) et par. 6 et 48 des observations finales du CDESC (E/C.12/KEN/CO/2-5, 6 avril 2016)."]
  non_confirme: ["Le plan directeur donne le nombre de terres enregistrées par comté mais pas leurs noms ni leurs surfaces : pas de tableau des sites ; surface totale et population concernée : aucune source publique trouvée.", "Le plan directeur est un projet mis en consultation publique le 25 septembre 2026 ; ses chiffres peuvent changer dans la version finale.", "Texte du règlement d'application de la loi (Community Land Regulations, 2017) : non consulté.", "Aucune inscription au registre APAC ni document de la CDB visant ce régime n'a été vérifié.", "Nombre de villages : non trouvé."]
