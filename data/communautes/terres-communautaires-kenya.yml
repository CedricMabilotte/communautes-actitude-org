resume: >-
  Fiche agrégée : elle couvre les communautés kényanes enregistrées au titre de la loi n° 27 de 2016 sur les terres communautaires (Community Land Act), prise en application de l'article 63 de la Constitution de 2010. La terre communautaire est dévolue à la communauté (art. 4 de la loi), qui la gère par une assemblée de tous ses membres adultes et un comité de gestion élu de 7 à 15 membres (art. 15). Toute aliénation et tout accord d'investissement exigent l'accord des deux tiers des membres adultes (art. 15 (5) et 36 (3)). Selon le plan directeur d'enregistrement de masse publié par le ministère des Terres en 2026, 64 terres communautaires étaient alors enregistrées, dont 48 anciens group ranches (terres collectives détenues par des représentants de groupe) et 16 anciennes trust lands (terres tenues en fiducie par les collectivités locales).
  Les Endorois et les Ogiek, visés par des décisions du système africain des droits de l'homme, ont leurs fiches propres.
