base_nationale:
  - {instrument: "Constitution du Kenya de 2010, art. 61 (2) et 63 (terres communautaires)", nature: "constitution", annee: 2010, source: "https://www.constituteproject.org/constitution/Kenya_2010?lang=en"}
  - {instrument: "Community Land Act (loi sur les terres communautaires) n° 27 de 2016, entrée en vigueur le 21 septembre 2016, version consolidée au 31 décembre 2022 ; art. 2, 4 à 7, 15, 20, 21, 30, 35 à 37, 39, 40 et 47", nature: "loi", annee: 2016, source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque communauté enregistrée a une assemblée communautaire formée de tous ses membres adultes, dont le quorum de décision est des deux tiers, et qui élit un comité de gestion des terres communautaires de 7 à 15 membres chargé d'administrer la terre pour le compte de la communauté (art. 15 de la loi de 2016). L'enregistrement de la communauté passe par le registraire des terres communautaires (art. 7). Tant qu'elle n'est pas enregistrée, la terre est tenue en fiducie par le gouvernement de comté (art. 63 (3) de la Constitution, art. 6 de la loi).", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  pouvoir_normatif: {valeur: "partiel", note: "Une communauté enregistrée peut adopter des règles ou règlements (by-laws) sur la gestion et l'administration de sa terre : investissements, durée des baux, conservation, usage et aménagement des terres (art. 37 de la loi de 2016) ; le comité de gestion propose des règles ratifiées par l'assemblée (art. 15 (4)).", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  justice_propre: {valeur: "partiel", note: "Une communauté enregistrée peut recourir à des modes amiables de règlement des différends, y compris les mécanismes traditionnels de règlement des conflits, et leur donne priorité pour les différends sur la terre communautaire (art. 39 (1) et (3) de la loi de 2016) ; les différends entre membres ou entre communautés enregistrées sont d'abord portés devant les mécanismes internes prévus par les règlements de la communauté (art. 39 (2)) ; la médiation est organisée à l'art. 40. Les tribunaux restent compétents et appliquent le droit coutumier local s'il est conforme à la Constitution et à la loi (art. 39 (4)).", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  terres: {valeur: "reconnu", note: "La terre communautaire est dévolue aux communautés et détenue par elles (art. 63 (1) de la Constitution ; art. 4 (1) de la loi de 2016) ; les droits fonciers coutumiers, y compris ceux détenus en commun, ont la même force juridique qu'une pleine propriété ou un bail (art. 5 (3)). Toute décision d'aliéner la terre ne lie la communauté que si elle est approuvée par au moins les deux tiers des membres adultes enregistrés (art. 15 (5)) ; la conversion de la terre exige aussi les deux tiers de l'assemblée (art. 21). Les terres des anciens group ranches ne peuvent être vendues, louées ou converties avant leur enregistrement selon la loi (art. 47).", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  ressources: {valeur: "partiel", note: "Sous réserve des autres lois, les ressources naturelles de la terre communautaire sont utilisées au bénéfice de toute la communauté, générations futures comprises, avec un partage équitable des avantages (art. 35 de la loi de 2016) ; la communauté respecte les lois et normes nationales sur les ressources naturelles et prend les mesures de conservation (art. 20).", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  consentement: {valeur: "partiel", note: "Sous réserve des autres lois écrites, un accord d'investissement sur une terre communautaire n'est conclu qu'entre l'investisseur et la communauté, à l'issue d'une consultation libre et ouverte, et doit prévoir une étude des effets environnementaux, sociaux, culturels et économiques, l'indemnisation et les redevances, et la remise en état (art. 36 (1) et (2) de la loi de 2016) ; il n'est valide que s'il est approuvé par les deux tiers des membres adultes, lors d'une assemblée communautaire où les deux tiers des membres adultes sont représentés (art. 36 (3)). L'obligation s'applique « sous réserve des autres lois écrites », qui peuvent l'écarter, et la loi parle d'une consultation libre et ouverte, non d'un consentement libre, préalable et éclairé.", source: "https://new.kenyalaw.org/akn/ke/act/2016/27/eng@2022-12-31"}
  langue: {valeur: "non_applicable", note: "", source: ""}
