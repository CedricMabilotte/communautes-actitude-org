  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale prend note de l'adoption du Community Land Act de 2016 (observations finales sur le Kenya, CERD/C/KEN/CO/5-7, par. 23)", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/KEN/CO/5-7&l=en&t=pdf"}
