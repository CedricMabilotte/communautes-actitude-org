effectivite: {valeur: "partielle", note: "Selon le projet de plan directeur d'enregistrement de masse des terres communautaires 2026-2031 élaboré par le ministère des Terres avec la Commission nationale des terres et soumis à consultation publique jusqu'au 8 octobre 2026, l'enregistrement reste lent plus de dix ans après la loi : 64 terres enregistrées au moment de la préparation du plan, et un objectif de 348 communautés en cinq ans ; le plan cite les litiges fonciers, les limites mal définies, le manque de fonds et de capacités techniques.", source: "https://www.kenyans.co.ke/news/127489-ministry-seeks-public-views-ksh-22b-plan-register-348-community-lands"}
chronologie:
  - {annee: 2010, evenement: "La Constitution classe la terre en publique, communautaire ou privée (art. 61) et dévolue la terre communautaire aux communautés (art. 63)."}
  - {annee: 2016, evenement: "Le Comité des droits économiques, sociaux et culturels recommande l'adoption du projet de loi sur les terres communautaires."}
  - {annee: 2016, evenement: "Entrée en vigueur, le 21 septembre, du Community Land Act n° 27 de 2016."}
  - {annee: 2017, evenement: "Publication du règlement d'application de la loi (Community Land Regulations)."}
  - {annee: 2017, evenement: "Le Comité pour l'élimination de la discrimination raciale prend note de l'adoption de la loi."}
  - {annee: 2021, evenement: "Expiration, en novembre, du délai fixé pour la transformation des group ranches en terres communautaires enregistrées ; elle reste inachevée."}
  - {annee: 2026, evenement: "Le ministère des Terres soumet à consultation un plan directeur d'enregistrement de 348 communautés pour 2026-2031 ; 64 terres communautaires sont alors enregistrées, dans neuf comtés."}
