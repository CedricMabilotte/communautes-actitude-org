  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En juillet 2014, la Gaia Foundation et l'ONG béninoise GRABE-Bénin indiquent que l'arrêté (n° 0121) a été mis en œuvre aux niveaux communal et local à Avrankou, Adjarra et Adjohoun, où les communautés prévoient de demander la reconnaissance légale de plusieurs forêts sacrées ; le cinquième rapport national à la Convention sur la diversité biologique (janvier 2014) indique que les forêts sacrées ne bénéficient pas encore de statut juridique de protection et que le projet PIFSAP a produit 45 plans d'aménagement et de gestion simplifiés et 24 cartes de délimitation ; en 2023, la fiche du registre APAC de Sinatabé indique que la forêt n'a pas d'acte propre et que des démarches sont en cours, et les fiches de Sinatabé et de Wianso indiquent que leurs comités locaux ont été remis en activité avec l'appui d'une ONG.", source: "https://gaiafoundation.org/benins-historic-sacred-forest-law-translated-into-english/"}
chronologie:
  - {annee: 1998, evenement: "Inventaire (Agbo et Sokpon) : environ 2 940 forêts sacrées sur 18 360 ha."}
  - {annee: 2010, evenement: "Lancement, le 19 janvier, du projet d'intégration des forêts sacrées dans le système des aires protégées (PIFSAP)."}
  - {annee: 2011, evenement: "Étude du PIFSAP proposant un cadre institutionnel de gestion communautaire des forêts sacrées à deux niveaux (comité local et comité communal)."}
  - {annee: 2012, evenement: "Arrêté interministériel du 16 novembre 2012 fixant les conditions de gestion durable de la forêt sacrée."}
  - {annee: 2014, evenement: "Cinquième rapport national à la Convention sur la diversité biologique : les forêts sacrées n'ont pas encore de statut juridique de protection."}
  - {annee: 2023, evenement: "Publication au registre APAC des fiches des forêts sacrées de Sinatabé et de Wianso."}
fiabilite:
  verifie:
    - "Texte des articles 1 à 53 de l'arrêté interministériel (reconnaissance légale par arrêté communal, intégration au domaine forestier communal, CLFS, CCSI, autorisations, règlement des conflits) dans la copie publiée par FAOLEX ; date du 16 novembre 2012 lue sur la copie et confirmée par le registre APAC."
    - "2 940 forêts sacrées et 18 360 ha (Agbo et Sokpon, 1998) dans la stratégie nationale 2011-2020 publiée par la Convention sur la diversité biologique et dans l'étude du PIFSAP de novembre 2011 publiée par le PNUD."
    - "Lancement du PIFSAP le 19 janvier 2010, 45 plans d'aménagement simplifiés et 24 cartes dans le cinquième rapport national (2014)."
    - "Fiches des forêts sacrées de Sinatabé et de Wianso et liste des sites du Bénin sur le registre APAC."
    - "Mise en œuvre de l'arrêté à Avrankou, Adjarra et Adjohoun selon la Gaia Foundation et GRABE-Bénin (juillet 2014)."
  non_confirme:
    - "Numéro de l'arrêté : le registre APAC écrit « 021 » ; la copie publiée par FAOLEX (numéro manuscrit) et la Gaia Foundation (2014) donnent « 0121 »."
    - "Le maintien en vigueur de l'arrêté après 2023 n'a pas été vérifié ; les fiches du registre APAC le citent comme applicable en 2023."
    - "Le nombre de forêts sacrées reconnues par arrêté communal et de forêts intégrées au domaine forestier communal n'a pas été trouvé ; aucune liste officielle des sites n'a été trouvée, d'où l'absence de tableau."
    - "Le chiffre de 2 940 forêts date de 1998 et couvre toutes les forêts sacrées, reconnues ou non ; la stratégie nationale indique aussi que les forêts sacrées seraient passées de plus de 18 000 ha en 1972 à moins de 3 000 ha en 2005, sans concilier les deux chiffres."
    - "La publication de l'arrêté au Journal officiel n'a pas été vérifiée."
    - "Population : non trouvée."
    - "Nombre de villages : non trouvé."
