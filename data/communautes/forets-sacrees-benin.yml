resume: >-
  Fiche agrégée : elle couvre les communautés villageoises, dignitaires et collectivités qui gèrent une forêt sacrée au Bénin. L'arrêté interministériel du 16 novembre 2012 (ministères de l'Environnement et de la Décentralisation) fixe les conditions de gestion des forêts sacrées : sur demande des communautés villageoises ou des dignitaires, le maire prend un arrêté communal de reconnaissance légale (reconnaissance officielle de la forêt et de ses limites), puis la forêt peut être intégrée au domaine forestier de la commune par arrêté interministériel. La gestion est confiée à un comité local de gestion de la forêt sacrée (CLFS), formé de représentants des collectivités gestionnaires, des propriétaires de terrains et des chefs de village, sous le contrôle d'un comité communal (CCSI) présidé par le maire. Le Bénin compte environ 2 940 forêts sacrées (18 360 ha) selon un inventaire de 1998 ; plusieurs sont inscrites au registre des aires et territoires du patrimoine autochtone et communautaire (APAC).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Bénin à la Convention sur la diversité biologique (janvier 2014) : environ 3 000 forêts sacrées et projet d'intégration des forêts sacrées dans le système des aires protégées (PIFSAP), lancé le 19 janvier 2010 ; la stratégie et plan d'action pour la biodiversité 2011-2020, publiée par la Convention (document non daté, postérieur à 2013), compte environ 2 940 forêts sacrées (18 360 ha) et décrit le même projet.", annee: 2014, source: "https://www.cbd.int/doc/world/bj/bj-nr-05-fr.pdf"}
  - {mecanisme: "registre_apac", detail: "Forêts sacrées de Sinatabé et de Wianso (commune de Bembèrèkè, Borgou) inscrites au registre APAC tenu par le PNUE-WCMC (fiches publiées le 21 février 2023), qui citent l'arrêté interministériel de 2012 (la fiche de Wianso le date du 16 novembre 2012) ; le registre liste aussi les forêts sacrées Wêwêré, Affougoussi, Kouvizoun Adakplamè-Ewè, Houinyèhouévé, Honhouévé de Dogbo Ahomey et Tanhounzoun. Les inscriptions sont auto-déclarées et soumises à un processus d'examen.", annee: 2023, source: "https://www.iccaregistry.org/fr/explore/Benin/foret-sacree-de-sinatabe"}
base_nationale:
  - {instrument: "Arrêté interministériel n° 0121/MEHU/MDGLAAT/DC/SGM/DGFRN/SA du 16 novembre 2012 fixant les conditions de gestion durable de la forêt sacrée en République du Bénin", nature: "loi", annee: 2012, source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La forêt sacrée est gérée par un comité local de gestion (CLFS), mis en place par arrêté du maire et composé d'un représentant de chaque collectivité gestionnaire désigné par ses pairs, de deux représentants des propriétaires de terrains et des chefs de village, avec un bureau élu à la majorité simple (arrêté interministériel de 2012, art. 41 à 43) ; le CLFS rend compte chaque semestre au comité communal (CCSI), présidé par le maire, qui approuve son plan de travail annuel et contrôle sa gestion (art. 44, 47 et 48).", source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le CLFS élabore un texte constitutif qui fixe les conditions d'entrée, de circulation et de séjour dans la forêt sacrée, et approuve le plan d'aménagement après avis de l'administration forestière (arrêté interministériel de 2012, art. 32 et 33) ; les interdictions applicables dans la forêt sont fixées par l'arrêté lui-même (art. 21 à 23).", source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
  justice_propre: {valeur: "non_etabli", note: "Le CLFS gère à l'amiable les conflits et participe à la constatation des infractions avec l'agent forestier, sans pouvoir de sanction ; le règlement des conflits qu'il ne résout pas revient au comité communal présidé par le maire et à la commune, et la répression des infractions aux tribunaux compétents (arrêté interministériel de 2012, art. 40, 44, 47, 48, 50 et 51) ; aucune sanction propre ni juridiction coutumière n'est reconnue.", source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
  terres: {valeur: "partiel", note: "Sur demande des communautés villageoises ou des dignitaires, le maire reconnaît la forêt sacrée et ses limites par arrêté communal, après une consultation publique qui arbitre les droits de propriété et d'usage (arrêté interministériel de 2012, art. 7 à 12) ; la forêt reconnue peut ensuite être intégrée au domaine forestier de la commune par arrêté interministériel (art. 13 à 18), l'arrêté ne prévoit aucun titre de propriété au profit de la communauté.", source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
  ressources: {valeur: "partiel", note: "Le président du CLFS délivre les autorisations d'exercer les droits d'usage portant sur le sol et de défrichement, après avis favorable de l'administration forestière (arrêté interministériel de 2012, art. 26 à 30) ; le CLFS peut autoriser la coupe de bois, la collecte de produits et l'allumage de feu dans le cadre des cérémonies cultuelles, sous la supervision du chef de culte et de l'agent forestier (art. 21) ; la coupe des arbres morts ou tombés est autorisée par l'administration forestière sur demande du président du CLFS (art. 27) ; le plan d'aménagement prévoit une série de protection et des séries de production ou agroforestières où les activités agricoles sont admises (art. 36 et 37).", source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
  consentement: {valeur: "partiel", note: "La procédure de reconnaissance est ouverte sur demande des communautés villageoises ou des dignitaires et comporte une consultation publique de la population (arrêté interministériel de 2012, art. 7, 8, 10 et 11) ; les plans d'aménagement sont élaborés avec la participation des populations locales et des autorités traditionnelles (art. 35) ; le ministre chargé des forêts peut aussi demander l'engagement de la procédure (art. 7) et aucun consentement préalable n'est exigé.", source: "https://faolex.fao.org/docs/pdf/Ben225234.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
