uid: "zones-chasse-villageoises-benin"
nom: "Zones villageoises de chasse du Bénin"
endonyme: ""
territoire: "Villages riverains des aires protégées du Nord du Bénin, surtout autour de la réserve de biosphère de la Pendjari (département de l'Atacora) et du parc national du W (département de l'Alibori) ; les zones villageoises de chasse peuvent être créées dans tout le domaine forestier protégé de l'État"
etats: ["Bénin"]
region: "afrique"
coord: [11.2, 1.5]
type: "communaute_locale"
base: "territoriale"
