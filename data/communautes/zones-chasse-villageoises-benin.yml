population: {valeur: 36000, annee: 2015, perimetre: "bénéficiaires déclarés par l'étude de cas du PNUD : personnes des 28 villages de la zone tampon de la Pendjari membres de l'Union des AVIGREF ; les AVIGREF du parc du W ne sont pas comptées", source: "https://www.equatorinitiative.org/wp-content/uploads/2017/05/case_1466460318.pdf"}
lieux: {valeur: 22, unite: "AVIGREF de villages riverains de la Pendjari (tableau 9 du plan d'aménagement, effectifs au 31 mai 2003) ; AVIGREF du parc du W non comptées ; aucun décompte des zones villageoises de chasse créées par arrêté communal n'a été trouvé", annee: 2003, source: "https://faolex.fao.org/docs/pdf/ben219311.pdf"}
