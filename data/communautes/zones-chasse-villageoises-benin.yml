villages: {valeur: 28, annee: 2015, perimetre: "villages membres de l'Union des AVIGREF de la Pendjari, selon l'étude de cas du PNUD", source: "https://www.equatorinitiative.org/wp-content/uploads/2017/05/case_1466460318.pdf"}
resume: >-
  Au Bénin, la loi n° 2002-16 du 18 octobre 2004 portant régime de la faune définit la zone villageoise de chasse comme une portion du domaine forestier protégé aménagée par les populations riveraines pour la chasse villageoise (art. 12). Le décret n° 2011-394 du 28 mai 2011 permet aux populations, aux collectivités locales et à d'autres promoteurs de créer ces zones, constatées par arrêté communal ; seules les structures de cogestion des communautés villageoises, dotées de la personnalité juridique, et les titulaires d'un permis de chasse sportive pour la zone peuvent y chasser, et les redevances variables (taxes d'abattage) reviennent à ces structures ou à la commune et aux communautés concernées. Autour de la Pendjari et du W, les structures de cogestion sont les associations villageoises de gestion des réserves de faune (AVIGREF), créées à partir de 1996 et regroupées en unions ; selon le rapport national de 2009 à la Convention sur la diversité biologique, elles reçoivent 30 % des recettes de la chasse sportive des zones cynégétiques de l'État. Aucun décompte officiel des zones villageoises de chasse effectivement créées n'a été trouvé. Les forêts sacrées font l'objet de la fiche « Forêts sacrées du Bénin ».
