resume: >-
  L'État du Chiapas a créé en 1998 des tribunaux de paix et de conciliation autochtones (Juzgados de Paz y Conciliación Indígena) au sein de son pouvoir judiciaire, dans les municipalités à population majoritairement autochtone. La loi des droits et de la culture autochtones de 1999 fait des usos y costumbres (règles coutumières) des communautés la base de la résolution de leurs litiges et fait des autorités traditionnelles des auxiliaires de l'administration de la justice, dont l'avis est pris en compte devant ces tribunaux. Le juge, nommé par le pouvoir judiciaire de l'État, traite par conciliation les litiges civils, familiaux et commerciaux et la réparation de délits non graves entre parties autochtones. Le pouvoir judiciaire compte 16 de ces tribunaux en 2024, surtout dans les municipalités tsotsiles et tseltales des Hautes Terres (Altos). L'élection des autorités d'Oxchuc selon son système normatif fait l'objet de la fiche « Oxchuc (Tseltal) ».
