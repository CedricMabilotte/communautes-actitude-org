reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Mexique ratifie la Convention 169 de l'OIT le 5 septembre 1990.", annee: 1990, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Mexique vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Le rapport du Rapporteur spécial sur sa mission au Mexique (E/CN.4/2004/80/Add.2) nomme les Lacandons et les Tseltales du Chiapas et décrit l'application des usos y costumbres à la solution des conflits chez les Tseltales de Bachajón (municipalité de Chilón) ; il signale (§ 33) que des « juzgados indígenas » (tribunaux autochtones) ont été établis dans plusieurs États et recommande (§ 96) de les reconnaître, sans nommer les tribunaux de paix et de conciliation autochtones du Chiapas.", annee: 2003, source: "https://documents.un.org/api/symbol/access?s=E/CN.4/2004/80/Add.2&l=es&t=pdf"}
base_nationale:
  - {instrument: "Constitution politique de l'État libre et souverain du Chiapas, art. 7 (peuples autochtones) et art. 72 et 73 (pouvoir judiciaire), texte en vigueur (dernière réforme du 28 mai 2025)", nature: "constitution", annee: 2025, source: "https://www.poderjudicialchiapas.gob.mx/storage/legislacion/PJE-1748536257.pdf"}
  - {instrument: "Loi des droits et de la culture autochtones de l'État du Chiapas (Ley de Derechos y Cultura Indígenas, décret 207, P.O. 042 du 29 juillet 1999, dernière réforme du 17 juin 2026)", nature: "loi", annee: 1999, source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0026.pdf?v=NQ%3D%3D"}
  - {instrument: "Code d'organisation du pouvoir judiciaire de l'État du Chiapas (décret 263, P.O. 122 du 19 août 2020, dernière réforme du 28 juillet 2026), art. 84 à 91", nature: "loi", annee: 2020, source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0008.pdf?v=OQ%3D%3D"}
  - {instrument: "Constitution politique des États-Unis mexicains, art. 2 (réformé le 30 septembre 2024)", nature: "constitution", annee: 2024, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution de l'État (art. 7 A I, III et XVI) reconnaît le droit de décider des formes internes de gouvernement et d'élire les autorités selon les systèmes normatifs (règles propres) ; la loi de 1999 (art. 6) reconnaît les autorités traditionnelles nommées par consensus et en fait des auxiliaires de la justice.", source: "https://www.poderjudicialchiapas.gob.mx/storage/legislacion/PJE-1748536257.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi de 1999 (art. 11) fait des usos y costumbres la base de la résolution des litiges des communautés, dans les limites de leur habitat et sous réserve des droits humains, de la perspective de genre et des délits à détention provisoire obligatoire (réforme de 2014) ; la Constitution de l'État (art. 7 A II) renvoie à la loi la validation par les juges.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0026.pdf?v=NQ%3D%3D"}
  justice_propre: {valeur: "partiel", note: "Les tribunaux de paix et de conciliation autochtones font partie du pouvoir judiciaire de l'État (Constitution, art. 73 VIII) ; ils ne jugent que des litiges entre parties autochtones (loi de 1999, art. 14), appliquent les usos y costumbres (Code d'organisation, art. 90), et le juge peut entendre les autorités traditionnelles (art. 85) ; le juge est nommé par le pouvoir judiciaire, non par la communauté (Code, art. 89, sur proposition des conseils municipaux ; Constitution, art. 72, réforme de 2025) et l'appel va aux tribunaux de première instance.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0008.pdf?v=OQ%3D%3D"}
  terres: {valeur: "partiel", note: "La Constitution de l'État (art. 7 A VIII) protège l'intégrité des terres dans le cadre du droit fédéral ; la loi de 1999 (art. 56 et 57) interdit les expulsions de membres des communautés et leurs déplacements, sauf utilité publique justifiée, risque ou catastrophe ; aucun régime foncier propre.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0026.pdf?v=NQ%3D%3D"}
  ressources: {valeur: "partiel", note: "La Constitution de l'État (art. 7 A IX) accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.poderjudicialchiapas.gob.mx/storage/legislacion/PJE-1748536257.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution de l'État (art. 7 A XIX) prévoit une consultation sur les mesures législatives ou administratives susceptibles d'affecter les peuples, en vue d'obtenir leur consentement ou un accord ; la loi de 1999 (art. 62) impose d'entendre les autorités ejidales, communales ou traditionnelles avant des travaux touchant leurs ressources.", source: "https://www.poderjudicialchiapas.gob.mx/storage/legislacion/PJE-1748536257.pdf"}
  langue: {valeur: "partiel", note: "La loi de 1999 (art. 17) garantit un traducteur et l'usage de la langue autochtone dans les procédures ; le Code d'organisation (art. 88 V) exige, si nécessaire, que le juge maîtrise la langue autochtone de la région ; la Constitution de l'État (art. 7 A V) prévoit la promotion des langues autochtones, sans leur donner de statut de langue officielle.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0008.pdf?v=OQ%3D%3D"}
  education: {valeur: "partiel", note: "La loi de 1999 (art. 44 et 45) impose une éducation bilingue et interculturelle de la maternelle au secondaire supérieur dans les communautés ; la Constitution de l'État (art. 7 A VI) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0026.pdf?v=NQ%3D%3D"}
  fiscalite: {valeur: "partiel", note: "La Constitution de l'État (art. 7 B II) prévoit des dotations budgétaires pour les peuples et communautés, administrées directement par eux ; les tribunaux sont financés par le pouvoir judiciaire de l'État.", source: "https://www.poderjudicialchiapas.gob.mx/storage/legislacion/PJE-1748536257.pdf"}
  representation: {valeur: "partiel", note: "La Constitution de l'État (art. 7 A XI) reconnaît le droit d'élire, dans les municipalités à population autochtone, des représentants aux conseils municipaux (ayuntamientos) ; aucune représentation garantie au Congrès de l'État n'a été trouvée.", source: "https://www.poderjudicialchiapas.gob.mx/storage/legislacion/PJE-1748536257.pdf"}
  statut_personnel: {valeur: "partiel", note: "La loi de 1999 (art. 24) donne valeur d'expertise aux rapports des juges de paix et de conciliation autochtones sur l'appartenance d'une personne à une communauté, après avis des autorités traditionnelles ; la Constitution de l'État (art. 7 A XV) reconnaît les formes traditionnelles de constitution de la famille.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0026.pdf?v=NQ%3D%3D"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Akuavi Adonon Viveros (CIMSUR-UNAM, 2018, enquête de 2001 à 2004 à Chamula et Zinacantán), les tribunaux ont été créés sans consultation des populations, les litiges y sont réglés par conciliation avec la participation d'auxiliaires issus du système de charges municipal, et les actes de conciliation sont rarement pris en compte par les tribunaux ordinaires.", source: "https://librosoa.unam.mx/bitstream/handle/123456789/2318/18-justicia.pdf?sequence=1&isAllowed=y"}
chronologie:
  - {annee: 1996, evenement: "Accords de San Andrés Larráinzar entre le gouvernement fédéral et l'EZLN sur les droits et la culture autochtones."}
  - {annee: 1998, evenement: "Décret du 12 mars : création des tribunaux de paix et de conciliation autochtones dans les municipalités à population majoritairement autochtone."}
  - {annee: 1999, evenement: "Loi des droits et de la culture autochtones (29 juillet) : usos y costumbres comme base de la résolution des litiges (art. 11) et cadre des tribunaux (art. 12 à 14)."}
  - {annee: 2014, evenement: "Décret 052 (27 novembre) : exclusion des solutions coutumières contraires à la perspective de genre, à l'intérêt de l'enfant ou au droit des femmes à une vie sans violence."}
  - {annee: 2020, evenement: "Nouveau Code d'organisation du pouvoir judiciaire (19 août) : compétence des tribunaux limitée à la conciliation, aux petites affaires civiles et à la réparation de délits non graves (art. 90)."}
  - {annee: 2024, evenement: "Le manuel du recueil de critères des tribunaux (septembre) recense 16 tribunaux et le droit autochtone de chacune des 16 municipalités."}
  - {annee: 2025, evenement: "Réforme constitutionnelle du 14 mars : la nomination des juges de paix et de conciliation autochtones passe à la présidence du Tribunal supérieur de justice."}
fiabilite:
  verifie: ["Articles 6, 11 à 14, 24, 44, 45, 56, 57 et 62 de la loi des droits et de la culture autochtones (version du 17 juin 2026) sur le site du Congrès de l'État.", "Articles 84 à 91 du Code d'organisation du pouvoir judiciaire (version du 28 juillet 2026) sur le site du Congrès de l'État.", "Articles 7, 72 et 73 de la Constitution de l'État (version du 28 mai 2025) sur le site du pouvoir judiciaire.", "Nombre (16) et liste des municipalités dotées d'un tribunal dans le manuel du pouvoir judiciaire de septembre 2024.", "Date de création (décret du 12 mars 1998) selon Adonon Viveros, 2018."]
  non_confirme: ["Le manuel du pouvoir judiciaire date le décret de création du 12 mars 1988 ; la date de 1998 donnée par Adonon Viveros est retenue, le texte du décret n'a pas été consulté.", "Mode de nomination des juges : le Code d'organisation (art. 89) prévoit une nomination par le Conseil de la judicature sur proposition des conseils municipaux, la Constitution réformée en 2025 (art. 72) confie la nomination à la présidence du Tribunal supérieur de justice ; l'articulation entre les deux textes n'est pas établie.", "Aucune observation d'un organe de l'ONU visant nommément ces tribunaux n'a été trouvée.", "Nombre de localités desservies par chaque tribunal : non publié ; le chiffre retenu (1 510) compte les localités de trois logements ou plus des seize municipalités.", "Superficie des seize municipalités : non trouvée."]
