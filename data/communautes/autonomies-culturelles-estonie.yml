resume: >-
  Fiche agrégée : elle couvre les autonomies culturelles créées en application de la loi sur l'autonomie culturelle des minorités nationales du 26 octobre 1993, prise pour l'article 50 de la Constitution. La loi permet aux citoyens estoniens des minorités allemande, russe, suédoise et juive, et des minorités de plus de 3 000 personnes, de former une autonomie culturelle (kultuuriomavalitsus, organe d'administration propre de la culture) : ses membres s'inscrivent sur une liste nationale (rahvusnimekiri) et élisent un conseil culturel (kultuurinõukogu) de 20 à 60 membres pour trois ans. Deux autonomies ont été établies, celle de la minorité finnoise, portée par les Finnois ingriens (élections de 2004), et celle de la minorité suédoise (2007). Le gouvernement a mis fin à l'autonomie finnoise le 26 septembre 2024 ; seule l'autonomie suédoise est en activité.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur l'Estonie, ACFC/OP/V(2021)5, adopté le 3 février 2022 (§ 84 à 93) : seules les minorités finnoise ingrienne et suédoise ont formé une autonomie culturelle ; financement public commun de 114 300 € en 2019, 125 085 € en 2020 et 110 000 € en 2021 ; le Comité juge le champ de la loi étroit et note qu'aucune suite n'a été donnée aux modifications proposées par les deux conseils culturels", annee: 2022, source: "https://rm.coe.int/5th-op-estonia-en/1680a6cc9e"}
