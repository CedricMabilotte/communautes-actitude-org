reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Fidji a ratifié la Convention n° 169 relative aux peuples indigènes et tribaux en 1998, seul État membre du Pacifique à l'avoir fait ; atelier de mise en œuvre à Suva avec des représentants iTaukei en août 2025", annee: 1998, source: "https://www.ilo.org/resource/news/fiji-advances-dialogue-indigenous-peoples-rights-under-ilo-convention-no"}
