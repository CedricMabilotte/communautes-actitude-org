effectivite: {valeur: "partielle", note: "Environ 90 % des terres appartiennent aux propriétaires coutumiers ; ils les louent le plus souvent par un système coordonné par l'État. Le Grand Conseil des chefs a été supprimé entre 2007 et 2023 (rapport du gouvernement australien, 2025).", source: "https://www.dfat.gov.au/sites/default/files/country-information-report-fiji.pdf"}
chronologie:
  - {annee: 1874, evenement: "Cession de Fidji à la Couronne britannique ; environ 83 % des terres reconnues aux groupes fonciers autochtones."}
  - {annee: 1940, evenement: "Création du Bureau fiduciaire des terres autochtones (aujourd'hui iTaukei Land Trust Board)."}
  - {annee: 1998, evenement: "Fidji ratifie la Convention n° 169 de l'OIT."}
  - {annee: 2007, evenement: "Dissolution du Grand Conseil des chefs après le coup d'État de 2006."}
  - {annee: 2013, evenement: "Nouvelle Constitution : terres iTaukei inaliénables (art. 28)."}
  - {annee: 2023, evenement: "iTaukei Affairs (Amendment) Act : rétablissement du Grand Conseil des chefs (28 voix contre 22)."}
