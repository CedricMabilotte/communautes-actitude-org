reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Fidji a ratifié la Convention n° 169 relative aux peuples indigènes et tribaux en 1998, seul État membre du Pacifique à l'avoir fait ; atelier de mise en œuvre à Suva avec des représentants iTaukei en août 2025", annee: 1998, source: "https://www.ilo.org/resource/news/fiji-advances-dialogue-indigenous-peoples-rights-under-ilo-convention-no"}
base_nationale:
  - {instrument: "Constitution de la République de Fidji (2013), préambule et art. 26, 28, 30 et 31", nature: "constitution", annee: 2013, source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  - {instrument: "Native Lands Act (loi sur les terres autochtones), chap. 133, version révisée de 1985, art. 3 et 6", nature: "loi", annee: 1905, source: "https://faolex.fao.org/docs/pdf/fij3157.pdf"}
  - {instrument: "iTaukei Land Trust Act 1940 (Bureau fiduciaire des terres iTaukei)", nature: "loi", annee: 1940, source: "https://tltb.com.fj/corporate-profile/"}
  - {instrument: "iTaukei Affairs (Amendment) Act 2023 (rétablissement du Grand Conseil des chefs)", nature: "loi", annee: 2023, source: "https://pina.com.fj/2023/11/24/fiji-parliament-approves-reinstatement-of-great-council-of-chiefs/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Grand Conseil des chefs (Bose Levu Vakaturaga), rétabli par l'iTaukei Affairs (Amendment) Act 2023, est consulté, formule des recommandations et prend des décisions sur la bonne gouvernance des iTaukei ; il n'a pas de rang constitutionnel.", source: "https://pina.com.fj/2023/11/24/fiji-parliament-approves-reinstatement-of-great-council-of-chiefs/"}
  pouvoir_normatif: {valeur: "partiel", note: "Les terres autochtones sont détenues par les iTaukei selon la coutume autochtone attestée par l'usage et la tradition (Native Lands Act, chap. 133, version révisée de 1985, art. 3) ; la Commission des terres autochtones, organe de l'État, tranche les différends de propriété (art. 6 (5)). Aucun organe iTaukei ne reçoit le pouvoir d'édicter des lois.", source: "https://faolex.fao.org/docs/pdf/fij3157.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "« La propriété de toutes les terres iTaukei demeure aux propriétaires coutumiers » ; ces terres ne peuvent être aliénées définitivement, sauf à l'État pour un usage public, et reviennent aux propriétaires quand l'État n'en a plus besoin (Constitution 2013, art. 28 al. 1 et 2).", source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  ressources: {valeur: "partiel", note: "Les minéraux appartiennent à l'État ; les propriétaires des terres coutumières et des droits de pêche coutumiers enregistrés ont droit à une part équitable des redevances d'extraction (Constitution 2013, art. 30).", source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  consentement: {valeur: "partiel", note: "L'iTaukei Affairs (Amendment) Act 2023 (art. 6) impose au ministre de soumettre au Bureau des affaires iTaukei (iTaukei Affairs Board) ou au Grand Conseil des chefs les projets de loi qui touchent les droits et intérêts des iTaukei ; leur mémorandum est versé au débat parlementaire. L'avis n'est pas contraignant.", source: "https://pina.com.fj/2023/11/24/fiji-parliament-approves-reinstatement-of-great-council-of-chiefs/"}
  langue: {valeur: "partiel", note: "La Constitution est traduite en iTaukei (art. 3) ; l'iTaukei conversationnel est matière obligatoire dans toutes les écoles primaires, comme le hindi fidjien (art. 31 al. 3). L'anglais prévaut en cas de divergence.", source: "https://www.constituteproject.org/constitution/Fiji_2013"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Environ 90 % des terres appartiennent aux propriétaires coutumiers, qui les louent le plus souvent par un système coordonné par l'État (rapport du gouvernement australien, mai 2022). Depuis la fin des années 1990, le non-renouvellement de baux agricoles par des propriétaires iTaukei a conduit à des expulsions de fermiers indo-fidjiens (Minority Rights Group, page mise à jour en 2026).", source: "https://www.dfat.gov.au/sites/default/files/country-information-report-fiji.pdf"}
chronologie:
  - {annee: 1874, evenement: "Fidji devient colonie britannique ; près de 83 % des terres sont reconnues aux groupes fonciers autochtones (Minority Rights Group)."}
  - {annee: 1940, evenement: "Création du Bureau fiduciaire des terres autochtones (aujourd'hui iTaukei Land Trust Board)."}
  - {annee: 1998, evenement: "Fidji ratifie la Convention n° 169 de l'OIT."}
  - {annee: 2007, evenement: "Dissolution du Grand Conseil des chefs après le coup d'État de 2006."}
  - {annee: 2013, evenement: "Nouvelle Constitution : terres iTaukei inaliénables (art. 28)."}
  - {annee: 2023, evenement: "iTaukei Affairs (Amendment) Act : rétablissement du Grand Conseil des chefs (28 voix contre 22)."}
  - {annee: 2025, evenement: "Avis de la Cour suprême (août) : la Constitution de 2013 peut être modifiée par une majorité des deux tiers au Parlement suivie d'une majorité au référendum, au lieu des trois quarts."}
  - {annee: 2026, evenement: "Projet de loi constitutionnelle n° 32 adopté en deuxième lecture le 2 octobre (38 voix pour, 5 contre) ; il reprend la propriété coutumière des terres iTaukei (art. 48), donne un rang constitutionnel au Grand Conseil des chefs (art. 152) et doit être soumis à référendum ; entrée en vigueur prévue le 31 mars 2028 s'il est adopté."}
