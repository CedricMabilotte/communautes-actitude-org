resume: >-
  Peuple autochtone de Fidji, majoritaire dans la population. La Constitution de 2013 reconnaît dans son préambule les iTaukei et leur propriété des terres iTaukei, et interdit l'aliénation définitive de ces terres (art. 28). Les terres sont administrées pour leurs propriétaires coutumiers par le Bureau fiduciaire des terres iTaukei (iTaukei Land Trust Board), organisme créé en 1940. Le Grand Conseil des chefs (Bose Levu Vakaturaga), dissous en 2007, a été rétabli par une loi de 2023. Les droits de pêche coutumiers font l'objet de la fiche « Zones de pêche coutumières (qoliqoli) de Fidji ».
