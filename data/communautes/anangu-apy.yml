effectivite: {valeur: "partielle", note: "Le conseil exécutif élu le 21 août 2024 a été suspendu par le ministre des Affaires aborigènes en août 2025, après le rapport d'un conciliateur sur la reconduction du directeur général ; un administrateur, Austin Taylor, a exercé ses pouvoirs jusqu'au 4 décembre 2025. Le conseil a été rétabli en décembre 2025. En mai 2026, le renvoi du nouveau directeur général par le président du conseil a été contesté par les avocats de celui-ci ; en juillet 2026, un groupe d'aînés a demandé une réforme de la gouvernance, et le gouvernement a déclaré ne pas envisager d'abroger la loi.", source: "https://nit.com.au/12-09-2025/20218/interim-administrator-at-apy-lands-following-suspended-board"}
chronologie:
  - {annee: 1981, evenement: "Pitjantjatjara Land Rights Act (entrée en vigueur le 2 octobre)."}
  - {annee: 2005, evenement: "Loi de modification (sanction le 27 octobre) : l'organisme prend le nom d'Anangu Pitjantjatjara Yankunytjatjara ; conseil exécutif restructuré."}
  - {annee: 2024, evenement: "Élection du conseil exécutif (21 août), organisée par la commission électorale de l'État."}
  - {annee: 2025, evenement: "Le ministre suspend le conseil exécutif (août) et nomme un administrateur jusqu'au 4 décembre ; le conseil est rétabli en décembre."}
  - {annee: 2026, evenement: "Différend sur le renvoi du directeur général (mai) ; un groupe d'aînés demande une réforme de la gouvernance (juillet)."}
