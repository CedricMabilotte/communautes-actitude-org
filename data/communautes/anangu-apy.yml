resume: >-
  Peuples Pitjantjatjara et Yankunytjatjara (Anangu) du nord-ouest de l'Australie-Méridionale. L'Anangu Pitjantjatjara Yankunytjatjara Land Rights Act 1981, loi de l'État d'Australie-Méridionale entrée en vigueur le 2 octobre 1981, confère un titre de pleine propriété (fee simple) inaliénable sur plus de 100 000 km² à une personne morale, Anangu Pitjantjatjara Yankunytjatjara (APY), dirigée par un conseil exécutif élu. Le ministre des Affaires aborigènes peut suspendre ce conseil ; il l'a fait d'août à décembre 2025. Les non-Anangu doivent obtenir un permis pour entrer sur les terres, et les activités minières requièrent l'autorisation de l'APY. Les terres voisines de l'ouest relèvent d'un régime distinct (voir Maralinga Tjarutja).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD (Comité pour l'élimination de la discrimination raciale) recommande à l'Australie d'inscrire le consentement préalable, libre et éclairé dans la loi sur les titres fonciers autochtones et dans d'autres textes, et d'appliquer les principes de la Déclaration des Nations Unies sur les droits des peuples autochtones (par. 21 et 22). Le document vise les peuples autochtones d'Australie sans nommer les Anangu (CERD/C/AUS/CO/18-20).", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Anangu Pitjantjatjara Yankunytjatjara Land Rights Act 1981 (Australie-Méridionale), version du 7 octobre 2021", nature: "loi", annee: 1981, source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Anangu Pitjantjatjara Yankunytjatjara, personne morale dont tous les Anangu sont membres (s. 5), recueille les volontés des propriétaires traditionnels et administre les terres (s. 6) ; son conseil exécutif compte jusqu'à 14 membres élus tous les trois ans, un homme et une femme par circonscription (s. 9). Le ministre peut lui donner des instructions (s. 13N) et le suspendre « pour tout motif qu'il juge approprié » par avis publié au journal officiel (s. 13O) ; un administrateur nommé par le ministre exerce alors ses pouvoirs.", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les terres sont attribuées en pleine propriété à l'APY ; aucun droit sur elles ne peut en être aliéné ni exproprié en vertu du droit de l'État (s. 15 et 17). Tous les Anangu y ont libre accès (s. 18) ; les autres personnes doivent obtenir une autorisation écrite (s. 19).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les activités minières requièrent l'autorisation de l'APY ; en cas de refus ou de conditions contestées, le demandeur peut recourir à un arbitrage, qui tient compte des effets sur la culture anangu, l'environnement et le développement économique (s. 20 et 21).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
