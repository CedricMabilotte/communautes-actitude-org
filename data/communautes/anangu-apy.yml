  - {instrument: "Anangu Pitjantjatjara Yankunytjatjara Land Rights Act 1981 (Australie-Méridionale), version du 7 octobre 2021", nature: "loi", annee: 1981, source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Anangu Pitjantjatjara Yankunytjatjara, personne morale maintenue par la loi (s. 5), recueille les volontés des propriétaires traditionnels et administre les terres (s. 6) ; son conseil exécutif compte jusqu'à 14 membres élus, un homme et une femme par circonscription, élections organisées par la commission électorale de l'État (s. 9).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les terres sont attribuées en pleine propriété à l'APY ; aucun droit sur elles ne peut en être aliéné ni exproprié en vertu du droit de l'État (s. 15 et 17). Tous les Anangu y ont libre accès (s. 18) ; les autres personnes doivent obtenir une autorisation écrite (s. 19).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les activités minières requièrent l'autorisation de l'APY ; en cas de refus ou de conditions contestées, le demandeur peut recourir à un arbitrage, qui tient compte des effets sur la culture anangu, l'environnement et le développement économique (s. 20 et 21).", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/anangu%20pitjantjatjara%20yankunytjatjara%20land%20rights%20act%201981/current/1981.20.auth.pdf"}
