resume: >-
  Peuples Pitjantjatjara et Yankunytjatjara (Anangu) du nord-ouest de l'Australie-Méridionale. L'Anangu Pitjantjatjara Yankunytjatjara Land Rights Act 1981, loi de l'État d'Australie-Méridionale entrée en vigueur le 2 octobre 1981, confère un titre de pleine propriété inaliénable sur plus de 100 000 km² à une personne morale, Anangu Pitjantjatjara Yankunytjatjara, dirigée par un conseil exécutif élu. Les non-Anangu doivent obtenir un permis pour entrer sur les terres, et les activités minières requièrent l'autorisation de l'APY.
