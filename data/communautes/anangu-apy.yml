reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD recommande à l'Australie d'appliquer les principes de la Déclaration des Nations Unies sur les droits des peuples autochtones et de garantir le consentement préalable, libre et éclairé sur les terres autochtones (CERD/C/AUS/CO/18-20)", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
