resume: >-
  Les collines du Manipur, qui couvrent environ 90 % de l'État, sont habitées par des tribus répertoriées naga, kuki-zo et d'autres groupes. L'article 371C de la Constitution (1971) crée un comité de l'Assemblée formé des députés élus dans les collines, qui examine les lois touchant ces zones. Une loi du Parlement de 1971 y institue six conseils de district autonomes élus, chargés notamment de l'attribution des terres, des forêts non classées et de la culture itinérante (jhum). Aucune élection n'a eu lieu depuis la fin des mandats en mai 2020.
