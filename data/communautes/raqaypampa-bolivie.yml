droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution (art. 289 et 293.I) prévoit l'autonomie fondée sur un territoire consolidé ; le statut (art. 16 à 24) crée l'Assemblée générale des communautés, le Conseil de gestion territoriale de cinq membres élus pour cinq ans et l'Autorité administrative autonomique.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le statut (art. 6, 17.I et 46) attribue à l'Assemblée générale des communautés une faculté législative et prévoit des lois de l'autonomie pour chaque compétence exclusive ; l'art. 44.I déclare cette faculté intransférable.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Constitution (art. 190) reconnaît la juridiction indigène originaire paysanne ; le statut (art. 31 à 37) l'organise en trois instances (syndicat, sous-centrale, centrale), sous le seul contrôle du Tribunal constitutionnel plurinational.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  terres: {valeur: "reconnu", note: "La loi 813 de 2016 (art. 2) consolide le territoire sur la base du titre exécutoire TCO-NAL 000065 du 10 décembre 2004 ; le statut (art. 54.III) déclare ce territoire propriété du peuple de Raqaypampa, collective, inaliénable, insaisissable et imprescriptible.", source: "https://www.lexivox.org/norms/BO-L-N813.html"}
  ressources: {valeur: "partiel", note: "Le statut (art. 14.17 et 45.3) garantit l'usage exclusif et la gestion des ressources renouvelables, comme la Constitution (art. 30.II.17) ; pour les ressources non renouvelables du sous-sol, il prévoit la consultation préalable et une part des bénéfices (art. 59.II).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15) impose une consultation préalable obligatoire sans exiger le consentement ; le statut (art. 14.1) prévoit le consentement préalable, libre et éclairé pour les mesures des autorités de Raqaypampa seulement.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5) fait du quechua une langue officielle de l'État ; le statut (art. 12) fait du quechua et du castillan les langues d'usage préférentiel sur le territoire.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  education: {valeur: "partiel", note: "Le statut (art. 48.2 et 69) fait de l'éducation une compétence concurrente exercée dans le cadre des lois de l'État, avec contrôle par les conseils éducatifs communaux, intercommunaux et régional (Conseil régional éducatif des hauteurs, CREA).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  fiscalite: {valeur: "partiel", note: "Le statut (art. 11.2, 50 et 51) prévoit la création de taxes et contributions, l'administration des impôts attribués (Constitution, art. 304.I.12 et 13) et des transferts automatiques de l'État.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Raqaypampa.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Des autorités sont élues en juin 2017 et forment un premier gouvernement en 2018 ; les autorités de la période 2023-2028, élues le 19 juin 2022 en assemblée générale des communautés, reçoivent leurs lettres de créance du Tribunal électoral départemental le 5 janvier 2023, puis sont installées à Raqaypampa (Eju, 2023).", source: "https://eju.tv/2023/01/12-hitos-en-la-autonomia-de-los-pueblos-indigenas-en-cochabamba/"}
