resume: >-
  Raqaypampa est un territoire quechua des hauteurs du sud-est de la province de Mizque (Cochabamba), titré en 2004 comme terre communautaire d'origine (TCO, propriété collective d'un peuple autochtone). La loi 813 de 2016 crée l'unité territoriale « Territoire indigène originaire paysan de Raqaypampa » sur les limites de ce titre ; l'autonomie indigène originaire paysanne (AIOC, collectivité territoriale autochtone prévue par la Constitution de 2009) s'y constitue par la voie du territoire et non par la conversion d'une commune. Le statut est déclaré conforme à la Constitution en 2015 et approuvé par référendum le 20 novembre 2016. Le gouvernement repose sur l'Assemblée générale des communautés, un Conseil de gestion territoriale de cinq membres et une Autorité administrative autonomique ; les secondes autorités, élues le 19 juin 2022, reçoivent leurs lettres de créance le 5 janvier 2023.
