base_nationale:
  - {instrument: "Constitution de la Fédération de Russie, art. 5, 65, 66, 68, 72 et 73 (texte révisé le 1er juillet 2020)", nature: "constitution", annee: 1993, source: "https://www.consultant.ru/document/cons_doc_LAW_28399/"}
  - {instrument: "Loi « Sur les langues des peuples de la Fédération de Russie », n° 1807-I du 25 octobre 1991, art. 2 et 3", nature: "loi", annee: 1991, source: "https://eprints.gla.ac.uk/208165/1/208165.pdf"}
  - {instrument: "Loi fédérale n° 317-FZ du 3 août 2018 modifiant les art. 11 et 14 de la loi fédérale « Sur l'éducation dans la Fédération de Russie »", nature: "loi", annee: 2018, source: "https://rg.ru/2018/08/07/317-fz-dok.html"}
  - {instrument: "Cour constitutionnelle de la Fédération de Russie, arrêt n° 16-P du 16 novembre 2004", nature: "jurisprudence", annee: 2004, source: "https://eprints.gla.ac.uk/208165/1/208165.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque république a sa propre constitution, qui fixe son statut avec la Constitution fédérale (art. 5 et 66, 1993) ; ses institutions sont territoriales et ne sont pas réservées aux peuples titulaires.", source: "https://www.constituteproject.org/constitution/Russia_2014"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque république a sa législation (art. 5) et exerce le plein pouvoir d'État hors des compétences fédérales et conjointes (art. 73) ; les langues, l'éducation, la terre et les ressources relèvent des compétences conjointes (art. 72), où la loi fédérale prime.", source: "https://www.constituteproject.org/constitution/Russia_2014"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Constitution fédérale, art. 72(1)(в) (1993) : la possession, l'usage et la disposition de la terre relèvent de la compétence conjointe de la Fédération et des sujets de la Fédération (entités fédérées) ; aucun droit propre du peuple titulaire sur la terre n'a été trouvé.", source: "https://www.constituteproject.org/constitution/Russia_2014"}
  ressources: {valeur: "partiel", note: "Constitution fédérale, art. 72(1)(в) (1993) : la possession, l'usage et la disposition du sous-sol, des eaux et des autres ressources naturelles relèvent de la compétence conjointe de la Fédération et des sujets de la Fédération.", source: "https://www.constituteproject.org/constitution/Russia_2014"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Les républiques peuvent établir leurs langues d'État, utilisées avec le russe dans leurs organes de l'État, de l'autogouvernement local et leurs institutions publiques (Constitution, art. 68-2, 1993, maintenu par la révision de 2020) ; toutes les républiques de la fiche l'ont fait sauf la Carélie, où la loi fédérale sur les langues impose l'alphabet cyrillique aux langues d'État des républiques alors que le carélien s'écrit en alphabet latin (Comité consultatif de la Convention-cadre, 2018, § 107).", source: "https://www.consultant.ru/document/cons_doc_LAW_28399/3ed9a4d68072c2f9d74767edb4d4d2ea1def6e9f/"}
  education: {valeur: "conteste", note: "La Cour constitutionnelle a admis en 2004 l'étude obligatoire de la langue d'État d'une république ; la loi fédérale 317-FZ du 3 août 2018 soumet l'étude des langues d'État des républiques au choix des parents, ce qui retire aux républiques la possibilité de la rendre obligatoire.", source: "https://eprints.gla.ac.uk/208165/1/208165.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Constitution fédérale, art. 95(2) : le Conseil de la Fédération (chambre haute) comprend deux représentants de chaque sujet de la Fédération, l'un de son organe législatif, l'autre de son organe exécutif ; ces sièges reviennent à la république, non au peuple titulaire.", source: "https://www.constituteproject.org/constitution/Russia_2014"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre (2018) relève qu'après le conflit de 2017 avec le gouvernement fédéral, l'enseignement obligatoire des secondes langues officielles des républiques n'est plus possible ; plusieurs républiques l'ont déjà abandonné, et l'enseignement dans les langues minoritaires recule avec la fermeture d'écoles de village.", source: "https://www.ecoi.net/en/file/local/2002328/4_OP_RussianFederation_en.docx.pdf"}
chronologie:
  - {annee: 1991, evenement: "Loi « Sur les langues des peuples de la Fédération de Russie » (25 octobre)."}
  - {annee: 1993, evenement: "La Constitution fédérale énumère les républiques (art. 65) et leur reconnaît le droit d'établir leurs langues d'État (art. 68)."}
  - {annee: 2004, evenement: "La Cour constitutionnelle admet l'étude obligatoire de la langue d'État d'une république (arrêt 16-P, 16 novembre)."}
  - {annee: 2017, evenement: "Inspections du parquet sur l'enseignement obligatoire des langues des républiques ; manifestations et protestations des autorités de plusieurs républiques."}
  - {annee: 2018, evenement: "Loi fédérale 317-FZ (3 août) : étude facultative des langues d'État des républiques ; décret présidentiel n° 688 (26 octobre) créant un fonds pour la préservation et l'étude des langues des peuples de la Fédération."}
  - {annee: 2020, evenement: "Révision constitutionnelle (1er juillet) : l'art. 68-1 désigne le russe comme « langue du peuple constitutif de l'État » ; l'art. 68-2 sur les langues d'État des républiques est maintenu."}
  - {annee: 2022, evenement: "La Russie cesse d'être membre du Conseil de l'Europe ; l'art. 65 de la Constitution russe inscrit les « républiques populaires » de Donetsk et de Louhansk, territoires que la plupart des États membres de l'ONU rattachent à l'Ukraine."}
