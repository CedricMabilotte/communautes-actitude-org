resume: >-
  Fiche agrégée : elle couvre 19 des républiques de la Fédération de Russie, sujets de la Fédération (entités fédérées) créés sur la base de peuples titulaires, c'est-à-dire les peuples qui donnent leur nom à la république. Le Tatarstan et la Iakoutie ont leur propre fiche ; la Crimée, annexée en 2014, et les « républiques populaires » de Donetsk et de Louhansk, inscrites à l'art. 65 de la Constitution russe en 2022, ne sont pas comptées : la plupart des États membres de l'ONU rattachent ces territoires à l'Ukraine. Selon la Constitution fédérale de 1993, révisée en 2020, chaque république a sa propre constitution et sa législation (art. 5 et 66) et peut établir ses langues d'État, utilisées avec le russe dans ses organes de l'État et de l'autogouvernement local (art. 68). La Carélie n'a pas établi d'autre langue d'État que le russe ; le Daghestan désigne « le russe et les langues des peuples du Daghestan ». Depuis la loi fédérale 317-FZ du 3 août 2018, l'étude des langues d'État des républiques à l'école est facultative.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Fédération de Russie, ACFC/OP/IV(2018)001, adopté le 20 février 2018 : à la suite du conflit de 2017 entre le gouvernement fédéral et les républiques, l'enseignement obligatoire des secondes langues officielles des républiques n'est plus possible (§ 9 et 11) ; la Russie a cessé d'être membre du Conseil de l'Europe en 2022", annee: 2018, source: "https://www.ecoi.net/en/file/local/2002328/4_OP_RussianFederation_en.docx.pdf"}
