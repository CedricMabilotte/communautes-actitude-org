  - {instrument: "Québec (Procureur général) c. Moses, 2010 CSC 17", nature: "jurisprudence", annee: 2010, source: "https://juricaf.org/arret/CANADA-COURSUPREME-20100514-2010CSC17"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'Entente sur la gouvernance de la nation crie, signée le 18 juillet 2017 par le Grand Conseil des Cris, le Gouvernement de la nation crie et le Canada, est approuvée et a force de loi, L.C. 2018, ch. 4, art. 3 ; la Loi sur les Indiens ne s'applique plus aux premières nations cries ni aux terres de catégorie IA, art. 11.", source: "https://laws-lois.justice.gc.ca/fra/lois/C-45.75/page-1.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "La constitution crie est mise en vigueur et a force de loi, L.C. 2018, ch. 4, art. 7 (1) ; la loi reconnaît les lois du Gouvernement de la nation crie et des premières nations cries adoptées au titre de l'Entente.", source: "https://laws-lois.justice.gc.ca/fra/lois/C-45.75/page-1.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "5 544,1 km² de terres de catégorie I : 3 299,6 km² de catégorie IA, dont l'État conserve la nue-propriété (propriété sans jouissance) et dont l'usage est exclusif aux Cris, et 2 244,5 km² de catégorie IB détenus par des corporations foncières cries qui ne peuvent les céder qu'au gouvernement, loi R-13.1, art. 4, 17 à 19 et 25 (1978).", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  ressources: {valeur: "partiel", note: "Les terres de catégorie II (69 995,2 km²) restent du domaine de l'État ; les bénéficiaires cris y jouissent des droits accordés par cette loi et par toute loi qui réfère à ces terres, loi R-13.1, art. 66 ; la Loi sur les droits de chasse et de pêche dans les territoires de la Baie James et du Nouveau-Québec (RLRQ, c. D-13.1) s'y rapporte.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  consentement: {valeur: "partiel", note: "Régime de protection de l'environnement du chapitre 22 de la Convention (évaluation des projets, Comité consultatif pour l'environnement de la Baie James, Loi sur la qualité de l'environnement, art. 134) ; la Cour suprême a confirmé en 2010 que ce régime s'applique aux projets miniers (Moses) ; il ne prévoit pas de droit de refus.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20100514-2010CSC17"}
  langue: {valeur: "partiel", note: "Dans les écoles de la commission scolaire crie, le cri est langue d'enseignement avec les autres langues en usage, Charte de la langue française, art. 88 ; ce n'est pas une langue officielle du Québec.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/C-11"}
  education: {valeur: "reconnu", note: "Commission scolaire crie régie par la Loi sur l'instruction publique pour les autochtones cris, inuit et naskapis (RLRQ, c. I-14), à laquelle renvoie l'art. 88 de la Charte de la langue française.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/C-11"}
  fiscalite: {valeur: "partiel", note: "L'exemption fiscale des biens des Cris sur les terres de catégorie IA s'applique sous réserve des lois fiscales adoptées par les premières nations cries (Entente, art. 6.2 (1) k)) et par le Gouvernement de la nation crie (art. 8.15), L.C. 2018, ch. 4.", source: "https://laws-lois.justice.gc.ca/fra/lois/C-45.75/page-1.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Statut de bénéficiaire cri défini par la Loi sur les autochtones cris, inuit et naskapis (RLRQ, c. A-33.1) ; les bénéficiaires cris de chaque communauté sont membres de plein droit des corporations foncières, loi R-13.1, art. 1 et 3.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Dans Québec (Procureur général) c. Moses (2010), la Cour suprême applique le régime d'évaluation du chapitre 22 de la Convention à un projet minier, tout en maintenant l'exigence d'une autorisation fédérale au titre de la Loi sur les pêches.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20100514-2010CSC17"}
