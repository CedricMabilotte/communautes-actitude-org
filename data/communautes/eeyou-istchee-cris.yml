droits:
  autogouvernement: {valeur: "reconnu", note: "L'Entente sur la gouvernance de la nation crie, signée le 18 juillet 2017 par le Grand Conseil des Cris, le Gouvernement de la nation crie et le Canada, est approuvée et a force de loi, L.C. 2018, ch. 4, art. 3 ; la Loi sur les Indiens ne s'applique plus aux premières nations cries ni aux terres de catégorie IA, art. 11.", source: "https://laws-lois.justice.gc.ca/fra/lois/C-45.75/page-1.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "La constitution crie est mise en vigueur et a force de loi, L.C. 2018, ch. 4, art. 7 (1) ; les lois cries adoptées conformément à l'Entente et à la constitution crie ont force de loi, art. 8 (1).", source: "https://laws-lois.justice.gc.ca/fra/lois/C-45.75/page-1.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "5 544,1 km² de terres de catégorie I : 3 299,6 km² de catégorie IA, dont l'État conserve la nue-propriété (propriété sans jouissance) et dont l'administration est transférée au Canada pour l'usage et le bénéfice exclusif des administrations locales cries, et 2 244,5 km² de catégorie IB détenus par des corporations foncières cries qui ne peuvent les céder qu'au gouvernement, loi R-13.1, art. 4, 17 à 19 et 25 (1978).", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  ressources: {valeur: "partiel", note: "Les terres de catégorie II (69 995,2 km²) restent du domaine de l'État ; les bénéficiaires cris y jouissent des droits accordés par cette loi et par toute loi qui réfère à ces terres, loi R-13.1, art. 66 ; la Loi sur les droits de chasse et de pêche dans les territoires de la Baie James et du Nouveau-Québec (RLRQ, c. D-13.1) s'y rapporte.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  consentement: {valeur: "partiel", note: "Régime de protection de l'environnement du chapitre 22 de la Convention (évaluation des projets, Comité consultatif pour l'environnement de la Baie James, Loi sur la qualité de l'environnement, art. 134) ; la Cour suprême a confirmé en 2010 que ce régime s'applique aux projets miniers (Moses) ; il ne prévoit pas de droit de refus.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20100514-2010CSC17"}
  langue: {valeur: "partiel", note: "Dans les écoles de la commission scolaire crie, le cri est langue d'enseignement avec les autres langues en usage, Charte de la langue française, art. 88 ; ce n'est pas une langue officielle du Québec. Le Gouvernement de la nation crie a adopté le 17 septembre 2019 une loi crie sur la langue crie d'Eeyou Istchee.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/C-11"}
  education: {valeur: "partiel", note: "Commission scolaire crie instituée par la Loi sur l'instruction publique pour les autochtones cris, inuit et naskapis (RLRQ, c. I-14), partie X, art. 568 et suivants (1978) ; son budget est soumis à l'approbation annuelle du ministre, art. 575.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/I-14"}
  fiscalite: {valeur: "partiel", note: "L'exemption fiscale des biens des Cris sur les terres de catégorie IA (art. 15 (1) de la loi) s'applique sous réserve des lois fiscales adoptées par les premières nations cries (Entente, art. 6.2 (1) k)) et par le Gouvernement de la nation crie (art. 8.15), L.C. 2018, ch. 4.", source: "https://laws-lois.justice.gc.ca/fra/lois/C-45.75/page-1.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Statut de bénéficiaire cri défini par la Loi sur les autochtones cris, inuit et naskapis (RLRQ, c. A-33.1) ; les bénéficiaires cris de chaque communauté sont membres de plein droit des corporations foncières, loi R-13.1, art. 1 et 3.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Dans Québec (Procureur général) c. Moses (2010), la Cour suprême applique le régime d'évaluation du chapitre 22 de la Convention à un projet minier, tout en maintenant l'exigence d'une autorisation fédérale au titre de la Loi sur les pêches. Une étude publiée en 2021 (Che et Hickey, Journal of Environmental Management) relève l'absence de plan régional d'utilisation des terres et d'organisme chargé du suivi des effets cumulatifs des projets en Eeyou Istchee.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20100514-2010CSC17"}
chronologie:
  - {annee: 1975, evenement: "Signature de la Convention de la Baie-James et du Nord québécois."}
  - {annee: 1978, evenement: "Loi québécoise sur le régime des terres."}
  - {annee: 2010, evenement: "Arrêt Moses de la Cour suprême sur le régime environnemental de la Convention."}
  - {annee: 2013, evenement: "Loi instituant le Gouvernement régional d'Eeyou Istchee Baie-James."}
  - {annee: 2017, evenement: "Signature le 18 juillet de l'Entente sur la gouvernance de la nation crie."}
  - {annee: 2018, evenement: "Loi fédérale de mise en vigueur, sanctionnée le 29 mars."}
  - {annee: 2019, evenement: "Adoption à Waswanipi, le 17 septembre, de la première loi crie, sur la langue crie."}
  - {annee: 2021, evenement: "Loi fédérale sur la Déclaration des Nations unies sur les droits des peuples autochtones, sanctionnée le 21 juin."}
