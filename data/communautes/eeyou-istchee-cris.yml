resume: >-
  Les Cris d'Eeyou Istchee vivent à l'est de la baie James, au Québec. La Convention de la Baie-James et du Nord québécois de 1975, approuvée par une loi fédérale (S.C. 1976-77, ch. 32), leur attribue des terres de catégorie I et des droits de chasse et de pêche. L'Entente sur la gouvernance de la nation crie de 2017, mise en vigueur par une loi fédérale de 2018, reconnaît le Gouvernement de la nation crie et une constitution crie. Depuis 2013, les Cris siègent au Gouvernement régional d'Eeyou Istchee Baie-James avec les autres résidents du territoire.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
