villages: {valeur: 5, annee: 2021, perimetre: "localités habitées de la région visée par l'accord : Nain, Hopedale, Makkovik, Postville, Rigolet ; les deux subdivisions non organisées de la division de recensement n° 11 comptent 0 habitant en 2021", source: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=9810000701"}
resume: >-
  Les Inuit du nord du Labrador ont signé le 22 janvier 2005 un accord de revendication territoriale avec le Canada et la province de Terre-Neuve-et-Labrador. L'accord, ratifié par la loi fédérale du 23 juin 2005, leur attribue la propriété de 15 800 km² et crée le gouvernement du Nunatsiavut. Ce gouvernement régional, doté d'une assemblée, légifère pour les Inuit dans des domaines comme l'éducation, la santé et la langue ; cinq gouvernements communautaires inuit remplacent les municipalités.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada a voté contre la Déclaration en 2007, puis a changé de position et l'a appuyée ; la loi fédérale L.C. 2021, ch. 14 (art. 4) confirme qu'elle trouve application en droit canadien.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission au Canada (A/HRC/27/52/Add.2), § 41 : l'accord de 2005 a conduit à la création du gouvernement du Nunatsiavut, qui peut légiférer en matière d'éducation, de santé et d'affaires culturelles ; § 57 : le gouvernement du Nunatsiavut tient la liste des bénéficiaires.", annee: 2014, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
base_nationale:
  - {instrument: "Accord sur les revendications territoriales des Inuit du Labrador (Labrador Inuit Land Claims Agreement)", nature: "accord_revendication", annee: 2005, source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  - {instrument: "Loi sur l'Accord sur les revendications territoriales des Inuit du Labrador, L.C. 2005, ch. 27", nature: "loi", annee: 2005, source: "https://laws.justice.gc.ca/eng/AnnualStatutes/2005_27/FullText.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'accord de 2005 (partie 17.3) prévoit la constitution inuit du Labrador, loi fondamentale qui établit le gouvernement du Nunatsiavut ; la partie 17.38 remplace les municipalités de Nain, Hopedale, Makkovik, Postville et Rigolet par des gouvernements communautaires inuit.", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le gouvernement du Nunatsiavut peut faire des lois sur la culture et la langue (partie 17.8), l'éducation (17.12), la santé (17.13), l'aide au revenu (17.14) et les services à l'enfance et à la famille (17.15), principalement dans les terres et communautés inuit (accord de 2005).", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  justice_propre: {valeur: "partiel", note: "L'accord de 2005 (partie 17.31) permet au gouvernement du Nunatsiavut de créer par loi un tribunal (cour inuit) pour l'application des lois et règlements inuit, avec des normes de qualification des juges convenues avec la province.", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  terres: {valeur: "reconnu", note: "Les Inuit possèdent en fief simple (pleine propriété) les terres inuit du Labrador, soit 15 800 km², avec une part indivise de 25 % du sous-sol, la pierre à sculpter et des matériaux de carrière (art. 4.4.1) ; ces terres ne peuvent être cédées qu'au Canada ou à la province (art. 4.4.5).", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  ressources: {valeur: "partiel", note: "Les Inuit reçoivent 25 % des revenus provinciaux du sous-sol sur leurs terres, une part hors de ces terres et 5 % pour le projet de Voisey's Bay (partie 7) ; ils ont un droit exclusif de récolte de la faune et des plantes dans leurs terres (art. 12.2.2), et le gouvernement du Nunatsiavut répartit les quotas de récolte inuit (art. 12.7.1), avec des conseils de cogestion.", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  consentement: {valeur: "partiel", note: "Aucun projet ne peut commencer sur les terres inuit, ni aucun grand projet dans la région visée, avant une entente sur les répercussions et avantages (contrat sur les compensations et retombées) avec le gouvernement du Nunatsiavut ou une décision d'arbitrage (art. 7.7.2 et 7.7.3) ; les plans de gestion marine exigent une consultation préalable (partie 6.3).", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  langue: {valeur: "partiel", note: "L'accord de 2005 permet de légiférer sur la culture et la langue inuit (partie 17.8) et sur l'inuktitut et son orthographe dans toute la province (art. 17.25.1) ; la constitution inuit du Labrador fait de l'inuktut une langue officielle du gouvernement du Nunatsiavut, sans statut dans le droit provincial (Inuit Tapiriit Kanatami, 2017).", source: "https://itk.ca/wp-content/uploads/2019/02/Inuktut-position-paper.pdf"}
  education: {valeur: "partiel", note: "Pouvoir de légiférer sur l'éducation des Inuit, de la petite enfance au postsecondaire, dans les terres et communautés inuit (art. 17.12.1, accord de 2005).", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  fiscalite: {valeur: "partiel", note: "Le gouvernement du Nunatsiavut peut lever des impôts directs sur les Inuit dans les terres et communautés inuit (art. 20.2.1) ; un accord de financement budgétaire est négocié tous les cinq ans avec le Canada et la province (art. 18.1.1), hors de l'accord lui-même et sous réserve des crédits votés.", source: "https://www.gov.nl.ca/exec/irr/files/January212005AgreementComplete.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "L'accord de 2005 (chapitre 3) établit un registre des bénéficiaires inuit, tenu par le gouvernement du Nunatsiavut ; des corporations communautaires inuit représentent les Inuit de la région du haut lac Melville et de l'extérieur de la région visée.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le gouvernement du Nunatsiavut fonctionne depuis le 1er décembre 2005 (Atlas des peuples autochtones du Canada) ; le Rapporteur spécial de l'ONU sur les droits des peuples autochtones constate en 2014 qu'il légifère en matière d'éducation, de santé et de culture. Élection présidentielle en 2024 (président élu sans opposition) et élection de l'assemblée en mai 2026 ; l'assemblée siège à Hopedale.", source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
chronologie:
  - {annee: 2004, evenement: "Les Inuit du Labrador approuvent l'accord par vote le 26 mai ; la province le ratifie le 6 décembre."}
  - {annee: 2005, evenement: "Signature de l'accord (22 janvier) ; sanction de la loi fédérale (23 juin) ; entrée en vigueur et naissance du gouvernement du Nunatsiavut (1er décembre)."}
  - {annee: 2006, evenement: "Première élection du gouvernement du Nunatsiavut."}
  - {annee: 2024, evenement: "Johannes Lampe, seul candidat, est élu sans opposition à la présidence du Nunatsiavut (avril)."}
  - {annee: 2026, evenement: "Élection des membres de l'assemblée du Nunatsiavut (5 mai) ; David Dicker Jr. est choisi premier ministre (19 mai). Le Canada met fin en septembre à la table de négociation ouverte en 2018 avec le NunatuKavut Community Council, dont l'identité inuit est contestée par le gouvernement du Nunatsiavut."}
