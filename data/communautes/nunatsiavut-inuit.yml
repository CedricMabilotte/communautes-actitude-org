resume: >-
  Les Inuit du nord du Labrador ont signé le 22 janvier 2005 un accord de revendication territoriale avec le Canada et la province de Terre-Neuve-et-Labrador. L'accord, ratifié par la loi fédérale du 23 juin 2005, leur attribue la propriété de 15 800 km² et crée le gouvernement du Nunatsiavut. Ce gouvernement régional, doté d'une assemblée, légifère pour les Inuit dans des domaines comme l'éducation, la santé et la langue ; cinq gouvernements communautaires inuit remplacent les municipalités.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale L.C. 2021, ch. 14 en fait un cadre d'application en droit canadien.", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/TexteComplet.html"}
base_nationale:
  - {instrument: "Accord sur les revendications territoriales des Inuit du Labrador (Labrador Inuit Land Claims Agreement)", nature: "accord_revendication", annee: 2005, source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  - {instrument: "Loi sur l'Accord sur les revendications territoriales des Inuit du Labrador, L.C. 2005, ch. 27", nature: "loi", annee: 2005, source: "https://laws.justice.gc.ca/eng/AnnualStatutes/2005_27/FullText.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'accord de 2005 crée le gouvernement du Nunatsiavut et cinq gouvernements communautaires inuit ; la constitution inuit du Labrador entre en vigueur avec l'accord.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le gouvernement du Nunatsiavut peut faire des lois pour les résidents inuit en matière d'éducation, de santé, de services à l'enfance et d'aide au revenu (accord de 2005) ; la Charte canadienne s'applique.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  justice_propre: {valeur: "partiel", note: "L'accord permet au gouvernement du Nunatsiavut d'établir un système de justice pour l'application des lois inuit.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  terres: {valeur: "reconnu", note: "Les Inuit possèdent 15 800 km² de terres inuit du Labrador ; ils y détiennent un droit exclusif sur la pierre à sculpter et la propriété de 3 950 km² de matériaux de carrière (accord de 2005).", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  ressources: {valeur: "partiel", note: "Les Inuit reçoivent 25 % des revenus provinciaux du sous-sol sur leurs terres et une part des revenus hors de ces terres ; la conservation de la faune et de la pêche reste de responsabilité fédérale et provinciale, avec des conseils de cogestion.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  consentement: {valeur: "partiel", note: "L'accord impose une consultation préalable du gouvernement du Nunatsiavut pour les plans de gestion marine et les projets non renouvelables de la zone, et des ententes sur les répercussions et avantages pour les grands projets.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  langue: {valeur: "partiel", note: "Le gouvernement du Nunatsiavut a compétence sur la langue et la culture inuit (accord de 2005) ; pas de statut de langue officielle trouvé.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  education: {valeur: "partiel", note: "Pouvoir de légiférer en matière d'éducation pour les résidents inuit des terres et des communautés inuit (accord de 2005).", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  fiscalite: {valeur: "partiel", note: "Le gouvernement du Nunatsiavut peut lever des impôts directs sur les Inuit ; un accord de financement budgétaire est négocié tous les cinq ans avec le Canada et la province.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "L'application de l'accord suppose l'inscription comme bénéficiaire ; l'accord couvre aussi les Inuit vivant hors de la région par des corporations communautaires inuit.", source: "https://www.gov.nl.ca/exec/iar/overview/land-claims/highlights/"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le gouvernement du Nunatsiavut est en place depuis le 1er décembre 2005 ; première élection en octobre 2006 ; assemblée siégeant à Hopedale.", source: "https://en.wikipedia.org/wiki/Nunatsiavut"}
chronologie:
  - {annee: 2004, evenement: "Les Inuit du Labrador approuvent l'accord par vote le 26 mai ; la province le ratifie le 6 décembre."}
  - {annee: 2005, evenement: "Signature de l'accord (22 janvier) ; sanction de la loi fédérale (23 juin) ; entrée en vigueur et naissance du gouvernement du Nunatsiavut (1er décembre)."}
  - {annee: 2006, evenement: "Première élection du gouvernement du Nunatsiavut."}
