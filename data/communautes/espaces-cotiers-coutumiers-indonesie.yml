base_nationale:
  - {instrument: "Constitution de 1945, art. 18B (2) : l'État reconnaît et respecte les communautés de droit coutumier et leurs droits traditionnels", nature: "constitution", annee: 2000, source: "https://www.kkp.go.id/news/news-detail/dalam-5-tahun-kkp-tetapkan-pengakuan-dan-perlindungan-bagi-22-masyarakat-hukum-adat65c1cc1354812.html"}
  - {instrument: "Loi n° 27 de 2007 sur la gestion des zones côtières et des petites îles, art. 61 : l'État reconnaît, respecte et protège les droits des communautés coutumières et traditionnelles sur les zones côtières utilisées de génération en génération", nature: "loi", annee: 2007, source: "https://pasal.id/peraturan/uu/uu-no-27-tahun-2007"}
  - {instrument: "Loi n° 1 de 2014 modifiant la loi n° 27 de 2007, art. 1 (33), 21, 22 et 60", nature: "loi", annee: 2014, source: "https://pasal.id/peraturan/uu/uu-no-1-tahun-2014"}
  - {instrument: "Loi n° 6 de 2023 portant adoption du règlement tenant lieu de loi n° 2 de 2022 sur la création d'emplois, art. 18, points 12, 19 et 27 : nouvelle rédaction des art. 16, 22 et 60 de la loi n° 27 de 2007", nature: "loi", annee: 2023, source: "https://pasal.id/peraturan/uu/uu-no-6-tahun-2023"}
  - {instrument: "Règlement du ministre des Affaires maritimes et de la Pêche n° 8/PERMEN-KP/2018 sur la procédure de détermination des espaces de gestion des communautés de droit coutumier dans l'usage de l'espace côtier et des petites îles (en vigueur depuis le 1er mars 2018)", nature: "loi", annee: 2018, source: "https://pasal.id/peraturan/permen/permen-kkp-no-8-permen-kp-2018-tahun-2018"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté de droit coutumier est définie par des institutions de gouvernement coutumier (pranata pemerintahan adat) et un ordre juridique coutumier sur son territoire (art. 1 (33) de la loi n° 1 de 2014 ; art. 1 (1) du règlement ministériel n° 8 de 2018). Elle n'existe pour l'État qu'après un acte de reconnaissance du chef de district ou du maire, pris sur la base d'une vérification par une équipe que nomme le ministre (art. 8, 9 et 12 du règlement de 2018).", source: "https://pasal.id/peraturan/permen/permen-kkp-no-8-permen-kp-2018-tahun-2018"}
  pouvoir_normatif: {valeur: "partiel", note: "La communauté a le droit de gérer les ressources côtières et des petites îles « selon le droit coutumier en vigueur », s'il ne contredit pas la législation (art. 60 (1) d de la loi n° 27 de 2007, rédaction de la loi n° 1 de 2014 reprise par la loi n° 6 de 2023).", source: "https://pasal.id/peraturan/uu/uu-no-6-tahun-2023"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'espace de gestion est défini comme l'espace marin dont la communauté exploite les ressources et qui constitue son territoire coutumier (wilayah pertuanan, art. 1 (2) du règlement ministériel n° 8 de 2018). La communauté reconnue peut le proposer, par l'intermédiaire du chef de district ou du maire, pour inscription dans le plan de zonage côtier provincial (RZWP-3-K) ou dans un plan de zonage national, après identification et cartographie par le gouverneur ou le ministre (art. 5). Le texte ne crée pas de titre de propriété sur l'espace marin.", source: "https://pasal.id/peraturan/permen/permen-kkp-no-8-permen-kp-2018-tahun-2018"}
  ressources: {valeur: "partiel", note: "L'usage de l'espace et des ressources des eaux côtières et des petites îles dans le territoire de la communauté « relève de l'autorité » de la communauté (art. 21 (1) de la loi n° 27 de 2007 modifiée par la loi n° 1 de 2014), en tenant compte de l'intérêt national et de la législation (art. 21 (2), non modifié depuis 2014). Dans son espace de gestion, la communauté est dispensée de la conformité d'usage de l'espace marin (kesesuaian kegiatan pemanfaatan ruang laut, avis préalable de l'administration centrale) exigée de tout usager (art. 16 (2) et 22 (1) dans la rédaction de la loi n° 6 de 2023, qui a remplacé la dispense d'autorisation d'emplacement et de gestion de 2014).", source: "https://pasal.id/peraturan/uu/uu-no-6-tahun-2023"}
  consentement: {valeur: "partiel", note: "Les communautés côtières ont le droit de proposer l'espace de gestion coutumier pour le plan de zonage côtier, d'être informées et de faire opposition, dans un délai fixé, à un plan de gestion publié (art. 60 (1) c, f et h de la loi n° 27 de 2007 dans la rédaction de la loi n° 6 de 2023). La loi ne prévoit pas de consentement préalable.", source: "https://pasal.id/peraturan/uu/uu-no-6-tahun-2023"}
  langue: {valeur: "non_applicable", note: "", source: ""}
