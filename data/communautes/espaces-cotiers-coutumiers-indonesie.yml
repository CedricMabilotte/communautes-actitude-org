resume: >-
  Fiche agrégée : elle couvre les communautés de droit coutumier (masyarakat hukum adat, MHA) des côtes et des petites îles dont l'existence est reconnue par un acte du chef de district (bupati) ou du maire (wali kota) selon la procédure du règlement du ministre des Affaires maritimes et de la Pêche n° 8 de 2018. La loi n° 27 de 2007 sur la gestion des zones côtières et des petites îles, modifiée par la loi n° 1 de 2014 puis par la loi n° 6 de 2023 sur la création d'emplois, confie à la communauté l'usage de l'espace et des ressources des eaux côtières de son territoire, sous réserve de l'intérêt national, et la dispense, dans son espace de gestion (wilayah kelola), de l'avis de conformité d'usage de l'espace marin exigé des autres usagers. La communauté reconnue peut proposer son espace de gestion pour inscription dans le plan de zonage côtier de la province. Le ministère compte 22 communautés reconnues par 18 actes en 2021 et 27 communautés accompagnées dans six provinces, avec 23 actes, en janvier 2025 ; une partie des sites est située dans les provinces de Papouasie, aussi traitées dans la fiche « Papous (Orang Asli Papua) ».
