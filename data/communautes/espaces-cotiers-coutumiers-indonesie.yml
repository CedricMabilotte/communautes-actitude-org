  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon la Coalition populaire pour la justice dans la pêche (KIARA), en août 2024, quatre plans de zonage côtier provinciaux (Aceh, Sulawesi du Sud-Est, Maluku, Papouasie occidentale) attribuaient un espace aux communautés de droit coutumier, et aucun des 14 plans provinciaux fusionnés avec l'aménagement terrestre (RTRW) n'en attribuait ; dans le projet de plan fusionné de Sulawesi du Sud-Est, l'allocation de 4 307,08 hectares prévue auparavant pour ces communautés avait disparu (étude KIARA et JKPP, Mongabay Indonesia, 5 août 2024).", source: "https://mongabay.co.id/2024/08/20/masyarakat-hukum-adat-masih-terpinggirkan-negara-gagal-lindungi/"}
chronologie:
  - {annee: 2007, evenement: "Loi n° 27 sur la gestion des zones côtières et des petites îles : l'État reconnaît les droits des communautés coutumières sur les côtes utilisées de génération en génération (art. 61)."}
  - {annee: 2014, evenement: "Loi n° 1 : l'usage de l'espace côtier coutumier relève de l'autorité de la communauté (art. 21), qui est dispensée d'autorisation (art. 22)."}
  - {annee: 2016, evenement: "Le ministère des Affaires maritimes et de la Pêche commence à accompagner l'identification et la reconnaissance des communautés de droit coutumier côtières."}
  - {annee: 2018, evenement: "Règlement ministériel n° 8 sur la procédure de reconnaissance et d'inscription des espaces de gestion coutumière dans les plans de zonage."}
  - {annee: 2021, evenement: "Le ministère compte 32 communautés inventoriées dans cinq provinces, dont 22 reconnues par 18 actes de district ou de ville."}
  - {annee: 2023, evenement: "Loi n° 6 sur la création d'emplois : la dispense accordée aux communautés de droit coutumier porte désormais sur la conformité d'usage de l'espace marin, dans leur espace de gestion (art. 22)."}
  - {annee: 2023, evenement: "Le ministère indique avoir accompagné la reconnaissance de 26 communautés."}
  - {annee: 2024, evenement: "Le ministère compte 23 communautés reconnues par acte de district ou de ville sur 27, dans six provinces (21 août). KIARA relève que quatre plans de zonage côtier provinciaux attribuent un espace aux communautés de droit coutumier."}
  - {annee: 2025, evenement: "Le ministère compte 27 communautés accompagnées dans six provinces depuis 2016, avec 23 actes de district ou de ville."}
  - {annee: 2026, evenement: "Le Réseau de cartographie participative (JKPP) publie une carte indicative de 469 communautés et environ 82 millions d'hectares de territoires coutumiers côtiers et marins, sans valeur de reconnaissance."}
fiabilite:
  verifie: ["Texte indonésien des art. 1, 2, 4, 5 et 7 à 12 du règlement ministériel n° 8 de 2018 (pasal.id) ; statut « en vigueur » confirmé par la base juridique de l'Agence d'audit (peraturan.bpk.go.id).", "Texte indonésien des art. 1 (33), 21, 22 et 60 de la loi n° 1 de 2014 (pasal.id).", "Nouvelle rédaction des art. 16, 22 et 60 de la loi n° 27 de 2007 par l'art. 18 de la loi n° 6 de 2023 ; art. 21 non modifié (texte officiel, p. 47 à 55, via pasal.id).", "Art. 61 de la loi n° 27 de 2007, non modifié par la loi n° 1 de 2014 (pasal.id).", "22 communautés reconnues par 18 actes, 32 inventoriées dans cinq provinces : communiqué du ministère du 15 août 2021.", "26 communautés accompagnées : communiqué du ministère du 18 décembre 2023.", "27 communautés, six provinces, 23 actes : communiqué du ministère du 17 janvier 2025.", "23 communautés reconnues sur 27, six provinces : communiqué du ministère du 21 août 2024 (PPID).", "Cinq provinces nommées (Sulawesi du Nord, Sulawesi du Sud-Est, Maluku, Papouasie, Papouasie occidentale) et 27 communautés reconnues sur 34 identifiées : directeur du ministère cité par Mongabay Indonesia le 20 août 2024.", "Allocation d'espace dans quatre plans de zonage provinciaux et aucune dans les 14 plans fusionnés : KIARA, rapporté par Mongabay Indonesia le 20 août 2024.", "Disparition de 4 307,08 ha d'allocation en Sulawesi du Sud-Est : étude KIARA et JKPP, rapportée par Mongabay Indonesia le 5 août 2024."]
  non_confirme: ["Les chiffres divergent selon les sources : le ministère donne 23 communautés reconnues sur 27 dans six provinces le 21 août 2024 ; un directeur du ministère cité par Mongabay le même mois donne 27 communautés reconnues sur 34 identifiées dans cinq provinces ; un universitaire cité par Mongabay en août 2026 donne 28 communautés, dont 24 dotées d'un acte régional.", "Aucune liste officielle complète des communautés et de leurs actes n'a été trouvée ; pas de tableau des sites. La sixième province n'est pas nommée par les sources consultées ; le communiqué du ministère de décembre 2023 situe la communauté de Werur (district de Tambrauw) en Papouasie du Sud-Ouest, province créée en 2022.", "Surface totale des espaces de gestion reconnus non trouvée ; population non trouvée.", "Aucun document onusien nommant ce régime n'a été trouvé.", "Les actes de reconnaissance individuels (par ex. règlement du maire d'Ambon n° 15 de 2023 pour Negeri Rutong) n'ont pas pu être ouverts.", "Nombre de villages : non trouvé."]
