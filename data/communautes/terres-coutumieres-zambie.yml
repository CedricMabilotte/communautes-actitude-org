resume: >-
  La loi foncière de 1995 (Lands Act, chap. 184) maintient et reconnaît les droits détenus selon la tenure coutumière (droits fonciers attribués et contrôlés selon la coutume locale) dans les zones coutumières (art. 7). La terre reste dévolue au Président au nom du peuple zambien (art. 3) ; le Président ne peut l'aliéner en zone coutumière sans tenir compte du droit coutumier local, sans consulter le chef et sans l'approbation préalable du chef et de l'autorité locale (art. 3 (4)), et la conversion d'une tenure coutumière en bail exige la même approbation (art. 8). La Constitution amendée en 2016 garantit l'institution de la chefferie, qui peut détenir des biens en fiducie pour ses sujets (art. 165 et 166), et classe la terre en terre d'État et terre coutumière (art. 254). Selon la politique foncière nationale de 2021, la terre coutumière représentait 94 % du territoire à l'indépendance, part réduite depuis par les conversions en terre d'État. La faune, les forêts et les pêcheries gérées par les communautés font l'objet des fiches « Conseils communautaires des ressources de Zambie », « Forêts communautaires de Zambie » et « Zones de gestion des pêcheries de Zambie ».
