resume: >-
  L'Azad Jammu-et-Cachemire est la partie sud-ouest de l'ancien État princier du Jammu-et-Cachemire administrée par le Pakistan depuis 1947-1949. Il n'est pas une province du Pakistan. Son régime repose sur la Constitution intérimaire de 1974 (Act VIII of 1974), votée par l'Assemblée législative du territoire avec l'accord du gouvernement du Pakistan : président, Premier ministre et gouvernement responsables devant une Assemblée de 53 membres, Cour suprême et Haute Cour propres. Le treizième amendement, adopté en séance commune de l'Assemblée et du Conseil le 1er juin 2018, retire au Conseil de l'Azad Jammu-et-Cachemire, présidé par le Premier ministre du Pakistan, ses pouvoirs législatifs : l'Assemblée légifère seule sur toutes les matières sauf 32 réservées au gouvernement du Pakistan, et sur 22 autres avec son accord. Le préambule renvoie au plébiscite prévu par les résolutions de la Commission des Nations unies pour l'Inde et le Pakistan (UNCIP) ; la même Constitution interdit toute activité contraire à l'adhésion de l'État au Pakistan.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Résolution de l'UNCIP du 13 août 1948, acceptée par l'Inde et le Pakistan, partie II, A.3 : en attendant un règlement final, le territoire évacué par les troupes pakistanaises sera administré par les « autorités locales » sous la surveillance de la Commission. Le même rapport indique que la Commission a décidé d'éviter tout acte valant reconnaissance de fait ou de droit du « gouvernement de l'Azad Cachemire » (§ 69).", annee: 1948, source: "https://documents.un.org/api/symbol/access?s=S/1100&l=en&t=pdf"}
  - {mecanisme: "mission_onu", detail: "Résolution 91 (1951) du Conseil de sécurité, § 7 : le groupe d'observateurs militaires (UNMOGIP, Groupe d'observateurs militaires des Nations unies dans l'Inde et le Pakistan) continue de surveiller le cessez-le-feu dans l'État de Jammu-et-Cachemire ; le préambule constate que l'Inde et le Pakistan ont réaffirmé leur souhait que l'avenir de l'État soit décidé par un plébiscite libre et impartial sous l'égide des Nations unies. Le texte vise l'État dans son ensemble, pas l'Azad Jammu-et-Cachemire nommément.", annee: 1951, source: "https://docs.un.org/en/S/RES/91(1951)"}
base_nationale:
  - {instrument: "Azad Jammu and Kashmir Interim Constitution, 1974 (Act VIII of 1974), texte consolidé avec le treizième amendement de 2018", nature: "statut_autonomie", annee: 1974, source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  - {instrument: "Constitution de la République islamique du Pakistan (1973), art. 257 : relation entre le Pakistan et l'État de Jammu-et-Cachemire", nature: "constitution", annee: 1973, source: "https://www.pakistani.org/pakistan/constitution/part12.ch4.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Président élu par l'Assemblée, art. 5 ; gouvernement dirigé par un Premier ministre et collectivement responsable devant l'Assemblée, art. 12 ; Assemblée de 53 membres dont 45 élus au suffrage direct (33 sièges dans le territoire, 12 pour les réfugiés installés au Pakistan), 5 femmes, 1 ouléma, 1 membre de la diaspora et 1 technocrate, art. 22, Constitution intérimaire de 1974 modifiée en 2018.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée a le pouvoir exclusif de légiférer sur toute matière absente de la partie A de la troisième annexe (32 matières réservées au gouvernement du Pakistan, dont la défense, la monnaie et les affaires étrangères), art. 31 (2) et (3) ; les matières de la partie B exigent l'accord du gouvernement du Pakistan, art. 31 (4) ; aucune loi ne peut être contraire à l'islam, art. 31 (6) ; la Constitution ne limite pas l'action du Pakistan dans les matières réservées, art. 56.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  justice_propre: {valeur: "partiel", note: "Cour suprême de l'Azad Jammu-et-Cachemire, juridiction d'appel la plus haute, art. 42, et Haute Cour, art. 43 ; leurs juges sont nommés par le Président sur avis du président du Conseil de l'Azad Jammu-et-Cachemire, c'est-à-dire du Premier ministre du Pakistan, art. 42 (4) et 43 (2-A) modifiés par le quatorzième amendement (Act XL of 2020).", source: "http://www.law.gok.pk/wp-content/uploads/2021/06/volume-XIV.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le pétrole et le gaz naturel, ainsi que l'électricité hors production planifiée par le gouvernement de l'Azad Jammu-et-Cachemire, relèvent de la partie B de la troisième annexe (loi de l'Assemblée avec l'accord du Pakistan), entrées 2 et 8 ; le HCDH relève en 2019 que les ressources naturelles sont contrôlées par des organismes fédéraux pakistanais (§ 33).", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution intérimaire ne se modifie que par une loi votée par les deux tiers de l'Assemblée, art. 33 (3) ; la modification des articles 31, 33 et 56 exige en outre l'accord préalable du gouvernement du Pakistan, art. 33 (2) ; le Pakistan peut agir sans consentement dans les matières réservées, art. 56.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  langue: {valeur: "partiel", note: "La langue nationale est celle que déclare le gouvernement de l'Azad Jammu-et-Cachemire ; toute partie de la société ayant une langue, une écriture ou une culture propres a le droit de les préserver et de créer des institutions à cette fin, art. 4, droit fondamental 24.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  education: {valeur: "partiel", note: "L'éducation relève de la compétence de l'Assemblée, mais les programmes, la politique et les normes d'enseignement ainsi que les normes de l'enseignement supérieur exigent l'accord du gouvernement du Pakistan, troisième annexe, partie B, entrées 14 et 16 ; enseignement gratuit et obligatoire de 5 à 16 ans, art. 4, droit fondamental 23.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  fiscalite: {valeur: "partiel", note: "Tous les impôts, y compris l'impôt sur le revenu, sont levés dans le territoire par une loi de l'Assemblée, art. 31 (5) ; Fonds consolidé (Consolidated Fund) et budget annuel propres, art. 37-A et 38 ; les droits de douane et l'impôt sur les sociétés sont réservés au gouvernement du Pakistan, troisième annexe, partie A, entrées 28 et 29.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  representation: {valeur: "partiel", note: "Le Conseil de l'Azad Jammu-et-Cachemire, présidé par le Premier ministre du Pakistan, comprend six membres élus par l'Assemblée et n'a plus depuis 2018 qu'un rôle consultatif, art. 21 (1) et (8) ; le territoire n'envoie aucun député à l'Assemblée nationale du Pakistan (HCDH, 2018, § 142).", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Le « sujet d'État » (State Subject) est défini par la notification du gouvernement de l'État de Jammu-et-Cachemire du 20 avril 1927, art. 2 ; les droits fondamentaux de circulation, d'association et de propriété sont attribués aux sujets d'État, art. 4, droits 5, 7 et 13 ; l'Assemblée légifère pour tous les sujets d'État où qu'ils soient, art. 31 (1) (b).", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
  autodetermination_externe: {valeur: "conteste", note: "Le préambule renvoie au plébiscite libre « sous l'égide des Nations unies » prévu par les résolutions de l'UNCIP pour décider du statut de l'ensemble de l'État de Jammu-et-Cachemire, et le Président peut nommer un conseiller pour le plébiscite, art. 11 ; aucune personne ni aucun parti ne peut agir contre « l'idéologie de l'adhésion de l'État au Pakistan », art. 4, droit fondamental 7 (3) ; le plébiscite prévu depuis 1948 n'a pas eu lieu.", source: "https://ajkassembly.gok.pk/wp-content/uploads/2019/10/AJK-Interim-Constitution-1974-with-13th-Amendment.pdf"}
effectivite: {valeur: "partielle", note: "Le HCDH écrit en 2018 que le territoire a un régime parlementaire mais qu'il est contrôlé dans les faits par le gouvernement du Pakistan, dont sont détachés les principaux hauts fonctionnaires (§ 142 et note 319) ; en 2019, il relève que l'amendement de 2018 maintient les restrictions aux libertés d'expression et d'association et que des critiques jugent que les pouvoirs clés sont passés au gouvernement fédéral (§ 27 et 56).", source: "https://www.ohchr.org/Documents/Countries/IN/KashmirUpdateReport_8July2019.pdf"}
chronologie:
  - {annee: 1948, evenement: "Résolution de l'UNCIP du 13 août : le territoire évacué par les troupes pakistanaises doit être administré par les « autorités locales » sous surveillance de la Commission."}
  - {annee: 1951, evenement: "Résolution 91 du Conseil de sécurité : le groupe d'observateurs militaires (UNMOGIP) continue de surveiller le cessez-le-feu après la fin du mandat de l'UNCIP."}
  - {annee: 1970, evenement: "Azad Jammu and Kashmir Government Act, abrogé et remplacé en 1974."}
  - {annee: 1974, evenement: "Constitution intérimaire (Act VIII of 1974) du 31 août, avec l'accord du gouvernement du Pakistan."}
  - {annee: 1975, evenement: "Premier amendement du 12 novembre : le Président est élu par l'Assemblée et le Conseil réunis."}
  - {annee: 2018, evenement: "Treizième amendement adopté le 1er juin : le Conseil perd ses pouvoirs législatifs, l'Assemblée passe à 53 membres et élit seule le Président."}
  - {annee: 2020, evenement: "Quatorzième amendement du 24 décembre : les juges de la Cour suprême et de la Haute Cour sont nommés sur avis du président du Conseil, le Premier ministre du Pakistan."}
fiabilite:
  verifie: ["Quatorzième amendement (Act XL of 2020) dans le recueil des lois de l'Azad Jammu-et-Cachemire, volume XIV (2018-2020), publié par le département de la Justice du gouvernement de l'Azad Jammu-et-Cachemire.", "Préambule et articles 2, 4 (droits fondamentaux 5, 7, 13, 23 et 24), 5, 7, 11, 12, 21, 22, 31, 33, 37-A, 38, 42, 43 et 56 et troisième annexe (parties A et B) du texte consolidé publié par l'Assemblée législative de l'Azad Jammu-et-Cachemire.", "Résolution de l'UNCIP du 13 août 1948 et § 69 du premier rapport intérimaire de la Commission (S/1100).", "Résolution 91 (1951) du Conseil de sécurité.", "Rapports du HCDH sur le Cachemire de 2018 (§ 141, 142, 147) et de 2019 (§ 26, 27, 33, 56).", "Superficie, population de 2017, nombre de districts et de villages dans « AJ&K at a Glance 2023 » du bureau des statistiques du gouvernement de l'Azad Jammu-et-Cachemire."]
  non_confirme: ["Amendements postérieurs à 2020 non vérifiés : le texte consolidé consulté s'arrête au treizième amendement et le recueil des lois au quatorzième.", "Le HCDH (2018, note 339) situe l'interdiction d'agir contre l'adhésion au Pakistan à l'article 7 (2) ; dans le texte consolidé de 2018, elle figure à l'article 4, droit fondamental 7 (3).", "Langue officielle de fait (ourdou) non établie sur un texte : la Constitution laisse au gouvernement le soin de déclarer la langue nationale.", "Aucune loi trouvée réservant collectivement la terre aux sujets d'État : droit « terres » laissé sans source.", "Population au recensement de 2023 non trouvée sur une source officielle."]
