  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Une décision de l'Assemblée parlementaire peut être déclarée contraire à l'intérêt vital du peuple bosniaque, croate ou serbe par la majorité des délégués de ce peuple ; elle exige alors la majorité des délégués bosniaques, croates et serbes présents et votants à la Chambre des peuples (Constitution, art. IV.3.e-f) ; un membre de la présidence peut déclarer une décision de la présidence contraire à l'intérêt vital de l'entité dont il est élu, et la décision ne prend pas effet si les deux tiers de l'Assemblée nationale de la Republika Srpska (membre serbe) ou des délégués bosniaques ou croates de la Chambre des peuples de la Fédération (membres bosniaque et croate) confirment cette déclaration (art. V.2.d) ; dans la Fédération, le veto couvre notamment l'éducation, la religion, la langue, la culture et l'organisation territoriale (amendement XXXVII, 2002).", source: "https://www.constituteproject.org/constitution/Bosnia_Herzegovina_2009"}
  langue: {valeur: "reconnu", note: "Le bosnien, le croate et le serbe sont langues officielles de la Fédération, avec les alphabets latin et cyrillique (Constitution de la Fédération, amendement XXIX de 2002 remplaçant l'art. I.6) ; la langue du peuple serbe, celle du peuple bosniaque et celle du peuple croate sont langues officielles de la Republika Srpska (amendement LXXI, 2002).", source: "https://www.ohr.int/decision-on-constitutional-amendments-in-the-federation/"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Chambre des peuples de l'État : 15 délégués, 5 Bosniaques, 5 Croates, 5 Serbes, quorum de 9 délégués dont au moins 3 de chaque peuple (Constitution, art. IV.1) ; présidence de trois membres, un Bosniaque, un Croate, un Serbe (art. V) ; chaque chambre choisit un Serbe, un Bosniaque et un Croate comme président et vice-présidents (art. IV.3.b) ; Chambre des peuples de la Fédération : 17 délégués de chaque peuple constitutif et 7 des « Autres » (amendement XXXIII de 2002) ; représentation proportionnelle des peuples dans les institutions publiques des deux entités (Fédération, amendement LII ; Republika Srpska, amendement LXXXV ; 2002).", source: "https://www.constituteproject.org/constitution/Bosnia_Herzegovina_2009"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les institutions fonctionnent selon les quotas prévus, mais le 69e rapport du Haut Représentant au Secrétaire général de l'ONU (octobre 2025 – avril 2026) relève que la règle de quorum exigeant la présence d'une majorité des délégués de chaque peuple constitutif à la Chambre des peuples a été utilisée comme mécanisme de blocage, et rapporte l'arrêt Begić de la Cour européenne des droits de l'homme : seuls les Bosniaques, les Croates et les Serbes peuvent être élus à la présidence et aux vice-présidences de la Chambre des représentants ; la Cour européenne des droits de l'homme a jugé discriminatoire en 2009 l'exclusion des « Autres » de la présidence et de la Chambre des peuples (Sejdić et Finci).", source: "https://www.ohr.int/69th-report-of-the-high-representative-for-implementation-of-the-peace-agreement-on-bosnia-and-herzegovina-to-the-secretary-general-of-the-un/"}
chronologie:
  - {annee: 1995, evenement: "Accord-cadre général pour la paix, signé à Paris le 14 décembre : la Constitution (annexe 4) désigne les Bosniaques, les Croates et les Serbes comme peuples constitutifs."}
  - {annee: 2000, evenement: "Décision partielle III de la Cour constitutionnelle (affaire U 5/98, 1er juillet) : les trois peuples sont constitutifs sur l'ensemble du territoire ; des dispositions des constitutions des deux entités sont annulées."}
  - {annee: 2002, evenement: "Accord de Sarajevo du 27 mars entre partis politiques, puis décisions du Haut Représentant du 19 avril modifiant les constitutions de la Fédération et de la Republika Srpska."}
  - {annee: 2009, evenement: "Arrêt Sejdić et Finci de la Cour européenne des droits de l'homme (22 décembre) : l'inéligibilité des personnes n'appartenant à aucun peuple constitutif viole la Convention."}
  - {annee: 2013, evenement: "Recensement : 1 769 592 Bosniaques, 544 780 Croates et 1 086 733 Serbes déclarés."}
