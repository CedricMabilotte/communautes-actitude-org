resume: >-
  La Constitution de la Bosnie-Herzégovine, annexe 4 de l'accord-cadre général pour la paix signé en 1995 (accords de Dayton), désigne dans son préambule les Bosniaques, les Croates et les Serbes comme « peuples constitutifs », aux côtés des « Autres » et des citoyens.
  Ce statut n'est pas celui d'une minorité : il garantit à chacun des trois peuples une représentation fixe dans les institutions de l'État (Chambre des peuples, présidence collégiale de trois membres) et un droit de veto collectif, la procédure d'« intérêt vital » : lorsque la majorité des délégués d'un peuple déclare une décision contraire à l'intérêt vital de ce peuple, la décision doit recueillir la majorité des délégués de chacun des trois peuples.
  En 2000, la Cour constitutionnelle a jugé que les trois peuples sont constitutifs sur tout le territoire, y compris dans chacune des deux entités ; les constitutions de la Fédération et de la Republika Srpska ont été modifiées en ce sens en 2002.
  Les personnes qui ne se déclarent d'aucun des trois peuples ne peuvent pas être élues à la présidence ni à la Chambre des peuples, ce que la Cour européenne des droits de l'homme a jugé discriminatoire en 2009.
