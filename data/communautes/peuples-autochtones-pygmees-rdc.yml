reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La République démocratique du Congo a voté pour la Déclaration des Nations unies sur les droits des peuples autochtones le 13 septembre 2007 (A/61/PV.107) et reconnaît les « peuples autochtones pygmées » dans la loi n° 22/030.", annee: 2007, source: "https://docs.un.org/fr/A/61/PV.107"}
base_nationale:
  - {instrument: "Loi n° 22/030 du 15 juillet 2022 portant protection et promotion des droits des peuples autochtones pygmées", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Art. 6 de la loi n° 22/030 : les peuples autochtones pygmées ont le droit de recourir à leurs coutumes et pratiques traditionnelles pour le règlement des conflits internes, dans le respect de la loi.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  terres: {valeur: "partiel", note: "Art. 42 et 48 de la loi n° 22/030 : droit aux terres et ressources qu'ils possèdent, occupent ou utilisent « conformément à la loi en vigueur » ; l'État leur accorde reconnaissance et protection juridique. Mesures d'application non adoptées.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  ressources: {valeur: "partiel", note: "Art. 44 et 47 de la loi n° 22/030 : jouissance des ressources naturelles ligneuses et non ligneuses et des bénéfices des services environnementaux ; droit à des avantages tirés de l'exploitation commerciale par un tiers.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  consentement: {valeur: "partiel", note: "Art. 2 de la loi n° 22/030 : le consentement libre, informé et préalable est un droit collectif de donner ou refuser son accord à tout projet touchant leurs terres ; art. 42 : aucune délocalisation ni réinstallation sans ce consentement. Mesures d'application non adoptées.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Art. 22 et 23 de la loi n° 22/030 : enseignement primaire, secondaire et professionnel gratuit dans le public ; système d'alphabétisation et d'éducation non formelle adapté à leurs langues et coutumes.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Art. 14 de la loi n° 22/030 : l'État garantit l'accès à l'exercice du pouvoir politique au sein des organes de décision. Aucun siège réservé.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon le système des Nations unies en RDC, quatre ans après la promulgation, le bilan est « mitigé » : les mesures d'application (décrets et arrêtés), les crédits budgétaires et les capacités institutionnelles restent à mettre en place.", source: "https://fr.allafrica.com/stories/202608110646.html"}
