resume: >-
  La loi n° 22/030 du 15 juillet 2022 est le premier texte de la République démocratique du Congo consacré aux peuples autochtones pygmées, qu'elle définit comme des peuples de chasseurs-cueilleurs vivant généralement en forêt.
  Elle leur reconnaît le recours à leurs coutumes pour régler leurs conflits internes, des droits sur les terres et ressources qu'ils possèdent, occupent ou utilisent, et le consentement libre, informé et préalable à tout projet touchant leurs terres.
  Publiée au Journal officiel le 14 novembre 2022, elle entre en vigueur trois mois après cette publication (art. 62) ; ses décrets d'application n'étaient pas adoptés en août 2026.
  Les estimations de population vont de 600 000 à 2 millions de personnes selon les sources.
  Les concessions forestières attribuées aux communautés locales relèvent de la fiche « Concessions forestières des communautés locales de RDC ».
reconnaissance_regionale:
  - {mecanisme: "commission_africaine", detail: "Le 19 janvier 2024, la Commission africaine des droits de l'homme et des peuples adresse une lettre d'appel urgent au gouvernement de la RDC pour faire cesser les violences contre les Batwa et leurs expulsions du parc national de Kahuzi-Biega (rapporté par le Haut-Commissariat des Nations unies aux droits de l'homme, A/HRC/WG.6/47/COD/3, § 47).", annee: 2024, source: "https://docs.un.org/fr/A/HRC/WG.6/47/COD/3"}
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La République démocratique du Congo a voté pour la Déclaration des Nations unies sur les droits des peuples autochtones le 13 septembre 2007 (A/61/PV.107) et reconnaît les « peuples autochtones pygmées » dans la loi n° 22/030.", annee: 2007, source: "https://docs.un.org/fr/A/61/PV.107"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits économiques, sociaux et culturels note en 2022 la discrimination et l'exclusion visant les « peuples autochtones batwas » et l'absence de reconnaissance de leurs droits sur leurs terres, territoires ancestraux et ressources naturelles (E/C.12/COD/CO/6, § 14).", annee: 2022, source: "https://docs.un.org/fr/E/C.12/COD/CO/6"}
base_nationale:
  - {instrument: "Loi n° 22/030 du 15 juillet 2022 portant protection et promotion des droits des peuples autochtones pygmées", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Art. 6 de la loi n° 22/030 : les peuples autochtones pygmées ont le droit de recourir à leurs coutumes et pratiques traditionnelles pour le règlement des conflits internes, dans le respect de la loi.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  terres: {valeur: "partiel", note: "Art. 42 et 48 de la loi n° 22/030 : droit aux terres et aux ressources naturelles qu'ils possèdent, occupent ou utilisent, « sans préjudice des droits de propriété de l'État sur le sol et le sous-sol » et « conformément à la loi en vigueur » ; l'État accorde reconnaissance et protection juridique à ces terres.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  ressources: {valeur: "partiel", note: "Art. 44, 45 et 47 de la loi n° 22/030 : jouissance des ressources naturelles ligneuses et non ligneuses et des bénéfices des services environnementaux ; participation à la définition des priorités d'utilisation et de contrôle des terres et ressources ; droit à des avantages tirés de leur exploitation commerciale par un tiers, sur la base d'un cahier des charges.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  consentement: {valeur: "partiel", note: "Art. 2 de la loi n° 22/030 : le consentement libre, informé et préalable est un droit collectif de donner ou de refuser son accord à tout projet susceptible d'avoir une incidence sur leurs terres et ressources ; art. 42 : aucune délocalisation ni réinstallation sans ce consentement.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Art. 22 et 23 de la loi n° 22/030 : enseignement primaire, secondaire et professionnel gratuit dans le public ; système d'alphabétisation et d'éducation non formelle adapté à leurs langues et coutumes.", source: "https://faolex.fao.org/docs/pdf/cng213451.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2024, la Commission nationale des droits de l'homme constate que la situation des peuples autochtones pygmées ne connaît pas d'amélioration significative depuis la promulgation, notamment pour la participation aux affaires publiques, l'accès à la justice locale, à la terre et à l'éducation (A/HRC/WG.6/47/COD/3, § 3) ; la même année, la Commission africaine dénonce des expulsions de Batwa du parc national de Kahuzi-Biega. En août 2026, le Bureau conjoint des Nations unies aux droits de l'homme qualifie le bilan de « nuancé » et demande l'adoption des décrets et arrêtés d'application et l'allocation de crédits budgétaires.", source: "https://docs.un.org/fr/A/HRC/WG.6/47/COD/3"}
chronologie:
  - {annee: 2007, evenement: "La RDC vote pour la DNUDPA."}
  - {annee: 2021, evenement: "Adoption de la proposition de loi par l'Assemblée nationale le 7 avril."}
  - {annee: 2022, evenement: "Observations du Comité des droits économiques, sociaux et culturels (mars) ; loi n° 22/030 du 15 juillet, publiée au Journal officiel le 14 novembre."}
  - {annee: 2023, evenement: "Entrée en vigueur de la loi, trois mois après sa publication."}
  - {annee: 2024, evenement: "Lettre d'appel urgent de la Commission africaine sur les expulsions de Batwa du parc national de Kahuzi-Biega (19 janvier) ; examen périodique universel de la RDC (novembre)."}
  - {annee: 2026, evenement: "Journée internationale des peuples autochtones : le Bureau conjoint des Nations unies aux droits de l'homme demande l'adoption des mesures d'application."}
fiabilite:
  verifie: ["Art. 2, 6, 14, 19, 22, 23, 42, 44, 45, 47, 48 et 62 de la loi n° 22/030 et date de publication au Journal officiel (14 novembre 2022), texte FAOLEX.", "Vote de la RDC pour la DNUDPA (A/61/PV.107).", "E/C.12/COD/CO/6, § 14 (2022).", "A/HRC/WG.6/47/COD/3, § 3 et § 47 (2024).", "Bilan « nuancé » et trois demandes du BCNUDH (allAfrica, août 2026)."]
  non_confirme: ["Population : aucun recensement ; 600 000 à 1,5 million selon l'UICN (2022), environ 700 000 selon le gouvernement et 2 millions selon la société civile (UPR Info, 2024, citant l'IWGIA), sans année de référence ni méthode.", "Date de promulgation : la loi porte la date du 15 juillet 2022 et le Journal officiel est daté du 14 novembre 2022 ; UPR Info et le rapport national de 2024 indiquent une promulgation le 16 novembre 2022.", "Représentation : l'art. 14 de la loi garantit l'accès à l'exercice du pouvoir politique, sans siège réservé ni mécanisme de représentation ; non retenu comme droit de représentation.", "Programme national de promotion des droits des peuples autochtones pygmées doté de 3 milliards de francs congolais : déclaration du gouvernement (A/HRC/WG.6/47/COD/1, § 67), non confirmée par une source indépendante.", "Adoption de décrets d'application entre août 2026 et octobre 2026 : non vérifiée.", "Nombre de lieux : sans objet (régime non territorial, pas de liste de sites).", "Nombre de villages : non trouvé.", "Surface : non trouvée.", "Liste des provinces de résidence : non vérifiée sur une source officielle."]
