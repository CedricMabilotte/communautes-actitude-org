resume: >-
  Fiche agrégée : elle couvre les communautés riveraines (ribeirinhas) des várzeas, plaines inondées une partie de l'année, qui fixent par consensus des règles de pêche sur les lacs qu'elles utilisent. L'Instruction normative n° 29 de l'Institut brésilien de l'environnement et des ressources naturelles renouvelables (IBAMA) du 31 décembre 2002 définit l'accord de pêche comme « un ensemble de mesures spécifiques découlant d'accords consensuels entre les divers usagers et l'organe gestionnaire des ressources de pêche » dans une zone délimitée ; l'IBAMA rend ces règles obligatoires par des portarias (arrêtés) complémentaires. L'instruction exclut les accords qui établissent des privilèges d'un groupe sur les autres. Entre 1995 et 2006, l'IBAMA a réglementé 35 accords de pêche dans l'État d'Amazonas.
