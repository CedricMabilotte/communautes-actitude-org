effectivite: {valeur: "non_etablie", note: "En 2020, le Sénat indique que le parc travaille à des dérogations pour le prélèvement d'espèces protégées à usage local et à des plans de gestion concertés avec les populations amérindiennes et bushinengé (marronnes) ; il ne mesure pas l'application des droits d'usage.", source: "https://www.senat.fr/rap/r19-337/r19-33719.html"}
