  ressources: {valeur: "partiel", note: "Les communautés ne sont pas soumises à la réglementation du parc pour l'accès et la circulation, l'agriculture itinérante sur brûlis, la création de nouveaux villages et la domestication d'animaux sauvages (décret de 2007, art. 21) ; leurs droits d'usage collectifs permettent à leurs membres de prélever des végétaux pour construire des carbets (abris), de chasser et pêcher hors excursions touristiques ou expéditions professionnelles, de prélever pour l'artisanat, et de troquer ou vendre le surplus de chasse et de pêche aux seuls membres des communautés et résidents du parc (art. 22) ; ces droits portent sur le cœur du parc et leurs modalités relèvent de la charte (art. 2).", source: "https://aida.ineris.fr/reglementation/decret-ndeg-2007-266-270207-creant-parc-national-denomme-parc-amazonien-guyane"}
