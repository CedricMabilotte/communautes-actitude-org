resume: >-
  Le Parc amazonien de Guyane, parc national créé par le décret n° 2007-266 du 27 février 2007, couvre le sud de la Guyane. La loi n° 2006-436 du 14 avril 2006 (code de l'environnement, art. L. 331-15-3) et le décret reconnaissent aux « communautés d'habitants » de Camopi, Maripasoula et Papaïchton « qui tirent traditionnellement leurs moyens de subsistance de la forêt » des droits d'usage collectifs dans le cœur du parc : chasse, pêche, agriculture itinérante sur brûlis, prélèvements pour l'habitat et l'artisanat, troc et vente du surplus de chasse et de pêche entre membres et résidents du parc. Cinq représentants des autorités coutumières, désignés par le Gran Man (chef coutumier supérieur) ou, à défaut, par l'assemblée des capitaines et chefs de famille, siègent au conseil d'administration du parc. Ce régime est distinct des zones de droits d'usage collectifs du code forestier.
