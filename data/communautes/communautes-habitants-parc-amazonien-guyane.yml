  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Cinq représentants des autorités coutumières, désignés par le Gran Man concerné ou, à défaut, par l'assemblée des capitaines et chefs de famille, siègent au conseil d'administration de l'établissement public du parc, avec le président du Grand conseil coutumier des populations amérindiennes et bushinengé depuis le décret n° 2020-752 (décret de 2007, art. 27 et 28) ; le comité de vie locale peut déléguer à certains membres la compétence pour rendre des avis sur les bourgs et hameaux (art. 29) ; cette représentation se limite à l'établissement du parc.", source: "https://aida.ineris.fr/reglementation/decret-ndeg-2007-266-270207-creant-parc-national-denomme-parc-amazonien-guyane"}
