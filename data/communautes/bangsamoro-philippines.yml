resume: >-
  Les Bangsamoro sont, selon la loi organique de 2018, les descendants des habitants d'origine de Mindanao et de l'archipel de Sulu à l'arrivée des Espagnols. La loi organique bangsamoro (Republic Act No. 11054, 2018) crée une région autonome à régime parlementaire, qui remplace la Région autonome en Mindanao musulman créée en 1989. Une autorité de transition gouverne la région depuis 2019 ; le premier Parlement élu, issu du scrutin du 14 septembre 2026, doit siéger à partir du 30 octobre 2026. La province de Sulu est exclue de la région par une décision de la Cour suprême du 9 septembre 2024, confirmée le 26 novembre 2024. Les peuples autochtones non moro de la région font l'objet de la fiche « Peuples autochtones non moro du Bangsamoro ».
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, observations finales sur le cinquième rapport des Philippines (CCPR/C/PHL/CO/5), § 11-12 : justice transitionnelle et réconciliation pour la région autonome bangsamoro", annee: 2022, source: "https://docs.un.org/fr/CCPR/C/PHL/CO/5"}
base_nationale:
  - {instrument: "Constitution de 1987, article X, sections 15 à 21 (régions autonomes en Mindanao musulman et dans les Cordillères)", nature: "constitution", annee: 1987, source: "https://lawphil.net/consti/cons1987.html"}
  - {instrument: "Republic Act No. 11054, loi organique de la Région autonome bangsamoro en Mindanao musulman", nature: "loi_organique", annee: 2018, source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  - {instrument: "Cour suprême, Province of Sulu v. Medialdea, G.R. No. 242255 (arrêt du 9 septembre 2024 ; résolution du 26 novembre 2024) : validité de la loi organique, exclusion de Sulu", nature: "jurisprudence", annee: 2024, source: "https://lawphil.net/judjuris/juri2024/nov2024/gr_242255_2024.html"}
  - {instrument: "Republic Act No. 12317 : premières élections régulières fixées au deuxième lundi de septembre 2026", nature: "loi", annee: 2026, source: "https://lawphil.net/statutes/repacts/ra2026/ra_12317_2026.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement de 80 membres qui élit un Chief Minister (ministre en chef) à la tête du cabinet, loi organique de 2018, art. VII, sections 2 à 4 et 6 ; premières élections le 14 septembre 2026 (Republic Act No. 12317, 2026), après une période de transition.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Parlement adopte des lois dans les domaines attribués par l'art. V, section 2, loi organique de 2018, art. VII, section 3 ; le président de la République garde un pouvoir de supervision générale (Constitution de 1987, art. X, section 16) ; la Constitution soumet les pouvoirs législatifs des régions autonomes « aux dispositions de la présente Constitution et aux lois nationales » (art. X, section 20), et la loi organique attribue les compétences régionales sous réserve de cette section (art. V, section 2) : la loi nationale prime, d'où « partiel ».", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  justice_propre: {valeur: "partiel", note: "Tribunaux de la Shari'ah (droit musulman), qui font partie du système judiciaire philippin sous la supervision de la Cour suprême, et pouvoir du Parlement de légiférer sur la Shari'ah, loi organique de 2018, art. X, sections 2 et 4 ; la Cour suprême nomme le personnel de ces tribunaux, section 14 ; reconnaissance des systèmes de justice coutumiers des peuples autochtones non moros et création d'un Office for Tribal Justice System (bureau de la justice coutumière), sections 17 et 18. Juridictions intégrées à l'ordre judiciaire national, d'où « partiel ».", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  terres: {valeur: "partiel", note: "Compétence régionale sur le domaine ancestral (terres traditionnelles) et les ressources naturelles, dans le cadre de la Constitution, loi organique de 2018, art. V, section 2 (d) ; Constitution de 1987, art. X, section 20.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  ressources: {valeur: "partiel", note: "Les recettes tirées des ressources naturelles reviennent au gouvernement bangsamoro, sauf l'uranium et les combustibles fossiles, qui peuvent être cogérés avec l'État et dont les recettes sont partagées à parts égales, loi organique de 2018, art. XII, section 34 (imprimée « 24 » sur Lawphil), et art. XIII, sections 8 et 10.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Système éducatif régional intégré, sous-système du système national soumis aux normes minimales nationales, et système des madaris (écoles islamiques), loi organique de 2018, art. IX, sections 16 et 18.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  fiscalite: {valeur: "reconnu", note: "Autonomie fiscale, pouvoir de lever des impôts, block grant (dotation globale annuelle) inscrite d'office au budget national et part de 75 % des impôts nationaux perçus dans la région (100 % pendant les dix premières années), loi organique de 2018, art. XII, sections 1, 6, 10, 15 et 17.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Droit des descendants des habitants d'origine de Mindanao et de Sulu de s'identifier comme Bangsamoro, loi organique de 2018, art. II, section 1 ; compétence des tribunaux de la Shari'ah en matière de statut personnel entre musulmans, art. X, sections 5 et 6.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'International Crisis Group (rapport n° 355, mars 2026) relève les reports successifs des premières élections parlementaires, le remplacement par le président de la République, le 9 mars 2025, du ministre en chef issu du MILF (Front moro islamique de libération) par un gouverneur nommé, la sortie de Sulu et le blocage de la dernière phase du désarmement des anciens combattants (environ 14 000). Les premières élections parlementaires ont eu lieu le 14 septembre 2026 ; les élus doivent prendre leurs fonctions et élire le ministre en chef le 30 octobre 2026 (SunStar, 18 septembre 2026).", source: "https://www.crisisgroup.org/rpt/asia-pacific/philippines/355-peace-philippines-bangsamoros-moment-truth"}
chronologie:
  - {annee: 1987, evenement: "La Constitution prévoit une région autonome en Mindanao musulman (art. X)."}
  - {annee: 2018, evenement: "Adoption de la loi organique bangsamoro (Republic Act No. 11054)."}
  - {annee: 2019, evenement: "Ratification par plébiscite et installation de l'Autorité de transition bangsamoro."}
  - {annee: 2024, evenement: "La Cour suprême confirme la validité de la loi organique et exclut la province de Sulu, qui l'avait rejetée au plébiscite (arrêt du 9 septembre, confirmé le 26 novembre, G.R. No. 242255)."}
  - {annee: 2025, evenement: "Le président de la République remplace le ministre en chef par intérim (9 mars) ; la Cour suprême suspend puis invalide la loi de découpage des circonscriptions, et les élections prévues en octobre sont reportées."}
  - {annee: 2026, evenement: "Republic Act No. 12317 (25 mars) : premières élections fixées au deuxième lundi de septembre 2026 ; scrutin du 14 septembre et proclamation des 80 élus le 16 septembre."}
