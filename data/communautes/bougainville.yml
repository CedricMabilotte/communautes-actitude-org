  - {instrument: "Constitution de Papouasie-Nouvelle-Guinée, partie XIV « Bougainville Government and Bougainville Referendum »", nature: "constitution", annee: null, source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "« Un système de gouvernement autonome pour Bougainville » (Constitution de PNG, art. 279) ; la Constitution de Bougainville prévoit une législature principalement élue (art. 282).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Constitution de Bougainville est la loi suprême dans les matières de compétence du gouvernement autonome (art. 286) ; liste des compétences transférables à l'art. 290.", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  justice_propre: {valeur: "partiel", note: "Le gouvernement autonome est responsable de l'administration de la justice, y compris le règlement des différends (art. 290) ; la Constitution de Bougainville peut créer des tribunaux arbitraux ou de conciliation hors du système judiciaire national (art. 307).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  terres: {valeur: "partiel", note: "« Terres et ressources naturelles » figurent parmi les compétences ouvertes au gouvernement autonome (art. 290), transférées selon une procédure progressive (art. 294 et 297).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  ressources: {valeur: "partiel", note: "Mines, pétrole et gaz, forêts, pêche (hors stocks de poissons grands migrateurs) et ressources en eau figurent parmi les compétences ouvertes au gouvernement autonome (art. 290).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'éducation figure parmi les compétences ouvertes au gouvernement autonome (art. 290).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
