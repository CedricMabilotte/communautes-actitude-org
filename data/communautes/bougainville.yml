resume: >-
  Région insulaire de Papouasie-Nouvelle-Guinée, autonome depuis 2004 ; le gouvernement autonome est élu pour la première fois en 2005. L'accord de paix de Bougainville, signé à Arawa le 30 août 2001 au terme de la crise de Bougainville, est mis en œuvre par la partie XIV de la Constitution nationale, qui prévoit un gouvernement autonome et un référendum sur le statut politique futur. Le référendum de 2019 donne 97,7 % des voix à l'indépendance. Le résultat est déposé au Parlement national le 27 août 2026 ; sa ratification requiert les trois quarts des députés et la date du vote n'est pas fixée.
reconnaissance_onu:
  - {mecanisme: "mission_onu", detail: "Bureau politique des Nations Unies à Bougainville puis Mission d'observation des Nations Unies à Bougainville (MONUB), dont le travail est salué par le Conseil de sécurité en 2005 ; la Constitution de PNG (art. 279) subordonne les élections du gouvernement autonome à la certification, par le directeur de cette mission, de l'élimination des armes", annee: 2005, source: "https://documents.un.org/api/symbol/access?s=S/PRST/2005/23&l=fr&t=pdf"}
  - {mecanisme: "accord_sous_egide", detail: "Déclaration du Président du Conseil de sécurité saluant les premières élections du gouvernement autonome et l'application de l'accord de paix", annee: 2005, source: "https://documents.un.org/api/symbol/access?s=S/PRST/2005/23&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Accord de paix de Bougainville, Arawa, 30 août 2001, publié au National Gazette n° G 146 du 16 novembre 2001 (Constitution de PNG, art. 278)", nature: "accord_paix", annee: 2001, source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  - {instrument: "Constitution de Papouasie-Nouvelle-Guinée, partie XIV « Bougainville Government and Bougainville Referendum »", nature: "constitution", annee: null, source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "« Un système de gouvernement autonome pour Bougainville » (Constitution de PNG, art. 279) ; la Constitution de Bougainville prévoit une législature principalement élue (art. 282).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Constitution de Bougainville est la loi suprême dans les matières de compétence du gouvernement autonome (art. 286) ; liste des compétences transférables à l'art. 290.", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  justice_propre: {valeur: "partiel", note: "Le gouvernement autonome est responsable de l'administration de la justice, y compris le règlement des différends (art. 290) ; la Constitution de Bougainville peut créer des tribunaux sous le droit de Bougainville, y compris des juridictions de niveau village hors du système judiciaire national (art. 306), et des tribunaux arbitraux ou de conciliation (art. 307).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  terres: {valeur: "partiel", note: "« Terres et ressources naturelles » figurent parmi les compétences ouvertes au gouvernement autonome (art. 290), transférées selon une procédure progressive (art. 294 et 297).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  ressources: {valeur: "partiel", note: "Mines, pétrole et gaz, forêts, pêche (hors stocks de poissons grands migrateurs) et ressources en eau figurent parmi les compétences ouvertes au gouvernement autonome (art. 290).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'éducation figure parmi les compétences ouvertes au gouvernement autonome (art. 290).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  fiscalite: {valeur: "partiel", note: "Pouvoir de fixer le taux de l'impôt sur le revenu des personnes et d'établir un régime fiscal propre hors droits de douane, impôt sur les sociétés et TVA, selon une loi organique (art. 325) ; subventions garanties de l'État national (art. 326) ; objectif d'autonomie financière (art. 324).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "partiel", note: "Référendum sur le statut politique futur incluant le choix de l'indépendance (art. 338 et 339), tenu en 2019 ; le résultat est soumis au Parlement national, qui a le dernier mot (art. 342). En juin 2026, un règlement de session (sessional order, règle de procédure temporaire) fixe le seuil de ratification aux trois quarts des députés.", source: "https://www.rnz.co.nz/news/pacific/597798/png-sets-high-threshold-for-ratifying-bougainville-independence-vote"}
effectivite: {valeur: "partielle", note: "Le transfert des compétences prévues par la Constitution est resté incomplet : début 2021, 11 des 59 compétences transférables l'étaient selon les dirigeants du gouvernement autonome (ANU Press, 2022). Le 27 août 2026, le ministre des Affaires de Bougainville cite encore l'achèvement de ce transfert comme première étape ; le résultat du référendum, déposé au Parlement ce jour-là, n'a pas été soumis au vote.", source: "https://press-files.anu.edu.au/downloads/press/n10584/pdf/book.pdf"}
chronologie:
  - {annee: 2001, evenement: "Accord de paix de Bougainville signé à Arawa (30 août)."}
  - {annee: 2004, evenement: "Bougainville devient une région autonome."}
  - {annee: 2005, evenement: "Premières élections du gouvernement autonome (20 mai - 9 juin), qui entre en fonctions."}
  - {annee: 2019, evenement: "Référendum : 97,7 % des votants choisissent l'indépendance."}
  - {annee: 2021, evenement: "Accord Sharp entre les deux gouvernements pour accélérer le transfert des compétences (mai)."}
  - {annee: 2025, evenement: "Élections générales de la région (septembre) : Ishmael Toroama réélu président."}
  - {annee: 2026, evenement: "Le Parlement national adopte un règlement de session fixant le seuil de ratification aux trois quarts des députés (juin)."}
  - {annee: 2026, evenement: "Dépôt du résultat au Parlement national (27 août), avec le rapport de consultation conjoint et le « cadre mélanésien » ; réunion des deux gouvernements annoncée pour octobre afin de fixer la date du vote."}
