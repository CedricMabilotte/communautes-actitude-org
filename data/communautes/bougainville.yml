resume: >-
  Région insulaire de Papouasie-Nouvelle-Guinée, autonome depuis 2004. L'accord de paix de Bougainville, signé à Arawa le 30 août 2001 au terme de la crise de Bougainville, est mis en œuvre par la partie XIV de la Constitution nationale, qui prévoit un gouvernement autonome et un référendum sur le statut politique futur. Le référendum de 2019 donne 97,7 % des voix à l'indépendance. Le résultat est déposé au Parlement national le 27 août 2026, qui n'a pas encore voté sa ratification.
reconnaissance_onu:
  - {mecanisme: "mission_onu", detail: "Bureau politique des Nations Unies à Bougainville puis Mission d'observation des Nations Unies à Bougainville (MONUB), chargée notamment de vérifier l'élimination des armes (Constitution de PNG, art. 279)", annee: 2005, source: "https://documents.un.org/api/symbol/access?s=S/PRST/2005/23&l=fr&t=pdf"}
  - {mecanisme: "accord_sous_egide", detail: "Déclaration du Président du Conseil de sécurité saluant les premières élections du gouvernement autonome et l'application de l'accord de paix", annee: 2005, source: "https://documents.un.org/api/symbol/access?s=S/PRST/2005/23&l=fr&t=pdf"}
