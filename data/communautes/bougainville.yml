  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "partiel", note: "Référendum sur le statut politique futur incluant le choix de l'indépendance (art. 338 et 339), tenu en 2019 ; le résultat est soumis au Parlement national, qui a le dernier mot (art. 342).", source: "https://www.constituteproject.org/constitution/Papua_New_Guinea_2016?lang=en"}
effectivite: {valeur: "partielle", note: "Le résultat du référendum de 2019 (97,7 % pour l'indépendance) est déposé au Parlement national le 27 août 2026 ; le gouvernement annonce une réunion en octobre 2026 pour fixer la date du vote de ratification.", source: "https://www.rnz.co.nz/news/pacific/1157863/png-parliament-decision-on-bougainville-still-months-off-at-least"}
