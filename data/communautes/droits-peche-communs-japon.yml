resume: >-
  Fiche agrégée : elle couvre les communautés de pêcheurs côtiers organisées en coopératives de pêche (gyogyō kyōdō kumiai) titulaires d'un droit de pêche commun (kyōdō gyogyōken), c'est-à-dire le droit d'exploiter en commun une zone délimitée : coquillages, algues, espèces sédentaires, petits filets fixes, sennes de plage. La loi sur la pêche de 1949, réformée en 2018, classe ce droit parmi les « droits de pêche de groupe » (art. 60) que le gouverneur de la préfecture n'accorde qu'à la coopérative de pêche du « district concerné », c'est-à-dire le territoire auquel la zone de pêche est rattachée selon des critères naturels et socio-économiques (art. 62), lorsque ses membres représentent au moins les deux tiers des ménages de pêcheurs côtiers résidents qui pêchent au moins 90 jours par an (art. 72). Le droit dure dix ans (art. 75) et est assimilé à un droit réel (art. 77). La coopérative adopte un règlement d'exercice qui fixe qui peut pêcher, où, quand et avec quels engins (art. 106). Lors du renouvellement général de 2023, 4 790 droits de pêche communs ont été accordés.
