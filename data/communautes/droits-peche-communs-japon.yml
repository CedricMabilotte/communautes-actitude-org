base_nationale:
  - {instrument: "Loi sur la pêche (loi n° 267 de 1949), art. 60 (définitions), 72 (aptitude), 73 (attribution), 75 (durée), 77 (droit réel), 93 (révocation pour motif d'intérêt public), 105 à 108 (droits d'exercice des membres et règlement d'exercice), 138 (commissions de coordination des pêches)", nature: "loi", annee: 1949, source: "https://hourei.net/law/324AC0000000267"}
  - {instrument: "Loi portant réforme de la loi sur la pêche (loi n° 95 du 14 décembre 2018)", nature: "loi", annee: 2018, source: "https://hourei.net/law/324AC0000000267"}
  - {instrument: "Loi sur les coopératives de la pêche (loi n° 242 de 1948), art. 11 (gestion des ressources halieutiques), 18 (conditions d'adhésion), 21 (une voix par membre), 48 et 50 (décisions de l'assemblée générale sur les droits de pêche et les règlements d'exercice)", nature: "loi", annee: 1948, source: "https://hourei.net/law/323AC0000000242"}
droits:
  autogouvernement: {valeur: "partiel", note: "La coopérative de pêche, dont les membres sont les pêcheurs résidant dans son district qui pêchent ou travaillent à la pêche au-delà d'un nombre de jours par an fixé par les statuts entre 90 et 120 (art. 18 de la loi de 1948), décide en assemblée générale, à raison d'une voix par membre (art. 21), de l'acquisition, de la perte ou de la modification des droits de pêche, à la majorité des deux tiers (art. 48 et 50). Elle reste sous la tutelle de la préfecture, qui accorde et peut révoquer le droit (art. 73 et 93 de la loi sur la pêche).", source: "https://hourei.net/law/323AC0000000242"}
  pouvoir_normatif: {valeur: "partiel", note: "La coopérative adopte pour chaque droit un règlement d'exercice (gyogyōken kōshi kisoku) qui fixe la qualité des membres autorisés à pêcher, les zones, les périodes, les méthodes et les redevances (art. 106 de la loi sur la pêche). Pour les droits de premier type (algues, coquillages), il faut, avant le vote de l'assemblée, l'accord écrit des deux tiers des membres résidant dans le district qui pratiquent cette pêche ; le règlement n'entre en vigueur qu'après approbation du gouverneur, qui le refuse s'il est « injustement discriminatoire », et il ne s'applique qu'aux membres (art. 106, al. 4, 7, 8 et 10).", source: "https://hourei.net/law/324AC0000000267"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le droit porte sur une zone de pêche délimitée dans le plan de pêche de la préfecture, rattachée à un « district concerné » (art. 62). Il est assimilé à un droit réel soumis aux règles applicables aux biens fonciers (art. 77), pour dix ans renouvelables (art. 75), sans propriété de l'eau ni du fond.", source: "https://hourei.net/law/324AC0000000267"}
  ressources: {valeur: "partiel", note: "Le droit de pêche commun est le droit exclusif d'exercer en commun, dans une zone donnée, la pêche des algues, coquillages et espèces sédentaires ou certaines pêches aux filets fixes et sennes (art. 60 de la loi sur la pêche) ; les membres l'exercent selon le règlement d'exercice (art. 105). Le droit est accordé par le gouverneur de la préfecture pour dix ans renouvelables (art. 75) ; le gouverneur peut le modifier, le révoquer ou en suspendre l'exercice pour la coordination des pêches, la navigation, la pose de câbles sous-marins ou un autre motif d'intérêt public (art. 93).", source: "https://hourei.net/law/324AC0000000267"}
  consentement: {valeur: "partiel", note: "La perte ou la modification d'un droit de pêche exige une décision de l'assemblée générale à la majorité des deux tiers (art. 50 de la loi de 1948) ; pour les droits de premier type, la division, la modification ou l'abandon exigent en plus l'accord écrit des deux tiers des membres résidents qui pratiquent cette pêche (art. 108 de la loi sur la pêche, renvoyant à l'art. 106, al. 4). Le gouverneur peut toutefois modifier ou révoquer le droit pour la navigation, la pose de câbles sous-marins ou un autre motif d'intérêt public (art. 93).", source: "https://hourei.net/law/324AC0000000267"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Lorsque la coopérative prélève une somme sur les membres qui exercent le droit de pêche, le règlement d'exercice qu'elle adopte en fixe le montant (art. 106, al. 3, 3° de la loi sur la pêche) ; ce règlement n'entre en vigueur qu'après approbation du gouverneur (art. 106) ; aucun pouvoir fiscal ni budget public garanti n'est prévu.", source: "https://hourei.net/law/324AC0000000267"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Lors du renouvellement général engagé en septembre 2023, 4 790 droits de pêche communs ont été accordés, dont 4 749 de contenu semblable aux droits échus et 41 nouveaux ; 148 droits n'ont pas été renouvelés, dont 59 parce que la zone n'était pas utilisée de façon « appropriée et effective » (Agence des pêches). En novembre 2003, le ministère recensait 1 608 régimes de cogestion des pêches côtières, les « organisations de gestion des pêches » (groupes de pêcheurs qui gèrent une ressource selon des règles écrites), dont près de 95 % sont rattachés à une coopérative (Uchida et Makino, FAO). Une étude de T. Murota relève un affaiblissement lié aux fusions de coopératives et à l'abandon de droits contre indemnités pour des projets industriels, dont des centrales nucléaires.", source: "https://www.fao.org/4/a1497e/a1497e20.pdf"}
chronologie:
  - {annee: 1901, evenement: "Première loi sur la pêche ; la loi de 1910 consacre des droits de pêche exclusifs attribués aux associations de pêche locales."}
  - {annee: 1948, evenement: "Loi sur les coopératives de la pêche."}
  - {annee: 1949, evenement: "Loi sur la pêche : droits de pêche communs assimilés à des droits réels et attribués aux coopératives locales."}
  - {annee: 2003, evenement: "1 608 régimes de cogestion des pêches côtières (organisations de gestion des pêches) recensés en novembre."}
  - {annee: 2018, evenement: "Réforme de la loi sur la pêche (loi n° 95 du 14 décembre) : fin de l'ordre de priorité légal fixé pour les droits de pêche fixe et d'aquaculture ; les droits de pêche communs restent réservés aux coopératives locales ; priorité au titulaire qui utilise la zone de façon « appropriée et effective » (art. 73)."}
  - {annee: 2020, evenement: "Entrée en vigueur de la loi sur la pêche réformée (1er décembre)."}
  - {annee: 2023, evenement: "Renouvellement général des droits de pêche : 4 790 droits de pêche communs accordés."}
fiabilite:
  verifie: ["Texte des art. 60, 62, 72, 73, 75, 77, 93, 105 à 108 et 138 de la loi sur la pêche dans la version intégrant la réforme de 2018 (hourei.net, reprise de la base e-Gov ; e-Gov inaccessible le 1er octobre 2026).", "Art. 11, 18, 21, 48 et 50 de la loi sur les coopératives de la pêche (hourei.net).", "Effet de la réforme de 2018 : selon l'Agence des pêches, les droits de pêche communs restent attribués à la coopérative locale avant et après la réforme ; l'ordre de priorité légal supprimé concernait les droits de pêche fixe et d'aquaculture.", "4 790 droits de pêche communs, dont 4 749 de contenu semblable aux droits échus et 41 nouveaux, et 148 droits antérieurs non renouvelés (Agence des pêches, résultats du renouvellement de 2023).", "1 608 organisations de gestion des pêches en novembre 2003 (Uchida et Makino, FAO).", "Entrée en vigueur de la loi réformée le 1er décembre 2020 (page « Les droits de pêche » de l'Agence des pêches)."]
  non_confirme: ["Modifications de la loi sur la pêche postérieures à la version reprise par hourei.net : non vérifiées.", "Surface des zones de droits de pêche communs : non trouvée.", "Les préfectures publient la liste de leurs droits de pêche communs (fichiers par préfecture, page de l'Agence des pêches) ; la liste nationale n'a pas été compilée : pas de tableau.", "Aucun document de la CDB ou d'un autre mécanisme de l'ONU visant ce régime n'a été trouvé ; l'étude de la FAO ne relève pas des mécanismes du cadre.", "Population : le chiffre compte les membres titulaires des coopératives de pêche côtières, non les habitants des localités de pêche ; les membres des coopératives agréées par le ministre n'ont pas été trouvés."]
