effectivite: {valeur: "partielle", note: "La Rapporteuse spéciale (2016) relève que l'État ne s'est acquitté que de 4 995,74 ha sur les 14 700 ha promis aux Maya Chortí en 1997, que des communautés lenca et tolupán titrées font face à des ventes illégales et à des revendications de tiers, et que des demandes de titres pech et d'extension de titres tolupán, tawahka et pech restent en attente.", source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
chronologie:
  - {annee: 1836, evenement: "Des lois accordent des titres de propriété à 21 des 28 groupes tolupán, selon Minority Rights Group."}
  - {annee: 1864, evenement: "Titre de la communauté tolupán de San Francisco de Locomapa (Yoro)."}
  - {annee: 1982, evenement: "La Constitution (art. 346) charge l'État de protéger les terres et forêts des communautés autochtones."}
  - {annee: 1992, evenement: "Loi de modernisation agricole (décret 31-92, art. 65) : titres en pleine propriété aux communautés autochtones qui prouvent leur occupation. La même année, selon Minority Rights Group, 20 groupes tolupán ont un titre et 6 une garantie de possession ancestrale."}
  - {annee: 1993, evenement: "Premiers titres du relevé de l'Institut national agraire (1993-2015) : 23 titres lenca et un titre tolupán."}
  - {annee: 1994, evenement: "Création de San Francisco de Opalaca, première municipalité autochtone (lenca), avec titres sur ses terres."}
  - {annee: 1995, evenement: "Le Honduras ratifie la Convention 169 de l'OIT."}
  - {annee: 1997, evenement: "Accord exécutif : l'État s'engage à acquérir 14 700 ha au nom des communautés maya chortí ; quatre titres tawahka (5 138 ha)."}
  - {annee: 1999, evenement: "Décret 157-99 : réserve de biosphère Tawahka Asangni, gérée par l'État, les municipalités et les Tawahka."}
  - {annee: 2004, evenement: "Loi sur la propriété (décret 82-2004) : titrage collectif des terres autochtones et afrohonduriennes."}
  - {annee: 2007, evenement: "Loi forestière (décret 98-2007, art. 45)."}
  - {annee: 2013, evenement: "Titres des communautés pech de Culuco et Jocomico, délivrés par l'Institut de conservation forestière dans la réserve de biosphère du Río Plátano (décret 61-2013)."}
  - {annee: 2015, evenement: "Visite de la Rapporteuse spéciale des Nations unies sur les droits des peuples autochtones."}
