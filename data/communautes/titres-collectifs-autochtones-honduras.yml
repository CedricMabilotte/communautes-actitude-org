reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Honduras partie à la Convention 169 de l'OIT depuis 1995 (A/HRC/33/42/Add.2, § 9).", annee: 1995, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {mecanisme: "dnudpa", detail: "Le Honduras a voté en faveur de la Déclaration de 2007 ; le recensement de 2001 compte les Lenca, Maya Chortí, Tolupán, Pech et Tawahka parmi les peuples autochtones du pays (A/HRC/33/42/Add.2, § 6 et 9).", annee: 2007, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de la Rapporteuse spéciale sur sa visite au Honduras (novembre 2015) : titres tolupán et pech du XIXe siècle, 505 titres délivrés de 1993 à 2015, engagement de 1997 envers les Maya Chortí, réserve de biosphère Tawahka Asangni (§ 35, 36, 38 et 39).", annee: 2016, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
base_nationale:
  - {instrument: "Constitution de 1982, art. 346 (protection des terres et forêts des communautés autochtones)", nature: "constitution", annee: 1982, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {instrument: "Loi de modernisation et de développement du secteur agricole (décret 31-92), art. 65 (titre en pleine propriété aux communautés qui prouvent leur occupation)", nature: "loi", annee: 1992, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {instrument: "Décret 157-99 portant création de la réserve de biosphère Tawahka Asangni", nature: "loi", annee: 1999, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  - {instrument: "Loi sur la propriété (Ley de Propiedad, décret 82-2004), titre V, chapitre III, art. 93 à 102", nature: "loi", annee: 2004, source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  - {instrument: "Loi sur les forêts, les aires protégées et la faune (décret 98-2007), art. 45", nature: "loi", annee: 2007, source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
