resume: >-
  Fiche agrégée : elle couvre les titres de propriété collective délivrés aux communautés des peuples lenca, maya chortí, tolupán, pech et tawahka. Les titres miskitu, délivrés à des conseils territoriaux, et les titres garífunas ont leur propre fiche. Des communautés tolupán et pech détiennent des titres depuis le milieu du XIXe siècle ; de 1993 à 2015, l'Institut national agraire et, pour deux titres pech, l'Institut de conservation forestière ont délivré 440 titres à ces cinq peuples, le plus souvent à l'échelle d'une communauté et sur des surfaces de quelques centaines d'hectares. Depuis 2004, la loi sur la propriété (décret 82-2004) prévoit le titrage collectif de ces terres et les rend inaliénables.
