  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi sur la propriété de 2004 reconnaît les terres possédées traditionnellement par les peuples autochtones et afrohonduriens (art. 93), les titre au nom de la collectivité (art. 94), les déclare inaliénables, insaisissables et imprescriptibles (art. 100) et interdit d'enregistrer un titre au profit de tiers (art. 102) ; l'art. 97 laisse toutefois aux tiers titrés qui occupent ces terres le droit de les garder, et l'art. 100 permet aux communautés de mettre fin au régime communal ou d'affermer à des tiers.", source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
  ressources: {valeur: "partiel", note: "La loi forestière de 2007 (décret 98-2007, art. 45) reconnaît le droit des peuples autochtones et afrohonduriens sur les aires forestières de leurs terres traditionnelles (A/HRC/33/42/Add.2, § 10) ; la loi sur la propriété de 2004 (art. 101) impose une gestion conjointe avec l'État des aires protégées situées sur ces terres ; la réserve de biosphère Tawahka Asangni (décret 157-99) est gérée par l'État, les municipalités et les Tawahka (même rapport, § 36).", source: "https://undocs.org/fr/A/HRC/33/42/Add.2"}
  consentement: {valeur: "partiel", note: "L'État doit informer et consulter ces peuples avant d'autoriser toute inspection ou exploitation de ressources sur leurs terres, et leur verser une indemnisation équitable pour les dommages subis (loi sur la propriété de 2004, art. 95) ; le texte ne prévoit pas de consentement.", source: "https://honduras.eregulations.org/media/Ley_de_la_Propiedad.pdf"}
