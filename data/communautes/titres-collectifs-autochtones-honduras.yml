nom: "Titres communautaires autochtones du Honduras"
endonyme: ""
territoire: "Terres communautaires titrées des peuples lenca (ouest), maya chortí (Copán, Ocotepeque), tolupán (Yoro, Francisco Morazán), pech (Colón, Olancho, Gracias a Dios) et tawahka (Olancho, Colón, Gracias a Dios)"
