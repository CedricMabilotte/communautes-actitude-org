resume: >-
  La loi 10 de 1997 crée la comarca (division territoriale autochtone à statut spécial) Ngäbe-Buglé sur des terres des provinces de Bocas del Toro, Chiriquí et Veraguas. Les terres y sont propriété collective et le Congrès général est reconnu comme organe de décision. La loi 11 de 2012 y interdit les concessions minières et soumet les projets hydroélectriques à l'accord des congrès et à un référendum. Le recensement de 2023 compte 444 878 personnes du peuple ngäbe dans l'ensemble du pays ; les sources consultées ne donnent pas la population de la comarca.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Panama vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Visite du Rapporteur spécial James Anaya ; il signale des irrégularités présumées dans l'autorisation de projets d'investissement en territoire indigène.", annee: 2013, source: "https://www.ohchr.org/es/press-releases/2013/07/experto-de-la-onu-urge-panama-no-dar-marcha-atras-en-los-derechos-de-los"}
base_nationale:
