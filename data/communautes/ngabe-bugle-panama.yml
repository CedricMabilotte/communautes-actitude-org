resume: >-
  La loi 10 de 1997 crée la comarca (division territoriale autochtone à statut spécial) Ngäbe-Buglé sur des terres des provinces de Bocas del Toro, Chiriquí et Veraguas. Les terres y sont propriété collective et le Congrès général est reconnu comme organe de décision. La loi 11 de 2012 y interdit les concessions minières et soumet les projets hydroélectriques à l'accord des congrès et à un référendum. Le recensement de 2023 compte 212 084 habitants dans la comarca, et 444 878 Ngäbe et 23 898 Buglé dans l'ensemble du pays.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Panama vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
  - {mecanisme: "rapporteur_special", detail: "Visite du Rapporteur spécial James Anaya ; il fait état d'informations sur des irrégularités présumées dans la négociation et l'autorisation de projets hydroélectriques et sur la répartition de leurs bénéfices ; il rencontre des représentants autochtones dans la comarca Ngäbe-Buglé.", annee: 2013, source: "https://www.ohchr.org/es/press-releases/2013/07/experto-de-la-onu-urge-panama-no-dar-marcha-atras-en-los-derechos-de-los"}
base_nationale:
  - {instrument: "Constitution politique du Panama (1972, révisée en 2004), art. 127 et 147", nature: "constitution", annee: 1972, source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  - {instrument: "Loi 10 du 7 mars 1997 qui crée la comarca Ngäbe-Buglé", nature: "loi", annee: 1997, source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  - {instrument: "Loi 11 du 26 mars 2012, régime spécial de protection des ressources minérales, hydriques et environnementales de la comarca", nature: "loi", annee: 2012, source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2010/2012/LEY/Administrador%20Legispan_27001_2012_3_26_ASAMBLEA%20NACIONAL_11.pdf"}
  - {instrument: "Loi 88 du 22 novembre 2010 qui reconnaît les langues et alphabets des peuples autochtones et régit l'éducation interculturelle bilingue", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  - {instrument: "Loi 37 de 2016 sur la consultation et le consentement préalable, libre et éclairé", nature: "loi", annee: 2016, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 10 de 1997 (art. 17) reconnaît le Congrès général comme organe suprême d'expression et de décision ethnique et culturelle du peuple ngäbe-buglé, ainsi que les congrès locaux ; l'article 18 renvoie à la Charte organique (règlement intérieur de la comarca) l'organisation des congrès généraux, régionaux et locaux et l'élection de leurs dirigeants.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 10 de 1997 (art. 18) prévoit des décisions et résolutions des congrès, qui doivent se conformer à la Constitution et aux lois nationales et peuvent être contestées par les tiers lésés.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi 10 de 1997 (art. 9) fait des terres de la comarca une propriété collective et interdit leur appropriation privée et leur aliénation (cession).", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  ressources: {valeur: "partiel", note: "La loi 11 de 2012 (art. 2 à 5) reconnaît le droit de la comarca à l'usage traditionnel des ressources renouvelables, interdit les concessions minières, annule celles déjà accordées et interdit l'appropriation privée des sources d'eau ; l'Autorité nationale de l'environnement garde la coordination (art. 10).", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2010/2012/LEY/Administrador%20Legispan_27001_2012_3_26_ASAMBLEA%20NACIONAL_11.pdf"}
  consentement: {valeur: "partiel", note: "La loi 11 de 2012 (art. 6) soumet les futurs projets hydroélectriques à l'approbation du congrès compétent puis à un référendum ; la loi 37 de 2016 rend obligatoire la consultation des peuples des comarcas avant toute mesure législative ou administrative qui les concerne (texte connu par un résumé de la Bibliothèque du Congrès national du Chili).", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2010/2012/LEY/Administrador%20Legispan_27001_2012_3_26_ASAMBLEA%20NACIONAL_11.pdf"}
  langue: {valeur: "partiel", note: "La loi 10 de 1997 (art. 53) et la loi 88 de 2010 (art. 1) reconnaissent les langues ngäbe et buglé, sans statut de langue officielle ; la loi 88 (art. 4) prévoit leur enseignement parallèlement à l'espagnol dans les comarcas.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 10 de 1997 (art. 54) prévoit une éducation bilingue interculturelle conduite par le ministère de l'Éducation en coordination avec les autorités de la comarca.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  fiscalite: {valeur: "partiel", note: "La loi 10 de 1997 (art. 42) oblige l'État à inscrire chaque année au budget national des crédits pour la comarca, exécutés par les institutions de l'État avec les congrès.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  representation: {valeur: "partiel", note: "La Constitution (art. 147) garantit à chaque comarca le nombre de députés dont elle disposait à l'entrée en vigueur de la règle ; ces sièges sont territoriaux.", source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Selon Minority Rights Group, le barrage de Barro Blanco a été approuvé sans le consentement libre, préalable et éclairé des communautés touchées ; des membres du Congrès général ont rejeté son achèvement en septembre 2016, puis la Cour suprême a statué en faveur du projet. Front Line Defenders signale en mai 2025 des interventions du Service national des frontières (Senafront) dans la comarca pendant les protestations contre la loi 462.", source: "https://minorityrights.org/country/panama/"}
chronologie:
  - {annee: 1997, evenement: "La loi 10 crée la comarca Ngäbe-Buglé."}
  - {annee: 2012, evenement: "La loi 11 interdit les concessions minières dans la comarca et abroge l'article 48 de la loi 10."}
  - {annee: 2016, evenement: "La loi 37 établit la consultation et le consentement préalable, libre et éclairé ; des membres du Congrès général rejettent l'achèvement du barrage de Barro Blanco, puis la Cour suprême statue en faveur du projet."}
  - {annee: 2022, evenement: "Élection des autorités traditionnelles de la comarca le 13 février ; le Tribunal électoral proclame Elena Cruz Guerra cacique générale."}
  - {annee: 2025, evenement: "Protestations contre la réforme de la sécurité sociale (loi 462) ; Front Line Defenders signale des interventions du Senafront dans la comarca en mai, et l'état d'urgence est décrété le 27 mai dans la province voisine de Bocas del Toro."}
