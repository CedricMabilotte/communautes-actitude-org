  - {instrument: "Loi 10 du 7 mars 1997 qui crée la comarca Ngäbe-Buglé", nature: "loi", annee: 1997, source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  - {instrument: "Loi 11 du 26 mars 2012, régime spécial de protection des ressources minérales, hydriques et environnementales de la comarca", nature: "loi", annee: 2012, source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2010/2012/LEY/Administrador%20Legispan_27001_2012_3_26_ASAMBLEA%20NACIONAL_11.pdf"}
  - {instrument: "Loi 88 du 22 novembre 2010 sur les langues et alphabets des peuples indigènes", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  - {instrument: "Loi 37 de 2016 sur la consultation et le consentement préalable, libre et éclairé", nature: "loi", annee: 2016, source: "https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio%2F10221%2F35435%2F1%2FLos_pueblos_indigenas_de_Panama_y_su_relacion_con_el_Estado.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 10 de 1997 (art. 17) reconnaît le Congrès général comme organe suprême d'expression et de décision du peuple ngäbe-buglé, ainsi que les congrès régionaux et locaux.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 10 de 1997 (art. 18) prévoit des décisions et résolutions des congrès, qui doivent se conformer à la Constitution et aux lois nationales.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi 10 de 1997 (art. 9) fait des terres de la comarca une propriété collective et interdit leur appropriation privée et leur aliénation (cession).", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  ressources: {valeur: "partiel", note: "La loi 11 de 2012 (art. 2 à 4) reconnaît l'usage traditionnel des ressources renouvelables, interdit les concessions minières et annule celles déjà accordées.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2010/2012/LEY/Administrador%20Legispan_27001_2012_3_26_ASAMBLEA%20NACIONAL_11.pdf"}
  consentement: {valeur: "partiel", note: "La loi 11 de 2012 (art. 6) soumet les futurs projets hydroélectriques à l'approbation du congrès compétent puis à un référendum ; la loi 37 de 2016 étend l'obligation de consultation à toute mesure qui touche les comarcas.", source: "https://s3-legispan.asamblea.gob.pa/legispan/NORMAS/2010/2012/LEY/Administrador%20Legispan_27001_2012_3_26_ASAMBLEA%20NACIONAL_11.pdf"}
  langue: {valeur: "partiel", note: "La loi 10 de 1997 (art. 53) et la loi 88 de 2010 (art. 1) reconnaissent les langues ngäbe et buglé, sans statut de langue officielle.", source: "https://faolex.fao.org/docs/pdf/pan164765.pdf"}
  education: {valeur: "partiel", note: "La loi 10 de 1997 (art. 54) prévoit une éducation bilingue interculturelle conduite par le ministère de l'Éducation en coordination avec les autorités de la comarca.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  fiscalite: {valeur: "partiel", note: "La loi 10 de 1997 (art. 42) oblige l'État à inscrire chaque année au budget national des crédits pour la comarca, exécutés par les institutions de l'État avec les congrès.", source: "https://faolex.fao.org/docs/pdf/pan205776.pdf"}
  representation: {valeur: "partiel", note: "La Constitution (art. 147) garantit à chaque comarca le nombre de députés dont elle disposait à l'entrée en vigueur de la règle ; ces sièges sont territoriaux.", source: "https://www.constituteproject.org/constitution/Panama_2004?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le barrage de Barro Blanco a été achevé sans consentement : le Congrès général a rejeté son achèvement en 2016, la Cour suprême a annulé cette décision (Minority Rights Group).", source: "https://minorityrights.org/country/panama/"}
chronologie:
  - {annee: 1997, evenement: "La loi 10 crée la comarca Ngäbe-Buglé."}
  - {annee: 2012, evenement: "La loi 11 interdit les concessions minières dans la comarca et abroge l'article 48 de la loi 10."}
  - {annee: 2016, evenement: "La loi 37 établit la consultation et le consentement préalable, libre et éclairé ; le Congrès général rejette l'achèvement du barrage de Barro Blanco."}
