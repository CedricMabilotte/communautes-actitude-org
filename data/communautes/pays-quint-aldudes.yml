resume: >-
  Le Pays Quint (Kintoa en basque, Quinto Real en espagnol) est un territoire de montagne situé au sud de la vallée des Aldudes, sous souveraineté espagnole. Le traité de délimitation signé à Bayonne le 2 décembre 1856 entre la France et l'Espagne (art. XV et XVI) accorde aux habitants de la vallée de Baïgorry la « jouissance exclusive et perpétuelle » (le droit d'usage sans limite de durée et réservé à eux seuls) des pâturages de sa partie nord, par un bail perpétuel de 8 000 francs par an. Le sol appartient depuis la loi forale 8/1991 (loi du Parlement de Navarre) aux communes du Valle de Erro et du Valle de Baztán, qui le détiennent en indivision. En France, les terres indivises de la vallée, dont le Pays Quint septentrional, sont gérées par la Commission syndicale de la vallée de Baïgorry, établissement public de huit communes dont le siège est à Urepel.
