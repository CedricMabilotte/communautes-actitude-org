droits:
  autogouvernement: {valeur: "partiel", note: "Les biens indivis entre communes sont gérés par une commission syndicale composée de délégués des conseils municipaux (CGCT, art. L. 5222-1 à L. 5222-3) ; celle de la vallée de Baïgorry réunit 8 communes. Le traité de 1856 (art. XVI) donne aux Baïgorriens le droit de nommer leurs propres gardes jurés, qui surveillent les pâturages avec les gardes espagnols et portent leurs plaintes devant l'autorité du territoire.", source: "https://www.dipublico.org/110719/tratado-de-limites-entre-espana-y-francia-desde-el-collado-de-analarra-hasta-la-desembocadura-del-bidasoa-firmado-en-bayona-a-2-de-diciembre-de-1856/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le sol reste propriété espagnole (aujourd'hui des vallées d'Erro et de Baztán, loi forale 8/1991), mais les habitants de Baïgorry ont la jouissance exclusive et perpétuelle des pâturages du versant nord (traité de 1856, art. XV) ; les propriétaires ne peuvent ni défricher, ni labourer, ni bâtir sur ces pâturages et bois (art. XVI). Les Français établis avant 1856 ont été reconnus propriétaires de leurs maisons et terres (art. XVIII).", source: "https://www.dipublico.org/110719/tratado-de-limites-entre-espana-y-francia-desde-el-collado-de-analarra-hasta-la-desembocadura-del-bidasoa-firmado-en-bayona-a-2-de-diciembre-de-1856/"}
  ressources: {valeur: "partiel", note: "Traité de 1856, art. XVI : les Baïgorriens conduisent leurs troupeaux sans payer de droits pendant les mois de leur choix, construisent des cabanes de bois et de branchages et coupent le bois nécessaire à ces cabanes et aux usages ordinaires, sans pouvoir le vendre, l'échanger ni l'emporter ; ils ne peuvent ni défricher, ni planter, ni bâtir. Art. XVII : franchise de douane pour le bétail.", source: "https://www.dipublico.org/110719/tratado-de-limites-entre-espana-y-francia-desde-el-collado-de-analarra-hasta-la-desembocadura-del-bidasoa-firmado-en-bayona-a-2-de-diciembre-de-1856/"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La commission syndicale, établissement public administratif, gère un budget propre alimenté par les participations des communes membres (CGCT, art. L. 5222-1 à L. 5222-3, question écrite n° 5042 du 31 janvier 2023) ; elle n'a pas de fiscalité propre (pas de pouvoir de lever l'impôt). La charte de la montagne basque de 2008 indique un budget de 286 000 euros pour la Commission syndicale de la vallée de Baïgorry (données 2004).", source: "https://questions.assemblee-nationale.fr/q16/16-5042QE.htm"}
  representation: {valeur: "non_applicable", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'Escòla Gaston Febus (2020) écrit que « le pays Quint appartient à l'Espagne mais c'est la commission syndicale de la vallée de Baïgorry qui les gère » ; l'hebdomadaire Argia (2002) indique que les pâturages et le bois du Pays Quint septentrional restent à l'usage exclusif des habitants de Baïgorry contre une rente. La charte de la montagne basque (2008), signée par les commissions syndicales, compte 250 exploitants transhumants et 8 200 UGB (unités de gros bétail) pour la vallée de Baïgorry en 2004.", source: "https://escolagastonfebus.com/histoire/les-commissions-syndicales-dans-les-pyrenees/"}
chronologie:
  - {annee: 1856, evenement: "Traité de Bayonne du 2 décembre : frontière tracée par Lindusmunua, Isterbegui et Beorzubuztan ; jouissance exclusive et perpétuelle des pâturages du Pays Quint accordée aux habitants de Baïgorry contre un bail annuel de 8 000 francs (art. XV)."}
  - {annee: 1991, evenement: "Loi forale navarraise 8/1991 du 16 mars : la Communauté forale de Navarre cède le mont « Quinto Real » aux communes d'Erro et de Baztán, avec ses droits et charges."}
  - {annee: 2005, evenement: "Convention transfrontalière Lindux-Orreaga entre 16 communes navarraises, la Communauté de communes de Garazi-Baigorri et les commissions syndicales de Baïgorry et de Cize."}
