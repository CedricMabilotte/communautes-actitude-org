  verifie: ["Texte des art. XV à XIX du traité de 1856 (version espagnole) : jouissance exclusive et perpétuelle, bail de 8 000 francs, droits de pacage, de coupe de bois et de cabanes, gardes jurés, interdiction de bâtir, propriété reconnue aux Français établis avant 1856.", "Cession du mont Quinto Real aux communes d'Erro et de Baztán : loi forale 8/1991, art. 1, au Bulletin officiel de l'État (BOE).", "Huit communes membres, 8 533 ha de territoire d'action, 3 731 habitants (Insee 1999), budget de 286 000 euros, usage du Pays Quint réservé aux agriculteurs de Baïgorry : charte de la montagne basque (2008).", "Composition et budget des commissions syndicales (CGCT, art. L. 5222-1 à L. 5222-3) : question n° 5042 (2023) ; absence de fiscalité propre : charte de la montagne basque (2008).", "Surface du Pays Quint septentrional (2 510 ha) et méridional (1 624 ha) : hebdomadaire Argia, 31 mars 2002."]
  non_confirme: ["Le texte français du traité (fac-similé de la préfecture des Pyrénées-Atlantiques) n'a pas pu être ouvert ; la fiche s'appuie sur la version espagnole.", "Qui paie aujourd'hui la rente annuelle (l'État français selon plusieurs sources secondaires, les Baïgorriens selon la lettre de l'art. XV) et son montant actuel : non confirmé sur une source officielle ; un communiqué du gouvernement de Navarre sur un versement de 72 000 euros aux communes de Baztán et d'Erro n'a pas pu être ouvert.", "Régime du Pays Quint méridional (1 624 ha selon Argia), qui serait loué par les éleveurs de Baïgorry à la vallée d'Erro : non confirmé sur une source primaire.", "Gestion du Pays Quint septentrional par la Commission syndicale de la vallée de Baïgorry et son pouvoir de réglementer les pâturages : sources secondaires (association Kintoan Barna, Escòla Gaston Febus) seulement.", "Nombre de maisons et d'habitants dans le Pays Quint (sept familles selon Wikipédia en français, une trentaine d’habitants selon Wikipédia en basque) et partage des impôts entre l'Espagne (foncier) et la France (habitation, revenu) : sources secondaires seulement.", "Surface du Pays Quint septentrional (2 510 ha) : presse et Wikipédia, non recoupée sur une source cadastrale ; l'étude du gouvernement de Navarre sur le mont Alduide n'a pas pu être ouverte.", "Nombre de villages ou localités habitées dans le Pays Quint septentrional : non trouvé sur une source officielle."]
