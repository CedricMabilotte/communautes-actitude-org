resume: >-
  Fiche agrégée : elle couvre les nationalités minoritaires titulaires d'un canton ethnique (minzu xiang), circonscription administrative de base créée là où une minorité vit regroupée mais trop peu nombreuse pour une zone autonome. Un canton dont la population minoritaire atteint au moins 30 % peut demander ce statut, un taux un peu inférieur étant admis dans des cas particuliers ; la création est décidée par le gouvernement de la province, de la région autonome ou de la municipalité, règlement sur le travail administratif des cantons ethniques du 15 septembre 1993 (art. 2 et 3). Le chef de canton est issu de la nationalité minoritaire pour laquelle le canton a été créé ; le gouvernement du canton utilise la langue d'usage local et bénéficie d'un régime financier préférentiel. Le canton ethnique ne relève pas de l'autonomie régionale des nationalités et ne dispose d'aucun pouvoir de réglementation propre. Le livre blanc de 2005 comptait 1 173 cantons ethniques fin 2003 et indiquait que neuf des onze nationalités dépourvues de zone autonome disposaient de cantons ethniques.
