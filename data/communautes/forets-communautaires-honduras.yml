resume: >-
  Fiche agrégée : elle couvre les communautés et groupes agroforestiers du Honduras titulaires d'un contrat de gestion forestière communautaire (Contrato de Manejo Forestal Comunitario, CMFC) dans le cadre du Système social forestier (Sistema Social Forestal). La loi sur les forêts, les aires protégées et la faune de 2007 (décret 98-2007) définit ce contrat comme un accord entre l'Institut national de conservation et de développement forestier (ICF) et des groupes communautaires dotés de la personnalité juridique, établis dans une forêt nationale, qui fixe les droits et obligations des parties (art. 11, al. 16). Les communautés organisées et accréditées ont un droit de préférence pour conclure ces contrats (art. 129) ; les droits qui en découlent sont indivisibles et non transmissibles à des tiers extérieurs à la communauté (art. 131). La forêt reste propriété de l'État ou de la municipalité. Selon l'ICF, 242 organisations agroforestières et 478 communautés étaient inscrites au système en 2025, sur 864 402 hectares de forêts nationales.
