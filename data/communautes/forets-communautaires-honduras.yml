reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Honduras à la Convention sur la diversité biologique (décembre 2018) : Système social forestier et Stratégie nationale de foresterie communautaire ; 129 contrats de gestion conclus jusqu'en 2016 sur 595 258,48 ha, tableau par région forestière ; 312 conseils consultatifs forestiers communautaires constitués jusqu'en 2016", annee: 2018, source: "https://www.cbd.int/doc/world/hn/hn-nr-06-es.pdf"}
  - {mecanisme: "cdb_8j", detail: "Stratégie nationale de biodiversité et plan d'action 2018-2022 transmis à la CDB : rôle de l'ICF dans le Système social forestier, 292 conseils consultatifs forestiers communautaires en 2015, 114 contrats de gestion et 596 602,85 ha attribués selon une étude de 2016 citée par le document ; programmes de foresterie communautaire cités parmi les instruments de gestion", annee: 2017, source: "https://www.cbd.int/doc/world/hn/hn-nbsap-v2-es.pdf"}
base_nationale:
  - {instrument: "Loi sur les forêts, les aires protégées et la faune (Ley Forestal, Áreas Protegidas y Vida Silvestre, décret 98-2007) : définitions (art. 11, al. 16, 28 et 55), conseils consultatifs (art. 22 à 28), contrats de gestion (art. 77 à 79), microbassins (art. 124), Système social forestier et foresterie communautaire (art. 126 à 132), incitations (art. 150)", nature: "loi", annee: 2007, source: "https://faolex.fao.org/docs/pdf/hon77556.pdf"}
  - {instrument: "Accord ICF n° 021-2022 (La Gaceta n° 35 976, 15 juillet 2022), pris dans le cadre du Système social forestier ; ses considérants portent sur la commercialisation du bois des forêts nationales attribuées par contrat de gestion forestière communautaire", nature: "loi", annee: 2022, source: "https://hn.vlex.com/vid/acuerdo-no-021-2022-1053519821"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le contrat est conclu avec une communauté organisée dotée de la personnalité juridique et accréditée auprès de l'ICF, qui répartit ensuite les activités entre ses groupes (décret 98-2007, art. 77 et 130) ; chaque communauté peut constituer un conseil consultatif forestier communautaire, accrédité auprès de la municipalité, chargé de veiller à la conservation des forêts publiques et de l'eau de la communauté et d'exercer un contrôle social (contraloría social, contrôle citoyen) sur l'exécution des plans de gestion, programmes et projets dans la communauté (art. 28) ; l'ICF contrôle l'exécution au moins une fois par mois, avec la collaboration de ce conseil, et résilie le contrat en cas de manquement (art. 83).", source: "https://faolex.fao.org/docs/pdf/hon77556.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les communautés organisées ont un droit de préférence pour obtenir un contrat de gestion sur les forêts nationales et municipales, dont la surface dépend de leur population et de la forêt disponible (décret 98-2007, art. 129) ; le contrat peut durer jusqu'à la période de rotation des essences (art. 77) ; les droits sont indivisibles et non transmissibles hors de la communauté (art. 131) ; la propriété reste à l'État ou à la municipalité.", source: "https://faolex.fao.org/docs/pdf/hon77556.pdf"}
  ressources: {valeur: "partiel", note: "La foresterie communautaire repose sur l'usage multiple de la forêt nationale par les communautés, qui en tirent les produits, biens et services (décret 98-2007, art. 11, al. 28) ; parmi les incitations de l'ICF au boisement et au reboisement, qui ne sont pas réservées aux communautés, figurent la récolte gratuite du bois de feu, du bois à usage domestique et des résines après exécution des obligations contractuelles, et l'exploitation commerciale de 50 % au plus du volume produit après des travaux de protection et de sylviculture (art. 150) ; les bénéficiaires protègent et exploitent la forêt selon le plan de gestion forestière et les termes du contrat (art. 78).", source: "https://faolex.fao.org/docs/pdf/hon77556.pdf"}
  consentement: {valeur: "partiel", note: "L'ICF attribue les contrats d'un commun accord avec la municipalité et avec la participation du conseil consultatif forestier communautaire (décret 98-2007, art. 130) ; le conseil veille à ce que les plans de gestion n'affectent pas le développement de la communauté (art. 28) ; les microbassins qui alimentent les populations en eau sont délimités en coordination avec les conseils municipal ou communautaire (art. 124) ; le texte ne prévoit pas de consentement.", source: "https://faolex.fao.org/docs/pdf/hon77556.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Les conseils consultatifs forestiers communautaires désignent des représentants aux conseils municipaux et départementaux (décret 98-2007, art. 26 et 28) ; chaque conseil départemental compte trois représentants des conseils communautaires et un représentant des coopératives et entreprises communautaires forestières (art. 24) ; au conseil national (COCONAFOR), la représentation est indirecte, par trois représentants élus par une assemblée de délégués des conseils départementaux (art. 22).", source: "https://faolex.fao.org/docs/pdf/hon77556.pdf"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'ICF fait état en 2025 de 242 organisations agroforestières inscrites, de 478 communautés et du renouvellement de neuf contrats. Un article de J. E. Lino Ruiz (Université nationale autonome du Honduras, 2019) indique que les approches fondées sur le Système social forestier « n'ont pas fonctionné comme prévu » : les organisations agroforestières titulaires de droits d'usage se sont surtout consacrées à l'exploitation du bois et de la résine et ont délaissé la protection de la forêt.", source: "https://www.camjol.info/index.php/UNAHSOCIEDAD/article/view/10360"}
chronologie:
  - {annee: 1971, evenement: "Loi forestière (décret 85)."}
  - {annee: 1974, evenement: "Décret-loi 103 créant la Corporation hondurienne de développement forestier (COHDEFOR) ; mise en place du Système social forestier, avec des contrats d'usufruit conclus avec des groupes paysans organisés."}
  - {annee: 2007, evenement: "Le Congrès national adopte le 13 septembre la loi sur les forêts, les aires protégées et la faune (décret 98-2007), qui abroge les textes de 1971 et 1974."}
  - {annee: 2008, evenement: "Création de l'ICF, chargé d'organiser le Système social forestier."}
  - {annee: 2015, evenement: "292 conseils consultatifs forestiers communautaires constitués."}
  - {annee: 2016, evenement: "129 contrats de gestion conclus sur 595 258,48 ha ; 312 conseils consultatifs forestiers communautaires."}
  - {annee: 2011, evenement: "Accord ICF n° 009-2011 : manuel de normes techniques pour l'attribution de surfaces forestières à la foresterie communautaire dans les forêts publiques."}
  - {annee: 2013, evenement: "Accord ICF n° 026-A-2013 approuvant la Stratégie nationale de foresterie communautaire."}
  - {annee: 2022, evenement: "Accord ICF n° 021-2022 sur la commercialisation du bois des forêts nationales attribuées aux organisations agroforestières."}
  - {annee: 2025, evenement: "L'ICF recense 242 organisations agroforestières, 478 communautés et 864 402 ha de forêts nationales sous gestion communautaire."}
fiabilite:
  verifie: ["Décret 98-2007 (texte FAOLEX) : définitions du contrat de gestion forestière communautaire, de la foresterie communautaire et du Système social forestier (art. 11, al. 16, 28 et 55) ; composition des conseils consultatifs (art. 22, 24, 26) et attributions du conseil communautaire (art. 28) ; catégories de contrats (art. 77) ; contrôle mensuel et résiliation (art. 83) ; microbassins (art. 124) ; art. 126 à 132 ; incitations (art. 150) ; abrogations (art. 210) ; date d'adoption.", "Sixième rapport national à la CDB (2018) : 129 contrats et 595 258,48 ha jusqu'en 2016, tableau par région forestière (source ICF 2016) ; 312 conseils communautaires.", "Stratégie nationale de biodiversité 2018-2022 : création de l'ICF en 2008, 292 conseils communautaires en 2015.", "Article de Canal 8, chaîne publique (cn8.spe.gob.hn), du 27 février 2025, données de l'ICF : 242 organisations, 864 402 ha, 478 communautés, 10 109 personnes affiliées, plus de 25 000 familles, neuf contrats renouvelés.", "Article de J. E. Lino Ruiz, Revista UNAH Sociedad, 2019 : Système social forestier depuis 1974, contrats d'usufruit avec des groupes paysans, bilan sur la protection.", "Accord ICF n° 021-2022 (vLex, considérants seulement) : renvoie aux accords 009-2011 (manuel de normes techniques) et 026-A-2013 (Stratégie nationale de foresterie communautaire) ; selon ce dernier, le contrat fixe les droits, obligations et interdictions des communautés et la sécurité juridique de la tenure sur la surface attribuée."]
  non_confirme: ["Seuls les considérants de l'accord ICF n° 021-2022 sont accessibles sur vLex ; son dispositif n'a pas été lu. Les accords 009-2011, 026-A-2013 et 023-2018 n'ont pas été consultés.", "Le règlement général de la loi forestière (durée et procédure des contrats communautaires, critères de surface prévus par l'art. 129) n'a pas été consulté.", "Les 864 402 ha et les 242 organisations de 2025 ne distinguent pas les organisations sous contrat de celles seulement inscrites au système ; écart non expliqué avec les 595 258,48 ha de 2016.", "Aucune liste officielle des contrats par site (nom, municipalité, surface, année) n'a été trouvée ; pas de tableau des sites.", "Articulation avec les droits des peuples autochtones et afrohonduriens sur les forêts de leurs terres (art. 45) : traitée dans d'autres fiches, non vérifiée pour les contrats communautaires.", "Aucune inscription au registre ICCA ou à la base WDPA n'a été vérifiée."]
