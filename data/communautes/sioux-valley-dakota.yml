resume: >-
  La nation dakota de Sioux Valley (Wipazoka Wakpa Oyate) est une communauté dakota de l'ouest du Manitoba. Son accord sur la gouvernance avec le Canada et l'accord tripartite avec le Manitoba, signés le 30 août 2013, ont reçu force de loi par la Loi sur la gouvernance de la nation dakota de Sioux Valley (L.C. 2014, ch. 1) et par une loi manitobaine (L.M. 2014, c. 14) ; ils sont en vigueur depuis le 1er juillet 2014. La Loi sur les Indiens (loi fédérale qui régit les bandes et les réserves) ne s'applique plus à la Nation que dans la mesure prévue par l'accord. Le gouvernement de l'oyate (peuple) dakota, établi par une constitution propre, a compétence pour légiférer sur les terres de la Nation, la citoyenneté, l'éducation, la culture et la langue dakota, les ressources naturelles et la création d'un tribunal propre. C'est le premier accord d'autonomie gouvernementale conclu au Manitoba.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien pour les peuples autochtones au sens de l'article 35 de la Loi constitutionnelle de 1982.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
