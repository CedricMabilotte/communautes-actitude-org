  - {instrument: "Accord sur la gouvernance de la nation dakota de Sioux Valley (signé le 30 août 2013) et Accord tripartite sur la gouvernance avec le Manitoba", nature: "accord_revendication", annee: 2013, source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  - {instrument: "Loi sur la gouvernance de la nation dakota de Sioux Valley (Manitoba), L.M. 2014, c. 14", nature: "loi", annee: 2014, source: "https://web2.gov.mb.ca/laws/statutes/2014/c01414f.php"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'accord reconnaît le gouvernement de l'oyate dakota de Sioux Valley (art. 2.01), établi par la constitution de la Nation, qui fixe sa structure et le choix de ses dirigeants (art. 9.01) ; la Nation exerce ses attributions par ce gouvernement (loi fédérale de 2014, art. 5).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'accord a force de loi et l'emporte sur toute règle de droit fédérale incompatible (loi de 2014, art. 3 et 4) ; les lois de la Nation adoptées conformément à l'accord ont force de loi (art. 6) et ne sont pas des textes réglementaires fédéraux (art. 9).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-10.2/page-1.html"}
  justice_propre: {valeur: "partiel", note: "La Nation peut créer un tribunal propre, compétent pour les infractions à ses lois et certaines affaires civiles (art. 53.01, 53.04 et 53.05 de l'accord) ; tant que la loi créant ce tribunal n'est pas en vigueur, la Cour provinciale du Manitoba juge ces infractions ; cette loi devra prévoir un appel devant la Cour du Banc du Roi du Manitoba (art. 53.04).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  terres: {valeur: "partiel", note: "Le Canada reste titulaire du titre à l'usage et au profit de la Nation, qui peut en demander le transfert (art. 40.01 et 40.02) ; la Nation a compétence sur la gestion de ses terres (art. 41.01) ; selon la constitution, ces terres ne devraient pas être vendues (art. 44.02).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  ressources: {valeur: "reconnu", note: "Compétence sur les ressources non renouvelables (mines, minéraux, pétrole, gaz, sable, gravier), les plans d'eau situés entièrement sur ses terres, l'eau souterraine, les forêts et la faune, avec primauté sur le droit fédéral ou provincial en cas d'incompatibilité (art. 15.02 à 15.06) ; pour la pêche, le droit fédéral ou provincial l'emporte (art. 15.05).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  consentement: {valeur: "partiel", note: "Pour un projet extérieur aux terres de la Nation soumis à une évaluation environnementale fédérale ou manitobaine et susceptible d'« effets environnementaux néfastes importants » sur ces terres, ou pour un projet de la Nation susceptible de tels effets au-dehors, les trois parties suivent la procédure de l'annexe C (art. 16.04) ; aucun droit de consentement n'est prévu.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  langue: {valeur: "partiel", note: "Compétence sur les affaires culturelles dakota, dont la langue, avec primauté sur le droit fédéral ou provincial, sauf sur la Loi sur les langues officielles (art. 17.01) ; aucun statut de langue officielle dans l'accord.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  education: {valeur: "partiel", note: "Compétence en matière d'éducation, de la petite enfance au postsecondaire, y compris l'enseignement de la langue et de la culture dakota, avec primauté sur le droit fédéral ou provincial ; les normes doivent être au moins équivalentes aux normes provinciales (art. 18.01).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  fiscalite: {valeur: "partiel", note: "Compétence en matière de taxation directe des seuls citoyens de la Nation sur ses terres (art. 65.01) ; l'imposition des non-citoyens dépend d'ententes à négocier avec le Canada et le Manitoba (art. 65.02).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La Nation a compétence sur sa citoyenneté, avec primauté sur le droit fédéral, et tient le registre de ses citoyens (art. 12.01 et 12.02) ; les membres de la bande à la date de la loi sur la citoyenneté en deviennent citoyens (art. 12.01) ; l'inscription au registre des Indiens reste régie par la Loi sur les Indiens, et l'accord n'empêche pas la Nation d'y faire inscrire ses citoyens non inscrits (art. 12.03).", source: "https://www.rcaanc-cirnac.gc.ca/fra/1385741084467/1551118616967"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le registre fédéral des Premières Nations (2026) indique que l'appartenance et le système électoral relèvent de la loi sur la gouvernance et recense un chef et cinq conseillers en fonction du 13 novembre 2025 au 12 novembre 2027. Selon la Nation, son département des relations intergouvernementales réunit des comités sur la citoyenneté, la constitution, une loi sur la langue dakota et la sécurité communautaire ; un projet de loi sur l'enfance et la famille a été soumis à consultation en 2025. Aucun registre public des lois adoptées n'a été trouvé.", source: "https://fnp-ppn.aadnc-aandc.gc.ca/fnp/Main/Search/FNGovernance.aspx?BAND_NUMBER=290&lang=eng"}
chronologie:
  - {annee: 1991, evenement: "Accord-cadre entre la Nation et le Canada pour négocier la gouvernance (3 juillet)."}
  - {annee: 2001, evenement: "Entente de principe globale avec le Canada et entente de principe tripartite avec le Manitoba (2 mars)."}
  - {annee: 2012, evenement: "Les électeurs de la Nation approuvent les accords (4 octobre)."}
  - {annee: 2013, evenement: "Signature de l'accord sur la gouvernance et de l'accord tripartite (30 août)."}
  - {annee: 2014, evenement: "Sanction de la loi fédérale (4 mars) et de la loi manitobaine (12 juin) ; entrée en vigueur le 1er juillet."}
