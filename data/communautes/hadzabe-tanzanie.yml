effectivite: {valeur: "partielle", note: "Les Hadza ont perdu jusqu'à 90 % de leurs terres ancestrales ; les titres en couvrent environ 10 % (Cultural Survival, 2018). Les gouvernements de village et les Hadza emploient 33 gardes communautaires payés par la vente de crédits carbone. En 2024, la terre attribuée aux Hadza dans le village de Domanga (district de Mbulu) a été envahie par des agriculteurs venus de la région de Singida (IWGIA, 2025).", source: "https://iwgia.org/en/tanzania/5638-iw-2025-tanzania.html"}
