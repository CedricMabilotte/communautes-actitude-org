resume: >-
  Les Hadza sont un peuple de chasseurs-cueilleurs du nord de la Tanzanie, dans la vallée de Yaeda et autour du lac Eyasi.
  L'État tanzanien ne reconnaît pas de peuples autochtones sur son territoire ; la loi de 1999 sur les terres villageoises permet de délivrer des certificats de droit coutumier d'occupation (titres fonciers fondés sur la coutume) à des groupes reconnus par le droit coutumier.
  En 2011, des communautés hadza ont obtenu les premiers titres de ce type délivrés à des chasseurs-cueilleurs dans le pays ; en 2016, le ministre des Terres a remis d'autres titres communautaires aux Hadza et aux Datoga voisins.
  Le régime des terres villageoises est décrit dans la fiche « Terres villageoises de Tanzanie ».
