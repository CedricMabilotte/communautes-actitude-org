  - {annee: 2016, evenement: "Remise par le ministre des Terres de 12 titres communautaires aux Hadza et aux Datoga du bassin du lac Eyasi."}
  - {annee: 2024, evenement: "Terre attribuée aux Hadza à Domanga (district de Mbulu) envahie par des agriculteurs venus de la région de Singida."}
