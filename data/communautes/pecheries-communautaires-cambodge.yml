reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Cambodge à la Convention sur la diversité biologique (2019) : section 6.3 sur le développement des pêcheries communautaires ; transfert de plus d'un million d'hectares de concessions privées aux pêcheries communautaires, 516 pêcheries (475 continentales, 41 marines), 332 168 membres, 408 enregistrées, 496 zones de conservation délimitées ; le rapport décrit ce régime comme une délégation de droits aux pêcheurs pour gérer leurs propres zones de pêche", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/kh-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi sur la pêche, promulguée par Preah Reach Kram NS/RKM/0625/028 du 28 juin 2025, chapitre 8 « Communautés de pêche » (art. 66 à 69) et art. 12, 13 et 29 ; elle remplace la loi de 2006 et maintient ses textes d'application jusqu'à leur remplacement (art. 102)", nature: "loi", annee: 2025, source: "https://data.opendevelopmentcambodia.net/en/dataset/3a85fa81-8a0d-4ce9-a095-a6b99d58ae75/resource/5d8555e6-c44d-4a7f-9628-555c4b88da7d/download/royal_decree_no_028__28.06.2025.pdf"}
  - {instrument: "Sous-décret n° 25 ANK.BK du 20 mars 2007 sur la gestion des pêcheries communautaires (Journal officiel du 23 mars 2007), qui remplace le sous-décret n° 80 de 2005", nature: "loi", annee: 2007, source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
  - {instrument: "Loi sur la pêche, promulguée par Preah Reach Kram NS/RKM/0506/011 du 21 mai 2006, chapitre 11 « Pêcheries communautaires » (art. 59 à 63) ; remplacée en 2025", nature: "loi", annee: 2006, source: "https://data.opendevelopmentcambodia.net/en/dataset/0466774e-01bb-4d07-9ce1-545d7919757f/resource/2d9c4d19-4bc4-41c5-a2ed-fa43978f3d6a/download/law_on_fisheries__20.03.2007.pdf"}
  - {instrument: "Décret royal NS/RKT/0505/240 du 29 mai 2005 sur l'établissement des pêcheries communautaires", nature: "loi", annee: 2005, source: "https://data.opendevelopmentcambodia.net/dataset/royal-decree-on-the-establishment-of-community-fisheries"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque pêcherie est dirigée par un comité de cinq à onze membres (nombre impair) élu au scrutin secret par l'assemblée générale à la majorité absolue des votants, pour cinq ans ; l'Administration des pêches, les autorités locales et le conseil de commune sont invités à observer le vote (sous-décret de 2007, art. 4, 15 à 17 et 19) ; la pêcherie respecte les instructions de l'Administration des pêches et du ministère (art. 10), qui reconnaît et enregistre chaque pêcherie.", source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque pêcherie se dote de statuts (texte qui fixe ses règles de fonctionnement), d'un règlement intérieur, d'un plan de gestion et d'une carte de sa zone, reconnus par les autorités compétentes (décret royal de 2005, art. 2 ; sous-décret de 2007, art. 7 et 8) ; le plan de gestion, préparé par le comité, est approuvé par l'Administration des pêches, qui peut en exiger la révision (loi de 2006, art. 62 ; sous-décret de 2007, art. 28 et 29) ; la zone est utilisée selon les conditions techniques fixées par l'autorité (loi de 2025, art. 67 et 68).", source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
  justice_propre: {valeur: "partiel", note: "Le comité représente la pêcherie dans la médiation et le règlement des conflits (sous-décret de 2007, art. 20) ; les statuts fixent les motifs d'exclusion d'un membre (art. 8) ; en cas d'urgence, la pêcherie peut demander aux autorités voisines de saisir les preuves d'une infraction et de retenir l'auteur, remis aussitôt à l'Administration des pêches (art. 11) ; les infractions relèvent des agents et des tribunaux de l'État.", source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
  terres: {valeur: "partiel", note: "La zone de pêche communautaire est une partie du domaine halieutique de l'État, propriété publique de l'État (sous-décret de 2007, art. 3), remise à la communauté par décision du ministre et par lettre ou accord de l'Administration des pêches (loi de 2025, art. 12, 13 et 67 ; loi de 2006, art. 60 et 61) ; l'accord dure au plus trois ans, renouvelable (loi de 2006, art. 61 ; sous-décret de 2007, art. 26) ; la communauté ne peut ni vendre, ni échanger, ni louer, ni hypothéquer, ni diviser, ni s'approprier la zone (loi de 2025, art. 69) et l'autorité peut la reprendre si nécessaire (art. 67).", source: "https://data.opendevelopmentcambodia.net/en/dataset/3a85fa81-8a0d-4ce9-a095-a6b99d58ae75/resource/5d8555e6-c44d-4a7f-9628-555c4b88da7d/download/royal_decree_no_028__28.06.2025.pdf"}
  ressources: {valeur: "partiel", note: "Dans les zones communautaires du domaine continental, la pêche à petite ou moyenne échelle est réservée aux membres, selon les conditions techniques fixées par l'Administration des pêches (loi de 2025, art. 29) ; la pêcherie organise la pêche de ses membres et peut pêcher, pratiquer l'aquaculture, récolter, vendre, utiliser et gérer les ressources halieutiques selon son accord et son plan (sous-décret de 2007, art. 11).", source: "https://data.opendevelopmentcambodia.net/en/dataset/3a85fa81-8a0d-4ce9-a095-a6b99d58ae75/resource/5d8555e6-c44d-4a7f-9628-555c4b88da7d/download/royal_decree_no_028__28.06.2025.pdf"}
  consentement: {valeur: "partiel", note: "Le projet d'accord de zone est affiché au moins trente jours à la commune, au district et à la province, les objections étant traitées avec l'aide des autorités locales (sous-décret de 2007, art. 25) ; avant une résiliation pour un intérêt public supérieur, l'Administration des pêches donne un préavis écrit de six mois et discute avec le comité des pertes de la communauté (art. 27) ; aucun texte consulté ne subordonne ces décisions au consentement de la communauté.", source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le comité ouvre un compte et gère les finances de la pêcherie (sous-décret de 2007, art. 20), alimentées par les cotisations des membres, les dons, l'aide de l'État, des organisations internationales et des ONG et d'autres revenus licites (art. 30) ; aucun pouvoir fiscal n'est prévu.", source: "https://data.opendevelopmentcambodia.net/en/laws_record/sub-decree-of-community-fisheries-management"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon l'évaluation nationale de 2023 menée par l'Administration des pêches avec la FAO, les 385 pêcheries enquêtées sont toutes enregistrées et 94,8 % ont un plan de gestion approuvé, mais 67 % ne déclarent aucun budget ; en 2022, 293 pêcheries avaient un comité au mandat expiré et plus de 322 un plan à mettre à jour ; l'évaluation de l'Administration des pêches de 2022 classe 39 % des 202 pêcheries enregistrées étudiées comme « fortes », 51 % « moyennes » et 10 % « faibles » ; l'étude publiée par la FAO en 2017 jugeait trois des treize pêcheries étudiées en bon fonctionnement et trois en mauvais fonctionnement.", source: "https://data.opendevelopmentcambodia.net/en/dataset/9b8df5d4-35df-422f-9727-5a73f6f4056e/resource/10cbf6a9-0bdd-414a-a8af-a80756c71d2c/download/status_assessment_of_community_fisheries_in_cambodia__22.12.2025.pdf"}
chronologie:
  - {annee: 2001, evenement: "Première réforme des lots de pêche commerciaux : une partie des surfaces est retirée aux concessionnaires et ouverte aux communautés riveraines."}
  - {annee: 2005, evenement: "Décret royal sur l'établissement des pêcheries communautaires."}
  - {annee: 2006, evenement: "Loi sur la pêche du 21 mai : le chapitre 11 crée la zone de pêche communautaire."}
  - {annee: 2007, evenement: "Sous-décret n° 25 du 20 mars sur la gestion des pêcheries communautaires ; année du plus grand nombre de créations."}
  - {annee: 2012, evenement: "Suppression des derniers lots de pêche (35 lots) ; une partie est transférée aux pêcheries communautaires, une autre devient zone de conservation."}
  - {annee: 2017, evenement: "Le ministère compte 516 pêcheries communautaires (475 continentales, 41 marines) et 332 168 membres."}
  - {annee: 2018, evenement: "Première évaluation nationale : 516 pêcheries dans 20 provinces gèrent 967 000 hectares, 411 sont enregistrées."}
  - {annee: 2025, evenement: "Nouvelle loi sur la pêche du 28 juin (chapitre 8, art. 66 à 69) ; 516 pêcheries, dont 467 enregistrées."}
fiabilite:
  verifie: ["Loi de 2006, art. 59 à 63 et définition de la zone de pêche communautaire (traduction anglaise non officielle de 2007, Administration des pêches).", "Loi de 2025 (texte khmer publié, 32 pages numérotées suivies d'annexes) : art. 12 et 13 (zones communautaires dans les domaines continental et marin), art. 29 (pêche réservée aux membres), chapitre 8 art. 66 à 69, art. 102 (maintien des textes d'application), date de signature du 28 juin 2025.", "Décret royal de 2005, art. 1 à 5 (traduction anglaise non officielle).", "Sous-décret n° 25 de 2007 (texte khmer du Journal officiel du 23 mars 2007) : art. 3, 4, 7, 8, 10, 11, 15 à 17, 19, 20, 25 à 30.", "Sixième rapport national à la CDB (2019), section 6.3.", "Chiffres 2018, 2023 et 2025 : rapport d'évaluation 2023 de l'Administration des pêches et de la FAO (publié en 2025).", "Tableau par site : 235 pêcheries cartographiées par l'Administration des pêches en 2011 (jeu de données Open Development Cambodia), surfaces converties d'hectares en km² ; les 235 lignes concordent avec le jeu de données."]
  non_confirme: ["Sous-décret n° 25 de 2007 : lu sur une copie khmère scannée, sans traduction officielle ; le résumé publié par la FAO en 2017 (circulaire n° 1138) décrit le sous-décret de 2005, qu'il remplace.", "Loi de 2025 : l'art. 66, al. 2, qui rattacherait la pêcherie communautaire au régime des communautés agricoles, est en partie masqué par le sceau sur la copie consultée ; le numéro de l'article d'abrogation de la loi de 2006 n'est pas lisible.", "Nombre de pêcheries enregistrées : 394 (2016, Open Development Cambodia), 408 (2017, rapport à la CDB), 411 (2018), 447 (évaluation de 2022), 467 (2025) selon les sources.", "Population : 332 168 membres (2017) ; l'évaluation de 2023 donne 161 170 membres pour 385 pêcheries, chiffres non comparables.", "Le tableau ne couvre que les 235 pêcheries cartographiées en 2011, pas les 516 ; une liste officielle de 2022 existe en khmer (Administration des pêches) mais son texte n'est pas exploitable automatiquement ; trois noms apparaissent deux fois avec des codes distincts.", "Nombre de villages concernés : non trouvé pour l'ensemble du régime ; le jeu de données de 2011 compte 540 villages pour les 235 pêcheries cartographiées."]
