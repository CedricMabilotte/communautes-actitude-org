resume: >-
  Fiche agrégée : elle couvre les communautés de pêcheurs titulaires d'une zone de pêche communautaire. Après la réduction des lots de pêche commerciaux en 2000-2001 puis leur suppression en 2012, l'État a confié plus d'un million d'hectares du domaine halieutique à des pêcheries communautaires. Le régime repose sur le décret royal de 2005, le sous-décret n° 25 du 20 mars 2007 (texte réglementaire du gouvernement) et la loi sur la pêche, celle du 21 mai 2006 puis celle du 28 juin 2025 (chapitre 8, art. 66 à 69). Les habitants d'un ou plusieurs villages forment une pêcherie, élisent un comité et reçoivent par accord avec l'Administration des pêches une zone qu'ils gèrent selon un plan approuvé et où la pêche à petite ou moyenne échelle est réservée aux membres ; la zone reste dans le domaine de l'État et ne peut être ni vendue ni partagée. En 2025, l'Administration des pêches compte 516 pêcheries communautaires, dont 467 enregistrées.
