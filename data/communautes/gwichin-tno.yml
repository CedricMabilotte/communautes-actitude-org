resume: >-
  Les Gwich'in, aussi appelés Loucheux dans les textes anciens, vivent au nord-ouest des Territoires du Nord-Ouest, autour du delta du Mackenzie, ainsi qu'au Yukon et en Alaska. L'Entente sur la revendication territoriale globale, signée le 22 avril 1992 entre le Canada et les Gwich'in représentés par le Conseil tribal des Gwich'in, est entrée en vigueur le 22 décembre 1992. Elle attribue au Conseil tribal le titre sur 22 329 km² de terres, dont 6 065 km² avec le sous-sol, des droits de récolte, une part des redevances sur les ressources et des sièges dans les offices de gestion des terres, des eaux et de la faune. L'autonomie gouvernementale n'est pas encore conclue : un accord est en négociation depuis l'accord de processus de 2007.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada a appuyé la Déclaration en 2010, en revenant sur sa position antérieure (rapport du Rapporteur spécial A/HRC/27/52/Add.2, § 11) ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien.", annee: 2010, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission au Canada (A/HRC/27/52/Add.2), § 41 : négociations d'autonomie gouvernementale engagées en 1996 par le Conseil tribal des Gwich'in avec les Inuvialuit ; accord de principe d'avril 2003 rejeté ensuite par le Conseil tribal ; négociations reprises à des tables séparées.", annee: 2014, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
base_nationale:
  - {instrument: "Entente sur la revendication territoriale globale des Gwich'in (Gwich'in Comprehensive Land Claim Agreement)", nature: "accord_revendication", annee: 1992, source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  - {instrument: "Loi sur le règlement de la revendication territoriale des Gwich'in (L.C. 1992, ch. 53)", nature: "loi", annee: 1992, source: "https://lois-laws.justice.gc.ca/fra/lois/G-11.8/page-1.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil tribal des Gwich'in représente les Gwich'in, détient le titre des terres (Loi de 1992, art. 4(3)) et en gère l'usage, Entente, art. 18.1.6 ; l'Entente prévoit seulement la négociation d'accords d'autonomie gouvernementale (chapitre 5), toujours en cours selon le gouvernement des T.N.-O. (2025).", source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil des ressources renouvelables de chaque collectivité, institué par l'organisation gwich'in, gère l'exercice local des droits de récolte gwich'in, y compris les méthodes, les saisons et les lieux de récolte (Entente, art. 12.9.3 et 12.9.4 b)), et fixe les conditions (espèces, lieux, méthodes, quantités, saisons) auxquelles les non-participants peuvent récolter sur les terres gwich'in (art. 12.4.6 et 12.4.8) ; aucun pouvoir général de légiférer n'est prévu, l'accord d'autonomie gouvernementale restant à négocier.", source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Titre en pleine propriété (fee simple, propriété sans réserve) sur 22 329 km² dans les T.N.-O., dévolu au Conseil tribal des Gwich'in, Entente, art. 18.1.2 et 18.1.4 ; ces terres ne peuvent être cédées qu'à l'État en échange d'autres terres ou à une organisation gwich'in, ni saisies ni hypothéquées, art. 18.1.5, 18.1.7 et 18.1.8.", source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  ressources: {valeur: "partiel", note: "Titre sur le sous-sol limité à 6 065 km² des 22 329 km² de terres gwich'in, et sur le seul sous-sol de 93 km² supplémentaires, art. 18.1.2 b) et c) ; droit de récolter toutes les espèces sauvages dans la région désignée en toute saison, sous réserve des limites prévues par l'Entente, art. 12.4.1 ; versement annuel de 7,5 % des premiers 2 millions de dollars de redevances perçues par l'État et de 1,5 % au-delà, art. 9.1.1.", source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  consentement: {valeur: "partiel", note: "Consultation obligatoire du Conseil tribal avant l'ouverture de terres à l'exploration pétrolière et gazière et avant l'exploration ou la production minière, art. 21.1.2 à 21.1.5 ; nombre égal de membres proposés par le Conseil tribal et par l'État à l'office d'aménagement et à l'office des terres et des eaux, art. 24.2.2 et 24.4.7 ; aucun droit de refus.", source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  langue: {valeur: "reconnu", note: "Le gwich'in est l'une des onze langues officielles des Territoires du Nord-Ouest, Loi sur les langues officielles (LRTNO 1988, ch. O-1), art. 4, dans la mesure prévue par la loi, art. 5 ; chacun peut l'employer devant les tribunaux territoriaux, art. 9(2), mais les décisions sont rendues en français et en anglais, art. 10(1) ; l'Entente ne confère pas de pouvoir propre en matière de langue.", source: "https://www.justice.gov.nt.ca/en/files/legislation/official-languages/official-languages.a.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Inscription des participants (bénéficiaires) de nationalité canadienne selon l'ascendance gwich'in ou l'acceptation par les Gwich'in d'une personne autochtone résidant dans la région, Entente, art. 4.1.1 et 4.2 ; le statut ouvre les droits de l'Entente, sans citoyenneté propre.", source: "https://www.eia.gov.nt.ca/sites/eia/files/gwichin_comprehensive_land_claim_1.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante de l'application des droits fonciers et de récolte n'a été trouvée. Le Rapporteur spécial des Nations unies note en 2014 que l'accord de principe d'autonomie gouvernementale de 2003 a été rejeté par le Conseil tribal et que les négociations ont repris séparément (A/HRC/27/52/Add.2, § 41) ; selon le gouvernement des T.N.-O., elles sont toujours en cours (page mise à jour le 26 février 2025).", source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
chronologie:
  - {annee: 1921, evenement: "Signature du Traité 11 à Arctic Red River (Tsiigehtchic) le 26 juillet et à Fort McPherson le 28 juillet avec des chefs gwich'in."}
  - {annee: 1991, evenement: "Les Gwich'in ratifient le texte de l'Entente par un vote tenu du 16 au 20 septembre."}
  - {annee: 1992, evenement: "Signature de l'Entente le 22 avril ; loi fédérale sanctionnée le 17 décembre, en vigueur le 22 décembre."}
  - {annee: 1996, evenement: "Début des négociations d'autonomie gouvernementale, menées avec les Inuvialuit."}
  - {annee: 2003, evenement: "Accord de principe conjoint avec les Inuvialuit, rejeté ensuite par le Conseil tribal des Gwich'in."}
  - {annee: 2007, evenement: "Accord sur le processus et le calendrier des négociations d'autonomie gouvernementale."}
  - {annee: 2019, evenement: "Accord modificatif retirant le Conseil des Nihtat Gwich'in (Inuvik) des négociations ; il les a rejointes depuis."}
