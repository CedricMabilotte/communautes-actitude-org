droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de Barbuda, « organe principal de gouvernement local » de l'île (Constitution de 1981, art. 123(1)), composé de neuf membres élus pour quatre ans par les électeurs de la circonscription de Barbuda, du député de Barbuda et d'un sénateur (Barbuda Local Government Act de 1976, art. 3, 4, 12 et 14) ; le Cabinet (gouvernement national) peut lui adresser des directives générales, sauf pour l'agriculture, la forêt, la santé, les services publics d'eau et d'électricité, les routes et la collecte de ses recettes (art. 18(1) et (2)).", source: "https://laws.gov.ag/wp-content/uploads/2018/08/cap-44.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Conseil adopte des règlements locaux (by-laws, actes à valeur de loi sur l'île) dans une liste de matières locales : voirie, salubrité, marchés, élevage, pêche, coupe de bois, licences, eau et électricité, taxes foncières (loi de 1976, art. 19) ; ces règlements s'ajoutent au droit national sans pouvoir y déroger (art. 19(3) et (5)).", source: "https://laws.gov.ag/wp-content/uploads/2018/08/cap-44.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "conteste", note: "Le Barbuda Land Act de 2007 disposait que « toutes les terres de Barbuda appartiennent en commun au peuple de Barbuda », interdisait leur vente (art. 3 et 5) et donnait à chaque Barbudien majeur un droit d'occupation exclusive d'une parcelle (art. 7) ; la loi n° 41 de 2017 a remplacé la partie II (terres dévolues à la Couronne, habitants déclarés locataires de la Couronne, achat de parcelles en pleine propriété), puis la loi n° 6 de 2018 (art. 6) a abrogé les deux lois ; en 2022, le Conseil privé a jugé que ces droits ne constituaient pas une propriété protégée par l'article 9 de la Constitution et a indiqué, sans avoir à le trancher, que l'abrogation paraissait valide ([2022] UKPC 25, § 58 et 61).", source: "https://jcpc.uk/uploads/jcpc_2021_0070_judgment_9e31dfb324.pdf"}
  ressources: {valeur: "partiel", note: "Le Conseil administre l'agriculture et la forêt, domaines où le Cabinet ne peut lui adresser de directives, ainsi que la pêche (loi de 1976, art. 18(1), 18(2) et 18(4)) ; il réglemente par règlement local la coupe de bois, le charbon de bois, la chasse et la pêche (art. 19(1)).", source: "https://laws.gov.ag/wp-content/uploads/2018/08/cap-44.pdf"}
  consentement: {valeur: "partiel", note: "Une loi modifiant les articles 1 à 44 de la loi de 1976 n'est adoptée qu'avec le consentement du Conseil donné par résolution (Constitution de 1981, art. 123(3) à (7) et annexe 2) ; le consentement de la majorité des Barbudiens aux grands projets (Barbuda Land Act de 2007, art. 6, 17 et 18) a été supprimé par la loi n° 41 de 2017, puis la loi de 2007 a été abrogée par la loi n° 6 de 2018 (art. 6).", source: "https://www.constituteproject.org/constitution/Antigua_and_Barbuda_1981"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le Conseil perçoit pour son propre usage les droits et taxes nationaux liés aux opérations conclues sur l'île (droits d'exportation, accises, licences, taxe hôtelière, taxe d'embarquement, etc.) et lève des taxes foncières par règlement (loi de 1976, art. 24 et 40) ; son budget annuel est soumis à l'approbation du Parlement (art. 25).", source: "https://laws.gov.ag/wp-content/uploads/2018/08/cap-44.pdf"}
  representation: {valeur: "reconnu", note: "Un sénateur est nommé sur avis du Conseil de Barbuda et un autre doit habiter Barbuda (Constitution de 1981, art. 28(5) et (6)) ; au moins une circonscription de la Chambre des représentants est située à Barbuda (art. 62(1)).", source: "https://www.constituteproject.org/constitution/Antigua_and_Barbuda_1981"}
  statut_personnel: {valeur: "conteste", note: "La qualité légale de « Barbudien » (naissance à Barbuda ou ascendance barbudienne), qui ouvrait les droits fonciers sur l'île (Barbuda Land Act de 2007, art. 2, 7 et 10 ; loi n° 41 de 2017, art. 4), a disparu avec l'abrogation de ces lois par la loi n° 6 de 2018 (art. 6) ; elle ne créait pas de citoyenneté distincte.", source: "https://faolex.fao.org/docs/pdf/ant188664.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "La circonscription de Barbuda élit son député (Trevor Walker, du Barbuda People's Movement, réélu en avril 2026), mais le régime de propriété commune a été abrogé en 2018 et le gouvernement central a fait dégager le terrain d'un nouvel aéroport en passant outre le Conseil de Barbuda ; deux habitants contestent ce chantier en justice : le Conseil privé leur a reconnu qualité pour agir le 27 février 2024 ([2024] UKPC 3) et l'audience au fond devant la Haute Cour s'est tenue le 1er juin 2026 (Civicus Monitor, septembre 2026).", source: "https://monitor.civicus.org/explore/environmental-and-land-defenders-secure-hearing-in-long-running-airport-challenge/"}
chronologie:
  - {annee: 1834, evenement: "Abolition de l'esclavage ; la propriété commune des terres s'établit ensuite par l'usage."}
  - {annee: 1976, evenement: "Barbuda Local Government Act : création du Conseil de Barbuda (23 décembre)."}
  - {annee: 1981, evenement: "Indépendance d'Antigua-et-Barbuda ; la Constitution (art. 123) fait du Conseil l'organe principal de gouvernement local de l'île et protège sa loi constitutive."}
  - {annee: 2007, evenement: "Barbuda Land Act : propriété commune des terres par le peuple de Barbuda et consentement des habitants aux grands projets ; entrée en vigueur le 2 mai 2011."}
  - {annee: 2016, evenement: "Loi n° 12 de 2016 : le seuil des « grands projets » passe de 5,4 à 40 millions de dollars et les baux peuvent atteindre 99 ans."}
  - {annee: 2017, evenement: "Ouragan Irma les 5 et 6 septembre ; état d'urgence proclamé à Barbuda le 6 septembre ; évacuation des habitants vers Antigua."}
  - {annee: 2018, evenement: "Loi n° 41 de 2017, promulguée le 22 janvier : achat de parcelles en pleine propriété, abrogation de la consultation des habitants et de la clause de protection de la loi de 2007. Loi n° 6 de 2018, promulguée le 31 mai : abrogation des lois foncières de Barbuda de 2007 et 2017."}
  - {annee: 2022, evenement: "Le Conseil privé rejette le recours de Mackenzie Frank et Trevor Walker contre le Paradise Found (Project) Act de 2015 (13 juin, [2022] UKPC 25)."}
  - {annee: 2024, evenement: "Le Conseil privé reconnaît à deux habitants qualité pour contester la construction de l'aéroport de Barbuda (27 février, [2024] UKPC 3)."}
  - {annee: 2026, evenement: "Audience au fond devant la Haute Cour d'Antigua-et-Barbuda sur l'aéroport (1er juin)."}
fiabilite:
  verifie: ["Loi n° 6 de 2018 (Crown Lands (Regulation) (Amendment) Act), art. 6 : abrogation des lois n° 23 de 2007 et n° 41 de 2017 et du règlement foncier de 2010, texte publié au Journal officiel reproduit par FAOLEX ; abrogation confirmée par le Conseil privé, [2022] UKPC 25, § 5 et 58.", "Arrêt du Conseil privé [2024] UKPC 3 du 27 février 2024 (Mussington et Frank), page de la juridiction sur jcpc.uk.", "Constitution de 1981, art. 1(2), 28(5) et (6), 31(1)(g), 47(5) et annexe 1, 62(1), 123 et annexe 2, sur Constitute Project.", "Barbuda Local Government Act (Cap. 44), art. 3, 4, 6, 12, 14, 18, 19, 24, 25 et 40, sur le site officiel de la législation (laws.gov.ag).", "Barbuda Land Act de 2007 (art. 2 à 10, 17, 18, 27 et 31), loi n° 12 de 2016 et loi n° 41 de 2017, textes publiés sur laws.gov.ag ; date d'entrée en vigueur de la loi de 2007 (2 mai 2011) dans l'avis ministériel n° 19 de 2011.", "Population de 1 634 habitants et superficie de 161 km² (tableau 1.5) dans le profil démographique du recensement de 2011.", "Révision constitutionnelle n° 22 de 2025 : elle ne remplace que l'annexe 3 (serments) et ne touche pas à l'article 123."]
  non_confirme: ["Barbuda (Amendment) Act de 2018 (terres de Barbuda déclarées terres de la Couronne) et Registered Land (Amendment) Act de 2023 : connus par un article d'opinion (antigua.news, janvier 2025), textes non lus.", "Recours visant la loi n° 6 de 2018 : aucun trouvé ; l'article de Human Rights Watch (juillet 2018) décrit encore le projet d'abrogation comme en discussion au Sénat, alors que la loi a été votée le 8 mai et promulguée le 31 mai 2018.", "Le texte consolidé de la loi de 1976 consulté sur laws.gov.ag est antérieur aux modifications de 2007 (annexe 2 de la loi foncière) ; l'état en vigueur n'a pas été vérifié.", "Demande de séparation adressée par le Conseil au gouvernement en 2020 : article de presse inaccessible lors de la recherche.", "Aucun document de l'ONU ni d'un mécanisme régional visant le statut de Barbuda n'a été lu ; des préoccupations d'experts de l'ONU sont signalées par une ONG sans référence.", "Nombre de villages : non trouvé dans une source officielle."]
