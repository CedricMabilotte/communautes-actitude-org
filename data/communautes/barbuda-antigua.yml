resume: >-
  Barbuda est la seconde île de l'État d'Antigua-et-Barbuda. La Constitution de 1981 (art. 123) y établit un Conseil, « organe principal de gouvernement local » de l'île, dont la loi constitutive de 1976 ne peut être modifiée sans le consentement du Conseil donné par résolution. Le Barbuda Land Act de 2007, en vigueur depuis le 2 mai 2011, disposait que toutes les terres de l'île appartiennent en commun au peuple de Barbuda et soumettait les grands projets au consentement des Barbudiens. La loi n° 41 de 2017, promulguée en janvier 2018, a remplacé ce régime par la possibilité d'acheter des parcelles en pleine propriété et a supprimé la consultation des habitants ; la loi n° 6 de 2018 a ensuite abrogé la loi de 2007 et celle de 2017. En 2022, le Conseil privé de Londres (dernière juridiction d'appel du pays) a rejeté le recours de deux Barbudiens qui invoquaient la loi de 2007 contre un bail touristique.
