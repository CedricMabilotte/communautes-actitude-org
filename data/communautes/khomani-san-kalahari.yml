resume: >-
  Les ‡Khomani San, expulsés du parc national du Kalahari Gemsbok créé en 1931 (expulsions achevées en 1956 selon Roger Chennells, situées dans les années 1970 par le Rapporteur spécial de l'ONU), ont déposé une demande de restitution foncière au titre de la loi Restitution of Land Rights Act n° 22 de 1994 (loi sur la restitution des droits fonciers). Le règlement de mars 1999 leur a restitué six fermes au sud du parc, détenues par une association de propriété communale (Communal Property Association, CPA : personne morale qui détient des terres au nom de ses membres). Un second accord, conclu en 2002 pour 99 ans avec la communauté de Mier et l'office des parcs nationaux SANParks, porte sur des terres et des droits dans le parc, gérés par un conseil de gestion conjoint au sein du parc patrimonial !Ae!Hai Kalahari. En 2024, la CPA ‡Khomani San compte 770 membres et détient 33 759 ha.
  Le régime des parcs restitués est décrit dans la fiche « Terres restituées en parcs nationaux d'Afrique du Sud ».
