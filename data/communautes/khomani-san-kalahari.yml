droits:
  autogouvernement: {valeur: "partiel", note: "La CPA ‡Khomani San (n° 99/0146/A) est une personne morale dirigée par un comité élu par ses membres (loi n° 28 de 1996, art. 1 (iii) et annexe, point 13) ; elle ne gouverne que ses biens et reste sous contrôle administratif : en 2023-2024, le ministère lui a fourni une médiation (Land Rights Management Facility) pour la mise à jour des membres et l'élection du comité.", source: "https://www.dlrrd.gov.za/phocadownloadpap/Annual_Report/CPA%20Annual%20Report%202023-24.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La constitution de l'association « shall be a legally binding agreement between the association and its members » (loi n° 28 de 1996, art. 8 (6) (e)) ; elle fixe l'usage des biens communs, l'adhésion et l'élection du comité, et toute modification exige l'accord écrit de l'administration.", source: "https://www.gov.za/sites/default/files/gcis_document/201409/act28of1996.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La loi n° 22 de 1994 ouvre la restitution aux communautés (art. 1 (iv) et 2 (1)) et permet de fixer la manière dont les droits sont détenus (art. 35 (2) (c)) ; le règlement de 1999 a rendu six fermes aux ‡Khomani San, et la CPA détient 33 759,3769 ha selon le rapport annuel 2023-2024.", source: "https://www.dlrrd.gov.za/phocadownloadpap/Annual_Report/CPA%20Annual%20Report%202023-24.pdf"}
  ressources: {valeur: "partiel", note: "L'accord !Ae!Hai Kalahari de 2002 met en œuvre les droits d'usage des ressources et les droits culturels des ‡Khomani San (« Khomani San Resource Use and Cultural Rights ») dans le parc national du Kalahari Gemsbok et prévoit un partage à trois des revenus du lodge !Xaus ; la gestion quotidienne de la conservation reste à SANParks, sous un conseil de gestion conjoint. L'UNESCO décrit des « symbolic and cultural rights » incluant « resource use and traditional hunting rights » dans une grande partie du parc.", source: "https://pmg.org.za/committee-meeting/23156/"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "La Constitution de 1996 charge le Conseil panafricain des langues de promouvoir le développement et l'usage des langues khoi, nama et san (art. 6 (5) (a) (ii)), sans leur donner de statut officiel.", source: "https://www.gov.za/sites/default/files/images/a108-96.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2004, la Commission sud-africaine des droits de l'homme constate une « situation of disarray » et une gestion « incoherent » des terres restituées, constat repris par le Rapporteur spécial de l'ONU en 2005 (par. 40 à 42). Le rapport annuel 2023-2024 des CPA classe la CPA ‡Khomani San parmi les associations non conformes (ni états financiers, ni assemblée générale, ni liste du comité, ni liste des membres) et note que le mandat des avocats chargés d'organiser l'élection du comité a expiré avant le scrutin.", source: "https://www.dlrrd.gov.za/phocadownloadpap/Annual_Report/CPA%20Annual%20Report%202023-24.pdf"}
chronologie:
  - {annee: 1931, evenement: "Création du parc national du Kalahari Gemsbok ; les derniers San résidents en sont expulsés en 1956 selon Roger Chennells (2001), dans les années 1970 selon le Rapporteur spécial de l'ONU."}
  - {annee: 1994, evenement: "Loi n° 22 sur la restitution des droits fonciers."}
  - {annee: 1996, evenement: "Loi n° 28 sur les associations de propriété communale ; la Constitution (art. 6 (5)) mentionne les langues khoi, nama et san."}
  - {annee: 1999, evenement: "Règlement de la première phase de la revendication (mars) : six fermes restituées au sud du parc."}
  - {annee: 2000, evenement: "Création du parc transfrontalier de Kgalagadi (mai), selon Peace Parks."}
  - {annee: 2002, evenement: "Seconde phase : accord du parc patrimonial !Ae!Hai Kalahari avec la communauté de Mier et SANParks, en vigueur le 28 mai pour 99 ans, conseil de gestion conjoint."}
  - {annee: 2004, evenement: "Rapport de la Commission sud-africaine des droits de l'homme sur les violations des droits de l'homme dans la communauté ‡Khomani San (novembre)."}
  - {annee: 2005, evenement: "Mission du Rapporteur spécial de l'ONU (juillet-août) ; visite à Andriesvale."}
  - {annee: 2017, evenement: "Inscription du paysage culturel ǂKhomani (959 100 ha) sur la liste du patrimoine mondial de l'UNESCO."}
  - {annee: 2024, evenement: "Rapport annuel 2023-2024 des CPA : 770 membres, 33 759 ha, association non conforme, médiation sur les membres et l'élection du comité."}
fiabilite:
  verifie: ["Expulsion des années 1970, règlement de 1999 (six fermes), seconde phase de 2002, CPA, constats de la Commission sud-africaine des droits de l'homme et recommandation par. 92 (E/CN.4/2006/78/Add.2, documents.un.org).", "N° d'enregistrement 99/0146/A, 770 membres, 33 759,3769 ha, non-conformité et médiation de 2023-2024 (rapport annuel des CPA 2023-2024, partie Cap-du-Nord, p. 76 et 79).", "Art. 1, 2 (1) et 35 (2) (c) de la loi n° 22 de 1994 (Journal officiel n° 16106).", "Art. 1 (iii), 8 (6) (e), 8 (10) et annexe, point 13, de la loi n° 28 de 1996 (Journal officiel n° 17205).", "Art. 6 (5) de la Constitution de 1996.", "Droits symboliques et culturels, droits d'usage des ressources et de chasse, conseil de gestion conjoint du parc patrimonial !Ae!Hai Kalahari, surface du bien du patrimoine mondial (whc.unesco.org).", "Accord tripartite de 99 ans en vigueur le 28 mai 2002, droits d'usage des ressources et droits culturels, partage à trois des revenus du lodge !Xaus (exposé de SANParks au Parlement, 30 août 2016, PMG).", "Expulsion des derniers San résidents du parc en 1956 (Chennells, Forest Peoples Programme, 2001)."]
  non_confirme: ["Date de l'expulsion : 1956 selon Chennells (2001), années 1970 selon le Rapporteur spécial (2005), qui parle du « then Kgalagadi Transfrontier Park », nom donné au parc en 2000.", "Lodge Dawid Kruiper : SANParks le présente comme en construction, sans date ; versement de revenus non vérifié.", "Surface restituée en 1999 : environ 35 000 ha (Peace Parks), 38 000 ha (Cultural Survival) ou 40 000 ha (Rapporteur spécial, Forest Peoples Programme).", "Surface de la seconde phase : 25 000 ha en « contract park » selon le Rapporteur spécial et Cultural Survival, environ 60 000 ha dans le parc selon Peace Parks ; le texte de l'accord de 2002 n'a pas été consulté.", "Population : environ 1 000 ‡Khomani San selon la documentation remise au Rapporteur spécial (2005), environ 1 500 selon Cultural Survival, environ 300 co-propriétaires au moment du règlement de 1999 selon le Rapporteur spécial.", "Reconnaissance d'une communauté ou d'un chef ‡Khomani au titre de la loi n° 3 de 2019 sur le leadership traditionnel et khoi-san : aucune source trouvée.", "Les observations finales du CERD (2016), du CDESC (2018) et du Comité des droits de l'homme (2016) visent les Khoi-San en général sans nommer les ‡Khomani.", "Nombre de villages ou de localités habitées : aucune source trouvée."]
