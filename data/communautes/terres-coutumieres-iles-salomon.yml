droits:
  autogouvernement: {valeur: "partiel", note: "Le groupe foncier coutumier est défini comme un clan, une lignée, une communauté ou un groupe qui possède la terre coutumière ou exerce sur elle des droits primaires selon la coutume (art. 2 de la loi de 1994) ; l'inscription consigne le nom des représentants qui agissent pour le groupe et la manière dont ils sont nommés, révoqués et remplacés (art. 11 (1) (d) et (e)). La Constitution demande au Parlement de prendre en compte le rôle des chefs traditionnels dans les provinces (art. 114 (2) (b)). Aucune institution de gouvernement propre n'est créée.", source: "https://faolex.fao.org/docs/pdf/sol35643.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le droit coutumier fait partie du droit des Îles Salomon, sauf s'il contredit la Constitution ou une loi (Constitution, annexe 3, par. 3) ; la manière de détenir, d'occuper, d'utiliser et de céder la terre coutumière et toute transaction la concernant suivent l'usage coutumier en vigueur (art. 239 et 240 de la loi sur la terre et les titres).", source: "https://www.constituteproject.org/constitution/Solomon_Islands_2018"}
  justice_propre: {valeur: "partiel", note: "Les tribunaux locaux ont une compétence exclusive pour les affaires civiles touchant la terre coutumière (art. 254 de la loi sur la terre et les titres) ; l'appel va à une cour d'appel des terres coutumières où les avocats ne sont pas admis (art. 255 (6)), puis à la Haute Cour pour les seules erreurs de droit, à l'exclusion des points de droit coutumier, ou pour vice de procédure (art. 256 (3)). Lors de l'inscription, un différend de limites non réglé par négociation entre les chefs des groupes est tranché par les chefs traditionnels, dont la décision est définitive (art. 13 (4) de la loi de 1994).", source: "https://faolex.fao.org/docs/pdf/sol50852.pdf"}
  terres: {valeur: "reconnu", note: "Le droit de détenir un intérêt perpétuel sur la terre appartient aux Salomonais et aux seules autres personnes désignées par le Parlement (Constitution, art. 110) ; nul autre qu'un Salomonais ne peut détenir un intérêt sur la terre coutumière, sauf s'il l'acquiert selon l'usage coutumier du fait d'un mariage avec un Salomonais ou par héritage, et tout contrat contraire est nul (art. 241 de la loi sur la terre et les titres). Une fois l'inscription finalisée, les droits primaires du groupe ne peuvent être remis en cause hors des cas prévus par la loi (art. 15 de la loi de 1994), et le groupe peut utiliser, occuper et céder sa terre selon l'usage coutumier (art. 20). La terre coutumière peut être vendue ou louée à l'État ou à une assemblée provinciale (art. 60 de la loi sur la terre et les titres) ou acquise par voie forcée (Constitution, art. 112).", source: "https://faolex.fao.org/docs/pdf/sol35643.pdf"}
  ressources: {valeur: "partiel", note: "Les minéraux appartiennent au peuple et au gouvernement des Îles Salomon (art. 2 de la loi sur les mines) ; les propriétaires coutumiers négocient l'accès de surface et perçoivent loyers et indemnités (art. 21 et 32). Pour le bois, une réunion avec les propriétaires coutumiers fixe la nature des droits accordés et le partage des profits (art. 8 (3) de la loi sur les ressources forestières). La loi de 2015 sur les pêches reconnaît les droits coutumiers (art. 21 (1)) et permet aux titulaires de droits coutumiers d'établir un plan communautaire de gestion des pêches pour leur zone, soumis à l'approbation de l'exécutif provincial et du directeur des pêches (art. 18).", source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
  consentement: {valeur: "partiel", note: "Avant toute acquisition forcée de terre coutumière, la loi doit prévoir une négociation préalable avec le propriétaire, son accès à un conseil juridique indépendant et, si possible, un intérêt à durée limitée (Constitution, art. 112). La reconnaissance minière (repérage préalable) est soumise au consentement des propriétaires (art. 17 de la loi sur les mines) et la licence de prospection à un accord d'accès conclu avec eux (art. 21) ; pour l'exploitation, l'État peut recourir à l'acquisition forcée si la négociation échoue (art. 33). Sans accord des propriétaires coutumiers, la demande de droits de coupe de bois est rejetée (art. 9 (1) de la loi sur les ressources forestières). Pêcher dans une zone de droits coutumiers avec un navire autre que ceux de la pêche coutumière exige l'autorisation des titulaires (art. 21 (2) de la loi de 2015 sur les pêches), et la déclaration d'une aire marine dans une telle zone exige leur accord (art. 19 (4)).", source: "https://www.constituteproject.org/constitution/Solomon_Islands_2018"}
