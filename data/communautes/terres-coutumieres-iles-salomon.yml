resume: >-
  Fiche agrégée : elle couvre les groupes fonciers coutumiers (clans, lignées, communautés) qui détiennent la terre coutumière des Îles Salomon. La loi sur la terre et les titres (Land and Titles Act, chap. 133) définit la terre coutumière comme la terre légalement possédée, utilisée ou occupée par une personne ou une communauté selon l'usage coutumier en vigueur, et réserve tout intérêt sur cette terre aux Salomonais, sauf mariage ou héritage (art. 241). La Constitution de 1978 attribue aux Salomonais, et aux seules autres personnes désignées par le Parlement, le droit de détenir un intérêt perpétuel (c'est-à-dire sans limite de durée) sur la terre (art. 110) et fait du droit coutumier une partie du droit (annexe 3). La loi de 1994 sur l'inscription des terres coutumières (Customary Land Records Act, chap. 132) permet à tout groupe foncier coutumier de faire inscrire ses droits primaires et les limites de sa terre auprès du bureau provincial.
