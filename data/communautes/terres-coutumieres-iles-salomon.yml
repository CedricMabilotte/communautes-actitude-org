  verifie: ["Art. 75, 76, 110 à 112 et 114 et annexe 3 de la Constitution (Constitute Project, version révisée de 2018).", "Texte de la loi de 1994 sur l'inscription des terres coutumières, art. 2, 4, 9, 11, 13, 15 et 20, et date d'entrée en vigueur (FAOLEX, édition révisée de 1996).", "Art. 2, 60 à 69, 239 à 242 et 254 à 256 de la loi sur la terre et les titres (FAOLEX, édition révisée de 1996).", "Art. 2, 17, 21, 32 et 33 de la loi sur les mines, art. 7 à 9 de la loi sur les ressources forestières, art. 17 à 19 et 21 de la loi de 2015 sur les pêches (FAOLEX).", "Part de 80 % des terres détenues dans le système coutumier, p. 106 du sixième rapport national à la CDB (2019).", "Mention du projet de loi sur les panels de règlement des différends fonciers dans le rapport national à l'Examen périodique universel (A/HRC/WG.6/24/SLB/1, 2015)."]
  non_confirme: ["Part des terres coutumières : 87 % selon l'étude australienne Making Land Work (AusAID, 2008), citée par une encyclopédie en ligne, contre 80 % selon le rapport national à la CDB (2019) ; aucune surface en km² n'est publiée par une source ouverte, d'où l'absence de surface.", "Adoption d'une loi sur le règlement des différends fonciers coutumiers en 2022 : aucun texte officiel ouvert.", "Nombre de zones déclarées au titre de l'art. 4 de la loi de 1994 et nombre de groupes inscrits : aucune source publique trouvée, d'où l'absence de tableau des sites.", "Rôle des chefs comme instance préalable obligatoire devant les tribunaux locaux (art. 12 à 14 de la loi sur les tribunaux locaux, modifiée en 1985) : texte non consulté (PacLII inaccessible).", "Entrée en vigueur de la loi de 2000 sur la reconnaissance de la coutume (Customs Recognition Act, n° 7 de 2000) : non confirmée.", "Hors du sixième rapport national à la CDB, aucun document onusien nommant le régime de la terre coutumière n'a été trouvé ; le rapport national à l'Examen périodique universel n'est pas un mécanisme de la liste du cadre.", "Nombre de villages : non trouvé ; le rapport national du recensement de 2019 ne publie pas de décompte des villages."]
