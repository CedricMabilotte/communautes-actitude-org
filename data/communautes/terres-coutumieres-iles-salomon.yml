effectivite: {valeur: "non_etablie", note: "Aucune donnée publique sur le nombre de groupes inscrits au titre de la loi de 1994 n'a été trouvée. Le rapport national des Îles Salomon à l'Examen périodique universel (2015) fait état de consultations sur un projet de loi instituant des panels de règlement des différends fonciers coutumiers associant chefs et aînés. Une analyse de Devpolicy (2020) relève que le site de Rennell-Est, premier site du patrimoine mondial sous propriété et gestion coutumières, a été inscrit sur la liste du patrimoine en péril en raison de l'exploitation forestière et minière, des espèces invasives et du changement climatique.", source: "https://devpolicy.org/conservation-complexities-in-east-rennell-solomon-islands-20201029-2/"}
chronologie:
  - {annee: 1972, evenement: "Loi n° 18 de 1972 : compétence des tribunaux locaux sur la terre coutumière et création des cours d'appel des terres coutumières (art. 254 à 256 de la loi sur la terre et les titres)."}
  - {annee: 1977, evenement: "Loi n° 11 de 1977 : définition du Salomonais et déclaration de terres publiques comme terres coutumières (art. 242)."}
  - {annee: 1978, evenement: "Constitution de l'indépendance : intérêt perpétuel sur la terre réservé aux Salomonais (art. 110), droit coutumier partie du droit (annexe 3)."}
  - {annee: 1985, evenement: "Loi n° 9 de 1985 modifiant la compétence des tribunaux locaux en matière de terre coutumière."}
  - {annee: 1995, evenement: "Entrée en vigueur, le 28 février, de la loi de 1994 sur l'inscription des terres coutumières."}
  - {annee: 2015, evenement: "Loi sur la gestion des pêches : reconnaissance des droits coutumiers et plans communautaires de gestion des pêches."}
  - {annee: 2015, evenement: "Rapport national à l'Examen périodique universel : consultations sur le projet de loi sur les panels de règlement des différends fonciers coutumiers (Tribal Lands Dispute Resolution Panels Bill)."}
