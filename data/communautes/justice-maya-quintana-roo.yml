resume: >-
  L'État du Quintana Roo a institué en 1997 un système de justice autochtone (Sistema de Justicia Indígena) pour les communautés mayas de la Zone maya. Des juges traditionnels, nommés par le Tribunal supérieur de justice sur proposition d'un conseil où siègent cinq représentants des centres cérémoniels mayas, appliquent le droit coutumier maya. Ils jugent des affaires civiles, familiales et pénales sans gravité ; leurs accords et sentences arbitrales ont force de chose jugée (décision définitive). Le recours à cette justice reste un choix des parties, la voie judiciaire ordinaire restant ouverte.
