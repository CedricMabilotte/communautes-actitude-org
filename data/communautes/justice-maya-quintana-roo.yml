  - {instrument: "Loi de justice autochtone de l'État du Quintana Roo (Ley de Justicia Indígena, décret 079, POE du 14 août 1997, dernière réforme du 31 décembre 2012)", nature: "loi", annee: 1997, source: "https://documentos.congresoqroo.gob.mx/leyes/L1320121231234.pdf"}
  - {instrument: "Loi des droits, de la culture et de l'organisation autochtone de l'État du Quintana Roo (décret 140, POE du 31 juillet 1998, dernière réforme du 24 août 2022)", nature: "loi", annee: 1998, source: "https://documentos.congresoqroo.gob.mx/leyes/L76-XVI-20220824-L1620220824246-ley-derechos.pdf"}
