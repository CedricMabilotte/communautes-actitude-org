droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution de l'État (art. 13 A III) reconnaît l'élection des autorités selon les normes propres ; la loi de 1998 (art. 44 à 55) reconnaît cinq centres cérémoniels mayas et le Grand Conseil maya, dont les autorités doivent respecter les accords (art. 54).", source: "https://documentos.congresoqroo.gob.mx/leyes/L76-XVI-20220824-L1620220824246-ley-derechos.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution de l'État (art. 13 A II) reconnaît l'application des systèmes normatifs propres aux conflits internes, sous validation des juges ; la loi de justice autochtone (art. 10) charge les juges traditionnels d'appliquer le droit coutumier dans le respect des droits humains.", source: "https://documentos.congresoqroo.gob.mx/leyes/L1320121231234.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi de justice autochtone de 1997 crée des juges traditionnels compétents en matière civile, familiale et pénale pour les délits non graves (art. 14 à 18) ; ils sont désignés par le Tribunal supérieur de justice de l'État sur proposition du Conseil de la magistrature de la justice autochtone, présidé par un magistrat de l'État et formé de représentants des cinq centres cérémoniels (art. 8 et 9) ; leurs accords et sentences arbitrales ont force de chose jugée (art. 12), la voie ordinaire reste ouverte (art. 6 et 11) et les recours vont aux magistrats des affaires autochtones (art. 30).", source: "https://documentos.congresoqroo.gob.mx/leyes/L1320121231234.pdf"}
  terres: {valeur: "non_etabli", note: "La Constitution de l'État (art. 13 A V) reconnaît seulement le droit de préserver l'intégrité des terres dans les termes de la Constitution fédérale ; aucun titre, aucune délimitation ni aucun droit collectif d'usage propre à ce régime n'a été trouvé.", source: "https://documentos.congresoqroo.gob.mx/leyes/L176-XVIII-20260622-CN1820260622007-Constitución-(1).pdf"}
  ressources: {valeur: "partiel", note: "La Constitution de l'État (art. 13 A VI) accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://documentos.congresoqroo.gob.mx/leyes/L176-XVIII-20260622-CN1820260622007-Constitución-(1).pdf"}
  consentement: {valeur: "partiel", note: "La Constitution de l'État (art. 13 B IX) impose de consulter les peuples autochtones sur les plans de développement ; la loi de 1998 (art. 3) prévoit une consultation préalable sur ces plans et sur les programmes éducatifs.", source: "https://documentos.congresoqroo.gob.mx/leyes/L76-XVI-20220824-L1620220824246-ley-derechos.pdf"}
  langue: {valeur: "partiel", note: "La Constitution de l'État (art. 13, dernier alinéa) impose la publication des lois au journal officiel en langue maya ; la loi de justice autochtone (art. 9) exige des juges traditionnels qu'ils parlent la langue de la communauté.", source: "https://documentos.congresoqroo.gob.mx/leyes/L176-XVIII-20260622-CN1820260622007-Constitución-(1).pdf"}
  education: {valeur: "partiel", note: "La Constitution de l'État (art. 13 B II) prévoit une éducation bilingue interculturelle et des programmes régionaux définis en consultation ; la loi de 1998 (art. 23) garantit l'accès à l'éducation de base bilingue.", source: "https://documentos.congresoqroo.gob.mx/leyes/L176-XVIII-20260622-CN1820260622007-Constitución-(1).pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution de l'État (art. 13 B I) prévoit des dotations municipales administrées directement par les communautés ; la loi de justice autochtone (art. 3) impose une ligne budgétaire distincte pour la justice autochtone dans le budget du pouvoir judiciaire.", source: "https://documentos.congresoqroo.gob.mx/leyes/L176-XVIII-20260622-CN1820260622007-Constitución-(1).pdf"}
  representation: {valeur: "non_etabli", note: "La Constitution de l'État (art. 13 A VII, réforme de 2025) prévoit l'élection, selon les normes propres, d'un représentant autochtone au conseil municipal, avec voix consultative ; cette représentation reste municipale, et aucun siège réservé au Congrès de l'État n'a été trouvé.", source: "https://documentos.congresoqroo.gob.mx/leyes/L176-XVIII-20260622-CN1820260622007-Constitución-(1).pdf"}
  statut_personnel: {valeur: "partiel", note: "La loi de justice autochtone (art. 16 I) reconnaît la validité des mariages mayas pour l'application de la justice autochtone ; la loi de 1998 (art. 6) permet d'attester la qualité d'autochtone par une attestation du juge traditionnel.", source: "https://documentos.congresoqroo.gob.mx/leyes/L1320121231234.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Manuel Buenrostro Alba (revue Diario de Campo, INAH), 17 tribunaux traditionnels fonctionnent dans les communautés mayas et privilégient la réparation et le travail communautaire ; l'auteur relève, avec Francisco López Bárcenas, que le système reproduit la structure judiciaire de l'État et que la reconnaissance des juges s'arrête au niveau local.", source: "https://revistas.inah.gob.mx/index.php/diariodecampo/article/download/5725/6571/10843"}
chronologie:
  - {annee: 1997, evenement: "Réforme de l'article 13 de la Constitution de l'État (août) et publication de la loi de justice autochtone au journal officiel de l'État (14 août)."}
  - {annee: 1997, evenement: "Décret 090 du 14 novembre : réforme des articles 8 (conseil de la magistrature de la justice autochtone) et 29 (règles générales du Tribunal supérieur de justice) de la loi de justice autochtone."}
  - {annee: 1998, evenement: "Loi des droits, de la culture et de l'organisation autochtone (31 juillet) : reconnaissance des centres cérémoniels et du Grand Conseil maya. Ouverture des premiers tribunaux traditionnels et nomination des premiers juges."}
  - {annee: 2008, evenement: "Selon Buenrostro Alba, 1 850 audiences tenues depuis 1998, dont 384 affaires pénales, 170 familiales et 78 civiles."}
  - {annee: 2012, evenement: "Réforme de la loi de justice autochtone (31 décembre) : rédaction au masculin et au féminin (juges et juges femmes), définition des mariages forcés et concertés, règles sur la violence familiale."}
  - {annee: 2025, evenement: "Réforme de l'article 13 de la Constitution de l'État (19 mars) : le système de justice autochtone de la Zone maya y est réaffirmé."}
fiabilite:
  verifie: ["Texte de la loi de justice autochtone (version du 31 décembre 2012) sur le site du Congrès de l'État.", "Texte de l'article 13 de la Constitution de l'État (version de juin 2026).", "Articles 3, 6, 23 et 44 à 59 de la loi des droits, de la culture et de l'organisation autochtone (version de 2022).", "Mention du Quintana Roo dans le rapport E/CN.4/2004/80/Add.2.", "Nombre de tribunaux traditionnels (17) et d'audiences tenues de 1998 à 2008 (1 850) dans Buenrostro Alba, Nueva Antropología, 2013."]
  non_confirme: ["Nombre actuel de tribunaux traditionnels : 17 en 2013 selon Buenrostro Alba (Nueva Antropología) ; aucune liste officielle récente consultée.", "Date de la réforme constitutionnelle de 1997 : donnée par Buenrostro Alba (août 1997), absente de l'historique de l'article 13 publié par le Congrès.", "Compétence des juges sur les litiges de terres ejidales (propriété agraire collective) : la loi ne la prévoit pas expressément.", "Population servie par les juges traditionnels : non publiée. Le recensement INEGI 2020 compte 204 949 personnes de 3 ans et plus parlant une langue autochtone dans tout l'État, toutes langues, Cancún et Chetumal compris ; ce chiffre ne correspond pas à la Zone maya et n'est pas retenu.", "Nombre de villages : non trouvé ; la Zone maya n'a pas de délimitation légale consultée (Buenrostro Alba cite en 2013 les municipalités de Solidaridad, Felipe Carrillo Puerto, José María Morelos et Lázaro Cárdenas).", "Superficie de la Zone maya : non trouvée."]
