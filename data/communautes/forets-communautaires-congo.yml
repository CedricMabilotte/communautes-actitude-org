resume: >-
  Fiche agrégée : elle couvre les communautés locales et les populations autochtones titulaires d'une forêt communautaire ou riveraines d'une série de développement communautaire en République du Congo. La loi n° 33-2020 du 8 juillet 2020 portant Code forestier range les forêts communautaires dans le domaine forestier permanent, qui fait partie du domaine forestier de l'État (art. 9 et 10), en délègue la gestion aux communautés selon un plan simple de gestion (document qui programme les activités dans la forêt) et leur attribue les revenus de la vente des produits forestiers (art. 10, 15, 18 et 19). La série de développement communautaire est la partie d'une concession forestière aménagée réservée aux activités des communautés riveraines ; elle est obligatoire dans chaque plan d'aménagement (art. 78) et délimitée en concertation avec les communautés (art. 79). Des arrêtés publiés entre 2010 et 2019 instituent, pour treize concessions, un conseil de concertation qui adopte le plan de gestion de la série et un fonds de développement local alimenté par une redevance du concessionnaire. L'arrêté n° 3831 du 8 septembre 2025 fixe les directives d'aménagement simplifié d'une forêt communautaire, dont une taille maximale de 5 000 hectares hors séries de développement communautaire ; l'arrêté du ministre prévu pour l'attribution des forêts communautaires (art. 17) n'a pas été trouvé.
  Les droits reconnus aux peuples autochtones par la loi n° 5-2011 relèvent de la fiche « Peuples autochtones de la République du Congo ».
