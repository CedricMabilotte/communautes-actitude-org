droits:
  autogouvernement: {valeur: "partiel", note: "Le suivi de la gestion d'une forêt communautaire relève d'un organe placé sous l'autorité du président du conseil départemental ou municipal, où siègent des représentants des communautés locales et des populations autochtones aux côtés de la société civile, des collectivités locales et des services administratifs (Code forestier de 2020, art. 16). Dans les séries de développement communautaire, un conseil de concertation comprend des représentants élus des villages (56 pour l'unité forestière d'aménagement Djua-Ikié, dont au moins cinq semi-nomades et cinq femmes), mais il est présidé par un représentant du conseil départemental et compte des représentants de l'administration et du concessionnaire (arrêté n° 15945 du 10 septembre 2019, art. 3).", source: "https://faolex.fao.org/docs/pdf/con191223.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil de concertation adopte le plan de gestion de la série de développement communautaire et approuve les microprojets (arrêté n° 15945 de 2019, art. 2) ; le plan de gestion de chaque série est soumis à la validation de l'administration forestière (Code forestier de 2020, art. 87). Le plan simple de gestion d'une forêt communautaire est élaboré par l'administration forestière, à la diligence des communautés, qui peuvent se faire assister par un organisme de leur choix, et approuvé par le directeur départemental des eaux et forêts (art. 15 et 88) ; une commission créée par arrêté préfectoral valide ce plan, les communautés concernées n'y prenant part qu'à titre consultatif (arrêté n° 3831 de 2025, art. 9 et 10).", source: "https://www.sgg.cg/textes-officiels/arretes/2025/congo-arrete-2025-3831.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire, une fois créée, est incluse dans le domaine forestier permanent de l'État (Code forestier de 2020, art. 10 et 18) ; elle peut être une forêt naturelle située sur le terroir (espace traditionnellement occupé) d'une communauté locale et des populations autochtones et classée à leur profit, une plantation sur ce terroir, une forêt créée à l'initiative d'une communauté locale ou la forêt naturelle de la série de développement communautaire d'une concession (art. 15). La loi ne fixe ni durée d'attribution ni surface maximale ; l'arrêté n° 3831 du 8 septembre 2025 limite la forêt communautaire à 5 000 hectares, ou à la surface de forêt naturelle de la série de développement communautaire quand elle s'y trouve (art. 4).", source: "https://www.sgg.cg/textes-officiels/arretes/2025/congo-arrete-2025-3831.pdf"}
  ressources: {valeur: "partiel", note: "Les revenus de la vente des produits forestiers des forêts communautaires reviennent aux communautés locales et aux populations autochtones concernées (Code forestier de 2020, art. 19) ; l'exploitation du bois à but lucratif reste soumise à un permis spécial ou à un permis de coupe de bois de plantation (art. 20) ; les produits forestiers non ligneux relèvent du droit d'usage pour les besoins domestiques (art. 21) ; les crédits carbone générés dans une forêt communautaire appartiennent à la communauté, seule ou avec le tiers qui conduit le projet (art. 180).", source: "https://www.sgg.cg/codes/congo-code-2020-forestier.pdf"}
  consentement: {valeur: "partiel", note: "Les communautés locales et les populations autochtones expriment leur consentement libre, informé et préalable aux décisions qui les concernent en matière de gestion forestière (Code forestier de 2020, art. 5) ; la série de développement communautaire est délimitée en concertation avec elles (art. 79) ; le décret n° 2023-118 du 4 avril 2023 organise ce consentement pour le classement d'une forêt, recueilli par leurs institutions représentatives sur une période d'au plus trois mois (art. 3, 4 et 7).", source: "https://faolex.fao.org/docs/pdf/con218670.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La taxe sur les produits forestiers non ligneux, la taxe d'occupation et une quotité de la taxe de superficie sont prélevées au profit des collectivités locales, des communautés locales et des populations autochtones (Code forestier de 2020, art. 112) ; les droits et taxes affectés aux communautés alimentent le fonds de développement local, auquel contribue aussi le concessionnaire (art. 115 et 116). Pour l'unité forestière d'aménagement Djua-Ikié, le fonds reçoit une redevance de 200 FCFA par mètre cube exploité et le président du conseil de concertation, représentant du conseil départemental, en est l'ordonnateur (arrêté n° 15944 du 10 septembre 2019, art. 2 et 6).", source: "https://faolex.fao.org/docs/pdf/con191221.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Rapporteuse spéciale sur les droits des peuples autochtones (2020, par. 80) décrit la foresterie communautaire comme une pratique déjà en cours au Congo, qui permet aux communautés locales et aux populations autochtones de gérer collectivement des ressources forestières, et demande qu'elle reste temporaire pour les populations autochtones en attendant la reconnaissance de leur droit collectif sur leurs forêts. ClientEarth (novembre 2020) relève que la procédure d'attribution et la durée sont renvoyées à des textes d'application ; les directives d'aménagement simplifié ont été publiées en septembre 2025, mais aucun arrêté d'attribution ni décompte des forêts communautaires attribuées n'a été trouvé. Des conseils de concertation et des fonds de développement local sont institués par arrêté pour treize séries de développement communautaire (2010 à 2019) ; aucune évaluation de leur fonctionnement n'a été trouvée.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/45/34/Add.1&l=fr&t=pdf"}
chronologie:
  - {annee: 2010, evenement: "Arrêtés du 15 avril 2010 : conseils de concertation et fonds de développement local des séries de développement communautaire des unités forestières d'aménagement Pokola, Kabo et Ngombé (Sangha)."}
  - {annee: 2011, evenement: "Arrêtés du 27 juin 2011 pour les séries de Lopola, Loundoungou-Toukoulaka et Mokabi-Dzanga (Likouala)."}
  - {annee: 2014, evenement: "Arrêtés du 5 mars 2014 pour les séries d'Ipendja et de Missa (Likouala)."}
  - {annee: 2019, evenement: "Arrêtés du 10 septembre 2019 pour les séries de Djua-Ikié (Sangha), Nyanga et Ngongo-Nzambi (Niari), Mpoukou-Ogooué et Bambama (Lékoumou)."}
  - {annee: 2020, evenement: "Loi n° 33-2020 du 8 juillet 2020 portant Code forestier : création des forêts communautaires (art. 15 à 21) et obligation d'une série de développement communautaire dans chaque concession aménagée (art. 78)."}
  - {annee: 2020, evenement: "Rapport de la Rapporteuse spéciale sur les droits des peuples autochtones (A/HRC/45/34/Add.1) traitant de la foresterie communautaire."}
  - {annee: 2023, evenement: "Décret n° 2023-118 du 4 avril 2023 sur le consentement libre, informé et préalable en matière de classement d'une forêt."}
  - {annee: 2025, evenement: "Arrêté n° 3831 du 8 septembre 2025 définissant les directives nationales d'aménagement simplifié d'une forêt communautaire (taille maximale, validation et durée du plan simple de gestion)."}
fiabilite:
  verifie:
    - "Articles 2, 5, 10, 15 à 21, 59, 78, 79, 87, 88, 112 à 116 et 179 à 180 du Code forestier dans le Journal officiel (édition spéciale n° 4-2020) publié par le Secrétariat général du Gouvernement."
    - "Articles 1 à 13 du décret n° 2023-118 dans le Journal officiel n° 15-2023 publié par FAOLEX."
    - "Arrêtés de 2010, 2011, 2014 et 2019 sur les conseils de concertation et les fonds de développement local des séries de développement communautaire, dans les copies publiées par FAOLEX ; composition et attributions vérifiées en détail pour Djua-Ikié (arrêtés n° 15944 et 15945 de 2019)."
    - "Articles 1 à 22 de l'arrêté n° 3831 du 8 septembre 2025 dans le Journal officiel n° 38-2025 publié par le Secrétariat général du Gouvernement."
    - "Paragraphes 79 et 80 du rapport A/HRC/45/34/Add.1."
  non_confirme:
    - "Arrêté d'application de l'article 17 du Code forestier (attribution et délimitation des forêts communautaires, organe de suivi) : non trouvé ; l'arrêté n° 3831 de 2025 mentionne un protocole d'accord entre le gestionnaire de la forêt et l'administration forestière (art. 11) sans en fixer le régime ; nombre de forêts communautaires attribuées : non trouvé."
    - "Les arrêtés sur les séries de développement communautaire ont été pris sous la loi n° 16-2000 portant Code forestier ; leur maintien sous le Code de 2020 (art. 259 : abrogation des seules dispositions contraires) n'a pas été vérifié par un texte."
    - "Le tableau reprend les treize séries de développement communautaire pour lesquelles un arrêté de conseil de concertation a été trouvé dans ECOLEX et FAOLEX ; il ne s'agit pas d'une liste officielle et d'autres séries peuvent exister. Les surfaces des séries ne figurent pas dans les arrêtés ouverts."
    - "Aucun document de la Convention sur la diversité biologique nommant le régime n'a été trouvé."
    - "Population, nombre de villages et surface concernés : aucune source trouvée."
