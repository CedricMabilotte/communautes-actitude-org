resume: >-
  La Nation des Anishinabes regroupe des premières nations ojibwées, odawas, potawatomies, algonquines, nipissing, mississaugas et delawares de l'Ontario, représentées par l'Union des Indiens de l'Ontario, fondée en 1949. Deux accords d'autonomie gouvernementale sectorielle (compétence législative limitée à des domaines précis, hors traité au sens de l'article 35 de la Loi constitutionnelle de 1982) ont force de loi fédérale. Depuis le 1er avril 2018, 23 premières nations participantes légifèrent sur l'éducation primaire et secondaire dans leurs réserves et gèrent le système d'éducation anishinabe, coordonné par l'Organisme d'éducation Kinoomaadziwin. Depuis le 1er octobre 2022, les premières nations parties à l'accord sur la gouvernance, huit en 2026, adoptent leur constitution et leurs lois sur les élections, la citoyenneté, la langue et la culture, et la gestion de leur gouvernement ; la Loi sur les Indiens continue de s'appliquer pour le reste.
