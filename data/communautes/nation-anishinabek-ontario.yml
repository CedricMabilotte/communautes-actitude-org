droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque première nation partie à l'accord sur la gouvernance ratifie une constitution qui crée son gouvernement, dirigé par son Ogiimah (chef) et son conseil, Entente sur la gouvernance, art. 1.1 et 5.2 à 5.4 ; la Nation Anishinabek a une constitution, l'Anishinaabe Chi-Naaknigewin, et un organe législatif, le Grand Conseil, art. 1.1 et 4.2 à 4.4. L'accord a force de loi, loi de 2022, art. 4.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1663876084479/1663876161241"}
  pouvoir_normatif: {valeur: "partiel", note: "Les premières nations et la Nation Anishinabek légifèrent sur le choix des dirigeants, la citoyenneté, la langue et la culture, et la gestion du gouvernement, loi de 2022, art. 6 ; les 23 premières nations participantes légifèrent sur l'éducation dans leur réserve, loi de 2017, art. 7. Ces lois l'emportent sur les lois fédérales en cas de conflit, Entente sur la gouvernance, art. 5.11 et 5.22 ; les autres domaines (terres, justice, santé, fiscalité) relèvent de négociations futures, art. 13.1.", source: "https://laws-lois.justice.gc.ca/fra/lois/A-11.31/page-1.html"}
  justice_propre: {valeur: "partiel", note: "Les premières nations et la Nation Anishinabek peuvent établir des processus anishinaabe traditionnels et des sanctions conformes aux coutumes anishinaabe, avec le consentement du contrevenant, Entente sur la gouvernance, art. 6.2 et 6.4 ; elles organisent l'appel ou la révision de leurs décisions, art. 4.35 à 4.37 et 5.40 à 5.42 ; les poursuites relèvent de la Cour de justice de l'Ontario, art. 6.13, et le contrôle judiciaire de la Cour fédérale, art. 6.12.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1663876084479/1663876161241"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le Canada consulte les premières nations par la circulation des ébauches de la loi fédérale et une réponse écrite à leurs commentaires, Entente sur la gouvernance, art. 15.16 et 15.17, et les consulte avant de se lier par un traité international susceptible de porter atteinte à leurs droits, art. 11.12 ; l'Entente sur l'éducation prévoit les mêmes obligations, art. 12.13 et 18.17. Aucun droit de refus n'est prévu.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1663876084479/1663876161241"}
  langue: {valeur: "partiel", note: "Chaque première nation légifère sur la préservation, la promotion et le développement de sa culture et de sa langue, et sa loi l'emporte sur une loi fédérale incompatible, Entente sur la gouvernance, art. 5.20 et 5.22 ; le registre des lois est tenu en anglais et, au choix de la première nation, en anishinaabemowin (langue anishinaabe), art. 5.8. L'anishinaabemowin n'a pas de statut de langue officielle.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1663876084479/1663876161241"}
  education: {valeur: "reconnu", note: "Chaque première nation participante a le pouvoir de légiférer en matière d'éducation primaire, élémentaire et secondaire pour les membres vivant dans sa réserve, Entente sur l'éducation, art. 5.1, et sa loi l'emporte sur une loi fédérale ou provinciale incompatible, art. 12.3 ; l'Organisme d'éducation Kinoomaadziwin fixe les conditions d'obtention des diplômes et sert d'intermédiaire avec l'Ontario, art. 9.4. Les programmes doivent, dans la mesure du possible, être comparables à ceux de l'Ontario pour permettre le transfert des élèves, loi de 2017, art. 8.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1517588283074/1542741544614"}
  fiscalite: {valeur: "partiel", note: "Une entente financière distincte, contrat entre le Canada et la Nation Anishinabek, fixe les transferts liés à la gouvernance, Entente sur la gouvernance, art. 8.5 et 8.6 ; les paiements de transfert en éducation ne peuvent être inférieurs aux paiements de base antérieurs, Entente sur l'éducation, art. 10.8. La fiscalité figure parmi les sujets de négociations futures, Entente sur la gouvernance, art. 13.1.", source: "https://www.rcaanc-cirnac.gc.ca/fra/1663876084479/1663876161241"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Chaque première nation légifère sur la détermination de ses E'Dbendaagzijig (citoyens) et sur leurs droits et responsabilités, Entente sur la gouvernance, art. 5.12 ; les articles 8 à 14 de la Loi sur les Indiens (liste de bande) cessent alors de s'appliquer, loi de 2022, art. 7(2). L'Entente ne confère ni la citoyenneté canadienne ni le droit d'entrée au Canada, Entente sur la gouvernance, art. 3.5.", source: "https://laws-lois.justice.gc.ca/fra/lois/A-11.31/page-1.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'accord sur la gouvernance ne couvre que 8 des 39 premières nations membres en 2026. En février 2020, selon les résultats non officiels rapportés par la presse régionale, la Première Nation de Mississauga l'a rejeté (55 oui, 80 non) et la Première Nation Nipissing n'a pas atteint le seuil de participation requis ; une analyse du Yellowhead Institute (2019) relève le maintien des lois fédérales et provinciales et le renvoi des terres, de la justice et de la fiscalité à des négociations futures. En octobre 2024, le gouvernement fédéral annonce un nouveau financement de plus de 20 millions de dollars par an pour les infrastructures et la gouvernance du système d'éducation anishinabe ; l'Organisme d'éducation Kinoomaadziwin dessert 23 des 39 premières nations, soit environ 2 000 élèves.", source: "https://www.sudbury.com/around-the-north/anishinabek-nation-governance-agreement-shot-down-in-two-first-nations-2133926"}
chronologie:
  - {annee: 1949, evenement: "Fondation de l'Union des Indiens de l'Ontario, organisation politique de la Nation Anishinabek."}
  - {annee: 1995, evenement: "Début des négociations sur la gouvernance ; accord-cadre en 2007."}
  - {annee: 2017, evenement: "Signature de l'Entente sur l'éducation avec le Canada et de l'entente-cadre sur l'éducation avec l'Ontario (16 août) ; loi fédérale sanctionnée le 14 décembre (L.C. 2017, ch. 32)."}
  - {annee: 2018, evenement: "Entrée en vigueur de l'Entente sur l'éducation le 1er avril pour 23 premières nations participantes ; création de l'Organisme d'éducation Kinoomaadziwin."}
  - {annee: 2020, evenement: "Votes de ratification de l'accord sur la gouvernance ; échec à Mississauga (rejet) et à Nipissing (participation sous le seuil requis)."}
  - {annee: 2022, evenement: "Signature de l'Entente sur la gouvernance (6 avril), sanction de la loi (23 juin), entrée en vigueur le 1er octobre pour cinq premières nations : Magnetawan, Moose Deer Point, Nipissing, Wahnapitae et Zhiibaahaasing."}
  - {annee: 2023, evenement: "Le Rapporteur spécial de l'ONU sur les droits des peuples autochtones cite les deux accords dans son rapport sur le Canada (A/HRC/54/31/Add.2)."}
  - {annee: 2024, evenement: "Nouveau financement fédéral de plus de 20 millions de dollars par an pour les infrastructures et la gouvernance du système d'éducation anishinabe, attribué à l'Organisme d'éducation Kinoomaadziwin."}
  - {annee: 2025, evenement: "Aundeck Omni Kaning et Sheshegwaning deviennent parties à l'accord sur la gouvernance (1er avril)."}
  - {annee: 2026, evenement: "Whitefish River devient partie à l'accord sur la gouvernance (1er avril), huitième première nation."}
