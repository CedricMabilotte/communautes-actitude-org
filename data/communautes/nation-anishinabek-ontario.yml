reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le préambule de la Loi sur l'accord en matière de gouvernance conclu avec la Nation des Anishinabes (L.C. 2022, ch. 9) rappelle l'engagement du Canada à mettre en œuvre la Déclaration des Nations unies sur les droits des peuples autochtones et indique que les parties sont d'avis que l'accord contribue à cette mise en œuvre.", annee: 2022, source: "https://laws-lois.justice.gc.ca/fra/lois/A-11.31/page-1.html"}
  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial sur les droits des peuples autochtones, José Francisco Calí Tzay, sur sa visite au Canada (A/HRC/54/31/Add.2, par. 52) : cite l'accord sur l'éducation de la Nation Anishinabek (2017) et l'accord sur la gouvernance (2022) parmi les 35 accords d'autonomie gouvernementale signés depuis 2015.", annee: 2023, source: "https://documents.un.org/doc/undoc/gen/g23/139/13/pdf/g2313913.pdf"}
