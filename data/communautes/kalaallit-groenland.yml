resume: >-
  Le Groenland est un territoire autonome du Royaume de Danemark dont près de 90 % des habitants sont inuit, répartis en trois groupes : Kalaallit, Iivit et Inughuit. La Loi sur l'autonomie du Groenland de 2009 a remplacé le régime d'autonomie interne de 1979. Son préambule reconnaît le peuple du Groenland comme un peuple au sens du droit international, titulaire du droit à l'autodétermination. Le Parlement (Inatsisartut) et le Gouvernement (Naalakkersuisut) exercent le pouvoir législatif et exécutif dans les domaines transférés ; l'indépendance est prévue par l'article 21.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Danemark a voté pour la Déclaration en 2007 ; les Inuit du Groenland sont le peuple autochtone reconnu par l'État.", annee: 2007, source: "https://documents.un.org/doc/undoc/gen/g23/142/04/pdf/g2314204.pdf"}
  - {mecanisme: "oit_169", detail: "Convention ratifiée par le Danemark en 1996, avec une déclaration des gouvernements danois et groenlandais selon laquelle les Inuit du Groenland sont le seul peuple autochtone au sens de la Convention.", annee: 1996, source: "https://documents.un.org/doc/undoc/gen/g23/142/04/pdf/g2314204.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la visite au Danemark et au Groenland (A/HRC/54/31/Add.1), § 6 à 10 et 33 à 39.", annee: 2023, source: "https://www.ohchr.org/en/documents/country-reports/ahrc5431add1-visit-denmark-and-greenland-report-special-rapporteur-rights"}
base_nationale:
  - {instrument: "Constitution du Danemark (1953), art. 28", nature: "constitution", annee: 1953, source: "https://www.constituteproject.org/constitution/Denmark_1953"}
  - {instrument: "Loi n° 473 du 12 juin 2009 sur l'autonomie du Groenland", nature: "statut_autonomie", annee: 2009, source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le pouvoir législatif appartient à l'Inatsisartut et le pouvoir exécutif au Naalakkersuisut dans les domaines transférés, Loi de 2009, art. 1.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les autorités groenlandaises légifèrent dans les domaines qu'elles reprennent selon les listes I et II de l'annexe et dans les autres affaires groenlandaises non réservées, Loi de 2009, art. 1 à 4.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
  justice_propre: {valeur: "partiel", note: "L'administration de la justice, y compris la création de tribunaux, figure à la liste II des domaines transférables, Loi de 2009, annexe ; la justice relève encore du Danemark, et la réforme de 2008 conserve des tribunaux de district à juges non professionnels.", source: "https://documents.un.org/doc/undoc/gen/g23/142/04/pdf/g2314204.pdf"}
  terres: {valeur: "reconnu", note: "Le Groenland décide de l'usage des terres ; les terres sont communes et les municipalités attribuent des droits d'usage (Rapporteur spécial, 2023, § 39).", source: "https://documents.un.org/doc/undoc/gen/g23/142/04/pdf/g2314204.pdf"}
  ressources: {valeur: "reconnu", note: "Les recettes des activités minières au Groenland reviennent aux autorités groenlandaises, Loi de 2009, art. 7 ; le Groenland a repris la compétence sur les ressources minérales en 2010.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
  consentement: {valeur: "reconnu", note: "Les projets de loi et d'ordonnance du gouvernement danois applicables au Groenland doivent être soumis pour avis aux autorités groenlandaises avant leur dépôt, Loi de 2009, art. 17 et 18.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
  langue: {valeur: "reconnu", note: "Le groenlandais est la langue officielle du Groenland, Loi de 2009, art. 20.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
  education: {valeur: "reconnu", note: "L'éducation fait partie des domaines repris par le Groenland (Rapporteur spécial, 2023, § 8).", source: "https://documents.un.org/doc/undoc/gen/g23/142/04/pdf/g2314204.pdf"}
  fiscalite: {valeur: "reconnu", note: "La fiscalité fait partie des domaines repris (Rapporteur spécial, 2023, § 8) ; l'État verse une subvention annuelle de 3 439,6 millions de couronnes (valeur 2009), Loi de 2009, art. 5.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
  representation: {valeur: "reconnu", note: "Deux députés du Folketing (Parlement danois) sont élus au Groenland, Constitution de 1953, art. 28.", source: "https://www.constituteproject.org/constitution/Denmark_1953"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "La décision sur l'indépendance appartient au peuple du Groenland ; l'accord négocié doit être approuvé par l'Inatsisartut, par référendum au Groenland et par le Folketing, Loi de 2009, art. 21.", source: "https://english.stm.dk/media/4vgewyoh/gl-selvstyrelov-uk.pdf"}
effectivite: {valeur: "effective", note: "Le Rapporteur spécial (2023, § 33 à 37) cite l'autonomie du Groenland comme mise en œuvre de l'article 3 de la Déclaration, tout en relevant la dépendance financière envers le Danemark, la place du danois dans l'administration et des consultations internes limitées.", source: "https://documents.un.org/doc/undoc/gen/g23/142/04/pdf/g2314204.pdf"}
chronologie:
  - {annee: 1979, evenement: "Entrée en vigueur du régime d'autonomie interne (loi de 1978)."}
  - {annee: 1996, evenement: "Ratification de la Convention OIT 169 par le Danemark."}
  - {annee: 2009, evenement: "Entrée en vigueur de la Loi sur l'autonomie du Groenland le 21 juin."}
  - {annee: 2010, evenement: "Le Groenland reprend la compétence sur les ressources minérales."}
  - {annee: 2023, evenement: "Présentation d'un projet de constitution au Parlement du Groenland en avril."}
