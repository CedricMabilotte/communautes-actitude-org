resume: >-
  Fiche agrégée : elle couvre les communautés résidentielles (cộng đồng dân cư, ensemble des habitants d'un même village, hameau ou quartier qui partagent des coutumes) reconnues propriétaires de forêts par la loi sur la foresterie n° 16/2017/QH14, en vigueur depuis le 1er janvier 2019. L'État leur attribue sans redevance des forêts de croyance gérées selon la tradition, des forêts de protection et des forêts de production ; depuis le 1er juillet 2025, l'attribution et la reprise relèvent du président du comité populaire de commune (décret n° 131/2025/ND-CP), et non plus du comité populaire de district. La communauté adopte une convention villageoise de protection et de développement de la forêt, ne peut ni diviser la forêt entre ses membres ni céder, louer ou hypothéquer le droit d'usage. En 2024, 1,05 million d'hectares de forêts ont une communauté pour propriétaire, soit environ 7 % de la surface forestière nationale.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Viêt Nam à la Convention sur la diversité biologique (2019) : cite la reconnaissance des communautés comme propriétaires forestiers (art. 8 de la loi sur la foresterie de 2017) et l'attribution sans redevance des forêts de croyance aux communautés qui les gèrent traditionnellement (art. 16) ; mentionne, d'après une étude de 2007, plus de 1,06 million d'hectares de forêt naturelle gérés par des communautés", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/vn-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi sur la foresterie n° 16/2017/QH14 du 15 novembre 2017, en vigueur le 1er janvier 2019 (art. 2.24, 4.6, 8, 14.8, 16, 22, 23, 27, 52, 73, 74, 86)", nature: "loi", annee: 2017, source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
  - {instrument: "Décret n° 131/2025/ND-CP du 12 juin 2025 sur la répartition des compétences de l'administration locale à deux échelons dans les domaines du ministère de l'Agriculture et de l'Environnement, en vigueur du 1er juillet 2025 au 1er mars 2027 (art. 13.2 et 13.4 : attribution et reprise des forêts des communautés résidentielles par le président du comité populaire de commune)", nature: "loi", annee: 2025, source: "https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/6/131nd.signed.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "La communauté à qui l'État attribue une forêt doit élaborer et appliquer une convention villageoise (hương ước, règlement coutumier écrit) de protection et de développement de la forêt, conforme à la loi (art. 86.2.b de la loi de 2017) ; l'attribution est donnée en priorité aux communautés qui ont des conventions villageoises conformes à la loi (art. 14.8).", source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La communauté résidentielle est propriétaire forestier (art. 8.6 de la loi de 2017) et reçoit sans redevance des forêts de croyance, de protection ou de production (art. 16) ; elle ne peut ni diviser la forêt entre ses membres ni transférer, louer, donner ou hypothéquer le droit d'usage (art. 86.2.d et dd), et l'État peut reprendre la forêt (art. 22) ; la loi confiait l'attribution et la reprise au comité populaire de district (art. 23.2), compétence exercée depuis le 1er juillet 2025 par le président du comité populaire de commune (décret n° 131/2025/ND-CP, art. 13.2 et 13.4).", source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
  ressources: {valeur: "partiel", note: "La communauté récolte les produits des forêts attribuées selon les règles de chaque catégorie (art. 86.1.d de la loi de 2017) ; dans une forêt de croyance, le bois ne peut être coupé que pour des usages communs de la communauté, après approbation d'une autorité de l'État (art. 52.2.c) ; elle bénéficie des services environnementaux forestiers (art. 73.4).", source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
  consentement: {valeur: "partiel", note: "Le ministère consulte notamment les communautés résidentielles sur le plan directeur national de la foresterie (art. 12 de la loi de 2017), et l'attribution des forêts respecte « l'espace de vie, les coutumes et les pratiques » des communautés (art. 14.8) ; la loi ne prévoit pas de consentement préalable.", source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les forêts sont attribuées sans redevance d'usage (art. 16 de la loi de 2017) ; la communauté a droit à des fonds de l'État pour protéger et développer les forêts de croyance et de protection qui lui sont attribuées (art. 86.1.b) ; elle n'a pas de pouvoir fiscal.", source: "https://english.luatvietnam.vn/law-no-16-2017-qh14-dated-november-15-2017-of-the-national-assembly-on-forestry-118853-doc1.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de l'université de Hué (revue Forests, 2022) constate que les forêts littorales sur sable gérées par des villages du district de Phong Điền (Thừa Thiên Huế) selon leurs conventions villageoises ne leur ont pas été attribuées ; le Système d'information sur les sauvegardes indique de son côté que 158 046 ha des 1 086 594 ha prévus avaient été attribués aux ménages, aux individus et aux communautés en 2020, et que la surface des forêts communautaires passe de 1,22 million d'hectares en 2019 à 1,05 million en 2024.", source: "https://www.mdpi.com/1999-4907/13/4/561"}
chronologie:
  - {annee: 2015, evenement: "Environ 1,11 million d'hectares de forêts attribués aux communautés (Système d'information sur les sauvegardes)."}
  - {annee: 2017, evenement: "Le 15 novembre, l'Assemblée nationale adopte la loi sur la foresterie n° 16/2017/QH14, qui définit la communauté résidentielle et la reconnaît propriétaire forestier."}
  - {annee: 2018, evenement: "Fin 2018, 1,1 million d'hectares de forêts gérés par des communautés, soit 8 % de la surface forestière (VietnamPlus, janvier 2019)."}
  - {annee: 2019, evenement: "Entrée en vigueur de la loi le 1er janvier ; elle remplace la loi n° 29/2004/QH11 sur la protection et le développement des forêts."}
  - {annee: 2019, evenement: "Le sixième rapport national à la CDB présente l'attribution de forêts aux communautés comme base de futures aires protégées gérées par les communautés."}
  - {annee: 2020, evenement: "Le Fonds de protection et de développement des forêts a des contrats de paiement pour services environnementaux forestiers avec 5 878 communautés."}
  - {annee: 2023, evenement: "1 094 476 ha de forêts gérés par des communautés, soit 6,75 % de la surface forestière."}
  - {annee: 2024, evenement: "1 052 milliers d'hectares de forêts ont une communauté pour propriétaire."}
  - {annee: 2025, evenement: "Le 1er juillet, le décret n° 131/2025/ND-CP transfère l'attribution et la reprise des forêts des communautés au président du comité populaire de commune."}
