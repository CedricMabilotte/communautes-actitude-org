resume: >-
  La minorité polonaise est l'une des minorités nationales représentées au Conseil gouvernemental pour les minorités nationales, où elle dispose de deux sièges.
  Le recensement de 2021 compte 38 218 personnes de nationalité polonaise, dont environ 80 % en Silésie de Těšín, dans les districts de Karviná et de Frýdek-Místek.
  La loi n° 273/2001 sur les droits des membres des minorités nationales garantit l'exercice des droits « individuellement ou en commun », des noms bilingues et l'enseignement dans la langue maternelle.
  La loi sur les communes impose un comité pour les minorités nationales, organe consultatif du conseil municipal, là où au moins 10 % des habitants déclarent une nationalité autre que tchèque et sur demande écrite d'une association ; aucun organe d'autogouvernement n'existe.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Convention-cadre pour la protection des minorités nationales en vigueur pour la Tchéquie depuis le 1er avril 1998 ; sixième avis du Comité consultatif adopté le 2 juillet 2025, qui relève que seule la minorité polonaise atteint le seuil de 10 % dans des communes et que les indications topographiques en langue minoritaire n'existent qu'en polonais.", annee: 2025, source: "https://rm.coe.int/6th-opinion-czechia-fr/4880294c4d"}
  - {mecanisme: "charte_langues_regionales", detail: "Charte européenne des langues régionales ou minoritaires ratifiée le 15 novembre 2006, en vigueur le 1er mars 2007 ; le polonais relève des parties II et III dans les districts de Frýdek-Místek et de Karviná. Cinquième rapport d'évaluation du Comité d'experts adopté le 6 mars 2024.", annee: 2024, source: "https://rm.coe.int/czechiaecrml5-en/1680afb27b"}
