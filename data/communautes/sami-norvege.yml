resume: >-
  Les Sámi sont le peuple autochtone du nord de la Norvège, de la Suède, de la Finlande et de la péninsule de Kola. En Norvège, l'article 108 de la Constitution charge l'État de créer les conditions permettant aux Sámi de préserver leur langue, leur culture et leur mode de vie. La Loi sâme de 1987 institue un parlement élu, le Sámediggi, et une obligation de consultation. La Loi sur le Finnmark de 2005 a transféré la propriété des terres de l'État dans ce comté à un organisme dont la moitié du conseil est élue par le Sámediggi. Les Sámi de Suède et de Finlande relèvent d'autres régimes : voir les fiches « Sámi de Suède » et « Sámi de Finlande ».
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "La Norvège a ratifié la Convention en 1990, premier État à le faire.", annee: 1990, source: "https://www.ilo.org/media/429916/download"}
  - {mecanisme: "dnudpa", detail: "La Norvège a voté pour la Déclaration ; le Rapporteur spécial le rappelle dans son rapport sur le Sápmi (A/HRC/33/42/Add.3, § 18).", annee: 2007, source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
  - {mecanisme: "instance_permanente", detail: "Mission de pays du Mécanisme d'experts sur les droits des peuples autochtones (EMRIP) en Norvège en 2024 ; note consultative technique du 18 mars 2025 sur la consultation et le consentement des Sámi (citée par le Conseil sâme et IWGIA, 2025).", annee: 2025, source: "https://indigenousnavigator.org/files/media/document/The+State+Of+Sa%CC%81pmi+01_2025.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la situation du peuple sâme dans la région du Sápmi en Norvège, en Suède et en Finlande (A/HRC/33/42/Add.3), § 18 à 34.", annee: 2016, source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
base_nationale:
  - {instrument: "Constitution du Royaume de Norvège, art. 108", nature: "constitution", annee: 1988, source: "https://www.constituteproject.org/constitution/Norway_2016"}
  - {instrument: "Loi n° 56 du 12 juin 1987 sur le Sámediggi et les autres questions juridiques sâmes (Loi sâme)", nature: "loi", annee: 1987, source: "https://regjeringen.no/en/documents/the-sami-act-/id449701/"}
  - {instrument: "Loi n° 85 du 17 juin 2005 sur les relations juridiques et la gestion des terres et ressources naturelles du comté de Finnmark (Loi sur le Finnmark)", nature: "loi", annee: 2005, source: "https://app.uio.no/ub/ujur/oversatte-lover/data/lov-20050617-085-eng.pdf"}
  - {instrument: "Cour suprême de Norvège, arrêt HR-2021-1975-S (Fosen), 11 octobre 2021", nature: "jurisprudence", annee: 2021, source: "https://www.domstol.no/en/supremecourt/rulings/2021/supreme-court-civil-cases/hr-2021-1975-s/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le Sámediggi est un parlement élu de 39 membres qui peut se saisir de toute question qu'il estime concerner le peuple sâme, Loi sâme de 1987, art. 1-2, 2-1 et 2-4.", source: "https://regjeringen.no/en/documents/the-sami-act-/id449701/"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Sámediggi édicte des lignes directrices que les autorités doivent suivre pour évaluer l'effet des changements d'usage des terres non cultivées du Finnmark sur la culture sâme, Loi sur le Finnmark de 2005, art. 4 ; il n'a pas de pouvoir législatif général.", source: "https://app.uio.no/ub/ujur/oversatte-lover/data/lov-20050617-085-eng.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La Loi sur le Finnmark de 2005 transfère les terres de l'État dans le comté au Finnmarkseiendommen (domaine du Finnmark), dont le Sámediggi élit trois des six administrateurs, art. 7 ; une commission identifie les droits d'usage et de propriété acquis par un long usage.", source: "https://app.uio.no/ub/ujur/oversatte-lover/data/lov-20050617-085-eng.pdf"}
  ressources: {valeur: "partiel", note: "Le Finnmarkseiendommen détient les ressources des terres transférées en 2005 ; hors du Finnmark, aucun mécanisme spécifique d'identification des droits n'existe, et la loi sur les minéraux ne prévoit pas de consentement (Rapporteur spécial, 2016, § 21 à 32).", source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
  consentement: {valeur: "partiel", note: "Les autorités doivent consulter le Sámediggi de bonne foi, en vue d'un accord, sur les mesures qui touchent directement les intérêts sâmes, Loi sâme, chapitre 4, art. 4-1 à 4-6 ; la loi n'exige pas le consentement.", source: "https://regjeringen.no/en/documents/the-sami-act-/id449701/"}
  langue: {valeur: "reconnu", note: "Les langues sâmes et le norvégien sont des langues de valeur égale ; le same du Sud, le same de Lule et le same du Nord ont un statut égal au norvégien selon les règles du chapitre 3, qui s'appliquent dans la zone administrative des langues sâmes, Loi sâme, art. 1-5 et 3-1 ; une modification votée le 30 mai 2023 répartit les communes en trois catégories de droits linguistiques.", source: "https://regjeringen.no/en/documents/the-sami-act-/id449701/"}
  education: {valeur: "partiel", note: "Le règlement du 1er mars 2010 sur la formation des enseignants sâmes renvoie au droit des enfants sâmes à l'enseignement prévu par la Loi sur l'éducation du 17 juillet 1998 ; le Sámediggi ne participe pas au contrôle des programmes de formation, qui relève des préfets de comté (Rapporteur spécial, 2016, § 34).", source: "https://www.regjeringen.no/en/dokumenter/national-curriculum-for-sami-primary-and/id594360/"}
  fiscalite: {valeur: "partiel", note: "Le Sámediggi peut recevoir délégation pour gérer les crédits affectés aux fins sâmes dans le budget annuel de l'État, Loi sâme, art. 2-1, et répartit entre communes et comtés les fonds de mise en œuvre des règles linguistiques, art. 3-12 ; il n'a pas de pouvoir fiscal.", source: "https://regjeringen.no/en/documents/the-sami-act-/id449701/"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Conseil sâme et IWGIA (2025) relèvent que le rôle du Sámediggi est surtout consultatif et que la Loi sâme n'exige pas le consentement libre, préalable et éclairé ; le Mécanisme d'experts de l'ONU (2025) critique la délivrance d'autorisations de travaux avant le règlement des droits sâmes. Après l'arrêt Fosen de 2021 (violation de l'article 27 du Pacte international relatif aux droits civils et politiques, droit des minorités à leur culture), les éoliennes sont restées en service ; des accords conclus en décembre 2023 et mars 2024 entre les deux siidas (groupes familiaux d'éleveurs de rennes) et les exploitants prévoient de nouveaux pâturages d'hiver et un droit de veto des siidas à l'expiration des concessions.", source: "https://indigenousnavigator.org/files/media/document/The+State+Of+Sa%CC%81pmi+01_2025.pdf"}
chronologie:
  - {annee: 1987, evenement: "Adoption de la Loi sâme."}
  - {annee: 1988, evenement: "Ajout à la Constitution de la disposition sur le peuple sâme (actuel art. 108)."}
  - {annee: 1989, evenement: "Première session du Sámediggi à Karasjok."}
  - {annee: 1990, evenement: "Ratification de la Convention OIT 169."}
  - {annee: 2005, evenement: "Loi sur le Finnmark et accord sur les procédures de consultation entre l'État et le Sámediggi."}
  - {annee: 2006, evenement: "Transfert de 46 000 km² de terres de l'État au Finnmarkseiendommen (1er juin)."}
  - {annee: 2021, evenement: "Arrêt Fosen de la Cour suprême (11 octobre) : licences et expropriations des parcs éoliens de Storheia et Roan déclarées invalides."}
  - {annee: 2023, evenement: "Le Storting modifie les règles linguistiques de la Loi sâme (30 mai) ; accord entre Sør-Fosen sijte et Fosen Vind (18 décembre)."}
  - {annee: 2024, evenement: "Accord entre Nord-Fosen siida et Roan Vind (6 mars) ; mission du Mécanisme d'experts de l'ONU sur les droits des peuples autochtones."}
  - {annee: 2025, evenement: "Note consultative du Mécanisme d'experts (18 mars) ; la Cour suprême juge que les manifestants de Fosen de 2023 ne peuvent être punis (HR-2025-1238-A, 26 juin) ; élection du Sámediggi avec 25 690 électeurs inscrits et 74,2 % de participation."}
