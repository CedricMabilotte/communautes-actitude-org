resume: >-
  Les Druzes, qui se nomment « unitaires » (muwaḥḥidūn), vivent en Israël dans des localités de Galilée et du mont Carmel.
  L'État les reconnaît comme communauté religieuse distincte depuis 1957.
  La loi de 1962 sur les tribunaux religieux druzes leur donne des juridictions propres en matière de mariage et de divorce, qui appliquent depuis 1961 la loi libanaise sur le statut personnel druze, adoptée par la communauté.
  Les quatre localités druzes du plateau du Golan, sous administration israélienne depuis 1967, relèvent d'un statut international distinct et ne sont pas traitées dans cette fiche.
