  - {instrument: "Loi 5772-2012 sur l'extension de la représentation adéquate des membres de la communauté druze dans la fonction publique (amendements législatifs)", nature: "loi", annee: 2012, source: "https://docs.un.org/en/CERD/C/ISR/17-19"}
droits:
  autogouvernement: {valeur: "partiel", note: "Loi de 1962 sur les tribunaux religieux druzes, art. 1 : le Conseil religieux druze est constitué par règlement pris en vertu de l'ordonnance sur les communautés religieuses (organisation) ; art. 11 : son président siège à la commission de nomination des juges druzes, présidée par le ministre de la Justice. Compétences limitées aux affaires religieuses.", source: "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%91%D7%AA%D7%99_%D7%94%D7%93%D7%99%D7%9F_%D7%94%D7%93%D7%AA%D7%99%D7%99%D7%9D_%D7%94%D7%93%D7%A8%D7%95%D7%96%D7%99%D7%99%D7%9D"}
  pouvoir_normatif: {valeur: "partiel", note: "Le 2 novembre 1961, la communauté adopte la loi libanaise sur le statut personnel druze comme loi personnelle des Druzes d'Israël ; les tribunaux druzes l'appliquent. Portée limitée au statut personnel.", source: "https://he.wikipedia.org/wiki/%D7%91%D7%AA%D7%99_%D7%94%D7%93%D7%99%D7%9F_%D7%94%D7%93%D7%AA%D7%99%D7%99%D7%9D_%D7%94%D7%93%D7%A8%D7%95%D7%96%D7%99%D7%99%D7%9D"}
  justice_propre: {valeur: "non_etabli", note: "Les tribunaux religieux druzes créés par la loi de 1962 sont des juridictions de l'État : leurs juges (qadi madhhab) sont nommés après avis d'une commission présidée par le ministre de la Justice (art. 11) et rattachés à ce ministère depuis 2001 ; ils jugent en exclusivité le mariage et le divorce des Druzes, ce qui relève du statut personnel.", source: "https://he.wikipedia.org/wiki/%D7%91%D7%AA%D7%99_%D7%94%D7%93%D7%99%D7%9F_%D7%94%D7%93%D7%AA%D7%99%D7%99%D7%9D_%D7%94%D7%93%D7%A8%D7%95%D7%96%D7%99%D7%99%D7%9D"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Loi 5772-2012 : les sociétés d'État de plus de 50 salariés et les municipalités comptant de 10 % à 50 % de Druzes appliquent une action positive (mesures de rattrapage dans les recrutements) en faveur des membres de la communauté druze. Représentation administrative seulement : aucun siège réservé à la Knesset.", source: "https://docs.un.org/en/CERD/C/ISR/17-19"}
  statut_personnel: {valeur: "reconnu", note: "Le mariage et le divorce des Druzes citoyens ou résidents relèvent de la compétence exclusive des tribunaux druzes (loi de 1962, art. 4). En 2019, Israël invoque devant le Comité des droits de l'homme « l'autonomie des communautés religieuses en matière de statut personnel » (CCPR/C/ISR/5, par. 21).", source: "https://docs.un.org/en/CCPR/C/ISR/5"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Les tribunaux druzes siègent depuis le 30 décembre 1963 ; en février 2026, quatre juges y siègent, deux en appel et deux en première instance, le poste de président du tribunal d'appel restant vacant depuis 1993.", source: "https://he.wikipedia.org/wiki/%D7%91%D7%AA%D7%99_%D7%94%D7%93%D7%99%D7%9F_%D7%94%D7%93%D7%AA%D7%99%D7%99%D7%9D_%D7%94%D7%93%D7%A8%D7%95%D7%96%D7%99%D7%99%D7%9D"}
chronologie:
  - {annee: 1956, evenement: "Service militaire obligatoire étendu aux hommes druzes."}
  - {annee: 1957, evenement: "Le gouvernement reconnaît les Druzes comme communauté religieuse distincte, à la demande de leurs chefs."}
  - {annee: 1961, evenement: "Création du Conseil religieux druze ; adoption, le 2 novembre, de la loi libanaise sur le statut personnel druze."}
  - {annee: 1962, evenement: "Loi sur les tribunaux religieux druzes."}
  - {annee: 1963, evenement: "Ouverture des tribunaux druzes à Haïfa (30 décembre)."}
  - {annee: 1972, evenement: "Ouverture du tribunal druze de Mas'ade, sur le plateau du Golan."}
  - {annee: 1988, evenement: "Transfert des tribunaux druzes de Haïfa à Acre."}
  - {annee: 2001, evenement: "Les tribunaux druzes passent du ministère des Affaires religieuses au ministère de la Justice."}
  - {annee: 2012, evenement: "Loi sur l'extension de la représentation des Druzes dans la fonction publique."}
  - {annee: 2018, evenement: "Un forum d'anciens militaires druzes se constitue contre la loi fondamentale sur l'État-nation ; trois députés druzes et des organisations druzes saisissent la Haute Cour de justice."}
  - {annee: 2020, evenement: "Le Comité pour l'élimination de la discrimination raciale nomme la communauté druze dans ses observations finales sur Israël."}
