resume: >-
  Les Amhara forment une « nation, nationalité et peuple » au sens de la Constitution fédérale de 1994, dans le nord-ouest de l'Éthiopie.
  Ils disposent d'un État régional, l'un des neuf États membres énumérés par la Constitution (art. 47), avec son conseil, son administration et sa constitution (art. 50 et 52).
  Comme les autres nations de la fédération, ils ont un droit constitutionnel à l'autodétermination, sécession comprise (art. 39).
  Depuis août 2023, la région connaît un conflit armé entre l'armée fédérale et les milices Fano ; en septembre 2026, des combats de grande ampleur opposent les forces fédérales aux Fano alliés au Front populaire de libération du Tigray.
  Les administrations de nationalité créées dans la région pour les Agaw, les Oromo, les Argobba et les Qemant relèvent de la fiche « Administrations de nationalité de la région Amhara ».
