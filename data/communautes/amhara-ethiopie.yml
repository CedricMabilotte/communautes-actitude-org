reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme note la reconnaissance du droit des communautés ethniques et linguistiques à l'autodétermination au niveau de l'État régional et s'inquiète du sort des minorités vivant hors de leur région (CCPR/C/ETH/CO/1, par. 26). Vise la catégorie, pas les Amhara nommément.", annee: 2011, source: "https://docs.un.org/en/CCPR/C/ETH/CO/1"}
base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 5, 34, 39, 40, 47, 50, 52, 61, 78 et 97", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 39(3) : droit de chaque nation, nationalité et peuple à l'autogouvernement et à ses propres institutions ; art. 47(1) : l'État amhara est l'un des États membres de la fédération.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(1) : les États exercent tous les pouvoirs non attribués à la fédération ; art. 50(5) et 52(2)(b) : le conseil de l'État adopte la constitution de l'État et ses lois.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  justice_propre: {valeur: "reconnu", note: "Art. 50(7) et 78(3) : le pouvoir judiciaire de l'État appartient à ses tribunaux (cour suprême, hautes cours, tribunaux de première instance) ; art. 78(5) : leurs conseils peuvent créer ou reconnaître des tribunaux religieux et coutumiers ; art. 34(5) : le statut personnel et familial peut être jugé selon le droit religieux ou coutumier avec l'accord des parties.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  terres: {valeur: "partiel", note: "Art. 40(3) : la propriété de la terre appartient exclusivement à l'État et aux peuples d'Éthiopie, propriété commune inaliénable ; art. 52(2)(d) : les États l'administrent selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "partiel", note: "Art. 43(2) de la Constitution fédérale : les nationaux ont le droit d'être consultés sur les politiques et projets qui touchent leur communauté ; aucune obligation de consentement.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 5(3) : chaque État membre fixe par la loi sa langue de travail ; art. 39(2) : droit de parler, écrire et développer sa langue. L'amharique est aussi la langue de travail fédérale (art. 5(2)).", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 97 : les États lèvent l'impôt sur le revenu des salariés de l'État et des entreprises privées, les redevances d'usufruit foncier et d'autres impôts ; art. 52(2)(e) : ils établissent et gèrent leur budget.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 61(2) : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération, plus un par million d'habitants.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) : droit inconditionnel à l'autodétermination, y compris la sécession, par vote aux deux tiers du conseil législatif puis référendum organisé par l'État fédéral dans les trois ans. Jamais exercé.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "contestee", note: "En août 2023, l'État fédéral déclare l'état d'urgence et place la région sous un commandement militaire relevant du Premier ministre ; prolongation de quatre mois le 2 février 2024 ; Human Rights Watch documente l'exécution sommaire de dizaines de civils par l'armée fédérale à Merawi le 29 janvier 2024. Selon Crisis Group (25 septembre 2026), l'insurrection Fano se poursuit et des combats de grande ampleur ont repris le 23 septembre 2026.", source: "https://www.hrw.org/news/2024/04/04/ethiopia-military-executes-dozens-amhara-region"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale ; l'État amhara figure parmi les neuf États membres (art. 47)."}
  - {annee: 2007, evenement: "Recensement national : 17 214 056 habitants dans l'État amhara (résumé provisoire)."}
  - {annee: 2011, evenement: "Observations du Comité des droits de l'homme sur l'autodétermination au niveau des États régionaux."}
  - {annee: 2023, evenement: "Affrontements entre forces fédérales et milices Fano à partir d'avril ; en août, état d'urgence et commandement militaire sur la région."}
  - {annee: 2024, evenement: "Prolongation de l'état d'urgence (février) ; exécutions de civils à Merawi documentées par Human Rights Watch."}
  - {annee: 2026, evenement: "Alliance entre une coalition Fano et le Front populaire de libération du Tigray (20 septembre) ; offensive contre les forces fédérales le 23 septembre."}
