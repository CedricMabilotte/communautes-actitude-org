resume: >-
  Collectivité d'outre-mer française dont l'autonomie relève de l'article 74 de la Constitution et de la loi organique du 27 février 2004. Elle dispose d'une assemblée, d'un gouvernement et d'un président propres. L'Assemblée générale des Nations unies l'a réinscrite sur la liste des territoires non autonomes par la résolution 67/265 du 17 mai 2013, à la demande de l'Assemblée de la Polynésie française (résolution du 18 août 2011).
