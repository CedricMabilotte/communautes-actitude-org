base_nationale:
  - {instrument: "Loi organique n° 2004-192 du 27 février 2004 portant statut d'autonomie de la Polynésie française, examinée par la décision n° 2004-490 DC du Conseil constitutionnel", nature: "statut_autonomie", annee: 2004, source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée, gouvernement et président de la Polynésie française ; compétence de principe dans toutes les matières non dévolues à l'État (loi organique de 2004, art. 13 et 14).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée adopte des « lois du pays » (art. 140) ; le Conseil constitutionnel précise en 2004 qu'elles gardent le caractère d'actes administratifs.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Régime de déclaration des transferts fonciers et droit de préemption du conseil des ministres « dans le but de préserver l'appartenance de la propriété foncière au patrimoine culturel de la population » (art. 19).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  ressources: {valeur: "partiel", note: "Les hydrocarbures liquides et gazeux sont exclus de la compétence de l'État (art. 14, 4°), sous réserve des prérogatives de sécurité et de défense.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  consentement: {valeur: "partiel", note: "Consultation obligatoire des institutions de la Polynésie française sur les actes énumérés à l'art. 9 ; il s'agit d'un avis.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  langue: {valeur: "partiel", note: "Le français est la langue officielle ; la langue tahitienne et les autres langues polynésiennes peuvent être utilisées et enseignées (art. 57).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  education: {valeur: "partiel", note: "Enseignement du tahitien ou d'une autre langue polynésienne dans l'horaire normal des écoles, sans caractère obligatoire selon le Conseil constitutionnel (art. 57).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  fiscalite: {valeur: "reconnu", note: "Impôts, droits et taxes perçus au profit du budget général de la Polynésie française, dont une quote-part alimente le fonds intercommunal de péréquation (art. 52).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Mesures favorisant l'accès à l'emploi des personnes justifiant d'une durée suffisante de résidence (art. 18) ; aucune citoyenneté locale.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'ONU affirme le droit du peuple à l'autodétermination et à l'indépendance (résolutions 67/265 et 79/104) ; aucun texte national ne prévoit de consultation sur l'indépendance.", source: "https://documents.un.org/api/symbol/access?s=A/RES/79/104&l=fr&t=pdf"}
