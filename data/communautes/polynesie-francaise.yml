types_secondaires: []
population: {valeur: 278786, annee: 2022, perimetre: "population municipale de la collectivité au recensement de 2022 (décret n° 2022-1592 du 20 décembre 2022) ; l'Institut de la statistique de la Polynésie française l'estime à 279 500 habitants en 2024 (A/AC.109/2026/7)", source: "https://www.insee.fr/fr/statistiques/6689891?sommaire=2122700"}
lieux: {valeur: 48, unite: "communes (réparties en cinq subdivisions administratives : îles du Vent, îles Sous-le-Vent, Marquises, Australes, Tuamotu-Gambier)", annee: 2022, source: "https://www.insee.fr/fr/statistiques/6689636?sommaire=2122700"}
surface_km2: {valeur: 3500, annee: 2026, perimetre: "terres émergées des 118 îles regroupées en cinq archipels (valeur approchée « environ 3 500 km² » donnée par l'ONU) ; la zone économique exclusive couvre 5 500 000 km²", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2026/7&l=fr&t=pdf"}
villages: {valeur: 116, annee: 2022, perimetre: "unités communales recensées en 2022 : 98 communes associées (dans 30 des 48 communes) et 18 communes sans commune associée ; une unité peut regrouper plusieurs villages ou îles, le nombre de villages au sens strict n'étant pas publié", source: "https://www.insee.fr/fr/statistiques/6690032?sommaire=2122700"}
resume: >-
  Collectivité d'outre-mer française dont l'autonomie relève de l'article 74 de la Constitution et de la loi organique du 27 février 2004. Elle dispose d'une assemblée, d'un gouvernement et d'un président propres. L'Assemblée générale des Nations unies l'a réinscrite sur la liste des territoires non autonomes par la résolution 67/265 du 17 mai 2013, à la demande de l'Assemblée de la Polynésie française (résolution du 18 août 2011). Les rāhui et zones de pêche réglementée gérés par des communautés locales font l'objet de la fiche « Rāhui de Polynésie française ».
reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Résolution 67/265 « L'autodétermination de la Polynésie française » : réinscription sur la liste des territoires non autonomes", annee: 2013, source: "https://documents.un.org/api/symbol/access?s=A/RES/67/265&l=fr&t=pdf"}
  - {mecanisme: "liste_tna", detail: "Résolution 79/104 « Question de la Polynésie française », qui réaffirme le droit inaliénable du peuple à l'autodétermination et traite des conséquences des essais nucléaires", annee: 2024, source: "https://documents.un.org/api/symbol/access?s=A/RES/79/104&l=fr&t=pdf"}
  - {mecanisme: "liste_tna", detail: "Résolution 80/95 « Question de la Polynésie française » (5 décembre 2025), qui réaffirme le droit à l'autodétermination et la souveraineté permanente du peuple sur ses ressources naturelles, y compris les minéraux sous-marins", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=A/RES/80/95&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Loi organique n° 2004-192 du 27 février 2004 portant statut d'autonomie de la Polynésie française, examinée par la décision n° 2004-490 DC du Conseil constitutionnel", nature: "statut_autonomie", annee: 2004, source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  - {instrument: "Loi organique n° 2019-706 du 5 juillet 2019 portant modification du statut d'autonomie de la Polynésie française, examinée par la décision n° 2019-783 DC du Conseil constitutionnel", nature: "loi_organique", annee: 2019, source: "https://www.conseil-constitutionnel.fr/decision/2019/2019783DC.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Président, gouvernement, Assemblée de la Polynésie française et conseil économique, social, environnemental et culturel ; l'art. 13 de la loi organique de 2004 rend les autorités de la Polynésie française compétentes dans toutes les matières qui ne sont pas dévolues à l'État par l'art. 14.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée adopte des « lois du pays » (art. 140 de la loi organique de 2004), contestables seulement devant le Conseil d'État ; le Conseil constitutionnel précise en 2004 qu'elles gardent le caractère d'actes administratifs.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Régime de déclaration des transferts fonciers et droit de préemption du conseil des ministres « dans le but de préserver l'appartenance de la propriété foncière au patrimoine culturel de la population » (art. 19).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  ressources: {valeur: "partiel", note: "L'art. 47 de la loi organique de 2004, modifié en 2019, donne à la Polynésie française la compétence d'exploration, d'exploitation, de conservation et de gestion des ressources naturelles biologiques et non biologiques, terres rares comprises ; le Conseil constitutionnel en exclut les terres rares reconnues comme matières premières stratégiques (décision 2019-783 DC).", source: "https://www.conseil-constitutionnel.fr/decision/2019/2019783DC.htm"}
  consentement: {valeur: "partiel", note: "L'art. 9 de la loi organique de 2004 délimite les actes soumis à la consultation obligatoire (avis) des institutions de la Polynésie française ; l'avis ne lie pas l'État.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  langue: {valeur: "partiel", note: "L'art. 57 de la loi organique de 2004 traite de l'usage du français, du tahitien et des autres langues polynésiennes ; le français est la langue officielle.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  education: {valeur: "partiel", note: "Enseignement de la langue tahitienne ou d'une autre langue polynésienne dans l'horaire normal des écoles, des établissements du second degré et du supérieur (art. 57), sans caractère obligatoire selon le Conseil constitutionnel (2004).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  fiscalite: {valeur: "reconnu", note: "Impôts, droits et taxes perçus au profit du budget général de la Polynésie française, dont une quote-part alimente le fonds intercommunal de péréquation (art. 52 de la loi organique de 2004).", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Mesures favorisant l'accès à l'emploi des personnes justifiant d'une durée suffisante de résidence (art. 18 de la loi organique de 2004) ; aucune citoyenneté locale.", source: "https://www.conseil-constitutionnel.fr/decision/2004/2004490DC.htm"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'Assemblée de la Polynésie française a créé une Commission spéciale sur la décolonisation le 26 octobre 2023. L'Assemblée générale déplore en 2025 que la France ne communique aucun renseignement au titre de l'art. 73 e de la Charte depuis 2013 et relève une évaluation indépendante de 2016 selon laquelle le territoire ne remplit pas l'ensemble des critères d'autonomie.", source: "https://documents.un.org/api/symbol/access?s=A/RES/80/95&l=fr&t=pdf"}
chronologie:
  - {annee: 2004, evenement: "Loi organique n° 2004-192 portant statut d'autonomie ; décision 2004-490 DC du Conseil constitutionnel."}
  - {annee: 2011, evenement: "L'Assemblée de la Polynésie française demande la réinscription sur la liste des territoires non autonomes (18 août)."}
  - {annee: 2013, evenement: "Résolution 67/265 : réinscription (17 mai)."}
  - {annee: 2019, evenement: "Loi organique n° 2019-706 modifiant le statut d'autonomie (compétence étendue sur les ressources naturelles, art. 47) ; décision 2019-783 DC."}
  - {annee: 2023, evenement: "Élection de Moetai Brotherson à la présidence (12 mai) ; l'Assemblée crée une Commission spéciale sur la décolonisation (26 octobre)."}
  - {annee: 2024, evenement: "Résolution 79/104 « Question de la Polynésie française »."}
  - {annee: 2025, evenement: "Résolution 80/95 (5 décembre) : l'Assemblée générale déplore l'absence de renseignements transmis par la France depuis 2013."}
fiabilite:
  verifie: ["Articles 9, 13, 18, 19, 52, 57 et 140 de la loi organique, tels que cités dans la décision 2004-490 DC.", "Article 47 modifié en 2019, tel que cité dans la décision 2019-783 DC.", "Texte des résolutions 67/265, 79/104 et 80/95.", "Population légale 2022, 48 communes et 98 communes associées (tableaux de l'Insee, décret n° 2022-1592)."]
  non_confirme: ["Texte consolidé de la loi organique en vigueur en 2026 (Légifrance et Lexpol inaccessibles lors de la recherche).", "Exclusion des hydrocarbures de la compétence de l'État (art. 14) : non vérifiée sur une source ouverte, retirée de la note.", "Nombre de villages au sens strict : non trouvé ; la valeur retenue compte les communes associées et les communes non divisées.", "Endonyme « Mā’ohi » : usage attesté mais non consensuel."]
