resume: >-
  Les Khasi vivent au centre du Meghalaya. Le Khasi Hills Autonomous District Council, créé en juin 1952 en application de la Sixième annexe de la Constitution, couvre cinq districts et 54 chefferies traditionnelles (hima). Il légifère sur les terres, les forêts non classées, la désignation des chefs et les coutumes, et fait fonctionner une justice à trois degrés. Sa loi de 1997 codifie la filiation matrilinéaire khasi.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître les peuples tribaux et les « tribus énumérées » comme groupes ayant droit à une protection spéciale ; § 12 et 19 sur les États du nord-est", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Constitution de l'Inde, art. 244 (2) et Sixième annexe", nature: "constitution", annee: 1950, source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  - {instrument: "Khasi Hills Autonomous District (Khasi Social Custom of Lineage) Act, 1997", nature: "loi", annee: 1997, source: "https://khadc.nic.in/acts_rules_regulations_bills/Acts_Rules_arranged/Khasi_Lineage_Act_1997.pdf"}
  - {instrument: "Loi de 2005 sur la langue de l'État du Meghalaya ; ordonnance de 2026 sur les langues officielles", nature: "loi", annee: 2005, source: "https://assamtribune.com/north-east/meghalaya-cabinet-declares-khasi-garo-as-state-languages-repeals-2005-act-1610687"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, Sixième annexe (régime des districts tribaux autonomes), paragraphe 2 (1). Au niveau du village, le dorbar shnong (assemblée coutumière de village, présidée par le rangbah shnong, chef de village) fonctionne sans base légale propre : le projet de loi du conseil sur l'administration des villages, adopté le 1er juillet 2014, attend l'assentiment du gouverneur ; la loi du conseil de 2021 crée des conseils de développement de village (Shillong Times, 2024).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 ; au Meghalaya, une loi de l'État contraire l'emporte sur la loi du conseil, paragraphe 12A (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Trois degrés de juridiction (tribunaux de village, tribunaux subordonnés, tribunal du conseil de district) pour les affaires civiles et pénales entre membres des tribus répertoriées, selon les règles d'administration de la justice de 1953 prises en application du paragraphe 4 de la Sixième annexe ; ces tribunaux de village siègent au niveau des raid (groupements de villages) et des chefs coutumiers, non au niveau du dorbar shnong (Shillong Times, 2024).", source: "https://khadc.nic.in/judiciary.html"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Le khasi est langue officielle associée du Meghalaya depuis la loi de 2005 sur la langue de l'État ; une ordonnance approuvée le 17 avril 2026 en fait une langue officielle à côté de l'anglais.", source: "https://assamtribune.com/north-east/meghalaya-cabinet-declares-khasi-garo-as-state-languages-repeals-2005-act-1610687"}
  education: {valeur: "partiel", note: "Le conseil peut créer et gérer des écoles primaires et fixer la langue et les modalités de l'enseignement primaire, avec l'accord préalable du gouverneur, Sixième annexe, paragraphe 6 (1).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des personnes n'appartenant pas aux tribus répertoriées, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Loi du conseil sur la coutume khasi de filiation (1997, publiée en 2005) : filiation par la mère (clan, kur ou jait), conditions pour être reconnu khasi et perte des droits successoraux en cas d'abandon du système matrilinéaire.", source: "https://khadc.nic.in/acts_rules_regulations_bills/Acts_Rules_arranged/Khasi_Lineage_Act_1997.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Conseil renouvelé le 21 février 2025 (29 élus) ; une étude de la Banque mondiale conclut que le conseil peine à exercer ses fonctions, la plupart des services ayant été repris par l'État, et que ses finances dépendent des transferts.", source: "https://documents1.worldbank.org/curated/en/659621527600675940/pdf/105738-WP-P151154-PUBLIC-Capacity-and-Functioning-India.pdf"}
chronologie:
  - {annee: 1952, evenement: "Création du conseil des Khasi et Jaintia Hills en juin."}
  - {annee: 1967, evenement: "Séparation du conseil des Jaintia Hills."}
  - {annee: 1997, evenement: "Loi sur la coutume khasi de filiation, publiée en 2005."}
  - {annee: 2014, evenement: "Le conseil adopte le projet de loi sur l'administration des villages ; le 10 décembre, la Haute Cour du Meghalaya interdit à l'administration d'exiger un certificat du chef de village, ce que le syndicat des chefs de village refuse d'appliquer."}
  - {annee: 2021, evenement: "Loi du conseil sur les conseils de développement de village et de ville."}
  - {annee: 2025, evenement: "Élection du conseil le 21 février."}
fiabilite:
  verifie: ["Districts couverts et nombre de chefferies (site du conseil).", "Organisation de la justice du conseil (site du conseil).", "Contenu et dates de la loi de 1997 (Gazette du Meghalaya).", "Superficies et populations des districts (gouvernement du Meghalaya, Statistical Handbook 2022).", "Résultat de l'élection de 2025 (Shillong Times).", "Statut non statutaire du dorbar shnong, projet de loi de 2014, loi de 2021 et niveau des tribunaux de village (Shillong Times, 12 novembre 2024) ; ordonnance de la Haute Cour du 10 décembre 2014 et réaction des chefs de village (Oh Meghalaya)."]
