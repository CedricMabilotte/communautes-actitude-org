resume: >-
  Les Khasi vivent au centre du Meghalaya. Le Khasi Hills Autonomous District Council, créé en juin 1952 en application de la Sixième annexe de la Constitution, couvre cinq districts et 54 chefferies traditionnelles (hima ou elaka). Il légifère sur les terres, les forêts non classées, la désignation des chefs et les coutumes, et fait fonctionner une justice à trois degrés. Sa loi de 1997 codifie la filiation matrilinéaire khasi. Les Jaintia Hills relèvent d'un conseil distinct depuis 1967 (voir la fiche Pnar (Jaintia)).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître officiellement les peuples tribaux comme groupes distincts ayant droit à une protection spéciale et de préciser les critères d'appartenance aux tribus « énumérées » ; § 19 : demande le consentement préalable des communautés tribales touchées par les barrages du nord-est ; les Khasi ne sont pas nommés", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
