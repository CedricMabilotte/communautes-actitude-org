  - {instrument: "Khasi Hills Autonomous District (Khasi Social Custom of Lineage) Act, 1997", nature: "loi", annee: 1997, source: "https://khadc.nic.in/acts_rules_regulations_bills/Acts_Rules_arranged/Khasi_Lineage_Act_1997.pdf"}
  - {instrument: "Khasi Hills Autonomous District (Regulation and Administration of Land) Act, 2021, et règles de 2023", nature: "loi", annee: 2021, source: "https://hubnetwork.in/khadc-lauds-guvs-assent-to-six-key-bills-enhancing-village-administration-and-tribal-land-rights/"}
  - {instrument: "Ordonnance de 2026 sur les langues officielles du Meghalaya (ordonnance no 1 de 2026), abrogeant la loi de 2005 sur la langue de l'État", nature: "loi", annee: 2026, source: "https://theshillongtimes.com/2026/04/28/guv-nod-to-khasi-garo-as-official-state-languages-along-with-english/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Conseil de district d'au plus trente membres, dont quatre au plus nommés par le gouverneur et les autres élus au suffrage universel, Sixième annexe (régime des districts tribaux autonomes), paragraphe 2 (1). Au niveau du village, le dorbar shnong (assemblée coutumière de village, présidée par le rangbah shnong, chef de village) a longtemps fonctionné sans base légale propre : le projet de loi du conseil sur l'administration des villages, adopté le 1er juillet 2014, n'a pas reçu l'assentiment du gouverneur ; la loi du conseil de 2021 crée des conseils de développement de village rattachés au dorbar shnong (Shillong Times, 2024) ; la loi modificative de 2023 sur l'administration des elaka, approuvée par le gouverneur en octobre 2024, reconnaît les organisations de femmes et de jeunes au sein du dorbar shnong et oblige les locataires à s'y enregistrer (Hub Network, 30 octobre 2024).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil légifère sur les terres hors forêts classées, les forêts non classées, la culture itinérante (jhum), l'administration des villages, la désignation des chefs, l'héritage, le mariage et les coutumes, Sixième annexe, paragraphe 3 ; au Meghalaya, une loi de l'État contraire l'emporte sur la loi du conseil, paragraphe 12A (a).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  justice_propre: {valeur: "reconnu", note: "Trois degrés de juridiction (tribunaux de village, tribunaux subordonnés, tribunal du conseil de district) pour les affaires civiles et pénales entre membres des tribus répertoriées, selon les règles d'administration de la justice de 1953 prises en application du paragraphe 4 de la Sixième annexe ; ces tribunaux de village siègent au niveau des raid (groupements de villages) et des chefs coutumiers, non au niveau du dorbar shnong (Shillong Times, 2024).", source: "https://khadc.nic.in/judiciary.html"}
  terres: {valeur: "partiel", note: "Compétence législative sur l'attribution, l'occupation et l'usage des terres hors forêts classées, Sixième annexe, paragraphe 3 (1) (a) ; l'État conserve le pouvoir d'expropriation pour cause d'utilité publique. La loi du conseil de 2021 sur la réglementation et l'administration des terres et ses règles de 2023, approuvées en octobre 2024, permettent l'enregistrement des terres auprès du conseil (Hub Network, 2024). Un projet de loi modificatif adopté le 19 juin 2026 supprime la consultation préalable des dorbar de village, de raid et de hima avant la fixation de plafonds sur les terres de raid ; contesté par les institutions coutumières, il était en août 2026 à l'examen du département des affaires des conseils de district, sans assentiment (Shillong Times, 12 août 2026).", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  ressources: {valeur: "partiel", note: "Gestion des forêts non classées et usage des canaux pour l'agriculture, Sixième annexe, paragraphe 3 (1) (b) et (c) ; part des redevances minières fixée par accord avec l'État, ou par le gouverneur en cas de désaccord, paragraphe 9.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Le khasi était langue officielle associée du Meghalaya depuis la loi de 2005 sur la langue de l'État. L'ordonnance no 1 de 2026 sur les langues officielles, promulguée le 27 avril 2026, abroge cette loi et fait de l'anglais, du khasi et du garo les langues officielles de l'État à partir d'une date fixée par notification ; l'anglais reste la langue des tribunaux et de l'Assemblée, et le khasi peut être employé avec l'anglais dans les bureaux de district, de subdivision et de bloc des Khasi et Jaintia Hills.", source: "https://theshillongtimes.com/2026/04/28/guv-nod-to-khasi-garo-as-official-state-languages-along-with-english/"}
  education: {valeur: "conteste", note: "Le conseil peut créer et gérer des écoles primaires et fixer la langue et les modalités de l'enseignement primaire, avec l'accord préalable du gouverneur, Sixième annexe, paragraphe 6 (1). L'État a repris la gestion de l'enseignement primaire après le rapport de la commission S. K. Dutta (1984), puis l'a conservée par une loi du Meghalaya de 1993 (Banque mondiale).", source: "https://documents1.worldbank.org/curated/en/659621527600675940/pdf/105738-WP-P151154-PUBLIC-Capacity-and-Functioning-India.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de district propre, paragraphe 7 ; perception de l'impôt foncier et de taxes sur les terres et bâtiments, les professions, les animaux, les véhicules et les marchés, paragraphe 8 ; réglementation des prêts d'argent et du commerce des personnes n'appartenant pas aux tribus répertoriées, paragraphe 10, Sixième annexe.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  representation: {valeur: "partiel", note: "Sièges réservés aux tribus répertoriées (Scheduled Tribes, liste officielle des tribus) à l'Assemblée de l'État, en proportion de leur population, Constitution, art. 332 ; la réserve vise l'ensemble des tribus répertoriées et non les Khasi seuls.", source: "https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2024/07/20240716890312078.pdf"}
  statut_personnel: {valeur: "reconnu", note: "Loi du conseil sur la coutume khasi de filiation (1997, assentiment et publication en février 2005) : l'enfant de deux parents khasi prend le clan (kur ou jait) de sa mère, art. 3 ; perte du statut khasi et des droits successoraux pour qui n'observe plus le système matrilinéaire, art. 10 et 11. Une loi modificative de 2023 sur l'enregistrement des clans a reçu l'assentiment du gouverneur en octobre 2024 (Hub Network).", source: "https://khadc.nic.in/acts_rules_regulations_bills/Acts_Rules_arranged/Khasi_Lineage_Act_1997.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une note de la Banque mondiale (enquête de 2015) conclut que le conseil peine à exercer ses fonctions : l'article 12A fait prévaloir les lois de l'État, l'enseignement primaire a été repris par l'État, la perception des taxes dépend de l'État et des chefs, et les recettes dépendent des transferts. Le conseil a été renouvelé le 21 février 2025 (29 élus). Les projets de loi du conseil attendent souvent l'assentiment : six textes adoptés en 2023 ont été approuvés en octobre 2024 ; le projet foncier de juin 2026 est contesté par les institutions coutumières.", source: "https://documents1.worldbank.org/curated/en/659621527600675940/pdf/105738-WP-P151154-PUBLIC-Capacity-and-Functioning-India.pdf"}
chronologie:
  - {annee: 1952, evenement: "Création du conseil des Khasi et Jaintia Hills en juin."}
  - {annee: 1967, evenement: "Séparation du conseil des Jaintia Hills."}
  - {annee: 1993, evenement: "Une loi du Meghalaya maintient sous gestion de l'État l'enseignement primaire repris au conseil."}
  - {annee: 1997, evenement: "Loi sur la coutume khasi de filiation, approuvée et publiée en février 2005."}
  - {annee: 2014, evenement: "Le conseil adopte le projet de loi sur l'administration des villages ; le 10 décembre, la Haute Cour du Meghalaya interdit à l'administration d'exiger un certificat du chef de village, ce que le syndicat des chefs de village refuse d'appliquer."}
  - {annee: 2021, evenement: "Lois du conseil sur les conseils de développement de village et de ville et sur la réglementation et l'administration des terres."}
  - {annee: 2024, evenement: "En octobre, le gouverneur approuve six textes du conseil adoptés en 2023, dont la loi modificative sur l'administration des elaka et les règles foncières."}
  - {annee: 2025, evenement: "Élection du conseil le 21 février."}
  - {annee: 2026, evenement: "Le 27 avril, ordonnance sur les langues officielles (anglais, khasi, garo) ; le 19 juin, le conseil adopte un projet de loi foncier qui supprime la consultation des dorbar, contesté par les institutions coutumières."}
