resume: >-
  Le traité entre l'Australie et la Papouasie-Nouvelle-Guinée signé à Sydney le 18 décembre 1978, en vigueur depuis le 15 février 1985, crée une zone protégée dans le détroit de Torrès. L'objet principal de cette zone (art. 10) est de reconnaître et protéger le mode de vie et les moyens de subsistance des « habitants traditionnels » des deux pays : insulaires du détroit de nationalité australienne et habitants de la côte papoue voisine. Ces habitants circulent dans la zone sans passeport ni visa pour leurs activités traditionnelles, la pêche traditionnelle a priorité sur la pêche commerciale, et un conseil consultatif conjoint doit les consulter. En Australie, le traité figure en annexe du Torres Strait Fisheries Act 1984 (loi sur les pêcheries du détroit de Torrès). Les insulaires du côté australien font aussi l'objet de la fiche « Insulaires du détroit de Torrès ».
