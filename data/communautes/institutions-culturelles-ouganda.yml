resume: >-
  La Constitution ougandaise de 1995 (art. 246) autorise l'existence d'institutions de dirigeant traditionnel ou culturel (rois et dirigeants équivalents) selon la coutume des communautés concernées. Les royaumes abolis en 1967 sont restaurés en 1993, le Buganda en premier ; une loi de la même année leur restitue des biens. Chaque institution est une personne morale qui détient des biens en fiducie pour la communauté, mais n'exerce aucun pouvoir administratif, législatif ou exécutif. La loi de 2011 fixe la procédure de reconnaissance par publication au Journal officiel ; 17 dirigeants y figuraient en 2024. Les terres détenues en commun font l'objet de la fiche « Associations de terres communales d'Ouganda ».
