reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Le Rapporteur spécial cite le règlement Waikato-Tainui, par lequel l'État et les iwi se partagent la gouvernance et la gestion du fleuve Waikato, comme exemple de responsabilités partagées sur les ressources naturelles (A/HRC/18/35/Add.4, § 20 e))", annee: 2011, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national à la Convention sur la diversité biologique : la loi de 2010 crée l'Autorité du fleuve Waikato, fiduciaire du Waikato River Clean-up Trust, qui administre un fonds de restauration de 220 millions de dollars sur trente ans ; la loi est citée parmi les exemples de cogestion inscrits dans les règlements du traité", annee: 2014, source: "https://www.cbd.int/doc/world/nz/nz-nr-05-en.pdf"}
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010, à la session de l'Instance permanente (A/HRC/18/35/Add.4, § 3)", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
