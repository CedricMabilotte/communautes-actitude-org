droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 2010 (s. 22) crée l'Autorité du fleuve Waikato, organe statutaire de dix membres : un nommé par chacun des cinq iwi du fleuve, cinq nommés par la Couronne, dont un sur proposition du conseil régional et un sur proposition des autorités territoriales. Les iwi choisissent l'un des deux co-présidents, le ministre de l'Environnement l'autre. L'organe est partagé avec l'État, et non propre aux iwi.", source: "https://ao.parliament.nz/2016/co-governance/appendix1.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "La Vision et Stratégie du fleuve est réputée faire partie de la déclaration de politique régionale (document de planification régionale) du Waikato et prévaut sur les dispositions contraires d'une déclaration de politique nationale (loi de 2010, s. 11 et 12) ; l'Autorité la réexamine et peut en recommander la modification à la Couronne et aux iwi (s. 23). Dans la zone de pêche Waikato-Tainui, les règlements locaux approuvés par le ministre (avis du 22 février 2014, pris en vertu de la règle 23 (6) des règlements de 2011) permettent au Waikato Raupatu River Trust (fiducie de Waikato-Tainui) d'interdire la pêche après un décès, sur 10 km au plus et 14 jours au plus, et ses autorisations coutumières prévalent sur ces règlements en cas de conflit.", source: "https://www.mpi.govt.nz/dmsdocument/55501-Fisheries-Declaration-of-Waikato-Tainui-Fisheries-Area-Bylaws-Notice-2014"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La loi de 2010 autorise les membres de Waikato-Tainui à exercer des activités coutumières sur le fleuve (s. 57 et 58) et à conserver les postes de pêche du blanchon et les barrages à anguilles en place au 17 décembre 2009 (s. 59). Les règlements locaux de la zone de pêche Waikato-Tainui (avis de 2014) fixent pour la pêche commerciale de l'anguille des poids minimaux et maximaux et une fermeture saisonnière du 1er mars au 31 mai dans certains cours d'eau. La loi de 2012 prévoit des règlements confiant à la fiducie de Maniapoto la gestion de la pêche coutumière sur la Waipā (s. 32).", source: "https://www.mpi.govt.nz/dmsdocument/55501-Fisheries-Declaration-of-Waikato-Tainui-Fisheries-Area-Bylaws-Notice-2014"}
  consentement: {valeur: "partiel", note: "Chaque collectivité locale doit conclure avec le Waikato Raupatu River Trust un accord de cogestion (joint management agreement) au plus tard dix-huit mois après la date du règlement (loi de 2010, s. 41), portant sur le suivi et le contrôle, l'élaboration des documents de planification au titre de la loi sur la gestion des ressources (RMA) et l'instruction des autorisations d'usage des ressources (s. 43, 45 à 47) ; même obligation envers la fiducie de Maniapoto sur la Waipā (loi de 2012, s. 17). Il s'agit d'une participation, non d'un droit de veto.", source: "https://www.legislation.govt.nz/act/public/2010/0024/latest/whole.html"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'Autorité, seule fiduciaire du Waikato River Clean-up Trust (loi de 2010, s. 32), reçoit en vertu de l'acte de règlement 7,333 millions de dollars par an jusqu'en 2036 et 7,342 millions en 2037-2038, dont 333 000 dollars par an issus du règlement Maniapoto ; ce fonds, affecté à la restauration du fleuve, est géré par l'organe paritaire et non par les iwi seuls.", source: "https://ao.parliament.nz/2016/co-governance/part6.htm"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Bureau du vérificateur général décrit en 2016 une Autorité en fonctionnement : rapport annuel présenté au Parlement, audit annuel, financement de projets de restauration et création d'un fonds de dotation pour prolonger l'action au-delà des trente ans de financement de la Couronne. Il relève aussi que l'azote dans le fleuve a augmenté depuis vingt ans et que la restauration prendra longtemps. En 2026, le site de l'Autorité annonce un appel à projets et un rapport annuel 2025.", source: "https://ao.parliament.nz/2016/co-governance/part6.htm"}
chronologie:
  - {annee: 1995, evenement: "Waikato Raupatu Claims Settlement Act : règlement des confiscations de terres (raupatu) de Waikato-Tainui, hors fleuve."}
  - {annee: 2004, evenement: "Ouverture de la zone de règlements de pêche coutumière Waikato-Tainui (18 décembre, selon le ministère des Industries primaires)."}
  - {annee: 2008, evenement: "Acte de règlement du 22 août entre la Couronne et Waikato-Tainui sur le fleuve."}
  - {annee: 2009, evenement: "Second acte de règlement entre la Couronne et Waikato-Tainui, daté du 17 décembre."}
  - {annee: 2010, evenement: "Loi du 7 mai (Waikato-Tainui) et loi sur les iwi de Tūwharetoa, Raukawa et Te Arawa ; l'Autorité du fleuve Waikato est mise en place le 25 novembre."}
  - {annee: 2011, evenement: "Règlements sur les pêcheries du fleuve Waikato (Waikato-Tainui)."}
  - {annee: 2012, evenement: "Loi Nga Wai o Maniapoto (Waipa River) du 5 avril : Maniapoto entre à l'Autorité, la Vision et Stratégie s'étend à la haute Waipā."}
  - {annee: 2014, evenement: "Avis du 22 février approuvant les règlements de pêche de la zone Waikato-Tainui."}
  - {annee: 2016, evenement: "Rapport du vérificateur général sur la co-gouvernance des ressources naturelles, avec une annexe consacrée à l'Autorité."}
fiabilite:
  verifie: ["Date de sanction, définitions des actes de 2008 et 2009, s. 11, 12, 22, 23, 32, 41, 43, 57 à 59 de la loi de 2010 (legislation.govt.nz).", "Composition (10 membres : un par iwi, cinq pour la Couronne dont un proposé par le conseil régional et un par les autorités territoriales), co-présidence, mise en place le 25 novembre 2010, bassin de 11 000 km² et double base légale : annexe 1 du rapport du vérificateur général (2016).", "Montants annuels du Clean-up Trust et part Maniapoto : partie 6 du même rapport.", "Loi de 2012 sur la Waipā : date, s. 8, 10, 17 et 32.", "Avis du 22 février 2014 (MPI) : approbation ministérielle en vertu de la règle 23 (6) des règlements de 2011, fermeture après décès décidée par la fiducie, poids minimaux et maximaux, fermeture saisonnière.", "§ 3 et § 20 e) du rapport A/HRC/18/35/Add.4.", "Passage du cinquième rapport national à la CDB sur l'Autorité et le fonds de 220 millions.", "Activité de l'Autorité en 2026 : site waikatoriver.org.nz."]
  non_confirme: ["Le texte de la loi de 2010 sur Ngāti Tūwharetoa, Raukawa et Te Arawa n'a pas pu être ouvert ; son contenu vient du rapport du vérificateur général.", "Le texte de l'article 93 de la loi de 2010 (règlements) et celui des règlements de 2011 n'ont pas pu être lus ; l'auteur des règlements locaux de pêche (fiducie ou ministère) n'est pas établi.", "Population totale des cinq iwi : aucun chiffre agrégé trouvé ; l'annuaire officiel donne 40 083 pour Waikato-Tainui (2013), sans précision suffisante sur le mode de comptage.", "Le CERD (2025) s'inquiète de propositions qui affaiblissent la co-gouvernance en général, sans nommer l'Autorité du fleuve Waikato.", "Écart entre la date du 18 décembre 2004 (page du ministère) et les règlements de 2011 pour la zone de pêche Waikato-Tainui.", "Effet sur l'Autorité de la réforme en cours de la loi sur la gestion des ressources : non examiné.", "Nombre de villages : non trouvé."]
