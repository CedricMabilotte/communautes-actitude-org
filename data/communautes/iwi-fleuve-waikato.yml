resume: >-
  Cinq iwi (peuples māori) riverains du fleuve Waikato et de son affluent la Waipā : Waikato-Tainui, Te Arawa, Ngāti Tūwharetoa, Raukawa et Maniapoto. Deux lois de 2010, issues des règlements des revendications fondées sur le traité de Waitangi, créent l'Autorité du fleuve Waikato (Waikato River Authority), organe statutaire de dix membres dont cinq nommés par les iwi, avec une co-présidence iwi. L'Autorité est gardienne de la « Vision et Stratégie » du fleuve, que la loi intègre à la déclaration de politique régionale du Waikato. La loi de 2012 sur la Waipā étend le dispositif à Maniapoto. Dans la zone de pêche Waikato-Tainui, des règlements locaux approuvés par le ministre s'appliquent à l'anguille, et la fiducie de Waikato-Tainui peut y interdire temporairement la pêche.
