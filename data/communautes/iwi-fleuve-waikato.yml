  - {instrument: "Ngāti Tūwharetoa, Raukawa, and Te Arawa River Iwi Waikato River Act 2010, s. 23 (1)", nature: "accord_revendication", annee: 2010, source: "https://ao.parliament.nz/2016/co-governance/appendix1.htm"}
