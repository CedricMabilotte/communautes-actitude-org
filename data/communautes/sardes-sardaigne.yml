resume: >-
  La Sardaigne et ses îles forment une région autonome à statut spécial (loi constitutionnelle n° 3 du 26 février 1948). Le Conseil régional légifère notamment sur l'agriculture et les forêts, la chasse et la pêche, et les usi civici (droits d'usage collectifs des habitants sur des terres). La loi 482/1999 range le sarde et le catalan parmi les douze minorités linguistiques historiques de l'Italie. La loi régionale n° 22 du 3 juillet 2018 organise la politique linguistique pour le sarde, le catalan d'Alghero, le gallurais, le sassarais et le tabarquin.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Sixième avis du Comité consultatif de la Convention-cadre sur l'Italie, § 19 et 20 : le sarde figure parmi les minorités linguistiques historiques de la loi 482/1999 ; la loi régionale n° 22/2018 définit les compétences de la Région en matière de politique linguistique.", annee: 2026, source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-en/48802bdf6e"}
