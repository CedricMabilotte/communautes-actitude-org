resume: >-
  La Hongrie reconnaît treize nationalités ; cette fiche couvre onze d'entre elles, les Roms et les Allemands sont traités à part. La Loi fondamentale de 2011 leur reconnaît le droit de créer des autogouvernements locaux et nationaux (art. XXIX), organisés par la loi CLXXIX de 2011 sur les droits des nationalités. Les électeurs inscrits sur la liste d'une nationalité élisent ses autogouvernements locaux, territoriaux et national, qui donnent leur avis ou leur consentement sur l'éducation, la culture et l'usage de la langue et peuvent reprendre des établissements scolaires et culturels. Chaque nationalité dispose d'un porte-parole à l'Assemblée nationale lorsque sa liste n'obtient pas de mandat préférentiel (siège attribué avec un nombre de voix réduit).
