  - {instrument: "Loi fondamentale de la Hongrie (2011), préambule, art. 2 al. 2 et art. XXIX", nature: "constitution", annee: 2011, source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  - {instrument: "Loi CLXXIX de 2011 sur les droits des nationalités", nature: "loi", annee: 2011, source: "https://njt.hu/translation/J2011T0179P_20171221_FINrev.pdf"}
