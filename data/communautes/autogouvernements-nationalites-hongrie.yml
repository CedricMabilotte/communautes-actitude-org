droits:
  autogouvernement: {valeur: "reconnu", note: "Les nationalités ont le droit de créer des autogouvernements locaux et nationaux, Loi fondamentale, art. XXIX, al. 2 ; la loi CLXXIX de 2011 fixe les règles de leur élection ; en 2019, 574 autogouvernements locaux et 27 territoriaux pour ces onze nationalités, plus un autogouvernement national par nationalité (Office national des élections, cité par B. Dobos, 2022).", source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Les décisions de la commune qui touchent la nationalité, notamment sur l'usage collectif de la langue, l'éducation, les traditions et la culture, la presse locale, l'égalité des chances et l'action sociale, requièrent le consentement de l'autogouvernement local de nationalité, loi CLXXIX de 2011, art. 81, al. 1.", source: "https://njt.hu/translation/J2011T0179P_20171221_FINrev.pdf"}
  langue: {valeur: "partiel", note: "Droit d'utiliser sa langue maternelle et de recevoir un enseignement dans cette langue, Loi fondamentale, art. XXIX, al. 1 ; aucun statut de langue officielle territoriale.", source: "https://www.constituteproject.org/constitution/Hungary_2016"}
  education: {valeur: "partiel", note: "Les autogouvernements peuvent fonder, administrer et reprendre (prendre en charge à la place de l'État ou de la commune) des établissements scolaires et culturels, loi CLXXIX de 2011, art. 19, 24 et 36.", source: "https://njt.hu/translation/J2011T0179P_20171221_FINrev.pdf"}
  fiscalite: {valeur: "partiel", note: "Les autogouvernements de tous niveaux ont droit à un soutien normatif de l'État (dotation calculée selon des critères fixés), dont le montant est fixé chaque année par la loi de finances ; aucun pouvoir fiscal propre n'est mentionné.", source: "https://www.world-autonomies.info/non-territorial-autonomies/hungary"}
  representation: {valeur: "partiel", note: "La participation des nationalités à l'Assemblée nationale est réglée par une loi cardinale (loi votée à la majorité des deux tiers), Loi fondamentale, art. 2, al. 2 ; selon la loi CCIII de 2011, une liste de nationalité sans mandat préférentiel obtient un porte-parole sans droit de vote.", source: "https://www.world-autonomies.info/non-territorial-autonomies/hungary"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2019, en moyenne 66 % des membres recensés d'une nationalité vivaient dans une commune dotée d'un autogouvernement local de cette nationalité (91 % pour les Roms, 45 % pour les Ukrainiens) ; l'étude de B. Dobos (Eurac Research, 2022) relève une bureaucratisation et une centralisation qui font souvent agir ces organes comme des agences publiques spécialisées.", source: "https://www.world-autonomies.info/non-territorial-autonomies/hungary"}
chronologie:
