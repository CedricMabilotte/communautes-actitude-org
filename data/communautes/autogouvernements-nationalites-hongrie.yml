  - {annee: 2011, evenement: "Loi fondamentale (art. XXIX), loi CLXXIX sur les droits des nationalités et loi CCIII sur l'élection des députés."}
  - {annee: 2014, evenement: "Première législature avec des porte-parole des nationalités à l'Assemblée nationale."}
  - {annee: 2019, evenement: "Élection de 574 autogouvernements locaux pour les onze nationalités, dont 116 croates et 112 slovaques."}
  - {annee: 2024, evenement: "Élections des autogouvernements des nationalités : 2 146 autogouvernements locaux et 64 territoriaux, toutes nationalités confondues."}
