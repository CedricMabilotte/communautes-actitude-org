resume: >-
  La Première Nation de Westbank est l'une des huit communautés de la Nation okanagan (syilx), autour de Kelowna, surtout sur la rive ouest du lac Okanagan. Son accord d'autonomie gouvernementale avec le Canada, ratifié par les membres le 24 mai 2003, a reçu force de loi par la Loi sur l'autonomie gouvernementale de la première nation de Westbank (L.C. 2004, ch. 17), en vigueur depuis le 1er avril 2005. La Loi sur les Indiens (loi fédérale qui régit les bandes et les réserves) ne s'applique plus à la Nation que dans la mesure prévue par l'accord. Le conseil, élu selon une constitution propre, légifère sur les terres de Westbank : appartenance, gestion foncière, ressources, environnement, culture et langue okanagan, éducation, ordre public.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien pour les peuples autochtones au sens de l'article 35 de la Loi constitutionnelle de 1982.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Loi sur l'autonomie gouvernementale de la première nation de Westbank, L.C. 2004, ch. 17", nature: "loi", annee: 2004, source: "https://laws-lois.justice.gc.ca/fra/lois/W-6.2/TexteComplet.html"}
  - {instrument: "Accord d'autonomie gouvernementale de la première nation de Westbank (signé le 3 octobre 2003)", nature: "accord_revendication", annee: 2003, source: "https://www.wfn.ca/docs/self-government-agreement-french.pdf"}
  - {instrument: "Constitution de la Première Nation de Westbank (prévue aux art. 42 à 45 de l'accord, ratifiée avec lui en 2003, en vigueur le 1er avril 2005)", nature: "statut_autonomie", annee: 2005, source: "https://www.wfn.ca/self-government-laws.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'accord reconnaît à la Nation la capacité de se gouverner et d'agir par son conseil (art. 20 et 21) ; la constitution prévoit l'élection démocratique du conseil par les membres (art. 43 b).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le conseil adopte des lois de Westbank dans les domaines des parties VII à XXIII de l'accord ; l'accord a force de loi et l'emporte sur les lois fédérales incompatibles (loi de 2004, art. 3 et 5) ; la Loi sur les textes réglementaires ne s'applique pas aux lois de Westbank (art. 8).", source: "https://laws-lois.justice.gc.ca/fra/lois/W-6.2/TexteComplet.html"}
  justice_propre: {valeur: "partiel", note: "Les lois de Westbank peuvent créer des tribunaux et organismes administratifs (art. 47 de l'accord) ; les infractions sont jugées par la Cour provinciale de Colombie-Britannique (art. 201) et le contrôle judiciaire relève de la Cour suprême de la province (art. 48).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  terres: {valeur: "reconnu", note: "Le titre reste à la Couronne fédérale, mais la Nation exerce les droits d'un propriétaire sur les terres de Westbank (art. 87 et 89) ; ces terres ne peuvent être aliénées que par échange approuvé par les membres (art. 92), sous réserve d'une expropriation fédérale autorisée par le gouverneur en conseil pour un besoin public fédéral (art. 111 à 114).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  ressources: {valeur: "partiel", note: "Compétence sur les ressources renouvelables (faune, chasse, forêts) et non renouvelables (pétrole, gaz, gravier, pierre) des terres de Westbank (art. 135 et 138), à l'exclusion du poisson et de son habitat, des minéraux (or, argent et autres minéraux utiles) et de l'uranium ; l'eau seulement dans la mesure des droits reconnus (art. 136).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  consentement: {valeur: "partiel", note: "Pour un projet soumis à l'évaluation environnementale fédérale et susceptible d'effets environnementaux négatifs importants sur les terres de Westbank, le Canada doit informer et consulter la Nation (art. 172 b) ; en cas d'examen public, la Nation propose un membre de la commission (art. 172 a). Sur ses terres, la Nation conduit sa propre évaluation environnementale (art. 169).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  langue: {valeur: "partiel", note: "Compétence sur l'usage, la préservation et la promotion de la langue okanagan (nqilxʷcn) et l'agrément de son enseignement sur les terres de Westbank (art. 175 d et e) ; aucun statut de langue officielle dans l'accord.", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  education: {valeur: "partiel", note: "Compétence sur l'enseignement de la maternelle au secondaire pour les membres sur les terres de Westbank (art. 186), avec préséance sur le droit fédéral en cas de conflit (art. 190).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  fiscalite: {valeur: "partiel", note: "La Nation lève l'impôt foncier sur les terres de Westbank par des règlements pris en vertu de l'article 83 de la Loi sur les Indiens, maintenu par l'art. 275 de l'accord ; tout autre impôt direct dépend d'accords à négocier avec le Canada (art. 260).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La Nation a compétence sur l'appartenance à la Nation (art. 70), avec préséance sur le droit fédéral (art. 77) ; l'inscription au registre des Indiens reste fédérale (art. 73).", source: "https://www.wfn.ca/docs/self-government-agreement-english.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "La Commission de la fiscalité des premières nations (organisme fédéral) relève en 2017 que l'impôt foncier de la Nation est passé de 750 000 dollars en 1990 à près de 14 millions prévus pour 2017-2018, avec plus de 400 entreprises sur les terres de Westbank depuis l'accord de 2005 ; la Nation publie plus de trente lois en vigueur (utilisation des sols, lotissement, construction, biens familiaux, accès à l'information) ; la province liste des accords forestiers de consultation et de partage des revenus signés en 2017, 2021 et 2024.", source: "https://fntc.ca/first-nations/westbank-first-nation/"}
chronologie:
  - {annee: 1963, evenement: "Séparation d'avec la bande indienne d'Okanagan (18 octobre) ; les réserves Tsinstikeptum 9 et 10 et Mission Creek 8 sont attribuées à la bande de Westbank."}
  - {annee: 1973, evenement: "Déclaration de la bande de Westbank au sens de la Loi sur les Indiens (décret C.P. 1973-3571)."}
  - {annee: 2003, evenement: "Ratification de l'accord et de la constitution par les membres (24 mai) ; signature de l'accord avec le Canada (3 octobre)."}
  - {annee: 2004, evenement: "Sanction de la Loi sur l'autonomie gouvernementale de la première nation de Westbank (6 mai)."}
  - {annee: 2005, evenement: "Entrée en vigueur de la loi et de l'accord (1er avril)."}
  - {annee: 2009, evenement: "La Nation suspend sa participation au processus des traités de la Colombie-Britannique (étape 4)."}
