resume: >-
  Minorité religieuse germanophone issue de migrations venues du Canada (1926-1927), d'Union soviétique et d'Europe à partir de 1930. La loi 514 du 26 juillet 1921 accorde aux membres de la communauté dite « mennonite » la liberté de culte, l'exemption du service militaire, le droit de fonder et d'administrer leurs écoles en allemand et l'administration des successions et des biens des veuves et des orphelins par une institution propre (Waisenamt, « office des orphelins »). La loi 914 de 1927 étend ce régime aux autres communautés non combattantes et aux communautés religieuses d'origine américaine ou européenne qui s'installent dans le Chaco, ces dernières sans l'exemption du service militaire. La loi 514 mentionne des « autorités compétentes » des colonies, reconnues par les colons (art. 2 et 6).
