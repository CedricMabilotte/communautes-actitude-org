chronologie:
  - {annee: 1921, evenement: "Loi 514 du 26 juillet sur les droits et privilèges des membres de la communauté mennonite."}
  - {annee: 1927, evenement: "Arrivée de 1 745 mennonites du Canada (décembre 1926 - novembre 1927), fondation de la colonie Menno ; loi 914 du 25 août étendant le régime."}
  - {annee: 1930, evenement: "Fondation de la colonie Fernheim par des mennonites venus d'Union soviétique ; décret 43.561 de 1932 étendant le régime à ce groupe."}
  - {annee: 1937, evenement: "Fondation de la colonie Friesland dans la Région orientale."}
  - {annee: 1947, evenement: "Arrivée d'environ 4 500 mennonites d'Europe (1947-1948) ; fondation des colonies Neuland (Chaco) et Volendam (Région orientale), qui comptent 2 389 et 1 172 habitants en 1948."}
