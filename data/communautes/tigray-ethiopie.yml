resume: >-
  Les Tigréens forment une « nation, nationalité et peuple » au sens de la Constitution fédérale de 1994, dans le nord de l'Éthiopie.
  L'État du Tigray est le premier des neuf États membres énumérés par la Constitution (art. 47), avec un droit à l'autodétermination, sécession comprise (art. 39).
  Après la guerre de 2020-2022, l'Accord de cessation des hostilités signé à Pretoria le 2 novembre 2022 sous médiation de l'Union africaine prévoit une administration régionale intérimaire (art. 10(1)), mise en place en mars 2023 sur décision fédérale.
  En mai 2026, le Front populaire de libération du Tigray (TPLF) écarte le président intérimaire nommé par le gouvernement fédéral ; les combats reprennent en septembre 2026.
