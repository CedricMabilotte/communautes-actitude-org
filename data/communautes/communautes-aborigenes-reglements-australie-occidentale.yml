resume: >-
  Fiche agrégée : elle couvre les communautés aborigènes constituées en associations auxquelles s'applique l'Aboriginal Communities Act 1979, loi de l'État d'Australie-Occidentale entrée en vigueur le 15 février 1980. Le conseil d'une communauté déclarée par proclamation du gouverneur peut édicter des règlements (by-laws, règles locales obligatoires) sur l'accès aux terres communautaires, la circulation, l'alcool et les drogues, les armes, les dégâts aux plantations et le désordre ; ils s'appliquent à toute personne présente sur ces terres, membre ou non. Les règlements sont approuvés par le gouverneur, sanctionnés par une amende d'au plus 5 000 dollars versée au conseil, et ne dérogent pas au droit de l'État. Le registre officiel de la législation compte 27 règlements en vigueur, adoptés entre 1980 et 2006.
