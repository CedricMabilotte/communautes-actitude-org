droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil de gestion de la communauté constituée en association exerce les pouvoirs de la loi après déclaration par le gouverneur, sur avis du ministre (Bidyadanga et l'association Bardi sont désignées par la loi elle-même), à condition que les statuts obligent le conseil à consulter les membres (s. 3 et 4) ; le gouverneur peut retirer cette déclaration, ce qui révoque les règlements (s. 5).", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_24182.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil adopte à la majorité absolue des règlements sur les matières énumérées (accès, circulation, alcool et substances nocives, armes, désordre, déchets), approuvés par le gouverneur et publiés au Journal officiel (s. 7 et 8) ; ils ne restreignent aucune responsabilité prévue par une autre loi ni par la common law, droit issu de la jurisprudence (s. 13).", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_24182.htm"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi ne confère pas de titre de propriété ; le gouverneur délimite par proclamation les terres communautaires (s. 6), dont le conseil peut interdire ou réglementer l'accès (s. 7(1)(a)) ; à Bidyadanga, une personne non membre ne peut s'y trouver qu'avec la permission du conseil (règlement de 2004, art. 4).", source: "https://www.legislation.wa.gov.au/legislation/statutes.nsf/RedirectURL?OpenAgent&query=mrdoc_49312.htm"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
