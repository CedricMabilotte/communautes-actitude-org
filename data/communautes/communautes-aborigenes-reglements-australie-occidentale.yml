effectivite: {valeur: "non_etablie", note: "La Commission australienne de réforme du droit (rapport 31, 1986, § 755-757) rapporte des avis divergents : le gouvernement précédent de l'État jugeait le dispositif très réussi, le ministre en fonction disait son effet variable selon les communautés, et une étude d'A. Hoddinott (1985) lui reprochait de ne pas intégrer le droit coutumier ; les infractions aux règlements relèvent des juridictions ordinaires (§ 750). Aucune évaluation récente de l'application des 27 règlements n'a été consultée.", source: "https://www.alrc.gov.au/publication/recognition-of-aboriginal-customary-laws-alrc-report-31/29-special-aboriginal-courts-and-justice-schemes/aboriginal-courts-in-western-australia/"}
chronologie:
  - {annee: 1979, evenement: "Sanction de l'Aboriginal Communities Act le 17 mai ; la loi vise d'emblée Bidyadanga (La Grange) et l'association Bardi (One Arm Point)."}
  - {annee: 1980, evenement: "Entrée en vigueur de la loi le 15 février ; publication des règlements de l'association Bardi le 7 novembre."}
  - {annee: 1982, evenement: "Règlements de Lombadina, Beagle Bay et Balgo Hills."}
  - {annee: 1989, evenement: "Règlements du Ngaanyatjarra Council."}
  - {annee: 1991, evenement: "Onze règlements publiés, dont dix toujours en vigueur (parmi eux Jigalong, Kalumburu, Looma, Oombulgurri et Mt Margaret)."}
  - {annee: 2004, evenement: "Nouveaux règlements de Bidyadanga, qui remplacent ceux de 1980 ; deux lois de 2004, en vigueur en mai 2005, fixent un délai de prescription de six mois (s. 10) et abrogent la section 11."}
  - {annee: 2006, evenement: "Derniers règlements publiés : Bayulu, Warmun et Parnpajinya."}
