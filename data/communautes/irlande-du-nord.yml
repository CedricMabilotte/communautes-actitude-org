droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée élue et exécutif à partage du pouvoir : le premier ministre est désigné par le premier parti de la plus grande désignation, le vice-premier ministre par le premier parti de la deuxième désignation, Northern Ireland Act 1998, s. 16A, al. 4 et 5.", source: "https://www.legislation.gov.uk/ukpga/1998/47/section/16A"}
  pouvoir_normatif: {valeur: "reconnu", note: "L'Assemblée fait des lois (Acts) dans les matières transférées, c'est-à-dire non exclues ni réservées, Northern Ireland Act 1998, s. 4, al. 1, et s. 5, al. 1 ; le Parlement du Royaume-Uni garde le pouvoir de légiférer pour l'Irlande du Nord (s. 5, al. 6).", source: "https://www.legislation.gov.uk/ukpga/1998/47/section/5"}
  justice_propre: {valeur: "partiel", note: "Une loi de l'Assemblée peut créer un ministère chargé des compétences dévolues de police et de justice, dont le ministre est désigné par une résolution adoptée à la majorité des votants, à la majorité des nationalistes votants et à la majorité des unionistes votants, Northern Ireland Act 1998, s. 21A, al. 1, 3 et 3A (insérée en 2009).", source: "https://www.legislation.gov.uk/ukpga/1998/47/section/21A"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les décisions clés de l'Assemblée exigent le soutien intercommunautaire (majorité parallèle des nationalistes et des unionistes, ou 60 % des votants avec 40 % de chaque désignation), Northern Ireland Act 1998, s. 4, al. 5, et une pétition de préoccupation de 30 députés impose ce soutien sur un vote (s. 42) : ce sont des règles de vote internes à l'Assemblée ; le seul consentement opposable à une décision extérieure est le vote de l'Assemblée sur le maintien des articles 5 à 10 du cadre de Windsor, annexe 6A, limité à ce domaine.", source: "https://www.legislation.gov.uk/ukpga/1998/47/section/4"}
  langue: {valeur: "partiel", note: "La partie 7B du Northern Ireland Act 1998 (s. 78J et suivantes, ajoutées par l'Identity and Language (Northern Ireland) Act 2022, s. 2) reconnaît officiellement le statut de la langue irlandaise, sans en faire une langue co-officielle : un commissaire à la langue irlandaise, nommé et dirigé conjointement par le premier ministre et le vice-premier ministre, rédige des normes de bonne pratique que les autorités publiques doivent prendre en compte (s. 78J à 78M) ; la s. 3 crée un commissaire pour l'Ulster Scots (scots d'Ulster) et la tradition britannique d'Ulster.", source: "https://www.legislation.gov.uk/ukpga/2022/45/section/2"}
  education: {valeur: "reconnu", note: "L'éducation est une matière transférée à l'Assemblée ; le ministère de l'Éducation a le devoir d'encourager et de faciliter l'enseignement en langue irlandaise, Education (Northern Ireland) Order 1998, art. 89, al. 1.", source: "https://www.legislation.gov.uk/nisi/1998/1759/article/89"}
  fiscalite: {valeur: "partiel", note: "L'Assemblée légifère dans les matières non exclues ni réservées (s. 4, al. 1), mais les impôts relevant d'une loi applicable à tout le Royaume-Uni, et ceux de même nature, sont des matières exclues, Northern Ireland Act 1998, annexe 2, para. 9.", source: "https://www.legislation.gov.uk/ukpga/1998/47/schedule/2"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "L'accord de 1998 reconnaît à toute la population d'Irlande du Nord le droit de s'identifier comme Irlandais, Britannique ou les deux et de détenir les deux citoyennetés ; en droit irlandais, toute personne née sur l'île d'Irlande a droit à la citoyenneté irlandaise, Irish Nationality and Citizenship Act 1956, s. 6, al. 1, dans sa rédaction de 2001 ; depuis 2004, ce droit suppose pour certains enfants de parents non irlandais trois ans de résidence d'un parent sur l'île (s. 6A, ajoutée par la loi de 2004, s. 4).", source: "https://www.irishstatutebook.ie/eli/2001/act/15/section/3/enacted/en/html"}
  autodetermination_externe: {valeur: "reconnu", note: "L'Irlande du Nord ne cesse d'appartenir au Royaume-Uni que par le vote d'une majorité de sa population lors d'un référendum ; si la majorité choisit une Irlande unie, le gouvernement soumet au Parlement les propositions convenues avec l'Irlande, Northern Ireland Act 1998, s. 1. Le secrétaire d'État doit organiser le référendum s'il lui paraît probable qu'une majorité choisirait une Irlande unie, sans nouveau vote avant sept ans (annexe 1, para. 2 et 3).", source: "https://www.legislation.gov.uk/ukpga/1998/47/schedule/1"}
effectivite: {valeur: "partielle", note: "L'Assemblée et l'exécutif n'ont pas fonctionné pleinement de février 2022 au 3 février 2024, après le retrait du Parti unioniste démocrate (DUP) du partage du pouvoir (bibliothèque de la Chambre des communes, 2024) ; aucun référendum n'a été organisé au titre de l'annexe 1.", source: "https://commonslibrary.parliament.uk/research-briefings/cbp-9954/"}
chronologie:
  - {annee: 1998, evenement: "Accord de Belfast (10 avril) et Northern Ireland Act 1998."}
  - {annee: 1998, evenement: "Education (Northern Ireland) Order : devoir d'encourager l'enseignement en irlandais (art. 89)."}
  - {annee: 2001, evenement: "Irlande : droit à la citoyenneté irlandaise pour toute personne née sur l'île (s. 6 de la loi de 1956, nouvelle rédaction)."}
  - {annee: 2004, evenement: "Irlande : conditions de résidence pour certains enfants de parents non irlandais (s. 6A)."}
  - {annee: 2009, evenement: "Entrée en vigueur de la s. 21A du Northern Ireland Act 1998 (11 mars) : cadre d'un ministère chargé de la police et de la justice dévolues ; le Northern Ireland Act 2009 y ajoute la désignation du ministre par résolution intercommunautaire (al. 3A)."}
  - {annee: 2016, evenement: "Avis du Comité consultatif de la Convention-cadre : blocage du projet de loi sur la langue irlandaise."}
  - {annee: 2022, evenement: "Réforme de la pétition de préoccupation (8 février) ; arrêt du fonctionnement de l'exécutif (février) ; Identity and Language (Northern Ireland) Act."}
  - {annee: 2024, evenement: "Rétablissement de l'Assemblée et de l'exécutif (3 février) ; premier vote de consentement démocratique, adopté le 10 décembre par 48 voix contre 36, sans soutien intercommunautaire : prochain vote en 2028."}
