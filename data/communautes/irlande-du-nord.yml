resume: >-
  L'accord de Belfast du 10 avril 1998 (accord du Vendredi saint), conclu entre le Royaume-Uni, l'Irlande et les partis d'Irlande du Nord, reconnaît au peuple de l'île d'Irlande le droit à l'autodétermination, exercé par accord entre ses deux parties. Le Northern Ireland Act 1998 prévoit que l'Irlande du Nord ne quitte le Royaume-Uni que par un vote majoritaire lors d'un référendum (border poll). Il crée une Assemblée et un exécutif à partage du pouvoir : chaque député se déclare « nationaliste », « unioniste » ou « autre », et les décisions clés exigent le soutien des deux communautés. Depuis 2024, l'Assemblée vote aussi sur le maintien de règles de l'Union européenne en Irlande du Nord (cadre de Windsor, art. 18).
