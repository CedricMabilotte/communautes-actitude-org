resume: >-
  Territoire non incorporé (où la Constitution fédérale ne s'applique pas en entier) et non organisé (sans loi organique du Congrès) des États-Unis, administré sous l'autorité du secrétaire à l'Intérieur. La Constitution révisée, approuvée par les électeurs en 1966 et par le secrétaire à l'Intérieur le 2 juin 1967, en vigueur le 1er juillet 1967, protège les terres et le mode de vie samoans et réserve le Sénat territorial aux matai (chefs de famille) désignés selon la coutume. Les habitants nés dans le territoire sont nationaux, non citoyens, des États-Unis. Depuis la loi fédérale du 4 janvier 2025, les amendements à la Constitution du territoire ne requièrent plus de loi du Congrès. Le territoire figure sur la liste des territoires non autonomes.
reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Résolution 80/90 « Question des Samoa américaines » : réaffirme le droit du peuple des Samoa américaines à l'autodétermination et prend note de la loi fédérale de janvier 2025 qui lui permet d'approuver des amendements à la Constitution du territoire sans intervention du Congrès", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=A/RES/80/90&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Constitution révisée des Samoa américaines", nature: "constitution", annee: 1967, source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  - {instrument: "Loi publique 118-232 (abrogation de l'article 12 de la loi publique 98-213, 48 U.S.C. 1662a)", nature: "loi", annee: 2025, source: "https://www.govinfo.gov/content/pkg/PLAW-118publ232/pdf/PLAW-118publ232.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Législature (Fono) de deux chambres et gouverneur élu ; la Constitution révisée a été ratifiée et approuvée par le secrétaire à l'Intérieur des États-Unis (préambule, art. V, § 11), qui nomme le président et les juges de la Haute Cour (art. III, § 3).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Fono légifère sur les « sujets d'application locale », sans contredire la Constitution territoriale, les lois des États-Unis applicables ni les traités (art. II, § 1) ; une loi adoptée de nouveau après le veto du gouverneur n'entre en vigueur qu'avec l'approbation du secrétaire à l'Intérieur (art. II, § 9).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Politique de protection des personnes d'ascendance samoane contre l'aliénation de leurs terres ; toute modification du droit sur l'aliénation des terres exige deux législatures successives à la majorité des deux tiers et l'accord du gouverneur (art. I, § 3).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "La politique du gouvernement est de protéger contre la destruction « du mode de vie et de la langue samoans » (art. I, § 3) ; la Constitution ne donne pas de statut officiel au samoan.", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Les 18 sénateurs territoriaux sont élus « selon la coutume samoane » par les conseils de comté et doivent être matai enregistrés (art. II, § 3 et 4) ; au niveau fédéral, le territoire élit un délégué à la Chambre des représentants, qui n'y vote pas en séance plénière (A/AC.109/2026/1).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  statut_personnel: {valeur: "partiel", note: "La Constitution protège l'organisation familiale traditionnelle samoane (art. I, § 3) et fait de la qualité de matai une condition d'éligibilité au Sénat (art. II, § 3).", source: "https://natlex.ilo.org/dyn/natlex2/natlex2/files/download/98671/USA98671.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le 5 novembre 2024, 57,7 % des 9 765 votants rejettent l'amendement qui aurait donné au Fono le pouvoir de passer outre le veto du gouverneur ; ce pouvoir reste au secrétaire à l'Intérieur des États-Unis (Constitution, art. II, § 9). Le représentant du territoire a déclaré à l'ONU que le statut de territoire non incorporé et non organisé limite sa capacité à s'autoadministrer (résolution 80/90).", source: "https://pina.com.fj/2024/11/07/pula-and-pulu-lead-polls-headed-to-runoff-against-incumbents-in-american-samoa-gubernatorial-race/"}
chronologie:
  - {annee: 1960, evenement: "Première Constitution des Samoa américaines, en vigueur le 17 octobre 1960."}
  - {annee: 1967, evenement: "Entrée en vigueur, le 1er juillet, de la Constitution révisée, approuvée par les électeurs en 1966 et par le secrétaire à l'Intérieur le 2 juin 1967."}
  - {annee: 2022, evenement: "La Cour suprême des États-Unis rejette le 17 octobre la demande de certiorari (réexamen) dans l'affaire Fitisemanu c. États-Unis ; les personnes nées dans le territoire restent nationales, non citoyennes."}
  - {annee: 2022, evenement: "Assemblée constituante (29 août - 2 septembre) ; au référendum du 8 novembre, les électeurs approuvent 5 des 11 amendements et rejettent celui qui aurait donné au Fono le pouvoir de passer outre le veto du gouverneur."}
  - {annee: 2024, evenement: "Référendum du 5 novembre : 57,7 % des votants rejettent de nouveau l'amendement sur le veto."}
  - {annee: 2025, evenement: "Loi publique 118-232 du 4 janvier : abrogation de la règle fédérale qui subordonnait toute modification de la Constitution du territoire à une loi du Congrès."}
