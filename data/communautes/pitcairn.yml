resume: >-
  Territoire britannique du Pacifique Sud inscrit sur la liste des territoires non autonomes de l'ONU, dont la plupart des habitants descendent des mutinés du Bounty et de leurs compagnons tahitiens arrivés en 1790. La Constitution entrée en vigueur en mars 2010 confie les lois au gouverneur, qui est le haut-commissaire britannique en Nouvelle-Zélande, après consultation du Conseil de l'île. Ce conseil de sept membres élus gère les affaires internes et prend des règlements. Une ordonnance de 2006 garantit à chaque habitant une attribution de terres.
