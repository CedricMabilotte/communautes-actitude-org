effectivite: {valeur: "partielle", note: "La population est faible et vieillissante ; selon la puissance administrante, 85 % des habitants auront plus de 65 ans dans cinq ans. Aucune position du gouvernement de l'île sur son statut futur n'a été exprimée devant l'ONU depuis 2004.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
