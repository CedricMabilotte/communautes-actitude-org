  - {instrument: "Local Government Ordinance (Laws of Pitcairn, édition révisée 2017)", nature: "loi", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
  - {instrument: "Ordonnance de réforme foncière (fin 2006)", nature: "loi", annee: 2006, source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil de l'île, prévu par la Constitution de 2010, compte sept membres votants élus (maire, maire adjoint, cinq conseillers) et trois membres de droit sans vote (gouverneur, gouverneur adjoint, administrateur) ; il gère les affaires internes sous réserve des instructions du gouverneur (Local Government Ordinance, 2017).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Conseil peut prendre des règlements pour la bonne administration, l'ordre public et le progrès économique et social ; les lois (ordonnances) sont prises par le gouverneur après consultation du Conseil et le Royaume-Uni garde un pouvoir général de légiférer.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
  justice_propre: {valeur: "partiel", note: "Le magistrat de l'île est nommé par le gouverneur parmi les résidents ; les affaires plus graves relèvent d'un tribunal de magistrats, d'une Cour suprême et d'une Cour d'appel de Pitcairn.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
  terres: {valeur: "partiel", note: "L'ordonnance de réforme foncière de 2006 garantit à chaque habitant une attribution de terres pour la maison, le jardin, le verger et la forêt ; la mise à jour des registres est en cours.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le gouverneur légifère après consultation du Conseil de l'île (Constitution de 2010).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/12&l=en&t=pdf"}
