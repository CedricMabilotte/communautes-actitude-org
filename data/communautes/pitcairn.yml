  - {instrument: "Local Government Ordinance (chap. XI, édition révisée 2019)", nature: "loi", annee: 2019, source: "https://www.government.pn/s/Cap-11-Local-Government.pdf"}
  - {instrument: "Land Tenure Reform Ordinance (chap. XIV, ordonnance de réforme foncière, 2006)", nature: "loi", annee: 2006, source: "https://www.government.pn/s/Land-Tenure-Reform-Ordinance.pdf"}
  - {instrument: "Lands Court Ordinance (chap. XV, tribunal foncier, 2000)", nature: "loi", annee: 2000, source: "https://www.government.pn/s/Lands-Court-Ordinance.pdf"}
  - {instrument: "Right of Abode Ordinance 2010 (droit de séjour, chap. XLIII)", nature: "loi", annee: 2010, source: "https://www.government.pn/s/Right-of-Abode-Ordinance-2010.pdf"}
  - {instrument: "Immigration Control Amendment Ordinance 2026 (n° 2 de 2026, publiée le 27 avril 2026)", nature: "loi", annee: 2026, source: "https://www.government.pn/s/2026-04-27-Immigration-Control-Amendment-Ordinance-as-published.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil de l'île, prévu par l'art. 34 de la Constitution de 2010, compte sept membres votants élus (maire, maire adjoint, cinq conseillers) et trois membres de droit sans vote (gouverneur, gouverneur adjoint, administrateur) ; il agit sous réserve des ordres et instructions du gouverneur (Local Government Ordinance, art. 6 et 7).", source: "https://www.government.pn/s/Cap-11-Local-Government.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Conseil prend des règlements sur la santé publique, l'urbanisme, la pêche, les terres et l'ordre public (Local Government Ordinance, art. 7) ; le gouverneur ou l'administrateur peut les modifier ou les révoquer, et les lois sont prises par le gouverneur, qui n'est pas lié par l'avis du Conseil (Constitution, art. 36).", source: "https://www.government.pn/s/Cap-11-Local-Government.pdf"}
  justice_propre: {valeur: "partiel", note: "Le tribunal foncier (Lands Court) est présidé par le maire et compte quatre membres nommés par le Conseil, sous contrôle de la Cour suprême (Lands Court Ordinance, art. 3 et 8) ; le magistrat de l'île est un résident nommé par le gouverneur.", source: "https://www.government.pn/s/Lands-Court-Ordinance.pdf"}
  terres: {valeur: "partiel", note: "L'ordonnance de réforme foncière de 2006 attribue aux résidents permanents, aux anciens résidents et à leurs descendants revenus sur l'île des titres de bail sans loyer dont le Conseil de l'île est bailleur ; toute cession exige l'accord écrit du Conseil et du tribunal foncier (art. 4 à 6). Selon la puissance administrante, la mise à jour des registres et une révision du régime sont en cours après des litiges.", source: "https://www.government.pn/s/Land-Tenure-Reform-Ordinance.pdf"}
  ressources: {valeur: "partiel", note: "Le Conseil peut réglementer la pêche et les droits de pêche, la conservation des sols et la faune (Local Government Ordinance, art. 7(2)) ; l'aire marine protégée créée en 2016 relève d'une ordonnance du gouverneur.", source: "https://www.government.pn/s/Cap-11-Local-Government.pdf"}
  consentement: {valeur: "partiel", note: "Le gouverneur légifère après consultation du Conseil de l'île, sans être lié par son avis, et peut s'en dispenser sur instruction du souverain transmise par un secrétaire d'État (Constitution, art. 36) ; depuis avril 2026, la politique d'immigration et les redevances d'entrée sont aussi fixées après consultation du Conseil (Immigration Control Amendment Ordinance 2026, art. 2A et 2D).", source: "https://www.government.pn/s/The-Constitution-of-Pitcairn.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les règlements du Conseil peuvent prévoir des redevances (Local Government Ordinance, art. 7(5)), mais le gouverneur peut annuler toute décision du Conseil qui engage une dépense (art. 8(2)) ; le budget dépend à 90-95 % de l'aide du Royaume-Uni depuis 2004.", source: "https://www.government.pn/s/Cap-11-Local-Government.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La Right of Abode Ordinance 2010 définit un droit de séjour à Pitcairn fondé sur la naissance, la filiation ou la résidence permanente ; l'art. 22 de la Constitution interdit d'en priver arbitrairement ses titulaires, qui sont exemptés du contrôle de l'immigration.", source: "https://www.government.pn/s/Right-of-Abode-Ordinance-2010.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'Organisation mondiale de la santé compte en 2024 une trentaine de résidents permanents, aucun enfant et une dépendance financière au Royaume-Uni ; environ 80 % des habitants auront plus de 65 ans d'ici cinq ans. L'école est fermée et l'examen des demandes d'immigration est suspendu depuis février 2025 (A/AC.109/2026/12).", source: "https://iris.who.int/server/api/core/bitstreams/755b6db6-d15a-413f-8d97-8f15e2b844bf/content"}
chronologie:
  - {annee: 1767, evenement: "L'île est aperçue par Robert Pitcairn, aspirant britannique."}
  - {annee: 1790, evenement: "Arrivée de 9 mutinés du Bounty et de 18 Polynésiens sur l'île inhabitée."}
  - {annee: 2006, evenement: "Ordonnance de réforme foncière."}
  - {annee: 2010, evenement: "Entrée en vigueur de la Constitution (mars) et ordonnance sur le droit de séjour."}
  - {annee: 2016, evenement: "Création de l'aire marine protégée sur la zone économique exclusive."}
  - {annee: 2019, evenement: "Première femme élue maire."}
  - {annee: 2025, evenement: "Suspension de l'examen des demandes d'immigration (février) ; élection de Shawn Christian comme maire (5 novembre)."}
  - {annee: 2026, evenement: "Ordonnance modifiant le contrôle de l'immigration, qui associe le Conseil de l'île à la politique d'immigration (avril)."}
