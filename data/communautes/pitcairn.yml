resume: >-
  Territoire britannique du Pacifique Sud inscrit sur la liste des territoires non autonomes de l'ONU. La plupart des habitants descendent des mutinés du Bounty et des Polynésiens arrivés avec eux en 1790. La Constitution de 2010 confie les lois (ordonnances) au gouverneur, qui est le haut-commissaire britannique en Nouvelle-Zélande, après consultation du Conseil de l'île. Ce conseil de sept membres élus prend des règlements sous le contrôle du gouverneur ; le maire préside aussi le tribunal foncier.
