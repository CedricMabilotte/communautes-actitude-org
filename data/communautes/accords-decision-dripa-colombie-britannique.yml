droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 2019 reconnaît comme partie à l'accord le corps dirigeant autochtone, entité autorisée à agir au nom d'un peuple titulaire de droits de l'article 35 (art. 1(1) et 7(1)) ; chaque première nation désigne ses propres décideurs (accord 'Namgis, art. 6.2) ; l'accord n'existe que si le Conseil des ministres autorise sa négociation (art. 7(1)).", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/19044"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'accord 'Namgis (décret 596/2025) fait exercer conjointement par le ministre des Forêts ou le forestier en chef et la Première Nation 'Namgis les pouvoirs du Forest and Range Practices Act (loi sur les pratiques forestières) relatifs aux plans d'aménagement du paysage forestier et aux plans d'opérations forestières (art. 2.51 à 2.54) dans la zone de l'annexe B de l'accord, qui correspond à la licence de ferme forestière 37 selon le rapport annuel de la province ; les accords tahltans et simpcw portent sur l'autorisation de projets miniers.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/oic/oic_cur/0596_2025"}
  consentement: {valeur: "partiel", note: "L'article 7(1)(b) de la loi de 2019 permet un accord exigeant le consentement du corps dirigeant autochtone avant une décision provinciale ; l'article 7 de l'Environmental Assessment Act interdit qu'un projet soumis à évaluation se réalise sans ce consentement dans la zone d'un accord prescrit par décret (ex. B.C. Reg. 133/2026 pour la Première Nation simpcw) ; la portée se limite aux projets nommés dans chaque accord et chaque accord dépend d'une autorisation du Conseil des ministres.", source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/18051"}
  langue: {valeur: "non_etabli", note: "", source: ""}
