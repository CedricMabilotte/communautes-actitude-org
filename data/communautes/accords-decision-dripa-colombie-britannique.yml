resume: >-
  Fiche agrégée : elle couvre les premières nations qui ont conclu avec la province un accord au titre de l'article 7 de la Declaration on the Rights of Indigenous Peoples Act (SBC 2019, ch. 44), loi qui reprend en annexe la Déclaration des Nations unies sur les droits des peuples autochtones. L'article 7 permet au Conseil des ministres d'autoriser un ministre à conclure avec un corps dirigeant autochtone (Indigenous governing body : entité autorisée à agir au nom d'un peuple titulaire de droits reconnus par l'article 35 de la Loi constitutionnelle de 1982) un accord qui prévoit l'exercice conjoint d'un pouvoir de décision conféré par la loi (statutory power of decision) ou le consentement préalable de ce corps dirigeant avant son exercice. L'accord n'entre en vigueur qu'après publication dans la Gazette de la Colombie-Britannique (journal officiel provincial). À la fin de juillet 2026, quatre accords sont conclus : deux accords de consentement avec le gouvernement central tahltan (mines Eskay Creek, 2022, et Red Chris, 2023), un accord de décision conjointe avec la Première Nation 'Namgis sur la planification forestière (2025) et un accord de consentement avec la Première Nation simpcw pour le projet de mine Yellowhead Copper (2026).
