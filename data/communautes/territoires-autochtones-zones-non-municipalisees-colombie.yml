droits:
  autogouvernement: {valeur: "reconnu", note: "Les territoires autochtones sont gouvernés par des conseils formés selon les usages et coutumes des communautés (Constitution, art. 330) ; le décret 632 de 2018 règle la formation, l'enregistrement et l'inscription de ces conseils ; le décret 1367 de 2025 fixe le système de gouvernement propre du territoire Arica.", source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1367-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Selon l'accord protocolisé par le décret 1367 de 2025 (section VIII), le plan de vie et les instruments normatifs propres du territoire Arica sont « fuente de derechos » et obligent l'État et les particuliers, mais leur caractère contraignant est énoncé « para efectos de la coordinación » ; leur portée hors de ce cadre n'est pas fixée par la loi.", source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1367-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  justice_propre: {valeur: "reconnu", note: "Les autorités autochtones exercent des fonctions juridictionnelles selon leurs propres normes (Constitution, art. 246) ; le gouvernement du territoire Arica comprend une instance de justice et de juridiction spéciale (décret 1367 de 2025).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr008.html"}
  terres: {valeur: "partiel", note: "L'Agence nationale des terres délimite chaque territoire pour sa mise en fonctionnement politico-administrative (résolutions de mai et juin 2025) ; selon le décret 1368 de 2025, le territoire PANI est un « objeto territorial legal no parcelario » sans code cadastral ni inscription au registre foncier : la délimitation ne vaut pas titre de propriété.", source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1368-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  ressources: {valeur: "partiel", note: "Les conseils veillent à la préservation des ressources naturelles (Constitution, art. 330.5) ; l'exploitation se fait sans atteinte à l'intégrité des communautés, avec leur participation (art. 330, paragraphe).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr011.html"}
  consentement: {valeur: "partiel", note: "Le gouvernement favorise la participation des représentants des communautés aux décisions sur l'exploitation des ressources (Constitution, art. 330, paragraphe) ; selon le décret 1367 de 2025, le conseil du territoire Arica anime la consultation préalable, libre et informée de sa population et peut exiger du gouvernement une consultation préalable ; aucun texte lu ne prévoit un consentement obligatoire.", source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1367-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  langue: {valeur: "reconnu", note: "Les langues des groupes ethniques sont officielles dans leurs territoires et l'enseignement y est bilingue (Constitution, art. 10).", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991.html"}
  education: {valeur: "partiel", note: "Selon l'accord protocolisé par le décret 1367 de 2025, le territoire Arica assume à partir de 2026, de manière graduelle, l'administration directe du système éducatif autochtone propre (SEIP) du préscolaire à la onzième année, après dépôt d'un dossier au titre de l'art. 65 du décret-loi 481 de 2025 ; l'alimentation scolaire y est décentralisée à partir de 2026.", source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1367-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  fiscalite: {valeur: "partiel", note: "L'article 19 du décret 632 de 2018 limite les ressources du système général de participations à l'allocation spéciale des resguardos ; l'arrêt C-477 de 2025 y ajoute les ressources sectorielles (éducation, santé, eau potable) sous conditions, jusqu'à la loi organique d'aménagement territorial.", source: "https://www.corteconstitucional.gov.co/relatoria/2025/C-477-25.htm"}
  representation: {valeur: "reconnu", note: "Deux sièges du Sénat sont élus dans une circonscription nationale spéciale par les communautés autochtones (Constitution, art. 171) ; ce droit n'est pas propre au régime.", source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr005.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Dans l'arrêt C-477 de 2025, le ministère de l'Intérieur indique qu'aucun territoire n'est encore constitué selon le décret 632 de 2018 et que 13 demandes sont en cours ; le Département national de planification indique que l'exercice direct des compétences en santé, éducation et eau exige des certifications sectorielles, qu'aucun territoire ne détient ; la Cour rappelle les retards déjà examinés en 2021 (T-072) et 2024 (T-180).", source: "https://www.corteconstitucional.gov.co/relatoria/2025/C-477-25.htm"}
chronologie:
  - {annee: 1991, evenement: "La Constitution range les territoires autochtones parmi les entités territoriales (art. 286) et habilite le gouvernement à régler leur fonctionnement en attendant la loi organique (art. 56 transitoire)."}
  - {annee: 2018, evenement: "Décret-loi 632 (Journal officiel du 11 avril) pour les zones non municipalisées d'Amazonas, Guainía et Vaupés."}
  - {annee: 2021, evenement: "Arrêt T-072 : la Cour constitutionnelle examine les retards opposés au conseil du territoire du Pirá Paraná (Vaupés)."}
  - {annee: 2024, evenement: "Arrêt T-180 sur les retards d'application, à la demande des conseils de Bajo Río Caquetá, Mirití Paraná et Yaigojé Apaporis."}
  - {annee: 2025, evenement: "Décret-loi 488 sur le fonctionnement des territoires autochtones ; délimitations de l'Agence nationale des terres (mai et juin)."}
  - {annee: 2025, evenement: "Arrêt C-477 du 26 novembre : l'article 19 du décret 632 est déclaré conditionnellement constitutionnel."}
  - {annee: 2025, evenement: "Décrets 1367 à 1374 du 16 décembre : huit territoires mis en fonctionnement comme entités territoriales."}
  - {annee: 2026, evenement: "Avril : premier dialogue entre dix gouvernements autochtones et le gouvernement national ; les accords de Río Pirá Paraná et TIURIS restent à signer."}
