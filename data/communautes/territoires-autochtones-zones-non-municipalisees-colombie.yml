resume: >-
  Fiche agrégée. Les zones non municipalisées (áreas no municipalizadas, parties de département sans commune) d'Amazonas, Guainía et Vaupés relèvent d'un régime propre, le décret-loi 632 de 2018, pris sur l'article 56 transitoire de la Constitution. Il permet aux peuples autochtones d'y faire fonctionner leurs territoires comme entités territoriales, gouvernées par un conseil autochtone (consejo indígena) qui administre directement des ressources publiques. Le 16 décembre 2025, huit décrets ont protocolisé les accords interculturaux de huit territoires d'Amazonas et de Vaupés, sur environ 7,6 millions d'hectares. L'arrêt C-477 de 2025 de la Cour constitutionnelle ouvre à ces territoires les ressources sectorielles du système général de participations. La fiche des resguardos (terres collectives titrées) décrit le régime général.
