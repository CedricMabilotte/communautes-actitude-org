  - {instrument: "Constitution politique de la Colombie (1991), art. 56 transitoire (habilitation du gouvernement à régler le fonctionnement des territoires autochtones en attendant la loi prévue à l'art. 329)", nature: "constitution", annee: 1991, source: "http://www.secretariasenado.gov.co/senado/basedoc/constitucion_politica_1991_pr014.html"}
  - {instrument: "Décret-loi 632 de 2018, Journal officiel du 11 avril 2018 (normes fiscales et autres pour le fonctionnement des territoires autochtones des zones non municipalisées d'Amazonas, Guainía et Vaupés)", nature: "loi", annee: 2018, source: "https://www.corteconstitucional.gov.co/relatoria/2025/C-477-25.htm"}
  - {instrument: "Décret-loi 488 de 2025 (protocolisation des accords interculturaux, administration directe de l'allocation spéciale du système général de participations, coordination interinstitutionnelle)", nature: "loi", annee: 2025, source: "https://gaiaamazonas.org/wp-content/uploads/2026/02/DECRETO-1367-DEL-16-DE-DICIEMBRE-DE-2025.pdf"}
  - {instrument: "Arrêt C-477 du 26 novembre 2025 de la Cour constitutionnelle (art. 19 du décret 632 déclaré conditionnellement constitutionnel)", nature: "jurisprudence", annee: 2025, source: "https://www.corteconstitucional.gov.co/relatoria/2025/C-477-25.htm"}
