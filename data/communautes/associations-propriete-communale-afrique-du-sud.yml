effectivite: {valeur: "partielle", note: "Le panel de haut niveau du Parlement (rapport de novembre 2017) relève qu'en 2015-2016 seules 208 des 1 490 associations enregistrées respectaient la loi, rapporte des cas de captation des ressources et de détournement de fonds entendus lors de ses audiences, et indique qu'un moratoire ministériel interne a bloqué le transfert de titres aux associations situées dans les anciens homelands (bantoustans). Le rapport annuel 2023-2024 du ministère indique que 75 % des associations ne respectaient pas l'art. 11 et le règlement 8 (obligations de rapport) pendant l'exercice 2022-2023, puis cite 82 % dans la même phrase ; il compte 63 comités gérant les terres contrairement à leur constitution et 57 associations visées par des plaintes pour discrimination, inégalité ou direction non démocratique.", source: "https://www.parliament.gov.za/storage/app/media/Pages/2017/october/High_Level_Panel/HLP_Report/HLP_report.pdf"}
chronologie:
  - {annee: 1996, evenement: "Loi n° 28 sur les associations de propriété communale (sanction le 15 mai, publication le 22 mai)."}
  - {annee: 2013, evenement: "Le ministre déclare ne plus soutenir les associations dans les zones communales ; moratoire interne sur les transferts de titres dans les anciens homelands, selon le panel de haut niveau."}
  - {annee: 2015, evenement: "Arrêt Bakgatla-Ba-Kgafela CPA (Cour constitutionnelle, 20 août) : rétablissement de l'ordre d'enregistrement définitif de l'association."}
  - {annee: 2017, evenement: "Rapport du panel de haut niveau du Parlement sur la législation foncière (novembre)."}
  - {annee: 2024, evenement: "Loi modificative n° 20 de 2018 sanctionnée le 30 septembre et publiée le 8 octobre : bureau et registraire des CPA, enregistrement des terres au nom de l'association, seuil de 60 % pour la vente."}
  - {annee: 2024, evenement: "Rapport annuel 2023-2024 (approuvé le 30 septembre) : 1 742 associations enregistrées."}
