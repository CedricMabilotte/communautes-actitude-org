droits:
  autogouvernement: {valeur: "partiel", note: "L'association enregistrée est une personne morale (loi n° 28 de 1996, art. 8 (6) (a)) dirigée par un comité élu par ses membres, dont le mandat ne peut dépasser cinq ans (annexe, point 13, modifié en 2024) ; sa constitution doit garantir des processus de décision « fair and inclusive » et démocratiques (art. 9 (1)). L'État contrôle : transmission de documents aux échéances fixées par règlement au directeur général, puis au registraire depuis 2024, qui peut inspecter l'association (art. 11), et mise sous administration possible par décision de justice (art. 13).", source: "https://www.gov.za/sites/default/files/gcis_document/201409/act28of1996.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La constitution adoptée par les membres fixe les droits d'usage des biens de l'association, les règles d'adhésion et d'élection du comité (annexe, points 5 à 13) ; elle est « a legally binding agreement between the association and its members » (art. 8 (6) (e)). Toute modification n'est valable qu'après acceptation écrite par l'administration (art. 8 (10)).", source: "https://www.gov.za/sites/default/files/gcis_document/201409/act28of1996.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'association peut acquérir et céder des biens immobiliers et des droits réels (loi n° 28 de 1996, art. 8 (6) (c)) ; depuis 2024, les biens visés par la loi « shall be registered in the name of the association within a reasonable time » (art. 2A (1)). Limites : la vente, la donation ou l'hypothèque des terres exige une résolution d'au moins 60 % des membres ayant droit de décision et une consultation préalable du ministre, le ministère dispose d'un droit de préemption (first option to purchase, droit d'achat prioritaire), et tout bail exige l'accord du registraire (art. 12 (1) (a) et (c), modifié en 2024). Le transfert du titre n'est pas acquis pour toutes les associations : le rapport annuel 2023-2024 liste des associations sans terre transférée.", source: "https://www.gov.za/sites/default/files/gcis_document/202410/51363-communalpropertyassociationsamendactno20of2018.pdf"}
  ressources: {valeur: "partiel", note: "Lorsque l'enregistrement de la propriété exige un plan général (general plan, plan cadastral approuvé selon la loi de 1997 sur l'arpentage), le ministère le fait établir en consultation avec la communauté ; ce plan réserve des parties de la propriété aux cultures, pâturages, cours d'eau, boisements et à la conservation « for the community concerned » (loi n° 28 de 1996, art. 2A (2) et (3), inséré en 2024). Tout bail sur les terres exige l'accord de la majorité des membres et du registraire (art. 12 (1) (c)).", source: "https://www.gov.za/sites/default/files/gcis_document/202410/51363-communalpropertyassociationsamendactno20of2018.pdf"}
  consentement: {valeur: "partiel", note: "L'État ne peut exiger la formation d'une association qu'après une résolution de la communauté en ce sens (loi n° 28 de 1996, art. 2 (6), inséré en 2024) ; le plan général est établi « in consultation with the community concerned » (art. 2A (2)). Aucune obligation de consentement de l'association n'est prévue pour les projets extérieurs.", source: "https://www.gov.za/sites/default/files/gcis_document/202410/51363-communalpropertyassociationsamendactno20of2018.pdf"}
