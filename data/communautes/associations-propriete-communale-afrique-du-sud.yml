resume: >-
  La loi Communal Property Associations Act n° 28 de 1996 permet à une communauté de se constituer en association de propriété communale (Communal Property Association, CPA : personne morale qui détient des biens au nom de ses membres) pour acquérir, détenir et gérer des terres selon une constitution écrite adoptée par ses membres. Le régime s'applique aux communautés bénéficiaires de la restitution des terres, de la redistribution ou de la réforme de la tenure foncière, dans les neuf provinces. La loi modificative n° 20 de 2018, publiée le 8 octobre 2024, crée un bureau et un registraire des CPA, impose l'enregistrement des terres au nom de l'association et soumet la vente des terres à une résolution d'au moins 60 % des membres. Le rapport annuel 2023-2024 du ministère compte 1 742 associations enregistrées.
