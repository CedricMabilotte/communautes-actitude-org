  - {instrument: "Loi du 24 février 1948 sur le statut personnel de la communauté druze, modifiée par la loi n° 58 du 19 septembre 2017", nature: "loi", annee: 1948, source: "https://english.legal-agenda.com/lebanons-druze-personal-status-law-developing-deference-to-the-constitution/"}
