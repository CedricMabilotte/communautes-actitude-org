resume: >-
  Les Druzes, qui se nomment « unitaires » (muwaḥḥidūn), forment l'une des 18 communautés confessionnelles reconnues du Liban et vivent surtout dans les montagnes à l'est et au sud de Beyrouth.
  Une loi du 9 juin 2006 organise la communauté : un Conseil confessionnel gère ses affaires temporelles, sociales et financières et ses biens de mainmorte (waqfs), et élit le cheikh al-Aql, chef spirituel.
  Leur statut personnel relève d'une loi du 24 février 1948, appliquée par des tribunaux druzes organisés par un décret du 5 mars 1960 ; huit sièges de la Chambre des députés leur sont réservés.
  Les autres communautés confessionnelles du Liban relèvent de la fiche « Communautés confessionnelles historiques du Liban ».
