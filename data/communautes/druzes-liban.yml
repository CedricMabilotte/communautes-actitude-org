droits:
  autogouvernement: {valeur: "reconnu", note: "Loi du 9 juin 2006, art. 7 : le Conseil confessionnel administre les affaires temporelles, sociales et financières et les intérêts religieux de la communauté ; il élit le cheikh al-Aql (art. 8) pour quinze ans renouvelables, jusqu'à soixante-quinze ans (art. 30), et supervise les waqfs (biens de mainmorte) et les institutions de la communauté, sauf les waqfs des khalwas (lieux de retraite religieuse) de Bayada, qui restent sous l'autorité de leurs cheikhs (art. 8).", source: "https://mouwahidoundruze.gov.lb/haykaliya/33/1"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Décret n° 3473 du 5 mars 1960 : tribunaux druzes de première instance au niveau des cazas et Cour d'appel suprême à Beyrouth, compétents en statut personnel et en successions ; leurs juges sont des fonctionnaires de l'État nommés par décret du Conseil des ministres, hors du statut de la magistrature et de l'autorité du Conseil supérieur de la magistrature.", source: "https://iedja.org/lorganisation-juridictionnelle-du-liban/"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "Les Druzes du Liban sont arabophones ; l'arabe est la langue officielle nationale.", source: ""}
  education: {valeur: "partiel", note: "Art. 10 de la Constitution : les communautés peuvent avoir leurs propres écoles, sous réserve des règles générales de l'instruction publique.", source: "https://www.constituteproject.org/constitution/Lebanon_2004?lang=en"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Art. 24 de la Constitution : sièges répartis également entre chrétiens et musulmans et proportionnellement entre les confessions ; 8 sièges druzes sur 128 selon la répartition issue de l'accord de Taëf et de la loi électorale de 2017 (Beyrouth II, Békaa II, Baabda, Aley-Chouf et Liban-Sud III). Le 9 mars 2026, la Chambre a prorogé son mandat de deux ans et reporté à 2028 les élections prévues en mai 2026.", source: "https://en.wikipedia.org/wiki/Parliament_of_Lebanon"}
  statut_personnel: {valeur: "reconnu", note: "Loi du 24 février 1948 sur le statut personnel des Druzes (mariage, divorce, garde, successions), modifiée sur 16 articles par la loi n° 58 du 19 septembre 2017 ; art. 19 de la Constitution : les chefs des communautés reconnues peuvent saisir le Conseil constitutionnel en matière de statut personnel.", source: "https://english.legal-agenda.com/lebanons-druze-personal-status-law-developing-deference-to-the-constitution/"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le cheikh al-Aql Sami Abi al-Mouna a été élu le 10 septembre 2021 par le Conseil confessionnel et a pris ses fonctions le 5 novembre 2021, succédant au cheikh Naïm Hassan. Les huit députés druzes élus en 2022 siègent jusqu'en 2028 à la suite de la prorogation du mandat de la Chambre votée le 9 mars 2026 (76 voix pour, 41 contre), motivée par les frappes israéliennes (L'Orient Today).", source: "https://www.asianews.it/news-en/Sheikh-Sami-Abil-Muna-is-the-new-Druze-spiritual-leader-54064.html"}
