resume: >-
  Fiche agrégée : elle couvre les villages et les groupes locaux qui détiennent une approbation de gestion au titre de la foresterie sociale (perhutanan sosial), surtout les forêts de village (hutan desa, confiées à une institution villageoise) et les forêts communautaires (hutan kemasyarakatan, confiées à des groupes d'exploitants ou à des coopératives). Le régime repose sur le règlement gouvernemental n° 23 de 2021 (chapitre VI) et sur le règlement du ministre de l'Environnement et des Forêts n° 9 de 2021, qui prévoit aussi les plantations populaires, les forêts coutumières et les partenariats forestiers. L'approbation de forêt de village, de forêt communautaire ou de plantation populaire donne un droit de gestion et d'usage de 35 ans renouvelable, sans propriété du sol. Le 10 septembre 2025, le ministère des Forêts annonçait 11 065 décisions, 8,4 millions d'ha et 1,4 million de ménages, tous schémas confondus. Les forêts coutumières, comptées dans ces totaux, font l'objet de la fiche « Forêts coutumières d'Indonésie ».
