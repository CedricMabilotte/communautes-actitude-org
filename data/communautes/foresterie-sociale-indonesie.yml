base_nationale:
  - {instrument: "Règlement gouvernemental n° 23 de 2021 sur l'administration des forêts (Peraturan Pemerintah 23/2021), art. 1 point 64 et chapitre VI (art. 203 à 247) sur la gestion de la foresterie sociale", nature: "loi", annee: 2021, source: "https://pasal.id/peraturan/pp/pp-no-23-tahun-2021"}
  - {instrument: "Règlement du ministre de l'Environnement et des Forêts n° 9 de 2021 sur la gestion de la foresterie sociale (Permen LHK 9/2021), art. 1, 3, 7, 8, 90, 92 et 93", nature: "loi", annee: 2021, source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'approbation de gestion d'une forêt de village est donnée par le ministre à une institution villageoise (lembaga desa) que le chef de village crée à l'issue de l'assemblée délibérative du village (musyawarah desa) ; celle d'une forêt communautaire va à une personne, à un groupe d'exploitants, à une union de groupes ou à une coopérative locale (règlement ministériel n° 9 de 2021, art. 1 points 15, 16 et 21, art. 7 (1)) ; le titulaire rend compte de l'exécution de ses plans à l'autorité qui a délivré l'approbation (art. 93).", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'approbation de gestion porte sur la forêt domaniale et « n'est pas un droit de propriété sur la zone forestière » (règlement ministériel n° 9 de 2021, art. 7 (2)) ; elle est accordée pour 35 ans et peut être prolongée (art. 8 (1)) ; le titulaire ne peut ni la céder, ni donner la zone en garantie, ni la louer, ni l'utiliser à d'autres fins ; si la zone est déclarée projet stratégique national, le ministre modifie l'approbation (art. 97).", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  ressources: {valeur: "partiel", note: "Le titulaire a le droit de gérer et d'utiliser la zone selon les savoirs locaux (kearifan lokal), de tirer profit des ressources génétiques et de développer une économie fondée sur la forêt (règlement ministériel n° 9 de 2021, art. 90) ; il doit tenir le registre des produits forestiers et payer les recettes non fiscales dues à l'État (art. 93 (1) f et g) ; la plantation de palmiers à huile est interdite sur toute la zone, la coupe d'arbres et les engins mécaniques dans la partie classée forêt de protection.", source: "https://pasal.id/peraturan/permen/permen-lhk-no-9-tahun-2021"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
