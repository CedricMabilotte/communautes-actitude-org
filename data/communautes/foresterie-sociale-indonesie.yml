effectivite: {valeur: "partielle", note: "Une étude sur Sumatra et Kalimantan (Santika et al., Global Environmental Change, 2017) mesure une déforestation évitée dans les forêts de village entre 2012 et 2016, par comparaison avec des zones semblables sans ce statut, avec des résultats de plus en plus variables selon les années, les lieux et la sécheresse ; une revue de la littérature (Rakatama et Pandit, Forest Policy and Economics, 2020) relève des résultats inégaux entre régions et des obstacles sociaux et environnementaux à la mise en œuvre.", source: "https://doi.org/10.1016/j.gloenvcha.2017.08.002"}
chronologie:
  - {annee: 2012, evenement: "Les forêts de village couvrent 750 km² à Sumatra et à Kalimantan."}
  - {annee: 2016, evenement: "Les forêts de village couvrent 2 500 km² à Sumatra et à Kalimantan."}
  - {annee: 2021, evenement: "Règlement gouvernemental n° 23 sur l'administration des forêts et règlement ministériel n° 9 sur la gestion de la foresterie sociale (1er avril 2021) : cinq schémas, approbations de 35 ans renouvelables."}
  - {annee: 2025, evenement: "Le ministère des Forêts annonce 11 065 décisions d’accès, 8,4 millions d'ha, 1,4 million de ménages et 15 769 groupes d'activité économique de foresterie sociale (KUPS), tous schémas confondus."}
fiabilite:
  verifie:
    - "Définitions des cinq schémas, des forêts de village, des forêts communautaires et de l'institution villageoise (art. 1 et 3), absence de droit de propriété (art. 7 (2)), durée de 35 ans renouvelable (art. 8 (1)), droits et obligations des titulaires (art. 90 et 93) dans le texte du règlement ministériel n° 9 de 2021 publié sur pasal.id."
    - "Définition de la foresterie sociale (art. 1 point 64) et intitulé du chapitre VI (art. 203 à 247) du règlement gouvernemental n° 23 de 2021."
    - "Chiffres de septembre 2025 (11 065 décisions, 8,4 millions d'ha, 1,4 million de ménages, 15 769 groupes d'activité économique) dans le communiqué SP. 198/HUMAS/PP/HMS.3/9/2025 du ministère des Forêts."
    - "Interdictions faites au titulaire (cession, palmier à huile sur toute la zone, mise en garantie, coupe et engins mécaniques en forêt de protection, location, usage à d'autres fins) et modification en cas de projet stratégique national (art. 97) dans le texte publié sur pasal.id."
    - "Le règlement gouvernemental n° 8 de 2026 modifie le règlement n° 23 de 2021 en insérant le seul article 293A (zone franche de Batam) ; le chapitre VI n'est pas modifié."
    - "Surfaces des forêts de village de 2012 et 2016 dans le résumé de Santika et al., 2017."
  non_confirme:
    - "Le communiqué de 2025 situe les chiffres « de janvier à septembre 2025 » ; ils semblent cumulés depuis le début du programme, sans que le texte le dise."
    - "Les chiffres de 2025 couvrent tous les schémas, y compris forêts coutumières et partenariats forestiers ; la part des forêts de village et des forêts communautaires n'a pas été trouvée."
    - "Aucune liste officielle des approbations par site n'a pu être consultée ; pas de tableau par site."
    - "Le nombre de personnes concernées n'est pas connu : seuls 1,4 million de ménages sont comptés."
    - "Le règlement ministériel n° 9 de 2021 figure comme en vigueur sur pasal.id ; une modification après la création du ministère des Forêts en 2024 n'a pas été vérifiée."
    - "Le numéro de l'article qui énumère les interdictions n'a pas pu être lu dans la version en ligne (texte désordonné ; le parallèle avec l'art. 94 (2) pour les forêts coutumières suggère l'art. 93 (2), non confirmé)."
    - "Aucun document onusien nommant ce régime n'a été trouvé (le cinquième rapport national à la Convention sur la diversité biologique ne cite que la direction générale chargée de la foresterie sociale)."
