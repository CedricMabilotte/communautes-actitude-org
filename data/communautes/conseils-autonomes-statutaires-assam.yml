resume: >-
  Fiche agrégée : elle couvre les dix conseils autonomes que l'État d'Assam a créés par des lois ordinaires, en dehors de la Sixième annexe de la Constitution (régime des districts autonomes) : Tiwa, Mising et Rabha Hasong (1995) ; Sonowal Kachari, Thengal Kachari et Deori (2005) ; Moran, Matak, Bodo Kachari Welfare et Kamatapur (2020). Chaque conseil réunit des villages notifiés par le gouvernement de l'Assam où la communauté (lois de 2020) ou l'ensemble des Scheduled Tribes (lois Sonowal Kachari et Thengal Kachari de 2005) forme au moins la moitié de la population. Un conseil général élu administre une liste de domaines de développement (agriculture, éducation, routes rurales, pêche, culture…) et adopte des règlements soumis à l'approbation du gouvernement ; il ne vote pas de lois. Le gouvernement approuve son budget et le finance ; le gouverneur peut le dissoudre.
