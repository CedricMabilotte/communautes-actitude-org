reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande à l'Inde de reconnaître officiellement ses peuples tribaux comme groupes distincts ayant droit à une protection spéciale et demande les critères d'inscription sur la liste des Scheduled Tribes (liste constitutionnelle des peuples tribaux) ; le document ne nomme ni l'Assam ni ces conseils", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Loi de l'Assam de 1995 sur le Rabha Hasong Autonomous Council (Assam Gazette du 5 juillet 1995), modifiée en 2001, 2005 et 2017", nature: "loi", annee: 1995, source: "https://rhac.assam.gov.in/document/actsrules"}
  - {instrument: "Accord rabha (Rabha Accord) du 10 mars 1995", nature: "accord_revendication", annee: 1995, source: "https://rhac.assam.gov.in/document/actsrules"}
  - {instrument: "Sonowal Kachari Autonomous Council Act, 2005 (loi de l'Assam n° XX de 2005)", nature: "loi", annee: 2005, source: "https://legislative.assam.gov.in/sites/default/files/swf_utility_folder/departments/legislative_medhassu_in_oid_3/menu/document/The%20Sonowal%20Kachari%20Autonomous%20Council%20Act%2C%202005..pdf"}
  - {instrument: "Thengal Kachari Autonomous Council Act, 2005 (loi de l'Assam n° XXXVI de 2005), modifiée en 2010", nature: "loi", annee: 2005, source: "https://wptbc.assam.gov.in/sites/default/files/swf_utility_folder/departments/wpt_uneecopscloud_com_oid_3/menu/document/Thengal-Kachari-Autonomous-Council-Act%202005.pdf"}
  - {instrument: "Matak Autonomous Council Act, 2020 (loi de l'Assam n° XXIV de 2020)", nature: "loi", annee: 2020, source: "https://legislative.assam.gov.in/sites/default/files/swf_utility_folder/departments/legislative_medhassu_in_oid_3/menu/document/the_matak_autonomous_council_act_2020.pdf"}
  - {instrument: "Moran Autonomous Council Act, 2020 (loi de l'Assam n° XXVI de 2020)", nature: "loi", annee: 2020, source: "https://legislative.assam.gov.in/sites/default/files/swf_utility_folder/departments/legislative_medhassu_in_oid_3/menu/document/the_moran_autonomous_council_act_2020.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseil général de 26 membres pour cinq ans, dont 22 élus et 4 nommés par le gouvernement depuis la modification de 2010, avec un conseil exécutif et des conseils de village de dix membres élus dont cinq sièges réservés, loi Thengal Kachari de 2005, art. 3 à 7 et 32 ; conseil général de 25 membres dont 22 élus, loi Moran de 2020, art. 5 ; le gouverneur peut dissoudre les conseils et exercer leurs pouvoirs par périodes de six mois au plus, sous réserve d'approbation par l'assemblée de l'Assam, art. 68 (2005) et 49 (2020).", source: "https://wptbc.assam.gov.in/sites/default/files/swf_utility_folder/departments/wpt_uneecopscloud_com_oid_3/menu/document/Thengal-Kachari-Autonomous-Council-Act%202005.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil général adopte des règlements (bye-laws) applicables dans la zone du conseil sur les domaines qu'il administre, avec l'approbation du gouvernement de l'Assam, loi Thengal Kachari de 2005, art. 23, loi Moran de 2020, art. 22 ; il n'a pas de pouvoir législatif, et ses compétences s'exercent sous réserve des lois de l'Union et de l'État, loi Moran de 2020, art. 17.", source: "https://legislative.assam.gov.in/sites/default/files/swf_utility_folder/departments/legislative_medhassu_in_oid_3/menu/document/the_moran_autonomous_council_act_2020.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Pouvoirs exécutifs sur les forêts autres que les forêts réservées (Reserved Forests, forêts sous régime de protection de l'État), la pêche, la petite irrigation et la conservation des sols, loi Thengal Kachari de 2005, art. 18 ; les listes des lois Moran et Matak de 2020 ne mentionnent pas les forêts et gardent la pêche, la petite irrigation et la conservation des sols, art. 17.", source: "https://wptbc.assam.gov.in/sites/default/files/swf_utility_folder/departments/wpt_uneecopscloud_com_oid_3/menu/document/Thengal-Kachari-Autonomous-Council-Act%202005.pdf"}
  consentement: {valeur: "partiel", note: "Le gouvernement doit consulter le conseil général et tenir compte de son avis avant toute loi appliquée dans la zone du conseil sur les pratiques religieuses et sociales, le droit coutumier et, pour la loi de 2005, la propriété et le transfert des terres, loi Thengal Kachari de 2005, art. 70, loi Moran de 2020, art. 51 ; il s'agit d'un avis, sans consentement requis.", source: "https://wptbc.assam.gov.in/sites/default/files/swf_utility_folder/departments/wpt_uneecopscloud_com_oid_3/menu/document/Thengal-Kachari-Autonomous-Council-Act%202005.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Pouvoirs exécutifs sur l'éducation des adultes, l'enseignement primaire et l'enseignement jusqu'au niveau secondaire supérieur, formation professionnelle comprise, loi Thengal Kachari de 2005, art. 18, loi Moran de 2020, art. 17 (6).", source: "https://legislative.assam.gov.in/sites/default/files/swf_utility_folder/departments/legislative_medhassu_in_oid_3/menu/document/the_moran_autonomous_council_act_2020.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds propres inscrits en sous-chapitres distincts du budget de l'État, alimentés par le Tribal Sub-Plan (part du plan de l'État réservée aux Scheduled Tribes), péages, droits et redevances perçus dans la limite de taux maximums fixés par le gouvernement, impôts déjà prévus par la loi collectés à partir d'une date notifiée par le gouvernement ; aucune dépense sans budget approuvé par le gouvernement, loi Thengal Kachari de 2005, art. 20, 61 et 63.", source: "https://wptbc.assam.gov.in/sites/default/files/swf_utility_folder/departments/wpt_uneecopscloud_com_oid_3/menu/document/Thengal-Kachari-Autonomous-Council-Act%202005.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rabha Hasong Autonomous Council a été administré par des membres nommés jusqu'à sa première élection en 2013 (site du conseil) ; en février 2022, les conseils Moran, Matak, Bodo Kachari Welfare et Kamatapur créés en 2020 n'avaient reçu aucun fonds de l'État et le conseil Moran déclarait son bureau non fonctionnel.", source: "https://www.sentinelassam.com/topheadlines/4-autonomous-councils-almost-non-functional-578605"}
chronologie:
  - {annee: 1995, evenement: "Accord rabha du 10 mars ; loi sur le Rabha Hasong Autonomous Council publiée le 5 juillet ; création des conseils Tiwa et Mising."}
  - {annee: 2005, evenement: "Lois sur les conseils Sonowal Kachari (assentiment du 8 mai) et Thengal Kachari (assentiment du 7 septembre) ; création du conseil Deori ; la zone du conseil Rabha Hasong passe de 306 à 779 villages cadastraux (notification du 17 mai)."}
  - {annee: 2013, evenement: "Première élection du Rabha Hasong Autonomous Council."}
  - {annee: 2020, evenement: "L'assemblée de l'Assam adopte en septembre les lois sur les conseils Moran, Matak et Kamatapur ; assentiment des lois Moran et Matak le 12 octobre."}
  - {annee: 2021, evenement: "Avant l'élection de l'assemblée de l'Assam, le gouvernement constitue par nomination les quatre conseils créés en 2020 ; en janvier, il annonce 25 membres intérimaires pour le conseil Moran."}
  - {annee: 2025, evenement: "Élection du Rabha Hasong Autonomous Council, fixée au 2 avril."}
fiabilite:
  verifie: ["Texte de la loi Thengal Kachari de 2005 (Assam Gazette du 28 septembre 2005, loi n° XXXVI) et de sa modification de 2010 : composition, 34 domaines administrés, règlements, fonds, budget, dissolution, consultation (art. 70).", "Texte de la loi Moran de 2020 (Assam Gazette du 19 octobre 2020) : 25 membres dont 22 élus, 18 domaines, règlements, fonds, dissolution, consultation (art. 51).", "Liste des domaines de la loi Matak de 2020 (art. 17) : sans les forêts.", "Pages de titre des lois Sonowal Kachari (2005) et Matak (2020).", "Rabha Hasong : 306 puis 779 villages cadastraux, première élection en 2013, 34 départements (site officiel du conseil)."]
  non_confirme: ["Textes des lois créant les conseils Tiwa, Mising et Deori, et des lois de 2020 sur les conseils Bodo Kachari Welfare et Kamatapur : non consultés ; années reprises d'une encyclopédie en ligne.", "Usage effectif des règlements (bye-laws) et de la compétence sur les coutumes prévue par la loi Thengal Kachari, art. 19 (v).", "Versement des fonds aux conseils créés en 2020 après février 2022.", "Absence des Moran, Matak et Koch-Rajbongshi de la liste des Scheduled Tribes de l'Assam : non vérifiée sur l'ordonnance de 1950.", "Population totale des zones des dix conseils : non trouvée ; pour le seul Rabha Hasong, une encyclopédie en ligne donne 553 868 habitants pour les 779 villages de la notification du 17 mai 2005, et le site du conseil une population estimée à 350 000 pour ses 306 villages initiaux.", "Nombre de villages : non trouvé pour l'ensemble des dix conseils ; le seul Rabha Hasong couvre 779 villages cadastraux (revenue villages) depuis la notification n° TAD/BC/135/2005/10 du 17 mai 2005, selon le site du conseil.", "Surface : non trouvée pour l'ensemble des dix conseils ; environ 6 000 km² pour le seul Rabha Hasong selon une encyclopédie en ligne."]
