base_nationale:
  - {instrument: "Loi constitutionnelle de 1982, Charte canadienne des droits et libertés, art. 23 (droits à l'instruction dans la langue de la minorité) ; art. 59 (l'alinéa 23(1)a) n'entre en vigueur au Québec que sur autorisation de l'Assemblée nationale ou du gouvernement du Québec)", nature: "constitution", annee: 1982, source: "https://laws-lois.justice.gc.ca/fra/const/page-12.html"}
  - {instrument: "Mahe c. Alberta, [1990] 1 R.C.S. 342, Cour suprême du Canada, 15 mars 1990 : droit de gestion et de contrôle de la minorité sur l'instruction dans sa langue", nature: "jurisprudence", annee: 1990, source: "https://lawjournal.mcgill.ca/article/mahe-v-alberta-management-and-control-of-minority-language-education/"}
  - {instrument: "Conseil scolaire francophone de la Colombie-Britannique c. Colombie-Britannique, 2020 CSC 13 : équivalence réelle de l'instruction et dommages-intérêts pour violation de l'art. 23", nature: "jurisprudence", annee: 2020, source: "https://jurisource.ca/ressource/conseil-scolaire-francophone-de-la-colombie-britannique-c-colombie-britannique-2020-csc-13-resume/"}
  - {instrument: "Procureur général du Québec c. Quebec English School Boards Association, 2025 QCCA 383, 3 avril 2025 : dispositions de la loi 40 de 2020 déclarées inopérantes à l'égard des commissions scolaires anglophones", nature: "jurisprudence", annee: 2025, source: "https://courdappelduquebec.ca/jugements/jugement?tx_news_pi1%5Bnews%5D=481&tx_news_pi1%5Baction%5D=detail&tx_news_pi1%5Bcontroller%5D=News&cHash=c5926d36434f3fff5af283e1802f382d"}
  - {instrument: "Loi sur les écoles publiques du Manitoba (C.P.L.M. c. P250), partie I.1, art. 21.1 à 21.49, ajoutée en 1993 (L.M. 1993, c. 33) : division scolaire de langue française et sa commission scolaire élue ; exemple d'une loi provinciale d'application de l'art. 23", nature: "loi", annee: 1993, source: "https://web2.gov.mb.ca/laws/statutes/ccsm/p250.php?lang=fr"}
droits:
  autogouvernement: {valeur: "partiel", note: "La minorité gère ses écoles par des conseils ou commissions scolaires dont les membres sont élus ; Mahe c. Alberta (1990) exige une représentation de la minorité proportionnelle au nombre d'élèves et un pouvoir exclusif de décision sur l'instruction dans sa langue. Au Manitoba, la commission scolaire de langue française, composée de cinq à onze commissaires élus, administre la division scolaire de langue française, Loi sur les écoles publiques, art. 21.4. La compétence se limite à l'éducation primaire et secondaire et s'exerce dans le cadre des lois provinciales.", source: "https://web2.gov.mb.ca/laws/statutes/ccsm/p250.php?lang=fr"}
  pouvoir_normatif: {valeur: "partiel", note: "Selon Mahe c. Alberta (1990), les représentants de la minorité décident de l'établissement des programmes, de la nomination des administrateurs, du recrutement du personnel et des accords de services. Au Manitoba, la commission scolaire de langue française peut, par règlement administratif (texte adopté par la commission elle-même), modifier ses circonscriptions électorales et le nombre de ses commissaires, Loi sur les écoles publiques, art. 21.36.1(1) ; ce règlement n'a d'effet qu'après approbation du lieutenant-gouverneur en conseil (gouvernement provincial), art. 21.36.1(2). Ces normes restent soumises aux lois et programmes provinciaux.", source: "https://lawjournal.mcgill.ca/article/mahe-v-alberta-management-and-control-of-minority-language-education/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Le français et l'anglais sont les langues officielles du Canada et ont un statut égal dans les institutions du Parlement et du gouvernement fédéral, Charte canadienne, art. 16(1) (1982) ; parmi les provinces, la Charte ne les rend co-officiels qu'au Nouveau-Brunswick, art. 16(2). L'art. 23 garantit l'usage de la langue de la minorité dans l'instruction publique.", source: "https://laws-lois.justice.gc.ca/fra/const/page-12.html"}
  education: {valeur: "reconnu", note: "Les citoyens de la minorité ont le droit de faire instruire leurs enfants aux niveaux primaire et secondaire dans leur langue, et, lorsque le nombre le justifie, dans des établissements de la minorité financés sur les fonds publics, Charte canadienne, art. 23(3)b) (1982). Au Québec, seul l'alinéa 23(1)a) (critère de la langue maternelle) n'est pas en vigueur, art. 59 de la Loi constitutionnelle de 1982.", source: "https://laws-lois.justice.gc.ca/fra/const/page-12.html"}
  fiscalite: {valeur: "partiel", note: "Selon Mahe c. Alberta (1990), les représentants de la minorité décident de la dépense des fonds affectés à l'instruction dans leur langue. Au Manitoba, chaque division scolaire remet chaque année à la commission scolaire de langue française la part de la taxe spéciale scolaire correspondant aux élèves qui résident dans la division et suivent un programme de cette commission, Loi sur les écoles publiques, art. 190.1. Les fonds viennent pour l'essentiel des provinces.", source: "https://web2.gov.mb.ca/laws/statutes/ccsm/p250.php?lang=fr"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Plusieurs recours en justice portent sur l'application de l'art. 23. En 2020, la Cour suprême du Canada constate une violation de l'art. 23 en Colombie-Britannique et accorde au conseil scolaire francophone des dommages-intérêts, dont 6 millions de dollars pour le financement du transport scolaire des années 2002-2003 à 2011-2012. Au Québec, l'application de la loi 40 de 2020 au réseau anglophone est suspendue par un sursis du 10 août 2020 ; le 3 avril 2025, la Cour d'appel du Québec juge que cette loi neutralise le droit de la minorité de choisir ses représentants et déclare plusieurs de ses dispositions inopérantes à l'égard de ce réseau. La demande d'autorisation d'appel du gouvernement du Québec (dossier 41838) est soumise aux juges de la Cour suprême le 9 février 2026, sans décision à la dernière mise à jour du dossier (20 février 2026). Selon Statistique Canada, en 2021, 64,7 % des enfants admissibles de 5 à 17 ans hors Québec et 76,2 % au Québec fréquentaient ou avaient fréquenté une école de la minorité.", source: "https://www.scc-csc.ca/cases-dossiers/search-recherche/41838/"}
chronologie:
  - {annee: 1982, evenement: "Entrée en vigueur de la Charte canadienne des droits et libertés et de son article 23 ; l'alinéa 23(1)a) est suspendu pour le Québec (art. 59)."}
  - {annee: 1990, evenement: "Arrêt Mahe c. Alberta (15 mars) : la minorité a un droit de gestion et de contrôle de l'instruction dans sa langue."}
  - {annee: 1993, evenement: "Le Manitoba crée par loi une division scolaire de langue française administrée par une commission scolaire élue."}
  - {annee: 2020, evenement: "Loi 40 au Québec (février) ; sursis de son application au réseau anglophone le 10 août, confirmé par la Cour d'appel en septembre. Arrêt 2020 CSC 13 sur le Conseil scolaire francophone de la Colombie-Britannique."}
  - {annee: 2020, evenement: "Le ministère de l'Éducation et de l'Enseignement supérieur du Québec suspend, en raison de la COVID-19, les élections de huit commissions scolaires anglophones prévues le 20 décembre (annonce du 27 novembre relayée par Élections Québec)."}
  - {annee: 2023, evenement: "La Cour supérieure du Québec (2023 QCCS 2965, 2 août) déclare plusieurs dispositions de la loi 40 inopérantes à l'égard des commissions scolaires anglophones."}
  - {annee: 2025, evenement: "La Cour d'appel du Québec confirme l'essentiel du jugement (2025 QCCA 383, 3 avril) ; le gouvernement du Québec demande l'autorisation d'appeler à la Cour suprême (mai)."}
fiabilite:
  verifie: ["Texte de l'art. 23 de la Charte et de l'art. 59 de la Loi constitutionnelle de 1982 sur le site du ministère de la Justice du Canada.", "Liste des 28 conseils scolaires francophones membres de la FNCSF (12 en Ontario, 4 en Alberta, 3 au Nouveau-Brunswick, 1 dans chacune des autres provinces et territoires).", "Liste des 9 commissions scolaires anglophones sur la page des coordonnées des commissions scolaires du gouvernement du Québec.", "Loi sur les écoles publiques du Manitoba, art. 21.2, 21.4, 21.36.1 et 190.1 ; la partie I.1 couvre les art. 21.1 à 21.49.", "Arrêt 2025 QCCA 383 : date, renvoi à Mahe sur le pouvoir exclusif des représentants de la minorité, jugement de première instance 2023 QCCS 2965.", "Dossier 41838 de la Cour suprême : demande d'autorisation d'appel déposée le 30 mai 2025, soumise aux juges le 9 février 2026, sans décision à la date de mise à jour de la page (20 février 2026).", "La Cour d'appel du Québec (2025) écarte l'obligation de consulter la minorité avant de légiférer qu'avait retenue la Cour supérieure (page de l'arrêt sur le site de la Cour d'appel).", "Ballantyne, Davidson et McIntyre c. Canada (constatations du Comité des droits de l'homme, 1993, CCPR/C/47/D/359/1989 et 385/1989/Rev.1), par. 11.2 : les minorités visées par l'art. 27 du Pacte sont celles de l'État et non d'une province ; les citoyens anglophones du Canada ne peuvent être considérés comme une minorité linguistique. Aucune reconnaissance onusienne n'est donc retenue pour la minorité anglophone du Québec.", "Nombre d'enfants admissibles, Statistique Canada, Le Quotidien du 30 novembre 2022."]
  non_confirme: ["Texte intégral de l'arrêt Mahe : le site de la Cour suprême et CanLII refusent l'accès ; contenu repris d'une analyse de la McGill Law Journal (1990) et de l'arrêt 2025 QCCA 383.", "La liste des 28 conseils francophones vient de la fédération qui les regroupe, pas d'une liste publiée par l'État ; aucune liste fédérale officielle n'a été trouvée.", "Lois provinciales et territoriales d'application de l'art. 23 autres que celle du Manitoba : non lues une à une ; les modes d'élection et les pouvoirs varient selon la province.", "Portée exacte du rejet de l'obligation de consulter : texte intégral de l'arrêt 2025 QCCA 383 non lu sur ce point.", "Aucun document de l'ONU nommant ce régime comme droit collectif n'a été trouvé.", "La communauté acadienne et francophone du Nouveau-Brunswick, dotée d'un régime propre (art. 16.1 de la Charte), a une fiche distincte ; ses trois districts figurent aussi dans le tableau de ce régime.", "Surface : non renseignée ; le régime est personnel et couvre tout le territoire national, sans zone délimitée.", "Nombre de villages : non trouvé ; le régime ne délimite aucune zone dont on pourrait compter les localités."]
