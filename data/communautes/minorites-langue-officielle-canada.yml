resume: >-
  L'article 23 de la Charte canadienne des droits et libertés (1982) garantit aux citoyens de la minorité francophone ou anglophone d'une province le droit de faire instruire leurs enfants dans leur langue, sur les fonds publics, là où le nombre le justifie. Dans l'arrêt Mahe c. Alberta (1990), la Cour suprême du Canada en a tiré un droit collectif de gestion et de contrôle : les représentants de la minorité décident seuls des questions qui touchent l'instruction dans leur langue et les établissements où elle est donnée. Ce régime s'exerce par 28 conseils scolaires francophones hors Québec et par 9 commissions scolaires anglophones au Québec, dont les élus sont choisis par la minorité. Au Québec, la loi 40 de 2020 remplace les commissions scolaires par des centres de services ; un sursis (suspension) d'août 2020 en a bloqué l'application au réseau anglophone, puis la Cour d'appel du Québec a déclaré en 2025 plusieurs de ses dispositions inopérantes à l'égard de ce réseau. Le gouvernement du Québec demande l'autorisation d'appeler de cet arrêt devant la Cour suprême du Canada. Les trois districts scolaires francophones du Nouveau-Brunswick, comptés ici, sont décrits dans la fiche « Communauté acadienne et francophone du Nouveau-Brunswick ».
