resume: >-
  Trois parcs nationaux fédéraux d'Australie sont la propriété, en tout ou partie, de leurs propriétaires traditionnels (traditional owners, détenteurs coutumiers des terres), qui les louent au Directeur des parcs nationaux, organisme fédéral : Kakadu (Bininj/Mungguy, baux jusqu'au 31 décembre 2078), Uluṟu-Kata Tjuṯa (Aṉangu, bail de 99 ans jusqu'en 2084) et Booderee (communauté de Wreck Bay, bail de 99 ans jusqu'en 2094). La loi fédérale sur la protection de l'environnement de 1999 (EPBC Act) impose au ministre de créer un conseil de gestion lorsqu'il en convient avec le conseil foncier aborigène ou, à défaut, avec les propriétaires traditionnels ; ce conseil compte une majorité de membres désignés par les propriétaires traditionnels lorsque le parc est entièrement ou principalement terre aborigène. Il prend les décisions de gestion conformes au plan de gestion et prépare ce plan avec le Directeur ; le plan ne peut être soumis au ministre sans son accord. Les baux prévoient un loyer annuel et le versement d'une part des recettes du parc aux propriétaires. Booderee est aussi décrit dans la fiche « Communauté aborigène de Wreck Bay (territoire de la baie de Jervis) », et les terres aborigènes de Kakadu dans la fiche « Aborigènes du Territoire du Nord ».
