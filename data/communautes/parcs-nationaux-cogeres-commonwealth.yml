droits:
  autogouvernement: {valeur: "partiel", note: "Le ministre doit créer un conseil de gestion (Board of Management) s'il en convient avec le conseil foncier aborigène ou les propriétaires traditionnels (s. 377(1)) ; la majorité des membres sont des Aborigènes désignés par les propriétaires traditionnels lorsque le parc est entièrement ou principalement terre aborigène (s. 377(4)) : 16 sur 21 à Kakadu (avis de 2021), 8 sur 12 à Uluṟu-Kata Tjuṯa ; le conseil est un organe mixte nommé par le ministre (s. 379), tenu de suivre ses directions en cas de désaccord avec le Directeur (s. 376(2), 364, 369).", source: "https://www.legislation.gov.au/C2004A00485/latest/text"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil prépare le plan de gestion avec le Directeur (s. 366(3)) ; le Directeur ne peut le soumettre au ministre qu'avec l'accord du conseil (s. 370(1)) ; une fois approuvé, le plan est un instrument législatif (s. 371) ; le ministre peut le renvoyer avec des suggestions (s. 370(3)), tranche les désaccords (s. 369) et approuve la version soumise à nouveau avec les modifications qu'il juge appropriées (s. 370(5)).", source: "https://www.legislation.gov.au/C2004A00485/latest/text"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le titre est détenu par des fiducies foncières aborigènes (Kakadu, Jabiluka, Gunlom, Uluṟu-Kata Tjuṯa Aboriginal Land Trusts) en vertu de la loi de 1976, et par le Wreck Bay Aboriginal Community Council pour Booderee, mais il est loué au Directeur des parcs nationaux (baux de Kakadu jusqu'au 31 décembre 2078, d'Uluṟu-Kata Tjuṯa jusqu'au 25 octobre 2084, de Booderee jusqu'au 10 octobre 2094) ; à Kakadu, environ la moitié du parc est terre aborigène (plan de gestion 2016-2026).", source: "https://www.legislation.gov.au/F2016L00002/asmade/text"}
  ressources: {valeur: "partiel", note: "La loi ne fait pas obstacle à l'usage traditionnel des réserves par les Autochtones pour la chasse et la cueillette hors vente et à des fins cérémonielles et religieuses, sauf règlement exprès de conservation (s. 359A) ; toute activité minière est interdite à Kakadu (s. 387).", source: "https://www.legislation.gov.au/C2004A00485/latest/text"}
  consentement: {valeur: "partiel", note: "La création, la modification ou la suppression du conseil exigent l'accord du conseil foncier ou des propriétaires traditionnels (s. 377(1), 378(3)) ; dans le Territoire du Nord, le membre désigné par le Territoire n'est nommé qu'avec le consentement des membres désignés par les propriétaires traditionnels, sauf recommandation de l'Ombudsman (s. 390A) ; à Kakadu, Uluṟu et Booderee, un désaccord substantiel du président du conseil foncier oblige le ministre à renvoyer le plan (s. 390(2)).", source: "https://www.legislation.gov.au/C2004A00485/latest/text"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les baux prévoient un loyer annuel versé au conseil foncier pour les propriétaires et une part des droits d'entrée et autres recettes : 25 % pour le bail Kakadu, 13,8 % pour le bail Gunlom, aucune pour le bail Jabiluka (annexe du plan de gestion de Kakadu 2016-2026) ; 25 % à Uluṟu-Kata Tjuṯa (plan de 2021) et à Booderee (plan de 2015-2025).", source: "https://www.legislation.gov.au/F2016L00002/asmade/text"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'audit de l'Australian National Audit Office (Cour des comptes fédérale) publié en 2019 relève que les trois conseils de gestion ont demandé une révision des baux depuis 2017 sans qu'elle ait commencé, que celui de Booderee a émis un avis formel de différend, et que les propriétaires traditionnels disent ne pas participer pleinement à la cogestion ; les plans de Kakadu et de Booderee ont expiré le 4 janvier 2026 et le 19 novembre 2025.", source: "https://www.anao.gov.au/work/performance-audit/management-commonwealth-national-parks"}
chronologie:
  - {annee: 1978, evenement: "Les terres de la première tranche de Kakadu sont attribuées à la Kakadu Aboriginal Land Trust, qui les loue au Directeur des parcs nationaux en novembre."}
  - {annee: 1985, evenement: "Le 26 octobre, restitution du titre d'Uluṟu-Kata Tjuṯa aux Aṉangu, bail de 99 ans au Directeur ; conseil de gestion à majorité aṉangu en décembre."}
  - {annee: 1991, evenement: "Bail entre la Jabiluka Aboriginal Land Trust et le Directeur pour une partie de Kakadu."}
  - {annee: 1995, evenement: "Le parc de Jervis Bay devient terre aborigène du Wreck Bay Aboriginal Community Council le 11 octobre et est loué pour 99 ans ; il prend le nom de Booderee en 1997."}
  - {annee: 1996, evenement: "Terres de la troisième tranche de Kakadu attribuées à la Gunlom Aboriginal Land Trust et louées au Directeur."}
  - {annee: 1999, evenement: "Adoption de l'EPBC Act, qui remplace en juillet 2000 la loi de 1975 sur les parcs nationaux et reprend le régime des conseils de gestion."}
  - {annee: 2019, evenement: "Audit de l'ANAO sur la gestion des parcs nationaux fédéraux."}
  - {annee: 2021, evenement: "Le conseil de Kakadu passe à 21 membres, dont 16 désignés par les propriétaires traditionnels."}
  - {annee: 2025, evenement: "Loi n° 51 : le conseil continue de décider selon le dernier plan de gestion lorsque celui-ci a expiré."}
fiabilite:
  verifie: ["Sections 359A, 364, 366, 369 à 371, 376 à 383, 387 et 390 à 390A de l'EPBC Act (compilation du 24 août 2026, legislation.gov.au).", "Loi n° 51 de 2025 sur les fonctions des conseils de gestion.", "Composition du conseil de Kakadu (avis de 2021) et d'Uluṟu-Kata Tjuṯa (8 membres aṉangu sur 12, plan de 2021 et annuaire du gouvernement australien).", "Superficies et constats de l'audit ANAO de 2019.", "Clauses financières et échéances des baux d'Uluṟu-Kata Tjuṯa (25 octobre 2084), de Kakadu, Jabiluka et Gunlom (31 décembre 2078, bail type commun en annexe du plan de 2016) et de Booderee (10 octobre 2094, part de 25 % des recettes).", "Expiration des plans de Kakadu (4 janvier 2026) et de Booderee (19 novembre 2025) au registre fédéral de la législation."]
  non_confirme: ["Aucun nouveau plan de gestion approuvé pour Kakadu ou Booderee n'a été trouvé au registre au 1er octobre 2026 ; un projet de plan 2026-2036 pour Booderee a été soumis à consultation en mars 2026.", "Population des propriétaires traditionnels des trois parcs : non trouvée ; le chiffre retenu additionne quatre localités statistiques (fiches QuickStats 2021 SAL70140, SAL70136, SAL70200, SAL90003) dont les limites ne coïncident pas avec celles des parcs.", "Statut des revendications foncières en cours sur la partie de Kakadu qui n'est pas encore terre aborigène.", "Nombre de villages : non trouvé (outstations de Kakadu non dénombrées dans les sources consultées)."]
