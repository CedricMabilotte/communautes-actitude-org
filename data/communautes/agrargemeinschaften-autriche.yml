resume: >-
  Fiche agrégée : elle couvre les communautés agraires (Agrargemeinschaften) d'Autriche, groupements des propriétaires de fermes ou de personnes titulaires d'une part, qui possèdent ou gèrent en commun des forêts, des alpages et des pâturages utilisés « en vertu d'un usage ancien » (auf Grund alter Übung). Le régime repose sur la loi-cadre fédérale sur l'organisation foncière agricole (Flurverfassungs-Grundsatzgesetz 1951, BGBl. 103/1951), abrogée fin 2019 quand la matière est passée à la compétence exclusive des Länder, et sur les lois des Länder, dont la loi tyrolienne de 1996 (TFLG 1996) et la loi du Vorarlberg de 1979. En droit tyrolien, la communauté agraire est une corporation de droit public (Körperschaft des öffentlichen Rechts, personne morale publique formée de ses membres) dotée d'une assemblée générale, d'un comité et d'un président élus, sous la tutelle de l'autorité agraire (Agrarbehörde). Le Land du Tyrol estime leur nombre entre 1 800 et 2 000 sur son territoire ; aucun total national n'a été trouvé.
