  - {instrument: "Flurverfassungsgesetz du Vorarlberg, LGBl. Nr. 2/1979", nature: "loi", annee: 1979, source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrVbg&Gesetzesnummer=20000588"}
  - {instrument: "Cour constitutionnelle (VfGH), arrêt du 1er mars 1982, G35/81 et autres (VfSlg 9336/1982), sur l'inclusion du Gemeindegut dans le régime agraire", nature: "jurisprudence", annee: 1982, source: "https://www.ris.bka.gv.at/Dokument.wxe?Abfrage=Vfgh&Dokumentnummer=JFR_10179699_81G00035_01"}
  - {instrument: "Cour constitutionnelle (VfGH), arrêt du 11 juin 2008, B464/07 (VfSlg 18.446/2008, arrêt « Mieders »)", nature: "jurisprudence", annee: 2008, source: "https://www.ris.bka.gv.at/Dokument.wxe?Abfrage=Vfgh&Dokumentnummer=JFR_09919389_07B00464_01"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les organes de la communauté agraire sont l'assemblée générale (Vollversammlung), le comité (Ausschuss) élu par l'assemblée pour cinq ans et le président (Obmann) élu par le comité (TFLG 1996, § 35). Les communautés « décident en principe de façon autonome » selon le Land, mais restent sous la tutelle de l'autorité agraire, qui contrôle la légalité et l'opportunité de la gestion, peut convoquer les organes et nommer un administrateur à leur place (TFLG 1996, § 37, al. 1 à 3).", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée générale décide à la majorité des parts des membres présents (TFLG 1996, § 35, al. 2), mais les statuts (Satzungen) sont fixés par décision administrative (Bescheid) de l'autorité agraire, d'office au-delà de cinq membres (TFLG 1996, § 34, al. 2) ; certains actes, dont la création d'entreprises commerciales, exigent son autorisation, et elle annule les décisions contraires à la loi ou aux statuts (§ 37, al. 4 à 6).", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La communauté agraire, corporation de droit public (TFLG 1996, § 34, al. 3), possède ou utilise en commun les terrains agraires ; l'autorité agraire inscrit au registre foncier si la propriété revient à des copropriétaires ou à la communauté (§ 38, al. 1 et 2). La qualité de membre est attachée à une ferme (Stammsitzliegenschaft) et n'en est séparée qu'avec l'autorisation de l'autorité agraire (§ 38, al. 3) ; la vente ou la charge durable de terrains exige aussi son autorisation, sauf vente de 2 000 m² au plus (§ 40, al. 1). Une partie des terrains appartient à une commune ; pour le Gemeindegut (biens communaux), la valeur de substance revient à la commune (voir ressources).", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
  ressources: {valeur: "partiel", note: "Les membres utilisent en commun la forêt, l'alpage et le pâturage à des fins agricoles et forestières (TFLG 1996, § 33, al. 1). Sur le Gemeindegut transféré à une communauté agraire, la valeur de substance (Substanzwert, revenus au-delà de l'usage agricole et forestier) revient à la commune depuis l'arrêt VfSlg 18.446/2008 ; un administrateur de substance (Substanzverwalter) nommé par le conseil municipal gère ventes, baux et charges sur ces terrains (TFLG 1996, §§ 36a à 36k, LGBl. Nr. 70/2014).", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les statuts règlent l'usage des excédents de recettes, le fonds de fonctionnement, le budget prévisionnel et les comptes, vérifiés par des contrôleurs aux comptes (TFLG 1996, § 36, lettres f et g) ; ces règles ne s'appliquent pas aux communautés sur Gemeindegut, dont la gestion financière relève de règles propres (§§ 36a et 36e). Aucun pouvoir fiscal.", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer=20000117"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le régime est appliqué et soumis au juge : la Cour constitutionnelle a tranché en 2008 (B464/07) et en 2010 (B639/10) des recours de communes et de communautés agraires contre des décisions de l'autorité agraire tyrolienne ; en 2010, elle a validé la modification de la TFLG (LGBl. Nr. 7/2010) qui attribue à la commune la valeur de substance du Gemeindegut. Le Land du Tyrol estime à 1 800 à 2 000 le nombre de communautés agraires sous sa tutelle.", source: "https://www.ris.bka.gv.at/Dokument.wxe?Abfrage=Vfgh&Dokumentnummer=JFR_09898790_10B00639_01"}
chronologie:
  - {annee: 1847, evenement: "Résolution impériale du 6 février 1847 pour le Tyrol et le Vorarlberg : des forêts sont transférées en propriété à des groupes d'ayants droit."}
  - {annee: 1883, evenement: "Loi-cadre impériale du 7 juin 1883 (RGBl. Nr. 94) sur le partage et la régulation des terres communes."}
  - {annee: 1951, evenement: "Loi-cadre fédérale sur l'organisation foncière agricole (BGBl. Nr. 103/1951)."}
  - {annee: 1979, evenement: "Nouvelle publication de la loi du Vorarlberg sur l'organisation foncière agricole (LGBl. Nr. 2/1979), issue de la loi de 1951 (LGBl. Nr. 4/1951)."}
  - {annee: 1982, evenement: "Arrêt de la Cour constitutionnelle du 1er mars 1982 (VfSlg 9336/1982) : les dispositions qui incluent le Gemeindegut dans le régime agraire sans tenir compte de sa valeur de substance sont jugées contraires au principe d'égalité."}
  - {annee: 1996, evenement: "Loi tyrolienne sur l'organisation foncière agricole (TFLG 1996, LGBl. Nr. 74/1996)."}
  - {annee: 2008, evenement: "Arrêt « Mieders » de la Cour constitutionnelle (11 juin, B464/07) : la valeur de substance du Gemeindegut transféré revient à la commune."}
  - {annee: 2010, evenement: "Modification de la TFLG (LGBl. Nr. 7/2010) ; arrêt de la Cour constitutionnelle du 10 décembre (B639/10, « Unterlangkampfen »)."}
  - {annee: 2014, evenement: "Modification de la TFLG (LGBl. Nr. 70/2014) : régime des communautés sur Gemeindegut et administrateur de substance (§§ 36a à 36k)."}
  - {annee: 2020, evenement: "La loi-cadre fédérale de 1951 cesse de s'appliquer avec la fin de la compétence fédérale de principe (B-VG, art. 151, al. 63, ch. 4, BGBl. I Nr. 14/2019) ; la matière relève des seuls Länder."}
