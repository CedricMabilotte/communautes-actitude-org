droits:
  autogouvernement: {valeur: "partiel", note: "L'organisme communautaire est une société à responsabilité limitée par garantie, une SCIO (organisation caritative écossaise) ou une community benefit society (société coopérative d'intérêt collectif), d'au moins 10 membres dont les trois quarts au moins sont des membres de la communauté, définie par codes postaux, qui en gardent le contrôle ; les ministres doivent confirmer par écrit que son objet principal sert le développement durable, Land Reform (Scotland) Act 2003, s. 34 (modifiée en 2015).", source: "https://www.legislation.gov.uk/asp/2003/2/section/34"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Droit d'achat prioritaire après enregistrement d'un intérêt communautaire sur une terre (Land Reform (Scotland) Act 2003, s. 37) ; droit d'achat des terres de croft par un organisme de communauté de crofters avec le consentement des ministres (s. 73) ; droit d'achat, sans accord du propriétaire, des terres abandonnées, négligées ou dont l'usage nuit au bien-être environnemental de la communauté (partie 3A, s. 97C, en vigueur depuis 2018) ; prix fixé à la valeur de marché par un évaluateur, sans inaliénabilité.", source: "https://www.legislation.gov.uk/asp/2003/2/part/3A"}
  ressources: {valeur: "partiel", note: "Le droit d'achat des communautés de crofters s'étend aux pêcheries de saumon et aux droits miniers, sauf le pétrole, le charbon, le gaz, l'or et l'argent, Land Reform (Scotland) Act 2003, s. 68(2)(d).", source: "https://www.gov.scot/publications/crofting-community-right-buy-under-part-3-land-reform-scotland/"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de l'université des Highlands et des Îles et de l'université d'Édimbourg (juin 2026) relève que le droit d'achat communautaire est jugé complexe, qu'aucun achat réussi par ce droit n'a eu lieu depuis plusieurs années selon les personnes interrogées et que le droit d'achat des communautés de crofters a été si peu utilisé que son adéquation est mise en doute ; les acquisitions passent surtout par des ventes négociées avec un vendeur consentant. La statistique officielle recense 853 biens en propriété communautaire fin 2024, dont 84 acquis en 2000 ou avant, sans ventilation selon la voie d'acquisition.", source: "https://www.landcommission.gov.scot/sefari-fellowship-to-understand-changes-in-demand-for-largescale-community-land-acquisitions-and-identify-barriers-and-solutions-to-new-acquisitions"}
chronologie:
  - {annee: 1923, evenement: "Le Stornoway Trust devient propriétaire du domaine de Stornoway (île de Lewis), 28 000 ha."}
  - {annee: 2001, evenement: "Création du fonds public qui deviendra le Scottish Land Fund, pour financer les achats communautaires."}
  - {annee: 2003, evenement: "Land Reform (Scotland) Act : droit d'achat prioritaire des communautés et droit d'achat des communautés de crofters (en vigueur en 2004)."}
  - {annee: 2006, evenement: "Le domaine de South Uist (37 636 ha) passe à Sealladh Na Beinne Mòire, plus grand bien communautaire recensé."}
  - {annee: 2015, evenement: "Loi sur l'autonomisation des communautés : droit d'acheter les terres abandonnées ou négligées et demandes de transfert d'actifs publics."}
  - {annee: 2016, evenement: "Land Reform (Scotland) Act 2016 : droit d'achat pour le développement durable (en vigueur le 26 avril 2020)."}
  - {annee: 2018, evenement: "Entrée en vigueur complète de la partie 3A (27 juin)."}
  - {annee: 2024, evenement: "503 groupes possèdent 853 biens sur 213 803 ha, 2,7 % des terres de l'Écosse."}
  - {annee: 2025, evenement: "Land Reform (Scotland) Act 2025, sanctionné le 16 décembre : obligations des propriétaires de plus de 1 000 ha envers les communautés et notification préalable des ventes (non en vigueur)."}
