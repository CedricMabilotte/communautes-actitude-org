resume: >-
  Le Land Reform (Scotland) Act 2003 donne aux organismes communautaires constitués (community bodies, personnes morales contrôlées par les habitants d'une zone définie par codes postaux) un droit d'achat prioritaire sur les terres mises en vente, après enregistrement d'un intérêt communautaire (partie 2) et donne aux communautés de crofters, petits exploitants agricoles sous statut de crofting, un droit d'acheter les terres de croft sans mise en vente par le propriétaire (partie 3). La loi de 2015 sur l'autonomisation des communautés (asp 2015 n° 6) a ajouté un droit d'achat des terres abandonnées, négligées ou dont l'usage nuit au bien-être environnemental de la communauté (partie 3A) et la loi de 2016 un droit d'achat pour le développement durable (partie 5) ; ces deux droits s'exercent avec le consentement des ministres écossais, sans accord du propriétaire. Au 31 décembre 2024, la statistique officielle recense 853 biens détenus par 503 groupes, sur 213 803 ha, dont 72 % dans les Hébrides extérieures. Ce décompte inclut les biens acquis par achat négocié, don ou transfert d'actifs publics, et non seulement par ces droits d'achat. Les comités des pâturages communs ont leur propre fiche (« Crofters des pâturages communs (Écosse) »).
