resume: >-
  Les peuples des zones Kafa, Sheka, Bench Sheko, Dawro et Ouest-Omo et du woreda spécial (district à statut particulier) Konta sont des « nations, nationalités et peuples » au sens de la Constitution fédérale éthiopienne.
  Ils relevaient de l'État régional des nations, nationalités et peuples du Sud.
  Le 30 septembre 2021, sur le fondement de l'article 47, ils ont voté par référendum, organisé par la Commission électorale nationale, pour former un État régional commun.
  La Région des peuples d'Éthiopie du Sud-Ouest, onzième État de la fédération, a été établie le 23 novembre 2021 à Bonga ; son conseil a adopté ce jour-là une constitution régionale et retenu l'amharique comme langue de travail.
  Le gouvernement régional a choisi quatre capitales de même rang : Bonga, Mizan Aman, Tercha et Tepi.
