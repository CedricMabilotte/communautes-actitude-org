reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur l'Afrique du Sud, CCPR/C/ZAF/CO/1, par. 46 et 47 : le Comité relève les préoccupations des « communautés traditionnelles et autochtones » sur les critères de reconnaissance du projet de loi sur le leadership traditionnel et khoi-san et demande sa révision en consultation avec elles.", annee: 2016, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/ZAF/CO/1&l=en&t=pdf"}
