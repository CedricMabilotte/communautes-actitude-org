  verifie: ["Art. 3, 16, 20, 23, 24, 25, 26 et 39 de la loi n° 3 de 2019 (Journal officiel n° 42865, 28 novembre 2019).", "Entrée en vigueur au 1er avril 2021 (proclamation n° 38 de 2020).", "Art. 211 et 212 et annexe 6, point 16 de la Constitution de 1996.", "Art. 2 et 5 de la loi n° 31 de 1996 et prorogation jusqu'au 31 décembre 2027 (avis n° 4165 de 2026).", "Art. 18 et 19 de la loi n° 9 de 2022 et absence d'entrée en vigueur ; consultation sur le projet de règlement (avis n° 3706 de 2025).", "Arrêt Mogale du 30 mai 2023 et prolongation de la suspension au 29 mai 2027 (communiqué du ministre, 30 mai 2025).", "Par. 46 et 47 de CCPR/C/ZAF/CO/1 (2016)."]
  non_confirme: ["Nombre de communautés et de conseils traditionnels reconnus, population concernée et surface : aucune liste officielle nationale consultée, d'où l'absence de tableau des sites et de chiffres.", "Texte de l'arrêt de la Cour constitutionnelle de 2025 prolongeant la suspension : non consulté ; la date du 29 mai 2027 vient du communiqué du ministre.", "Maintien en application des art. 12 et 20 de la Black Administration Act de 1927 : déduit du préambule et de l'art. 18 de la loi n° 9 de 2022, sans liste des tribunaux de chefs en activité.", "Droits sur les ressources (mines, eau, pêche) et régimes fonciers provinciaux, dont l'Ingonyama Trust au KwaZulu-Natal : non étudiés.", "Le choix du type « peuple tribal ou coutumier » repose sur les critères de la loi de 2019 (leadership, droit coutumier, territoire, patrimoine culturel) ; aucun document de l'ONU ne qualifie ainsi ces communautés."]
