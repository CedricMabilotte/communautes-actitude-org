  - {instrument: "Constitution de la République d'Afrique du Sud de 1996, chap. 12, art. 211 et 212 ; annexe 6, point 16", nature: "constitution", annee: 1996, source: "https://www.gov.za/sites/default/files/images/a108-96.pdf"}
  - {instrument: "Traditional and Khoi-San Leadership Act (loi sur le leadership traditionnel et khoi-san) n° 3 de 2019, art. 3, 16, 20, 23, 24, 25, 26 et 39 ; en vigueur le 1er avril 2021 (proclamation n° 38 de 2020)", nature: "loi", annee: 2019, source: "https://www.gov.za/sites/default/files/gcis_document/201911/4286528-11act3of2019tradkhoisanleadership.pdf"}
  - {instrument: "Interim Protection of Informal Land Rights Act (loi sur la protection provisoire des droits fonciers informels) n° 31 de 1996, art. 2 ; prorogée jusqu'au 31 décembre 2027 (avis n° 4165 de 2026)", nature: "loi", annee: 1996, source: "https://www.gov.za/sites/default/files/gcis_document/201409/act31of1996.pdf"}
  - {instrument: "Traditional Courts Act (loi sur les tribunaux traditionnels) n° 9 de 2022, publiée le 27 septembre 2023, non encore en vigueur", nature: "loi", annee: 2023, source: "https://www.gov.za/sites/default/files/gcis_document/202310/49373traditionalcourtsact92022.pdf"}
  - {instrument: "Mogale and Others v Speaker of the National Assembly and Others [2023] ZACC 14 (Cour constitutionnelle, 30 mai 2023)", nature: "jurisprudence", annee: 2023, source: "https://www.saflii.org/za/cases/ZACC/2023/14.html"}
  - {instrument: "Droit coutumier des communautés, reconnu sous réserve de la Constitution (Constitution, art. 211)", nature: "coutume_reconnue", annee: 1996, source: "https://www.gov.za/sites/default/files/images/a108-96.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Une communauté qui a un leadership traditionnel de rang senior, observe un droit coutumier et occupe une zone géographique déterminée peut être reconnue par le Premier de la province par avis au Journal officiel provincial (loi n° 3 de 2019, art. 3 (4) à (6)). Elle doit instituer un conseil traditionnel dans les deux ans (art. 16 (1)) : 60 % des membres sont des chefs et des membres de la communauté choisis selon la coutume par le chef senior (senior traditional leader), 40 % sont élus, et au moins un tiers sont des femmes, sauf seuil inférieur fixé par le Premier (art. 16 (2)). La loi est déclarée invalide depuis 2023, avec effet suspendu jusqu'au 29 mai 2027.", source: "https://www.gov.za/sites/default/files/gcis_document/201911/4286528-11act3of2019tradkhoisanleadership.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution reconnaît le leadership traditionnel selon le droit coutumier et impose aux tribunaux d'appliquer le droit coutumier lorsqu'il est applicable, sous réserve de la Constitution et des lois (art. 211 (1) et (3)). Le conseil traditionnel administre les affaires de la communauté selon la coutume et la tradition et exerce les fonctions que lui confère le droit coutumier (loi n° 3 de 2019, art. 20 (1) (a) et (l)). Aucun pouvoir d'édicter des lois.", source: "https://www.gov.za/sites/default/files/images/a108-96.pdf"}
  justice_propre: {valeur: "partiel", note: "Les tribunaux des chefs traditionnels existant en 1996 continuent de siéger selon la législation qui leur est applicable (Constitution, annexe 6, point 16 (1)), soit les art. 12 et 20 de la Black Administration Act de 1927 (compétences civile et pénale déléguées par le ministre). La loi n° 9 de 2022 sur les tribunaux traditionnels, qui abroge ces articles (art. 18 (2)), n'entre en vigueur qu'à une date fixée par proclamation présidentielle (art. 19) ; son projet de règlement a été soumis à consultation en décembre 2025.", source: "https://www.gov.za/sites/default/files/gcis_document/202310/49373traditionalcourtsact92022.pdf"}
  terres: {valeur: "partiel", note: "Hors expropriation, nul ne peut être privé d'un droit foncier informel sans son consentement (loi n° 31 de 1996, art. 2 (1)) ; sur une terre détenue de façon communautaire, une cession n'est valable que par décision de la majorité des titulaires de droits présents ou représentés à une réunion convoquée à cet effet (art. 2 (2) et (4)). Cette loi provisoire est prorogée d'année en année ; l'avis n° 4165 de 2026 la proroge jusqu'au 31 décembre 2027. Aucun titre de propriété collective n'est conféré aux communautés par la loi n° 3 de 2019.", source: "https://www.gov.za/sites/default/files/gcis_document/201409/act31of1996.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Tout partenariat ou accord conclu par un conseil traditionnel avec une municipalité, une administration ou une personne privée est soumis à une consultation préalable de la communauté, à une décision favorable de la majorité des membres présents, à une décision écrite du conseil et à la ratification du Premier de la province (loi n° 3 de 2019, art. 24 (3)). La loi n° 31 de 1996 exige le consentement des titulaires avant toute privation de droits fonciers informels (art. 2).", source: "https://www.gov.za/sites/default/files/gcis_document/201911/4286528-11act3of2019tradkhoisanleadership.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les gouvernements provinciaux doivent apporter un soutien administratif et financier aux conseils traditionnels (loi n° 3 de 2019, art. 23 (1)) ; le Premier fait ouvrir pour chaque conseil un compte qui reçoit les contributions volontaires des membres, les revenus des biens du conseil et les dons (art. 23 (3)). Aucun pouvoir d'imposition.", source: "https://www.gov.za/sites/default/files/gcis_document/201911/4286528-11act3of2019tradkhoisanleadership.pdf"}
  representation: {valeur: "partiel", note: "Une Chambre nationale et des chambres provinciales et locales des chefs traditionnels et khoi-san sont instituées (loi n° 3 de 2019, art. 26 ; Constitution, art. 212 (2)). Tout projet de loi qui touche directement les communautés traditionnelles ou le droit coutumier doit être soumis pour avis à la Chambre nationale avant son adoption (art. 39) ; ces chambres n'ont qu'un rôle consultatif.", source: "https://www.gov.za/sites/default/files/gcis_document/201911/4286528-11act3of2019tradkhoisanleadership.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Cour constitutionnelle a déclaré la loi n° 3 de 2019 invalide le 30 mai 2023 pour défaut de participation du public, avec effet suspendu (Mogale, [2023] ZACC 14) ; la suspension a été prolongée jusqu'au 29 mai 2027 et un nouveau projet de loi a été annoncé en février 2026. Une analyse publiée en 2024 relève que la loi lie les habitants à une communauté par leur lieu de résidence et ne précise pas qui doit être consulté avant un accord, en retrait de l'exigence de consentement de la loi de 1996 (Osman, African Human Rights Law Journal).", source: "https://www.ahrlj.up.ac.za/osman-f"}
chronologie:
  - {annee: 1996, evenement: "Constitution : reconnaissance du leadership traditionnel selon le droit coutumier (chap. 12) ; loi n° 31 sur la protection provisoire des droits fonciers informels."}
  - {annee: 2003, evenement: "Loi-cadre sur le leadership traditionnel et la gouvernance (Traditional Leadership and Governance Framework Act n° 41)."}
  - {annee: 2016, evenement: "Le Comité des droits de l'homme de l'ONU demande la révision du projet de loi sur le leadership traditionnel et khoi-san en consultation avec les communautés traditionnelles et autochtones."}
  - {annee: 2019, evenement: "Adoption de la loi n° 3 sur le leadership traditionnel et khoi-san."}
  - {annee: 2021, evenement: "Entrée en vigueur de la loi n° 3 de 2019 le 1er avril."}
  - {annee: 2023, evenement: "La Cour constitutionnelle déclare la loi n° 3 de 2019 invalide, avec effet suspendu pendant 24 mois ; publication de la loi n° 9 de 2022 sur les tribunaux traditionnels."}
  - {annee: 2025, evenement: "La Cour constitutionnelle prolonge la suspension jusqu'au 29 mai 2027."}
  - {annee: 2026, evenement: "Avis d'introduction au Parlement du projet de loi de 2026 sur le leadership traditionnel et khoi-san ; prorogation de la loi n° 31 de 1996 jusqu'au 31 décembre 2027."}
