resume: >-
  Fiche agrégée : elle couvre les communautés traditionnelles reconnues par l'Afrique du Sud, titulaires d'un conseil traditionnel sur une zone géographique délimitée. La Constitution de 1996 reconnaît l'institution, le statut et le rôle du leadership traditionnel selon le droit coutumier (art. 211). La loi sur le leadership traditionnel et khoi-san (Traditional and Khoi-San Leadership Act n° 3 de 2019), en vigueur depuis le 1er avril 2021, fixe les critères de reconnaissance d'une communauté par le Premier de la province (chef de l'exécutif provincial) et la composition des conseils traditionnels. La Cour constitutionnelle l'a déclarée invalide en 2023 pour défaut de participation du public, mais la déclaration est suspendue jusqu'au 29 mai 2027. Les communautés khoi-san, reconnues par la même loi sur une base d'appartenance déclarée, ne sont pas traitées ici.
