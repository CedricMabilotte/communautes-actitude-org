  - {instrument: "Loi sur l'usage des langues (votée en 2018, publiée au Journal officiel le 14 janvier 2019)", nature: "loi", annee: 2019, source: "https://www.venice.coe.int/webforms/documents/default.aspx?pdffile=CDL-AD(2019)033-e"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les lois touchant directement la culture, l'usage des langues, l'éducation, les documents personnels et les symboles exigent la majorité des députés présents et la majorité des députés présents appartenant aux communautés non majoritaires, amendement X (art. 69, 2001) ; même règle pour les lois sur les finances locales, les élections locales, les limites des municipalités et la Ville de Skopje, amendement XVI (art. 114). La loi sur le gouvernement local et toute révision du préambule ou des articles sur les droits des communautés exigent les deux tiers des députés, dont la majorité des députés de ces communautés, amendements XVI (art. 114) et XVIII (art. 131). Le vote est celui des députés de l'ensemble de ces communautés, sans consentement propre à chacune.", source: "https://www.constituteproject.org/constitution/Macedonia_2011"}
  langue: {valeur: "partiel", note: "Toute langue parlée par au moins 20 % de la population est langue officielle ; dans les unités de gouvernement local où une langue atteint 20 %, elle est officielle avec le macédonien, et en deçà les autorités locales décident ; les documents personnels sont aussi délivrés dans la langue officielle du citoyen, amendement V (art. 7, 2001). La loi sur l'usage des langues, en vigueur depuis le 15 janvier 2019, rend l'albanais officiel dans tous les organes de l'administration publique, impose la publication des lois en albanais et en macédonien, et prévoit des cartes d'identité et passeports bilingues d'office pour les locuteurs de l'albanais, au choix pour les autres communautés (cinquième avis du Comité consultatif, § 87). L'albanais est officiel dans tout l'État ; le turc, le romani, le serbe, le valaque et le bosniaque ne le sont que dans les unités où ils atteignent 20 % ou sur décision locale, d'où « partiel » pour l'ensemble des communautés.", source: "https://www.constituteproject.org/constitution/Macedonia_2011"}
  education: {valeur: "partiel", note: "Droit à l'enseignement dans sa langue dans le primaire et le secondaire, selon la loi, avec étude du macédonien ; droit de créer des institutions de culture, d'art, de science et d'éducation, amendement VIII (art. 48, 2001). Le système scolaire reste public et national ; selon le cinquième rapport de l'État (2020), l'enseignement est dispensé en macédonien, albanais, turc et serbe, le bosniaque à titre expérimental dans trois écoles depuis 2018-2019, et les langues et cultures rom, valaque et bosniaque sont des matières à option.", source: "https://www.constituteproject.org/constitution/Macedonia_2011"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Comité pour les relations entre les communautés de 19 membres : 7 Macédoniens, 7 Albanais, un Turc, un Valaque, un Rom, un Serbe et un Bosniaque ; l'Assemblée doit statuer sur ses propositions et il tranche les litiges sur l'application de la double majorité, amendement XII (art. 78, 2001). Double majorité pour l'élection du Défenseur du peuple (médiateur), de trois juges de la Cour constitutionnelle et de trois membres du Conseil judiciaire, amendements XI, XIV et XV ; représentation équitable des membres de toutes les communautés dans les organes publics, amendement VI (art. 8).", source: "https://www.constituteproject.org/constitution/Macedonia_2011"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2022, le Comité consultatif de la Convention-cadre constate un « écart » « considérable » entre les ambitions de la loi sur les langues et la situation concrète, un manque de traducteurs et de personnel bilingue, et un bilinguisme qui dépend de la volonté politique de chaque institution ou commune (§ 93) ; dans de nombreuses écoles, les élèves restent séparés par équipes du matin et de l'après-midi selon leur appartenance (§ 103). La Commission de Venise (2019) qualifie d'irréalistes certaines obligations de la loi, en particulier pour les tribunaux (§ 100). En 2025, le Comité des droits de l'homme relève que l'Agence pour la réalisation des droits des communautés manque de moyens et de personnel et que les minorités sont faiblement représentées dans les organes élus (CCPR/C/MKD/CO/4, § 49).", source: "https://rm.coe.int/5th-op-north-macedonia-fr/1680a82968"}
chronologie:
  - {annee: 1997, evenement: "Ratification de la Convention-cadre pour la protection des minorités nationales (10 avril)."}
  - {annee: 2001, evenement: "Signature de l'Accord-cadre à Skopje (13 août) ; résolution 1371 du Conseil de sécurité (26 septembre) ; publication des amendements constitutionnels (16 novembre)."}
  - {annee: 2008, evenement: "Première loi sur l'usage des langues (juillet)."}
  - {annee: 2018, evenement: "L'Assemblée vote la nouvelle loi sur l'usage des langues (11 janvier, puis 14 mars)."}
  - {annee: 2019, evenement: "Publication de la loi au Journal officiel sans la signature du président de la République (14 janvier) ; avis de la Commission de Venise (décembre)."}
  - {annee: 2021, evenement: "Recensement : 24,30 % d'Albanais, 3,86 % de Turcs, 2,53 % de Roms, 1,30 % de Serbes, 0,87 % de Bosniaques, 0,47 % de Valaques dans la population résidente."}
  - {annee: 2022, evenement: "Cinquième avis du Comité consultatif de la Convention-cadre (adopté le 18 mai)."}
  - {annee: 2025, evenement: "Observations finales du Comité des droits de l'homme sur le quatrième rapport (CCPR/C/MKD/CO/4)."}
fiabilite:
  verifie: ["Texte des amendements IV à XVIII (Constitute Project, version anglaise) : amendements V, VI, VIII, X, XI, XII, XIV, XV, XVI, XVIII.", "Date de signature (13 août 2001), signataires et date de publication des amendements (16 novembre 2001) : avis CDL-AD(2019)033 de la Commission de Venise, § 6-7 et note 2.", "Résolution 1371 (2001) du Conseil de sécurité, texte français.", "Chiffres du recensement de 2021 : tableaux T-02 et T-08 de l'Office d'État de la statistique.", "Cinquième avis du Comité consultatif (2022), § 87, 90, 93, 96, 103.", "Observations finales CCPR/C/MKD/CO/4 (2025), § 17 et 49-50.", "Dates de signature (25 juillet 1996) et de ratification (10 avril 1997) de la Convention-cadre : page Macédoine du Nord du Conseil de l'Europe."]
  non_confirme: ["Le nombre de 32 unités de gouvernement local est un calcul fondé sur l'appartenance déclarée, pas sur la langue parlée ; aucune liste officielle des municipalités où chaque langue est officielle n'a été trouvée (d'où l'absence de tableau). Le Comité consultatif indique que le turc est officiel dans 10 communes, dont 6 sous le seuil.", "Commissions pour les relations entre les communautés dans les municipalités et double majorité au conseil municipal (loi sur le gouvernement local de 2002) : texte de loi non consulté.", "Agence pour l'exercice des droits des communautés : loi de création et compétences non vérifiées sur le texte.", "Textes originaux de la loi de 2018 sur l'usage des langues non consultés ; contenu connu par l'avis de la Commission de Venise et du Comité consultatif."]
