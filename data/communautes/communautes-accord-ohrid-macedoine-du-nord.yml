uid: "communautes-accord-ohrid-macedoine-du-nord"
nom: "Communautés non majoritaires de Macédoine du Nord"
endonyme: "Заедници кои не се мнозинство / Bashkësitë që nuk janë shumicë"
territoire: "Macédoine du Nord entière ; usage officiel des langues dans les unités de gouvernement local où une langue atteint 20 % de la population"
etats: ["Macédoine du Nord"]
region: "europe"
coord: [41.6, 21.7]
type: "minorite_nationale"
base: "mixte"
types_secondaires: []
population: {valeur: 612242, annee: 2021, perimetre: "population résidente déclarant l'une des six communautés nommées au Comité pour les relations entre les communautés (recensement de 2021) : Albanais 446 245, Turcs 70 961, Roms 46 433, Serbes 23 847, Bosniaques 16 042, Valaques 8 714 ; les 17 990 « autres » ne sont pas comptés ; population résidente totale 1 836 713", source: "https://www.stat.gov.mk/xls/2022/2.1.22.10-mk-en.xlsx"}
lieux: {valeur: 32, unite: "unités de gouvernement local (sur 80 municipalités et la Ville de Skopje) où l'une des six communautés atteint 20 % de la population résidente selon l'appartenance déclarée en 2021 (calcul sur le tableau T-08 du recensement) ; le seuil constitutionnel porte sur la langue parlée, pas sur l'appartenance", annee: 2021, source: "https://www.stat.gov.mk/xls/2022/2.1.22.10-mk-en.xlsx"}
surface_km2: {valeur: 25436, annee: 2021, perimetre: "superficie de la Macédoine du Nord au 1er janvier 2021 (Office d'État de la statistique) ; le régime s'applique à l'ensemble du pays et n'a pas de territoire propre", source: "https://www.stat.gov.mk/OblastOpsto_en.aspx?id=1"}
villages: {valeur: 1749, annee: 2019, perimetre: "villages (sela) au sens de la loi sur l'organisation territoriale, ensemble du pays, au 1er juillet 2019 ; s'y ajoutent 34 villes, soit 1 783 localités (Office d'État de la statistique) ; la source ne distingue pas les villages habités des villages sans habitants", source: "https://www.stat.gov.mk/OblastOpsto_en.aspx?id=1"}
resume: >-
  L'Accord-cadre signé à Skopje le 13 août 2001, dit accord d'Ohrid, a mis fin aux affrontements armés entre les forces de l'État et des insurgés albanais. Les amendements constitutionnels publiés le 16 novembre 2001 donnent aux « communautés qui ne sont pas majoritaires » une double majorité (vote favorable exigé à la fois de l'Assemblée et des députés de ces communautés) pour les lois sur la culture, la langue, l'éducation, les documents personnels et les symboles, ainsi que pour les lois sur le gouvernement local. Ils créent un Comité pour les relations entre les communautés, où siègent Macédoniens, Albanais, Turcs, Valaques, Roms, Serbes et Bosniaques, et rendent officielle toute langue parlée par 20 % de la population, au niveau national ou municipal. La loi sur l'usage des langues, publiée en janvier 2019, étend l'usage de l'albanais dans les institutions de l'État.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Macédoine du Nord, adopté le 18 mai 2022 : la loi de 2018 sur l'usage des langues étend l'usage de l'albanais (§ 87) ; le turc est officiel dans 10 communes, dont six sous le seuil de 20 % par décision du conseil municipal, le valaque à Kruševo, le romani à Šuto Orizari (§ 96). Convention ratifiée le 10 avril 1997.", annee: 2022, source: "https://rm.coe.int/5th-op-north-macedonia-fr/1680a82968"}
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Résolution 1371 (2001) du Conseil de sécurité, 26 septembre 2001 : se félicite de la signature de l'Accord-cadre à Skopje le 13 août 2001 et appuie son application intégrale et rapide (§ 3) ; l'accord a été conclu en présence de l'Union européenne et des États-Unis, non sous l'égide de l'ONU.", annee: 2001, source: "https://documents.un.org/api/symbol/access?s=S/RES/1371(2001)&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur le quatrième rapport (CCPR/C/MKD/CO/4, 2025) : discrimination de la communauté rom (§ 17-18) ; droits des minorités, moyens de l'Agence pour la réalisation des droits des communautés et représentation dans les organes élus (§ 49-50, art. 25 et 27 du Pacte).", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/MKD/CO/4&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/MKD/CO/8-10, 2015) : communautés rom et albanaise nommées (§ 14-18).", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=CERD/C/MKD/CO/8-10&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Accord-cadre (accord d'Ohrid), signé à Skopje le 13 août 2001", nature: "accord_paix", annee: 2001, source: "https://www.venice.coe.int/webforms/documents/default.aspx?pdffile=CDL-AD(2019)033-e"}
  - {instrument: "Amendements IV à XVIII à la Constitution (Journal officiel du 16 novembre 2001) : art. 7, 8, 48, 69, 77, 78, 104, 109, 114, 131", nature: "constitution", annee: 2001, source: "https://www.constituteproject.org/constitution/Macedonia_2011"}
