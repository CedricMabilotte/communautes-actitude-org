  - {annee: 1954, evenement: "Mémorandum d'accord de Londres et son statut spécial pour les minorités."}
  - {annee: 1961, evenement: "Loi 1012 sur les écoles en langue d'enseignement slovène des provinces de Trieste et Gorizia."}
  - {annee: 1963, evenement: "Statut spécial de la région Frioul-Vénétie Julienne, art. 3."}
  - {annee: 1975, evenement: "Traité d'Osimo entre l'Italie et la Yougoslavie ; les mesures de protection du statut de 1954 restent en vigueur (loi 38/2001, art. 28)."}
  - {annee: 1997, evenement: "Ratification de la Convention-cadre pour la protection des minorités nationales."}
  - {annee: 1999, evenement: "Loi 482 sur la protection des minorités linguistiques historiques."}
  - {annee: 2001, evenement: "Loi 38 du 23 février 2001 sur la protection de la minorité linguistique slovène."}
  - {annee: 2007, evenement: "Décret présidentiel du 12 septembre : tableau des 32 communes ; loi régionale 26 du 16 novembre."}
fiabilite:
  verifie: ["Loi 38/2001, art. 1 à 29, texte publié par la Région Frioul-Vénétie Julienne.", "Décret présidentiel du 12 septembre 2007 et liste des communes, recueil bilingue de la Région (édition 2023).", "Loi régionale 26/2007, art. 6 et 8, même recueil.", "Ratification de la Convention-cadre le 3 novembre 1997 et six avis du Comité consultatif (Conseil de l'Europe) ; sixième avis du 11 février 2026, § 19, 43, 59, 63 et 73.", "Estimation d'environ 80 000 personnes et constat d'application incomplète (gouvernement slovène, 2021)."]
  non_confirme: ["Aucun document d'un organe de l'ONU nommant la minorité slovène d'Italie n'a été trouvé (CERD/C/ITA/CO/19-20 et CERD/C/ITA/CO/21 ne la nomment pas).", "Les cinq premiers avis du Comité consultatif n'ont pas été ouverts.", "Le chiffre de population est une estimation sans recensement ; la mise en œuvre de l'art. 26 dans les lois électorales nationales et le fonctionnement de l'Assemblée de la communauté linguistique slovène (loi régionale 26/2014, art. 21) ne sont pas vérifiés.", "Les organisations de référence (SSO et SKGZ) sont reconnues par la loi régionale comme organismes représentatifs de la minorité, sans pouvoirs publics ; elles ne sont pas comptées comme institutions propres.", "Nombre de villages ou localités habitées dans les 32 communes : non trouvé."]
