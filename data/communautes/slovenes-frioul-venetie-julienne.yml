  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le Comité institutionnel paritaire (20 membres dont 10 citoyens de langue slovène, loi 38/2001, art. 3) propose le tableau des communes (art. 4 et 25) et doit être entendu sur la répartition des crédits et plusieurs mesures d'application (art. 8, 22, 28) ; la loi régionale 26/2007, art. 8, crée une commission consultative régionale dont six membres sont désignés par les organisations de référence de la minorité ; il s'agit d'avis, sans droit de veto.", source: "https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/cultura-sport/patrimonio-culturale/comunita-linguistiche/FOGLIA25/allegati/La_normativa_di_tutela_degli_sloveni_in_Italia_2_ed._2023.pdf"}
  langue: {valeur: "partiel", note: "L'italien reste seule langue officielle ; la loi 38/2001, art. 8, reconnaît le droit d'utiliser le slovène devant les autorités administratives et judiciaires locales et d'obtenir réponse en slovène, avec documents bilingues sur demande dans les communes du tableau ; art. 9 : usage du slovène dans les assemblées élues ; art. 10 : signalisation et toponymie bilingues dans les lieux fixés par décret régional.", source: "https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/cultura-sport/patrimonio-culturale/comunita-linguistiche/FOGLIA25/allegati/Legge_38_del_2001_Sloveni.pdf"}
  education: {valeur: "reconnu", note: "Écoles publiques en langue d'enseignement slovène (lois 1012/1961 et 932/1973, maintenues par la loi 38/2001, art. 11) ; un bureau spécial de l'administration scolaire régionale gère leur personnel et une Commission scolaire régionale pour l'instruction en langue slovène est créée « afin de satisfaire les exigences d'autonomie de l'instruction en langue slovène » (art. 13) ; école bilingue de San Pietro al Natisone reconnue comme école d'État (art. 12).", source: "https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/cultura-sport/patrimonio-culturale/comunita-linguistiche/FOGLIA25/allegati/Legge_38_del_2001_Sloveni.pdf"}
  fiscalite: {valeur: "partiel", note: "L'État verse chaque année des crédits à un fonds inscrit au budget régional pour les institutions et associations de la minorité (loi 38/2001, art. 16) ; la Commission scolaire régionale gère un fonds pour le matériel didactique (art. 11, al. 5) ; aucun pouvoir fiscal.", source: "https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/cultura-sport/patrimonio-culturale/comunita-linguistiche/FOGLIA25/allegati/Legge_38_del_2001_Sloveni.pdf"}
  representation: {valeur: "partiel", note: "Les lois électorales du Sénat et de la Chambre des députés doivent « favoriser l'accès à la représentation » de candidats de la minorité slovène (loi 38/2001, art. 26) ; aucun siège réservé ; une assemblée des élus locaux de langue slovène nomme trois membres du Comité paritaire (art. 3).", source: "https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/cultura-sport/patrimonio-culturale/comunita-linguistiche/FOGLIA25/allegati/Legge_38_del_2001_Sloveni.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre relève en 2026 que, selon des représentants de la minorité slovène, plusieurs dispositions de la loi 38/2001, en particulier dans le domaine culturel, ne sont pas encore appliquées (§ 63), et invite les autorités à créer la section slovène du conservatoire de Trieste prévue par l'art. 15 (§ 73) ; le Comité paritaire n'est pas compétent pour les plaintes individuelles pour discrimination (§ 43). Le gouvernement slovène (2021) note que le slovène reste peu utilisé dans les procédures administratives et que la communauté n'a pas de représentation politique garantie.", source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-en/48802bdf6e"}
