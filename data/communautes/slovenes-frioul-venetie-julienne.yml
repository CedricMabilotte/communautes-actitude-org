resume: >-
  La minorité linguistique slovène vit dans les anciennes provinces de Trieste, Gorizia et Udine, dans la région à statut spécial du Frioul-Vénétie Julienne. La loi 38 du 23 février 2001 la reconnaît nommément et lui garantit l'usage du slovène devant les administrations et les autorités judiciaires locales, des écoles publiques en langue slovène dotées d'une administration propre, et un Comité institutionnel paritaire (organe composé pour moitié de membres de langue slovène). Le décret présidentiel du 12 septembre 2007 fixe les 32 communes où s'appliquent ces mesures. La loi régionale 26 du 16 novembre 2007 reconnaît des organisations de référence de la minorité et crée une commission consultative régionale. La Région autonome a sa propre fiche (« Frioul-Vénétie Julienne »).
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "L'Italie a ratifié la Convention-cadre pour la protection des minorités nationales le 3 novembre 1997 (loi 302 du 28 août 1997) ; la loi 38/2001, art. 2, s'y réfère pour la minorité slovène. Le Comité consultatif a adopté six avis sur l'Italie, de 2001 à 2026 ; le sixième (11 février 2026) relève que la loi 38/2001 garantit des droits culturels propres à la minorité slovène (§ 19 et 59).", annee: 1997, source: "https://www.coe.int/en/web/minorities/italy"}
