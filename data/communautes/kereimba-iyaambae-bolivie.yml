  - {instrument: "Statut de l'autonomie autochtone guarani Kereimba Iyaambae (déclaration constitutionnelle plurinationale 0062/2019 du 4 septembre 2019)", nature: "statut_autonomie", annee: 2020, source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le statut (art. 2, 5 et 16) crée le Gouvernement autonome guarani Kereimba Iyaambae, dont l'organe suprême est le Ñemboatiguasu (grande assemblée) de 145 autorités élues selon les normes et procédures propres, avec une instance technique exécutive (art. 20).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le statut (art. 17.I.3 et 18) fait du Ñemboatiguasu l'organe législatif qui adopte et abroge les lois autonomiques ; l'art. 55 énumère 23 compétences exclusives.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Constitution (art. 190) reconnaît la juridiction autochtone originaire paysanne ; le statut (art. 32 à 43) l'organise en trois niveaux (communauté, zone, Conseil de justice de sept membres) et pose l'égalité hiérarchique avec la juridiction ordinaire (art. 43).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  terres: {valeur: "partiel", note: "Le statut (art. 55.15, 100 et 101) confie à l'autonomie la planification de l'occupation territoriale, le plan d'usage des sols et la répartition interne de l'accès à la terre selon les normes propres, mais respecte les droits de propriété collectifs et individuels antérieurs ; aucun titre collectif sur l'ensemble du territoire n'est cité.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  ressources: {valeur: "partiel", note: "Le statut (art. 55.3) attribue la gestion des ressources naturelles renouvelables ; pour les hydrocarbures et les mines, il prévoit seulement un contrôle socio-environnemental concurrent avec l'État (art. 57.9) et exclut l'extraction dans les lieux sacrés (art. 94).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15) impose une consultation préalable obligatoire ; le statut (art. 44 à 52) définit la consultation comme un moyen d'obtenir le consentement préalable, libre et éclairé, mais en confie l'obligation à l'État (art. 45), l'autonomie étant entité d'accompagnement, de conseil et de coordination (art. 46 et 51).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5) fait du guarani une langue officielle de l'État ; le statut (art. 6) fait du guarani et du castillan les langues d'usage officiel dans la juridiction.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  education: {valeur: "partiel", note: "Le statut (art. 57.2, 112 et 113) fait de l'éducation une compétence concurrente exercée dans le cadre des lois de l'État, avec une politique fondée sur la proposition du Mboarakuaguasu (conseil éducatif guarani) et l'enseignement du guarani.", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  fiscalite: {valeur: "partiel", note: "Le statut (art. 17.I.18, 55.12 à 55.14, 71 et 74) permet de créer taxes, patentes et contributions, d'administrer les impôts de sa compétence, d'adopter son budget et crée un trésor propre ; ce pouvoir fiscal s'exerce « conformément à la loi » et les ressources comprennent les transferts du niveau central de l'État (art. 71.2).", source: "https://www.sea.gob.bo/wp-content/uploads/2021/09/EA-Guaran%C3%AD-Kereimba-Iyaambae.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les autorités du Ñemboatiguasu prennent leurs fonctions le 30 mars 2021 (Organe électoral plurinational) et une étude universitaire de 2021 décrit l'autonomie comme la cinquième AIOC en exercice en Bolivie. En mars 2023, la zone urbaine et paysanne n'a pas encore élu sa représentation (Organe électoral plurinational). Selon l'IPDRS (mai 2026), le Tribunal électoral départemental de Santa Cruz n'accrédite pas les nouvelles autorités élues (rapport TED 010/2025, recours du 26 mars 2025 non tranché) ; le renouvellement du Ñemboatiguasu est bloqué depuis deux ans et les bureaux du gouvernement sont bloqués par une faction depuis fin avril 2026 ; le 25 mai 2026, la Sala Constitucional Segunda de Santa Cruz rejette l'action populaire de cette faction et exhorte le Tribunal électoral à statuer.", source: "https://ipdrs.org/autonomia-guarani-kereimba-iyaambae-una-victoria-legal-en-medio-de-la-lucha-por-el-autogobierno/"}
chronologie:
  - {annee: 2009, evenement: "Les capitanías guaranies obtiennent le certificat d'ascendance ancestrale (2 août), préalable à la conversion de la commune."}
  - {annee: 2016, evenement: "Référendum de conversion de la commune de Gutiérrez en autonomie autochtone : 63,11 % de oui (20 novembre)."}
  - {annee: 2018, evenement: "Adoption du projet de statut par l'assemblée statutaire, dans la communauté de Kaaguasu (20 avril)."}
  - {annee: 2019, evenement: "Loi 1198 permettant l'approbation des statuts selon les normes et procédures propres (14 juillet)."}
  - {annee: 2019, evenement: "Déclarations constitutionnelles plurinationales 0027/2019 (24 avril) et 0062/2019 (4 septembre)."}
  - {annee: 2020, evenement: "Approbation du statut selon les normes et procédures propres, dans la communauté El Cruce, sous supervision de l'Organe électoral (11 septembre)."}
  - {annee: 2021, evenement: "Fin de la commune de Gutiérrez (19 mars) et entrée en fonction des autorités du Ñemboatiguasu (30 mars)."}
  - {annee: 2025, evenement: "Rapport TED 010/2025 du Tribunal électoral départemental de Santa Cruz exigeant des autorités élues les pièces demandées aux agents publics ; recours en révocation déposé le 26 mars."}
  - {annee: 2026, evenement: "La Sala Constitucional Segunda de Santa Cruz rejette une action populaire contre le gouvernement autonome et exhorte le Tribunal électoral départemental à statuer sur le recours (25 mai)."}
