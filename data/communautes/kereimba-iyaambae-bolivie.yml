resume: >-
  Kereimba Iyaambae est l'autonomie guarani constituée sur le territoire de l'ancienne commune de Gutiérrez, dans la province Cordillera (Santa Cruz). Elle relève du régime des autonomies autochtones originaires paysannes (AIOC, collectivités territoriales autochtones prévues par la Constitution de 2009). La conversion de la commune est approuvée par référendum le 20 novembre 2016 avec 63,11 % des voix ; le Tribunal constitutionnel plurinational déclare le statut conforme à la Constitution par les déclarations 0027/2019 (24 avril) et 0062/2019 (4 septembre) ; le statut est ensuite approuvé selon les normes et procédures propres le 11 septembre 2020. Le gouvernement repose sur une grande assemblée, le Ñemboatiguasu, formée d'autorités des capitanías Kaaguasu et Gran Kaipependi Karovaicho et de la zone urbaine et paysanne ; ses premiers membres prennent leurs fonctions le 30 mars 2021. En 2026, le renouvellement de l'assemblée est bloqué depuis environ deux ans faute d'accréditation des autorités élues par le Tribunal électoral départemental de Santa Cruz.
