  non_confirme: ["Surface du territoire : aucune source ouverte trouvée.", "Population : chiffre arrondi (« plus de 12 000 ») donné par une autorité guaranie, sans année de recensement précisée.", "Écart entre la date de fin de la commune (19 mars 2021, étude universitaire) et la date d'entrée en fonction (30 mars 2021, Organe électoral).", "Durée du premier mandat : cinq ans pour les Mburuvichaguasu selon l'Organe électoral (2021), trois ans selon l'IPDRS (2026).", "L'article de l'IPDRS est cosigné par l'avocat du gouvernement autonome dans l'action populaire.", "Existence de titres collectifs de terre (terres communautaires d'origine) au nom des capitanías."]
