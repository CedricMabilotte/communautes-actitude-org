resume: >-
  Fiche agrégée : elle couvre les comunas (communes rurales à propriété collective), communautés, peuples et nationalités dont l'aire a été déclarée aire protégée du sous-système communautaire du Système national d'aires protégées. La Constitution de 2008 (art. 405) crée ce sous-système à côté des sous-systèmes de l'État, des collectivités territoriales et des propriétaires privés ; le Code organique de l'environnement de 2017 (art. 45) confie à la communauté titulaire l'administration des activités prévues par le plan de gestion de l'aire, élaboré avec l'accompagnement de l'autorité environnementale nationale. La première aire, Tambillo (1 954,65 ha, canton de Gualaquiza, Morona Santiago), a été déclarée par l'accord ministériel 038 du 12 avril 2018 et est gérée par la coopérative de développement de la communauté de Jima (Azuay) ; la deuxième, celle de la comuna Marcos Pérez de Castilla (8 604,7 ha, cantons d'Oña, Azuay, et de Yacuambi, Zamora Chinchipe), a été déclarée par l'accord ministériel 036 publié au Registro Oficial (journal officiel) le 10 mai 2019. Le ministère de l'Environnement comptait deux aires protégées communautaires en 2022.
