  - {instrument: "Accord ministériel n° 038 du 12 avril 2018 portant déclaration de l'aire protégée communautaire Tambillo", nature: "loi", annee: 2018, source: "https://www.cbd.int/doc/world/ec/ec-nr-06-es.pdf"}
