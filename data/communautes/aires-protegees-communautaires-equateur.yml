  - {instrument: "Code organique de l'environnement (Código Orgánico del Ambiente), art. 37, 45 et 48 (Registro Oficial, supplément n° 983, 12 avril 2017 ; en vigueur douze mois après sa publication)", nature: "loi_organique", annee: 2017, source: "https://faolex.fao.org/docs/pdf/ecu167116.pdf"}
