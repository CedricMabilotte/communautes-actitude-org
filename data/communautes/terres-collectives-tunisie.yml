  autodetermination_externe: {valeur: "non_applicable", note: "Sans objet pour des groupements fonciers.", source: ""}
effectivite: {valeur: "partielle", note: "Étude de 2010, antérieure à la réforme de 2016 : environ 1 350 000 ha attribués à 100 000 exploitants (chiffre de 2002) et 600 000 ha de parcours soumis au régime forestier (gestion confiée à l'administration des forêts) ; à Tataouine, 35 conseils de gestion sans aucune femme, dont 17 sur 35 hors situation régulière, aucun issu d'un congrès légal, des membres qui ne connaissent que le partage des terres et la gestion des conflits, et des décisions prises par le président après consultation des autorités.", source: "https://www.foncier-developpement.fr/wp-content/uploads/tunisie-foncier-FR.pdf"}
chronologie:
  - {annee: 1901, evenement: "Décret beylical du 14 janvier 1901 sur la délimitation des terres collectives."}
  - {annee: 1935, evenement: "Décret du 30 décembre 1935 : personnalité civile et conseil de gestion élu en remplacement du conseil des notables (myaad)."}
  - {annee: 1964, evenement: "Loi n° 64-28 du 4 juin 1964 fixant le régime des terres collectives."}
  - {annee: 1965, evenement: "Décret n° 65-327 du 2 juillet 1965 : électorat et éligibilité ouverts à tout membre âgé de 20 ans."}
  - {annee: 1971, evenement: "Loi n° 71-7 du 14 janvier 1971 : attribution des terres collectives en propriété privée aux membres."}
  - {annee: 1988, evenement: "Loi n° 88-5 du 8 février 1988 modifiant la loi n° 64-28."}
  - {annee: 2016, evenement: "Adoption le 27 juillet du projet de loi n° 07/2016 (83 voix pour, 1 contre, 11 abstentions) : arbitrage par les conseils de gestion, conseils de tutelle régionaux, délai de cinq ans pour achever les attributions."}
