resume: >-
  En Tunisie, les terres collectives sont détenues en indivision par des collectivités, surtout dans le Centre et le Sud, où domine l'élevage pastoral.
  La loi n° 64-28 du 4 juin 1964 reconnaît à chaque collectivité la personnalité civile (capacité d'agir en droit) pour administrer et exploiter ses terres.
  Un conseil de gestion élu par les membres gère les terres, représente la collectivité en justice, arbitre les litiges fonciers entre membres et donne son accord préalable à toute vente ou location, sous la tutelle du gouverneur.
  Depuis 1971, le régime organise l'attribution des terres agricoles en propriété privée aux membres ; les parcours restent exploités en commun. La réforme adoptée en juillet 2016 fixe un délai de cinq ans pour achever les attributions.
