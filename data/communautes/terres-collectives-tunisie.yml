base_nationale:
  - {instrument: "Loi n° 64-28 du 4 juin 1964 fixant le régime des terres collectives", nature: "loi", annee: 1964, source: "https://arablandinitiative.gltn.net/countries/tunisia"}
  - {instrument: "Décret n° 65-327 du 2 juillet 1965 (application de la loi n° 64-28), modifié en 1981 et 1988", nature: "loi", annee: 1965, source: "https://www.foncier-developpement.fr/wp-content/uploads/tunisie-foncier-FR.pdf"}
  - {instrument: "Loi n° 71-7 du 14 janvier 1971, loi n° 79-27 du 11 mai 1979 et loi n° 88-5 du 8 février 1988 modifiant la loi n° 64-28", nature: "loi", annee: 1988, source: "https://www.foncier-developpement.fr/wp-content/uploads/tunisie-foncier-FR.pdf"}
  - {instrument: "Projet de loi n° 07/2016 amendant et complétant la loi n° 64-28, adopté par l'Assemblée des représentants du peuple le 27 juillet 2016", nature: "loi", annee: 2016, source: "https://majles.marsad.tn/fr/legislation/2016/07"}
droits:
  autogouvernement: {valeur: "partiel", note: "Art. 6 nouveau de la loi n° 64-28 (réforme de 2016) : les terres collectives sont gérées par des conseils de gestion élus parmi les membres de la collectivité qui exploitent la terre ; art. 7 et 8 nouveaux : tutelle du gouverneur et d'un conseil de tutelle régional qui approuve les décisions d'attribution et contrôle la gestion administrative et financière.", source: "https://majles.marsad.tn/fr/legislation/2016/07"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Art. 10 nouveau de la loi n° 64-28 (2016) : les litiges fonciers entre membres d'une même collectivité sont soumis obligatoirement à l'arbitrage du conseil de gestion, qui doit statuer dans un délai de trois mois, faute de quoi chaque partie peut saisir le tribunal immobilier ; art. 10 bis : la décision tranche le litige de façon définitive sauf opposition devant le tribunal immobilier.", source: "https://majles.marsad.tn/fr/legislation/2016/07"}
  terres: {valeur: "partiel", note: "Art. 4 de la loi n° 64-28 : chaque collectivité est une personne morale dotée de la personnalité civile pour l'administration et l'exploitation de ses terres ; art. 5 nouveau (2016) : vente, location ou apport en capital soumis à l'accord du conseil de gestion et à l'approbation du gouverneur, saisie interdite hors prêts autorisés ; art. 5 bis : expropriation pour utilité publique possible ; art. 16 nouveau : attribution en propriété privée aux membres des terres mises en valeur, et des terres nues aux membres résidant dans la région et exploitant la terre depuis au moins cinq ans ; les parcours restent exploités en commun.", source: "https://majles.marsad.tn/fr/legislation/2016/07"}
  ressources: {valeur: "partiel", note: "Art. 6 nouveau de la loi n° 64-28 (2016) : le conseil de gestion organise le pâturage et entretient les zones qui lui sont réservées ; art. 16 c : les terres de parcours sont exploitées en commun par les membres ; art. 8 : le conseil de tutelle régional délimite les parcours à exploiter collectivement.", source: "https://majles.marsad.tn/fr/legislation/2016/07"}
  consentement: {valeur: "partiel", note: "Art. 5 nouveau de la loi n° 64-28 (2016) : toute cession, location, bail à complant (mughârasa, contrat où l'exploitant plante et reçoit une part de la terre) ou apport en capital de terres collectives exige l'accord préalable du conseil de gestion et l'approbation du gouverneur, à peine de nullité ; l'art. 5 bis permet l'expropriation pour utilité publique sans cet accord.", source: "https://majles.marsad.tn/fr/legislation/2016/07"}
  langue: {valeur: "non_applicable", note: "Les collectivités titulaires sont des groupements fonciers, pas des communautés linguistiques.", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
