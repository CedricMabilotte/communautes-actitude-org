resume: >-
  Les Mongols sont l'une des nationalités minoritaires reconnues par la Chine. La Région autonome de Mongolie-Intérieure, créée en 1947, relève du système d'autonomie régionale des nationalités prévu par la Constitution (art. 4 et 112 à 122) et par la loi de 1984 modifiée en 2001. Le droit prévoit des organes d'autogouvernement, un pouvoir de réglementation soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale, la gestion des pâturages et l'usage des langues locales. La région n'a adopté aucun règlement d'autonomie : les travaux, commencés en 1980, sont suspendus depuis le vingtième projet de 1993. Depuis le 1er juillet 2026, la loi sur la promotion de l'unité et du progrès des nationalités fait du chinois standard la langue de base de l'enseignement. Les bannières autonomes de la région et les zones autonomes mongoles des autres provinces relèvent de la fiche « Préfectures et districts autonomes de Chine ».
