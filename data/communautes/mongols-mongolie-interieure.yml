reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/CHN/CO/14-17, § 45-46 : violations contre des Mongols manifestant contre la confiscation de terres, réduction de l'enseignement public en langue mongole ; § 26 : indemnisation insuffisante des éleveurs mongols réinstallés", annee: 2018, source: "https://docs.un.org/fr/CERD/C/CHN/CO/14-17"}
  - {mecanisme: "organe_traite", detail: "Comité des droits économiques, sociaux et culturels, E/C.12/CHN/CO/3, § 91 : recommande de protéger les pratiques religieuses des Tibétains, des Ouïghours, des Kazakhs, des Hui et des Mongols, notamment les sites religieux", annee: 2023, source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
base_nationale:
  - {instrument: "Constitution de la République populaire de Chine, art. 4 et 112 à 122", nature: "constitution", annee: 1982, source: "https://www.constituteproject.org/constitution/China_2018"}
  - {instrument: "Loi sur l'autonomie régionale des nationalités (1984, modifiée en 2001)", nature: "loi", annee: 2001, source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  - {instrument: "Loi sur la promotion de l'unité et du progrès des nationalités (adoptée le 12 mars 2026, en vigueur le 1er juillet 2026), art. 8, 15 et 16", nature: "loi", annee: 2026, source: "https://www.chinalawtranslate.com/en/ethnic-unity-and-progress-law/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organes d'autogouvernement (assemblée populaire et gouvernement de la région) ; le président de la région est un citoyen de la nationalité qui exerce l'autonomie (mongole), Constitution, art. 112 et 114 ; loi sur l'autonomie régionale, art. 16 et 17 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  pouvoir_normatif: {valeur: "conteste", note: "L'assemblée peut adopter des règlements d'autonomie soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale, loi sur l'autonomie régionale, art. 19 ; la Mongolie-Intérieure a rédigé vingt projets de 1980 à 1993, puis a suspendu les travaux sans en adopter aucun (Yang Feng, 2017).", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les organes d'autogouvernement définissent, conformément à la loi, la propriété et le droit d'usage des pâturages et des forêts, loi sur l'autonomie régionale, art. 27 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  ressources: {valeur: "partiel", note: "Gestion et protection des ressources naturelles et priorité d'exploitation dans le cadre des plans de l'État, loi sur l'autonomie régionale, art. 28 ; compensation due par l'État pour les ressources transférées hors de la région, art. 65 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  consentement: {valeur: "partiel", note: "La création d'une zone autonome, ses limites et son nom sont proposés après pleine consultation des représentants des nationalités concernées ; sa suppression, sa fusion ou la modification de ses limites exige la pleine consultation de ses organes d'autogouvernement, loi sur l'autonomie régionale, art. 14 (2001). Aucune obligation de consentement n'a été trouvée.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  langue: {valeur: "partiel", note: "Les organes d'autogouvernement utilisent les langues d'usage courant dans la localité, Constitution, art. 121 ; tribunaux et parquets utilisent la langue d'usage courant, loi sur l'autonomie régionale, art. 47 (2001). La loi sur la promotion de l'unité des nationalités (2026), art. 15, fait du chinois standard la langue officielle des organes de l'État et impose une version chinoise de tout document publié dans une langue minoritaire.", source: "https://www.chinalawtranslate.com/en/ethnic-unity-and-progress-law/"}
  education: {valeur: "conteste", note: "Les organes d'autogouvernement décident, selon les orientations de l'État, des programmes et de la langue d'enseignement, loi sur l'autonomie régionale, art. 36 et 37 (2001). La loi sur la promotion de l'unité des nationalités (2026), art. 15 et 16, fait du chinois standard la langue de base de l'enseignement et impose les manuels nationaux unifiés ; depuis septembre 2020, la langue et littérature, la morale et le droit, et l'histoire sont enseignés en chinois dans les écoles mongoles de la région (Human Rights Watch, 2020).", source: "https://www.chinalawtranslate.com/en/ethnic-unity-and-progress-law/"}
  fiscalite: {valeur: "partiel", note: "Les finances de la zone autonome forment un niveau propre ; les recettes qui lui reviennent sont gérées par les organes d'autogouvernement, loi sur l'autonomie régionale, art. 32 (2001) ; Constitution, art. 117.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  representation: {valeur: "partiel", note: "Constitution, art. 59 : toutes les nationalités minoritaires ont droit à une représentation appropriée à l'Assemblée populaire nationale ; le texte ne fixe pas de nombre de sièges.", source: "https://www.constituteproject.org/constitution/China_2018"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Human Rights Watch (2020) relève le passage au chinois de trois matières dans les écoles mongoles à partir de septembre 2020, le boycott scolaire qui a suivi, des arrestations de militants et la fermeture du réseau social en mongol Bainu. Le CERD (2018) relève des violations contre des Mongols qui manifestaient contre la confiscation de terres et une réduction sensible de l'enseignement public en langue mongole.", source: "https://www.hrw.org/news/2020/09/04/china-mongolian-mother-tongue-classes-curtailed"}
chronologie:
  - {annee: 1947, evenement: "Création du gouvernement autonome de Mongolie-Intérieure à Wangyemiao (aujourd'hui Ulanhot), le 1er mai."}
  - {annee: 1982, evenement: "La Constitution consacre l'autonomie régionale des nationalités."}
  - {annee: 1993, evenement: "Vingtième projet de règlement d'autonomie, puis suspension des travaux."}
  - {annee: 2001, evenement: "Révision de la loi sur l'autonomie régionale."}
  - {annee: 2018, evenement: "Observations du CERD sur les Mongols."}
  - {annee: 2020, evenement: "Trois matières passent à l'enseignement en chinois dans les écoles mongoles ; boycott scolaire et arrestations."}
  - {annee: 2023, evenement: "Le Comité des droits économiques, sociaux et culturels nomme les Mongols parmi les minorités dont les pratiques religieuses doivent être protégées."}
  - {annee: 2026, evenement: "Adoption de la loi sur la promotion de l'unité et du progrès des nationalités (12 mars), en vigueur le 1er juillet."}
