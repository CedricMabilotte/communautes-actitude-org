resume: >-
  Les peuples autochtones d'Alaska forment 229 entités autochtones reconnues par le gouvernement fédéral des États-Unis (liste fédérale de janvier 2026), qui comptent plus de 180 000 membres selon le Bureau des affaires indiennes (BIA). La loi de 1971 sur le règlement des revendications des autochtones d'Alaska (ANCSA) a éteint les titres ancestraux et transféré des terres à des sociétés autochtones régionales et de village, sans créer de réserves. Le gouvernement propre de ces entités repose sur la reconnaissance fédérale, que l'État d'Alaska a inscrite dans sa propre loi en 2022, et non sur l'ANCSA ; une loi fédérale de 2022 leur reconnaît une compétence pénale et civile sur les autochtones présents dans le village. La réserve d'Annette Island a sa propre fiche (« Communauté de Metlakatla (îles Annette) ») ; la chasse à la baleine et les quotas de pêche font l'objet des fiches « Villages baleiniers d'Alaska (AEWC) » et « Quotas de pêche communautaires de l'ouest de l'Alaska (CDQ) ».
