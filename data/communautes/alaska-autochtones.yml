  verifie: ["43 U.S.C. § 1601 (b), § 1606 (i), § 1611 (Cornell LII).", "Sommaire de l'arrêt Venetie (1998).", "Nombre de tribus et de membres (page BIA région Alaska).", "Liste fédérale 2024, section Alaska (Federal Register).", "§ 3, 58 à 63 et 80 du rapport du Rapporteur spécial (2012)."]
  non_confirme: ["Critère §0 : rempli par la reconnaissance fédérale des tribus comme gouvernements, non par l'ANCSA seule, qui exclut toute institution fondée sur la race ; ce choix de rattachement est discutable.", "Superficie totale transférée par l'ANCSA : non vérifiée sur le texte.", "Tribunaux tribaux d'Alaska et jurisprudence de la Cour suprême de l'Alaska (John c. Baker, 1999) : sources non consultées.", "Le chiffre de population est celui des membres inscrits des tribus relevant de la région Alaska du BIA (« plus de 180 000 »)."]
