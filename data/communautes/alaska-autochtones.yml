  - {instrument: "25 U.S.C. § 1305, compétence tribale en Alaska (loi de réautorisation de la loi sur les violences faites aux femmes, VAWA 2022)", nature: "loi", annee: 2022, source: "https://uscode.house.gov/view.xhtml?req=granuleid%3AUSC-prelim-title25-section1305&num=0&edition=prelim"}
