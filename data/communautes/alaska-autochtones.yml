  - {instrument: "Alaska c. Native Village of Venetie Tribal Government, 522 U.S. 520 (1998)", nature: "jurisprudence", annee: 1998, source: "https://www.law.cornell.edu/supremecourt/text/522/520"}
  - {instrument: "Décret présidentiel 13175 sur la consultation des gouvernements tribaux", nature: "loi", annee: 2000, source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "229 entités autochtones d'Alaska figurent sur la liste fédérale publiée le 30 janvier 2026, qui leur reconnaît, comme aux autres nations tribales, les immunités, privilèges et pouvoirs tirés de leur relation « de gouvernement à gouvernement » avec les États-Unis. Depuis l'arrêt Venetie (1998), les terres ANCSA ne sont pas un « pays indien » (Indian country, territoire où s'exerce la compétence tribale) : cette limite de compétence territoriale porte sur les terres et le pouvoir normatif, non sur l'existence du gouvernement.", source: "https://www.govinfo.gov/content/pkg/FR-2026-01-30/html/2026-01899.htm"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "25 U.S.C. § 1305 (VAWA 2022) reconnaît aux entités autochtones d'Alaska une compétence pénale et civile propre sur les autochtones présents dans le village, défini par la zone statistique de village du recensement ; un programme pilote permet au ministre de la Justice de désigner jusqu'à cinq entités par an, trente au total, pour juger des non-autochtones pour certaines infractions (violences domestiques et sexuelles).", source: "https://uscode.house.gov/view.xhtml?req=granuleid%3AUSC-prelim-title25-section1305&num=0&edition=prelim"}
  terres: {valeur: "partiel", note: "L'ANCSA (1971) transfère des terres à des sociétés de village (surface) et régionales, sans créer de système de réserves ni d'institution fondée sur la race, 43 U.S.C. § 1601 (b) et § 1611 ; ces terres appartiennent à des sociétés dont les autochtones sont actionnaires.", source: "https://www.law.cornell.edu/uscode/text/43/1601"}
  ressources: {valeur: "partiel", note: "Chaque société régionale reverse 70 % des revenus tirés du bois et du sous-sol qui lui ont été transférés, répartis entre les douze sociétés régionales, 43 U.S.C. § 1606 (i).", source: "https://www.law.cornell.edu/uscode/text/43/1606"}
  consentement: {valeur: "partiel", note: "Le décret présidentiel 13175 du 6 novembre 2000 impose une consultation « régulière et significative » des gouvernements tribaux sur les politiques fédérales qui les concernent ; il ne prévoit pas de consentement.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "conteste", note: "La Cour suprême juge en 1998 que les terres ANCSA de Venetie ne sont pas un « pays indien » et que le gouvernement du village ne peut y imposer une taxe aux non-membres (Alaska c. Native Village of Venetie Tribal Government).", source: "https://www.law.cornell.edu/supremecourt/text/522/520"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Pour l'essentiel, chaque entité et village autochtone reconnu détermine lui-même ses membres (Rapporteur spécial, A/HRC/21/47/Add.1, § 3, 2012).", source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon The Indigenous World 2026 (IWGIA, chapitre États-Unis, S. Braun), l'administration fédérale a retiré en 2025 l'avis juridique qui reconnaissait aux villages autochtones d'Alaska des pouvoirs sur les lotissements autochtones individuels, après deux recours de l'État d'Alaska et de riverains contre la salle de jeux du village d'Eklutna ; le Rapporteur spécial (2012, § 59 et 60) relevait déjà que la chasse et la pêche de subsistance relèvent d'un régime réglementaire dominé par l'État d'Alaska.", source: "https://iwgia.org/en/usa/6003-iw-2026-united-states-of-america.html"}
chronologie:
  - {annee: 1971, evenement: "Adoption de l'ANCSA : extinction des titres ancestraux et création des sociétés autochtones."}
  - {annee: 1998, evenement: "Arrêt Venetie : les terres ANCSA ne sont pas un « pays indien »."}
  - {annee: 2010, evenement: "Les États-Unis déclarent leur appui à la Déclaration des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2012, evenement: "Rapport du Rapporteur spécial sur les États-Unis, avec une section sur l'Alaska."}
  - {annee: 2022, evenement: "Loi fédérale VAWA 2022 : reconnaissance de la compétence tribale en Alaska (25 U.S.C. § 1305) ; loi de l'État d'Alaska HB 123 reconnaissant les entités autochtones (28 juillet)."}
  - {annee: 2023, evenement: "Lancement par le ministère de la Justice du programme pilote de compétence pénale sur les non-autochtones (20 octobre)."}
  - {annee: 2025, evenement: "Le 25 septembre, le ministère de l'Intérieur retire l'avis juridique de l'administration précédente sur la compétence tribale sur les lotissements autochtones."}
  - {annee: 2026, evenement: "Liste fédérale du 30 janvier : 575 entités reconnues, dont 229 en Alaska."}
fiabilite:
  verifie: ["43 U.S.C. § 1601 (b), § 1606 (i), § 1611 (Cornell LII).", "Sommaire de l'arrêt Venetie (1998).", "Nombre de membres (page BIA région Alaska).", "Liste fédérale du 30 janvier 2026 : 575 entités, 229 dans la section Alaska (Federal Register).", "25 U.S.C. § 1305 (uscode.house.gov) et communiqué du ministère de la Justice du 20 octobre 2023.", "Loi HB 123 de 2022 (communiqué du gouverneur d'Alaska).", "Surface transférée : 44 355 611 acres, 97 % des droits (BLM, mise à jour du 3 mars 2026).", "221 zones statistiques de villages autochtones d'Alaska (TIGERweb, recensement 2020).", "Retrait de l'avis juridique sur les lotissements (IWGIA 2026, Alaska Beacon 30 septembre 2025).", "§ 3, 58 à 63 et 80 du rapport du Rapporteur spécial (2012)."]
  non_confirme: ["Critère §0 : rempli par la reconnaissance fédérale des entités autochtones comme gouvernements et par 25 U.S.C. § 1305, non par l'ANCSA seule, qui exclut toute institution fondée sur la race.", "Entités désignées dans le programme pilote de compétence pénale sur les non-autochtones : non trouvé.", "Maintien en vigueur du décret présidentiel 13175 après 2025 : aucune source datée consultée ne le confirme ni ne l'infirme.", "Les 221 zones statistiques de villages ne correspondent pas une à une aux 229 entités reconnues : plusieurs entités peuvent partager une zone.", "Le chiffre de population est celui des membres inscrits des entités relevant de la région Alaska du BIA (« plus de 180 000 »), page non datée."]
