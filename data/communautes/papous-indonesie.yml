resume: >-
  Les Papous autochtones (Orang Asli Papua) vivent dans l'ouest de l'île de Nouvelle-Guinée, placé sous administration de l'ONU (UNTEA) en 1962-1963 puis rattaché à l'Indonésie. La loi 21/2001 sur l'autonomie spéciale crée une assemblée du peuple papou (MRP), représentation culturelle des Papous autochtones, réserve le poste de gouverneur à un Papou autochtone et reconnaît le droit coutumier sur les terres (hak ulayat) et une justice coutumière. La loi 2/2021 modifie ce régime : sièges nommés réservés aux Papous autochtones dans les assemblées locales, suppression des partis politiques locaux, prolongation des transferts financiers jusqu'en 2041.
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Accord de New York du 15 août 1962 entre l'Indonésie et les Pays-Bas, dont l'Assemblée générale prend acte (résolution 1752 (XVII)) ; l'Assemblée générale prend acte de l'« acte de libre choix » de 1969 (résolution 2504 (XXIV))", annee: 1962, source: "https://peacekeeping.un.org/sites/default/files/past/unsfbackgr.html"}
  - {mecanisme: "mission_onu", detail: "Autorité exécutive temporaire des Nations unies (UNTEA) et Force de sécurité des Nations unies (UNSF) en Nouvelle-Guinée occidentale, 1er octobre 1962 - 1er mai 1963", annee: 1962, source: "https://peacekeeping.un.org/sites/default/files/past/unsfbackgr.html"}
  - {mecanisme: "organe_traite", detail: "Comité des droits de l'homme, CCPR/C/IDN/CO/2, § 26, 38-39 et 44-45 : torture de Papous autochtones, abrogation de l'article 28 (1) de la loi spéciale sur l'autonomie de la Papouasie, reconnaissance des peuples autochtones", annee: 2024, source: "https://docs.un.org/fr/CCPR/C/IDN/CO/2"}
base_nationale:
  - {instrument: "Loi n° 21 de 2001 sur l'autonomie spéciale de la province de Papouasie", nature: "statut_autonomie", annee: 2001, source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  - {instrument: "Loi n° 2 de 2021 portant deuxième modification de la loi 21/2001", nature: "statut_autonomie", annee: 2021, source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  - {instrument: "Cour constitutionnelle, décision 47/PUU-XIX/2021 sur le recours de la MRP contre la loi 2/2021", nature: "jurisprudence", annee: 2022, source: "https://en.mkri.id/news/details/2022-09-01/Court%20Rejects%20MRP%E2%80%99s%20Petition%20on%20Papua%20Special%20Autonomy%20Law"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le gouverneur et le vice-gouverneur doivent être des Papous autochtones, loi 21/2001, art. 12 ; la MRP, composée de représentants coutumiers, religieux et de femmes papous, est la représentation culturelle des Papous autochtones, art. 5 et 19.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les Perdasus (règlements régionaux spéciaux) sont adoptés par l'assemblée provinciale et le gouverneur avec l'avis et l'accord de la MRP, loi 21/2001, art. 20 (1) (c) et 29.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  justice_propre: {valeur: "reconnu", note: "Tribunaux coutumiers (peradilan adat) compétents pour les litiges civils coutumiers et les affaires pénales entre membres d'une communauté de droit coutumier, avec recours possible devant les juridictions de l'État, loi 21/2001, art. 50 (2) et 51.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  terres: {valeur: "partiel", note: "Le droit coutumier sur les terres (hak ulayat) est reconnu et exercé par les autorités coutumières « tant qu'il existe dans les faits », en respectant les droits acquis légalement par des tiers, loi 21/2001, art. 43 (1) à (3).", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  ressources: {valeur: "partiel", note: "Parts de 80 % des recettes forestières, halieutiques et minières générales et de 70 % des recettes pétrolières et gazières jusqu'en 2041, puis 50 % à partir de 2042, loi 21/2001, art. 34, modifié par la loi 2/2021.", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  consentement: {valeur: "partiel", note: "La mise à disposition de terres coutumières passe par une délibération avec la communauté pour obtenir son accord, loi 21/2001, art. 43 (4) ; la division de la province requiert l'accord de la MRP et de l'assemblée provinciale, mais l'État peut y procéder seul depuis la loi 2/2021, art. 76 (1) et (2).", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La province est responsable de l'éducation à tous les niveaux dans le cadre des normes nationales, et les langues régionales peuvent servir de langue d'enseignement au primaire, loi 21/2001, art. 56 et 58 (3).", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  fiscalite: {valeur: "reconnu", note: "Recette spéciale d'autonomie égale à 2,25 % du fonds général national d'allocation, dont une part est affectée au bien-être des Papous autochtones et aux institutions coutumières, loi 21/2001, art. 34, modifié par la loi 2/2021.", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  representation: {valeur: "partiel", note: "Des membres nommés parmi les Papous autochtones, en nombre égal au quart des élus, siègent dans l'assemblée provinciale (DPRP) et les assemblées de district (DPRK), loi 2/2021, art. 6 et 6A ; aucun siège réservé au niveau national n'a été trouvé.", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  statut_personnel: {valeur: "partiel", note: "Statut légal d'Orang Asli Papua (Papou autochtone) défini par l'origine ou l'acceptation par une communauté coutumière, condition d'accès au poste de gouverneur et à la MRP, loi 21/2001, art. 1, 12 et 19.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "En 2024, le Comité des droits de l'homme relève des cas systématiques de torture de Papous autochtones, le refus d'enregistrer le Parti papou uni et l'abrogation en 2021 du droit de créer des partis locaux ; en 2022, la Cour constitutionnelle rejette l'essentiel du recours de la MRP contre la loi 2/2021.", source: "https://docs.un.org/fr/CCPR/C/IDN/CO/2"}
chronologie:
  - {annee: 1962, evenement: "Accord de New York du 15 août ; administration temporaire de l'ONU (UNTEA) à partir du 1er octobre."}
  - {annee: 1963, evenement: "Transfert de l'administration à l'Indonésie le 1er mai."}
  - {annee: 1969, evenement: "« Acte de libre choix » par des conseils représentatifs de 1 026 membres ; l'Assemblée générale en prend acte (résolution 2504 (XXIV))."}
  - {annee: 2001, evenement: "Loi 21/2001 sur l'autonomie spéciale de la Papouasie, promulguée le 21 novembre."}
  - {annee: 2021, evenement: "Loi 2/2021 modifiant le régime d'autonomie spéciale."}
  - {annee: 2022, evenement: "La Cour constitutionnelle rejette l'essentiel du recours de la MRP (décision 47/PUU-XIX/2021)."}
fiabilite:
  verifie: ["Articles 1, 5, 12, 19, 20, 29, 43, 50, 51, 56 et 58 de la loi 21/2001 (texte indonésien, JDIH du ministère des Finances).", "Articles 6, 6A, 28, 34, 68A et 76 dans la version de la loi 2/2021.", "Accord de 1962, UNTEA et résolution 2504 (XXIV) (page historique des opérations de maintien de la paix de l'ONU).", "CCPR/C/IDN/CO/2 (2024).", "Décision 47/PUU-XIX/2021 (communiqué de la Cour constitutionnelle)."]
  non_confirme: ["Création en 2022 de nouvelles provinces en Papouasie : non vérifiée sur les lois de création.", "Population des Papous autochtones : pas de chiffre officiel consulté.", "L'Indonésie ne reconnaît pas de peuples autochtones au sens du droit international (CCPR/C/IDN/CO/2, § 44) ; la loi emploie les termes « Orang Asli Papua » et « masyarakat hukum adat » (communautés de droit coutumier)."]
