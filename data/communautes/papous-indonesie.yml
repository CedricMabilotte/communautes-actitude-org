resume: >-
  Les Papous autochtones (Orang Asli Papua) vivent dans l'ouest de l'île de Nouvelle-Guinée, placé sous administration de l'ONU (UNTEA) en 1962-1963 puis rattaché à l'Indonésie. La loi 21/2001 sur l'autonomie spéciale crée une assemblée du peuple papou (MRP), représentation culturelle des Papous autochtones, réserve le poste de gouverneur à un Papou autochtone et reconnaît le droit coutumier sur les terres (hak ulayat) et une justice coutumière. La loi 2/2021 modifie ce régime : sièges nommés réservés aux Papous autochtones dans les assemblées locales, suppression des partis politiques locaux, prolongation des transferts financiers jusqu'en 2041, création de provinces possible sans l'accord de la MRP. Depuis 2022, la région compte six provinces, chacune dotée de sa MRP. Les forêts coutumières, territoires coutumiers et espaces côtiers coutumiers reconnus en Papouasie au titre des régimes nationaux figurent aussi dans les fiches « Forêts coutumières d'Indonésie », « Territoires coutumiers d'Indonésie » et « Espaces côtiers coutumiers d'Indonésie ».
reconnaissance_onu:
