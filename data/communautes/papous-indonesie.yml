droits:
  autogouvernement: {valeur: "reconnu", note: "Le gouverneur et le vice-gouverneur doivent être des Papous autochtones, loi 21/2001, art. 12, disposition maintenue par la Cour constitutionnelle (décision 93/PUU-XXII/2024) ; la MRP, composée pour un tiers chacun de représentants coutumiers, religieux et de femmes papous, est la représentation culturelle des Papous autochtones et siège dans chaque capitale provinciale, art. 5 et 19 (art. 5 dans la version de la loi 2/2021).", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les Perdasus (règlements régionaux spéciaux) sont adoptés par l'assemblée provinciale et le gouverneur avec l'avis et l'accord de la MRP, loi 21/2001, art. 29 (1), et art. 20 (1) (b) dans la version de la loi 2/2021 ; le Perdasus est un règlement régional de province pris pour l'application de certains articles de la loi 21/2001 (art. 1, point i), d'où « partiel ».", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  justice_propre: {valeur: "reconnu", note: "Tribunaux coutumiers (peradilan adat), composés selon le droit coutumier de la communauté concernée, compétents pour les litiges civils coutumiers et les affaires pénales entre membres d'une communauté de droit coutumier, avec recours possible devant les juridictions de l'État, loi 21/2001, art. 50 (2) et 51.", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  terres: {valeur: "partiel", note: "Le droit coutumier sur les terres (hak ulayat) est reconnu et exercé par les autorités coutumières « tant qu'il existe dans les faits », en respectant les droits acquis légalement par des tiers, loi 21/2001, art. 43 (1) à (3).", source: "https://jdih.kemenkeu.go.id/api/download/fulltext/2001/21TAHUN2001UU.htm"}
  ressources: {valeur: "partiel", note: "La province et les districts reçoivent 80 % des recettes forestières, halieutiques et minières générales et, jusqu'en 2041, 70 % des recettes pétrolières et gazières, ramenées à 50 % à partir de 2042, loi 21/2001, art. 34 (3) (b), (5) et (6), dans la version de la loi 2/2021.", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  consentement: {valeur: "partiel", note: "La mise à disposition de terres coutumières passe par une délibération avec la communauté pour obtenir son accord, loi 21/2001, art. 43 (4) ; la division d'une province requiert l'accord de la MRP et de l'assemblée provinciale, mais le gouvernement et le Parlement national peuvent y procéder seuls depuis la loi 2/2021, art. 76 (1) et (2).", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La province et les districts organisent l'éducation selon leurs compétences dans le cadre des normes nationales, et l'État et les collectivités doivent financer l'éducation des Papous autochtones jusqu'à l'enseignement supérieur, loi 21/2001, art. 56 (1) et (6) dans la version de la loi 2/2021 ; les langues régionales peuvent servir de langue d'enseignement au primaire, art. 58 (3).", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  fiscalite: {valeur: "partiel", note: "Recette spéciale d'autonomie égale à 2,25 % du fonds général national d'allocation jusqu'en 2041, dont une part de 1 % est affectée notamment au bien-être des Papous autochtones et aux institutions coutumières, loi 21/2001, art. 34 (3) (e) et (8), dans la version de la loi 2/2021 ; il s'agit d'une allocation fixée par la loi de l'État, sans système fiscal propre, d'où « partiel ».", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  representation: {valeur: "partiel", note: "Des membres nommés parmi les Papous autochtones, en nombre égal au quart des élus, siègent dans l'assemblée provinciale (DPRP) et les assemblées de district (DPRK), loi 2/2021, art. 6 et 6A ; aucun siège réservé au niveau national n'a été trouvé.", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  statut_personnel: {valeur: "partiel", note: "Statut légal d'Orang Asli Papua (Papou autochtone) défini par l'appartenance aux groupes autochtones de Papouasie ou l'acceptation par la communauté coutumière papoue, condition d'accès au poste de gouverneur et à la MRP, loi 21/2001, art. 1 (22 dans la version de la loi 2/2021), 12 et 19.", source: "https://jdih.kemenkeu.go.id/api/download/2afb571f-3a55-4e0f-bf22-dff08f3cf697/2TAHUN2021UU.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Selon l'IWGIA (Indigenous World 2025, chapitre Indonésie), le projet stratégique national d'agriculture de Merauke (Papua Selatan), sur environ deux millions d'hectares, est mené sans consentement préalable des peuples concernés, avec déplacements forcés et militarisation, et le conflit armé a déplacé 76 228 civils entre 2018 et 2023 ; en 2024, le Comité des droits de l'homme relève des cas systématiques de torture de Papous autochtones et le refus d'enregistrer le Parti papou uni (CCPR/C/IDN/CO/2, § 26 et 38).", source: "https://www.iwgia.org/images/publications/indigenous-world/indigenous-world-2025.pdf"}
chronologie:
  - {annee: 1962, evenement: "Accord de New York du 15 août ; administration temporaire de l'ONU (UNTEA) à partir du 1er octobre."}
  - {annee: 1963, evenement: "Transfert de l'administration à l'Indonésie le 1er mai."}
  - {annee: 1969, evenement: "« Acte de libre choix » par des conseils représentatifs de 1 026 membres ; résolution 2504 (XXIV) de l'Assemblée générale."}
  - {annee: 2001, evenement: "Loi 21/2001 sur l'autonomie spéciale de la Papouasie, promulguée le 21 novembre."}
  - {annee: 2004, evenement: "La Cour constitutionnelle déclare contraire à la Constitution la loi 45/1999 de division de la Papouasie, tout en maintenant la province d'Irian Jaya occidental."}
  - {annee: 2008, evenement: "Loi 35/2008 : l'autonomie spéciale s'applique à la province de Papua Barat."}
  - {annee: 2021, evenement: "Loi 2/2021 modifiant le régime d'autonomie spéciale (19 juillet)."}
  - {annee: 2022, evenement: "La Cour constitutionnelle déclare en partie irrecevable et rejette pour le reste le recours de la MRP contre la loi 2/2021 (décision 47/PUU-XIX/2021, 31 août) ; création des provinces de Papua Selatan, Papua Tengah et Papua Pegunungan (lois 14, 15 et 16/2022, 25 juillet) et de Papua Barat Daya (loi 29/2022, 8 décembre)."}
  - {annee: 2024, evenement: "La Cour constitutionnelle rejette un recours contre l'exigence d'un gouverneur papou autochtone (décision 93/PUU-XXII/2024, 20 août)."}
  - {annee: 2026, evenement: "La Cour constitutionnelle déclare irrecevable un recours sur le nombre de sièges réservés aux Papous autochtones dans les assemblées provinciales (décision 230/PUU-XXIII/2025, 19 janvier 2026)."}
fiabilite:
  verifie: ["Articles 1, 5, 12, 19, 29, 43, 50, 51 et 58 de la loi 21/2001 (texte indonésien, JDIH du ministère des Finances).", "Articles 1, 5, 6, 6A, 20, 28, 34, 56, 68A et 76 dans la version de la loi 2/2021.", "Accord de 1962, résolution 1752 (XVII), UNTEA, acte de libre choix et résolution 2504 (XXIV) (page historique des opérations de maintien de la paix de l'ONU).", "CCPR/C/IDN/CO/2 (2024), § 26, 38-39 et 44-45.", "Décision 47/PUU-XIX/2021 (communiqué de la Cour constitutionnelle) ; décisions 93/PUU-XXII/2024 et 230/PUU-XXIII/2025 (Pasal.id).", "Lois 14, 15, 16 et 29/2022 créant quatre provinces, chacune avec sa MRP (Pasal.id).", "Nombre de villages, superficie, population et nombre de provinces : arrêté du ministre de l'Intérieur 300.2.2-2430 de 2025, annexe A (lecture du tableau scanné).", "IWGIA, Indigenous World 2025, chapitre Indonésie."]
  non_confirme: ["Nombre de Papous autochtones : aucune donnée valide depuis la division en six provinces selon l'IWGIA (2025) ; la population indiquée compte tous les résidents.", "L'Indonésie ne reconnaît pas de peuples autochtones au sens du droit international (CCPR/C/IDN/CO/2, § 44) ; la loi emploie les termes « Orang Asli Papua » et « masyarakat hukum adat » (communautés de droit coutumier).", "Écart entre la population de l'état civil (5,7 millions, décembre 2024) et celle de l'office statistique citée par l'IWGIA (6,2 millions, 2024) : non résolu."]
