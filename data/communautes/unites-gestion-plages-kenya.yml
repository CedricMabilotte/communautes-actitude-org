resume: >-
  Fiche agrégée : elle couvre les communautés de pêche organisées en unités de gestion des plages (Beach Management Units, BMU). Le règlement de 2007 sur les BMU (Legal Notice n° 402 de 2007, pris en application de la loi sur les pêches, chap. 378) définit la BMU comme une organisation des pêcheurs, mareyeurs, propriétaires de bateaux, transformateurs et autres usagers de la plage qui dépendent traditionnellement de la pêche. Chaque BMU, établie par avis au Journal officiel (Kenya Gazette), a une assemblée et un comité exécutif élus, édicte des règlements internes (by-laws) et gère une aire de cogestion avec l'administration des pêches, où un plan de cogestion peut fermer des zones à la pêche. La loi de 2016 sur la gestion et le développement des pêches (Fisheries Management and Development Act) vise les BMU « établies par les gouvernements de comté » et autorise le ministre à fixer par règlement les normes de leur gestion (art. 37). Sur la côte, des communautés ont utilisé ce cadre pour créer des aires fermées à la pêche, appelées « tengefu » en swahili ; 14 aires marines gérées localement couvraient 109,6 km² en 2014.
