base_nationale:
  - {instrument: "Fisheries (Beach Management Unit) Regulations (règlement sur les unités de gestion des plages), Legal Notice n° 402 de 2007, pris en application de la loi sur les pêches (chap. 378), règles 2 à 34", nature: "loi", annee: 2007, source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
  - {instrument: "Fisheries Management and Development Act (loi sur la gestion et le développement des pêches) n° 35 de 2016, art. 2, 21, 29, 37 et 64, première annexe partie D ; sanction le 3 septembre 2016, en vigueur le 23 septembre 2016", nature: "loi", annee: 2016, source: "https://new.kenyalaw.org/akn/ke/act/2016/35/eng@2022-12-31"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque BMU comprend une assemblée des membres et un comité exécutif de 9 à 15 membres élus au scrutin secret (règles 4, 14 et 15 du règlement de 2007) ; l'assemblée adopte le budget, les plans de gestion et les règlements internes et peut révoquer les élus, décision confirmée par écrit par l'agent des pêches (règles 20 et 23). Le directeur des Pêches ou un agent habilité peut suspendre le comité et nommer un comité intérimaire (règles 21 et 33), et le ministre peut dissoudre la BMU par avis au Journal officiel (règle 34).", source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La BMU édicte des règlements internes (by-laws) obligatoires pour ses membres et pour toute personne présente sur la plage ou qui l'utilise (règle 5 (6) du règlement de 2007) ; elle met en œuvre le plan de cogestion par ces règlements (règle 7 (7)) et peut y inclure la protection du milieu aquatique (règle 8). Tout règlement nouveau ou modifié est soumis au directeur des Pêches, qui peut le suspendre s'il est contraire à la loi ou aux objectifs de la BMU ; il est réputé approuvé sans réponse sous 21 jours (règle 23 (3) et (4)).", source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La BMU a juridiction sur la plage du site de débarquement, dont l'administration fait relever et borner les limites (règle 5 (1) et (2) du règlement de 2007) ; ses règlements internes peuvent réserver certaines activités sur la plage à ses membres (règles 5 (7) et 9 (2)). Le règlement ne confère pas de propriété sur la plage.", source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
  ressources: {valeur: "partiel", note: "L'agent des pêches désigne pour chaque BMU une aire de cogestion où elle gère la pêche avec le directeur des Pêches ; le plan de cogestion, convenu entre l'agent et la BMU et approuvé par le directeur, peut fermer des zones ou des saisons, restreindre les engins et limiter le nombre de licences (règle 7 du règlement de 2007) ; aucune licence liée à une plage n'est délivrée à une personne qui n'est pas membre ou membre provisoire de la BMU (règle 11 (7)). L'agent des pêches peut suspendre ou annuler un plan de cogestion mal appliqué (règle 7 (11)). Les ressources halieutiques appartiennent à l'État, sous réserve des usages coutumiers des communautés (art. 29 de la loi de 2016).", source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
  consentement: {valeur: "partiel", note: "L'aire de cogestion est désignée « à la suite d'un processus consultatif » et le plan de cogestion est élaboré avec les BMU concernées puis approuvé par leur assemblée (règles 7 (1), 7 (4) et 23 (1) (b) du règlement de 2007). La loi de 2016 interdit de priver une communauté locale de son accès traditionnel aux zones de pêche par l'aquaculture sans l'avoir consultée (art. 64).", source: "https://new.kenyalaw.org/akn/ke/act/2016/35/eng@2022-12-31"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Avec l'accord écrit préalable du directeur des Pêches, la BMU prélève sur ses membres et les autres usagers de la plage des droits d'adhésion, d'immatriculation des bateaux, de débarquement, de commercialisation et d'usage des installations (règle 28 du règlement de 2007) ; elle tient un compte bancaire et des comptes annuels déposés auprès du directeur (règles 29 et 30).", source: "https://faolex.fao.org/docs/pdf/ken101510.pdf"}
  representation: {valeur: "partiel", note: "Un représentant des BMU est membre permanent de l'unité interinstitutionnelle de suivi, contrôle et surveillance des pêches, présidée par le directeur général des Pêches (art. 21 et première annexe, partie D, de la loi de 2016).", source: "https://faolex.fao.org/docs/pdf/ken160880.pdf"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de 2013 sur les BMU de Shimoni, Wasini et Kibuyuni relève que les redevances sur les débarquements ne sont pas perçues, que les amendes prévues par les règlements internes ne sont pas appliquées et que les patrouilles manquent de moyens. En 2014, Rocliffe et al. notent que nombre des quelque 60 BMU de la côte n'existent que de nom, sans limites de juridiction ni règlements internes. Une mission de Wageningen Marine Research en 2017 rapporte que certaines BMU visitées limitent leur rôle à l'organisation du site de débarquement ; une note de 2017 de Fauna & Flora International et de l'East African Wild Life Society relève le manque de moyens des comtés pour appuyer les BMU.", source: "https://edepot.wur.nl/413271"}
chronologie:
  - {annee: 2005, evenement: "Fauna & Flora International et l'East African Wild Life Society commencent à appuyer la gestion des ressources marines de dix communautés de la côte sud."}
  - {annee: 2006, evenement: "Les habitants de Kuruwitu désignent une zone fermée à la pêche de 0,29 km², première aire marine gérée localement du Kenya."}
  - {annee: 2007, evenement: "Règlement sur les unités de gestion des plages (Legal Notice n° 402) : BMU, aires de cogestion et plans de cogestion."}
  - {annee: 2013, evenement: "Étude du Mwambao Coastal Community Network sur les BMU de Shimoni, Wasini et Kibuyuni : aire de cogestion désignée pour chacune des trois BMU, aire fermée (« maeneo tengefu ») en préparation à Shimoni."}
  - {annee: 2014, evenement: "Enquête-cadre de la pêche artisanale marine : 197 sites de débarquement et 12 915 pêcheurs ; 14 aires marines gérées localement opérationnelles sur 109,6 km²."}
  - {annee: 2016, evenement: "Loi sur la gestion et le développement des pêches, en vigueur le 23 septembre : abrogation de la loi sur les pêches (chap. 378) ; l'art. 37 confie l'établissement des BMU aux comtés."}
  - {annee: 2017, evenement: "Note de Fauna & Flora International et de l'East African Wild Life Society : dix communautés de la côte sud ont désigné des aires conservées par la communauté au moyen de leur BMU."}
fiabilite:
  verifie: ["Texte des règles 2 à 37 du règlement de 2007 (Legal Notice n° 402), version révisée de 2012 hébergée par FAOLEX.", "Art. 2, 21, 29, 37, 64 et 210 de la loi de 2016, première annexe partie D, dates de sanction et d'entrée en vigueur (texte FAOLEX et Kenya Law).", "14 aires marines gérées localement opérationnelles sur 109,6 km² et aire de Kuruwitu (2006, 0,29 km²) : Rocliffe et al., PLoS ONE, 2014.", "197 sites de débarquement et 12 915 pêcheurs sur la côte en 2014 : rapport de Wageningen Marine Research (2017) citant l'enquête-cadre de 2014.", "Barème d'amendes des règlements internes de Shimoni, Wasini et Kibuyuni et non-application des amendes et redevances : étude Mwambao (2013).", "Dix communautés de la côte sud ayant désigné des aires conservées par la communauté au moyen de leur BMU : note FFI et EAWLS (2017)."]
  non_confirme: ["Maintien en vigueur du règlement de 2007 après l'abrogation de la loi sur les pêches (chap. 378) par la loi de 2016 : aucune disposition de la loi de 2016 ne le prévoit expressément ; adoption d'un nouveau règlement sur les BMU au titre de l'art. 37 non vérifiée.", "Nombre de BMU constituées au Kenya (côte et eaux intérieures) et nombre d'aires de cogestion désignées : aucun chiffre officiel trouvé ; Rocliffe et al. (2014) indiquent environ 60 BMU sur la côte en citant une source secondaire.", "Aucune liste officielle des BMU ou des aires de cogestion n'a été trouvée : pas de tableau des sites.", "L'expression « tengefu » est employée par les études citées ; elle n'apparaît ni dans le règlement de 2007 ni dans la loi de 2016.", "L'article de Kawaka et al. (2017), cité par la note FFI pour 19 aires conservées par la communauté, n'a pas été consulté directement.", "Aucun document onusien (rapport national à la CDB, organe de traité) visant les BMU n'a été trouvé ; le sixième rapport national à la CDB ne les mentionne que dans la liste des sigles."]
