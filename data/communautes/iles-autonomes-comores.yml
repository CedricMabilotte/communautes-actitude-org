resume: >-
  L'Union des Comores est formée de trois îles autonomes, Ngazidja, Ndzuwani et Mwali, auxquelles la Constitution ajoute Maoré (Mayotte), restée sous administration française. Ce régime est issu de la crise ouverte en 1997 par la sécession d'Anjouan et de Mohéli, et des accords de Fomboni de 2000-2001, qui ont conduit à la Constitution du 23 décembre 2001. Dans sa version révisée en 2009, 2013 et 2018, chaque île a la personnalité juridique (capacité d'agir en droit), s'administre librement et dispose d'un gouverneur élu au suffrage universel direct, qui prend des arrêtés dans des compétences exclusives (aménagement, tourisme, pêche artisanale, agriculture, voirie, foires et marchés). Son budget doit être approuvé par l'État, et le conseil consultatif de l'île réunit un représentant par conseil communal.
