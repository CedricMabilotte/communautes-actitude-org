resume: >-
  Fiche agrégée : elle couvre les communaux d'État (statsallmenninger, terres dont l'État est propriétaire et sur lesquelles les habitants des vallées voisines détiennent des droits d'usage) du sud et du centre de la Norvège, soit 26,6 millions de décares (environ 26 600 km²) répartis dans 73 communes et 9 comtés. La loi sur les montagnes (fjellova) du 6 juin 1975 n° 31 confie l'administration des droits d'usage liés à l'agriculture (pâturage, alpage) et des droits de chasse, de piégeage et de pêche à un conseil de montagne (fjellstyre) dans chaque commune qui compte un communal d'État. Le conseil compte cinq membres désignés par le conseil municipal pour quatre ans ; la majorité doit résider dans le communal ou dans la communauté villageoise titulaire des droits. Le sol appartient à l'État et sa propriété est gérée par l'entreprise publique Statskog SF ; le bois relève d'un autre régime.
