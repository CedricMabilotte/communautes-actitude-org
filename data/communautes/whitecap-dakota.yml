reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le préambule de la loi fédérale de 2023 rappelle l'engagement du Canada à mettre en œuvre la Déclaration des Nations unies sur les droits des peuples autochtones et indique que les parties considèrent que le traité contribue à cette mise en œuvre ; le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée.", annee: 2023, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
