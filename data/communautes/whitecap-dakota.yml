droits:
  autogouvernement: {valeur: "reconnu", note: "Les parties reconnaissent la Nation, sa constitution et le gouvernement des Dakotas de Whitecap (traité, art. 2.16) ; la Nation agit par ce gouvernement (art. 3.01) ; la constitution règle la structure du gouvernement, l'élection du conseil et la durée des mandats (art. 4.01 et 4.02).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le traité a force de loi et l'emporte sur toute règle de droit fédérale incompatible (loi de 2023, art. 4 et 5) ; les lois de la Nation sont opposables à toute personne (art. 7) et ne sont pas des textes réglementaires fédéraux (art. 11) ; dans plusieurs domaines, la loi de la Nation prévaut sur la loi fédérale en cas de conflit (traité, art. 7.10, 8.05, 13.05).", source: "https://laws-lois.justice.gc.ca/fra/lois/S-8.36/page-1.html"}
  justice_propre: {valeur: "partiel", note: "La Nation peut créer des infractions et des sanctions, y compris des sanctions conformes à sa culture et à ses valeurs, appliquées en remplacement de l'amende ou de la prison avec le consentement de l'auteur (traité, art. 24.02 et 24.05) ; le jugement des infractions relève de la Cour provinciale de la Saskatchewan et l'appel de la Cour du Banc du Roi (art. 24.20 et 24.21) : le traité ne prévoit pas de tribunal propre.", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  terres: {valeur: "reconnu", note: "Les terres de réserve ne peuvent être aliénées (vendues ou cédées) que par échange, ni expropriées que selon le traité (art. 9.01) ; elles restent des terres réservées aux Indiens au sens du paragraphe 91(24) de la Loi constitutionnelle de 1867 (art. 9.02) ; la Nation a compétence sur leur gestion : droits de possession et d'usage, enregistrement, aménagement et zonage, accès, résidence (art. 9.05).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  ressources: {valeur: "reconnu", note: "Compétence sur les ressources naturelles des terres de réserve (planification, octroi de droits, extraction), avec primauté sur le droit fédéral (art. 13.02 et 13.05), et sur les plans d'eau situés entièrement sur ces terres (art. 13.07 et 13.08) ; pour l'eau souterraine, la pêche et la santé des forêts, le droit fédéral l'emporte (art. 13.08, 13.12 et 13.14).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  consentement: {valeur: "partiel", note: "Le Canada consulte la Nation en vue d'obtenir son consentement libre, préalable et éclairé avant de décider d'un projet fédéral sur les terres de réserve (art. 12.13) ; pour les projets fédéraux touchant les terres d'usage traditionnel revendiquées, la Nation est consultée et, s'il y a lieu, accommodée selon la common law (art. 12.14) ; aucun droit de veto n'est prévu.", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  langue: {valeur: "partiel", note: "Le dakota est désigné langue traditionnelle de la Nation, qui a compétence sur sa préservation et sa revitalisation, avec primauté sur le droit fédéral (art. 8.01, 8.02 et 8.05) ; les lois de la Nation sont rédigées en anglais et peuvent être publiées en dakota (art. 5.13 et 5.14).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  education: {valeur: "reconnu", note: "Compétence sur l'éducation de la petite enfance à la 12e année sur les terres de réserve, y compris les programmes de langue et de culture dakota et la certification des enseignants, et sur l'enseignement postsecondaire (art. 21.02 et 21.03) ; les normes doivent être au moins équivalentes à celles de la Saskatchewan, sauf pour la langue et la culture dakota (art. 21.06).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  fiscalite: {valeur: "partiel", note: "Compétence en matière de taxation directe des membres sur les terres de réserve et d'impôt foncier sur ces terres (art. 11.02) ; l'imposition des non-membres dépend d'accords avec le Canada ou la Saskatchewan (art. 11.02 c, 11.06 à 11.10) ; la compétence fiscale de la Nation ne limite pas celle du Canada ni de la Saskatchewan (art. 11.04).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La Nation détermine l'appartenance à la Nation, y compris hors des terres de réserve, et tient le registre de ses membres, avec primauté sur le droit fédéral (art. 7.01, 7.02, 7.06 et 7.10) ; l'appartenance ne confère ni ne retire le statut d'Indien inscrit, qui reste fédéral (art. 7.08).", source: "https://media-002-ca.cdn.govstack.com/whitecapdakota-015-ca/media/fownfzwp/230501-final-a-self-government-treaty-recognizing-the-whitecap-dakota-nation-wapaha-ska-dakota-oyate-may-1-2023.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le traité est en vigueur depuis le 1er septembre 2023 (décret TR/2023-55) ; le registre fédéral des Premières Nations indique pour la Nation un système électoral « Self-Government » (autonomie gouvernementale) et un chef et des conseillers en fonction du 29 novembre 2024 au 29 novembre 2028.", source: "https://fnp-ppn.aadnc-aandc.gc.ca/fnp/Main/Search/FNGovernance.aspx?BAND_NUMBER=372&lang=eng"}
chronologie:
  - {annee: 1881, evenement: "La bande du chef Wapahaska (White Cap) reçoit une réserve sur la rivière Saskatchewan Sud, sans avoir signé de traité."}
  - {annee: 2004, evenement: "La Première Nation adopte un code foncier (régime de gestion des terres qui remplace en partie la Loi sur les Indiens)."}
  - {annee: 2012, evenement: "Accord-cadre avec le Canada pour négocier l'autonomie gouvernementale."}
  - {annee: 2022, evenement: "L'accord d'autonomie gouvernementale est paraphé le 22 août ; les membres l'approuvent par 92 % des voix le 7 octobre."}
  - {annee: 2023, evenement: "L'accord devient un traité au sens des articles 25 et 35 de la Loi constitutionnelle de 1982 ; signature le 2 mai, sanction de la loi fédérale en juin, entrée en vigueur le 1er septembre."}
  - {annee: 2024, evenement: "Déclaration de reconnaissance et d'excuses du gouvernement du Canada aux neuf Premières Nations dakota et lakota (15 juillet) ; première élection du conseil sous le régime du traité (29 novembre)."}
