resume: >-
  La Nation dakota de Whitecap (Wapaha Ska Dakota Oyate) est une communauté dakota établie au sud de Saskatoon, en Saskatchewan, sur une réserve attribuée en 1881 sans traité préalable. Le « Traité d'autonomie gouvernementale reconnaissant la Nation dakota de Whitecap », signé le 2 mai 2023, a reçu force de loi par la loi fédérale L.C. 2023, ch. 22, en vigueur depuis le 1er septembre 2023. Le Canada y reconnaît la Nation comme peuple autochtone au sens de l'article 35 de la Loi constitutionnelle de 1982 et comme titulaire du droit inhérent à l'autonomie gouvernementale (droit de se gouverner qui ne découle pas d'une concession de l'État) ; le texte a le statut de traité protégé par la Constitution. La Loi sur les Indiens (loi fédérale qui régit les bandes et les réserves) ne s'applique plus à la Nation que dans la mesure prévue par le traité. Le gouvernement des Dakotas de Whitecap légifère notamment sur la citoyenneté, la langue et la culture dakota, la gestion des terres de réserve, les ressources naturelles, l'éducation, la santé et les services à l'enfance et à la famille.
