base_nationale:
  - {instrument: "Statut d'autonomie de la Galice (loi organique 1/1981 du 6 avril)", nature: "statut_autonomie", annee: 1981, source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement, Xunta (gouvernement) et président propres, Statut, art. 9 et 10.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement exerce le pouvoir législatif, Statut, art. 10 ; compétence exclusive pour conserver, modifier et développer le droit civil galicien, art. 27, n° 4.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  justice_propre: {valeur: "partiel", note: "Le Tribunal supérieur de justice de Galice, juridiction de l'État, est l'organe où culmine l'organisation judiciaire en Galice, Statut, art. 21 ; il juge en cassation les affaires de droit civil galicien, art. 22.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur les montes, exploitations forestières, voies de transhumance et pâturages, Statut, art. 27, n° 10, et sur le régime juridique des montes vecinales en mano común, art. 27, n° 11 ; organisation des paroisses rurales comme entités locales propres, art. 27, n° 2.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur les aménagements hydrauliques, canaux et irrigations lorsque les eaux coulent entièrement en Galice, Statut, art. 27, n° 12, et sur la pêche dans les rías et eaux intérieures, la récolte de coquillages (marisqueo) et l'aquaculture, art. 27, n° 15.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige l'approbation du Parlement de Galice à la majorité des deux tiers, celle des Cortes Generales (Parlement de l'État) par loi organique et un référendum positif des électeurs, Statut, art. 56.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  langue: {valeur: "reconnu", note: "Le galicien est la langue propre de la Galice ; galicien et castillan sont officiels, Statut, art. 5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  education: {valeur: "reconnu", note: "La Communauté a la compétence pleine sur la régulation et l'administration de l'enseignement, sous réserve des règles de base de l'État, Statut, art. 31.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  fiscalite: {valeur: "partiel", note: "Les finances de la Communauté comprennent ses impôts propres, les impôts cédés par l'État et une part des recettes fiscales de l'État, Statut, art. 44 ; la liste des impôts cédés (disposition additionnelle 1) a été modifiée en dernier lieu par la loi 36/2022.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  representation: {valeur: "reconnu", note: "Le Parlement de Galice désigne, pour chaque législature des Cortes Generales, les sénateurs représentant la Communauté autonome, Statut, art. 10, al. 1, c ; la Constitution réserve à chaque communauté autonome un sénateur et un de plus par million d'habitants, désignés par son assemblée législative, art. 69.5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  statut_personnel: {valeur: "partiel", note: "La condition politique de Galicien est attribuée aux citoyens espagnols ayant leur domicile administratif dans une commune de Galice et aux résidents à l'étranger dont c'était le dernier domicile, Statut, art. 3.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Les institutions prévues par le Statut fonctionnent ; pour la langue, le Comité d'experts de la Charte (Conseil de l'Europe) relève en 2024 que le droit espagnol ne garantit pas la conduite des procédures judiciaires en langue régionale, même sur demande, et que l'administration de l'État compte peu d'agents maîtrisant ces langues.", source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
