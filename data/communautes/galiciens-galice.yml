resume: >-
  Le Statut d'autonomie de 1981 (loi organique 1/1981) constitue la Galice, « nationalité historique », en Communauté autonome ; ses institutions défendent l'identité de la Galice et l'intérêt du « peuple galicien ». Le Parlement de Galice vote les lois ; la Communauté a la compétence exclusive sur le droit civil galicien et sur le régime juridique des montes vecinales en mano común (terres boisées et pastorales possédées en commun par les voisins d'un lieu). Le galicien est langue propre et co-officielle avec le castillan. Les communautés de voisins propriétaires de ces montes ont leur propre fiche (« Communautés de montes vecinales (Espagne) »).
