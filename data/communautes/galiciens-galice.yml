droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement, Xunta (gouvernement) et président propres, Statut, art. 9 et 10.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement exerce le pouvoir législatif, Statut, art. 10 ; compétence exclusive pour conserver, modifier et développer le droit civil galicien, art. 27, n° 4.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  justice_propre: {valeur: "partiel", note: "Le Tribunal supérieur de justice de Galice, juridiction de l'État, est l'organe où culmine l'organisation judiciaire en Galice, Statut, art. 21 ; il juge en cassation les affaires de droit civil galicien, art. 22.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  terres: {valeur: "partiel", note: "Compétence exclusive sur le régime juridique des montes vecinales en mano común et sur les montes, pâturages et voies de transhumance, Statut, art. 27, n° 10 et 11 ; organisation des paroisses rurales comme entités locales propres, art. 27, n° 2.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur les aménagements hydrauliques, canaux et irrigations lorsque les eaux coulent entièrement en Galice, Statut, art. 27, n° 12.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige l'approbation du Parlement de Galice à la majorité des deux tiers et un référendum positif des électeurs, Statut, art. 56.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  langue: {valeur: "reconnu", note: "Le galicien est la langue propre de la Galice ; galicien et castillan sont officiels, Statut, art. 5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  education: {valeur: "reconnu", note: "La Communauté a la compétence pleine sur la régulation et l'administration de l'enseignement, sous réserve des règles de base de l'État, Statut, art. 31.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  fiscalite: {valeur: "partiel", note: "Les finances de la Communauté comprennent ses impôts propres, les impôts cédés par l'État et une part des recettes fiscales de l'État, Statut, art. 44.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La condition politique de Galicien est attribuée aux citoyens espagnols ayant leur domicile administratif dans une commune de Galice et aux résidents à l'étranger dont c'était le dernier domicile, Statut, art. 3.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-1981-9564"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité d'experts de la Charte constate en 2024 un système de protection des langues régionales développé en Espagne, avec des lacunes dans la justice, la santé et l'administration de l'État.", source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
