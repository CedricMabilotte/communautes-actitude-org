resume: >-
  La Constitution arménienne révisée par référendum en 2015 prévoit des places à l'Assemblée nationale pour les représentants des minorités nationales (art. 89). Le Code électoral de 2016 (art. 95) réserve quatre sièges aux quatre minorités nationales les plus nombreuses selon le dernier recensement : Yézidis, Russes, Assyriens et Kurdes. Les candidats figurent dans une section distincte des listes de partis. Le dispositif s'applique depuis les élections législatives de 2017. Selon le Comité consultatif de la Convention-cadre, le projet de loi sur les minorités nationales élaboré en 2016 n'était pas adopté en 2022.
