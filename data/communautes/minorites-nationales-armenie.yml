  representation: {valeur: "reconnu", note: "Constitution, art. 89 : des places sont attribuées à l'Assemblée nationale aux représentants des minorités nationales selon le Code électoral ; Code électoral de 2016, art. 95 : jusqu'à quatre sièges réservés, un pour chacune des quatre minorités les plus nombreuses (Yézidis, Russes, Assyriens, Kurdes), pourvus depuis une section distincte des listes de partis, avec jusqu'à quatre candidats par minorité et par liste.", source: "https://odihr.osce.org/sites/default/files/f/documents/5/4/502386_0.pdf"}
