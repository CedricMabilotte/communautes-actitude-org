effectivite: {valeur: "partielle", note: "Les quatre sièges sont pourvus depuis 2017. Selon l'OSCE/BIDDH, l'alliance Mon pas détenait les quatre sièges dans la législature sortante ; aux élections de 2021, trois sièges reviennent au Contrat civil et un à l'alliance Arménie. Les candidats sont présentés par les partis, et l'OSCE/BIDDH et la Commission de Venise notent que ces sièges peuvent modifier l'équilibre entre partis. Le CERD relève que le seuil exclut les minorités moins nombreuses et que les quotas se limitent à l'Assemblée nationale.", source: "https://odihr.osce.org/sites/default/files/f/documents/5/4/502386_0.pdf"}
chronologie:
  - {annee: 1998, evenement: "L'Arménie ratifie la Convention-cadre pour la protection des minorités nationales (entrée en vigueur le 1er novembre 1998)."}
  - {annee: 2015, evenement: "Révision constitutionnelle par référendum : l'article 89 prévoit des places pour les minorités nationales à l'Assemblée nationale."}
  - {annee: 2016, evenement: "Adoption du Code électoral ; l'article 95 organise quatre sièges réservés."}
  - {annee: 2017, evenement: "Premières élections législatives avec sièges réservés aux minorités nationales."}
  - {annee: 2019, evenement: "Création du Conseil des minorités nationales, organe consultatif qui remplace l'ancien Conseil de coordination."}
  - {annee: 2021, evenement: "Élections législatives anticipées : 13 candidats enregistrés pour les quatre sièges réservés ; trois sièges au Contrat civil, un à l'alliance Arménie."}
  - {annee: 2022, evenement: "Recensement : 31 079 Yézidis, 14 076 Russes, 2 755 Assyriens, 1 663 Kurdes."}
