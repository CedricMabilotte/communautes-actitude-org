effectivite: {valeur: "non_etablie", note: "Le Conseil de Rotuma siège toujours : un de ses représentants a participé en août 2025 au dialogue de l'OIT sur la Convention n° 169 et a demandé la révision du Rotuma Act avant les prochaines élections. Minority Rights Group décrit les Rotumans comme socialement et politiquement marginalisés malgré les garanties constitutionnelles. Aucune évaluation indépendante du fonctionnement du Conseil n'a été trouvée. Le siège rotuman au Sénat prévu par la Constitution de 1997 a disparu avec le Sénat.", source: "https://www.ilo.org/resource/news/fiji-advances-dialogue-indigenous-peoples-rights-under-ilo-convention-no"}
chronologie:
  - {annee: 1881, evenement: "Rotuma est cédée au Royaume-Uni (13 mai) et administrée avec la colonie de Fidji."}
  - {annee: 1927, evenement: "Adoption du Rotuma Act."}
  - {annee: 1997, evenement: "La Constitution de Fidji attribue un siège au Sénat désigné par le Conseil de Rotuma et un siège de député aux Rotumans."}
  - {annee: 2013, evenement: "Nouvelle Constitution : Rotumans reconnus comme peuple autochtone, terres rotumanes inaliénables (art. 28)."}
  - {annee: 2025, evenement: "Au dialogue de l'OIT sur la Convention n° 169 (Suva, août), le Conseil de Rotuma demande la révision du Rotuma Act."}
