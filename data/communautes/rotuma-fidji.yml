  ressources: {valeur: "partiel", note: "Les propriétaires des terres coutumières ont droit à une part équitable des redevances versées à l'État pour l'extraction des minéraux (Constitution 2013, art. 30).", source: "https://www.constituteproject.org/constitution/Fiji_2013"}
