resume: >-
  Peuple de l'île de Rotuma, à environ 465 km au nord de l'archipel principal de Fidji, cédée au Royaume-Uni en 1881 et administrée depuis avec Fidji. La Constitution de 2013 reconnaît les Rotumans comme peuple autochtone et interdit l'aliénation définitive des terres rotumanes (art. 28). L'île, dépendance de Fidji, dispose d'un Conseil de Rotuma institué par le Rotuma Act, composé de chefs de district et de représentants élus.
