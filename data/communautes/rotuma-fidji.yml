droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil de Rotuma, organe de gouvernement local institué par le Rotuma Act, réunit les chefs des sept districts et des représentants élus ; l'île dispose d'une autonomie plus étendue que les autres subdivisions de Fidji.", source: "https://islandstudies.com/files/2016/11/Rotuma.pdf"}
