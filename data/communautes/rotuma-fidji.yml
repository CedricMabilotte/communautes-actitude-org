resume: >-
  Peuple de l'île de Rotuma, à environ 500 km au nord de l'archipel principal de Fidji, rattachée administrativement à Fidji depuis 1881. La Constitution de 2013 reconnaît les Rotumans comme peuple autochtone et interdit l'aliénation définitive des terres rotumanes (art. 28). L'île, dépendance de Fidji, dispose d'un Conseil de Rotuma institué par le Rotuma Act, composé de chefs de district et de représentants élus.
