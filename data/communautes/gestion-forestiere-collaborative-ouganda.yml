resume: >-
  Fiche agrégée : elle couvre les communautés riveraines des forêts publiques d'Ouganda organisées en groupes d'usagers de la forêt (forest user groups) et liées à l'administration forestière par un accord de gestion forestière collaborative. La loi nationale sur les forêts et la plantation d'arbres de 2003 (National Forestry and Tree Planting Act) définit cette gestion comme un arrangement dans lequel un groupe d'usagers et l'organe responsable de la forêt (responsible body) se partagent rôles, responsabilités et bénéfices (art. 3), et l'ouvre aux réserves forestières centrales et locales (art. 15). La même loi crée la catégorie des forêts communautaires, déclarées par le ministre par arrêté (statutory order) après consultation de la communauté (art. 4 et 17). Un bilan réalisé en 2019 pour le ministère de l'Eau et de l'Environnement recense plus de 320 groupes, dont 42 (13 %) avec un accord valide en septembre 2018 ; presque tous les accords portent sur des réserves forestières centrales, gérées par l'Autorité forestière nationale (NFA) jusqu'en août 2025. La loi modificative de 2025 (National Forestry and Tree Planting (Amendment) Act) a dissous la NFA ; ses fonctions, dont la gestion des réserves forestières centrales, sont passées au ministère de l'Eau et de l'Environnement.
