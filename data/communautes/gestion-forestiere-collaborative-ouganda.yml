effectivite: {valeur: "partielle", note: "Selon une étude comparative du Centre de recherche forestière internationale (CIFOR) rapportée par Nsita en 2019, les communautés connaissent peu leurs droits, la gestion collaborative fait peu pour renforcer leur capacité à les faire valoir, et aucune forêt communautaire n'a été classée. Le bilan réalisé en 2019 pour le ministère de l'Eau et de l'Environnement compte 13 % de groupes avec un accord valide, 7 % avec un accord expiré et 80 % en attente d'accord, dont 28 groupes actifs depuis plus de dix ans sans accord ; aucun accord formel n'est connu dans les réserves forestières locales, et le projet de classement de la forêt de Kafuga (district de Kisoro) en forêt communautaire attend une décision de justice sur un litige foncier. Le cadre de gestion environnementale et sociale du projet IFPA-CD (Banque mondiale, octobre 2025) indique que le projet a soutenu 72 accords de gestion collaborative (19 nouveaux, 53 renouvelés) et note la lenteur de leur mise en place.", source: "https://documents1.worldbank.org/curated/en/099030326161554039/pdf/P170466-b7fa1a38-3857-414e-aeae-20d6b0b98d85.pdf"}
chronologie:
  - {annee: 1998, evenement: "Début de la phase pilote de gestion forestière collaborative (jusqu'en 2004) ; seuls les groupes de Nyangole (réserve de Tororo) et de Bumusili (réserve de Namalala) signent un accord avec l'ancien Département des forêts."}
  - {annee: 2001, evenement: "Politique forestière nationale, avec une déclaration de politique consacrée à la gestion collaborative."}
  - {annee: 2003, evenement: "National Forestry and Tree Planting Act (gestion collaborative, art. 15 ; forêts communautaires, art. 17) ; lignes directrices nationales de gestion collaborative ; création de l'Autorité forestière nationale (NFA)."}
  - {annee: 2008, evenement: "Démission collective de la direction et de membres du conseil de la NFA sur le déclassement de parties des réserves de Mabira et de Kalangala ; la conduite des démarches de gestion collaborative passe surtout à des ONG."}
  - {annee: 2016, evenement: "National Forestry and Tree Planting Regulations : procédure de demande et modèle d'accord."}
  - {annee: 2019, evenement: "Premier bilan national de la gestion collaborative, réalisé pour le ministère de l'Eau et de l'Environnement : plus de 320 groupes, 42 accords valides (données de septembre 2018)."}
  - {annee: 2024, evenement: "Nouvelles lignes directrices nationales de gestion forestière collaborative ; le 23 octobre 2024, le Parlement adopte le projet de loi modificative sur les forêts qui intègre la NFA au ministère de l'Eau et de l'Environnement."}
  - {annee: 2025, evenement: "National Forestry and Tree Planting (Amendment) Act, 2025 : la NFA est dissoute en août 2025 ; le ministère de l'Eau et de l'Environnement reprend la gestion des réserves forestières centrales et la conclusion des accords de gestion collaborative."}
fiabilite:
  verifie: ["Loi de 2003 (texte ouvert sur FAOLEX) : date de sanction 17 juin 2003, entrée en vigueur 8 août 2003 ; définition de la gestion collaborative (art. 3) ; classification en réserves centrales, réserves locales, forêts communautaires, forêts privées et forêts des aires de faune (art. 4) ; art. 15 sur les accords entre organe responsable et groupe d'usagers pour une réserve centrale ou locale ; art. 17 à 20 sur la déclaration et la gestion des forêts communautaires ; art. 28 et 33.", "Bilan de 2019 (Kazoora, Irumba et al., ministère de l'Eau et de l'Environnement, version finale du 30 avril 2019) : plus de 320 groupes recensés, 42 groupes (13 %) avec accord valide, 7 % expirés, 80 % (259 groupes) en attente, données à septembre 2018 ; 57 % des groupes avec accord sans enregistrement renouvelé ; phase pilote 1998-2004 ; règlement de 2016 ; aucun accord formel connu dans les réserves forestières locales (§ 42) ; l'État garde le droit de propriété par la NFA (§ 118).", "Nsita (Global Landscapes Forum, 2 mai 2019) : la loi de 2003 distingue réserves centrales et locales, forêts communautaires et forêts privées ; les titulaires d'une forêt communautaire peuvent la gérer, exclure les personnes extérieures à la communauté et en tirer un revenu ; aucune forêt communautaire n'était classée en 2019.", "Édition révisée de 2023 (chapitre 160, texte ouvert sur LEAP/ULII) : gestion collaborative à l'art. 14, forêts communautaires aux art. 16 à 19, plan de gestion à l'art. 27, usage domestique à l'art. 32 ; définition inchangée.", "Banque mondiale, cadre de gestion environnementale et sociale du projet IFPA-CD (octobre 2025) : NFA dissoute en août 2025 en vertu de la loi modificative de 2025, fonctions absorbées par le ministère de l'Eau et de l'Environnement ; lignes directrices de gestion collaborative de 2024 ; 72 accords soutenus par le projet (19 nouveaux, 53 renouvelés).", "Parlement de l'Ouganda (23 octobre 2024) : adoption du projet de loi modificative de 2024 intégrant la NFA au ministère."]
  non_confirme: ["Le texte du règlement de 2016 n'a pas pu être ouvert : ses articles sont cités d'après le bilan de 2019.", "Le bilan de 2019 rattache la gestion collaborative à l'« article 35 » de la loi à deux endroits ; le texte de 2003 ouvert la place à l'article 15 (l'article 35 porte sur les feux). L'édition révisée de 2023 la place à l'article 14.", "Aucune forêt communautaire déclarée par arrêté ministériel n'a été trouvée ; Nsita (2019) écrit qu'aucune n'est classée, mais aucune liste officielle n'a été ouverte pour le confirmer.", "Le bilan de 2019 se contredit sur les réserves forestières locales : son résumé cite un groupe actif à Tororo, son § 42 n'y connaît aucun accord formel et son § 80 décrit à Tororo des accords individuels de plantation.", "Nombre de membres, nombre de villages et surface totale sous accord : aucun chiffre national trouvé.", "Aucune liste officielle des groupes ou des sites n'a été trouvée (le bilan de 2019 n'en publie qu'un échantillon) : pas de tableau.", "Le texte de la loi modificative de 2025 n'a pas été ouvert : sa date de sanction et ses articles sont connus par le document de la Banque mondiale, qui la date tantôt de 2024, tantôt de 2025.", "Nombre national d'accords de gestion collaborative en vigueur après 2018 : non trouvé (le site de la NFA cite 40 accords signés, sans date ; les 72 accords du projet IFPA-CD ne couvrent que la zone du projet)."]
