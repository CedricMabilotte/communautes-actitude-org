base_nationale:
  - {instrument: "National Forestry and Tree Planting Act, 2003 (Act 8 of 2003), sanctionnée le 17 juin 2003, en vigueur le 8 août 2003 : art. 3 (définition de la gestion forestière collaborative), 4 (classification des forêts), 15 (gestion forestière collaborative), 17 à 20 (forêts communautaires), 28 (plan de gestion), 33 (usage domestique)", nature: "loi", annee: 2003, source: "https://faolex.fao.org/docs/pdf/uga87770.pdf"}
  - {instrument: "National Forestry and Tree Planting Regulations, 2016 : formulaire de demande de gestion collaborative (3e annexe), endossement de la demande par les autorités du district, modèle d'accord", nature: "loi", annee: 2016, source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  - {instrument: "National Forestry and Tree Planting Act, chapitre 160 (édition révisée des lois au 31 décembre 2023) : même contenu, nouvelle numérotation : art. 2 (définition de la gestion forestière collaborative), 3 (classification des forêts), 4 (fiducie publique), 14 (gestion forestière collaborative), 16 à 19 (forêts communautaires), 27 (plan de gestion), 32 (usage domestique)", nature: "loi", annee: 2023, source: "https://leap.unep.org/en/akn/ug/act/2003/8/eng@2023-12-31"}
  - {instrument: "National Forestry and Tree Planting (Amendment) Act, 2025 : dissolution de l'Autorité forestière nationale (NFA) et transfert de ses fonctions au ministère de l'Eau et de l'Environnement (août 2025)", nature: "loi", annee: 2025, source: "https://documents1.worldbank.org/curated/en/099030326161554039/pdf/P170466-b7fa1a38-3857-414e-aeae-20d6b0b98d85.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 2003 reconnaît le groupe d'usagers de la forêt comme partie à l'accord de gestion collaborative avec l'organe responsable (art. 3 et 15) ; selon le bilan ministériel de 2019, le groupe doit être enregistré comme organisation communautaire auprès du district et renouveler cet enregistrement, et 57 % des groupes titulaires d'un accord ne l'avaient pas renouvelé.", source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'accord de gestion collaborative porte sur une réserve forestière ou une partie de réserve (loi de 2003, art. 3 et 15) et donne au groupe un droit d'accès et de gestion sur une zone délimitée ; les réserves restent détenues en fiducie (public trust : garde pour le compte du public) par l'État ou la collectivité locale pour le peuple ougandais (art. 5), et le bilan ministériel de 2019 note que l'État garde, par la NFA, le droit de propriété ; depuis la dissolution de la NFA en août 2025, le ministère de l'Eau et de l'Environnement gère les réserves centrales.", source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  ressources: {valeur: "partiel", note: "Les parties se partagent les bénéfices de la forêt (loi de 2003, art. 3) ; selon le bilan de 2019, l'accord ouvre un droit de prélèvement réglementé (bois de feu, matériaux d'artisanat, bambou, plantes médicinales) et un droit d'exclure les non-membres en théorie, limité par le droit de tout riverain de prélever du bois mort et du bambou pour son usage domestique (art. 33).", source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  consentement: {valeur: "partiel", note: "La déclaration d'une réserve forestière centrale exige la consultation de la communauté locale par réunions publiques (loi de 2003, art. 6 et 7), celle d'une forêt communautaire la consultation de la communauté et du conseil foncier du district (art. 17), et le plan de gestion d'une réserve ou d'une forêt communautaire est préparé en consultation avec la communauté locale (art. 28) ; aucun consentement n'est exigé.", source: "https://faolex.fao.org/docs/pdf/uga87770.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
