base_nationale:
  - {instrument: "National Forestry and Tree Planting Act, 2003 (Act 8 of 2003), sanctionnée le 17 juin 2003, en vigueur le 8 août 2003 : art. 3 (définition de la gestion forestière collaborative), 4 (classification des forêts), 15 (gestion forestière collaborative), 17 à 20 (forêts communautaires), 28 (plan de gestion), 33 (usage domestique)", nature: "loi", annee: 2003, source: "https://faolex.fao.org/docs/pdf/uga87770.pdf"}
  - {instrument: "National Forestry and Tree Planting Regulations, 2016 : formulaire de demande de gestion collaborative (3e annexe), endossement de la demande par les autorités du district, modèle d'accord", nature: "loi", annee: 2016, source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 2003 reconnaît le groupe d'usagers de la forêt comme partie à l'accord de gestion collaborative avec l'organe responsable (art. 3 et 15) ; selon le bilan ministériel de 2019, le groupe doit être enregistré comme organisation communautaire auprès du district et renouveler cet enregistrement, et 57 % des groupes titulaires d'un accord ne l'avaient pas renouvelé.", source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'accord de gestion collaborative porte sur une réserve forestière ou une partie de réserve (loi de 2003, art. 3 et 15) et donne au groupe un droit d'accès et de gestion sur une zone délimitée ; les réserves restent détenues en fiducie (public trust : garde pour le compte du public) par l'État ou la collectivité locale pour le peuple ougandais (art. 5), et le bilan ministériel de 2019 note que l'État garde, par la NFA, le droit de propriété.", source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  ressources: {valeur: "partiel", note: "Les parties se partagent les bénéfices de la forêt (loi de 2003, art. 3) ; selon le bilan de 2019, l'accord ouvre un droit de prélèvement réglementé (bois de feu, matériaux d'artisanat, bambou, plantes médicinales) et un droit d'exclure les non-membres en théorie, limité par le droit de tout riverain de prélever du bois mort et du bambou pour son usage domestique (art. 33).", source: "https://envalert.org/wp-content/uploads/2021/03/CFM-Review-Final-Version-29Apr19.pdf"}
  consentement: {valeur: "partiel", note: "La déclaration d'une réserve forestière centrale exige la consultation de la communauté locale par réunions publiques (loi de 2003, art. 6 et 7), celle d'une forêt communautaire la consultation de la communauté et du conseil foncier du district (art. 17), et le plan de gestion d'une réserve ou d'une forêt communautaire est préparé en consultation avec la communauté locale (art. 28) ; aucun consentement n'est exigé.", source: "https://faolex.fao.org/docs/pdf/uga87770.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon une étude comparative du Centre de recherche forestière internationale (CIFOR) rapportée par Nsita en 2019, les communautés connaissent peu leurs droits, la gestion collaborative fait peu pour renforcer leur capacité à les faire valoir, et aucune forêt communautaire n'a été classée. Le bilan réalisé en 2019 pour le ministère de l'Eau et de l'Environnement compte 13 % de groupes avec un accord valide, 7 % avec un accord expiré et 80 % en attente d'accord, dont 28 groupes actifs depuis plus de dix ans sans accord ; aucun accord formel n'est connu dans les réserves forestières locales, et le projet de classement de la forêt de Kafuga (district de Kisoro) en forêt communautaire attend une décision de justice sur un litige foncier.", source: "https://thinklandscape.globallandscapesforum.org/viewpoint/community-forests-in-uganda-strong-rights-in-law-but-weak-capabilities-in-implementation/"}
chronologie:
  - {annee: 1998, evenement: "Début de la phase pilote de gestion forestière collaborative (jusqu'en 2004) ; seuls les groupes de Nyangole (réserve de Tororo) et de Bumusili (réserve de Namalala) signent un accord avec l'ancien Département des forêts."}
  - {annee: 2001, evenement: "Politique forestière nationale, avec une déclaration de politique consacrée à la gestion collaborative."}
  - {annee: 2003, evenement: "National Forestry and Tree Planting Act (gestion collaborative, art. 15 ; forêts communautaires, art. 17) ; lignes directrices nationales de gestion collaborative ; création de l'Autorité forestière nationale (NFA)."}
  - {annee: 2008, evenement: "Démission collective de la direction et de membres du conseil de la NFA sur le déclassement de parties des réserves de Mabira et de Kalangala ; la conduite des démarches de gestion collaborative passe surtout à des ONG."}
  - {annee: 2016, evenement: "National Forestry and Tree Planting Regulations : procédure de demande et modèle d'accord."}
  - {annee: 2019, evenement: "Premier bilan national de la gestion collaborative, réalisé pour le ministère de l'Eau et de l'Environnement : plus de 320 groupes, 42 accords valides (données de septembre 2018)."}
fiabilite:
  verifie: ["Loi de 2003 (texte ouvert sur FAOLEX) : date de sanction 17 juin 2003, entrée en vigueur 8 août 2003 ; définition de la gestion collaborative (art. 3) ; classification en réserves centrales, réserves locales, forêts communautaires, forêts privées et forêts des aires de faune (art. 4) ; art. 15 sur les accords entre organe responsable et groupe d'usagers pour une réserve centrale ou locale ; art. 17 à 20 sur la déclaration et la gestion des forêts communautaires ; art. 28 et 33.", "Bilan de 2019 (Kazoora, Irumba et al., ministère de l'Eau et de l'Environnement, version finale du 30 avril 2019) : plus de 320 groupes recensés, 42 groupes (13 %) avec accord valide, 7 % expirés, 80 % (259 groupes) en attente, données à septembre 2018 ; 57 % des groupes avec accord sans enregistrement renouvelé ; phase pilote 1998-2004 ; règlement de 2016 ; aucun accord formel connu dans les réserves forestières locales (§ 42) ; l'État garde le droit de propriété par la NFA (§ 118).", "Nsita (Global Landscapes Forum, 2 mai 2019) : la loi de 2003 distingue réserves centrales et locales, forêts communautaires et forêts privées ; les titulaires d'une forêt communautaire peuvent la gérer, exclure les personnes extérieures à la communauté et en tirer un revenu ; aucune forêt communautaire n'était classée en 2019."]
  non_confirme: ["Le texte du règlement de 2016 n'a pas pu être ouvert : ses articles sont cités d'après le bilan de 2019.", "Le bilan de 2019 rattache la gestion collaborative à l'« article 35 » de la loi à deux endroits ; le texte de 2003 ouvert la place à l'article 15 (l'article 35 porte sur les feux). La numérotation de la révision des lois de 2023 n'a pas été vérifiée.", "Aucune forêt communautaire déclarée par arrêté ministériel n'a été trouvée ; Nsita (2019) écrit qu'aucune n'est classée, mais aucune liste officielle n'a été ouverte pour le confirmer.", "Le bilan de 2019 se contredit sur les réserves forestières locales : son résumé cite un groupe actif à Tororo, son § 42 n'y connaît aucun accord formel et son § 80 décrit à Tororo des accords individuels de plantation.", "Nombre de membres, nombre de villages et surface totale sous accord : aucun chiffre national trouvé.", "Aucune liste officielle des groupes ou des sites n'a été trouvée (le bilan de 2019 n'en publie qu'un échantillon) : pas de tableau.", "Évolution depuis 2019, dont l'éventuelle réorganisation de la NFA et la numérotation de la loi dans l'édition révisée des lois : non documentée."]
