  autodetermination_externe: {valeur: "conteste", note: "Plan de règlement accepté par le Maroc et le Front POLISARIO le 30 août 1988, approuvé par les résolutions 658 (1990) et 690 (1991) du Conseil de sécurité : référendum entre indépendance et intégration au Maroc, jamais organisé. La résolution 2797 (2025) demande une solution qui « assure l'autodétermination du peuple du Sahara occidental » sur la base du plan d'autonomie marocain.", source: "https://docs.un.org/fr/S/RES/690(1991)"}
effectivite: {valeur: "contestee", note: "Le Haut-Commissariat aux droits de l'homme n'a pas accès au territoire depuis 2015 ; les hostilités ont repris en 2020 ; des réfugiés sahraouis vivent dans cinq camps près de Tindouf (A/AC.109/2026/17, par. 24-28 et 34).", source: "https://docs.un.org/fr/A/AC.109/2026/17"}
chronologie:
  - {annee: 1963, evenement: "Inscription du territoire sur la liste des territoires non autonomes."}
  - {annee: 1975, evenement: "Fin de l'administration espagnole ; le Maroc prend le contrôle de la majeure partie du territoire."}
  - {annee: 1988, evenement: "Le Maroc et le Front POLISARIO donnent leur accord de principe au plan de règlement ONU-OUA."}
  - {annee: 1991, evenement: "Création de la MINURSO par la résolution 690 du Conseil de sécurité."}
  - {annee: 2007, evenement: "Le Maroc présente au Secrétaire général un plan d'autonomie."}
  - {annee: 2020, evenement: "Reprise des hostilités entre le Maroc et le Front POLISARIO."}
  - {annee: 2024, evenement: "La Cour de justice de l'Union européenne juge que le peuple du Sahara occidental n'a pas consenti aux accords UE-Maroc de 2019 sur la pêche et les produits agricoles."}
  - {annee: 2025, evenement: "Résolution 2797 du Conseil de sécurité : négociations sur la base du plan d'autonomie marocain."}
