  non_confirme: ["Année d'inscription (1963) confirmée par Human Rights Watch ; la page du Comité spécial n'a pas pu être ouverte.", "Population sahraouie : aucun chiffre sourcé. Le chiffre retenu (environ 600 000) compte tous les habitants à l'ouest du mur de sable, toutes origines confondues (A/AC.109/2026/17, par. 9) ; Human Rights Watch compte au moins 173 000 réfugiés dans les camps de Tindouf.", "Nombre de villages : non trouvé.", "Nombre de lieux : non trouvé ; le régime ne porte pas sur des sites distincts.", "Le seul droit au niveau partiel (langue) repose sur la Constitution marocaine, dont l'application au territoire n'est pas reconnue par les Nations unies ; texte de l'article 5 lu dans la traduction anglaise du Constitute Project.", "Issue des négociations de 2026 et renouvellement du mandat de la MINURSO au-delà du 31 octobre 2026 : non connus à la date de révision.", "Le champ etats retient le Maroc, qui contrôle la majeure partie du territoire ; le statut de l'Espagne comme puissance administrante de jure et la partie contrôlée par le Front POLISARIO à l'est du mur n'ont pas été examinés.", "Les arrêts de la CJUE relèvent du droit de l'Union, non d'un droit national ; ils figurent en reconnaissance régionale et ne sont pas portés dans la grille."]
