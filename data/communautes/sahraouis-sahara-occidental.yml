  autodetermination_externe: {valeur: "conteste", note: "Plan de règlement accepté par le Maroc et le Front POLISARIO le 30 août 1988, approuvé par les résolutions 658 (1990) et 690 (1991) du Conseil de sécurité : référendum entre indépendance et intégration au Maroc, jamais organisé. La résolution 2797 (2025) demande une solution qui « assure l'autodétermination du peuple du Sahara occidental » sur la base du plan d'autonomie marocain, qui n'inclut pas l'option de l'indépendance (Human Rights Watch, 2026).", source: "https://docs.un.org/fr/S/RES/690(1991)"}
effectivite: {valeur: "contestee", note: "Human Rights Watch (2026) relève que les autorités marocaines font obstruction au travail des groupes qui plaident pour l'autodétermination et qu'au moins 173 000 réfugiés sahraouis vivent dans des camps près de Tindouf. Le Haut-Commissariat aux droits de l'homme n'a pas accès au territoire depuis 2015 et les hostilités ont repris en 2020 (A/AC.109/2026/17, par. 27-28 et 34).", source: "https://www.hrw.org/fr/news/2026/03/25/onu-le-droit-a-lautodetermination-des-habitants-du-sahara-occidental-est-menace"}
chronologie:
  - {annee: 1963, evenement: "Inscription du territoire sur la liste des territoires non autonomes."}
  - {annee: 1975, evenement: "Fin de l'administration espagnole ; le Maroc prend le contrôle de la majeure partie du territoire."}
  - {annee: 1988, evenement: "Le Maroc et le Front POLISARIO donnent leur accord de principe au plan de règlement ONU-OUA."}
  - {annee: 1991, evenement: "Création de la MINURSO par la résolution 690 du Conseil de sécurité."}
  - {annee: 2007, evenement: "Le Maroc présente au Secrétaire général un plan d'autonomie."}
  - {annee: 2020, evenement: "Reprise des hostilités entre le Maroc et le Front POLISARIO."}
  - {annee: 2024, evenement: "La Cour de justice de l'Union européenne juge que le peuple du Sahara occidental n'a pas consenti aux accords UE-Maroc de 2019 sur la pêche et les produits agricoles."}
  - {annee: 2025, evenement: "Résolution 2797 du Conseil de sécurité : négociations sur la base du plan d'autonomie marocain ; mandat de la MINURSO prorogé jusqu'au 31 octobre 2026."}
  - {annee: 2026, evenement: "Réunions convoquées par les États-Unis à Madrid puis à Washington (23 et 24 février) entre le Maroc, le Front POLISARIO, l'Algérie et la Mauritanie ; examen stratégique de la MINURSO présenté au Conseil de sécurité en avril."}
