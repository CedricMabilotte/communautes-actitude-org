resume: >-
  Le Sahara occidental figure sur la liste des territoires non autonomes (territoires dont la population ne s'administre pas encore pleinement elle-même) des Nations unies depuis 1963.
  L'Espagne l'a administré jusqu'en 1975 ; le Maroc en contrôle depuis la majeure partie, à l'ouest du mur de sable, et le Front POLISARIO revendique l'indépendance.
  Le référendum d'autodétermination prévu par le plan de règlement de 1988 et confié à la MINURSO en 1991 n'a pas eu lieu.
  Depuis la résolution 2797 (2025) du Conseil de sécurité, les négociations se fondent sur le plan d'autonomie proposé par le Maroc en 2007.
