resume: >-
  Le Sahara occidental figure sur la liste des territoires non autonomes (territoires dont la population ne s'administre pas encore pleinement elle-même) des Nations unies depuis 1963.
  L'Espagne l'a administré jusqu'en 1975 ; le Maroc en contrôle depuis la majeure partie, à l'ouest du mur de sable, et le Front POLISARIO revendique l'indépendance.
  Le référendum d'autodétermination prévu par le plan de règlement de 1988 et confié à la MINURSO en 1991 n'a pas eu lieu.
  Depuis la résolution 2797 (2025) du Conseil de sécurité, les négociations se fondent sur le plan d'autonomie proposé par le Maroc en 2007 ; des réunions des quatre délégations (Maroc, Front POLISARIO, Algérie, Mauritanie) se sont tenues à Madrid et à Washington en février 2026.
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "Arrêts de la Cour de justice de l'Union européenne du 4 octobre 2024 (affaires jointes C-778/21 P et C-798/21 P, C-779/21 P et C-799/21 P) : le consentement du peuple du Sahara occidental est une condition de validité des accords UE-Maroc appliqués sur ce territoire non autonome.", annee: 2024, source: "https://curia.europa.eu/jcms/upload/docs/application/pdf/2024-10/cp240170fr.pdf"}
reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Territoire inscrit sur la liste du Comité spécial de la décolonisation, qui lui consacre un document de travail annuel (A/AC.109/2026/17).", annee: 1963, source: "https://docs.un.org/fr/A/AC.109/2026/17"}
  - {mecanisme: "mission_onu", detail: "Mission des Nations unies pour l'organisation d'un référendum au Sahara occidental (MINURSO), créée par la résolution 690 (1991) du Conseil de sécurité ; mandat prorogé jusqu'au 31 octobre 2026 par la résolution 2797 (2025).", annee: 1991, source: "https://docs.un.org/fr/S/RES/690(1991)"}
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale regrette l'absence de solution sur l'exercice du droit à l'autodétermination du peuple du Sahara occidental et relève des restrictions aux libertés d'expression, d'association et de réunion des Sahraouis (CERD/C/MAR/CO/19-21, par. 19-20, décembre 2023).", annee: 2023, source: "https://docs.un.org/fr/CERD/C/MAR/CO/19-21"}
