  - {mecanisme: "mission_onu", detail: "Mission des Nations unies pour l'organisation d'un référendum au Sahara occidental (MINURSO), créée par la résolution 690 (1991) du Conseil de sécurité ; mandat prorogé jusqu'au 31 octobre 2026 par la résolution 2797 (2025).", annee: 1991, source: "https://docs.un.org/fr/S/RES/690(1991)"}
