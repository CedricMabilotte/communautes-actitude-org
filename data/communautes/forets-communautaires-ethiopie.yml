resume: >-
  Fiche agrégée : elle couvre les communautés rurales d'Éthiopie titulaires d'une forêt communautaire ou signataires d'un accord de gestion forestière participative avec l'administration. La proclamation (loi fédérale) n° 1065/2018 sur le développement, la conservation et l'utilisation des forêts fait de la « forêt communautaire » l'une des quatre formes de propriété forestière (art. 4) : une forêt développée, conservée, utilisée et administrée par la communauté selon des règlements et des plans qu'elle établit (art. 2-7). Elle définit aussi la gestion forestière participative comme un accord entre l'État et la communauté qui vit dans ou autour d'une forêt de l'État, avec partage des responsabilités et des bénéfices (art. 2-9). La gestion participative est pratiquée depuis un projet pilote de 1995 à Chilimo et a été reconnue d'abord par la région Oromia en 2000 ; les régions appliquent la proclamation fédérale, et plusieurs d'entre elles ont inscrit la gestion participative dans leurs propres proclamations forestières.
