reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national de l'Éthiopie à la Convention sur la diversité biologique (mai 2014) : gestion forestière participative sur 82 000 ha de forêts naturelles en Amhara, et dans 10 zones forestières couvrant 333 704 ha en Oromia avec 76 coopératives et 148 796 membres ; activités semblables au Benishangul-Gumuz, dans la Région du Sud et au Tigray", annee: 2014, source: "https://www.cbd.int/doc/world/et/et-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 40(3) : la propriété de la terre rurale et urbaine et des ressources naturelles appartient exclusivement à l'État et aux peuples d'Éthiopie", nature: "constitution", annee: 1995, source: "https://www.constituteproject.org/constitution/Ethiopia_1994"}
  - {instrument: "Proclamation n° 542/2007 sur le développement, la conservation et l'utilisation des forêts (abrogée en 2018), qui reconnaissait la gestion forestière participative", nature: "loi", annee: 2007, source: "https://www.farmafrica.org/wp-content/uploads/2024/07/participatory-forest-management-in-ethiopia.pdf"}
  - {instrument: "Proclamation n° 1065/2018 sur le développement, la conservation et l'utilisation des forêts, Federal Negarit Gazette (journal officiel fédéral) n° 21 du 23 janvier 2018, art. 2, 4, 7, 8, 17, 19, 22 et 28", nature: "loi", annee: 2018, source: "https://faolex.fao.org/docs/pdf/eth182203.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La forêt communautaire est administrée par la communauté selon ses règlements et ses plans (proclamation 1065/2018, art. 2-7) ; les organes exécutifs régionaux supervisent et soutiennent sa gestion (art. 17-1).", source: "https://faolex.fao.org/docs/pdf/eth182203.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La communauté adopte des règlements communautaires (by-laws, règles internes) qui fixent la gestion de la forêt et le partage des bénéfices (proclamation 1065/2018, art. 2-7 et 7-1-g) ; elle doit déposer ces règlements et son plan de gestion auprès de l'organe public compétent (art. 8-2).", source: "https://faolex.fao.org/docs/pdf/eth182203.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La forêt communautaire est établie sur une possession privée ou communale et donne droit à un certificat de titre (proclamation 1065/2018, art. 2-7 et 7-1-b) et à une indemnisation en cas d'expropriation (art. 7-1-h) ; la propriété de la terre reste à l'État et aux peuples d'Éthiopie (Constitution, art. 40-3).", source: "https://faolex.fao.org/docs/pdf/eth182203.pdf"}
  ressources: {valeur: "partiel", note: "Les communautés utilisent, vendent et transforment les produits forestiers selon leur plan de gestion (proclamation 1065/2018, art. 7-1-f), partagent les bénéfices des forêts naturelles voisines (art. 7-1-c) et ont une priorité sur les concessions de forêts de l'État (art. 7-1-d) ; la récolte hors de leur propre possession et le transport des produits forestiers restent soumis à permis du ministère ou de l'autorité régionale (art. 22-1 et 22-2).", source: "https://faolex.fao.org/docs/pdf/eth182203.pdf"}
  consentement: {valeur: "partiel", note: "L'identification et la délimitation des forêts de l'État se font avec la participation de la communauté locale (proclamation 1065/2018, art. 19-3), et l'entrée dans la gestion participative est volontaire (art. 7-1-a) ; les habitants des forêts de l'État peuvent être déplacés après une étude et une concertation avec l'organe compétent (art. 19-11) ; aucun consentement préalable n'est exigé.", source: "https://faolex.fao.org/docs/pdf/eth182203.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
