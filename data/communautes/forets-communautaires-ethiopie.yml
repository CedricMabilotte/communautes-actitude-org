  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Farm Africa (Lemenih, Allan et Biot, 2015), organisation non gouvernementale qui a lancé le premier pilote, indique qu'au moins cinq des neuf régions pratiquent la gestion participative et rapporte l'arrêt du déboisement à Chilimo et une régénération plus forte dans les forêts sous gestion participative d'Adaba-Dodolla et de Bonga ; le rapport de l'Éthiopie à l'évaluation des ressources forestières mondiales 2015 (FAO) ne compte aucune forêt sous propriété ou gestion communautaire, faute d'évaluation, et le rapport à la CDB de 2014 signale un manque de données et de suivi sur l'évolution des forêts afromontagnardes humides.", source: "https://www.farmafrica.org/wp-content/uploads/2024/07/participatory-forest-management-in-ethiopia.pdf"}
chronologie:
  - {annee: 1975, evenement: "Les forêts deviennent propriété de l'État."}
  - {annee: 1995, evenement: "Premier projet pilote de gestion forestière participative à Chilimo (Farm Africa et SOS Sahel)."}
  - {annee: 2000, evenement: "La région Oromia reconnaît la gestion participative par des accords formels avec des communautés."}
  - {annee: 2007, evenement: "Proclamation fédérale n° 542/2007 sur les forêts, qui reconnaît la gestion forestière participative."}
  - {annee: 2011, evenement: "Lignes directrices nationales harmonisées sur la gestion forestière participative (ministère de l'Agriculture)."}
  - {annee: 2014, evenement: "Cinquième rapport national à la CDB : 76 coopératives et 333 704 ha sous gestion participative en Oromia, 82 000 ha en Amhara."}
  - {annee: 2018, evenement: "Proclamation n° 1065/2018 : la forêt communautaire devient l'une des quatre formes de propriété forestière ; abrogation de la proclamation n° 542/2007."}
fiabilite:
  verifie: ["Proclamation n° 1065/2018 (Federal Negarit Gazette n° 21, 23 janvier 2018), texte anglais ouvert sur FAOLEX : art. 2-7 (forêt communautaire), 2-9 (gestion forestière participative), 4 (quatre formes de propriété : privée, communautaire, associative, de l'État), 7 (droits des communautés : certificat de titre, partage des bénéfices selon les règlements communautaires, priorité aux concessions), 8-2 (dépôt des règlements), 17 (rôle des régions), 19-3 (participation à la délimitation), 19-11 (maintien ou déplacement des habitants des forêts de l'État), 22 (permis de récolte hors possession et de transport), 28 (abrogation de la proclamation 542/2007), 29 (entrée en vigueur à la publication).", "Cinquième rapport national de l'Éthiopie à la CDB (2014), p. 33 : 82 000 ha en Amhara ; 10 zones, 333 704 ha, 76 coopératives et 148 796 membres en Oromia.", "Rapport FRA 2015 de l'Éthiopie (FAO), tableau 18.5 : propriété communautaire des forêts non évaluée, toutes les forêts comptées comme publiques.", "Lemenih, Allan et Biot (Farm Africa, 2015) : pilote de Chilimo en 1995, reconnaissance par l'Oromia en 2000, proclamation 542/2007, lignes directrices harmonisées de 2011, au moins cinq des neuf régions pratiquent la gestion participative et l'ont inscrite dans leurs proclamations forestières ; encadré 2 : modèle des lignes directrices de 2011 (organisation communautaire à adhésion volontaire, responsables élus, enregistrement auprès de l'administration, accord de gestion forestière)."]
  non_confirme: ["Les proclamations forestières régionales (Oromia, Amhara, Tigray, Benishangul-Gumuz, ex-Région du Sud) n'ont pas pu être ouvertes : leurs numéros, dates et dispositions sur les accords de gestion forestière ne sont pas cités.", "Nombre national de forêts communautaires, d'accords de gestion participative, de coopératives et de ménages : aucun chiffre officiel national trouvé ; les chiffres retenus portent sur la seule région Oromia en 2014. L'estimation de près de 40 % des ressources forestières sous gestion participative (Farm Africa, 2015) n'est pas un chiffre officiel et n'est pas retenue.", "Aucune liste officielle des sites trouvée : pas de tableau.", "Le règlement d'application prévu par l'art. 27 de la proclamation 1065/2018 et les incitations des art. 7-2 n'ont pas été trouvés.", "Les aires de conservation communautaires (dont Menz-Guassa en Amhara, reconnue par le conseil régional selon le rapport à la CDB de 2014) relèvent du régime de la faune sauvage (proclamation n° 541/2007) et non du régime forestier : elles ne sont pas rattachées à cette fiche ; leur texte n'a pas été ouvert.", "Effet du conflit au Tigray (2020-2022) et de la réorganisation de l'ancienne Région du Sud sur les accords de gestion participative : non documenté."]
