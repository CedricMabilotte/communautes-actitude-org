resume: >-
  Aux Îles Marshall, la terre est détenue par des lignages matrilinéaires (bwij) et répartie en parcelles (wāto) allant en général du lagon à l'océan. Chaque parcelle superpose des droits hiérarchisés : chef suprême (Iroijlaplap), chef secondaire (Iroijedrik), chef de lignage (Alap) et travailleurs de la terre (Dri Jerbal). La Constitution entrée en vigueur le 1er mai 1979 maintient ce droit coutumier (art. X), interdit toute vente, location ou hypothèque d'une terre coutumière sans l'accord des titulaires de ces quatre rangs, et crée deux institutions : le Conseil des Iroij (Mweo Imon Iroij), formé de douze chefs, qui peut demander au Parlement (Nitijela) de réexaminer les projets de loi touchant la coutume ou la tenure foncière (art. III), et le Tribunal des droits traditionnels (Traditional Rights Court), consulté sur les titres et droits fonciers coutumiers (art. VI, § 4).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination à l'égard des femmes (CEDAW/C/MHL/CO/1-3), § 7 : le Comité invite le Nitijela et le Conseil des Iroij (chefs) à mettre en œuvre ses recommandations ; § 28 et 29 sur la place des femmes au Conseil ; § 40 : les droits fonciers coutumiers reposent sur un système matrilinéaire, mais les décisions sur l'usage des terres sont prises par des hommes.", annee: 2018, source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/MHL/CO/1-3&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République des Îles Marshall (1979, révisée notamment en 1990), art. III (Conseil des Iroij), VI § 4 (Tribunal des droits traditionnels), X (droits traditionnels) et XI (citoyenneté)", nature: "constitution", annee: 1979, source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  - {instrument: "Droit coutumier, défini comme « toute coutume ayant force de loi » dans la République (Constitution, art. XIV § 1 ; art. X § 1)", nature: "coutume_reconnue", annee: 1979, source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution maintient les droits et obligations des Iroijlaplap, Iroijedrik, Alap et Dri Jerbal (art. X § 1) et institue un Conseil des Iroij de douze membres, cinq de la chaîne Ralik et sept de la chaîne Ratak, désignés parmi les Iroijlaplap (art. III § 1). Le Conseil peut examiner toute question et donner son avis au Cabinet, et demander le réexamen de certains projets de loi (art. III § 2) ; la Constitution ne lui donne pas de pouvoir de décision.", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le droit coutumier a force de loi (art. XIV § 1) et n'est pas invalidé par la déclaration des droits (art. X § 1). Le Nitijela peut le déclarer par une loi (art. X § 2 (1)) ; il ne peut dépasser la première lecture d'un tel projet sans qu'une commission mixte du Conseil des Iroij et du Nitijela ait pu rendre un rapport publié (art. X § 2 (3)).", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  justice_propre: {valeur: "partiel", note: "Le Tribunal des droits traditionnels siège en formations d'au moins trois juges représentant toutes les catégories de droits fonciers, y compris Iroijlaplap, Iroijedrik, Alap et Dri Jerbal (art. VI § 4 (1)). Il statue sur les titres et droits fonciers fondés sur la coutume, sur renvoi d'une autre juridiction ; son avis reçoit un « poids substantiel » mais ne lie pas la juridiction qui l'a saisi (art. VI § 4 (3) à (5)).", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  terres: {valeur: "reconnu", note: "Toute aliénation d'une terre coutumière, par vente, hypothèque, bail, licence ou autrement, exige l'accord de l'Iroijlaplap, de l'Iroijedrik le cas échéant, de l'Alap et du Dri Jerbal principal, réputés représenter tous les ayants droit (art. X § 1 (2)). Une étude du Secrétariat du Forum des îles du Pacifique (2008) relève qu'il n'existe pas de terre publique et que les parcelles appartiennent à des groupes de propriétaires.", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Aucune terre coutumière ne peut être cédée sans l'accord des titulaires des quatre rangs de droits (art. X § 1 (2)). En cas d'expropriation, l'indemnité comprend des droits fonciers équivalents ou les moyens d'en tirer la même subsistance, et la Haute Cour doit consulter le Tribunal des droits traditionnels (art. II § 5 (5) et (7)). Le Conseil des Iroij peut, dans les sept jours suivant la transmission d'un projet de loi adopté en troisième lecture, en demander le réexamen s'il touche la coutume ou la tenure foncière ; le Nitijela peut ensuite le confirmer sans modification (art. III § 3 (2) et (7)).", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  langue: {valeur: "reconnu", note: "Les textes marshallais et anglais de la Constitution font également foi ; en cas de divergence, le texte marshallais l'emporte (art. XIV § 5). Le rapport national à l'Examen périodique universel (A/HRC/WG.6/9/MHL/1, 2010, § 6) indique que le marshallais et l'anglais sont langues officielles.", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Douze sièges du Conseil des Iroij sont réservés aux Iroijlaplap, ou au propriétaire pour Likiep, répartis par district (art. III § 1 (2)) ; un membre du Nitijela ne peut y siéger (art. III § 1 (7)). Le Conseil a un rôle consultatif et un droit de demander le réexamen des lois (art. III § 2 et 3) : les sièges sont réservés dans un organe consultatif, non au Nitijela (parlement).", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  statut_personnel: {valeur: "partiel", note: "La détention de droits fonciers, par la personne ou l'un de ses parents, a fondé la citoyenneté des citoyens du Territoire sous tutelle au 1er mai 1979 (art. XI § 1 (1)) et ouvre l'enregistrement comme citoyen (art. XI § 2 (1) (a)) ; l'électeur vote dans le district où il réside ou détient des droits fonciers (art. IV § 3 (3)).", source: "https://rmicourts.org/wp-content/uploads/2022/02/ConstitutionoftheRepublicoftheMarshallIslands_1.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Tribunal des droits traditionnels rend des décisions publiées jusqu'en 2026 sur la succession des titres de lignage ; en 2026, il applique la loi de 2023 sur la succession des titres coutumiers de la chaîne Ralik (39 MIRC) et la règle d'accord de tous les titulaires pour toute aliénation (art. X § 1 (2)). Le rapport national à l'Examen périodique universel (A/HRC/WG.6/9/MHL/1, 2010, § 67) relève que toutes les terres sont privées, que tout projet exige un bail avec les propriétaires et que l'enregistrement foncier reste incomplet ; une étude de 2008 note que les litiges de titres sont fréquents à Majuro et finissent souvent devant les tribunaux, alors qu'à Namdrik ils y parviennent rarement.", source: "https://rmicourts.org/traditional-rights-court-decisions/"}
chronologie:
  - {annee: 1979, evenement: "Entrée en vigueur de la Constitution, le 1er mai : Conseil des Iroij, Tribunal des droits traditionnels, maintien de la tenure coutumière."}
  - {annee: 1990, evenement: "Révisions constitutionnelles adoptées par une convention à Majuro et approuvées par référendum le 11 décembre."}
  - {annee: 2003, evenement: "Création de l'Autorité d'enregistrement foncier (Land Registration Authority) ; toute demande doit être signée par tous les titulaires de rang supérieur."}
  - {annee: 2005, evenement: "La Haute Cour, avec l'avis concordant du Tribunal des droits traditionnels, reconnaît à deux femmes des titres d'Alap et de Dri Jerbal principal à Kwajalein ; un projet de loi réservant le titre d'Alap aux hommes (Bill 84) suit."}
  - {annee: 2018, evenement: "Le Comité CEDAW nomme le Conseil des Iroij dans ses observations finales."}
  - {annee: 2023, evenement: "Loi sur la succession des titres coutumiers de la chaîne Ralik, déclaration du droit coutumier appliquée par le Tribunal des droits traditionnels."}
fiabilite:
  verifie: ["Art. II § 5, III § 1 à 3, IV § 3 (3), VI § 4, X § 1 et 2, XI § 1 et 2, XIV § 1 et 5 de la Constitution (texte consolidé publié par le pouvoir judiciaire).", "Rapport national à l'Examen périodique universel (A/HRC/WG.6/9/MHL/1, 2010), § 6, 7, 11 et 67.", "Observations finales CEDAW/C/MHL/CO/1-3 (2018), § 7, 28 et 40.", "Décisions du Tribunal des droits traditionnels de 2026 citant l'art. X § 1 (2) et la loi de 2023 sur la succession des titres de la chaîne Ralik.", "Étude du Secrétariat du Forum des îles du Pacifique, « Land and Women: The Matrilineal Factor » (2008) : propriété par lignage (bwij), absence de terre publique, loi sur l'enregistrement foncier de 2003, affaire de 2005."]
  non_confirme: ["Population : le nombre de titulaires de droits fonciers n'est pas connu ; le chiffre retenu est la population totale dénombrée en 2021.", "Nombre de parcelles (wāto) et de lignages : aucune statistique nationale trouvée.", "Sort du Bill 84 et contenu des lois de déclaration du droit coutumier : la loi de 2023 sur la succession des titres de la chaîne Ralik (39 MIRC) est citée dans des décisions de 2026, son texte n'a pas été lu ; existence d'une loi équivalente pour la chaîne Ratak non vérifiée.", "Composition actuelle et présidence du Conseil des Iroij.", "Droits des lignages sur le lagon et les récifs : non établis par un texte lu.", "Nombre de villages : non trouvé ; le rapport d'analyse du recensement de 2021 (EPPSO et Communauté du Pacifique, 2024) compte 25 atolls ou îles habités, sans décompte des villages."]
