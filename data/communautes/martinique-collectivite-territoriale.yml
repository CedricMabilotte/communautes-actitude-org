base_nationale:
  - {instrument: "Constitution française, art. 72-3 (Martinique nommée parmi les collectivités régies par l'art. 73) et art. 73 al. 3 à 7 (habilitation à fixer des règles locales ; consentement des électeurs à la création d'une collectivité)", nature: "constitution", annee: 2003, source: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"}
  - {instrument: "Loi organique relative aux collectivités régies par l'article 73 de la Constitution, examinée par le Conseil constitutionnel (décision n° 2011-636 DC du 21 juillet 2011)", nature: "loi_organique", annee: 2011, source: "https://www.conseil-constitutionnel.fr/decision/2011/2011636DC.htm"}
  - {instrument: "Loi n° 2011-884 du 27 juillet 2011 relative aux collectivités territoriales de Guyane et de Martinique", nature: "loi", annee: 2011, source: "https://www.assemblee-nationale.fr/13/dossiers/collectivites_Guyane_Martinique.asp"}
  - {instrument: "Loi n° 2026-574 du 30 juin 2026 habilitant l'Assemblée de Martinique à fixer des règles en matière d'énergie, d'eau et d'assainissement (CGCT, art. LO 7412-1 à LO 7412-3)", nature: "loi", annee: 2026, source: "https://blog.landot-avocats.net/2026/07/01/martinique-la-ctm-pourra-en-partie-fixer-ses-propres-regles-en-matiere-denergie-deau-et-dassainissement/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi n° 2011-884 du 27 juillet 2011 dote la collectivité territoriale de Martinique d'une Assemblée de 51 membres élus et d'un Conseil exécutif de 9 membres élus par l'Assemblée, assistés d'un conseil économique, social et environnemental.", source: "https://www.assemblee-nationale.fr/13/dossiers/collectivites_Guyane_Martinique.asp"}
  pouvoir_normatif: {valeur: "partiel", note: "L'article 73 al. 3 de la Constitution permet d'habiliter la collectivité à fixer des règles dans un nombre limité de matières, hors domaines réservés (al. 4) ; la loi n° 2026-574 du 30 juin 2026 habilite l'Assemblée de Martinique en matière d'efficacité énergétique, de réglementation thermique des bâtiments, d'énergies renouvelables, de mobilité durable et d'organisation de l'eau et de l'assainissement, jusqu'à son prochain renouvellement (CGCT, art. LO 7412-1 à LO 7412-3).", source: "https://blog.landot-avocats.net/2026/07/01/martinique-la-ctm-pourra-en-partie-fixer-ses-propres-regles-en-matiere-denergie-deau-et-dassainissement/"}
  justice_propre: {valeur: "non_applicable", note: "L'article 73 al. 4 de la Constitution exclut l'organisation de la justice, le droit pénal et la procédure pénale des matières ouvertes à habilitation.", source: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La loi n° 2026-574 du 30 juin 2026 permet à l'Assemblée de Martinique de créer une autorité qui regroupe les compétences d'eau et d'assainissement réparties entre les collectivités locales et de fixer des règles sur les énergies renouvelables, à l'exclusion des mesures qui pèsent sur les charges de service public de l'énergie prises en compte dans la péréquation tarifaire (alignement du prix de l'électricité sur celui de l'Hexagone).", source: "https://blog.landot-avocats.net/2026/07/01/martinique-la-ctm-pourra-en-partie-fixer-ses-propres-regles-en-matiere-denergie-deau-et-dassainissement/"}
  consentement: {valeur: "partiel", note: "L'article 73 al. 7 de la Constitution subordonne la création d'une collectivité remplaçant le département et la région au consentement des électeurs (consultation du 24 janvier 2010) ; l'article 73 al. 6 réserve l'habilitation à la demande de la collectivité.", source: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"}
  langue: {valeur: "conteste", note: "La délibération de l'Assemblée de Martinique du 25 mai 2023 reconnaissant le créole comme langue officielle a été annulée le 3 octobre 2024 par le tribunal administratif de la Martinique (n° 2300551), saisi par le préfet, au motif que l'article 2 de la Constitution fait du français la seule langue officielle.", source: "https://martinique.tribunal-administratif.fr/decisions-de-justice/dernieres-decisions/annulation-de-la-deliberation-reconnaissant-la-langue-creole-comme-langue-officielle-de-la-martinique"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "L'article 73 al. 4 de la Constitution exclut la nationalité, les droits civiques et l'état des personnes des matières ouvertes à habilitation.", source: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Selon le rapport de la commission des affaires économiques du Sénat (25 mars 2026), la première habilitation en matière d'énergie, obtenue en 2011, renouvelée en 2016 et expirée en 2021, a été utilisée : deux délibérations du 17 mai 2013 sur le photovoltaïque et une réglementation thermique adoptée en 2013 ; cette réglementation n'a pas été mise à jour et la commission photovoltaïque créée ne s'est jamais réunie. L'usage de l'habilitation de 2026 n'est pas encore documenté.", source: "https://www.senat.fr/rap/a25-463/a25-463-syn.pdf"}
chronologie:
  - {annee: 2003, evenement: "Révision constitutionnelle du 28 mars : l'article 73 ouvre l'habilitation des départements et régions d'outre-mer à fixer des règles locales ; consultation du 7 décembre rejetant une assemblée commune (50,48 % de non)."}
  - {annee: 2010, evenement: "Consultations du 10 janvier (rejet du passage à l'article 74, 79,3 % de non) et du 24 janvier (approbation d'une collectivité régie par l'article 73, 68,4 % de oui)."}
  - {annee: 2011, evenement: "Loi n° 2011-884 du 27 juillet créant la collectivité territoriale de Martinique ; loi organique sur les habilitations validée par la décision n° 2011-636 DC."}
  - {annee: 2013, evenement: "Délibérations du 17 mai sur le photovoltaïque et adoption d'une réglementation thermique propre, sur le fondement de l'habilitation de 2011."}
  - {annee: 2015, evenement: "Premières élections de l'Assemblée de Martinique en décembre ; la collectivité succède au département et à la région."}
  - {annee: 2016, evenement: "Renouvellement de l'habilitation en matière d'énergie."}
  - {annee: 2021, evenement: "Renouvellement de l'Assemblée de Martinique ; fin de l'habilitation en matière d'énergie."}
  - {annee: 2023, evenement: "Délibération du 25 mai reconnaissant le créole comme langue officielle, suspendue le 22 novembre par la cour administrative d'appel de Bordeaux ; délibération demandant une habilitation en matière d'énergie (décembre)."}
  - {annee: 2024, evenement: "Délibération de l'Assemblée de Martinique demandant une habilitation en matière d'eau et d'assainissement (juillet) ; annulation de la délibération sur le créole par le tribunal administratif de la Martinique (3 octobre)."}
  - {annee: 2026, evenement: "Loi n° 2026-574 du 30 juin habilitant l'Assemblée de Martinique en matière d'énergie, d'eau et d'assainissement."}
fiabilite:
  verifie: ["Texte de l'article 72-3, de l'article 73 al. 3, 4, 6 et 7 et de l'article 72-4 de la Constitution (site du Conseil constitutionnel).", "Composition de l'Assemblée (51 membres) et du Conseil exécutif (9 membres) prévue par la loi n° 2011-884 (dossier législatif de l'Assemblée nationale).", "Durée des habilitations limitée au renouvellement de l'assemblée, prorogeable (décision n° 2011-636 DC).", "Contenu de la loi n° 2026-574 et délibérations de 2023 et 2024 (analyses des cabinets Landot & associés et Eurojuris).", "Habilitation en matière d'énergie de 2011, renouvelée en 2016, expirée en 2021, et son usage en 2013 (rapport du Sénat, 25 mars 2026).", "Annulation de la délibération du 25 mai 2023 sur le créole (tribunal administratif de la Martinique, 3 octobre 2024, n° 2300551).", "Population 2023 du département 972 (Insee, 360 630 habitants)."]
  non_confirme: ["Texte consolidé de la loi n° 2026-574 et des articles LO 7412-1 à LO 7412-3 du CGCT (Légifrance inaccessible) : l'analyse publiée est la seule source ouverte.", "Appel éventuel contre le jugement du 3 octobre 2024 sur le créole : non vérifié.", "Superficie (1 128 km²), nombre de communes (34), résultats des consultations de 2003 et 2010 et date des élections de 2015 tirés d'une source encyclopédique ; la densité Insee (319,7 hab./km² en 2023) est cohérente avec cette superficie.", "Pouvoir fiscal (octroi de mer) et représentation parlementaire non documentés par une source ouverte.", "Nombre de villages ou localités habitées : non trouvé."]
