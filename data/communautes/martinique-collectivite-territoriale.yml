resume: >-
  La Martinique est une île des Petites Antilles régie par l'article 73 de la Constitution, qui permet d'adapter les lois et, après habilitation (autorisation donnée par le Parlement), de fixer des règles locales dans un nombre limité de matières. Après la consultation du 24 janvier 2010, la loi n° 2011-884 du 27 juillet 2011 a remplacé le département et la région par une seule collectivité, dotée d'une Assemblée de 51 membres et d'un Conseil exécutif de 9 membres, installée après les élections de décembre 2015. La loi n° 2026-574 du 30 juin 2026 habilite l'Assemblée de Martinique à fixer ses propres règles en matière d'énergie, d'eau et d'assainissement jusqu'au prochain renouvellement de l'Assemblée. Le sujet collectif est la population de l'île ; le droit ne retient aucune désignation ethnique.
