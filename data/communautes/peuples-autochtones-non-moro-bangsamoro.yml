resume: >-
  Les peuples autochtones non moro sont les peuples autochtones de la région bangsamoro qui ne se rattachent pas à l'identité moro : Téduray, Lambangian, Dulangan Manobo, Erumanen ne Menuvu, Higaonon et B'laan. La loi organique bangsamoro de 2018 leur réserve deux sièges au Parlement régional. La loi bangsamoro sur les peuples autochtones (Bangsamoro Autonomy Act No. 64), adoptée le 10 décembre 2024, reconnaît leur propriété sur leurs domaines ancestraux, appelés « fusaka ingëd » (terres, eaux, forêts et ressources), leurs structures politiques coutumières et leur justice coutumière ; elle s'applique aussi aux peuples des îles (Badjao, Sama Dilaut, Jama Mapun, Sama Bangingi, Sama Pangutaran). Pour les domaines situés dans la région, ce régime relève du ministère des affaires des peuples autochtones de la région (MIPA) et non de la Commission nationale des peuples autochtones (NCIP), qui doit lui transférer les demandes en cours ; son règlement d'application est lancé en juin 2025. Le régime national de la loi de 1997 fait l'objet de la fiche « Peuples autochtones des Philippines ».
