  verifie: ["Sections 3 à 9, 13, 16 à 37, 49 à 53, 65, 74, 77 à 86, 98 à 102 et 105 de la loi BAA No. 64 (texte officiel du Parlement bangsamoro).", "Adoption le 10 décembre 2024 par 63 voix sans opposition (MindaNews).", "Art. IV, VII et IX de la loi organique de 2018 (Lawphil).", "Vote des Philippines sur la résolution 61/295 (A/61/PV.107).", "Lancement du règlement d'application le 9 juin 2025 et désignation coutumière des deux représentants le 25 août 2026 (gouvernement bangsamoro).", "Champ d'application de la loi aux peuples des îles, section 3."]
