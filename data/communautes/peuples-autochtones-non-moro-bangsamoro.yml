reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les Philippines votent pour la résolution 61/295 adoptant la Déclaration des Nations unies sur les droits des peuples autochtones (A/61/PV.107) ; la loi bangsamoro de 2024 l'intègre au cadre politique régional (section 4 i).", annee: 2007, source: "https://docs.un.org/fr/A/61/PV.107"}
base_nationale:
  - {instrument: "Republic Act No. 11054, loi organique de la Région autonome bangsamoro en Mindanao musulman, art. IV, sections 9 et 10, art. VII, sections 7 et 8, art. IX, section 3", nature: "loi_organique", annee: 2018, source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  - {instrument: "Bangsamoro Autonomy Act No. 64, loi bangsamoro sur les peuples autochtones de 2024 (Bangsamoro Indigenous Peoples' Act)", nature: "loi", annee: 2024, source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le gouvernement bangsamoro reconnaît les structures politiques autochtones (conseils des anciens, conseil des Timuay, Timuay Justice and Governance, Gempa te Kalindaan ne Kamal, Kena Menuwa, Alimbubungan) comme organes de décision des communautés, loi de 2024, sections 16, 17 et 19 ; les collectivités locales propres (« tribal LGUs ») restent une simple faculté (section 28).", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les structures politiques autochtones renforcent et administrent le droit coutumier dans leurs domaines ancestraux, loi de 2024, section 19 b et f ; le droit coutumier s'applique en premier pour la propriété, la succession et les litiges fonciers (section 37).", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  justice_propre: {valeur: "partiel", note: "Primauté du droit coutumier pour les litiges entre membres des peuples autochtones et justice coutumière compétente pour les relations personnelles, familiales et foncières, compatible avec le système juridique national, loi de 2024, sections 34 à 37 ; loi organique de 2018, art. IX, section 3 c. La compétence se limite à ces domaines.", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  terres: {valeur: "reconnu", note: "Propriété des domaines ancestraux (fusaka ingëd) détenue à perpétuité, inaliénable, et titre de domaine ancestral (Certificate of Ancestral Domain Title, CADT) délivré par le MIPA sur délimitation par les communautés elles-mêmes, loi de 2024, sections 6, 8, 9, 13 et 65.", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  ressources: {valeur: "partiel", note: "Part d'au moins 10 % des recettes tirées des ressources naturelles des territoires couverts par un titre autochtone ou coutumier, droits prioritaires d'exploitation et redevance d'au moins 1 % du revenu brut, loi de 2024, sections 77, 78 et 80 ; les demandes d'exploitation du sous-sol sont transmises par le MIPA au ministère régional de l'environnement (MENRE) après avis favorable du conseil coutumier et consentement préalable (section 79).", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  consentement: {valeur: "reconnu", note: "Aucune concession, licence, bail ou projet ne peut être accordé sans certificat préalable du MIPA, délivré seulement après le consentement libre, préalable et éclairé des communautés, loi de 2024, sections 84 et 86 ; loi organique de 2018, art. IX, section 3 e.", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La langue autochtone locale est la langue d'enseignement et les communautés gardent le droit d'établir leurs propres systèmes éducatifs, loi de 2024, section 52 ; une université autochtone (« Tribal University ») est prévue, sa charte relevant d'une loi ultérieure (section 53).", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  fiscalite: {valeur: "partiel", note: "Exonération des domaines ancestraux de l'impôt foncier, fonds des domaines ancestraux doté de 200 millions de pesos et bureau de développement des fusaka ingëd (FIDO) doté de l'autonomie financière, loi de 2024, sections 20, 74 et 98 ; aucun pouvoir fiscal propre.", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  representation: {valeur: "reconnu", note: "Deux sièges réservés aux peuples autochtones non moro au Parlement bangsamoro, pourvus selon leur droit coutumier, loi organique de 2018, art. VII, sections 7 c et 8 ; représentant autochtone obligatoire dans les conseils locaux, loi de 2024, sections 29 à 31.", source: "https://lawphil.net/statutes/repacts/ra2018/ra_11054_2018.html"}
  statut_personnel: {valeur: "partiel", note: "Les structures politiques autochtones célèbrent les mariages et concourent à la délivrance des certificats de mariage coutumier et d'appartenance au peuple, loi de 2024, section 19 d ; droit de garder son identité autochtone en plus de l'identité politique bangsamoro, loi organique de 2018, art. IV, section 10.", source: "https://parliament.bangsamoro.gov.ph/wp-content/uploads/2025/01/BAA-64-–-Bangsamoro-Indigenous-Peoples-Act-of-2024.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Le règlement d'application (393 sections), prévu dans un délai de 90 jours (section 100), est lancé par le MIPA le 9 juin 2025, selon le gouvernement régional. Les deux sièges réservés sont pourvus par sélection coutumière le 25 août 2026 pour le premier Parlement élu. Aucune source indépendante consultée ne donne le nombre de titres de domaine ancestral délivrés ni l'application de la justice coutumière.", source: "https://bangsamoro.gov.ph/news/latest-news/bipa-irr-advances-ips-rights-to-ancestral-domains-self-governance-in-barmm/"}
chronologie:
  - {annee: 2007, evenement: "Les Philippines votent pour la Déclaration des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2018, evenement: "La loi organique bangsamoro (Republic Act No. 11054) réserve deux sièges du Parlement régional aux peuples autochtones non moro."}
  - {annee: 2024, evenement: "Le 10 décembre, le Parlement de transition adopte à l'unanimité (63 voix) la loi bangsamoro sur les peuples autochtones (BAA No. 64)."}
  - {annee: 2025, evenement: "Le 9 juin, le MIPA lance le règlement d'application de la loi."}
  - {annee: 2026, evenement: "Le 25 août, les communautés téduray et lambangian désignent selon leur droit coutumier les deux représentants des peuples autochtones non moro au premier Parlement bangsamoro élu."}
