resume: >-
  La Constitution des Palaos de 1981, révisée en 1992, reconnaît le rôle des chefs traditionnels et place le droit traditionnel au même rang que la loi écrite : en cas de conflit, la loi ne l'emporte que si elle ne contredit pas les principes du droit traditionnel (art. V). Un Conseil des chefs, formé d'un chef traditionnel par État, conseille le président sur la coutume (art. VIII, s. 6). Les seize États, dont l'organisation suit les « traditions des Palaos », ont la propriété des ressources jusqu'à 12 milles marins et un pouvoir fiscal (art. I, XI et XII). La Constitution prévoit aussi la restitution aux propriétaires d'origine des terres prises par les puissances occupantes (art. XIII, s. 10). Les États de Sonsorol et de Hatohobei et le réseau des aires protégées font aussi l'objet de fiches distinctes.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'enfant sur le rapport initial des Palaos (CRC/C/15/Add.149), § 3 et 4 : le Comité nomme le Conseil des chefs parmi les acteurs associés à la préparation du rapport et note que le Comité national sur la population et l'enfance (CoPopChi) travaille en coopération avec lui ; § 34 à 36 sur le droit coutumier appliqué aux affaires familiales.", annee: 2001, source: "https://documents.un.org/api/symbol/access?s=CRC/C/15/Add.149&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la République des Palaos (1981, révisée en 1992), art. I, V, VIII (s. 6), IX, XI, XII et XIII", nature: "constitution", annee: 1981, source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  - {instrument: "Droit traditionnel des Palaos, « également faisant autorité » avec la loi écrite (Constitution, art. V, s. 2)", nature: "coutume_reconnue", annee: 1981, source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'État ne peut supprimer le rôle ou la fonction d'un chef traditionnel reconnu par la coutume (art. V, s. 1) ; un Conseil des chefs, un chef par État nommé selon la tradition et reconnu par le conseil des chefs de son État, conseille le président (art. VIII, s. 6) ; l'organisation des États suit les principes démocratiques et les « traditions des Palaos » (art. XI, s. 1). Le rôle du Conseil est consultatif.", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "« La loi écrite et le droit traditionnel font également autorité » ; en cas de conflit, la loi ne l'emporte que dans la mesure où elle ne contredit pas les principes du droit traditionnel (art. V, s. 2).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'État devait, dans les cinq ans, restituer à leurs propriétaires d'origine ou à leurs héritiers les terres devenues publiques par l'acquisition des puissances occupantes par la force, la contrainte, la fraude ou sans juste indemnité (art. XIII, s. 10) ; seuls les citoyens des Palaos et les sociétés qu'ils détiennent entièrement peuvent acquérir un titre sur les terres et les eaux (art. XIII, s. 8). Le texte ne nomme pas les clans comme titulaires.", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  ressources: {valeur: "partiel", note: "Chaque État a la propriété exclusive des ressources vivantes et non vivantes, hors grands migrateurs, de la terre jusqu'à 12 milles marins des lignes de base traditionnelles, « sous réserve que les droits et pratiques de pêche traditionnels ne soient pas atteints » (art. I, s. 2) ; les recettes tirées de cette zone reviennent à l'État (art. XII, s. 6). Le titulaire est l'État, collectivité publique, et non la chefferie.", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  consentement: {valeur: "partiel", note: "Aucun bien ne peut être pris par le gouvernement national sans consultation préalable du gouvernement de l'État où il se trouve ; l'expropriation n'intervient qu'en dernier recours, après négociation de bonne foi avec le propriétaire (art. XIII, s. 7).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  langue: {valeur: "reconnu", note: "« Les langues traditionnelles des Palaos sont les langues nationales » ; le paluan et l'anglais sont langues officielles (art. XIII, s. 1).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Sous réserve des lois du Congrès national (Olbiil Era Kelulau), les législatures des États peuvent lever des impôts (art. XI, s. 3) ; les États perçoivent les recettes des ressources et les amendes de la zone des 12 milles (art. XII, s. 6) ; aucun impôt ne frappe la terre (art. XIII, s. 9).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  representation: {valeur: "partiel", note: "La Chambre des délégués compte un délégué élu par État (art. IX, s. 3) ; le Conseil des chefs représente les chefs traditionnels auprès du président (art. VIII, s. 6).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  statut_personnel: {valeur: "partiel", note: "Le droit traditionnel fait autorité au même titre que la loi (art. V, s. 2) ; le Comité des droits de l'enfant relève en 2001 que les affaires familiales sont en général réglées selon le droit coutumier (CRC/C/15/Add.149, § 34 et 36).", source: "https://documents.un.org/api/symbol/access?s=CRC/C/15/Add.149&l=en&t=pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "« Aucun État ne peut faire sécession des Palaos » (art. XIII, s. 4).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
effectivite: {valeur: "partielle", note: "Le Comité des droits de l'enfant relève en 2001 que le Conseil des chefs a pris part à la préparation du rapport national et que les affaires familiales sont en général réglées selon le droit coutumier (CRC/C/15/Add.149, § 3 et 36). La presse locale montre des titres attribués selon la coutume mais disputés : le 22 février 2022, le conseil des chefs de Koror (Ngarameketii) accepte Alexander Merep comme Ibedul alors qu'une autre candidature avait été désignée au sein du clan Idid (Island Times, 25 février 2022) ; en juin 2022, l'ancien président Johnson Toribiong appelle les chefs à exercer leur rôle, faute de quoi les titres et la coutume disparaîtraient (Island Times, 17 juin 2022). Aucune source indépendante sur les avis rendus par le Conseil des chefs n'a été consultée.", source: "https://islandtimes.org/if-your-titles-die-out-so-will-our-palauan-culture-toribiong/"}
chronologie:
  - {annee: 1981, evenement: "Entrée en vigueur de la Constitution, le 1er janvier : droit traditionnel, Conseil des chefs, seize États."}
  - {annee: 1992, evenement: "Révision de la Constitution."}
  - {annee: 1994, evenement: "Fin de la tutelle de l'ONU et entrée en vigueur du Compact de libre association avec les États-Unis, le 1er octobre."}
  - {annee: 2001, evenement: "Le Comité des droits de l'enfant nomme le Conseil des chefs dans ses observations finales."}
  - {annee: 2022, evenement: "Le 22 février, le conseil des chefs de Koror accepte Alexander Merep comme Ibedul ; la succession est disputée au sein du clan Idid."}
