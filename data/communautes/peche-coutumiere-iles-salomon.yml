  - {instrument: "Fisheries Management Act 2015 (n° 2 de 2015), art. 2, 3, 5, 14, 17 à 21 et 131 (3), deuxième annexe", nature: "loi", annee: 2015, source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
  - {instrument: "Fisheries Management Regulations 2017 (avis légal n° 2, Journal officiel du 11 janvier 2017)", nature: "loi", annee: 2017, source: "https://faolex.fao.org/docs/pdf/sol179389.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le titulaire de droits coutumiers est la ou les personnes autorisées par le droit coutumier à donner, au nom des propriétaires, la permission de pêcher (loi de 2015, art. 2). Un plan communautaire de gestion des pêches est approuvé par l'exécutif provincial et par un comité de gestion représentant les titulaires de droits coutumiers (art. 17 (2) (c) et 18 (3)), et soumis aussi au directeur des pêches (art. 18 (5)). La loi ne fixe ni la composition ni le mode de désignation de ce comité.", source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le plan communautaire peut fixer des mesures de gestion, des amendes et sanctions et des pouvoirs de contrôle, qui ont l'effet juridique d'un arrêté local (« bye-law ») après adoption par l'assemblée provinciale et publication au Journal officiel (loi de 2015, art. 18 (7)). Limites : le plan doit être compatible avec les ordonnances et plans provinciaux (art. 18 (4)), l'exécutif provincial et le directeur des pêches peuvent s'y opposer dans les 60 jours (art. 18 (6)), et le directeur peut le modifier après consultation des communautés (art. 18 (8)).", source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi définit la zone de droits coutumiers comme les eaux que les communautés autochtones des Îles Salomon possèdent, utilisent ou occupent selon l'usage coutumier actuel (loi de 2015, art. 2), et dispose que les droits coutumiers sont « pleinement reconnus et respectés » dans toute activité qu'elle régit (art. 21 (1)). Elle ne prévoit pas d'inscription de ces zones ; un plan communautaire ne peut dépasser l'étendue des droits de la communauté ni le bord externe du récif, et sa zone doit y être délimitée (art. 18 (2)).", source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
  ressources: {valeur: "partiel", note: "La loi ne s'applique pas à la pêche coutumière (pêche non commerciale, selon les méthodes traditionnelles, en petit bateau à un seul moteur au plus) ni aux bateaux qui la pratiquent, sauf plan de gestion contraire (loi de 2015, art. 2 et 3 (2)) ; la reconnaissance des droits coutumiers et l'accès à la pêche coutumière font partie de ses principes (art. 5 (1) (m)). La Haute Cour peut ordonner une indemnisation du titulaire en cas d'atteinte aux droits coutumiers (art. 21 (4)). Limite : en cas de doute sur le caractère coutumier d'une pêche, la décision du ministre est définitive (art. 3 (3)).", source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
  consentement: {valeur: "reconnu", note: "Nul ne peut, sans la permission des titulaires de droits coutumiers, pêcher, entrer ou causer des destructions dans une zone de droits coutumiers avec un autre bateau que ceux de la pêche coutumière ; l'infraction est punie d'amende et jusqu'à un an d'emprisonnement (loi de 2015, art. 21 (2) et (3)). La déclaration d'une aire marine protégée ou gérée nationale incluant une zone de droits coutumiers exige l'accord des titulaires (art. 19 (4)). Chaque plan communautaire est accompagné du consentement écrit des titulaires (deuxième annexe, § 13), et les titulaires sont consultés sur tout plan de gestion qui concerne leurs eaux (deuxième annexe, § 1 (3)).", source: "https://faolex.fao.org/docs/pdf/sol153557.pdf"}
