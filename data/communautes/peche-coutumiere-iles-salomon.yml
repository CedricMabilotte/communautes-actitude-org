resume: >-
  La loi sur la gestion des pêches de 2015 (Fisheries Management Act, n° 2 de 2015), promulguée le 8 mai 2015, reconnaît les droits coutumiers (« customary rights ») que les communautés autochtones des Îles Salomon exercent sur des zones des eaux de pêche du fait de leur usage historique, attesté par les chefs coutumiers (art. 2). Elle ne s'applique pas à la pêche coutumière non commerciale, sauf plan de gestion contraire (art. 3 (2)), et interdit de pêcher avec un autre bateau que ceux de la pêche coutumière dans une zone de droits coutumiers sans la permission des titulaires (art. 21 (2)). Les titulaires peuvent établir un plan communautaire de gestion des pêches, soumis à l'approbation de l'exécutif provincial, du directeur des pêches et d'un comité qui les représente (approbation réputée acquise sans objection dans les 60 jours), dont les règles prennent valeur d'arrêté local (« bye-law », texte réglementaire local) après adoption par l'assemblée provinciale et publication au Journal officiel (art. 17 (2) (c) et 18 (3) à (7)). Le ministère des Pêches met en œuvre ce régime par la gestion communautaire des ressources (Community Based Resource Management, CBRM). Les régimes fonciers et les aires protégées font l'objet des fiches « Terres coutumières des Îles Salomon » et « Aires protégées coutumières des Îles Salomon ».
