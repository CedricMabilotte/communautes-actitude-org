effectivite: {valeur: "partielle", note: "La politique nationale des pêches 2019-2029 indique que le nombre de communautés ayant pratiqué une forme de gestion communautaire est passé de « quelques-unes » à « plus de 300 » en une quinzaine d'années (p. 3). Le bilan provincial du ministère des Pêches et de WorldFish (2022) indique que l'ordonnance des pêches de Choiseul, révisée et adoptée par l'assemblée provinciale en 2020, reste en attente au cabinet du procureur général, et que l'enregistrement des plans de deux communautés de cette province attend sa mise au point. Une note de la Banque mondiale (2024), citant ce bilan, relève que les plans de gestion communautaire n'ont d'autorité pour leur application qu'à travers les systèmes villageois, sauf publication au Journal officiel qui leur donne valeur d'arrêté local, et que l'absence de règlements à jour dans certaines provinces limite l'application des règles communautaires.", source: "https://documents1.worldbank.org/curated/en/099071624162524055/pdf/P1743531b641cf0df1aa09105fb4074f5cb.pdf"}
chronologie:
  - {annee: 2015, evenement: "Le 23 avril, le Parlement national vote la loi sur la gestion des pêches ; promulgation le 8 mai. Elle abroge la loi sur les pêches de 1998 et étend les compétences des provinces en matière de pêche."}
  - {annee: 2017, evenement: "Le 11 janvier, publication au Journal officiel du règlement d'application de la loi (avis légal n° 2)."}
  - {annee: 2017, evenement: "Stratégie du ministère des Pêches 2017-2019 : objectif d'enregistrer les plans communautaires de gestion des pêches au titre de la loi d'ici 2019."}
  - {annee: 2019, evenement: "Politique nationale des pêches 2019-2029 : toutes les pêches sous tenure marine coutumière doivent être gérées par des outils de gestion communautaire."}
  - {annee: 2020, evenement: "L'assemblée provinciale de Choiseul adopte une ordonnance des pêches révisée, en attente de validation par le procureur général en 2022."}
