  verifie: ["Texte de la loi de 2015 (FAOLEX, copie numérisée) : dates du vote et de la promulgation, art. 1, 2 (définitions de « customary fishing », « customary rights area », « customary rights », « customary rights holder »), 3 (2) et (3), 5 (1) (m) et (n), 14, 17 à 21, 131 (3) et deuxième annexe, § 8 à 17.", "Règlement de 2017 publié au Journal officiel extraordinaire n° 4 du 11 janvier 2017, avis légal n° 2 (FAOLEX).", "Passages du sixième rapport national à la CDB (2019) sur l'institutionnalisation de la gestion communautaire par la loi de 2015.", "Politique nationale des pêches 2019-2029, p. 3, 8 et 11 (FAOLEX).", "Bilan provincial MFMR/WorldFish 2022 : ordonnance de Choiseul (2011, révisée en 2020, en attente), ordonnance d'Isabel de 2006 sur la gestion des ressources, élaboration d'ordonnances provinciales des pêches appuyée par le programme régional PROP à Malaita, Guadalcanal, dans la province Occidentale et à Choiseul."]
  non_confirme: ["Date d'entrée en vigueur de la loi : elle dépend d'un avis ministériel (art. 1) qui n'a pas été trouvé ; la publication du règlement d'application en janvier 2017 suppose qu'elle était en vigueur à cette date.", "Nombre de plans communautaires approuvés et publiés au Journal officiel au titre de l'art. 18 : aucune liste officielle trouvée.", "Le chiffre de 158 sites actifs (CPS) n'est pas daté et ne distingue pas les plans enregistrés des pratiques coutumières non écrites.", "Population : non trouvée.", "Surface : non trouvée ; le rapport de la Communauté du Pacifique (Govan et Lalavanua, 2022) indique la surface des sites comme inconnue."]
