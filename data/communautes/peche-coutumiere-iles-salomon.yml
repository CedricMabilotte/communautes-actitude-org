reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national des Îles Salomon à la Convention sur la diversité biologique (2019), p. 86 et section 3.2.3 : la gestion communautaire des ressources (CBRM), qui « reconnaît aux propriétaires des terres et de la mer » le droit d'élaborer des règles de gestion et de les faire appliquer, a été « institutionnalisée » par la loi de 2015 sur la gestion des pêches", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/sb-nr-06-en.pdf"}
