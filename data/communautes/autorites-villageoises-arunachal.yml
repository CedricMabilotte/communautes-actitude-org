resume: >-
  Fiche agrégée : elle couvre les tribus répertoriées de l'Arunachal Pradesh, dont les Adi, les Nyishi, les Galo, les Apatani et les Monpa. Le règlement de 1945 sur l'administration de la justice dans la frontière de l'Assam reconnaît les autorités villageoises, comme le kebang (conseil de village) des Adi ou les chefs de village (gaon bura). La loi de 2021 sur les tribunaux civils de l'État fait du tribunal coutumier un degré de juridiction et lui confie tous les procès civils entre autochtones de l'État, sans limite de valeur. L'entrée des non-résidents est soumise à un permis (Inner Line Permit) depuis un règlement de 1873.
