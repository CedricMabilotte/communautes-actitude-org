resume: >-
  Nevis est la plus petite des deux îles qui forment la fédération de Saint-Christophe-et-Niévès, indépendante depuis le 19 septembre 1983. Le chapitre X de la Constitution de 1983 lui donne une législature propre : l'Assemblée de l'île de Nevis, qui vote des ordonnances (lois locales) sur une liste de matières réservées, et l'Administration de l'île de Nevis, dirigée par un Premier ministre de l'île (Premier). L'île dispose d'un fonds budgétaire propre et d'une part constitutionnelle des recettes fiscales. L'article 113 lui ouvre la sécession par une loi de son Assemblée approuvée par référendum à la majorité des deux tiers ; le référendum du 10 août 1998 n'a pas atteint ce seuil.
