base_nationale:
  - {instrument: "Constitution de Saint-Christophe-et-Niévès (Saint Christopher and Nevis Constitution Order 1983), chap. X (art. 100 à 114), art. 37 et 38, annexes 2, 3 et 5", nature: "constitution", annee: 1983, source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée de l'île de Nevis composée de membres élus dans au moins cinq circonscriptions de l'île et d'au moins trois membres nommés (au plus les deux tiers du nombre d'élus), et Administration de l'île de Nevis dirigée par un Premier issu de la majorité de l'Assemblée et responsable devant elle (Constitution de 1983, art. 100 à 102 et 104).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "La législature de Nevis vote des ordonnances sur les matières de l'annexe 5 (agriculture, eau, logement, routes, électricité, terres, entreprises, emprunts, etc.), où le Parlement fédéral ne peut légiférer qu'avec le consentement de l'Administration, sauf déclaration du gouverneur général pour les affaires étrangères ou la défense ; le Parlement peut ajouter des matières à la liste à la majorité des deux tiers (Constitution de 1983, art. 37(2) à (6), art. 103 et annexe 5).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La législature de Nevis légifère sur les terres et bâtiments de l'île, y compris leur détention par des non-citoyens, hors terres et bâtiments de la Couronne affectés à l'usage du gouvernement fédéral (annexe 5 point 15) ; l'Administration administre ces derniers à Nevis et fournit les terrains requis par le gouvernement fédéral, qui indemnise les particuliers lésés et l'Administration pour les bâtiments qu'elle avait payés (Constitution de 1983, art. 106(1)(g) et 106(3)). Il s'agit d'une compétence de collectivité, pas d'une propriété collective.", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  ressources: {valeur: "partiel", note: "Compétence législative sur la conservation et la distribution de l'eau et sur la production d'électricité (annexe 5, points 8 et 16) ; responsabilité exclusive d'administration de l'extraction des minerais et de la pêche, dans le respect de la politique générale fixée par le Premier ministre fédéral (Constitution de 1983, art. 106(1)(c), (d) et 106(2)).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  consentement: {valeur: "reconnu", note: "Toute révision du chapitre X (sauf art. 104 et 108(2)) ou des annexes 2 et 5 exige, après le vote du Parlement, un référendum approuvé par les deux tiers des suffrages exprimés à Saint-Christophe et par les deux tiers à Nevis (Constitution de 1983, art. 38(3) et annexe 1) ; les règles de partage des recettes et d'emprunt exigent l'accord du Premier de Nevis (art. 110(4) et 111(2)).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'Administration a la responsabilité exclusive d'administrer l'éducation à Nevis, selon les lois en vigueur et sans pouvoir agir contre la politique générale du gouvernement fédéral signifiée par écrit (Constitution de 1983, art. 106(1)(b) et 106(2)).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  fiscalite: {valeur: "reconnu", note: "Fonds consolidé de l'île de Nevis voté par l'Assemblée ; le produit de tous les impôts perçus dans la fédération est partagé selon la part de Nevis dans la population recensée, déduction faite d'une contribution aux services communs et à la dette ; emprunts et subventions relèvent de la législature de Nevis, dans les limites fixées par règlement avec l'accord du Premier ; le pouvoir fiscal propre se limite aux droits et taxes énumérés à l'annexe 5, partie 2 (taxes foncières, taxes sur les hôtels, bars et débits de boissons, redevances) (Constitution de 1983, art. 108, 110 et 111, annexe 5 point 5 et partie 2).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  representation: {valeur: "reconnu", note: "Au moins trois circonscriptions de l'Assemblée nationale sont situées à Nevis (contre au moins huit à Saint-Christophe), et au moins un tiers si leur nombre dépasse onze (Constitution de 1983, annexe 2, règle 1).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "La législature de Nevis peut mettre fin à l'appartenance de l'île à la fédération par une loi votée par les deux tiers des élus de l'Assemblée, approuvée par référendum à Nevis par les deux tiers des suffrages exprimés, après publication d'un projet détaillé de constitution future (Constitution de 1983, art. 113 et 115, annexe 3).", source: "https://www.gov.kn/wp-content/uploads/2020/07/constitution-of-st-kitts-and-nevis.pdf"}
effectivite: {valeur: "effective", note: "Freedom House (rapport 2023) relève que Nevis a sa propre législature, avec cinq élus et trois membres nommés, et que le Mouvement des citoyens concernés (CCM) a remporté trois sièges aux élections de décembre 2022 ; l'Assemblée a adopté l'ordonnance sur les jeux en ligne en 2025 et examiné en première lecture quatre projets d'ordonnances sur les services financiers le 14 juillet 2026 (Administration de l'île de Nevis) ; le référendum de sécession de 1998 s'est tenu selon l'article 113 (base Direct Democracy).", source: "https://freedomhouse.org/country/st-kitts-and-nevis/freedom-world/2023"}
chronologie:
  - {annee: 1983, evenement: "Indépendance de la fédération de Saint-Christophe-et-Niévès le 19 septembre ; la Constitution crée l'Assemblée et l'Administration de l'île de Nevis (chap. X)."}
  - {annee: 1997, evenement: "Première lecture du projet de loi de sécession à l'Assemblée de Nevis le 13 octobre."}
  - {annee: 1998, evenement: "Deuxième lecture le 7 juillet (6 voix contre 2) ; référendum du 10 août : 2 427 oui et 1 498 non, soit 61,8 % des suffrages valables (61,7 % des 3 935 votants), sous le seuil des deux tiers."}
  - {annee: 2022, evenement: "Élection de l'Assemblée de l'île de Nevis en décembre : trois sièges au Mouvement des citoyens concernés (CCM), deux au Parti de la réforme de Nevis (NRP)."}
