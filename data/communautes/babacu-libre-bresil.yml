resume: >-
  Les quebradeiras de coco babaçu, casseuses de noix du palmier babaçu (Attalea speciosa), sont des femmes qui collectent et ouvrent ces noix pour en tirer huile, farine et charbon. Depuis la loi municipale n° 05/1997 de Lago do Junco (Maranhão), des lois municipales dites « Babaçu livre » (babaçu libre) déclarent les palmiers « de libre accès et d'usage commun » pour elles et leurs familles, y compris sur des terres privées ; la plupart interdisent aussi de les abattre, de les brûler ou de les traiter aux pesticides. En 2023, 17 communes avaient une telle loi ; la loi n° 7.888 du 9 décembre 2022 de l'État du Piauí étend l'accès libre à tout l'État et prévoit des titres collectifs inaliénables. L'État fédéral les nomme parmi les segments des peuples et communautés traditionnels représentés au Conseil national (décret n° 8.750 de 2016). Les réserves extractivistes font l'objet de la fiche « Réserves extractivistes (RESEX) du Brésil ».
