base_nationale:
  - {instrument: "Loi municipale n° 05/1997 de Lago do Junco (Maranhão), première loi « Babaçu livre », complétée par la loi municipale n° 01/2002", nature: "loi", annee: 1997, source: "https://miqcb.org.br/babacu-livre-para-todas-o-legado-da-lei-pioneira-de-lago-do-junco-e-os-caminhos-para-uma-lei-federal/"}
  - {instrument: "Loi ordinaire n° 1.084/2003 du 4 novembre 2003 de la commune d'Imperatriz (Maranhão) sur l'interdiction d'abattre les palmiers babaçu", nature: "loi", annee: 2003, source: "https://www.camaraimperatriz.ma.gov.br/upload/leis/Lei_n%C2%BA_1084-03.pdf"}
  - {instrument: "Loi de l'État du Tocantins n° 1.959/2008 sur l'interdiction de brûler, d'abattre et d'exploiter de façon prédatrice les palmiers babaçu", nature: "loi", annee: 2008, source: "https://nadir.fflch.usp.br/sites/nadir.fflch.usp.br/files/upload/paginas/Babacu%20Livre-%20Carlos%20Gondim%20(1).pdf"}
  - {instrument: "Décret fédéral n° 8.750 du 9 mai 2016 sur le Conseil national des peuples et communautés traditionnels, art. 4, § 2, XXII (« quebradeiras de coco babaçu »)", nature: "loi", annee: 2016, source: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/decreto/d8750.htm"}
  - {instrument: "Loi de l'État du Piauí n° 7.888 du 9 décembre 2022 reconnaissant comme patrimoine culturel la collecte et le cassage traditionnels de la noix de babaçu", nature: "loi", annee: 2022, source: "https://sapl.al.pi.leg.br/media/sapl/public/normajuridica/2022/5438/lei_7888.pdf"}
  - {instrument: "Loi fédérale n° 15.431 du 10 juin 2026 reconnaissant le métier des casseuses de noix de babaçu des États du Tocantins, du Maranhão, du Piauí et du Pará comme manifestation de la culture nationale", nature: "loi", annee: 2026, source: "https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/lei/L15431.htm"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi du Piauí n° 7.888/2022 (art. 5, I et II, et art. 14) prévoit que l'accès aux palmeraies « pourra » passer par l'attribution aux communautés de casseuses de terres publiques et de terres achetées par l'État, en propriété communautaire et inaliénable, et charge l'Institut des terres du Piauí (INTERPI) de leur identification, de leur délimitation et de la délivrance de titres collectifs ; le texte ne vaut que pour cet État.", source: "https://sapl.al.pi.leg.br/media/sapl/public/normajuridica/2022/5438/lei_7888.pdf"}
  ressources: {valeur: "partiel", note: "La loi d'Imperatriz n° 1.084/2003 (art. 1) déclare les palmiers babaçu de la commune « de libre accès et d'usage commun » des casseuses et de leurs familles en économie familiale et communautaire ; la loi du Piauí n° 7.888/2022 (art. 3, 4 et 10, I) garantit ce libre accès dans l'État et punit d'une amende journalière de 2 000 réais tout obstacle ou toute demande de paiement. Selon Gondim (2023), la loi d'État du Maranhão n° 8.185/2004 limite l'accès libre aux terres publiques inoccupées ; ailleurs, l'accès dépend des lois municipales.", source: "https://www.camaraimperatriz.ma.gov.br/upload/leis/Lei_n%C2%BA_1084-03.pdf"}
  consentement: {valeur: "partiel", note: "La loi du Piauí n° 7.888/2022 (art. 2, § único) garantit aux communautés de casseuses la consultation préalable, libre et informée « nos termos da Convenção 169, da OIT » ; l'usage du fonds créé par l'art. 12 est fixé « obrigatoriamente, mediante consulta prévia » de ces communautés. Ces règles ne valent que dans cet État.", source: "https://sapl.al.pi.leg.br/media/sapl/public/normajuridica/2022/5438/lei_7888.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le décret fédéral n° 8.750/2016 (art. 4, § 2, XXII) range les « quebradeiras de coco babaçu » parmi les segments représentés au Conseil national des peuples et communautés traditionnels, organe consultatif ; la loi du Piauí n° 7.888/2022 (art. 17) crée une commission de suivi de la loi composée en majorité des organisations des casseuses, des autres peuples traditionnels et des agriculteurs familiaux.", source: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/decreto/d8750.htm"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon une étude d'ActionAid Brasil (2015), l'application des lois se heurte aux propriétaires fonciers et dépend du contrôle exercé par les casseuses elles-mêmes, comme à Lago do Junco ; certaines lois ont été réécrites pour soumettre l'accès à l'accord du propriétaire. Gondim (2023) rapporte qu'en décembre 2022 un projet de loi (n° 776/2022) visant à abroger la loi du Tocantins a été retiré par son auteur après mobilisation des casseuses ; selon le MIQCB (2025), aucune nouvelle loi municipale n'a été adoptée au Maranhão depuis 2012.", source: "https://www.actionaid.org.br/documents/24/1493418575quebradeiras_actionaid_port_rev1.pdf"}
chronologie:
  - {annee: 1996, evenement: "Dépôt à la Chambre des députés du projet de loi fédérale n° 1.428/1996 « Babaçu livre », classé puis présenté de nouveau trois fois sans adoption."}
  - {annee: 1997, evenement: "Lago do Junco (Maranhão) adopte la première loi municipale « Babaçu livre » (n° 05/1997)."}
  - {annee: 2002, evenement: "Loi municipale n° 01/2002 de Lago do Junco : interdiction d'abattre les palmiers, d'utiliser des pesticides et de vendre la noix entière aux charbonneries."}
  - {annee: 2003, evenement: "Loi n° 1.084/2003 d'Imperatriz (Maranhão) ; lois de Buriti do Tocantins, Axixá do Tocantins et Praia Norte (Tocantins)."}
  - {annee: 2008, evenement: "Loi de l'État du Tocantins n° 1.959/2008 : libre accès aux palmiers sur les terres publiques et accords avec les propriétaires privés."}
  - {annee: 2012, evenement: "Loi municipale n° 0168/2012 de São Pedro da Água Branca, dernière loi « Babaçu livre » adoptée au Maranhão selon le MIQCB (2025)."}
  - {annee: 2016, evenement: "Le décret n° 8.750 nomme les casseuses de noix de babaçu parmi les segments du Conseil national des peuples et communautés traditionnels."}
  - {annee: 2022, evenement: "Loi de l'État du Piauí n° 7.888 du 9 décembre : libre accès aux palmeraies, consultation préalable, titres collectifs et commission de suivi."}
  - {annee: 2022, evenement: "Au Tocantins, le projet de loi n° 776/2022 qui abrogeait la loi n° 1.959/2008 est retiré par son auteur."}
  - {annee: 2026, evenement: "Loi fédérale n° 15.431 du 10 juin, publiée le 11 juin, reconnaissant leur métier comme manifestation de la culture nationale."}
fiabilite:
  verifie: ["Texte de la loi du Piauí n° 7.888 du 9 décembre 2022 (art. 2, 3, 4, 5, 10, 12, 14 et 17), lu au Journal officiel de l'État publié par l'Assemblée législative.", "Texte de la loi ordinaire n° 1.084/2003 d'Imperatriz (art. 1 à 5), lu sur le site de la Chambre municipale.", "Mention « quebradeiras de coco babaçu » à l'art. 4, § 2, XXII du décret n° 8.750/2016, lue sur le site de la présidence.", "Liste des 17 communes et des lois d'État en vigueur, lue dans Gondim (2023), qui l'a établie à partir des sites des chambres municipales et des assemblées et de Shiraishi Neto (2006).", "Texte de la loi fédérale n° 15.431 du 10 juin 2026, lu sur le site de la présidence.", "Caractère consultatif du Conseil national des peuples et communautés traditionnels (art. 1 du décret n° 8.750/2016)."]
  non_confirme: ["Textes des lois municipales de Lago do Junco (05/1997 et 01/2002) et de la loi du Tocantins n° 1.959/2008 non lus sur une source officielle.", "Numéros discordants entre sources : ActionAid (2015) cite la loi du Tocantins sous le n° 1.059 et donne d'autres numéros ou années pour Pedreiras, Cidelândia, Praia Norte et São Miguel do Tocantins que Gondim (2023).", "Chiffre de « plus de 300 000 » casseuses et surface des palmeraies : estimations de leur association, sans recensement officiel.", "Aucun document onusien nommant les casseuses de noix de babaçu n'a été trouvé (observations du CERD 2022, du CEDAW 2024 et du CDESC sur le Brésil consultées)."]
