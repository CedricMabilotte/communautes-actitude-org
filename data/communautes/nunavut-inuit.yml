resume: >-
  Les Inuit de la région du Nunavut ont signé en 1993 avec le Canada un accord sur les revendications territoriales (règlement négocié des droits fonciers ancestraux), protégé par l'article 35 de la Loi constitutionnelle de 1982. L'accord a conduit à la création du territoire du Nunavut le 1er avril 1999, doté d'un gouvernement public élu par tous les résidents. Les droits propres aux Inuit (terres, redevances, faune) sont gérés par Nunavut Tunngavik Incorporated.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) en fait une source d'interprétation du droit canadien.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission au Canada (A/HRC/27/52/Add.2), § 41 : l'Accord de 1993 a conduit à la création du territoire et de son gouvernement public en 1999.", annee: 2014, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
base_nationale:
  - {instrument: "Accord sur les revendications territoriales du Nunavut (signé le 25 mai 1993)", nature: "accord_revendication", annee: 1993, source: "https://tunngavik.com/sites/default/files/nlca/fr/LAND_CLAIMS_AGREEMENT_NUNAVUT_FR.pdf"}
  - {instrument: "Loi concernant l'Accord sur les revendications territoriales du Nunavut (L.C. 1993, ch. 29)", nature: "loi", annee: 1993, source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.7/page-1.html"}
  - {instrument: "Loi sur le Nunavut (L.C. 1993, ch. 28)", nature: "loi", annee: 1993, source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.6/page-1.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Assemblée législative et Conseil exécutif du Nunavut, Loi sur le Nunavut (1993), art. 11 à 13 ; il s'agit d'un gouvernement public élu par tous les résidents, prévu par l'article 4.1.1 de l'Accord de 1993, et non d'un gouvernement propre aux Inuit.", source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.6/page-1.html"}
  pouvoir_normatif: {valeur: "partiel", note: "La Législature du Nunavut légifère dans les domaines énumérés à l'article 23 de la Loi sur le Nunavut (1993), sous réserve des lois fédérales ; ce pouvoir est territorial et non ethnique.", source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.6/page-1.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les terres inuit sont détenues en fief simple (pleine propriété), avec ou sans le sous-sol, Accord de 1993, art. 19.2.1 ; elles ne peuvent être cédées qu'à une autre organisation inuit désignée ou au Canada, art. 19.7.1. Environ 350 000 km², dont 35 000 km² avec droits miniers selon NTI.", source: "https://tunngavik.com/sites/default/files/nlca/fr/LAND_CLAIMS_AGREEMENT_NUNAVUT_FR.pdf"}
  ressources: {valeur: "partiel", note: "Les Inuit reçoivent 50 % des deux premiers millions de dollars de redevances perçues chaque année par l'État et 5 % au-delà, Accord de 1993, art. 25.1.1 ; le Conseil de gestion des ressources fauniques, dont les organisations inuit nomment quatre membres sur neuf, est créé par l'art. 5.2.1.", source: "https://tunngavik.com/sites/default/files/nlca/fr/LAND_CLAIMS_AGREEMENT_NUNAVUT_FR.pdf"}
  consentement: {valeur: "partiel", note: "Aucun « projet de mise en valeur important » (exploitation de ressources situées en tout ou partie sous des terres inuit, ou projet hydraulique dans la région du Nunavut, au-delà de seuils d'emploi ou d'investissement, art. 26.1.1) ne peut débuter avant la conclusion d'une entente sur les répercussions et les avantages pour les Inuit (ERAI), Accord de 1993, art. 26.2.1 ; un arbitrage est prévu en cas de désaccord (partie 3).", source: "https://tunngavik.com/sites/default/files/nlca/fr/LAND_CLAIMS_AGREEMENT_NUNAVUT_FR.pdf"}
  langue: {valeur: "reconnu", note: "L'inuktitut et l'inuinnaqtun sont langues officielles du Nunavut avec l'anglais et le français ; Loi sur la protection de la langue inuite (2008) et Loi sur les langues officielles.", source: "https://www.axl.cefan.ulaval.ca/amnord/nunavut.htm"}
  education: {valeur: "partiel", note: "La Législature a compétence en éducation, Loi sur le Nunavut (1993), art. 23 (1) m) ; la Loi sur l'éducation (2008) du Nunavut encadre l'enseignement bilingue, dont l'inuit (inuktitut ou inuinnaqtun) parmi les langues d'enseignement (art. 23), selon l'Université Laval.", source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.6/page-1.html"}
  fiscalite: {valeur: "partiel", note: "La Législature peut lever des impôts directs à des fins territoriales, municipales ou locales, Loi sur le Nunavut (1993), art. 23 (1) j) ; ce pouvoir appartient au gouvernement public.", source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.6/page-1.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Chaque organisation inuit désignée tient une liste d'inscription des Inuit ; les personnes inscrites bénéficient de l'Accord, art. 35.2.1 et 35.2.2 (1993).", source: "https://tunngavik.com/sites/default/files/nlca/fr/LAND_CLAIMS_AGREEMENT_NUNAVUT_FR.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le territoire et son gouvernement public fonctionnent depuis 1999 (Rapporteur spécial, 2014, § 41). Selon Radio-Canada International (avril 2026), les Inuit forment 52 % du personnel du gouvernement du Nunavut en décembre 2025, alors que l'article 23 de l'Accord vise une proportion représentative de la population (environ 85 %), et le transfert des terres et ressources publiques prévu par l'accord de 2024 doit prendre effet le 1er avril 2027. Une action de NTI contre le gouvernement du Nunavut pour discrimination dans l'enseignement en langue inuit (art. 15 de la Charte canadienne), déposée en 2021, doit aller en procès après le refus de la Cour suprême du Canada d'entendre l'appel du gouvernement (Nunatsiaq News, mai 2025).", source: "https://ici.radio-canada.ca/rci/en/news/2243182/nunavut-has-1-year-left-before-devolution-comes-into-effect-is-the-territory-ready"}
chronologie:
  - {annee: 1993, evenement: "Signature de l'Accord sur les revendications territoriales du Nunavut (25 mai) ; lois fédérales sur l'Accord et sur le Nunavut (10 juin)."}
  - {annee: 1999, evenement: "Création du territoire du Nunavut le 1er avril."}
  - {annee: 2008, evenement: "Loi sur la protection de la langue inuite et Loi sur l'éducation du Nunavut."}
  - {annee: 2021, evenement: "NTI poursuit le gouvernement du Nunavut pour discrimination dans l'enseignement en langue inuit (art. 15 de la Charte canadienne des droits et libertés)."}
  - {annee: 2024, evenement: "Signature de l'accord de transfert des responsabilités sur les terres et les ressources du Nunavut entre le Canada, le Nunavut et NTI ; la Cour d'appel du Nunavut rejette l'appel du gouvernement contre l'action de NTI (août)."}
  - {annee: 2025, evenement: "La Cour suprême du Canada refuse d'entendre l'appel du gouvernement du Nunavut ; l'action de NTI sur l'enseignement en langue inuit va en procès (mai)."}
  - {annee: 2027, evenement: "Date prévue du transfert des terres et ressources publiques au gouvernement du Nunavut (1er avril), avec modification de la Loi sur le Nunavut."}
