  verifie: ["Loi sur le Nunavut, art. 11 à 13 et 23 (texte fédéral officiel).", "Accord de 1993, art. 4.1.1, 5.2.1, 19.2.1, 19.7.1, 25.1.1, 26.2.1, 35.2.1 (texte français hébergé par NTI).", "Préambule de la loi de ratification L.C. 1993, ch. 29.", "Mention du Nunavut au § 41 du rapport du Rapporteur spécial (2014).", "Population Inuk (Inuit) et superficie des terres du Nunavut, recensement 2021 (API de Statistique Canada).", "Liste des subdivisions de recensement 2021 du Nunavut : 24 hameaux, 1 ville, 3 établissements, 3 zones non organisées."]
