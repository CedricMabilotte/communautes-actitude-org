resume: >-
  La Gagaouzie est une unité territoriale autonome du sud de la Moldavie, créée par la Loi sur le statut juridique spécial de la Gagaouzie du 23 décembre 1994. L'article 111 de la Constitution la définit comme une forme d'autodétermination du peuple gagaouze. Elle dispose d'une Assemblée populaire (Halk Topluşu) qui adopte des lois locales et d'un gouverneur (Başkan) élu au suffrage direct. Le gagaouze, le moldave (roumain) et le russe y sont langues officielles. Le mandat de l'Assemblée populaire a expiré en novembre 2025 sans élections ; en juillet 2026, la Cour constitutionnelle a soumis les élections régionales au Code électoral national, et l'élection du gouverneur et celle de l'Assemblée sont fixées au 15 novembre 2026.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Cinquième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Moldavie, adopté le 7 juin 2023, § 61 : les représentants de la minorité gagaouze, de l'Assemblée populaire et du gouverneur signalent un manque de mise en œuvre de la loi de 1994 sur le statut spécial.", annee: 2023, source: "https://rm.coe.int/5th-op-moldova-fr/1680acf619"}
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale sur la Moldavie (CERD/C/MDA/CO/10-11), § 18 : selon les informations reçues, des personnes appartenant aux minorités, dont les Gagaouzes, n'ont pas accès à un enseignement dans leur langue maternelle. Les observations suivantes (CERD/C/MDA/CO/12-14, 2024) ne nomment pas les Gagaouzes.", annee: 2017, source: "https://documents.un.org/doc/undoc/gen/g17/157/43/pdf/g1715743.pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur la Moldavie (CCPR/C/MDA/CO/4, 2 avril 2026), § 43 : allégations de harcèlement et d'intimidation de journalistes, en particulier dans les régions transnistrienne et gagaouze.", annee: 2026, source: "https://documents.un.org/doc/undoc/gen/g26/040/50/pdf/g2604050.pdf"}
base_nationale:
  - {instrument: "Constitution de la République de Moldavie (1994), art. 73, 110 et 111", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Moldova_2024"}
  - {instrument: "Loi n° 344-XIII du 23 décembre 1994 sur le statut juridique spécial de la Gagaouzie (Gagauz Yeri)", nature: "loi_organique", annee: 1994, source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée populaire élue pour quatre ans et gouverneur (Başkan) élu au suffrage direct, Loi de 1994, art. 7, 8 et 14 ; la Constitution, art. 111, prévoit des organes représentatifs et exécutifs propres.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée populaire adopte des lois locales en matière d'éducation, de culture, de logement, de santé, de finances locales, d'économie, d'environnement et de travail, Loi de 1994, art. 11 et 12 ; ces lois doivent être conformes à la Constitution et aux lois moldaves, art. 12, al. 6.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  justice_propre: {valeur: "conteste", note: "La Loi de 1994, art. 20 et 21, prévoit une cour d'appel à Comrat et la proposition des juges et du procureur par l'Assemblée populaire ; la Cour constitutionnelle a invalidé l'art. 20, al. 2, en 1999 (décision n° 24) et l'art. 21 en 2025 (décision n° 4) ; depuis la loi n° 135 de 2024, Comrat n'est plus qu'un siège secondaire de la cour d'appel Sud, dont le siège principal est à Cahul.", source: "https://www.undp.org/sites/g/files/zskgke326/files/2026-04/adept-developments_of_the_institutional_crisis_in_gagauzia_region.pdf"}
  terres: {valeur: "partiel", note: "Le sol, le sous-sol, les eaux, la flore et la faune de Gagaouzie appartiennent au peuple de Moldavie et constituent la base économique de la Gagaouzie, Constitution, art. 111, et Loi de 1994, art. 6.", source: "https://www.constituteproject.org/constitution/Moldova_2024"}
  ressources: {valeur: "partiel", note: "Même régime que les terres : ressources naturelles propriété du peuple de Moldavie et base économique de la Gagaouzie, Constitution, art. 111 ; l'environnement relève des lois locales, Loi de 1994, art. 12.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  consentement: {valeur: "partiel", note: "L'Assemblée populaire dispose de l'initiative législative au Parlement moldave, Constitution, art. 73, participe à la politique intérieure et extérieure sur les questions qui la concernent et peut saisir la Cour constitutionnelle, Loi de 1994, art. 12, al. 3.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  langue: {valeur: "reconnu", note: "Le moldave, le gagaouze et le russe sont langues officielles en Gagaouzie, Loi de 1994, art. 3.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  education: {valeur: "partiel", note: "L'Assemblée populaire adopte des lois locales en matière de science, de culture et d'éducation, Loi de 1994, art. 12, al. 2 a) ; ces lois doivent être conformes à la Constitution et à la loi moldave, art. 12, al. 6.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  fiscalite: {valeur: "partiel", note: "Budget propre alimenté par les prélèvements prévus par la loi moldave et par l'Assemblée populaire, avec des versements fixes au budget de l'État, Loi de 1994, art. 12, al. 2 d), et art. 18 ; Constitution, art. 111.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
  representation: {valeur: "conteste", note: "Le gouverneur est confirmé membre du gouvernement moldave par décret présidentiel, Loi de 1994, art. 14, al. 4 ; ce décret n'a pas été signé pour la gouverneure élue en 2023 (Alber et Cuijuclu, 2023), dont le poste a été déclaré vacant en 2026 (voir effectivité).", source: "https://blog-iacl-aidc.org/territorial-autonomy/2023/10/3/the-autonomy-of-gagauzia-and-its-uneasy-centre-autonomy-relations"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "partiel", note: "Si la Moldavie perd son statut d'État indépendant, le peuple de Gagaouzie a droit à l'autodétermination externe, Loi de 1994, art. 1, al. 4 ; le droit est conditionnel.", source: "http://www.e-democracy.md/files/elections/law-special-legal-status-gagauzia-23-12-1994-en.pdf"}
effectivite: {valeur: "contestee", note: "Le mandat de l'Assemblée populaire a expiré en novembre 2025 sans élections ; le 9 juillet 2026, la Cour constitutionnelle a retiré à l'Assemblée la désignation de l'organe électoral régional et soumis les élections régionales au Code électoral ; des amendements en vigueur depuis le 26 août 2026 permettent à la Commission électorale centrale de fixer la date si l'Assemblée ne le fait pas ; après la condamnation de la gouverneure à sept ans de prison et la vacance de son poste, la Commission a fixé l'élection du gouverneur et celle de l'Assemblée au 15 novembre 2026 (NewsMaker, 2 septembre 2026).", source: "https://newsmaker.md/ru/gagauziyu-vedut-na-vybory-kishinev-perezagruzit-avtonomiyu-za-odin-den"}
chronologie:
  - {annee: 1994, evenement: "Constitution moldave (art. 111) et Loi sur le statut juridique spécial de la Gagaouzie (23 décembre)."}
  - {annee: 1999, evenement: "La Cour constitutionnelle invalide la nomination des juges sur proposition de l'Assemblée populaire (art. 20, al. 2)."}
  - {annee: 2003, evenement: "Modification de la Loi de 1994 (loi n° 191-XV)."}
  - {annee: 2024, evenement: "La loi n° 135 réorganise la carte judiciaire ; la cour d'appel de Comrat devient un siège secondaire de la cour d'appel Sud."}
  - {annee: 2025, evenement: "La Cour constitutionnelle invalide l'art. 21 (procureur) le 14 avril ; la gouverneure élue en 2023 est condamnée à sept ans de prison ; le mandat de l'Assemblée populaire expire le 12 novembre sans élections."}
  - {annee: 2026, evenement: "Le 9 juillet, sur saisine du ministre de la Justice, la Cour constitutionnelle (arrêt n° 8) invalide en partie l'art. 12, al. 3 d), et les art. 19, 22, 23 et 24 de la Loi de 1994, et juge que les élections régionales relèvent du Code électoral."}
  - {annee: 2026, evenement: "Le poste de gouverneur est déclaré vacant (17 août) ; la Commission électorale centrale fixe au 15 novembre l'élection du gouverneur et celle de l'Assemblée populaire (1er septembre)."}
  - {annee: 2026, evenement: "Le 2 octobre, la Cour constitutionnelle juge conforme l'exigence de connaissance du roumain pour les candidats au poste de gouverneur (Code électoral, art. 161, al. 4)."}
