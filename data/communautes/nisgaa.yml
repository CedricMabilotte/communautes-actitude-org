resume: >-
  La Nation nisga'a vit dans la vallée de la Nass, au nord-ouest de la Colombie-Britannique. L'Accord définitif nisga'a, conclu avec le Canada et la Colombie-Britannique, est entré en vigueur en 2000 après son approbation par une loi provinciale de 1999 et une loi fédérale de 2000. Il constitue un traité au sens de l'article 35 de la Loi constitutionnelle de 1982. Il institue le Gouvernement Nisg̱a'a Lisims et des gouvernements de village, et attribue à la Nation la propriété de 1 992 km² de terres.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada a voté contre la Déclaration en 2007, puis a changé de position et l'appuie ; la loi fédérale de 2021 (L.C. 2021, ch. 14, art. 4 a) confirme qu'elle « trouve application en droit canadien ».", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
base_nationale:
  - {instrument: "Accord définitif nisga'a (Nisg̱a'a Final Agreement)", nature: "traite", annee: 2000, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/99002_00_multi"}
  - {instrument: "Nisg̱a'a Final Agreement Act (SBC 1999, ch. 2), Colombie-Britannique", nature: "loi", annee: 1999, source: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/99002_00_multi"}
  - {instrument: "Loi sur l'Accord définitif nisga'a (L.C. 2000, ch. 7)", nature: "loi", annee: 2000, source: "https://laws-lois.justice.gc.ca/fra/lois/N-23.3/page-1.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Nation nisga'a a le droit à l'autonomie gouvernementale (self-government) et le pouvoir de légiférer, Accord définitif, chapitre 11, par. 1 (2000) ; le Gouvernement Nisg̱a'a Lisims et les gouvernements de village sont les gouvernements de la Nation et des villages (par. 2) et détiennent l'autorité principale sur le gouvernement nisga'a, la citoyenneté, la culture, la langue, les terres et les biens nisga'a (par. 33).", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Gouvernement Nisg̱a'a Lisims légifère sur l'organisation de ses institutions (chapitre 11, par. 34) ; dans ces matières, la loi nisga'a l'emporte en cas de conflit avec une loi fédérale ou provinciale (par. 36) ; la même règle vaut pour la création des villages (par. 37 et 38), la citoyenneté (par. 39 et 40), la culture et la langue (par. 41 et 43) et l'enseignement (par. 100 et 101).", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  justice_propre: {valeur: "partiel", note: "Le Gouvernement Nisg̱a'a Lisims peut créer par loi une Cour nisga'a pour l'application des lois nisga'a, chapitre 12, par. 30 ; elle ne siège qu'après approbation de sa structure par le lieutenant-gouverneur en conseil (gouvernement provincial), par. 34 ; d'ici là, la Cour provinciale entend les poursuites, par. 31.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  terres: {valeur: "reconnu", note: "La Nation nisga'a possède 1 992 km² de terres en fief simple (pleine propriété), « le plus grand droit connu en droit », Accord définitif, chapitre 3, par. 2 et 3.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  ressources: {valeur: "reconnu", note: "La Nation nisga'a possède toutes les ressources minérales situées sur ou sous les terres nisga'a, chapitre 3, par. 19 ; elle légifère sur les ressources forestières non ligneuses de ces terres, chapitre 5, par. 11.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  consentement: {valeur: "partiel", note: "L'Accord définit la consultation (préavis, information, délai raisonnable, présentation et examen des points de vue), définitions « consult » et « consultation » du chapitre 1, et la prévoit dans plusieurs chapitres ; il ne prévoit pas de droit de refus.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  langue: {valeur: "partiel", note: "Les citoyens nisga'a ont le droit d'utiliser la langue nisga'a, chapitre 2, par. 7 ; le Gouvernement Nisg̱a'a Lisims légifère pour la préserver et la promouvoir, et sa loi l'emporte en cas de conflit, chapitre 11, par. 41 et 43, sans pouvoir légiférer sur les langues officielles du Canada (par. 42) ; l'Accord n'en fait pas une langue officielle.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  education: {valeur: "partiel", note: "Le Gouvernement Nisg̱a'a Lisims légifère sur l'enseignement de la maternelle à la 12e année pour les citoyens nisga'a sur les terres nisga'a, y compris la langue et la culture, sous réserve de normes de programmes et de certification des enseignants qui permettent le passage vers le système provincial, chapitre 11, par. 100 ; la loi nisga'a l'emporte en cas de conflit (par. 101).", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  fiscalite: {valeur: "partiel", note: "Le Gouvernement Nisg̱a'a Lisims peut légiférer en matière d'impôts directs sur les citoyens nisga'a sur les terres nisga'a, chapitre 16, par. 1 ; ce pouvoir ne limite pas celui du Canada et de la province, par. 2.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le Gouvernement Nisg̱a'a Lisims légifère sur la citoyenneté nisga'a, chapitre 11, par. 39 ; cette citoyenneté ne confère ni la citoyenneté canadienne ni le statut d'Indien au sens de la Loi sur les Indiens.", source: "https://www.nnkn.ca/files/u28/nis-eng.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Une étude universitaire (Hoffman et Robinson, Université du Nord de la Colombie-Britannique, Canadian Journal of Native Studies, 2010) relève que l'assemblée législative Wilp Si'ayuukhl Nisga'a a adopté plus de 28 lois, dont la loi sur le gouvernement nisga'a de 2006, et que les services sont financés par des accords financiers renégociés tous les cinq ans ; en 2020, la Cour d'appel de la Colombie-Britannique (2020 BCCA 215) a rejeté le recours des chefs héréditaires gitanyow contre des décisions de chasse prises en application du traité ; en 2025, le Gouvernement Nisg̱a'a Lisims est partenaire du projet Ksi Lisims LNG, approuvé par la province le 15 septembre 2025 malgré l'opposition de Lax Kw'alaams et des chefs héréditaires gitanyow (The Narwhal).", source: "https://cjns.brandonu.ca/wp-content/uploads/30-2-08Hoffman.pdf"}
chronologie:
  - {annee: 1999, evenement: "Adoption de la loi provinciale d'approbation de l'Accord (sanction le 26 avril)."}
  - {annee: 2000, evenement: "Loi fédérale sur l'Accord définitif nisga'a (sanction le 13 avril) ; entrée en vigueur de l'Accord le 11 mai (TR/2000-38)."}
  - {annee: 2000, evenement: "Juillet : la Cour suprême de la Colombie-Britannique rejette le recours du Parti libéral provincial qui demandait de déclarer l'Accord inconstitutionnel (Campbell c. Colombie-Britannique)."}
  - {annee: 2020, evenement: "La Cour d'appel de la Colombie-Britannique (Gamlaxyeltxw c. Colombie-Britannique, 2020 BCCA 215) rejette l'appel des chefs héréditaires gitanyow contre des décisions de chasse prises en application du traité."}
  - {annee: 2024, evenement: "La Cour d'appel de la Colombie-Britannique (2024 BCCA 313) refuse que la Nation nisga'a soit jointe comme défenderesse à l'action en titre ancestral des chefs héréditaires gitanyow, qui vise des terres couvertes par le traité."}
  - {annee: 2025, evenement: "24 avril : la Cour suprême du Canada autorise l'appel de la Nation nisga'a (dossier 41516) ; audience les 8 et 9 décembre 2025 ; jugement en délibéré au 5 octobre 2026."}
  - {annee: 2025, evenement: "15 septembre : la Colombie-Britannique approuve le projet Ksi Lisims LNG, dont le Gouvernement Nisg̱a'a Lisims est partenaire."}
