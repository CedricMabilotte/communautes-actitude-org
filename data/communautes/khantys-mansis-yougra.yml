droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Territoires d'usage traditionnel de la nature, aires protégées de niveau régional attribuées à des familles et à des communautés (obchtchinas) inscrites au registre, loi 145-oz de 2006, art. 1 ; les titulaires ne peuvent pas disposer de ces terres, art. 11(2).", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7082"}
  ressources: {valeur: "partiel", note: "Usage des ressources naturelles du territoire selon la loi et les coutumes, loi 145-oz, art. 11(3) ; les entreprises réparent les dommages et versent des paiements selon des accords passés avec les titulaires, art. 12(2).", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7082"}
  consentement: {valeur: "partiel", note: "Le plan d'implantation des installations industrielles sur un territoire d'usage traditionnel doit être concerté avec ses titulaires, loi 145-oz, art. 12(1)(1) ; en cas de refus, le gouvernement régional tranche après avis d'une commission, art. 12(4). L'Assemblée examine au préalable les projets de loi touchant ces peuples et rend des avis consultatifs, Règlement de la Douma, art. 33(1)(3).", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7082"}
  langue: {valeur: "partiel", note: "Droit d'employer les langues des peuples autochtones peu nombreux (khanty, mansi, nénètse) dans les écritures officielles des organes régionaux et municipaux selon leurs propres règles, et publication facultative des actes dans ces langues, loi 89-oz de 2001, art. 6-7 ; ces langues ne sont pas officielles.", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7088"}
  education: {valeur: "partiel", note: "Droit à l'enseignement général de base dans la langue maternelle, dans les limites offertes par le système éducatif, loi 89-oz de 2001, art. 3(3).", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7088"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La Douma forme une Assemblée des représentants des peuples autochtones peu nombreux du Nord présidée par un vice-président de la Douma et dotée de l'initiative législative, Statut, art. 27 et 49 ; elle compte trois à cinq députés désignés par la Douma, avec priorité aux députés locuteurs de ces langues, porteurs de ces cultures et menant le mode de vie traditionnel, Règlement de la Douma, art. 27 ; les sièges réservés de 1995 ont été supprimés du Statut, art. 23(2).", source: "https://www.dumahmao.ru/decisions/detail.php?ID=62730"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial de l'ONU (2010, § 28, 43-44 et 56) rapporte que le district est souvent cité pour la législation la plus complète des régions russes et que l'administration supervise les accords entre compagnies pétrolières et familles, mais que des chefs de famille demandent à négocier toutes les clauses au lieu d'un contrat type. Depuis, la circonscription réservée a disparu du Statut ; l'Assemblée compte quatre membres dans la Douma de la septième législature (2021-2026), et le gouvernement du district déclare en 2024 ne plus pouvoir créer de territoire d'usage traditionnel sur les terres forestières fédérales.", source: "https://docs.un.org/fr/A/HRC/15/37/Add.5"}
chronologie:
  - {annee: 1995, evenement: "Adoption du Statut du district : une circonscription nationale-territoriale de six sièges couvrant tout le district élit l'Assemblée des représentants des peuples autochtones peu nombreux du Nord (art. 37 et 41), qui examine au préalable les projets de loi les concernant (art. 65)."}
  - {annee: 1996, evenement: "Élection de la Douma de la deuxième législature ; deux des six sièges réservés sont pourvus, un organe consultatif est créé en attendant."}
  - {annee: 1998, evenement: "Première séance de l'Assemblée, le 14 janvier, après les élections partielles de décembre 1997."}
  - {annee: 2001, evenement: "Élection de la Douma de la troisième législature avec une seule circonscription de cinq sièges pour l'Assemblée ; loi régionale n° 89-oz sur les langues des peuples autochtones peu nombreux."}
  - {annee: 2006, evenement: "La Douma de la quatrième législature compte trois députés représentant ces peuples (Statut, art. 23(2) de l'époque) ; loi 145-oz sur les territoires d'usage traditionnel de la nature."}
  - {annee: 2010, evenement: "Rapport du Rapporteur spécial de l'ONU, qui a visité Khanty-Mansiysk et Kazym en octobre 2009."}
  - {annee: 2011, evenement: "Élection de la Douma de la cinquième législature ; les trois membres de l'Assemblée sont élus dans une circonscription plurinominale."}
  - {annee: 2016, evenement: "Nouveau Règlement de la Douma (décision n° 2171) ; dans sa version en vigueur, l'Assemblée est formée de trois à cinq députés désignés par la Douma."}
  - {annee: 2021, evenement: "Nouveau règlement intérieur de l'Assemblée pour la septième législature (décision n° 9 du 7 octobre 2021)."}
  - {annee: 2025, evenement: "Loi régionale n° 23-oz du 24 avril 2025 créant un Commissaire aux droits des peuples autochtones peu nombreux."}
fiabilite:
  verifie: ["Texte de 1995 des art. 37, 41 et 65 du Statut, cité par la Douma (page de l'Assemblée).", "Statut consolidé au 23 décembre 2025 : art. 1(2), 23(2), 27, 49 et 63 (site de la Douma).", "Loi 145-oz, art. 1, 11 et 12 ; loi 89-oz, art. 3, 6 et 7 (site de la Douma).", "Règlement de la Douma, art. 27 et 33 ; règlement intérieur de l'Assemblée de 2021.", "Composition de l'Assemblée de la deuxième à la septième législature (site de la Douma).", "A/HRC/15/37/Add.5, § 2-4, 28, 34, 42-44 et 56.", "Nombre de territoires d'usage traditionnel inscrits au registre (475 au 31 décembre 2023) : rapport du gouvernement du district à la Douma (2024).", "Population : somme des chiffres du recensement 2020-2021 (19 568 + 11 065 + 1 368 = 32 001) vérifiée sur la page citée."]
  non_confirme: ["Date exacte de la suppression des sièges réservés : les alinéas correspondants de l'art. 23(2) sont marqués « abrogé » sans date ; la Douma mentionne encore une élection des membres de l'Assemblée par circonscription plurinominale en 2011, la suppression se situe donc entre 2011 et 2016.", "Les membres élus par la circonscription réservée n'étaient pas tous issus des peuples autochtones (composition de 1997 et de 2011) ; les conditions de candidature n'ont pas été trouvées.", "Population : chiffres du recensement 2020-2021 repris d'une compilation, le tableau de Rosstat n'a pas pu être ouvert.", "Écart entre les 523 territoires cités par le Rapporteur spécial (2010) et les 475 du registre (2023) : non expliqué dans les sources consultées.", "Composition de l'Assemblée de la huitième législature (Douma élue en septembre 2026) : non encore publiée.", "Surface des territoires d'usage traditionnel : le rapport écrit « 13,272 тыс. га » (lu comme 13 272 milliers d'ha, ordre de grandeur confirmé par la somme par district municipal, 13 271,1 milliers d'ha) et 23,7 % de la superficie du district, part qui ne correspond pas à ce total.", "Nombre de localités : non retenu ; la compilation encyclopédique consultée annonce 205 localités (40 urbaines, 165 rurales au recensement de 2010) mais n'en liste que 193 (40 urbaines, 153 rurales), et le tableau de Rosstat n'a pas été consulté."]
