resume: >-
  Le Statut (Ustav, loi fondamentale régionale) du district autonome des Khantys-Mansis – Yougra, adopté en 1995, désigne le district comme lieu d'habitat originel des peuples autochtones peu nombreux khanty, mansi et nénètse. Il crée au sein de la Douma régionale une Assemblée des représentants des peuples autochtones peu nombreux du Nord, réunie pour la première fois en 1998, dont le président est vice-président de la Douma et qui dispose de l'initiative législative. Les sièges réservés élus dans une circonscription nationale-territoriale, prévus en 1995, ont été supprimés du Statut ; l'Assemblée est désormais formée de trois à cinq députés choisis par la Douma. Une loi régionale de 2006 encadre les territoires d'usage traditionnel de la nature, où l'implantation d'installations industrielles doit être concertée avec les familles qui les utilisent. Fiche distincte du régime fédéral (fiche des peuples autochtones peu nombreux du Nord, de la Sibérie et de l'Extrême-Orient) et de la fiche agrégée des territoires d'usage traditionnel de Yougra.
