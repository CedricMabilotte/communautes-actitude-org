resume: >-
  La Candelaria est une communauté tsotsil située à environ 12 km à l'est de San Cristóbal de las Casas, au Chiapas. Son assemblée décide en novembre 2021 de demander la reconnaissance de son gouvernement communautaire, le Jlumaltik Candelaria, puis élit en août 2023 un collège de 13 autorités (Tsomvanejetik taj jLumaltik Candelaria, « coordinateurs de la communauté ») qui remplace les agents municipaux. Le 1er avril 2024, le conseil municipal (cabildo) de San Cristóbal de las Casas reconnaît cette structure, lui transfère les fonctions du gouvernement municipal et autorise le ministère des Finances de l'État à lui verser la part proportionnelle du budget municipal ; le ministère refuse le versement le 30 septembre 2024. Le 26 février 2026, la Cour suprême de justice de la Nation accorde l'amparo (recours en protection des droits constitutionnels) à la communauté et ordonne de garantir son autogouvernement et la remise des ressources qui lui reviennent dans un délai de 90 jours. Voir aussi les fiches « Oxchuc (Tseltal) » et « Tribunaux de paix et de conciliation autochtones du Chiapas ».
