reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national des Îles Salomon à la Convention sur la diversité biologique (2019) : il cite la loi sur les aires protégées de 2010 et indique qu'une seule aire, Arnavon, a été déclarée depuis son entrée en vigueur, au terme de « plus de 50 ans de travail avec les propriétaires fonciers » ; il décrit aussi la gestion des ressources côtières par les propriétaires (Community Based Resources Management)", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/sb-nr-06-en.pdf"}
  - {mecanisme: "registre_apac", detail: "Base mondiale des aires protégées (WDPA, PNUE-WCMC), données fournies par la division Environnement et Conservation du ministère par l'intermédiaire du Programme régional océanien de l'environnement (PROE), mises à jour en 2022 : Sirebe, Siporae, Padezaka et Vuri y figurent avec une gouvernance « communautés locales » et une propriété communale, Arnavon avec une gouvernance partagée et une propriété communale", annee: 2022, source: "https://www.protectedplanet.net/country/SLB"}
base_nationale:
  - {instrument: "Protected Areas Act 2010 (n° 4 de 2010), art. 10, 11, 12, 13 à 15 et 18", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/sol94186.pdf"}
  - {instrument: "Protected Areas Regulations 2012 (avis légal n° 12 de 2012), règl. 2, 4 à 9, 14 à 29, 40 à 47, 58 à 63, 65 et 72", nature: "loi", annee: 2012, source: "https://faolex.fao.org/docs/pdf/sol148113.pdf"}
  - {instrument: "Déclaration d'aire protégée de diversité biologique, avis légal n° 274 (Padezaka Tribal Rainforest Conservation Area), 15 octobre 2021", nature: "loi", annee: 2021, source: "https://faolex.fao.org/docs/pdf/sol220760.pdf"}
  - {instrument: "Déclaration d'aire protégée de diversité biologique, avis légal n° 108 (Vuri Forest Conservation Area), 21 mars 2022", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/sol220761.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le comité de gestion d'une aire réunit des propriétaires, des agents de l'État et de la province et d'autres personnes, ou seulement des résidents voisins de l'aire, ou les gestionnaires désignés par un accord existant (loi de 2010, art. 12 (1) et (2)) ; il « gère et gouverne » l'aire dans ses limites (règl. 2012, n° 27 (1) et (2)), et le programme communautaire antérieur à la déclaration peut tenir lieu de comité (règl. 28). Les membres sont nommés par le Comité consultatif des aires protégées sur recommandation du directeur, après appel à candidatures auprès des propriétaires et des communautés (règl. 27 (3)) ; le ministre peut faire nommer un autre comité si le plan de gestion n'est pas appliqué dans les 24 mois (règl. 25).", source: "https://faolex.fao.org/docs/pdf/sol148113.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité rédige le plan de gestion et le zonage de l'aire, y compris des zones où s'appliquent des pratiques de gestion traditionnelles (règl. 2012, n° 22, 23 et 26 (1) (c)), autorise les prélèvements et activités dans l'aire et encadre les prélèvements des membres de la communauté « à des fins traditionnelles » (règl. 62 et 63). Il ne peut que proposer au ministre les règlements propres à l'aire, y compris redevances et pouvoirs des gardes (règl. 72).", source: "https://faolex.fao.org/docs/pdf/sol148113.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La déclaration ne transfère pas la propriété : un parc national reste la propriété de son titulaire « en vertu du kastom ou de la loi » (règl. 2012, n° 6 (3)), et le propriétaire coutumier peut faire enregistrer l'aire comme domaine perpétuel qui lui reste acquis (règl. 45). Tout bénéfice ou droit lié à l'aire est commun au groupe propriétaire et une décision prise par un seul membre sans l'accord de la majorité est nulle (règl. 46). Limites : la cession de la propriété sans accord écrit du ministre peut entraîner la révocation de l'aire (règl. 19), aucune révocation volontaire n'est possible pendant dix ans (règl. 21 (4)), et une réserve naturelle suppose l'absence de communauté résidente ou son accord pour se déplacer (règl. 5 (2)).", source: "https://faolex.fao.org/docs/pdf/sol148113.pdf"}
  ressources: {valeur: "partiel", note: "L'« aire de gestion des ressources » a pour objet l'usage durable des ressources au profit des propriétaires coutumiers et des communautés qui en dépendent (règl. 2012, n° 8). Les spécimens prélevés restent la propriété du propriétaire de l'aire (règl. 42), qui peut percevoir un droit d'entrée pour la recherche (règl. 40) ; un permis de bioprospection sur terre ou zone de pêche coutumière exige un accord avec les propriétaires sur l'accès et les avantages (loi de 2010, art. 18 (5) (b)). L'extraction industrielle ou commerciale du bois et des minerais est interdite dans l'aire et à moins d'un kilomètre (règl. 61).", source: "https://faolex.fao.org/docs/pdf/sol148113.pdf"}
  consentement: {valeur: "partiel", note: "Avant toute déclaration, le directeur consulte les propriétaires de l'aire (loi de 2010, art. 10 (2) (a)) et le ministre s'assure que « le consentement et l'approbation » des titulaires de droits sont obtenus (art. 10 (7) (c)) ; un permis de recherche sur terre coutumière exige le consentement écrit des propriétaires (art. 18 (5) (a)). Le règlement de 2012 impose, avant une demande de déclaration par des propriétaires coutumiers, un consensus interne au groupe propriétaire, une consultation des voisins en réunions de village et un accord écrit sur les limites (règl. 44). Le comité n'est pas tenu de soumettre chacune de ses décisions aux propriétaires (règl. 47 (2)). Ce consentement vise la déclaration de l'aire et les permis de recherche ou de bioprospection sur terre coutumière ; aucun texte n'en fait une condition de toute mesure publique touchant l'aire, d'où « partiel ».", source: "https://faolex.fao.org/docs/pdf/sol94186.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Chaque aire peut avoir un fonds de gestion administré par son comité, alimenté par les redevances de l'aire, le Fonds fiduciaire des aires protégées, des subventions et des dons ; toute dépense exige l'accord des trois quarts des membres (règl. 2012, n° 58 et 59). Le comité peut contracter, emprunter et investir (règl. 29) ; le secrétaire permanent du ministère contrôle l'ensemble des fonds (règl. 58 (5)).", source: "https://faolex.fao.org/docs/pdf/sol148113.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une revue du programme MACBIO (Foale et Wini, 2017) indique qu'Arnavon, devenu parc marin communautaire le 11 mai 2017, est le premier site à mettre la loi à l'épreuve ; un fonds fiduciaire couvre environ un tiers des coûts annuels, le reste provenant de collectes de fonds menées surtout par The Nature Conservancy, et un braconnage de tortues persiste. Le sixième rapport national à la CDB (2019) indique qu'Arnavon est la seule aire déclarée à cette date, cite les contraintes financières comme principal obstacle et relève que Tetepare et d'autres aires gérées localement ne sont pas encore déclarées. Deux aires forestières de Choiseul ont été déclarées en 2021 et 2022 (avis légaux n° 274 et n° 108) ; deux autres figurent à la base WDPA comme aires de gestion des ressources désignées en 2019.", source: "https://macbio-pacific.info/wp-content/uploads/2017/11/Arnavon-Is-Review-digital-091117.pdf"}
chronologie:
  - {annee: 1984, evenement: "Ordonnance de la province de Makira : l'exécutif provincial peut déclarer une aire protégée après consultation des propriétaires ; perturber l'aire ou en retirer des matériaux exige l'autorisation écrite de la province et des propriétaires."}
  - {annee: 1995, evenement: "Création de l'aire marine communautaire d'Arnavon et de son comité de gestion (villages de Kia, Katupika et Waghena)."}
  - {annee: 2010, evenement: "Loi sur les aires protégées, votée le 29 mars et promulguée le 7 avril."}
  - {annee: 2012, evenement: "Règlement sur les aires protégées (avis légal n° 12) : cinq catégories d'aires et partie 8 sur les aires en tenure coutumière."}
  - {annee: 2017, evenement: "Le 11 mai, Arnavon devient aire protégée nationale (Arnavon Community Marine Park), 169,09 km²."}
  - {annee: 2019, evenement: "Aires forestières de Sirebe et de Siporae inscrites comme aires de gestion des ressources (base WDPA)."}
  - {annee: 2021, evenement: "Déclaration de la Padezaka Tribal Rainforest Conservation Area, province de Choiseul (avis légal n° 274)."}
  - {annee: 2022, evenement: "Déclaration de la Vuri Forest Conservation Area, province de Choiseul (avis légal n° 108)."}
fiabilite:
  verifie: ["Texte de la loi de 2010 (FAOLEX) : art. 1, 2, 4, 10 à 15, 18 et 24 ; dates du vote (29 mars 2010) et de la promulgation (7 avril 2010).", "Texte du règlement de 2012 (FAOLEX, copie numérisée) : définition du « kastomary owner » (règl. 2), catégories (règl. 4 à 9), parties 3 à 8, 10 à 12 et règl. 72.", "Avis légaux n° 274 du 15 octobre 2021 (Padezaka) et n° 108 du 21 mars 2022 (Vuri), pris en vertu de l'art. 10 (1) de la loi (FAOLEX).", "Sixième rapport national à la CDB (2019) : une seule aire déclarée (Arnavon) à cette date.", "Fiche WDPA des Îles Salomon (téléchargement de septembre 2026) : 94 aires, statut, année, surface, gouvernance et autorité de gestion des cinq aires.", "Composition du comité d'Arnavon (trois villages, provinces de Choiseul et d'Isabel, ministères, The Nature Conservancy) et déclaration de 2017 (site du parc).", "Revue MACBIO (Foale et Wini, 2017) : passage au statut de parc le 11 mai 2017, surface de 169,09 km², part du fonds fiduciaire dans les coûts, braconnage résiduel."]
  non_confirme: ["Date d'entrée en vigueur de la loi : elle dépend d'un avis ministériel au Journal officiel (art. 1) qui n'a pas été trouvé ; le règlement entre en vigueur le même jour.", "Sirebe et Siporae : la WDPA les classe « aire de gestion des ressources » désignée en 2019, catégorie propre au règlement de 2012, mais l'avis de déclaration n'a pas été trouvé ; le rapport à la CDB signale qu'une « Sirepe Rain Forest Conservation Area », sur le plateau central de Choiseul, a engagé la procédure en 2018, sans qu'on puisse confirmer qu'il s'agit de Sirebe.", "Liste probablement incomplète : FAOLEX ne recense que deux avis de déclaration ; d'autres aires ont pu être déclarées depuis 2022 (Tetepare, Kolombangara, aires des projets forestiers financés par le FEM).", "Arnavon : la WDPA donne l'année 1995 (création communautaire) ; le site du parc et la revue MACBIO datent la déclaration nationale de 2017, mais l'avis légal n'a pas été trouvé.", "Population et nombre de villages : aucun chiffre pour l'ensemble des aires déclarées.", "Les nombreuses aires marines gérées localement et zones tabu inscrites à la WDPA relèvent surtout de la gestion coutumière et de la loi sur la pêche de 2015, non de la loi de 2010 : elles ne figurent pas au tableau.", "L'ordonnance de Makira de 1984 est lisible partiellement (copie numérisée de mauvaise qualité) ; son maintien en vigueur après la loi sur le gouvernement provincial de 1997 n'est pas établi et aucune aire déclarée à ce titre n'a été trouvée : elle reste hors de la base juridique de la fiche."]
