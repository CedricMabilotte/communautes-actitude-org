resume: >-
  Fiche agrégée : elle couvre les propriétaires coutumiers (« kastomary owners », personnes ou groupes reconnus par la coutume comme propriétaires) dont la terre ou les eaux sont déclarées aire protégée. La loi sur les aires protégées de 2010 (n° 4), votée le 29 mars 2010, permet au propriétaire d'une aire de demander sa déclaration et exige le consentement des titulaires de droits avant toute déclaration (art. 10). Le règlement de 2012 (avis légal n° 12) fixe cinq catégories, dont l'« aire de gestion des ressources » gérée au profit des propriétaires coutumiers, et une procédure de consultation interne au groupe propriétaire puis avec ses voisins (règl. 44). Cinq aires sont documentées : le parc marin communautaire d'Arnavon, déclaré en 2017, et quatre aires forestières de la province de Choiseul inscrites de 2019 à 2022, dont deux par avis au Journal officiel.
