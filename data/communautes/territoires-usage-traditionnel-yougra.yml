droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "Les coutumes des peuples autochtones peu nombreux peuvent régir l'usage de ces territoires et de leurs ressources lorsqu'elles ne contredisent pas la loi fédérale ou régionale, loi 49-FZ, art. 2 et 13 ; aucun organe propre n'édicte de normes.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-07052001-n-49-fz-o/"}
  justice_propre: {valeur: "partiel", note: "Les tribunaux peuvent tenir compte des traditions et coutumes qui ne contredisent pas les lois fédérales et régionales, et des représentants autorisés peuvent participer à la défense judiciaire, loi 82-FZ, art. 14 ; pas de juridiction propre.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-30041999-n-82-fz-o/"}
  terres: {valeur: "partiel", note: "Territoires d'usage traditionnel, aires protégées de niveau régional dont les titulaires sont inscrits au registre du district, loi n° 145-oz de 2006, art. 1 et 8 ; les terres claniques délimitées avant 2006 sont reconnues comme tels, art. 16 ; les titulaires ont l'usage du territoire mais ne peuvent pas en disposer, art. 11(2).", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7082"}
  ressources: {valeur: "partiel", note: "Usage des ressources naturelles pour le mode de vie traditionnel selon la loi et les coutumes, et usage gratuit des minéraux communs pour les besoins personnels, loi 49-FZ, art. 13-14 ; l'usage des ressources par des entreprises y est admis s'il ne contrevient pas au régime juridique du territoire, art. 13.", source: "https://legalacts.ru/doc/federalnyi-zakon-ot-07052001-n-49-fz-o/"}
  consentement: {valeur: "partiel", note: "Le schéma d'implantation des installations industrielles sur un territoire doit être concerté avec ses titulaires ou les représentants des foyers, et les entreprises versent des paiements fixés par la loi et par des accords avec eux, loi 145-oz, art. 12(1)(1) et 12(2) ; en cas de refus, la commission des territoires, à laquelle participent des représentants autochtones, fait des recommandations et le gouvernement du district décide, art. 2(3) et 12(4) ; pas de droit de veto.", source: "https://www.dumahmao.ru/decisions/detail.php?ID=7082"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Assemblée des représentants des peuples autochtones peu nombreux du Nord, organe permanent de la Douma du district, formé pour la première fois dans la Douma élue en 1996 et réuni depuis 1998, qui examine au préalable les projets de loi touchant ces peuples (règlement de 2021) ; son président est vice-président de la Douma ; un collège électoral réservé a existé de 1996 à 2001 au moins.", source: "https://www.dumahmao.ru/assemblyoftherepresentativesofthenorth/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial des Nations unies (2010, § 34 et 43-44) note que le régime fonctionne, que de nombreux chefs de famille perçoivent des compensations de compagnies pétrolières sous le contrôle de l'administration du district, et que ces chefs de famille demandent à négocier toutes les clauses au lieu d'un contrat type préimprimé. Selon le rapport du gouvernement du district de 2024 (voir sources), 333 des 475 territoires recoupent des licences d'exploitation du sous-sol (53,6 % de leur surface), 1 126 accords ont été conclus en 2022 pour 792,6 millions de roubles, aucun nouveau territoire ne peut être créé et les règlements de régime juridique prévus par la loi (art. 9) ne sont pas adoptés, faute de compétence sur les terres forestières fédérales.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/15/37/Add.5&l=en&t=pdf"}
chronologie:
  - {annee: 1990, evenement: "Décision du Soviet du district sur la création de territoires d'usage prioritaire de la nature."}
  - {annee: 1992, evenement: "Règlement sur le statut des terres claniques (rodovye ougodia) du district."}
  - {annee: 1996, evenement: "Élection des premiers députés de l'Assemblée des représentants des peuples autochtones peu nombreux du Nord dans une circonscription réservée ; première séance de l'Assemblée en janvier 1998."}
  - {annee: 2001, evenement: "Loi fédérale 49-FZ sur les territoires d'usage traditionnel de la nature."}
  - {annee: 2002, evenement: "Arrêté 192-p : les terres claniques délimitées depuis 1990 deviennent territoires d'usage traditionnel de niveau régional ; création de la commission des territoires."}
  - {annee: 2006, evenement: "Loi du district n° 145-oz sur les territoires d'usage traditionnel de la nature d'importance régionale."}
  - {annee: 2008, evenement: "Création du registre des territoires et de leurs titulaires (arrêté 140-p)."}
  - {annee: 2009, evenement: "Modèle d'accord entre compagnies du sous-sol et titulaires (arrêté 425-p)."}
  - {annee: 2010, evenement: "Rapport du Rapporteur spécial des Nations unies sur les peuples autochtones en Russie, qui décrit le régime du district."}
  - {annee: 2023, evenement: "475 territoires et 5 028 titulaires inscrits au registre."}
fiabilite:
  verifie: ["Nombre de territoires (475), surface par district, nombre de titulaires (5 028 au 31 décembre 2023), accords de 2022 (1 126), recoupement avec les licences (333 territoires, 53,6 %) : rapport du Département du sous-sol et des ressources naturelles du district à la Douma (2024).", "Loi 49-FZ, art. 2, 5, 7, 11, 13 et 14 (texte consolidé, legalacts.ru).", "Loi 82-FZ, art. 14 (texte consolidé, legalacts.ru).", "Loi du district n° 145-oz, art. 1, 2, 8, 9, 11, 12 et 16 (texte consolidé au 26 mars 2020, site de la Douma du district).", "A/HRC/15/37/Add.5, § 4, 34 et 42-44 (2010).", "Assemblée des représentants : pages officielles de la Douma du district (historique, règlement de 2021, composition)."]
  non_confirme: ["Le rapport écrit « 13,272 тыс. га » ; la somme des districts (13 271,1 milliers d'hectares) indique 13,272 millions d'hectares ; la part de 23,7 % du district n'a pas été recalculée.", "Le Rapporteur spécial comptait 523 territoires en 2010, contre 475 en 2023 ; l'écart n'est pas expliqué dans les sources consultées.", "Existence d'un collège électoral réservé aux peuples autochtones pour la Douma actuelle : non vérifiée.", "Aucune liste officielle des territoires site par site n'a été trouvée en accès libre ; le rapport donne seulement des totaux par district, d'où l'absence de tableau par site.", "Aucune source indépendante postérieure à 2010 sur l'application du régime n'a été trouvée ; les chiffres d'effectivité de 2022-2023 viennent du gouvernement du district.", "La région M49 retenue est « europe » (Russie) alors que le district se situe en Asie.", "Nombre de villages : non trouvé ; le rapport de 2024 cite seulement 4 villages nationaux et 11 campements raccordés à Internet par un projet de 2019-2023, sans total pour le district."]
