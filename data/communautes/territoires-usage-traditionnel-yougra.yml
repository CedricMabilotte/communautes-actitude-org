resume: >-
  Dans le district autonome des Khantys-Mansis – Yougra, en Sibérie occidentale, 475 territoires d'usage traditionnel de la nature, appelés aussi terres claniques (rodovye ougodia, terres d'une famille ou d'un clan), sont attribués à des familles et à des communautés (obchtchinas) des peuples autochtones peu nombreux du Nord (Khantys, Mansis, Nénètses). Ils ont été délimités entre 1990 et 2002, reconnus comme territoires de niveau régional en 2002 et régis depuis 2006 par la loi du district n° 145-oz, en application de la loi fédérale 49-FZ de 2001. Les titulaires, 5 028 personnes inscrites au registre en 2023, ont l'usage des terres et des ressources pour l'élevage du renne, la chasse, la pêche et la cueillette. Les compagnies pétrolières qui exploitent le sous-sol de ces territoires concluent avec les familles des accords d'usage des terres et de compensation sur la base d'une méthode fixée par le gouvernement du district en 2009. Fiche agrégée couvrant l'ensemble des territoires du registre ; l'Assemblée des représentants de ces peuples à la Douma du district est décrite dans la fiche des Khantys, Mansis et Nénètses de Yougra.
