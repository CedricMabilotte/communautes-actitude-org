  verifie: ["Articles 5, 30, 190, 289 et 304 de la Constitution de 2009.", "Articles 9, 15, 21, 24 à 44, 50, 51, 57 et 67 du statut, et date de la déclaration constitutionnelle (page de titre).", "Article 57 de la loi 026 de 2010 (circonscription spéciale Chipaya et Murato).", "Résultats des référendums de 2009 et 2016 et calendrier des désignations de 2017 (Organe électoral plurinational)."]
