resume: >-
  La nation originaire Uru Chipaya vit sur le territoire de l'ancienne commune de Chipaya, à l'ouest du département d'Oruro. Le 6 décembre 2009, 91,7 % des votants choisissent de convertir la commune en « autonomía indígena originaria campesina » (AIOC, collectivité territoriale autochtone prévue par la Constitution de 2009). Le Tribunal constitutionnel plurinational déclare le statut conforme le 27 mars 2015 et le référendum du 20 novembre 2016 l'approuve avec 77,4 % des voix. Les autorités des trois organes du gouvernement autonome sont désignées selon les normes et procédures propres entre avril et juillet 2017 ; les organes législatif et exécutif sont renouvelés en novembre 2021.
