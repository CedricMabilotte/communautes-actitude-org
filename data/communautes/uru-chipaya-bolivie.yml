  - {instrument: "Statut du gouvernement autonome de la nation originaire Uru Chipaya (déclaration constitutionnelle du 27 mars 2015, référendum du 20 novembre 2016)", nature: "statut_autonomie", annee: 2016, source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  - {instrument: "Loi 026 du régime électoral, art. 57 et 61", nature: "loi", annee: 2010, source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution (art. 289 et 290) définit l'AIOC comme autogouvernement selon les normes et institutions propres ; le statut (art. 25 à 44) crée une assemblée de tous les habitants (Chawkh Parla), un organe législatif de huit membres (Laymis Parla) et un organe exécutif (Lanqśñi paqh mä eph).", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le statut (art. 37 a) donne au Laymis Parla le pouvoir d'adopter, modifier et abroger des lois dans le champ des compétences de l'autonomie ; la Constitution (art. 304) fixe ces compétences.", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Constitution (art. 190 et 304.I.8) reconnaît la juridiction « indígena originaria campesina » (justice coutumière) ; le statut (art. 50 et 51) l'organise en trois niveaux : communauté, assemblée d'ayllu, Chawkh Parla en dernier ressort.", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  terres: {valeur: "partiel", note: "La Constitution (art. 30.II.6) reconnaît le droit au titre collectif des terres ; le statut (art. 15 e) garantit l'accès à la terre ancestrale ; le titre collectif sur le territoire est demandé, sans titre confirmé par une source ouverte.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  ressources: {valeur: "partiel", note: "La Constitution (art. 304.I.3) donne la gestion des ressources renouvelables et le statut (art. 15 c et d) celle de la faune, de la flore et de l'eau ; les ressources non renouvelables restent à l'État, avec participation aux bénéfices (art. 30.II.16).", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15) impose une consultation préalable obligatoire, de bonne foi et concertée, sur l'exploitation des ressources non renouvelables ; le statut (art. 21) prévoit une consultation préalable et informée des communautés et des ayllus sur l'exploitation des ressources stratégiques ; aucun des deux textes n'exige le consentement.", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5) fait de l'uru-chipaya une langue officielle de l'État ; le statut (art. 9) fait de l'uru chipaya et du castillan les langues officielles du gouvernement autonome.", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  education: {valeur: "partiel", note: "Le statut (art. 67) prévoit une éducation fondée sur la langue et la culture uru chipaya, dans le cadre du système éducatif plurinational et de la loi d'éducation Avelino Siñani et Elizardo Pérez.", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution (art. 304.I.12 à 14) permet de créer des taxes, d'administrer les impôts de sa compétence et d'adopter son budget ; le statut (art. 37 g et h, art. 57) prévoit des lois fiscales propres et liste les transferts de l'État.", source: "https://web.oep.org.bo/wp-content/uploads/2016/12/uru_chipaya.pdf"}
  representation: {valeur: "partiel", note: "La loi 026 de 2010 (art. 57 et 61) crée dans le département d'Oruro une circonscription spéciale autochtone partagée entre Chipaya et Murato, qui élit un député.", source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Une étude de l'Eurac Research (2020) compte Uru Chipaya parmi les trois AIOC dotées d'un gouvernement en fonctionnement ; l'Organe électoral plurinational a supervisé le renouvellement des autorités en novembre 2021.", source: "https://webassets.eurac.edu/31538/1664189807-bolivia-2020.pdf"}
chronologie:
  - {annee: 2009, evenement: "Référendum du 6 décembre : 91,7 % des votants choisissent la conversion de la commune en autonomie."}
  - {annee: 2011, evenement: "Le statut, premier statut d'autonomie achevé, est remis au président de l'État."}
  - {annee: 2015, evenement: "Le Tribunal constitutionnel plurinational déclare le statut conforme à la Constitution (27 mars)."}
  - {annee: 2016, evenement: "Le statut est approuvé par référendum avec 77,4 % des voix (20 novembre)."}
  - {annee: 2017, evenement: "Désignation de la plus haute autorité (6 avril), des membres territoriaux du Laymis Parla dans les quatre ayllus (à partir du 15 juillet) et de l'autorité exécutive (22 juillet)."}
  - {annee: 2021, evenement: "Renouvellement des membres territoriaux du Laymis Parla (8 au 13 novembre) et de l'autorité exécutive (14 novembre) selon les normes et procédures propres."}
