  langue: {valeur: "partiel", note: "Art. 4 de la Constitution de 2005 : le syriaque est langue officielle dans les unités administratives où ses locuteurs forment une densité de population.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "Art. 49 de la Constitution : représentation de toutes les composantes du peuple au Conseil des représentants ; la loi électorale réserve cinq sièges aux chrétiens sur neuf sièges de minorités.", source: "https://minorityrights.org/country/iraq/"}
  statut_personnel: {valeur: "partiel", note: "Art. 41 de la Constitution de 2005 : chacun est libre de suivre le statut personnel de sa religion, de sa confession ou de ses croyances, selon une loi.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
