effectivite: {valeur: "contestee", note: "Le CERD relève en 2019 que le quota électoral ne permet pas une représentation proportionnée ; des responsables chrétiens décrivent l'élection de candidats soutenus par les grands partis sur les sièges réservés. La population chrétienne est passée d'environ 1,4 million avant 2003 à moins de 300 000 selon Minority Rights Group.", source: "https://docs.un.org/en/CERD/C/IRQ/CO/22-25"}
