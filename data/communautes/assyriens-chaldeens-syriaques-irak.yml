  langue: {valeur: "partiel", note: "Art. 4 de la Constitution de 2005 et art. 10 de la loi n° 7 de 2014 sur les langues officielles : le syriaque est langue officielle dans les unités administratives où ses locuteurs forment une densité de population.", source: "https://moj.gov.iq/upload/pdf/%D9%82%D8%A7%D9%86%D9%88%D9%86%20%D8%A7%D9%84%D9%84%D8%BA%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B1%D8%B3%D9%85%D9%8A%D8%A9.pdf"}
  education: {valeur: "partiel", note: "Art. 8 de la loi n° 7 de 2014 sur les langues officielles : des écoles de tous niveaux enseignant en syriaque peuvent être ouvertes dans les établissements publics ; art. 12 : chaque composante peut créer des instituts et centres culturels pour sa langue.", source: "https://moj.gov.iq/upload/pdf/%D9%82%D8%A7%D9%86%D9%88%D9%86%20%D8%A7%D9%84%D9%84%D8%BA%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B1%D8%B3%D9%85%D9%8A%D8%A9.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "La Constitution (art. 49) ne prévoit pas de sièges réservés ; la loi électorale (loi n° 9 de 2020, modifiée en 2023) réserve 9 sièges aux minorités sur 329, dont 5 aux chrétiens. Depuis 2023, ces cinq sièges sont répartis entre deux circonscriptions (Erbil et Dohouk ; Bagdad, Kirkouk et Ninive).", source: "https://minorityrights.org/country/iraq/"}
  statut_personnel: {valeur: "partiel", note: "Art. 41 de la Constitution de 2005 : chacun est libre de suivre le statut personnel (droit de la famille et des successions) de sa religion, de sa confession ou de ses croyances, « selon une loi ».", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "La Commission des États-Unis sur la liberté religieuse internationale (USCIRF) relève en 2025 que le système électoral permet à des circonscriptions à majorité chiite de faire élire sur les sièges réservés des candidats liés aux Unités de mobilisation populaire, et que le gouvernement a retiré en 2023 puis rétabli en juin 2024 la reconnaissance de l'autorité administrative du patriarche chaldéen. Le CERD juge en 2024 le quota insuffisant et relève le manque d'enseignants et de moyens pour l'enseignement en langue maternelle (CERD/C/IRQ/CO/26-27, par. 22 et 24). Kirkuk Now compte en 2022 quatre écoles syriaques dans la plaine de Ninive, avec moins de 700 élèves.", source: "https://www.uscirf.gov/sites/default/files/2025-04/Iraq%202025%20USCIRF%20Annual%20Report.pdf"}
chronologie:
  - {annee: 2005, evenement: "Constitution : syriaque langue officielle locale (art. 4), droits des Chaldéens et Assyriens (art. 125)."}
  - {annee: 2014, evenement: "Offensive de Daech dans la plaine de Ninive ; déplacement des chrétiens de la plaine."}
  - {annee: 2014, evenement: "Loi n° 7 sur les langues officielles : syriaque langue officielle locale, écoles en syriaque."}
  - {annee: 2019, evenement: "Observations finales du CERD sur l'Irak."}
  - {annee: 2023, evenement: "Modification de la loi électorale : les cinq sièges chrétiens répartis en deux circonscriptions."}
  - {annee: 2024, evenement: "La Cour suprême fédérale supprime le 21 février les 11 sièges de minorités au Parlement de la région du Kurdistan ; en mai, la justice électorale en attribue 5, dont 3 aux chrétiens (2 assyriens, 1 arménien) ; élections régionales le 20 octobre."}
  - {annee: 2024, evenement: "Observations finales du CERD (CERD/C/IRQ/CO/26-27). Le gouvernement rétablit en juin la reconnaissance de l'autorité administrative du patriarche chaldéen, retirée en 2023."}
  - {annee: 2025, evenement: "Élections législatives du 11 novembre : le Mouvement Babylone obtient 2 des 5 sièges chrétiens, contre 4 en 2021."}
