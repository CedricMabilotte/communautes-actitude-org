reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale nomme les Assyriens, Chaldéens et Syriaques parmi les groupes frappés par la violence armée et le déplacement, avec une baisse de population dans la plaine de Ninive (par. 17 d)), et juge le quota électoral insuffisant (par. 25-26).", annee: 2019, source: "https://docs.un.org/en/CERD/C/IRQ/CO/22-25"}
