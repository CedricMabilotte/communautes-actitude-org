  autogouvernement: {valeur: "conteste", note: "Art. 125 de la Constitution de 2005 : la Constitution garantit les droits administratifs, politiques, culturels et éducatifs des Turkmènes, Chaldéens, Assyriens et autres composantes, « selon une loi ». Aucune unité administrative propre n'a été créée.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
