resume: >-
  Les Assyriens, Chaldéens et Syriaques sont des communautés chrétiennes de langue néo-araméenne (syriaque), présentes surtout dans la plaine de Ninive, à Bagdad et au Kurdistan irakien.
  La Constitution irakienne de 2005 fait du syriaque une langue officielle dans les unités administratives où ses locuteurs forment une densité de population (art. 4) et garantit les droits administratifs, politiques, culturels et éducatifs des Chaldéens et des Assyriens (art. 125) ; aucune unité administrative propre n'a été créée.
  La loi électorale réserve cinq sièges du Conseil des représentants aux chrétiens ; au Parlement de la région du Kurdistan, les sièges de minorités sont passés de 11 à 5 en 2024 après une décision de la Cour suprême fédérale.
