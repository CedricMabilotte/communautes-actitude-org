  non_confirme: ["Endonyme : « Sūrāyē » est courant chez les Assyriens ; les Chaldéens et Syriaques emploient aussi d'autres noms.", "Texte de la loi électorale non consulté : répartition des sièges lue chez Minority Rights Group, le CERD (2024) et Fides (2023).", "Sièges au Parlement du Kurdistan : 3 sièges chrétiens sur 5 selon la justice électorale (mai 2024), d'après Rudaw et Wikipédia ; décision non consultée.", "Population : le recensement de 2024 ne comporte pas de catégorie ethnique ni confessionnelle (USCIRF) ; les estimations publiées sont des bornes sans méthode (moins de 300 000 selon Minority Rights Group, moins de 200 000 selon Open Doors en 2025). Valeur laissée vide.", "Nombre de lieux : régime personnel, sans site délimité. Non renseigné.", "Nombre de villages : non trouvé.", "Surface : aucune unité administrative propre. Non renseignée.", "Loi d'application de l'art. 41 (statut personnel des chrétiens) non consultée.", "L'Irak a voté pour la DNUDPA en 2007, mais ne reconnaît pas ces communautés comme autochtones : mécanisme non retenu.", "Le CERD 2024 (CERD/C/IRQ/CO/26-27) ne nomme pas les Assyriens, Chaldéens ou Syriaques : il traite des minorités ethniques et ethno-religieuses en général."]
