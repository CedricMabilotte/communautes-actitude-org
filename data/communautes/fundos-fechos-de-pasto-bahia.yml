droits:
  autogouvernement: {valeur: "partiel", note: "La loi 12.910 de 2013 (art. 3) confie le contrat à une association communautaire composée de tous les occupants réels ; elle ne crée pas d'institution publique propre.", source: "https://www.legislabahia.ba.gov.br/documentos/lei-no-12910-de-11-de-outubro-de-2013"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi 12.910 de 2013 (art. 2 et 3) autorise une concession de droit réel d'usage (droit d'usage de longue durée, l'État restant propriétaire) sur les terres publiques occupées collectivement, pour 90 ans renouvelables, inaliénable, insaisissable et imprescriptible ; l'art. 178 de la Constitution de Bahia interdit le transfert de propriété et l'art. 3, § 3, de la loi prévoit la résiliation en cas de détournement d'usage.", source: "https://www.legislabahia.ba.gov.br/documentos/lei-no-12910-de-11-de-outubro-de-2013"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La loi 12.910 de 2013 (art. 5) assure aux communautés la participation à toutes les phases de la procédure administrative de régularisation ; aucun consentement n'est requis pour d'autres projets.", source: "https://www.legislabahia.ba.gov.br/documentos/lei-no-12910-de-11-de-outubro-de-2013"}
  langue: {valeur: "non_applicable", note: "", source: ""}
