  representation: {valeur: "partiel", note: "Le décret fédéral 8.750 de 2016 (art. 4, § 2, XXIV) réserve un siège aux « comunidades de fundos e fechos de pasto » au Conseil national des peuples et communautés traditionnels, organe consultatif.", source: "https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/decreto/d8750.htm"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
