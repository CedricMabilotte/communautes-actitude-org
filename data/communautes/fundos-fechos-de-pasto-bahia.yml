effectivite: {valeur: "partielle", note: "La SEPROMI a certifié 777 communautés entre 2014 et 2022, mais le nombre de contrats de concession signés n'est pas publié ; Brasil de Fato (2022) rapporte que des territoires couverts par ces contrats sont occupés par des projets miniers, et le Tribunal fédéral suprême a annulé le 6 septembre 2023 la date limite de 2018 pour demander la certification.", source: "https://www.brasildefato.com.br/2022/03/23/voce-sabe-o-que-sao-as-comunidades-de-fundo-e-fecho-de-pasto/"}
chronologie:
  - {annee: 1989, evenement: "La Constitution de l'État de Bahia (art. 178) prévoit la concession de droit réel d'usage aux associations des zones de fundos de pastos ou fechos."}
  - {annee: 2013, evenement: "La loi de l'État 12.910 du 11 octobre organise la certification et la concession de droit réel d'usage pour 90 ans."}
  - {annee: 2016, evenement: "Le décret fédéral 8.750 réserve un siège aux communautés de fundos et fechos de pasto au Conseil national des peuples et communautés traditionnels."}
  - {annee: 2018, evenement: "Expiration, le 31 décembre, du délai fixé par l'art. 3, § 2, de la loi 12.910 pour demander la certification."}
  - {annee: 2023, evenement: "Le Tribunal fédéral suprême déclare inconstitutionnel ce délai (ADI 5.783, 6 septembre)."}
fiabilite:
  verifie: ["Texte de la loi de l'État de Bahia 12.910 de 2013, art. 1 à 12 (portail officiel legislabahia).", "Art. 178, parágrafo único, de la Constitution de l'État de Bahia de 1989.", "Art. 4, § 2, XXIV, du décret fédéral 8.750 de 2016.", "Décision du Tribunal fédéral suprême du 6 septembre 2023 annulant l'art. 3, § 2, de la loi 12.910 (source de presse juridique).", "Liste officielle des communautés certifiées par la SEPROMI (PDF de décembre 2022) : 777 lignes numérotées, certifications publiées de 2014 à 2022, 716 « Fundo de Pasto » et 61 « Fecho de Pasto »."]
  non_confirme: ["Nombre de contrats de concession de droit réel d'usage effectivement signés.", "Nombre de communautés certifiées après décembre 2022.", "Population : selon la requête du ministère public rapportée par la presse juridique, environ 11 431 familles (données officielles) ou 17 758 familles dans 42 communes (Articulação Estadual de Fundos e Fechos de Pasto) ; une estimation fondée sur des organisations sociales (Gaivizzo et al., 2019) cite plus de 500 communautés, 20 000 familles, 52 communes et environ 1,2 million d'hectares ; Brasil de Fato (2022) cite plus de mille communautés.", "Le Tribunal fédéral suprême s'est appuyé sur l'art. 13 de la Convention 169 de l'OIT ; aucun document de l'OIT ou de l'ONU visant ces communautés n'a été trouvé."]
