resume: >-
  Les communautés de fundo et fecho de pasto (« fonds » et « enclos » de pâturage) élèvent surtout des chèvres sur des pâturages de caatinga d'usage commun, dans le semi-aride de Bahia. La Constitution de l'État de Bahia de 1989 (art. 178) permet de leur concéder l'usage des terres publiques. La loi de l'État 12.910 du 11 octobre 2013 organise leur certification par le secrétariat à la Promotion de l'égalité raciale (SEPROMI) et la signature, avec leur association, d'un contrat de concession de droit réel d'usage (droit d'usage de longue durée sur une terre qui reste propriété de l'État) de 90 ans, inaliénable. La SEPROMI avait certifié 777 communautés en décembre 2022. Le Tribunal fédéral suprême a annulé en 2023 la date limite du 31 décembre 2018 fixée pour demander cette certification.
