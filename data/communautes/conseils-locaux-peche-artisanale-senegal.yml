base_nationale:
  - {instrument: "Loi n° 2015-18 du 13 juillet 2015 portant Code de la pêche maritime, art. 5 (concertation et participation des communautés de la pêche maritime), art. 6 (cogestion des pêcheries), art. 22 (Conseil national consultatif des pêches maritimes) et art. 23 (conseils locaux de pêche artisanale)", nature: "loi", annee: 2015, source: "https://faolex.fao.org/docs/pdf/sen155049.pdf"}
  - {instrument: "Décret n° 2016-1804 du 22 novembre 2016 portant application de la loi n° 2015-18, chapitre II, section 2, art. 5 à 8 (institution, missions, composition et fonctionnement des CLPA) et art. 4 (sièges des CLPA au Conseil national consultatif)", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/sen163863.pdf"}
  - {instrument: "Arrêté n° 000928 du 3 février 2010 portant création, organisation et fonctionnement de conseils locaux de pêche artisanale maritime (neuf CLPA), pris en application de l'art. 12 de la loi n° 98-32 du 14 avril 1998 et des art. 7 à 10 du décret n° 98-498 du 10 juin 1998", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/sen221000.pdf"}
  - {instrument: "Arrêté ministériel n° 12439 du 15 novembre 2011 portant création, organisation et fonctionnement de conseils locaux de pêche artisanale maritime (CLPA de Gandiole et de Potou), Journal officiel n° 6645 du 18 février 2012", nature: "loi", annee: 2011, source: "https://faolex.fao.org/docs/pdf/sen131163.pdf"}
  - {instrument: "Arrêté du sous-préfet de Méouane du 19 octobre 2017 portant réglementation de la pêche dans la zone de pêche protégée (ZPP) de Fass Boye, pris sur proposition du CLPA de Fass Boye", nature: "loi", annee: 2017, source: "https://faolex.fao.org/docs/pdf/sen221111.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque conseil réunit des collèges d'acteurs de la pêche, de notables, d'élus locaux et d'agents de l'administration, dont les trois quarts au moins issus des communautés de pêche, sur 40 membres au plus (arrêté n° 12439 de 2011, art. 3 et 5) ; les représentants des pêcheurs sont désignés par leurs communautés de base (décret n° 2016-1804, art. 7) ; le représentant de l'État préside le conseil (art. 5), désigne le coordonnateur sur proposition des acteurs (art. 7) et peut ordonner le renouvellement de membres (arrêté de 2011, art. 8).", source: "https://faolex.fao.org/docs/pdf/sen163863.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le conseil peut mettre en œuvre des mesures de gestion dans la limite des compétences locales qui lui sont attribuées ; toute nouvelle mesure de gestion ou de conservation locale est approuvée par le ministre chargé de la pêche puis prise par arrêté de l'autorité compétente (arrêté n° 12439 de 2011, art. 13) ; la zone de pêche protégée de Fass Boye a ainsi été réglementée en 2017 par arrêté du sous-préfet, sur proposition du CLPA.", source: "https://faolex.fao.org/docs/pdf/sen131163.pdf"}
  justice_propre: {valeur: "partiel", note: "Le conseil organise les pêcheurs pour prévenir et régler les conflits entre communautés de pêcheurs et entre pêcheurs de méthodes différentes (décret n° 2016-1804, art. 6) et les règle « en premier ressort » au niveau local (arrêté n° 12439 de 2011, art. 12 b) ; il n'a pas de pouvoir juridictionnel, et les conflits entre CLPA vont au gouverneur puis à l'arbitrage du ministre (art. 16).", source: "https://faolex.fao.org/docs/pdf/sen131163.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le conseil participe à l'élaboration et à l'exécution des plans d'aménagement locaux des pêcheries et au suivi, contrôle et surveillance des pêches au niveau local (décret n° 2016-1804, art. 6) et donne un avis sur les demandes de permis d'exercice des métiers de la pêche artisanale (arrêté n° 12439 de 2011, art. 12 j) ; la ressource reste un patrimoine national dont la gestion est une prérogative de l'État (loi n° 2015-18, art. 3 et 4).", source: "https://faolex.fao.org/docs/pdf/sen163863.pdf"}
  consentement: {valeur: "partiel", note: "L'État prend les mesures pour faciliter la concertation et la participation des communautés de la pêche maritime (loi n° 2015-18, art. 5) ; le conseil donne des avis sur toutes les questions relatives à la pêche artisanale dans sa localité (décret n° 2016-1804, art. 6) ; aucun texte consulté ne subordonne une décision à son consentement.", source: "https://faolex.fao.org/docs/pdf/sen155049.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les moyens du conseil proviennent de contributions du ministère, des partenaires et d'une partie des redevances annuelles des permis des métiers de la pêche artisanale, et le conseil transmet chaque année un budget prévisionnel avant le 31 octobre (arrêté n° 12439 de 2011, art. 11) ; aucun pouvoir fiscal propre n'est prévu.", source: "https://faolex.fao.org/docs/pdf/sen131163.pdf"}
  representation: {valeur: "partiel", note: "Trois représentants des CLPA siègent au Conseil national consultatif des pêches maritimes, organe consultatif présidé par le directeur des pêches maritimes (décret n° 2016-1804, art. 4).", source: "https://faolex.fao.org/docs/pdf/sen163863.pdf"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon l'étude du Centre for Maritime Law and Security Africa (2024), les CLPA ont des difficultés à tenir des réunions régulières, à communiquer entre eux, à saisir le Conseil national consultatif et à appliquer leurs résolutions ; seuls quelques conseils ont reçu la part des redevances prévue, et des ONG financent le fonctionnement et la surveillance de certains d'entre eux.", source: "https://cemlawsafrica.org/wp-content/uploads/2024/08/EN-Local-Artisanal-Fisheries-Councils-CLPAs-in-Senegal.pdf"}
chronologie:
  - {annee: 1998, evenement: "Loi n° 98-32 du 14 avril portant Code de la pêche maritime (art. 12) et décret n° 98-498 du 10 juin (art. 7 à 10) : base légale des premiers conseils locaux de pêche artisanale."}
  - {annee: 2008, evenement: "Arrêté n° 09388 du 5 novembre portant création, organisation et fonctionnement des CLPA."}
  - {annee: 2010, evenement: "Arrêté n° 000928 du 3 février créant neuf CLPA, dont Hann, Mbour, Fass Boye, Fimela et Ziguinchor."}
  - {annee: 2011, evenement: "Arrêté n° 12439 du 15 novembre créant les CLPA de Gandiole et de Potou."}
  - {annee: 2015, evenement: "Loi n° 2015-18 du 13 juillet portant Code de la pêche maritime : cogestion des pêcheries (art. 6) et conseils locaux de pêche artisanale (art. 23)."}
  - {annee: 2016, evenement: "Décret n° 2016-1804 du 22 novembre fixant les missions et la composition des CLPA ; arrêté n° 06811 du 3 mai créant le réseau des CLPA du Sénégal."}
  - {annee: 2017, evenement: "Arrêté du sous-préfet de Méouane du 19 octobre réglementant la zone de pêche protégée de Fass Boye, sur proposition du CLPA."}
  - {annee: 2024, evenement: "43 CLPA recensés à l'échelle nationale."}
fiabilite:
  verifie: ["Loi n° 2015-18 du 13 juillet 2015 : art. 3 à 6, 22, 23 et 24, lus sur la copie du Journal officiel publiée par FAOLEX.", "Décret n° 2016-1804 du 22 novembre 2016 : art. 3 à 8, lus sur le texte scanné publié par FAOLEX.", "Arrêté n° 000928 du 3 février 2010 (liste des neuf CLPA et des sites couverts) et arrêté n° 12439 du 15 novembre 2011 (art. 1 à 17, CLPA de Gandiole et de Potou), lus sur FAOLEX.", "63 sites des 11 CLPA : 48 comptés sur l'image de l'arrêté n° 000928 de 2010 (Hann 1, Pikine 3, Rufisque-Bargny 4, Yenn-Dialao 7, Mbour 2, Fass Boye 5, Fimela 14, Elinkine 11, Ziguinchor 1 ; « Ndangane Sambou » est un seul nom coupé par un retour à la ligne) et 15 sur l'arrêté n° 12439 de 2011 (Gandiole 11, Potou 4).", "Arrêté du 19 octobre 2017 sur la ZPP de Fass Boye : initiative du CLPA (art. 1) et surveillance par sa commission (art. 5).", "Nombre de 43 CLPA en 2024, difficultés de fonctionnement et part de 60 % des redevances : étude du Centre for Maritime Law and Security Africa (2024)."]
  non_confirme: ["Les arrêtés de 2010 et 2011 ont été pris sur la base de la loi n° 98-32 et du décret n° 98-498, abrogés en 2015 et 2016 (loi n° 2015-18, art. 138 ; décret n° 2016-1804, art. 70) ; aucun texte consulté ne les abroge expressément ni ne les remplace, et l'arrêté de 2017 sur Fass Boye vise encore l'arrêté de 2010.", "Liste nationale des 43 CLPA : aucune liste officielle complète trouvée ; le tableau joint ne contient que les onze conseils des arrêtés de 2010 et 2011.", "Arrêté n° 06811 du 3 mai 2016 créant le réseau des CLPA et texte d'octobre 2010 (n° 9077) cité par l'étude de 2024 : non lus dans leur texte.", "Part de 60 % des redevances de licences et de cartes de mareyeur versée au fonds d'appui aux CLPA : citée par l'étude de 2024, texte réglementaire non consulté.", "Aucun document onusien consulté (le cinquième rapport national du Sénégal à la Convention sur la diversité biologique évoque la cogestion et les zones de pêche protégées sans nommer les CLPA) ne vise le régime nommément.", "Population (nombre de pêcheurs et d'habitants des localités couvertes) : non trouvée.", "Nombre de villages pour l'ensemble des 43 CLPA : non trouvé ; le chiffre de 63 sites ne couvre que les 11 CLPA des arrêtés de 2010 et 2011.", "Surface des zones couvertes par les CLPA : non trouvée."]
