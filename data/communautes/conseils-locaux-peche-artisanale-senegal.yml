resume: >-
  Fiche agrégée : elle couvre les conseils locaux de pêche artisanale (CLPA), organes qui associent les communautés de pêcheurs d'une localité à la gestion des pêcheries maritimes. Le Code de la pêche maritime (loi n° 2015-18 du 13 juillet 2015) engage l'État à promouvoir la cogestion des pêcheries, c'est-à-dire le partage de la gestion entre l'administration et les usagers (art. 5 et 6), et prévoit les CLPA (art. 23) ; le décret n° 2016-1804 du 22 novembre 2016 fixe leurs missions et leur composition (art. 5 à 8). Chaque CLPA est créé par arrêté (décision réglementaire) du ministre chargé de la pêche, réunit des collèges de pêcheurs, de mareyeurs (négociants en poisson frais), de transformatrices, de notables, d'élus locaux et d'agents de l'État, et est présidé par le représentant de l'État ; il donne des avis, participe à la surveillance et propose des mesures locales que le ministre approuve. En 2024, le Sénégal comptait 43 CLPA ; le tableau joint ne liste que les onze conseils dont l'arrêté de création a été consulté.
