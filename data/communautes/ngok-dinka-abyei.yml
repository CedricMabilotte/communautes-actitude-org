resume: >-
  Les Ngok Dinka habitent la zone d'Abyei, territoire des neuf chefferies ngok dinka rattachées en 1905 à la province du Kordofan, à la limite du Soudan et du Soudan du Sud. Le Protocole d'Abyei de 2004, intégré à l'Accord de paix global de 2005, accorde à la zone un statut administratif spécial, deux pour cent des revenus pétroliers nets « localement avec les Ngok Dinka » et un référendum sur le rattachement au Nord ou au Sud, qui n'a jamais eu lieu. Une sentence arbitrale de 2009 fixe les limites de la zone ; depuis 2011, une force des Nations unies (FISNUA) y est déployée. La Constitution de transition du Soudan du Sud reconnaît aux membres des neuf chefferies un droit « inaliénable » à la citoyenneté sud-soudanaise ; deux administrations, nommées l'une par Djouba, l'autre par Khartoum, coexistent dans la zone.
