resume: >-
  Les Lai, appelés Pawi dans les textes antérieurs, vivent au sud-est du Mizoram. Le conseil de district autonome lai (Lai Autonomous District Council) est issu de la division du conseil régional Pawi-Lakher en 1972 ; le district figure à la Partie III de la Table de la Sixième annexe de la Constitution depuis le 29 avril 1972. Les lois de l'État du Mizoram sur les matières du conseil ne s'y appliquent que sur décision de celui-ci. Les districts autonomes voisins font l'objet des fiches Mara et Chakma du Mizoram.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19, § 10 : recommande de reconnaître les peuples tribaux et les « tribus énumérées » comme groupes ayant droit à une protection spéciale ; § 12 et 19 sur les États du nord-est", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
