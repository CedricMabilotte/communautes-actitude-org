base_nationale:
  - {instrument: "Forest Resources Management and Conservation Act (loi sur la gestion et la conservation des ressources forestières) n° 10 de 1996, partie V « Community Forest Management Areas », art. 34 à 47, et art. 64, 81 et 96 ; applicable à Zanzibar", nature: "loi", annee: 1996, source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Tout groupe de personnes vivant dans une zone ou à proximité peut former un groupe de gestion communautaire, qui choisit ses membres en ouvrant l'adhésion aux riverains et aux usagers traditionnels (loi n° 10 de 1996, art. 37) ; après approbation de l'accord par le ministre, le groupe a la personnalité juridique, peut ester en justice, posséder des biens et contracter (art. 46). L'administrateur des forêts suit l'exécution de l'accord et peut le révoquer en cas de violations graves et continues, avec recours au ministre puis à la Haute Cour (art. 41 (e) et 47).", source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'accord fixe les règles d'accès et d'usage de l'aire, les droits que le groupe peut percevoir, les permis qu'il délivre et les sanctions, y compris l'exclusion de membres (loi n° 10 de 1996, art. 39 (e) et (f)) ; nul ne peut exercer dans l'aire une activité interdite par l'accord ou par les règles et règlements internes (by-laws) pris en application (art. 43 (b)). Les clauses de l'accord priment sur les règlements des conseils municipaux et de district qui les contredisent (art. 45 (2)).", source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Une aire de gestion forestière communautaire peut être créée sur toute terre de Zanzibar, y compris dans une réserve forestière ; sa création sur une terre grevée de droits d'occupation ou d'usage exige le consentement de leurs titulaires ou leur prise en compte dans l'accord (loi n° 10 de 1996, art. 35). Le groupe a le droit d'exclure les non-membres de l'aire (art. 40 (d)) et ses limites sont matérialisées après l'approbation (art. 42 (3)). La partie V ne prévoit pas de transfert de la propriété du sol ; la durée de l'accord est fixée par celui-ci (art. 39 (i)).", source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
  ressources: {valeur: "partiel", note: "Sauf clause contraire, le groupe a le droit et le devoir de gérer l'aire, et le droit de récolter et de vendre les produits forestiers sans payer de redevance à l'administrateur des forêts (loi n° 10 de 1996, art. 40 (a) et (b)) ; l'accord vaut permis pour les activités qu'il autorise (art. 64). L'administrateur s'interdit d'accorder à d'autres des droits, permis ou autorisations contraires à l'accord, et aucune autorité ne peut le faire tant que l'accord est en vigueur (art. 41 (b) et 45 (1)).", source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
  consentement: {valeur: "partiel", note: "Avant de conclure l'accord, l'administrateur des forêts consulte le groupe, les autres riverains, les autorités et les dirigeants locaux, et vérifie l'existence d'un consensus local général en faveur de la création de l'aire (loi n° 10 de 1996, art. 38 (e)) ; la création sur une terre grevée de droits exige le consentement des titulaires ou la prise en compte de ces droits (art. 35 (2)).", source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le groupe peut créer un fonds et y verser les droits et amendes perçus en application de l'accord (loi n° 10 de 1996, art. 40 (e)) ; ces sommes sont exclues du Fonds de développement forestier (art. 81 (c)). Lorsqu'un tribunal condamne pour une infraction portant sur des produits d'une aire communautaire, les biens confisqués et les sommes dues sont attribués au groupe, sauf complicité de celui-ci (art. 96 (2)).", source: "https://faolex.fao.org/docs/pdf/tan22410.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de terrain menée dans six shehia du district Sud d'Unguja (Said et Misana, 2023) relève que la plupart des dispositifs mis en place (participation aux décisions, partage des bénéfices, transfert de techniques, surveillance communautaire) n'ont pas été maintenus dans la durée et que la chasse illégale persiste. Le rapport de bilan du mécanisme BNCFF sur la période 2020-2021 note un engagement faible des groupes auprès de leur association JUMIJAZA, faute de financement et de bénéfices directs, et des cotisations irrégulières.", source: "https://jgat.udsm.ac.tz/index.php/jgat/article/download/228/155/347"}
chronologie:
  - {annee: 1996, evenement: "Loi n° 10 sur la gestion et la conservation des ressources forestières : partie V sur les aires de gestion forestière communautaire."}
  - {annee: 2010, evenement: "Accord de financement norvégien (1er avril) et lancement en juin du projet HIMA de mise en place d'accords de gestion forestière communautaire et de prolongation des accords existants."}
  - {annee: 2014, evenement: "Fin du projet HIMA : 45 aires de gestion forestière communautaire et 82 754 hectares de forêts couverts, selon la revue finale publiée en 2015."}
  - {annee: 2021, evenement: "Cartographie participative et délimitation de 23 nouvelles aires (mai-juin) ; le programme HIMA vise 68 aires sur 97 483 hectares."}
  - {annee: 2026, evenement: "Le gouvernement de Zanzibar annonce la révision de la loi forestière (mars)."}
fiabilite:
  verifie: ["Art. 2, 34 à 47, 64, 81 (c) et 96 (2) de la loi n° 10 de 1996, texte FAOLEX (notice reprise par la plateforme LEAP du PNUE).", "Publication du texte anglais de la loi par la Chambre des représentants de Zanzibar (document numérisé).", "45 aires et 82 754 hectares de forêts couverts par le projet HIMA (2010-2014) : revue finale de 2015, notice du Centre et réseau des technologies climatiques (CTCN).", "Objectif de 68 aires sur 97 483 hectares et 23 nouvelles aires délimitées en 2021 : rapport de bilan BNCFF sur le programme HIMA.", "Constat d'effectivité : Said et Misana, Journal of the Geographical Association of Tanzania, vol. 43, n° 2, 2023."]
  non_confirme: ["Nombre total d'accords en vigueur à Zanzibar : aucun registre officiel trouvé ; les chiffres publiés proviennent de projets et ne se recouvrent pas (45 aires en 2014, 68 aires visées en 2021, association JUMIJAZA réunissant 40 shehia selon le CIFOR).", "Durée des accords : la loi la renvoie à chaque accord ; l'étude de cas du CIFOR mentionne à la fois une prolongation de 5 à 30 ans et un bail de 40 ans, sans texte officiel consulté.", "Un article de presse de mars 2026 évoque la révision d'une « loi forestière de 2016 » : aucune loi forestière de 2016 n'a été trouvée dans la liste des lois de la Chambre des représentants ; la loi de 1996 reste la référence consultée.", "La surface de 97 483 hectares (2021) est donnée par le promoteur du programme et paraît inclure des terres non boisées ; elle n'est pas retenue comme chiffre principal.", "Aucune liste officielle des aires n'a été trouvée : pas de tableau des sites.", "Population et villages : les chiffres disponibles (99 000 habitants, 40 villages) portent sur la zone du projet HIMA décrite en 2010-2014, non sur l'ensemble des accords de gestion forestière communautaire de Zanzibar.", "Villages : la même étude du CIFOR donne aussi 29 villages retenus pour le projet pilote, dont 17 à Unguja et les autres à Pemba, ce qui ne concorde pas avec les 40 villages de la zone d'intervention dont 29 à Unguja ; elle cite en outre 49 comités villageois de conservation et 59 shehia bénéficiaires. Le nombre de 40 n'est pas daté dans la source ; l'année 2010 est celle de la description du projet par CARE à laquelle le passage se rattache."]
