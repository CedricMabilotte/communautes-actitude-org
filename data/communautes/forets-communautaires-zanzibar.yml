types_secondaires: []
population: {valeur: 99000, annee: 2014, perimetre: "habitants des quelque 16 600 ménages ruraux voisins des forêts, dans sept districts d'Unguja et de Pemba, que le projet HIMA prévoyait de faire bénéficier des ventes de crédits carbone (estimation du projet citée par l'étude de cas du CIFOR, sans date propre ; 2014 est l'année de publication de l'étude) ; périmètre du projet, non de l'ensemble des accords de Zanzibar", source: "https://www2.cifor.org/redd-case-book/case-reports/tanzania/piloting-redd-zanzibar-community-forest-management-tanzania/"}
lieux: {valeur: 45, unite: "aires de gestion forestière communautaire (COFMA) couvertes par le projet HIMA ; le nombre total d'accords en vigueur à Zanzibar n'est pas publié", annee: 2014, source: "https://www.ctc-n.org/resources/final-review-project-hifadhi-ya-misitu-ya-asali-hima-piloting-redd-zanzibar-through"}
surface_km2: {valeur: 827.54, annee: 2014, perimetre: "forêts des 45 aires de gestion forestière communautaire du projet HIMA (82 754 hectares), selon la revue finale du projet", source: "https://www.ctc-n.org/resources/final-review-project-hifadhi-ya-misitu-ya-asali-hima-piloting-redd-zanzibar-through"}
villages: {valeur: 40, annee: 2010, perimetre: "villages de la zone d'intervention du projet HIMA (dont 29 à Unguja), zone de 27 650 hectares selon CARE (2010) citée par le CIFOR ; ce périmètre diffère de celui des 45 aires et 82 754 hectares retenus pour lieux et surface", source: "https://www2.cifor.org/redd-case-book/case-reports/tanzania/piloting-redd-zanzibar-community-forest-management-tanzania/"}
resume: >-
  Fiche agrégée : elle couvre les groupes de gestion communautaire titulaires d'un accord de gestion forestière communautaire (Community Forest Management Agreement, COFMA) à Zanzibar, région semi-autonome de la Tanzanie dont le droit forestier est distinct de celui du continent. La loi n° 10 de 1996 sur la gestion et la conservation des ressources forestières (Forest Resources Management and Conservation Act) permet à tout groupe de personnes vivant dans une zone ou à proximité de conclure avec l'administrateur des forêts un accord qui, approuvé par le ministre et publié au Journal officiel, crée une aire de gestion forestière communautaire (art. 34 à 47). Le groupe reçoit la personnalité juridique, le droit de gérer l'aire, d'en récolter et vendre les produits sans redevance, d'en exclure les non-membres et de fixer des règles, droits d'accès et sanctions. Les groupes sont constitués à l'échelle de la shehia (plus petite circonscription administrative de Zanzibar) et se fédèrent dans l'association JUMIJAZA. En 2014, le projet HIMA couvrait 45 de ces aires sur 82 754 hectares. Ce régime est distinct de l'autonomie politique de Zanzibar, traitée dans une autre fiche.
