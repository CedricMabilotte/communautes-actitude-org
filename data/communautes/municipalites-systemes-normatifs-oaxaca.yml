resume: >-
  Fiche agrégée. La Constitution de l'État d'Oaxaca reconnaît aux peuples et communautés autochtones et afromexicains la libre détermination exprimée comme autonomie, la personnalité juridique de droit public, leurs systèmes normatifs internes et la juridiction de leurs autorités communautaires (art. 16). Dans les municipalités inscrites au catalogue de l'Institut électoral d'Oaxaca (IEEPCO), le conseil municipal (ayuntamiento) est élu en assemblée selon ces systèmes, sans partis politiques (art. 25 et 113) ; le catalogue mis à jour le 25 juin 2025 compte 418 municipalités sur 570. L'État nomme seize peuples autochtones. Ont leur propre fiche : Peuples et communautés autochtones du Mexique (article 2 de la Constitution), Peuples et communautés afromexicains, Ejidos et communautés agraires (noyaux agraires).
