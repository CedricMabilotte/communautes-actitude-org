effectivite: {valeur: "effective", note: "Selon le gouvernement de l'État cité par Luces del Siglo (janvier 2026), 409 municipalités ont tenu leur élection en 2025, 5 élections ont été invalidées par l'IEEPCO et 4 municipalités n'ont pas voté ; un ouvrage collectif publié par le Tribunal électoral fédéral (2021) relève qu'en 2010, dans 50 municipalités, l'élection n'a pas eu lieu ou a été annulée et un administrateur municipal a été nommé.", source: "https://lucesdelsiglo.com/2026/01/06/408-municipios-renuevan-autoridades-indigenas-oaxaca/"}
chronologie:
  - {annee: 1990, evenement: "La Constitution d'Oaxaca reconnaît les traditions et pratiques démocratiques des communautés."}
  - {annee: 1995, evenement: "Le Congrès d'Oaxaca approuve la réforme du code électoral (CIPPEO) qui encadre l'élection des conseils municipaux selon les usages et coutumes (30 août)."}
  - {annee: 1998, evenement: "Décret 258 : réforme de l'art. 16 de la Constitution d'Oaxaca et création d'un chapitre sur la juridiction autochtone (6 juin)."}
  - {annee: 2013, evenement: "Après une décision du Tribunal électoral fédéral, la municipalité de Cabecera Nueva passe au régime des partis : 417 municipalités."}
  - {annee: 2015, evenement: "Réforme constitutionnelle du 30 juin : expression « systèmes normatifs autochtones », garantie des assemblées communautaires (art. 25)."}
  - {annee: 2024, evenement: "San Baltazar Chichicápam entre au catalogue (accord IEEPCO-CG-SNI-09/2024) ; réforme de l'art. 2 de la Constitution fédérale (30 septembre)."}
  - {annee: 2025, evenement: "Mise à jour du catalogue : 418 municipalités (25 juin) ; cycle de renouvellement des autorités dans 413 municipalités."}
