  - {instrument: "Loi générale des droits linguistiques des peuples autochtones (Ley General de Derechos Lingüísticos de los Pueblos Indígenas)", nature: "loi", annee: 2003, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution d'Oaxaca garantit la volonté exprimée en assemblée communautaire selon les systèmes normatifs (art. 25, réforme de 2015) ; les conseils municipaux élus selon ces systèmes siègent pour la durée fixée par leurs normes (art. 113).", source: "https://www.congresooaxaca.gob.mx/docs66.congresooaxaca.gob.mx/legislacion_estatal/Constitucion%20Politica%20del%20Estado%20Libre%20y%20Soberano%20de%20Oaxaca%20(Dto%20ref%201575%20aprob%20LXVI%20legis%207%20julio%202026%20PO%2031%20D%C3%A9cima%20secc%201%20agosto%202026).pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'art. 16 de la Constitution d'Oaxaca reconnaît les systèmes normatifs internes ; ceux-ci ne doivent pas être contraires aux droits fondamentaux (art. 25).", source: "https://www.congresooaxaca.gob.mx/docs66.congresooaxaca.gob.mx/legislacion_estatal/Constitucion%20Politica%20del%20Estado%20Libre%20y%20Soberano%20de%20Oaxaca%20(Dto%20ref%201575%20aprob%20LXVI%20legis%207%20julio%202026%20PO%2031%20D%C3%A9cima%20secc%201%20agosto%202026).pdf"}
  justice_propre: {valeur: "partiel", note: "La juridiction autochtone est exercée par les autorités communautaires selon leurs usages, dans le cadre de l'ordre juridique en vigueur (art. 16 et 112) ; la loi fixe l'homologation (validation par un juge de l'État) des décisions.", source: "https://www.congresooaxaca.gob.mx/docs66.congresooaxaca.gob.mx/legislacion_estatal/Constitucion%20Politica%20del%20Estado%20Libre%20y%20Soberano%20de%20Oaxaca%20(Dto%20ref%201575%20aprob%20LXVI%20legis%207%20julio%202026%20PO%2031%20D%C3%A9cima%20secc%201%20agosto%202026).pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "L'État reconnaît le droit social à l'usage et à la jouissance des ressources naturelles des terres et territoires, selon la loi réglementaire (art. 16 de la Constitution d'Oaxaca).", source: "https://www.congresooaxaca.gob.mx/docs66.congresooaxaca.gob.mx/legislacion_estatal/Constitucion%20Politica%20del%20Estado%20Libre%20y%20Soberano%20de%20Oaxaca%20(Dto%20ref%201575%20aprob%20LXVI%20legis%207%20julio%202026%20PO%2031%20D%C3%A9cima%20secc%201%20agosto%202026).pdf"}
  consentement: {valeur: "partiel", note: "L'art. 16 de la Constitution d'Oaxaca prévoit une consultation libre, préalable et informée sur toute mesure législative ou administrative susceptible d'affecter les peuples, afin d'obtenir leur consentement ou un accord ; l'art. 2, fraction XIII, de la Constitution fédérale (réforme de 2024) le prévoit aussi.", source: "https://www.congresooaxaca.gob.mx/docs66.congresooaxaca.gob.mx/legislacion_estatal/Constitucion%20Politica%20del%20Estado%20Libre%20y%20Soberano%20de%20Oaxaca%20(Dto%20ref%201575%20aprob%20LXVI%20legis%207%20julio%202026%20PO%2031%20D%C3%A9cima%20secc%201%20agosto%202026).pdf"}
  langue: {valeur: "partiel", note: "La loi générale de 2003 (art. 4) fait des langues autochtones des langues nationales ayant la même validité que l'espagnol ; l'art. 16 de la Constitution d'Oaxaca en fait un patrimoine culturel de l'État.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "L'art. 16 de la Constitution d'Oaxaca reconnaît la participation des peuples et communautés à l'action éducative.", source: "https://www.congresooaxaca.gob.mx/docs66.congresooaxaca.gob.mx/legislacion_estatal/Constitucion%20Politica%20del%20Estado%20Libre%20y%20Soberano%20de%20Oaxaca%20(Dto%20ref%201575%20aprob%20LXVI%20legis%207%20julio%202026%20PO%2031%20D%C3%A9cima%20secc%201%20agosto%202026).pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution fédérale (art. 2, apartado B, fraction II, réforme de 2024) prévoit des crédits budgétaires administrés directement par les peuples et communautés.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
