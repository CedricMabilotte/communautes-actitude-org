resume: >-
  Fiche agrégée : elle couvre les communautés autochtones du Michoacán qui, sans former une commune entière, élisent un conseil communal selon leurs usages et reçoivent directement la part du budget municipal qui leur revient (presupuesto directo, « budget direct »). La Loi organique municipale publiée le 30 mars 2021 (art. 116 à 118) ouvre ce droit, après une consultation préalable, libre et informée organisée par l'Institut électoral du Michoacán, aux communautés ayant le rang de tenencia (subdivision de la municipalité). Avant 2021, l'accès passait par une décision du tribunal électoral (Pichátaro, 2016) ou par une convention avec la municipalité (Santa Cruz Tanaco, 2012). Le portail du gouvernement de l'État recense 40 communautés purépecha, nahua, mazahua et otomí dans 21 municipalités ; la commune de Cherán, gouvernée en entier par un conseil communal, fait l'objet d'une fiche distincte.
