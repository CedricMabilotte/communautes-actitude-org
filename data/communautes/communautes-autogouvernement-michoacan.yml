droits:
  autogouvernement: {valeur: "reconnu", note: "La Loi organique municipale de 2021 (art. 118 IV) permet aux communautés consultées d'organiser leur administration selon leurs propres formes de gouvernement, normes et usages.", source: "https://cedpi.michoacan.gob.mx/wp-content/uploads/2023/10/Protocolo-del-Gobierno-de-Michoacan-para-la-Transicion-de-Comunidades-Indiginas-al-Autogobierno.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Loi organique municipale (art. 118 III) permet de formuler, approuver et appliquer un plan de développement communal selon les usages ; la personnalité juridique et les attributions des autorités communales restent fixées par le règlement municipal (art. 116).", source: "https://cedpi.michoacan.gob.mx/wp-content/uploads/2023/10/Protocolo-del-Gobierno-de-Michoacan-para-la-Transicion-de-Comunidades-Indiginas-al-Autogobierno.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A II) reconnaît une juridiction autochtone exercée par les autorités communautaires, avec validation par les juges ou tribunaux selon les cas fixés par la loi.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A IX) accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  consentement: {valeur: "reconnu", note: "La Loi organique municipale (art. 116 et 117) subordonne le budget direct à une consultation préalable, libre, informée et de bonne foi, organisée par l'Institut électoral du Michoacán et régie par la loi sur les mécanismes de participation citoyenne (art. 73 à 76).", source: "https://cedpi.michoacan.gob.mx/wp-content/uploads/2023/10/Protocolo-del-Gobierno-de-Michoacan-para-la-Transicion-de-Comunidades-Indiginas-al-Autogobierno.pdf"}
  langue: {valeur: "partiel", note: "La Ley General de Derechos Lingüísticos de los Pueblos Indígenas (art. 4, 2003) fait des langues autochtones des langues nationales ayant la même validité que l'espagnol.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A VI) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  fiscalite: {valeur: "reconnu", note: "La Loi organique municipale (art. 116) donne aux communautés ayant le rang de tenencia le droit d'exercer directement les ressources que leur assigne la municipalité, y compris la totalité de l'impôt foncier (predial) perçu sur leur territoire ; le protocole de transition calcule la part sur la base du pourcentage de population. La Constitution fédérale (art. 2 B II, réforme de 2024) prévoit des allocations budgétaires administrées directement par les communautés.", source: "https://cedpi.michoacan.gob.mx/wp-content/uploads/2023/10/Protocolo-del-Gobierno-de-Michoacan-para-la-Transicion-de-Comunidades-Indiginas-al-Autogobierno.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le portail officiel indique, pour 8 des 40 communautés, un budget direct encore « en attente » ; la Cour suprême a invalidé en août 2022 les articles 114 à 120 de la loi pour les seules municipalités de Tangamandapio (CC 56/2021) et de Nahuatzen (CC 69/2021), avec effets entre les parties ; une étude de 2021 relève des conflits internes pour l'administration des ressources, l'assujettissement des conseils aux règles de contrôle de l'État (Secrétariat des finances, Auditoría Superior de Michoacán, organe de contrôle des comptes publics) et la discrimination des communautés par les municipalités lors des demandes.", source: "https://www.redalyc.org/journal/5519/551968077021/html/"}
chronologie:
  - {annee: 2012, evenement: "Santa Cruz Tanaco (municipalité de Cherán) accède au gouvernement propre et au budget direct par convention avec la municipalité."}
  - {annee: 2016, evenement: "Décision SUP-JDC-1865/2015 du Tribunal électoral fédéral : Pichátaro obtient de la municipalité de Tingambato le transfert direct de sa part du budget."}
  - {annee: 2021, evenement: "Publication de la nouvelle Loi organique municipale (30 mars), dont les articles 116 à 118 ouvrent le budget direct après consultation."}
  - {annee: 2022, evenement: "Protocole du gouvernement du Michoacán pour la transition des communautés vers le gouvernement propre (version du 21 mars) ; la Cour suprême invalide le chapitre sur les peuples autochtones pour les seules municipalités de Tangamandapio (18 août) et de Nahuatzen (23 août), faute de consultation préalable des peuples autochtones lors de l'adoption de la loi."}
  - {annee: 2024, evenement: "La Cour suprême rejette les recours des municipalités de Zitácuaro et d'Erongarícuaro contre la loi (22 avril) ; réforme de la Constitution du Michoacán sur le gouvernement propre autochtone, publiée le 17 décembre."}
