droits:
  autogouvernement: {valeur: "partiel", note: "Droit de créer des conseils pour la protection et la promotion des droits propres, Constitution de 2007, art. 79, point 13 ; selon l'art. 33 de la loi de 2006, les conseils ont pour rôle de « préserver l'identité nationale globale » de la minorité et d'améliorer ses droits ; les minorités de moins de 3 % de la population doivent réunir 510 signatures pour créer un conseil (§ 23) ; les conseils jugent leur rôle précis mal défini (§ 71).", source: "https://rm.coe.int/3eme-avis-montenegro-fr/168096951c"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Le serbe, le bosniaque, l'albanais et le croate sont « en usage officiel » à côté du monténégrin, Constitution, art. 13 ; procédure devant les autorités dans la langue minoritaire et noms de lieux traditionnels dans les zones où la minorité est nombreuse, art. 79, points 5 et 8 ; la loi impose l'usage officiel de la langue dans les communes comptant au moins 5 % de membres d'une minorité ; bulletins bilingues monténégrin-albanais à Tuzi et Ulcinj et dans une partie de Bar, Gusinje et Rožaje en 2023.", source: "https://odihr.osce.org/sites/default/files/f/documents/4/9/560256_1.pdf"}
  education: {valeur: "partiel", note: "Droit à l'enseignement dans sa langue et son alphabet dans les établissements publics, avec l'histoire et la culture de la minorité dans les programmes, Constitution, art. 79, point 4 ; l'albanais est langue d'enseignement dans les zones à majorité albanaise et à Podgorica (troisième avis du Comité consultatif, 2019, § 16). Le système scolaire reste public, sans gestion par les conseils.", source: "https://rm.coe.int/3eme-avis-montenegro-fr/168096951c"}
  fiscalite: {valeur: "partiel", note: "Chaque conseil reçoit 100 000 euros par an du budget de l'État ; le Fonds pour la protection et l'exercice des droits des minorités dispose de 0,15 % du budget de l'État, les présidents des conseils siègent à son conseil d'administration mais les conseils ne peuvent plus y déposer de demande (quatrième avis, 2024, § 50 et 52). Aucun pouvoir fiscal.", source: "https://rm.coe.int/4th-op-montenegro-fr/1680b1d396"}
  representation: {valeur: "partiel", note: "Droit à une « représentation authentique » au Parlement et dans les assemblées locales, Constitution, art. 79, point 9 ; pas de siège réservé : la loi électorale prévoit que, si aucune liste d'une minorité de moins de 15 % de la population n'atteint le seuil de 3 %, les listes ayant chacune 0,7 % des voix obtiennent ensemble jusqu'à trois sièges, et la première liste croate obtient un siège avec 0,35 % ; en 2023, quatre listes de minorités ont obtenu 10 sièges sur 81.", source: "https://odihr.osce.org/sites/default/files/f/documents/4/9/560256_1.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif du Conseil de l'Europe relève en 2024 que les conseils estiment leur statut juridique mal défini, que la mesure électorale prévue pour les Croates n'a pas été étendue aux Roms, et demande de remédier à l'instrumentalisation du Fonds pour les minorités au service d'intérêts politiques partisans ; la mission d'observation de l'OSCE (2023) note que la loi ne fixe aucun critère pour accorder le statut de liste de minorité.", source: "https://rm.coe.int/4th-op-montenegro-fr/1680b1d396"}
chronologie:
  - {annee: 2006, evenement: "Loi sur les droits et libertés des minorités (Journal officiel 31/06, 12 mai), qui prévoit les conseils des minorités (art. 33) et le Fonds pour les minorités."}
  - {annee: 2007, evenement: "Constitution du Monténégro : art. 13 (langues en usage officiel) et art. 79 (droits des nations minoritaires)."}
  - {annee: 2013, evenement: "Deuxième avis du Comité consultatif : six conseils créés ; seuil électoral de 0,35 % pour la minorité croate."}
  - {annee: 2017, evenement: "Dernière modification de la loi sur les droits et libertés des minorités (Journal officiel 31/17)."}
  - {annee: 2023, evenement: "Élections législatives du 11 juin : quatre listes de minorités obtiennent 10 sièges ; recensement de décembre."}
  - {annee: 2024, evenement: "Quatrième avis du Comité consultatif de la Convention-cadre (30 mai)."}
