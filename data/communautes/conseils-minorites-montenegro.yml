resume: >-
  La Constitution du Monténégro de 2007 nomme dans son préambule les Monténégrins, Serbes, Bosniaques, Albanais, Musulmans et Croates, et garantit aux « nations minoritaires » le droit de créer des conseils pour la protection de leurs droits propres (art. 79). La loi sur les droits et libertés des minorités de 2006 (art. 33) organise ces conseils : six existent, pour les Albanais, Bosniaques, Musulmans, Roms, Croates et Serbes. Chaque conseil reçoit 100 000 euros par an du budget de l'État. Le droit électoral abaisse le seuil d'accès au Parlement pour les listes des minorités, avec une règle propre aux listes croates, sans siège réservé.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur le Monténégro, adopté le 30 mai 2024 : six conseils des minorités nationales, 100 000 euros par an chacun (§ 50), Fonds pour les minorités doté de 0,15 % du budget de l'État (§ 52).", annee: 2024, source: "https://rm.coe.int/4th-op-montenegro-fr/1680b1d396"}
