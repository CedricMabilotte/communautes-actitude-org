resume: >-
  Fiche agrégée : elle couvre les communautés locales qui perçoivent une part des taxes d'exploitation forestière et faunique par l'intermédiaire d'un comité de gestion des ressources naturelles (CGRN). Le principe vient de la loi sur les forêts et la faune sauvage n° 10/99 (art. 35) et de son règlement (décret n° 12/2002, art. 102 (1)) : 20 % de toute taxe d'exploitation forestière ou faunique reviennent aux communautés locales de la zone. L'arrêté ministériel (diploma ministerial) n° 93/2005 du 4 mai 2005 organise le versement : comités de gestion, registre des communautés bénéficiaires, compte bancaire. La loi sur les forêts n° 17/2023 a abrogé la loi n° 10/99 ; son règlement (décret n° 78/2024) maintient les 20 % pour les communautés de la zone d'exploitation et laisse à la communauté la décision sur leur usage. En juillet 2025, le gouvernement déclarait 518 millions de meticais versés à 1 580 comités depuis 2005.
