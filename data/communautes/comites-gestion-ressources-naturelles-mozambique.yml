reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Mozambique à la Convention sur la diversité biologique (2019) : il cite l'arrêté ministériel n° 93/2005 (formulé dans le rapport comme 20 % des revenus nets des exploitants forestiers dus aux communautés) et fait état de la création et de la mise en fonctionnement de 289 comités de gestion des ressources naturelles (CGRN) au titre de l'objectif 18.", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/mz-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Lei de Florestas e Fauna Bravia (loi sur les forêts et la faune sauvage) n° 10/99 du 7 juillet 1999, art. 35 (5) — abrogée par la loi n° 17/2023", nature: "loi", annee: 1999, source: "https://periodicos.ufc.br/revcienso/article/download/70826/226181"}
  - {instrument: "Regulamento da Lei de Florestas e Fauna Bravia, décret n° 12/2002 du 6 juin 2002, art. 102 (1) (article cité par le préambule de l'arrêté ministériel n° 93/2005)", nature: "loi", annee: 2002, source: "https://faolex.fao.org/docs/pdf/moz53384.pdf"}
  - {instrument: "Diploma Ministerial (arrêté ministériel) n° 93/2005 du 4 mai 2005, Boletim da República, I série, n° 18, p. 162-163", nature: "loi", annee: 2005, source: "https://faolex.fao.org/docs/pdf/moz53384.pdf"}
  - {instrument: "Lei de Florestas (loi sur les forêts) n° 17/2023 du 29 décembre 2023, Boletim da República, I série, n° 250, 4e supplément, art. 25, 51, 70 et 96", nature: "loi", annee: 2023, source: "https://faolex.fao.org/docs/pdf/moz223054.pdf"}
  - {instrument: "Regulamento da Lei de Florestas, décret n° 78/2024 du 7 novembre 2024, Boletim da República, I série, n° 216, art. 14, 15, 52, 94, 135, 136 et 144", nature: "loi", annee: 2024, source: "https://sibmoz.gov.mz/content/uploads/2025/11/Decreto-78_2024-de-7-de-Novembro-Regulamento-da-Lei-de-Florestas.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté locale est représentée par le comité communautaire de gestion des ressources naturelles (CCGRN), le conseil local, l'autorité traditionnelle ou une autre forme qu'elle légitime ; cette représentation doit prévoir une consultation interne sur les décisions prises au nom de la communauté (décret n° 78/2024, art. 14). La reconnaissance et l'enregistrement de ces entités passent par les organes de l'administration locale (art. 15 (2)). L'arrêté n° 93/2005 fait représenter chaque communauté bénéficiaire par un comité de gestion d'au moins dix membres, hommes et femmes, enregistrés auprès de l'administration du district ; sa création est promue par l'autorité qui délivre les licences, avec l'administration du district (art. 2).", source: "https://sibmoz.gov.mz/content/uploads/2025/11/Decreto-78_2024-de-7-de-Novembro-Regulamento-da-Lei-de-Florestas.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "20 % des taxes forestières reviennent aux communautés locales résidant dans la zone de gestion et d'exploitation (décret n° 78/2024, art. 135 (1) b) ; l'exploitation pour la consommation propre des membres se fait selon les normes et pratiques coutumières et est exemptée de taxe (loi n° 17/2023, art. 51) ; des agents communautaires proposés par le comité surveillent les zones sous sa gestion (décret n° 78/2024, art. 144). Les licences d'exploitation restent délivrées par l'État.", source: "https://sibmoz.gov.mz/content/uploads/2025/11/Decreto-78_2024-de-7-de-Novembro-Regulamento-da-Lei-de-Florestas.pdf"}
  consentement: {valeur: "partiel", note: "La participation des communautés par leurs formes de représentation inclut le consentement libre, préalable et éclairé dans la prise de décision (loi n° 17/2023, art. 25 (2)). L'attribution d'une concession forestière exige une consultation communautaire préalable avec procès-verbal ; la consultation est annulable en cas de vice de volonté ou de refus légalement fondé de la communauté (décret n° 78/2024, art. 52). La règle vise les concessions forestières.", source: "https://sibmoz.gov.mz/content/uploads/2025/11/Decreto-78_2024-de-7-de-Novembro-Regulamento-da-Lei-de-Florestas.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les services forestiers provinciaux et de district versent les 20 % aux communautés ; « cabe a comunidade decidir pela utilização dos valores » (il revient à la communauté de décider de l'usage des fonds), pour des biens et services d'intérêt collectif, avec l'appui du gouvernement de district (décret n° 78/2024, art. 136). L'arrêté n° 93/2005 prévoit un compte bancaire au nom de la communauté, mouvementé par au moins trois membres du comité, et un rapport annuel public du comité à la communauté (art. 5 et 6). La communauté n'a aucun pouvoir de lever un impôt.", source: "https://sibmoz.gov.mz/content/uploads/2025/11/Decreto-78_2024-de-7-de-Novembro-Regulamento-da-Lei-de-Florestas.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le 30 juillet 2025, le secrétaire d'État à la Terre et à l'Environnement a déclaré que 518 millions de meticais avaient été versés à 1 580 comités entre 2005 et 2024. Une étude de 2022 relève que les communautés connaissent mal le mécanisme, que les fonds financent souvent des équipements relevant des obligations de l'État (écoles, hôpitaux, forages) et, citant une étude de 2020, que les priorités sont fixées au niveau des conseils consultatifs de district. L'Observatoire du milieu rural (2023) décrit, dans la province de Niassa, des conflits de rôle entre comités et fonds communautaires créés à partir de 2020.", source: "https://periodicos.ufc.br/revcienso/article/download/70826/226181"}
chronologie:
  - {annee: 1999, evenement: "Loi sur les forêts et la faune sauvage n° 10/99 du 7 juillet : principe d'un retour d'une part des taxes aux communautés locales (art. 35)."}
  - {annee: 2002, evenement: "Règlement de la loi (décret n° 12/2002 du 6 juin) : 20 % de toute taxe d'exploitation forestière ou faunique au bénéfice des communautés locales (art. 102)."}
  - {annee: 2005, evenement: "Arrêté ministériel n° 93/2005 du 4 mai : comités de gestion, registre des communautés bénéficiaires et versement sur compte bancaire."}
  - {annee: 2019, evenement: "Le sixième rapport national à la Convention sur la diversité biologique fait état de 289 comités créés et mis en fonctionnement."}
  - {annee: 2023, evenement: "Loi sur les forêts n° 17/2023 du 29 décembre, qui abroge la loi n° 10/99 et renvoie à un texte spécifique la part des taxes due aux communautés (art. 70 (3))."}
  - {annee: 2024, evenement: "Règlement de la loi sur les forêts (décret n° 78/2024 du 7 novembre) : 20 % des taxes forestières pour les communautés de la zone, usage décidé par la communauté."}
  - {annee: 2025, evenement: "Sixième conférence nationale sur la gestion communautaire des ressources naturelles (Maputo, 30 juillet) : 518 millions de meticais versés à 1 580 comités depuis 2005."}
fiabilite:
  verifie: ["Art. 25, 51, 70, 96 et 98 de la loi n° 17/2023 (Boletim da República, I série, n° 250, 29 décembre 2023, copie FAOLEX).", "Art. 14, 15, 52, 94, 135, 136 et 144 du décret n° 78/2024 (Boletim da República, I série, n° 216, 7 novembre 2024, copie du ministère).", "Texte de l'arrêté n° 93/2005 (Boletim da República, I série, n° 18, 4 mai 2005, copie FAOLEX) : art. 2 (comité d'au moins dix membres enregistrés au district), art. 3 (registre), art. 4 à 6 (compte « Fundo Comunitário », versement trimestriel, compte au nom de la communauté, trois signataires, rapport annuel).", "Mention de l'arrêté n° 93/2005 et des 289 CGRN dans le sixième rapport national à la Convention sur la diversité biologique (2019).", "Chiffres de 518 millions de meticais et 1 580 comités (déclaration officielle du 30 juillet 2025, rapportée par Carta de Moçambique et Diário Económico)."]
  non_confirme: ["Art. 35 (5) de la loi n° 10/99 cité d'après l'étude de 2022 ; art. 102 (1) du décret n° 12/2002 cité d'après le préambule de l'arrêté n° 93/2005 (l'étude de 2022 indique l'art. 105) ; texte du décret n° 12/2002 non consulté.", "Le texte des ministres des Forêts, des Finances et de l'Administration locale prévu par l'art. 135 (2) du décret n° 78/2024 pour remplacer les modalités de versement n'a pas été trouvé ; la déclaration de 2025 se réfère encore à l'arrêté n° 93/2005.", "Part faunique : depuis l'abrogation de la loi n° 10/99, la part des taxes de chasse et de faune due aux communautés relève de la législation sur la conservation (loi n° 16/2014 et décret n° 89/2017) ; la disposition n'a pas été localisée.", "Aucun tableau des sites : aucune liste officielle publiée des comités enregistrés n'a été trouvée.", "Population couverte : non trouvée.", "Surface couverte : non trouvée.", "Nombre de villages : non trouvé. Le sixième rapport national du Mozambique à la Convention sur la diversité biologique mentionne 805 communautés bénéficiaires, sans décompte des villages."]
