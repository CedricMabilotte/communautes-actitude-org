  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2014-2020, déposés auprès de la Convention sur la diversité biologique : section sur la foresterie communautaire (18 133 groupes d'usagers, 2,24 millions de ménages, 1,70 million d'hectares en juin 2013) et pouvoir des groupes de vendre les produits en fixant leurs prix", annee: 2014, source: "https://www.cbd.int/doc/world/np/np-nbsap-v2-en.pdf"}
base_nationale:
  - {instrument: "Ban Ain 2076 (loi forestière de 2019, loi n° 12 de 2076), chapitre 5 (art. 18 à 22, forêt communautaire) et chapitre 9 (art. 31 à 34, groupes d'usagers), modifiée en 2081 et 2082", nature: "loi", annee: 2019, source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  - {instrument: "Ban Niyamawali 2079 (règlement forestier de 2022), modifié pour la troisième fois en 2082", nature: "loi", annee: 2022, source: "https://www.cfsc.gov.np/pages/forest--third-amendment--rules--2082--59--10-8--50"}
  - {instrument: "Samudayik banko margadarshan 2081 (lignes directrices de la forêt communautaire), approuvées par le ministère des Forêts et de l'Environnement", nature: "loi", annee: 2025, source: "https://giwmscdnone.gov.np/media/pages/files/Community%20Forestry%20Guidelines%2C%202081_oshtgjh.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le groupe d'usagers est « une institution autonome et organisée à succession perpétuelle » (art. 32 (1) de la loi de 2019), avec sceau, biens et capacité d'ester en justice (art. 32 (2) à (4)) ; il est enregistré par le bureau forestier de division et remet chaque année un rapport à la collectivité locale et à ce bureau (art. 31), et l'agent forestier peut radier le groupe et reprendre la forêt (art. 19). Les lignes directrices de 2025 (§ 3.10) fixent un comité exécutif de 21 membres au plus, dont au moins 50 % de femmes.", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le groupe joint ses statuts (vidhan) à sa demande d'enregistrement (art. 31 (3) de la loi de 2019) et rédige ou modifie son plan d'opération (karyayojana) après consultation de la collectivité locale, en informant l'agent forestier avant de l'appliquer (art. 18 (5)) ; l'agent forestier approuve le premier plan (art. 18 (2)) et peut, dans les 30 jours, interdire un plan ou une modification aux effets défavorables notables sur l'environnement (art. 18 (6)).", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  justice_propre: {valeur: "partiel", note: "Le groupe peut infliger une amende à l'usager qui agit contre le plan d'opération et recouvrer le montant du dommage (art. 21 (1) de la loi de 2019) ; s'il ne peut agir, il saisit le bureau forestier de division (art. 21 (2)).", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  terres: {valeur: "partiel", note: "La forêt communautaire est une partie de la forêt nationale remise au groupe avec un certificat de transfert (art. 18 (1) et (3) de la loi de 2019) ; la propriété reste à l'État et l'agent forestier peut reprendre la forêt si le plan n'est pas appliqué, avec recours dans les 35 jours devant le directeur forestier provincial, dont la décision est définitive (art. 19), et nouvelle remise au groupe si la décision est annulée (art. 20).", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  ressources: {valeur: "partiel", note: "Le groupe développe, protège, utilise et gère la forêt et fixe librement le prix des produits forestiers avant de les vendre (art. 18 (1) de la loi de 2019) ; il peut mener des entreprises forestières et de l'écotourisme prévues au plan (art. 18 (7) et 34), dans les limites du plan approuvé.", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le groupe a un fonds propre alimenté par les ventes, les subventions, les cotisations et les amendes (art. 33 de la loi de 2019) ; il doit consacrer au moins 25 % du revenu annuel à la forêt, puis au moins 50 % du reste à la réduction de la pauvreté, à l'autonomisation des femmes et au développement d'entreprises, en coordination avec la collectivité locale, le solde restant au groupe (art. 22).", source: "https://faolex.fao.org/docs/pdf/nep202856.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En mars 2022, la fédération des usagers (FECOFUN) manifestait depuis plus de trois mois contre le projet de règlement forestier : obligation de livrer 50 % du bois commercialisable aux comités d'approvisionnement de district, plan d'affaires séparé pour les entreprises, taxation à trois niveaux et création d'aires protégées sur des forêts communautaires (Mongabay, 2022).", source: "https://news.mongabay.com/2022/03/globally-acclaimed-community-forest-groups-in-nepal-say-new-rules-threaten-their-autonomy/"}
chronologie:
  - {annee: 1978, evenement: "Modification de la loi forestière de 1961 : la gestion de forêts est confiée aux panchayats (collectivités locales)."}
  - {annee: 1989, evenement: "Plan directeur du secteur forestier : la forêt communautaire devient programme prioritaire."}
  - {annee: 1993, evenement: "Loi forestière (Ban Ain 2049) : les groupes d'usagers deviennent des personnes morales autonomes."}
  - {annee: 1995, evenement: "Règlement forestier (Ban Niyamawali 2051)."}
  - {annee: 2013, evenement: "18 133 groupes d'usagers, 2,24 millions de ménages, 1,70 million d'hectares (stratégie nationale pour la biodiversité)."}
  - {annee: 2019, evenement: "Loi forestière Ban Ain 2076, qui remplace celle de 1993."}
  - {annee: 2022, evenement: "Protestations de la FECOFUN contre le projet de règlement ; adoption du règlement forestier Ban Niyamawali 2079."}
  - {annee: 2025, evenement: "Lignes directrices de la forêt communautaire 2081."}
  - {annee: 2026, evenement: "22 557 forêts communautaires dans la base de gestion du Centre d'étude de la forêt communautaire (1er octobre)."}
fiabilite:
  verifie: ["Texte népalais des art. 18 à 22 et 31 à 34 de la loi de 2019, version consolidée de la Commission du droit du Népal (FAOLEX).", "Historique, composition des comités et répartition du revenu : lignes directrices de 2025 (texte népalais).", "22 557 forêts communautaires, 8 158 forêts en bail pour les ménages pauvres, 230 forêts religieuses et 31 forêts en partenariat : page d'accueil de la base de gestion (mis.cfsc.gov.np), consultée le 1er octobre 2026 (22 553 lors d'un relevé antérieur le même jour).", "Statuts (vidhan) adoptés par l'assemblée générale par consensus ou à la majorité des deux tiers puis approuvés par l'agent forestier de division : lignes directrices de 2025, définitions.", "Tableau contrôlé sur le rapport public pour six divisions forestières complètes (Bhaktapur, Kavrepalanchowk, Myagdi, Terhathum, Bajura, Dang ; 1 760 lignes, noms et surfaces identiques). Total du rapport public par division au 1er octobre 2026 : 22 499 lignes, dont 26 strictement identiques à une autre, fusionnées dans le tableau (22 473 lignes).", "Chiffres de 2002 et 2013 : stratégie nationale pour la biodiversité 2014-2020, tableau 13.", "Relevé du rapport public par division forestière (1er octobre 2026) : 22 473 forêts distinctes, environ 3,03 millions de ménages usagers déclarés (3 243 fiches sans nombre de ménages).", "Plus de 22 500 groupes d'usagers (Banque mondiale, 2024).", "Revendications de la FECOFUN en 2022 : Mongabay."]
  non_confirme: ["Texte final du règlement forestier de 2022 (copie disponible seulement en image) : le maintien de l'obligation de livrer 50 % du bois commercialisable n'a pas été vérifié.", "Contenu des modifications de la loi de 2019 adoptées en 2081 et 2082.", "Population : la base donne des ménages par forêt, non le nombre de personnes ; plusieurs fiches portent « N/A ».", "Le relevé par division donne 22 473 forêts distinctes contre 22 553 en page d'accueil ; la base contient des doublons de nom, des noms de collectivités locales incohérents avec le district (ex. Aathrai Tribeni, attribué à des forêts d'Achham, de Manang ou de Parsa) et au moins une fiche d'essai (« aaa gs forest ») ; seules les lignes strictement identiques sont fusionnées dans le tableau, le reste est conservé tel quel.", "Unité de la colonne « Area » de la base (hectares) : déduite de la cohérence avec les totaux de 2013, non indiquée sur la page."]
