resume: >-
  Fiche agrégée : elle couvre les groupes d'usagers (upabhokta samuha) auxquels l'administration forestière remet une partie de la forêt nationale comme forêt communautaire. La loi forestière de 2019 (Ban Ain 2076), qui reprend la loi de 1993, autorise le groupe à protéger, gérer et utiliser la forêt selon un plan d'opération, à fixer librement le prix de ses produits et à les vendre ; le groupe est une personne morale autonome, à succession perpétuelle, mais la terre reste forêt nationale et l'administration peut la reprendre. Au moins 25 % du revenu annuel vont à la forêt, puis au moins la moitié du reste à la réduction de la pauvreté, aux femmes et aux entreprises, et le solde au groupe. La base de gestion du Centre d'étude de la forêt communautaire compte 22 557 forêts communautaires le 1er octobre 2026 ; en 2022, la fédération des usagers (FECOFUN) a manifesté contre le projet de règlement forestier.
