  - {mecanisme: "rapporteur_special", detail: "Rapport du Rapporteur spécial James Anaya sur le Pérou et les industries extractives (A/HRC/27/52/Add.3) : en droit péruvien, le terme « communauté paysanne » inclut les communautés aymara, quechua et uro des Andes.", annee: 2014, source: "https://documents.un.org/doc/undoc/gen/g14/072/49/pdf/g1407249.pdf"}
base_nationale:
  - {instrument: "Constitution politique du Pérou (1993), art. 48, 88, 89, 149 et 191", nature: "constitution", annee: 1993, source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  - {instrument: "Loi 24656, loi générale des communautés paysannes (1987)", nature: "loi", annee: 1987, source: "https://centroderecursos.cultura.pe/sites/default/files/rb/pdf/ley%20general%20de%20comunidades%20campesinas.pdf"}
  - {instrument: "Loi 26505 sur l'investissement privé dans les terres du territoire national et des communautés paysannes et natives (1995), art. 10 et 11", nature: "loi", annee: 1995, source: "https://www.leyes.congreso.gob.pe/Documentos/Leyes/26505.pdf"}
  - {instrument: "Loi 29785 sur le droit à la consultation préalable des peuples autochtones (2011) et règlement (décret suprême 001-2012-MC)", nature: "loi", annee: 2011, source: "https://faolex.fao.org/docs/pdf/per198478.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La loi 24656 (1987) reconnaît les communautés comme autonomes dans leur organisation (art. 1) ; l'assemblée générale est l'organe suprême et la direction communale est élue au vote secret pour deux ans au plus (art. 16 à 20).", source: "https://centroderecursos.cultura.pe/sites/default/files/rb/pdf/ley%20general%20de%20comunidades%20campesinas.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée générale adopte et interprète le statut de la communauté (art. 18), fixe le régime d'usage des terres, la taille des parcelles familiales et le nombre de têtes de bétail sur les pâturages (art. 11 à 13) ; le travail communal est régi par un droit coutumier (art. 1, loi 24656).", source: "https://centroderecursos.cultura.pe/sites/default/files/rb/pdf/ley%20general%20de%20comunidades%20campesinas.pdf"}
  justice_propre: {valeur: "partiel", note: "Les autorités des communautés paysannes, avec l'appui des rondes paysannes (rondas campesinas, comités de surveillance villageois), exercent des fonctions juridictionnelles selon le droit coutumier sur leur territoire, sans violer les droits fondamentaux (Constitution, art. 149).", source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  terres: {valeur: "partiel", note: "La loi 24656 déclare les terres communales insaisissables, imprescriptibles (non acquises par simple occupation) et inaliénables (invendables), sauf accord des deux tiers des membres qualifiés approuvé par une loi (art. 7) ; la Constitution de 1993 ne garde que l'imprescriptibilité (art. 89) ; la loi 26505 de 1995 exige le vote des deux tiers de tous les membres pour disposer des terres de la sierra et de la selva (art. 11), et celui de la moitié des membres présents en assemblée pour celles de la côte (art. 10).", source: "https://www.leyes.congreso.gob.pe/Documentos/Leyes/26505.pdf"}
  ressources: {valeur: "partiel", note: "La communauté règle l'accès de ses membres à la terre et aux autres ressources (art. 4, loi 24656) ; l'exploitation par la communauté des ressources de ses terres a priorité dans l'appui de l'État (art. 15) et le secteur public promeut leur exploitation prioritaire par la communauté (art. 35) ; les ressources naturelles restent patrimoine de la Nation (Constitution, art. 66).", source: "https://centroderecursos.cultura.pe/sites/default/files/rb/pdf/ley%20general%20de%20comunidades%20campesinas.pdf"}
  consentement: {valeur: "partiel", note: "La loi 29785 (2011) impose la consultation préalable des peuples autochtones ; une communauté paysanne n'y a droit que si elle est identifiée comme peuple autochtone, et l'entité publique prend la décision finale.", source: "https://faolex.fao.org/docs/pdf/per198478.pdf"}
  langue: {valeur: "partiel", note: "Le quechua, l'aymara et les autres langues autochtones sont langues officielles dans les zones où elles prédominent (Constitution, art. 48) ; les membres de la direction communale doivent maîtriser la langue prédominante de la communauté (art. 20, loi 24656).", source: "https://cdn.www.gob.pe/uploads/document/file/198518/Constitucion_Politica_del_Peru_1993.pdf?v=1594239946"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'assemblée générale approuve le budget annuel (art. 18) ; les communautés sont exonérées des impôts directs sur la propriété de la terre et de l'impôt sur le revenu, sauf loi fiscale contraire (art. 28, loi 24656).", source: "https://centroderecursos.cultura.pe/sites/default/files/rb/pdf/ley%20general%20de%20comunidades%20campesinas.pdf"}
  representation: {valeur: "partiel", note: "La Constitution (art. 191) charge la loi de fixer des pourcentages minimaux de représentation des communautés paysannes et natives et des peuples autochtones dans les conseils régionaux et municipaux ; la loi des élections municipales (loi 26864, art. 10) impose au moins 15 % de candidats issus de ces communautés sur les listes aux conseils provinciaux où elles existent, selon la liste fixée par le Jury national des élections (résolution 0847-2025-JNE) ; il s'agit d'un quota de candidats, pas de sièges réservés.", source: "https://portal.jne.gob.pe/portal_documentos/files/563c7cd4-52bc-4a35-9cc1-82262170f72f.pdf"}
  statut_personnel: {valeur: "partiel", note: "La loi 24656 définit la qualité de membre (comunero) ; le membre qualifié, inscrit au registre communal après cinq ans de résidence, vote en assemblée et peut être élu (art. 5 et 6).", source: "https://centroderecursos.cultura.pe/sites/default/files/rb/pdf/ley%20general%20de%20comunidades%20campesinas.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial des Nations unies relève en 2014 des retards de titrage depuis le transfert de cette compétence aux gouvernements régionaux en 2009, environ 1 200 communautés paysannes et natives en attente d'un titre, et des droits sur les ressources limités par ceux de l'État (A/HRC/27/52/Add.3, § 11 à 13). Au recensement de l'INEI de 2017, 19,8 % des 6 453 communautés paysannes reconnues n'ont pas de titre de propriété et 36,7 % des communautés déclarent des conflits fonciers, surtout avec d'autres communautés et avec leurs propres membres.", source: "https://documents.un.org/doc/undoc/gen/g14/072/49/pdf/g1407249.pdf"}
