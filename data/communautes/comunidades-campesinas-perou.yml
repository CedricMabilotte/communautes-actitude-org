resume: >-
  Fiche agrégée. Les communautés paysannes (comunidades campesinas) sont des organisations de familles qui habitent et contrôlent un territoire, liées par la propriété communale de la terre et le travail communal ; elles sont surtout situées dans les Andes et sur la côte. La Constitution de 1993 (art. 89) leur donne la personnalité juridique et l'autonomie d'organisation, de travail communal, d'usage et de libre disposition des terres ; la loi générale 24656 de 1987 fait de l'assemblée générale leur organe suprême. Leurs autorités peuvent exercer des fonctions juridictionnelles selon le droit coutumier (art. 149). Le recensement de 2017 compte 6 682 communautés paysannes, dont 64 % déclarent appartenir à un peuple autochtone, surtout quechua (3 646) et aymara (576). Les communautés natives d'Amazonie, régies par les mêmes articles constitutionnels, ont leur propre fiche.
