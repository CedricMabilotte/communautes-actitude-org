resume: >-
  Fiche agrégée : elle couvre les communautés rurales titulaires d'une forêt enregistrée comme forêt communautaire au Soudan. La loi n° 11 de 2002 sur les forêts et les ressources naturelles renouvelables (Forests and Renewable Natural Resources Act) range, à côté des forêts fédérales et des forêts d'État, des « autres forêts » : individuelles, communautaires et institutionnelles (art. 3). Les forêts communautaires, créées par les habitants sur leurs terres et autour des villes et des villages, sont administrées par des comités choisis par les habitants de la zone (art. 33), sous la supervision technique de la Forests National Corporation (FNC, l'organisme public des forêts). Selon la soumission du Soudan à la CCNUCC (2020), la loi reconnaît aussi le rôle de l'administration autochtone (« native administration », les chefferies rurales reconnues par l'État), des autorités traditionnelles et des communautés locales, ainsi que les droits d'usufruit (droits d'usage) des communautés riveraines des réserves forestières. Le nombre de forêts communautaires et leur surface ne sont pas établis : les chiffres publiés se contredisent, et la guerre commencée en avril 2023 a désorganisé l'administration forestière.
