effectivite: {valeur: "non_etablie", note: "Le rapport du Soudan à l'évaluation des ressources forestières mondiales 2015 (FAO) donne pour les forêts communautaires des chiffres qui ne concordent pas entre eux et ne recense de nouvelles forêts communautaires de 2010 à 2013 que pour l'État de Sennar. Aucune donnée sur les forêts communautaires postérieure à la guerre commencée le 15 avril 2023 n'a été trouvée ; une étude publiée en 2026 sur la forêt réservée de Sunut, à Khartoum, mesure une perte de 80,8 % du couvert forestier de 2023 à 2026 et indique que l'accès restreint empêche la surveillance par l'administration forestière.", source: "https://www.sciencedirect.com/science/article/pii/S2666719326002207"}
chronologie:
  - {annee: 1932, evenement: "Première loi forestière du Soudan."}
  - {annee: 1989, evenement: "Mise à jour de la loi forestière."}
  - {annee: 2002, evenement: "Loi n° 11 sur les forêts et les ressources naturelles renouvelables : forêts individuelles, communautaires et institutionnelles ; forêts communautaires administrées par des comités choisis par les habitants, sous supervision technique de la FNC."}
  - {annee: 2006, evenement: "Déclaration de politique forestière nationale, mise à jour de la politique de 1986 ; non ratifiée selon le cinquième rapport national à la CDB (2014)."}
  - {annee: 2014, evenement: "Cinquième rapport national à la CDB : 1 622 675 hectares plantés en forêts communautaires en 2012."}
  - {annee: 2015, evenement: "Stratégie nationale pour la biodiversité 2015-2020 : action pour encourager la création de forêts communautaires."}
  - {annee: 2020, evenement: "Soumission du niveau de référence forestier à la CCNUCC par la FNC, qui décrit les catégories de propriété de la loi de 2002."}
  - {annee: 2023, evenement: "Début de la guerre le 15 avril."}
fiabilite:
  verifie: ["Loi n° 11 de 2002 (traduction anglaise publiée par le ministère de la Justice et la FNC, FAOLEX) : art. 3, forêts communautaires « créées par les habitants sur leurs terres et autour des villes et des villages » ; art. 33-1-e-2, administration par des comités choisis par les habitants de la zone ; art. 33-2, supervision technique de la FNC ; art. 40-2, droit d'exploitation des arbres replantés dans les zones classées à la demande des propriétaires.", "Soumission du niveau de référence forestier du Soudan à la CCNUCC (FNC, janvier 2020), p. 41 : trois catégories de propriété forestière (privée, communautaire, institutionnelle) sous supervision technique de la FNC ; reconnaissance du rôle de l'administration autochtone, des autorités traditionnelles et des communautés locales ; droits d'usufruit des communautés riveraines des réserves.", "Rapport FRA 2015 du Soudan (FAO) : loi forestière de 1932, mise à jour en 1989, loi sur les forêts et les ressources naturelles de 2002 « toujours en vigueur » ; des modifications proposées n'étaient pas adoptées.", "Rapport FRA 2015 du Soudan : tableau « propriété privée par type de forêt » (2005, statistiques des États et de la FNC) avec 53 965 ha de forêts communautaires ; tableau par État des forêts détenues par des individus et des communautés, avec un total de 156 714 ha de forêts communautaires ; 7 forêts communautaires nouvelles en 2010, 4 en 2011, 5 en 2012 et 2 en 2013 dans l'État de Sennar.", "Cinquième rapport national à la CDB (2014) : surface plantée en forêts communautaires passée de 270 276 à 1 622 675 hectares en 2012.", "Stratégie nationale pour la biodiversité 2015-2020 (juin 2015) : action pour encourager les communautés rurales à créer des forêts communautaires."]
  non_confirme: ["Seule la traduction anglaise de la loi n° 11 de 2002 a été lue ; les règlements d'application (enregistrement des forêts communautaires, composition et pouvoirs des comités) n'ont pas été trouvés. Aucune modification de la loi postérieure au rapport FRA 2015 n'a été recherchée au-delà de la soumission à la CCNUCC de 2020, qui la décrit comme en vigueur.", "La loi de 2002 donne aux cheikhs, omdas (chefs de village ou de groupe de villages) et chefs coutumiers un rôle de saisie des produits en cas d'infraction forestière (art. 45) ; leur place dans la gestion des forêts communautaires (organe de gestion, règlement des litiges) n'est pas établie.", "Surface des forêts communautaires : trois chiffres incompatibles (53 965 ha en 2005 et 156 714 ha dans le même rapport FRA 2015 ; 1 622 675 ha « plantés » en 2012 selon le rapport à la CDB) ; la somme des lignes du tableau par État du rapport FRA 2015 donne 156 925 ha et non le total imprimé ; aucun chiffre retenu.", "Nombre de forêts communautaires et population des communautés titulaires : aucune liste officielle ni aucun chiffre national trouvé ; pas de tableau des sites.", "Le rapport FRA 2015 range les forêts communautaires parmi les forêts privées ; le rapport distingue aussi les forêts détenues par des sociétés de producteurs de gomme arabique (6 006 114 ha), dont le lien avec la catégorie communautaire de la loi n'est pas établi.", "Effet de la guerre commencée en 2023 et de la sécession du Soudan du Sud (2011) sur l'application de la loi : non documenté pour les forêts communautaires.", "Aucune source universitaire indépendante portant sur le régime des forêts communautaires n'a pu être ouverte ; la seule source indépendante consultée porte sur une forêt réservée de l'État."]
