reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Soudan à la Convention sur la diversité biologique (2014) : il indique que la surface plantée en forêts communautaires est passée de 270 276 à 1 622 675 hectares en 2012 et fixe pour action d'encourager les communautés rurales à créer des forêts communautaires (distribution de plants gratuits ou subventionnés, objectif 3)", annee: 2014, source: "https://www.cbd.int/doc/world/sd/sd-nr-05-en.pdf"}
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2015-2020, transmis à la CDB : plan d'action pour la biodiversité forestière, action 1 « distribution de plants gratuits ou subventionnés pour encourager les communautés rurales à créer des forêts communautaires » et action 2 sur les incitations aux communautés qui gèrent des ressources forestières", annee: 2015, source: "https://www.cbd.int/doc/world/sd/sd-nbsap-v2-en.pdf"}
base_nationale:
  - {instrument: "Loi n° 11 de 2002 sur les forêts et les ressources naturelles renouvelables (Forests and Renewable Natural Resources Act), annexe législative à la Gazette du Soudan n° 1690 (décembre 2002), art. 3 et 33 ; abroge la loi forestière n° 14 de 1989", nature: "loi", annee: 2002, source: "https://faolex.fao.org/docs/pdf/sud48812.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi n° 11 de 2002 dispose que les forêts populaires ou communautaires sont administrées par des comités choisis par les habitants de la zone (art. 33-1-e-2) ; toutes les forêts restent soumises à la supervision technique de la FNC, qui peut émettre toute directive pour les protéger (art. 33-2).", source: "https://faolex.fao.org/docs/pdf/sud48812.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi n° 11 de 2002 définit les forêts communautaires comme les forêts créées par les habitants sur leurs terres et autour des villes et des villages (art. 3) et en confie l'administration à des comités choisis par les habitants (art. 33) ; elle ne prévoit ni titre collectif ni inaliénabilité, et place ces forêts sous la supervision technique de la FNC (art. 33-2). La soumission du Soudan à la CCNUCC (2020, p. 41) décrit la forêt communautaire comme une catégorie de propriété forestière.", source: "https://faolex.fao.org/docs/pdf/sud48812.pdf"}
  ressources: {valeur: "partiel", note: "Les comités choisis par les habitants administrent les forêts communautaires (loi n° 11 de 2002, art. 33) ; la loi permet aussi aux individus, communautés et institutions qui replantent des arbres dans les zones classées à la demande des propriétaires d'exploiter les arbres et leurs produits selon les règlements (art. 40-2) ; le transport des produits forestiers exige un permis (art. 38) et la FNC fixe redevances et taxes sur les produits forestiers et la gomme arabique (art. 6-l).", source: "https://faolex.fao.org/docs/pdf/sud48812.pdf"}
