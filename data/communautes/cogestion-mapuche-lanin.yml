population: {valeur: 2500, annee: 2007, perimetre: "habitants mapuches du parc et de la réserve nationaux Lanín, borne basse de la fourchette de 2 500 à 3 000 personnes donnée par l'étude de cas FAO-APN ; les communautés du parc Nahuel Huapi ne sont pas comptées", source: "https://www.miteco.gob.es/content/dam/miteco/es/parques-nacionales-oapn/proyectos-de-cooperacion/5caso-argentina_tcm30-287859.pdf"}
