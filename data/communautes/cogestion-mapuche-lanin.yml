surface_km2: {valeur: 11293, annee: 2025, perimetre: "superficie cumulée des deux parcs, ressort de la table de cogestion (art. 2 de la résolution conjointe 1-E/2017) : Lanín 412 000 ha (APN, 2025) et Nahuel Huapi 717 261 ha (brochure du parc) ; les terres occupées par les sept communautés du Lanín couvraient environ 24 000 ha en 2007", source: "https://www.argentina.gob.ar/sites/default/files/marterial_estudio_examen_guias_pn_lanin_2025.pdf"}
