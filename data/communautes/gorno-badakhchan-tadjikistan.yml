resume: >-
  La Région autonome du Haut-Badakhchan (Kŭhistoni Badakhshon) couvre le Pamir, à l'est du Tadjikistan. Créée en 1925 comme région autonome au sein de la République autonome du Tadjikistan, elle fait partie de la République socialiste soviétique du Tadjikistan à partir de 1929. La Constitution de 1994, révisée en 2016, en fait une « partie intégrante et indivisible » de la République (art. 81) ; son assemblée, le Majlis des députés du peuple, dispose de l'initiative législative au Parlement (art. 58 et 82) et vote le budget et les impôts locaux (art. 77). L'autonomie n'est pas définie par une appartenance ethnique : l'État compte les Pamiris parmi les Tadjiks, ce que le Comité pour l'élimination de la discrimination raciale (CERD) regrette en 2017 et 2023.
