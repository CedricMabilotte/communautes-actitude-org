reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du CERD sur le Tadjikistan (adoptées le 27 avril 2023), § 5, 13, 14, 17 et 19 : le Comité se dit « sérieusement préoccupé » par les tensions dans la « Kŭhistoni Badakhshon Autonomous Province », les informations sur l'usage d'une force létale et excessive contre des manifestants et les détentions arbitraires de membres de la « minorité pamirie » ; il recommande une enquête sur les faits survenus depuis novembre 2021 et un dialogue avec cette minorité.", annee: 2023, source: "https://docs.un.org/en/CERD/C/TJK/CO/12-13"}
  - {mecanisme: "organe_traite", detail: "Observations finales du CERD sur le Tadjikistan (adoptées le 21 août 2017), § 5 et 25 : absence de données sur les Pamiris, comptés comme Tadjiks au recensement de 2010 ; absence des langues pamiries des programmes scolaires.", annee: 2017, source: "https://docs.un.org/en/CERD/C/TJK/CO/9-11"}
base_nationale:
  - {instrument: "Constitution de la République du Tadjikistan (1994, révisée en 2016), art. 7, 49, 58, 77 à 83, 86 et 89", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Tajikistan_2016"}
droits:
  autogouvernement: {valeur: "partiel", note: "Majlis des députés du peuple de la région, élu pour cinq ans, Constitution, art. 77 ; le président de la région, qui dirige le Majlis et l'exécutif, est nommé et révoqué par le président de la République avec l'approbation du Majlis, art. 77 et 78 ; le Majlisi Milli (chambre haute) peut dissoudre une assemblée locale, art. 80.", source: "https://www.constituteproject.org/constitution/Tajikistan_2016"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Majlis et le président de la région adoptent des actes juridiques obligatoires sur leur territoire, Constitution, art. 79 ; le Majlis a l'initiative des lois au Parlement national, art. 58 et 82 ; les compétences sociales, économiques et culturelles de la région sont fixées par une loi constitutionnelle (loi votée par le Parlement national), art. 83.", source: "https://www.constituteproject.org/constitution/Tajikistan_2016"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Toute modification des frontières de la région sans le consentement de son Majlis des députés du peuple est interdite, Constitution, art. 81.", source: "https://www.constituteproject.org/constitution/Tajikistan_2016"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le Majlis des députés du peuple approuve le budget local et établit les impôts locaux dans le cadre fixé par la loi, Constitution, art. 77.", source: "https://www.constituteproject.org/constitution/Tajikistan_2016"}
  representation: {valeur: "partiel", note: "La région dispose au Majlisi Milli (chambre haute) d'un nombre de membres égal à celui de chaque province, élus par ses députés locaux, Constitution, art. 49 ; un des sept juges de la Cour constitutionnelle représente la région, art. 89.", source: "https://www.constituteproject.org/constitution/Tajikistan_2016"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Minority Rights Group écrit que le pouvoir du président de la République de nommer le président de l'assemblée régionale et les juges de la région sert aux autorités centrales à contourner une partie de l'autonomie ; il rapporte, lors de la répression de mai 2022, au moins 17 civils tués selon des informations non confirmées, après des tirs sur des manifestants à Vomar, et l'assassinat de Mamadbokir Mamadbokirov à Khorog ; le CERD (2023, § 13) fait état d'informations sur l'usage d'une force létale et excessive contre des manifestants, de coupures prolongées d'Internet et de détentions arbitraires de Pamiris.", source: "https://minorityrights.org/communities/pamiris/"}
chronologie:
  - {annee: 1925, evenement: "Le 2 janvier, le Comité exécutif central de l'URSS crée la région autonome du Haut-Badakhchan au sein de la République autonome du Tadjikistan."}
  - {annee: 1929, evenement: "Le 16 octobre, la République autonome du Tadjikistan devient République socialiste soviétique ; la région en fait partie."}
  - {annee: 1992, evenement: "Le 11 avril, le Conseil des députés du peuple de la région proclame une « République autonome du Badakhchan », que le Soviet suprême du Tadjikistan ne reconnaît pas ; Minority Rights Group parle d'une déclaration d'indépendance, révoquée par la suite."}
  - {annee: 1994, evenement: "Adoption de la Constitution du Tadjikistan : statut de la région aux articles 81 à 83."}
  - {annee: 2012, evenement: "Affrontements à Khorog : 22 civils tués par les forces de sécurité selon Minority Rights Group."}
  - {annee: 2016, evenement: "Révision de la Constitution par référendum ; les articles sur la région sont maintenus."}
  - {annee: 2021, evenement: "En novembre, un habitant est tué par les forces de sécurité ; deux manifestants sont tués ; coupure d'Internet jusqu'en mars 2022."}
  - {annee: 2022, evenement: "En mai, opération des forces de sécurité contre les manifestants, tirs sur des manifestants à Vomar ; au moins 17 civils tués selon des informations non confirmées citées par Minority Rights Group."}
  - {annee: 2023, evenement: "Le CERD demande une enquête impartiale sur les faits survenus dans la région depuis novembre 2021."}
