resume: >-
  Fiche agrégée : elle couvre les villages qui gèrent une zone de conservation des poissons (vang sa-nguan), portion de rivière ou de plan d'eau fermée à la pêche toute l'année ou une partie de l'année. La première zone officielle date de 1993, dans le district de Khong. La loi sur la pêche de 2009 (art. 50 à 54) confiait la gestion à des comités de gestion des pêches et à des règlements villageois approuvés par le gouverneur de district. Elle a été remplacée par la loi n° 41/AN du 17 juillet 2023 sur les animaux aquatiques et la pêche, puis par la décision ministérielle n° 0766 du 22 août 2025, en vigueur depuis le 29 septembre 2025 : un ou plusieurs villages demandent la création de la zone, le comité administratif du district l'approuve et nomme un comité de gestion présidé par le chef de village. En 2018, le Département de l'élevage et de la pêche recensait 1 313 zones officielles et 364 zones communautaires non approuvées.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Laos à la Convention sur la diversité biologique (2019), objectif national 3 (objectif 1.2.1 de la stratégie nationale pour la biodiversité 2016-2025) : au moins 250 sites de conservation et de reproduction des poissons établis et reconnus ou soutenus par les habitants des bassins versants ; le rapport cite 885 zones de conservation des poissons établies selon le Département de l'élevage et de la pêche (2018), dont 252 développées par les communautés locales de Houaphan, Xiengkhouang, Luang Prabang et Phongsaly avec l'appui du projet TABI", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/la-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Décision du ministère de l'Agriculture et de l'Environnement n° 0766 du 22 août 2025 sur la gestion des zones de conservation des poissons (vang sa-nguan), en vigueur le 29 septembre 2025 (art. 26)", nature: "loi", annee: 2025, source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
  - {instrument: "Loi n° 41/AN du 17 juillet 2023 sur les animaux aquatiques et la pêche (révisée), art. 30, 31, 84 et 87 ; en vigueur le 2 octobre 2023, elle remplace la loi sur la pêche n° 03/AN de 2009 (art. 99)", nature: "loi", annee: 2023, source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/41%E0%BA%AA%E0%BA%9E%E0%BA%8A17.7.2023.pdf"}
  - {instrument: "Loi sur la pêche n° 03/AN du 9 juillet 2009, art. 3, 40 et 50 à 54 (comités de gestion des pêches et règlements de pêche villageois) ; remplacée en 2023", nature: "loi", annee: 2009, source: "https://faolex.fao.org/docs/pdf/lao139169.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le comité administratif du district approuve la création de la zone et nomme un comité de gestion, sur proposition du bureau de l'agriculture et de l'environnement du district ; ce comité comprend une direction générale présidée par le chef de village, un comité de médiation et un comité d'inspection et de patrouille, et, pour une zone partagée, un chef de village choisi d'un commun accord (décision n° 0766 de 2025, art. 7 et 8) ; l'unité de l'élevage et de la pêche du district suit et contrôle ce comité (art. 22).", source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La direction du comité établit le règlement de la zone (engins de pêche, saisons, espèces interdites) et le soumet au comité administratif du district, qui l'approuve et le promulgue (décision n° 0766 de 2025, art. 9) ; le comité fixe les conditions du classement de la zone en zone interdite ou saisonnière (art. 6), les règles de pêche d'une zone saisonnière (art. 17) et les règles propres à chaque localité sur les infractions (art. 24) ; la loi de 2009 prévoyait déjà des règlements villageois valides après approbation du gouverneur de district (art. 53 et 54).", source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
  justice_propre: {valeur: "partiel", note: "Le comité de médiation enquête sur les auteurs d'infractions et règle les affaires par médiation (décision n° 0766 de 2025, art. 9) ; le comité de patrouille retient le contrevenant, saisit les engins de pêche et inflige une amende à la deuxième et à la troisième infraction selon le règlement (art. 9 et 10) ; les contrevenants encourent, selon la gravité, éducation, avertissement, amende ou sanction disciplinaire (art. 24) ; la loi de 2009 confiait déjà au comité de gestion des pêches le règlement des litiges de pêche, avec recours à l'échelon supérieur (art. 40).", source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les animaux aquatiques naturels appartiennent à la communauté nationale et l'État reconnaît des droits d'usage (loi n° 41/AN de 2023, art. 6) ; dans la zone, le comité de gestion planifie la délimitation, les secteurs interdits et la pêche, autorise le lâcher de poissons, donne son accord aux prélèvements scientifiques et fixe les règles de la pêche saisonnière, possible seulement après trois ans de gestion continue (décision n° 0766 de 2025, art. 9, 13, 16 et 17).", source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
  consentement: {valeur: "partiel", note: "La création d'une zone part d'une demande écrite du ou des villages, accompagnée du procès-verbal de la réunion villageoise et d'un relevé du site (décision n° 0766 de 2025, art. 7) ; le district peut supprimer la zone sur proposition du comité, ou lorsque le site est affecté à un autre usage par un plan de développement de l'État (art. 12), sans exigence de consentement du village.", source: "https://laoofficialgazette.gov.la/kcfinder/upload/files/0766,22,8,2025.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
