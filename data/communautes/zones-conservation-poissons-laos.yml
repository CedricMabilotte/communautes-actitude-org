effectivite: {valeur: "partielle", note: "Le rapport de 2018 de FISHBIO, du WWF Laos et du Département de l'élevage et de la pêche, préparé pour le Fonds de partenariat pour les écosystèmes critiques, indique que les zones recensées peuvent ne pas être toutes actives et n'exister que de nom ; les causes relevées en atelier comprennent le manque de budget pour la surveillance et les changements de direction villageoise ; le sixième rapport national à la CDB (2019) relève des difficultés de gestion et de suivi.", source: "https://data.opendevelopmentmekong.net/dataset/7aa6bb8c-8f2a-4537-92c9-69973023a57e/resource/6e308e77-8bc7-481c-adf9-8482fd8bd1ca/download/fcz-status-report-for-lao-pdr-2018.pdf"}
chronologie:
  - {annee: 1993, evenement: "Première zone de conservation des poissons officiellement reconnue, dans le district de Khong (province de Champasak)."}
  - {annee: 2009, evenement: "Loi sur la pêche n° 03/AN du 9 juillet : comités de gestion des pêches et règlements de pêche villageois (art. 50 à 54)."}
  - {annee: 2017, evenement: "Deux ateliers gouvernementaux, à Luang Prabang et à Savannakhet, recensent les zones par province."}
  - {annee: 2018, evenement: "Le Département de l'élevage et de la pêche dénombre 1 313 zones officielles et 364 zones communautaires non approuvées."}
  - {annee: 2019, evenement: "Le sixième rapport national à la CDB rend compte de l'objectif national de la stratégie 2016-2025 : au moins 250 zones de conservation des poissons."}
  - {annee: 2023, evenement: "Loi n° 41/AN du 17 juillet sur les animaux aquatiques et la pêche, en vigueur le 2 octobre ; elle remplace la loi de 2009."}
  - {annee: 2025, evenement: "Décision ministérielle n° 0766 du 22 août sur la gestion des zones de conservation des poissons, en vigueur le 29 septembre."}
fiabilite:
  verifie: ["Loi de 2009 : art. 3 (définition de la zone de conservation), 40 et 50 à 54, traduction anglaise publiée par FAOLEX.", "Loi n° 41/AN de 2023 (texte lao publié au Journal officiel, lu par reconnaissance optique de caractères) : art. 6, 30, 31, 84, 87 et 99 (remplacement de la loi de 2009, entrée en vigueur le 2 octobre 2023).", "Décision n° 0766 du 22 août 2025 (texte lao publié au Journal officiel) : art. 6 à 17 et 24 ; date de signature et entrée en vigueur au 29 septembre 2025 lues sur l'image du document.", "Chiffres 1 313, 364 et 1 677 et surface de 2 974,30 hectares : tableau 1 du rapport de 2018 (données du Département de l'élevage et de la pêche au 13 mars 2018).", "Sixième rapport national à la CDB (2019), objectif national 3."]
  non_confirme: ["Les citations de la loi de 2023 et de la décision de 2025 reposent sur une lecture optique du texte lao, sans traduction officielle ; le numéro de la décision n'apparaît que par le tampon « 0766 ».", "Nombre de zones : 885 selon le sixième rapport à la CDB (2018) et 1 313 officielles selon le rapport de 2018 ; la version du rapport mise en ligne par le CEPF donne 236 zones non officielles dans son résumé, contre 364 dans son tableau et dans la version d'Open Development Mekong (1 313 + 364 = 1 677).", "Statut des zones créées sous la loi de 2009 après l'entrée en vigueur de la décision de 2025 : aucune disposition transitoire trouvée.", "Nombre de villages : le tableau du rapport de 2018 donne les villages par province sans total ; 1 162 est la somme des 17 provinces renseignées, Xayaburi exclue.", "Aucune liste officielle des zones site par site n'a été trouvée ; pas de tableau.", "Population : non trouvée."]
