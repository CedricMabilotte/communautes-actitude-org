droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement flamand et gouvernement de la Communauté flamande, Constitution, art. 115 et 121 ; le parlement est composé de mandataires élus (art. 116) et élit le gouvernement (art. 122) ; il règle par décret certaines matières relatives à sa propre composition et à son fonctionnement (art. 118 § 2 et 123 § 2).", source: "https://www.senate.be/doc/const_fr.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le parlement règle par décret les matières culturelles, l'enseignement et les matières personnalisables, y compris la coopération internationale et la conclusion de traités dans ces matières, Constitution, art. 127, 128 et 167 ; ces décrets ont force de loi dans la région de langue néerlandaise et à l'égard des institutions bruxelloises qui relèvent de la seule Communauté flamande (art. 127 § 2 et 128 § 2) ; le parlement et le gouvernement exercent aussi les compétences de la Région flamande, art. 137.", source: "https://www.senate.be/doc/const_fr.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les limites des régions linguistiques et les lois spéciales exigent une majorité dans chaque groupe linguistique des chambres fédérales, dont le groupe linguistique néerlandais, Constitution, art. 4 ; les trois quarts d'un groupe linguistique peuvent suspendre un projet de loi jugé contraire aux relations entre communautés (procédure dite de la « sonnette d'alarme »), art. 54 ; ces droits appartiennent aux élus fédéraux néerlandophones, non aux organes de la Communauté.", source: "https://www.senate.be/doc/const_fr.html"}
  langue: {valeur: "reconnu", note: "La région de langue néerlandaise est une des quatre régions linguistiques, Constitution, art. 4 ; le Parlement flamand règle par décret, à l'exclusion du législateur fédéral, l'emploi des langues en matière administrative, dans l'enseignement et dans les relations de travail, art. 129 ; ces décrets ne s'appliquent ni aux communes à facilités (communes où la loi prescrit ou permet une autre langue), ni aux services dont l'activité dépasse la région linguistique, ni aux institutions fédérales et internationales désignées par la loi, art. 129 § 2.", source: "https://www.senate.be/doc/const_fr.html"}
  education: {valeur: "reconnu", note: "L'enseignement relève du Parlement flamand, sauf le début et la fin de l'obligation scolaire, les conditions minimales de délivrance des diplômes et le régime des pensions, Constitution, art. 127 § 1er, 2°.", source: "https://www.senate.be/doc/const_fr.html"}
  fiscalite: {valeur: "partiel", note: "Un impôt au profit d'une communauté ou d'une région peut être établi par décret, Constitution, art. 170 § 2 ; le système de financement de la Communauté est fixé par une loi fédérale à majorité spéciale et le Parlement flamand règle l'affectation de ses recettes, art. 175.", source: "https://www.senate.be/doc/const_fr.html"}
  representation: {valeur: "reconnu", note: "Le Parlement flamand désigne vingt-neuf sénateurs sur soixante, dont au moins un domicilié à Bruxelles-Capitale, Constitution, art. 67 ; la Chambre et le Sénat ont un groupe linguistique néerlandais, art. 43 ; le Conseil des ministres compte autant de ministres d'expression néerlandaise que d'expression française, Premier ministre excepté, art. 99.", source: "https://www.senate.be/doc/const_fr.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'Université Laval décrit un seul Parlement flamand et un seul gouvernement flamand qui exercent à la fois les compétences communautaires et régionales, et recense des décrets et arrêtés flamands sur l'emploi des langues, l'enseignement et l'intégration civique, de 1981 à 2014.", source: "https://www.axl.cefan.ulaval.ca/europe/belgiquefla.htm"}
chronologie:
  - {annee: 1963, evenement: "Loi du 30 juillet 1963 concernant le régime linguistique dans l'enseignement."}
  - {annee: 1980, evenement: "Loi spéciale du 8 août 1980 de réformes institutionnelles ; les institutions communautaires et régionales flamandes sont fusionnées."}
  - {annee: 1994, evenement: "Constitution coordonnée du 17 février 1994 : art. 2, 4, 115, 121, 127 à 129 et 137."}
  - {annee: 1995, evenement: "Première élection directe du Parlement flamand."}
  - {annee: 2014, evenement: "Réforme du Sénat : le Parlement flamand désigne vingt-neuf sénateurs (art. 67)."}
