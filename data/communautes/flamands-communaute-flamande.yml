resume: >-
  La Constitution belge compte trois communautés, dont la Communauté flamande (art. 2), et quatre régions linguistiques, dont la région de langue néerlandaise (art. 4). Le Parlement flamand et le gouvernement flamand exercent à la fois les compétences de la Communauté flamande et celles de la Région flamande (art. 137). Le parlement adopte des décrets (normes ayant force de loi) en matière culturelle, d'enseignement, de matières personnalisables (matières liées à la personne) et d'emploi des langues (art. 127 à 129). Ces décrets s'appliquent dans la région de langue néerlandaise ; ceux qui portent sur la culture, l'enseignement et les matières personnalisables s'appliquent aussi aux institutions de Bruxelles-Capitale qui relèvent de cette seule communauté. Les institutions néerlandophones de Bruxelles ont aussi leur fiche (« Néerlandophones de Bruxelles »).
