resume: >-
  Salinas est une population aymara du sud de l'Altiplano, entre les salars de Tauca et de Thunupa, organisée en communautés, ayllus (lignages territoriaux) et markas (groupes d'ayllus). L'ancienne commune de Salinas de Garci Mendoza vote en 2009 sa conversion en AIOC (« Autonomía Indígena Originario Campesina », collectivité territoriale autochtone prévue par la Constitution de 2009). Le statut, déclaré conforme à la Constitution en 2018, est approuvé par référendum le 26 mai 2019 avec 51,8 % des voix. Le gouvernement autonome s'installe le 4 janvier 2021 : une assemblée des autorités originaires (Jach'a Tantachawi), un exécutif (Qulqi Kamachi) et neuf administrateurs territoriaux (Qulqi Apnaqiri).
