uid: "reserves-communales-perou"
nom: "Réserves communales du Pérou"
endonyme: ""
territoire: "Réserves communales (catégorie d'aire naturelle protégée) de l'Amazonie péruvienne, dans les départements d'Amazonas, Cusco, Huánuco, Junín, Loreto, Madre de Dios, Pasco et Ucayali"
etats: ["Pérou"]
region: "ameriques"
coord: [-8.5, -74.5]
type: "communaute_locale"
base: "territoriale"
types_secondaires: ["peuple_autochtone"]
population: {valeur: 41887, annee: 2019, perimetre: "population estimée des quelque 200 communautés natives associées aux dix réserves communales alors établies (19 peuples) ; estimation de l'ANECAP reprise dans le document de travail n° 35 du SERNANP (août 2019)", source: "https://sinia.minam.gob.pe/sites/default/files/archivos/public/docs/DdT%2035_Modelo%20de%20Cogestion.pdf"}
lieux: {valeur: 11, unite: "réserves communales inscrites dans la couche « ANP Nacional Definitiva » du Service national des aires naturelles protégées (SERNANP), dont Bajo Putumayo Yaguas, établie en 2025", annee: 2025, source: "https://geoservicios.sernanp.gob.pe/arcgis/rest/services/sernanp_visor/servicio_descarga/MapServer/1/query?where=anp_cate%3D%27Reserva+Comunal%27&outFields=*&returnGeometry=false&f=json"}
surface_km2: {valeur: 23272, annee: 2025, perimetre: "somme des superficies légales des 11 réserves communales dans la base du SERNANP (2 327 192,85 ha) ; zones tampons et paysage associé exclus", source: "https://geoservicios.sernanp.gob.pe/arcgis/rest/services/sernanp_visor/servicio_descarga/MapServer/1/query?where=anp_cate%3D%27Reserva+Comunal%27&outFields=*&returnGeometry=false&f=json"}
villages: {valeur: 204, annee: 2018, perimetre: "communautés natives bénéficiaires des dix réserves communales alors établies, selon Mongabay (2018) ; l'ANECAP indique 200 communautés associées aux dix ECA", source: "https://es.mongabay.com/2018/04/peru-reservas-comunales-pueblos-indigenas/"}
resume: >-
  Fiche agrégée : elle couvre les communautés natives et paysannes bénéficiaires des réserves communales du Pérou. La loi 26834 de 1997 sur les aires naturelles protégées fait de la réserve communale une catégorie d'aire protégée « de uso directo » (où l'extraction de ressources est permise), destinée à la conservation de la faune et de la flore au bénéfice des populations rurales voisines, qui exploitent les ressources selon des plans de gestion qu'elles conduisent. Le régime spécial d'administration de 2005 (résolution d'intendance 019-2005-INRENA-IANP) confie la gestion, par un contrat de durée indéfinie, à un exécutant du contrat d'administration (ECA), association sans but lucratif créée par les communautés bénéficiaires ; l'État conserve la propriété des terres, nomme le chef de la réserve et supervise. La première réserve (Yanesha) date de 1988 ; le SERNANP en recense 11 en 2025, sur 23 272 km².
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Pérou ratifie la Convention 169 de l'OIT : dépôt de l'instrument le 2 février 1994, entrée en vigueur pour le Pérou le 2 février 1995 ; le régime spécial de 2005 déclare développer la loi sur les aires protégées en concordance avec la Convention (art. 2), soumet les consultations à ses dispositions (art. 5) et prévoit que ses normes complémentaires seront élaborées par consultation conforme à la Convention (cinquième disposition finale)", annee: 1994, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
base_nationale:
  - {instrument: "Loi 26834 sur les aires naturelles protégées (Journal officiel El Peruano du 4 juillet 1997), art. 21 b) et 22 g) (réserves communales)", nature: "loi", annee: 1997, source: "https://www.leyes.congreso.gob.pe/Documentos/Leyes/26834.pdf"}
  - {instrument: "Résolution d'intendance 019-2005-INRENA-IANP approuvant le régime spécial d'administration des réserves communales (7 juin 2005, publiée le 24 juin 2005), prise en application des art. 56 et 125 du règlement de la loi 26834 (décret suprême 038-2001-AG)", nature: "loi", annee: 2005, source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  - {instrument: "Décret suprême 037-2001-AG créant la réserve communale El Sira (exemple de décret de création : bénéficiaires, absence de droit de propriété, conduite par les communautés)", nature: "loi", annee: 2001, source: "https://legislacionanp.org.pe/wp-content/uploads/2001/06/Decreto-Supremo-No-037-2001-AG.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'ECA est une personne morale sans but lucratif créée par les bénéficiaires, avec une assemblée générale des représentants directs des communautés (présidents, chefs, apus) et un conseil de direction élu par elle (régime spécial de 2005, art. 13 et 14) ; il administre la réserve par un contrat de durée indéfinie signé avec l'État (art. 11 et 19). L'État reconnaît l'ECA par résolution (art. 18), choisit le chef de la réserve sur une liste de trois noms proposée par l'ECA (art. 35), garde le contrôle et la supervision (art. 11 et 35) ; en cas de manquements répétés, le contrat peut être suspendu et l'administration revient alors à l'État (art. 34).", source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Pour ce que le régime spécial ne prévoit pas, s'appliquent les normes générales sur les aires protégées et « las normas consuetudinarias » (les normes coutumières) compatibles avec l'objectif de la réserve (art. 4) ; l'assemblée générale de l'ECA adopte ses règlements internes (art. 26 f) et approuve le projet de plan directeur avant son approbation officielle (art. 26 c).", source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  justice_propre: {valeur: "partiel", note: "En cas de conflit sur l'usage des ressources entre bénéficiaires, l'ECA tranche en coordination avec le chef de la réserve ; sa décision peut être revue par l'autorité (art. 55). En cas de différend ou de manquement au contrat, l'État et le conseil de direction de l'ECA proposent une solution conforme aux usages et coutumes des communautés, dans la mesure où ils sont compatibles avec le droit national (art. 34).", source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  terres: {valeur: "partiel", note: "Les réserves communales sont « patrimonio de la Nación » (patrimoine de l'État) (régime spécial, art. 1) ; les décrets de création précisent qu'elles ne confèrent aucun droit de propriété sur les terres (décret suprême 037-2001-AG, art. 3 ; décret suprême 031-2002-AG, art. 2). Les communautés n'ont que la gestion de l'aire, par le contrat d'administration de durée indéfinie (art. 19).", source: "https://legislacionanp.org.pe/wp-content/uploads/2001/06/Decreto-Supremo-No-037-2001-AG.pdf"}
  ressources: {valeur: "partiel", note: "L'exploitation et la commercialisation des ressources sont faites directement par les bénéficiaires, selon des plans de gestion qu'ils conduisent et que l'autorité approuve ; les usages ancestraux de subsistance, médicinaux et spirituels en sont dispensés (art. 53 et 54). Le bois est exclu des ressources commercialisables (art. 1) ; la loi 26834 (art. 22 g) prévoit des plans de gestion « conducidos por los mismos beneficiarios ».", source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  consentement: {valeur: "partiel", note: "Les consultations sur les bénéficiaires, la formation de l'ECA et la réserve suivent la Convention 169 et les mécanismes de décision des communautés (art. 5). L'autorité doit obtenir l'avis préalable favorable de l'ECA sur les demandes d'usage de ressources de sa compétence et avant d'autoriser d'autres institutions à intervenir dans la réserve (art. 25 f et g) ; pour les projets relevant d'autres secteurs ou niveaux de gouvernement, l'ECA émet un simple avis (art. 26 n).", source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le contrat autorise l'ECA à percevoir des redevances pour les services de la réserve (entrées de visiteurs, droits payés par les concessionnaires), qui s'ajoutent aux fonds que l'État peut affecter à l'aire (art. 29) ; l'ECA administre ces ressources et soumet un budget annuel et un bilan audité à l'autorité (art. 26 j, 30 et 31).", source: "https://legislacionanp.org.pe/wp-content/uploads/2005/06/Resolucion-de-Intendencia-No-019-2005-INRENA-IANP.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Mongabay (avril 2018), neuf des dix réserves alors établies avaient signé leur contrat d'administration, celui de Huimeki restant en attente ; les dirigeants des ECA citent l'exploitation minière, pétrolière et forestière comme menaces, et le SERNANP indique avoir besoin de ressources propres pour renforcer l'organisation des réserves.", source: "https://es.mongabay.com/2018/04/peru-reservas-comunales-pueblos-indigenas/"}
chronologie:
  - {annee: 1988, evenement: "Résolution suprême 0193-88-AG-DGFF : réserve communale Yanesha (34 744,70 ha, Pasco), au bénéfice de dix communautés natives yanesha."}
  - {annee: 1997, evenement: "Loi 26834 sur les aires naturelles protégées : la réserve communale devient une catégorie du système national d'aires protégées."}
  - {annee: 2001, evenement: "Règlement de la loi 26834 (décret suprême 038-2001-AG) ; création de la réserve communale El Sira."}
  - {annee: 2002, evenement: "Création de la réserve communale Amarakaeri (Madre de Dios)."}
  - {annee: 2003, evenement: "Création des réserves Asháninka et Machiguenga ; régime transitoire d'administration (résolution d'intendance 010-2003-INRENA-IANP)."}
  - {annee: 2004, evenement: "Création de la réserve communale Purús."}
  - {annee: 2005, evenement: "Résolution d'intendance 019-2005-INRENA-IANP : régime spécial d'administration des réserves communales, après une consultation ouverte en 2003."}
  - {annee: 2006, evenement: "Premier contrat d'administration, signé pour la réserve Yanesha."}
  - {annee: 2007, evenement: "Création de la réserve communale Tuntanain (Amazonas)."}
  - {annee: 2009, evenement: "Création de la réserve communale Chayu Naín (Amazonas)."}
  - {annee: 2012, evenement: "Création des réserves Airo Pai et Huimeki (Loreto) par le décret suprême 006-2012-MINAM."}
  - {annee: 2017, evenement: "Création de l'ANECAP à Puerto Maldonado le 23 mai."}
  - {annee: 2025, evenement: "Création de la réserve communale Bajo Putumayo Yaguas (Loreto) par le décret suprême 020-2025-MINAM."}
fiabilite:
  verifie: ["Texte du régime spécial de 2005 (résolution d'intendance 019-2005-INRENA-IANP), art. 1 à 55 et dispositions finales.", "Art. 21 b) et 22 g) de la loi 26834 (Journal officiel du 4 juillet 1997, copie du Congrès).", "Décrets de création consultés : Yanesha (1988), El Sira (2001, art. 1 à 4), Amarakaeri (2002, art. 1 et 2), Purús (2004), Tuntanain (2007).", "Liste des 11 réserves communales avec superficie légale, départements et base légale de création (couche « ANP Nacional Definitiva » du SERNANP).", "Date de création de l'ANECAP et liste des dix ECA (site de l'ANECAP).", "Chiffres de 2018 (dix réserves, 204 communautés, neuf contrats signés, Huimeki en attente) : Mongabay.", "Premier contrat d'administration (Yanesha, 18 décembre 2006), dix contrats signés en 2019 dont celui de Huimeki (23 avril 2019), population estimée à 41 887 personnes : document de travail n° 35 du SERNANP et de l'ANECAP (août 2019).", "Le régime spécial de 2005 est encore cité comme cadre en vigueur par la résolution présidentielle 198-2021-SERNANP (septembre 2021)."]
  non_confirme: ["Aucun texte modifiant le régime spécial de 2005 n'a été trouvé ; la recherche n'est pas exhaustive.", "Existence d'un ECA pour Bajo Putumayo Yaguas : non vérifiée.", "La population de 2019 est une estimation de l'ANECAP, non un recensement ; les 200 communautés et « plus de 42 000 personnes » du site de l'ANECAP ne sont pas datés.", "Les décrets de création d'Asháninka, Machiguenga, Chayu Naín, Airo Pai, Huimeki et Bajo Putumayo Yaguas n'ont pas été lus ; leurs données viennent de la base du SERNANP.", "Aucun rapport d'un organe de l'ONU ou du Rapporteur spécial visant nommément le régime des réserves communales n'a été trouvé."]
