effectivite: {valeur: "partielle", note: "Selon une revue de littérature rédigée en 2017 pour le ministère de l'Agriculture et des Forêts (Miles Kenney-Lazar), seuls deux sites avaient reçu des certificats ou titres collectifs : cinq villages de Sangthong (certificats en 2011, titres en 2012, 2 189 ha de forêt villageoise, avec l'appui de l'organisation néerlandaise SNV) et dix villages de Nakai réinstallés pour le barrage Nam Theun 2 (2013, financement de la Nam Theun 2 Power Company) ; aucun autre site n'avait été titré, l'État conserve la gestion de ces terres et aucune disposition ne l'empêche de les réquisitionner.", source: "https://www.ohchr.org/sites/default/files/Documents/Issues/EPoverty/Lao/MilesKenneyLazarAnnex4.pdf"}
chronologie:
  - {annee: 2007, evenement: "Instruction ministérielle n° 564/NLMA (6 août) : définition des terres collectives et procédure de titrage."}
  - {annee: 2008, evenement: "Décret n° 88/PM d'application de la loi foncière de 2003 (juin) : terres collectives définies comme terres dont l'État accorde l'usage collectif aux villageois, aux organisations et aux organismes de l'État."}
  - {annee: 2011, evenement: "Premiers certificats temporaires d'usage collectif délivrés à cinq villages du district de Sangthong, pour 2 189 ha de forêt secondaire, surtout de bambou ; titres remis en 2012."}
  - {annee: 2013, evenement: "Titres collectifs permanents sur 17 428 ha de forêts, de terres agricoles et de terres d'intérêt public délivrés aux 14 hameaux réinstallés du district de Nakai (province de Khammouane), regroupés depuis en dix villages."}
  - {annee: 2019, evenement: "Loi foncière n° 70/AN (21 juin), promulguée le 2 août : article 81 sur l'usage collectif des terres de l'État."}
  - {annee: 2024, evenement: "Résolution de l'Assemblée nationale (mai) modifiant la loi foncière pour permettre, selon des critères, des titres et certificats d'usage dans les zones classées forestières ; en mars 2025, directives d'application en préparation et reconnaissance des droits collectifs sur les forêts encore non réglée."}
fiabilite:
  verifie:
    - "Article 81 de la loi foncière n° 70/AN du 21 juin 2019 et date de promulgation, dans la traduction anglaise non officielle du Land Information Working Group."
    - "Définition des terres collectives et interdictions de vente, cession, garantie, location et concession dans l'instruction n° 564/NLMA du 6 août 2007 (FAOLEX)."
    - "Sites de Sangthong (cinq villages, 2 189 ha, certificats 2011, titres 2012) et de Nakai (dix villages, 2013), et absence d'autre site titré en 2017, dans la revue de Miles Kenney-Lazar pour le ministère de l'Agriculture et des Forêts."
    - "Surface des titres de Nakai (17 428 ha) et regroupement des 14 hameaux en dix villages, dans l'étude de Jeremy Ironside (MRLG, 2017), qui cite Schneider (2013)."
    - "Remise des titres de Sangthong et appui de SNV, du Programme de microfinancements du FEM et du PNUD, dans l'article de The New Humanitarian du 16 avril 2012."
    - "Résolution de mai 2024 et état des directives d'application, dans l'article du GRET du 4 mars 2025."
  non_confirme:
    - "Titres collectifs délivrés après 2017 : aucune statistique officielle trouvée ; pas de liste officielle des sites."
    - "Surface de Nakai : chiffre de seconde main (Schneider 2013, cité par Ironside 2017) ; titre lui-même non consulté."
    - "Maintien en vigueur de l'instruction n° 564/NLMA de 2007 après l'abrogation de la loi foncière de 2003 : non vérifié."
    - "Direction ministérielle n° 3036/MoNRE (2014) distinguant terres collectives (din luam mu) et terres communales (din xoum xon), citée par Jeremy Ironside (2017), et recommandation n° 6036/MONRE (2014) sur l'enregistrement et le titrage : textes non consultés."
    - "Les textes consultés sont des traductions anglaises non officielles ; la version lao fait foi."
