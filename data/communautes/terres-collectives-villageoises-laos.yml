resume: >-
  La loi foncière n° 70/AN du 21 juin 2019 (art. 81) permet à l'État d'attribuer aux habitants d'un ou de plusieurs villages un droit d'usage collectif sur des terres de l'État : cimetières, forêts sacrées, mares communes, temples, écoles, centres de santé, bureaux administratifs et marchés de village. Ce droit ne peut être ni cédé, ni vendu, ni échangé, ni loué, ni concédé, ni apporté dans une coentreprise ou en garantie. L'instruction ministérielle n° 564/NLMA du 6 août 2007 encadre l'enregistrement et le titrage de ces terres, qu'elle définit notamment comme les terres de village utilisées en commun par la communauté et par les groupes ethniques du village. En 2017, des titres collectifs n'avaient été délivrés que dans deux sites pilotes : cinq villages du district de Sangthong (certificats en 2011) et dix villages du district de Nakai (titres en 2013). Voir aussi les fiches « Forêts villageoises du Laos » et « Zones villageoises de conservation des poissons du Laos ».
