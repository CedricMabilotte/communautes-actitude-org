resume: >-
  Les Mi'kmaq sont le peuple autochtone de la Nouvelle-Écosse. Une convention signée le 14 février 1997 avec le Canada et la province transfère aux bandes mi'kmaq signataires la compétence en éducation primaire, élémentaire et secondaire dans leurs réserves. La loi fédérale (L.C. 1998, ch. 24) et la loi provinciale (1998, ch. 17), en vigueur le 22 avril 1999, donnent effet à cette convention et créent Mi'kmaw Kina'matnewey, personne morale dont les chefs forment le conseil d'administration. Neuf des treize communautés mi'kmaq de la province ont signé la convention en 1997 ; elles sont douze depuis 2014 ; la treizième, Millbrook, a annoncé son adhésion pour avril 2027. Depuis 2022, une loi provinciale reconnaît le mi'kmaw comme langue d'origine de la province.
