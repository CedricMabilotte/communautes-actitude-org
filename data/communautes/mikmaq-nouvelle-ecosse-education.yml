droits:
  autogouvernement: {valeur: "partiel", note: "Les attributions de chaque communauté sont exercées par son conseil de bande au sens de la Loi sur les Indiens, selon une constitution en matière d'éducation, loi fédérale de 1998, art. 2, 3 et 5 ; les chefs des communautés forment le conseil d'administration de Mi'kmaw Kina'matnewey, art. 10. La reconnaissance se limite à l'éducation.", source: "https://laws-lois.justice.gc.ca/fra/lois/M-7.6/page-1.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque communauté peut légiférer, pour sa réserve, sur l'éducation primaire, élémentaire et secondaire, et sur la gestion des fonds d'aide aux études postsecondaires de ses membres, loi fédérale de 1998, art. 6 ; en cas de conflit, ces lois l'emportent sur toute autre loi scolaire de la province, loi provinciale de 1998, art. 5(2).", source: "https://nslegislature.ca/sites/default/files/legc/statutes/mi'kmaq%20education.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les réserves sont détenues par la Couronne à l'usage et au profit des bandes, Loi sur les Indiens, art. 18(1) ; ce régime est commun à toutes les Premières Nations et n'est pas modifié par la loi sur l'éducation.", source: "https://laws-lois.justice.gc.ca/fra/lois/I-5/page-3.html"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "La Mi'kmaw Language Act de 2022 reconnaît le mi'kmaw comme langue d'origine de la province, art. 2 a), et crée un comité conjoint, dont quatre membres sont nommés par Mi'kmaw Kina'matnewey et un par chacune des 13 communautés mi'kmaq de la province, pour élaborer une stratégie de revitalisation, art. 5(1) et 5(6) ; le mi'kmaw n'y reçoit pas le statut de langue officielle.", source: "https://nslegislature.ca/sites/default/files/legc/statutes/mi'kmaw%20language.pdf"}
  education: {valeur: "reconnu", note: "Chaque communauté offre aux résidents de sa réserve des programmes et services d'éducation primaire, élémentaire et secondaire, comparables à ceux des autres systèmes canadiens pour permettre le passage d'un système à l'autre, loi fédérale de 1998, art. 7 ; les articles 114 à 122 de la Loi sur les Indiens (écoles) cessent de s'appliquer, art. 11.", source: "https://laws-lois.justice.gc.ca/fra/lois/M-7.6/page-1.html"}
  fiscalite: {valeur: "partiel", note: "Chaque communauté légifère sur la gestion et l'emploi de ses fonds d'aide aux études postsecondaires, loi fédérale de 1998, art. 6(2) ; le financement relève d'ententes avec le Canada, dont celle signée le 14 mars 2019 pour dix ans (jusqu'au 31 mars 2028). Aucun pouvoir fiscal n'est prévu par la loi.", source: "https://www.canada.ca/en/crown-indigenous-relations-northern-affairs/news/2019/03/road-to-academic-success-canada-supports-mikmaq-nova-scotia-first-nations.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Selon Radio-Canada (2019), Mi'kmaw Kina'matnewey rapportait un taux d'obtention du diplôme secondaire de 89,6 % en 2016-2017, contre 30 % vingt ans plus tôt ; le taux de la province était de 92,3 %. La même source compte environ 3 000 élèves de la maternelle à la 12e année dans les réserves de la province. Une étude de l'Institute On Governance (2001) rapporte, d'après des responsables de Mi'kmaw Kina'matnewey et d'Eskasoni, un financement insuffisant de l'aide postsecondaire et l'absence de données de référence lors du transfert.", source: "https://ici.radio-canada.ca/nouvelle/1158483/education-premieres-nations-micmacs-nouvelle-ecosse-diplomes-succes-etudes"}
chronologie:
  - {annee: 1992, evenement: "Accord-cadre d'avril entre le gouvernement fédéral et les chefs des 13 communautés mi'kmaq pour négocier le transfert des programmes d'éducation."}
  - {annee: 1994, evenement: "Accord politique de novembre engageant les parties dans la négociation d'un transfert de compétence."}
  - {annee: 1997, evenement: "Convention sur la compétence en éducation signée le 14 février par neuf communautés, le Canada et la Nouvelle-Écosse."}
  - {annee: 1999, evenement: "Entrée en vigueur des lois fédérale et provinciale le 22 avril ; constitution de Mi'kmaw Kina'matnewey."}
  - {annee: 2005, evenement: "Ajout de la bande de Bear River à l'annexe (DORS/2005-275)."}
  - {annee: 2011, evenement: "Ajout de la Première Nation de Paq'tnkek à l'annexe (DORS/2011-190)."}
  - {annee: 2014, evenement: "Ajout de la Première Nation de Glooscap à l'annexe (DORS/2014-132) ; douze communautés participent."}
  - {annee: 2019, evenement: "Entente de financement de dix ans avec le Canada, signée le 14 mars."}
  - {annee: 2022, evenement: "Mi'kmaw Language Act, en vigueur le 1er octobre (jour du Traité)."}
  - {annee: 2024, evenement: "Renouvellement pour cinq ans, le 30 mai, de l'entente avec la province sur les élèves mi'kmaq des écoles publiques."}
  - {annee: 2026, evenement: "La Première Nation de Millbrook annonce son adhésion à Mi'kmaw Kina'matnewey, effective en avril 2027."}
