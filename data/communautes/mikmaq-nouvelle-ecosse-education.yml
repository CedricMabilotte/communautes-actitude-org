reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, a ensuite changé de position et l'appuie ; la loi fédérale de 2021 (L.C. 2021, ch. 14, art. 4 a)) confirme qu'elle trouve application en droit canadien. Le préambule de la Mi'kmaw Language Act de 2022 cite la Déclaration.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
