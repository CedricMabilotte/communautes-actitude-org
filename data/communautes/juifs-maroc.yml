  verifie: ["Texte du dahir n° 1-22-64 (art. 1, 2, 4, 7, 9, 14, 19, 24, 26, 27, 29, 30, 32, 39, 49, 50) au Bulletin officiel n° 7140 du 3 novembre 2022.", "Préambule et art. 3 et 41 de la Constitution de 2011 (Constitute Project).", "Rapport du Maroc au CERD, CERD/C/MAR/19-21, par. 101 (chambres hébraïques, sept juges-rabbins).", "Article de Medias24 (2014) sur les compétences des chambres hébraïques.", "Rapport 2023 du département d'État sur la liberté religieuse (Maroc) : environ 1 500 Juifs dans le pays selon les responsables de la communauté, dont environ 1 000 à Casablanca ; le rapport 2022 en cite 3 500."]
  non_confirme: ["Article 2 du Code de la famille de 2004 (renvoi au statut personnel hébraïque pour les Marocains de confession juive) : texte primaire non consulté.", "Siège des chambres hébraïques : Casablanca et Tanger selon Medias24 (2014), Casablanca et Marrakech selon le rapport de l'État (2020).", "Installation effective du Conseil national et tenue des élections prévues par le dahir de 2022 : aucune source trouvée.", "Population : environ 2 100 personnes selon la Jewish Virtual Library, sans année ni méthode indiquées ; chiffre non retenu.", "Aucun document d'un organe de l'ONU nommant la communauté n'a été trouvé ; les observations finales du CERD de 2023 (CERD/C/MAR/CO/19-21) ne la mentionnent pas.", "Population : le rapport 2022 du département d'État cite 3 500 personnes d'après les responsables de la communauté, celui de 2023 en cite 1 500 ; aucun recensement ne compte la population par religion.", "Surface et nombre de villages : sans objet pour une communauté à base personnelle ; non renseignés."]
