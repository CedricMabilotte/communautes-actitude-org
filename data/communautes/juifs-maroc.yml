resume: >-
  Le dahir n° 1-22-64 du 24 octobre 2022 (décret royal) organise la communauté juive marocaine et remplace le dahir du 7 mai 1945 sur les comités de communautés israélites.
  Il crée auprès du roi un Conseil national de la communauté juive marocaine, personne morale de droit public siégeant à Rabat, composé de 12 membres nommés par le roi et de 12 membres élus par les Marocains de confession juive dans des circonscriptions régionales.
  Le Conseil administre le culte, les synagogues, les cimetières, les fondations pieuses (heqdesh) et le patrimoine de la communauté ; le dahir crée aussi des comités régionaux, une Commission des Juifs marocains de l'étranger (consultative) et une Fondation du judaïsme marocain dotée de la personnalité morale.
  Le statut personnel des Marocains de confession juive relève de chambres hébraïques (sections spécialisées des tribunaux) où siègent des juges-rabbins appliquant le droit hébraïque.
