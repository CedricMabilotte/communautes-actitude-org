base_nationale:
  - {instrument: "Constitution du Royaume du Maroc, préambule (« affluents africain, andalou, hébraïque et méditerranéen ») et art. 3 et 41 (libre exercice des cultes)", nature: "constitution", annee: 2011, source: "https://www.constituteproject.org/constitution/Morocco_2011?lang=en"}
  - {instrument: "Dahir n° 1-22-64 du 24 octobre 2022 portant organisation de la communauté juive marocaine et création de la Fondation du judaïsme marocain (BO n° 7140 du 3 novembre 2022)", nature: "loi", annee: 2022, source: "https://www.sgg.gov.ma/BO/FR/2873/2022/BO_7140_Fr.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Dahir de 2022, art. 1, 4 et 14 : Conseil national, personne morale de droit public, de 12 membres élus au scrutin de liste régional et 12 membres nommés par le roi sur proposition du ministre de l'Intérieur, président nommé par dahir, comités régionaux ; un représentant du ministre de l'Intérieur siège de droit, la déchéance des membres est constatée par ce ministre (art. 7) et le règlement intérieur est soumis à l'approbation du roi (art. 19).", source: "https://www.sgg.gov.ma/BO/FR/2873/2022/BO_7140_Fr.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "partiel", note: "Les chambres hébraïques sont des sections des tribunaux de première instance de l'État, réservées aux Marocains de confession juive, où des juges-rabbins statuent selon le droit hébraïque en matière de statut personnel (rapport de l'État au CERD, 2020, par. 101) ; ces juges sont des fonctionnaires de l'État, et non des juges désignés par la communauté ; en 2014, seules les chambres de Casablanca (cinq juges) et de Tanger fonctionnent (Medias24, 2014).", source: "https://www.medias24.com/SOCIETE/14075-Chambres-hebraiques-une-exception-marocaine.html"}
  terres: {valeur: "partiel", note: "Dahir de 2022, art. 26-27 : le Conseil est seul habilité à recenser et conserver les biens de la communauté, à acquérir, échanger ou céder des immeubles en son nom ; les biens immobiliers des communautés juives existantes lui sont transférés de plein droit, en franchise de droits et taxes. Il s'agit de biens cultuels et patrimoniaux, sans territoire.", source: "https://www.sgg.gov.ma/BO/FR/2873/2022/BO_7140_Fr.pdf"}
  ressources: {valeur: "non_applicable", note: "Fiche à base personnelle : le régime porte sur des personnes et des biens cultuels, sans territoire ni ressource naturelle.", source: ""}
  consentement: {valeur: "non_etabli", note: "Dahir de 2022, art. 2-3 : le Conseil donne avis au roi sur les affaires de la communauté et peut être saisi par le gouvernement ; aucun texte n'oblige l'État à le consulter avant de décider.", source: "https://www.sgg.gov.ma/BO/FR/2873/2022/BO_7140_Fr.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "Dahir de 2022, art. 2 : le Conseil pourvoit à l'instruction religieuse hébraïque et autorise les établissements d'enseignement et de formation juifs ; art. 30 : le grand rabbin du Royaume supervise la formation des rabbins.", source: "https://www.sgg.gov.ma/BO/FR/2873/2022/BO_7140_Fr.pdf"}
  fiscalite: {valeur: "partiel", note: "Dahir de 2022, art. 24 : budget du Conseil alimenté par les dons, legs et quêtes, le produit des taxes juives, les nédavoths (offrandes), les revenus des fondations pieuses (heqdesh), la location des biens de la communauté et les prestations casher, avec une subvention possible du ministère de l'Intérieur.", source: "https://www.sgg.gov.ma/BO/FR/2873/2022/BO_7140_Fr.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Les Marocains de confession juive relèvent, pour le mariage, le divorce, les successions, les actes testamentaires et les donations, du droit hébraïque appliqué par les chambres hébraïques (Medias24, 2014) ; selon le rapport de l'État au CERD (2020, par. 101), ces chambres sont officiellement reconnues comme organe juridique national ; le dahir de 2022 (art. 29) mentionne les « chambres rabbiniques près les tribunaux du Royaume ». Le régime se limite au statut personnel ; il ne crée ni nationalité ni droit de résidence propres.", source: "https://www.medias24.com/SOCIETE/14075-Chambres-hebraiques-une-exception-marocaine.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Les chambres hébraïques fonctionnent : six juges-rabbins et environ 150 dossiers par an selon Medias24 (2014), sept juges-rabbins selon le rapport de l'État au CERD (2020). Le dahir de 2022 fixe à douze mois le délai d'installation des nouvelles institutions (art. 49) ; aucune source consultée n'établit l'élection des 12 membres ni l'approbation du règlement intérieur du Conseil.", source: "https://www.medias24.com/SOCIETE/14075-Chambres-hebraiques-une-exception-marocaine.html"}
chronologie:
  - {annee: 1945, evenement: "Dahir du 7 mai 1945 relatif à la réorganisation des comités de communautés israélites marocaines."}
  - {annee: 2011, evenement: "La Constitution cite l'affluent hébraïque parmi les composantes de l'identité nationale (préambule)."}
  - {annee: 2020, evenement: "Rapport de l'État au CERD : deux chambres hébraïques, à Casablanca et Marrakech, où siègent sept juges-rabbins (par. 101)."}
  - {annee: 2022, evenement: "Dahir n° 1-22-64 du 24 octobre : Conseil national de la communauté juive marocaine, comités régionaux, Commission des Juifs marocains de l'étranger et Fondation du judaïsme marocain ; abrogation du dahir de 1945."}
