resume: >-
  L'État de Yap, l'un des quatre États fédérés de Micronésie, comprend les îles Yap et des atolls dits « îles extérieures ». Sa constitution reconnaît les chefs traditionnels (Dalip pi Nguchol) et crée deux conseils coutumiers, le Conseil de Pilung et le Conseil de Tamol. Ces conseils peuvent désapprouver toute loi votée qui porte atteinte à la tradition, à la coutume ou au rôle d'un chef traditionnel. La constitution reconnaît aussi les droits coutumiers sur les terres et sur l'espace marin.
