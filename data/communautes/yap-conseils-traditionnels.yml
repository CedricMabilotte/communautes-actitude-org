base_nationale:
  - {instrument: "Constitution de l'État de Yap (modifiée en 2004), art. III, V, VI, VII, XI à XV", nature: "constitution", annee: null, source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "« Il y a un Conseil de Pilung et un Conseil de Tamol, qui exercent les fonctions relatives à la tradition et à la coutume » ; les Dalip pi Nguchol (chefs traditionnels) et leurs rôles coutumiers sont reconnus (Constitution de Yap, art. III, s. 1 et 2). Chaque conseil fixe ses propres règles de fonctionnement et peut conseiller le gouverneur, la législature et l'administration (Code de l'État de Yap, titre 5, ch. 1, s. 102 et 103).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Toute loi votée est transmise aux deux conseils, qui peuvent la désapprouver dans les trente jours si elle porte atteinte à la tradition, à la coutume ou au rôle d'un chef traditionnel, et sont seuls juges de cette atteinte ; une loi désapprouvée ne peut être promulguée qu'après amendement répondant à leurs objections et nouvel examen par les conseils (art. V, s. 16 à 18). La tradition et la coutume sont reconnues dans le système juridique (art. III, s. 3).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  justice_propre: {valeur: "partiel", note: "Les décisions des tribunaux doivent être compatibles avec les traditions et coutumes de l'État (art. VII, s. 7) ; la législature peut codifier le droit traditionnel (art. XV, s. 1). Il n'existe pas de juridiction coutumière distincte : le pouvoir judiciaire appartient à la Cour de l'État (art. VII, s. 1).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  terres: {valeur: "reconnu", note: "Un titre foncier ne peut être acquis que conformément à la tradition et à la coutume (art. XIII, s. 3) ; un accord d'usage foncier conclu avec un non-citoyen des États fédérés ou une société qui n'est pas entièrement détenue par des citoyens ne peut dépasser cent ans (art. XIII, s. 2).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  ressources: {valeur: "reconnu", note: "L'État reconnaît les droits et la propriété traditionnels sur les ressources et les zones de l'espace marin, de la laisse de haute mer jusqu'au-delà de 12 milles des lignes de base ; aucune mesure ne peut y porter atteinte, sauf les mesures de conservation et de développement durable que l'État peut prendre jusqu'à 12 milles (art. XIII, s. 5).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  consentement: {valeur: "partiel", note: "Un navire étranger de pêche, de recherche ou d'exploration ne peut prélever de ressources dans l'espace marin de l'État qu'avec l'autorisation des titulaires des droits traditionnels et dans les conditions fixées par la loi (art. XIII, s. 6).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  langue: {valeur: "reconnu", note: "« Les langues autochtones de l'État et l'anglais sont langues officielles » (art. XIV, s. 5).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  education: {valeur: "partiel", note: "Les traditions et coutumes du peuple de l'État sont enseignées dans les écoles publiques, selon les modalités fixées par la loi (art. XII, s. 2).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Si le gouverneur réside dans les îles Yap, le lieutenant-gouverneur doit résider dans les îles extérieures, et inversement (art. VI, s. 2) ; les îles extérieures forment quatre des cinq circonscriptions législatives, avec un élu chacune, contre six élus pour les îles Yap (art. XI).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Les conseils siègent et agissent : en mars 2018, le président du Conseil de Tamol a exclu un chef d'Ulithi pour un accord de pêche conclu sans consultation (Pacific Island Times) ; en mars 2019, neuf des dix membres du Conseil de Pilung ont demandé l'expulsion d'une journaliste et la législature a jugé, le 30 avril 2019, que cette demande sortait de leur compétence (Asia Pacific Report). Aucune source indépendante sur l'usage du droit de désapprobation des lois n'a été trouvée.", source: "https://asiapacificreport.nz/2019/05/03/yap-legislature-rejects-kick-out-demand-over-us-journalist/"}
chronologie:
  - {annee: 1982, evenement: "Élections générales du 2 novembre sous la Charte du gouvernement de Yap, confirmées comme premières élections au titre de la Constitution (art. XV, s. 7)."}
  - {annee: 1990, evenement: "Fin de la tutelle de l'ONU pour les États fédérés de Micronésie (résolution 683 du Conseil de sécurité)."}
  - {annee: 2004, evenement: "Révision constitutionnelle : reconnaissance des Dalip pi Nguchol (art. III, s. 1), nouvelle rédaction du droit de désapprobation des conseils (art. V, s. 16 et 17)."}
  - {annee: 2018, evenement: "Le président du Conseil de Tamol exclut du conseil le chef de Fedrai (Ulithi) pour un accord de pêche conclu sans consultation."}
  - {annee: 2019, evenement: "Le Conseil de Pilung demande l'expulsion d'une journaliste ; le 30 avril, la législature juge la demande hors de sa compétence."}
  - {annee: 2023, evenement: "Recensement des États fédérés de Micronésie : 10 739 résidents dans l'État de Yap."}
