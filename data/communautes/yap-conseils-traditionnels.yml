base_nationale:
  - {instrument: "Constitution de l'État de Yap (modifiée en 2004), art. III, V, VI, VII, XI à XV", nature: "constitution", annee: null, source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
droits:
  autogouvernement: {valeur: "reconnu", note: "« Il est institué un Conseil de Pilung et un Conseil de Tamol, qui exercent les fonctions relatives à la tradition et à la coutume » ; reconnaissance des Dalip pi Nguchol et de leurs rôles coutumiers (Constitution de Yap, art. III, s. 1 et 2).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Toute loi votée est soumise aux deux conseils, qui peuvent la rejeter si elle porte atteinte à la tradition, à la coutume ou au rôle d'un chef traditionnel, et sont seuls juges de cette atteinte (art. V, s. 16 à 18) ; la tradition et la coutume sont reconnues dans le système juridique (art. III, s. 3).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  justice_propre: {valeur: "partiel", note: "Les décisions des tribunaux doivent être compatibles avec les traditions et coutumes de l'État (art. VII, s. 7) ; la législature peut codifier le droit traditionnel (art. XV).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  terres: {valeur: "reconnu", note: "Un titre foncier ne peut être acquis que conformément à la tradition et à la coutume (art. XIII, s. 3) ; un bail consenti à un non-citoyen des États fédérés ne peut dépasser cent ans (art. XIII, s. 2).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  ressources: {valeur: "reconnu", note: "L'État reconnaît les droits et la propriété traditionnels sur les ressources de l'espace marin, de la laisse de haute mer jusqu'au-delà de 12 milles ; aucun navire étranger ne peut y prélever de ressources sans l'accord des titulaires de ces droits (art. XIII, s. 5 et 6).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  consentement: {valeur: "partiel", note: "Accord des titulaires des droits traditionnels requis pour toute pêche, recherche ou exploration par un navire étranger dans l'espace marin de l'État (art. XIII, s. 6).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  langue: {valeur: "reconnu", note: "« Les langues autochtones de l'État et l'anglais sont langues officielles » (art. XIV, s. 5).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  education: {valeur: "partiel", note: "Les traditions et coutumes du peuple de l'État sont enseignées dans les écoles publiques, selon les modalités fixées par la loi (art. XII, s. 2).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Si le gouverneur réside dans les îles Yap, le lieutenant-gouverneur doit résider dans les îles extérieures, et inversement (art. VI, s. 2) ; les îles extérieures forment quatre des cinq circonscriptions législatives, avec un élu chacune, contre six élus pour les îles Yap (art. XI).", source: "http://www.fsmlaw.org/yap/constitution/entire.htm"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune source indépendante sur l'usage du droit d'opposition des conseils n'a été consultée.", source: ""}
