resume: >-
  L'État de Yap, l'un des quatre États fédérés de Micronésie, comprend les îles Yap et des atolls dits « îles extérieures ». Sa constitution reconnaît les chefs traditionnels (Dalip pi Nguchol) et crée deux conseils coutumiers, le Conseil de Pilung et le Conseil de Tamol. Ces conseils peuvent s'opposer à toute loi qui porte atteinte à la tradition et à la coutume. La constitution reconnaît aussi les droits coutumiers sur les terres et sur l'espace marin.
