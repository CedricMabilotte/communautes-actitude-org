resume: >-
  Fiche agrégée : elle couvre les communautés côtières que l'État sud-africain a déclarées « small-scale fishing communities » (communautés de pêche artisanale) et les coopératives qui détiennent en leur nom des droits de pêche collectifs. La politique de 2012 pour le secteur de la pêche artisanale, puis la loi d'amendement n° 5 de 2014 sur les ressources marines vivantes (section 19), en vigueur depuis 2016, permettent au ministre de reconnaître une communauté de pêche artisanale et de lui attribuer des droits d'accès selon une approche communautaire. Le règlement de 2016 fixe la procédure : vérification des pêcheurs, au moins 20 pêcheurs par communauté, une seule coopérative par communauté regroupant tous les pêcheurs vérifiés, plan de gestion et panier d'espèces commerciales. Les droits de 15 ans ont été attribués au Cap-Nord en 2018, au KwaZulu-Natal en 2019, au Cap-Oriental à partir de 2019 et au Cap-Occidental en 2023 (62 coopératives, 3 850 pêcheurs).
