  - {instrument: "Marine Living Resources Amendment Act, 2014 (loi n° 5 de 2014), section 1 (définitions de « small-scale fisher » et de « small-scale fishing community », coopérative comme personne sud-africaine) et section 5 (nouvelle section 19 de la loi de 1998 : reconnaissance des communautés, zones de pêche, approche communautaire), Journal officiel n° 37659 du 19 mai 2014 ; entrée en vigueur par proclamation publiée au Journal officiel n° 39790 du 8 mars 2016", nature: "loi", annee: 2014, source: "https://www.gov.za/sites/default/files/gcis_document/201409/37659act5of2014marinelivingres19may2014.pdf"}
  - {instrument: "Regulations relating to Small-Scale Fishing (règlement sur la pêche artisanale), avis gouvernemental n° 229, Journal officiel n° 39790 du 8 mars 2016, pris en application de la section 19 de la loi de 1998", nature: "loi", annee: 2016, source: "https://www.gov.za/sites/default/files/gcis_document/201603/39790gon229.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le droit de pêche est attribué à une seule coopérative par communauté, dont tous les membres sont les pêcheurs vérifiés de la communauté (règlement de 2016, règle 2(6)(a) et règle 4(3) et 4(4)(a)) ; la loi de 2014 (section 1) range parmi les personnes sud-africaines la coopérative enregistrée selon la loi de 2005 sur les coopératives ; la communauté doit disposer d'un plan de gestion (règle 4(4)(c)) ; la reconnaissance de la communauté et la vérification des pêcheurs relèvent du ministère (loi de 2014, section 19(1)(b) ; règle 2).", source: "https://www.gov.za/sites/default/files/gcis_document/201603/39790gon229.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le ministre accorde des droits de pêche artisanale (section 18(1) modifiée en 2014) en tenant compte d'une approche communautaire (section 19(3)) et doit établir des zones où les pêcheurs artisanaux peuvent pêcher (section 19(1)(a)) ; le règlement de 2016 attribue à chaque coopérative un panier d'espèces commerciales dont les quantités dépendent du total admissible des captures fixé par l'État (règle 6(1)(q)) ; ces droits ne sont transférables qu'avec l'accord du ministre (section 19(2)).", source: "https://www.gov.za/sites/default/files/gcis_document/201409/37659act5of2014marinelivingres19may2014.pdf"}
  consentement: {valeur: "partiel", note: "Le ministère consulte la communauté pour délimiter les zones de pêche (règlement de 2016, règle 5(1)) et pour fixer la liste et la quantité d'espèces attribuées (règle 6(1)) ; la répartition initiale entre communautés se fait après consultation de toutes les communautés concernées (règle 6(3)(a)) ; aucun texte consulté ne subordonne une décision à leur consentement.", source: "https://www.gov.za/sites/default/files/gcis_document/201603/39790gon229.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Les communautés de pêche artisanale sont représentées dans les structures de gestion nationales, régionales et locales, dans le cadre d'une cogestion (gestion partagée avec l'administration) de l'accès à la ressource (règlement de 2016, règle 6(7)).", source: "https://www.gov.za/sites/default/files/gcis_document/201603/39790gon229.pdf"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Sowman et Sunde (Marine Policy, 2021), la mise en œuvre s'est écartée des principes communautaires de la politique de 2012 : des milliers de pêcheurs ont été laissés hors du processus, des permis individuels ont été délivrés dans l'intervalle et la gestion reste centrée sur l'État. Selon GroundUp (2023), au Cap-Occidental, la première procédure (2016-2019) n'a retenu que 29 % des demandeurs (31 % selon le ministère) et a été annulée par la Haute Cour à la demande de la ministre avant une nouvelle procédure. En 2026, les zones de pêche artisanale prévues par la loi restent pour l'essentiel à l'état de projet selon WWF Afrique du Sud.", source: "https://www.sciencedirect.com/science/article/pii/S0308597X21002943"}
chronologie:
  - {annee: 1998, evenement: "Loi n° 18 sur les ressources marines vivantes."}
  - {annee: 2012, evenement: "Politique pour le secteur de la pêche artisanale, publiée le 20 juin (avis n° 474)."}
  - {annee: 2014, evenement: "Loi d'amendement n° 5 : définition de la communauté de pêche artisanale et nouvelle section 19, sanctionnée le 16 mai."}
  - {annee: 2016, evenement: "Entrée en vigueur de la loi de 2014 et règlement sur la pêche artisanale du 8 mars ; ouverture des déclarations d'intérêt des communautés."}
  - {annee: 2018, evenement: "Premières coopératives titulaires de droits de 15 ans au Cap-Nord : Port Nolloth et Hondeklipbaai."}
  - {annee: 2019, evenement: "Droits de 15 ans à sept coopératives du KwaZulu-Natal (36 communautés déclarées) ; au Cap-Oriental, 78 communautés déclarées et droits remis à 20 premières coopératives le 16 novembre."}
  - {annee: 2023, evenement: "Liste définitive des pêcheurs déclarés au Cap-Occidental (16 mars) ; droits de 15 ans à 62 coopératives regroupant 3 850 pêcheurs (15 novembre)."}
fiabilite:
  verifie: ["Loi n° 5 de 2014 : définitions de la section 1 et nouvelle section 19, lues sur le Journal officiel n° 37659.", "Règlement de 2016 (avis n° 229) : règles 2 à 6, lues sur le Journal officiel n° 39790, qui publie aussi la proclamation d'entrée en vigueur de la loi de 2014.", "Politique de 2012 (avis n° 474) : définition de l'entité juridique communautaire, approche communautaire (4.1.1), cogestion (4.3.1) et délimitation des aires de pêche artisanale (5.1.2).", "Cap-Oriental : 78 communautés déclarées, 5 335 pêcheurs, 20 coopératives et 1 591 membres le 16 novembre 2019 (discours de la ministre Creecy).", "Cap-Occidental : 62 coopératives, 3 850 pêcheurs, droits de 15 ans (DFFE et SAnews, 15 novembre 2023).", "KwaZulu-Natal : 36 communautés déclarées, 2 184 pêcheurs reconnus, 36 coopératives enregistrées, dont sept titulaires de droits de 15 ans en 2019 (publication DFFE de 2019).", "Cap-Nord : coopératives de Port Nolloth et de Hondeklipbaai, 103 pêcheurs déclarés sur la liste approuvée en octobre 2017 (SAnews, 28 septembre 2018)."]
  non_confirme: ["Liste nationale des coopératives titulaires de droits : aucune liste officielle complète trouvée, d'où l'absence de tableau des sites ; le chiffre de « plus de 170 » coopératives vient de WWF Afrique du Sud.", "Population : aucun total national officiel trouvé ; les chiffres par province (Cap-Occidental 3 850 membres des coopératives en 2023, Cap-Oriental 5 335 pêcheurs déclarés en 2019, KwaZulu-Natal 2 184 en 2019, Cap-Nord 103 déclarés en 2017) ont des dates et des périmètres différents et ne sont pas additionnés.", "La fiche de WWF Afrique du Sud (2026) écrit que les « plus de 170 » coopératives ont été établies « depuis 2023 », alors que les premières datent de 2018 ; le périmètre exact de ce chiffre (coopératives enregistrées ou titulaires de droits) n'est pas précisé.", "Date de l'annulation par la Haute Cour du Cap-Occidental de la vérification de 2016-2019 : 2020 selon le ministère, août 2022 selon GroundUp.", "Le ministère évoque un amendement de 2019 de la loi sur les ressources marines vivantes ; seul l'amendement de 2014 a été lu.", "Attribution effective des droits aux 53 autres coopératives annoncées au Cap-Oriental : non vérifiée.", "Aucun document onusien ou régional consulté ne vise ce régime nommément ; les Directives volontaires de la FAO sur la pêche artisanale ne figurent pas parmi les mécanismes du cadre."]
