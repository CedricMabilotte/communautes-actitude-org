resume: >-
  La Nation Tsilhqot'in regroupe six communautés du centre de la Colombie-Britannique : Tl'etinqox, ʔEsdilagh, Yunesit'in, Tl'esqox, Tsi Del Del et Xeni Gwet'in. Le 26 juin 2014, la Cour suprême du Canada lui reconnaît un titre ancestral (droit collectif de propriété autochtone issu de l'occupation antérieure à la souveraineté britannique) sur environ 1 750 km². C'est la première déclaration judiciaire d'un titre ancestral au Canada. Le titre donne le droit de décider de l'usage des terres et d'en tirer les bénéfices ; toute utilisation par les gouvernements ou des tiers exige le consentement de la Nation ou une justification au titre de l'article 35 de la Loi constitutionnelle de 1982.
