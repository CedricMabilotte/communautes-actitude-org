effectivite: {valeur: "non_etablie", note: "Aucune source indépendante sur l'application du titre dans la zone déclarée n'a été trouvée. Les accords signés par la Colombie-Britannique (Nenqay Deni, 2016, art. 2.2 c) et par le Canada et la province (Gwets'en Nilt'i, 2019, renouvelé pour cinq ans en 2024) fixent encore comme objectif « la transition pratique » de la zone du titre vers la gestion et le contrôle tsilhqot'in.", source: "https://www2.gov.bc.ca/assets/gov/environment/natural-resource-stewardship/consulting-with-first-nations/agreements/other-docs/nenqay_deni_accord.pdf"}
chronologie:
  - {annee: 1864, evenement: "Guerre de Chilcotin ; six chefs tsilhqot'in sont pendus en 1864 et 1865."}
  - {annee: 1983, evenement: "La province accorde un permis d'exploitation forestière dans une partie du territoire revendiqué ; le gouvernement Xeni Gwet'in s'y oppose."}
  - {annee: 1998, evenement: "La revendication est étendue au titre ancestral au nom de toute la Nation."}
  - {annee: 2007, evenement: "Jugement de première instance (juge Vickers, 2007 BCSC 1700) après 339 jours de procès."}
  - {annee: 2014, evenement: "Arrêt 2014 CSC 44 (26 juin) : déclaration du titre ancestral ; exonération des six chefs par la Colombie-Britannique (23 octobre)."}
  - {annee: 2016, evenement: "Accord Nenqay Deni avec la Colombie-Britannique (11 février)."}
  - {annee: 2018, evenement: "Exonération des six chefs par le premier ministre du Canada à la Chambre des communes (26 mars)."}
  - {annee: 2019, evenement: "Accord tripartite Gwets'en Nilt'i avec le Canada et la Colombie-Britannique (août)."}
  - {annee: 2024, evenement: "Renouvellement de l'accord Gwets'en Nilt'i pour cinq ans (26 juin)."}
  - {annee: 2025, evenement: "Accord Teẑtan Biny avec la province et Taseko Mines (5 juin) : aucune activité d'exploration ou d'exploitation minière dans la zone du projet New Prosperity sans le consentement libre, préalable et éclairé de la Nation."}
