  - {instrument: "Nation Tsilhqot'in c. Colombie-Britannique, 2014 CSC 44, [2014] 2 R.C.S. 256", nature: "jurisprudence", annee: 2014, source: "https://juricaf.org/arret/CANADA-COURSUPREME-20140626-2014CSC44"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les six communautés membres ont chacune leur gouvernement de bande ; le Gouvernement national Tsilhqot'in signe au nom de la Nation l'accord Nenqay Deni avec la Colombie-Britannique (2016) et l'accord Gwets'en Nilt'i avec le Canada et la province (2019, renouvelé en 2024), hors du processus de la Commission des traités de la Colombie-Britannique.", source: "https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/consulting-with-first-nations/first-nations-negotiations/first-nations-a-z-listing/tsilhqot-in-national-government"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Arrêt 2014 CSC 44 (par. 73, 74 et 153) : titre collectif comparable à une pleine propriété, détenu pour les générations futures, cessible seulement à la Couronne ; droit de déterminer l'utilisation des terres, de les posséder et de les gérer.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20140626-2014CSC44"}
  ressources: {valeur: "partiel", note: "Arrêt 2014 CSC 44 (par. 70 et 116) : les titulaires ont droit aux avantages économiques des terres ; le bois de la zone n'est plus du bois des terres publiques au sens de la Forest Act (loi provinciale sur les forêts). Limites : les lois provinciales d'application générale, Forest Act comprise, peuvent s'appliquer si l'atteinte est justifiée au titre de l'article 35 (par. 151) ; l'arrêt ne statue que sur le bois, pas sur le sous-sol ni sur l'eau.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20140626-2014CSC44"}
  consentement: {valeur: "reconnu", note: "Arrêt 2014 CSC 44 (par. 76, 77 et 90) : les gouvernements et les tiers doivent obtenir le consentement de la Nation ; à défaut, l'atteinte doit être justifiée (consultation, objectif public, obligation fiduciaire de la Couronne).", source: "https://juricaf.org/arret/CANADA-COURSUPREME-20140626-2014CSC44"}
