resume: >-
  Fiche agrégée : elle couvre les forêts communautaires de l'État de Cross River, c'est-à-dire les forêts situées sur des terres communautaires où les communautés exercent, selon le droit coutumier, des droits d'usage exclusifs. La loi de l'État n° 3 de 2010 sur la Commission forestière (Cross River State Forestry Commission Law, 2010) classe ces forêts comme une catégorie à part (section 24) et donne à chaque village ou groupe de villages le droit de créer une association communautaire de gestion forestière, appelée aussi comité de gestion forestière (Forest Management Committee, FMC), reconnue par la Commission (sections 59, 60 et 105). Les redevances sur les produits forestiers sont versées directement aux communautés (section 101) ; la politique forestière de l'État validée en 2019 prévoit un partage des revenus des forêts communautaires de 70 % pour la communauté et 30 % pour l'État. En 2012, 45 comités représentaient 75 communautés forestières ; la forêt communautaire d'Ekuri (33 600 ha), détenue par les villages d'Old Ekuri et de New Ekuri, fait l'objet d'une étude de cas du PNUD publiée en 2012.
