effectivite: {valeur: "partielle", note: "En 2012, le document du programme ONU-REDD pour le Nigeria comptait 19 comités certifiés sur 45 et relevait que le moratoire de 2008 sur l'exploitation forestière s'appliquait aussi aux forêts communautaires ; la politique forestière de 2019 demande de « réactiver » les comités de gestion forestière. En novembre 2025, un membre du conseil de l'Ekuri Initiative déclarait qu'Ekuri n'avait « jamais reçu aucune forme de soutien » de l'État, et les anciens d'Ekuri accusaient une entreprise d'exploitation forestière de couper du bois dans leur forêt sans leur accord.", source: "https://www.premiumtimesng.com/features-and-interviews/839237-how-volunteer-community-rangers-lead-fight-for-ekuri-forest-cross-river-survival.html"}
chronologie:
  - {annee: 1991, evenement: "Création du parc national de Cross River ; la communauté d'Ekuri obtient un agent forestier communautaire pour organiser la gestion de sa forêt."}
  - {annee: 1992, evenement: "Création formelle de l'Ekuri Initiative par les villages d'Old Ekuri et de New Ekuri."}
  - {annee: 1994, evenement: "L'État de Cross River révise sa stratégie forestière et retient la foresterie communautaire comme principe."}
  - {annee: 1997, evenement: "Relevé du périmètre de la forêt communautaire d'Ekuri (33 600 ha)."}
  - {annee: 2004, evenement: "L'Ekuri Initiative reçoit le prix Équateur du Programme des Nations unies pour le développement."}
  - {annee: 2008, evenement: "Moratoire de l'État sur toute exploitation forestière, forêts communautaires comprises."}
  - {annee: 2010, evenement: "Adoption de la loi n° 3 de 2010 sur la Commission forestière, qui crée la catégorie des forêts communautaires et les associations communautaires de gestion forestière."}
  - {annee: 2012, evenement: "45 comités de gestion forestière représentent 75 communautés forestières, dont 19 comités certifiés par la Commission."}
  - {annee: 2019, evenement: "Validation de la politique forestière de l'État : partage des revenus des forêts communautaires à 70 % pour la communauté et 30 % pour l'État."}
fiabilite:
  verifie: ["Loi n° 3 de 2010 (texte FAOLEX) : catégorie « Community Forest » (section 24), droit de créer une association communautaire de gestion forestière (section 59), gestion par l'association sous supervision du conseil de village (section 60), application de la constitution de l'association par ses agents (section 67), infractions en forêt communautaire (section 84), redevances versées directement aux communautés et partage des amendes 60/40 (section 101), définitions (section 105).", "Politique forestière validée en 2019 : partage 70/30 en forêt communautaire, 50/50 en réserve forestière de l'État (section 3.1.3.5) ; formation de comités de gestion forestière par les communautés (sections 3.1.6.4.2 et 4.2.4) ; révision annoncée de la loi de 2010.", "Document du programme ONU-REDD pour le Nigeria (2012) : 45 comités représentant 75 communautés, 19 comités certifiés, partage 70/30 des redevances de bois des forêts communautaires attribué à la loi de 2010.", "Étude de cas de l'Initiative Équateur (PNUD, 2012) : 33 600 ha de forêt communautaire possédés par Old Ekuri et New Ekuri, création en 1992, assemblée générale de tous les membres, prix Équateur 2004.", "Premium Times (28 novembre 2025) : forêt de 33 600 ha dans la zone d'Akamkpa, surveillance par des gardes bénévoles, déclaration d'un membre du conseil de l'Ekuri Initiative sur l'absence de soutien de l'État, exploitation forestière contestée par les anciens d'Ekuri."]
  non_confirme: ["Le partage 70/30 figure dans la politique de 2019 et, selon ONU-REDD, dans la loi de 2010 ; le texte FAOLEX de la section 101 prévoit un versement direct des redevances aux communautés propriétaires sans ce ratio : l'origine exacte du ratio n'est pas établie.", "La politique de 2019 annonce la révision de la loi de 2010 ; aucune loi révisée n'a été trouvée.", "La reconnaissance formelle de la forêt d'Ekuri par l'État (certification du comité, publication au Journal officiel) n'a pas été trouvée.", "Aucune liste officielle des forêts communautaires ni des comités certifiés n'a été trouvée, d'où l'absence de tableau ; les chiffres de 2012 n'ont pas été mis à jour.", "La surface totale des forêts communautaires n'est pas publiée : la politique de 2019 donne 2 421,96 km² pour l'ensemble des forêts communautaires et des réserves forestières, sans les distinguer.", "Population des communautés titulaires non chiffrée par les sources ouvertes."]
