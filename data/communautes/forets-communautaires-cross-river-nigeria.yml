base_nationale:
  - {instrument: "Loi de l'État de Cross River n° 3 de 2010 sur la Commission forestière (Cross River State Forestry Commission Law, 2010), sections 24, 59, 60, 67, 84, 101 et 105", nature: "loi", annee: 2010, source: "https://faolex.fao.org/docs/pdf/nig151694.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque communauté, village ou groupe de villages a le droit de créer une association communautaire de gestion forestière (Community Based Forest Management Association), qui gère la forêt communautaire en collaboration avec la Commission forestière, sous la supervision du conseil de village ou de ville (loi n° 3 de 2010, sections 59 et 60) ; le comité de gestion forestière doit être reconnu par la Commission (section 105).", source: "https://faolex.fao.org/docs/pdf/nig151694.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La constitution et les règlements de l'association, adoptés selon la loi, sont appliqués dans la forêt communautaire par les agents de contrôle de l'association ou, à défaut, du conseil de village (loi n° 3 de 2010, section 67) ; leur violation constitue une infraction (section 84).", source: "https://faolex.fao.org/docs/pdf/nig151694.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi définit la forêt communautaire comme une forêt sur des terres communautaires où les communautés exercent des droits d'usage exclusifs fondés sur le droit coutumier (loi n° 3 de 2010, section 105) ; la constitution d'une réserve forestière communautaire reste soumise à la loi foncière fédérale de 1978 (Land Use Act), qui régit la propriété du sol (section 26).", source: "https://faolex.fao.org/docs/pdf/nig151694.pdf"}
  ressources: {valeur: "partiel", note: "L'association gère les ressources de la forêt communautaire pour leur usage durable et le partage des bénéfices (loi n° 3 de 2010, sections 59 et 60) ; la politique forestière de 2019 prévoit le partage des revenus des forêts communautaires à 70 % pour la communauté et 30 % pour l'État (section 3.1.3.5).", source: "https://cdn.cdp.net/cdp-production/comfy/cms/files/files/000/006/631/original/ValidatedCROSSRIVERSTATEFORESTPOLICY2019_(2).pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les redevances sur les produits forestiers sont versées directement aux villages ou communautés propriétaires dans le même exercice, et les amendes perçues pour une forêt communautaire sont partagées à 60 % pour la communauté et 40 % pour la Commission (loi n° 3 de 2010, section 101).", source: "https://faolex.fao.org/docs/pdf/nig151694.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
