resume: >-
  Les peuples qom (toba), wichí et moqoit (mocoví) forment le sujet collectif du régime autochtone de la province du Chaco, distinct du régime national argentin. La loi provinciale 3258 de 1987, aujourd'hui loi 562-W, organise la personnalité juridique des communautés, l'attribution gratuite de terres insaisissables et inaliénables, l'éducation bilingue et biculturelle, et crée l'Institut de l'aborigène chaquien (Instituto del Aborigen Chaqueño, IDACH), dont le président, le vice-président et les vocaux de chaque peuple sont élus au suffrage direct. La Constitution provinciale de 1994 (art. 37) reconnaît la propriété communautaire des terres traditionnelles et des réserves. Depuis la loi 6604 de 2010 (loi 1848-W), le qom, le wichí et le moqoit sont langues officielles de la province avec le castillan.
