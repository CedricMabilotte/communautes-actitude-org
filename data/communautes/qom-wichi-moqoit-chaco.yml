  - {instrument: "Loi provinciale 3258 de 1987 sur les communautés aborigènes, créant l'IDACH, consolidée comme loi 562-W", nature: "loi", annee: 1987, source: "https://digesto.legislaturachaco.gob.ar/Documentos/Documento/GetDocumentoFisico?nombreArchivo=L.562.W.pdf"}
  - {instrument: "Loi provinciale 6604 de 2010, consolidée comme loi 1848-W : qom, moqoit et wichí langues officielles de la province", nature: "loi", annee: 2010, source: "https://digesto.legislaturachaco.gob.ar/Documentos/Documento/GetDocumentoFisico?nombreArchivo=L.1848.W.pdf"}
  - {instrument: "Constitution de la Nation argentine, art. 75, alinéa 17 (1994) : compétence concurrente des provinces en matière autochtone", nature: "constitution", annee: 1994, source: "https://servicios.infoleg.gob.ar/infolegInternet/anexos/0-4999/804/norma.htm"}
  - {instrument: "Loi nationale 23.302 de 1985 sur la politique autochtone et l'appui aux communautés aborigènes", nature: "loi", annee: 1985, source: "https://www.argentina.gob.ar/normativa/nacional/norma-23790/texto"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 3258 de 1987 (loi 562-W, art. 28 et 29) confie la direction de l'IDACH, organisme provincial autonome (entidad autárquica, établissement public doté de la personnalité juridique), à un directoire dont le président et le vice-président sont élus au suffrage direct et dont les deux vocaux titulaires et deux suppléants de chaque peuple sont élus par ce peuple ; l'IDACH relève du ministère de Gouvernement et son budget est voté par la province (art. 25 et 39). La Constitution provinciale (art. 37, 1994) promeut le rôle des peuples « a través de sus propias instituciones » (par leurs propres institutions).", source: "https://digesto.legislaturachaco.gob.ar/Documentos/Documento/GetDocumentoFisico?nombreArchivo=L.562.W.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La Constitution provinciale (art. 37, 1994) reconnaît la propriété communautaire immédiate des terres occupées traditionnellement et des terres attribuées en réserve, et prévoit la remise gratuite d'autres terres, insaisissables, imprescriptibles, indivisibles et non transmissibles à des tiers. La loi 562-W (ex-loi 3258, art. 8, 9, 11 et 13) organise l'attribution gratuite de terres en propriété communautaire ou individuelle, interdit leur saisie, leur vente et leur exploitation par des personnes extérieures à la communauté. Le décret 116/91 (art. 1 et 6) reconnaît comme réserve aborigène 150 000 hectares de la colonie Teuco et ordonne un titre de propriété communautaire au profit des associations communautaires, après relevé topographique.", source: "https://legislaturachaco.gob.ar/uploads/files/constitucion-provincia-chaco-696a4e880a0cc612213072.pdf"}
  ressources: {valeur: "partiel", note: "La Constitution provinciale (art. 37, b, 1994) assure la participation des peuples autochtones à la protection, la préservation et la récupération des ressources naturelles ; elle ne leur en donne pas la maîtrise.", source: "https://legislaturachaco.gob.ar/uploads/files/constitucion-provincia-chaco-696a4e880a0cc612213072.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution provinciale (art. 37, b, 1994) assure la participation aux « demás intereses que los afecten » (autres intérêts qui les concernent), la loi 562-W ne prévoit pas de procédure de consultation préalable ; l'Argentine a ratifié la Convention 169 de l'OIT en 2000.", source: "https://legislaturachaco.gob.ar/uploads/files/constitucion-provincia-chaco-696a4e880a0cc612213072.pdf"}
  langue: {valeur: "reconnu", note: "La loi 6604 de 2010 (loi 1848-W, art. 1, 4 et 5) déclare le qom, le moqoit et le wichí langues officielles de la province avec le castillan, donne aux membres des trois peuples le droit d'utiliser leur langue dans l'administration provinciale et impose la traduction des panneaux des organismes publics ; l'art. 3 crée un Conseil provincial consultatif des langues autochtones avec un représentant de l'IDACH par langue ; la Chambre des députés désigne ses représentants au Conseil en 2016 et en 2022 (résolutions 1208/16 et 967/22, publiées au digesto avec la loi).", source: "https://digesto.legislaturachaco.gob.ar/Documentos/Documento/GetDocumentoFisico?nombreArchivo=L.1848.W.pdf"}
  education: {valeur: "partiel", note: "La loi 562-W (ex-loi 3258, art. 15 à 17) donne aux Qom, Wichí et Moqoit le droit d'étudier leur langue dans le primaire et le secondaire, prescrit un enseignement bilingue et biculturel dans les écoles qui les accueillent et prévoit la formation d'enseignants autochtones ; la Constitution provinciale (art. 37, a) garantit l'éducation bilingue et interculturelle. L'art. 17 charge le Conseil de l'éducation de la province de programmer ces actions.", source: "https://digesto.legislaturachaco.gob.ar/Documentos/Documento/GetDocumentoFisico?nombreArchivo=L.562.W.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les élections du directoire de l'IDACH ont lieu : élections convoquées pour le 5 octobre 2014, scrutin du 18 juillet 2021 après un report lié à la pandémie, nouvelle élection convoquée pour le 23 mars 2025 (loi 4053-W de 2024). En 2012, le Rapporteur spécial des Nations unies cite le chiffre de l'UNICEF selon lequel 66,5 % des ménages autochtones du Chaco ont des besoins de base non satisfaits (§ 73) ; il rappelle que la Cour suprême, saisie en 2007 par le Défenseur du peuple de la Nation sur la situation des Toba d'El Impenetrable, a ordonné aux gouvernements national et provincial d'assurer l'assistance sanitaire et alimentaire (§ 70).", source: "https://documents.un.org/doc/undoc/gen/g12/149/48/pdf/g1214948.pdf"}
chronologie:
  - {annee: 1987, evenement: "La loi provinciale 3258 organise les droits des communautés qom, wichí et moqoit et crée l'IDACH."}
  - {annee: 1991, evenement: "Le décret 116/91 reconnaît le droit des communautés sur 150 000 hectares de la colonie Teuco, délimités à partir de la confluence des rivières Teuco et Bermejito."}
  - {annee: 1994, evenement: "La réforme de la Constitution provinciale introduit l'art. 37 sur les peuples autochtones."}
  - {annee: 2010, evenement: "La loi 6604 fait du qom, du moqoit et du wichí des langues officielles de la province."}
  - {annee: 2014, evenement: "Élection du directoire de l'IDACH convoquée pour le 5 octobre (décret 761/14)."}
  - {annee: 2021, evenement: "Élection du directoire de l'IDACH le 18 juillet, après un report lié à la pandémie."}
  - {annee: 2025, evenement: "Élection du directoire de l'IDACH convoquée pour le 23 mars (loi 4053-W)."}
fiabilite:
  verifie:
    - "Texte original de la loi 3258 de 1987 (Legisalud) et texte consolidé de la loi 562-W (digesto de la Chambre des députés du Chaco), dont les art. 28 à 30 sur l'élection du directoire de l'IDACH."
    - "Art. 37 de la Constitution provinciale (texte publié par la Chambre des députés du Chaco)."
    - "Art. 1 à 7 de la loi 1848-W (ex-loi 6604), sanctionnée le 14 juillet 2010."
    - "111 communautés qom, wichí et moqoit au Chaco dans la liste officielle de 2025, dont 100 dotées de la personnalité juridique."
    - "53 798 personnes se reconnaissent autochtones au Chaco au recensement de 2022 (INDEC)."
    - "Loi 4053-W de 2024 : scrutin de l'IDACH du 18 juillet 2021 et convocation pour le 23 mars 2025 (digesto du Chaco)."
    - "Décret 116/91 (colonie Teuco), texte publié par le digesto du Chaco."
    - "Rapport A/HRC/21/47/Add.2 : § 17 (OIT 169 ratifiée en 2000), § 19 (Chaco), § 70 (El Impenetrable), § 73 (66,5 %, chiffre UNICEF)."
  non_confirme:
    - "Tenue et résultats de l'élection du 23 mars 2025 : aucune source ouverte."
    - "Surface totale des terres titrées au profit des communautés : aucune source officielle ouverte ; seul le chiffre de 150 000 hectares du décret 116/91 (colonie Teuco) est connu, sans titre vérifié."
    - "Population propre aux trois peuples dans la province : le recensement de 2022 ne donne que des parts nationales par peuple (40,8 % des Qom et 9,2 % des Wichí du pays vivent au Chaco)."
    - "Numéros des lois provinciales de report de l'élection de 2020 et d'adhésion à la loi nationale 26.160 : non ouverts."
    - "Régime des écoles publiques de gestion sociale autochtone (résolution 786/11 du ministère de l'Éducation, annexée à la loi 562-W) : non examiné."
    - "Composition exacte du corps électoral de l'IDACH (registre électoral autochtone) : la loi renvoie à la réglementation, non ouverte."
