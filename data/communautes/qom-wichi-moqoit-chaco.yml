reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "L'Argentine ratifie la Convention 169 de l'OIT en 2000, date rappelée par le Rapporteur spécial dans son rapport de 2012.", annee: 2000, source: "https://documents.un.org/doc/undoc/gen/g12/149/48/pdf/g1214948.pdf"}
  - {mecanisme: "dnudpa", detail: "L'Argentine vote pour la Déclaration des Nations unies sur les droits des peuples autochtones en 2007, vote rappelé par le Rapporteur spécial dans son rapport de 2012.", annee: 2007, source: "https://documents.un.org/doc/undoc/gen/g12/149/48/pdf/g1214948.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de James Anaya sur l'Argentine (A/HRC/21/47/Add.2) : il range le Chaco parmi les provinces dotées d'une norme constitutionnelle autochtone, situe les peuples toba et wichí dans la province et relève l'action du Défenseur du peuple de la Nation devant la Cour suprême en 2007 sur la situation des Toba de la région d'El Impenetrable (§ 70).", annee: 2012, source: "https://documents.un.org/doc/undoc/gen/g12/149/48/pdf/g1214948.pdf"}
