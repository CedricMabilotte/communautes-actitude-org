resume: >-
  Fiche agrégée : elle couvre le régime de partage et de cogestion, c'est-à-dire de gestion conjointe avec l'État fédéré, des pêcheries de saumon, de truite arc-en-ciel anadrome (steelhead) et de coquillages dont sont titulaires 20 nations signataires des traités de 1854-1856 dans l'ouest de l'État de Washington. Ces traités réservent aux nations « le droit de prendre le poisson, à tous les lieux et stations habituels et accoutumés […], en commun avec tous les citoyens du Territoire ». Le 12 février 1974, le tribunal fédéral de district (décision du juge George Boldt, United States v. Washington, 384 F. Supp. 312) a fixé leur part à la moitié des poissons récoltables et reconnu aux nations qualifiées le droit de réglementer elles-mêmes la pêche de leurs membres ; la Cour suprême a confirmé ce partage le 2 juillet 1979. Les nations et le département de la Pêche et de la Faune de l'État gèrent ensemble ces pêcheries ; la Northwest Indian Fisheries Commission, formée en 1974, coordonne les nations. Le régime est distinct du régime général des réserves.
