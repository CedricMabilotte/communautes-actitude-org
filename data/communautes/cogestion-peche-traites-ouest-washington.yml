reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis ont déclaré leur appui à la Déclaration des Nations unies sur les droits des peuples autochtones le 16 décembre 2010, revenant sur leur position antérieure (rapport du Rapporteur spécial A/HRC/21/47/Add.1, par. 80).", annee: 2010, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
base_nationale:
  - {instrument: "Traités de Medicine Creek (26 décembre 1854), de Point Elliott (22 janvier 1855), de Point No Point (26 janvier 1855), de Neah Bay (31 janvier 1855) et de Quinault River ou d'Olympia (1855-1856) : droit de pêche « à tous les lieux et stations habituels et accoutumés »", nature: "traite", annee: 1855, source: "https://wdfw.wa.gov/hunting/management/tribal/history"}
  - {instrument: "United States v. Washington, 384 F. Supp. 312 (W.D. Wash. 1974), décision du juge George Boldt du 12 février 1974 : partage à 50 % des poissons récoltables, autoréglementation des nations qualifiées, compétence continue du tribunal", nature: "jurisprudence", annee: 1974, source: "https://law.justia.com/cases/federal/district-courts/FSupp/384/312/1370661/"}
  - {instrument: "Washington v. Washington State Commercial Passenger Fishing Vessel Association, 443 U.S. 658 (Cour suprême, 2 juillet 1979) : confirmation du partage, part plafonnée à environ 50 % des remontées récoltables", nature: "jurisprudence", annee: 1979, source: "https://supreme.justia.com/cases/federal/us/443/658/"}
  - {instrument: "Plan de gestion du saumon du Puget Sound du 15 mai 1985 (Puget Sound Salmon Management Plan), conclu entre le département des Pêches de l'État et les nations du Puget Sound en application de United States v. Washington", nature: "accord_revendication", annee: 1985, source: "https://www.fisheries.noaa.gov/s3//2021-12/ps-salmon-management-plan-1985.pdf"}
  - {instrument: "Décision du juge Edward Rafeedie de décembre 1994 (sous-procédure des coquillages de United States v. Washington) : moitié des coquillages des lieux habituels et accoutumés, y compris sur les estrans privés", nature: "jurisprudence", annee: 1994, source: "https://nwifc.org/about-us/shellfish/rafeedie-decision/"}
  - {instrument: "Washington v. United States, 584 U.S. 837 (Cour suprême, 11 juin 2018) : arrêt de la cour d'appel du neuvième circuit (853 F.3d 946) sur les buses routières (culverts), c'est-à-dire les conduits qui font passer les cours d'eau sous les routes, confirmé à égalité des voix", nature: "jurisprudence", annee: 2018, source: "https://www.supremecourt.gov/opinions/17pdf/584us2r50_5j94.pdf"}
  - {instrument: "Chapitre 43.376 du Code révisé de Washington (RCW), relation de gouvernement à gouvernement avec les nations (2012, modifié en 2021 et 2022)", nature: "loi", annee: 2012, source: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.376.020"}
  - {instrument: "Loi Magnuson-Stevens, 16 U.S.C. § 1852 (b) (5) : siège d'une nation titulaire de droits de pêche reconnus par l'État fédéral au Conseil de gestion des pêches du Pacifique", nature: "loi", annee: 1996, source: "https://www.law.cornell.edu/uscode/text/16/1852"}
droits:
  autogouvernement: {valeur: "partiel", note: "La décision de 1974 reconnaît à chaque nation demanderesse le droit d'« exercer ses pouvoirs de gouvernement » en réglementant la pêche de ses membres, à condition de disposer d'un gouvernement organisé, d'agents de contrôle formés, d'experts en halieutique, d'un registre des membres et de cartes d'identité avec photographie ; la compétence se limite à la pêche et reste sous le contrôle continu du tribunal fédéral.", source: "https://law.justia.com/cases/federal/district-courts/FSupp/384/312/1370661/"}
  pouvoir_normatif: {valeur: "partiel", note: "Une nation qualifiée réglemente la pêche conventionnelle de ses membres « sans aucune réglementation de l'État » (décision de 1974) ; l'État ne peut imposer que les mesures « raisonnables et nécessaires » à la conservation, en apportant la preuve de cette nécessité, et les nations doivent fournir leurs déclarations de capture et accepter le suivi de l'État.", source: "https://law.justia.com/cases/federal/district-courts/FSupp/384/312/1370661/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "reconnu", note: "Les traités de 1854-1856 réservent le droit de pêche aux lieux habituels et accoutumés ; la décision de 1974 fixe la part des nations à 50 % des poissons récoltables ; la Cour suprême valide ce partage en 1979 (443 U.S. 658), fait de 50 % un plafond et y compte les prises cérémonielles et de subsistance, que le tribunal de district avait exclues ; la décision Rafeedie de 1994 étend le partage à la moitié des coquillages, y compris sur les estrans publics et privés, hors bancs artificiels ou cultivés.", source: "https://supreme.justia.com/cases/federal/us/443/658/"}
  consentement: {valeur: "partiel", note: "Le plan de gestion du saumon du Puget Sound de 1985 organise la planification conjointe des objectifs d'échappement et des taux de capture, avec un conseil consultatif des pêches (Fisheries Advisory Board) dont la décision s'impose jusqu'à décision du tribunal ; la loi de l'État de 2012 (RCW 43.376.020) oblige les agences à rechercher la collaboration des nations et à fixer un processus de consultation, sans exiger leur consentement.", source: "https://www.fisheries.noaa.gov/s3//2021-12/ps-salmon-management-plan-1985.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La loi Magnuson-Stevens (16 U.S.C. § 1852 (b) (5)) réserve au Conseil de gestion des pêches du Pacifique un siège à un représentant d'une nation titulaire de droits de pêche reconnus par l'État fédéral en Californie, en Oregon, dans l'État de Washington ou en Idaho, nommé sur une liste d'au moins trois noms présentée par les gouvernements des nations ; ce siège est commun à ces quatre États.", source: "https://www.law.cornell.edu/uscode/text/16/1852"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le partage des captures et la planification annuelle conjointe sont appliqués depuis 1974 sous le contrôle du tribunal fédéral, qui reste saisi de sous-procédures (arrêt du neuvième circuit du 31 août 2026 sur les lieux de pêche de la Sauk-Suiattle Indian Tribe). En 2011, les nations ont déclaré que la perte d'habitat du saumon « continue de dépasser la restauration » et menace le droit issu des traités ; en 2018, la Cour suprême a laissé en vigueur l'injonction qui oblige l'État à remplacer d'ici 2030 les buses routières qui nuisent le plus à l'habitat des saumons (Municipal Research and Services Center, 2018).", source: "https://cdn.ca9.uscourts.gov/datastore/opinions/2026/08/31/25-1391.pdf"}
chronologie:
  - {annee: 1854, evenement: "Traité de Medicine Creek, le 26 décembre, premier des traités du Puget Sound."}
  - {annee: 1855, evenement: "Traités de Point Elliott, de Point No Point et de Neah Bay (janvier) ; traité de Quinault River, dit d'Olympia (1855-1856)."}
  - {annee: 1974, evenement: "Le 12 février, décision du juge George Boldt dans United States v. Washington : partage à 50 % et autoréglementation des nations qualifiées. Formation de la Northwest Indian Fisheries Commission (comité de charte réuni le 1er mai, puis le 24 juin)."}
  - {annee: 1979, evenement: "Le 2 juillet, la Cour suprême valide le partage et fait de 50 % un plafond (Washington v. Washington State Commercial Passenger Fishing Vessel Association)."}
  - {annee: 1985, evenement: "Le 15 mai, plan de gestion du saumon du Puget Sound entre l'État et les nations du Puget Sound."}
  - {annee: 1989, evenement: "Accord du centenaire (Centennial Accord) entre l'État de Washington et les nations sur la relation de gouvernement à gouvernement."}
  - {annee: 1994, evenement: "En décembre, la décision du juge Edward Rafeedie étend le partage à la moitié des coquillages ; la Cour suprême refuse d'examiner l'affaire en 1999."}
  - {annee: 2012, evenement: "Loi de l'État sur la relation de gouvernement à gouvernement (chapitre 43.376 RCW)."}
  - {annee: 2018, evenement: "Le 11 juin, la Cour suprême confirme à égalité des voix l'arrêt sur les buses routières (Washington v. United States)."}
  - {annee: 2026, evenement: "Le 31 août, la cour d'appel du neuvième circuit renvoie au tribunal de district la demande de la Sauk-Suiattle Indian Tribe sur la rivière Baker et les eaux marines."}
fiabilite:
  verifie: ["Décision de 1974 (texte Justia) : partage à 50 % des poissons récoltables, exclusion par le tribunal de district des prises cérémonielles et de subsistance, conditions de l'autoréglementation, déclarations de capture et suivi de l'État, limite du pouvoir de l'État aux mesures raisonnables et nécessaires à la conservation, compétence continue du tribunal, 14 nations demanderesses dont la Yakima Nation.", "Arrêt de la Cour suprême du 2 juillet 1979 (443 U.S. 658) : part plafonnée à environ 50 %, prises cérémonielles et de subsistance comptées dans la part, six traités de 1854-1855 en cause.", "Page de NOAA Fisheries : 20 nations de l'ouest de l'État de Washington cogestionnaires, zone du Puget Sound et de la côte au nord de Grays Harbor, cinq traités de 1854-1856.", "Page de la Northwest Indian Fisheries Commission : liste des 20 nations membres.", "Plan de gestion du saumon du Puget Sound du 15 mai 1985 : planification conjointe et conseil consultatif des pêches.", "Arrêt de la Cour suprême du 11 juin 2018 (584 U.S. 837) : confirmation à égalité des voix de 853 F.3d 946 ; objet (buses routières) et échéance de 2030 vérifiés sur la note du Municipal Research and Services Center.", "Dates des traités (26 décembre 1854 ; 22, 26 et 31 janvier 1855 ; 25 janvier 1856 pour Olympia) : page du département de la Pêche et de la Faune de l'État.", "Loi Magnuson-Stevens : paragraphe (b) (5) ajouté par Pub. L. 104-297 du 11 octobre 1996.", "RCW 43.376.020 (2012) : obligation de collaboration et de consultation ; 16 U.S.C. § 1852 (b) (5) : siège au Conseil du Pacifique."]
  non_confirme: ["Le nombre total de membres inscrits des 20 nations et la surface des lieux de pêche habituels et accoutumés n'ont pas été trouvés dans une source ouverte.", "Le rôle des juridictions propres des nations dans la sanction des infractions de pêche n'a pas été vérifié sur une source primaire.", "La Yakama Nation, demanderesse en 1974, relève du bassin du Columbia et n'est pas membre de la Northwest Indian Fisheries Commission ; elle n'est pas comptée dans cette fiche.", "La date et les modalités d'admission de chaque nation au statut de nation signataire dans les sous-procédures postérieures à 1974 ne sont pas détaillées.", "Aucun document d'un organe de l'ONU visant nommément ce régime de cogestion n'a été trouvé ; le rapport du Rapporteur spécial de 2012 évoque seulement la dépendance à la pêche dans le Nord-Ouest Pacifique (par. 42)."]
