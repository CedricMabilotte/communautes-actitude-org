resume: >-
  Depuis le 10 octobre 2010, les îles de Bonaire (avec Klein Bonaire), Saint-Eustache et Saba forment trois « openbare lichamen » (corps publics, c'est-à-dire des communes à statut spécial) de la partie caribéenne des Pays-Bas. La Constitution néerlandaise (art. 132a) permet de créer ces corps publics par la loi et d'y adopter des règles particulières. La loi sur les corps publics (WolBES) du 17 mai 2010 dote chaque île d'un conseil insulaire élu, de 9 membres à Bonaire et de 5 à Saint-Eustache et à Saba, qui adopte des ordonnances insulaires et des impôts insulaires. La loi d'introduction permet l'usage du papiamento à Bonaire et de l'anglais à Saint-Eustache et à Saba devant les autorités locales.
