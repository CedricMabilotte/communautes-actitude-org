  - {instrument: "Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba (FinBES, loi sur les finances des corps publics), 17 mai 2010, Stb. 2010, 365", nature: "loi", annee: 2010, source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0028151/2023-01-01_0/xml/BWBR0028151_2023-01-01_0.xml"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque île forme un corps public doté de la personnalité juridique, WolBES, art. 2 à 4 ; le conseil insulaire (eilandsraad) élu compte 9 membres à Bonaire et 5 à Saint-Eustache et à Saba, art. 9 ; l'exécutif (bestuurscollege) réunit le gouverneur insulaire (gezaghebber), nommé par décret royal pour six ans, et les députés insulaires, art. 36 et 73.", source: "https://wetten.overheid.nl/BWBR0028142/"}
  pouvoir_normatif: {valeur: "partiel", note: "La réglementation des affaires propres de l'île est laissée à l'administration insulaire, WolBES, art. 136 ; le conseil adopte les ordonnances insulaires (eilandsverordeningen) et peut les assortir de peines, art. 149 et 157 ; une ordonnance cède devant la loi nationale sur le même objet et toute décision peut être annulée par décret royal, art. 215, 216 et 220.", source: "https://wetten.overheid.nl/BWBR0028142/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le ministre concerné donne aux collèges exécutifs l'occasion de rendre un avis sur les projets de loi, de décret et d'arrêté qui leur imposent des tâches ou modifient de façon notable leurs compétences, WolBES, art. 209 ; les collèges peuvent demander une concertation, art. 208 ; aucun consentement n'est exigé.", source: "https://wetten.overheid.nl/BWBR0028142/"}
  langue: {valeur: "partiel", note: "Chacun peut employer le papiamento devant les organes de Bonaire et l'anglais devant ceux de Saint-Eustache et de Saba, et ces organes peuvent s'en servir à l'oral, loi d'introduction, art. 4d et 4e ; les textes normatifs rédigés dans ces langues doivent aussi l'être en néerlandais, art. 4j.", source: "https://wetten.overheid.nl/BWBR0028063/"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le conseil insulaire institue, modifie ou supprime les impôts insulaires par ordonnance fiscale, FinBES, art. 40 ; seuls les impôts énumérés par la loi peuvent être levés (impôt foncier, taxe de séjour, taxe sur les véhicules, taxe portuaire…), art. 42 à 64, et aucun ne peut dépendre du revenu, du bénéfice ou du patrimoine, art. 42 ; l'État verse une dotation libre (vrije uitkering) par le fonds BES, art. 88 et 90.", source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0028151/2023-01-01_0/xml/BWBR0028151_2023-01-01_0.xml"}
  representation: {valeur: "partiel", note: "Les électeurs de chaque corps public élisent un collège électoral (kiescollege) qui prend part à l'élection de la Première Chambre, Constitution, art. 132a, al. 3 ; aucun siège n'est réservé aux îles aux États généraux.", source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0001840/2023-02-22_0/xml/BWBR0001840_2023-02-22_0.xml"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "D'après la Cour des comptes néerlandaise (Algemene Rekenkamer, 2022), l'administration de Saint-Eustache a été confiée en 2018 à un commissaire du gouvernement pour « manquement grave » à ses devoirs ; le conseil insulaire réélu en 2020 n'avait pas retrouvé la maîtrise de l'administration et des finances, et le retour à une administration élue était prévu en quatre phases jusqu'en 2024-2025, sans calendrier fixé pour les deux dernières.", source: "https://www.rekenkamer.nl/actueel/nieuws/2022/05/18/geef-sint-eustatius-perspectief-op-eigen-bestuur"}
chronologie:
  - {annee: 2010, evenement: "Loi sur les corps publics (WolBES), loi d'introduction et loi sur les finances (FinBES) du 17 mai 2010."}
  - {annee: 2010, evenement: "Le 10 octobre, dissolution des Antilles néerlandaises ; Bonaire, Saint-Eustache et Saba deviennent des corps publics des Pays-Bas."}
  - {annee: 2011, evenement: "Entrée en vigueur des dispositions sur l'usage du papiamento et de l'anglais devant les autorités (loi d'introduction, art. 4d à 4j)."}
  - {annee: 2018, evenement: "Février : loi temporaire sur le manquement aux devoirs à Saint-Eustache ; dissolution du conseil insulaire et nomination d'un commissaire du gouvernement."}
  - {annee: 2018, evenement: "Révision de l'art. 132a de la Constitution : élection dans les corps publics d'un collège électoral pour la Première Chambre."}
  - {annee: 2020, evenement: "Loi de rétablissement des institutions de Saint-Eustache, qui prévoit l'élection d'un nouveau conseil insulaire (art. 3)."}
  - {annee: 2024, evenement: "Le 1er septembre, la loi de rétablissement de Saint-Eustache cesse de s'appliquer (art. 21)."}
