effectivite: {valeur: "partielle", note: "Selon l'exposé des motifs de la réforme de 2015 (impression du Sejm n° 3193), environ 3 500 des 5 100 communautés n'avaient pas de statut juridique réglé, faute des décisions que la loi de 1963 imposait avant le 5 juillet 1964, et seules 1 080 avaient constitué une société de gestion, dont 1 073 dotées d'organes. Une enquête de l'Institut de recherche forestière (Wysocka-Fijorek et al., 2025), adressée en juillet et août 2024 aux 670 communautés dotées de forêts et d'une société recensées dans six voïvodies, n'a obtenu que 22 réponses exploitables ; 4 seulement avaient une inscription réglée au livre foncier (księga wieczysta), 3 étaient en cours de régularisation, et 9 demandaient une révision de la loi.", source: "https://www.ibles.pl/wp-content/uploads/2025/11/10.48538-lpb-2025-0013.pdf"}
chronologie:
  - {annee: 1819, evenement: "Des paysans de huit villages de Podhale achètent en commun, par l'intermédiaire d'un prêtre, des forêts de l'ancien domaine royal de Nowy Targ ; après des procès, ces forêts sont remises aux communes villageoises en 1867."}
  - {annee: 1938, evenement: "La loi du 4 mai 1938 sur la mise en ordre des communautés foncières tente d'unifier leur régime ; la loi de 1963 l'abroge (art. 34)."}
  - {annee: 1963, evenement: "La loi du 29 juin 1963, publiée le 5 juillet, interdit le partage des communautés et impose une société de gestion."}
  - {annee: 1968, evenement: "La Cour suprême qualifie la communauté foncière de copropriété aux traits particuliers, non partageable (III CZP 73/68)."}
  - {annee: 2016, evenement: "La loi du 10 juillet 2015 entre en vigueur le 1er janvier : régularisation des ayants droit sur demande avant le 31 décembre 2016, transformation possible en copropriété, recours en justice contre les résolutions de la société, fin de l'accord du maire pour vendre les terres."}
  - {annee: 2025, evenement: "La loi du 4 avril 2025, en vigueur le 29 mai, modifie le régime des recours contre les décisions définitives (art. 8o) ; texte consolidé publié au Dz.U. 2025 poz. 1454."}
fiabilite:
  verifie:
    - "Texte consolidé de la loi de 1963 (Dz.U. 2025 poz. 1454), art. 1, 2a, 5, 6a, 8a à 8o, 14 à 27 et 30a à 30c, lu sur le portail officiel du Journal des lois (api.sejm.gov.pl)."
    - "Texte original de 1963 (Dz.U. 1963 n° 28 poz. 169) lu sur eli.gov.pl : art. 1, 5, 14 à 17 et tutelle de l'administration de district."
    - "Exposé des motifs et évaluation des effets de la réglementation du projet de 2015 (impression n° 3193 de la VIIe législature) : environ 5 100 communautés, environ 107 000 ha, 3 500 sans statut réglé, 1 080 sociétés dont 1 073 dotées d'organes ; résolution III CZP 73/68 de la Cour suprême."
    - "Dates d'entrée en vigueur (1er janvier 2016 et 29 mai 2025) lues sur l'API ELI du Sejm."
    - "Enquête de l'Institut de recherche forestière (Leśne Prace Badawcze, 85, 2025) lue en texte intégral : 670 questionnaires envoyés en juillet-août 2024, 26 réponses dont 22 analysées, 4 communautés à livre foncier réglé, 9 demandes de révision de la loi."
    - "Droit de préemption de la commune (art. 26 al. 2) : déjà présent avant 2015 ; la réforme de 2015 n'a abrogé que les al. 1, 3 et 4 de l'art. 26 (impression n° 3193)."
    - "Communauté de Witów : 3 080 ha (2 230 ha dans le parc national des Tatras), huit villages (Ciche, Czarny Dunajec, Chochołów, Dzianisz, Witów, Wróblówka, Podczerwone, Koniówka), 2 090 propriétaires, statut approuvé en 1966, conseil de surveillance de 14 membres et bureau de 8 membres, achat de 1819 et remise des forêts en 1867, d'après le site de la communauté (pages d'accueil, histoire et structure)."
  non_confirme:
    - "Les chiffres de 5 100 communautés et 107 000 ha sont une estimation officielle de 2015 tirée du cadastre ; aucun chiffre postérieur aux régularisations de 2016-2017 et aux transferts aux communes n'a été trouvé."
    - "Population des ayants droit et nombre de villages concernés : aucune source nationale trouvée."
    - "Aucune liste officielle nationale des communautés n'a été trouvée : pas de tableau des sites."
    - "Aucun document de l'ONU (CDB, registre APAC) ni du Conseil de l'Europe visant ce régime n'a été consulté. Les modifications de 2021 (Dz.U. 2021 poz. 2052) n'ont pas été analysées séparément."
