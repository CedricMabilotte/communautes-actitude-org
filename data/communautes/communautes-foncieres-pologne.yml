resume: >-
  Les wspólnoty gruntowe (communautés foncières) sont des terres agricoles, des forêts et des eaux attribuées au XIXe siècle, lors de l'affranchissement des paysans, en propriété, possession ou usage commun aux habitants d'un ou de plusieurs villages ; la loi y range aussi les communautés urbariales et les sociétés pastorales (spółki szałaśnicze). La loi du 29 juin 1963 les déclare indivisibles entre ayants droit et prévoit que ceux-ci forment une société (spółka) dotée de la personnalité juridique, d'un statut et d'organes élus, placée aujourd'hui sous la tutelle du maire de la commune. La réforme de 2015, en vigueur au 1er janvier 2016, a ouvert la régularisation des ayants droit, la transformation en copropriété ordinaire et le transfert à la commune ou à l'État des terres sans ayants droit identifiés. En 2015, l'État comptait environ 5 100 communautés sur environ 107 000 ha, dont 3 500 sans statut juridique réglé et 1 080 dotées d'une société de gestion. La Communauté forestière des ayants droit des huit villages, à Witów (Tatras), détient 3 080 ha de forêts.
