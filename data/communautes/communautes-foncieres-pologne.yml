droits:
  autogouvernement: {valeur: "partiel", note: "Les ayants droit forment, à la majorité avec un quorum de la moitié, une société de gestion (art. 14) ; elle est une personne morale dès que le chef de district (starosta) approuve son statut, qui fixe ses organes (art. 15, 17 et 18) ; chaque membre a une voix quelle que soit sa part (art. 19). Limites : le maire (wójt) exerce la tutelle (art. 23) ; si aucun statut n'est présenté dans les trois mois suivant l'établissement de la liste des ayants droit, il crée une société obligatoire et en nomme les organes, et il peut nommer des personnes extérieures si les organes ne remplissent pas leur rôle (art. 25) ; il peut aussi attaquer en justice les résolutions de la société (art. 19a).", source: "https://api.sejm.gov.pl/eli/acts/DU/2025/1454/text.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le statut fixe les droits et obligations des membres, le partage des revenus et l'accès des tiers aux terres (art. 17) ; la société adopte un règlement d'usage des terres et un plan de gestion, que le maire, ou le starosta pour les forêts, approuve et peut modifier (art. 24). Le modèle de statut est fixé par règlement ministériel (art. 15 al. 2).", source: "https://api.sejm.gov.pl/eli/acts/DU/2025/1454/text.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les communautés ne peuvent être partagées entre ayants droit, sauf remembrement voté à la majorité absolue (art. 5) ; une part ne se cède qu'en entier, par acte notarié, à un autre ayant droit ou à un exploitant du même village ou d'un village voisin (art. 27). Limites : la commune a un droit de préemption en cas de vente (art. 26 al. 2) ; depuis 2016, un vote unanime des ayants droit, ou à défaut une décision de justice, peut transformer la communauté en copropriété ordinaire (art. 30a) ; à défaut d'ayants droit identifiés, les terres peuvent passer sans contrepartie à la commune ou, sinon, à l'État (art. 8g à 8k). La réforme de 2015 a supprimé l'accord du maire exigé jusque-là pour vendre ou échanger les terres (ancien art. 26 al. 1).", source: "https://api.sejm.gov.pl/eli/acts/DU/2025/1454/text.pdf"}
  ressources: {valeur: "partiel", note: "La loi couvre les terres agricoles, les forêts et les eaux (art. 1), à l'exclusion des eaux publiques (art. 2a) ; la gestion des forêts, des eaux et des gisements (graviers, sables, argiles, tourbes) suit les règles propres à chaque catégorie (art. 13 al. 2) ; pour les forêts, un plan simplifié est approuvé par le starosta après avis du chef de district des forêts de l'État (nadleśniczy) (art. 24). La société partage les revenus selon son statut (art. 17).", source: "https://api.sejm.gov.pl/eli/acts/DU/2025/1454/text.pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
