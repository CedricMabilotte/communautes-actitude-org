resume: >-
  Fiche agrégée : elle couvre les groupes de propriétaires traditionnels (traditional owners, peuples aborigènes rattachés à un territoire par leurs liens culturels) qui ont conclu avec l'État de Victoria un accord de reconnaissance et de règlement en application du Traditional Owner Settlement Act 2010, loi qui permet de régler hors tribunal les revendications de titre autochtone. Quatre accords sont en vigueur : Gunaikurnai (2010), Dja Dja Wurrung (2013), Taungurung (2020) et peuples Wotjobaluk, Jaadwa, Jadawadjali, Wergaia et Jupagulk (2022) ; celui des Eastern Maar est en négociation depuis 2017. Chaque accord reconnaît des droits d'accès, de camping et de prélèvement sur les terres publiques et peut prévoir la remise de parcs nationaux en titre aborigène (propriété inaliénable dont la gestion revient à l'État, sous un conseil de gestion à majorité de propriétaires traditionnels), des terres en pleine propriété, un régime d'avis ou de consentement sur l'usage des terres publiques et un financement. En contrepartie, le groupe retire ses demandes de titre autochtone et renonce à en déposer de nouvelles.
