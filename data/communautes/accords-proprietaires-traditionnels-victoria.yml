  - {instrument: "Accord de reconnaissance et de règlement Gunaikurnai, 22 octobre 2010, conclu le jour de la décision de la Cour fédérale reconnaissant le titre autochtone gunaikurnai", nature: "accord_revendication", annee: 2010, source: "https://www.firstpeoplesrelations.vic.gov.au/gunaikurnai-recognition-and-settlement-agreement"}
  - {instrument: "Accord de reconnaissance et de règlement Dja Dja Wurrung, signé le 28 mars 2013, en vigueur le 24 octobre 2013", nature: "accord_revendication", annee: 2013, source: "https://www.firstpeoplesrelations.vic.gov.au/dja-dja-wurrung-recognition-and-settlement-agreement"}
  - {instrument: "Accord de reconnaissance et de règlement Taungurung, signé le 26 octobre 2018, en vigueur le 11 août 2020", nature: "accord_revendication", annee: 2018, source: "https://www.firstpeoplesrelations.vic.gov.au/taungurung-recognition-and-settlement-agreement"}
  - {instrument: "Accord de reconnaissance et de règlement des peuples Wotjobaluk, Jaadwa, Jadawadjali, Wergaia et Jupagulk, signé le 25 octobre 2022, en vigueur le 13 décembre 2022", nature: "accord_revendication", annee: 2022, source: "https://www.firstpeoplesrelations.vic.gov.au/wotjobaluk-jaadwa-jadawadjali-wergaia-and-jupagulk-people-wotjobaluk-nations-recognition-settlement-agreement"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le groupe désigne une personne morale (traditional owner group entity, en pratique une corporation aborigène) qui le représente et conclut les accords (loi de 2010, s. 3 et 4) ; les parcs en titre aborigène sont gérés par un conseil de gestion (Traditional Owner Land Management Board) dont la majorité des membres est proposée par cette corporation, la gestion courante restant à l'État.", source: "https://www.firstpeoplesrelations.vic.gov.au/dja-dja-wurrung-recognition-and-settlement-agreement"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le titre aborigène est une pleine propriété accordée à la corporation qui ne peut être ni vendue, ni grevée, ni louée, et dont le droit d'occuper et de gérer est transféré à l'État (s. 19 et 20) ; l'accord peut aussi prévoir des terres en pleine propriété, éventuellement inaliénables et détenues en fiducie pour le groupe (s. 12 et 15).", source: "https://www.legislation.vic.gov.au/in-force/acts/traditional-owner-settlement-act-2010/026"}
  ressources: {valeur: "partiel", note: "L'accord sur les ressources naturelles (natural resource agreement) peut autoriser l'accès aux terres publiques, la chasse, la pêche, la cueillette, le prélèvement d'eau et le camping sans permis (s. 80, 82 et 85), pour des besoins personnels, domestiques ou communautaires non commerciaux (s. 79 et 84(a)) ; un usage commercial n'est admis que pour la faune et la flore et si l'accord le prévoit (s. 84(b)) ; or, argent, métaux et minéraux sont exclus (s. 79). L'accord Dja Dja Wurrung admet un prélèvement commercial limité, l'accord Gunaikurnai aucun.", source: "https://www.legislation.vic.gov.au/in-force/acts/traditional-owner-settlement-act-2010/026"}
  consentement: {valeur: "partiel", note: "L'accord sur l'usage des terres (land use activity agreement) classe les activités : les « activités d'avis » imposent d'informer et de consulter la corporation (s. 34), les « activités de négociation » d'obtenir son accord sauf décision du tribunal civil et administratif de Victoria (VCAT) ou du ministre (s. 40(1) à (3) et 43), les « activités d'accord » son consentement (s. 40(4) à (6)) ; seuls les accords Dja Dja Wurrung (2013) et Taungurung (2020) en comportent un en vigueur ; celui des peuples Wotjobaluk, conclu en 2026, n'est pas encore entré en vigueur.", source: "https://www.legislation.vic.gov.au/in-force/acts/traditional-owner-settlement-act-2010/026"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'accord de financement (funding agreement) verse des fonds à la corporation pour exécuter l'accord, le cas échéant par une fiducie caritative agréée par le ministre (s. 78(2)), le Victorian Traditional Owners Trust ; aucun pouvoir fiscal n'est prévu.", source: "https://www.legislation.vic.gov.au/in-force/acts/traditional-owner-settlement-act-2010/026"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La commission d'enquête Yoorrook (Yoorrook Justice Commission), instituée par l'État de Victoria, relève que sur 1 265 937 hectares promis en titre aborigène depuis 2010, 59 075 ont été attribués, et sur environ 400 hectares promis en pleine propriété depuis 2013, 65 ; son rapport Yoorrook for Transformation (1er juillet 2025, recommandation 26) demande d'appliquer la revue de la loi (First Principles Review), notamment sur le financement et le respect des accords sur l'usage des terres. Dans sa réponse à cette revue (36 recommandations), le gouvernement soutient pleinement la recommandation 1, accepte 28 recommandations sur le principe, sous réserve de consultation, et rejette les 7 recommandations présentées par les seuls représentants des propriétaires traditionnels.", source: "https://www.yoorrook.org.au/focus-areas/land-sky-and-waters"}
chronologie:
  - {annee: 2010, evenement: "Adoption du Traditional Owner Settlement Act (loi no 62/2010) ; le 22 octobre, la Cour fédérale reconnaît le titre autochtone gunaikurnai et l'État conclut le premier accord avec les Gunaikurnai (dix parcs et réserves en titre aborigène)."}
  - {annee: 2013, evenement: "Loi modificative no 4/2013 ; accord Dja Dja Wurrung signé le 28 mars, en vigueur le 24 octobre ; premier accord sur l'usage des terres le 25 octobre."}
  - {annee: 2016, evenement: "Loi modificative no 67/2016 : refonte des accords sur les ressources naturelles et du régime du titre aborigène."}
  - {annee: 2017, evenement: "Ouverture des négociations avec les peuples Wotjobaluk (août) et avec les Eastern Maar (annonce du 2 novembre)."}
  - {annee: 2018, evenement: "Accord Taungurung signé le 26 octobre ; plans de gestion conjointe des parcs gunaikurnai (septembre) et dja dja wurrung (octobre) approuvés."}
  - {annee: 2020, evenement: "Entrée en vigueur de l'accord Taungurung et de son accord sur l'usage des terres le 11 août."}
  - {annee: 2022, evenement: "Accord des peuples Wotjobaluk signé le 25 octobre, en vigueur le 13 décembre, sans accord sur l'usage des terres ; l'État et le Barengi Gadjin Land Council s'engagent à en poursuivre la négociation."}
  - {annee: 2023, evenement: "Le 28 mars, la Cour fédérale reconnaît le titre autochtone des Eastern Maar sur la plus grande partie de leur demande ; l'accord de règlement avec l'État reste en négociation."}
  - {annee: 2025, evenement: "Rapport Yoorrook for Transformation déposé au Parlement de Victoria le 1er juillet ; la recommandation 26 demande d'appliquer en entier la revue de la loi de 2010."}
  - {annee: 2025, evenement: "Statewide Treaty Act 2025 (loi no 45/2025) sanctionné le 13 novembre : la corporation partie à un accord de règlement compte parmi les groupes de propriétaires traditionnels (s. 4) ; chacun de ces groupes peut nommer un membre réservé à la First Peoples' Assembly (s. 62) ; la loi ne réduit pas les droits issus d'autres lois (s. 5)."}
  - {annee: 2026, evenement: "Accord sur l'usage des terres des peuples Wotjobaluk conclu ; selon le gouvernement de Victoria (page du 20 août), il n'est pas encore entré en vigueur et sa date de commencement n'est pas connue."}
