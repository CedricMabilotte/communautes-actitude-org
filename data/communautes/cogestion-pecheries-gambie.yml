base_nationale:
  - {instrument: "Loi sur les pêches de 2007 (Fisheries Act 2007, n° 20 de 2007), art. 11 (droits de participation et attribution de droits de propriété sur une pêcherie), art. 12 (plans de gestion et consultation), art. 13 (comités de gestion), art. 14 (zones spéciales de gestion) et art. 15 (centres de pêche communautaires)", nature: "loi", annee: 2007, source: "https://faolex.fao.org/docs/pdf/gam77403.pdf"}
  - {instrument: "Accord de cogestion de la pêcherie de sole entre le ministre des Pêches, des Ressources en eau et des Affaires de l'Assemblée nationale et le NASCOM, signé le 17 janvier 2012, et plan de cogestion du complexe de la sole", nature: "loi", annee: 2012, source: "https://faolex.fao.org/docs/pdf/gam210795.pdf"}
  - {instrument: "Plan de cogestion de la pêcherie de coques et d'huîtres, zone spéciale de gestion du Tanbi, signé le 17 janvier 2012 par le ministre des Pêches, le directeur des Pêches, la TRY Association, le département des Parcs et de la Faune, le département des Forêts et l'Agence nationale de l'environnement", nature: "loi", annee: 2012, source: "https://www.crc.uri.edu/download/Oyster_Plan_Jan_2012_508_Signatures.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le plan de 2012 autorise la TRY Association à créer un comité de gestion des coques et des huîtres du Tanbi dont elle fixe la composition, et prévoit des comités de gestion dans chaque communauté (plan huîtres, sections 6.2 et 6.3) ; pour la sole, le NASCOM réunit des représentants des communautés de pêche, des mareyeuses, des sites de débarquement, des communes, de l'administration et des industriels, et la gestion revient au département des Pêches si le comité se dissout (plan sole, sections 5.3 et 6.1).", source: "https://www.crc.uri.edu/download/Oyster_Plan_Jan_2012_508_Signatures.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le comité de la TRY Association fixe les fermetures saisonnières, les tailles minimales, les zones d'usage exclusif des communautés et des amendes jusqu'à 5 000 dalasis ; ses règles sont transmises pour information, et non pour approbation, aux départements des Pêches, des Parcs et des Forêts (plan huîtres, section 6.2) ; le département des Pêches revoit chaque année les règles et peut exiger leur révision (section 6.5) ; pour la sole, le NASCOM établit les règles de capture avec le département des Pêches (plan sole, section 6.1).", source: "https://www.crc.uri.edu/download/Oyster_Plan_Jan_2012_508_Signatures.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Par l'accord de cogestion de la sole du 17 janvier 2012, pris en vertu des art. 11, 14 et 15 de la loi sur les pêches de 2007, le ministre attribue au NASCOM et à ses comités de sites de débarquement les droits d'usage exclusifs sur la pêcherie artisanale de sole jusqu'à 9 milles nautiques ; le plan des huîtres signé le même jour, pris en vertu des art. 11 et 14, attribue à la TRY Association les droits d'usage exclusifs sur les coques et les huîtres du parc du Tanbi, y compris l'ostréiculture ; la responsabilité de gestion reste partagée avec le département des Pêches, qui fixe les licences de la pêche artisanale (plan sole, section 6.1 ; plan huîtres, sections 6.1 et 5.7).", source: "https://faolex.fao.org/docs/pdf/gam210795.pdf"}
  consentement: {valeur: "partiel", note: "Le directeur des Pêches consulte les centres de pêche communautaires et les associations de pêcheurs pour préparer et réviser les plans de gestion (loi sur les pêches de 2007, art. 12, al. 4), et le ministre tient compte des préoccupations des communautés riveraines en créant un centre de pêche communautaire (art. 15, al. 2) ; la loi ne prévoit pas de consentement.", source: "https://faolex.fao.org/docs/pdf/gam77403.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La TRY Association peut percevoir des droits d'accès ou délivrer des licences dans les zones ouvertes, encaisse les amendes et décide de l'emploi de ces recettes (plan huîtres, sections 5.4 et 6.2) ; pour la sole, les amendes reviennent à la communauté et une part au NASCOM pour financer la surveillance (plan sole, section 8.6) ; aucun budget public garanti n'est prévu.", source: "https://www.crc.uri.edu/download/Oyster_Plan_Jan_2012_508_Signatures.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation publique postérieure à 2013 n'a été trouvée pour les deux plans. L'étude de cas de l'Initiative Équateur (PNUD) indique que l'association a allongé la fermeture saisonnière de la récolte des huîtres, que la vente d'huîtres fraîches se limite à la période de mars à juin, celle que le plan ouvre à la récolte (section 5.1), et que des membres surveillent le parc avec les gardes du département des Parcs et de la Faune ; aucune source indépendante n'a été trouvée sur l'application du plan de la sole.", source: "https://www.equatorinitiative.org/wp-content/uploads/2017/05/case_1370356657.pdf"}
chronologie:
  - {annee: 2005, evenement: "Le projet de gestion intégrée de la zone côtière (ICAM) cherche à attribuer certains chenaux du Tanbi (bolongs) aux communautés qui les exploitent et en ferme d'autres ; ces attributions restent disputées entre communautés."}
  - {annee: 2007, evenement: "Loi sur les pêches (n° 20 de 2007) : zones spéciales de gestion, droits sur les pêcheries, centres de pêche communautaires. Le parc du Tanbi est inscrit comme site Ramsar. Création de la TRY Association en juillet."}
  - {annee: 2008, evenement: "Règlement sur les pêches de 2008, pris en application de la loi de 2007."}
  - {annee: 2010, evenement: "Création du comité national de cogestion de la sole (NASCOM) en septembre ; premier comité exécutif élu de la TRY Association."}
  - {annee: 2012, evenement: "Le 17 janvier, le ministre des Pêches signe les plans de cogestion de la sole et des huîtres et coques du Tanbi. La TRY Association reçoit le prix Équateur du PNUD à Rio+20."}
fiabilite:
  verifie: ["Loi sur les pêches de 2007 (texte FAOLEX) : art. 11 (droits de participation, désignation par avis au Journal officiel des pêcheries soumises à attribution de droits de propriété), art. 12 al. 4 (consultation des centres de pêche communautaires et des associations), art. 13 (comités de gestion), art. 14 (zones spéciales de gestion déclarées par avis au Journal officiel, y compris dans des aires marines protégées), art. 15 (centres de pêche communautaires, attribution de zones et description de leurs droits).", "Accord de cogestion de la sole (FAOLEX) et plan de la sole : zone de 9 milles nautiques, droits d'usage exclusifs au NASCOM et aux comités de sites de débarquement, signatures du ministre, du directeur des Pêches et du président du NASCOM le 17 janvier 2012 ; sept comités de sites de débarquement ; fermeture d'un mille nautique du 1er mai au 31 octobre.", "Plan des coques et huîtres : signatures du 17 janvier 2012 ; parc du Tanbi de 6 304 ha déclaré zone spéciale de gestion ; droits d'usage exclusifs à la TRY Association ; 500 membres dans 15 communautés ; neuf communautés de récoltantes dans le parc ; dix zones d'usage exclusif communautaires ; fermeture de la récolte des huîtres de juillet à février ; pouvoirs du comité de gestion et des comités communautaires.", "Étude de cas de l'Initiative Équateur (PNUD) : 15 communautés, plus de 500 récoltantes, complexe du Tanbi de 6 300 ha, plan approuvé le 17 janvier 2012, création de la TRY Association en 2007."]
  non_confirme: ["La publication au Journal officiel (Gazette) des avis exigés par les art. 11 et 14 de la loi de 2007 n'a pas été vérifiée.", "La validité actuelle des deux plans, leur révision éventuelle après 2012 et le maintien de la loi de 2007 sans remplacement n'ont pas été vérifiés.", "Aucune source indépendante récente sur le fonctionnement du NASCOM et des comités de sites de débarquement.", "Le nombre de pêcheurs de sole concernés et la surface de la zone de la sole ne sont pas chiffrés par les sources ouvertes.", "Le plan des huîtres fait coïncider la zone spéciale de gestion avec les limites du parc du Tanbi, mais range parmi les dix zones d'usage exclusif un chenal de l'estuaire de Kartong, hors du parc (section 5.2, figure 9) ; le statut de cette zone n'est pas précisé.", "Aucun document de la CDB, ni inscription au registre ICCA ou à la base WDPA visant ces deux régimes n'a été trouvé ; le prix Équateur n'est pas un mécanisme de reconnaissance au sens du cadre."]
