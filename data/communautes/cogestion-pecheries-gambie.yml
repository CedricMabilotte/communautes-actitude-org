resume: >-
  Fiche agrégée : elle couvre les deux pêcheries que l'État gambien a confiées en cogestion à des organisations de pêcheurs et de récoltantes, c'est-à-dire en gestion partagée entre l'administration et les usagers. La loi sur les pêches de 2007 (Fisheries Act 2007) permet au ministre de déclarer des zones spéciales de gestion (Special Management Areas) pour une gestion communautaire des pêches (art. 14), d'attribuer des droits sur une pêcherie (art. 11) et de créer des centres de pêche communautaires (Community Fisheries Centres, art. 15). Le 17 janvier 2012, le ministre des Pêches a signé deux plans de cogestion : le premier attribue les droits d'usage exclusifs sur la pêche artisanale de la sole, jusqu'à 9 milles nautiques, au comité national de cogestion de la sole (NASCOM) et à ses comités de sites de débarquement ; le second attribue les droits d'usage exclusifs sur les huîtres et les coques du parc national du Tanbi (6 304 ha) à la TRY Association, qui regroupe environ 500 récoltantes de 15 communautés.
