resume: >-
  Fiche agrégée : elle couvre les communautés de droit coutumier (masyarakat hukum adat, MHA) dont l'existence et le territoire (wilayah adat) sont reconnus par un acte d'un gouvernement régional. Le règlement du ministre de l'Intérieur n° 52 de 2014 confie cette reconnaissance aux gouverneurs et aux chefs de district ou maires, après identification, vérification et arrêté du chef de l'exécutif local. Depuis le règlement du ministre de l'Agraire n° 14 de 2024, la terre coutumière (tanah ulayat) d'une communauté ainsi reconnue peut être inscrite au cadastre puis enregistrée comme droit de gestion (hak pengelolaan) au nom de la communauté. Cette fiche traite de la terre et du territoire ; la forêt coutumière, attribuée par décret du ministère des Forêts, fait l'objet de la fiche « Forêts coutumières d'Indonésie ». L'Agence d'enregistrement des territoires coutumiers (BRWA, organisme non gouvernemental) compte 417 territoires établis sur 7,5 millions d'hectares, sur 2 281 cartes enregistrées couvrant 36,65 millions d'hectares. Le tableau comprend des territoires d'Aceh, de Bali, des Moluques, du Kalimantan central, de Sumatra occidental et des provinces de Papouasie, où s'appliquent aussi les régimes décrits dans les fiches « Acehnais », « Villages coutumiers de Bali (desa adat) », « Negeri coutumières des Moluques », « Dayak du Kalimantan central », « Nagari du Minangkabau (Sumatra occidental) » et « Papous (Orang Asli Papua) ».
