base_nationale:
  - {instrument: "Constitution de 1945, art. 18B (2) : l'État reconnaît et respecte les communautés de droit coutumier et leurs droits traditionnels", nature: "constitution", annee: 2000, source: "https://www.constituteproject.org/constitution/Indonesia_2002"}
  - {instrument: "Loi n° 5 de 1960 sur les principes fondamentaux du droit agraire, art. 3 : reconnaissance du droit coutumier sur la terre (hak ulayat) « tant qu'il existe dans les faits »", nature: "loi", annee: 1960, source: "https://pasal.id/peraturan/uu/uu-no-5-tahun-1960"}
  - {instrument: "Règlement du ministre de l'Intérieur n° 52 de 2014, lignes directrices pour la reconnaissance et la protection des communautés de droit coutumier, art. 1 à 12", nature: "loi", annee: 2014, source: "https://pasal.id/peraturan/permen/permendagri-no-52-tahun-2014"}
  - {instrument: "Règlement du ministre de l'Agraire et de l'Aménagement du territoire n° 14 de 2024 sur l'administration foncière et l'enregistrement des terres coutumières, art. 1 à 34 (art. 33 : abroge le règlement n° 18 de 2019)", nature: "loi", annee: 2024, source: "https://pasal.id/peraturan/permen/permen-atrbpn-no-14-tahun-2024"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le chef de district ou le maire reconnaît la communauté par arrêté (Keputusan Kepala Daerah), sur recommandation d'un comité présidé par le secrétaire régional, après identification de son histoire, de son territoire, de son droit coutumier, de ses biens et de ses institutions de gouvernement coutumier (art. 3 à 6 du règlement n° 52 de 2014). Le règlement n° 14 de 2024 définit la communauté titulaire du droit de gestion comme dotée d'institutions coutumières (art. 1 (2)) et inscrit sur le titre de propriété commune le nom du chef du groupe avec sa fonction selon le droit coutumier (art. 27). Le règlement ne fixe pas de compétences à ces institutions ; elles dépendent de l'acte régional.", source: "https://pasal.id/peraturan/permen/permendagri-no-52-tahun-2014"}
  pouvoir_normatif: {valeur: "partiel", note: "L'enregistrement de la terre coutumière ne réduit pas l'application du droit coutumier à cette terre (art. 30 du règlement n° 14 de 2024), et la mise à jour des données foncières se fait « en respectant le droit coutumier en vigueur » (art. 28). La loi agraire de 1960 subordonne ce droit à l'intérêt national et aux lois (art. 3).", source: "https://pasal.id/peraturan/permen/permen-atrbpn-no-14-tahun-2024"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La terre coutumière inscrite au registre peut être enregistrée comme droit de gestion (hak pengelolaan, titre foncier détenu par la collectivité) au nom de la communauté, sur présentation de l'acte régional de reconnaissance (art. 14, 15 et 18 du règlement n° 14 de 2024) ; un groupe de membres peut obtenir une propriété commune (hak milik) au nom de son chef coutumier (art. 17 et 27). La terre coutumière non enregistrée garde son statut (art. 16). Le ministre peut refuser la décision (art. 21), et le droit coutumier ne s'exerce pas sur les terres déjà titrées, affectées à un usage public ou acquises par l'administration (art. 3).", source: "https://pasal.id/peraturan/permen/permen-atrbpn-no-14-tahun-2024"}
  ressources: {valeur: "partiel", note: "Le droit coutumier (hak ulayat) est défini comme le pouvoir de la communauté de tirer profit des ressources naturelles, terre comprise, de son territoire (art. 1 (1) du règlement n° 14 de 2024) ; le territoire coutumier comprend la terre, l'eau et les ressources naturelles (art. 1 (2) du règlement n° 52 de 2014). Le sous-sol et la forêt relèvent de régimes distincts.", source: "https://pasal.id/peraturan/permen/permen-atrbpn-no-14-tahun-2024"}
