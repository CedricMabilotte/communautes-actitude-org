effectivite: {valeur: "partielle", note: "En mars 2025, 302 territoires coutumiers sur 5,3 millions d'hectares avaient reçu un acte d'établissement, soit 19,08 % des 1 583 territoires (32,3 millions d'hectares) enregistrés par la BRWA (Betahita, 19 mai 2025, citant la BRWA). Le 1er octobre 2026, le registre de la BRWA compte une terre coutumière (tanah ulayat) enregistrée au cadastre, sur 699,7 ha.", source: "https://www.betahita.id/berita/11099/baru-5-3-juta-ha-wilayah-adat-yang-mendapatkan-penetapan"}
chronologie:
  - {annee: 1960, evenement: "Loi agraire n° 5 : le droit coutumier sur la terre est reconnu tant qu'il existe et qu'il est conforme à l'intérêt national."}
  - {annee: 2000, evenement: "Deuxième révision de la Constitution : l'art. 18B (2) reconnaît les communautés de droit coutumier et leurs droits traditionnels."}
  - {annee: 2014, evenement: "Règlement du ministre de l'Intérieur n° 52 du 7 juillet 2014 : procédure de reconnaissance par les gouverneurs et chefs de district."}
  - {annee: 2019, evenement: "Règlement du ministre de l'Agraire n° 18 sur l'administration des terres coutumières."}
  - {annee: 2024, evenement: "Règlement du ministre de l'Agraire n° 14, signé le 27 février et publié le 29 février 2024 : registre des terres coutumières, droit de gestion au nom de la communauté reconnue, propriété commune pour un groupe de membres ; abrogation du règlement n° 18 de 2019."}
  - {annee: 2025, evenement: "302 territoires coutumiers établis sur 5,3 millions d'hectares (BRWA, mars 2025)."}
  - {annee: 2026, evenement: "417 territoires établis sur 7,5 millions d'hectares dans le registre de la BRWA."}
fiabilite:
  verifie: ["Texte indonésien des art. 1 à 12 du règlement du ministre de l'Intérieur n° 52 de 2014 (pasal.id, source peraturan.go.id).", "Texte indonésien des art. 1 à 34 du règlement du ministre de l'Agraire n° 14 de 2024, signé le 27 février 2024 et publié le 29 février 2024 (pasal.id).", "Art. 3 de la loi n° 5 de 1960 (pasal.id).", "Art. 18B (2) de la Constitution (Constitute Project, traduction anglaise).", "Registre de la BRWA consulté le 1er octobre 2026 : 2 281 cartes, 36,65 millions d'hectares, 32 provinces ; statut « établi » (penetapan) : 417 territoires, 7 532 723 ha ; forêts coutumières : 169, 332 661 ha ; terre coutumière enregistrée : 1, 699,7 ha ; zones côtières : 24, 377 526 ha.", "302 territoires et 5,3 millions d'hectares établis en mars 2025, 1 583 territoires et 32,3 millions d'hectares enregistrés : Betahita, 19 mai 2025, citant la BRWA.", "Tableau des sites : 365 des 418 entrées au statut « établi » (penetapan) de la base de données de la BRWA consultée le 1er octobre 2026, retenues parce que leur fiche cite au moins un acte régional intitulé (règlement régional de province ou de district, arrêté de gouverneur, de chef de district ou de maire) de reconnaissance ou d'établissement ; 53 entrées exclues : acte cité limité à un décret ministériel de forêt coutumière ou de zone côtière, à un acte régional sans intitulé, à la création d'un comité ou au règlement provincial de Jambi n° 2 de 2014 sur l'institution coutumière malaise. Nom, subdivision et surface de chaque ligne contrôlés sur la base de la BRWA."]
  non_confirme: ["La BRWA est un organisme non gouvernemental : aucune liste officielle consolidée des actes régionaux de reconnaissance n'a été trouvée ; le ministère de l'Intérieur reçoit les rapports des gouverneurs (art. 10 du règlement n° 52 de 2014) mais ne publie pas de liste.", "Les surfaces du tableau sont celles des cartes enregistrées par la BRWA, pas forcément celles fixées par l'acte régional ; la somme du tableau est d'environ 68 342 km².", "Colonne annee : année de l'acte régional de reconnaissance cité par la BRWA (arrêté de préférence, à défaut règlement régional) ; vide quand cet acte n'est pas daté dans la fiche de la BRWA (66 sites). Certains arrêtés reconnaissent plusieurs communautés à la fois (ex. To Kaili et To Kulawi, district de Sigi, 2015).", "Le chiffre de 417 de la page d'accueil de la BRWA diffère de 418 entrées dans sa base de données consultée le même jour ; il inclut des territoires établis par décret ministériel sans acte régional cité.", "Le tableau recoupe les fiches hutan-adat-indonesie (forêts coutumières sur un territoire reconnu), espaces-cotiers-coutumiers-indonesie, aceh-indonesie (mukim), nagari-sumatra-occidental, desa-adat-bali, negeri-adat-maluku, dayak-kalimantan-central et papous-indonesie.", "Nombre de droits de gestion (hak pengelolaan) délivrés au titre du règlement n° 14 de 2024 : aucun chiffre du ministère de l'Agraire n'a été ouvert.", "Le projet de loi sur les communautés de droit coutumier, en discussion au Parlement depuis 2012, n'est pas traité ici.", "Aucun document onusien nommant le régime de reconnaissance régionale n'a été trouvé.", "Population : non totalisée. La base de données de la BRWA consultée le 5 octobre 2026 donne une population pour 216 des 418 entrées au statut « établi », soit 790 229 personnes ; les 202 autres n'ont pas de chiffre.", "Nombre de villages : non trouvé pour le régime. La BRWA compte 2 094 villages administratifs (desa) couverts par l'ensemble de ses 2 281 cartes, tous statuts confondus ; 144 des 418 fiches au statut « établi » ne nomment aucun village."]
