effectivite: {valeur: "partielle", note: "Une conférence tenue en juillet 2025 à Geraci Siculo (Sicile) relève que l'application de la loi n° 168 de 2017 se heurte au manque de connaissance juridique, à des difficultés de coordination et à un accès limité aux financements, et qu'une proposition de loi régionale en discussion vise à aligner le droit sicilien sur la loi nationale.", source: "https://www.iccaconsortium.org/2025/09/08/italy-recap-conference-collective-lands-biodiversity-territories-of-life/"}
chronologie:
  - {annee: 1924, evenement: "Décret royal n° 751 du 22 mai sur la réorganisation des usi civici dans le Royaume."}
  - {annee: 1927, evenement: "Loi n° 1766 du 16 juin : constatation et liquidation des usi civici, terres des communes, universités et associations agraires ouvertes aux usages de tous les citoyens de la commune ou de la frazione (hameau rattaché à une commune) (art. 26), commissaires régionaux aux fonctions administratives et judiciaires (art. 27)."}
  - {annee: 2010, evenement: "Le 6e recensement général de l'agriculture compte 2 233 exploitations gérées par un ente ou une commune gérant des propriétés collectives, sur 1 668 851,85 ha de superficie totale."}
  - {annee: 2017, evenement: "Loi n° 168 du 20 novembre (Gazzetta Ufficiale du 28 novembre, en vigueur le 13 décembre) : reconnaissance des domini collettivi comme ordre juridique premier des communautés d'origine."}
  - {annee: 2023, evenement: "Arrêt n° 119 de la Cour constitutionnelle (déposé le 15 juin) : l'inaliénabilité ne s'applique plus aux terres privées grevées d'usi civici non liquidés."}
  - {annee: 2025, evenement: "Conférence de Geraci Siculo (19 et 20 juillet) sur les terres collectives, la biodiversité et les territoires de vie ; approbation des statuts d'une association italienne des territoires de vie."}
fiabilite:
  verifie:
    - "Texte consolidé des articles 1, 2 et 3 de la loi n° 168 de 2017 sur Normattiva, dont les alinéas 8-bis, 8-ter et 8-quater de l'article 3 (transferts et échanges de terrains d'usage civique irréversiblement transformés)."
    - "Articles 1, 11, 12, 26 et 27 de la loi n° 1766 de 1927 sur Normattiva."
    - "Dispositif de l'arrêt n° 119 de 2023 de la Cour constitutionnelle."
    - "Chiffres du 6e recensement général de l'agriculture (Istat, 2010), tableaux 2.1 et 2.2, catégorie « Ente (comunanze, università, regole, ecc.) o Comune che gestisce proprietà collettive »."
  non_confirme:
    - "Nombre d'entités représentatives (regole, comunanze, partecipanze agrarie, università agrarie, ASBUC ou administrations séparées des biens d'usage civique) en activité : aucun registre national trouvé ; le chiffre de 2 233 compte des exploitations agricoles recensées, communes gestionnaires comprises, et non des communautés titulaires ; aucun tableau des sites n'est donc joint."
    - "Surface totale grevée d'usi civici : le chiffre de l'Istat ne couvre que les terres entrant dans le champ du recensement agricole de 2010 ; aucune donnée nationale plus récente trouvée."
    - "Nombre d'habitants titulaires de droits : aucun chiffre trouvé."
    - "Acte qui a ajouté les alinéas 8-bis à 8-quater à l'article 3 et modifié l'article 2, alinéa 4, de la loi n° 168 de 2017 : non identifié sur une source ouverte."
    - "Inscription de domaines collectifs italiens au registre ICCA ou à la base WDPA : non vérifiée."
    - "Fonctionnement actuel des commissaires régionaux aux usi civici : décrit par l'encyclopédie Treccani, non vérifié sur un texte récent."
