base_nationale:
  - {instrument: "Loi n° 168 du 20 novembre 2017, normes en matière de domaines collectifs (Norme in materia di domini collettivi), Gazzetta Ufficiale n° 278 du 28 novembre 2017", nature: "loi", annee: 2017, source: "https://www.normattiva.it/eli/stato/LEGGE/2017/11/20/168/CONSOLIDATED"}
  - {instrument: "Loi n° 1766 du 16 juin 1927, conversion du décret royal n° 751 du 22 mai 1924 sur la réorganisation des usi civici", nature: "loi", annee: 1927, source: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1927-06-16;1766"}
  - {instrument: "Cour constitutionnelle, arrêt n° 119 de 2023 (décision du 11 mai 2023, déposée le 15 juin 2023) sur l'article 3, alinéa 3, de la loi n° 168 de 2017", nature: "jurisprudence", annee: 2023, source: "https://www.cortecostituzionale.it/actionSchedaPronuncia.do?param_ecli=ECLI:IT:COST:2023:119"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les entités représentatives (enti esponenziali) des collectivités titulaires ont la personnalité juridique de droit privé et l'autonomie statutaire (loi n° 168 de 2017, art. 1, al. 2) et administrent les biens collectifs ; en leur absence, la commune les gère en administration séparée (art. 2, al. 4) ; les actes pris par ces entités au titre de l'art. 3, al. 7, ne deviennent exécutoires qu'après délibération de la Junte régionale.", source: "https://www.normattiva.it/eli/stato/LEGGE/2017/11/20/168/CONSOLIDATED"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi n° 168 de 2017 reconnaît aux domaines collectifs une « capacità di autonormazione » (capacité de se donner leurs propres règles) pour leur administration (art. 1, al. 1, b) ; l'usage du domaine civique suit les règles d'usage fixées par le domaine collectif (art. 3, al. 5) ; ces règles restent soumises à la Constitution (art. 1, al. 1, a) et limitées à la gestion des biens.", source: "https://www.normattiva.it/eli/stato/LEGGE/2017/11/20/168/CONSOLIDATED"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les biens collectifs (terres de propriété collective d'origine, terres attribuées après liquidation des usi civici, terres collectives des familles descendant des anciens originaires du lieu, plans d'eau grevés d'usi civici) restent inaliénables, indivisibles, imprescriptibles et affectés pour toujours à l'usage agro-sylvo-pastoral (loi n° 168 de 2017, art. 3, al. 1 et 3) ; l'arrêt n° 119 de 2023 de la Cour constitutionnelle a retiré de ce régime d'inaliénabilité les terres privées sur lesquelles les habitants exercent des usi civici non encore liquidés.", source: "https://www.normattiva.it/eli/stato/LEGGE/2017/11/20/168/CONSOLIDATED"}
  ressources: {valeur: "partiel", note: "La République reconnaît et protège les droits des citoyens d'usage et de gestion des biens de jouissance collective antérieurs à l'État italien (loi n° 168 de 2017, art. 2, al. 2) ; ces droits portent sur l'exploitation du fonds et sont réservés aux membres de la communauté, sauf décision contraire de l'entité collective (art. 2, al. 3) et s'étendent aux plans d'eau grevés d'usi civici (art. 3, al. 1, f) ; la destination agro-sylvo-pastorale perpétuelle et la servitude paysagère (art. 3, al. 3 et 6) limitent les usages.", source: "https://www.normattiva.it/eli/stato/LEGGE/2017/11/20/168/CONSOLIDATED"}
