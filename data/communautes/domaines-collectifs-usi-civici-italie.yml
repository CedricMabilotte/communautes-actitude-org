resume: >-
  Fiche agrégée : elle couvre les collectivités d'habitants titulaires de domini collettivi (domaines collectifs, terres possédées et gérées en commun) et d'usi civici (droits d'usage civique : pâturage, bois, cueillette sur des terres publiques ou privées), qu'elles portent le nom de regole, comunanze, partecipanze agrarie, università agrarie, vicinie ou associations agraires. La loi n° 168 du 20 novembre 2017 reconnaît ces domaines comme « ordinamento giuridico primario delle comunità originarie » (ordre juridique premier des communautés d'origine), dotés d'une « capacità di autonormazione » (capacité de se donner leurs propres règles), et donne à leurs entités représentatives la personnalité juridique de droit privé et l'autonomie statutaire. Les biens collectifs sont inaliénables, indivisibles, imprescriptibles et affectés pour toujours à l'usage agro-sylvo-pastoral ; depuis l'arrêt n° 119 de 2023 de la Cour constitutionnelle, l'inaliénabilité ne vise plus les terres privées grevées d'usi civici non liquidés. Le cadre antérieur, la loi n° 1766 du 16 juin 1927, visait surtout la constatation et la liquidation des usi civici sous le contrôle de commissaires régionaux. Les Regole de Vénétie et les ASUC du Trentin, régies aussi par une loi régionale ou provinciale, ont leur propre fiche.
