resume: >-
  La loi sur les terres n° 19/97 du 1er octobre 1997 (Lei de Terras) définit la communauté locale (comunidade local : groupe de familles et d'individus vivant dans une circonscription de niveau de la localité ou inférieur) et lui reconnaît un droit d'usage et d'exploitation de la terre (DUAT, direito de uso e aproveitamento da terra) acquis par occupation selon les normes et pratiques coutumières. La terre reste propriété de l'État ; le DUAT communautaire est détenu en co-titularité (détention en commun), sans limite de durée, et n'exige ni titre ni enregistrement pour exister. La loi impose la consultation des communautés avant tout titre délivré à un tiers et leur donne un rôle dans la gestion des ressources, la résolution des conflits et la délimitation de leurs terres. Un projet de nouvelle loi foncière, qui abroge la loi de 1997, a été approuvé en Conseil des ministres le 28 octobre 2025 et transmis à l'Assemblée de la République, dont les commissions l'ont soumis à une consultation publique en avril 2026 ; la loi de 1997 reste en vigueur à la date des sources consultées.
