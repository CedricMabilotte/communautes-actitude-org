base_nationale:
  - {instrument: "Constitution de la République du Mozambique (2004), art. 109 à 111 (texte consulté : version de 2007, Constitute Project)", nature: "constitution", annee: 2004, source: "https://www.constituteproject.org/constitution/Mozambique_2007"}
  - {instrument: "Lei de Terras (loi sur les terres) n° 19/97 du 1er octobre 1997, Boletim da República, I série, n° 40, 3e supplément, 7 octobre 1997, art. 1, 10, 12, 13, 14, 15, 17, 24, 29 et 30", nature: "loi", annee: 1997, source: "https://www.dlapiperafrica.com/export/sites/africa/mozambique/insights/legislation-series/land/downloads/Lei_19_1997.pdf_2063069299.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "partiel", note: "Le DUAT des communautés s'acquiert par occupation « segundo as normas e práticas costumeiras no que não contrariem a Constituição » (loi n° 19/97, art. 12 a) ; dans la gestion des ressources et la résolution des conflits, les communautés utilisent « entre outras, as normas e práticas costumeiras » (art. 24 (2)). Les mécanismes de représentation et d'action propres des communautés sont renvoyés à une loi (art. 30).", source: "https://www.dlapiperafrica.com/export/sites/africa/mozambique/insights/legislation-series/land/downloads/Lei_19_1997.pdf_2063069299.pdf"}
  justice_propre: {valeur: "partiel", note: "Dans les zones rurales, les communautés locales participent à la résolution des conflits (loi n° 19/97, art. 24 (1) b) en appliquant notamment les normes et pratiques coutumières (art. 24 (2)) ; aucune juridiction propre n'est créée par la loi.", source: "https://www.dlapiperafrica.com/export/sites/africa/mozambique/insights/legislation-series/land/downloads/Lei_19_1997.pdf_2063069299.pdf"}
  terres: {valeur: "reconnu", note: "La terre est propriété de l'État et ne peut être vendue, hypothéquée ou saisie (Constitution, art. 109 ; loi n° 19/97, art. 3) ; l'État reconnaît et protège les droits acquis par héritage ou occupation (Constitution, art. 111). Les communautés locales sont titulaires du DUAT (loi n° 19/97, art. 10 (1)), régi par la co-titularité (art. 10 (3)), sans limite de durée lorsqu'il est acquis par occupation (art. 17 (2) a), sans que l'absence de titre ou d'enregistrement lui porte atteinte (art. 13 (2) et 14 (2)) ; les titres communautaires sont nominatifs, au nom adopté par la communauté (art. 13 (4)), et la preuve peut se faire par témoignage de membres de la communauté (art. 15 b).", source: "https://www.dlapiperafrica.com/export/sites/africa/mozambique/insights/legislation-series/land/downloads/Lei_19_1997.pdf_2063069299.pdf"}
  ressources: {valeur: "partiel", note: "Dans les zones rurales, les communautés locales participent à la gestion des ressources naturelles (loi n° 19/97, art. 24 (1) a) ; l'usage de la terre leur est gratuit (art. 29 c). La loi ne leur confère pas de pouvoir de décision sur les licences d'exploitation des ressources.", source: "https://www.dlapiperafrica.com/export/sites/africa/mozambique/insights/legislation-series/land/downloads/Lei_19_1997.pdf_2063069299.pdf"}
  consentement: {valeur: "partiel", note: "La délivrance d'un titre de DUAT comprend l'avis des autorités administratives locales « precedido de consulta às respectivas comunidades », pour confirmer que la zone est libre et sans occupants (loi n° 19/97, art. 13 (3)) ; les communautés participent à ce processus et à l'identification des limites de leurs terres (art. 24 (1) c et d). La loi prévoit une consultation, pas un consentement.", source: "https://www.dlapiperafrica.com/export/sites/africa/mozambique/insights/legislation-series/land/downloads/Lei_19_1997.pdf_2063069299.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
