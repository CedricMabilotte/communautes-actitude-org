effectivite: {valeur: "partielle", note: "Le projet d'administration foncière Terra Segura (MozLand), financé par la Banque mondiale, comptait au 8 décembre 2023 530 communautés locales dont les terres étaient délimitées et le certificat de délimitation enregistré dans le système d'information foncière (SiGIT), pour un objectif de 764 à la clôture du 29 mars 2024 ; le même rapport mentionne la mise en ligne des données de délimitation sur le géoportail MADICO. Une étude publiée par la FAO en 2002 relève que la question de la représentation des communautés dans les consultations restait non tranchée et que la connaissance de la loi chez les responsables chargés de son application au niveau local était limitée.", source: "https://documents.worldbank.org/curated/en/099020824144020273/pdf/P16455114850d60b218fae170dfef520a4f.pdf"}
chronologie:
  - {annee: 1997, evenement: "Loi sur les terres n° 19/97, approuvée par l'Assemblée de la République le 31 juillet, promulguée le 1er octobre et publiée le 7 octobre ; elle abroge les lois n° 6/79 et n° 1/86."}
  - {annee: 2000, evenement: "Entrée en vigueur, le 17 mars, de l'annexe technique au règlement de la loi sur les terres, qui fixe la méthode participative de délimitation des terres communautaires."}
  - {annee: 2004, evenement: "Constitution : art. 109 à 111 sur la propriété de l'État et la protection des droits acquis par occupation."}
  - {annee: 2018, evenement: "Approbation, le 4 décembre, du projet Terra Segura (MozLand) de la Banque mondiale, avec une composante de délimitation communautaire (DELCOM)."}
  - {annee: 2023, evenement: "530 communautés délimitées et enregistrées dans le SiGIT au titre du projet Terra Segura (8 décembre)."}
  - {annee: 2025, evenement: "Le Conseil des ministres approuve le 28 octobre une proposition de nouvelle loi sur les terres, qui abroge la loi n° 19/97, et la transmet à l'Assemblée de la République."}
  - {annee: 2026, evenement: "Consultation publique sur la proposition de révision (9 chapitres, 128 articles), organisée par les commissions de l'Assemblée de la République, notamment à Nampula début avril."}
fiabilite:
  verifie: ["Art. 1 (1) et (7), 3, 10, 12, 13, 14, 15, 17, 24, 29 et 30 de la loi n° 19/97 (Boletim da República, I série, n° 40, 7 octobre 1997, texte numérisé).", "Art. 109 à 111 de la Constitution (texte de 2007, Constitute Project).", "Nombre de communautés délimitées dans le cadre du projet Terra Segura (530 au 8 décembre 2023, objectif de 764), rapport de suivi de la Banque mondiale du 8 février 2024.", "Approbation en Conseil des ministres, le 28 octobre 2025, de la proposition de nouvelle loi sur les terres et abrogation prévue de la loi n° 19/97 (MZNews, 29 octobre 2025) ; consultation publique de la proposition par les commissions de l'Assemblée de la République en avril 2026 (AIM, 3 avril 2026).", "Date d'entrée en vigueur de l'annexe technique (17 mars 2000) et question de la représentation des communautés (Tanner, FAO, 2002)."]
  non_confirme: ["Nombre total de communautés délimitées à l'échelle nationale : aucun chiffre officiel consolidé n'a pu être consulté ; le géoportail MADICO (madico.dndt.gov.mz) n'a pas répondu. Le chiffre de 530 ne couvre que le projet Terra Segura.", "Aucun tableau des sites : la liste des communautés délimitées est publiée sur le géoportail MADICO, non consulté.", "Adoption de la nouvelle loi sur les terres : la proposition était en consultation publique devant les commissions de l'Assemblée de la République en avril 2026 (AIM, 3 avril 2026) ; aucune adoption n'a été trouvée depuis. Si elle est promulguée, la fiche devra être revue.", "Texte du règlement de la loi sur les terres (décret n° 66/98) et de l'annexe technique (diplôme ministériel n° 29-A/2000) non consulté directement ; leurs dispositions sur la consultation et la représentation des communautés ne sont pas reprises dans la grille.", "Numérotation des art. 109 à 111 après la révision constitutionnelle de 2018 non vérifiée sur le texte révisé.", "Aucun document de l'ONU ni d'un mécanisme régional visant nommément ce régime n'a été trouvé.", "Population concernée : non trouvée ; le site de l'Institut national de statistique (ine.gov.mz) n'a pas répondu.", "Surface des terres communautaires : non trouvée.", "Nombre de villages : non trouvé."]
