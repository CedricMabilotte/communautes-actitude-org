resume: >-
  Les Kalinago vivent sur un territoire de 3 782 acres (environ 15 km²) de la côte atlantique de la Dominique, délimité en 1903 par l'administration coloniale. La loi n° 22 de 1978 (Carib Reserve Act, chapitre 25:90) crée un conseil élu, composé d'un chef et de six membres, qui détient les terres au nom des habitants, les attribue et peut lever une taxe foncière. Les terres ne peuvent être vendues, échangées ni hypothéquées sans approbation gouvernementale, et les non-résidents ne peuvent pas en acquérir. Un amendement du 12 mars 2015 remplace l'appellation « Carib Reserve » par « Kalinago Territory ».
