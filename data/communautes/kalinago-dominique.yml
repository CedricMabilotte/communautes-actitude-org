  - {instrument: "Amendement du 12 mars 2015 renommant la loi Kalinago Territory Act", nature: "loi", annee: 2015, source: "https://documents1.worldbank.org/curated/en/728761557895947404/pdf/Dominica-Housing-Recovery-Project-Indigenous-Peoples-Plan.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Conseil de sept membres élus (le chef et six conseillers), personne morale et organe de gouvernement local du territoire (art. 3 et 14 de la loi de 1978), pour un mandat d'environ cinq ans (art. 52) ; si, « in the judgment of the Minister », le Conseil manque de façon persistante à ses obligations ou abuse de ses pouvoirs, le ministre peut le dissoudre par arrêté et confier ses pouvoirs et ses biens à des personnes qu'il nomme jusqu'à l'élection d'un nouveau Conseil (art. 91) ; cette tutelle fait coder ce droit « partiel ».", source: "https://faolex.fao.org/docs/pdf/dmi86947.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le Conseil adopte des règlements (by-laws) applicables dans le territoire, notamment sur l'occupation et l'usage des terres (art. 29) ; ils n'entrent en vigueur qu'après approbation du Cabinet et le ministre peut les faire révoquer.", source: "https://faolex.fao.org/docs/pdf/dmi86947.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les terres sont concédées au Conseil « pour et au nom des habitants » (art. 43), qui en a la garde et les attribue aux résidents (art. 47) ; vente, échange ou hypothèque soumis à approbation gouvernementale (art. 45) ; les non-résidents ne peuvent pas en acquérir (art. 46). Le gouvernement garde la responsabilité de l'aménagement (art. 48).", source: "https://faolex.fao.org/docs/pdf/dmi86947.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le Conseil fixe deux fois par an une taxe sur les terres et les maisons plafonnée à 1 % (art. 104) et perçoit redevances et amendes versées au fonds du territoire (art. 29 et 94) ; l'extension de la taxe hors du territoire exige l'accord du ministre (art. 104) et les redevances fixées par règlement suivent l'approbation du Cabinet (art. 29).", source: "https://faolex.fao.org/docs/pdf/dmi86947.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Droit de résidence dans le territoire pour toute personne qui y est née, dont au moins un parent est kalinago, ou qui y réside légalement depuis douze ans (art. 51) ; les non-résidents ne peuvent pas acquérir de terres dans le territoire (art. 46) et le Conseil peut leur interdire d'y travailler ou d'y cultiver des terres (art. 49).", source: "https://faolex.fao.org/docs/pdf/dmi86947.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Minority Rights Group décrit un chef et un conseil de six membres élus pour cinq ans par les résidents de plus de 18 ans, des permis de construire délivrés par le Conseil, et des empiètements d'agriculteurs là où les limites fixées en 1903 ne sont toujours pas tracées sur le terrain ; en 2021, le plan pour les peuples autochtones de la Banque mondiale décrit le Conseil comme seul responsable de l'attribution des terres.", source: "https://minorityrights.org/communities/caribs/"}
chronologie:
  - {annee: 1903, evenement: "L'administration coloniale britannique délimite la Carib Reserve (avis officiel du 4 juillet 1903)."}
  - {annee: 1978, evenement: "Loi n° 22 de 1978 (Carib Reserve Act) : création du Conseil élu et concession des terres au Conseil (entrée en vigueur le 30 mars)."}
  - {annee: 1989, evenement: "Arrêté de dissolution du Conseil pris en vertu de l'article 14(5) de la loi (S.R.O. 26/1989)."}
  - {annee: 1994, evenement: "Nouvel arrêté de dissolution du Conseil (S.R.O. 37/1994) ; le président et le secrétaire sortants exercent les pouvoirs du Conseil jusqu'à l'élection suivante."}
  - {annee: 2002, evenement: "Ratification de la Convention n° 169 de l'OIT par la Dominique."}
  - {annee: 2007, evenement: "La Dominique vote pour la Déclaration des Nations unies sur les droits des peuples autochtones."}
  - {annee: 2015, evenement: "Amendement du 12 mars : la loi devient Kalinago Territory Act."}
fiabilite:
