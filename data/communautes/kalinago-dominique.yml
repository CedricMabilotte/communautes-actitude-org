  non_confirme: ["Texte de l'amendement du 12 mars 2015 : non consulté directement, date reprise du document de la Banque mondiale.", "Article 45 partiellement illisible dans la copie numérisée : l'autorité qui approuve les cessions de terres n'a pas pu être lue avec certitude.", "Minority Rights Group avance environ 4 000 Kalinago dans le pays (page pays) et environ 3 400 habitants du territoire (page communauté), chiffres non datés qui diffèrent du recensement de 2011.", "Le plan de la Banque mondiale donne 2 112 habitants, mais sa ventilation par sexe (1 209 hommes, 948 femmes) totalise 2 157.", "Motif des dissolutions de 1989 et 1994 (renouvellement électoral ou sanction) non établi."]
