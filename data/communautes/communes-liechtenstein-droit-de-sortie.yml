resume: >-
  Fiche agrégée : elle couvre les 11 communes politiques (Gemeinden) du Liechtenstein, dont la Constitution de 1921 fixe la liste (art. 1). Depuis la révision constitutionnelle de 2003 (LGBl. 2003 n° 186), l'article 4 al. 2 donne à chaque commune le droit de sortir de l'union de l'État (Staatsverband) : la majorité des citoyens liechtensteinois ayant le droit de vote et résidant dans la commune décide d'ouvrir la procédure, puis la sortie est réglée par une loi ou par un traité international ; dans le cas d'un traité, un second scrutin a lieu dans la commune après la négociation. Aucune commune n'a ouvert cette procédure selon les sources consultées. Les communes s'administrent elles-mêmes sous la surveillance de l'État selon la loi sur les communes de 1996 (Gemeindegesetz) : assemblée et conseil élus, règlements, centimes additionnels à l'impôt, droit de cité communal.
