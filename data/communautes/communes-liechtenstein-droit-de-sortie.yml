base_nationale:
  - {instrument: "Constitution de la principauté de Liechtenstein du 5 octobre 1921 (LGBl. 1921 n° 15), art. 1, 4, 48, 64, 66, 66bis et 110, dans sa version révisée par LGBl. 2003 n° 186", nature: "constitution", annee: 2003, source: "https://www.gesetze.li/konso/pdf/1921.015"}
  - {instrument: "Loi sur les communes (Gemeindegesetz, GemG) du 20 mars 1996, LGBl. 1996 n° 76", nature: "loi", annee: 1996, source: "https://www.gesetze.li/konso/pdf/1996.076"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Libre élection du chef de commune (Ortsvorsteher) et des organes communaux (Constitution, art. 110 al. 2 a) ; les communes règlent et administrent leurs affaires de façon autonome sous la surveillance de l'État (loi sur les communes de 1996, art. 4) ; l'assemblée communale (Gemeindeversammlung) est l'organe suprême (art. 25).", source: "https://www.gesetze.li/konso/pdf/1996.076"}
  pouvoir_normatif: {valeur: "partiel", note: "Les communes adoptent un règlement communal (Gemeindeordnung) et des règlements (Reglemente), et peuvent édicter des prescriptions de police locale punies d'amendes jusqu'à 10 000 francs, dans les limites de la loi (loi sur les communes de 1996, art. 9 et 10).", source: "https://www.gesetze.li/konso/pdf/1996.076"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Administration autonome du patrimoine communal sous surveillance du gouvernement (Constitution, art. 110 al. 2 b) ; aménagement local (Ortsplanung) dans le domaine propre de la commune (loi sur les communes de 1996, art. 12 al. 2 d et i).", source: "https://www.gesetze.li/konso/pdf/1996.076"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Toute modification des limites entre communes, toute création ou fusion de communes exige en plus de la loi une décision majoritaire des citoyens ayant le droit de vote qui y résident (Constitution, art. 4 al. 1, révision de 2003 ; loi sur les communes de 1996, art. 6).", source: "https://www.gesetze.li/konso/pdf/1921.015"}
  langue: {valeur: "non_applicable", note: "L'allemand est la langue de l'État et la langue officielle sur tout le territoire (Constitution, art. 6) ; aucune langue propre aux communes.", source: "https://www.gesetze.li/konso/pdf/1921.015"}
  education: {valeur: "partiel", note: "Création et entretien des jardins d'enfants et des écoles primaires dans le domaine propre de la commune (loi sur les communes de 1996, art. 12 al. 2 g).", source: "https://www.gesetze.li/konso/pdf/1996.076"}
  fiscalite: {valeur: "partiel", note: "Perception de contributions et fixation de centimes additionnels à l'impôt (Steuerzuschläge) dans le domaine propre de la commune (loi sur les communes de 1996, art. 12 al. 2 e) ; le budget et le taux communal sont arrêtés par le conseil communal ou par l'assemblée selon le règlement communal (art. 40 al. 2 f et al. 3).", source: "https://www.gesetze.li/konso/pdf/1996.076"}
  representation: {valeur: "partiel", note: "Pas de sièges réservés ; trois communes, par décisions de leurs assemblées, peuvent faire convoquer le Landtag (parlement), présenter une initiative législative ou demander un référendum sur une loi ; quatre peuvent demander un référendum sur la dissolution du Landtag, présenter une initiative constitutionnelle ou demander un référendum sur une révision constitutionnelle ou sur un traité (Constitution, art. 48 al. 2 et 3, 64 al. 2 et 4, 66 al. 1 et 2, 66bis).", source: "https://www.gesetze.li/konso/pdf/1921.015"}
  statut_personnel: {valeur: "reconnu", note: "Droit de cité communal (Gemeindebürgerrecht), qui donne un droit d'origine (Heimatrecht) dans la commune ; la commune l'accorde dans son domaine propre (Constitution, art. 110 al. 2 d ; loi sur les communes de 1996, art. 12 al. 2 c et titre III).", source: "https://www.gesetze.li/konso/pdf/1996.076"}
  autodetermination_externe: {valeur: "partiel", note: "« Den einzelnen Gemeinden steht das Recht zu, aus dem Staatsverband auszutreten » (Constitution, art. 4 al. 2, révision de 2003) : la commune décide seule d'ouvrir la procédure ; la sortie exige ensuite une loi ou un traité, soumis à référendum et à la sanction du prince, si bien que la commune ne peut pas l'imposer (commentaire en ligne de la Constitution, art. 4, n° 71).", source: "https://verfassung.li/Art._4"}
effectivite: {valeur: "non_etablie", note: "Aucune source consultée ne mentionne l'ouverture d'une procédure de sortie depuis 2003 ; le commentaire de la Constitution (état 2015) traite la sortie comme une hypothèse et relève que l'État ne peut pas être contraint d'y consentir.", source: "https://verfassung.li/Art._4"}
chronologie:
  - {annee: 1808, evenement: "Réorganisation du territoire en onze communes politiques."}
  - {annee: 1921, evenement: "Constitution du 5 octobre 1921 : l'article 110 garantit l'élection des organes communaux et l'administration autonome du patrimoine communal."}
  - {annee: 1996, evenement: "Loi sur les communes du 20 mars 1996 ; séparation des communes politiques et des coopératives bourgeoises (Bürgergenossenschaften)."}
  - {annee: 2002, evenement: "Initiative constitutionnelle de la maison princière du 2 août 2002, qui donne à l'article 4 al. 2 sa rédaction actuelle, remaniée par rapport aux propositions de 2000 et 2001."}
  - {annee: 2003, evenement: "Révision constitutionnelle (LGBl. 2003 n° 186) : l'article 4 al. 2 inscrit le droit de sortie de chaque commune."}
