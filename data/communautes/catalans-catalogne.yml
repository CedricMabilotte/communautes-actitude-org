base_nationale:
  - {instrument: "Statut d'autonomie de la Catalogne (loi organique 6/2006 du 19 juillet)", nature: "statut_autonomie", annee: 2006, source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  - {instrument: "Arrêt du Tribunal constitutionnel 114/2017 du 17 octobre 2017 (nullité de la loi catalane 19/2017)", nature: "jurisprudence", annee: 2017, source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2017-12206"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement de 100 à 150 députés élus au suffrage universel direct, qui représente le peuple de Catalogne, Statut, art. 55 et 56 ; la Generalitat est le système institutionnel de l'autogouvernement, art. 2.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement exerce le pouvoir législatif, Statut, art. 55 ; la Generalitat a la compétence exclusive sur le droit civil, sauf les matières réservées à l'État par l'article 149.1.8 de la Constitution, art. 129.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  justice_propre: {valeur: "partiel", note: "Le Tribunal supérieur de justice de Catalogne, juridiction de l'État, est l'organe où culmine l'organisation judiciaire en Catalogne et unifie seul l'interprétation du droit catalan, Statut, art. 95.1 et 95.3 ; l'arrêt 31/2010 a annulé la participation du Conseil de justice de Catalogne à la nomination de son président et des présidents de chambre (art. 95.5 et 95.6).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  terres: {valeur: "partiel", note: "Compétence partagée sur la régulation et le régime d'intervention administrative et d'usage des montes (terres boisées et pastorales), des exploitations et services forestiers et des voies de transhumance de Catalogne, Statut, art. 116.2 b ; il s'agit d'une compétence de la Generalitat, pas d'une propriété collective du sol.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur les eaux des bassins hydrographiques situés entièrement en Catalogne, Statut, art. 117 ; compétence partagée sur l'environnement et les ressources naturelles, art. 144.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  consentement: {valeur: "reconnu", note: "Toute réforme du Statut exige le vote des deux tiers du Parlement, l'approbation des Cortes Generales (Parlement de l'État) par loi organique et un référendum positif des électeurs de Catalogne, Statut, art. 222 et 223.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  langue: {valeur: "reconnu", note: "Le catalan est la langue propre et officielle de la Catalogne avec le castillan ; l'occitan (aranais) est officiel, Statut, art. 6 ; le Tribunal constitutionnel a annulé le terme « préférente » à l'article 6.1 (arrêt 31/2010).", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  education: {valeur: "reconnu", note: "Compétence exclusive sur l'enseignement non universitaire dans les domaines énumérés, Statut, art. 131.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  fiscalite: {valeur: "partiel", note: "Finances autonomes, impôts propres et part des impôts de l'État cédés, Statut, art. 202 ; l'Agence fiscale de Catalogne gère les impôts propres et, par délégation, les impôts cédés, art. 204.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  representation: {valeur: "reconnu", note: "Le Parlement désigne les sénateurs qui représentent la Generalitat au Sénat, à la proportionnelle des groupes, Statut, art. 61 a ; la Constitution réserve à chaque communauté autonome un sénateur et un de plus par million d'habitants, désignés par son assemblée législative, art. 69.5.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  statut_personnel: {valeur: "partiel", note: "La condition politique de Catalan est attribuée aux citoyens espagnols ayant leur domicile administratif en Catalogne et, sur demande, aux résidents à l'étranger dont c'était le dernier domicile, Statut, art. 7.", source: "https://www.boe.es/buscar/act.php?id=BOE-A-2006-13087"}
  autodetermination_externe: {valeur: "conteste", note: "La loi du Parlement de Catalogne 19/2017 « du référendum d'autodétermination » a été déclarée inconstitutionnelle et nulle en totalité par le Tribunal constitutionnel (arrêt 114/2017 du 17 octobre 2017).", source: "https://www.boe.es/buscar/doc.php?id=BOE-A-2017-12206"}
effectivite: {valeur: "partielle", note: "Le Comité d'experts de la Charte européenne des langues régionales ou minoritaires (Conseil de l'Europe) relève le 24 septembre 2024 que le cadre légal ou son interprétation ne garantit pas que les procédures pénales, civiles ou administratives puissent se tenir dans les langues régionales, même sur demande, et que l'usage de ces langues dans l'administration de l'État reste limité. Le Tribunal constitutionnel a annulé le terme « préférente » à l'art. 6.1 du Statut et fixé l'interprétation des art. 122 et 129 (arrêt 31/2010), puis annulé la loi référendaire de 2017 (arrêt 114/2017).", source: "https://www.coe.int/en/web/european-charter-regional-or-minority-languages/-/spain-s-system-to-protect-regional-and-minority-languages-is-well-developed-but-gaps-persist-in-justice-healthcare-and-public-administration-1"}
chronologie:
  - {annee: 1979, evenement: "Premier Statut d'autonomie de la Catalogne (loi organique 4/1979 du 18 décembre)."}
  - {annee: 2006, evenement: "Nouveau Statut d'autonomie (loi organique 6/2006)."}
  - {annee: 2010, evenement: "Arrêt 31/2010 du Tribunal constitutionnel sur le Statut (28 juin)."}
  - {annee: 2017, evenement: "Loi catalane 19/2017 sur le référendum d'autodétermination (6 septembre), annulée par l'arrêt 114/2017 (17 octobre)."}
  - {annee: 2024, evenement: "Loi organique 1/2024 du 10 juin, d'amnistie « pour la normalisation institutionnelle, politique et sociale en Catalogne »."}
  - {annee: 2024, evenement: "Rapport du Comité d'experts de la Charte européenne des langues régionales ou minoritaires sur l'Espagne (24 septembre)."}
  - {annee: 2025, evenement: "Arrêt 137/2025 du Tribunal constitutionnel (26 juin) : la loi d'amnistie est jugée conforme à la Constitution, à l'exception de l'art. 1.1 (portée limitée) et de l'art. 1.3, second alinéa (annulé)."}
  - {annee: 2026, evenement: "Le Conseil de politique fiscale et financière approuve le 4 septembre une proposition de réforme du financement des communautés autonomes, avec les votes de la Catalogne et des Canaries ; le projet de loi organique doit encore être voté par le Congrès des députés à la majorité absolue."}
