base_nationale:
  - {instrument: "First Nations Voice Act 2023 (Australie-Méridionale), version du 1er janvier 2024", nature: "loi", annee: 2023, source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/first%20nations%20voice%20act%202023/current/2023.9.auth.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Six Voix locales, personnes morales élues par les membres des Premières Nations inscrits sur les listes électorales de l'État et indépendantes du gouvernement (s. 9 à 11, annexe 1) ; la Voix d'État réunit leurs coprésidents (s. 12 et 24). Ces organes ont une fonction consultative et ne gouvernent aucun territoire ni aucune population.", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/first%20nations%20voice%20act%202023/current/2023.9.auth.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les greffiers du Parlement doivent notifier à la Voix d'État le dépôt de chaque projet de loi, sans que l'omission affecte la validité du texte (s. 39) ; le Cabinet et la Voix d'État se réunissent au moins deux fois par an, de même que les directeurs des administrations (s. 43 et 45). Aucun consentement n'est requis.", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/first%20nations%20voice%20act%202023/current/2023.9.auth.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Un coprésident de la Voix d'État peut s'adresser à l'une ou l'autre chambre sur tout projet de loi, avec un préavis de sept jours (s. 40), et s'adresse chaque année aux deux chambres réunies (s. 38) ; les rapports de la Voix appellent une réponse ministérielle dans les six mois (s. 41). La Voix ne dispose d'aucun siège ni d'aucun vote au Parlement.", source: "https://www.legislation.sa.gov.au/__legislation/lz/c/a/first%20nations%20voice%20act%202023/current/2023.9.auth.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon la chaîne publique ABC, aux premières élections du 16 mars 2024, 2 583 bulletins valides ont été comptés pour environ 30 000 électeurs admis, soit une participation inférieure à 10 % ; un élu de la région Yorke et Mid-North l'a été avec six voix. Les 46 sièges ont été pourvus et la Voix d'État s'est adressée aux deux chambres réunies le 27 novembre 2024 et le 13 novembre 2025. En 2026, un projet de loi d'abrogation est soutenu par le chef de l'opposition.", source: "https://www.abc.net.au/news/2024-03-29/sa-voice-to-parliament-voter-turnout/103649148"}
chronologie:
  - {annee: 2023, evenement: "Adoption du First Nations Voice Act le 26 mars ; entrée en vigueur le 12 mai."}
  - {annee: 2024, evenement: "Premières élections le 16 mars ; premier discours devant les deux chambres réunies le 27 novembre."}
  - {annee: 2025, evenement: "Élections complémentaires dans les régions 1 (Central) et 4 (Murraylands, Riverland et Sud-Est) ; second discours annuel le 13 novembre."}
  - {annee: 2026, evenement: "Élections le 21 mars, le même jour que les élections de l'État ; dépôt d'un projet de loi d'abrogation (First Nations Voice Repeal Bill 2026) ; révision indépendante des élections annoncée le 28 avril et confiée à l'ancien commissaire électoral fédéral Tom Rogers."}
