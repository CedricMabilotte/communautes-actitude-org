resume: >-
  Organe représentatif élu par les Aborigènes et insulaires du détroit de Torres d'Australie-Méridionale, créé par le First Nations Voice Act 2023 (loi sur la Voix des Premières Nations), loi de l'État sanctionnée le 26 mars 2023. Six Voix locales, 46 membres au total, sont élues par région ; chacune élit deux coprésidents de genre différent, qui forment ensemble la Voix d'État (12 membres). Les greffiers du Parlement doivent notifier chaque projet de loi à la Voix d'État, dont un coprésident peut s'adresser à chaque chambre et, une fois par an, aux deux chambres réunies. La Voix est consultative : elle ne dispose d'aucun pouvoir de décision ni de veto.
