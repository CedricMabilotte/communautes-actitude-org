resume: >-
  Fiche agrégée : elle couvre les communautés des districts des Îles Cook qui gèrent une aire sous ra'ui, restriction coutumière d'usage des ressources des terres, du récif et du lagon. Sur Rarotonga, le ra'ui est déclaré par le Koutu Nui (assemblée des chefs coutumiers) depuis 1998 sans texte législatif. La loi sur les ressources marines de 2005 (Marine Resources Act) permet aux autorités locales d'adopter un plan de pêche ou des règlements locaux (by-laws), approuvés par le ministre et le Conseil des ministres (art. 8). À Atiu, le règlement sur l'environnement de 2008 place le ra'ui sous le contrôle des chefs coutumiers et institue des gardiens communautaires (tiaki ra'ui) dotés de pouvoirs de contrôle. En 2022, 23 sites étaient actifs et 40 districts sur 41 étaient couverts.
