droits:
  autogouvernement: {valeur: "partiel", note: "À Atiu, un ra'ui peut être déclaré et placé sous le contrôle des Ui Ariki (chefs suprêmes), Mataiapo Tutara et Mataiapo (chefs de lignage), qui nomment et révoquent les tiaki ra'ui (Environment (Atiu and Takutea) Regulations 2008, règl. 18 et 21). Le conseil insulaire, autorité locale, peut prendre des mesures pour les pêcheries d'intérêt local (Marine Resources Act 2005, art. 8 (1)).", source: "https://www.spc.int/digitallibrary/get/s5b7j"}
  pouvoir_normatif: {valeur: "partiel", note: "L'autorité locale prépare un plan de pêche avec le ministère ou, à défaut, des règlements locaux (by-laws) soumis au ministre et au Conseil des ministres, puis promulgués en Conseil exécutif ; le ministre ou le Conseil des ministres ne peut les rejeter que s'ils sont contraires à la loi et doit les rejeter s'ils sont contraires à un plan de pêche (Marine Resources Act 2005, art. 8 (1) et (2)). À Atiu, les chefs coutumiers fixent les restrictions du ra'ui « conformément à la coutume traditionnelle » (règl. 18, 2008). La Communauté du Pacifique recense au moins cinq règlements locaux (Penrhyn, Manihiki, Aitutaki et Manuae, Atiu et Takutea, Mitiaro) (Govan et Lalavanua, 2022).", source: "https://www.spc.int/digitallibrary/get/s5b7j"}
  justice_propre: {valeur: "partiel", note: "À Atiu, le tiaki ra'ui (gardien) peut relever l'identité d'un contrevenant, saisir les prises et le matériel, appliquer sur place une sanction (utunga) de 100 dollars ou transmettre le dossier au Service national de l'environnement pour poursuites (règl. 22, 2008). Le conseil insulaire peut instituer un mode alternatif de règlement des différends (arbitrage, médiation) qui aboutit à une indemnisation ou une remise en état, sans amende ni emprisonnement ; en cas de refus d'y participer, l'affaire va devant un juge de paix ou la Haute Cour (règl. 51).", source: "https://www.spc.int/digitallibrary/get/s5b7j"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les conseils insulaires gèrent les pêcheries d'intérêt local dans leur ressort (Marine Resources Act 2005, art. 8) ; les eaux intérieures et la mer territoriale restent dévolues à la Couronne (Maritime Zones Act 2018, art. 9, d'après le guide de la Communauté du Pacifique). Les droits des communautés sur les eaux adjacentes sont reconnus de fait, pas en droit (Communauté du Pacifique, 2022).", source: "https://www.spc.int/digitallibrary/get/s5b7j"}
  consentement: {valeur: "partiel", note: "À Atiu, les chefs coutumiers déclarent le ra'ui en consultation avec le conseil insulaire, l'autorité insulaire de l'environnement et les propriétaires fonciers concernés (règl. 18, 2008). Le secrétaire du ministère consulte l'autorité locale sur toute mesure de pêche qui la touche (Marine Resources Act 2005, art. 8 (5)). Le texte prévoit une consultation, pas un consentement.", source: "https://www.spc.int/digitallibrary/get/s5b7j"}
