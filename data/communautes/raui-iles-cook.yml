effectivite: {valeur: "partielle", note: "Le sixième rapport national à la Convention sur la diversité biologique indique que le ra'ui n'est pas juridiquement contraignant et que des pêcheurs et des membres des communautés prélèvent dans ces aires. L'enquête de la Communauté du Pacifique (Govan et Lalavanua, 2022) compte 23 sites actifs et 9 inactifs, sans inventaire public, et déclare zéro agent communautaire habilité et zéro agent du ministère à plein temps sur la gestion communautaire des pêches.", source: "https://chm.cbd.int/api/v2013/documents/252891"}
chronologie:
  - {annee: 1998, evenement: "Le 8 février, le Koutu Nui rétablit le ra'ui à Rarotonga sur quatre aires : Aroko, Tikioki, Pouara et Nikao."}
  - {annee: 2000, evenement: "Ra'ui d'Aitutaki (Ootu, Motu Kitiu, lagon de Maina) selon le rapport à la CDB ; ajout d'Aroa à Rarotonga en mai selon le ministère des Ressources marines (2006 selon le rapport à la CDB)."}
  - {annee: 2005, evenement: "Loi sur les ressources marines : plans de pêche et règlements locaux des autorités locales (art. 8)."}
  - {annee: 2008, evenement: "Règlement sur l'environnement d'Atiu et Takutea : ra'ui sous contrôle des chefs coutumiers, tiaki ra'ui, règlement alternatif des différends."}
  - {annee: 2018, evenement: "Cinquième rapport national à la CDB, approuvé par le Conseil des ministres : tableau des ra'ui par île."}
  - {annee: 2022, evenement: "Enquête de la Communauté du Pacifique : 23 sites actifs, 9 inactifs, 452 km², 40 districts couverts sur 41."}
fiabilite:
  verifie: ["Art. 8 (1) à (5) du Marine Resources Act 2005 et règl. 3, 18, 21, 22 et 51 du règlement d'Atiu et Takutea de 2008 : extraits reproduits dans le guide juridique de la Communauté du Pacifique (2023).", "Chiffres 2022 (23 sites actifs, 9 inactifs, 45 206,3 ha, 40 districts couverts sur 41, au moins cinq règlements locaux) : rapport d'enquête de la Communauté du Pacifique (Govan et Lalavanua, 2022) et portail de la Communauté du Pacifique.", "Rétablissement du ra'ui par le Koutu Nui le 8 février 1998 et choix de rester hors législation : page du ministère des Ressources marines.", "Liste des ra'ui par île et surface : tableau 9 du cinquième rapport national à la CDB.", "Mention du caractère non contraignant du ra'ui : sixième rapport national à la CDB (enregistrement du centre d'échange)."]
  non_confirme: ["Le texte officiel de la loi de 2005 et du règlement de 2008 n'a pas pu être ouvert directement (PacLII inaccessible) ; les articles sont cités d'après le guide de la Communauté du Pacifique.", "Le portail de la Communauté du Pacifique cite un règlement « Environment (Atiu and Takutea, Mitiaro) Regulations 2008 » ; le guide juridique ne cite que celui d'Atiu et Takutea. Un règlement propre à Mitiaro n'a pas été lu.", "Le tableau des sites reprend les ra'ui du cinquième rapport à la CDB (31 entrées, dont des ra'ui terrestres et d'eau douce) ; il ne correspond pas à la liste des 23 sites actifs de 2022, qui n'est pas publiée. Surfaces laissées vides quand la source donne deux valeurs ou un point d'interrogation (Te Miromiro, Aroko, lagon de Maina, Te Roto Iti, Motu Porea).", "Fondement légal du Koutu Nui (House of Ariki Act) non vérifié sur texte.", "Écart sur l'année des ra'ui d'Aroa (mai 2000 selon le ministère, 2006 selon le rapport à la CDB) et de Pouara (1998 selon le ministère, 2006 selon le rapport à la CDB) ; le tableau suit le rapport à la CDB. Le ra'ui de Nikao, cité par le ministère parmi les quatre de 1998, n'apparaît pas dans le tableau 9 du rapport à la CDB.", "Effectivité : le sixième rapport à la CDB est un rapport du gouvernement ; aucune étude de terrain indépendante sur le respect des ra'ui n'a été lue.", "Population des districts couverts : aucun total publié pour le périmètre du régime."]
