resume: >-
  Fiche agrégée : elle couvre les communautés autochtones de l'État de San Luis Potosí, dont la Constitution de l'État (art. 9) reconnaît les peuples nahua, téenek (huastèque) et xi'iuy (pame), ainsi que les communautés non autochtones de même organisation (communautés « équiparables »). La loi de justice autochtone et communautaire du 29 septembre 2014 reconnaît leurs systèmes normatifs (règles coutumières) et confie la justice à l'assemblée générale de chaque communauté et à un juge auxiliaire autochtone qu'elle élit, nommé ensuite par le pouvoir judiciaire de l'État. Ce juge concilie, arbitre et juge des affaires civiles et familiales entre membres de la communauté, ainsi que des affaires pénales hors délits passibles de détention provisoire d'office, quand les parties acceptent la voie communautaire ; la voie judiciaire ordinaire reste ouverte. Le registre de l'État compte 391 communautés inscrites en 2015, dans 24 municipalités.
