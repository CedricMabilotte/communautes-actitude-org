  - {mecanisme: "dnudpa", detail: "Le Mexique vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295) ; l'exposé des motifs de la loi de 2014 la cite.", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
