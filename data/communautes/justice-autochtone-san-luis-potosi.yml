droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution de l'État (art. 9, fr. V à VII et XI) reconnaît la libre détermination exercée dans l'autonomie, fait des communautés des sujets de droit public dotés de la personnalité juridique et reconnaît leur assemblée générale ; la loi réglementaire de 2003 (art. 16 à 18) fait de l'assemblée l'autorité suprême et donne aux actes des autorités communautaires la valeur d'actes de puissance publique.", source: "http://congresosanluis.gob.mx/sites/default/files/unpload/legislacion/leyes/2021/10/Ley_Reglamentaria_del_Articulo_9_de_la_Constitucion_03_Dic_2020.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi réglementaire de 2003 (art. 14, 15 et 21) reconnaît les systèmes normatifs internes (règles de conduite, définition des fautes et des sanctions) dans les relations familiales, la vie civile et l'organisation communautaire, sous réserve des constitutions et des droits humains.", source: "http://congresosanluis.gob.mx/sites/default/files/unpload/legislacion/leyes/2021/10/Ley_Reglamentaria_del_Articulo_9_de_la_Constitucion_03_Dic_2020.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi de justice autochtone fait de l'assemblée générale l'autorité suprême de justice en matière civile et familiale (art. 12) et confie la justice à des juges auxiliaires autochtones élus selon les systèmes normatifs et nommés par le Tribunal suprême de justice de l'État (art. 11 et 14), compétents en matière civile, familiale et pénale, hors état civil, litiges fonciers (art. 21) et délits passibles de détention provisoire d'office (art. 25) ; un accord non contesté a valeur de chose jugée (art. 19), mais cette justice reste facultative, la voie ordinaire restant ouverte (art. 10 et 18) et un juge de l'État valide ou révise ses décisions sur recours pour violation des droits humains (art. 13).", source: "https://www.stjslp.gob.mx/Archivos/jindigena/Legislaci%C3%B3n%20y%20normatividad/Leyes%20estatales/Ley_de_Justicia_Indigena_y_Comunitaria%2011_Octubre_2017.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution de l'État (art. 9, fr. X) et la loi réglementaire de 2003 (art. 43 et 45) accordent un droit préférentiel d'usage des ressources naturelles des terres habitées, dans le cadre de la législation fédérale et des formes de propriété prévues par la Constitution fédérale.", source: "http://congresosanluis.gob.mx/sites/default/files/unpload/legislacion/leyes/2021/10/Ley_Reglamentaria_del_Articulo_9_de_la_Constitucion_03_Dic_2020.pdf"}
  consentement: {valeur: "partiel", note: "La loi de consultation de 2010 (art. 2, fr. IV) vise à obtenir l'accord ou le consentement préalable des communautés sur les mesures qui les concernent et qualifie de violation de la loi toute mesure appliquée sans consultation (art. 30) ; elle ne fixe pas de droit de veto.", source: "https://www.stjslp.gob.mx/Archivos/jindigena/Legislaci%c3%b3n%20y%20normatividad/Leyes%20estatales/Ley_de_Consulta_Indigena_para_el_Estado_y_Municipios_29_Jun_2023.pdf"}
  langue: {valeur: "partiel", note: "La Constitution de l'État (art. 9, dernier alinéa) impose la publication des lois dans les langues autochtones de l'État ; la loi de justice autochtone exige que le juge auxiliaire parle la langue de la communauté (art. 14) et garantit un interprète dans toute procédure (art. 5).", source: "https://www.stjslp.gob.mx/Archivos/jindigena/Legislaci%c3%b3n%20y%20normatividad/Constituci%C3%B3n/Constitucion_Politica_del_Estado_SLP.pdf"}
  education: {valeur: "partiel", note: "La Constitution de l'État (art. 9, fr. XVI b) prévoit un enseignement dans la langue autochtone en plus de l'espagnol ; la loi réglementaire de 2003 (art. 34 fr. VI et art. 35) fait participer les communautés aux programmes éducatifs et fait élire les associations de parents selon leurs usages.", source: "http://congresosanluis.gob.mx/sites/default/files/unpload/legislacion/leyes/2021/10/Ley_Reglamentaria_del_Articulo_9_de_la_Constitucion_03_Dic_2020.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution de l'État (art. 9, fr. XII) prévoit des crédits municipaux administrés directement par les communautés ; la loi réglementaire de 2003 (art. 56 à 59) organise ces crédits sur projet adopté en assemblée et (art. 49) compte les travaux collectifs (faenas) comme paiement en nature des contributions municipales.", source: "http://congresosanluis.gob.mx/sites/default/files/unpload/legislacion/leyes/2021/10/Ley_Reglamentaria_del_Articulo_9_de_la_Constitucion_03_Dic_2020.pdf"}
  representation: {valeur: "non_etabli", note: "La Constitution de l'État (art. 9, fr. XI, réforme du 23 janvier 2020) et la loi réglementaire de 2003 (art. 19) permettent aux communautés d'élire, selon leurs systèmes normatifs, un représentant auprès du conseil municipal ; cette représentation reste municipale, et aucun siège réservé au Congrès de l'État ni au Congrès fédéral n'est prévu par ces textes.", source: "https://www.stjslp.gob.mx/Archivos/jindigena/Legislaci%c3%b3n%20y%20normatividad/Constituci%C3%B3n/Constitucion_Politica_del_Estado_SLP.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon León García Lam (Revista de El Colegio de San Luis, 2022), un juge auxiliaire est présent dans la plupart des 391 communautés inscrites, mais reste exceptionnel dans les communautés triqui, mixtèque (Mixteca Baja) et mazahua, formées de familles venues d'autres États ; de 2018 à 2021, la municipalité de San Luis Potosí n'a pas reconnu le registre officiel des communautés mixtèque et mazahua, et le Sénat lui a demandé le 30 octobre 2019 d'exécuter une décision d'amparo (protection constitutionnelle) ; l'auteur ajoute que le registre ne contient probablement pas toutes les communautés de l'État.", source: "https://colsan.repositorioinstitucional.mx/jspui/bitstream/1013/1802/1/Sobre%20el%20sentido%20de%20comunidad%20ind%c3%adgena%20Notas%20para%20el%20estado%20de%20San%20Luis%20Potos%c3%ad%20%28M%c3%a9xico%29.pdf"}
chronologie:
  - {annee: 2003, evenement: "Réforme de l'article 9 de la Constitution de l'État (11 juillet) et loi réglementaire sur les droits et la culture autochtones (13 septembre)."}
  - {annee: 2006, evenement: "Première loi d'administration de la justice autochtone et communautaire (1er juin) et règlement du registre des communautés autochtones (16 août)."}
  - {annee: 2010, evenement: "Publication du padrón (liste officielle) des communautés autochtones : 389 communautés dans 23 municipalités (3 avril) ; loi de consultation autochtone (8 juillet)."}
  - {annee: 2013, evenement: "Consultation des communautés sur la réforme de la justice autochtone, ouverte le 26 octobre : 42 rencontres communautaires et 4 forums régionaux, 13 880 participants selon l'exposé des motifs de la loi de 2014."}
  - {annee: 2014, evenement: "Loi de justice autochtone et communautaire (29 septembre), qui abroge la loi de 2006."}
  - {annee: 2015, evenement: "Mise à jour du registre des communautés autochtones (3 octobre) : 391 communautés et 974 quartiers, annexes ou hameaux dans 24 municipalités."}
  - {annee: 2017, evenement: "Réforme du 11 octobre : amendes des juges auxiliaires exprimées en unités de mesure et d'actualisation (UMA)."}
  - {annee: 2020, evenement: "Réforme de l'article 9, fraction XI, de la Constitution de l'État (23 janvier) : parité femmes-hommes dans la désignation des autorités communautaires."}
  - {annee: 2024, evenement: "Le pouvoir judiciaire de l'État publie un manuel de formation à distance des juges auxiliaires, préparé par sa Commission de justice pour les peuples originaires."}
fiabilite:
  verifie: ["Texte de la loi de justice autochtone et communautaire (version du 11 octobre 2017), y compris l'exposé des motifs, sur le site du Tribunal supérieur de justice.", "Texte de l'article 9 de la Constitution de l'État (version du 16 mai 2024).", "Articles 1 à 72 de la loi réglementaire de l'article 9 (version du 3 décembre 2020).", "Articles 2 et 30 de la loi de consultation autochtone (version du 29 juin 2023).", "Totaux de la mise à jour du registre de 2015 (391 communautés, 974 quartiers ou annexes, 24 municipalités) et liste nominative des 391 communautés.", "Paragraphe 34 du rapport A/HRC/39/17/Add.2."]
  non_confirme: ["Nombre de juges auxiliaires en fonction : aucune statistique publique ouverte.", "Inscriptions au registre postérieures à 2015 : le site de l'Institut indique une mise à jour de page en 2026 mais ne publie pas de liste plus récente.", "Date de la dernière réforme de la loi réglementaire de 2003 : l'en-tête du texte consolidé indique le 3 mars 2020, la note des articles transitoires le 3 décembre 2020.", "Écart entre les 24 municipalités annoncées par le registre et les 22 noms de municipalités distincts lus dans le tableau (une ligne porte « Tamasopo-Rayón »).", "Application de la loi de 2014 aux communautés non autochtones dites équiparables : aucune donnée trouvée.", "Population des 391 communautés inscrites : le registre de 2015 donne la population de chaque communauté et annexe, sans total officiel. Le recensement INEGI 2020 compte 231 213 personnes de 3 ans et plus parlant une langue autochtone dans tout l'État, villes comprises ; ce chiffre ne correspond pas aux seules communautés inscrites et n'est pas retenu.", "Superficie des communautés inscrites : non trouvée."]
