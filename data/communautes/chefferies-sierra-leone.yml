  non_confirme: ["Liste officielle des 190 chefferies avec district et surface : non trouvée, d'où l'absence de tableau des sites.", "Population, surface et nombre de villages des chefferies : aucune source publique ouverte.", "Texte de la loi sur les conseils de chefferie (chap. 61) et de la loi sur les collectivités locales (pouvoirs budgétaires et fiscaux des administrations de chefferie) : non consultés ; la loi de 2009 mentionne une trésorerie de chefferie (s. 13 (1)) et la supervision de l'impôt local par le chef suprême (s. 29 (1) (a)).", "Cas limite au regard de l'exclusion des autonomies purement administratives : la chefferie est retenue parce que la Constitution la garantit comme institution de droit coutumier et que son chef est élu selon la coutume de chaque chefferie ; la loi ne lui attache aucune désignation ethnique."]
