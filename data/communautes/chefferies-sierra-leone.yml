  representation: {valeur: "reconnu", note: "Le Parlement comprend un député par district, élu parmi les personnes qui sont chefs suprêmes (Constitution, s. 74 (1) (a)).", source: "https://www.constituteproject.org/constitution/Sierra_Leone_2013.pdf?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
