reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination à l'égard des femmes sur le sixième rapport de la Sierra Leone (CEDAW/C/SLE/CO/6), § 10 (a), 24 et 25 (b) : le Comité vise la section 8 (1) (b) de la loi de 2009 sur la chefferie, qui permet d'écarter des femmes de la candidature aux élections de chefs selon la tradition, et demande que la révision constitutionnelle conduise à l'abrogation de cette disposition.", annee: 2014, source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/SLE/CO/6&l=en&t=pdf"}
base_nationale:
  - {instrument: "Constitution de la Sierra Leone de 1991 (rétablie en 1996, révisée en 2013), s. 72, 74 (1) (a) et 170", nature: "constitution", annee: 1991, source: "https://www.constituteproject.org/constitution/Sierra_Leone_2013.pdf?lang=en"}
  - {instrument: "Chieftaincy Act 2009 (loi n° 10 de 2009), adoptée le 18 juin 2009, signée le 10 septembre 2009, Gazette n° 42 du 17 septembre 2009", nature: "loi", annee: 2009, source: "https://faolex.fao.org/docs/pdf/sie92995.pdf"}
  - {instrument: "Local Courts Act 2011 (loi n° 10 de 2011), adoptée le 22 juillet 2011, Gazette n° 68 du 27 octobre 2011, s. 1, 2, 5, 15 et 17", nature: "loi", annee: 2011, source: "http://www.sierra-leone.org/Laws/2011-10.pdf"}
  - {instrument: "Customary Land Rights Act 2022 (loi n° 20 de 2022), s. 9, 14, 22 et 23", nature: "loi", annee: 2022, source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  - {instrument: "Droit coutumier, défini comme « les règles de droit qui, par la coutume, s'appliquent à des communautés particulières » et inclus dans la common law de la Sierra Leone (Constitution, s. 170 (2) et (3))", nature: "coutume_reconnue", annee: 1991, source: "https://www.constituteproject.org/constitution/Sierra_Leone_2013.pdf?lang=en"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution garantit l'institution de la chefferie établie par le droit et l'usage coutumiers et interdit son abolition hors d'une loi adoptée selon la procédure de révision constitutionnelle (s. 72 (1) et (2)). Les conseillers de chefferie élisent le chef suprême dans les douze mois de la vacance, selon la loi de 2009 et le droit coutumier de la chefferie (s. 2), à raison d'un conseiller pour vingt contribuables inscrits sur la liste publiée au Journal officiel (Gazette List, s. 4 (2)) ; les chefs de section et de ville sont élus selon les coutumes du lieu (s. 23 et 24). L'élection n'est reconnue qu'après acceptation par le gouvernement du rapport du secrétaire provincial et de la Commission électorale (s. 17), et le président peut destituer un chef suprême pour faute grave après une enquête publique (Constitution, s. 72 (4) ; loi de 2009, s. 19 et 21).", source: "https://faolex.fao.org/docs/pdf/sie92995.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le droit coutumier, « règles de droit qui, par la coutume, s'appliquent à des communautés particulières », fait partie de la common law (Constitution, s. 170 (2) et (3)) ; la loi de 2011 le définit comme toute règle ayant force de loi dans une chefferie des provinces, conforme à la justice naturelle et compatible avec la loi écrite (s. 1). Le chef suprême veille à l'adoption de règlements locaux (bye-laws) par le conseil de chefferie en vertu de la section 16 de la loi sur les conseils de chefferie, chap. 61 (loi de 2009, s. 29 (2)).", source: "https://faolex.fao.org/docs/pdf/sie92995.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi de 2011 établit un tribunal local dans chaque chefferie (s. 2 (1)) ; ses membres sont nommés par le président de la Cour suprême (Chief Justice) après consultation de la Commission du service judiciaire (s. 2 (2)), et le président du tribunal doit parler la langue dominante de la chefferie, y résider depuis cinq ans et connaître ses coutumes (s. 5). Le tribunal juge toutes les affaires civiles régies par le droit coutumier, y compris les litiges sur le titre foncier entre chefs suprêmes ou conseils de chefferie, et les infractions coutumières (s. 15 (2) et (3) (a)) ; sa procédure suit le droit coutumier (s. 17).", source: "http://www.sierra-leone.org/Laws/2011-10.pdf"}
  terres: {valeur: "partiel", note: "Le conseil de chefferie exerce, par l'intermédiaire des comités fonciers de chefferie, de ville ou de village, une responsabilité de supervision sur les terres de la chefferie (loi de 2022 sur les droits fonciers coutumiers, s. 9) ; le titre sur les terres communales d'une chefferie est dévolu à la communauté entière et géré par le comité foncier de chefferie pour son compte (s. 14 (1)), et la chefferie adopte les règles d'usage de ces terres (s. 14 (2)).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
  ressources: {valeur: "partiel", note: "Les conseils de chefferie et les communautés adoptent et font appliquer les règles coutumières de protection des aires écologiquement sensibles, qui peuvent être cogérées par les communautés, le comité du conseil de chefferie et l'administration (loi de 2022, s. 22 (2) et (3)) ; l'État peut restreindre l'usage communautaire des forêts, pâturages, rivières et marais « en collaboration avec le conseil de chefferie » en cas de risque d'épuisement (s. 23 (2)).", source: "https://faolex.fao.org/docs/pdf/sie212374.pdf"}
