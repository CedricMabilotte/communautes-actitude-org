effectivite: {valeur: "partielle", note: "La notice Globalex de l'université de New York (2023) indique que les tribunaux locaux appliquent le droit coutumier dans les communautés des provinces et que 41 chefferies ont été créées en 2017 par division de chefferies fusionnées. Le Comité pour l'élimination de la discrimination à l'égard des femmes (CEDAW/C/SLE/CO/6, 2014, § 24) note que la loi de 2009 permet d'écarter des femmes des élections de chefs selon la tradition. La base de données Parline de l'Union interparlementaire indique que le Parlement issu des élections de juin 2023 compte quatorze chefs suprêmes élus au suffrage indirect pour les quatorze districts des provinces.", source: "https://www.nyulawglobal.org/globalex/sierra_leone1.html"}
chronologie:
  - {annee: 1991, evenement: "La Constitution garantit l'institution de la chefferie (s. 72) et réserve un siège de député par district aux chefs suprêmes (s. 74)."}
  - {annee: 2009, evenement: "Adoption, le 18 juin, de la loi sur la chefferie (n° 10 de 2009), publiée le 17 septembre."}
  - {annee: 2011, evenement: "Adoption, le 22 juillet, de la loi sur les tribunaux locaux (n° 10 de 2011), qui établit un tribunal par chefferie."}
  - {annee: 2014, evenement: "Le Comité pour l'élimination de la discrimination à l'égard des femmes demande que la révision constitutionnelle conduise à l'abrogation de la section 8 (1) (b) de la loi sur la chefferie."}
  - {annee: 2017, evenement: "Création de 41 chefferies par division de chefferies fusionnées : le pays passe de 149 à 190 chefferies."}
  - {annee: 2022, evenement: "La loi sur les droits fonciers coutumiers confie aux conseils de chefferie la supervision des terres par l'intermédiaire des comités fonciers (s. 9)."}
