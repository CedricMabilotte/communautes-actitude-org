resume: >-
  Fiche agrégée : elle couvre les 190 chefferies (circonscriptions coutumières) des provinces de Sierra Leone, chacune dirigée par un chef suprême (Paramount Chief) élu par le conseil de chefferie selon la loi et le droit coutumier de la chefferie. La Constitution de 1991 garantit l'institution de la chefferie « telle qu'établie par le droit et l'usage coutumiers » (s. 72) et réserve à chaque district un siège de député élu parmi les chefs suprêmes (s. 74 (1) (a)). La loi de 2009 sur la chefferie (Chieftaincy Act) règle l'élection, la reconnaissance, les fonctions et la destitution des chefs ; la loi de 2011 sur les tribunaux locaux (Local Courts Act) établit dans chaque chefferie un tribunal qui applique le droit coutumier. Les terres communales des chefferies relèvent de la fiche « Terres communautaires coutumières de Sierra Leone ».
