resume: >-
  Le Jatun Ayllu Yura (« grand ayllu », ayllu désignant une communauté andine fondée sur la parenté et le territoire) se présente dans son statut comme un peuple ancestral de la parcialidad Wisijsa (une des moitiés territoriales) de la nation Qhara Qhara, établi dans la province Antonio Quijarro (Potosí). Il accède à l'autonomie originaire (autonomía indígena originaria campesina, AIOC, collectivité territoriale autochtone prévue par la Constitution de 2009) sur la base de son territoire titré en 2012, et non d'une commune. Le statut est déclaré conforme à la Constitution en 2019 et approuvé le 20 novembre 2020 selon les normes et procédures propres ; la loi 1442 du 30 juin 2022 crée l'unité territoriale. Le gouvernement repose sur le cabildo (Jatun Tantakuy, assemblée générale des habitants), le Conseil grand des autorités, quatre kurakas et quatre mama thallas (un homme et une femme par ayllu) et un jilaqata (Jilacata), représentant légal.
