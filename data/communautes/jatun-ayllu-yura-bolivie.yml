  - {instrument: "Loi 1442 du 30 juin 2022 portant création de l'unité territoriale « Territoire indígena originario campesino de Jatun Ayllu Yura »", nature: "loi", annee: 2022, source: "https://www.lexivox.org/norms/BO-L-N1442.html"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution (art. 289) définit l'AIOC comme autogouvernement ; le statut (art. 24 à 51) crée le cabildo, le Conseil grand des autorités, les conseils par ayllu, le Conseil des kurakas et mama thallas (mandat de deux ans) et le jilaqata, désignés par rotation (muyu) selon les normes propres.", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le statut (art. 28 et 30.1 et 30.6) attribue au Conseil grand des autorités une faculté législative sur les compétences exclusives de l'art. 304 de la Constitution ; les kurakas promulguent les lois et les réglementent (art. 44.11 et 44.12).", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Constitution (art. 190) reconnaît la juridiction indígena originaria campesina ; le statut (art. 52 à 57) l'organise sur quatre niveaux (communauté, ayllu, Conseil grand des autorités, cabildo), avec des décisions obligatoires (Constitution, art. 192).", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  terres: {valeur: "reconnu", note: "Le territoire est consolidé sur le titre exécutoire TIOC-NAL 000021 du 17 avril 2012 (loi 1442 de 2022, art. 2) ; la Constitution (art. 394.III) déclare la propriété collective indivisible, imprescriptible, insaisissable et inaliénable ; le statut (art. 20) combine tenure familiale et terres communales de pâturage.", source: "https://www.lexivox.org/norms/BO-L-N1442.html"}
  ressources: {valeur: "partiel", note: "Le statut (art. 21 et 87.3) confie au gouvernement autonome la gestion des ressources renouvelables selon les normes propres ; les ressources non renouvelables restent soumises à la consultation de l'art. 30 de la Constitution (art. 21.III).", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15) impose une consultation préalable obligatoire sans exiger le consentement ; le statut (art. 14) soumet l'exploitation des ressources non renouvelables à une consultation libre, préalable et informée, menée avec l'État central.", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5) fait du quechua une langue officielle de l'État ; le statut (art. 5) fait du quechua et du castillan les langues officielles de l'autonomie.", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  education: {valeur: "partiel", note: "Le statut (art. 66, 69 et 89.2) fait de l'éducation une compétence concurrente exercée dans le cadre de la loi Avelino Siñani-Elizardo Pérez, avec un curriculum local diversifié.", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  fiscalite: {valeur: "partiel", note: "Le statut (art. 87.12 à 87.14) permet de créer des taxes et contributions, d'administrer les impôts de sa compétence et d'adopter son budget ; les ressources suivent l'art. 106 de la loi-cadre des autonomies (art. 91).", source: "https://www.sea.gob.bo/wp-content/uploads/2023/04/Estatuto_de_Jatun_Ayllu_Yura_.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le premier gouvernement, élu du 26 au 29 octobre 2021 selon les normes propres, exerce pour 2022-2023 et signe en février 2023 une convention avec l'Institut national de statistique ; en juillet 2023, le quotidien El Potosí rapporte que la structure administrative fonctionne depuis un an ; les autorités du second mandat (2024-2025) reçoivent leurs lettres de créance en janvier 2024 (Organe électoral plurinational). Le transfert des fonds et biens de la commune de Tomave n'est pas documenté.", source: "https://elpotosi.net/local/20230715_el-jatun-ayllu-yura-avanza-en-la-consolidacion-de-su-estructura-territorial-y-administrativa.html"}
chronologie:
  - {annee: 2012, evenement: "Cabildo décidant de la voie autonomique ; titre exécutoire TIOC-NAL 000021 du territoire (17 avril)."}
  - {annee: 2016, evenement: "Consultation d'accès à l'autonomie originaire, approuvée à l'unanimité selon les normes propres (26 novembre)."}
  - {annee: 2017, evenement: "Désignation des 42 membres de la commission de rédaction du statut (30 mai)."}
  - {annee: 2018, evenement: "La commission de rédaction approuve le projet de statut, 100 articles et deux dispositions transitoires (28 novembre)."}
  - {annee: 2019, evenement: "Déclaration constitutionnelle plurinationale 0081/2019 de conformité du statut (27 novembre)."}
  - {annee: 2020, evenement: "Approbation du statut par la population des 42 communautés selon les normes propres (20 novembre)."}
  - {annee: 2021, evenement: "Élection du premier gouvernement autonome (26 au 29 octobre), pour 2022-2023."}
  - {annee: 2022, evenement: "Loi 1442 portant création de l'unité territoriale du TIOC de Jatun Ayllu Yura (30 juin)."}
  - {annee: 2024, evenement: "Remise des lettres de créance aux autorités du second mandat, 2024-2025 (janvier)."}
fiabilite:
  verifie: ["Articles 1, 5, 14, 19 à 21, 24 à 57, 66, 69, 86 à 91 et dispositions transitoires du statut de Jatun Ayllu Yura.", "Articles 1 à 8 de la loi 1442 du 30 juin 2022 (objet, consolidation sur le titre TIOC-NAL 000021, limites, liste de 41 communautés et du bourg de Yura).", "Étapes 2016-2024 supervisées par l'Organe électoral plurinational, dont la déclaration constitutionnelle 0081/2019 du 27 novembre 2019 et l'approbation du statut le 20 novembre 2020.", "Article 289 de la Constitution de 2009."]
