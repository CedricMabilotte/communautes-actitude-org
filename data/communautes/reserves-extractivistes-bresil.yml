effectivite: {valeur: "partielle", note: "En juillet 2026, le Cadastre national des unités de conservation (registre du ministère de l'Environnement) indique un conseil gestionnaire pour 80 des 98 réserves et un plan de gestion pour 52 d'entre elles. Dans la réserve d'État de Jaci-Paraná (Rondônia), l'agriculture et l'élevage occupent 74 % de la surface en 2022 contre 21 % en 2012, selon les données MapBiomas analysées par InfoAmazonia (2024) ; en 2016, le tribunal de justice de Rondônia a jugé inconstitutionnel un décret législatif de 2014 qui visait à supprimer la réserve.", source: "https://infoamazonia.org/2024/01/16/agropecuaria-ilegal-triplica-em-10-anos-na-resex-jaci-parana-em-rondonia/"}
chronologie:
  - {annee: 1989, evenement: "La loi 7.804 ajoute les réserves extractivistes aux espaces protégés de la politique nationale de l'environnement (loi 6.938, art. 9, VI)."}
  - {annee: 1990, evenement: "Le décret 98.863 du 23 janvier crée la réserve extractiviste de l'Alto Juruá (Acre), 506 186 ha."}
  - {annee: 1990, evenement: "Le décret 98.897 du 30 janvier définit les réserves extractivistes et la concession gratuite de droit réel d'usage."}
  - {annee: 1990, evenement: "Création des réserves Chico Mendes (Acre), Rio Cajari (Amapá) et Rio Ouro Preto (Rondônia), en mars."}
  - {annee: 2000, evenement: "La loi 9.985 intègre la réserve extractiviste au Système national des unités de conservation (art. 18)."}
  - {annee: 2002, evenement: "Le décret 4.340 fixe les règles des conseils et du contrat de concession de droit réel d'usage."}
  - {annee: 2006, evenement: "La loi 11.284 (art. 6) prévoit la destination des forêts publiques occupées par des communautés locales, notamment par la création de réserves extractivistes."}
  - {annee: 2018, evenement: "Création de la Commission des réserves extractivistes fédérales (Conarex) par la portaria conjointe (arrêté commun) ICMBio-MMA 96."}
  - {annee: 2023, evenement: "La portaria conjointe GM/MMA/ICMBio 525 du 21 juin 2023 institue la Commission nationale des réserves extractivistes fédérales (Conarex)."}
