resume: >-
  La réserve extractiviste (RESEX) est une catégorie d'aire protégée d'usage durable destinée aux populations extractivistes traditionnelles, qui vivent de la cueillette, de la pêche, d'une agriculture de subsistance et du petit élevage. La loi 7.804 de 1989 inscrit les réserves extractivistes parmi les espaces protégés que l'État peut créer (loi 6.938 de 1981, art. 9, VI) ; le décret 98.897 du 30 janvier 1990 les définit et la loi 9.985 de 2000 sur le Système national des unités de conservation (SNUC) les reprend. La terre reste du domaine public ; son usage est concédé gratuitement aux populations résidentes par un contrat de concession de droit réel d'usage (droit d'usage inscrit sur le bien). Chaque réserve est gérée par un conseil délibératif où siègent ces populations. Le Cadastre national des unités de conservation recense 98 réserves en juillet 2026.
