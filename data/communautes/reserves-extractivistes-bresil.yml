droits:
  autogouvernement: {valeur: "partiel", note: "La loi 9.985 de 2000 (art. 18, § 2) confie la gestion de chaque réserve à un conseil délibératif présidé par l'organe gestionnaire public et composé de représentants d'organes publics, de la société civile et des populations traditionnelles résidentes ; le décret 4.340 de 2002 confie la présidence au chef de l'unité, qui désigne les autres conseillers sur indication des secteurs représentés (art. 17), et attribue au conseil le suivi du plan de gestion et l'évaluation du budget de l'unité (art. 20).", source: "https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Le plan de gestion de la réserve est approuvé par le conseil délibératif (loi 9.985, art. 18, § 5), par résolution prise après approbation préalable de l'organe gestionnaire public (décret 4.340 de 2002, art. 12, II) ; toute activité contraire au plan est interdite dans l'unité (loi 9.985, art. 28).", source: "https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La réserve est du domaine public, avec un usage concédé aux populations extractivistes traditionnelles (loi 9.985, art. 18, § 1) ; possession et usage sont régis par un contrat (art. 23) ; le décret 98.897 de 1990 (art. 4) prévoit une concession gratuite, résiliée en cas de dommage à l'environnement ou de cession entre vifs.", source: "https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"}
  ressources: {valeur: "partiel", note: "La réserve a pour objet l'usage durable de ses ressources naturelles par les populations résidentes (loi 9.985, art. 18) ; l'exploitation minière et la chasse y sont interdites et l'exploitation commerciale du bois n'est admise qu'à titre complémentaire (art. 18, § 6 et § 7) ; la loi 11.284 de 2006 (art. 6) prévoit la destination gratuite de forêts publiques occupées par des communautés locales par la création de réserves extractivistes.", source: "https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11284.htm"}
  consentement: {valeur: "partiel", note: "La création d'une unité de conservation est précédée d'une consultation publique (loi 9.985, art. 22, § 2) ; la loi garantit la participation effective des populations locales à la création et à la gestion des unités (art. 5, III) et une large participation de la population résidente au plan de gestion des réserves extractivistes (art. 27, § 2) ; aucun consentement n'est requis.", source: "https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"}
