droits:
  autogouvernement: {valeur: "reconnu", note: "Sur le fondement de l'art. 2 de la Constitution fédérale, des art. 8 et 9 de la Constitution du Guerrero et de l'art. 26 III de la loi 701 (élection des autorités selon les normes propres), l'Institut électoral du Guerrero organise l'élection du Conseil municipal communautaire (18 conseillers, 6 par zone ñuu savi, me'phaa et métisse, et 3 coordinateurs) par une assemblée de représentants, selon les lignes directrices de 2024. Le 25 janvier 2026, cette assemblée fixe à 12 le nombre de conseillers pour les élections suivantes, 3 par peuple, dont le peuple afromexicain ; la décision SCM-JDC-177/2026 du 23 juin 2026 confirme la validation de ce résultat.", source: "https://www.iepcgro.mx/principal/uploads/normativa_interna/lineamientos_eleccion_ayutla_2024.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A I et II, réforme de 2024) reconnaît l'application de systèmes normatifs propres, dans le respect de la Constitution et des droits humains ; la chambre supérieure du Tribunal électoral (SUP-REC-22355/2024) annule la validation de l'élection de 2024, tenue en deux assemblées séparées, parce que les règles du système normatif fixées dans les lignes directrices n'avaient pas été appliquées.", source: "https://www.iepcgro.mx/principal/uploads/snp/sentencias/SUP_REC_22355_2024.pdf"}
  justice_propre: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A II) reconnaît le droit d'appliquer les systèmes normatifs propres à la solution des conflits internes, dans le respect de ses principes et des droits humains ; la loi fixe les cas de validation par les juges. La loi 701 du Guerrero (art. 26 II) reprend ce droit.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A IX) accorde l'usage préférentiel des ressources naturelles des lieux habités, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  consentement: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A XIII, 2024) impose une consultation visant le consentement ou l'accord ; le changement de mode d'élection d'Ayutla a été précédé de la consultation d'octobre 2015, ordonnée par la décision SDF-JDC-545/2015, puis de celle de juin 2017 sur le modèle d'élection.", source: "https://www.iepcgro.mx/principal/uploads/publicaciones/memoria_ayutla_2021.pdf"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (art. 4, 2003) fait des langues autochtones reconnues par la loi, dont relèvent le tu'un savi et le me'phaa, des langues nationales ayant la même validité que l'espagnol.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution fédérale (art. 2 A VI, réforme de 2024) prévoit la participation des peuples à la construction des modèles éducatifs.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"}
  fiscalite: {valeur: "partiel", note: "Le Conseil municipal communautaire gère le budget de la commune, avec une coordination chargée du trésor (lignes directrices de 2024) ; la Constitution fédérale (art. 2 B II, 2024) prévoit des dotations budgétaires administrées directement par les peuples et communautés.", source: "https://www.iepcgro.mx/principal/uploads/normativa_interna/lineamientos_eleccion_ayutla_2024.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Conseil municipal communautaire est élu en 2018, 2021 et 2024 ; l'élection de 2024, scindée en deux assemblées le 28 juillet, est tranchée par la chambre supérieure du Tribunal électoral le 16 octobre 2024, puis une nouvelle assemblée de représentants élit le Conseil 2024-2027 le 27 octobre 2024 (Quadratín Guerrero, 28 octobre 2024). Le 16 août 2025, au moins 13 membres de la police communautaire de l'UPOEG sont tués sur la route El Cortijo-Apantla, dans la commune ; des familles quittent les localités de Tepetate, Maguey et Las Arboledas (Infobae, 20 août 2025). La consultation de 2025 sur l'intégration du peuple afromexicain se tient dans les localités du 17 novembre au 7 décembre 2025 (SCM-JDC-177/2026).", source: "https://www.iepcgro.mx/principal/uploads/snp/sentencias/SUP_REC_22355_2024.pdf"}
chronologie:
  - {annee: 2011, evenement: "Loi 701 du Guerrero sur les droits des peuples et communautés autochtones ; reconnaissance légale de la police communautaire."}
  - {annee: 2014, evenement: "Demande d'élection selon les systèmes normatifs propres déposée auprès de l'Institut électoral du Guerrero (26 juin)."}
  - {annee: 2015, evenement: "Décision SDF-JDC-545/2015 (25 juin) ; expertise anthropologique de l'Université autonome du Guerrero (août) ; première consultation favorable (19 octobre)."}
  - {annee: 2017, evenement: "Deuxième consultation (10 et 11 juin) : choix de l'élection par une assemblée de représentants."}
  - {annee: 2018, evenement: "Première élection du Conseil municipal communautaire par une assemblée de 280 représentants (15 juillet)."}
  - {annee: 2021, evenement: "Deuxième élection du Conseil en assemblée (30 mai) : 279 représentants et 142 autorités locales présents."}
  - {annee: 2021, evenement: "Décret 861 : 37 localités ñuu savi sont séparées d'Ayutla pour former la commune de Ñuu Savi (361,94 km², 34,34 % du territoire communal)."}
  - {annee: 2024, evenement: "Assemblée scindée (28 juillet) ; décision SUP-REC-22355/2024 (16 octobre) ; élection du Conseil 2024-2027 (27 octobre)."}
  - {annee: 2025, evenement: "Au moins 13 membres de la police communautaire de l'UPOEG tués sur la route El Cortijo-Apantla (16 août)."}
  - {annee: 2025, evenement: "Consultation dans les localités sur les règles du système normatif et la place du peuple afromexicain au Conseil (17 novembre au 7 décembre)."}
  - {annee: 2026, evenement: "L'assemblée des représentants et autorités attribue au peuple afromexicain 3 des 12 sièges de conseillers (25 janvier) ; l'Institut électoral du Guerrero valide les résultats (accord 010/SO/26-02-2026, 26 février) ; le tribunal électoral du Guerrero confirme (15 mai), puis la chambre régionale de Mexico (SCM-JDC-177/2026, 23 juin)."}
