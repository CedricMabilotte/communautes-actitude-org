resume: >-
  Ayutla de los Libres est une commune de la Costa Chica du Guerrero, habitée par des Ñuu Savi (Mixtèques), des Me'phaa (Tlapanèques) et des métis. En 2014, des communautés demandent l'élection des autorités municipales selon leurs systèmes normatifs (règles propres, dits « us et coutumes ») ; le Tribunal électoral fédéral ordonne en 2015 de vérifier ces systèmes et de consulter la population. Depuis le 15 juillet 2018, la commune est gouvernée sans partis politiques par un Conseil municipal communautaire (Concejo Municipal Comunitario) élu par une assemblée de représentants des communautés et quartiers (140 localités en 2017). Le Conseil a été renouvelé en 2021 et en 2024. En 2021, 37 communautés ñuu savi sont séparées d'Ayutla pour former la commune de Ñuu Savi. Le 25 janvier 2026, après une consultation menée en décembre 2025, l'assemblée municipale des représentants et autorités intègre le peuple afromexicain au Conseil, avec trois conseillers sur douze ; la chambre régionale de Mexico du Tribunal électoral confirme ce résultat le 23 juin 2026.
