resume: >-
  Les Inuit du Nunavik vivent dans le nord du Québec. La Convention de la Baie-James et du Nord québécois de 1975, approuvée par une loi fédérale (S.C. 1976-77, ch. 32), a conduit à créer l'Administration régionale Kativik, institution publique régionale, et un régime de terres réservées aux Inuit. La société Makivvik (« Makivik » dans les lois) représente les Inuit bénéficiaires. Un accord de 2006 sur les revendications territoriales vise la région marine du Nunavik. Un projet de gouvernement régional a été rejeté par référendum en avril 2011 ; de nouvelles négociations ont été ouvertes avec le Canada en 2019 et avec le Québec en décembre 2023.
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada a voté contre la Déclaration en 2007, puis a modifié sa position et exprimé son soutien. La loi fédérale de 2021 (L.C. 2021, ch. 14, art. 4) confirme qu'elle « trouve application en droit canadien » ; les peuples autochtones y sont définis par renvoi à l'art. 35(2) de la Loi constitutionnelle de 1982, qui nomme les Inuit.", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission au Canada (A/HRC/27/52/Add.2), § 41 : négociation par Makivik d'un gouvernement public régional pour le Nunavik, accord rejeté par les électeurs en avril 2011.", annee: 2014, source: "https://www.ohchr.org/sites/default/files/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
base_nationale:
  - {instrument: "Loi sur le règlement des revendications des autochtones de la Baie James et du Nord québécois (S.C. 1976-77, ch. 32), qui approuve la Convention de 1975", nature: "loi", annee: 1977, source: "https://laws-lois.justice.gc.ca/fra/lois/J-0.3/page-1.html"}
  - {instrument: "Loi sur les villages nordiques et l'Administration régionale Kativik (RLRQ, c. V-6.1)", nature: "loi", annee: 1978, source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/V-6.1"}
  - {instrument: "Loi sur le régime des terres dans les territoires de la Baie-James et du Nouveau-Québec (RLRQ, c. R-13.1)", nature: "loi", annee: 1978, source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  - {instrument: "Loi concernant l'accord sur les revendications territoriales des Inuits du Nunavik (L.C. 2008, ch. 2)", nature: "accord_revendication", annee: 2008, source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.5/page-1.html"}
  - {instrument: "Loi sur l'instruction publique pour les autochtones cris, inuit et naskapis (RLRQ, c. I-14), partie XI : Commission scolaire Kativik", nature: "loi", annee: 1978, source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/I-14"}
  - {instrument: "Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones (L.C. 2021, ch. 14)", nature: "loi", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/page-1.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'Administration régionale Kativik est une personne morale de droit public formée des habitants du territoire et des villages nordiques, loi V-6.1, art. 239 (1978) ; institution publique ouverte à tous les résidents, non propre aux Inuit.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/V-6.1"}
  pouvoir_normatif: {valeur: "partiel", note: "Les ordres de l'Administration régionale obligent toutes les personnes soumises à sa compétence sur le territoire, loi V-6.1, art. 243 ; compétence de type municipal et régional.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/V-6.1"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Des corporations foncières inuit, dont les bénéficiaires inuit de chaque communauté sont membres de plein droit, détiennent à titre de propriétaire les terres de la catégorie I et ne peuvent les céder ou les vendre qu'au gouvernement, loi R-13.1, art. 5 à 7 (1978).", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  ressources: {valeur: "partiel", note: "L'accord de 2006 sur la région marine, qui a valeur de traité au sens de l'article 35 de la Loi constitutionnelle de 1982, crée un conseil de gestion des ressources fauniques, une commission d'aménagement et une commission d'examen des répercussions pour la région marine du Nunavik, L.C. 2008, ch. 2, art. 3 et 7.", source: "https://laws-lois.justice.gc.ca/fra/lois/N-28.5/page-1.html"}
  consentement: {valeur: "partiel", note: "La Commission de la qualité de l'environnement Kativik compte neuf membres, dont quatre nommés par l'Administration régionale Kativik (au moins deux Inuit ou un Inuk et un Naskapi) et cinq par le gouvernement, Loi sur la qualité de l'environnement, art. 181 et 182 (1978) ; elle décide si le ministre doit autoriser un projet (art. 200), mais le gouvernement peut, pour cause, autoriser un projet refusé (art. 203) ; pas de droit de refus propre aux Inuit.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/Q-2"}
  langue: {valeur: "partiel", note: "Dans les écoles de la commission scolaire Kativik, l'inuktitut est langue d'enseignement avec les autres langues en usage, Charte de la langue française, art. 87 et 88 ; ce n'est pas une langue officielle du Québec.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/C-11"}
  education: {valeur: "reconnu", note: "La Commission scolaire Kativik, dont le conseil est formé d'un commissaire par village nordique, a compétence sur le préscolaire, le primaire, le secondaire et l'éducation des adultes (loi I-14, art. 605 et 608) ; ses ordonnances fondées sur la culture inuit et l'inuttitut ne peuvent être désavouées par le ministre (art. 664 et 665).", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/I-14"}
  fiscalite: {valeur: "partiel", note: "Le conseil d'un village nordique peut imposer par règlement des taxes annuelles fondées sur la superficie des immeubles pour l'eau et l'éclairage, loi V-6.1, art. 178 et 191 (1978) ; pouvoir municipal, non propre aux Inuit.", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/V-6.1"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Statut de bénéficiaire inuit défini par la Loi sur les autochtones cris, inuit et naskapis (RLRQ, c. A-33.1), auquel renvoie la loi R-13.1, art. 1 d).", source: "https://www.legisquebec.gouv.qc.ca/fr/document/lc/R-13.1"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les institutions issues de la Convention de 1975 fonctionnent, mais aucun gouvernement autonome n'existe : après des tentatives en 2003, 2007 et 2011 et le rejet par référendum de 2011, Makivvik et le Québec ont signé le 20 décembre 2023 un accord qui ouvre une nouvelle négociation (Nunatsiaq News, 21 décembre 2023) ; le Rapporteur spécial notait déjà en 2014 que ce volet restait en suspens (A/HRC/27/52/Add.2, § 41).", source: "https://nunatsiaq.com/stories/article/makivvik-quebec-sign-agreement-for-talks-on-self-government/"}
chronologie:
  - {annee: 1975, evenement: "Signature de la Convention de la Baie-James et du Nord québécois."}
  - {annee: 1978, evenement: "Lois québécoises créant l'Administration régionale Kativik et le régime des terres."}
  - {annee: 2006, evenement: "Signature le 1er décembre de l'accord sur les revendications territoriales des Inuits du Nunavik (région marine), approuvé par vote en octobre."}
  - {annee: 2011, evenement: "Rejet par référendum du projet de gouvernement régional du Nunavik."}
  - {annee: 2019, evenement: "Protocole d'entente du 18 juin entre Makivik et le Canada pour ouvrir des négociations sur l'autonomie gouvernementale."}
  - {annee: 2021, evenement: "Loi fédérale sur la Déclaration des Nations Unies sur les droits des peuples autochtones."}
  - {annee: 2023, evenement: "Accord de négociation sur l'autonomie gouvernementale du Nunavik signé le 20 décembre par le Québec et Makivvik."}
