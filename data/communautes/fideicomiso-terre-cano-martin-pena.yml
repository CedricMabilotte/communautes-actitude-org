resume: >-
  Le Fideicomiso de la Tierra del Caño Martín Peña (fiducie foncière communautaire) a été créé par la loi portoricaine 489 du 24 septembre 2004 pour détenir les terrains publics du district de planification spéciale du Caño Martín Peña, à San Juan. Il garde la propriété du sol ; les habitants détiennent seulement leur maison, par un droit de superficie (droit de posséder un bâtiment sur le terrain d'autrui) inscrit au registre foncier, ou par un bail de longue durée transmissible aux héritiers. Les lois 32-2009 et 70-2011 ont transféré ces terrains à des organismes publics ; la loi 104-2013 les a rendus à la fiducie, qualifiée de « privée et perpétuelle ». Son conseil de fiduciaires comprend des habitants délégués par le G-8, groupe des huit communautés riveraines du chenal ; la fiducie concerne environ 2 000 familles.
