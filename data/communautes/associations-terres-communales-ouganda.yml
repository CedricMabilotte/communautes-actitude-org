resume: >-
  La loi foncière ougandaise de 1998 (Land Act, Cap. 227) permet à tout groupe de personnes de former une association de terres communales (communal land association) pour posséder et gérer en commun des terres, en droit coutumier ou non. Le comité de gestion élu devient une personne morale qui détient la terre au nom des membres et adopte un plan de gestion des terres communes (pâturage, eau, bois, chasse, miel). La Constitution de 1995 reconnaît la tenure coutumière (régime foncier régi par la coutume) parmi les quatre régimes fonciers du pays. Selon l'Uganda Land Alliance, les premières associations ont été formées en 2012-2013 au Karamoja, dans le nord-est ; d'autres l'ont été entre 2019 et 2021. En 2022, le ministère des Terres indiquait que la plupart des demandes de certificats venues de cette région restaient en attente de traitement.
