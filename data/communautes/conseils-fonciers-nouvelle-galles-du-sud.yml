resume: >-
  L'Aboriginal Land Rights Act 1983, loi de l'État de Nouvelle-Galles du Sud entrée en vigueur le 10 juin 1983, crée un réseau de conseils fonciers aborigènes (120 conseils locaux et un conseil d'État, le NSW Aboriginal Land Council). Ces conseils peuvent revendiquer les terres de la Couronne inoccupées et non nécessaires à un usage public ; 168 438 hectares leur ont été rendus en quarante ans. La loi d'origine soumettait les activités minières sur leurs terres à leur consentement.
