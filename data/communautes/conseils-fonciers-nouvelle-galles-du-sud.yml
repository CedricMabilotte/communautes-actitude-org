  - {instrument: "La Perouse Local Aboriginal Land Council v Quarry Street Pty Ltd [2025] HCA 32 (Haute Cour d'Australie, 3 septembre 2025)", nature: "jurisprudence", annee: 2025, source: "https://www.nortonrosefulbright.com/en-au/knowledge/publications/5fd019e4/high-court-says-land-is-not-lawfully-used-merely-by-the-grant-of-a-lease"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 1983 crée des conseils fonciers aborigènes locaux, personnes morales (s. 50), et un conseil de l'État ; 121 conseils locaux en 2026. Les neuf conseillers du conseil de l'État sont élus tous les quatre ans par les membres votants des conseils locaux, scrutin organisé par la commission électorale de l'État. Leurs opérations foncières sont soumises à l'approbation du conseil de l'État (s. 42E).", source: "https://alc.org.au/newsroom/media-releases/have-your-say-nswalc-elections-to-be-held-in-february-2024/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Un conseil foncier peut revendiquer une terre de la Couronne pouvant être vendue ou louée, non utilisée ni occupée légalement et non nécessaire à un usage public essentiel (s. 36) ; les terres attribuées ne peuvent être reprises que par une loi du Parlement (s. 42B) ; une cession par un conseil local exige l'approbation du conseil de l'État (s. 42E). La loi du 16 septembre 2026 permet de valider rétroactivement certains actes de la Couronne entachés d'erreurs documentaires, avec consultation de 28 jours des conseils locaux.", source: "https://legislation.nsw.gov.au/view/whole/html/inforce/current/act-1983-042"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Nul ne peut mener d'activités minières sur les terres d'un conseil foncier sans son consentement, qui peut porter sur des redevances (s. 45(4)-(5)) ; un conseil local doit obtenir l'approbation du conseil de l'État ou du tribunal (s. 45(6)). La Couronne garde l'or, l'argent, le charbon, le pétrole et l'uranium (s. 45(11)), et les droits miniers antérieurs à l'attribution sont exclus (s. 45(12)).", source: "https://legislation.nsw.gov.au/view/whole/html/inforce/current/act-1983-042"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Sur 56 157 revendications déposées depuis 1983, 4 741 avaient été accordées, 1 050 accordées en partie, 10 671 refusées et 39 939 restaient en attente en 2024 (ANTaR, 2025). En septembre 2026, plus de 43 000 revendications restaient sans décision ; le conseil de l'État qualifie la loi votée le 16 septembre 2026 de « régression » (ABC News, 2026).", source: "https://www.abc.net.au/news/2026-09-16/nsw-indigenous-land-claims-legislation-reaction/107158080"}
chronologie:
  - {annee: 1983, evenement: "Entrée en vigueur de l'Aboriginal Land Rights Act (10 juin)."}
  - {annee: 1998, evenement: "Dernière année du versement au conseil de l'État de 7,5 % de l'impôt foncier perçu, prévu par la loi d'origine (s. 28)."}
  - {annee: 2023, evenement: "Quarantième anniversaire : 4 396 revendications accordées en tout ou partie, 168 438 ha rendus."}
  - {annee: 2025, evenement: "La Haute Cour juge, dans l'affaire La Perouse Local Aboriginal Land Council v Quarry Street (3 septembre), qu'une terre n'est pas « légalement utilisée » du seul fait d'un bail."}
  - {annee: 2026, evenement: "Dépôt de la 60 000e revendication par le conseil de l'État (janvier) ; vote, le 16 septembre, de la Crown Land Management Amendment (Statutory Review) Bill 2026 (loi de révision de la gestion des terres de la Couronne), sans la disposition qui assimilait un bail à un usage légal."}
