resume: >-
  L'Aboriginal Land Rights Act 1983 (loi sur les droits fonciers aborigènes), loi de l'État de Nouvelle-Galles du Sud entrée en vigueur le 10 juin 1983, crée un réseau de conseils fonciers aborigènes : 121 conseils locaux en 2026 et un conseil de l'État, le NSW Aboriginal Land Council, dont les neuf conseillers sont élus par les membres des conseils locaux. Ces conseils peuvent revendiquer les terres de la Couronne inoccupées et non nécessaires à un usage public ; 168 438 hectares leur avaient été rendus en juillet 2023. Une loi votée le 16 septembre 2026 permet de valider rétroactivement certains actes fonciers de la Couronne, après un arrêt de la Haute Cour de 2025 favorable à un conseil local. Les parcs rendus au titre de la partie 4A de la loi sur les parcs nationaux font l'objet de la fiche « Parcs aborigènes de Nouvelle-Galles du Sud » ; le titre autochtone de droit fédéral, celle de la fiche « Détenteurs du titre autochtone en Australie (native title) ».
