  terres: {valeur: "partiel", note: "Un conseil foncier peut revendiquer une terre de la Couronne pouvant être vendue ou louée et non utilisée ni occupée légalement (loi de 1983, s. 36).", source: "https://legislation.nsw.gov.au/view/pdf/asmade/act-1983-42"}
