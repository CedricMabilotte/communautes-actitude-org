reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD (Comité pour l'élimination de la discrimination raciale) note que des revendications foncières autochtones restent sans issue, recommande d'inscrire le consentement préalable, libre et éclairé dans la loi et d'appliquer la Déclaration des Nations Unies sur les droits des peuples autochtones (par. 21-22) ; il vise la loi sur les langues aborigènes de la Nouvelle-Galles du Sud de 2017 (par. 37) (CERD/C/AUS/CO/18-20, 8 décembre 2017)", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
