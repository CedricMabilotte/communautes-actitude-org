effectivite: {valeur: "non_etablie", note: "Les 27 himas inscrits à la base mondiale des aires protégées portent le statut « désigné » ; le type de gouvernance déclaré pour chacun est « gouvernance partagée » entre la municipalité et la SPNL, et un lien vers un plan de gestion n'est déclaré que pour 7 d'entre eux (Anfeh, Anjar, Ebel el Saqi, Hammana, Kfar Zabad, Mansoura, Ras el Matn). Les années de désignation (2004 à 2022) sont pour la plupart antérieures à la loi de 2019. Ces données sont fournies par la SPNL. Aucune évaluation indépendante de l'application de la loi aux himas n'a été trouvée.", source: "https://www.protectedplanet.net/555760980"}
chronologie:
  - {annee: 2004, evenement: "Désignation des himas d'Ebel es-Saqi et de Kfar Zabad (année de statut déclarée à la base mondiale des aires protégées)."}
  - {annee: 2012, evenement: "Décret n° 8045 du 25 avril 2012 transmettant au Parlement le projet de loi sur les aires protégées, qui inclut la catégorie hima."}
  - {annee: 2016, evenement: "La stratégie nationale pour la biodiversité 2016-2030 décrit le hima comme catégorie du projet de loi."}
  - {annee: 2019, evenement: "Le sixième rapport national à la CDB (janvier) reprend la carte de 22 himas établie par la SPNL en 2018."}
  - {annee: 2019, evenement: "Loi n° 130 du 30 avril 2019 sur les aires protégées : le hima devient l'une des quatre catégories d'aires protégées."}
  - {annee: 2025, evenement: "Lettre du ministre de l'Environnement du 20 juin 2025 approuvant l'inscription de 27 himas à la base mondiale des aires protégées, en catégorie UICN VI (aire protégée avec utilisation durable des ressources)."}
fiabilite:
  verifie: ["Texte de la loi n° 130 du 30 avril 2019 (Journal officiel n° 23, supplément, p. 51 à 57), lu sur le fac-similé publié par le ministère de l'Environnement : définition du hima (art. 1), quatre catégories (art. 2), création par décision municipale ou du qaimaqam, plan de gestion, comité intercommunal et renvoi des modes de gestion à un décret (art. 3).", "Base mondiale des aires protégées (Protected Planet, PNUE-WCMC) : 27 sites de désignation « Hima » au Liban, catégorie UICN VI, statut « désigné », gouvernance partagée entre municipalité et SPNL, propriété communale pour 21 sites et publique pour 6, lien vers un plan de gestion pour 7 sites ; jeu de données « Hima dataset for Lebanon » fourni par la SPNL en 2025.", "Noms, surfaces déclarées et années de statut des 27 sites, lus sur la page de chaque site.", "Sixième rapport national à la CDB (2019) et stratégie nationale pour la biodiversité 2016-2030 : mentions du hima citées dans la fiche.", "Lettre ministérielle du 20 juin 2025 et accord de transmission de données du 27 mai 2025 : rapportés par la SPNL."]
  non_confirme: ["Nombre total de himas déclarés par les municipalités : inconnu ; seuls les 27 sites inscrits à la base mondiale sont comptés.", "Aucun organe propre aux communautés n'est institué par la loi pour un hima situé dans une seule municipalité : le droit « institutions propres » est laissé sans source.", "Le décret d'application prévu par l'art. 3 B 2 de la loi (modes de gestion des himas) n'a pas été trouvé ; on ignore s'il a été pris.", "La source de la lettre ministérielle de 2025 est la SPNL, organisation qui promeut les himas ; le texte de la lettre n'a pas été consulté.", "La SPNL décrit des comités de gestion pour chaque hima ; la loi ne prévoit un comité que pour un hima couvrant plusieurs municipalités ou villages.", "Les subdivisions administratives des sites ne figurent pas dans la base mondiale ; la colonne reste vide dans le tableau.", "Aucune source universitaire indépendante sur l'application de la loi aux himas n'a pu être ouverte.", "Population et nombre de villages concernés : aucun chiffre trouvé."]
