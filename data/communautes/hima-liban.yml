  ressources: {valeur: "partiel", note: "La loi définit le hima comme un site protégé qui peut comprendre une partie modifiée de façon durable par l'usage des ressources naturelles, et dont la protection volontaire est assurée par un système traditionnel de gestion des ressources naturelles des communautés locales, fondé sur leurs savoir-faire (art. 1, définition du « hima »). Le hima est créé par décision du ou des conseils municipaux concernés ou, dans les villages sans municipalité, du qaimaqam sur proposition du ou des mukhtars ; le conseil municipal ou le qaimaqam établit et exécute le plan de gestion (art. 3 A 4). Ces organes sont les autorités locales de droit commun ; la loi ne crée pas d'institution propre aux communautés, et les modes de gestion des himas sont renvoyés à un décret en Conseil des ministres (art. 3 B 2).", source: "https://www.moe.gov.lb/getattachment/454fe562-c57f-4861-aea5-d6a1c941179d/قانون-رقم-130-قانون-المناطق-المحمية.aspx"}
