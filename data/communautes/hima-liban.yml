effectivite: {valeur: "partielle", note: "La loi n° 130 de 2019 s'applique à la création des himas : la stratégie nationale pour la biodiversité 2025 liste 36 himas créés par décision de conseil municipal, dont 12 depuis 2019 (tableau 2-9). Au 23 décembre 2024, selon le PNUD, aucun des décrets d'application (au moins cinq) et des deux décisions ministérielles prévus par la loi n'avait été adopté, dont le décret sur les modes de gestion des himas (art. 3 B 2). Les 27 himas inscrits à la base mondiale des aires protégées portent le statut « désigné », en « gouvernance partagée » entre la municipalité et la Société pour la protection de la nature au Liban (SPNL) ; un plan de gestion n'est déclaré que pour 7 d'entre eux. Aucune évaluation indépendante de l'application de la loi aux himas n'a été trouvée.", source: "https://www.undp.org/lebanon/press-releases/technical-workshop-strengthening-legal-and-institutional-frameworks-lebanons-protected-areas"}
chronologie:
  - {annee: 2004, evenement: "Désignation des himas d'Ebel es-Saqi et de Kfar Zabad (année de statut déclarée à la base mondiale des aires protégées)."}
  - {annee: 2012, evenement: "Décret n° 8045 du 25 avril 2012 transmettant au Parlement le projet de loi sur les aires protégées, qui inclut la catégorie hima."}
  - {annee: 2016, evenement: "La stratégie nationale pour la biodiversité 2016-2030 décrit le hima comme catégorie du projet de loi."}
  - {annee: 2019, evenement: "Le sixième rapport national à la CDB (janvier) reprend la carte de 22 himas établie par la SPNL en 2018."}
  - {annee: 2019, evenement: "Loi n° 130 du 30 avril 2019 sur les aires protégées : le hima devient l'une des quatre catégories d'aires protégées."}
  - {annee: 2024, evenement: "Atelier technique du ministère de l'Environnement et du PNUD (23 décembre) : aucun décret d'application de la loi n° 130 de 2019 n'a été adopté."}
  - {annee: 2025, evenement: "Lettre du ministre de l'Environnement du 20 juin 2025 approuvant l'inscription de 27 himas à la base mondiale des aires protégées, en catégorie UICN VI (aire protégée avec utilisation durable des ressources)."}
  - {annee: 2026, evenement: "Décision n° 1/2026 du conseil municipal de Baaloul (26 janvier) créant un hima sur des terres publiques communales ; la SPNL compte 44 himas."}
  - {annee: 2026, evenement: "Le Liban dépose auprès de la CDB sa stratégie nationale pour la biodiversité 2025 (9 février, puis version adoptée le 15 juin déposée le 27 août) : 36 himas créés par décision municipale."}
fiabilite:
  verifie: ["Texte de la loi n° 130 du 30 avril 2019 (Journal officiel n° 23, supplément, p. 51 à 57), lu sur le fac-similé publié par le ministère de l'Environnement : définition du hima (art. 1), quatre catégories (art. 2), création par décision municipale ou du qaimaqam, plan de gestion, comité intercommunal et renvoi des modes de gestion à un décret (art. 3).", "Base mondiale des aires protégées (Protected Planet, PNUE-WCMC) : 27 sites de désignation « Hima » au Liban, catégorie UICN VI, statut « désigné », gouvernance partagée entre municipalité et SPNL, propriété communale pour 21 sites et publique pour 6, lien vers un plan de gestion pour 7 sites ; jeu de données « Hima dataset for Lebanon » fourni par la SPNL en 2025.", "Noms, surfaces déclarées et années de statut des 27 sites, lus sur la page de chaque site.", "Sixième rapport national à la CDB (2019) et stratégie nationale pour la biodiversité 2016-2030 : mentions du hima citées dans la fiche.", "Lettre ministérielle du 20 juin 2025 et accord de transmission de données du 27 mai 2025 : rapportés par la SPNL.", "Stratégie nationale pour la biodiversité 2025 déposée auprès de la CDB (fichier du 27 août 2026) : définition du hima, création par décision municipale, tableau 2-9 de 36 himas avec numéro et année de décision ; les subdivisions du tableau joint sont reprises de ce tableau.", "Communiqué du PNUD du 23 décembre 2024 : aucun décret d'application de la loi n° 130 de 2019 adopté à cette date.", "Décision n° 1/2026 du conseil municipal de Baaloul : rapportée par la SPNL le 27 janvier 2026."]
  non_confirme: ["Nombre total de himas : 36 selon la stratégie nationale 2025 (données SPNL 2025), 44 selon la SPNL en janvier 2026 ; la fiche compte les 27 sites inscrits à la base mondiale, seuls à avoir une surface publiée.", "Aucun organe propre aux communautés n'est institué par la loi pour un hima situé dans une seule municipalité : le droit « institutions propres » est laissé sans source.", "Le décret d'application prévu par l'art. 3 B 2 de la loi (modes de gestion des himas) n'était pas adopté en décembre 2024 ; aucune adoption postérieure n'a été trouvée.", "La source de la lettre ministérielle de 2025 est la SPNL, organisation qui promeut les himas ; le texte de la lettre n'a pas été consulté.", "La SPNL décrit des comités de gestion pour chaque hima ; la loi ne prévoit un comité que pour un hima couvrant plusieurs municipalités ou villages.", "Les subdivisions du tableau suivent la colonne « gouvernorat » de la stratégie nationale 2025, qui mêle gouvernorats et districts ; Jdeidet Bekaata n'y figure pas sous ce nom et reste sans subdivision. Pour Arnoun, la stratégie donne 0,3 ha et la base mondiale 2,44 km².", "Aucune source universitaire indépendante sur l'application de la loi aux himas n'a pu être ouverte.", "Population et nombre de villages concernés : aucun chiffre trouvé."]
