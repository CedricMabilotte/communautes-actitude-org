reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Liban à la Convention sur la diversité biologique (janvier 2019, ministère de l'Environnement et PNUD) : il range le hima, « pratique de conservation fondée sur la communauté locale », parmi les sites protégés au niveau national, reproduit la carte de 22 himas établie par la Société pour la protection de la nature au Liban (SPNL) en 2018 et décrit le programme hima mené avec des municipalités", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/lb-nr-06-en.pdf"}
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2025 (version adoptée le 15 juin 2026, déposée auprès de la CDB le 27 août 2026 ; une première version a été déposée le 9 février 2026) : le hima est défini selon la loi n° 130 de 2019 ; les himas sont « établis par décisions de conseils municipaux » ; le tableau 2-9 liste 36 himas avec le numéro et l'année de chaque décision (2004 à 2025)", annee: 2026, source: "https://api.cbd.int/api/v2013/documents/A47DD9D4-220B-30A1-432E-ACB2A31EAAF1/attachments/625979/Lebanon's%20NBSAP%202025.pdf"}
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2016-2030, transmis à la CDB : le hima figure parmi les quatre catégories du projet de loi sur les aires protégées, défini comme un système de gestion communautaire des ressources naturelles placé sous la supervision de la municipalité, de l'union de municipalités ou du qaimaqam dans les villages sans municipalité ; les himas d'Anjar / Kfar Zabad et d'Ebel es-Saqi sont cités parmi les zones importantes pour la conservation des oiseaux", annee: 2016, source: "https://www.cbd.int/doc/world/lb/lb-nbsap-v2-en.pdf"}
