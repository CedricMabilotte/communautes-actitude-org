resume: >-
  Fiche agrégée : elle couvre les communautés locales des villages libanais où un hima (حمى, aire mise en défens et gérée selon des usages locaux de ressources naturelles) a été déclaré. La loi n° 130 du 30 avril 2019 sur les aires protégées fait du hima l'une des quatre catégories d'aires protégées et le définit comme un site protégé par une gestion traditionnelle des ressources naturelles des communautés locales (art. 1 et 2). Le hima est créé par décision du conseil municipal ou, dans les villages sans municipalité, du qaimaqam (préfet de district) sur proposition du ou des mukhtars (représentants élus du village) ; le conseil municipal ou le qaimaqam établit son plan de gestion (art. 3). En juin 2025, le ministère de l'Environnement a approuvé l'inscription de 27 himas à la base mondiale des aires protégées. La stratégie nationale pour la biodiversité 2025, transmise à la CDB en 2026, recense 36 himas créés par décision de conseil municipal.
