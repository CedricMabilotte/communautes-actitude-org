resume: >-
  Les Kurdes représentent environ 15 à 20 % de la population irakienne selon Minority Rights Group.
  Une zone autonome de fait existe dans le nord du pays depuis 1991 ; des élections y ont eu lieu en 1992.
  La Constitution irakienne de 2005 reconnaît la Région du Kurdistan et ses autorités comme région fédérale, et fait du kurde une des deux langues officielles de l'Irak.
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD s'adresse au Gouvernement de la région du Kurdistan, salue la loi n° 7 de 2014 sur les langues officielles dans la région et traite du différend sur les territoires contestés (CERD/C/IRQ/CO/22-25, par. 4, 19-22, 26).", annee: 2019, source: "https://docs.un.org/fr/CERD/C/IRQ/CO/22-25"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme adresse des recommandations propres à la Région du Kurdistan (CCPR/C/IRQ/CO/6).", annee: 2022, source: "https://docs.un.org/fr/CCPR/C/IRQ/CO/6"}
base_nationale:
  - {instrument: "Constitution de la République d'Irak, art. 4, 114, 115, 117, 121, 126 et 141", nature: "constitution", annee: 2005, source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  - {instrument: "Loi n° 7 de 2014 relative aux langues officielles dans la région du Kurdistan", nature: "loi", annee: 2014, source: "https://docs.un.org/fr/CERD/C/IRQ/CO/22-25"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 117(1) : la Constitution reconnaît la région du Kurdistan et ses autorités existantes comme région fédérale ; art. 121(1) : pouvoirs exécutif, législatif et judiciaire régionaux.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 121(1)-(2) : pouvoir législatif hors compétences fédérales exclusives, avec faculté d'écarter une loi fédérale contraire ; art. 141 : la législation adoptée au Kurdistan depuis 1992 reste en vigueur.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  justice_propre: {valeur: "reconnu", note: "Art. 121(1) : pouvoir judiciaire régional ; art. 141 : validité des décisions de justice rendues dans la région depuis 1992.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "conteste", note: "Art. 112 : gestion du pétrole et du gaz des gisements existants par l'État fédéral avec les régions productrices. Le 15 février 2022, la Cour suprême fédérale a déclaré inconstitutionnelle la loi régionale sur le pétrole et le gaz de 2007.", source: "https://www.washingtoninstitute.org/policy-analysis/death-oil-federalism-implications-new-iraqi-court-ruling"}
  consentement: {valeur: "reconnu", note: "Art. 126(4) : toute révision constitutionnelle réduisant les pouvoirs d'une région exige l'accord de son organe législatif et de la majorité de ses citoyens par référendum.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 4(1) : l'arabe et le kurde sont les deux langues officielles de l'Irak ; art. 4(3) : les institutions de la région du Kurdistan utilisent les deux langues.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  education: {valeur: "partiel", note: "Art. 4(1) : droit d'enseigner aux enfants dans leur langue maternelle ; art. 114 : la politique éducative est formulée par l'État fédéral en consultation avec les régions ; art. 115 : priorité à la loi régionale en cas de conflit sur les compétences partagées.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  fiscalite: {valeur: "partiel", note: "Art. 121(3) : les régions reçoivent une part équitable des revenus nationaux, selon leurs ressources, besoins et population.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Après les élections régionales du 20 octobre 2024, le Parlement du Kurdistan n'a pas élu sa présidence et aucun nouveau gouvernement n'était formé en avril 2026 ; la Cour suprême fédérale a annulé en 2022 la loi régionale sur le pétrole et le gaz.", source: "https://www.rudaw.net/english/kurdistan/240420263"}
chronologie:
  - {annee: 1970, evenement: "Accord d'autonomie entre le gouvernement irakien et les Kurdes, resté sans effet."}
  - {annee: 1991, evenement: "Résolution 688 du Conseil de sécurité sur la répression des populations civiles, « en particulier de la population kurde » ; zone de protection aérienne au nord du 36e parallèle."}
  - {annee: 1992, evenement: "Premières élections dans la zone autonome ; partage du gouvernement entre PDK et UPK."}
  - {annee: 2005, evenement: "Constitution irakienne : reconnaissance de la Région du Kurdistan comme région fédérale."}
  - {annee: 2017, evenement: "Référendum d'indépendance organisé par la région le 25 septembre ; la Cour suprême fédérale le déclare inconstitutionnel en novembre."}
  - {annee: 2022, evenement: "La Cour suprême fédérale déclare inconstitutionnelle la loi régionale sur le pétrole et le gaz de 2007."}
  - {annee: 2024, evenement: "Élections au Parlement du Kurdistan le 20 octobre."}
fiabilite:
  verifie: ["Texte des art. 4, 112, 114, 115, 117, 121, 126 et 141 de la Constitution (Constitute Project).", "Passages du CERD (2019) et du Comité des droits de l'homme (2022) sur la Région du Kurdistan.", "Texte de la résolution 688 (1991)."]
  non_confirme: ["L'art. 117 reconnaît une région, non le peuple kurde nommément ; le lien avec les Kurdes passe par l'art. 4 et l'histoire de la zone autonome.", "Contenu de la loi n° 7 de 2014 connu seulement par le CERD.", "Formation d'un gouvernement régional après avril 2026 non vérifiée.", "Population de la région : aucun chiffre sourcé retenu."]
