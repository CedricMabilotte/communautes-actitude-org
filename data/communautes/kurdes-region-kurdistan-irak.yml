resume: >-
  Les Kurdes représentent environ 15 à 20 % de la population irakienne selon Minority Rights Group.
  Une zone autonome de fait existe dans le nord du pays depuis 1991 ; des élections y ont eu lieu en 1992.
  La Constitution irakienne de 2005 reconnaît la Région du Kurdistan et ses autorités comme région fédérale, et fait du kurde une des deux langues officielles de l'Irak.
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD salue la loi n° 7 de 2014 sur les langues officielles dans la région du Kurdistan (par. 3 b) et 21), traite du différend territorial entre le Gouvernement central et le Gouvernement de la région du Kurdistan (par. 19-20) et adresse des recommandations à ce gouvernement (par. 26 et 37-38) ; observations adoptées le 11 décembre 2018 (CERD/C/IRQ/CO/22-25).", annee: 2018, source: "https://docs.un.org/fr/CERD/C/IRQ/CO/22-25"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme adresse des recommandations visant la Région du Kurdistan et son gouvernement (CCPR/C/IRQ/CO/6, par. 36, 39 et 41), après examen du rapport en mars 2022.", annee: 2022, source: "https://docs.un.org/fr/CCPR/C/IRQ/CO/6"}
base_nationale:
  - {instrument: "Constitution de la République d'Irak, art. 4, 114, 115, 117, 121, 126 et 141", nature: "constitution", annee: 2005, source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  - {instrument: "Loi n° 7 de 2014 relative aux langues officielles dans la région du Kurdistan", nature: "loi", annee: 2014, source: "https://docs.un.org/fr/CERD/C/IRQ/CO/22-25"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 117(1) : la Constitution reconnaît la région du Kurdistan et ses autorités existantes comme région fédérale ; art. 121(1) : pouvoirs exécutif, législatif et judiciaire régionaux.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 121(1)-(2) : pouvoir législatif hors compétences fédérales exclusives, avec faculté d'écarter une loi fédérale contraire ; art. 141 : la législation adoptée au Kurdistan depuis 1992 reste en vigueur.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  justice_propre: {valeur: "reconnu", note: "Art. 121(1) : pouvoir judiciaire régional ; art. 141 : validité des décisions de justice rendues dans la région depuis 1992.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "conteste", note: "Art. 112 : gestion du pétrole et du gaz des gisements existants par l'État fédéral avec les régions productrices. Le 15 février 2022, la Cour suprême fédérale a déclaré inconstitutionnelle la loi régionale sur le pétrole et le gaz de 2007. Depuis le 27 septembre 2025, le pétrole de la région est exporté par l'oléoduc vers Ceyhan sous la commercialisation de la société fédérale SOMO, en vertu d'un accord entre Bagdad, Erbil et les compagnies.", source: "https://www.washingtoninstitute.org/policy-analysis/death-oil-federalism-implications-new-iraqi-court-ruling"}
  consentement: {valeur: "reconnu", note: "Art. 126(4) : toute révision constitutionnelle réduisant les pouvoirs d'une région exige l'accord de son organe législatif et de la majorité de ses citoyens par référendum.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 4(1) : l'arabe et le kurde sont les deux langues officielles de l'Irak ; art. 4(3) : les institutions de la région du Kurdistan utilisent les deux langues.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  education: {valeur: "partiel", note: "Art. 4(1) : droit d'enseigner aux enfants dans leur langue maternelle ; art. 114 : la politique éducative est formulée par l'État fédéral en consultation avec les régions ; art. 115 : priorité à la loi régionale en cas de conflit sur les compétences partagées.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  fiscalite: {valeur: "partiel", note: "Art. 121(3) : les régions reçoivent une part équitable des revenus nationaux, selon leurs ressources, besoins et population.", source: "https://www.constituteproject.org/constitution/Iraq_2005?lang=en"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Parlement élu le 20 octobre 2024 ne s'est réuni que pour la prestation de serment du 2 décembre 2024 ; au 23 septembre 2026, aucun nouveau gouvernement n'était formé et le gouvernement sortant expédiait les affaires courantes. Le 21 février 2024, la Cour suprême fédérale a annulé les 11 sièges réservés aux minorités au Parlement régional et confié l'organisation des élections régionales à la commission électorale fédérale. Les exportations de pétrole de la région, arrêtées en mars 2023, ont repris le 27 septembre 2025 sous contrôle fédéral.", source: "https://www.arabnews.pk/middle-east/basis-for-understanding-brings-iraqi-kurdistan-closer-to-new-government-3002079"}
chronologie:
  - {annee: 1970, evenement: "Accord d'autonomie entre le gouvernement irakien et les Kurdes, vidé de sa portée selon Minority Rights Group."}
  - {annee: 1991, evenement: "Résolution 688 du Conseil de sécurité : elle condamne la répression des populations civiles, « y compris très récemment dans les zones de peuplement kurde ». La coalition internationale instaure ensuite une protection aérienne au nord du 36e parallèle."}
  - {annee: 1992, evenement: "Premières élections dans la zone autonome ; partage du gouvernement entre PDK et UPK."}
  - {annee: 2005, evenement: "Constitution irakienne : reconnaissance de la Région du Kurdistan comme région fédérale."}
  - {annee: 2017, evenement: "Référendum d'indépendance organisé par la région le 25 septembre ; la Cour suprême fédérale le déclare inconstitutionnel en novembre."}
  - {annee: 2022, evenement: "La Cour suprême fédérale déclare inconstitutionnelle la loi régionale sur le pétrole et le gaz de 2007."}
  - {annee: 2023, evenement: "Arrêt des exportations de pétrole de la région par l'oléoduc vers la Turquie, après une sentence arbitrale de la Chambre de commerce internationale."}
  - {annee: 2024, evenement: "Le 21 février, la Cour suprême fédérale annule les 11 sièges réservés aux minorités au Parlement régional et confie les élections régionales à la commission électorale fédérale. Élections au Parlement du Kurdistan le 20 octobre ; session de prestation de serment le 2 décembre."}
  - {annee: 2025, evenement: "Reprise des exportations de pétrole le 27 septembre, commercialisées par la société fédérale SOMO. Publication des résultats définitifs du recensement de 2024 en novembre ; le Gouvernement régional les conteste."}
  - {annee: 2026, evenement: "En septembre, le PDK et l'UPK annoncent un accord pour réactiver le Parlement en octobre ; aucun gouvernement n'est encore formé."}
fiabilite:
  verifie: ["Texte des art. 4, 112, 114, 115, 117, 121, 126 et 141 de la Constitution (Constitute Project).", "Passages du CERD (2019) et du Comité des droits de l'homme (2022) sur la Région du Kurdistan.", "Texte de la résolution 688 (1991).", "Superficie, gouvernorats, districts et sous-districts (page du KRSO).", "Nombre de villages (rapport agricole 2013 du KRSO).", "Population du recensement 2024 (Rudaw, 2 décembre 2025)."]
  non_confirme: ["L'art. 117 reconnaît une région, non le peuple kurde nommément ; le lien avec les Kurdes passe par l'art. 4 et l'histoire de la zone autonome.", "Contenu de la loi n° 7 de 2014 connu seulement par le CERD.", "Réactivation du Parlement et formation d'un gouvernement régional après le 27 septembre 2026 non vérifiées.", "Résultats du recensement 2024 contestés par le Gouvernement régional ; chiffre repris d'un média, non du ministère du Plan.", "Superficie et découpage administratif : page du KRSO sans année."]
