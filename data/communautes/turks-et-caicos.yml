resume: >-
  Population de l'archipel des Turks-et-Caïcos, au nord d'Haïti et de la République dominicaine, territoire britannique d'outre-mer inscrit sur la liste des territoires non autonomes de l'ONU. Rattachées aux Bahamas puis à la Jamaïque, les îles forment une colonie distincte depuis 1962. La Constitution de 2011, en vigueur depuis le 15 octobre 2012 après la suspension du gouvernement élu par Londres de 2009 à 2012, institue une assemblée en majorité élue, renommée Parlement en 2024 et entièrement élue depuis 2025, et un Cabinet dirigé par un Premier ministre (Premier), le gouverneur nommé par la Couronne gardant la défense, les relations extérieures et la sécurité intérieure. Le statut de « Turks and Caicos Islander » (insulaire, anciennement « belonger », appartenant) conditionne le vote, l'éligibilité et l'accès aux terres de la Couronne à usage résidentiel.
