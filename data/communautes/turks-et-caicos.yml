base_nationale:
  - {instrument: "Turks and Caicos Islands Constitution Order 2011 (SI 2011/1681), annexe 2 : Constitution des Îles Turks-et-Caïcos", nature: "constitution", annee: 2011, source: "https://www.legislation.gov.uk/uksi/2011/1681/contents/made"}
  - {instrument: "Turks and Caicos Islands Constitution (Amendment) Order 2024 (SI 2024/1128) : Parlement entièrement élu, compétence autonome du Cabinet, référendum ; en vigueur le 10 décembre 2024 (proclamation n° 3 de 2024), articles 9 et 14 à la dissolution suivante", nature: "constitution", annee: 2024, source: "https://www.legislation.gov.uk/uksi/2024/1128/contents/made"}
  - {instrument: "Turks and Caicos Islands Constitution (Interim Amendment) Order 2009 (SI 2009/701) : suspension du gouvernement ministériel et de la Chambre d'assemblée, abrogée par l'ordonnance de 2011", nature: "constitution", annee: 2009, source: "https://www.legislation.gov.uk/uksi/2009/701/contents/made"}
  - {instrument: "Turks and Caicos Islander Status Ordinance 2015 (citée par le Secrétariat de l'ONU, texte non consulté)", nature: "loi", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/15&l=en&t=pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Législature se compose de la Couronne et d'une Chambre d'assemblée (Constitution de 2011, s. 42 et 43), renommée Parlement par l'ordonnance de 2024 (art. 8), puis portée à dix-neuf élus sans membres nommés (art. 9, en vigueur à la dissolution qui a précédé les élections de février 2025) ; le gouverneur nomme Premier ministre l'élu qui réunit une majorité (s. 31, al. 2) et doit révoquer sa nomination après une motion de défiance (s. 33) ; depuis 2024, le Cabinet a une « capacité autonome et exclusive » dans les affaires intérieures hors des responsabilités du gouverneur (s. 31, al. 8).", source: "https://www.legislation.gov.uk/uksi/2024/1128/contents/made"}
  pouvoir_normatif: {valeur: "partiel", note: "La Législature fait les lois « pour la paix, l'ordre et le bon gouvernement » des îles (Constitution de 2011, s. 62) ; la Couronne garde le pouvoir de légiférer par ordonnance en conseil (Order, s. 14), toute loi peut être annulée par désaveu (disallowance, s. 75), le gouverneur réserve à Londres certains projets (s. 73, al. 2) et peut, avec l'accord d'un secrétaire d'État, promulguer un texte non voté par l'assemblée pour des motifs limitatifs (s. 72).", source: "https://www.legislation.gov.uk/uksi/2011/1681/contents/made"}
  justice_propre: {valeur: "partiel", note: "La Constitution établit une Cour suprême et une Cour d'appel (s. 77 et 80) à côté des tribunaux de magistrats ; les juges sont nommés par le gouverneur sur avis d'une Commission du service judiciaire (s. 86 et 87), le droit appliqué combine ordonnances locales, textes britanniques étendus au territoire et common law anglaise, et le dernier recours relève du Comité judiciaire du Conseil privé, à Londres.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/15&l=en&t=pdf"}
  terres: {valeur: "partiel", note: "Les principes d'acquisition, de gestion et de cession des terres de la Couronne (Crown land, terres publiques) sont fixés par ordonnance locale (Constitution de 2011, s. 107), mais les concessions sont faites par le gouverneur, qui consulte le Cabinet et peut s'écarter de son avis dans les cas prévus à la s. 29, al. 2 (s. 108) ; selon le Secrétariat de l'ONU, seuls les titulaires du statut d'insulaire peuvent demander l'attribution de terres de la Couronne à usage résidentiel.", source: "https://www.legislation.gov.uk/uksi/2011/1681/contents/made"}
  ressources: {valeur: "partiel", note: "Le département de l'Environnement et des Ressources côtières du gouvernement territorial gère la conservation et la protection des ressources naturelles, dont les zones humides, et impose une évaluation environnementale préalable à tout projet d'aménagement ; le gouvernement territorial fait respecter les règles de pêche, notamment sur la taille des langoustes ; le territoire a rejoint en 2022 le programme britannique Blue Belt de conservation marine.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/15&l=en&t=pdf"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "Le gouvernement territorial organise l'école gratuite et obligatoire de 4 à 16 ans et gère 11 écoles primaires et 5 écoles secondaires publiques ; le Community College, régi par une ordonnance locale modifiée en 2023, est gratuit pour les insulaires.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/15&l=en&t=pdf"}
  fiscalite: {valeur: "partiel", note: "Aucun impôt ne peut être levé sans ordonnance locale (Constitution de 2011, s. 110) et les recettes alimentent un fonds consolidé dont les retraits sont autorisés par des ordonnances de crédits (s. 112 et 113) ; tout projet qui dépasse le cadre de gestion des finances publiques convenu avec Londres requiert l'accord préalable d'un secrétaire d'État (s. 109, al. 4 et 5).", source: "https://www.legislation.gov.uk/uksi/2011/1681/contents/made"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La Constitution définit le « Turks and Caicos Islander » (s. 132), renvoie à une ordonnance les conditions d'octroi du statut et en fait une condition du droit de vote (s. 55, al. 1 b iii) et de l'éligibilité (s. 46 c) ; selon le Secrétariat de l'ONU, l'ordonnance de 2015 sur le statut d'insulaire en fixe l'acquisition de droit ou par octroi.", source: "https://www.legislation.gov.uk/uksi/2011/1681/contents/made"}
  autodetermination_externe: {valeur: "partiel", note: "L'ordonnance de 2024 (art. 16) insère une section 62A : une loi locale peut organiser un référendum sur des « matters of national importance » (questions d'intérêt national), dont la question de demander une modification constitutionnelle pouvant mener à l'indépendance ; le résultat n'est pas contraignant (s. 62A, al. 5).", source: "https://www.legislation.gov.uk/uksi/2024/1128/contents/made"}
effectivite: {valeur: "partielle", note: "Le Royaume-Uni a suspendu le 14 août 2009 les dispositions sur le gouvernement ministériel et la Chambre d'assemblée, à la suite d'une commission d'enquête sur la corruption, et gouverné par le gouverneur jusqu'à l'entrée en vigueur de la Constitution de 2011 le 15 octobre 2012 ; depuis, des élections ont lieu (la dernière le 7 février 2025) et la réforme de 2024 a étendu les compétences du Cabinet, le gouverneur gardant la défense, les relations extérieures et la sécurité intérieure.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/15&l=en&t=pdf"}
chronologie:
  - {annee: 1799, evenement: "Les îles, peuplées à l'origine par les Taïnos, sont annexées par la Grande-Bretagne et rattachées aux Bahamas, puis à la Jamaïque."}
  - {annee: 1962, evenement: "Indépendance de la Jamaïque : les îles deviennent une colonie britannique distincte."}
  - {annee: 1973, evenement: "Indépendance des Bahamas ; un gouverneur remplace l'administrateur du territoire."}
  - {annee: 2006, evenement: "Constitution de 2006 négociée entre les gouvernements du territoire et du Royaume-Uni."}
  - {annee: 2008, evenement: "Commission d'enquête sur la corruption au sein du gouvernement et de l'assemblée."}
  - {annee: 2009, evenement: "Ordonnance en conseil du Royaume-Uni : suspension du gouvernement ministériel et de la Chambre d'assemblée à compter du 14 août ; le gouverneur gouverne seul."}
  - {annee: 2012, evenement: "Entrée en vigueur de la Constitution de 2011 le 15 octobre ; rétablissement d'un gouvernement élu."}
  - {annee: 2015, evenement: "Ordonnance sur le statut d'insulaire (Turks and Caicos Islander Status Ordinance)."}
  - {annee: 2024, evenement: "Ordonnance constitutionnelle du 6 novembre, en vigueur le 10 décembre : la Chambre d'assemblée devient Parlement, compétence autonome du Cabinet, possibilité de référendum consultatif, y compris sur l'indépendance ; suppression des membres nommés à la dissolution suivante."}
  - {annee: 2025, evenement: "Élections générales du 7 février, les premières avec dix-neuf élus ; document de travail du Secrétariat de l'ONU (A/AC.109/2025/15)."}
fiabilite:
  verifie: ["Composition du Cabinet, nomination et révocation du Premier ministre, responsabilités réservées du gouverneur (s. 31, 33, 37), pouvoir de la Couronne de légiférer (Order, s. 14), pouvoir législatif de l'assemblée et pouvoir de réserve du gouverneur, réserve et désaveu des lois (s. 62, 72, 73, 75), terres de la Couronne (s. 106 à 108), finances publiques (s. 109 à 113), définition de l'insulaire, vote et éligibilité (s. 132, 55, 46), dans le texte de SI 2011/1681 sur legislation.gov.uk.", "Parlement à dix-neuf élus sans membres nommés, capacité autonome du Cabinet (s. 31, al. 8) et section 62A sur le référendum non contraignant, dans le texte de SI 2024/1128.", "Entrée en vigueur de l'ordonnance de 2024 le 10 décembre 2024, articles 9 et 14 exceptés (proclamation n° 3 de 2024, avis légal 67 de 2024, publié par le procureur général du territoire).", "Objet de l'ordonnance intérimaire de 2009 (note explicative de SI 2009/701).", "Inscription sur la liste des territoires non autonomes, population, surface, îles habitées, suspension de 2009, entrée en vigueur de la Constitution en 2012, accès des seuls insulaires aux terres de la Couronne résidentielles et au vote, éducation, environnement (A/AC.109/2025/15)."]
  non_confirme: ["Élection de dix-neuf membres en février 2025 : rapportée par une source secondaire (IFES), pas par un texte officiel du territoire ; le document de l'ONU de mars 2025 décrit encore la composition antérieure.", "Texte de la Turks and Caicos Islander Status Ordinance 2015 et de ses modifications de 2023 non consulté.", "Ordonnance locale sur les conseils locaux prévue par la Constitution (s. 130) non trouvée.", "Statut éventuel du créole des Turks-et-Caïcos non établi ; l'anglais est la langue indiquée par l'ONU, sans texte constitutionnel sur la langue.", "Nombre de villages : non trouvé ; le document de l'ONU donne six îles habitées en permanence, sans décompte des localités."]
