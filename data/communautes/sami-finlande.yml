droits:
  autogouvernement: {valeur: "reconnu", note: "Les Sámi ont dans leur foyer national une autonomie linguistique et culturelle, Constitution, art. 121 ; ils élisent pour l'exercer un Parlement sâme, Loi de 1995, art. 1.", source: "https://www.constituteproject.org/constitution/Finland_2011"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Dans le foyer national sâme, la Loi minière de 2011 impose d'évaluer l'effet des permis sur la culture sâme et interdit ceux qui la compromettent ; le Parlement sâme a un droit de recours, art. 38, 50 et 165 (Rapporteur spécial, 2016, § 62 à 64).", source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
  consentement: {valeur: "partiel", note: "Les autorités doivent négocier avec le Parlement sâme sur les mesures d'une grande portée qui touchent le statut des Sámi, Loi de 1995, art. 9 ; selon le Conseil sâme (2025), cette obligation ne lie pas la décision finale des autorités ; la réforme de 2025 la précise.", source: "https://valtioneuvosto.fi/en/-/1410853/reformed-act-on-the-sami-parliament"}
  langue: {valeur: "partiel", note: "Tout Sámi peut employer sa langue devant les autorités du foyer national, Loi sur la langue sâme de 2003, art. 4 ; la loi protège le same du Nord, le same d'Inari et le same skolt.", source: "https://www.axl.cefan.ulaval.ca/europe/finlande_loi-same2003.htm"}
  education: {valeur: "partiel", note: "Les élèves sâmes du foyer national ont accès à l'enseignement de base en langue sâme, sans système scolaire distinct ; hors du foyer national, l'offre se limite à deux heures hebdomadaires (ECMI, 2016).", source: "https://www.ecmi.de/fileadmin/redakteure/publications/pdf/Working_Paper___92.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial (2016, § 56 à 61) relève un pouvoir de décision limité, en particulier sur les terres, dont 90 % du foyer national sont des terres d'État au statut non réglé ; la réforme de 2025 supprime le critère dit « lapon » d'inscription sur la liste électorale.", source: "https://documents.un.org/doc/undoc/gen/g16/175/50/pdf/g1617550.pdf"}
