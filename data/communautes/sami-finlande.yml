resume: >-
  La Constitution finlandaise de 1999 reconnaît les Sámi comme peuple autochtone et leur garantit une autonomie linguistique et culturelle dans leur foyer national. La Loi de 1995 sur le Parlement sâme institue une assemblée élue de 21 membres et oblige les autorités à négocier avec elle. La Loi sur la langue sâme de 2003 protège trois langues sâmes, et la Loi skolt de 1995 reconnaît le conseil de village des Sámi skolts. Une réforme de la Loi sur le Parlement sâme, adoptée en juin 2025, est en vigueur depuis le 1er août 2025.
