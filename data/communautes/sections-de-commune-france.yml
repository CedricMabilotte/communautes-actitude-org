resume: >-
  Fiche agrégée : elle couvre les sections de commune, parties d'une commune qui possèdent « à titre permanent et exclusif des biens ou des droits distincts de ceux de la commune » (Code général des collectivités territoriales, art. L. 2411-1). La section est une personne morale de droit public (une entité publique dotée de la personnalité juridique) ; ses membres sont les habitants qui ont leur domicile réel et fixe sur son territoire et ont la jouissance en nature des biens : bois, pâturages, terres agricoles. La plupart de ces biens proviennent de titres de propriété antérieurs à 1789. Le régime a été réformé par la loi n° 2013-428 du 27 mai 2013, qui interdit la création de nouvelles sections ; le recensement de 1999 en comptait 26 792, concentrées dans le Massif central.
