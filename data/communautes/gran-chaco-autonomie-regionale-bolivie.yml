resume: >-
  Le Gran Chaco tarijeño est la première autonomie régionale (collectivité infradépartementale prévue par l'article 280 de la Constitution de 2009) de Bolivie, selon son statut (préambule et art. 4). Il réunit les communes de Yacuiba, Caraparí et Villa Montes, au sud-est du département de Tarija. L'autonomie est approuvée par référendum le 6 décembre 2009 et son statut le 20 novembre 2016, avec 72,41 % des suffrages valides. Le gouvernement régional exerce 32 compétences transférées par le département et perçoit directement 45 % des redevances d'hydrocarbures versées au département ; son assemblée compte un siège pour chacun des peuples guarani, weenhayek et tapiete, désigné selon leurs normes propres.
