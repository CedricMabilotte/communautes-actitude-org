resume: >-
  Fiche agrégée : elle couvre les negeri des Moluques, communautés de droit coutumier (kesatuan masyarakat hukum adat) dotées d'un territoire coutumier (petuanan) et de droits d'origine, appelées aussi ohoi, fnue ou kampung selon les districts. Le règlement régional (Peraturan Daerah, loi provinciale) n° 14 de 2005 les rétablit après leur conversion en villages administratifs sous la loi de 1979 ; le règlement n° 16 de 2019 sur l'organisation des villages coutumiers (desa adat) fixe leurs compétences : gouvernement selon la structure d'origine, gestion des terres coutumières (ulayat), règlement coutumier des différends et audiences de conciliation. Le chef porte un titre coutumier (raja, orang kaya, pati) et la charge revient à une lignée (mata rumah parentah). Le règlement de 2005 charge les districts et les villes d'inventorier les negeri en vue de leur désignation par le gouverneur (art. 7) et de fixer leurs compétences par règlement local (art. 3 (5)) ; la ville d'Ambon en désigne 22 par son règlement n° 9 de 2017, le district de Maluku Tengah procède par un règlement pour chaque negeri.
