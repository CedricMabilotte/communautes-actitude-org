  - {instrument: "Peraturan Daerah Provinsi Maluku n° 16 de 2019 sur l'organisation des villages coutumiers (desa adat), 13 novembre 2019, Lembaran Daerah 2019 n° 158", nature: "loi", annee: 2019, source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20PENATAAN%20DESA%20ADAT%20EDIT%20HASIL%20FASILITASI%20KEMNDAGRI%20TERAKHIR.pdf"}
  - {instrument: "Peraturan Daerah Kota Ambon n° 8 de 2017 sur les negeri (30 mars 2017), qui abroge le règlement n° 3 de 2008 sur les negeri de la ville d'Ambon", nature: "loi", annee: 2017, source: "https://peraturan.bpk.go.id/Details/120657/perda-kota-ambon-no-8-tahun-2017"}
  - {instrument: "Peraturan Daerah Kota Ambon n° 9 de 2017 sur la désignation des negeri de la ville d'Ambon (30 mars 2017), art. 3 : liste de 22 negeri", nature: "loi", annee: 2017, source: "https://peraturan.bpk.go.id/Details/120660/perda-kota-ambon-no-9-tahun-2017"}
