droits:
  autogouvernement: {valeur: "reconnu", note: "La negeri est dirigée par un chef de gouvernement au titre coutumier (art. 7 (1) du règlement provincial n° 16 de 2019) ; la charge appartient à une soa ou à une lignée (mata rumah) en ligne directe et ne se transmet pas, sauf décision de la lignée (art. 7 (2)) ; la negeri exerce le gouvernement selon sa structure d'origine (art. 10 (a)). À Ambon, le règlement n° 8 de 2017 confirme ce droit de la lignée dirigeante (mata rumah parentah, art. 27) et institue un conseil, le Saniri Negeri, dont les membres sont désignés par les soa (art. 54) ; le gouverneur exerce une mission d'encadrement et de contrôle (art. 13 du règlement n° 16 de 2019).", source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20PENATAAN%20DESA%20ADAT%20EDIT%20HASIL%20FASILITASI%20KEMNDAGRI%20TERAKHIR.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le gouvernement de la negeri adopte des règlements (Peraturan Desa Adat) sur ses compétences d'origine et locales (art. 12 du règlement provincial n° 16 de 2019), dont la liste est fixée par règlement du chef de district ou du maire après consultation et recommandation du gouverneur (art. 11). À Ambon, les règlements de negeri (Peraturan Negeri) sont adoptés par le chef et le Saniri Negeri pour le gouvernement, le droit coutumier et les usages (art. 81 du règlement n° 8 de 2017) ; le même règlement prévoit leur annulation (chapitre VII, section 3).", source: "https://peraturan.bpk.go.id/Details/120657/perda-kota-ambon-no-8-tahun-2017"}
  justice_propre: {valeur: "partiel", note: "La negeri règle les différends coutumiers selon le droit coutumier, « en privilégiant la délibération » et en accord avec les droits humains, et tient des audiences de conciliation (sidang perdamaian) « conformément aux lois » (art. 10 (d) et (e) du règlement provincial n° 16 de 2019 ; art. 7 (d) et (e) du règlement d'Ambon n° 8 de 2017). Le texte ne crée pas de juridiction distincte des tribunaux d'État.", source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20PENATAAN%20DESA%20ADAT%20EDIT%20HASIL%20FASILITASI%20KEMNDAGRI%20TERAKHIR.pdf"}
  terres: {valeur: "partiel", note: "La negeri règle et administre son territoire coutumier (ulayat ou wilayah adat, art. 10 (b) du règlement provincial n° 16 de 2019) et gère les terres coutumières et les terres du village (art. 9 (d) et (f)) ; le règlement de 2005 fait du territoire coutumier délimité (petuanan) une condition de la reconnaissance (art. 5 et explication). Aucun de ces textes n'attribue de titre foncier ; à Ambon, les limites des petuanan sont fixées par le maire « par étapes » (art. 4 du règlement n° 9 de 2017).", source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20PENATAAN%20DESA%20ADAT%20EDIT%20HASIL%20FASILITASI%20KEMNDAGRI%20TERAKHIR.pdf"}
  ressources: {valeur: "partiel", note: "À Ambon, le kewang (police forestière coutumière) est un organe de la negeri chargé de surveiller les ressources naturelles de la negeri dans son territoire coutumier (art. 1 (19) du règlement n° 8 de 2017) ; l'explication du règlement provincial de 2005 cite le sasi (interdiction coutumière temporaire de prélèvement) parmi les institutions sociales qui sont des éléments complémentaires de la reconnaissance (art. 5 (e)). Aucun texte consulté n'attribue aux negeri de droit sur le sous-sol.", source: "https://peraturan.bpk.go.id/Details/120657/perda-kota-ambon-no-8-tahun-2017"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "La province apporte une aide financière aux negeri, directement ou par le budget des districts (art. 5 (2) (c) et 6 (2) du règlement provincial n° 7 de 2011), qui prévoit aussi une formation à la préparation du budget de la negeri (art. 6 (4) (c)) ; la ville d'Ambon encadre la gestion du budget des negeri par l'arrêté du maire n° 37 de 2019 sur la gestion financière des villages et negeri. Aucun texte consulté ne donne à la negeri de pouvoir d'imposition.", source: "https://jdih.malukuprov.go.id/peraturan/PERDA%20NO%207%20TAHUN%202011%20-%20PENGUATAN%20KAPASITAS%20KELEMBAGAAN%20NEGERI.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le registre des territoires coutumiers (BRWA, organisme non gouvernemental) indique pour les negeri Rutong et Hukurila (Ambon) un arrêté ministériel n° 263 de 2019 sur leur zone de gestion coutumière dans l'espace côtier et les petites îles et, pour Hukurila, un arrêté du ministre de l'Environnement et des Forêts de 2020 qui lui attribue une forêt coutumière d'environ 7 hectares ; aucun chiffre provincial des negeri désignées n'a été trouvé, et à Ambon les limites des territoires sont fixées par étapes (art. 4 du règlement n° 9 de 2017).", source: "https://brwa.id/profil/1876"}
chronologie:
  - {annee: 1979, evenement: "La loi n° 5 de 1979 sur le gouvernement des villages convertit les negeri en villages administratifs (desa)."}
  - {annee: 2005, evenement: "Règlement provincial n° 14 de 2005 (18 août) : rétablissement des negeri comme communautés de droit coutumier."}
  - {annee: 2006, evenement: "Règlement du district de Maluku Tengah n° 1 de 2006 sur les negeri."}
  - {annee: 2011, evenement: "Règlement provincial n° 7 de 2011 (7 février) sur le renforcement des capacités institutionnelles des negeri."}
  - {annee: 2012, evenement: "Règlement du district de Maluku Tengah n° 10 de 2012 : rétablissement de la negeri Samasuru."}
  - {annee: 2017, evenement: "Ville d'Ambon : règlement n° 8 de 2017 sur les negeri et règlement n° 9 de 2017 désignant 22 negeri."}
  - {annee: 2019, evenement: "Règlement provincial n° 16 de 2019 (13 novembre) sur l'organisation des villages coutumiers."}
  - {annee: 2019, evenement: "Arrêté ministériel n° 263 de 2019 sur la zone de gestion coutumière des negeri Hukurila et Rutong dans l'espace côtier et les petites îles."}
  - {annee: 2020, evenement: "Forêt coutumière de la negeri Hukurila (environ 7 hectares) attribuée par arrêté du ministre de l'Environnement et des Forêts."}
