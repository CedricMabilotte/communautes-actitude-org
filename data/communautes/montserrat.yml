resume: >-
  Population de Montserrat, île volcanique des Petites Antilles située à 43 km au sud-ouest d'Antigua. Le territoire figure sur la liste des territoires non autonomes de l'ONU, avec le Royaume-Uni comme puissance administrante. La Constitution de 2010, en vigueur depuis septembre 2011, reconnaît dans son préambule le droit du peuple de Montserrat à l'autodétermination (droit de choisir son statut politique) ; elle institue une Assemblée législative de neuf élus, un Premier et un Cabinet chargés de la direction générale du gouvernement, à côté d'un gouverneur nommé par la Couronne. Elle définit le statut de Montserratien, requis pour siéger comme élu et pour la fonction de gouverneur adjoint. Depuis l'éruption du volcan de la Soufrière en 1995, environ les deux tiers sud de l'île forment une zone d'exclusion.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "liste_tna", detail: "Territoire non autonome administré par le Royaume-Uni ; document de travail du Secrétariat du Comité spécial de la décolonisation (A/AC.109/2025/10) ; résolution 79/106 de l'Assemblée générale du 4 décembre 2024, qui réaffirme le droit inaliénable du peuple de Montserrat à l'autodétermination ; mission de visite du Comité spécial du 17 au 20 décembre 2019 (rapport A/AC.109/2020/20)", annee: 2025, source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/10&l=en&t=pdf"}
base_nationale:
  - {instrument: "Montserrat Constitution Order 2010 (SI 2010/2474) : Constitution de Montserrat", nature: "constitution", annee: 2010, source: "https://www.legislation.gov.uk/uksi/2010/2474/made"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Le Cabinet réunit le Premier, trois autres ministres issus des élus et deux membres de droit, le procureur général et le secrétaire financier ; il a la direction et le contrôle généraux du gouvernement et répond devant l'Assemblée législative (Constitution de 2010, s. 32) ; le gouverneur nomme Premier l'élu qui a la confiance de la majorité des élus (s. 33) ; la défense, les affaires extérieures, la sécurité intérieure, la régulation des services financiers internationaux et la fonction publique restent au gouverneur (s. 39).", source: "https://www.legislation.gov.uk/uksi/2010/2474/made"}
  pouvoir_normatif: {valeur: "partiel", note: "La Législature fait les lois pour la paix, l'ordre et le bon gouvernement de Montserrat (Constitution de 2010, s. 71) ; le gouverneur doit réserver à l'approbation de la Couronne tout projet contraire aux obligations internationales du Royaume-Uni ou touchant ses responsabilités propres (s. 74), toute loi peut être désavouée (annulée) par la Couronne (s. 76), et la Couronne garde le pouvoir de légiférer pour le territoire par ordonnance en conseil (s. 121).", source: "https://www.legislation.gov.uk/uksi/2010/2474/made"}
  justice_propre: {valeur: "partiel", note: "La Haute Cour et la Cour d'appel de la Cour suprême de la Caraïbe orientale, juridiction dont la Cour d'appel siège à tour de rôle chez ses neuf membres, ont compétence à Montserrat (Constitution de 2010, s. 80) ; les tribunaux subordonnés sont créés par la loi du territoire (s. 81) ; le Comité judiciaire du Conseil privé, à Londres, statue en dernier ressort (A/AC.109/2025/10).", source: "https://www.legislation.gov.uk/uksi/2010/2474/made"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Avant d'agir dans la défense, les affaires extérieures, la sécurité intérieure ou les services financiers internationaux, le gouverneur consulte le Cabinet mais peut passer outre à son avis (Constitution de 2010, s. 39, al. 7) ; il délègue à un ministre la conduite des affaires extérieures au sein des organisations régionales de la Caraïbe (s. 39, al. 4).", source: "https://www.legislation.gov.uk/uksi/2010/2474/made"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "reconnu", note: "L'éducation ne figure pas parmi les domaines réservés au gouverneur (Constitution de 2010, s. 39) et relève du gouvernement territorial, selon le gouverneur entendu par la mission de visite de l'ONU en 2019 ; la Constitution garantit à chaque enfant l'enseignement primaire et secondaire gratuit (s. 12).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2020/20&l=en&t=pdf"}
  fiscalite: {valeur: "partiel", note: "L'Assemblée législative ne peut examiner un projet qui crée, modifie ou abroge un impôt ou dispose des fonds publics qu'avec l'accord du Cabinet (Constitution de 2010, s. 70, al. 2) ; les lois fiscales du territoire imposent le revenu des résidents et les bénéfices des sociétés, mais l'aide budgétaire du Royaume-Uni finance 64,5 % des dépenses courantes et la totalité des dépenses d'investissement.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2025/10&l=en&t=pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "La Constitution de 2010 réserve le statut de Montserratien aux citoyens des territoires britanniques d'outre-mer qui le tiennent de la naissance dans l'île, de l'ascendance, de l'adoption, de la naturalisation ou de l'enregistrement dans le territoire, ou d'un octroi par la loi (s. 107, al. 2) ; seuls les Montserratiens nés dans l'île ou dont un parent ou grand-parent y est né, et dont un parent avait lui-même ce statut, peuvent être élus à l'Assemblée (s. 51) ; le gouverneur adjoint est un Montserratien (s. 23) ; les lois sur l'entrée et l'emploi des personnes sans ce statut échappent à la clause de non-discrimination (s. 16, al. 5 b).", source: "https://www.legislation.gov.uk/uksi/2010/2474/made"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le gouvernement territorial dépend de l'aide budgétaire du Royaume-Uni, qui finance 64,5 % des dépenses courantes (A/AC.109/2025/10) ; en 2019, le Premier et des ministres ont déclaré à la mission de visite de l'ONU que la puissance administrante pouvait imposer des lois au territoire et que la délimitation de la zone d'exclusion, qui couvre la plupart des terres agricoles, relevait du gouverneur.", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2020/20&l=en&t=pdf"}
chronologie:
  - {annee: 1632, evenement: "Arrivée des premiers colons européens, surtout irlandais, sur l'île que ses habitants autochtones nommaient Alliouagana."}
  - {annee: 1768, evenement: "Soulèvement d'esclaves le jour de la Saint-Patrick."}
  - {annee: 1783, evenement: "L'île est confirmée comme territoire britannique après des occupations françaises intermittentes."}
  - {annee: 1871, evenement: "Montserrat devient une colonie de la Couronne britannique."}
  - {annee: 1962, evenement: "Après la dissolution de la Fédération des Indes occidentales, Montserrat choisit le statut de colonie de la Couronne plutôt que celui d'État associé."}
  - {annee: 1995, evenement: "Éruption du volcan de la Soufrière en juillet ; environ 70 % de la population est évacuée du sud de l'île."}
  - {annee: 1997, evenement: "Abandon de la capitale, Plymouth ; la plupart des services du gouvernement sont aujourd'hui à Brades."}
  - {annee: 2010, evenement: "Ordonnance du 13 octobre établissant la Constitution de Montserrat, entrée en vigueur en septembre 2011."}
  - {annee: 2019, evenement: "Mission de visite du Comité spécial de la décolonisation du 17 au 20 décembre."}
  - {annee: 2024, evenement: "Élections du 24 octobre ; le 4 décembre, l'Assemblée générale adopte sans vote la résolution 79/106 sur la question de Montserrat."}
fiabilite:
  verifie: ["Préambule sur le droit à l'autodétermination, composition et rôle du Cabinet, nomination du Premier, responsabilités du gouverneur et consultation du Cabinet, composition de l'Assemblée, pouvoir législatif, réserve et désaveu des lois, pouvoir législatif de la Couronne, organisation judiciaire, définition du statut de Montserratien, conditions d'éligibilité et clause de non-discrimination ; le texte ne prévoit aucune procédure de référendum et ne mentionne le droit à l'autodétermination que dans le préambule et la section 2 (Constitution de 2010 sur legislation.gov.uk).", "Inscription sur la liste des territoires non autonomes, résolution 79/106, surface, aide budgétaire, chronologie historique (document A/AC.109/2025/10).", "Compétence du gouvernement territorial en matière d'éducation, droit de vote ouvert aux citoyens du Commonwealth après trois ans de résidence, déclarations des élus sur la zone d'exclusion (rapport de mission A/AC.109/2020/20).", "Population résidente habituelle de 4 396 personnes, 19 districts de recensement, 2 389 personnes nées à Montserrat (recensement de 2023, Statistics Department Montserrat)."]
