  - {instrument: "Constitution de l'État de Hatohobei (convention constitutionnelle du 27 juillet au 13 novembre 1983), art. I, III, VIII à X et XII", nature: "statut_autonomie", annee: 1983, source: "https://www.friendsoftobi.org/hsg/Documents/hatohobeiconstitutionenglish.pdf"}
  - {instrument: "Constitution de l'État de Sonsorol (1983), modifiée par référendum en 2024 ; texte non ouvert", nature: "statut_autonomie", annee: 1983, source: "https://islandtimes.org/sonsorol-election-results-pedro-leads-governor-race-write-in-tops-lt-governor/"}
droits:
  autogouvernement: {valeur: "reconnu", note: "L'organisation des États suit « les principes démocratiques » et « les traditions des Palaos » (Constitution, art. XI, s. 1) ; Sonsorol élit un gouverneur, un lieutenant-gouverneur, des élus à l'échelle de l'État et des représentants des hameaux de Sonsorol, Pulo Anna, Merir et Fanna (élection de mars 2024) ; Hatohobei élit un gouverneur, un lieutenant-gouverneur et une législature de neuf membres (constitution de Hatohobei, art. VIII, s. 1 ; législature installée en juillet 2016), à côté d'un conseil des chefs traditionnels (art. IX).", source: "https://islandtimes.org/sonsorol-election-results-pedro-leads-governor-race-write-in-tops-lt-governor/"}
  pouvoir_normatif: {valeur: "partiel", note: "La législature de Hatohobei a le pouvoir de légiférer (constitution de Hatohobei, art. VIII, s. 3) ; une loi touchant aux traditions et coutumes exige l'avis conforme du conseil des chefs traditionnels (art. VIII, s. 10). Aucune loi ne peut contredire la Constitution nationale (Constitution des Palaos, art. II, s. 2), et les pouvoirs non attribués aux États reviennent à l'État central, qui peut en déléguer par la loi (art. XI, s. 2).", source: "https://www.friendsoftobi.org/hsg/Documents/hatohobeiconstitutionenglish.pdf"}
  justice_propre: {valeur: "partiel", note: "À Hatohobei, le conseil des chefs traditionnels « conserve le droit d'entendre et de trancher » les affaires des communautés selon la coutume, sans contredire la constitution de l'État, celle des Palaos ni les lois ; le pouvoir judiciaire relève sinon des tribunaux nationaux tant qu'aucune juridiction d'État n'est créée (constitution de Hatohobei, art. X, s. 1). Aucune disposition équivalente n'a été lue pour Sonsorol.", source: "https://www.friendsoftobi.org/hsg/Documents/hatohobeiconstitutionenglish.pdf"}
  terres: {valeur: "partiel", note: "L'État de Hatohobei a le droit de revendiquer et de posséder les zones qui faisaient traditionnellement partie de Hatohobei (constitution de Hatohobei, art. XII, s. 4) ; sous réserve de la coutume, le gouvernement ne peut acquérir une terre privée nécessaire à l'usage public : seul un droit d'usage se négocie, contre indemnité (art. XII, s. 5). Le régime foncier de Sonsorol n'a pas été lu.", source: "https://www.friendsoftobi.org/hsg/Documents/hatohobeiconstitutionenglish.pdf"}
  ressources: {valeur: "reconnu", note: "Chaque État a la propriété exclusive des ressources vivantes et non vivantes, hors grands migrateurs, de la terre jusqu'à 12 milles marins des lignes de base traditionnelles, sans atteinte aux droits de pêche traditionnels (Constitution des Palaos, art. I, s. 2) ; la ligne de base archipélagique nationale passe par le récif Helen, l'île de Tobi et l'île Fana (art. I, s. 1) ; les recettes de cette zone reviennent à l'État (art. XII, s. 6).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  consentement: {valeur: "partiel", note: "Le gouvernement national ne peut prendre un bien sans consultation préalable du gouvernement de l'État où il se trouve (Constitution des Palaos, art. XIII, s. 7) : il s'agit d'une consultation, pas d'un consentement. La constitution de Hatohobei prévoit qu'un accord sur les substances nocives approuvé par référendum national ne s'applique à Hatohobei qu'avec l'accord des trois quarts des votants de l'État (art. XII, s. 8).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  langue: {valeur: "reconnu", note: "« Les langues traditionnelles des Palaos sont les langues nationales » (Constitution des Palaos, art. XIII, s. 1) ; « la langue traditionnelle de Hatohobei est la langue officielle de l'État » (constitution de Hatohobei, art. XII, s. 1). Le statut du sonsorolais dans la constitution de Sonsorol n'a pas été lu.", source: "https://www.friendsoftobi.org/hsg/Documents/hatohobeiconstitutionenglish.pdf"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Sous réserve des lois du Congrès national (Olbiil Era Kelulau), les législatures des États peuvent lever des impôts (Constitution des Palaos, art. XI, s. 3) ; les aides globales et l'aide extérieure sont partagées entre l'État central et les États selon les besoins et la population (art. XII, s. 5).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  representation: {valeur: "reconnu", note: "La Chambre des délégués compte un délégué élu par État (Constitution des Palaos, art. IX, s. 3) : Sonsorol et Hatohobei y ont chacun un siège ; chaque État a aussi un chef traditionnel au Conseil des chefs, organe consultatif du président (art. VIII, s. 6).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
  statut_personnel: {valeur: "partiel", note: "La constitution de Hatohobei définit la « personne de Hatohobei » : citoyen des Palaos membre d'un clan de l'État selon la coutume, descendant d'une personne de Hatohobei ou marié à l'une d'elles ; chaque personne de Hatohobei a le droit d'entrer et de résider sur le territoire de l'État (art. III, s. 1 et 3). Aucune disposition équivalente n'a été lue pour Sonsorol.", source: "https://www.friendsoftobi.org/hsg/Documents/hatohobeiconstitutionenglish.pdf"}
  autodetermination_externe: {valeur: "non_applicable", note: "« Aucun État ne peut faire sécession des Palaos » (Constitution des Palaos, art. XIII, s. 4).", source: "https://www.constituteproject.org/constitution/Palau_1992.pdf?lang=en"}
effectivite: {valeur: "partielle", note: "Les institutions des deux États fonctionnent : élections générales de Sonsorol en mars 2024, avec un référendum de révision de la constitution d'État, 110 voix pour et 68 contre selon les résultats non officiels ; serment du 9e gouvernement de Hatohobei, gouverneur, lieutenant-gouverneur et neuf législateurs, devant la Cour suprême des Palaos en juillet 2016 (Island Times). À Sonsorol, 180 suffrages se sont portés sur les deux candidats au poste de gouverneur, pour 40 résidents recensés en 2015 d'après la source secondaire.", source: "https://islandtimes.org/sonsorol-election-results-pedro-leads-governor-race-write-in-tops-lt-governor/"}
chronologie:
  - {annee: 1981, evenement: "Entrée en vigueur de la Constitution des Palaos, le 1er janvier : seize États ; les dispositions transitoires nomment Sonsorol et Tobi."}
  - {annee: 1983, evenement: "Adoption des constitutions des États de Sonsorol et de Hatohobei ; la convention constitutionnelle de Hatohobei siège du 27 juillet au 13 novembre à Eang (Koror)."}
  - {annee: 1984, evenement: "Installation des gouvernements constitutionnels des deux États ; à Hatohobei, le 10 juillet, fin de l'administration par un magistrat du Territoire sous tutelle des îles du Pacifique."}
  - {annee: 1994, evenement: "Fin de la tutelle de l'ONU et indépendance des Palaos en libre association avec les États-Unis, le 1er octobre."}
  - {annee: 2016, evenement: "Installation du 9e gouvernement de Hatohobei, législature de neuf membres."}
  - {annee: 2024, evenement: "Élections générales de Sonsorol et référendum de révision de la constitution d'État (résultats non officiels publiés le 8 mars)."}
