resume: >-
  Les habitants des îles du Sud-Ouest des Palaos parlent le sonsorolais et le tobien, langues distinctes du paluan. Leurs îles forment deux des seize États des Palaos, Sonsorol et Hatohobei, dotés de constitutions propres adoptées en 1983, d'un gouverneur et d'une législature élus. La Constitution des Palaos donne à chaque État la propriété des ressources jusqu'à 12 milles marins, un pouvoir fiscal et un délégué à la Chambre des délégués. La constitution de Hatohobei fait du tobien la langue officielle de l'État, définit qui est « personne de Hatohobei » par l'appartenance à un clan ou la filiation, et confie au conseil des chefs traditionnels le droit de trancher selon la coutume les affaires des communautés.
