    - "171 forêts, 43 enregistrées, 65 719,04 ha, répartition par région et liste du tableau 1 dans Atakpama et al., Revue marocaine des sciences agronomiques et vétérinaires, 2023 : le tableau 1 compte 171 lignes dont la somme des superficies donne 65 719,04 ha."
    - "Numéros n° 057 et 058 des arrêtés fixant le canevas de plan simple de gestion et le canevas de convention : notices ECOLEX."
    - "Passages sur les forêts communautaires dans le cinquième rapport national (2014) et la stratégie nationale pour la biodiversité 2011-2020, publiés sur le site de la Convention sur la diversité biologique."
  non_confirme:
    - "L'étude de 2023 donne une fois le total de 64 719 ha dans le texte et 170 forêts dans le résumé anglais ; le tableau 1 donne 171 forêts et 65 719,04 ha."
    - "La liste des 43 forêts enregistrées par le ministère n'a pas été trouvée ; le tableau des sites mêle forêts enregistrées et initiatives en cours de création."
    - "L'année de création de chaque forêt n'est pas publiée dans l'étude ; la colonne année du tableau reste vide."
    - "Population et nombre de villages concernés : aucune source trouvée."
