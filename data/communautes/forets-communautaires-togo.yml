resume: >-
  Fiche agrégée : elle couvre les communautés qui gèrent une forêt communautaire au Togo. Le Code forestier de 2008 range les communautés rurales ou de base parmi les particuliers, qui gèrent et exploitent leurs forêts (art. 25, 29 et 45). Quatre arrêtés du 13 juin 2016 (n° 057 à 060) organisent le régime : la communauté, représentée par une entité juridique (comité villageois ou cantonal de développement, association villageoise de gestion des aires protégées), obtient soit la « création » d'une forêt sur ses terres, encadrée par une charte de gestion, soit l'« attribution » d'une forêt du domaine de l'État par une convention avec l'administration forestière. La charte ou la convention, provisoire pour deux ans puis définitive pour quinze ans renouvelables, fixe les droits et devoirs des membres, l'exploitation et la clé de répartition des bénéfices. Une étude de 2023 recense 171 forêts communautaires (65 719 ha), dont 43 enregistrées par le ministère.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Togo à la Convention sur la diversité biologique (avril 2014) : entre 2010 et 2013, des communautés appuyées par des ONG et l'État ont constitué des forêts communautaires ; une dizaine sont citées (Ando-Kpomey, Alibi-1, Natchabouanga, Kemeni, Péssaré, Namab). La stratégie nationale pour la biodiversité 2011-2020, publiée par la Convention, rattache ces forêts au domaine des particuliers (art. 25 du Code forestier).", annee: 2014, source: "https://www.cbd.int/doc/world/tg/tg-nr-05-fr.pdf"}
base_nationale:
  - {instrument: "Loi n° 2008-09 du 19 juin 2008 portant Code forestier, art. 24, 25, 29, 34, 45 et 148 à 150", nature: "loi", annee: 2008, source: "https://faolex.fao.org/docs/pdf/tog85011.pdf"}
  - {instrument: "Arrêté n° 060/MERF/SG/DRF du 13 juin 2016 définissant la procédure de création ou d'attribution et la gestion des forêts communautaires au Togo", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/Tog185042.pdf"}
  - {instrument: "Arrêté n° 059/MERF/SG/DRF du 13 juin 2016 fixant le canevas de charte de gestion des forêts communautaires", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/Tog184989.pdf"}
  - {instrument: "Arrêté n° 058/MERF/SG/DRF du 13 juin 2016 fixant le canevas de convention de gestion des forêts communautaires", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/Tog184988.pdf"}
  - {instrument: "Arrêté n° 057/MERF/SG/DRF du 13 juin 2016 définissant le canevas de plan simple de gestion des forêts communautaires", nature: "loi", annee: 2016, source: "https://faolex.fao.org/docs/pdf/Tog185043.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Toute forêt communautaire est portée par une entité juridique (comité villageois de développement, comité cantonal de développement, association villageoise de gestion des aires protégées ou leurs unions) qui la gère au nom et pour le compte de la communauté et lui rend compte au moins une fois par an (arrêté n° 060 de 2016, art. 6 et 26) ; l'administration forestière contrôle la gestion, organise un suivi annuel et peut refuser le renouvellement en cas de non-respect de la charte ou de la convention (art. 15 et 25).", source: "https://faolex.fao.org/docs/pdf/Tog185042.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La charte est l'ensemble des règles qui organisent les droits et devoirs des membres de la communauté ; elle fixe les modalités de gestion, de suivi, de contrôle et les sanctions (arrêté n° 059 de 2016, art. 2, 4 et 11) ; la communauté rédige la charte, mais celle-ci est approuvée par le ministre et certifiée par le préfet (arrêté n° 060, art. 10, 12 et 19).", source: "https://faolex.fao.org/docs/pdf/Tog184989.pdf"}
  justice_propre: {valeur: "partiel", note: "La charte ou la convention précise les modes de règlement des litiges et les sanctions applicables (arrêté n° 059 de 2016, art. 11 et 13 ; arrêté n° 060, art. 30) ; les infractions constatées dans la forêt sont dénoncées à l'administration forestière locale, qui les poursuit et les réprime (arrêté n° 060, art. 29).", source: "https://faolex.fao.org/docs/pdf/Tog185042.pdf"}
  terres: {valeur: "partiel", note: "La « création » est le processus par lequel l'administration forestière reconnaît à une communauté la propriété d'une forêt communautaire sur les terres lui appartenant ou appartenant à des particuliers ; l'« attribution » confie à la communauté une forêt du domaine de l'État pour sa gestion, par une convention de deux ans puis de quinze ans renouvelables (arrêté n° 060 de 2016, art. 2 et 12) ; le Code forestier assimile les communautés rurales ou de base aux particuliers, titulaires d'un domaine forestier (loi n° 2008-09, art. 24 et 25).", source: "https://faolex.fao.org/docs/pdf/Tog185042.pdf"}
  ressources: {valeur: "partiel", note: "L'exploitation se fait directement par la communauté ou par contrat d'exploitation, selon des documents de planification approuvés par l'administration forestière qui organisent les droits d'usage traditionnels, l'exploitation et la destination des revenus (arrêté n° 060 de 2016, art. 20 et 22) ; la charte ou la convention fixe la clé de répartition des bénéfices (arrêté n° 059, art. 10 ; arrêté n° 058, art. 10) ; les particuliers exploitent librement leurs forêts (loi n° 2008-09, art. 45).", source: "https://faolex.fao.org/docs/pdf/Tog185042.pdf"}
  consentement: {valeur: "partiel", note: "La création ou l'attribution suppose la recherche du consensus au sein de la communauté et une réunion de concertation annoncée trente jours à l'avance (arrêté n° 060 de 2016, art. 4 et 5) ; le classement d'un terrain dans le domaine forestier de l'État comporte une reconnaissance des droits d'usage avec les représentants des villages, une consultation publique et un examen des réclamations des populations riveraines (loi n° 2008-09, art. 11, 12 et 16) ; aucun consentement préalable n'est exigé.", source: "https://faolex.fao.org/docs/pdf/tog85011.pdf"}
