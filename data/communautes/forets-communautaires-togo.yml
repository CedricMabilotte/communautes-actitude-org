effectivite: {valeur: "partielle", note: "Une étude de 2023 (université de Lomé, Institut national de formation agricole de Tové et ministère de l'Environnement) recense 171 forêts communautaires ; 43 ont franchi toutes les étapes de création et sont enregistrées par le ministère, dont 69 % en 2022 ; 48 % des forêts sont décrites comme moyennement dégradées, environ 70 % comme constamment brûlées, et sept préfectures sur 39 n'ont aucune initiative de foresterie communautaire.", source: "https://www.agrimaroc.org/index.php/Actes_IAVH2/article/view/1426"}
chronologie:
  - {annee: 2008, evenement: "Code forestier (loi n° 2008-09 du 19 juin 2008) : les communautés rurales ou de base sont assimilées aux particuliers."}
  - {annee: 2014, evenement: "Cinquième rapport national à la Convention sur la diversité biologique : une dizaine de forêts communautaires constituées entre 2010 et 2013."}
  - {annee: 2016, evenement: "Arrêtés n° 057 à 060 du 13 juin 2016 : procédure de création ou d'attribution, canevas de charte, de convention et de plan simple de gestion."}
  - {annee: 2022, evenement: "Année d'enregistrement de 69 % des forêts communautaires enregistrées par le ministère."}
  - {annee: 2023, evenement: "Recensement de 171 forêts communautaires (65 719 ha), dont 43 enregistrées."}
