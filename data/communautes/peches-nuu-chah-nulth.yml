effectivite: {valeur: "partielle", note: "Les cinq nations pêchent et vendent du poisson depuis 2019 dans le cadre de plans de gestion de Pêches et Océans Canada. En 2024, leur pêche a capturé 17 267 saumons chinook sur la côte ouest de l'île de Vancouver, contre 47 656 pour la pêche récréative et 24 154 pour la pêche commerciale à la traîne, selon les chiffres de la Commission du saumon du Pacifique cités par Ha-Shilth-Sa, journal du Nuu-chah-nulth Tribal Council (3 février 2026). Les nations contestent les allocations ; la révision de la Politique de répartition du saumon de Pêches et Océans Canada, engagée après le jugement de 2018, était en cours en 2026. En 2014, le Rapporteur spécial des Nations unies relevait que les Nuu-chah-nulth n'avaient eu accès qu'à une faible part de la pêche pendant le litige (A/HRC/27/52/Add.2, par. 64).", source: "https://www.hashilthsa.com/news/2026-02-03/canada-must-bring-policy-line-law-salmon-allocation-revision-faces-scrutiny"}
chronologie:
  - {annee: 2009, evenement: "La Cour suprême de la Colombie-Britannique déclare le droit ancestral de pêcher toutes espèces et de vendre le poisson (2009 BCSC 1494)."}
  - {annee: 2011, evenement: "La Cour d'appel de la Colombie-Britannique confirme pour l'essentiel le jugement de 2009 (2011 BCCA 237, 18 mai)."}
  - {annee: 2012, evenement: "La Cour suprême du Canada renvoie l'affaire à la Cour d'appel pour réexamen à la lumière de l'arrêt Lax Kw'alaams (29 mars)."}
  - {annee: 2013, evenement: "La Cour d'appel confirme le droit et en exclut la panope (2013 BCCA 300)."}
  - {annee: 2014, evenement: "La Cour suprême du Canada rejette la demande d'autorisation d'appel du Canada (30 janvier)."}
  - {annee: 2018, evenement: "Jugement de la Cour suprême de la Colombie-Britannique sur la justification des atteintes : la Politique de répartition du saumon est jugée une atteinte injustifiée en ce qu'elle donne priorité à la pêche récréative pour le saumon chinook et coho."}
  - {annee: 2019, evenement: "Premier accord progressif de réconciliation sur les ressources halieutiques (10 septembre)."}
  - {annee: 2021, evenement: "La Cour d'appel juge injustifiées plusieurs restrictions fédérales (2021 BCCA 155, 19 avril) ; Pêches et Océans Canada renonce à se pourvoir (juin)."}
  - {annee: 2024, evenement: "Accord progressif de réconciliation sur les ressources halieutiques de deux ans (25 septembre) : plan de pêche communautaire à des fins économiques et zone de pêche étendue à une partie plus large des ha-ha-houlthee (territoires de gouvernance traditionnelle)."}
fiabilite:
  verifie: ["Liste des cinq nations, zone définie par le tribunal à neuf milles marins, autorisation sous le DORS/93-332, désignation des pêcheurs et bateaux par les nations, consultation (plan de gestion 2023-2024 de Pêches et Océans Canada, sections 1, 7, 8 et 13).", "Déclaration de 2009, exclusion de la panope, accord de 2019, plan de gestion de 2022 et réévaluation des allocations de crabe après 2021 (note d'information de Pêches et Océans Canada au Sénat, 2022).", "Renvoi du 29 mars 2012 et rejet de l'autorisation d'appel le 30 janvier 2014 (registre de la Cour suprême du Canada, dossier 34387 ; Ha-Shilth-Sa, 30 janvier 2014).", "Absence de pourvoi contre 2021 BCCA 155 (Nuu-chah-nulth Tribal Council, 24 juin 2021).", "Accord du 25 septembre 2024 et rôle des Ha'wiih et dirigeants élus (communiqué de Pêches et Océans Canada).", "Populations inscrites des cinq nations (Profils des Premières Nations, septembre 2026, numéros de bande 659, 660, 661, 630, 634).", "Par. 64 du rapport A/HRC/27/52/Add.2.", "Art. 35 de la Loi constitutionnelle de 1982 (Site Web de la législation)."]
