resume: >-
  Cinq nations nuu-chah-nulth de la côte ouest de l'île de Vancouver (Ahousaht, Ehattesaht/Chinehkint, Hesquiaht, Mowachaht/Muchalaht et Tla-o-qui-aht) détiennent un droit ancestral (droit d'un peuple autochtone fondé sur ses pratiques antérieures au contact avec les Européens), protégé par l'article 35 de la Loi constitutionnelle de 1982, de pêcher toutes les espèces sauf la panope et de vendre le poisson dans leurs territoires de pêche, jusqu'à neuf milles marins au large. La Cour suprême de la Colombie-Britannique a déclaré ce droit en 2009 ; la Cour d'appel l'a confirmé en 2011 puis, après renvoi par la Cour suprême du Canada, en 2013 ; la Cour suprême du Canada a refusé d'entendre l'appel du Canada en 2014. En 2021, la Cour d'appel a jugé injustifiées plusieurs atteintes au droit causées par la réglementation fédérale ; le Canada n'a pas formé de pourvoi. La pêche, appelée T'aaq-wiihak (« pêcher avec la permission des Ha'wiih », les chefs héréditaires), est autorisée par Pêches et Océans Canada sous un permis de pêche communautaire, les nations désignant les pêcheurs et les bateaux. Un Accord progressif de réconciliation sur les ressources halieutiques a été signé le 25 septembre 2024.
