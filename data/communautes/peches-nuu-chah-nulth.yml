reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de mission au Canada du Rapporteur spécial James Anaya (A/HRC/27/52/Add.2, 2014), par. 64 : le litige de la nation nuu-chah-nulth sur un droit ancestral de pêche commerciale a duré douze ans, dont trois ans de procès et des appels successifs, et les Nuu-chah-nulth n'ont eu accès entre-temps qu'à une faible part de la pêche.", annee: 2014, source: "https://www.ohchr.org/Documents/Issues/IPeoples/SR/A.HRC.27.52.Add.2-MissionCanada_AUV.pdf"}
  - {mecanisme: "dnudpa", detail: "Le Canada a adopté en 2021 la Loi sur la Déclaration des Nations Unies sur les droits des peuples autochtones : la loi a pour objet de confirmer que la Déclaration constitue un instrument international universel en matière de droits de la personne qui « trouve application en droit canadien » (art. 4) et les peuples autochtones s'entendent au sens du paragraphe 35(2) de la Loi constitutionnelle de 1982 (art. 2).", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/TexteComplet.html"}
base_nationale:
  - {instrument: "Loi constitutionnelle de 1982, art. 35 (droits existants, ancestraux ou issus de traités, des peuples autochtones du Canada)", nature: "constitution", annee: 1982, source: "https://laws-lois.justice.gc.ca/fra/const/page-12.html"}
  - {instrument: "Ahousaht Indian Band and Nation c. Canada (Procureur général), 2009 BCSC 1494, confirmé par 2011 BCCA 237 puis, après renvoi de la Cour suprême du Canada (29 mars 2012), par 2013 BCCA 300 (demande d'autorisation d'appel rejetée par la Cour suprême du Canada le 30 janvier 2014) ; jugement de 2018 de la Cour suprême de la Colombie-Britannique et 2021 BCCA 155 (justification des atteintes)", nature: "jurisprudence", annee: 2009, source: "https://www.woodwardandcompany.com/news/ahousaht-indian-band-and-nation-v-canada-2021-bcca-155-summary/"}
