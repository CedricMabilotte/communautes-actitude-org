droits:
  autogouvernement: {valeur: "partiel", note: "Les cinq nations désignent les membres et les bateaux autorisés à pêcher dans le cadre du permis délivré par Pêches et Océans Canada ; seuls les membres des cinq nations peuvent participer (plan de gestion 2023-2024, sections 7, 7.1 et 7.2). L'Accord de 2024 reconnaît que les nations, par leurs Ha'wiih (dirigeants héréditaires) et leurs dirigeants élus, ont un rôle à jouer dans la gestion des pêches de leurs territoires (communiqué de Pêches et Océans Canada, 25 septembre 2024).", source: "https://waves-vagues.dfo-mpo.gc.ca/library-bibliotheque/41096605.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Droit ancestral, déclaré en 2009 (2009 BCSC 1494) et confirmé en 2013 (2013 BCCA 300), de pêcher toutes les espèces sauf la panope et de vendre le poisson dans les territoires de pêche jusqu'à neuf milles marins ; pêche non exclusive. Pêches et Océans Canada fixe les parts par espèce dans un plan de gestion annuel (saumon, poisson de fond, crabe, crevette, pouce-pied, concombre de mer en 2023-2024), dont les nations contestent qu'il mette pleinement en œuvre leur droit et respecte les jugements (préambule du plan).", source: "https://waves-vagues.dfo-mpo.gc.ca/library-bibliotheque/41096605.pdf"}
  consentement: {valeur: "partiel", note: "Toute atteinte au droit doit être justifiée par le Canada : en 2021, la Cour d'appel de la Colombie-Britannique (2021 BCCA 155) a modifié le jugement de 2018 pour déclarer injustifiées les atteintes touchant la pêche du crabe (Ahousaht) et de la crevette (Mowachaht/Muchalaht et Ehattesaht), et a étendu à toute la flotte des nations l'atteinte injustifiée que constitue leur exclusion d'un couloir situé entre un et cinq milles de la côte. Pêches et Océans Canada consulte les cinq nations sur chaque plan de gestion (plan 2023-2024, section 13). Il s'agit d'une obligation de consultation et de justification, pas d'un consentement.", source: "https://www.woodwardandcompany.com/news/ahousaht-indian-band-and-nation-v-canada-2021-bcca-155-summary/"}
  langue: {valeur: "non_applicable", note: "", source: ""}
