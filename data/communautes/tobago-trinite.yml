resume: >-
  Tobago est l'une des deux îles principales de la république de Trinité-et-Tobago, au nord-est de Trinité. La Constitution (chapitre 11A, art. 141A à 141D) prévoit une Assemblée de Tobago (Tobago House of Assembly), un Conseil exécutif dirigé par un Chief Secretary (secrétaire en chef, chef de l'exécutif de l'île) et un fonds propre. La loi de 1996 sur l'Assemblée (chap. 25:03) lui confie la conduite des politiques publiques dans 32 domaines énumérés et un 33e ouvert par décret présidentiel, dont les terres domaniales, le tourisme, l'agriculture, la pêche, la santé et l'éducation. L'Assemblée compte quinze membres élus depuis 2021, quatre conseillers nommés et un président de séance ; elle n'adopte pas de lois elle-même et ne peut créer aucun impôt, mais propose au Parlement national des projets de loi dans ses domaines. Les projets de révision constitutionnelle sur l'autonomie de Tobago déposés en 2018 et en 2020 n'ont pas abouti.
