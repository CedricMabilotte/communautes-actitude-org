  - {instrument: "Tobago House of Assembly (Amendment) Act, loi n° 1 de 2026 : suppression du plafond de sept secrétaires et quorum porté à douze membres", nature: "loi", annee: 2026, source: "https://www.ttparliament.org/wp-content/uploads/2026/01/a2026-001.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Assemblée de Tobago et Conseil exécutif prévus par la Constitution (art. 141A et 141C) ; la loi de 1996 fixe l'Assemblée à des membres élus, quatre conseillers nommés (trois sur avis du Chief Secretary, un sur avis du chef de la minorité) et un président de séance (art. 5 et 9) ; les élus désignent le Chief Secretary, et le Conseil exécutif est responsable devant l'Assemblée, qui peut voter une motion de défiance (art. 8, 34 et 35) ; le nombre d'élus est passé de douze à quinze (loi n° 2 de 2021, art. 4).", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'Assemblée adopte des projets de loi dans ses domaines de compétence, transmis au Conseil des ministres pour dépôt au Parlement, qui seul les adopte comme « Assembly Laws » (lois d'Assemblée) ; ces projets ne peuvent ni modifier ni contredire une loi nationale, ni créer d'impôt (loi de 1996, art. 29) ; l'Assemblée fixe son règlement intérieur (art. 69).", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Toutes les terres et biens de l'État situés à Tobago, sauf les résidences du président et du Premier ministre, sont dévolus à l'Assemblée « au nom de la République » (loi de 1996, art. 54) ; les terres domaniales et l'urbanisme figurent parmi ses domaines (5e annexe, points 2 et 15) ; les expropriations figurent parmi les services que l'État continue d'assurer à Tobago par son service du cadastre (Lands and Surveys Department, 7e annexe, point 20).", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  ressources: {valeur: "partiel", note: "L'Assemblée conduit la politique de l'agriculture, de la pêche, des forêts, de l'environnement et des parcs terrestres et marins (loi de 1996, 5e annexe, points 3, 11, 12, 14 et 20) ; une loi d'Assemblée ne s'applique pas au-delà de l'île et d'une bande de six milles marins mesurée depuis ses lignes de base (art. 4(b)) ; la loi ne mentionne ni les hydrocarbures ni le sous-sol.", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  consentement: {valeur: "partiel", note: "Les organismes publics et entreprises d'État qui fournissent des services à Tobago agissent selon les politiques de l'Assemblée (loi de 1996, art. 25(3)) ; le gouvernement tient « dûment compte » des vues de l'Assemblée pour les services nationaux rendus à Tobago (art. 26(3)) ; le Premier ministre et le Chief Secretary tiennent des discussions régulières (art. 31) ; la date des élections est fixée après consultation du Chief Secretary (art. 22(2)).", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'éducation, y compris les programmes scolaires, figure parmi les domaines de l'Assemblée (loi de 1996, 5e annexe, point 25), dans le cadre des lois nationales que l'Assemblée ne peut modifier (art. 29(4)).", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  fiscalite: {valeur: "partiel", note: "Fonds de l'Assemblée alimenté par les crédits votés par le Parlement et les recettes que l'Assemblée perçoit légalement (Constitution, art. 141D) ; l'Assemblée vote un projet de budget soumis au Conseil des ministres, qui alloue les ressources (loi de 1996, art. 41 et 43) ; les recettes publiques perçues à Tobago sont versées au fonds et déduites de la dotation ; si elles dépassent la dotation, l'Assemblée garde la moitié de l'excédent, ou une part plus élevée fixée par arrêté du ministre des Finances (art. 49 et 50) ; une commission de règlement des différends traite les litiges budgétaires (art. 56 à 61) ; aucun impôt ne peut être créé par l'Assemblée (art. 29(4)).", source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
  representation: {valeur: "reconnu", note: "La Constitution garantit à Tobago au moins deux circonscriptions à la Chambre des représentants (art. 70, et 2e annexe, règle 2) ; le Chief Secretary peut assister au Conseil des ministres sur invitation du Premier ministre, sans droit de vote (loi de 1996, art. 30).", source: "https://www.constituteproject.org/constitution/Trinidad_and_Tobago_2007?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "L'élection de 2021 à douze sièges a produit une égalité de six sièges contre six qui a empêché la constitution de l'Assemblée ; le Parlement a porté le nombre d'élus à quinze (loi n° 2 de 2021) avant un nouveau scrutin le 6 décembre 2021 ; l'élection du 12 janvier 2026, organisée par la commission électorale nationale dans quinze districts, a donné les quinze sièges au Tobago People's Party, avec une participation de 50,69 % (rapports de 2021 et de 2026 de l'Elections and Boundaries Commission, commission électorale indépendante prévue par la Constitution, art. 71).", source: "https://ebctt.com/wp-content/uploads/EBC-Report-THA-Elections-2026.pdf"}
chronologie:
  - {annee: 1768, evenement: "Première Assemblée de Tobago, à George Town, sous administration britannique."}
  - {annee: 1877, evenement: "Suppression du gouvernement représentatif et passage au régime de colonie de la Couronne."}
  - {annee: 1889, evenement: "Tobago est rattachée à Trinité par le gouvernement britannique."}
  - {annee: 1980, evenement: "Rétablissement de l'Assemblée de Tobago par la loi n° 37 de 1980."}
  - {annee: 1996, evenement: "Loi n° 40 de 1996 sur l'Assemblée de Tobago (sanctionnée le 9 décembre, en vigueur le 10 décembre), qui remplace la loi de 1980."}
  - {annee: 2018, evenement: "Dépôt du projet de révision constitutionnelle sur l'autonomie de Tobago (Tobago Self-Government Bill) le 9 mars ; il devient caduc en 2020."}
  - {annee: 2021, evenement: "Élection du 25 janvier : six sièges pour chacun des deux partis, Assemblée non constituée ; loi n° 2 de 2021 (quinze élus), proclamée le 26 juillet ; nouvelle élection le 6 décembre (14 sièges au Progressive Democratic Patriots, 1 au People's National Movement)."}
  - {annee: 2024, evenement: "Le 9 décembre, la Chambre des représentants rejette le projet de révision constitutionnelle sur l'autonomie de Tobago de 2020 : 21 voix pour, 16 contre, alors que la majorité des trois quarts était requise."}
  - {annee: 2026, evenement: "Élection du 12 janvier : 15 sièges sur 15 au Tobago People's Party ; loi n° 1 de 2026 (sanctionnée le 21 janvier) qui supprime le plafond de sept secrétaires au Conseil exécutif."}
