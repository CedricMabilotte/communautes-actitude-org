  - {instrument: "Tobago House of Assembly Act, loi n° 40 de 1996 (chap. 25:03), modifiée par les lois n° 4 de 2001 et n° 17 de 2006", nature: "statut_autonomie", annee: 1996, source: "https://ebctt.com/wp-content/uploads/Tobago-House-of-Assembly-Act-THA.pdf"}
