resume: >-
  Fiche agrégée : elle couvre les groupes de propriétaires coutumiers (lignées, familles, clans) qui détiennent la terre du Vanuatu, les assemblées coutumières (nakamals) et les conseils des chefs. La Constitution de 1980 attribue toute la terre de la République aux propriétaires coutumiers autochtones et à leurs descendants (art. 73), fait des règles coutumières le fondement de la propriété et de l'usage du sol (art. 74) et institue un Conseil national des chefs, le Malvatumauri, élu par les conseils de district des chefs (art. 29). La loi de 2013 sur la gestion des terres coutumières (Custom Land Management Act n° 33) confie aux nakamals et aux tribunaux fonciers des aires coutumières la détermination des propriétaires, par des décisions qui ne sont pas susceptibles d'appel. La même année, la réforme de la loi foncière a soumis toute négociation de bail sur terre coutumière au consentement libre, préalable et éclairé des propriétaires.
