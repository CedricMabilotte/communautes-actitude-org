droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil national des chefs (Malvatumauri) est composé de chefs coutumiers élus par leurs pairs réunis en conseils de district (Constitution, art. 29) ; la loi de 2013 reconnaît les nakamals, définis comme le siège de gouvernement coutumier d'une zone (art. 2), et confie aux conseils des chefs d'île la supervision de la détermination des propriétaires (art. 7). Le Conseil national discute des questions de coutume et formule des recommandations (Constitution, art. 30) ; il n'a pas de pouvoir législatif.", source: "https://faolex.fao.org/docs/pdf/van150052.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le droit coutumier reste en vigueur comme partie du droit de la République (Constitution, art. 95 (3)) et les règles coutumières fondent la propriété et l'usage du sol (art. 74) ; en l'absence de règle de droit, le juge statue autant que possible conformément à la coutume (art. 47 (1)). Le Malvatumauri formule des recommandations sans pouvoir normatif propre (art. 30).", source: "https://www.constituteproject.org/constitution/Vanuatu_1983"}
  justice_propre: {valeur: "partiel", note: "Les nakamals, qui décident par consensus selon la coutume de l'aire (art. 17 et 25 de la loi de 2013, renumérotés en 2014), et les tribunaux fonciers des aires coutumières, composés de chefs et de personnes versées dans la coutume (art. 34 à 39), déterminent les propriétaires ; leurs décisions enregistrées lient en droit et ne sont susceptibles ni d'appel ni de recours devant un tribunal (art. 1 (2)), sauf révision par un tribunal insulaire foncier (Island Court (Land)) pour composition irrégulière, vice de procédure ou fraude (art. 45), elle-même soumise à un contrôle limité de la Cour suprême (art. 47) ; depuis 2014, la décision d'un tribunal d'aire est définitive (art. 34 (8)). La compétence se limite aux litiges sur la terre coutumière ; la Constitution prévoit aussi des tribunaux de village ou d'île compétents en matière coutumière (art. 52).", source: "https://faolex.fao.org/docs/pdf/van150052.pdf"}
  terres: {valeur: "reconnu", note: "Toute la terre de la République appartient aux propriétaires coutumiers autochtones et à leurs descendants (Constitution, art. 73) ; seuls les citoyens autochtones ayant acquis leur terre selon un régime foncier reconnu en ont la propriété perpétuelle (art. 75). La loi de 2013 pose en règle générale que toute la terre est détenue par les propriétaires coutumiers en groupe (art. 6 (2)). Les non-citoyens n'accèdent à la terre que par bail ; l'État peut acquérir de la terre dans l'intérêt public (Constitution, art. 80).", source: "https://www.constituteproject.org/constitution/Vanuatu_1983"}
  ressources: {valeur: "partiel", note: "La loi de 2013 s'étend aux eaux comprises jusqu'au bord extérieur des récifs adjacents à la terre coutumière, et au sol sous ces eaux, dans la mesure où la coutume les attribue aux propriétaires (art. 3). Depuis 2010, l'enregistrement d'une aire de conservation communautaire suppose le consentement préalable des propriétaires coutumiers (art. 35 de la loi sur la gestion et la conservation de l'environnement, devenue loi sur la protection et la conservation de l'environnement, modifié par la loi n° 28 de 2010). Aucun texte ouvert n'attribue aux propriétaires le sous-sol.", source: "https://faolex.fao.org/docs/pdf/van150052.pdf"}
  consentement: {valeur: "reconnu", note: "Nul ne peut négocier avec des propriétaires coutumiers sans certificat de négociateur (loi sur la réforme foncière, art. 6, modifié en 2013) ; le rapport de consultation indique si les propriétaires ont donné leur consentement libre, préalable et éclairé (art. 6D et 6E), l'accord du groupe se forme par consensus (art. 6F), et le refus des propriétaires est définitif et ne peut être écarté ni par le comité ni par le ministre (art. 6C (8)). Toute transaction foncière entre autochtones et non-autochtones reste soumise à l'accord du gouvernement (Constitution, art. 79).", source: "https://faolex.fao.org/docs/pdf/van150054.pdf"}
  langue: {valeur: "partiel", note: "Le bichelamar (bislama) est la langue nationale et l'une des trois langues officielles ; l'État protège les langues locales comme partie du patrimoine national (Constitution, art. 3). Le Malvatumauri fait des recommandations pour la préservation des langues (art. 30).", source: "https://www.constituteproject.org/constitution/Vanuatu_1983"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le Malvatumauri peut être consulté sur les projets de loi (Constitution, art. 30) et la loi foncière nationale qui met en œuvre les art. 73 à 75 est adoptée après consultation du Conseil (art. 76), et un représentant désigné par le Conseil siège à la Commission du service judiciaire (art. 48). Les conseils de gouvernement local comprennent des représentants des chefs (art. 83) ; ces chefs, nommés par le ministre sur proposition des organes représentatifs des chefs, n'ont pas de voix délibérative (loi sur la décentralisation, art. 7). Aucun siège n'est réservé au Parlement.", source: "https://www.constituteproject.org/constitution/Vanuatu_1983"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une analyse publiée par Devpolicy (Australian National University) en octobre 2024 indique qu'environ 97 % de la terre est sous régime coutumier, dont une part significative est louée, que la loi de 2013 a retiré au ministre le pouvoir de passer outre les décisions coutumières, et que le bureau de gestion des terres coutumières a fait l'objet en 2023 d'allégations de corruption et de nombreux recours pour manipulation des procédures coutumières. Les statistiques annuelles des déterminations que la loi impose de publier au Journal officiel (art. 10 (3) à (5)) n'ont pas été trouvées.", source: "https://devpolicy.org/the-future-of-land-management-in-vanuatu-20241022/"}
chronologie:
  - {annee: 1976, evenement: "Création en juillet d'un conseil des chefs de 20 membres, présidé par Willie Bongmatur, sous le condominium franco-britannique des Nouvelles-Hébrides."}
  - {annee: 1980, evenement: "Indépendance : la Constitution rend la terre aux propriétaires coutumiers (art. 73 à 75) et institue le Conseil national des chefs (art. 29 à 31)."}
  - {annee: 2001, evenement: "Loi sur les tribunaux fonciers coutumiers (Customary Land Tribunal Act, chap. 271) : tribunaux de village, de sous-aire, d'aire et d'île."}
  - {annee: 2010, evenement: "Modification de la loi sur la gestion et la conservation de l'environnement : aires de conservation communautaires enregistrées avec le consentement des propriétaires coutumiers."}
  - {annee: 2013, evenement: "Loi n° 33 sur la gestion des terres coutumières (nakamals et tribunaux fonciers des aires coutumières), loi n° 31 modifiant la loi sur la réforme foncière (consentement libre, préalable et éclairé) et loi n° 34 abrogeant la loi de 2001 (entrée en vigueur en février 2014)."}
  - {annee: 2014, evenement: "Lois n° 11 et n° 12 modifiant la loi sur la réforme foncière et la loi sur la gestion des terres coutumières (décision définitive du tribunal d'aire coutumière)."}
  - {annee: 2023, evenement: "Allégations de corruption visant le bureau de gestion des terres coutumières et recours contre des déterminations (Devpolicy, 2024)."}
fiabilite:
  verifie: ["Art. 3, 29 à 31, 47 (1), 48, 52, 73 à 80, 82, 83 et 95 (3) de la Constitution (Constitute Project, version de 1980 révisée en 1983).", "Texte de la loi n° 33 de 2013 sur la gestion des terres coutumières, art. 1 à 10, 15 à 19, 25, 34 à 45, 50 à 54, 60 et 61 (FAOLEX).", "Texte de la loi n° 31 de 2013 modifiant la loi sur la réforme foncière, art. 6 à 6H (FAOLEX).", "Texte des lois n° 11 et n° 12 de 2014 modifiant la loi sur la réforme foncière et la loi sur la gestion des terres coutumières (FAOLEX) : elles ne touchent pas aux art. 6C (8) à 6F ni aux art. 1, 3 et 45.", "Art. 7 de la loi sur la décentralisation (édition consolidée de 2006, FAOLEX).", "Modification de l'art. 35 par la loi n° 28 de 2010 modifiant la loi sur la gestion et la conservation de l'environnement (FAOLEX).", "Population ni-vanuatu (291 035) et population totale (300 019) au recensement de 2020, superficie terrestre de 12 281 km² (Bureau national de la statistique du Vanuatu).", "Date de 2001 et abrogation en 2013 de la loi sur les tribunaux fonciers coutumiers (ECOLEX)."]
  non_confirme: ["Numérotation et teneur des articles : la Constitution a été modifiée depuis 1983 (la loi de 2013 renvoie à l'art. 78 pour le caractère définitif des décisions coutumières) ; les numéros suivent la version publiée par Constitute Project, sans comparaison avec la version consolidée officielle (PacLII inaccessible).", "La loi modifiant la loi sur la réforme foncière porte le n° 31 en titre et le n° 32 en pied de page dans le texte publié par FAOLEX.", "Part des terres coutumières (97 %) : chiffre cité par Devpolicy, sans document officiel ouvert, d'où une surface limitée à la superficie terrestre totale.", "Nombre d'aires coutumières, de nakamals et de déterminations enregistrées : aucune liste officielle publique trouvée, d'où l'absence de tableau des sites.", "Loi sur le Conseil national des chefs (2006) et loi sur les tribunaux insulaires (chap. 167) : textes non consultés (PacLII inaccessible).", "Date de création du Malvatumauri : juillet 1976 selon une encyclopédie en ligne ; source primaire non consultée.", "Aucun document onusien nommant le régime foncier coutumier du Vanuatu n'a été trouvé ; le cinquième rapport national à la Convention sur la diversité biologique mentionne les aires de conservation communautaires sans viser le régime des terres coutumières.", "Vote du Vanuatu sur la Déclaration des Nations unies sur les droits des peuples autochtones (2007) : non vérifié."]
