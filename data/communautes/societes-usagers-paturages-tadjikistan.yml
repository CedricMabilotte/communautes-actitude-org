effectivite: {valeur: "partielle", note: "Selon le rapport d'achèvement de la Banque mondiale de 2018, le projet de gestion environnementale des terres a créé huit unions d'usagers des pâturages dans le cadre de la loi de 2013, aucune union formelle n'existant au début du projet ; à la clôture, une seule avait obtenu des droits sur des pâturages et d'autres négociaient des locations de longue durée avec les districts, l'absence de droits fonciers limitant la collecte des cotisations. En 2021, le projet de restauration des paysages de la Banque mondiale prévoyait de financer jusqu'à 70 plans de gestion des pâturages mis en œuvre par ces unions.", source: "https://documents.worldbank.org/curated/en/183461545337753103/pdf/icr00004451-12172018-636808536685094337.pdf"}
chronologie:
  - {annee: 1994, evenement: "La Constitution fait de la terre la propriété exclusive de l'État (article 13)."}
  - {annee: 2013, evenement: "Loi n° 951 du 19 mars « sur les pâturages », qui prévoit les sociétés d'usagers des pâturages."}
  - {annee: 2018, evenement: "Clôture d'un projet de la Banque mondiale qui a créé huit unions d'usagers des pâturages ; une seule a obtenu des droits sur des pâturages."}
  - {annee: 2019, evenement: "Loi n° 1618 du 20 juin « sur les pâturages », qui abroge la loi de 2013 et définit la société d'usagers des pâturages comme association qui s'administre elle-même."}
fiabilite:
  verifie:
    - "Définition de la société d'usagers des pâturages (article 1), enregistrement par les organes d'autonomie locale des bourgs et villages (article 11), location par contrat (articles 16 et 19), élection du responsable (article 19), composition et pouvoirs de la commission (article 20), loyer versé au budget local (article 24), abrogation de la loi n° 951 du 19 mars 2013 (article 31) : texte russe de la loi n° 1618 publié par CAWater-Info."
    - "Article 13 de la Constitution : Constitute Project."
    - "Huit unions créées, une seule dotée de droits sur des pâturages à la clôture en 2018 : rapport d'achèvement de la Banque mondiale."
    - "Prévision de 70 plans de gestion des pâturages par les unions : cadre de réinstallation du projet RESILAND CA+ (2021)."
  non_confirme:
    - "Texte officiel publié au journal du Madjlisi Oli pour la loi n° 1618 : seule une copie russe hébergée par CAWater-Info a été lue."
    - "Nombre de sociétés d'usagers des pâturages enregistrées, de contrats de location signés et surface louée : aucune source trouvée ; pas de liste officielle des sites."
    - "Modifications de la loi n° 1618 après 2019 : non vérifiées."
    - "Le rapport de 2018 emploie tantôt « unions », tantôt « groupes » d'usagers des pâturages pour la même forme juridique."
