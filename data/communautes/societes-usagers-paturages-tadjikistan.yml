base_nationale:
  - {instrument: "Constitution de la République du Tadjikistan (1994, modifiée en 2016), article 13 : la terre et ses ressources, l'eau, l'espace aérien, la faune, la flore et les autres ressources naturelles sont la propriété exclusive de l'État", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Tajikistan_2016?lang=en"}
  - {instrument: "Loi n° 1618 du 20 juin 2019 « sur les pâturages », articles 1, 11, 16, 17, 19, 20, 24 et 28", nature: "loi", annee: 2019, source: "https://www.cawater-info.net/library/rus/tj-1618-2019.pdf"}
  - {instrument: "Loi n° 951 du 19 mars 2013 « sur les pâturages » (abrogée en 2019 par l'article 31 de la loi n° 1618)", nature: "loi", annee: 2013, source: "https://base.spinform.ru/show_doc.fwx?rgn=59051"}
droits:
  autogouvernement: {valeur: "partiel", note: "La société d'usagers des pâturages est une association à but non lucratif qui s'administre elle-même (loi n° 1618 de 2019, article 1) ; elle agit selon ses statuts et un contrat avec ses membres, qui élisent son responsable, lequel exerce ses pouvoirs dans le cadre des décisions des assemblées des membres (article 19.4 et 19.5) ; elle est enregistrée par les organes d'autonomie locale des bourgs et des villages (article 11).", source: "https://www.cawater-info.net/library/rus/tj-1618-2019.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La société fonctionne selon ses statuts et le contrat passé avec ses membres (loi n° 1618 de 2019, article 19.4) ; les plans annuels et pluriannuels d'usage, obligatoires pour les usagers, sont préparés par la commission de district où elle siège et approuvés par l'autorité exécutive locale (article 17.3 et 17.4).", source: "https://www.cawater-info.net/library/rus/tj-1618-2019.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La société demande un pâturage à l'autorité exécutive locale et le reçoit en location par contrat (loi n° 1618 de 2019, articles 16.3 et 19.3), pour une durée fixée par les plans d'usage (article 22.3) et contre un loyer versé au budget local (article 24) ; il s'agit d'un droit d'usage : la terre est la propriété exclusive de l'État (Constitution, article 13).", source: "https://www.cawater-info.net/library/rus/tj-1618-2019.pdf"}
  ressources: {valeur: "partiel", note: "Le locataire d'un pâturage l'exploite selon le contrat et les plans d'usage, organise le pâturage, peut sous-louer, doit respecter la capacité de charge (nombre de bêtes que le pâturage supporte sans se dégrader) et empêcher l'usage sans droit par des tiers (loi n° 1618 de 2019, article 23).", source: "https://www.cawater-info.net/library/rus/tj-1618-2019.pdf"}
  consentement: {valeur: "partiel", note: "Des représentants des sociétés d'usagers siègent dans la commission de régulation de l'usage des pâturages, créée par le madjlis (assemblée) des députés du peuple du district ou de la région, qui fixe les limites des pâturages, les durées d'usage, règle les litiges et prépare les plans d'usage (loi n° 1618 de 2019, article 20) ; les citoyens, directement ou par leurs associations civiles, peuvent participer à la préparation des décisions publiques sur la protection des pâturages (article 28.3) ; aucun texte trouvé ne prévoit de consentement préalable.", source: "https://www.cawater-info.net/library/rus/tj-1618-2019.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
