resume: >-
  Fiche agrégée : elle couvre les sociétés d'usagers des pâturages, associations que forment les éleveurs, les exploitations dekhkanes (exploitations agricoles familiales) et d'autres usagers pour coordonner l'usage des pâturages. La loi n° 1618 du 20 juin 2019 « sur les pâturages », qui remplace la loi n° 951 du 19 mars 2013, les définit comme des associations à but non lucratif qui s'administrent elles-mêmes (article 1). Une société reçoit des autorités locales un pâturage en location par contrat, l'exploite selon ses statuts et les plans annuels et pluriannuels d'usage, et élit son responsable (article 19) ; ses représentants siègent dans la commission de district ou de région qui fixe les limites des pâturages et les durées d'usage et prépare les plans (article 20). La terre reste propriété exclusive de l'État (Constitution, article 13). Aucun décompte national des sociétés n'a été trouvé.
