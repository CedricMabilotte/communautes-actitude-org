  - {instrument: "Code foncier de Kanesatake (art. 9 de la loi), ratifié le 14 octobre 2000", nature: "loi", annee: 2000, source: "https://lop.parl.ca/sites/PublicWebsite/default/fr_CA/ResearchPublications/LegislativeSummaries/371LS399E"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les attributions des Mohawks de Kanesatake sont exercées par le conseil de bande, le Mohawk Council of Kanesatake (art. 2 et 6 de la loi de 2001).", source: "https://laws-lois.justice.gc.ca/fra/lois/K-0.5/page-1.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Les Mohawks de Kanesatake légifèrent sur l'utilisation et la mise en valeur du territoire provisoire : zonage, construction, ordre public, faune et pêche, statut de résidant, eau, déchets, circulation (art. 7) ; leurs lois l'emportent sur les lois provinciales et les règlements municipaux incompatibles, mais les lois fédérales l'emportent sur elles (art. 17) ; le droit criminel et les relations de travail sont exclus (art. 7(3)).", source: "https://laws-lois.justice.gc.ca/fra/lois/K-0.5/page-1.html"}
  justice_propre: {valeur: "partiel", note: "Les Mohawks de Kanesatake peuvent nommer des juges de paix pour juger les infractions à leurs lois, selon une entente à conclure avec le Canada sur leur compétence, leur indépendance et l'appel (art. 16) ; ils peuvent aussi poursuivre ces infractions devant tout tribunal compétent (art. 15).", source: "https://laws-lois.justice.gc.ca/fra/lois/K-0.5/page-1.html"}
  terres: {valeur: "partiel", note: "Les terres du territoire provisoire hors Doncaster sont mises de côté à l'usage et au profit des Mohawks de Kanesatake et deviennent des « terres réservées pour les Indiens » (catégorie constitutionnelle de terres sous compétence fédérale) au sens de l'art. 91(24) de la Loi constitutionnelle de 1867, sans être une réserve au sens de la Loi sur les Indiens (art. 4) ; la loi ne reconnaît pas les droits ancestraux ou issus de traités et n'y porte pas atteinte (art. 3(2)).", source: "https://laws-lois.justice.gc.ca/fra/lois/K-0.5/page-1.html"}
  ressources: {valeur: "partiel", note: "La compétence législative couvre la protection et la gestion des ressources fauniques et halieutiques du territoire provisoire (art. 7(1) b) ; à défaut de normes fédérales, les normes environnementales mohawks doivent s'harmoniser avec les normes provinciales, sauf si elles sont plus sévères (art. 11).", source: "https://laws-lois.justice.gc.ca/fra/lois/K-0.5/page-1.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La compétence législative s'étend au statut de résidant sur le territoire provisoire (art. 7(1) e) ; la loi ne confère pas de compétence sur l'appartenance à la bande.", source: "https://laws-lois.justice.gc.ca/fra/lois/K-0.5/page-1.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le régime de 2001 est en vigueur. L'élection générale prévue le 2 août 2025 a été annulée la veille par le directeur des élections ; un conseil intérimaire de cinq chefs sortants, au mandat limité aux services essentiels et à l'administration, gouverne depuis une ordonnance de la Cour fédérale d'octobre 2025. Le 28 septembre 2026, la Cour fédérale (juge Sébastien Grammond) a jugé cette annulation déraisonnable et fixé le scrutin au 19 décembre 2026 (Radio-Canada, 29 septembre 2026) ; le conseil intérimaire reste chargé de l'administration jusqu'à l'entrée en fonction d'un nouveau conseil (The Eastern Door, 1er octobre 2026).", source: "https://easterndoor.com/article/election-date-finally-set"}
chronologie:
  - {annee: 1717, evenement: "La France concède la seigneurie du Lac-des-Deux-Montagnes aux Sulpiciens ; des Mohawks s'y établissent en 1721."}
  - {annee: 1945, evenement: "Le gouvernement fédéral achète les terres restantes des Sulpiciens, une série de parcelles séparées par des lots privés."}
  - {annee: 1990, evenement: "Crise d'Oka à partir du 11 juillet, autour d'un projet d'agrandissement de terrain de golf sur des terres revendiquées."}
  - {annee: 2000, evenement: "Ratification de l'entente et du code foncier par référendum le 14 octobre (239 voix pour, 237 contre) ; signature de l'entente le 21 décembre."}
  - {annee: 2001, evenement: "Sanction de la Loi sur le gouvernement du territoire provisoire de Kanesatake (14 juin)."}
  - {annee: 2008, evenement: "Le Canada accepte de négocier la revendication particulière sur la seigneurie (14 avril)."}
  - {annee: 2025, evenement: "Annulation, le 1er août, de l'élection générale prévue le 2 août ; la Cour fédérale autorise un conseil intérimaire le 16 octobre."}
  - {annee: 2026, evenement: "Le 28 septembre, la Cour fédérale juge l'annulation de l'élection déraisonnable et fixe le scrutin au 19 décembre."}
