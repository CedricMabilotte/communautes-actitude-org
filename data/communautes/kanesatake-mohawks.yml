resume: >-
  Les Kanien'kehá:ka (Mohawks) de Kanesatake vivent sur la rive nord du lac des Deux Montagnes, sur des terres morcelées au milieu de la municipalité d'Oka. Leur revendication sur l'ancienne seigneurie du Lac-des-Deux-Montagnes, à l'origine de la crise d'Oka de 1990, n'était pas réglée en 2020. L'Entente concernant l'exercice de pouvoirs gouvernementaux par Kanesatake sur son assise territoriale provisoire, signée en 2000, est mise en œuvre par la Loi sur le gouvernement du territoire provisoire de Kanesatake (L.C. 2001, ch. 8). Les Mohawks de Kanesatake y légifèrent, par leur conseil, sur l'utilisation et la mise en valeur des terres, sous réserve d'un code foncier adopté en 2000 ; la loi ne reconnaît pas les droits ancestraux et n'y porte pas atteinte (art. 3(2)).
