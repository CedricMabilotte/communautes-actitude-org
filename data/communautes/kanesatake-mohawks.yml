reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale de 2021 (L.C. 2021, ch. 14) la désigne dans son préambule comme une source d'interprétation du droit canadien et confirme qu'elle trouve application en droit canadien (art. 4) ; les peuples autochtones s'y entendent au sens du paragraphe 35(2) de la Loi constitutionnelle de 1982 (art. 2).", annee: 2021, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
