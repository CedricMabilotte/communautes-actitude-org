resume: >-
  Le gouvernement centrafricain considère les Aka, chasseurs-cueilleurs des forêts du sud-ouest, et les Mbororo, éleveurs pastoraux, comme les peuples autochtones du pays.
  La République centrafricaine est le premier État d'Afrique à avoir ratifié la Convention n° 169 de l'OIT (entrée en vigueur en août 2011) ; la Constitution de 2016 lui donnait une autorité supérieure à celle des lois (art. 94) et assurait une « protection renforcée » des droits des peuples autochtones (art. 6) ; elle a été remplacée par la Constitution promulguée le 30 août 2023.
  Le Code forestier de 2008 reconnaît des droits d'usage coutumiers gratuits sur le domaine forestier de l'État, une consultation préalable et l'accès aux forêts communautaires ; aucune loi n'établit de propriété foncière collective.
  Le rapport de la Commission africaine sur sa visite de 2007 cite un recensement d'ONG de 15 880 Aka dans la seule Lobaye (2004) et une estimation d'environ 300 000 Mbororo.
  Le régime des forêts communautaires relève de la fiche « Forêts communautaires de Centrafrique ».
reconnaissance_regionale:
  - {mecanisme: "commission_africaine", detail: "Visite de recherche et d'information du Groupe de travail sur les populations/communautés autochtones en Centrafrique (15-28 janvier 2007), rapport dont la Commission a pris note à sa 43e session (mai 2008) ; il identifie les Aka et les Mbororo comme peuples autochtones.", annee: 2008, source: "https://iwgia.org/images/publications/ACHPR_CAR_FRE.pdf"}
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La République centrafricaine a voté pour l'adoption de la Déclaration des Nations unies sur les droits des peuples autochtones en 2007 et considère les Mbororo et les Aka comme les peuples autochtones du pays.", annee: 2007, source: "https://www.ilo.org/fr/media/364646/download"}
  - {mecanisme: "oit_169", detail: "Convention n° 169 ratifiée par la République centrafricaine, premier pays d'Afrique à le faire, entrée en vigueur en août 2011 ; dans son premier rapport à l'OIT, le gouvernement désigne les Mbororo et les Aka comme peuples autochtones du pays.", annee: 2010, source: "https://www.ilo.org/fr/media/364646/download"}
base_nationale:
  - {instrument: "Constitution du 30 mars 2016, art. 6 (protection renforcée des droits des peuples autochtones) et art. 94 (primauté des traités ratifiés sur les lois) ; remplacée par la Constitution promulguée le 30 août 2023 (décret n° 23-199), dont le texte n'a pas été consulté", nature: "constitution", annee: 2016, source: "https://www.constituteproject.org/constitution/Central_African_Republic_2016"}
  - {instrument: "Loi n° 08.022 du 17 octobre 2008 portant Code forestier, art. 14 à 18, 33, 67 et 133 à 139", nature: "loi", annee: 2008, source: "https://www.ilo.org/fr/media/364646/download"}
  - {instrument: "Loi n° 63-441 du 9 janvier 1964 relative au domaine national, art. 3 et 38 (droit de jouissance des collectivités coutumières)", nature: "loi", annee: 1964, source: "https://www.ilo.org/fr/media/364646/download"}
  - {instrument: "Décret n° 07.293 du 11 octobre 2007 régissant le Conseil économique et social", nature: "loi", annee: 2007, source: "https://www.ilo.org/fr/media/364646/download"}
  - {instrument: "Décret n° 15.463 du 3 décembre 2015 fixant les modalités d'attribution et de gestion des forêts communautaires", nature: "loi", annee: 2015, source: "https://www.ilo.org/fr/media/364646/download"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Loi n° 63-441 du 9 janvier 1964 relative au domaine national, art. 3 et 38 : les collectivités titulaires de droits coutumiers conservent un droit de jouissance (droit d'utiliser la terre), l'État restant présumé propriétaire ; Code forestier de 2008, art. 15 : les droits coutumiers d'usage des peuples autochtones portent sur le sol forestier ; art. 18 : les peuples autochtones ne peuvent pas être expulsés des territoires qu'ils occupent avant la création d'une aire protégée. Selon l'OIT, ils ne peuvent pas être propriétaires de leurs terres.", source: "https://www.ilo.org/fr/media/364646/download"}
  ressources: {valeur: "partiel", note: "Code forestier de 2008, art. 14 et 15 : droits d'usage coutumiers, exercés à titre gratuit pour la subsistance, sur les produits de la forêt autres que le bois d'œuvre, hors espèces protégées ; art. 133 à 139 : forêts communautaires gérées par convention avec l'État, dont les produits appartiennent entièrement aux populations concernées (art. 139) ; décret n° 15.463 de 2015 : 5 000 hectares au plus par forêt communautaire.", source: "https://www.ilo.org/fr/media/364646/download"}
  consentement: {valeur: "partiel", note: "Code forestier de 2008, art. 33 et 67 : consultation préalable des populations riveraines, y compris les peuples autochtones, avant toute concession ; arrêté n° 09.021 de 2009, art. 30 et 32 : procès-verbal de consultation transmis au préfet et au ministre, sans règle de décision ; art. 18 du Code forestier : une réinstallation hors d'une aire protégée exige le consentement libre, préalable et éclairé des peuples autochtones. Hors de ce cas, aucune règle de consentement.", source: "https://www.ilo.org/fr/media/364646/download"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
