  representation: {valeur: "partiel", note: "Décret n° 07.293 du 11 octobre 2007 : les communautés mbororo et aka disposent chacune d'un représentant au Conseil économique et social, assemblée consultative (art. 130 de la Constitution de 2016) consultée sur les projets de loi de programme à caractère économique, social, culturel et environnemental.", source: "https://www.ilo.org/fr/media/364646/download"}
