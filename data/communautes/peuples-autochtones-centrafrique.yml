effectivite: {valeur: "partielle", note: "Selon le profil pays de l'OIT (2023), aucune loi ne reconnaît les formes de justice coutumière autochtones, les autorités coutumières des communautés voisines prévalent souvent, et le conflit ouvert en 2013 a bloqué les révisions législatives ; la limite de 5 000 hectares par forêt communautaire est jugée inférieure à l'étendue des terres coutumières.", source: "https://www.ilo.org/fr/media/364646/download"}
