droits:
  autogouvernement: {valeur: "reconnu", note: "Les organes de la province sont le Conseil provincial, la Junte provinciale (gouvernement) et le président, Statut, art. 47 ; le Conseil compte trente-cinq membres élus au suffrage universel direct pour cinq ans, art. 48.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "La province édicte des lois dans les matières énumérées à l'article 8 du Statut (compétence dite primaire) et, dans les limites de l'article 5, dans celles de l'article 9 ; une loi provinciale fixe la forme de gouvernement et le mode d'élection, art. 47.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Aménagement du territoire et urbanisme, paysage, usi civici (droits d'usage collectifs des habitants sur certaines terres), petites propriétés agricoles et communautés familiales régies par d'anciens statuts relèvent de la loi provinciale, Statut, art. 8, n° 5 à 8.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  ressources: {valeur: "partiel", note: "Mines, carrières, chasse, pêche, agriculture, forêts et petites et moyennes dérivations hydroélectriques relèvent de la loi provinciale, Statut, art. 8, n° 14, 15, 21 et 24 ; l'usage des eaux publiques relève de l'art. 9, n° 9, c'est-à-dire d'une législation dans les limites des principes fixés par les lois de l'État ; la loi provinciale fixe l'attribution, la durée et les redevances des concessions de grandes dérivations hydroélectriques, art. 13 ; la part de législation concurrente limite la valeur à « partiel », comme pour Bolzano.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  consentement: {valeur: "partiel", note: "Depuis la loi constitutionnelle n° 2 de 2026, les projets de modification du Statut sont soumis à l'intesa (accord) du Conseil régional et des Conseils provinciaux, à défaut de laquelle les Chambres statuent à la majorité absolue sans réduire l'autonomie acquise, Statut, art. 103 ; les décrets d'application sont pris après avis d'une commission paritaire où siègent deux membres du Conseil provincial de Trente, art. 107 ; le Parlement pouvant passer outre l'absence d'accord, il ne s'agit pas d'un veto.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  langue: {valeur: "partiel", note: "L'italien est la langue officielle ; dans les communes où l'on parle le ladin, le mochène ou le cimbre, l'enseignement de la langue et de la culture ladine ou allemande est garanti à l'école, et la toponymie et les traditions de ces populations sont protégées, Statut, art. 102.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  education: {valeur: "reconnu", note: "La province légifère sur l'école maternelle, l'aide scolaire, les bâtiments scolaires et la formation professionnelle, Statut, art. 8, n° 26 à 29, et sur l'enseignement primaire et secondaire dans les limites des principes fixés par les lois de l'État, art. 9, n° 2 ; elle légifère ainsi sur l'enseignement primaire et secondaire.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  fiscalite: {valeur: "reconnu", note: "La province peut instituer par la loi ses propres impôts et moduler les taux de certains impôts d'État, Statut, art. 73 ; elle reçoit les neuf dixièmes de la plupart des recettes fiscales de l'État perçues sur son territoire et les huit dixièmes de la TVA intérieure, art. 75.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le droit de vote aux élections provinciales de Trente est subordonné à une année de résidence ininterrompue dans la province, Statut, art. 25.", source: "https://www.edizionieuropee.it/LAW/HTML/19/zn41_07_086.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le rapport d'Eurac Research (2025) indique que, depuis 1972, les provinces de Bolzano et de Trente gèrent presque seules les relations avec l'État et ont négocié au sein des commissions paritaires près de 200 décrets d'application et plusieurs accords financiers.", source: "https://works.eurac.edu/Autonomy-Report-South-Tyrol-2025.pdf"}
chronologie:
  - {annee: 1919, evenement: "Le traité de Saint-Germain attribue le Trentin et le Tyrol du Sud à l'Italie (10 septembre)."}
  - {annee: 1948, evenement: "Premier Statut spécial (loi constitutionnelle n° 5 du 26 février) ; premières élections régionales le 28 novembre."}
  - {annee: 1971, evenement: "Loi constitutionnelle n° 1 du 10 novembre révisant le Statut et transférant l'essentiel des compétences aux provinces."}
  - {annee: 1972, evenement: "Texte unifié du Statut approuvé par le décret présidentiel n° 670 du 31 août."}
  - {annee: 2001, evenement: "Loi constitutionnelle n° 2 du 31 janvier : compétence électorale et forme de gouvernement confiées aux provinces."}
  - {annee: 2026, evenement: "Adoption définitive par le Sénat de la réforme constitutionnelle du Statut (13 mai) ; loi constitutionnelle n° 2 du 18 mai."}
