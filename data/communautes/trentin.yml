resume: >-
  La province autonome de Trente forme avec celle de Bolzano la région autonome du Trentin-Haut-Adige, l'une des cinq régions à statut spécial prévues par l'article 116 de la Constitution italienne. Son autonomie repose sur le Statut spécial adopté en 1948 et refondu par le décret présidentiel n° 670 du 31 août 1972, qui donne à la province un Conseil élu et un pouvoir législatif propre. La population est en majorité italophone ; le Statut protège en outre les Ladins du val di Fassa, les Mochènes de la vallée du Fersina et les Cimbres de Luserna (art. 102). La loi constitutionnelle n° 2 du 18 mai 2026, adoptée définitivement le 13 mai, a réformé le Statut. Les Ladins du val de Fassa, les Mòchènes et les Cimbres ont leur propre fiche (« Ladins du val de Fassa », « Mòchènes et Cimbres de Luserna »), comme les biens d'usage civique des hameaux (« Biens d'usage civique des hameaux du Trentin (ASUC) »).
