  verifie: ["Statut du Royaume, version au 1er janvier 2024 : art. 1, 3, 7, 8, 15, 17, 23, 41, 50, 55 ; art. 58 à 60 limités à Aruba.", "Constitution de Sint Maarten (traduction anglaise) : préambule, art. 1, 11, 25, 32, 45, 82, 92, 99, 100, 109, 114, 127.", "Landsverordening op de uitgifte in erfpacht van gronden toebehorende aan Sint Maarten, art. 1 et 2.", "CCPR/C/NLD/CO/5, § 5, 6, 11 et 12.", "Cft : contrôle financier de Curaçao et de Sint Maarten par la Rft, lié à la réforme du 10 octobre 2010.", "Mémoire de master, université d'Utrecht (A. Alders, 2015) : instructions consécutives au contrôle du Cft, différend de 2015 sur la chambre d'intégrité.", "Banque mondiale : 43 923 habitants (2025), 34 km² (2023)."]
  non_confirme: ["Critère d'entrée : aucun mécanisme onusien ne vise la population de Sint Maarten comme peuple autochtone ou minorité ; la reconnaissance retenue est nationale (Statut, Constitution) et le suivi distinct par un organe de traité.", "Les chiffres du référendum de 2000 proviennent d'une source secondaire (Wikipédia, d'après la base Direct Democracy), qui le date du 22 juin alors que la Constitution indique le 23 juin.", "La valeur « partiel » pour l'autodétermination externe repose sur le préambule constitutionnel et le référendum de 2000, et non sur une procédure de sortie inscrite dans le Statut.", "Le texte de la Constitution consulté est une traduction anglaise publiée par l'AICESIS ; les modifications postérieures à 2010 n'ont pas été contrôlées, ni les ordonnances sur les ressources et l'admission.", "Le mémoire universitaire cité pour l'effectivité a été rédigé lors d'un stage au ministère néerlandais de l'Intérieur et des Relations du Royaume.", "Nombre de villages ou localités habitées : non trouvé (site du bureau de la statistique de Sint Maarten inaccessible)."]
