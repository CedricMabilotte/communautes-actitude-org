resume: >-
  Sint Maarten est la partie sud de l'île de Saint-Martin, dans les Petites Antilles, dont la partie nord est la collectivité française de Saint-Martin. Ancien territoire insulaire des Antilles néerlandaises, Sint Maarten est devenu le 10 octobre 2010 l'un des quatre pays du Royaume des Pays-Bas, après le référendum du 23 juin 2000. Le Statut du Royaume dispose que chaque pays gère seul ses affaires propres ; la défense, les relations extérieures et la nationalité restent des affaires du Royaume. La Constitution de 2010 institue un Parlement de 15 à 21 membres selon la population, un gouvernement responsable devant lui et des « landsverordeningen » (ordonnances nationales, c'est-à-dire lois du pays).
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur les Pays-Bas (CCPR/C/NLD/CO/5), § 5, 6 et 12 : le Comité prend acte de la transformation de 2010 qui fait de Sint Maarten un pays constitutif autonome, relève des écarts de protection entre les quatre pays et recommande la création d'une institution nationale des droits de l'homme à Aruba, à Curaçao et à Sint Maarten.", annee: 2019, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/NLD/CO/5&l=en&t=pdf"}
base_nationale:
  - {instrument: "Statut du Royaume des Pays-Bas (Statuut voor het Koninkrijk der Nederlanden, 1954), version en vigueur au 1er janvier 2024", nature: "statut_autonomie", annee: 1954, source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0002154/2024-01-01_0/xml/BWBR0002154_2024-01-01_0.xml"}
  - {instrument: "Constitution of Sint Maarten (Staatsregeling van Sint Maarten), en vigueur le 10 octobre 2010", nature: "constitution", annee: 2010, source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Sint Maarten gère seul ses affaires propres, Statut, art. 41 ; le gouvernement est formé du Roi, représenté par le Gouverneur, et des ministres responsables devant le Parlement, qui compte 15 membres jusqu'à 60 000 habitants et 21 au-delà de 80 000, Constitution de 2010, art. 32 et 45.", source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les ordonnances nationales sont adoptées conjointement par le gouvernement et le Parlement, Constitution de 2010, art. 82 ; elles peuvent être suspendues ou annulées par le Roi en cas de contrariété avec le Statut, un accord international, une loi ou un règlement du Royaume, ou des intérêts dont la charge relève du Royaume, Statut, art. 50.", source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
  justice_propre: {valeur: "partiel", note: "Sint Maarten dispose d'un tribunal de première instance et d'une Cour constitutionnelle propre, Constitution de 2010, art. 114 et 127 ; l'appel relève de la Cour commune de justice d'Aruba, Curaçao, Sint Maarten et de Bonaire, Saint-Eustache et Saba, et la compétence de la Cour suprême des Pays-Bas (Hoge Raad) est réglée par loi du Royaume, Constitution de 2010, art. 114, al. 2, et Statut, art. 23.", source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
  terres: {valeur: "partiel", note: "La gestion du domaine foncier du pays est réglée par ordonnance nationale, Constitution de 2010, art. 109 ; le ministre de Sint Maarten chargé de l'aménagement concède les terres du pays en bail emphytéotique (erfpacht, droit d'usage de longue durée) pour soixante ans au plus, Landsverordening op de uitgifte in erfpacht van gronden toebehorende aan Sint Maarten, texte consolidé AB 2014, GT no. 17, art. 1 et 2. Il s'agit de la gestion du domaine foncier du pays, sans réservation de la propriété du sol à la population.", source: "https://repository.officiele-overheidspublicaties.nl/CVDR/CVDR208524/1/html/CVDR208524_1.html"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "reconnu", note: "Les projets de loi du Royaume sont transmis au Parlement de Sint Maarten, qui peut envoyer des délégués aux débats des États généraux, Statut, art. 15 à 17 ; toute modification du Statut exige l'acceptation de Sint Maarten par ordonnance nationale, Statut, art. 55.", source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0002154/2024-01-01_0/xml/BWBR0002154_2024-01-01_0.xml"}
  langue: {valeur: "reconnu", note: "Le néerlandais et l'anglais sont les langues officielles, Constitution de 2010, art. 1, al. 2.", source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
  education: {valeur: "reconnu", note: "L'enseignement est libre sous la surveillance du gouvernement de Sint Maarten, exercée selon une ordonnance nationale, et l'enseignement public est réglé par ordonnance nationale, Constitution de 2010, art. 11.", source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
  fiscalite: {valeur: "partiel", note: "Les impôts sont levés en vertu d'une ordonnance nationale et le budget est adopté par ordonnance nationale, Constitution de 2010, art. 99 et 100 ; depuis la réforme de 2010, un collège de contrôle financier (Cft) institué par une loi du Royaume, la Rijkswet financieel toezicht Curaçao en Sint Maarten (Rft), contrôle les finances publiques du pays.", source: "https://www.cft.cw/over-het-cft"}
  representation: {valeur: "partiel", note: "Un ministre plénipotentiaire nommé par le gouvernement de Sint Maarten siège au Conseil des ministres du Royaume et prend part aux débats des chambres des États généraux sur les lois du Royaume, Statut, art. 7, 8 et 17 ; aucun siège n'est réservé à Sint Maarten aux États généraux.", source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0002154/2024-01-01_0/xml/BWBR0002154_2024-01-01_0.xml"}
  statut_personnel: {valeur: "partiel", note: "La nationalité néerlandaise est une affaire du Royaume, qui surveille aussi les règles générales d'admission et d'expulsion des Néerlandais et fixe les conditions générales d'admission des étrangers, Statut, art. 3, al. 1 c, f et g ; dans ce cadre, l'admission des étrangers est réglée par ordonnance nationale, Constitution de 2010, art. 25.", source: "https://repository.officiele-overheidspublicaties.nl/bwb/BWBR0002154/2024-01-01_0/xml/BWBR0002154_2024-01-01_0.xml"}
  autodetermination_externe: {valeur: "partiel", note: "Le préambule de la Constitution de 2010 invoque le droit à l'autodétermination exercé par le référendum du 23 juin 2000, qui proposait aussi l'indépendance ; le Parlement peut organiser un référendum consultatif, Constitution de 2010, art. 92 ; le Statut ne prévoit pas de procédure de sortie pour Sint Maarten, ses art. 58 à 60 ne visant qu'Aruba.", source: "https://aicesis.org/publications-docman/publications/amerique-latine/143-constitution-of-sint-maarten/file"}
effectivite: {valeur: "partielle", note: "Les institutions de Sint Maarten exercent leurs compétences depuis le 10 octobre 2010 ; un mémoire de l'université d'Utrecht (2015) relève que, sur signalement du Cft, le gouvernement du Royaume peut adresser au Gouverneur une instruction qui restreint la marge financière du pays, et qu'un désaccord de 2015 sur une chambre d'intégrité exposait Sint Maarten à une loi du Royaume.", source: "https://deugdelijkbestuuraruba.org/wp-content/uploads/2016/04/AldersUUmasterthesis-aug-2015.pdf"}
chronologie:
  - {annee: 1954, evenement: "Entrée en vigueur du Statut du Royaume ; Sint Maarten fait partie des Antilles néerlandaises."}
  - {annee: 2000, evenement: "Référendum du 23 juin : 69,98 % des suffrages exprimés pour le statut de pays au sein du Royaume, 14,44 % pour l'indépendance."}
  - {annee: 2005, evenement: "Première conférence de la Table ronde sur les nouvelles relations constitutionnelles des Antilles néerlandaises."}
  - {annee: 2010, evenement: "Le 10 octobre, dissolution des Antilles néerlandaises : Sint Maarten devient un pays du Royaume et sa Constitution entre en vigueur ; ses finances publiques sont placées sous le contrôle du Cft par une loi du Royaume (Rft)."}
  - {annee: 2019, evenement: "Le Comité des droits de l'homme recommande la création d'une institution nationale des droits de l'homme à Aruba, à Curaçao et à Sint Maarten."}
