resume: >-
  Fiche agrégée. La loi n° 6172 du 29 novembre 1977 (Ley Indígena) déclare les « reservas indígenas » propriété des communautés, inaliénables, imprescriptibles et réservées à leurs habitants autochtones ; tout transfert à des non-autochtones est nul. Chaque territoire est administré par un conseil directeur représentant sa population ; un décret de 1978 a fait des associations de développement intégral (ADI) l'interlocuteur officiel. Huit peuples vivent dans 24 territoires couvrant 3 344 km². Une part des terres reste occupée par des non-autochtones ; la première indemnisation d'un occupant prévue par la loi a été versée en décembre 2023.
reconnaissance_regionale:
  - {mecanisme: "commission_interamericaine", detail: "Mesure conservatoire n° 321/12 du 30 avril 2015 en faveur des peuples bribri de Salitre et brörán (teribe) de Térraba ; deux de ses bénéficiaires, Sergio Rojas (2019) et Jehry Rivera (2020), ont été tués.", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Costa Rica ratifie la Convention 169 de l'OIT le 2 avril 1993 (entrée en vigueur le 2 avril 1994).", annee: 1993, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "Le Costa Rica vote pour l'adoption de la Déclaration des Nations unies sur les droits des peuples autochtones en 2007.", annee: 2007, source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
  - {mecanisme: "rapporteur_special", detail: "Visite du Rapporteur spécial José Francisco Calí Tzay du 6 au 17 décembre 2021 ; rapport A/HRC/51/28/Add.1 (2022) sur l'autogouvernement, la restitution des terres et la consultation dans les 24 territoires.", annee: 2022, source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
base_nationale:
  - {instrument: "Loi n° 6172 du 29 novembre 1977 (Ley Indígena)", nature: "loi", annee: 1977, source: "https://conagebio.go.cr/sites/default/files/2023-08/LEY-INDIGENA-6172.pdf"}
  - {instrument: "Constitution, article 1 réformé en 2015 (État multiethnique et pluriculturel) et article 76 (lenguas indígenas nacionales)", nature: "constitution", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
  - {instrument: "Décret exécutif n° 40932-MP-MJP (2018), Mécanisme général de consultation des peuples autochtones", nature: "loi", annee: 2018, source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi de 1977 (art. 4) prévoit que les territoires sont régis par les autochtones selon leurs structures communautaires traditionnelles, chacun administré par un conseil directeur, sous la coordination de la CONAI (commission nationale des affaires autochtones) ; le décret n° 8487 de 1978 a imposé les associations de développement intégral comme seule forme de gouvernance, et aucune autorité propre n'a de personnalité juridique selon le Rapporteur spécial (2022).", source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "Les territoires sont propriété des communautés (art. 2), inaliénables, imprescriptibles, non transférables et exclusifs ; toute vente ou location à des non-autochtones est nulle (art. 3).", source: "https://conagebio.go.cr/sites/default/files/2023-08/LEY-INDIGENA-6172.pdf"}
  ressources: {valeur: "partiel", note: "Seuls les autochtones peuvent abattre des arbres, exploiter le bois et cultiver dans les territoires ; toute concession minière à des particuliers doit être approuvée par l'Assemblée législative ; les programmes forestiers relèvent d'institutions de l'État sous contrôle de la CONAI (loi n° 6172, art. 6 et 7).", source: "https://conagebio.go.cr/sites/default/files/2023-08/LEY-INDIGENA-6172.pdf"}
  consentement: {valeur: "partiel", note: "Le décret n° 40932 de 2018 crée une unité technique de consultation au ministère de la Justice et des instances territoriales de consultation élues selon les normes de chaque territoire ; là où ces instances manquent, la consultation passe par les associations de développement intégral (Rapporteur spécial, 2022).", source: "https://documents.un.org/api/symbol/access?s=A/HRC/51/28/Add.1&l=es&t=pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Selon le Rapporteur spécial (2022), une grande partie des territoires reste aux mains de non-autochtones et le plan national de récupération lancé en 2016 n'avait produit aucune restitution ; la première indemnisation d'un occupant a été payée en décembre 2023 à Conte Burica. En 2024, l'affaire du meurtre de Sergio Rojas a été classée définitivement (8 janvier) et le meurtrier présumé de Jehry Rivera a été acquitté lors d'un second procès (août) selon l'IWGIA.", source: "https://iwgia.org/images/publications/indigenous-world/indigenous-world-2025.pdf"}
chronologie:
  - {annee: 1977, evenement: "Loi n° 6172, dite Ley Indígena (29 novembre)."}
  - {annee: 1978, evenement: "Décret n° 8487 : les associations de développement intégral deviennent la forme de gouvernance des territoires."}
  - {annee: 1993, evenement: "Ratification de la Convention 169 de l'OIT."}
  - {annee: 2015, evenement: "Réforme de l'article 1 de la Constitution (État multiethnique et pluriculturel) ; mesure conservatoire n° 321/12 de la Commission interaméricaine (30 avril)."}
  - {annee: 2016, evenement: "Plan national de récupération des territoires autochtones (INDER)."}
  - {annee: 2018, evenement: "Décret n° 40932 sur le Mécanisme général de consultation."}
  - {annee: 2019, evenement: "Assassinat du dirigeant bribri Sergio Rojas (mars)."}
  - {annee: 2020, evenement: "Assassinat du dirigeant brörán Jehry Rivera (24 février)."}
  - {annee: 2021, evenement: "Visite du Rapporteur spécial des Nations unies (6-17 décembre)."}
  - {annee: 2023, evenement: "Première indemnisation d'un occupant non autochtone, à Conte Burica (21 décembre)."}
  - {annee: 2024, evenement: "Classement définitif de l'affaire Sergio Rojas (8 janvier) ; acquittement du meurtrier présumé de Jehry Rivera (août)."}
