resume: >-
  Fiche agrégée. La loi n° 6172 du 29 novembre 1977 (Ley Indígena) déclare les « reservas indígenas » propriété des communautés, inaliénables, imprescriptibles et réservées à leurs habitants autochtones ; tout transfert à des non-autochtones est nul. Chaque territoire est administré par un conseil directeur représentant sa population. Huit peuples vivent dans 24 territoires couvrant environ 334 000 hectares. Une part des terres reste occupée par des non-autochtones, faute d'application des procédures de rachat prévues par la loi.
