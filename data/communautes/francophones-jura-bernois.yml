    - "Date du transfert de Moutier (1er janvier 2026) et étapes 2021-2025, chronologie du canton du Jura."
    - "Nombre de communes (39 et 19) au registre officiel des communes de l'Office fédéral de la statistique ; population 2025 par arrondissement et commune (STATPOP)."
  non_confirme:
    - "Adaptation de la LStP au départ de Moutier : la version en vigueur sur BELEX reste celle du 1er mars 2025 ; la Constitution dans sa version du 1er janvier 2026 maintient les 12 mandats garantis."
    - "Effectivité : seule source indépendante ouverte, une encyclopédie collaborative ; pas d'évaluation universitaire ou onusienne trouvée."
    - "Nombre de francophones dans l'arrondissement de Biel/Bienne : statistiques du CAF non dépouillées."
    - "Surface : somme des surfaces des deux arrondissements (objets 241 et 242 de la couche des arrondissements swissBOUNDARIES3D) ; cette couche n'indique pas d'année ; l'année 2026 est déduite de la couche des communes, où Moutier figure dans le canton du Jura en 2026, et des 52 211 ha du Jura bernois, qui excluent les 1 961 ha de Moutier."
    - "Nombre de villages : non trouvé."
