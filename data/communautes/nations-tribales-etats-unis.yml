  - {instrument: "Indian Tribal Justice Act, 25 U.S.C. 3601 (1993)", nature: "loi", annee: 1993, source: "https://www.law.cornell.edu/uscode/text/25/3601"}
  - {instrument: "Native American Languages Act, 25 U.S.C. 2903 (1990)", nature: "loi", annee: 1990, source: "https://www.law.cornell.edu/uscode/text/25/2903"}
