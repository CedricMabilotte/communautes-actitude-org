  - {annee: 2025, evenement: "Mars : abrogation du décret présidentiel 14112 (2023) sur le financement fédéral des nations tribales. Décembre : la loi de défense de l'exercice 2026 reconnaît la nation lumbee de Caroline du Nord."}
