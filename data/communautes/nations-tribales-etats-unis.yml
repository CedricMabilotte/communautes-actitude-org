resume: >-
  Fiche agrégée. Les États-Unis entretiennent une relation « de gouvernement à gouvernement » avec 575 nations amérindiennes et villages autochtones de l'Alaska inscrits sur une liste publiée par le secrétaire à l'Intérieur (25 U.S.C. 5131). Ces nations tribales conservent une souveraineté inhérente, limitée par le Congrès : gouvernement propre, tribunaux, fiscalité, définition de leurs membres. Les terres de réserve sont détenues en fiducie (trust) par l'État fédéral. Les Navajo, les Autochtones de l'Alaska et la Nation cherokee ont une fiche propre.
