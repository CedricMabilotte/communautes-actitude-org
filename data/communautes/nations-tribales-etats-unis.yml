droits:
  autogouvernement: {valeur: "reconnu", note: "Le Congrès reconnaît l'autorité inhérente des nations tribales à établir leur propre forme de gouvernement (25 U.S.C. 3601).", source: "https://www.law.cornell.edu/uscode/text/25/3601"}
  pouvoir_normatif: {valeur: "reconnu", note: "Les nations tribales reconnues possèdent des droits inhérents d'autogouvernement (souveraineté tribale), limités par les traités, les lois du Congrès et la jurisprudence ; les États n'ont pas d'autorité sur elles sans autorisation du Congrès.", source: "https://www.bia.gov/frequently-asked-questions"}
  justice_propre: {valeur: "reconnu", note: "Les systèmes de justice tribaux sont reconnus comme partie des gouvernements tribaux (Indian Tribal Justice Act, 25 U.S.C. 3601) ; la loi Public Law 280 de 1953 a transféré la compétence pénale à certains États.", source: "https://www.law.cornell.edu/uscode/text/25/3601"}
  terres: {valeur: "partiel", note: "Environ 56,2 millions d'acres sont détenus en fiducie par les États-Unis pour les nations tribales et des individus ; le titre appartient à l'État fédéral.", source: "https://www.bia.gov/frequently-asked-questions"}
  ressources: {valeur: "partiel", note: "Le Bureau des affaires indiennes administre 57 millions d'acres de droits miniers souterrains détenus en fiducie pour les nations tribales et les individus.", source: "https://www.bia.gov/about-us"}
  consentement: {valeur: "partiel", note: "Le décret présidentiel 13175 (2000) impose aux agences fédérales une consultation « significative » des gouvernements tribaux, sans droit de veto.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "partiel", note: "La Native American Languages Act (1990) reconnaît le droit des nations tribales de donner un statut officiel à leurs langues pour leurs propres affaires (25 U.S.C. 2903).", source: "https://www.law.cornell.edu/uscode/text/25/2903"}
  education: {valeur: "partiel", note: "Les nations tribales peuvent gérer par contrat les programmes fédéraux, dont l'éducation (25 U.S.C. 5321) ; la loi de 1990 reconnaît l'usage des langues autochtones comme langue d'enseignement dans les écoles financées par l'Intérieur.", source: "https://www.law.cornell.edu/uscode/text/25/5321"}
  fiscalite: {valeur: "reconnu", note: "La Cour suprême juge que le pouvoir de taxer est un attribut essentiel de la souveraineté tribale, y compris envers des non-Autochtones exerçant sur la réserve (Merrion v. Jicarilla Apache Tribe, 1982).", source: "https://www.law.cornell.edu/supremecourt/text/455/130"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Le droit d'une nation tribale de définir ses membres est reconnu comme central à son existence politique (Santa Clara Pueblo v. Martinez, 1978).", source: "https://www.law.cornell.edu/supremecourt/text/436/49"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial relève en 2012 que de nombreux groupes se déclarant autochtones ne sont pas reconnus par l'État fédéral.", source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
