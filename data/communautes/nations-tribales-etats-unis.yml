droits:
  autogouvernement: {valeur: "reconnu", note: "Le Congrès reconnaît l'autorité inhérente des nations tribales à établir leur propre forme de gouvernement (25 U.S.C. 3601).", source: "https://www.law.cornell.edu/uscode/text/25/3601"}
  pouvoir_normatif: {valeur: "reconnu", note: "Selon le Bureau des affaires indiennes, les nations tribales reconnues ont le droit et l'autorité de réglementer les activités sur leurs terres sans contrôle des États fédérés ; ceux-ci n'ont pas d'autorité sur les gouvernements tribaux sauf autorisation expresse du Congrès, qui détient le pouvoir plénier en matière indienne.", source: "https://www.bia.gov/frequently-asked-questions"}
  justice_propre: {valeur: "reconnu", note: "Le Congrès reconnaît l'autorité inhérente des nations tribales à établir leurs propres systèmes de justice, « partie essentielle » des gouvernements tribaux (Indian Tribal Justice Act, 25 U.S.C. 3601, 1993) ; la Public Law 280 de 1953 (18 U.S.C. 1162) donne compétence pénale en territoire indien à six États, et l'arrêt Oklahoma v. Castro-Huerta (2022) reconnaît aux États une compétence concurrente pour les crimes commis par des non-Autochtones contre des Autochtones.", source: "https://www.law.cornell.edu/uscode/text/25/3601"}
  terres: {valeur: "partiel", note: "Environ 56,2 millions d'acres sont détenus en fiducie par les États-Unis pour les nations tribales et des individus ; le titre appartient à l'État fédéral.", source: "https://www.bia.gov/frequently-asked-questions"}
  ressources: {valeur: "partiel", note: "Le Bureau des affaires indiennes administre 57 millions d'acres de droits miniers souterrains détenus en fiducie pour les nations tribales et les individus.", source: "https://www.bia.gov/about-us"}
  consentement: {valeur: "partiel", note: "Le décret présidentiel 13175 (2000) impose aux agences fédérales une consultation « significative » des gouvernements tribaux, sans droit de veto ; sa section 10 précise qu'il ne crée aucun droit opposable en justice.", source: "https://www.govinfo.gov/content/pkg/FR-2000-11-09/pdf/00-29003.pdf"}
  langue: {valeur: "partiel", note: "La Native American Languages Act (1990) reconnaît le droit des nations tribales de donner un statut officiel à leurs langues pour leurs propres affaires (25 U.S.C. 2903).", source: "https://www.law.cornell.edu/uscode/text/25/2903"}
  education: {valeur: "partiel", note: "Le secrétaire à l'Intérieur verse des subventions aux nations tribales qui gèrent des écoles (Tribally Controlled Schools Act, 25 U.S.C. 2502, 1988) ; la loi de 1990 reconnaît leur droit d'utiliser leurs langues comme langue d'enseignement dans les écoles financées par l'Intérieur (25 U.S.C. 2903).", source: "https://www.law.cornell.edu/uscode/text/25/2502"}
  fiscalite: {valeur: "reconnu", note: "La Cour suprême juge que le pouvoir de taxer est un attribut essentiel de la souveraineté tribale, y compris envers des non-Autochtones exerçant sur la réserve (Merrion v. Jicarilla Apache Tribe, 1982).", source: "https://www.law.cornell.edu/supremecourt/text/455/130"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le droit d'une nation tribale de définir ses membres est reconnu comme central à son existence politique (Santa Clara Pueblo v. Martinez, 1978) ; aucune source trouvée ne fait de cette qualité de membre une condition de résidence sur le territoire.", source: "https://www.law.cornell.edu/supremecourt/text/436/49"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "IWGIA (Indigenous World 2026) relève qu'en 2025 au moins 350 millions de dollars de subventions fédérales aux infrastructures tribales ont été suspendus, que le décret présidentiel de 2023 élargissant l'autonomie budgétaire des nations tribales a été abrogé en mars, et que la Cour suprême a refusé en mai d'examiner le recours contre la mine Resolution Copper sur le site apache d'Oak Flat ; le Rapporteur spécial notait en 2012 que de nombreux groupes se déclarant autochtones ne sont pas reconnus par l'État fédéral.", source: "https://iwgia.org/en/usa/6003-iw-2026-united-states-of-america.html"}
