resume: >-
  Fiche agrégée. Les États-Unis entretiennent une relation « de gouvernement à gouvernement » avec 575 nations amérindiennes et villages autochtones de l'Alaska inscrits sur une liste que le secrétaire à l'Intérieur publie chaque année (25 U.S.C. 5131) ; la liste du 30 janvier 2026 inclut la nation lumbee de Caroline du Nord, reconnue par la loi de défense de l'exercice 2026 (18 décembre 2025). Ces nations tribales conservent une souveraineté inhérente, limitée par le Congrès : gouvernement propre, tribunaux, fiscalité, définition de leurs membres. Les terres de réserve sont détenues en fiducie (trust) par l'État fédéral. La Nation navajo, les Autochtones d'Alaska, la Nation cherokee, la Communauté de Metlakatla (îles Annette), les Passamaquoddy et Penobscot du Maine et les Nations des traités de pêche de l'ouest de Washington ont une fiche propre et restent comptées ici ; les nations reconnues seulement par un État fédéré relèvent de la fiche « Nations à réserve d'État (Connecticut, Virginie) ».
