reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis, qui avaient voté contre la Déclaration en 2007, ont annoncé leur appui en décembre 2010 (Rapporteur spécial, A/HRC/21/47/Add.1).", annee: 2010, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de mission aux États-Unis de James Anaya (A/HRC/21/47/Add.1) : relations avec environ 566 nations tribales reconnues à l'époque, restitution de terres (Taos Pueblo, Timbisha Shoshone).", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
base_nationale:
