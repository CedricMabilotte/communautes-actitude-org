  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'État adopte un plan de mesures conservatoires, une convention de mise en œuvre en 2008 et une station de surveillance de la zone ; la Cour interaméricaine (2024) juge ces mesures non effectives face aux entrées de bûcherons illégaux (par. 239), relève des puits pétroliers du bloc 16 dans la zone tampon (par. 299) et constate l'absence d'enquête effective sur les attaques de 2003 et 2006 (par. 471).", source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_537_esp.pdf"}
chronologie:
  - {annee: 1999, evenement: "Décret exécutif 552 : création de la zone intangible (2 février)."}
  - {annee: 2003, evenement: "Entre 12 et 26 Taromenane sont tués lors d'une attaque (26 mai)."}
  - {annee: 2006, evenement: "Mesures conservatoires de la Commission interaméricaine (10 mai), après la mort de Taromenane en avril."}
  - {annee: 2007, evenement: "Décret 2187 : délimitation de la zone et zone tampon de 10 km ; politique nationale des peuples en isolement volontaire (18 avril)."}
  - {annee: 2008, evenement: "Constitution : territoires des peuples en isolement « irréductibles et intangibles » (art. 57)."}
  - {annee: 2013, evenement: "Déclaration d'intérêt national de l'exploitation des blocs 31 et 43 (3 octobre) ; attaque du 30 mars : entre 30 et 50 Taromenane tués."}
  - {annee: 2019, evenement: "Décret 751 : zone portée à 8 185 km² après la consultation populaire de 2018 (27 mai)."}
  - {annee: 2022, evenement: "La Cour constitutionnelle déclare inconstitutionnels les articles 3 à 9 du décret 751, faute de consultation (19 janvier)."}
  - {annee: 2023, evenement: "Consultation populaire : majorité pour laisser le pétrole du bloc 43 sous terre (20 août)."}
  - {annee: 2024, evenement: "Arrêt de la Cour interaméricaine Tagaeri et Taromenane c. Équateur (4 septembre)."}
