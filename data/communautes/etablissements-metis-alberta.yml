resume: >-
  Les Métis sont l'un des trois peuples autochtones reconnus par l'article 35 de la Loi constitutionnelle de 1982. En Alberta, douze établissements métis sont créés en 1938 ; huit subsistent. Depuis 1990, la loi sur les établissements métis (Metis Settlements Act) leur donne des conseils élus et un Conseil général (Metis Settlements General Council), qui détient les terres en fief simple (pleine propriété). Un amendement à la constitution de l'Alberta interdit d'exproprier ces terres ou de modifier leur régime sans l'accord du Conseil général.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Le Canada, qui avait voté contre la Déclaration en 2007, l'a ensuite appuyée ; la loi fédérale L.C. 2021, ch. 14 l'applique aux peuples autochtones au sens de l'article 35 de la Loi constitutionnelle de 1982, qui inclut les Métis.", annee: 2021, source: "https://laws-lois.justice.gc.ca/fra/lois/U-2.2/TexteComplet.html"}
base_nationale:
  - {instrument: "Accord Alberta-établissements métis (Alberta-Metis Settlements Accord)", nature: "accord_revendication", annee: 1989, source: "https://www.alberta.ca/metis-settlements"}
  - {instrument: "Metis Settlements Act, RSA 2000, c. M-14", nature: "loi", annee: 1990, source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  - {instrument: "Constitution of Alberta Amendment Act, 1990 (RSA 2000, c. C-24)", nature: "constitution", annee: 1990, source: "https://kings-printer.alberta.ca/documents/Acts/C24.pdf"}
  - {instrument: "Alberta (Affaires autochtones et développement du Nord) c. Cunningham, 2011 CSC 37", nature: "jurisprudence", annee: 2011, source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/item/7952/index.do"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Metis Settlements Act (1990) organise un gouvernement local pour chaque établissement (conseil élu) et un Conseil général commun ; le ministre peut, par arrêté, destituer le conseil d'un établissement dont il juge la gestion irrégulière (art. 176) et le remplacer par un gestionnaire nommé (art. 179).", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les conseils d'établissement adoptent des règlements (bylaws, art. 51 et annexe 1) ; le Conseil général adopte des politiques (General Council Policies, art. 222) par résolution spéciale, soumises au veto du ministre (art. 224) sauf exceptions prévues par la loi.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi crée un tribunal d'appel des établissements métis (Metis Settlements Appeal Tribunal, art. 180) pour les litiges d'appartenance, fonciers et d'accès aux terres ; sur ses sept membres au moins, quatre sont nommés par le ministre, dont le président choisi sur une liste du Conseil général, et trois par le Conseil général.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  terres: {valeur: "reconnu", note: "Les terres sont détenues en fief simple par le Conseil général ; elles ne peuvent être expropriées ni saisies (Constitution of Alberta Amendment Act, art. 2 à 4).", source: "https://kings-printer.alberta.ca/documents/Acts/C24.pdf"}
  ressources: {valeur: "partiel", note: "L'accord de cogestion (Co-management Agreement, annexe 3, art. 111) associe le Conseil général et les établissements à l'exploitation du sous-sol ; les revenus des ressources de surface et de cogestion sont versés au fonds consolidé du Conseil général (art. 140).", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  consentement: {valeur: "partiel", note: "L'Assemblée législative de l'Alberta ne peut modifier la loi de protection des terres, révoquer les lettres patentes ou dissoudre le Conseil général sans l'accord de celui-ci (Constitution of Alberta Amendment Act, 1990, art. 5) ; la modification de cette loi suppose un plébiscite approuvé par la majorité des membres de chaque établissement (art. 7).", source: "https://kings-printer.alberta.ca/documents/Acts/C24.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les conseils d'établissement fixent par règlement des redevances et droits pour les services (art. 51) et peuvent imposer une taxe sur l'équipement de forage pétrolier et gazier (art. 167), au taux fixé par règlement provincial.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La loi fixe les conditions d'appartenance à un établissement (art. 74 à 82) ; l'art. 75 exclut en principe les personnes inscrites comme Indiens, disposition jugée conforme à la Charte par la Cour suprême du Canada (2011 CSC 37).", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "La Cour suprême du Canada (Alberta c. Cunningham, 2011 CSC 37) décrit la Metis Settlements Act comme un régime en vigueur visant l'autonomie gouvernementale des Métis par une assise territoriale et en confirme les règles d'appartenance ; le recensement de 2021 compte 4 238 résidents ; le Conseil général et l'Alberta ont signé un accord protocolaire (Protocol Agreement) le 29 mars 2023.", source: "https://decisions.scc-csc.ca/scc-csc/scc-csc/fr/item/7952/index.do"}
chronologie:
  - {annee: 1938, evenement: "La Metis Population Betterment Act crée douze colonies métisses ; quatre perdent ce statut entre 1940 et 1960."}
  - {annee: 1989, evenement: "Signature de l'accord Alberta-établissements métis."}
  - {annee: 1990, evenement: "Metis Settlements Act et amendement constitutionnel albertain protégeant les terres."}
  - {annee: 2011, evenement: "La Cour suprême du Canada confirme les règles d'appartenance de la Metis Settlements Act (2011 CSC 37)."}
  - {annee: 2021, evenement: "Loi modificative (2021, ch. 12) : révision de plusieurs articles de la Metis Settlements Act, dont la rémunération des conseillers (art. 11.1) et les politiques du Conseil général (art. 222)."}
  - {annee: 2023, evenement: "Accord protocolaire (Protocol Agreement) entre le Conseil général et l'Alberta (29 mars)."}
