  - {instrument: "Metis Settlements Act, RSA 2000, c. M-14", nature: "loi", annee: 1990, source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  - {instrument: "Constitution of Alberta Amendment Act, 1990 (RSA 2000, c. C-24)", nature: "constitution", annee: 1990, source: "https://kings-printer.alberta.ca/documents/Acts/C24.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Metis Settlements Act (1990) organise un gouvernement local pour chaque établissement (conseil élu) et un Conseil général commun.", source: "https://www.alberta.ca/metis-settlements"}
  pouvoir_normatif: {valeur: "partiel", note: "Les conseils d'établissement adoptent des règlements (bylaws, art. 51) et le Conseil général des politiques (General Council Policies, art. 137 et suivants), certaines soumises à approbation ministérielle.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  justice_propre: {valeur: "partiel", note: "La loi crée un tribunal d'appel des établissements métis (Metis Settlements Appeal Tribunal, art. 180) pour les litiges prévus par la loi, notamment fonciers.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  terres: {valeur: "reconnu", note: "Les terres sont détenues en fief simple par le Conseil général ; elles ne peuvent être expropriées ni saisies (Constitution of Alberta Amendment Act, art. 2 à 4).", source: "https://kings-printer.alberta.ca/documents/Acts/C24.pdf"}
  ressources: {valeur: "partiel", note: "La loi prévoit des accords de cogestion des ressources du sous-sol et verse les revenus de surface et de cogestion au fonds consolidé du Conseil général (art. 140).", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  consentement: {valeur: "partiel", note: "L'Assemblée législative de l'Alberta ne peut modifier la loi de protection des terres, révoquer les lettres patentes ou dissoudre le Conseil général sans l'accord de celui-ci (Constitution of Alberta Amendment Act, art. 5).", source: "https://kings-printer.alberta.ca/documents/Acts/C24.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les conseils peuvent adopter des règlements fiscaux, par exemple une taxe sur l'équipement de forage (art. 167) ; l'imposition des terres du Conseil général suppose une autorisation prévue par la loi.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "La loi définit la qualité de membre d'un établissement ; chaque établissement se compose de ses membres.", source: "https://kings-printer.alberta.ca/documents/Acts/M14.pdf"}
