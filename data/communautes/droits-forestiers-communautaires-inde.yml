resume: >-
  Fiche agrégée : elle couvre les communautés de tribus répertoriées et d'autres habitants traditionnels des forêts dont les droits ont été reconnus au titre de la loi du 29 décembre 2006 sur la reconnaissance des droits forestiers (Forest Rights Act). La loi reconnaît des droits individuels et des droits communautaires, dont celui de protéger, régénérer et gérer une ressource forestière communautaire. L'assemblée de village (gram sabha) instruit les demandes. Au 31 mai 2025, 121 705 titres communautaires couvraient environ 73 600 km².
