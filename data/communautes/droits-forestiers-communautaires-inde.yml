  - {instrument: "Orissa Mining Corporation c. ministère de l'Environnement et des Forêts, Cour suprême, 18 avril 2013", nature: "jurisprudence", annee: 2013, source: "https://www.downtoearth.org.in/governance/niyamgiri-10-years-since-india-s-first-environmental-referendum-88850"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'assemblée de village est l'autorité qui engage la procédure de détermination des droits individuels et communautaires, art. 6 (1), et veille au respect des décisions de régulation de l'accès aux ressources communautaires, art. 5.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les droits reconnus sont héréditaires mais inaliénables et incessibles, art. 4 (4) ; aucune expulsion avant la fin de la procédure de reconnaissance, art. 4 (5) ; titre de droits d'usage et de gestion, non de propriété du sol forestier.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  ressources: {valeur: "reconnu", note: "Droit de protéger, régénérer, conserver ou gérer toute ressource forestière communautaire traditionnellement protégée, art. 3 (1) (i) ; pouvoir des titulaires et de l'assemblée de village de protéger la faune, la forêt et les bassins versants, art. 5.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  consentement: {valeur: "partiel", note: "La Cour suprême a soumis en 2013 le projet de mine de Niyamgiri au vote des assemblées de village au titre de la loi de 2006 ; les douze assemblées l'ont rejeté et le ministère a refusé l'autorisation en janvier 2014.", source: "https://www.downtoearth.org.in/governance/niyamgiri-10-years-since-india-s-first-environmental-referendum-88850"}
