resume: >-
  Fiche agrégée : elle couvre les communautés de tribus répertoriées et d'autres habitants traditionnels des forêts dont les droits ont été reconnus au titre de la loi du 29 décembre 2006 sur la reconnaissance des droits forestiers (Forest Rights Act). La loi reconnaît des droits individuels et des droits communautaires, dont celui de protéger, régénérer et gérer une ressource forestière communautaire. L'assemblée de village (gram sabha) instruit les demandes. Au 31 mai 2025, 121 705 titres communautaires couvraient environ 73 600 km². Les fiches Gond de Mendha-Lekha (premier titre communautaire, 2009), Tribus répertoriées des zones de la Cinquième annexe (loi PESA de 1996) et Groupes tribaux particulièrement vulnérables titulaires de droits d'habitat traitent de régimes voisins.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19 (5 mai 2007), § 10 : recommande de reconnaître officiellement les peuples tribaux comme groupes ayant droit à une protection spéciale ; § 19 : droit de propriété collective ou individuelle des communautés tribales sur leurs terres traditionnelles et consentement préalable aux projets ; § 20 : demande des garanties contre l'acquisition des terres tribales dans « la loi de 2006 sur la reconnaissance des droits forestiers »", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006 (loi 2 de 2007)", nature: "loi", annee: 2006, source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  - {instrument: "Orissa Mining Corporation c. ministère de l'Environnement et des Forêts, Cour suprême, 18 avril 2013", nature: "jurisprudence", annee: 2013, source: "https://indiankanoon.org/doc/153831190/"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'assemblée de village est l'autorité qui engage la procédure de détermination des droits individuels et communautaires, art. 6 (1), et veille au respect des décisions de régulation de l'accès aux ressources communautaires, art. 5.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les droits reconnus sont héréditaires mais inaliénables et incessibles, art. 4 (4) ; aucune expulsion avant la fin de la procédure de reconnaissance, art. 4 (5) ; titre de droits d'usage et de gestion, non de propriété du sol forestier.", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  ressources: {valeur: "reconnu", note: "Droit de protéger, régénérer, conserver ou gérer toute ressource forestière communautaire traditionnellement protégée, art. 3 (1) (i) ; pouvoir des titulaires et de l'assemblée de village de protéger la faune, la forêt et les bassins versants, art. 5. Dans le district de Gadchiroli (Maharashtra), qui a reconnu des droits communautaires sur 66 % des terres éligibles (Scroll, 2017), 1 171 des 1 292 villages ont choisi en 2018 de vendre eux-mêmes leurs feuilles de tendu (feuilles servant à rouler les bidis, cigarettes locales) par l'assemblée de village ; en 2017, 87 villages de la taluka de Korchi en ont tiré 11,47 crores de roupies (114,7 millions) (The Wire Science, 2018). À Mendha-Lekha, le rendement du bambou géré par l'assemblée est passé de 2,7 t/ha/an en 2011 à 5,7 en 2014 (Down To Earth, 2017).", source: "https://prsindia.org/files/bills_acts/acts_parliament/2006/the-scheduled-tribes-and-other-traditional-forest-dwellers-recognition-of-forest-rights-act-2006.pdf"}
  consentement: {valeur: "conteste", note: "Les directives du ministère de l'Environnement de 2009 et l'art. 6 (3) (e) des règles de conservation des forêts de 2003 exigeaient le consentement de chaque assemblée de village avant le transfert de terres forestières à un projet ; la Cour suprême a soumis en 2013 la mine de Niyamgiri (Odisha) à la décision des assemblées concernées, et les douze assemblées consultées l'ont rejetée entre le 18 juillet et le 19 août 2013. Les règles de conservation des forêts de 2022 ne demandent plus ce consentement avant l'approbation de principe : la conformité à la loi de 2006 n'est vérifiée qu'après l'approbation du gouvernement central (CJP, 25 octobre 2022).", source: "https://cjp.org.in/forest-conservation-rules-2022-an-overview-of-changes-that-snatch-rights-of-gram-sabhas/"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon une étude publiée par Down To Earth le 30 octobre 2025 (Chitta Ranjan Pani, chercheur indépendant), 1,87 million de demandes avaient été rejetées, contre plus de 2,39 millions de titres individuels et 121 863 titres communautaires accordés ; une partie des rejets est motivée par l'absence d'imagerie satellite ou de relevés GPS, que la règle 12A présente comme des preuves complémentaires et non exigées.", source: "https://www.downtoearth.org.in/governance/forest-rights-act-a-tale-of-bureaucratic-intent-and-ground-level-betrayal"}
chronologie:
  - {annee: 2006, evenement: "Loi sur la reconnaissance des droits forestiers, 29 décembre."}
  - {annee: 2009, evenement: "Premiers titres de droits forestiers communautaires, dont Mendha-Lekha (Gadchiroli) en décembre (voir la fiche Gond de Mendha-Lekha)."}
  - {annee: 2013, evenement: "Arrêt Niyamgiri de la Cour suprême, 18 avril ; les douze assemblées de village consultées rejettent la mine entre juillet et août."}
  - {annee: 2018, evenement: "1 171 des 1 292 villages du district de Gadchiroli vendent leurs feuilles de tendu par l'assemblée de village."}
  - {annee: 2022, evenement: "Règles de conservation des forêts : le consentement des assemblées de village n'est plus requis avant l'approbation de principe d'un transfert de terres forestières."}
  - {annee: 2025, evenement: "121 705 titres communautaires au 31 mai (Press Information Bureau, 24 juillet 2025)."}
fiabilite:
  verifie: ["Articles 3 (1) (i), 4 (4), 4 (5), 5 et 6 (1) de la loi n° 2 de 2007, sanctionnée le 29 décembre 2006 (texte publié par PRS).", "Nombre et surface des titres au 31 mai 2025 (Press Information Bureau, 24 juillet 2025).", "Nombre de demandes rejetées et de titres (Down To Earth, 30 octobre 2025).", "CERD/C/IND/CO/19, § 10, 19 et 20 (texte français, documents de l'ONU).", "Arrêt Orissa Mining Corporation du 18 avril 2013 (Indian Kanoon) ; vote des douze assemblées entre le 18 juillet et le 19 août 2013 (Business Today).", "Suppression du consentement préalable des assemblées dans les règles de 2022 (CJP).", "Chiffres de Gadchiroli : vente du tendu en 2018 et revenus de Korchi en 2017 (The Wire Science, 1er mai 2018), taux de reconnaissance de 66 % (Scroll, 9 juillet 2017), rendement du bambou à Mendha-Lekha (Down To Earth, 19 décembre 2017)."]
