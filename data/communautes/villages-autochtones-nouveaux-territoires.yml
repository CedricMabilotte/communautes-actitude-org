droits:
  autogouvernement: {valeur: "partiel", note: "Dans chacun des 603 villages autochtones, les habitants autochtones élisent un ou plusieurs représentants des habitants autochtones (789 sièges, mandat 2023-2027) selon l'ordonnance cap. 576 (2003) ; chaque représentant exprime les vues des habitants autochtones sur les affaires du village et traite des affaires liées à leurs droits et intérêts traditionnels légaux et à leur mode de vie traditionnel. Avec les représentants des résidents, ils siègent dans les comités ruraux, qui composent la Heung Yee Kuk (ordonnance cap. 1097, 1959). Ces instances ont un rôle de représentation et de consultation, sans compétence administrative propre établie par les sources consultées.", source: "https://www.had.gov.hk/rre/eng/rural_representative_elections/introduction.htm"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La politique des petites maisons (1972) ouvre à chaque habitant autochtone, homme âgé d'au moins 18 ans descendant en ligne masculine d'un résident de 1898 d'un village reconnu, une seule concession dans sa vie pour bâtir une maison de trois étages au plus dans la zone de village ou ses abords ; le représentant des habitants autochtones ou le comité rural certifie le statut du demandeur. Le gouvernement indique que la Cour d'appel final a confirmé le 5 novembre 2021 que les trois formes de concession relèvent de l'art. 40 de la Loi fondamentale. Le droit est attribué à des individus ; la maîtrise collective des terres de village n'est pas établie par les sources consultées.", source: "http://www.landsd.gov.hk/en/images/doc/NTSHP_E_text.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "reconnu", note: "L'annexe II de la Loi fondamentale (version de 2021) fait de la Heung Yee Kuk l'une des 28 circonscriptions fonctionnelles (sièges élus par un collège sectoriel) du Conseil législatif ; la Heung Yee Kuk réunit les comités ruraux, où siègent les représentants des habitants autochtones et des résidents des villages.", source: "https://www.basiclaw.gov.hk/en/basiclaw/annex2.html"}
  statut_personnel: {valeur: "partiel", note: "Le statut d'habitant autochtone se transmet en ligne masculine depuis un résident de 1898 d'un village établi ; il ouvre le droit de vote pour les représentants des habitants autochtones (cap. 576), la concession de petite maison (politique de 1972) et le loyer foncier inchangé (art. 122 de la Loi fondamentale). Il ne crée pas de citoyenneté distincte.", source: "https://www.basiclaw.gov.hk/en/basiclaw/chapter5.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Le Comité pour l'élimination de la discrimination à l'égard des femmes relève en 2023 le maintien de la politique des petites maisons au profit des descendants masculins des villageois autochtones des Nouveaux Territoires et demande qu'elle s'applique sans discrimination envers les femmes (CEDAW/C/CHN/CO/9, § 63-64) ; il avait demandé en 2006 le retrait de ses dispositions discriminatoires. Les élections des représentants ruraux se tiennent tous les quatre ans (mandat 2023-2027).", source: "https://documents.un.org/api/symbol/access?s=CEDAW/C/CHN/CO/9&l=en&t=pdf"}
chronologie:
  - {annee: 1898, evenement: "Seconde convention de Pékin : les Nouveaux Territoires sont cédés à bail au Royaume-Uni pour 99 ans ; les résidents des villages établis cette année-là servent de référence au statut d'habitant autochtone."}
  - {annee: 1926, evenement: "Création de la Heung Yee Kuk."}
  - {annee: 1959, evenement: "Ordonnance sur la Heung Yee Kuk (cap. 1097) : la Heung Yee Kuk devient un organe consultatif établi par la loi."}
  - {annee: 1972, evenement: "Introduction de la politique des petites maisons."}
  - {annee: 1990, evenement: "Adoption de la Loi fondamentale, dont les art. 40 et 122 visent les habitants autochtones des Nouveaux Territoires."}
  - {annee: 1994, evenement: "Une ordonnance ouvre aux femmes l'héritage des terres rurales malgré l'opposition de la Heung Yee Kuk."}
  - {annee: 1997, evenement: "Entrée en vigueur de la Loi fondamentale."}
  - {annee: 2003, evenement: "Ordonnance sur l'élection des représentants de village (cap. 576), renommée en 2014 ordonnance sur l'élection des représentants ruraux."}
  - {annee: 2006, evenement: "Le Comité pour l'élimination de la discrimination à l'égard des femmes demande le retrait des dispositions discriminatoires de la politique des petites maisons."}
  - {annee: 2019, evenement: "Le tribunal de première instance juge contraires à la Loi fondamentale deux des trois modes d'attribution des petites maisons."}
  - {annee: 2021, evenement: "La Cour d'appel (13 janvier) puis la Cour d'appel final (5 novembre) jugent la politique des petites maisons conforme à la Loi fondamentale."}
  - {annee: 2023, evenement: "Début du mandat 2023-2027 des représentants ruraux : 789 sièges de représentants des habitants autochtones dans 603 villages."}
fiabilite:
  verifie:
    - "Texte des art. 40 et 122 de la Loi fondamentale et présence de la Heung Yee Kuk parmi les circonscriptions fonctionnelles de l'annexe II (site officiel basiclaw.gov.hk)."
    - "603 villages autochtones, 789 sièges de représentants des habitants autochtones, 27 comités ruraux, mandat 2023-2027 (département des affaires intérieures)."
    - "Liste des 603 villages tirée des listes officielles des représentants ruraux par comité rural (2023-2027)."
    - "Observations du CEDAW de 2006 (§ 37-38) et de 2023 (§ 63-64) sur la politique des petites maisons."
    - "Critères et forme de la concession de petite maison (brochure du département des terres) ; confirmation par la Cour d'appel final le 5 novembre 2021 (communiqué du gouvernement)."
  non_confirme:
    - "Arrêt de la Cour d'appel final du 5 novembre 2021 : date et portée vérifiées sur le communiqué du gouvernement, pas sur le texte de l'arrêt."
    - "Terres tso/tong (patrimoine indivis d'une lignée) : environ 2 400 hectares selon la Heung Yee Kuk, vente soumise à l'accord unanime de la lignée ; chiffres rapportés par une encyclopédie en ligne, absents de la fiche."
    - "Nombre d'habitants autochtones : aucune statistique officielle trouvée."
    - "Surface des villages autochtones : aucune donnée trouvée ; le Planning Department de Hong Kong compte 35 km² classés « Rural Settlement » (maisons de village et constructions temporaires, décembre 2021) pour l'ensemble de Hong Kong, villages non autochtones compris, chiffre qui ne correspond pas au périmètre de la fiche."
    - "Reconnaissance de la coutume chinoise par l'ordonnance sur les Nouveaux Territoires (cap. 97) et gestion des tso/tong : texte officiel non consulté."
