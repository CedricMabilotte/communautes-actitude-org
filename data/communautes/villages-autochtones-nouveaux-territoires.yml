resume: >-
  Fiche agrégée : elle couvre les habitants autochtones (原居民, « indigenous inhabitants ») des Nouveaux Territoires de Hong Kong, c'est-à-dire les personnes qui descendent en ligne masculine d'un résident de 1898 d'un village établi. L'article 40 de la Loi fondamentale (constitution de la Région administrative spéciale, 1990, en vigueur en 1997) protège leurs « droits et intérêts traditionnels légaux » ; l'article 122 maintient inchangé le loyer foncier de leurs terres rurales. Dans 603 villages autochtones, ils élisent 789 représentants des habitants autochtones selon l'ordonnance sur l'élection des représentants ruraux (cap. 576, 2003) ; avec les représentants des résidents, ces représentants siègent dans les 27 comités ruraux des Nouveaux Territoires, qui composent la Heung Yee Kuk, organe consultatif établi par une ordonnance de 1959 et titulaire d'un siège au Conseil législatif. La politique des petites maisons (1972), qui ouvre à chaque homme autochtone un droit à construire une maison, a été jugée conforme à la Loi fondamentale par la Cour d'appel final le 5 novembre 2021.
