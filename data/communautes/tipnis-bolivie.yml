uid: "tipnis-bolivie"
nom: "Territoire indigène et parc national Isiboro Sécure (TIPNIS)"
endonyme: ""
territoire: "Territoire indigène et parc national Isiboro Sécure, entre les rivières Isiboro et Sécure, départements du Beni et de Cochabamba"
etats: ["Bolivie"]
region: "ameriques"
coord: [-16.0, -65.5]
type: "peuple_autochtone"
base: "territoriale"
types_secondaires: []
population: {valeur: 3991, annee: 2001, perimetre: "population autochtone recensée en 2001 dans 44 communautés, hors population des colons du sud ; recensement incomplet (15 communautés non couvertes), le plan de gestion du SERNAP retient plus de 5 000 habitants autochtones", source: "https://tipnisboliviaorg.wordpress.com/wp-content/uploads/2018/10/ges-plan-sernap-00120-2004.pdf"}
lieux: {valeur: 1, unite: "territoire titré en terre communautaire d'origine (titre TCO-NAL-000002)", annee: 1997, source: "https://tipnisboliviaorg.wordpress.com/wp-content/uploads/2018/10/ges-plan-sernap-00120-2004.pdf"}
surface_km2: {valeur: 12363, annee: 1997, perimetre: "polygone du titre provisoire de terre communautaire d'origine de 1997 (1 236 296 ha) ; le plan de gestion mentionne une aire protégée portée à 1 302 757 ha après réintégration de la serranía de Marimonos, et une surface de la TCO réduite par l'exclusion de la zone des colons", source: "https://tipnisboliviaorg.wordpress.com/wp-content/uploads/2018/10/ges-plan-sernap-00120-2004.pdf"}
villages: {valeur: 69, annee: 2012, perimetre: "communautés autochtones du TIPNIS retenues pour la consultation de 2012 (chiffre du Service interculturel de renforcement démocratique, SIFDE)", source: "https://documents.un.org/api/symbol/access?s=A/HRC/25/19/Add.2&l=es&t=pdf"}
resume: >-
  Le TIPNIS est un parc national créé en 1965 et reconnu en 1990 comme territoire des peuples mojeño, yuracaré et chimán (décret suprême 22610). Il est titré en terre communautaire d'origine (TCO, propriété collective d'un peuple autochtone) au nom de la Subcentrale du TIPNIS, qui le cogère avec l'administration des aires protégées par une convention signée en 1997. La loi 180 de 2011 le déclare « zone intangible » (soustraite à toute intervention extérieure) et y interdit toute route ; la loi 969 du 13 août 2017 l'abroge, garantit aux Mojeño-Trinitario, Yuracaré et Chimán l'usage exclusif des ressources renouvelables et soumet toute exploitation par des tiers à des accords avec eux. Le site relève aussi de la fiche agrégée des « territoires indigènes originaires paysans » ; il a sa propre fiche en raison de ces lois spécifiques.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Communication BOL 3/2012 du Rapporteur spécial James Anaya (appel urgent du 27 septembre 2011) sur la route Villa Tunari-San Ignacio de Moxos à travers le TIPNIS ; observations sur la loi 180, la consultation de 2012 et la sentence constitutionnelle de 2012 (A/HRC/21/47/Add.3, § 17 à 19).", annee: 2012, source: "https://documents.un.org/api/symbol/access?s=A/HRC/21/47/Add.3&l=en&t=pdf"}
  - {mecanisme: "oit_169", detail: "La Bolivie ratifie la Convention 169 de l'OIT le 11 décembre 1991 ; la loi 222 de 2012 sur la consultation du TIPNIS s'y réfère (art. 2 et 5).", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "La Bolivie vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295) et l'incorpore par la loi 3760 de 2007, citée par la loi 222 de 2012 (art. 2 et 6).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Décret suprême 22610 du 24 septembre 1990 reconnaissant le parc national Isiboro Sécure comme « territoire indigène » des peuples mojeño, yuracaré et chimán", nature: "loi", annee: 1990, source: "https://www.lexivox.org/norms/BO-DS-22610.html"}
  - {instrument: "Constitution politique de l'État plurinational de Bolivie, art. 5, 30.II, 190, 385.II et 403", nature: "constitution", annee: 2009, source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  - {instrument: "Loi 180 du 24 octobre 2011 de protection du TIPNIS (abrogée en 2017)", nature: "loi", annee: 2011, source: "https://www.lexivox.org/norms/BO-L-N180.html"}
  - {instrument: "Loi 222 du 10 février 2012 de consultation des peuples autochtones du TIPNIS", nature: "loi", annee: 2012, source: "https://www.lexivox.org/norms/BO-L-N222.html"}
  - {instrument: "Loi 969 du 13 août 2017 de protection et de développement intégral et durable du TIPNIS", nature: "loi", annee: 2017, source: "https://www.lexivox.org/norms/BO-L-N969.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Une convention de coadministration signée en 1997 et renouvelée en 2002 pour cinq ans confie à la Subcentrale du TIPNIS la gestion du territoire sous la supervision de l'administration des aires protégées ; la Constitution (art. 385.II) prévoit la gestion partagée des aires protégées superposées aux territoires autochtones ; la loi 969 de 2017 (disposition finale) crée une commission conjointe de suivi formée des ministères et des trois peuples.", source: "https://tipnisboliviaorg.wordpress.com/wp-content/uploads/2018/10/ges-plan-sernap-00120-2004.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 403.I et 385.II) reconnaît l'application des normes propres sur le territoire et la gestion partagée des aires protégées selon ces normes ; la loi 969 de 2017 (art. 10) fait répartir les bénéfices selon les normes et procédures propres des communautés.", source: "https://www.lexivox.org/norms/BO-L-N969.html"}
  justice_propre: {valeur: "partiel", note: "La Constitution (art. 190) reconnaît la « juridiction indigène originaire paysanne » ; en 2013, la Subcentrale du TIPNIS invoque la justice autochtone pour des faits survenus en juin et saisit le Tribunal constitutionnel plurinational d'un conflit de compétence, qui suspend l'action des deux juridictions jusqu'à sa décision (A/HRC/25/19/Add.2, § 27).", source: "https://documents.un.org/api/symbol/access?s=A/HRC/25/19/Add.2&l=es&t=pdf"}
  terres: {valeur: "reconnu", note: "Le décret suprême 22610 de 1990 (art. 1) reconnaît le parc comme territoire des peuples mojeño, yuracaré et chimán ; le titre TCO-NAL-000002 du 25 avril 1997 l'attribue à la Subcentrale du TIPNIS ; la loi 969 de 2017 (art. 5 et 6) désigne les peuples comme titulaires du territoire et interdit les occupations par des tiers.", source: "https://www.lexivox.org/norms/BO-L-N969.html"}
  ressources: {valeur: "partiel", note: "La loi 969 de 2017 (art. 4 et 6.1) réserve aux peuples du TIPNIS l'usage exclusif des ressources renouvelables ; l'art. 10 admet une exploitation par des tiers privés sous réserve d'accords avec eux, d'une part des bénéfices et d'une autorisation de l'État ; les règles du parc national encadrent ces usages.", source: "https://www.lexivox.org/norms/BO-L-N969.html"}
  consentement: {valeur: "conteste", note: "Le décret 22610 de 1990 (art. 6) impose de consulter l'organisation autochtone sur tout projet ; la consultation de 2012 prévue par la loi 222 (art. 4) a eu lieu dans 58 des 69 communautés ; selon les rapports des ministères et du SIFDE cités par le Haut-Commissariat aux droits de l'homme, l'information est remise le jour même et aucune étude des effets sociaux et environnementaux n'est présentée (A/HRC/25/19/Add.2, § 23 et 24) ; la loi 969 de 2017 s'en réclame.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/25/19/Add.2&l=es&t=pdf"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5.I) fait du mojeño-trinitario, du mojeño-ignaciano, du yuracaré et du chimán des langues officielles de l'État ; la loi 222 de 2012 (art. 5) les retient pour la consultation.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  education: {valeur: "partiel", note: "La Constitution (art. 30.II.12) garantit aux peuples autochtones une éducation intraculturelle, interculturelle et plurilingue dans tout le système éducatif ; aucune source consultée ne fait état d'un système scolaire propre au territoire.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Le Haut-Commissariat relève en 2013 que la consultation n'a pas pu être concertée avec toutes les communautés, comme l'exigeait la sentence constitutionnelle 0300/2012 ; IWGIA indique que la direction et les communautés du TIPNIS nient avoir demandé la loi 969, contre laquelle des recours en inconstitutionnalité (députés d'opposition) et des actions populaires (Assemblée permanente des droits de l'homme de Bolivie) sont déposés en 2017.", source: "https://www.iwgia.org/images/documents/indigenous-world/indigenous-world-2018.pdf"}
chronologie:
  - {annee: 1965, evenement: "Création du parc national Isiboro Sécure (décret-loi 7401 du 22 novembre)."}
  - {annee: 1990, evenement: "Le décret suprême 22610 (24 septembre) reconnaît le parc comme « territoire indigène » des peuples mojeño, yuracaré et chimán."}
  - {annee: 1997, evenement: "Titre TCO-NAL-000002 (25 avril) au nom de la Subcentrale du TIPNIS ; convention de coadministration avec l'administration des aires protégées."}
  - {annee: 2002, evenement: "Renouvellement de la convention de coadministration pour cinq ans."}
  - {annee: 2011, evenement: "Huitième marche autochtone contre la route Villa Tunari-San Ignacio de Moxos ; la loi 180 (24 octobre) déclare le TIPNIS zone intangible et interdit toute route."}
  - {annee: 2012, evenement: "La loi 222 (10 février) convoque une consultation ; sentence constitutionnelle 0300/2012 ; consultation de juillet à décembre dans 58 des 69 communautés."}
  - {annee: 2017, evenement: "La loi 969 (13 août) abroge la loi 180, réserve aux trois peuples l'usage exclusif des ressources renouvelables et crée une commission conjointe de suivi."}
fiabilite:
  verifie: ["Articles 1 à 7 du décret suprême 22610 de 1990.", "Articles 1 à 5 de la loi 180 de 2011.", "Articles 1 à 8 de la loi 222 de 2012.", "Articles 1 à 12, disposition finale et disposition abrogatoire de la loi 969 de 2017.", "Articles 5, 190, 385.II et 403 de la Constitution de 2009.", "Titre TCO-NAL-000002 de 1997, surface de 1 236 296 ha, coadministration et population de 2001, plan de gestion du SERNAP.", "Rapports A/HRC/19/21/Add.2, A/HRC/22/17/Add.2, A/HRC/25/19/Add.2 et communication BOL 3/2012 (A/HRC/21/47/Add.3)."]
  non_confirme: ["Date et surface du titre définitif de la TCO : le Haut-Commissariat indique un titrage en 2008 (A/HRC/19/21/Add.2, § 18), sans surface.", "Date de la loi 969 : le texte porte le 13 août 2017, LexiVox l'intitule au 14 août.", "Issue des recours en inconstitutionnalité contre la loi 969 et état de la commission conjointe.", "Validité actuelle de la convention de coadministration, renouvelée en 2002 pour cinq ans.", "Nombre actuel de communautés et population : 64 communautés selon le Haut-Commissariat en 2011, 69 selon le SIFDE en 2012."]
