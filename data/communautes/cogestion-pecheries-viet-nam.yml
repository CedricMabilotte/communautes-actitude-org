resume: >-
  Fiche agrégée : elle couvre les organisations communautaires de pêcheurs reconnues au titre de la cogestion (partage par l'État de ses pouvoirs et responsabilités avec une communauté) dans la protection des ressources halieutiques. La loi sur la pêche n° 18/2017/QH14 du 21 novembre 2017, en vigueur depuis le 1er janvier 2019, définit ce régime (art. 3, points 4 et 5) et l'organise à l'article 10 ; le décret n° 26/2019/ND-CP du 8 mars 2019 (art. 5 et 6) en fixe la procédure. Une organisation formée de ménages et de personnes qui vivent des ressources d'une zone reçoit, par décision du comité populaire de district ou de province, le droit de gérer et d'exploiter cette zone selon un plan et un règlement qu'elle adopte. En 2024, 19 organisations étaient reconnues dans sept provinces (Hà Tĩnh, Quảng Nam, Bình Định, Phú Yên, Khánh Hòa, Bình Thuận, Tuyên Quang) ; dans la province de Thừa Thiên Huế, 22 sous-associations de pêche rattachées à l'association provinciale des pêches cogèrent 22 zones de protection des ressources dans la lagune de Tam Giang (22 000 hectares) et sur la côte.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Viêt Nam à la Convention sur la diversité biologique (2019) : il cite l'article 10 de la loi sur la pêche de 2017, selon lequel les organisations communautaires sont reconnues et reçoivent des droits de gestion dans la protection des ressources halieutiques, et mentionne les 23 zones de protection des pêches établies depuis 2015 dans les lagunes de Tam Giang et Cầu Hai (614 hectares) pour une conservation fondée sur la communauté", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/vn-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi sur la pêche n° 18/2017/QH14 du 21 novembre 2017, art. 3 (points 4 et 5), art. 10 « Cogestion dans la protection des ressources halieutiques » et art. 22 « Fonds communautaires » ; en vigueur le 1er janvier 2019 (art. 104), texte consolidé n° 01/VBHN-VPQH du 16 septembre 2024", nature: "loi", annee: 2017, source: "https://faolex.fao.org/docs/pdf/vie171855V.pdf"}
  - {instrument: "Décret n° 26/2019/ND-CP du 8 mars 2019 précisant certains articles et mesures d'application de la loi sur la pêche, chapitre II, section 1, art. 5 (reconnaissance et attribution du droit de gestion aux organisations communautaires) et art. 6 (rapports d'activité)", nature: "loi", annee: 2019, source: "https://faolex.fao.org/docs/pdf/vie191156.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'organisation communautaire est formée de membres volontaires, avec ou sans personnalité juridique, et désigne un représentant nommé dans la décision de reconnaissance (loi de 2017, art. 3 point 5 et art. 10 al. 3) ; son règlement de fonctionnement est adopté par au moins deux tiers des membres (décret de 2019, art. 5 al. 3) ; l'autorité qui la reconnaît contrôle ses activités, reçoit un rapport annuel avant le 10 novembre et peut modifier ou retirer la décision (loi, art. 10 al. 4 et 7 ; décret, art. 6).", source: "https://faolex.fao.org/docs/pdf/vie171855.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'organisation adopte un plan de protection et d'exploitation des ressources halieutiques et un règlement de fonctionnement, repris dans la décision de reconnaissance (loi de 2017, art. 10 al. 1 et 3) ; elle prévient les infractions dans sa zone selon la loi et ce règlement (art. 10 al. 5 c) ; dans les trois jours ouvrables suivant la réception du dossier complet, le plan est publié et affiché aux sièges des comités populaires concernés, puis l'autorité vérifie dans les 60 jours sa conformité au droit de la pêche et décide (décret de 2019, art. 5 al. 2 et 3).", source: "https://faolex.fao.org/docs/pdf/vie171855.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La décision de reconnaissance fixe l'emplacement et les limites de la zone géographique attribuée, qui ne doit pas être déjà gérée par une autre organisation ou personne (loi de 2017, art. 10 al. 1 b et al. 3 c) ; la loi attribue un droit de gestion, non un titre de propriété, et la décision peut être retirée pour des motifs de défense, de sécurité ou d'intérêt public, ou si le plan n'est pas appliqué (art. 10 al. 7).", source: "https://faolex.fao.org/docs/pdf/vie171855.pdf"}
  ressources: {valeur: "partiel", note: "L'organisation organise et gère l'aquaculture, la protection et l'exploitation des ressources halieutiques et le tourisme lié à la pêche dans sa zone, et y patrouille et inspecte les activités de pêche, en saisissant les autorités compétentes des infractions (loi de 2017, art. 10 al. 5 a et b) ; elle respecte le droit de la pêche et les inspections de l'État (art. 10 al. 6).", source: "https://faolex.fao.org/docs/pdf/vie171855.pdf"}
  consentement: {valeur: "partiel", note: "L'organisation a le droit d'être consultée sur les projets et activités qui touchent directement l'écosystème ou les ressources halieutiques de sa zone (loi de 2017, art. 10 al. 5 d) ; aucun texte consulté ne subordonne ces projets à son consentement.", source: "https://faolex.fao.org/docs/pdf/vie171855.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'organisation peut créer un fonds communautaire (loi de 2017, art. 10 al. 5 e), fonds social qui peut recevoir un soutien du fonds de protection et de développement des ressources halieutiques et d'autres sources légales (art. 22) ; aucun budget n'est garanti et aucun pouvoir fiscal n'est prévu.", source: "https://faolex.fao.org/docs/pdf/vie171855.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante du régime n'a été trouvée ; le quotidien Nhân Dân rapporte en 2024, d'après un responsable de la direction générale des pêches, des premiers résultats des modèles de cogestion (baisse des pratiques de pêche destructrices, reconstitution progressive des ressources) et 19 organisations reconnues dans sept provinces.", source: "https://en.nhandan.vn/co-management-promoted-to-protect-fisheries-post138695.html"}
chronologie:
  - {annee: 2015, evenement: "À partir de 2015, création de 23 zones de protection des pêches (614 hectares) pour une conservation fondée sur la communauté dans les lagunes de Tam Giang et Cầu Hai, selon le rapport à la CDB."}
  - {annee: 2017, evenement: "Loi sur la pêche n° 18/2017/QH14 du 21 novembre : l'article 10 crée la reconnaissance des organisations communautaires de cogestion."}
  - {annee: 2019, evenement: "Entrée en vigueur de la loi le 1er janvier ; décret n° 26/2019/ND-CP du 8 mars fixant la procédure de reconnaissance (art. 5 et 6)."}
  - {annee: 2024, evenement: "Texte consolidé de la loi du 16 septembre après les modifications liées à la loi foncière de 2024 ; le ministère de l'Agriculture désigne l'année pour renforcer la cogestion ; 19 organisations reconnues dans sept provinces."}
fiabilite:
  verifie: ["Loi n° 18/2017/QH14 : art. 3 points 4 et 5, art. 10 (al. 1 à 7), art. 20 à 22 et art. 104, sur le texte vietnamien et sur la traduction anglaise du texte consolidé de 2024 publiée par FAOLEX.", "Décret n° 26/2019/ND-CP du 8 mars 2019 : art. 5 et 6, lus sur le texte vietnamien scanné publié par FAOLEX.", "Sixième rapport national du Viêt Nam à la CDB (2019) : mention de l'article 10 de la loi et des 23 zones des lagunes de Tam Giang et Cầu Hai.", "Chiffres de 2024 (19 organisations, sept provinces dont la liste, 22 sous-associations et 22 zones dans la province de Thừa Thiên Huế) : article de Nhân Dân du 28 août 2024."]
  non_confirme: ["Nombre total d'organisations reconnues dans tout le pays : aucune liste officielle nationale trouvée ; la source ne dit pas si les 19 organisations citées en 2024 incluent les 22 sous-associations de Thừa Thiên Huế.", "Effet sur l'article 10 de la réforme administrative de 2025, qui aurait supprimé l'échelon du district (compétence de reconnaissance des comités populaires de district) : non vérifié sur un texte.", "Surface totale des zones attribuées et nombre de membres : non trouvés ; les 22 000 hectares cités sont la surface de la lagune, pas celle des zones cogérées.", "La traduction anglaise de la loi est une traduction privée (Thư Viện Pháp Luật) ; le texte vietnamien fait foi.", "Nombre de villages : non trouvé.", "Population (membres des organisations de cogestion) : non trouvée."]
