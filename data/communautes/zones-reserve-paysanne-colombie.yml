resume: >-
  Fiche agrégée : elle couvre les communautés paysannes des zones de réserve paysanne (Zonas de Reserva Campesina, ZRC) de Colombie. La loi 160 de 1994 sur la réforme agraire (chapitre XIII) définit ces zones comme des aires délimitées par l'autorité foncière dans les régions de colonisation et de terres publiques (baldíos, terres de la Nation non attribuées), afin de favoriser la petite propriété paysanne et de limiter la concentration foncière. Chaque zone est constituée à la demande d'organisations paysannes, sur la base d'un plan de développement durable présenté en audience publique. La zone ne donne pas de titre collectif : elle fixe des plafonds de propriété individuelle et oriente l'attribution des terres publiques vers les paysans. Depuis 2023, l'article 64 de la Constitution reconnaît la paysannerie comme sujet de droits et de protection spéciale. L'Agence nationale des terres recense 30 zones constituées en août 2026, dont 23 depuis décembre 2022.
