reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "L'Accord final de paix de 2016 entre le gouvernement et les FARC-EP (point 1.1.10) engage l'État à appuyer les plans de développement des zones de réserve paysanne constituées et à constituer. La Mission de vérification des Nations unies en Colombie suit cet accord ; le rapport du Secrétaire général S/2025/188 (§ 45) indique que deux nouvelles zones ont été constituées fin décembre 2024, « bringing the total to 20 », et que sept autres sont prévues en 2025", annee: 2025, source: "https://docs.un.org/en/S/2025/188"}
base_nationale:
  - {instrument: "Constitution politique de 1991, article 64 modifié par l'Acte législatif 01 de 2023 : la paysannerie est sujet de droits et de protection spéciale ; l'État garantit ses droits individuels et collectifs, dont la terre et le territoire", nature: "constitution", annee: 2023, source: "http://www.secretariasenado.gov.co/senado/basedoc/acto_legislativo_01_2023.html"}
  - {instrument: "Loi 160 de 1994 (Système national de réforme agraire et de développement rural paysan), article 1, neuvième objectif, et chapitre XIII, articles 79 à 84", nature: "loi", annee: 1994, source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0160_1994_pr001.html"}
  - {instrument: "Décret 1777 de 1996 portant règlement partiel du chapitre XIII de la loi 160 de 1994 sur les zones de réserve paysanne, compilé dans le décret 1071 de 2015 (articles 2.14.13.1 et suivants)", nature: "loi", annee: 1996, source: "https://www.ant.gov.co/normativa?title=1777"}
  - {instrument: "Accord 024 de 1996 du conseil d'administration de l'INCORA : critères et procédure de sélection et de délimitation des zones de réserve paysanne", nature: "loi", annee: 1996, source: "https://www.ant.gov.co/sites/default/files/2024-10/normas/archivos/alcance-zonas-de-reserva-campesina.pdf"}
  - {instrument: "Décret 1147 de 2024 : application du régime des zones de réserve paysanne aux zones de réserve forestière de la loi 2 de 1959 et aux zones existantes, pour leur extension et leur consolidation", nature: "loi", annee: 2024, source: "https://indepaz.org.co/zonas-de-reserva-campesina-en-los-acuerdos-para-la-paz-en-la-amazonia-2/"}
  - {instrument: "Accord final pour la fin du conflit et la construction d'une paix stable et durable, point 1.1.10", nature: "accord_paix", annee: 2016, source: "https://www.jep.gov.co/Marco%20Normativo/Normativa_v2/01%20ACUERDOS/N01.pdf"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi 160 de 1994 prévoit d'établir les zones pour favoriser la petite propriété rurale et de donner la préférence aux paysans de faibles ressources dans l'attribution des terres publiques (art. 1, neuvième objectif) ; dans chaque zone, le règlement fixe en unités agricoles familiales (UAF, surface jugée suffisante pour une famille) les surfaces minimales et maximales attribuables et le nombre d'UAF qu'une personne peut posséder, et l'autorité foncière acquiert ou exproprie les surfaces qui dépassent ces plafonds (art. 80) ; il n'y a pas de titre collectif, la propriété reste individuelle.", source: "http://www.secretariasenado.gov.co/senado/basedoc/ley_0160_1994_pr001.html"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "La participation des maires et des « organizaciones representativas de los intereses de los colonos » à la formulation et à l'exécution des plans de développement des zones est obligatoire (loi 160 de 1994, art. 84) ; la décision de constitution reprend le plan de développement durable et les engagements pris en audience publique (accord INCORA 024 de 1996, art. 9) ; le texte ne prévoit pas de consentement de la communauté aux projets extérieurs, et un avis juridique de l'Agence nationale des terres (2018) note que le code minier ne range pas ces zones parmi les aires exclues de l'activité minière.", source: "https://www.ant.gov.co/sites/default/files/2024-10/normas/archivos/alcance-zonas-de-reserva-campesina.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Six zones ont été constituées entre 1997 et 2002, une en 2018, puis 23 entre décembre 2022 et août 2026 selon l'Agence nationale des terres. Camilo González Posso (Indepaz, janvier 2026) écrit que la figure a été « relegado por distintos gobiernos » et que la zone du Guaviare « fue despoblada a pocos años de su constitución en 1997 » ; le rapport S/2024/694 du Secrétaire général de l'ONU (§ 63) appelle au dialogue entre organisations ethniques et paysannes pour réduire les tensions liées, entre autres, à la constitution des zones.", source: "https://indepaz.org.co/zonas-de-reserva-campesina-en-los-acuerdos-para-la-paz-en-la-amazonia-2/"}
chronologie:
  - {annee: 1994, evenement: "La loi 160 crée la figure des zones de réserve paysanne (chapitre XIII)."}
  - {annee: 1996, evenement: "Décret 1777 et accord INCORA 024 : objectifs, critères et procédure de constitution."}
  - {annee: 1997, evenement: "Premières zones constituées le 18 décembre : Guaviare (résolution 054) et Cuenca del Río Pato y Valle de Balsillas, Caquetá (résolution 055)."}
  - {annee: 2002, evenement: "Constitution de la zone du Valle del Río Cimitarra (Antioquia, Bolívar), sixième zone."}
  - {annee: 2016, evenement: "L'Accord final de paix (point 1.1.10) engage l'État à appuyer les plans de développement des zones constituées et à constituer."}
  - {annee: 2018, evenement: "Constitution de la zone Montes de María II (Bolívar), accord 57."}
  - {annee: 2022, evenement: "Constitution en décembre des zones de Sumapaz, Güéjar-Cafre et La Tuna."}
  - {annee: 2023, evenement: "L'Acte législatif 01 modifie l'article 64 de la Constitution : la paysannerie devient sujet de droits et de protection spéciale."}
  - {annee: 2024, evenement: "Décret 1147 sur les zones situées en réserve forestière ; sept zones constituées dans l'année."}
  - {annee: 2025, evenement: "Sept zones constituées dans l'année ; l'Agence nationale des terres annonce 21 zones en décembre."}
  - {annee: 2026, evenement: "Trois zones constituées entre juin et août ; le jeu de données de l'Agence nationale des terres compte 30 zones."}
fiabilite:
  verifie: ["Loi 160 de 1994, article 1 (neuvième objectif) et articles 79 à 84, sur le texte publié par le Secrétariat du Sénat.", "Article 64 de la Constitution modifié par l'Acte législatif 01 du 5 juillet 2023 (Secrétariat du Sénat).", "Accord INCORA 024 de 1996, articles 2 et 9, et renvoi au décret 1071 de 2015, art. 2.14.13.1 et 2.14.13.3, cités dans l'avis juridique de l'Agence nationale des terres du 28 mai 2018.", "Accord final de paix du 24 novembre 2016, point 1.1.10 (texte publié par la Juridiction spéciale pour la paix).", "Rapport du Secrétaire général S/2025/188, § 45 : 20 zones fin décembre 2024.", "Jeu de données de l'Agence nationale des terres (mis à jour le 19 août 2026) : 30 zones, acte de constitution, date, surface et habitants par zone ; somme des surfaces et des habitants calculée sur ce jeu.", "Communiqués de l'Agence nationale des terres : 14 zones en avril 2024, 23 zones le 4 novembre 2025, 21 zones le 11 décembre 2025."]
  non_confirme: ["Le texte du décret 1777 de 1996 n'a pas été lu directement (site SUIN-Juriscol inaccessible) ; son contenu est connu par l'avis juridique de l'Agence nationale des terres et la compilation dans le décret 1071 de 2015.", "Le texte du décret 1147 de 2024 n'a pas été lu sur une source officielle ; sa portée est connue par l'analyse d'Indepaz.", "Les accords 315 et 337 de 2023 de l'Agence nationale des terres (régularisation de l'occupation, directives de constitution et de gestion), cités par Indepaz, n'ont pas été consultés ; l'existence de restrictions à la vente des terres attribuées n'est donc pas vérifiée.", "Les comptages publics divergent : un communiqué du 4 novembre 2025 annonce 23 zones, celui du 11 décembre 2025 en annonce 21, le jeu de données en compte 30 en août 2026 ; l'identifiant 22 manque dans la numérotation du jeu de données.", "Les chiffres d'habitants du jeu de données n'ont pas d'année de référence commune et manquent pour quatre zones ; la zone du Guaviare (473 027 ha) figure avec 24 884 habitants alors qu'Indepaz la décrit comme dépeuplée.", "La surface de la zone Cuenca del Río Pato y Valle de Balsillas a été modifiée en 2024 (accord 389) ; la surface du tableau est celle du polygone actuel.", "La position de la Colombie lors du vote de la Déclaration des Nations unies sur les droits des paysans (2018) n'a pas été vérifiée ; aucun document onusien visant le régime au titre de cette déclaration n'a été trouvé."]
