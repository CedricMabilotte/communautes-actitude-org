resume: >-
  Le Statewide Treaty Act 2025 (loi sur le traité à l'échelle de l'État) de Victoria, adopté par l'Assemblée législative le 16 octobre 2025 et par le Conseil législatif le 30 octobre 2025, est le premier traité inscrit dans une loi en Australie. Il crée Gellung Warl, personne morale de droit public qui représente les Premiers peuples de Victoria, définis comme les propriétaires traditionnels (Traditional Owners) et les Aborigènes et insulaires du détroit de Torres qui vivent dans l'État. Gellung Warl réunit trois composantes : la First Peoples' Assembly of Victoria, assemblée élue qui décide et édicte des règles ; Nginma Ngainga Wara, mécanisme de redevabilité du gouvernement ; Nyerna Yoorrook Telkuna, chargé de la recherche de la vérité historique et de l'éducation. L'assemblée conseille le Parlement et le gouvernement sans droit de veto ; la plupart des dispositions sont en vigueur depuis le 1er mai 2026. Les accords de règlement de 2010, les parties aborigènes enregistrées et les fiducies de Lake Tyers et de Framlingham font l'objet de fiches distinctes.
