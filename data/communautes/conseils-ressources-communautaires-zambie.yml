reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national de la Zambie à la Convention sur la diversité biologique (soumis le 28 février 2019) : il cite les Community Resource Boards prévus par la loi sur la faune comme mécanisme de partage avec les communautés des recettes de la chasse et des concessions dans les zones de gestion du gibier, et indique que la loi est appliquée, partage des bénéfices compris", annee: 2019, source: "https://chm.cbd.int/database/record?documentID=241363"}
base_nationale:
  - {instrument: "Zambia Wildlife Act, 2015 (loi n° 14 de 2015), art. 5 (2) (o), 28, 32 à 35 ; en vigueur le 6 novembre 2015 (SI 84 de 2015)", nature: "loi", annee: 2015, source: "https://www.zambialaws.com/z/411-zambia-wildlife-act"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté d'une chefferie s'enregistre comme conseil communautaire des ressources ; sept à dix membres sont élus par la communauté pour trois ans, aux côtés d'un représentant du conseil local (city, municipal ou district council), d'un représentant du chef et d'un agent détaché par le ministre ; le directeur peut dissoudre ou radier le conseil, en consultation avec le ministre et la majorité des membres de la communauté (loi n° 14 de 2015, art. 32 (1) à (3) et (7), art. 34 (2)).", source: "https://www.zambialaws.com/z/411-zambia-wildlife-act"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le conseil gère la faune de son ressort dans les quotas fixés par le département des parcs nationaux et de la faune, nomme des gardes communautaires placés sous la supervision d'un agent de police de la faune et élabore avec le directeur des plans de gestion des usages du sol (loi n° 14 de 2015, art. 33 (2) (b) à (d)) ; le département verse au fonds du conseil une part des recettes des licences, permis et concessions de chasse de sa zone, selon les modalités fixées par le ministre (art. 5 (2) (o)) ; les redevances d'usage foncier payées par les investisseurs sont partagées entre le ministère et la communauté (art. 28 (5)).", source: "https://www.zambialaws.com/z/411-zambia-wildlife-act"}
  consentement: {valeur: "partiel", note: "Le président déclare une zone de gestion du gibier après consultation du ministre et de la communauté locale (loi n° 14 de 2015, art. 28 (1)) ; le conseil négocie, avec le département, les accords de cogestion avec les organisateurs de chasse et les opérateurs de tourisme photographique (art. 33 (2) (a)) ; la loi prévoit une consultation, non un consentement.", source: "https://www.zambialaws.com/z/411-zambia-wildlife-act"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Chaque conseil crée un fonds pour le bien-être économique et social de la communauté, alimenté par la part des recettes de la faune et par des dons acceptés avec l'accord du ministre ; les comptes sont audités chaque année, remis au ministre et ouverts à tout membre de la communauté (loi n° 14 de 2015, art. 35).", source: "https://www.zambialaws.com/z/411-zambia-wildlife-act"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le sixième rapport national à la CDB (2019) indique que la loi est appliquée, partage des bénéfices par les conseils compris. Une étude de 2014 (Lindsey et al., PLOS ONE), sous la loi de 1998, relève que l'autorité de la faune reversait aux communautés 20 % des droits de concession et 50 % des droits d'abattage des trophées, que les recettes des conseils donnaient lieu à des irrégularités financières fréquentes, que les gardes villageois étaient payés de façon irrégulière et que les chefs pouvaient révoquer à leur gré les membres des conseils. Une étude de 2022 (Frontiers in Conservation Science) relève que les femmes occupaient moins de 10 % des sièges des 76 conseils avant 2018 ; dans quatre chefferies autour du parc national de North Luangwa, après des élections pilotes engagées en 2020, elles occupent un siège sur quatre, contre 4 % en 2018.", source: "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0094109"}
chronologie:
  - {annee: 1998, evenement: "La loi sur la faune de 1998 crée l'autorité zambienne de la faune (ZAWA) et désigne les Community Resource Boards comme institutions de cogestion de la faune dans les zones de gestion du gibier."}
  - {annee: 2013, evenement: "Moratoire sur la chasse dans les zones de gestion du gibier, imposé au début de l'année."}
  - {annee: 2015, evenement: "Loi n° 14 de 2015 sur la faune, en vigueur le 6 novembre : elle abroge la loi de 1998, transfère les fonctions de la ZAWA au département des parcs nationaux et de la faune et reprend les conseils communautaires des ressources (art. 32 à 35)."}
  - {annee: 2019, evenement: "Le sixième rapport national de la Zambie à la CDB cite les conseils comme mécanisme de partage des recettes de la faune."}
  - {annee: 2020, evenement: "Élections pilotes des conseils dans les chefferies de Chifunda, Chikwa, Mukungule et Nabwalya, autour du parc national de North Luangwa, avec une procédure visant la participation des femmes."}
fiabilite:
  verifie: ["Texte des articles 2, 5 (2) (o), 28 à 35 de la loi n° 14 de 2015 et date d'entrée en vigueur, sur ZambiaLaws.", "Passages du sixième rapport national de la Zambie à la CDB sur les Community Resource Boards, dans l'enregistrement du centre d'échange de la CDB (soumis le 28 février 2019).", "36 zones de gestion du gibier et 167 000 km² (Lindsey et al., 2014) ; 76 conseils élus avant 2018, élections pilotes de 2020 dans quatre chefferies et part des femmes passée de 4 % à un siège sur quatre (Sommerville et al., 2022).", "Passages de l'étude de 2014 sur les reversements de 20 % et 50 %, les irrégularités financières, la paie irrégulière des gardes villageois et la révocation des membres par les chefs."]
  non_confirme: ["Le tableau 1 de l'étude de 2022 donne 121 membres élus en 2018 et 128 en 2021 ; ces totaux dépassent le plafond de dix élus par conseil pour quatre conseils (art. 32 (3)) et leur périmètre n'est pas précisé.", "Le sixième rapport national à la CDB compte 40 zones de gestion du gibier, les études de 2014 et 2022 en comptent 36 ; l'écart n'est pas expliqué.", "Les taux de reversement de 20 % et 50 % datent du régime de 1998 ; le texte réglementaire qui fixe la part des conseils sous la loi de 2015 (art. 5 (2) (o)) n'a pas été consulté.", "Le nombre de 76 conseils renvoie à une évaluation de 2020 citée par l'étude de 2022 ; aucun registre officiel des conseils enregistrés n'a été trouvé, d'où l'absence de tableau des sites.", "La surface de 167 000 km² est antérieure à la loi de 2015 et ne compte pas les zones ouvertes.", "Le rapport à la CDB précise que la notion de peuple autochtone ne s'applique pas en Zambie, où l'on parle de communautés locales.", "Population des zones de gestion du gibier : non trouvée (ni l'étude de 2014 ni celle de 2022 ne la donnent).", "Nombre de villages : non trouvé."]
