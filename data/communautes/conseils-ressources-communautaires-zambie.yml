resume: >-
  Fiche agrégée : elle couvre les communautés locales qui vivent dans les Game Management Areas (zones de gestion du gibier, aires protégées où l'habitat humain est admis) et dans les zones ouvertes de la Zambie. La loi n° 14 de 2015 sur la faune (Zambia Wildlife Act) permet à la communauté d'une chefferie (territoire d'un chef coutumier reconnu) de s'enregistrer auprès du ministre comme conseil communautaire des ressources (Community Resources Board). Le conseil compte sept à dix représentants élus par la communauté pour trois ans, un représentant du conseil local (city, municipal ou district council), un représentant du chef et un agent détaché par le ministre (art. 32). Il gère la faune dans les quotas fixés par le département des parcs nationaux et de la faune, nomme des gardes communautaires, négocie avec ce département les accords de cogestion avec les organisateurs de chasse et reçoit une part des recettes dans un fonds propre (art. 5, 33 et 35). Une étude de 2022 compte 36 zones de gestion du gibier et 76 conseils élus.
