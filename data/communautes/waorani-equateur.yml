resume: >-
  Les Waorani sont une nationalité autochtone d'Amazonie équatorienne, de langue wao terero, établie entre les fleuves Napo et Curaray. L'État leur attribue en 1983 un titre sur l'ancien protectorat de Tiweno, puis en 1990 un territoire de 612 560 hectares adjugé à « la Etnia Huaorani » ; 679 220 hectares sont aujourd'hui reconnus. Le territoire est gouverné par la Nacionalidad Waorani del Ecuador (NAWE) et les assemblées communautaires ; il chevauche le parc national Yasuní et jouxte la zone intangible des groupes en isolement volontaire Tagaeri et Taromenane. En avril 2019, le tribunal de garanties pénales de Pastaza juge la consultation de 2012 sur le bloc pétrolier 22, dans la partie waorani de Pastaza, contraire aux droits collectifs ; la cour provinciale confirme en juillet 2019.
