resume: >-
  Deux lois de l'État du Queensland de 1991, l'Aboriginal Land Act et le Torres Strait Islander Land Act, organisent le transfert de terres en pleine propriété inaliénable (inalienable freehold : propriété qui ne peut être ni vendue ni hypothéquée) à des fiduciaires qui les détiennent pour les Aborigènes ou les insulaires du détroit de Torrès liés à ces terres. Sont transférables les terres DOGIT (Deeds of Grant in Trust : actes de concession en fiducie au profit des habitants aborigènes ou insulaires), les anciennes réserves et les terres de l'État que le ministre déclare transférables. La loi aborigène ouvrait aussi une revendication fondée sur l'affiliation traditionnelle ou l'association historique, close le 22 décembre 2006. Les fiduciaires sont des land trusts (fiducies foncières) créées par ces lois, des corporations aborigènes et insulaires de droit fédéral ou, pour certaines terres, les conseils de comté d'Aurukun et de Mornington ; aucune nouvelle land trust n'est plus créée, les nouvelles terres vont aux land trusts existantes ou aux corporations. Le volet insulaire recoupe la fiche sur les insulaires du détroit de Torrès.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la visite en Australie (20 mars-3 avril 2017), qui inclut le Queensland : la Rapporteuse spéciale relève les régimes multiples et superposés applicables aux revendications de titre autochtone et aux droits fonciers aux niveaux fédéral, des États et des territoires (§ 99), recommande de revoir ces régimes pour les aligner sur la DNUDPA et de soutenir la cogestion des aires protégées (A/HRC/36/46/Add.2, § 118 a et e) ; les lois du Queensland n'y sont pas nommées.", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=A/HRC/36/46/Add.2&l=en&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Le CERD relève que l'Australie n'agit pas en accord avec le droit des peuples autochtones de posséder et de contrôler leurs terres (§ 19) et recommande d'inscrire le consentement préalable, libre et éclairé dans la loi de 1993 sur les titres fonciers autochtones et, selon qu'il conviendra, dans d'autres textes (CERD/C/AUS/CO/18-20, § 22) ; le document vise les peuples autochtones d'Australie sans nommer le Queensland.", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
base_nationale:
  - {instrument: "Aboriginal Land Act 1991 (Queensland), version en vigueur au 28 avril 2026", nature: "loi", annee: 1991, source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-032"}
  - {instrument: "Torres Strait Islander Land Act 1991 (Queensland), version en vigueur au 28 avril 2026", nature: "loi", annee: 1991, source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-033"}
droits:
  autogouvernement: {valeur: "partiel", note: "La land trust est une personne morale à succession perpétuelle qui peut acquérir des biens, emprunter et ester en justice (Aboriginal Land Act 1991, s. 248) ; ses décisions sur la terre suivent le processus de décision choisi par les Aborigènes concernés ou, à défaut, la tradition aborigène (s. 179) ; compétence limitée à la gestion foncière ; le ministre peut, dans les cas prévus, en nommer des membres (s. 250) et en révoquer ou suspendre (s. 251 et suiv.).", source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-032"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "reconnu", note: "La remise de l'acte de concession fait de la terre une terre aborigène (Aboriginal Land Act 1991, s. 44) ; le fiduciaire ne peut ni la vendre ni l'hypothéquer (s. 100) et ne la transfère qu'avec l'accord du ministre à une autre entité aborigène (s. 104) ; règles équivalentes pour les terres insulaires (Torres Strait Islander Land Act 1991, s. 67).", source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-032"}
  ressources: {valeur: "partiel", note: "Le fiduciaire peut accorder baux, licences et servitudes et conclure des accords sur les produits forestiers et les matériaux de carrière (Aboriginal Land Act 1991, s. 97) ; l'acte de concession réserve à l'État les minéraux, le pétrole et l'énergie géothermique (s. 54 et 81) ; la loi minière de 1989 s'applique aux terres transférées comme à une réserve dont le fiduciaire est le propriétaire (s. 202(2)).", source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-032"}
  consentement: {valeur: "partiel", note: "Avant de désigner le bénéficiaire du transfert, le ministre consulte les Aborigènes concernés par la terre et publie un avis ouvert à leurs observations (Aboriginal Land Act 1991, s. 40(4) et 41) ; le titulaire d'un bail minier doit les consulter sur le tracé de l'accès (s. 202(6)) ; un bail minier sur la surface de la terre requiert le consentement écrit du fiduciaire, auquel le gouverneur en conseil peut substituer le sien (Mineral Resources Act 1989, s. 271A(2), applicable par la s. 202(2)).", source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-032"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le fiduciaire reçoit, sur crédits votés par le Parlement, un pourcentage fixé par règlement des redevances minières, pétrolières ou géothermiques perçues par l'État sur la terre aborigène, à employer au profit des Aborigènes concernés (Aboriginal Land Act 1991, s. 203) ; aucun pouvoir fiscal.", source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/2026-04-28/act-1991-032"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La commission fédérale de réforme du droit (ALRC) rapporte en 2015, d'après le gouvernement du Queensland, 4,5 millions d'hectares transférés au titre des deux lois ; les transferts se poursuivent au cap York (près de 4,24 millions d'hectares à 30 entités au 30 juin 2026, dont 2,66 millions en parcs nationaux cogérés, selon Queensland Parks) ; l'État garde les minéraux et le pétrole, et peut passer outre au refus du fiduciaire pour un bail minier.", source: "https://www.alrc.gov.au/publication/connection-to-country-review-of-the-native-title-act-1993-cth-alrc-report-126/3-context-for-reform/land-rights-and-native-title-in-the-states-and-territories/"}
chronologie:
  - {annee: 1991, evenement: "Adoption de l'Aboriginal Land Act et du Torres Strait Islander Land Act."}
  - {annee: 2006, evenement: "Clôture du délai de revendication prévu par la loi aborigène (22 décembre)."}
  - {annee: 2007, evenement: "Insertion dans la loi aborigène des accords de gestion autochtone et des aires protégées de la péninsule du cap York (loi n° 48 de 2007)."}
  - {annee: 2011, evenement: "Loi n° 26 de 2011 : interdiction de vendre ou d'hypothéquer la terre inscrite dans les deux lois ; suppression des terres revendicables dans la loi insulaire."}
  - {annee: 2015, evenement: "L'ALRC rapporte 4,5 millions d'hectares transférés au titre des deux lois."}
  - {annee: 2026, evenement: "Programme du cap York : près de 4,24 millions d'hectares transférés à 30 entités au 30 juin."}
fiabilite:
  verifie: ["Préambule et sections 3, 8 à 12, 22, 23, 40 à 47, 54, 55, 56 à 61, 81, 97, 100, 104, 178, 179, 202, 203, 248, 250 et 251 de l'Aboriginal Land Act 1991, version en vigueur au 28 avril 2026.", "Mineral Resources Act 1989 (Queensland), s. 271A(2) : consentement du propriétaire d'une réserve ou du gouverneur en conseil pour un bail minier en surface.", "Sections 7 à 9 et 67 et annotation de l'annexe 1 (suppression des terres revendicables en 2011) du Torres Strait Islander Land Act 1991, même version.", "Pages du gouvernement du Queensland sur les transferts, les fiduciaires et les déclarations ministérielles (consultées le 1er octobre 2026).", "Chiffre de 4,5 millions d'hectares (ALRC, rapport 126, 2015, d'après le gouvernement du Queensland) et de 4,24 millions d'hectares au cap York, dont 1,57 million en pleine propriété aborigène et 2,66 millions en parcs nationaux cogérés (Queensland Parks, mise à jour du 23 juillet 2026).", "Population aborigène ou insulaire du Queensland au recensement de 2021 (ABS)."]
