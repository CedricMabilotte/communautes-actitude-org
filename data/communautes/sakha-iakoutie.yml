droits:
  autogouvernement: {valeur: "partiel", note: "Le statut de la République est fixé par la Constitution fédérale et par la constitution de la République (Constitution fédérale, art. 66-1, 1993) ; ses institutions (Assemblée d'État Il Tumen, chef de la République) sont territoriales et ne sont pas réservées au peuple sakha.", source: "http://pravo.gov.ru/proxy/ips/?docbody=&nd=102027595"}
  pouvoir_normatif: {valeur: "partiel", note: "Hors des compétences fédérales et des compétences conjointes, les sujets de la Fédération (entités fédérées) exercent le plein pouvoir d'État (Constitution fédérale, art. 73, 1993) ; dans les domaines conjoints, la loi fédérale prime.", source: "http://pravo.gov.ru/proxy/ips/?docbody=&nd=102027595"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "Les républiques peuvent établir leurs langues d'État, utilisées avec le russe dans leurs organes du pouvoir d'État, de l'autogouvernement local et leurs institutions publiques (Constitution fédérale, art. 68-2, texte en vigueur) ; le sakha et le russe sont langues d'État de la République selon sa constitution de 1992 (texte non consulté, statut repris de Wikipédia).", source: "http://pravo.gov.ru/proxy/ips/?docbody=&nd=102027595"}
  education: {valeur: "conteste", note: "Une décision de justice de 2015 a invalidé la disposition de la République qui rendait l'étude du sakha obligatoire pour tous les élèves ; depuis la loi fédérale 317-FZ du 3 août 2018, l'étude des langues d'État des républiques relève du choix des parents (Jankiewicz, Knyaginina et Prina, 2020).", source: "https://eprints.gla.ac.uk/208165/1/208165.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Comité consultatif de la Convention-cadre (2018, § 9 et 11) relève qu'après le conflit de 2017 entre le gouvernement fédéral et les républiques, l'enseignement obligatoire des secondes langues officielles des républiques n'est plus possible ; en Sakha, cet enseignement obligatoire avait été invalidé par une décision de 2015 (Jankiewicz, Knyaginina et Prina, 2020).", source: "https://www.ecoi.net/en/file/local/2002328/4_OP_RussianFederation_en.docx.pdf"}
chronologie:
  - {annee: 1992, evenement: "Adoption de la Constitution de la République de Sakha (Iakoutie) le 4 avril, entrée en vigueur le 27 avril."}
  - {annee: 1993, evenement: "La Constitution fédérale fait de la Sakha (Iakoutie) une république de la Fédération (art. 65)."}
  - {annee: 2004, evenement: "Loi de la République n° 111-З sur le statut des langues des peuples autochtones peu nombreux du Nord."}
  - {annee: 2015, evenement: "Une décision de justice invalide l'étude obligatoire du sakha pour tous les élèves."}
  - {annee: 2018, evenement: "Loi fédérale 317-FZ : l'étude des langues d'État des républiques relève du choix des parents."}
  - {annee: 2020, evenement: "Révision de la Constitution fédérale : l'art. 68-1 désigne le russe comme langue du « peuple constitutif de l'État » ; l'art. 68-2 sur les langues d'État des républiques est maintenu."}
  - {annee: 2021, evenement: "Recensement : 469 348 personnes se déclarent Iakoutes dans la République."}
  - {annee: 2022, evenement: "La Russie cesse d'être membre du Conseil de l'Europe."}
