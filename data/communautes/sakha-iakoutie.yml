resume: >-
  La République de Sakha (Iakoutie) est l'une des républiques de la Fédération de Russie (Constitution fédérale de 1993, art. 65). Son statut est fixé par la Constitution fédérale, révisée en 2020, et par sa propre constitution, adoptée en avril 1992 (art. 66) ; hors des compétences fédérales et conjointes, elle exerce le plein pouvoir d'État (art. 73). Les républiques peuvent établir leurs langues d'État (art. 68) : le sakha (iakoute) l'est avec le russe, et les langues dolgane, tchouktche, évenke, évène et youkaguire sont officielles dans les lieux d'habitat traditionnel de ces peuples (loi de la République n° 111-З de 2004). Les Sakha, plus de 50 000 personnes, ne figurent pas sur la liste des peuples autochtones peu nombreux. Les Évenks, Évènes, Youkaguirs, Dolganes et Tchouktches de la République font l'objet de la fiche « Peuples autochtones du Nord de la Iakoutie », les autres républiques de la fiche « Républiques nationales de Russie ».
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Quatrième avis du Comité consultatif de la Convention-cadre pour la protection des minorités nationales sur la Fédération de Russie, ACFC/OP/IV(2018)001, adopté le 20 février 2018 : Iakoutes cités parmi les 22 groupes de plus de 400 000 personnes selon le recensement de 2010 (note 15) ; à la suite du conflit de 2017 entre le gouvernement fédéral et les républiques, l'enseignement obligatoire des secondes langues officielles des républiques n'est plus possible (§ 9 et 11) ; la Russie a cessé d'être membre du Conseil de l'Europe en 2022", annee: 2018, source: "https://www.ecoi.net/en/file/local/2002328/4_OP_RussianFederation_en.docx.pdf"}
