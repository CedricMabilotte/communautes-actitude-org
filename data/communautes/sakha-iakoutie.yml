resume: >-
  La République de Sakha (Iakoutie) est l'une des républiques de la Fédération de Russie. Son statut est fixé par la Constitution fédérale et par sa propre constitution (art. 66), et elle exerce le plein pouvoir d'État hors des compétences fédérales et conjointes (art. 73). Les républiques peuvent établir leurs propres langues d'État (art. 68) ; le sakha y est langue d'État aux côtés du russe, et les langues évenke, évène, youkaguire, dolgane et tchouktche sont officielles dans les lieux d'habitat de ces peuples. Les Sakha ne relèvent pas de la liste des peuples autochtones peu nombreux, qui exclut les peuples de plus de 50 000 personnes. Les Évenks, Évènes, Youkaguirs, Dolganes et Tchouktches de la République font l'objet de la fiche « Peuples autochtones du Nord de la Iakoutie », et les autres républiques de la fiche « Républiques nationales de Russie ».
