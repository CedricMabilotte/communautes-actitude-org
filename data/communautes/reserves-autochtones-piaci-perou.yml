droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'État reconnaît le droit de ces peuples à posséder les terres qu'ils occupent et en restreint l'accès aux personnes extérieures ; la propriété n'est garantie que s'ils deviennent sédentaires (loi 28736, art. 4 d) ; les réserves sont d'« intangibilité transitoire » (art. 2 d et 5) et leurs habitants en sont les seuls bénéficiaires (art. 5 d), sans titre de propriété.", source: "https://faolex.fao.org/docs/pdf/per64175.pdf"}
  ressources: {valeur: "partiel", note: "Libre accès et usage des terres et des ressources naturelles pour la subsistance (loi 28736, art. 4 e) ; aucun droit d'exploitation n'est accordé dans les réserves, sauf méthodes sans atteinte aux droits de ces peuples et validées par une étude environnementale, et sauf ressource dont l'exploitation est déclarée « de nécessité publique » (art. 5 c).", source: "https://faolex.fao.org/docs/pdf/per64175.pdf"}
  consentement: {valeur: "partiel", note: "L'État s'oblige à respecter la décision de ces peuples sur la forme et le processus de leur relation avec la société nationale et avec l'État (loi 28736, art. 4 b) ; l'entrée d'agents extérieurs dans les réserves est interdite, sauf entités publiques dans les cas de l'article 6.", source: "https://faolex.fao.org/docs/pdf/per64175.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Six réserves autochtones sont créées entre 2016 et 2024, mais la catégorisation (conversion en réserve autochtone) de la réserve territoriale Madre de Dios, engagée en 2014 et dont l'étude a été approuvée en 2016, n'est pas achevée ; le CERD (2018) relève la poursuite de projets d'exploitation de ressources dans quatre réserves, et la Commission interaméricaine (2024, position reprise à l'audience de 2026) conclut que l'État n'a pas garanti l'intégrité du territoire des Mashco Piro face aux concessions forestières et minières et à l'exploitation forestière illégale.", source: "https://es.mongabay.com/short-article/2026/09/peru-pueblo-aislamiento-mashco-piro-peligro-lideres-indigenas-reclaman-proteccion-corte-idh/"}
chronologie:
  - {annee: 1990, evenement: "Résolution ministérielle 0046-90-AG : réserve territoriale Kugapakori, Nahua, Nanti y otros (Cusco, Ucayali)."}
  - {annee: 1997, evenement: "Réserves territoriales Murunahua et Mashco Piro déclarées par la direction agraire régionale d'Ucayali."}
  - {annee: 1998, evenement: "Réserve territoriale Isconahua (11 juin)."}
  - {annee: 2002, evenement: "Résolution ministérielle 0427-2002-AG : réserve territoriale Madre de Dios."}
  - {annee: 2003, evenement: "Décret suprême 028-2003-AG : la réserve Kugapakori, Nahua, Nanti y otros est confirmée sur 456 672,73 ha."}
  - {annee: 2006, evenement: "Loi 28736 sur les peuples en isolement et en contact initial (16 mai)."}
  - {annee: 2016, evenement: "Décret suprême 007-2016-MC : Isconahua, Mashco Piro et Murunahua deviennent les premières réserves autochtones (24 juillet)."}
  - {annee: 2018, evenement: "Décret législatif 1374 : régime de sanctions pour les infractions à la loi 28736 ; observations finales du CERD."}
  - {annee: 2021, evenement: "Réserves autochtones Yavarí Tapiche (décret 007-2021-MC, 10 avril) et Kakataibo Norte y Sur (décret 015-2021-MC, 22 juillet)."}
  - {annee: 2024, evenement: "Réserve autochtone Sierra del Divisor Occidental (décret 004-2024-MC, 22 mai) ; la Commission interaméricaine saisit la Cour du cas Mashco Piro, Yora et Amahuaca (7 novembre)."}
  - {annee: 2026, evenement: "Audience du cas Mashco Piro devant la Cour interaméricaine à Montevideo (24 et 25 septembre) ; demande de délégation de pouvoirs législatifs du gouvernement incluant une modification de la loi 28736, en débat au Congrès."}
