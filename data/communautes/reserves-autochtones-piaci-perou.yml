resume: >-
  La loi 28736 de 2006 crée un régime spécial de protection des peuples autochtones de l'Amazonie péruvienne en situation d'isolement ou de contact initial (début de relations avec la société nationale). Elle prévoit des « réserves autochtones » délimitées par décret suprême, intangibles (fermées à tout établissement et à toute activité autre que les usages ancestraux de leurs habitants) tant que ces peuples restent dans cette situation. Six réserves autochtones existent en 2024 : Isconahua, Mashco Piro et Murunahua (2016), Yavarí Tapiche et Kakataibo Norte y Sur (2021), Sierra del Divisor Occidental (2024). Deux « réserves territoriales » créées avant la loi, Kugapakori, Nahua, Nanti y otros et Madre de Dios, attendent leur conversion. Le ministère de la Culture estime à 7 386 le nombre de personnes concernées. Les communautés amazoniennes titrées font l'objet de la fiche « Communautés natives d'Amazonie péruvienne ».
reconnaissance_regionale:
  - {mecanisme: "commission_interamericaine", detail: "Le 7 novembre 2024, la Commission interaméricaine saisit la Cour interaméricaine du cas des peuples Mashco Piro, Yora et Amahuaca de la réserve territoriale Madre de Dios ; elle conclut à la violation des droits à la propriété collective, aux garanties judiciaires et à la libre détermination, faute de conversion de la réserve et de protection contre les concessions forestières et d'hydrocarbures.", annee: 2024, source: "https://earthrights.org/media_release/el-estado-peruano-tendra-que-responder-ante-la-corte-interamericana-de-derechos-humanos-por-las-violaciones-de-los-derechos-del-pueblo-indigena-en-aislamiento-mashco-piro/"}
