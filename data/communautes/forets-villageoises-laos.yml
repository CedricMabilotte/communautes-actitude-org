resume: >-
  Fiche agrégée : elle couvre les villages auxquels l'État confie la gestion de forêts et de terres forestières au titre de la loi forestière révisée n° 64/AN du 13 juin 2019. La loi définit l'aire forestière villageoise (art. 3), confie au village la conduite de la gestion forestière villageoise (art. 39) et prévoit que les autorités de district attribuent forêts et terres forestières aux autorités de village, qui les gèrent, les protègent, les mettent en valeur et les utilisent selon un plan de gestion (art. 114 et 120). Les terres restent propriété de l'État ; le droit d'usage des forêts naturelles ne peut être ni cédé ni transmis par héritage (art. 121 et 122). Le plan d'action pour la reconnaissance des droits d'usage des terres forestières prévoit de délivrer, d'ici 2030, des titres fonciers, des certificats d'usage et des contrats de gestion et de protection des forêts villageoises aux ménages de 2 690 villages ; le nombre de villages déjà couverts n'a pas été établi.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Laos à la Convention sur la diversité biologique (ministère des Ressources naturelles et de l'Environnement, 2019), objectif national 12 : reconnaissance de sites de foresterie villageoise contigus intégrés à deux corridors de biodiversité, réseau d'au moins 69 sites de foresterie villageoise, et, dans les 84 villages du projet de corridors de biodiversité, plans d'aménagement délimitant forêts de conservation et de protection, avec délivrance de titres fonciers communaux sur la terre forestière communautaire et de certificats d'usage aux autorités de village.", annee: 2019, source: "https://www.cbd.int/doc/nr/nr-06/la-nr-06-en.pdf"}
base_nationale:
  - {instrument: "Loi forestière (révisée) n° 64/AN du 13 juin 2019, art. 3 (8) et (9), 39, 64, 87, 114, 120 et 152", nature: "loi", annee: 2019, source: "https://www.laotradeportal.gov.la/upload/files/Legal_1589768237.pdf"}
  - {instrument: "Loi foncière n° 70/AN du 21 juin 2019, art. 44 (usage des terres forestières par les habitants antérieurs au classement) et art. 81 (usage collectif des terres de l'État par les villageois)", nature: "loi", annee: 2019, source: "https://laolandinfo.org/wp-content/uploads/2021/05/Land-Law-2019_Eng-Unofficial-Translation.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Loi forestière de 2019, art. 39 et 114 : le village conduit la gestion et la protection des forêts de son aire, et les autorités de district attribuent forêts et terres forestières aux autorités de village ; art. 152 : la sous-unité agriculture et forêts de l'unité économique et financière du village organise cette gestion, sous le contrôle du bureau de district de l'agriculture et des forêts (art. 151).", source: "https://www.laotradeportal.gov.la/upload/files/Legal_1589768237.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Loi forestière de 2019, art. 152 (2) : la sous-unité agriculture et forêts propose aux autorités de village d'édicter des règlements sur l'usage des forêts et terres forestières villageoises, en conformité avec la loi.", source: "https://www.laotradeportal.gov.la/upload/files/Legal_1589768237.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Loi forestière de 2019, art. 120 : le district attribue aux autorités de village le droit d'usage à long terme des forêts et terres forestières de l'État ; le droit d'usage des forêts naturelles ne peut être ni cédé ni hérité (art. 121 et 122). Loi foncière de 2019, art. 81 : droit d'usage collectif des terres de l'État (forêts sacrées, cimetières, mares communes) sans droit de cession, de location ni de concession ; art. 44 : l'État reconnaît l'usage des terres par les habitants installés avant le classement en terre forestière, avec délivrance de certificats d'usage aux individus ou aux familles.", source: "https://laolandinfo.org/wp-content/uploads/2021/05/Land-Law-2019_Eng-Unofficial-Translation.pdf"}
  ressources: {valeur: "partiel", note: "Loi forestière de 2019, art. 64 : usage coutumier des forêts, du bois et des produits forestiers non ligneux dans l'aire forestière villageoise, selon le plan de gestion ; art. 62 et 63 : coupe de bois dans les forêts villageoises d'usage pour des besoins collectifs ou domestiques, après approbation du bureau provincial ou du bureau de district de l'agriculture et des forêts.", source: "https://www.laotradeportal.gov.la/upload/files/Legal_1589768237.pdf"}
  consentement: {valeur: "partiel", note: "Loi forestière de 2019, art. 87 (1) : la location ou la concession de terres forestières suppose de « consulter les habitants et de convenir avec eux » ; la loi ne prévoit pas de droit de refus du village.", source: "https://www.laotradeportal.gov.la/upload/files/Legal_1589768237.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2026, le programme ONU-REDD indique que le plan d'action prévoit des titres, certificats d'usage et contrats de gestion et de protection des forêts villageoises pour les ménages de 2 690 villages d'ici 2030, et qu'il reste à formaliser la foresterie villageoise ; en juillet 2021, une note du Land Information Working Group (réseau d'organisations de la société civile) sur deux villages du district de Mai (province de Phongsaly) rapporte que les villageois ont un droit d'accès et d'usage des forêts et un devoir de protection, que tout changement d'affectation relève de l'État, et que l'un des deux villages n'avait encore ni plan participatif d'usage des terres ni plan de gestion des forêts villageoises.", source: "https://www.un-redd.org/post/understanding-impacts-social-forestry-lao-pdr"}
chronologie:
  - {annee: 2019, evenement: "Loi forestière révisée n° 64/AN (13 juin) : définition de l'aire forestière villageoise et de la gestion forestière villageoise."}
  - {annee: 2019, evenement: "Loi foncière n° 70/AN (21 juin), promulguée le 2 août : usage collectif des terres de l'État et reconnaissance de l'usage antérieur au classement forestier."}
  - {annee: 2019, evenement: "Sixième rapport national à la Convention sur la diversité biologique : au moins 69 sites de foresterie villageoise dans les corridors de biodiversité."}
  - {annee: 2026, evenement: "Le programme ONU-REDD fait état de l'instruction n° 4143 du ministère de l'Agriculture et des Forêts sur les plans de gestion des forêts villageoises et de l'objectif de 2 690 villages d'ici 2030."}
fiabilite:
  verifie:
    - "Articles 3, 39, 62 à 64, 87, 114, 120 à 122, 151 et 152 de la loi forestière n° 64/AN du 13 juin 2019, dans la traduction anglaise non officielle publiée sur le portail commercial du gouvernement lao."
    - "Articles 44, 81 et 130 de la loi foncière n° 70/AN du 21 juin 2019, dans la traduction non officielle du Land Information Working Group."
    - "Objectif de titres, certificats d'usage et contrats de gestion et de protection des forêts villageoises pour les ménages de 2 690 villages d'ici 2030, et mention de l'instruction n° 4143, dans l'article du programme ONU-REDD du 18 mai 2026."
    - "Constats de terrain sur les villages de Hatcha et Finhor (district de Mai, Phongsaly), collectés en janvier et février 2021, dans la note du Land Information Working Group de juillet 2021."
    - "Passage sur la foresterie villageoise du sixième rapport national à la Convention sur la diversité biologique (objectif national 12)."
  non_confirme:
    - "Nombre actuel de villages dotés d'un plan de gestion ou d'un contrat de gestion et de protection des forêts villageoises, et surface couverte : aucune statistique officielle trouvée ; aucune liste officielle des sites, d'où l'absence de tableau."
    - "Texte, date et contenu exact de l'instruction n° 4143 du ministère de l'Agriculture et des Forêts : non consultés."
    - "Les textes consultés sont des traductions anglaises non officielles ; la version lao fait foi."
    - "Date d'adoption et autorité d'approbation du plan d'action pour la reconnaissance des droits d'usage des terres forestières : non établies."
