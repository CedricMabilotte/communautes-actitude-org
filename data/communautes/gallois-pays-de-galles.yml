resume: >-
  Le Government of Wales Act 2006 organise le Senedd (Parlement gallois) et le gouvernement gallois. Depuis 2017, la loi déclare qu'ils ne peuvent être abolis que sur décision du « peuple du pays de Galles » par référendum. Le Senedd vote des lois dans les matières non réservées, fixe les taux gallois de l'impôt sur le revenu et légifère sur deux impôts dévolus. Le gallois a un statut officiel au pays de Galles depuis 2011. Le Royaume-Uni applique la Convention-cadre du Conseil de l'Europe aux Gallois comme minorité nationale.
reconnaissance_regionale:
