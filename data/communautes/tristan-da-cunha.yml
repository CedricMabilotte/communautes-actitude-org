resume: >-
  Île de l'Atlantique Sud, à environ 2 400 km de Sainte-Hélène, rattachée au territoire britannique de Sainte-Hélène, Ascension et Tristan da Cunha, inscrit sur la liste des territoires non autonomes de l'ONU. Les habitants descendent pour la plupart de membres de la garnison britannique restés sur l'île à son départ en 1817 et d'arrivants du XIXe siècle ; ils vivent tous dans la localité d'Edinburgh of the Seven Seas. La Constitution de 2009 donne à l'île un statut égal à celui des deux autres parties du territoire : le gouverneur légifère après consultation d'un Conseil de l'île de huit membres élus et trois nommés, présidé par l'administrateur ; le Chief Islander (chef élu des insulaires), choisi sur une liste de candidats distincte, conduit ce conseil. Le droit de résidence propre à l'île est protégé par la Constitution et l'installation des personnes extérieures est soumise à permis.
