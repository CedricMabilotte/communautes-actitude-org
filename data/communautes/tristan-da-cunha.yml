droits:
  autogouvernement: {valeur: "partiel", note: "Le Conseil de l'île, prévu par l'art. 214 de la Constitution de 2009, compte l'administrateur comme président, trois membres nommés et huit membres élus pour trois ans par les résidents de 18 ans et plus, nés sur l'île ou y ayant vécu trois ans ; le Chief Islander, nommé par l'administrateur d'après les voix obtenues sur une liste de candidats distincte du même bulletin, est de droit le leader (chef de file) du Conseil (Island Council Ordinance 1985, art. 3, 9, 10, 23 et annexe 1). L'administrateur, nommé par le gouverneur, exerce le pouvoir exécutif et peut passer outre l'avis du Conseil (art. 11).", source: "https://www.sainthelena.gov.sh/documents/island-council-tdac-ord-updated-211220/"}
  pouvoir_normatif: {valeur: "partiel", note: "Les ordonnances sont prises par le gouverneur après consultation du Conseil de l'île, qui n'est pas lié par son avis (Constitution de 2009, art. 216) ; les by-laws (règlements locaux) sur la santé, l'usage des terres, l'eau, l'école ou les jours fériés sont pris par l'administrateur après soumission du projet au Conseil, et le gouverneur peut les révoquer ou les modifier dans les douze mois (Island Council Ordinance 1985, art. 15 et annexe 3).", source: "https://www.sainthelena.gov.sh/documents/island-council-tdac-ord-updated-211220/"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les licences de pêche dans les limites de pêche de Tristan sont régies par ordre de l'« Administrator in Council », c'est-à-dire l'administrateur agissant après consultation du Conseil de l'île (Fishery Limits Ordinance 1983, art. 4, définition ajoutée en 2021).", source: "https://www.sainthelena.gov.sh/documents/Fishery-Limits-TdC-Ord-Updated-100821"}
  consentement: {valeur: "partiel", note: "L'administrateur doit consulter le Conseil de l'île pour l'exercice de tous ses pouvoirs, sauf défense, affaires extérieures, sécurité intérieure, police, fonction publique et relations du travail, et peut agir contre son avis (Island Council Ordinance 1985, art. 11) ; si le gouverneur légifère contre l'avis du Conseil, chaque membre peut saisir le secrétaire d'État britannique (Constitution de 2009, art. 216).", source: "https://www.legislation.gov.uk/uksi/2009/1751/contents/made"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "L'école publique, sa fréquentation et sa gestion relèvent des by-laws pris après avis du Conseil de l'île (annexe 3, point p) ; les Education By-Laws (modifiées en 2008) s'appuient sur un comité de l'éducation du Conseil (art. 18).", source: "https://www.sainthelena.gov.sh/documents/island-council-tdac-ord-updated-211220/"}
  fiscalite: {valeur: "partiel", note: "L'administrateur peut lever des impôts généraux ou spécifiques pour financer les matières locales, avec l'approbation du gouverneur et après avis du Conseil de l'île (Island Council Ordinance 1985, art. 16 ; Income Tax and Medical Contributions Order, 2008).", source: "https://www.sainthelena.gov.sh/documents/island-council-tdac-ord-updated-211220/"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "reconnu", note: "Nul titulaire du droit de résidence (right of abode) à Tristan da Cunha ne peut en être arbitrairement privé (Constitution de 2009, art. 202) ; les personnes nées d'un parent qui résidait habituellement sur l'île au moment de la naissance, ainsi que leurs épouses et leurs enfants de moins de 16 ans, sont dispensées du permis de séjour exigé de toute autre personne restant plus de trois jours (Entry Control Ordinance 1967, art. 2 et 3).", source: "https://www.sainthelena.gov.sh/documents/Entry-Control-TdaC-Ordinance"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon le document de travail de l'ONU, l'administrateur nommé par le gouverneur exerce aussi les fonctions de magistrat (§ 52), l'île dépend de l'aide britannique pour ses infrastructures, ses médecins et plusieurs postes de l'administration (§ 56 et 57), et le Conseil de l'île a demandé que Tristan devienne un territoire britannique à part entière, sans représentation directe au Parlement (§ 53). Le document A/AC.109/2026/13 du 31 mars 2026 reprend les constats sur l'administrateur magistrat et sur l'aide britannique (§ 48, 51 et 52).", source: "https://documents.un.org/api/symbol/access?s=A/AC.109/2024/13&l=en&t=pdf"}
chronologie:
  - {annee: 1816, evenement: "Le Royaume-Uni annexe les îles et y installe une garnison, rattachée à la colonie du Cap."}
  - {annee: 1817, evenement: "Départ de la garnison ; William Glass et quelques autres restent et fondent la communauté sur un principe d'égalité entre familles."}
  - {annee: 1938, evenement: "Les îles deviennent une dépendance de Sainte-Hélène."}
  - {annee: 1961, evenement: "Éruption volcanique et évacuation de tous les habitants."}
  - {annee: 1963, evenement: "Retour de la plupart des familles."}
  - {annee: 1967, evenement: "Entry Control Ordinance : permis de séjour obligatoire pour les personnes extérieures."}
  - {annee: 1985, evenement: "Island Council Ordinance : composition du Conseil et élection du Chief Islander."}
  - {annee: 2009, evenement: "Constitution de Sainte-Hélène, Ascension et Tristan da Cunha : statut égal des trois îles."}
  - {annee: 2020, evenement: "Zone de protection marine de 690 000 km² dans la zone économique exclusive."}
  - {annee: 2025, evenement: "Élection du Conseil de l'île et du Chief Islander pour 2025-2028 (5 mars ; 166 votants sur 200 inscrits selon le site du gouvernement de l'île)."}
  - {annee: 2025, evenement: "Annonce le 27 mai, après appel d'offres, de l'attribution à la société Fortuna Ltd (îles Malouines) de la concession exclusive de pêche à la langouste à partir de 2027, avec la desserte maritime vers Le Cap et la production d'électricité."}
  - {annee: 2026, evenement: "Épisode d'hantavirus des Andes lié au navire de croisière MV Hondius, passé par l'île à la mi-avril : un habitant hospitalisé sur place ; le Royaume-Uni envoie médecins et matériel par largage aérien le 9 mai ; l'OMS déclare la fin de l'épisode le 2 juillet."}
  - {annee: 2026, evenement: "Tempête du 7 juillet : rafale mesurée à 200 km/h ; plusieurs bâtiments perdent leur toit."}
  - {annee: 2026, evenement: "Prise de fonctions de Belinda Lewis, gouverneure de Sainte-Hélène, Ascension et Tristan da Cunha (12 septembre) ; le 17 septembre, l'administrateur cite devant le Conseil de l'île le changement de concessionnaire de pêche et des difficultés budgétaires."}
