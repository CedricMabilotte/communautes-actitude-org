uid: "groupes-ethniques-autriche-hongrois-tcheques-slovaques-roms"
nom: "Hongrois, Tchèques, Slovaques et Roms d'Autriche"
endonyme: "Magyarok, Češi, Slováci, Roma"
territoire: "Burgenland (districts d'Oberpullendorf et d'Oberwart) et Vienne"
