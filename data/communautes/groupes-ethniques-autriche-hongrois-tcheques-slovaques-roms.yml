population: {valeur: 44610, annee: 2001, perimetre: "somme des citoyens autrichiens ayant déclaré le hongrois (25 884), le tchèque (11 035), le slovaque (3 343) ou le romani (4 348) comme langue d'usage, Autriche entière, recensement de 2001 (dernier recensement à poser la question)", source: "https://www.parlament.gv.at/dokument/dossiers-eu-internationales/Minderheiten-und-Volksgruppen-in-Oesterreich-und-Europa.pdf"}
