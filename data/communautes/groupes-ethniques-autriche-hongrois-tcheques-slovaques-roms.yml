resume: >-
  L'Autriche reconnaît six groupes ethniques autochtones (Volksgruppen). Quatre d'entre eux ne sont pas visés par l'article 7 du traité d'État de 1955 : les Hongrois du Burgenland, reconnus en 1976, auxquels les Hongrois de Vienne ont été rattachés en 1992, les Tchèques et les Slovaques, établis surtout à Vienne et reconnus en 1992, et les Roms, reconnus en 1993. Chaque groupe dispose d'un conseil consultatif (Volksgruppenbeirat) auprès de la chancellerie fédérale, entendu avant les textes qui le concernent. Le hongrois est langue officielle devant les autorités de quatre communes du Burgenland, et la loi scolaire du Burgenland de 1994 garantit un enseignement en hongrois et prévoit des cours de romani.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "L'Autriche a ratifié la Convention-cadre pour la protection des minorités nationales le 31 mars 1998 ; le Comité consultatif a adopté son cinquième avis sur l'Autriche le 8 juin 2023.", annee: 1998, source: "https://www.coe.int/en/web/minorities/austria"}
  - {mecanisme: "charte_langues_regionales", detail: "À la ratification de la Charte européenne des langues régionales ou minoritaires, l'Autriche a désigné le hongrois, le tchèque, le slovaque et le romani du groupe ethnique des Roms comme langues minoritaires relevant de la partie II ; seul le hongrois du Burgenland est désigné au titre de la partie III (art. 3 § 1) ; pour le hongrois à Vienne, le tchèque et le slovaque à Vienne et le romani au Burgenland, l'Autriche déclare que son droit remplit certaines dispositions de la partie III (BGBl. III n° 216/2001).", annee: 2001, source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20001589"}
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale sur l'Autriche (CERD/C/AUT/CO/18-20), § 17 : le Comité relève le taux d'abandon scolaire des élèves roms et l'absence de mesures pour l'éducation des enfants roms vivant hors du Burgenland.", annee: 2012, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUT/CO/18-20&l=en&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité des droits de l'homme sur l'Autriche (CCPR/C/AUT/CO/5), § 17-18 : le Comité relève les discriminations subies par la minorité rom et la faible représentation des minorités dans la vie publique.", annee: 2015, source: "https://documents.un.org/api/symbol/access?s=CCPR/C/AUT/CO/5&l=en&t=pdf"}
base_nationale:
  - {instrument: "Loi sur les groupes ethniques (Volksgruppengesetz, BGBl. n° 396/1976), révisée par BGBl. I n° 46/2011 et BGBl. I n° 71/2026", nature: "loi", annee: 1976, source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000602"}
  - {instrument: "Règlement du gouvernement fédéral sur les conseils consultatifs des groupes ethniques (BGBl. n° 38/1977), modifié par BGBl. n° 425/1992 et BGBl. n° 895/1993", nature: "loi", annee: 1977, source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000614"}
  - {instrument: "Loi sur les écoles des minorités du Burgenland (Minderheiten-Schulgesetz für das Burgenland, BGBl. n° 641/1994)", nature: "loi", annee: 1994, source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10009948"}
droits:
  autogouvernement: {valeur: "non_etabli", note: "", source: ""}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Chaque conseil consultatif de groupe ethnique (Volksgruppenbeirat) doit être entendu, dans un délai approprié, avant l'adoption des textes et des plans de financement qui touchent aux intérêts des groupes ethniques, loi sur les groupes ethniques, § 3 (1) ; il rend un avis, sans droit de veto.", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000602"}
  langue: {valeur: "partiel", note: "Le hongrois est admis comme langue officielle, en plus de l'allemand, devant les autorités de quatre communes, les tribunaux de district et les administrations de district d'Oberpullendorf et d'Oberwart, loi sur les groupes ethniques, § 13 et annexe 2, III (disposition de rang constitutionnel, 2011) ; noms de lieux bilingues dans quatre localités, § 12 et annexe 1, I B. Aucune disposition de ce type pour le tchèque, le slovaque ou le romani.", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000602"}
  education: {valeur: "partiel", note: "Les citoyens du groupe ethnique hongrois ont le droit d'utiliser le hongrois comme langue d'enseignement ou de l'apprendre comme matière obligatoire dans les écoles désignées du Burgenland, loi scolaire des minorités du Burgenland de 1994, § 1 (disposition de rang constitutionnel) ; écoles primaires et lycée bilingues, § 3 et 12 ; enseignement complémentaire en romani pour les Roms du Burgenland et romani en matière facultative, § 14. Aucune disposition légale équivalente pour le tchèque et le slovaque.", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10009948"}
  fiscalite: {valeur: "partiel", note: "L'État fédéral finance les mesures de maintien des groupes ethniques et inscrit un montant à cet effet au budget annuel ; chaque conseil consultatif propose chaque année l'usage des fonds, loi sur les groupes ethniques, § 8 à 10 ; aucun pouvoir fiscal.", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000602"}
  representation: {valeur: "partiel", note: "Un conseil consultatif par groupe siège auprès de la chancellerie fédérale : 16 membres pour les Hongrois, 10 pour les Tchèques, 6 pour les Slovaques, 8 pour les Roms, dont la moitié sur proposition des organisations du groupe, règlement BGBl. n° 38/1977, § 4 à 7 ; membres nommés pour quatre ans par le gouvernement fédéral, loi sur les groupes ethniques, § 4 ; aucun siège réservé au Parlement.", source: "https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=10000614"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2023, le Comité consultatif de la Convention-cadre du Conseil de l'Europe juge nécessaire de trouver des solutions réglementaires durables pour l'enseignement en tchèque et en slovaque à Vienne, relève des insuffisances dans la procédure de nomination des conseils consultatifs et note que la minorité tchèque consacre 72 % (2022) et 74 % (2023) de ses financements à l'entretien de l'école Komenský de Vienne. En 2012, le CERD relevait l'absence de mesures pour l'éducation des enfants roms vivant hors du Burgenland (CERD/C/AUT/CO/18-20, § 17).", source: "https://rm.coe.int/5th-op-austria-fr/1680acfc2f"}
chronologie:
  - {annee: 1921, evenement: "Rattachement du Burgenland à l'Autriche ; les Hongrois de la région deviennent une minorité."}
  - {annee: 1976, evenement: "Loi sur les groupes ethniques : reconnaissance du groupe hongrois du Burgenland."}
  - {annee: 1977, evenement: "Règlement créant les conseils consultatifs des groupes ethniques, dont celui du groupe hongrois."}
  - {annee: 1992, evenement: "Reconnaissance des groupes tchèque et slovaque ; les Hongrois de Vienne sont rattachés au groupe hongrois ; conseils consultatifs tchèque et slovaque (BGBl. n° 425/1992)."}
  - {annee: 1993, evenement: "Reconnaissance du groupe ethnique des Roms ; création de son conseil consultatif (BGBl. n° 895/1993), constitué en 1995."}
  - {annee: 1994, evenement: "Loi scolaire des minorités du Burgenland : enseignement en hongrois, cours de romani."}
  - {annee: 1995, evenement: "Attentat à la bombe du 4 février contre une cité rom d'Oberwart : quatre morts."}
  - {annee: 2000, evenement: "Règlements sur la langue officielle hongroise et sur les noms de lieux au Burgenland."}
  - {annee: 2001, evenement: "Ratification de la Charte européenne des langues régionales ou minoritaires, qui désigne le hongrois, le tchèque, le slovaque et le romani."}
  - {annee: 2011, evenement: "Révision de la loi : les règles sur le hongrois langue officielle et les noms de lieux bilingues passent dans les annexes de la loi."}
  - {annee: 2026, evenement: "Révision de la loi (BGBl. I n° 71/2026) : les six groupes ethniques autochtones sont nommés dans une disposition de rang constitutionnel ; rapport annuel au Parlement (§ 9a)."}
fiabilite:
  verifie: ["Loi sur les groupes ethniques, version en vigueur : § 1, 3, 4, 8 à 10, 9a, 12, 13, annexe 1 (I B) et annexe 2 (III) (RIS).", "Règlement sur les conseils consultatifs BGBl. n° 38/1977 et modifications de 1992 et 1993, composition des conseils (RIS).", "Loi scolaire des minorités du Burgenland, § 1, 3, 12 à 14 (RIS).", "Déclarations de l'Autriche à la Charte européenne des langues régionales ou minoritaires (RIS, BGBl. III n° 216/2001).", "Dates de reconnaissance (1976, 1992, 1993) et chiffres du recensement de 2001 (dossier du Parlement, 2026).", "CERD/C/AUT/CO/18-20, § 17 ; CCPR/C/AUT/CO/5, § 17-18.", "Modifications du règlement sur les conseils consultatifs BGBl. n° 425/1992 (conseils tchèque et slovaque, Hongrois de Vienne) et BGBl. n° 895/1993 (conseil des Roms) (RIS, BGBl. authentique).", "Cinquième avis du Comité consultatif de la Convention-cadre sur l'Autriche (2023) : enseignement en tchèque et en slovaque à Vienne, nomination des conseils consultatifs, école Komenský."]
  non_confirme: ["La date de reconnaissance du groupe tchèque (1992) se déduit du règlement BGBl. n° 425/1992 ; le dossier du Parlement ne la donne pas explicitement.", "Le chiffre de population additionne quatre déclarations de langue d'usage de 2001 ; il ne compte ni les membres qui ne parlent plus la langue ni les Roms sans nationalité autrichienne. Le Land du Burgenland estime le groupe hongrois du Burgenland à environ 4 500 personnes et les Roms du Burgenland à 3 000 à 3 500 personnes ; le Parlement cite des estimations de 30 000 à 80 000 Roms en Autriche.", "Les quatre groupes ont des droits inégaux : une fiche par groupe pourrait être préférable."]
