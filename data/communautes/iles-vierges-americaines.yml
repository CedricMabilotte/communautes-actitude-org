resume: >-
  Territoire non incorporé (non intégré à l'Union au sens constitutionnel) des États-Unis, cédé par le Danemark en 1917 et organisé par la loi organique révisée de 1954 (Revised Organic Act). Le territoire élit un Sénat de 15 membres, un gouverneur depuis 1970 et un délégué sans droit de vote à la Chambre des représentants ; les relations du territoire avec le gouvernement fédéral relèvent de la supervision administrative générale du secrétaire à l'Intérieur. Le Congrès a autorisé en 1976 l'adoption d'une constitution locale ; cinq tentatives n'ont pas abouti et une sixième Assemblée constituante siège depuis 2025. La loi locale n° 9060 (Act No. 9060) a reporté au 28 février 2027 la remise de son projet et fixé au 3 juillet 2027 le référendum sur ce texte. Le territoire figure sur la liste des territoires non autonomes de l'ONU.
