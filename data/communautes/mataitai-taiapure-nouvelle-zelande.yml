resume: >-
  Fiche agrégée : elle couvre les hapū et iwi māori (groupes de parenté et peuples māori) qui gèrent des pêcheries coutumières au titre de la partie 9 de la loi sur les pêches de 1996 (Fisheries Act 1996, ss. 174 à 186B) et des règlements sur la pêche coutumière de 1998 (île du Nord et îles Chatham) et de 1999 (île du Sud et île Stewart). Les tangata whenua (groupe māori qui détient l'autorité coutumière sur un lieu) désignent des tangata kaitiaki ou tiaki (gardiens), qui délivrent les autorisations de pêche coutumière. Dans une réserve mātaitai (zone de pêche traditionnelle), la pêche commerciale cesse en règle générale et les gardiens proposent au ministre des règlements (bylaws) applicables à tous les pêcheurs. Un taiāpure (pêcherie locale) reste ouvert à toutes les pêches ; son comité de gestion, nommé sur proposition de la communauté māori locale, recommande des règles au ministre. Des fermetures temporaires de deux ans au plus (ss. 186A et 186B), proches du rāhui (interdit coutumier), complètent le régime. En octobre 2026, la couche cartographique du ministère des Industries primaires compte 58 réserves mātaitai et 11 taiāpure en vigueur.
