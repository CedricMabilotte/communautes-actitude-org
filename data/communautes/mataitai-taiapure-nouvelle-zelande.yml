  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national à la Convention sur la diversité biologique : présente les réserves mātaitai (récolte traditionnelle non commerciale sous gestion d'autorités māori), les taiāpure et le rāhui comme outils de gestion des ressources marines par les Māori", annee: 2014, source: "https://www.cbd.int/doc/world/nz/nz-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Fisheries Act 1996, partie 9 « Taiapure-local fisheries and customary fishing » (ss. 174 à 186B : déclaration des taiāpure, ss. 175 à 183 ; gestion des taiāpure, s. 184 ; règlements sur la pêche coutumière, s. 186 ; fermetures temporaires, ss. 186A et 186B)", nature: "loi", annee: 1996, source: "https://www.legislation.govt.nz/act/public/1996/0088/latest/DLM394192.html"}
  - {instrument: "Treaty of Waitangi (Fisheries Claims) Settlement Act 1992 (loi de règlement des revendications de pêche au titre du traité de Waitangi), qui confirme les droits de pêche coutumière non commerciale (s. 10)", nature: "loi", annee: 1992, source: "https://www.scoop.co.nz/stories/PA0308/S00357/fact-sheet-customary-fishing.htm"}
  - {instrument: "Fisheries (Kaimoana Customary Fishing) Regulations 1998 (île du Nord et îles Chatham), dont la règle 23 sur la déclaration des réserves mātaitai", nature: "loi", annee: 1998, source: "https://gazette.govt.nz/notice/id/2025-go7343"}
  - {instrument: "Fisheries (South Island Customary Fishing) Regulations 1999 (île du Sud et île Stewart)", nature: "loi", annee: 1999, source: "https://www.mpi.govt.nz/dmsdocument/16219-Guidelines-for-mataitai-reserve-applications"}
  - {instrument: "Kaikōura (Te Tai o Marokura) Marine Management Act 2014, instrument de déclaration de deux réserves mātaitai (Mangamaunu, Te Waha o te Marangai) et de deux taiāpure (Oaro-Haumuri, Te Taumanu o Te Waka a Māui) au large de Kaikōura selon la couche du ministère", nature: "loi", annee: 2014, source: "https://geospatial.mpi.govt.nz/portal/rest/services/MARINE/Marine_Customary_Restrictions/FeatureServer"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les tangata whenua désignent les tangata kaitiaki ou tiaki (gardiens) chargés de délivrer les autorisations de pêche coutumière, nomination confirmée par avis du ministre publié à la Gazette (règlements de 1998 et 1999) ; dans un taiāpure, le comité de gestion est nommé sur proposition de la communauté māori locale (Fisheries Act 1996, partie 9). Ces instances n'ont de compétence que sur la pêche.", source: "https://www.scoop.co.nz/stories/PA0308/S00357/fact-sheet-customary-fishing.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Dans une réserve mātaitai, les gardiens proposent des règlements (bylaws) qui limitent ou interdisent la prise d'espèces pour toutes les catégories de pêcheurs ; le ministre les approuve ou les refuse après consultation publique (règlements de 1998 et 1999). Le comité d'un taiāpure ne fait que recommander des règles au ministre des Océans et des Pêches.", source: "https://www.mpi.govt.nz/fishing-aquaculture/maori-customary-fishing/managing-customary-fisheries"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Les gardiens autorisent la récolte coutumière dans le rohe moana ; dans une réserve mātaitai, la pêche commerciale est exclue, sauf rétablissement par règlement (règlements de 1998 et 1999) ; les ss. 186A et 186B de la loi de 1996 permettent des fermetures temporaires de 24 mois au plus pour reconnaître les droits et pratiques de gestion coutumières des tangata whenua, avec leur soutien.", source: "https://www.mpi.govt.nz/fishing-aquaculture/maori-customary-fishing/managing-customary-fisheries"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "effective", note: "La couche cartographique officielle du ministère des Industries primaires recense en octobre 2026 58 réserves mātaitai et 11 taiāpure à l'état « Active, Legislated », contre 2 mātaitai et 7 taiāpure en 2003 et 10 mātaitai et 8 taiāpure en 2009, ainsi que 17 aires de fermeture temporaire au titre des ss. 186A et 186B publiées entre 2024 et 2026. Un article de la Māori Law Review (T. Love, 2018) note que ces outils peuvent donner aux tangata whenua une influence directe sur la gestion de ces aires, par des recommandations de règlements soumises au ministre.", source: "https://maorilawreview.co.nz/2018/07/incorporating-maori-approaches-to-ecosystem-management-in-marine-management/"}
chronologie:
  - {annee: 1992, evenement: "Loi de règlement des revendications de pêche au titre du traité de Waitangi, qui confirme les droits de récolte coutumière."}
  - {annee: 1995, evenement: "Premier taiāpure inscrit dans la couche officielle : Palliser Bay (Fisheries (Palliser Bay Taiapure) Order 1995)."}
  - {annee: 1996, evenement: "Loi sur les pêches de 1996 ; sa partie 9 porte sur les taiāpure et la pêche coutumière."}
  - {annee: 1998, evenement: "Règlements sur la pêche coutumière de l'île du Sud (avril) puis du reste du pays (décembre) ; première réserve mātaitai déclarée à Rāpaki (port de Lyttelton)."}
  - {annee: 1999, evenement: "Règlements de 1999 sur la pêche coutumière de l'île du Sud, cités par le ministère comme texte applicable."}
  - {annee: 2003, evenement: "Le gouvernement compte 7 taiāpure et 2 réserves mātaitai."}
  - {annee: 2014, evenement: "Loi sur la gestion marine de Kaikōura : deux réserves mātaitai et deux taiāpure."}
  - {annee: 2023, evenement: "Huit réserves mātaitai déclarées en juillet sur la côte Ouest et dans le Southland, et extension de la réserve du port de Lyttelton."}
  - {annee: 2025, evenement: "Déclaration des réserves mātaitai d'Orari et de Te Hikutū."}
  - {annee: 2026, evenement: "Règlements des réserves mātaitai de Ngāti Wheke (port de Lyttelton), en vigueur le 30 septembre."}
fiabilite:
  verifie: ["Liste, région, date de publication à la Gazette et instrument de déclaration de chaque réserve mātaitai et de chaque taiāpure : couches 1 et 8 du service cartographique du ministère des Industries primaires (interrogées le 1er octobre 2026).", "Fermetures temporaires (couche 6) : 17 aires, 14 avis, au titre de la s. 186A sauf deux au titre de la s. 186B.", "Intitulés des ss. 174 à 186B de la loi de 1996 (legislation.govt.nz).", "Règle 23 des règlements de 1998 comme base de la déclaration de Te Mātaitai ō Te Hikutū (avis MPI 1972, Gazette, décembre 2025).", "Critères ministériels, cessation de la pêche commerciale et procédure des règlements : lignes directrices du ministère (décembre 2010) et page « Managing customary fisheries ».", "Chiffres de 2003 (communiqué gouvernemental) et de 2009 (quatrième rapport à la CDB).", "Le communiqué de 2003 date de 1998 (20 avril) les premiers règlements de l'île du Sud et de décembre 1998 ceux du reste du pays ; le ministère cite aujourd'hui des règlements de l'île du Sud de 1999."]
  non_confirme: ["Le texte intégral des ss. 174 à 186B et des règlements de 1998 et 1999 n'a pas pu être ouvert (site legislation.govt.nz inaccessible pendant la recherche) ; les règles décrites viennent des pages et lignes directrices du ministère.", "Le rôle de la loi sur les pêcheries māori de 1989 dans la création des taiāpure (avant la loi de 1996) n'a pas été vérifié sur le texte.", "Pour Raukokore et Te Whaka ā Te Wera, l'année de publication de la couche officielle diffère de l'année de l'avis de déclaration ; l'année est laissée vide au tableau.", "Waitarakao et Opihi relèvent du même avis de 2014 et portent le même identifiant dans la couche ; ils sont reproduits tels quels.", "Surfaces : la couche ne donne une surface que pour une partie des sites ; la valeur indiquée pour le port de Lyttelton (30 216 251 ha, plus que la surface du pays) n'est pas reprise.", "La couche rattache l'extension de la réserve d'Opihi (2022) à la région d'Otago (code 14) ; la rivière Opihi et la localité de Temuka relèvent de la région de Canterbury, retenue au tableau.", "Plusieurs réserves déclarées depuis 2023 admettent par exception une pêche commerciale (langouste, poissons) selon la couche.", "Nombre de tangata kaitiaki ou tiaki en fonction et de rohe moana : non trouvé pour 2026.", "Aucun document d'un organe de traité ou du Rapporteur spécial nommant les mātaitai ou les taiāpure n'a été trouvé."]
