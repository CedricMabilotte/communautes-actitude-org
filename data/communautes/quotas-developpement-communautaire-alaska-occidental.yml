resume: >-
  Fiche agrégée : elle couvre les 65 villages de l'ouest de l'Alaska admis au programme de quotas de développement communautaire (Community Development Quota, CDQ), majoritairement des villages autochtones selon le Service national des pêches maritimes (NMFS). Mis en place en 1992 par le Conseil de gestion des pêches du Pacifique Nord et le NMFS pour le lieu jaune, le programme est inscrit dans la loi Magnuson-Stevens sur la conservation et la gestion des pêcheries depuis 1996 et réécrit en 2006 (16 U.S.C. § 1855 (i)). La loi attribue au programme une part fixe des captures autorisées de chaque pêcherie dirigée de la mer de Béring et des îles Aléoutiennes : 10 % du lieu jaune, 10,7 % de la plupart des poissons de fond depuis le 1er janvier 2008, avec des taux propres au flétan, à la morue charbonnière et au crabe. Ces parts sont réparties entre six entités à but non lucratif nommées par la loi (APICDA, BBEDC, CBSFA, CVRF, NSEDC, YDFDA), dont le conseil d'administration compte au moins un membre choisi par chaque village et au moins 75 % de pêcheurs résidents.
