effectivite: {valeur: "effective", note: "Selon le rapport du NMFS d'octobre 2018, les six groupes ont récolté 249 538 tonnes de produits de la mer en 2016, pour une valeur de 120 millions de dollars ; en février 2023, l'État de l'Alaska a conclu sa revue décennale de 2022 en jugeant que les six entités avaient maintenu ou amélioré leurs résultats, ce qui reconduit leurs allocations. Le même rapport du NMFS indique que le panel administratif, faute de vote unanime, n'exerçait plus ses fonctions depuis 2011 ; la loi de 2021 a remplacé l'unanimité par une majorité de cinq membres sur six. Un article de Molly Dischner paru en 2013 dans le magazine First Alaskans, repris par l'Anchorage Daily News, décrit les emplois, bourses et aides financés par les groupes ; il rapporte que le président de l'Association of Village Council Presidents (AVCP) leur demande de limiter davantage leurs prises accessoires, dont le saumon royal, et que la plupart des régions du Yukon et du Kuskokwim, éloignées de la côte, n'entrent pas dans la zone du programme.", source: "https://www.adn.com/economy/article/cdq-brings-millions-fishing-profits-and-jobs-poor-western-alaska-villages/2013/08/19/"}
chronologie:
  - {annee: 1988, evenement: "Première proposition au Conseil de gestion des pêches du Pacifique Nord : réserver aux communautés de l'ouest de l'Alaska 10 % des captures autorisées de poissons de fond de la mer de Béring."}
  - {annee: 1992, evenement: "Règle finale du 3 juin : 7,5 % du lieu jaune de la mer de Béring et des Aléoutiennes attribués au programme, répartis entre six groupes sur recommandation de l'État de l'Alaska."}
  - {annee: 1995, evenement: "Ajout d'allocations de flétan et de morue charbonnière, dans le cadre du programme de quotas individuels adopté en 1993."}
  - {annee: 1996, evenement: "La loi sur les pêcheries durables inscrit le programme dans la loi Magnuson-Stevens (art. 305 (i))."}
  - {annee: 1998, evenement: "L'American Fisheries Act porte la part du lieu jaune à 10 % ; le Conseil étend le programme aux autres poissons de fond, aux espèces interdites (prises accessoires) et au crabe."}
  - {annee: 2006, evenement: "Loi du 11 juillet sur la Garde côtière et le transport maritime : réécriture de l'art. 305 (i) (1), liste nominative des 65 villages et des six entités, création du panel administratif ; constitution de la Western Alaska Community Development Association le 6 septembre."}
  - {annee: 2008, evenement: "Part de 10,7 % pour la plupart des pêcheries de poissons de fond, en vigueur le 1er janvier (loi du 12 janvier 2007)."}
  - {annee: 2021, evenement: "Loi du 1er janvier (Pub. L. 116-283, art. 8423) : le panel décide à la majorité de cinq membres sur six, l'unanimité restant requise pour répartir la réserve de 0,7 %."}
  - {annee: 2023, evenement: "Le 23 février, l'État de l'Alaska clôt la revue décennale de 2022 : les six entités conservent leurs allocations."}
fiabilite:
  verifie: ["Texte du 16 U.S.C. § 1855 (i) (1) (objet, parts, liste des 65 villages et des six entités, conseil d'administration, panel, investissements, revue décennale) et notes d'amendement, sur la version du Legal Information Institute de l'université Cornell.", "Historique (1988, 1992, 1995, 1996, 1998, 2006), parts par espèce et population 1990 et 2016 par groupe, dans le rapport du NMFS d'octobre 2018.", "Conclusion de la revue décennale de 2022, dans le communiqué n° 23-003 du département du Commerce de l'Alaska (23 février 2023)."]
  non_confirme: ["Le chiffre de population est la somme, faite pour cette fiche, des chiffres par groupe du rapport du NMFS ; le chiffre de 397 habitants pour Saint Paul en 2016 n'a pas été recoupé.", "Le rapport du NMFS cite Unalaska parmi les villages de l'APICDA ; la loi ne le nomme pas.", "Le guide de la FAO sur les mesures d'aménagement des pêcheries compte 62 villages répartis en six coalitions, chiffre antérieur à la liste de 2006.", "La part des habitants autochtones dans les 65 villages n'a pas été trouvée en chiffres ; le NMFS les décrit comme majoritairement autochtones, et un critère de 1996 exigeait la certification du village au titre de la loi de 1971 sur le règlement des revendications des autochtones de l'Alaska (ANCSA).", "Le panel peut fixer des exigences que les entités doivent respecter (§ 1855 (i) (1) (E) (vi)) ; aucune règle de ce type adoptée n'a été consultée.", "Aucun document d'un mécanisme de l'ONU visant nommément le programme n'a été trouvé ; les États-Unis ne sont pas parties à la Convention sur la diversité biologique.", "Le résultat de la revue décennale de 2012 n'a pas été vérifié.", "Surface : les villages n'ont pas de périmètre propre au titre du programme ; la zone de pêche n'est pas réservée aux entités."]
