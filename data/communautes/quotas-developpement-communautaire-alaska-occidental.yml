base_nationale:
  - {instrument: "Magnuson-Stevens Fishery Conservation and Management Act, art. 305 (i) (1), codifié au 16 U.S.C. § 1855 (i) (1) : programme ajouté par la loi sur les pêcheries durables (Sustainable Fisheries Act, Pub. L. 104-297, 11 octobre 1996), réécrit par la loi sur la Garde côtière et le transport maritime (Pub. L. 109-241, art. 416 (a), 11 juillet 2006), modifié par Pub. L. 109-479 (12 janvier 2007) et Pub. L. 116-283, art. 8423 (1er janvier 2021)", nature: "loi", annee: 2006, source: "https://www.law.cornell.edu/uscode/text/16/1855"}
  - {instrument: "Règle finale du 3 juin 1992 (57 FR 23321) mettant en œuvre l'amendement 18 au plan de gestion des poissons de fond de la mer de Béring et des Aléoutiennes : réserve CDQ de 7,5 % du lieu jaune", nature: "loi", annee: 1992, source: "https://media.fisheries.noaa.gov/dam-migration/cdq-program-summary-1018.pdf"}
  - {instrument: "American Fisheries Act (1998), art. 206 (a) : part du lieu jaune attribuée au programme portée de 7,5 % à 10 %", nature: "loi", annee: 1998, source: "https://media.fisheries.noaa.gov/dam-migration/cdq-program-summary-1018.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Chaque entité est dirigée par un conseil d'administration dont au moins 75 % des membres sont des pêcheurs résidents des villages membres et qui compte au moins un administrateur choisi par chaque village (16 U.S.C. § 1855 (i) (1) (E) (i)) ; un panel de six membres, un par entité, administre les aspects du programme que la loi ne règle pas (§ 1855 (i) (1) (G)) ; les entités sont des sociétés à but non lucratif, non des gouvernements de village.", source: "https://www.law.cornell.edu/uscode/text/16/1855"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "reconnu", note: "La loi fixe la part du programme dans les captures autorisées de chaque pêcherie dirigée de la mer de Béring et des Aléoutiennes au niveau du 1er mars 2006, et à 10,7 % (prises dirigées et accessoires) pour les pêcheries autres que le flétan, la morue charbonnière, le lieu jaune et le crabe à compter du 1er janvier 2008 ; chaque entité récolte la même part qu'en 2006, avec les droits de transformation associés, et les cessions entre entités sont permises (16 U.S.C. § 1855 (i) (1) (B) et (C)) ; chaque entité peut placer jusqu'à 20 % de ses investissements annuels dans des projets sans lien avec la pêche situés dans sa région, le reste allant à des projets liés à la pêche ou conformes à ses pratiques antérieures au 1er mars 2006 (§ 1855 (i) (1) (E) (iii) et (iv)).", source: "https://www.law.cornell.edu/uscode/text/16/1855"}
