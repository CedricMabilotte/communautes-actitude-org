reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national de la Tanzanie à la Convention sur la diversité biologique : il recense 38 WMA sur 29 518 km² parmi les catégories d'aires protégées, indique que 18 d'entre elles étaient autorisées à utiliser la faune en 2014 et que les villages des WMA dotées de recettes en reçoivent une part", annee: 2014, source: "https://www.cbd.int/doc/world/tz/tz-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Wildlife Conservation Act (loi sur la conservation de la faune) n° 5 de 2009, chap. 283, édition révisée de 2022, art. 3 (définition de l'association autorisée), 31 à 34", nature: "loi", annee: 2009, source: "https://faolex.fao.org/docs/pdf/tan214436.pdf"}
  - {instrument: "Wildlife Conservation (Wildlife Management Areas) Regulations (règlement sur les aires de gestion de la faune), GN n° 381 de 2018", nature: "loi", annee: 2018, source: "https://faolex.fao.org/docs/pdf/tan227269.pdf"}
  - {instrument: "Wildlife Conservation (Wildlife Management Areas) (Amendment) Regulations, 2019, GN n° 27 publié le 17 janvier 2020 : élection des représentants des villages, fonds fiduciaire communautaire des WMA, durée des blocs de chasse", nature: "loi", annee: 2020, source: "https://faolex.fao.org/docs/pdf/tan199931.pdf"}
  - {instrument: "Wildlife Conservation (Non-Consumptive Wildlife Utilization) Regulations (règlement sur l'utilisation non extractive de la faune), GN n° 181 de 2016, règl. 19 ; modifié par le GN n° 875 du 25 octobre 2024", nature: "loi", annee: 2016, source: "https://www.tawa.go.tz/storage/app/uploads/public/627/4e9/657/6274e96572fae918900175.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'association autorisée est une organisation communautaire formée par les villages membres et enregistrée comme association ; après la déclaration de la WMA, le ministre lui accorde ce statut, qui ouvre le droit de gérer et d'utiliser la faune (art. 3 de la loi de 2009 ; stratégie nationale 2023-2033, qui renvoie au règlement de 2018). Le règlement modifié en 2020 (GN 27, règl. 7 et 7A) prévoit l'élection d'un président de l'association parmi les représentants des villages, pour deux mandats au plus ; l'élection des représentants est supervisée par le directeur exécutif du district, avec recours devant la Haute Cour. Un conseil de district consultatif sur les ressources naturelles conseille les associations (art. 33).", source: "https://faolex.fao.org/docs/pdf/tan199931.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Le ministre prépare des règlements types (by-laws, arrêtés villageois) que les autorités villageoises adoptent avec les adaptations nécessaires et qui s'appliquent dans la WMA (art. 31 (4) de la loi de 2009).", source: "https://faolex.fao.org/docs/pdf/tan214436.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La WMA est créée sur la terre villageoise (village land) que le village met de côté ; le ministre la déclare par arrêté publié au Journal officiel sur demande du conseil de village et recommandation du directeur de la faune (art. 31 (1) (c) et 32 de la loi de 2009). L'association autorisée prépare un plan de zonage avant d'obtenir le droit d'usage ; le plan général de gestion est approuvé et publié par le ministre (art. 34 (2) et (4)).", source: "https://faolex.fao.org/docs/pdf/tan214436.pdf"}
  ressources: {valeur: "partiel", note: "L'association autorisée reçoit un droit d'usage de la ressource (Resource User Right) après un plan de zonage (art. 34 (2) de la loi de 2009) ; elle négocie et signe les contrats avec les investisseurs, en présence de représentants du directeur de la faune et du conseil de district (art. 31 (7)). Les catégories et la durée des blocs de chasse des WMA sont fixées par règlement (GN 27 de 2020, règl. 55 et 56).", source: "https://faolex.fao.org/docs/pdf/tan214436.pdf"}
  consentement: {valeur: "partiel", note: "La déclaration d'une WMA suppose une demande du conseil de village (art. 32 de la loi de 2009) ; en prenant les règlements sur les WMA, le ministre doit veiller à ce que la communauté locale soit consultée et informée de la façon dont elle bénéficiera de la WMA (art. 31 (5)). Aucune règle de consentement préalable n'a été trouvée pour les décisions prises après la création.", source: "https://faolex.fao.org/docs/pdf/tan214436.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'association autorisée négocie et signe les contrats avec les investisseurs (art. 31 (7) de la loi de 2009) ; depuis 2020, chaque WMA verse 5 % de son revenu brut annuel à un fonds fiduciaire communautaire des WMA dont le consortium des associations autorisées gère les contributions (GN 27, règl. 29A à 29E). Le règlement de 2016 sur l'utilisation non extractive de la faune (GN 181, règl. 19) attribuait 70 % de ces recettes des WMA à l'association autorisée, 25 % au directeur de la faune et 5 % au conseil de district ; le règlement 19 réécrit en 2024 (GN 875) ne nomme plus les WMA et attribue, dans les « autres zones avec ressources fauniques », 60 % à l'Autorité de gestion de la faune (TAWA), au moins 15 % au conseil de district et 25 % au conseil de village.", source: "https://faolex.fao.org/docs/pdf/tan199931.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de terrain sur la WMA de Burunge (Kicheleri et al., SAGE Open, 2018) indique que 84 % des personnes interrogées n'ont pas participé à sa création, que l'association autorisée a créé une institution villageoise nouvelle au lieu de s'appuyer sur les conseils de village, et que deux villages, Minjingu et Vilima Vitatu, souhaitent se retirer. La stratégie nationale 2023-2033 relève un financement insuffisant, une capacité de gestion limitée et des bénéfices insuffisants pour les communautés ; elle indique que la WMA de Wami-Mbiki a été transformée en réserve de chasse, ainsi qu'ISAWIMA, alors en cours de déclaration. À Burunge, les représentants précédents ont été suspendus le temps d'une enquête ; en septembre 2026, trente représentants ont été élus dans les dix villages membres sous la supervision du directeur exécutif du district, après une révision des statuts de l'association (The Citizen, 18 septembre 2026).", source: "https://journals.sagepub.com/doi/full/10.1177/2158244018774382"}
chronologie:
  - {annee: 1998, evenement: "Politique de la faune : elle prévoit de confier aux communautés la gestion de la faune sur leurs terres."}
  - {annee: 2002, evenement: "Premier règlement sur les WMA ; le dispositif entre en application en janvier 2003 ; 16 WMA pilotes sont lancées."}
  - {annee: 2006, evenement: "Premières déclarations de WMA au Journal officiel (Ikona, Enduimet, Burunge, Ngarambe-Tapika, Uyumbu, Ipole)."}
  - {annee: 2009, evenement: "Loi sur la conservation de la faune n° 5 : partie V consacrée aux WMA (art. 31 à 33)."}
  - {annee: 2010, evenement: "Enregistrement du consortium des associations autorisées (CWMAC), le 22 janvier."}
  - {annee: 2012, evenement: "Règlement révisé sur les WMA."}
  - {annee: 2016, evenement: "Règlement sur l'utilisation non extractive de la faune : 70 % des recettes non extractives des WMA attribuées à l'association autorisée."}
  - {annee: 2018, evenement: "Nouveau règlement sur les WMA, GN n° 381."}
  - {annee: 2020, evenement: "Modification du règlement (GN n° 27) : élection des représentants, fonds fiduciaire communautaire des WMA alimenté par 5 % du revenu brut."}
  - {annee: 2023, evenement: "Stratégie nationale des WMA 2023-2033 : 21 WMA avec statut d'association autorisée, 334 villages, 16 WMA en cours de création."}
  - {annee: 2024, evenement: "Réécriture du règlement 19 sur la répartition des recettes non extractives (GN n° 875), sans mention des WMA."}
  - {annee: 2025, evenement: "Discours budgétaire 2025-2026 du ministère : 40 WMA, dont 26 autorisées et 14 en cours d'autorisation ; le ministère indique avoir révisé le règlement de 2018 sur les WMA."}
  - {annee: 2026, evenement: "Juillet : atelier du ministère et du Fonds tanzanien de conservation de la faune (TWPF) pour préparer un projet de lignes directrices (mwongozo) sur la création et la gestion des WMA. Septembre : élection de trente représentants des dix villages de la WMA de Burunge après la suspension de l'équipe précédente."}
fiabilite:
  verifie: ["Texte des art. 3, 31 à 34 de la loi de 2009, édition révisée de 2022 (FAOLEX).", "Texte du GN n° 27 de 2020 modifiant le règlement de 2018 (FAOLEX).", "Règlement 19 du GN n° 181 de 2016 (70 % / 25 % / 5 %) et règlement 19 réécrit par le GN n° 875 de 2024 (site de l'Autorité tanzanienne de gestion de la faune, TAWA).", "Liste des 21 WMA opérationnelles avec association, date de déclaration, superficie et district, 334 villages, 16 WMA en cours : stratégie nationale 2023-2033 (FAOLEX).", "Chiffres de 2014 (38 WMA, 29 518 km², 18 autorisées) : cinquième rapport national à la CDB.", "Chiffres de 2025 (40 WMA, 26 autorisées, 14 en cours) et révision du règlement de 2018 annoncée : discours budgétaire 2025-2026 du ministère, § 26 et § 36.", "Élections de Burunge de septembre 2026 : article de The Citizen du 18 septembre 2026."]
  non_confirme: ["Le texte du règlement de 2018 (GN n° 381) n'a pas été consulté directement ; son contenu est décrit d'après la stratégie nationale et le GN n° 27 de 2020.", "Écart entre la superficie annoncée (27 900 km²) et la somme du tableau (27 349 km²) dans la stratégie ; la même source indique 7 % des aires protégées et 7 % du territoire.", "Traitement des recettes des WMA après la réécriture du règlement 19 en 2024 : la catégorie qui s'applique aux WMA n'est pas précisée dans le texte consulté.", "L'étude sur Burunge a été lue en ligne par extraits.", "Numéro de publication du règlement révisé de 2012 : non vérifié.", "Population des villages membres : aucun chiffre trouvé.", "Inscription des WMA à la base mondiale des aires protégées (WDPA) comme aires gouvernées par des communautés : non vérifiée.", "Aucun texte publié du règlement révisé sur les WMA ni des lignes directrices de 2026 n'a été trouvé au 6 octobre 2026 ; le règlement de 2018 modifié en 2020 reste la référence.", "En juillet 2026, la coordinatrice de l'atelier cite 24 WMA autorisées et 16 en cours (Michuzi Blog), chiffre différent des 26 autorisées du discours budgétaire de 2025.", "Le tableau des sites ne couvre que les 21 WMA de la stratégie de 2023 ; les superficies des WMA autorisées depuis ne sont pas connues.", "Le site du ministère présente un certificat que certains clients refusent ; le document a été ouvert le 6 octobre 2026."]
