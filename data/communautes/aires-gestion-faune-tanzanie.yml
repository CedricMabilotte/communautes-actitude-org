nom: "Aires de gestion de la faune de Tanzanie"
endonyme: ""
territoire: "Aires de gestion de la faune (WMA) délimitées sur des terres villageoises, hors des aires protégées centrales, dans cinq zones de gestion de la Tanzanie continentale"
