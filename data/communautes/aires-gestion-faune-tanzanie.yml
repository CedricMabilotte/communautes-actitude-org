surface_km2: {valeur: 27900, annee: 2023, perimetre: "superficie annoncée pour les 21 WMA opérationnelles ; la source l'exprime aussi en « 279 000 ha », chiffre qui ne concorde pas (27 900 km² = 2 790 000 ha) ; la somme des superficies du tableau de la même source donne 27 349 km²", source: "https://faolex.fao.org/docs/pdf/tan227269.pdf"}
villages: {valeur: 334, annee: 2023, perimetre: "villages membres des 21 WMA opérationnelles, situées dans 21 districts", source: "https://faolex.fao.org/docs/pdf/tan227269.pdf"}
resume: >-
  Fiche agrégée : elle couvre les villages qui ont mis de côté une partie de leurs terres villageoises pour la gestion de la faune. La loi sur la conservation de la faune de 2009 (Wildlife Conservation Act, chap. 283) prévoit la création d'aires de gestion de la faune (Wildlife Management Areas, WMA) sur les terres villageoises, hors des aires protégées centrales (art. 31) ; le ministre les déclare au Journal officiel sur demande du conseil de village (art. 32). Chaque WMA est gérée par une organisation communautaire formée des villages membres, qui reçoit du ministre le statut d'association autorisée (Authorised Association) et un droit d'usage de la faune. En 2023, la stratégie nationale 2023-2033 compte 21 WMA dotées de ce statut, 334 villages membres et 16 WMA en cours de création. En 2025, le discours budgétaire du ministère des Ressources naturelles et du Tourisme compte 40 WMA, dont 26 autorisées et 14 en cours d'autorisation.
