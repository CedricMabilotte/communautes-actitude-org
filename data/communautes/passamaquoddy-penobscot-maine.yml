base: "territoriale"
types_secondaires: []
population: {valeur: 5805, annee: null, perimetre: "membres inscrits, somme de trois chiffres non datés de la Commission tribale-étatique du Maine (MITSC) : environ 2 400 Penobscot, environ 1 400 Passamaquoddy à Motahkomikuk et environ 2 005 à Sipayik ; la bande de St. Croix-Schoodic (Nouveau-Brunswick) n'est pas comptée", source: "https://www.mitsc.org/wabanaki-nations/the-passamaquoddy-tribe"}
