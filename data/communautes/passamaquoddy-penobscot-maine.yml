reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis ont déclaré leur appui à la Déclaration le 16 décembre 2010 (A/HRC/21/47/Add.1, § 80).", annee: 2010, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
  - {mecanisme: "rapporteur_special", detail: "Le rapport de mission aux États-Unis (A/HRC/21/47/Add.1, appendice II, § 8) résume la communication de la Commission tribale-étatique du Maine : le Settlement Act et le Maine Implementing Act créent des « inégalités structurelles » qui limitent l'autodétermination des nations du Maine.", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
base_nationale:
  - {instrument: "Accord avec le Massachusetts du 19 septembre 1794 (réserve Passamaquoddy) et accord de 1818 (îles du Penobscot), repris par 30 M.R.S. § 6203", nature: "traite", annee: 1794, source: "https://legislature.maine.gov/legis/statutes/30/title30sec6203.html"}
  - {instrument: "Maine Implementing Act, 30 M.R.S. §§ 6201-6214 (P.L. 1979, c. 732)", nature: "loi", annee: 1980, source: "https://legislature.maine.gov/legis/statutes/30/title30sec6206.html"}
  - {instrument: "Maine Indian Claims Settlement Act, Pub. L. 96-420, 94 Stat. 1785 (loi fédérale)", nature: "accord_revendication", annee: 1980, source: "https://www.govinfo.gov/content/pkg/STATUTE-94/pdf/STATUTE-94-Pg1785.pdf"}
  - {instrument: "Penobscot Nation v. Frey, Cour d'appel fédérale du premier circuit, en formation plénière (8 juillet 2021)", nature: "jurisprudence", annee: 2021, source: "https://nsglc.olemiss.edu/blog/2021/aug/10/index.html"}
  - {instrument: "P.L. 2023, c. 647 (LD 2007), compétence pénale des tribunaux tribaux", nature: "loi", annee: 2024, source: "https://www.maine.gov/governor/mills/news/governor-mills-signs-bill-expanding-tribal-rights-prosecute-crimes-2024-04-22"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Les « affaires tribales internes », dont l'organisation tribale, le gouvernement tribal et les élections, ne sont pas soumises à la réglementation de l'État (30 M.R.S. § 6206, al. 1, modifié par P.L. 2023, c. 647).", source: "https://legislature.maine.gov/legis/statutes/30/title30sec6206.html"}
  pouvoir_normatif: {valeur: "partiel", note: "Chaque nation a, dans son territoire, les pouvoirs d'une municipalité, dont celui d'édicter des ordonnances, et reste soumise aux lois de l'État (30 M.R.S. § 6206, al. 1 et 3) ; elle a une compétence exclusive pour réglementer chasse et piégeage dans son territoire (§ 6207).", source: "https://legislature.maine.gov/legis/statutes/30/title30sec6206.html"}
  justice_propre: {valeur: "partiel", note: "Les tribunaux passamaquoddy et penobscot jugent à titre exclusif les crimes de classes C, D et E commis dans le territoire par un membre d'une nation reconnue par l'État fédéral sans victime ou contre un autre membre, les affaires de mineurs, les petits litiges civils et le mariage, le divorce et les pensions entre membres ; leur compétence est concurrente avec l'État quand la victime n'est pas membre (30 M.R.S. §§ 6209-A et 6209-B, al. 1 et 1-A, modifiés par P.L. 2023, c. 647).", source: "https://legislature.maine.gov/legis/statutes/30/title30sec6209-A.html"}
  terres: {valeur: "reconnu", note: "Réserves fixées par les accords de 1794 et 1818 et jusqu'à 150 000 acres acquises pour chaque nation (30 M.R.S. §§ 6203 et 6205) ; toute cession de terres du territoire est nulle, sauf expropriation pour usage public, transfert entre membres ou, à la demande de la nation, bail, vente, servitude ou échange autorisés par la loi fédérale (Pub. L. 96-420, sect. 5(g)(2) et (3), 1980).", source: "https://www.govinfo.gov/content/pkg/STATUTE-94/pdf/STATUTE-94-Pg1785.pdf"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur la chasse, le piégeage et la pêche dans les étangs de moins de 10 acres du territoire ; pêche de subsistance des membres dans les réserves ; la pêche dans les autres eaux bordant le territoire relève de la Commission tribale-étatique ; compétence exclusive sur l'eau potable dans le territoire (30 M.R.S. § 6207, al. 1, 3, 4, 10 et 11).", source: "https://legislature.maine.gov/legis/statutes/30/title30sec6207.html"}
  consentement: {valeur: "partiel", note: "La loi fédérale autorise le Maine à modifier le Maine Implementing Act sur la répartition des compétences à condition que la nation concernée donne son accord (Pub. L. 96-420, sect. 6(e)(1), 1980) ; pas d'obligation générale de consentement préalable.", source: "https://www.govinfo.gov/content/pkg/STATUTE-94/pdf/STATUTE-94-Pg1785.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Pouvoir de percevoir des impôts comme une municipalité (30 M.R.S. § 6206, al. 1) ; les nations versent des paiements en lieu et place de l'impôt foncier et le § 6208 les soumet aux autres impôts de l'État ; le revenu du fonds du règlement est exonéré (§ 6208, al. 1 à 3).", source: "https://legislature.maine.gov/legis/statutes/30/title30sec6208.html"}
  representation: {valeur: "partiel", note: "Représentants tribaux sans droit de vote à la Chambre du Maine, selon les règles conjointes 206 et 316 ; la Passamaquoddy Tribe et la Penobscot Nation ont retiré les leurs le 26 mai 2015.", source: "https://legislature.maine.gov/lawlibrary/history-of-tribal-representation-in-maine/9261"}
  statut_personnel: {valeur: "reconnu", note: "L'appartenance à la nation et le droit de résider dans le territoire sont des « affaires tribales internes » soustraites à la réglementation de l'État (30 M.R.S. § 6206, al. 1).", source: "https://legislature.maine.gov/legis/statutes/30/title30sec6206.html"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2024, le Maine Morning Star écrit que la loi de 1980 laisse aux nations wabanaki un statut « plus proche de celui de municipalités que de nations souveraines » et que leurs dirigeants disent ne pas avoir renoncé à leur souveraineté en la signant ; en 2012, la Commission tribale-étatique avait signalé au Rapporteur spécial des « inégalités structurelles » qui limitent leur autodétermination (A/HRC/21/47/Add.1).", source: "https://mainemorningstar.com/2024/04/05/despite-legislative-wins-commission-rift-highlights-ongoing-tensions-with-tribal-state-affairs/"}
chronologie:
  - {annee: 1794, evenement: "Accord du 19 septembre avec le Massachusetts : réserve passamaquoddy (Indian Township, Pleasant Point, îles de la Sainte-Croix)."}
  - {annee: 1818, evenement: "Accord du 29 juin : les îles du Penobscot au nord d'Indian Island sont réservées à la Penobscot Nation."}
  - {annee: 1976, evenement: "Reconnaissance fédérale de la Passamaquoddy Tribe et de la Penobscot Nation."}
  - {annee: 1980, evenement: "Maine Implementing Act et Maine Indian Claims Settlement Act (10 octobre) : règlement des revendications foncières, fonds de 27 millions et fonds d'acquisition foncière de 54,5 millions de dollars."}
  - {annee: 2015, evenement: "Retrait des représentants passamaquoddy et penobscot de la Chambre du Maine (26 mai)."}
  - {annee: 2021, evenement: "Penobscot Nation v. Frey (8 juillet) : la réserve ne comprend pas les eaux du fleuve."}
  - {annee: 2022, evenement: "La Cour suprême fédérale refuse d'examiner Penobscot Nation v. Frey (ordonnance du 18 avril)."}
  - {annee: 2024, evenement: "Loi LD 2007 (P.L. 2023, c. 647) signée le 22 avril : compétence pénale étendue aux crimes de classe C."}
