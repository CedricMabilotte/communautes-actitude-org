nom: "Passamaquoddy et Penobscot du Maine"
endonyme: "Pestomuhkatiyik (Passamaquoddy)"
territoire: "Territoires Passamaquoddy et Penobscot (« Indian territories ») de l'État du Maine : Motahkomikuk (Indian Township), Sipayik (Pleasant Point), Indian Island et îles du Penobscot, terres acquises en fiducie"
etats: ["États-Unis"]
region: "ameriques"
