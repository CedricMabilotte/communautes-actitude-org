surface_km2: {valeur: 873.1, annee: 2024, perimetre: "terres émergées (eaux exclues) de quatre zones statistiques autochtones du Bureau du recensement des États-Unis : Indian Township Reservation 97,2 km², Pleasant Point Reservation 1,5 km², Passamaquoddy Trust Land 376,2 km², Penobscot Reservation and Off-Reservation Trust Land 398,2 km² ; terres en fiducie comprises, contrairement à la valeur de lieux ; limites statistiques du recensement, non juridiques", source: "https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_Gaz_aiannh_national.zip"}
villages: {valeur: 3, annee: null, perimetre: "communautés de réserve habitées : Motahkomikuk (Indian Township), Sipayik (Pleasant Point), Indian Island (cette dernière d'après la page Penobscot Nation de la même Commission)", source: "https://www.mitsc.org/wabanaki-nations/the-passamaquoddy-tribe"}
resume: >-
  La Passamaquoddy Tribe et la Penobscot Nation vivent dans l'est et le centre du Maine. Le règlement de leurs revendications foncières, en 1980, repose sur deux lois : une loi fédérale (Maine Indian Claims Settlement Act) et une loi de l'État (Maine Implementing Act, 30 M.R.S. §§ 6201 et suivants). Dans leurs « territoires indiens », chacune exerce les pouvoirs d'une municipalité, dont celui d'édicter des ordonnances (règlements locaux) et de percevoir des impôts ; les « affaires tribales internes » (appartenance, résidence, organisation et élections du gouvernement, fonds du règlement) échappent à la réglementation de l'État. Ce régime relève de l'État du Maine et non du droit fédéral commun des nations tribales ; une loi de 2024 (P.L. 2023, c. 647) a étendu la compétence pénale de leurs tribunaux.
