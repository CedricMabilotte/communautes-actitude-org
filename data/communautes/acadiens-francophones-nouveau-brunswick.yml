resume: >-
  Une loi provinciale de 1981 reconnaît officiellement la communauté linguistique française et la communauté linguistique anglaise, et leur droit à des institutions distinctes. Depuis 1993, l'article 16.1 de la Charte canadienne des droits et libertés inscrit dans la Constitution l'égalité de statut de ces deux communautés et leur droit à des institutions d'enseignement et culturelles distinctes. La communauté francophone, en majorité acadienne, gère trois districts scolaires de langue française par des conseils d'éducation de district (organes élus qui dirigent chaque district) ; une régie régionale de la santé fonctionne en français depuis 2010. La gestion scolaire des minorités de langue officielle des autres provinces fait l'objet de la fiche « Minorités de langue officielle ».
