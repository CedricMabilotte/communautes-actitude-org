resume: >-
  Les chrétiens de Jordanie appartiennent en majorité à l'Église grecque orthodoxe ; on compte aussi des catholiques latins et melkites, des Arméniens, des Coptes, des syriaques et des protestants.
  La Constitution de 1952 crée, à côté des tribunaux de la charia, des tribunaux des communautés religieuses non musulmanes reconnues par le gouvernement, compétents en statut personnel (mariage, divorce, garde des enfants) et pour les biens de mainmorte (waqf) de la communauté.
  La loi de 2014 sur les conseils des confessions chrétiennes reconnaît 11 confessions ; sept d'entre elles disposent de tribunaux ecclésiastiques.
  La loi électorale n° 4 de 2022 réserve au moins 9 des 138 sièges de la Chambre des députés à des candidats chrétiens.
