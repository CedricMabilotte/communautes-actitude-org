resume: >-
  Les Mapuche forment le premier peuple autochtone du Chili par le nombre : le recensement de 2024 compte 1 623 073 personnes, soit 77,2 % de la population autochtone du pays. La loi 19.253 de 1993 (Ley Indígena) les nomme en tête des principales ethnies autochtones (etnias indígenas) reconnues par l'État. Elle donne la personnalité juridique aux communautés constituées en assemblée, rend les terres autochtones inaliénables hors de la même ethnie, interdit la location des terres communautaires et fait de la coutume invoquée en justice entre membres d'une même ethnie une source de droit. Le Chili ratifie la Convention 169 de l'OIT en 2008 ; la loi 20.249 de la même année ouvre aux communautés les espaces côtiers marins des peuples originaires (ECMPO), traités dans une fiche distincte.
reconnaissance_regionale:
  - {mecanisme: "cour_interamericaine", detail: "Arrêt Norín Catrimán et autres (dirigeants, membres et militante du peuple autochtone mapuche) c. Chili, du 29 mai 2014, sur l'application de la loi antiterroriste à des dirigeants mapuche.", annee: 2014, source: "https://www.corteidh.or.cr/docs/casos/articulos/seriec_279_esp.pdf"}
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "Le Chili ratifie la Convention 169 de l'OIT le 15 septembre 2008, date rappelée par le Rapporteur spécial dans son rapport de 2009.", annee: 2008, source: "https://documents.un.org/doc/undoc/gen/g09/162/37/pdf/g0916237.pdf"}
  - {mecanisme: "dnudpa", detail: "Le Chili vote pour la Déclaration des Nations unies sur les droits des peuples autochtones le 13 septembre 2007.", annee: 2007, source: "https://press.un.org/en/2007/ga10612.doc.htm"}
  - {mecanisme: "rapporteur_special", detail: "Rapport de James Anaya sur la situation des peuples autochtones au Chili (A/HRC/12/34/Add.6), avec une section sur les conflits liés aux revendications de terres mapuche.", annee: 2009, source: "https://documents.un.org/doc/undoc/gen/g09/162/37/pdf/g0916237.pdf"}
  - {mecanisme: "organe_traite", detail: "Observations finales du CERD (CERD/C/CHL/CO/22-23), adoptées le 1er décembre 2021 et publiées le 13 septembre 2022 : militarisation du conflit avec les Mapuche, application disproportionnée de la loi antiterroriste à des membres de la communauté mapuche, restitution des terres ancestrales.", annee: 2022, source: "https://documents.un.org/doc/undoc/gen/g22/486/73/pdf/g2248673.pdf"}
base_nationale:
  - {instrument: "Loi 19.253 de 1993 sur la protection, la promotion et le développement des peuples autochtones, créant la Corporation nationale de développement autochtone (CONADI), art. 1, 9 à 13, 28, 32, 34, 41, 54 et 61", nature: "loi", annee: 1993, source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  - {instrument: "Loi 20.249 de 2008 créant l'espace côtier marin des peuples originaires (ECMPO)", nature: "loi", annee: 2008, source: "https://www.subpesca.cl/portal/616/articles-82585_recurso_1.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La loi 19.253 (art. 9 et 10) donne la personnalité juridique à toute communauté autochtone (comunidad indígena) qui adopte ses statuts et élit sa direction en assemblée, par simple dépôt de l'acte auprès de la CONADI ; l'art. 61 reconnaît chez les Mapuche huilliche le système traditionnel des cacicats (cacicados) et son ressort territorial. Aucune institution mapuche n'exerce de compétence publique.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La loi 19.253 (art. 54) dispose que la coutume invoquée en justice entre autochtones d'une même ethnie constitue du droit, si elle n'est pas contraire à la Constitution ; le juge applique le droit coutumier au partage des terres issues de titres de concession (art. 16).", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi 19.253 (art. 12 et 13) protège les terres autochtones, dont les titres de concession de l'État (títulos de merced) des lois de 1866, 1874 et 1883 : elles ne peuvent être vendues, saisies, grevées sans autorisation de la CONADI ni acquises par prescription (par simple possession prolongée), sauf entre personnes ou communautés de la même ethnie, et les terres communautaires ne peuvent être louées ni cédées en usage. Le Rapporteur spécial note en 2009 l'absence de mécanisme de reconnaissance des terres d'occupation ancestrale non titrées.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  ressources: {valeur: "partiel", note: "La loi 20.249 de 2008 permet de confier à une association de communautés, ou à titre exceptionnel à une communauté, l'administration d'un espace côtier marin fondé sur son usage coutumier (pêche, usage religieux, récréatif, médicinal), après approbation d'un plan d'administration par une commission intersectorielle présidée par le Sous-secrétariat à la Pêche ; la loi 19.253 (art. 35) prévoit la participation des communautés à la gestion des aires protégées situées dans les aires de développement autochtone.", source: "https://www.subpesca.cl/portal/616/articles-82585_recurso_1.pdf"}
  consentement: {valeur: "partiel", note: "La loi 19.253 (art. 34) oblige les services de l'État à écouter et à prendre en compte l'avis des organisations autochtones sur les questions qui les concernent ; la Convention 169 (art. 6), ratifiée en 2008, impose la consultation. En 2022, le CERD relève l'inefficacité ou l'absence de consultations sur la terre et le territoire.", source: "https://documents.un.org/doc/undoc/gen/g22/486/73/pdf/g2248673.pdf"}
  langue: {valeur: "partiel", note: "La loi 19.253 (art. 28 a) prévoit l'usage et la conservation des langues autochtones aux côtés de l'espagnol dans les zones de forte densité autochtone, sans statut officiel.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  education: {valeur: "partiel", note: "La loi 19.253 (art. 32) charge la CONADI de développer un système d'éducation interculturelle bilingue dans les zones de forte densité autochtone, en coordination avec les services de l'État.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La loi 19.253 (art. 41 d) réserve quatre sièges mapuche, sur huit représentants autochtones, au conseil national de la CONADI ; le président de la République les désigne sur proposition des communautés et associations.", source: "https://faolex.fao.org/docs/pdf/chi51605.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "En 2022, le CERD s'inquiète de l'état d'urgence et de la militarisation du conflit avec les Mapuche, de l'application disproportionnée de la loi antiterroriste à des membres de la communauté mapuche, et de l'attention et des ressources insuffisantes consacrées à la restitution des terres ancestrales, « principale source de tension » avec les peuples autochtones.", source: "https://documents.un.org/doc/undoc/gen/g22/486/73/pdf/g2248673.pdf"}
chronologie:
  - {annee: 1993, evenement: "Publication de la loi 19.253 (5 octobre) et création de la CONADI."}
  - {annee: 2007, evenement: "Le Chili vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (13 septembre)."}
  - {annee: 2008, evenement: "Publication de la loi 20.249 sur les espaces côtiers marins des peuples originaires (16 février) ; ratification de la Convention 169 de l'OIT (15 septembre)."}
  - {annee: 2009, evenement: "Rapport du Rapporteur spécial James Anaya sur les peuples autochtones au Chili."}
  - {annee: 2014, evenement: "Arrêt de la Cour interaméricaine dans l'affaire Norín Catrimán et autres c. Chili (29 mai)."}
  - {annee: 2020, evenement: "La loi 21.273 reconnaît le peuple chango et modifie les articles 1, 12 et 64 de la loi 19.253 (17 octobre)."}
  - {annee: 2022, evenement: "Publication des observations finales du CERD sur le Chili, adoptées le 1er décembre 2021 (13 septembre)."}
  - {annee: 2024, evenement: "Le recensement compte 1 623 073 personnes appartenant au peuple mapuche."}
