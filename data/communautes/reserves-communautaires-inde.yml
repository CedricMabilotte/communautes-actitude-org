reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité pour l'élimination de la discrimination raciale, CERD/C/IND/CO/19 : § 10 recommande de reconnaître les peuples tribaux comme groupes ayant droit à une protection spéciale ; § 19 demande le respect de la propriété collective des terres traditionnelles et le consentement préalable des communautés du Manipur et des autres États du nord-est", annee: 2007, source: "https://docs.un.org/fr/CERD/C/IND/CO/19"}
base_nationale:
  - {instrument: "Wild Life (Protection) Amendment Act, 2002 (loi 16 de 2003), art. 20 : insertion des art. 36A à 36D dans la loi de 1972", nature: "loi", annee: 2003, source: "https://faolex.fao.org/docs/pdf/ind40069.pdf"}
  - {instrument: "Wild Life (Protection) Amendment Act, 2022, art. 15 : modification de l'art. 36D (au moins cinq représentants ; comité des réserves sur terre privée)", nature: "loi", annee: 2022, source: "https://www.legitquest.com/act/wild-life-protection-amendment-act-2022/c855"}
  - {instrument: "Wild Life (Protection) Act, 1972, art. 36D en vigueur", nature: "loi", annee: 1972, source: "https://indiankanoon.org/doc/185112523/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le comité de gestion est « l'autorité responsable » de la réserve et élit son président, garde honoraire de la faune, art. 36D (1) et (4) ; l'État le constitue et la loi en fixe la composition : au moins cinq représentants désignés par le panchayat (conseil de village élu) ou la gram sabha (assemblée des électeurs du village) et un représentant forestier, art. 36D (2).", source: "https://indiankanoon.org/doc/185112523/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La réserve est déclarée sur une terre privée ou communautaire, sans transfert de propriété, art. 36C (1) ; aucun changement d'usage du sol sans résolution du comité et accord de l'État, art. 36C (3) ; la loi ne prévoit aucune procédure de déclassement (Kalpavriksh, 2025).", source: "https://kalpavriksh.org/wp-content/uploads/2025/10/PA-Declaration_WLPA-Eng-1.pdf"}
  ressources: {valeur: "partiel", note: "Le comité est l'autorité compétente pour préparer et appliquer le plan de gestion et protéger la faune et son habitat, art. 36D (3) ; le directeur de la faune de l'État garde ses pouvoirs de sécurité et d'amélioration de l'habitat (art. 33 (b) et (c), rendus applicables par l'art. 36C (2)) et la chasse reste interdite partout, art. 9.", source: "https://www.legitquest.com/act/wild-life-protection-act-1972-amended-upto-2022/c856"}
  consentement: {valeur: "partiel", note: "L'État ne peut déclarer une réserve communautaire que si la communauté ou la personne s'est portée volontaire, art. 36C (1) ; la loi ne fixe pas de procédure de consentement, et au Nagaland la création passe par un protocole d'accord signé par le conseil de village et le département forestier (Down To Earth, 2022).", source: "https://www.downtoearth.org.in/forests/community-reserves-are-they-forest-department-s-backdoor-entry-into-north-east-india-85242"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
