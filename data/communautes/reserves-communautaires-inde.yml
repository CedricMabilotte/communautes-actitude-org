resume: >-
  Fiche agrégée : elle couvre les villages, institutions coutumières et propriétaires qui gèrent une réserve communautaire au titre des articles 36C et 36D de la loi de 1972 sur la protection de la faune, insérés en 2003. L'État déclare la réserve sur une terre communautaire ou privée quand la communauté s'est portée volontaire ; la terre n'est pas transférée. Un comité d'au moins cinq représentants désignés par le conseil de village ou l'assemblée villageoise et d'un forestier gère la réserve et écrit son plan de gestion ; tout changement d'usage du sol exige sa résolution et l'accord de l'État. En février 2025, 309 réserves étaient inscrites, dont 188 au Nagaland et 85 au Meghalaya ; la plupart des habitants y appartiennent à des peuples de la liste constitutionnelle des Scheduled Tribes, mais pas au Punjab, au Kerala ni au Haryana.
