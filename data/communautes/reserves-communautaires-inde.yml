effectivite: {valeur: "partielle", note: "À Kadalundi-Vallikkunnu (Kerala), des habitants décrivent en 2012 un comité nommé par le gouvernement, un plan de gestion non approuvé et une « paper park » ; au Haryana, les comités de trois réserves de 2019 ont été notifiés en janvier 2025, présidés par l'officier de la faune du district et chargés de conseiller le directeur de la faune (The Tribune, 11 février 2025) ; au Meghalaya, des comités issus des institutions khasi fonctionnent avec un forestier (PLOS One, 2023).", source: "https://pdfs.semanticscholar.org/d1df/5cb2390aa6c1d9386cea09622e89d05f0788.pdf"}
chronologie:
  - {annee: 2003, evenement: "Loi modificative de 2002 sanctionnée le 17 janvier 2003 : création des réserves de conservation et des réserves communautaires."}
  - {annee: 2007, evenement: "Premières réserves communautaires : Keshopur Chhamb et Lalwan (Punjab), Kokkare Bellur (Karnataka), Kadalundi-Vallikkunnu (Kerala)."}
  - {annee: 2009, evenement: "Premières réserves communautaires du Nagaland (Bonchu, Scaly-Mopungchuket, Khrokhropfu-Lephori)."}
  - {annee: 2013, evenement: "Premières réserves communautaires du Meghalaya."}
  - {annee: 2022, evenement: "Loi modificative : le comité compte au moins cinq représentants ; règle propre aux réserves sur terre privée."}
  - {annee: 2023, evenement: "220 réserves au 27 novembre (National Wildlife Database Centre)."}
  - {annee: 2025, evenement: "309 réserves inscrites en février, dont 188 au Nagaland."}
