effectivite: {valeur: "non_etablie", note: "La Slovaquie déclare à la FAO 324 980 ha de forêts en propriété partagée en 2020, contre 475 380 ha en 2010, et 432 980 ha classés « inconnus, autres », parcelles dont le titre ne figure qu'à l'état E du cadastre, sans force juridique ; aucune source indépendante sur le fonctionnement des communautés n'a été trouvée.", source: "https://fra-data.fao.org/assessments/fra/2025/SVK/sections/forestOwnership/"}
chronologie:
  - {annee: 1767, evenement: "Urbaire de Marie-Thérèse, auquel le Parlement slovaque rattache l'origine du régime des communautés foncières."}
  - {annee: 1898, evenement: "Loi hongroise XIX/1898 sur la gestion des forêts et pâturages indivis des komposesoráty et des anciens urbarialistes."}
  - {annee: 1913, evenement: "Loi hongroise X/1913 sur les pâturages communs indivis."}
  - {annee: 1991, evenement: "Les lois 229/1991 et 330/1991 permettent de reconstituer les communautés forestières et pastorales après la restitution des terres."}
  - {annee: 1995, evenement: "Loi n° 181/1995 Z. z. sur les communautés foncières."}
  - {annee: 2013, evenement: "La loi n° 97/2013 Z. z. remplace la loi de 1995 (en vigueur le 1er mai) ; les communautés doivent mettre leurs statuts en conformité avant le 28 février 2014."}
  - {annee: 2018, evenement: "La loi n° 110/2018 Z. z. (en vigueur le 1er juillet) permet de dissoudre la copropriété du bien commun par remembrement et interdit aux communautés de changer de forme juridique."}
  - {annee: 2025, evenement: "Modification par la loi n° 81/2025 Z. z. (en vigueur le 1er juin)."}
fiabilite:
  verifie: ["Texte publié de la loi 97/2013 (Recueil des lois, 23 avril 2013) : personne morale (§ 3), indivisibilité du bien commun (§ 8 al. 1), organes (§ 13 à 17), activités (§ 19), registre (§ 22), contrôle de l'État (§ 27), abrogation de la loi 181/1995 (§ 33), entrée en vigueur au 1er mai 2013 (§ 34).", "Version consolidée en vigueur au 1er juin 2025 et liste des lois modificatives, d'après Slov-Lex ; nouveau § 8 al. 1 (dissolution possible selon § 11 al. 13 de la loi 330/1991) présent dès la version du 1er juillet 2018 et absent de celle du 27 février 2014.", "Renvoi aux lois hongroises XIX/1898 et X/1913 sur les biens indivis des komposesoráty et des anciens urbarialistes (note 2 de la loi).", "Surface des forêts en propriété partagée (324,98 milliers d'ha en 2020) et classement de cette catégorie nationale parmi les forêts détenues par des communautés, d'après le rapport de la Slovaquie à l'Évaluation des ressources forestières mondiales de la FAO (2025).", "Rattachement du régime à l'urbaire de 1767, d'après l'Institut parlementaire du Conseil national (information n° 6/2019)."]
  non_confirme: ["Nombre de communautés inscrites et nombre de membres : aucun chiffre officiel n'a pu être ouvert (rapports du ministère de l'Agriculture inaccessibles) ; aucune liste nationale des communautés n'a été trouvée, d'où l'absence de tableau.", "La catégorie « partagée » de la FAO peut ne pas coïncider exactement avec les forêts des communautés inscrites sous la loi 97/2013 ; les pâturages et terres agricoles des communautés ne sont pas comptés.", "La loi couvre aussi des communautés créées librement par des propriétaires de parcelles voisines (§ 2 al. 1 d), sans héritage des urbariáty ou komposesoráty.", "Aucune source indépendante (universitaire ou associative) sur le fonctionnement des communautés n'a été ouverte.", "Aucune source n'établit l'application effective des organes et du contrôle de l'État, d'où la valeur « partiel » de l'autogouvernement ; la répartition des bénéfices n'a pas été retenue comme pouvoir fiscal.", "Le rôle du conseil de surveillance, qui examine les plaintes des membres (§ 17 al. 1), n'a pas été retenu comme justice propre.", "Nombre de villages : non trouvé."]
