resume: >-
  Les communautés foncières (pozemkové spoločenstvá) réunissent les copropriétaires de forêts, de pâturages et de terres détenus en commun, dont une partie hérite des biens indivis des urbariáty (communautés d'anciens « urbarialistes », tenanciers régis par l'urbaire de 1767) et des komposesoráty (copropriétés indivises), régis par les lois hongroises XIX/1898 et X/1913. La loi n° 97/2013 Z. z. (Recueil des lois), en vigueur depuis le 1er mai 2013, fait de chaque communauté une personne morale inscrite au registre tenu par l'office de district, gouvernée par l'assemblée de tous ses membres, un comité et un conseil de surveillance élus. La communauté gère le bien commun pour l'agriculture, la forêt et les plans d'eau. Depuis la loi n° 110/2018 Z. z., la copropriété du bien commun peut être dissoute dans le cadre d'un remembrement.
