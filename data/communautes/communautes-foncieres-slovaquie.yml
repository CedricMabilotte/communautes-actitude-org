base_nationale:
  - {instrument: "Loi n° 97/2013 Z. z. du 26 mars 2013 sur les communautés foncières (zákon o pozemkových spoločenstvách), texte publié", nature: "loi", annee: 2013, source: "https://static.slov-lex.sk/pdf/SK/ZZ/2013/97/ZZ_2013_97.pdf"}
  - {instrument: "Loi n° 97/2013 Z. z., version consolidée en vigueur depuis le 1er juin 2025 (modifiée par les lois n° 34/2014, 110/2018, 91/2020, 6/2022, 257/2022, 325/2022 et 81/2025 Z. z.)", nature: "loi", annee: 2025, source: "https://static.slov-lex.sk/static/SK/ZZ/2013/97/20250601.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "La communauté est une personne morale (loi 97/2013, § 3) ; ses organes sont l'assemblée de tous les membres, organe suprême réuni au moins une fois par an, un comité (výbor) exécutif et statutaire d'au moins trois membres et un conseil de surveillance (dozorná rada) d'au moins trois membres, élus pour cinq ans au plus (§ 13, § 14 al. 1 et 2, § 16, § 17, version de 2025) ; l'office de district exerce un contrôle de l'État (štátny dozor), notamment sur la tenue des listes, le respect du mandat des organes et la réunion annuelle de l'assemblée (§ 27) ; le Fonds foncier slovaque (Slovenský pozemkový fond) gère les parts de l'État et celles des propriétaires non identifiés et vote à leur place pour les décisions majeures (§ 9 al. 1, § 10).", source: "https://static.slov-lex.sk/static/SK/ZZ/2013/97/20250601.html"}
  pouvoir_normatif: {valeur: "partiel", note: "L'assemblée adopte le contrat de communauté et les statuts, qui règlent les droits et devoirs des membres et l'organisation interne, et décide du mode d'usage du bien commun (loi 97/2013, § 5 et § 14 al. 7 a, b et f) ; ces règles n'obligent que les membres et s'inscrivent dans le Code civil et les lois sectorielles.", source: "https://static.slov-lex.sk/static/SK/ZZ/2013/97/20250601.html"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le bien commun (spoločná nehnuteľnosť) forme une seule chose immobilière, détenue en copropriété par parts ; la loi de 2013 le déclarait indivisible et interdisait de dissoudre la copropriété selon le droit commun (§ 8 al. 1, texte de 2013) ; depuis la loi 110/2018, la copropriété peut être dissoute selon la loi 330/1991 sur le remembrement (§ 8 al. 1 et note 11) ; les parts restent cessibles, avec offre préalable aux autres copropriétaires (§ 9 al. 8), sans part inférieure à 2 000 m² (§ 2 al. 3).", source: "https://static.slov-lex.sk/static/SK/ZZ/2013/97/20250601.html"}
  ressources: {valeur: "partiel", note: "La communauté exerce la production agricole et gère les forêts et les plans d'eau du bien commun (loi 97/2013, § 19 al. 1), dans le respect des lois sur les forêts, l'eau et la protection de la nature (§ 19 al. 2) ; l'assemblée décide de la gestion et de l'usage du bien commun, approuve les comptes et répartit les bénéfices entre les membres (§ 14 al. 7 f, g et h, § 20).", source: "https://static.slov-lex.sk/static/SK/ZZ/2013/97/20250601.html"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
