resume: >-
  Les Afar sont un peuple pastoral de la dépression de l'Afar et de la vallée de l'Awash, répartis entre l'Éthiopie, Djibouti et l'Érythrée.
  En Éthiopie, ils forment une « nation, nationalité et peuple » au sens de la Constitution fédérale de 1994 et disposent d'un État régional, l'un des neuf États fondateurs de la fédération.
  L'État afar a son conseil et son gouvernement ; comme les autres nations de la fédération, les Afar ont un droit constitutionnel à l'autodétermination, sécession comprise (art. 39).
