reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme note la reconnaissance du droit des communautés ethniques et linguistiques à l'autodétermination au niveau de l'État régional (CCPR/C/ETH/CO/1, par. 26). Vise la catégorie, pas les Afar nommément.", annee: 2011, source: "https://docs.un.org/en/CCPR/C/ETH/CO/1"}
base_nationale:
  - {instrument: "Constitution de la République fédérale démocratique d'Éthiopie, art. 5, 34, 39, 40, 47, 50, 52, 61, 78 et 97", nature: "constitution", annee: 1994, source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Art. 39(3) : droit de chaque nation, nationalité et peuple à l'autogouvernement et à ses propres institutions ; art. 47(1) : l'État afar est l'un des États membres de la fédération.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  pouvoir_normatif: {valeur: "reconnu", note: "Art. 52(2) : les États exercent tous les pouvoirs non attribués à la fédération, dont l'adoption de leur constitution et de leurs lois.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  justice_propre: {valeur: "reconnu", note: "Art. 50(2) : les États détiennent le pouvoir judiciaire ; art. 78(5) : leurs conseils peuvent créer ou reconnaître des tribunaux religieux et coutumiers ; art. 34(5) : le statut personnel et familial peut être jugé selon le droit religieux ou coutumier avec l'accord des parties.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  terres: {valeur: "partiel", note: "Art. 40(3) : la propriété de la terre et des ressources naturelles appartient exclusivement à l'État et aux peuples d'Éthiopie, propriété commune inaliénable ; art. 40(5) : les éleveurs pastoraux ont droit à des terres de pâturage gratuites et à ne pas être déplacés de leurs terres ; art. 52(2)(d) : les États administrent la terre selon la loi fédérale.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  ressources: {valeur: "partiel", note: "Art. 52(2)(d) : les États administrent la terre et les autres ressources naturelles conformément aux lois fédérales.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  consentement: {valeur: "partiel", note: "Art. 43(2) de la Constitution fédérale : les nationaux ont le droit d'être consultés sur les politiques et projets qui touchent leur communauté ; aucune obligation de consentement.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  langue: {valeur: "reconnu", note: "Art. 5(3) de la Constitution de 1994 : chaque État membre fixe par la loi sa langue de travail ; art. 39(2) : droit de parler, écrire et développer sa langue. Le portail du gouvernement éthiopien indique que l'afar est la langue de travail de l'État régional ; le 29 février 2020, le Conseil des ministres a annoncé l'ajout de l'afar aux langues de travail fédérales.", source: "http://www.ethiopia.gov.et/afar-regional-state"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "Art. 97 : les États lèvent l'impôt sur le revenu des salariés de l'État et des entreprises privées, les redevances d'usufruit foncier et d'autres impôts.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  representation: {valeur: "reconnu", note: "Art. 61(2) : chaque nation, nationalité et peuple a au moins un siège à la Chambre de la Fédération, plus un par million d'habitants.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "reconnu", note: "Art. 39(1) et 39(4) : droit inconditionnel à l'autodétermination, y compris la sécession, par vote aux deux tiers du conseil législatif puis référendum organisé par l'État fédéral dans les trois ans. Jamais exercé.", source: "https://www.constituteproject.org/constitution/Ethiopia_1994?lang=en"}
effectivite: {valeur: "partielle", note: "Une étude juridique (Berihun Adugna Gebeye, Harvard, 2023) décrit l'Éthiopie comme une fédération centralisée : dépendance budgétaire des États envers l'État fédéral et centralisation accrue depuis la transformation de la coalition au pouvoir en parti unitaire, le Parti de la prospérité. Elle vise l'ensemble des États régionaux, pas l'État afar en particulier. La frontière avec l'État somali (voir la fiche « Somali d'Éthiopie ») reste un foyer de conflit armé (31 affrontements entre mai 2022 et avril 2024, cessez-le-feu du 18 avril 2024 ; note du ministère de l'Intérieur britannique, 2025).", source: "https://hrp.law.harvard.edu/wp-content/uploads/2023/02/pp.-157-190.pdf"}
chronologie:
  - {annee: 1994, evenement: "Adoption de la Constitution fédérale ; l'État afar figure parmi les neuf États membres (art. 47)."}
  - {annee: 2007, evenement: "Recensement national (novembre 2007 dans l'État afar) : 1 390 273 habitants recensés."}
  - {annee: 2019, evenement: "Transformation de la coalition au pouvoir (EPRDF) en parti unitaire, le Parti de la prospérité."}
  - {annee: 2020, evenement: "Le Conseil des ministres annonce l'ajout de l'afar, de l'oromo, du somali et du tigrinya aux langues de travail fédérales."}
  - {annee: 2024, evenement: "Cessez-le-feu du 18 avril entre les États afar et somali, après 31 affrontements armés recensés depuis mai 2022 ; nouveaux affrontements signalés en juin."}
  - {annee: 2026, evenement: "Élections générales du 1er juin : le Parti de la prospérité obtient 91,6 % des voix dans l'État afar."}
