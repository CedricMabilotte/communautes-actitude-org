reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "La Nouvelle-Zélande a annoncé son appui à la Déclaration en avril 2010 (A/HRC/18/35/Add.4) ; l'acte de règlement de 2020 reconnaît les Moriori comme tchakat henu (tangata whenua, peuple d'origine du lieu) de Rēkohu (clause 3.1) et les désigne comme waina pono (habitants d'origine) (clause 3.13). Le rapport du Rapporteur spécial ne nomme pas les Moriori.", annee: 2010, source: "https://documents.un.org/api/symbol/access?s=A/HRC/18/35/Add.4&l=fr&t=pdf"}
