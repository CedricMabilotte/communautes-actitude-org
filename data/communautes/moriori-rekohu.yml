effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante de l'application du règlement n'a été consultée. La réparation partagée (lagon Te Whanga, comité de planification commun auprès du conseil des îles Chatham, terres de l'école de Kaingaroa) reste soumise à une loi non adoptée ; l'acte du 16 septembre 2026 prend effet même si une seule des deux entités de gouvernance le signe.", source: "https://www.whakatau.govt.nz/assets/Treaty-Settlements/FIND_Treaty_Settlements/Rekohu-Wharekauri-Shared-Redress/Rekohu-Wharekauri-Shared-Redress-Deed-16-September-2026-v3.pdf"}
chronologie:
  - {annee: 1835, evenement: "Arrivée de Ngāti Mutunga et Ngāti Tama ; des Moriori sont tués et les survivants réduits en servitude."}
  - {annee: 1842, evenement: "Annexion des îles Chatham à la Nouvelle-Zélande."}
  - {annee: 1870, evenement: "La Cour des terres autochtones attribue moins de 3 % des terres aux Moriori."}
  - {annee: 2001, evenement: "Création de Hokotehi Moriori Trust pour représenter l'ensemble des Moriori."}
  - {annee: 2003, evenement: "La Couronne reconnaît le mandat de Hokotehi Moriori Trust pour négocier le règlement."}
  - {annee: 2017, evenement: "Accord de principe entre la Couronne et les Moriori (16 août)."}
  - {annee: 2020, evenement: "Signature de l'acte de règlement (14 février), avec excuses de la Couronne."}
  - {annee: 2021, evenement: "Adoption du Moriori Claims Settlement Act 2021 ; acte modificatif du règlement signé le 17 novembre."}
  - {annee: 2026, evenement: "Acte de réparation partagée Rēkohu Wharekauri signé le 16 septembre par la Couronne et au moins une entité de gouvernance, sous condition d'une loi."}
