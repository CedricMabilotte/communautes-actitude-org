droits:
  autogouvernement: {valeur: "partiel", note: "Le Moriori Imi Settlement Trust, entité de gouvernance post-règlement établie en décembre 2018 par Hokotehi Moriori Trust, reçoit et gère les biens du règlement pour l'ensemble des Moriori ; la Couronne reconnaît depuis novembre 2003 le mandat de Hokotehi Moriori Trust pour représenter les Moriori. Ces entités n'exercent pas de pouvoirs de puissance publique.", source: "https://www.whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/moriori"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Huit sites, surtout sur l'île Pitt, sont transférés en pleine propriété à l'entité de gouvernance moriori, plusieurs sous statut de réserve (acte de règlement de 2020, clause 5.13) ; un droit de préemption partagé avec Ngāti Mutunga o Wharekauri, d'une durée de 179 ans, porte sur les terres de la Couronne des îles Chatham (clauses 6.8 et 6.9).", source: "https://www.whakatau.govt.nz/assets/Treaty-Settlements/FIND_Treaty_Settlements/Moriori/DOS_documents/1.-Moriori-Deed-of-Settlement-Historical-Claims.pdf"}
  ressources: {valeur: "partiel", note: "L'acte de 2020 prévoit l'élaboration de règlements de pêche coutumière non commerciale pour la zone Rēkohu / Wharekauri, avec des t'chieki (gardiens) nommés par l'entité moriori et Ngāti Mutunga o Wharekauri, et un droit de préemption sur des quotas de pêche (clauses 5.42 à 5.45 et 5.51) ; l'adoption de ces règlements n'a pas été vérifiée.", source: "https://www.whakatau.govt.nz/assets/Treaty-Settlements/FIND_Treaty_Settlements/Moriori/DOS_documents/1.-Moriori-Deed-of-Settlement-Historical-Claims.pdf"}
  consentement: {valeur: "partiel", note: "Des reconnaissances statutaires (statutory acknowledgements) renforcent la participation des Moriori aux procédures de gestion des ressources ; des actes de reconnaissance obligent la Couronne à les consulter sur certains sites ; des protocoles fixent la consultation par plusieurs ministères (acte de règlement de 2020).", source: "https://www.whakatau.govt.nz/te-tira-kurapounamu-treaty-settlements/find-a-treaty-settlement/moriori"}
