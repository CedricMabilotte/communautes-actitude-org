resume: >-
  Les Moriori sont les premiers habitants de Rēkohu (îles Chatham), arrivés entre 1000 et 1400 de notre ère. Après l'invasion de 1835, leur réduction en servitude et l'attribution de plus de 97 % des terres à d'autres groupes par la Cour des terres autochtones en 1870, ils ont été présentés à tort comme éteints. L'acte de règlement signé avec la Couronne le 14 février 2020, mis en œuvre par le Moriori Claims Settlement Act 2021, reconnaît les Moriori comme imi (peuple) et tchakat henu (peuple d'origine du lieu), contient des excuses de la Couronne, transfère huit sites et 18 millions de dollars néo-zélandais et crée un droit de préemption partagé. Le Moriori Imi Settlement Trust reçoit les biens du règlement ; Hokotehi Moriori Trust est l'organisation iwi mandatée pour les pêcheries et l'autorité iwi au titre de la loi sur la gestion des ressources de 1991. Un acte distinct de réparation partagée avec Ngāti Mutunga o Wharekauri, signé le 16 septembre 2026 par la Couronne et au moins une des deux entités de gouvernance, prévoit le transfert du lit du lagon Te Whanga et un comité de planification commun ; il dépend d'une loi encore à adopter.
