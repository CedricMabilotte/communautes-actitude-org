  verifie: ["Contenu de l'acte de règlement de 2020 : reconnaissance (clause 3.1), excuses (clauses 3.13 à 3.21), transfert des sites (5.13), pêche coutumière (5.42 à 5.45), droit de préemption partagé de 179 ans (6.8 et 6.9) ; création de Hokotehi Moriori Trust en 2001 (clause 1.102).", "Résumé officiel du règlement : huit sites transférés, 18 millions de dollars, reconnaissances statutaires, protocoles (Te Tari Whakatau).", "Statuts de Hokotehi Moriori Trust au titre du Māori Fisheries Act 2004 et du Resource Management Act 1991 (Te Kāhui Māngai).", "Acte de réparation partagée du 16 septembre 2026 : lagon Te Whanga, conseil de gestion, comité de planification commun de huit membres dont deux nommés par l'entité moriori."]
