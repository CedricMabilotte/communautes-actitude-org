resume: >-
  Les îles Åland forment une province autonome suédophone de la Finlande. Le Conseil de la Société des Nations a attribué l'archipel à la Finlande en 1921 avec des garanties d'autonomie et de démilitarisation. Le régime actuel repose sur la Loi sur l'autonomie d'Åland de 1991, en vigueur depuis le 1er janvier 1993, et sur l'article 120 de la Constitution finlandaise. L'archipel dispose d'un parlement (Lagting) et d'un gouvernement (Landskapsregering) propres et d'un droit de domicile régional ; le suédois y est la seule langue officielle.
reconnaissance_regionale:
  - {mecanisme: "union_europeenne", detail: "Protocole n° 2 de l'acte d'adhésion de la Finlande à l'Union européenne (1994) : les restrictions à l'acquisition d'immeubles et au droit d'établissement pour les personnes sans droit de domicile régional (hembygdsrätt) en vigueur au 1er janvier 1994 restent applicables ; l'archipel est exclu de l'harmonisation de la fiscalité indirecte.", annee: 1994, source: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:11994N/PRO/02"}
reconnaissance_onu:
  - {mecanisme: "accord_sous_egide", detail: "Décision du Conseil de la Société des Nations de 1921 attribuant les îles à la Finlande avec un statut autonome et démilitarisé ; l'Office des Nations unies à Genève la présente comme un règlement de différend par une organisation internationale.", annee: 1921, source: "https://www.ungeneva.org/en/about/director-general/kassym-jomart-tokayev/activities/2011/06/aland-islands-solution-precedent"}
  - {mecanisme: "accord_sous_egide", detail: "Une traduction anglaise de la Loi sur l'autonomie d'Åland, à jour en 2004, figure dans la base UN Peacemaker des accords de paix.", annee: 1991, source: "https://peacemaker.un.org/sites/default/files/document/files/2024/05/fi20se930101act20on20the20autonomy20of20aland.pdf"}
base_nationale:
  - {instrument: "Constitution de la Finlande (731/1999), art. 25, 75 et 120", nature: "constitution", annee: 1999, source: "https://www.constituteproject.org/constitution/Finland_2011"}
  - {instrument: "Loi sur l'autonomie d'Åland (1144/1991), chapitre financier révisé par la loi 98/2020, en vigueur le 1er janvier 2021", nature: "statut_autonomie", annee: 1991, source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  - {instrument: "Loi (2021:22) portant le taux de péréquation à 0,47 % (FFS 911/2020)", nature: "loi", annee: 2020, source: "https://www.regeringen.ax/alandsk-lagstiftning/alex/202122"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Parlement d'Åland (Lagting) élu au suffrage direct et secret, et gouvernement d'Åland (Landskapsregering), Loi sur l'autonomie de 1991, art. 13 à 16 ; la Constitution, art. 120, garantit l'autonomie de l'archipel.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le Parlement d'Åland adopte des lois provinciales (landskapslagar) dans les domaines énumérés à l'article 18 de la Loi de 1991 : administration municipale, enseignement, santé, urbanisme, agriculture, environnement, notamment ; le président de la République peut y opposer son veto pour excès de compétence ou atteinte à la sûreté de l'État, art. 19.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'acquisition d'immeubles par des personnes sans droit de domicile régional est restreinte par la loi sur l'acquisition de terres d'Åland (jordförvärvslag), Loi de 1991, art. 10 ; il s'agit d'un contrôle des acquisitions, non d'une propriété collective.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  ressources: {valeur: "partiel", note: "Agriculture, sylviculture, chasse, pêche, eaux et droit de prospecter et d'exploiter les gisements minéraux relèvent de la compétence législative d'Åland, Loi de 1991, art. 18.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  consentement: {valeur: "reconnu", note: "Une clause d'un traité qui touche aux compétences d'Åland n'y entre en vigueur qu'avec l'accord du Parlement d'Åland, Loi de 1991, art. 59 ; la loi ne peut être modifiée qu'avec l'accord du Parlement d'Åland à la majorité des deux tiers, art. 69.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  langue: {valeur: "reconnu", note: "La province est unilingue suédoise ; le suédois est la langue de l'administration de l'État, de la province et des communes, Loi de 1991, art. 36 ; les échanges écrits entre les autorités d'Åland et celles de l'État se font en suédois, art. 38.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  education: {valeur: "reconnu", note: "L'enseignement relève de la compétence d'Åland, Loi de 1991, art. 18 ; la langue d'enseignement des écoles financées par des fonds publics est le suédois, sauf disposition contraire d'une loi d'Åland, art. 40.", source: "https://webassets.eurac.edu/31538/1667555048-aland-islands-2019.pdf"}
  fiscalite: {valeur: "partiel", note: "Åland vote son budget, art. 44 ; depuis 2021, l'État lui reverse chaque année un montant de péréquation calculé sur ses recettes (taux de 0,47 % fixé par une loi dérogatoire de 2020) et le produit des impôts d'État sur le revenu, le capital et les sociétés perçus sur Åland, art. 45 à 49 ; Åland peut lever un impôt additionnel sur le revenu et des taxes propres, art. 18, mais l'essentiel de la législation fiscale reste à l'État.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  representation: {valeur: "reconnu", note: "Les îles Åland forment une circonscription qui élit un député au Parlement finlandais, Constitution, art. 25.", source: "https://www.constituteproject.org/constitution/Finland_2011"}
  statut_personnel: {valeur: "reconnu", note: "Droit de domicile régional (hembygdsrätt), requis pour voter et être élu au Parlement d'Åland et aux conseils municipaux, Loi de 1991, art. 6 à 9 ; ses titulaires arrivés dans l'archipel avant 12 ans peuvent remplacer le service militaire par un service civil et en sont exemptés tant que ce service n'est pas organisé, art. 12.", source: "https://www.finlex.fi/sv/lagstiftning/1991/1144"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "Une étude d'Eurac Research (2019) décrit une autonomie en fonctionnement depuis 1921, contrôlée par le président de la République, la Cour suprême et la Délégation d'Åland (organe paritaire) ; elle relève des débats sur la compatibilité de la garantie scolaire en suédois avec la convention de l'UNESCO de 1960 et des restrictions foncières et commerciales avec le droit de l'Union européenne.", source: "https://webassets.eurac.edu/31538/1667555048-aland-islands-2019.pdf"}
chronologie:
  - {annee: 1921, evenement: "Le Conseil de la Société des Nations attribue les îles à la Finlande avec garanties d'autonomie et démilitarisation."}
  - {annee: 1951, evenement: "Deuxième loi sur l'autonomie."}
  - {annee: 1991, evenement: "Adoption de la troisième loi sur l'autonomie (1144/1991), en vigueur le 1er janvier 1993."}
  - {annee: 1995, evenement: "Adhésion de la Finlande à l'Union européenne avec un protocole propre à Åland (protocole n° 2 de l'acte d'adhésion de 1994)."}
  - {annee: 2021, evenement: "Entrée en vigueur du nouveau système de financement (loi 98/2020) et du taux de péréquation de 0,47 %."}
  - {annee: 2025, evenement: "Le ministère de la Justice installe un groupe de travail chargé de préparer une nouvelle loi sur l'autonomie (mandat du 3 février 2025 au 31 janvier 2026)."}
  - {annee: 2026, evenement: "Le projet de quatrième loi sur l'autonomie est soumis à consultation du 12 mai au 4 août 2026 ; entrée en vigueur envisagée au 1er janvier 2028, sous réserve de l'accord du Parlement d'Åland."}
fiabilite:
  verifie: ["Loi sur l'autonomie de 1991, texte suédois consolidé (Finlex), art. 6 à 13, 18, 19, 36, 38, 44 à 49, 59 et 69, dont le chapitre financier révisé par la loi 98/2020.", "Taux de péréquation de 0,47 % depuis 2021, loi 2021:22 (Ålex, gouvernement d'Åland) ; le texte consolidé de Finlex affiche encore 0,45 % à l'art. 47, la loi de 2020 y dérogeant.", "Constitution de la Finlande, art. 25, 75 et 120 (Constitute Project).", "Protocole n° 2 de l'acte d'adhésion de 1994 (EUR-Lex).", "Population de 30 836 habitants au 31 décembre 2025, 16 communes et 1 556 km² de terres (ÅSUB, Åland in Figures 2026) ; population provisoire de 30 938 au 31 août 2026 (ÅSUB).", "185 villages habités dans les communes rurales et 60 dans l'archipel au 31 décembre 2024 (ÅSUB).", "Projet de nouvelle loi sur l'autonomie : consultation du 12 mai au 4 août 2026, entrée en vigueur envisagée au 1er janvier 2028 (ministère de la Justice)."]
  non_confirme: ["La traduction anglaise de UN Peacemaker est à jour en 2004 et ne reflète pas le chapitre financier révisé en 2021.", "Le dépôt du projet de nouvelle loi au Parlement finlandais, annoncé pour la fin de 2026, n'a pas été vérifié.", "Aucune source indépendante postérieure à 2019 sur l'effectivité n'a été consultée ; le sixième avis du Comité consultatif de la Convention-cadre sur la Finlande (2025) ne mentionne pas Åland."]
