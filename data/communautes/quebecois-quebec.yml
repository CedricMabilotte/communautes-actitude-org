resume: >-
  Depuis 2022, la Loi constitutionnelle de 1867 contient deux articles ajoutés par une loi québécoise : « Les Québécoises et les Québécois forment une nation » et « Le français est la seule langue officielle du Québec » (art. 90Q.1 et 90Q.2). La nation exerce son autogouvernement par l'Assemblée nationale et le gouvernement du Québec, dans le partage des compétences de la fédération canadienne. Dans le Renvoi relatif à la sécession du Québec (avis rendu en 1998 par la Cour suprême à la demande du gouvernement fédéral), la Cour a jugé que ni la Constitution ni le droit international ne donnent au Québec un droit de sécession unilatérale, mais qu'une majorité claire en réponse à une question claire obligerait les autres parties de la fédération à négocier. La Loi 99 de 2000 affirme le droit du peuple québécois à disposer de lui-même ; la Loi sur la clarté de 2000 encadre, au niveau fédéral, l'examen de la question et de la majorité.
