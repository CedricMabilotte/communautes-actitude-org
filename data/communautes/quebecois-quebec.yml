droits:
  autogouvernement: {valeur: "reconnu", note: "Législature du Québec instituée par la Loi constitutionnelle de 1867, art. 71 ; depuis la loi québécoise de 1968 (S.Q. 1968, ch. 9), elle se compose du lieutenant-gouverneur et de l'Assemblée nationale.", source: "https://laws-lois.justice.gc.ca/fra/const/page-2.html"}
  pouvoir_normatif: {valeur: "reconnu", note: "La législature a une compétence législative exclusive sur les matières de l'art. 92 de la Loi constitutionnelle de 1867, dont « la propriété et les droits civils dans la province » (par. 13), base du droit civil québécois.", source: "https://laws-lois.justice.gc.ca/fra/const/page-3.html"}
  justice_propre: {valeur: "partiel", note: "La province légifère sur l'administration de la justice et l'organisation des tribunaux, Loi constitutionnelle de 1867, art. 92 par. 14 ; les juges des cours supérieures sont nommés par le gouverneur général, art. 96.", source: "https://laws-lois.justice.gc.ca/fra/const/page-3.html"}
  terres: {valeur: "partiel", note: "Les terres, mines et minéraux appartenant à la province lors de l'union lui appartiennent, Loi constitutionnelle de 1867, art. 109 ; la province administre et vend les terres publiques, art. 92 par. 5 ; il s'agit d'une propriété de l'État provincial, pas d'un titre collectif.", source: "https://laws-lois.justice.gc.ca/fra/const/page-3.html"}
  ressources: {valeur: "partiel", note: "Compétence exclusive sur la prospection, l'exploitation et la gestion des ressources naturelles non renouvelables, des ressources forestières et de la production d'énergie électrique, Loi constitutionnelle de 1867, art. 92A (1) ; les pêcheries des côtes de la mer et de l'intérieur relèvent du Parlement fédéral, art. 91, par. 12, et la loi fédérale l'emporte sur la loi provinciale en matière d'exportation de ces ressources, art. 92A (3) ; la pêche restant fédérale, la valeur est « partiel ».", source: "https://laws-lois.justice.gc.ca/fra/const/page-3.html"}
  consentement: {valeur: "reconnu", note: "Les dispositions de la Constitution du Canada applicables à certaines provinces seulement ne peuvent être modifiées qu'avec une résolution de l'assemblée législative de chaque province concernée, Loi constitutionnelle de 1982, art. 43 ; une modification qui déroge aux compétences provinciales est sans effet dans une province dont l'assemblée a exprimé son désaccord, art. 38 (3) ; un ministre fédéral ne peut déposer une résolution de modification relevant de la formule générale sans le consentement préalable d'une majorité de provinces comprenant le Québec, Loi concernant les modifications constitutionnelles (1996), art. 1.", source: "https://laws-lois.justice.gc.ca/fra/const/page-13.html"}
  langue: {valeur: "reconnu", note: "« Le français est la seule langue officielle du Québec. Il est aussi la langue commune de la nation québécoise », Loi constitutionnelle de 1867, art. 90Q.2 (2022) ; Charte de la langue française, art. 1.", source: "https://laws-lois.justice.gc.ca/fra/const/page-2.html"}
  education: {valeur: "reconnu", note: "Compétence législative exclusive sur l'éducation, Loi constitutionnelle de 1867, art. 93 ; les garanties confessionnelles des par. (1) à (4) ne s'appliquent plus au Québec depuis 1997, art. 93A.", source: "https://laws-lois.justice.gc.ca/fra/const/page-3.html"}
  fiscalite: {valeur: "reconnu", note: "La législature peut lever des impôts directs dans la province pour des objets provinciaux et emprunter sur le crédit de la province, Loi constitutionnelle de 1867, art. 92 par. 2 et 3.", source: "https://laws-lois.justice.gc.ca/fra/const/page-3.html"}
  representation: {valeur: "reconnu", note: "Le Québec forme une des quatre divisions du Sénat, avec 24 sénateurs, Loi constitutionnelle de 1867, art. 22 ; au moins trois des juges de la Cour suprême sont choisis parmi les juges ou les avocats du Québec, Loi sur la Cour suprême, art. 6.", source: "https://laws-lois.justice.gc.ca/fra/const/page-1.html"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "partiel", note: "La Cour suprême (1998) exclut un droit de sécession unilatérale mais juge qu'une majorité claire en réponse à une question claire ferait naître l'obligation de négocier ; la Loi 99 (2000), art. 1 à 4, affirme ce droit et fixe la majorité à 50 % des votes valides plus un ; la Loi sur la clarté (2000) confie à la Chambre des communes l'examen de la question et de la majorité.", source: "https://juricaf.org/arret/CANADA-COURSUPREME-19980820-19982RCS217"}
effectivite: {valeur: "effective", note: "Les institutions du Québec exercent leurs compétences ; en avril 2021, la Cour d'appel du Québec a rejeté l'appel visant six articles de la Loi 99, dont la règle des 50 % plus un, tout en retirant du jugement de première instance le paragraphe qui déclarait ces articles conformes à la Constitution, selon Le Devoir.", source: "https://www.ledevoir.com/politique/quebec/598542/la-loi-99-sur-l-autodetermination-du-quebec-validee-par-la-cour-d-appel"}
