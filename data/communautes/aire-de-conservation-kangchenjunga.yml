resume: >-
  L'aire de conservation du Kangchenjunga couvre 2 035 km² au pied du Kangchenjunga, dans le nord du district de Taplejung, à la frontière de la Chine et de l'Inde. L'État l'a créée en 1997 en application de la loi de 1973 sur les parcs nationaux et la conservation de la faune. Le 22 septembre 2006, le ministère des Forêts et de la Conservation des sols a remis la gestion de l'aire au Kangchenjunga Conservation Area Management Council (conseil de gestion de l'aire), formé de représentants des comités et groupes d'usagers locaux. Le plan de gestion préparé par ce conseil avait été approuvé par le conseil des ministres le 31 août 2006.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Stratégie et plan d'action nationaux pour la biodiversité 2014-2020, transmis au secrétariat de la Convention sur la diversité biologique (p. 45) : le gouvernement a remis en 2006 la gestion de l'aire de conservation du Kangchenjunga au conseil local de gestion, première aire protégée du pays gérée par des communautés locales.", annee: 2014, source: "https://www.cbd.int/doc/world/np/np-nbsap-v2-en.pdf"}
base_nationale:
  - {instrument: "National Parks and Wildlife Conservation Act, 2029 (1973), section 3 (déclaration des aires de conservation) et section 16B (gestion d'une aire de conservation confiée à une institution)", nature: "loi", annee: 1973, source: "https://faolex.fao.org/docs/pdf/nep187181.pdf"}
  - {instrument: "Conservation Area Government Management Regulation, 2057 (2000) (règlement sur la gestion des aires de conservation par l'État)", nature: "loi", annee: 2000, source: "https://satoyamainitiative.org/case_studies/observation-of-functioning-of-kanchenjunga-conservation-area-kca-the-regions-first-community-owned-conservation-area/"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le 22 septembre 2006, le ministre d'État aux Forêts et à la Conservation des sols a remis au président du Kangchenjunga Conservation Area Management Council (conseil de gestion de l'aire) un certificat d'autorité pour la gestion de l'aire ; formé en 2000, le conseil réunit des représentants des 7 comités d'usagers de l'aire, de 44 groupes d'usagers et de 32 groupes de mères ; il agit dans le cadre d'un plan de gestion approuvé par le conseil des ministres le 31 août 2006.", source: "https://satoyamainitiative.org/case_studies/observation-of-functioning-of-kanchenjunga-conservation-area-kca-the-regions-first-community-owned-conservation-area/"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le transfert de 2006 confie aux habitants la responsabilité de gestion de l'ensemble de l'aire protégée (2 035 km²), dont les terres et les ressources avaient été placées sous statut d'aire protégée par l'État ; il porte sur la gestion, non sur la propriété, et s'exerce selon le plan de gestion approuvé par le conseil des ministres (31 août 2006).", source: "https://satoyamainitiative.org/case_studies/observation-of-functioning-of-kanchenjunga-conservation-area-kca-the-regions-first-community-owned-conservation-area/"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
