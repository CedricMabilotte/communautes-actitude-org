effectivite: {valeur: "partielle", note: "En 2012, une étude de Wildlife Watch Group publiée par l'IPSI (Université des Nations unies) rapporte que, selon des habitants, les activités de l'aire se limitent à quelques villages et que beaucoup de villages n'ont pas de règles claires de gestion forestière.", source: "https://satoyamainitiative.org/case_studies/observation-of-functioning-of-kanchenjunga-conservation-area-kca-the-regions-first-community-owned-conservation-area/"}
chronologie:
  - {annee: 1973, evenement: "Loi sur les parcs nationaux et la conservation de la faune."}
  - {annee: 1997, evenement: "Création de l'aire de conservation du Kangchenjunga (2054 du calendrier népalais)."}
  - {annee: 1998, evenement: "Le Département des parcs nationaux lance avec le WWF Népal le projet de l'aire de conservation (22 mars)."}
  - {annee: 2000, evenement: "Règlement sur la gestion des aires de conservation par l'État ; l'aire passe de 1 659 à 2 035 km² ; formation du conseil de gestion."}
  - {annee: 2004, evenement: "Le conseil de gestion remet au Département des parcs nationaux son projet de plan de gestion (juillet)."}
  - {annee: 2006, evenement: "Le conseil des ministres approuve le plan de gestion (31 août) ; la gestion de l'aire est remise au conseil de gestion (22 septembre)."}
  - {annee: 2020, evenement: "Un rapport SIG remis au Département des parcs nationaux situe l'aire dans les municipalités rurales de Phaktanglung et de Sirijangha."}
fiabilite:
  verifie:
    - "Date de création (2054, soit 1997), superficie de 2 035 km² et transfert de la gestion au conseil le 2063 Asoj 6 (22 septembre 2006), sur la page officielle du bureau de l'aire (Département des parcs nationaux), qui présente l'aire comme gérée par les communautés locales."
    - "Section 16B de la loi de 1973 (version consolidée de la Commission du droit du Népal) : le gouvernement peut confier, par avis publié au journal officiel, la gestion d'une aire de conservation à une institution créée pour la conservation de la nature, pour la durée fixée dans l'avis."
    - "Mention du transfert de 2006 dans la stratégie nationale pour la biodiversité 2014-2020 transmise à la Convention sur la diversité biologique."
    - "Répartition de l'aire en quatre wards de Phaktanglung et Sirijangha, dans le rapport SIG remis au Département des parcs nationaux en 2020."
  non_confirme:
    - "Le texte du règlement de 2000 sur la gestion des aires de conservation par l'État n'a pas été consulté : les pouvoirs exacts du conseil (prélèvements, redevances, part des recettes, tutelle) restent à établir ; le règlement de 1996 sur les aires de conservation confiées à une institution ne s'applique pas forcément à cette aire."
    - "La base légale exacte du transfert de 2006 (section 16B de la loi de 1973 ou règlement de 2000) n'a pas été confirmée sur un texte."
    - "Population de 5 254 habitants tirée d'une étude d'ONG de 2012, sans recensement officiel par aire ; composition du conseil donnée de façon variable (44 ou 81 groupes d'usagers)."
    - "Le statut actuel du conseil après la réorganisation fédérale de 2017 (remplacement des VDC par des municipalités rurales), la durée fixée pour le transfert et son éventuel renouvellement n'ont pas été vérifiés sur un texte."
    - "Nombre de villages : non trouvé ; l'étude publiée par l'IPSI (2012) compte quatre VDC et 968 ménages sans dénombrer les villages."
