resume: >-
  Le Gaeltacht désigne les zones de l'Irlande où l'irlandais est, ou était jusqu'à une date récente, la langue parlée par la majorité de la communauté ; ses limites ont été fixées par arrêtés du gouvernement de 1956 à 1982, abrogés en 2012, les zones étant maintenues par le Gaeltacht Act 2012, s. 7 (1). Le Gaeltacht Act 2012 (loi de 2012 sur le Gaeltacht, s. 7 et 8) permet au ministre de désigner des aires de planification linguistique (Gaeltacht Language Planning Areas) : une organisation locale, choisie par Údarás na Gaeltachta, l'agence publique de développement du Gaeltacht, prépare un plan linguistique en irlandais, le fait approuver par le ministre puis le met en œuvre. Le ministre contrôle la mise en œuvre et peut retirer la désignation si le plan n'est pas appliqué. Údarás na Gaeltachta recense 26 aires dans 7 comtés, toutes dotées d'un plan approuvé.
