resume: >-
  En Navarre, la loi forale 6/1990 du 2 juillet, de l'administration locale, reconnaît comme entités locales, à côté des communes, les concejos et les corporations traditionnelles titulaires ou gestionnaires de biens communaux. Un concejo est une entité dotée de la personnalité juridique, située dans le territoire d'une commune, qui administre son patrimoine et les bienes comunales (biens communaux, dont la jouissance revient à l'ensemble des habitants). Il est gouverné par un président et une junta (conseil) élus, ou par un concejo abierto (assemblée de tous les habitants inscrits) quand il compte moins de 50 habitants. La loi nomme cinq corporations traditionnelles : la Communauté des Bardenas Reales, la Communauté de la vallée d'Aezkoa, la Mancomunidad (groupement) de la vallée de Roncal, l'Universidad (corporation) de la vallée de Salazar et l'Union d'Aralar, régies par leurs propres règlements, ordonnances et concordes.
