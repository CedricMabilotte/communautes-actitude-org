effectivite: {valeur: "partielle", note: "Le Comité des droits de l'homme relève en 2023 des restrictions à la construction et au fonctionnement des lieux de culte et des violences confessionnelles commises dans l'impunité. Selon Minority Rights Group, 3 804 églises et bâtiments avaient été régularisés sur 5 415 demandes en avril 2026, et des églises non autorisées restent fermées. Selon le Département d'État des États-Unis, le projet de loi sur le statut personnel des chrétiens, achevé fin 2021, n'avait pas été transmis au Parlement à fin 2023.", source: "https://docs.un.org/en/CCPR/C/EGY/CO/5"}
chronologie:
  - {annee: 1874, evenement: "Création du Conseil communautaire copte (Majlis al-Milli), conseil de laïcs chargé de représenter la communauté."}
  - {annee: 2014, evenement: "Constitution : art. 3 (statut personnel et affaires religieuses des chrétiens), art. 235 (loi sur la construction des églises), art. 244 (représentation des chrétiens)."}
  - {annee: 2015, evenement: "Élections législatives : 36 députés coptes élus, soit 6 % des sièges."}
  - {annee: 2016, evenement: "Loi d'août 2016 sur la construction et la rénovation des églises ; les permis relèvent des gouverneurs."}
  - {annee: 2019, evenement: "Révision de la Constitution."}
  - {annee: 2023, evenement: "Observations finales du Comité des droits de l'homme nommant les chrétiens coptes parmi les minorités religieuses discriminées."}
  - {annee: 2026, evenement: "En avril, 3 804 églises et bâtiments de service régularisés sur 5 415 demandes."}
