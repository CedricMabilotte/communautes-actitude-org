  statut_personnel: {valeur: "partiel", note: "Constitution de 2014, art. 3 : statut personnel régi par les principes des lois des chrétiens ; la charia (droit islamique) s'applique lorsqu'un des conjoints est musulman et aux couples chrétiens de confessions différentes. Le régime se limite au statut personnel ; il ne crée ni nationalité ni droit de résidence propres.", source: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/egypt/"}
