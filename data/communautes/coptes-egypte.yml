  pouvoir_normatif: {valeur: "partiel", note: "Constitution de 2014, art. 3 : les principes des lois des chrétiens sont la source principale de leur statut personnel ; lorsque les deux époux appartiennent à la même confession, les tribunaux appliquent le droit canonique de cette confession.", source: "https://www.state.gov/reports/2023-report-on-international-religious-freedom/egypt/"}
