resume: >-
  Les Coptes sont les chrétiens d'Égypte ; plus de 90 % des chrétiens du pays appartiennent à l'Église copte orthodoxe.
  La Constitution de 2014, révisée en 2019, fait des principes des lois des chrétiens et des juifs d'Égypte la source principale des lois qui régissent leur statut personnel (mariage, divorce, filiation), leurs affaires religieuses et le choix de leurs chefs spirituels (art. 3).
  Les tribunaux de l'État appliquent le droit canonique de la confession lorsque les deux époux en relèvent.
  Une loi de 2016 encadre la construction et la régularisation des églises, et la loi électorale réserve des sièges à des candidats chrétiens à la Chambre des représentants.
