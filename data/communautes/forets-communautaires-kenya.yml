resume: >-
  Fiche agrégée : elle couvre les deux régimes de la loi kényane n° 34 de 2016 sur la conservation et la gestion des forêts (Forest Conservation and Management Act). Le premier est la forêt communautaire : forêt située sur une terre communautaire, sur des terres ancestrales ou sur des terres occupées traditionnellement par des communautés de chasseurs-cueilleurs (s. 30 (3)), dévolue à la communauté et enregistrée par le Service forestier du Kenya (Kenya Forest Service) (s. 32). Le second est l'association forestière communautaire (community forest association) : des membres d'une communauté forestière et des habitants de la même zone, enregistrés comme association, qui obtiennent du Service la permission de participer à la gestion d'une forêt publique par un accord de gestion conférant des droits d'usage (s. 48 et 49). En août 2026, la ministre de l'Environnement comptait 233 associations enregistrées et 197 plans de gestion participative approuvés.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Cinquième rapport national du Kenya à la Convention sur la diversité biologique (2015) : la gestion participative des forêts (Participatory Forest Management) et le programme PELIS du Service forestier du Kenya donnent aux communautés dépendantes de la forêt un accès aux ressources (apiculture, écotourisme) ; le sigle « CFAs » (associations forestières communautaires, sigle non développé dans le rapport) figure dans le bilan de l'objectif d'Aichi 1, les plans de gestion participative des forêts dans celui de l'objectif 7.", annee: 2015, source: "https://www.cbd.int/doc/world/ke/ke-nr-05-en.pdf"}
base_nationale:
  - {instrument: "Forest Conservation and Management Act (loi sur la conservation et la gestion des forêts) n° 34 de 2016, sanctionnée le 31 août 2016, version au 31 décembre 2022 ; s. 2, 9, 20, 30, 32, 39, 47 à 52", nature: "loi", annee: 2016, source: "https://new.kenyalaw.org/akn/ke/act/2016/34/eng@2022-12-31"}
  - {instrument: "Forests (Participation in Sustainable Forest Management) Rules (règlement sur la participation à la gestion durable des forêts) de 2009, maintenu en vigueur par les dispositions transitoires de la loi de 2016 ; son abrogation est prévue par un projet de règlement de 2025", nature: "loi", annee: 2009, source: "https://forestry.go.ke/sites/default/files/2026-02/Participation%20in%20Forest%20Management_0.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Les membres d'une communauté forestière enregistrent une association forestière communautaire selon la loi sur les associations (Societies Act) (s. 48 (1) de la loi de 2016) ; sa demande au Service forestier joint ses statuts, ses règles financières et la liste de ses membres (s. 48 (3)) ; le Service accorde la permission de participer à la gestion d'une forêt publique aux conditions qu'il fixe (s. 48 (4)) ; le conservateur en chef des forêts peut résilier l'accord ou retirer un droit d'usage, avec recours de l'association devant le conseil du Service (s. 51). Pour une forêt communautaire, le gestionnaire est la personne chargée de la terre communautaire selon la loi applicable (s. 2, définition de forest manager).", source: "https://new.kenyalaw.org/akn/ke/act/2016/34/eng@2022-12-31"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les forêts communautaires sont dévolues à la communauté, sous réserve des droits d'usage accordés à des tiers (s. 32 (1) de la loi de 2016) ; elles comprennent les forêts sur terres enregistrées au nom de représentants de groupe, sur terres communautaires, sur terres ancestrales et terres occupées traditionnellement par des communautés de chasseurs-cueilleurs (s. 30 (3)). Chaque forêt communautaire est enregistrée par le Service forestier selon un règlement (s. 32 (2)) ; le ministre peut déclarer une forêt communautaire réserve naturelle, avec indemnisation du propriétaire (s. 39). Les forêts publiques cogérées par les associations restent dévolues au Service (s. 31).", source: "https://new.kenyalaw.org/akn/ke/act/2016/34/eng@2022-12-31"}
  ressources: {valeur: "partiel", note: "L'accord de gestion entre le Service et l'association confère tout ou partie d'une liste de droits d'usage, dont : plantes médicinales, miel, bois d'œuvre ou de feu, herbe et pâturage, produits pour les industries communautaires, écotourisme, activités scientifiques et éducatives, plantations, industries forestières communautaires (s. 49 (2) de la loi de 2016) ; ces activités ne doivent pas nuire à la biodiversité et suivent les règles que le conservateur en chef des forêts peut fixer en concertation avec l'association (s. 49 (3)). Les membres d'une communauté forestière gardent leurs droits coutumiers de prélèvement hors vente (s. 52).", source: "https://new.kenyalaw.org/akn/ke/act/2016/34/eng@2022-12-31"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_applicable", note: "", source: ""}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Le conseil d'administration du Service forestier comprend un membre nommé sur proposition d'un organe national représentant les associations forestières communautaires (s. 9 (1) (g) (ii) de la loi de 2016) ; chaque comité de conservation forestière comprend un membre proposé par les associations de la zone (s. 20 (4) (d) (i)). Le conseil dirige le Service (s. 9 (1)) ; les comités adressent des recommandations au conseil et au comté (s. 20 (3)).", source: "https://new.kenyalaw.org/akn/ke/act/2016/34/eng@2022-12-31"}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de trois associations du bloc forestier de Transmara, dans le complexe de Mau (Nairotia, Nyangores, Olenguruone), publiée en 2024 constate des écarts de mise en œuvre de la gestion participative selon les associations ; les membres citent souvent l'absence de cadre de partage des bénéfices comme frein ; en 2026, environ 80 % des 233 associations enregistrées étaient actives selon la ministre de l'Environnement.", source: "https://journals.eanso.org/index.php/eajfa/article/view/2453"}
chronologie:
  - {annee: 2009, evenement: "Règlement sur la participation à la gestion durable des forêts, pris sous la loi forestière de 2005."}
  - {annee: 2015, evenement: "Le cinquième rapport national du Kenya à la Convention sur la diversité biologique cite la gestion participative des forêts et les associations forestières communautaires."}
  - {annee: 2016, evenement: "Sanction, le 31 août, de la loi n° 34 sur la conservation et la gestion des forêts, qui abroge la loi forestière de 2005 et crée la catégorie des forêts communautaires dévolues aux communautés."}
  - {annee: 2026, evenement: "Le ministère de l'Environnement met en ligne un projet de règlement daté de 2025 sur la participation à la gestion durable des forêts, qui abrogerait le règlement de 2009 (art. 54)."}
  - {annee: 2026, evenement: "La ministre de l'Environnement fait état de 233 associations forestières communautaires enregistrées et de 197 plans de gestion participative approuvés (août)."}
