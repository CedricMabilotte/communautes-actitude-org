  verifie: ["Texte des s. 2, 9 (1) (g) (ii), 20 (4), 30 (3), 31, 32, 39, 47 (4), 48 à 52 et date de sanction de la loi n° 34 de 2016 (texte du Journal officiel du 7 septembre 2016, reproduit par Mwakili ; titres des sections confirmés sur Kenya Law, version au 31 décembre 2022).", "Projet de règlement de 2025 sur la participation à la gestion durable des forêts, dont l'art. 54 abroge le règlement de 2009 (site du ministère, mis en ligne en 2026) ; maintien en vigueur des textes d'application de la loi de 2005 par la s. 77 (e) de la loi de 2016.", "Passages du cinquième rapport national du Kenya à la CDB sur la gestion participative et les associations forestières communautaires."]
