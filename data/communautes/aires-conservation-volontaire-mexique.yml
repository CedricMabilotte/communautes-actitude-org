effectivite: {valeur: "partielle", note: "Le sixième rapport du Mexique à la CDB (2019) note pour les ADVC un « système de certification au moment de l'entrée » et l'absence de mécanisme d'évaluation de l'efficacité. Une étude de cas à San Miguel Chimalapa (Oaxaca), certifiée en 2010, conclut que la mise en œuvre de la certification est restée « paralysée » par des conflits que l'arrivée de financements et de projets a aggravés, et relève les tentatives d'un comité interinstitutionnel de centraliser et de conditionner les décisions de gestion (Monterrubio-Solís, 2019). Dans dix ADVC d'ejidos de la région de Calakmul (Campeche) certifiées en 2017 selon les auteurs (la liste de la CONANP en compte neuf pour cette année-là), une enquête de 2022 relève dix règles communautaires sur la chasse de subsistance et vingt espèces dont la chasse est interdite ; l'un des auteurs dirige la réserve de biosphère de Calakmul pour la CONANP (Tejeda-Cruz et al., 2025).", source: "https://entrediversidades.unach.mx/index.php/entrediversidades/article/view/121"}
chronologie:
  - {annee: 1996, evenement: "Réforme de la LGEEPA (DOF du 13 décembre) : l'article 59 permet aux peuples autochtones, aux organisations sociales et aux particuliers de promouvoir des aires protégées sur leurs terres."}
  - {annee: 2002, evenement: "Premier certificat inscrit sur la liste de la CONANP (CONANP-01/2002)."}
  - {annee: 2004, evenement: "Premiers certificats au nom d'un ejido (Cerro Chango, Santiago Jocotepec) et de communautés de San Felipe Usila (Oaxaca)."}
  - {annee: 2008, evenement: "Réforme de la LGEEPA (DOF du 16 mai) : les ADVC deviennent une catégorie d'aire naturelle protégée fédérale (art. 46 fr. XI, art. 55 BIS, art. 77 BIS)."}
  - {annee: 2014, evenement: "Réforme du règlement sur les aires naturelles protégées (DOF du 21 mai) : procédure de certification, modification, prorogation et annulation."}
  - {annee: 2019, evenement: "Sixième rapport national à la CDB : 325 ADVC sur 493 312 ha (chiffres CONANP 2018)."}
  - {annee: 2024, evenement: "Réforme du 1er avril : l'article 77 BIS nomme les « peuples et communautés autochtones et afromexicains » parmi les titulaires possibles."}
  - {annee: 2025, evenement: "Liste de la CONANP de décembre : 617 certificats, dont 232 au nom d'ejidos ou de communautés sur des terres collectives ; 40 de ces derniers délivrés en 2025."}
fiabilite:
  verifie: ["Texte de la LGEEPA, dernière réforme du 19 janvier 2026 (Chambre des députés) : art. 46 fr. XI, art. 55 BIS et art. 77 BIS ajoutés le 16 mai 2008, art. 77 BIS modifié le 1er avril 2024, art. 59 réformé en 1996, 2008 et 2024.", "Règlement de la LGEEPA sur les aires naturelles protégées, dernière réforme du 21 mai 2014 : art. 126, 127, 133, 133 BIS, 134, 135 et 136.", "Liste de la CONANP de décembre 2025 (50 pages, 617 lignes) : type de propriétaire relevé ligne par ligne ; 159 ejidos (terres d'usage commun), 2 ejidos (terres d'usage commun et parcelles), 70 communautés (biens communaux), 1 communauté, 189 ejidos (parcelles), 127 personnes physiques, 55 personnes morales, 13 propriétaires publics ou para-étatiques, 1 ejido (propriété privée).", "Sixième rapport national du Mexique à la CDB (enregistrement du 2 juillet 2019) : passages sur les ADVC.", "Étude de Monterrubio-Solís (EntreDiversidades, 2019) sur l'ADVC El Cordón del Retén, San Miguel Chimalapa.", "Résumé de l'étude de Tejeda-Cruz et al. (Tropical and Subtropical Agroecosystems, 2025) sur dix ADVC d'ejidos de Calakmul."]
  non_confirme: ["Les 189 certificats portant sur des parcelles d'ejido sont exclus parce qu'ils visent des droits individuels ; certains peuvent avoir été demandés collectivement, ce que la liste ne dit pas. Le certificat « Ejido (propriété privée) » est aussi exclu.", "Surface : la somme calculée (12 960 km²) inclut des superficies qui se superposent à des aires protégées fédérales ; la liste ne donne la superposition que pour l'ensemble des ADVC (114 456 ha).", "Part des ADVC situées dans des territoires de peuples autochtones ou afromexicains : la liste ne renseigne pas l'appartenance des propriétaires.", "Nombre d'ejidos et de communautés distincts : un même noyau agraire peut détenir plusieurs certificats ; le décompte porte sur les certificats.", "Population et villages concernés : aucun chiffre sourcé.", "Coordonnées : centre approximatif fixé entre l'Oaxaca, le Guerrero et le Campeche, où se trouvent la plupart des sites.", "Inscription des ADVC dans la base mondiale des aires protégées (WDPA) : non vérifiée.", "Instruments économiques liés aux niveaux de certification : non consultés."]
