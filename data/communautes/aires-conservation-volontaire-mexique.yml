resume: >-
  Fiche agrégée : elle couvre les ejidos (noyaux agraires de propriété sociale issus de dotations de l'État) et les communautés agraires (titulaires de biens communaux) qui ont fait certifier une partie de leurs terres comme aire destinée volontairement à la conservation. Depuis la réforme du 16 mai 2008 de la loi générale de l'équilibre écologique et de la protection de l'environnement (LGEEPA), ces aires sont des aires naturelles protégées de compétence fédérale (art. 46 fr. XI) ; la Commission nationale des aires naturelles protégées (CONANP) délivre le certificat, et le propriétaire administre l'aire selon la stratégie de gestion qu'il a proposée (art. 77 BIS). Pour un ejido ou une communauté, la demande exige une décision de l'assemblée agraire. La liste de la CONANP de décembre 2025 compte 617 certificats, dont 232 au nom d'ejidos ou de communautés sur des terres collectives, en majorité dans l'Oaxaca (87), le Guerrero (39) et le Campeche (36). Le régime foncier des noyaux agraires est décrit dans la fiche « Ejidos et communautés agraires (noyaux agraires) ».
