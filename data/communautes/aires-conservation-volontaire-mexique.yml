reconnaissance_onu:
  - {mecanisme: "cdb_8j", detail: "Sixième rapport national du Mexique à la Convention sur la diversité biologique (soumis en juillet 2019) : il range les ADVC parmi les aires protégées « établies par les propriétaires de la terre en propriété privée ou sociale », compte 325 ADVC sur 493 312 ha (CONANP 2018) et indique que, dans les territoires des peuples autochtones, « ce sont les communautés elles-mêmes qui ont décidé de protéger des aires »", annee: 2019, source: "https://api.cbd.int/api/v2013/documents/241354"}
base_nationale:
  - {instrument: "Loi générale de l'équilibre écologique et de la protection de l'environnement (LGEEPA), art. 46 fr. XI, art. 55 BIS et art. 77 BIS, ajoutés par la réforme publiée au Journal officiel de la Fédération (DOF) le 16 mai 2008 ; art. 77 BIS modifié le 19 janvier 2018 (fr. IV) et le 1er avril 2024 (premier alinéa)", nature: "loi", annee: 2008, source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGEEPA.pdf"}
  - {instrument: "Règlement de la LGEEPA en matière d'aires naturelles protégées, chapitre « Des aires destinées volontairement à la conservation » (art. 126 à 136), réformé le 21 mai 2014", nature: "loi", annee: 2014, source: "https://www.diputados.gob.mx/LeyesBiblio/regley/Reg_LGEEPA_ANP.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "L'ADVC est administrée par son propriétaire et gérée selon la stratégie de gestion inscrite au certificat (LGEEPA, art. 77 BIS fr. IV, 2008) ; pour un ejido ou une communauté, la demande joint l'acte de l'assemblée agraire et l'acte d'élection du comisariado (bureau exécutif élu par l'assemblée) en fonction (Règlement ANP, art. 127 fr. I et II, 2014). La CONANP peut révoquer le certificat en cas de manquement aux obligations qu'il fixe (Règlement ANP, art. 135).", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGEEPA.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les propriétaires définissent « librement » les zones et sous-zones de l'aire (LGEEPA, art. 77 BIS fr. I ; Règlement ANP, art. 127 fr. V), et la stratégie de gestion qu'ils proposent fixe les règles d'usage et d'exploitation des ressources (art. 127 fr. V c). Ces règles n'ont effet qu'une fois inscrites dans le certificat délivré par la CONANP (LGEEPA, art. 77 BIS fr. II).", source: "https://www.diputados.gob.mx/LeyesBiblio/regley/Reg_LGEEPA_ANP.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le régime ne crée pas de titre : il suppose la propriété de l'ejido ou de la communauté, prouvée par un document juridique (LGEEPA, art. 77 BIS fr. I b). La terre reste au propriétaire, et le certificat s'éteint si la propriété est transmise sans que le nouveau propriétaire demande à le conserver (Règlement ANP, art. 133 fr. III). Le titre collectif lui-même relève du droit agraire.", source: "https://www.diputados.gob.mx/LeyesBiblio/regley/Reg_LGEEPA_ANP.pdf"}
  ressources: {valeur: "partiel", note: "L'exploitation des ressources est permise selon la stratégie de gestion ; les produits d'une exploitation durable peuvent porter un label de durabilité délivré par le ministère de l'Environnement, sauf les produits forestiers, régis par la loi forestière (LGEEPA, art. 77 BIS fr. V, 2008). Le niveau de certification conditionne l'accès aux instruments économiques (art. 77 BIS fr. III).", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGEEPA.pdf"}
  consentement: {valeur: "non_etabli", note: "L'aire n'est créée qu'à la demande du propriétaire, avec, pour un ejido ou une communauté, la décision de l'assemblée (LGEEPA, art. 77 BIS fr. I c), et l'assemblée peut annuler le certificat (Règlement ANP, art. 134) : il s'agit de l'entrée et de la sortie volontaires du régime, non d'une obligation de consulter la communauté avant une décision de l'État ou d'un tiers. Une aire protégée créée ensuite par l'État sur une ADVC doit seulement « prendre en considération » sa stratégie de gestion (LGEEPA, art. 77 BIS fr. IV), et le régime ne prévoit pas de consultation pour les projets de tiers.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGEEPA.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
