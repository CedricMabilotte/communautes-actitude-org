droits:
  autogouvernement: {valeur: "partiel", note: "Chaque municipalité adopte sa constitution, qui « doit être démocratique et peut être traditionnelle » (art. XIII, s. 5) ; la constitution ne retire pas leur rôle aux chefs traditionnels reconnus par la coutume et permet de leur confier des fonctions dans le gouvernement (art. IV, s. 2).", source: "https://fsmlaw.org/chuuk/constitution/entire.htm"}
  pouvoir_normatif: {valeur: "partiel", note: "Les pouvoirs municipaux sur les affaires locales priment sur la loi de l'État (art. XIII, s. 5) ; la coutume et la tradition chuukaises existantes sont respectées et la législature peut les protéger par la loi (art. IV, s. 1).", source: "https://fsmlaw.org/chuuk/constitution/entire.htm"}
  justice_propre: {valeur: "partiel", note: "Le pouvoir judiciaire est confié aux tribunaux de l'État et aux tribunaux municipaux (art. VII, s. 1) ; les décisions de justice doivent être compatibles avec les traditions et coutumes locales (art. VII, s. 14).", source: "http://fsmlaw.org/chuuk/constitution/article07.htm"}
  terres: {valeur: "partiel", note: "Les droits traditionnels sur les récifs, estrans et autres terres submergées sont reconnus (Constitution de Chuuk, art. IV, s. 4). Les terres émergées de lignage n'ont pas de disposition constitutionnelle propre ; la Cour suprême de Chuuk juge qu'elles appartiennent aux descendants matrilinéaires du lignage (Chipuelong v. Chuuk, 1993).", source: "http://fsmlaw.org/chuuk/constitution/article04.htm"}
  ressources: {valeur: "reconnu", note: "« Les droits traditionnels sur tous les récifs, estrans et autres terres submergées, y compris leur colonne d'eau, et les droits des successeurs sont reconnus » ; la législature peut en réglementer l'usage raisonnable (art. IV, s. 4). La compétence municipale s'étend à l'espace marin situé à l'intérieur des récifs (art. XIII, s. 4).", source: "https://fsmlaw.org/chuuk/constitution/entire.htm"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "reconnu", note: "« Le chuukais est la langue de l'État, mais le chuukais et l'anglais sont tous deux langues officielles » (art. XI, s. 6).", source: "https://fsmlaw.org/chuuk/constitution/entire.htm"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "reconnu", note: "La législature affecte chaque année aux gouvernements municipaux au moins 8 % des crédits de fonctionnement de l'État et au moins 40 % des crédits de développement (Constitution de Chuuk, art. VIII, s. 6) : ce budget est garanti par la constitution ; le pouvoir fiscal appartient à l'État, qui peut en déléguer une partie aux municipalités par la loi (art. VIII, s. 7).", source: "http://fsmlaw.org/chuuk/constitution/article08.htm"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "La Cour suprême de Chuuk applique l'article IV, s. 4 en restreignant sa portée : effet pour l'avenir seulement (Nimeisa v. Department of Public Works, 1993), exclusion des chenaux profonds, qui restent à l'État, et des estrans remblayés avant le 1er octobre 1989 (Sellem v. Maras, 1995). En 1994, sur 15 000 parcelles, 7 300 étaient déposées au bureau foncier et 4 300 avaient une propriété établie (F. X. Hezel, Micronesian Counselor no 16).", source: "http://fsmlaw.org/chuuk/constitution/article04.htm"}
chronologie:
  - {annee: 1989, evenement: "Entrée en vigueur de la Constitution de l'État de Chuuk le 1er octobre (art. XV, s. 1)."}
  - {annee: 1990, evenement: "Fin de la tutelle de l'ONU pour les États fédérés de Micronésie (résolution 683 du Conseil de sécurité)."}
  - {annee: 1993, evenement: "Nimeisa v. Department of Public Works : la Cour suprême de Chuuk reconnaît les droits traditionnels sur les estrans, pour l'avenir seulement."}
  - {annee: 1994, evenement: "Publication de l'étude de F. X. Hezel sur la tenure foncière à Chuuk (Micronesian Seminar)."}
  - {annee: 1995, evenement: "Sellem v. Maras : la Cour suprême de Chuuk exclut les chenaux profonds et les terres remblayées avant 1989 du champ de l'art. IV, s. 4."}
