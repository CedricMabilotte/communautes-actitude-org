resume: >-
  L'État de Chuuk, l'un des quatre États fédérés de Micronésie, a adopté une constitution entrée en vigueur le 1er octobre 1989. Son article IV reconnaît les droits traditionnels sur les récifs, les estrans (zones découvertes à marée basse) et les autres terres submergées, y compris la colonne d'eau, et maintient le rôle des chefs traditionnels. L'article XIII institue 39 municipalités, dont la constitution « doit être démocratique et peut être traditionnelle ». Les terres de lignage (fonuen eterenges) sont tenues collectivement par des lignages matrilinéaires.
