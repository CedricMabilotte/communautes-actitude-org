resume: >-
  Fiche agrégée : elle couvre les quatre juridictions d'irrigants auxquelles la loi organique 6/1985 du pouvoir judiciaire, article 19, reconnaît le caractère de « tribunal coutumier et traditionnel » : le Tribunal des Eaux de la Vega de Valence (1985), le Conseil des Hommes Bons de Murcie (1999), le Juzgado Privativo de Aguas (tribunal particulier des eaux) d'Orihuela et le Tribunal du Comuner du Rollet de Gràcia d'Aldaia (2021). Ces tribunaux sont composés d'irrigants élus ou tirés au sort au sein des communautés de canaux (acequias) ; ils jugent oralement, sans avocat ni appel ordinaire, les infractions aux ordonnances d'irrigation et les litiges entre usagers de l'eau. La Constitution de 1978, article 125, prévoit la participation des citoyens à la justice dans ces tribunaux ; le Tribunal constitutionnel a jugé en 2004 que le Conseil des Hommes Bons exerce une juridiction véritable, limitée aux compétences que lui donnent la législation des eaux et les ordonnances de la Huerta. Les communautés d'irrigants elles-mêmes sont des corporations de droit public qui adoptent leurs ordonnances et élisent leurs organes sous la tutelle des confédérations hydrographiques.
