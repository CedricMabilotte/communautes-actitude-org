effectivite: {valeur: "non_etablie", note: "Aucune évaluation indépendante du régime n'a été consultée. Pour Jeju, la fiche d'inscription de l'UNESCO (2016), établie sur la candidature de l'État, indique que les coopératives de pêche locales détiennent les droits de pêche de leur zone et mentionne l'implication des communautés dans la gestion des pratiques de pêche.", source: "https://ich.unesco.org/fr/RL/la-culture-des-haenyeo-femmes-plongeuses-de-jeju-01068"}
chronologie:
  - {annee: 2016, evenement: "Inscription de la culture des haenyeo de Jeju sur la Liste représentative du patrimoine culturel immatériel de l'UNESCO (décision 11.COM 10.b.24)."}
  - {annee: 2022, evenement: "Refonte de la loi sur la pêche (loi n° 18755 du 11 janvier) : pêche villageoise (art. 7(1)2), licence réservée aux fraternités et coopératives de district (art. 8(1)), règlement de gestion du fonds de pêche (art. 37)."}
  - {annee: 2023, evenement: "Entrée en vigueur de la loi refondue, un an après sa promulgation."}
