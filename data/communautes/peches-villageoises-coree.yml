resume: >-
  Fiche agrégée : elle couvre les fraternités de villages de pêcheurs (eochongye, associations des pêcheurs résidents d'un village côtier) titulaires d'une licence de pêche villageoise. La loi sur la pêche (refonte, loi n° 18755 du 11 janvier 2022) définit la pêche villageoise comme la gestion, la culture et la récolte des coquillages, des algues et des espèces sédentaires dans une zone littorale délimitée par les pêcheurs résidant dans une zone déterminée (art. 7(1)2) ; la licence n'est accordée qu'à une fraternité de village de pêcheurs ou à une coopérative de pêche de district (art. 8(1)). Le droit de pêche ainsi acquis est un droit réel (droit sur un bien, opposable à tous), détenu collectivement par la fraternité quand elle n'a pas la personnalité juridique (art. 16), exercé par ses membres selon un règlement de gestion du fonds de pêche qu'elle fixe (art. 36 et 37). Les plongeuses haenyeo de Jeju pêchent dans ce cadre : l'UNESCO, qui a inscrit leur culture en 2016, indique que les coopératives de pêche locales détiennent les droits de pêche de leur zone.
