base_nationale:
  - {instrument: "Loi sur la pêche (Fisheries Act), refonte par la loi n° 18755 du 11 janvier 2022, art. 7(1)2, 8(1), 14, 16, 19, 21, 33, 36, 37 et 38 ; en vigueur un an après sa promulgation (dispositions additionnelles, art. 1)", nature: "loi", annee: 2022, source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
droits:
  autogouvernement: {valeur: "partiel", note: "La fraternité de village de pêcheurs tient une assemblée générale, qui décide notamment de l'accès à la pêche villageoise de non-membres domiciliés dans la même commune ou le même district (loi sur la pêche de 2022, art. 36(1)2) ; le chef de la ville, du comté ou de l'arrondissement (si, gun, gu) peut ordonner la modification de son règlement s'il n'est pas conforme à la loi (art. 37(2)) et restreindre ou interdire l'exercice du droit de pêche par certaines personnes pour répartir également les revenus entre les membres (art. 38).", source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
  pouvoir_normatif: {valeur: "partiel", note: "La fraternité titulaire fixe un règlement de gestion du fonds de pêche : qui peut pêcher, méthodes, périodes, redevances et autres règles de gestion (loi sur la pêche de 2022, art. 37(1)) ; les membres exercent le droit selon ce règlement (art. 36(1)) ; l'autorité locale peut en ordonner la modification s'il n'est pas conforme à la loi (art. 37(2)).", source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Le droit de pêche sur la zone délimitée est un droit réel soumis aux règles du Code civil sur les immeubles, détenu collectivement par la fraternité sans personnalité juridique (loi sur la pêche de 2022, art. 16(2) et (4)) ; il ne peut être donné en garantie (art. 21) ni cédé hors des cas prévus (art. 19) ; la licence vaut 10 ans ; elle peut être prolongée sur demande, pour 10 ans au plus au total (art. 14(1) et (2)).", source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
  ressources: {valeur: "partiel", note: "La licence de pêche villageoise, qui porte sur les coquillages, les algues et les espèces sédentaires, n'est accordée qu'à une fraternité ou à une coopérative de district (loi sur la pêche de 2022, art. 7(1)2 et 8(1)) ; l'autorité locale peut restreindre ou suspendre la pêche pour la protection des ressources, la défense, des travaux publics, des câbles sous-marins ou en cas d'infraction (art. 33(1)) ; les restrictions pour motif d'intérêt public ouvrent droit à indemnisation (art. 88).", source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_applicable", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Le règlement de gestion fixé par la fraternité détermine les redevances dues pour l'exercice du droit de pêche (loi sur la pêche de 2022, art. 37(1)) ; aucun pouvoir fiscal n'est prévu.", source: "https://elaw.klri.re.kr/eng_mobile/viewer.do?hseq=60269&type=sogan&key=55"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_applicable", note: "", source: ""}
