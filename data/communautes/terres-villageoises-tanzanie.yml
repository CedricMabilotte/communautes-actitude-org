base_nationale:
  - {instrument: "Village Land Act (loi sur les terres villageoises), loi n° 5 de 1999, chap. 114, en vigueur le 1er mai 2001 (G.N. n° 486 de 2001) : art. 4 (transfert de terre villageoise), 7 (définition et certificat de terre villageoise), 8 (gestion par le conseil de village), 11 (accords d'usage conjoint entre villages), 12 et 13 (terre communale villageoise), 20 (droit coutumier applicable), 22 et 27 (droit coutumier d'occupation), 60 à 62 (conseil foncier villageois)", nature: "loi", annee: 1999, source: "https://www.lands.go.tz/uploads/documents/sw-1682059676-The%20Village%20Land%20Act%201999.%20Cap%20114.pdf"}
  - {instrument: "Land Act (loi foncière), loi n° 4 de 1999, chap. 113, art. 4 : toute la terre est confiée au président comme fiduciaire de tous les citoyens ; la terre publique se divise en terre générale, terre villageoise et terre réservée", nature: "loi", annee: 1999, source: "https://faolex.fao.org/docs/pdf/tan23795.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "Le conseil de village gère toute la terre villageoise comme un fiduciaire pour les villageois et les autres résidents (Village Land Act 1999, art. 8 (1) et (2)) ; il rend compte à chaque réunion ordinaire de l'assemblée villageoise (art. 8 (6)). Le commissaire aux terres (Commissioner for Lands, fonctionnaire de l'État) peut lui donner des avis dont il doit tenir compte (art. 8 (7)). Sur plainte de l'assemblée ou d'au moins cent villageois au conseil de district, le commissaire peut adresser au conseil de village une directive obligatoire, ou une enquête peut proposer au ministre de transférer la gestion au conseil de district ou au commissaire (art. 8 (8) et (9)).", source: "https://www.lands.go.tz/uploads/documents/sw-1682059676-The%20Village%20Land%20Act%201999.%20Cap%20114.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "Les questions relatives au droit coutumier d'occupation sont tranchées selon le droit coutumier applicable dans le village, sauf disposition contraire d'une loi (art. 20 (1) et (4), loi de 1999) ; il s'applique dans la mesure où il est conforme aux principes de la politique foncière nationale et au droit écrit, et toute règle coutumière qui prive les femmes, les enfants ou les personnes handicapées de l'accès à la terre est nulle (art. 20 (2)). L'assemblée villageoise approuve, modifie ou rejette les propositions du conseil sur la terre communale, présentées sous forme de plan d'usage des terres (art. 13), ainsi que les accords d'usage conjoint entre villages (art. 11 (3)).", source: "https://www.lands.go.tz/uploads/documents/sw-1682059676-The%20Village%20Land%20Act%201999.%20Cap%20114.pdf"}
  justice_propre: {valeur: "partiel", note: "Chaque village institue un conseil foncier villageois (Village Land Council) de cinq à sept membres, dont au moins deux femmes, proposés par le conseil de village et approuvés par l'assemblée, choisis notamment pour leur connaissance du droit foncier coutumier (art. 60, loi de 1999). Il fait de la médiation selon les principes coutumiers (art. 61 (4)) ; le recours à lui n'est pas obligatoire (art. 61 (6)). Une partie qui refuse la médiation peut saisir un tribunal (art. 62 (1)) ; l'article 62 (2) attribue la compétence exclusive en matière foncière à la Cour d'appel, à la chambre foncière de la Haute Cour, au tribunal foncier de district, au tribunal de quartier (Ward Tribunal) et au conseil foncier villageois.", source: "https://www.lands.go.tz/uploads/documents/sw-1682059676-The%20Village%20Land%20Act%201999.%20Cap%20114.pdf"}
  terres: {valeur: "partiel", note: "La terre villageoise reste une terre publique confiée au président (Land Act 1999, art. 4). Le commissaire délivre au village un certificat de terre villageoise qui confère la gestion au conseil et confirme l'occupation par les villageois selon le droit coutumier (Village Land Act 1999, art. 7 (6) et (7)). La terre communale villageoise ne peut faire l'objet d'aucune attribution individuelle (art. 12 (1) (a)) ; un groupe reconnu par le droit coutumier peut obtenir un droit coutumier d'occupation (art. 22), présumé à durée indéfinie (art. 27). Le président peut transférer de la terre villageoise en terre générale ou réservée pour un intérêt public, investissements d'intérêt national compris, contre indemnisation (art. 4).", source: "https://www.lands.go.tz/uploads/documents/sw-1682059676-The%20Village%20Land%20Act%201999.%20Cap%20114.pdf"}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Le conseil de village ne peut attribuer de terre ni accorder de droit coutumier d'occupation sans l'approbation préalable de l'assemblée villageoise (art. 8 (5), loi de 1999). Un transfert de terre villageoise de moins de 250 hectares doit être approuvé par l'assemblée villageoise ; au-delà de 250 hectares, le ministre décide après avoir reçu les recommandations de l'assemblée et les observations des conseils de village et de district (art. 4 (6)).", source: "https://www.lands.go.tz/uploads/documents/sw-1682059676-The%20Village%20Land%20Act%201999.%20Cap%20114.pdf"}
