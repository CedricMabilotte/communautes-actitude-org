effectivite: {valeur: "partielle", note: "Selon l'International Land Coalition, les lois foncières de 1999 protègent en théorie les terres communautaires mais se sont révélées peu efficaces en pratique, et l'obtention d'un certificat de droit coutumier d'occupation prend du temps. Le discours budgétaire du ministre des Terres pour 2026-2027 indique qu'au 15 mai 2026, 4 925 villages sur 12 333 avaient un plan d'usage des terres, et que le ministère recevait des plaintes de citoyens contre des gouvernements de village au sujet de leurs droits fonciers après la délimitation des villages.", source: "https://www.landcoalition.org/en/our-network/our-focus-countries/tanzania/"}
chronologie:
  - {annee: 1999, evenement: "Adoption de la loi foncière (n° 4) et de la loi sur les terres villageoises (n° 5)."}
  - {annee: 2001, evenement: "Entrée en vigueur de la loi sur les terres villageoises le 1er mai (G.N. n° 486 de 2001)."}
  - {annee: 2011, evenement: "Trois certificats de droit coutumier d'occupation délivrés aux Hadza pour 23 000 hectares dans les villages de Mongo wa Mono et Domanga : premier titre foncier accordé en Tanzanie à une communauté de chasseurs-cueilleurs."}
  - {annee: 2026, evenement: "Le ministère des Terres compte 12 333 villages, dont 11 996 aux limites arpentées et 4 925 dotés d'un plan d'usage des terres (chiffres au 15 mai)."}
fiabilite:
  verifie: ["Texte de la loi sur les terres villageoises, chap. 114, publié par le ministère des Terres : art. 4, 7, 8, 11, 12, 13, 20, 22, 27, 60 à 62 ; date d'entrée en vigueur (1er mai 2001, G.N. n° 486 de 2001).", "Texte d'origine de la loi de 1999 (FAOLEX) : l'approbation préalable de l'assemblée (art. 8 (5)) et le seuil de 250 hectares (art. 4 (6)) y figurent déjà.", "Loi foncière de 1999, art. 4 (FAOLEX) : terre confiée au président comme fiduciaire ; trois catégories de terre publique.", "Discours budgétaire du ministre des Terres 2026-2027 : 12 333 villages, 11 996 aux limites arpentées, 4 925 dotés d'un plan d'usage des terres, 148 certificats de terre villageoise délivrés entre juillet 2025 et le 15 mai 2026.", "Étude de cas Namati : premiers certificats collectifs hadza en 2011, 23 000 hectares, villages de Mongo wa Mono et Domanga."]
  non_confirme: ["Nombre cumulé de certificats de terre villageoise délivrés depuis 2001 : non trouvé ; seuls les chiffres annuels figurent dans le discours budgétaire.", "Surface totale de la terre villageoise : aucun chiffre officiel ouvert.", "Population des villages : non retenue faute de source ouverte sur ce périmètre.", "Le pouvoir réglementaire général des conseils de village (règlements locaux prévus par la loi sur les autorités de district, chap. 287) n'a pas été vérifié sur le texte de cette loi.", "Aucun document onusien ou régional visant nommément le régime des terres villageoises n'a été trouvé ; le cinquième rapport national à la CDB (2014) mentionne la terre villageoise sans décrire le régime.", "Aucune liste officielle publique des villages n'a été ouverte : pas de tableau des sites."]
