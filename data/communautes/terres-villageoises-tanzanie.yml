resume: >-
  Fiche agrégée : elle couvre les villages de la Tanzanie continentale et leurs habitants, bénéficiaires collectifs de la terre villageoise. La loi foncière de 1999 (Land Act, chap. 113) range la terre publique, confiée au président comme fiduciaire (gardien pour le compte d'autrui) de tous les citoyens, en trois catégories : terre générale, terre réservée et terre villageoise (art. 4). La loi sur les terres villageoises de 1999 (Village Land Act, chap. 114), en vigueur depuis le 1er mai 2001, confie la gestion de cette terre au conseil de village, qui agit comme fiduciaire des villageois (art. 8), sous le contrôle de l'assemblée villageoise (Village Assembly, définie par la loi sur les autorités de district, chap. 287). Elle distingue la terre communale villageoise, qui ne peut être attribuée à titre individuel (art. 12 et 13), et les terres attribuables en droit coutumier d'occupation, y compris à un groupe reconnu par la coutume (art. 22). En mai 2026, le ministère des Terres comptait 12 333 villages.
  Les titres collectifs délivrés aux Hadza relèvent de la fiche « Hadza ».
