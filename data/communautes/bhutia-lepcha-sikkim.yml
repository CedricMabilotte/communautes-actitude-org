resume: >-
  Les Bhutia et les Lepcha sont deux peuples du Sikkim, ancien royaume intégré à l'Inde en 1975, inscrits sur la liste des tribus répertoriées (« Scheduled Tribes », liste officielle de l'Inde). L'article 371F de la Constitution, inséré par le 36e amendement (en vigueur le 26 avril 1975), maintient les lois antérieures du Sikkim et permet au Parlement de réserver des sièges à des « sections » de la population. Douze des 32 sièges de l'Assemblée sont réservés aux Sikkimais d'origine bhutia-lepcha et un siège au Sangha (clergé des monastères bouddhistes), en vertu de l'article 7 (1A) de la loi de 1950 sur la représentation du peuple ; la Cour suprême a jugé ces réservations conformes à la Constitution en 1993. L'ordre foncier n° 1 de 1917 interdit aux Bhutia et aux Lepcha de vendre, hypothéquer ou sous-louer leurs terres à d'autres personnes sans autorisation expresse. Le bhutia et le lepcha sont langues officielles de l'État depuis la loi de 1977.
