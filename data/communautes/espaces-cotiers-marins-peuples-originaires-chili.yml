resume: >-
  Fiche agrégée : elle couvre les communautés autochtones, et les associations de communautés, constituées selon la loi 19.253 de 1993 qui administrent un espace côtier marin des peuples originaires (ECMPO). La loi 20.249 de 2008, dite « loi lafkenche », crée cette figure pour préserver l'usage coutumier (uso consuetudinario) d'un espace du littoral : le ministère de la Défense le remet en destination (affectation d'un bien public) au Sous-secrétariat à la Pêche, qui signe une convention d'usage à durée indéfinie avec la communauté ou l'association attributaire. La communauté administre l'espace selon un plan d'administration approuvé par une commission intersectorielle. Le Sous-secrétariat publie 31 décrets de destination, de Punta Capitanes (2012) à Antilko (2025) ; une étude de Pivotes compte 34 ECMPO décrétés (222 404 ha) et 109 demandes en cours au 31 mai 2024.
