effectivite: {valeur: "partielle", note: "Selon l'étude de Pivotes, centre d'études chilien, consacrée aux effets de la loi sur les projets économiques (juin 2024), les ECMPO décrétés ont attendu en moyenne 5,94 ans et les demandes en cours 7,42 ans, alors que le règlement prévoit environ un an ; 109 demandes portant sur 3 823 760 ha restaient en cours au 31 mai 2024. Le guide du Sous-secrétariat (janvier 2014) recensait un seul ECMPO attribué et 23 demandes en cours au 31 janvier 2013.", source: "https://www.pivotes.cl/web/wp-content/uploads/2024/04/240603-Ley-Lafkenche-alcances-y-consecuencias-VF.pdf"}
chronologie:
  - {annee: 2008, evenement: "Loi 20.249 créant l'espace côtier marin des peuples originaires, publiée le 16 février."}
  - {annee: 2009, evenement: "Règlement de la loi (décret suprême n° 134 du ministère de la Planification). La communauté Altué dépose la demande de Punta Capitanes (Fresia)."}
  - {annee: 2012, evenement: "Décret exempt n° 1.596 : premier ECMPO, Punta Capitanes (Los Lagos), administré par la communauté Altué."}
  - {annee: 2014, evenement: "Guide d'application du Sous-secrétariat à la Pêche : 23 demandes en cours au 31 janvier 2013, 12 rejetées, abandonnées ou retirées."}
  - {annee: 2018, evenement: "Rapport national du Chili à l'Examen périodique universel : 140 146 ha destinés et 23 rapports d'usage coutumier de la Conadi."}
  - {annee: 2024, evenement: "Étude Pivotes : 34 ECMPO décrétés (222 404 ha) et 109 demandes en cours au 31 mai ; une demande de 612 000 ha en Aysén rejetée en février."}
  - {annee: 2025, evenement: "Décrets de destination de Panitao (Los Lagos), Isla Traiguén (Aysén) et Antilko (Los Lagos)."}
fiabilite:
  verifie: ["Texte espagnol des art. 1 à 16 de la loi 20.249 tel que publié au Journal officiel le 16 février 2008, reproduit dans la Historia de la Ley de la Bibliothèque du Congrès national.", "Publication du règlement (décret suprême n° 134) au Journal officiel le 26 mai 2009 : annexe 4 du guide du Sous-secrétariat.", "Liste des 31 décrets de destination publiée par le Sous-secrétariat à la Pêche et à l'Aquaculture ; région de chaque site lue dans le texte du décret.", "Tableau de suivi des demandes du Sous-secrétariat : 115 lignes, dont 30 au stade « secteur décrété », réparties entre les régions d'Atacama, du Biobío, de La Araucanía, de Los Ríos, de Los Lagos, d'Aysén et de Magallanes.", "34 ECMPO décrétés, 222 404 ha, 109 demandes en cours, délais moyens : étude Pivotes, juin 2024.", "Un ECMPO attribué fin 2013 et 23 demandes en cours au 31 janvier 2013 : guide du Sous-secrétariat, janvier 2014.", "Le Chili présente la loi 20.249 dans son rapport au CERD de 2013 (CERD/C/CHL/19-21, § 48), dans son rapport national à l'Examen périodique universel de 2018 (140 146 ha destinés) et dans son rapport au Comité des droits de l'homme de 2021 (CCPR/C/CHL/7, § 165)."]
  non_confirme: ["Écart de décompte : 31 décrets publiés par le Sous-secrétariat jusqu'en 2025, 30 secteurs décrétés dans son tableau de suivi, 34 ECMPO décrétés selon Pivotes en mai 2024 ; les trois listes ne sont pas datées de la même façon.", "Surfaces par site non reportées dans le tableau : les décrets sont des documents numérisés et les surfaces sont souvent réparties en secteurs de plage et de fond de mer.", "Nombre de plans d'administration approuvés et de conventions d'usage signées non trouvé.", "Le décret de Punta Capitanes (2012) date le décret suprême n° 134 du 29 août 2008 ; le guide du Sous-secrétariat donne sa publication le 26 mai 2009 et les décrets suivants le citent « de 2009 ».", "Absence de modification de la loi 20.249 depuis 2008 non vérifiée : la page Ley Chile ne s'affiche pas sans navigateur.", "Aucune observation d'un organe de traité, du Rapporteur spécial ni de l'OIT nommant ce régime n'a été trouvée ; seuls les rapports de l'État le mentionnent.", "Pivotes est un centre d'études ; ses chiffres n'ont pas été recoupés avec une source officielle.", "Population des communautés attributaires : non trouvée.", "Nombre de villages : non trouvé."]
