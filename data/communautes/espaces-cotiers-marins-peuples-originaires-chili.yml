droits:
  autogouvernement: {valeur: "partiel", note: "L'administration de l'espace est confiée à une association de communautés autochtones constituées selon la loi 19.253, ou à une seule communauté si elle seule en a l'usage coutumier (art. 2 et 5 de la loi 20.249) ; les statuts de l'attributaire font partie du plan d'administration, qu'une commission intersectorielle approuve (art. 11).", source: "https://www.bcn.cl/historiadelaley/fileadmin/file_ley/5244/HLD_5244_37a6259cc0c1dae299a7866489dff0bd.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "L'attributaire présente le plan d'administration, qui fixe les usages, les périodes et les usagers extérieurs admis, avec un plan de gestion (plan de manejo) des ressources hydrobiologiques s'il y a exploitation (art. 11) ; les usagers qui le contreviennent sont sanctionnés selon l'art. 116 de la loi générale sur la pêche et l'aquaculture (art. 15). Le plan doit être approuvé par une commission intersectorielle.", source: "https://www.bcn.cl/historiadelaley/fileadmin/file_ley/5244/HLD_5244_37a6259cc0c1dae299a7866489dff0bd.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "L'espace est remis en destination au Sous-secrétariat à la Pêche, qui signe une convention d'usage avec l'attributaire (art. 3) ; destination et convention sont à durée indéfinie, sauf manquement grave au plan de gestion, dissolution de l'attributaire, sanctions répétées ou renonciation (art. 12 et 13). L'attributaire ne peut pas empêcher l'accès, le passage ni la libre navigation (art. 15 b). La loi ne crée pas de titre de propriété.", source: "https://www.bcn.cl/historiadelaley/fileadmin/file_ley/5244/HLD_5244_37a6259cc0c1dae299a7866489dff0bd.pdf"}
  ressources: {valeur: "partiel", note: "L'usage coutumier peut comprendre des usages de pêche, religieux, récréatifs et médicinaux (art. 6) ; l'exploitation des ressources hydrobiologiques suit un plan de gestion conforme au règlement, et l'attributaire remet des rapports d'activité que le Sous-secrétariat approuve ou rejette (art. 11).", source: "https://www.bcn.cl/historiadelaley/fileadmin/file_ley/5244/HLD_5244_37a6259cc0c1dae299a7866489dff0bd.pdf"}
  consentement: {valeur: "partiel", note: "Une fois l'usage coutumier attesté, la Conadi (Corporación Nacional de Desarrollo Indígena) consulte les communautés autochtones voisines de l'espace demandé, et une demande concurrente pour d'autres fins est suspendue jusqu'à l'avis de la Conadi (art. 8 et 10). La loi ne prévoit pas de consentement de l'attributaire aux projets voisins.", source: "https://www.bcn.cl/historiadelaley/fileadmin/file_ley/5244/HLD_5244_37a6259cc0c1dae299a7866489dff0bd.pdf"}
  langue: {valeur: "non_applicable", note: "", source: ""}
