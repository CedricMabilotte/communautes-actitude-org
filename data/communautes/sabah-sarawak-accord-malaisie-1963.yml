resume: >-
  Le Sabah (ancienne colonie britannique de Bornéo du Nord) et le Sarawak ont rejoint la Fédération de Malaisie le 16 septembre 1963 en vertu de l'Accord relatif à la Malaisie signé à Londres le 9 juillet 1963 et enregistré au Secrétariat de l'ONU (n° 10760). Le Malaysia Act de 1963 (loi n° 26) a inscrit dans la Constitution fédérale des garanties propres aux deux États : compétences législatives supplémentaires (art. 95B à 95E), recettes et dotations spéciales (art. 112C et 112D), contrôle de l'entrée sur leur territoire par la loi sur l'immigration, usage des langues autochtones et de l'anglais (art. 161), et accord préalable du gouverneur de l'État pour toute révision constitutionnelle touchant ces matières (art. 161E). Le sujet de cette fiche est la population des deux États ; les droits propres aux peuples natifs font l'objet des fiches « Peuples autochtones du Sabah » et « Peuples autochtones du Sarawak ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "mission_onu", detail: "La Déclaration conjointe de Manille du 5 août 1963, conclue par la Fédération de Malaya, l'Indonésie et les Philippines, prévoit que le Secrétaire général de l'ONU ou son représentant vérifie, avant la formation de la Fédération de Malaisie, les vœux des populations du Sabah (Bornéo du Nord) et du Sarawak au regard du principe IX de l'annexe de la résolution 1541 (XV) de l'Assemblée générale (§ 4), et prévoit de lui demander d'envoyer des équipes de travail à cette fin (§ 5).", annee: 1963, source: "https://treaties.un.org/doc/Publication/UNTS/Volume%20550/volume-550-I-8029-English.pdf"}
base_nationale:
  - {instrument: "Accord relatif à la Malaisie (Londres, 9 juillet 1963), avec en annexes le Malaysia Bill, les Constitutions des États de Sabah et de Sarawak et le projet de loi sur l'immigration de 1963 ; enregistré à l'ONU le 21 septembre 1970 sous le n° 10760", nature: "traite", annee: 1963, source: "https://treaties.un.org/doc/Publication/UNTS/Volume%20750/volume-750-I-10760-English.pdf"}
  - {instrument: "Constitution fédérale de Malaisie, art. 95B à 95E, 112C, 112D, 161, 161A, 161B, 161E ; Ninth Schedule, listes 2A et 3A ; Tenth Schedule, parties IV et V (dispositions introduites par le Malaysia Act 1963, loi n° 26)", nature: "constitution", annee: 1963, source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  - {instrument: "Immigration Act 1963 (partie II : dispositions spéciales pour les États de Bornéo), texte annexé à l'Accord relatif à la Malaisie", nature: "loi", annee: 1963, source: "https://treaties.un.org/doc/Publication/UNTS/Volume%20750/volume-750-I-10760-English.pdf"}
  - {instrument: "Amendement constitutionnel adopté par la Chambre des représentants le 14 décembre 2021 (redéfinition de la Fédération à l'art. 160(2) en référence à l'Accord de Malaisie de 1963)", nature: "constitution", annee: 2021, source: "https://www.malaymail.com/news/malaysia/2021/12/14/dewan-rakyat-finally-passes-key-constitutional-amendments-to-recognise-ma63/2028384"}
droits:
  autogouvernement: {valeur: "reconnu", note: "Chaque État dispose d'une assemblée législative et d'un gouvernement propres régis par sa Constitution d'État, annexée à l'Accord relatif à la Malaisie de 1963 (annexes B et C) et mise en vigueur par ordonnance britannique (art. III de l'Accord).", source: "https://treaties.un.org/doc/Publication/UNTS/Volume%20750/volume-750-I-10760-English.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "En plus de la liste des compétences des États, les législatures du Sabah et du Sarawak légifèrent sur les matières du supplément à la liste des États (liste 2A : droit et coutume autochtones, tribunaux autochtones, ports, cadastre, eau) et du supplément à la liste concurrente (liste 3A : statut personnel, pêche maritime, hydroélectricité, recherche forestière), Constitution fédérale, art. 95B et Ninth Schedule ; elles peuvent lever une taxe sur les ventes, art. 95B(3).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  justice_propre: {valeur: "partiel", note: "Une Haute Cour distincte, la High Court in Sabah and Sarawak, siège dans les deux États ; sa composition, sa compétence et le statut de ses juges ne peuvent être modifiés sans l'accord du gouverneur de l'État (Yang di-Pertua Negeri), art. 161E(2)(b) ; le droit d'exercer devant les tribunaux des deux États ne peut être étendu à des non-résidents qu'avec l'accord de la législature de l'État, art. 161B. Les tribunaux autochtones relèvent de la loi de l'État (liste 2A). Cette Haute Cour appartient à l'ordre judiciaire fédéral.", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  terres: {valeur: "reconnu", note: "Le Parlement fédéral ne peut pas imposer au Sabah et au Sarawak de loi uniforme sur la terre ou les collectivités locales, art. 95D ; les deux États ne sont pas tenus de suivre la politique du Conseil national de la terre, et aucune zone de développement ne peut y être proclamée sans l'accord du gouverneur, art. 95E ; la loi de l'État peut réserver des terres aux natifs, art. 161A(5).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  ressources: {valeur: "partiel", note: "Le Parlement ne peut pas empêcher les deux États de percevoir une redevance minière, y compris sur les huiles minérales, ni la limiter en deçà de 10 % ad valorem, art. 112C(4) ; les recettes des terres, mines et forêts sont attribuées aux États (Tenth Schedule, partie III) ; la pêche maritime et estuarienne et l'hydroélectricité relèvent de la liste concurrente (liste 3A).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  consentement: {valeur: "reconnu", note: "Aucune révision de la Constitution fédérale ne peut être faite sans l'accord du gouverneur de l'État concerné si elle touche à la citoyenneté liée à l'État, à la Haute Cour du Sabah et du Sarawak, aux compétences législatives et exécutives de l'État et aux arrangements financiers, à la religion, à la langue et au traitement des natifs, art. 161E(2) ; les droits de l'État en matière d'entrée et de séjour sont protégés de la même manière, art. 161E(4).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  langue: {valeur: "partiel", note: "Une langue autochtone en usage peut être employée devant les tribunaux autochtones et pour la codification du droit coutumier, et au Sarawak devant l'Assemblée législative ; l'usage de l'anglais au Parlement, devant la Haute Cour du Sabah et du Sarawak et à des fins officielles dans les deux États ne pouvait être restreint avant dix ans après le 16 septembre 1963, art. 161(1) et (2) ; depuis, une loi fédérale qui restreint cet usage n'entre en vigueur dans un État qu'après son approbation par la législature de cet État, art. 161(3).", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "Les deux États reçoivent des dotations spéciales (Tenth Schedule, partie IV) et des recettes fiscales attribuées (partie V), révisées périodiquement par accord avec la Fédération, avec recours à un évaluateur indépendant dont l'avis s'impose en cas de désaccord, art. 112C et 112D, et peuvent lever une taxe sur les ventes, art. 95B(3) ; pour le Sabah, la dotation est fixée à deux cinquièmes de la hausse, par rapport à 1963, des recettes fédérales nettes tirées de l'État (Tenth Schedule, partie IV, section 2). La Haute Cour de Kota Kinabalu a jugé en 2025 que cette dotation n'avait pas été honorée de 1974 à 2021.", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  representation: {valeur: "partiel", note: "La Constitution attribue 25 sièges au Sabah et 31 au Sarawak sur les 222 de la Chambre des représentants, art. 46 ; le quota proportionnel garanti par l'art. 161E(2)(e) ne valait que pour les parlements convoqués avant la fin d'août 1970.", source: "https://www.constituteproject.org/constitution/Malaysia_2007"}
  statut_personnel: {valeur: "reconnu", note: "La loi sur l'immigration s'applique à chaque État de Bornéo comme à une entité distincte ; un citoyen malaisien qui n'« appartient » pas à l'État (belongs to the Borneo State) doit obtenir un permis pour y entrer, sauf exceptions (membres des gouvernements et des assemblées, juges, fonctionnaires, activité politique, besoins du gouvernement fédéral), et le contrôleur de l'immigration suit les directives de l'autorité de l'État, Immigration Act 1963, sections 4 à 8 ; ces droits sont protégés par l'art. 161E(4) de la Constitution fédérale.", source: "https://treaties.un.org/doc/Publication/UNTS/Volume%20750/volume-750-I-10760-English.pdf"}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le 17 octobre 2025, la Haute Cour de Kota Kinabalu (juge Celestina Stuel Galid), saisie par la Sabah Law Society, a jugé que le gouvernement fédéral avait agi illégalement en n'honorant pas pendant près de cinquante ans la dotation spéciale (dite des « 40 % » des recettes fédérales tirées du Sabah), et a ordonné une révision avec l'État pour chaque exercice de 1974 à 2021, à ouvrir sous 90 jours et à achever sous 180 jours ; le 11 novembre 2025, le gouvernement fédéral a annoncé qu'il ne ferait pas appel sur le principe de cette dotation et ouvrirait des négociations avec l'État, tout en faisant appel d'autres parties du jugement.", source: "https://www.freemalaysiatoday.com/category/nation/2025/11/11/govt-decides-not-to-appeal-sabah-revenue-ruling"}
chronologie:
  - {annee: 1963, evenement: "27 février : rapport du Comité intergouvernemental sur les garanties à accorder au Bornéo du Nord et au Sarawak ; 9 juillet : signature à Londres de l'Accord relatif à la Malaisie, dont l'art. VIII engage les gouvernements à mettre en œuvre ce rapport."}
  - {annee: 1963, evenement: "31 juillet et 5 août : Accord et Déclaration conjointe de Manille demandant au Secrétaire général de l'ONU de vérifier les vœux des populations du Sabah et du Sarawak."}
  - {annee: 1963, evenement: "28 août : accord modificatif reportant le jour de la Malaisie au 16 septembre ; entrée en vigueur de l'Accord et du Malaysia Act le 16 septembre."}
  - {annee: 1970, evenement: "21 septembre : enregistrement de l'Accord relatif à la Malaisie au Secrétariat de l'ONU (n° 10760)."}
  - {annee: 1984, evenement: "Le territoire de Labuan est détaché du Sabah et devient territoire fédéral (Constitution (Amendment) (No. 2) Act 1984, loi A585 ; art. 1(4) de la Constitution fédérale)."}
  - {annee: 2021, evenement: "14 décembre : la Chambre des représentants adopte par 199 voix, sans opposition, l'amendement constitutionnel qui inscrit l'Accord de Malaisie de 1963 dans la définition de la Fédération (art. 160(2))."}
  - {annee: 2025, evenement: "17 octobre : la Haute Cour de Kota Kinabalu juge illégal le non-versement au Sabah de la dotation de 40 % des recettes fédérales tirées de l'État."}
  - {annee: 2026, evenement: "11 septembre : le Premier ministre annonce une décision de principe du Cabinet d'augmenter le nombre et la proportion des sièges du Sabah et du Sarawak à la Chambre des représentants ; le nombre et le mécanisme sont renvoyés à la Commission électorale."}
fiabilite:
  verifie: ["Art. I à VIII de l'Accord relatif à la Malaisie, date d'entrée en vigueur et date d'enregistrement à l'ONU (Recueil des traités des Nations unies, vol. 750, n° 10760).", "Sections 1 à 9 du projet de loi sur l'immigration de 1963 annexé à l'Accord (même source).", "Paragraphes 4 à 7 de la Déclaration conjointe de Manille du 5 août 1963 (Recueil des traités, vol. 550, n° 8029).", "Art. 46, 95B à 95E, 112C, 112D, 161, 161A, 161B, 161E, Ninth Schedule listes 2A et 3A, Tenth Schedule parties III et IV de la Constitution fédérale (traduction anglaise, Constitute Project).", "Texte d'origine de l'art. 1(2) en 1963 (Malaysia Bill, section 4, annexe A de l'Accord) ; texte actuel de l'art. 1(2) et 1(4), dont l'exclusion de Labuan du territoire du Sabah par la loi A585 de 1984 (Constitute Project).", "Décision de principe du Cabinet du 11 septembre 2026 sur les sièges (Malay Mail).", "Vote du 14 décembre 2021 et redéfinition de la Fédération à l'art. 160(2) (Malay Mail).", "Jugement du 17 octobre 2025 et décision du 11 novembre 2025 de ne pas faire appel (Free Malaysia Today).", "Population des deux États au recensement de 2020 et nombre de districts : 27 au Sabah, 40 au Sarawak (City Population, données du Département de la statistique).", "Superficie cumulée de 198 069 km² (ISIS Malaysia)."]
  non_confirme: ["Le texte de la Constitution consulté (Constitute Project) est antérieur à l'amendement de 2021-2022 ; la nouvelle rédaction de l'art. 1(2) (retour à la mention des « États de Bornéo ») et la date d'entrée en vigueur du 11 février 2022 ne sont pas vérifiées sur le texte officiel, le portail du Procureur général étant indisponible.", "Le rapport de la Mission de l'ONU pour la Malaisie et les conclusions du Secrétaire général de septembre 1963 n'ont pas été consultés sur une source onusienne.", "La numérotation actuelle des dispositions sur l'immigration (partie VII de l'Immigration Act 1959/63) n'a pas été vérifiée ; la fiche cite le texte de 1963 annexé à l'Accord.", "Les garanties sur la religion et l'éducation issues du rapport du Comité intergouvernemental n'ont pas été vérifiées : le rapport en ligne est une image numérisée sans texte.", "Superficie cumulée reprise de l'ISIS Malaysia, sans accès direct à la source statistique ; on ne sait pas si elle inclut Labuan.", "La date et la référence de la révision de l'art. 1(2) qui a cessé de désigner le Sabah et le Sarawak comme « États de Bornéo » n'ont pas été vérifiées : le document du cabinet du Premier ministre (2018) qui les donnait ne répond pas.", "La désignation par le Secrétaire général d'une Mission de l'ONU pour la Malaisie (1963) n'a pas été vérifiée sur une source onusienne : la Déclaration conjointe de Manille prévoit seulement l'envoi d'équipes de travail.", "Changement du titre de chef du gouvernement du Sarawak en « Premier » en 2022 : non vérifié sur le texte de la Constitution du Sarawak."]
