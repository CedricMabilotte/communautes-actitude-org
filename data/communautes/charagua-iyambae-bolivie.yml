  - {instrument: "Statut de l'autonomie guarani Charagua Iyambae", nature: "statut_autonomie", annee: 2015, source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  - {instrument: "Loi 026 du régime électoral, art. 57 et 61", nature: "loi", annee: 2010, source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution (art. 289 et 290) définit l'AIOC comme autogouvernement exercé selon les normes et institutions propres ; le statut de 2015 crée un organe de décision collective (Ñemboati Reta), un organe législatif et un organe exécutif.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le statut (art. 27) attribue à l'organe législatif (Mborokuai Simbika Iyapoa Reta) une faculté législative ; la Constitution (art. 304) liste les compétences exclusives de l'AIOC.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Constitution (art. 190 et 304.I.8) reconnaît la juridiction indigène originaire paysanne, exercée par les autorités propres selon leurs normes et procédures.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  terres: {valeur: "partiel", note: "La Constitution (art. 30.II.6 et 403) reconnaît le titre collectif des territoires indigènes ; le territoire de l'autonomie inclut aussi des bourgs à majorité non indigène et des colonies mennonites.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  ressources: {valeur: "partiel", note: "La Constitution (art. 30.II.17 et 304.I.3) donne la gestion et l'usage exclusif des ressources renouvelables ; les ressources non renouvelables restent à l'État, avec participation aux bénéfices (art. 30.II.16).", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15) impose une consultation préalable obligatoire et de bonne foi, sans exiger le consentement.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5) fait du guarani une langue officielle de l'État ; le statut (art. 5) fait du guarani et du castillan les langues officielles de l'autonomie.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  education: {valeur: "partiel", note: "Le statut (art. 52 et 86) fait de l'éducation une compétence partagée avec l'État, fondée sur la vision du monde guarani ; la Constitution (art. 30.II.12) garantit une éducation interculturelle et plurilingue.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  fiscalite: {valeur: "partiel", note: "La Constitution (art. 304.I.12 à 14) permet de créer des taxes, d'administrer les impôts de sa compétence et d'adopter son budget ; le statut (art. 53) liste les impôts propres et les transferts.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  representation: {valeur: "partiel", note: "La loi 026 de 2010 (art. 57) crée une circonscription spéciale indigène en Santa Cruz, partagée entre Chiquitano, Guarani, Guarayo, Ayoreo et Yuracaré-Mojeño.", source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Une étude de terrain publiée en 2021 décrit un fonctionnement effectif des assemblées zonales, avec des continuités fortes avec l'ancien système communal et un premier chef de l'exécutif issu de la mairie (Morell i Torra).", source: "https://dialnet.unirioja.es/descarga/articulo/8331297.pdf"}
chronologie:
  - {annee: 2009, evenement: "Référendum ouvrant la voie de la conversion de la commune en autonomie indigène."}
  - {annee: 2014, evenement: "Le Tribunal constitutionnel plurinational déclare le statut conforme à la Constitution (12 juin)."}
  - {annee: 2015, evenement: "Le statut est approuvé par référendum avec 53 % des voix (20 septembre)."}
  - {annee: 2017, evenement: "Les 46 autorités du gouvernement autonome prennent leurs fonctions (8 janvier) ; la commune disparaît."}
