resume: >-
  Charagua Iyambae est la première « autonomía indígena originaria campesina » (AIOC, collectivité territoriale autochtone prévue par la Constitution de 2009) en fonctionnement en Bolivie. Son statut est approuvé par référendum le 20 septembre 2015 et ses 46 autorités prennent leurs fonctions le 8 janvier 2017, date de disparition de la commune ; le deuxième mandat des organes législatif et exécutif court de 2022 à 2026. Le recensement de 2024 compte 38 420 habitants, répartis entre des communautés guarani regroupées en quatre capitanías, sept colonies mennonites et deux bourgs. Les autres autonomies autochtones constituées (Nation originaire Uru Chipaya, Quechua de Raqaypampa, Aymaras de Salinas, Guarani de Kereimba Iyaambae, Jatun Ayllu Yura), les Territoires indigènes originaires paysans (TIOC) de Bolivie et le Parc national Kaa-Iya du Gran Chaco, où vivent les Isoseños de Charagua, ont leur propre fiche.
reconnaissance_onu:
  - {mecanisme: "oit_169", detail: "La Bolivie ratifie la Convention 169 de l'OIT le 11 décembre 1991.", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
  - {mecanisme: "dnudpa", detail: "La Bolivie vote pour la Déclaration des Nations unies sur les droits des peuples autochtones (résolution 61/295).", annee: 2007, source: "https://digitallibrary.un.org/record/609197"}
base_nationale:
  - {instrument: "Constitution politique de l'État plurinational de Bolivie (2009), art. 2, 5, 30, 190, 289, 290, 304 et 403", nature: "constitution", annee: 2009, source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  - {instrument: "Statut de l'autonomie guarani Charagua Iyambae", nature: "statut_autonomie", annee: 2015, source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  - {instrument: "Loi 026 du régime électoral, art. 57 et 61", nature: "loi", annee: 2010, source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution (art. 289 et 290) définit l'AIOC comme autogouvernement exercé selon les normes et institutions propres ; le statut de 2015 crée un organe de décision collective (Ñemboati Reta), un organe législatif et un organe exécutif.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  pouvoir_normatif: {valeur: "reconnu", note: "Le statut (art. 27) attribue à l'organe législatif (Mborokuai Simbika Iyapoa Reta) une faculté législative ; la Constitution (art. 304) liste les compétences exclusives de l'AIOC.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  justice_propre: {valeur: "reconnu", note: "La Constitution (art. 190 et 304.I.8) reconnaît la « jurisdicción indígena originaria campesina » (justice autochtone), exercée par les autorités propres selon leurs normes et procédures.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  terres: {valeur: "partiel", note: "La Constitution (art. 30.II.6 et 403) reconnaît le titre collectif des territoires autochtones ; le territoire de l'autonomie inclut aussi des bourgs à majorité non autochtone et des colonies mennonites.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  ressources: {valeur: "partiel", note: "La Constitution (art. 30.II.17 et 304.I.3) donne la gestion et l'usage exclusif des ressources renouvelables ; les ressources non renouvelables restent à l'État, avec participation aux bénéfices (art. 30.II.16).", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15) impose une consultation préalable obligatoire et de bonne foi, sans exiger le consentement ; le statut (art. 11) prévoit cette consultation selon les procédures propres de chaque capitanía.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5) fait du guarani une langue officielle de l'État ; le statut (art. 5) fait du guarani et du castillan les langues officielles de l'autonomie.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  education: {valeur: "partiel", note: "Le statut (art. 52.2) fait de l'éducation une compétence concurrente exercée dans le cadre de la législation nationale, et (art. 86) fonde l'éducation sur la vision du monde guarani ; la Constitution (art. 30.II.12) garantit une éducation interculturelle et plurilingue.", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  fiscalite: {valeur: "partiel", note: "Le statut (art. 50.12 à 14, repris de l'art. 304.I de la Constitution) permet de créer des taxes, d'administrer les impôts de sa compétence et d'adopter son budget ; son art. 53 liste les impôts propres et les transferts de l'État (coparticipation fiscale, impôt direct sur les hydrocarbures, redevances).", source: "https://web.oep.org.bo/wp-content/uploads/2017/01/estatuto_charaguaiyambae.pdf"}
  representation: {valeur: "partiel", note: "La loi 026 de 2010 (art. 57) crée une circonscription spéciale autochtone en Santa Cruz, partagée entre Chiquitano, Guarani, Guarayo, Ayoreo et Yuracaré-Mojeño.", source: "https://web.oep.org.bo/wp-content/uploads/2019/07/LEY_026.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Deux études de terrain indépendantes décrivent des organes en fonctionnement : l'assemblée (Ñemboati Guasu) avait rédigé vingt et une lois en 2018, mais l'autonomie ne contrôle pas le sous-sol et dépend des transferts de l'État (Postero et Tockman, 2020) ; les assemblées zonales fonctionnent, avec des continuités avec l'ancien système communal (Morell i Torra, 2021). Les organes ont été renouvelés en 2021-2022 et l'organe législatif adopte en 2024 la loi autonome n° 09/2024 sur le Parapetí et les marais de l'Isoso (ACLO).", source: "https://www.cambridge.org/core/journals/latin-american-research-review/article/selfgovernance-in-bolivias-first-indigenous-autonomy-charagua/DDF2119168F267B3D3583451618CBCDA"}
chronologie:
  - {annee: 2009, evenement: "Référendum du 6 décembre ouvrant la conversion de la commune en autonomie autochtone (56 % des voix)."}
  - {annee: 2014, evenement: "Le Tribunal constitutionnel plurinational déclare le statut conforme à la Constitution (12 juin)."}
  - {annee: 2015, evenement: "Le statut est approuvé par référendum avec 53 % des voix (20 septembre)."}
  - {annee: 2017, evenement: "Les 46 autorités du gouvernement autonome prennent leurs fonctions (8 janvier) ; la commune disparaît."}
  - {annee: 2021, evenement: "Le gouvernement autonome saisit le Tribunal agroenvironnemental contre l'INRA et l'ABT au sujet de colonisations dans l'aire Ñembi Guasu (28 juillet) ; élection des organes législatif et exécutif selon les procédures propres, sous supervision du Tribunal électoral départemental (novembre)."}
  - {annee: 2022, evenement: "Les 12 législateurs et 5 exécutifs zonaux reçoivent leurs lettres de créance pour le mandat 2022-2026 (8 janvier)."}
  - {annee: 2023, evenement: "Delcy Medina Carrillo reçoit ses lettres de créance de coordinatrice de l'exécutif (Tëtarembiokuai Reta Imborika) pour 2023-2025 (19 octobre)."}
  - {annee: 2024, evenement: "Adoption du plan de gestion de l'aire Ñembi Guasu (juillet) et de la loi autonome n° 09/2024 créant l'aire de gestion du río Parapetí et des marais de l'Isoso."}
