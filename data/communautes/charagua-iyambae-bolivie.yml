resume: >-
  Charagua Iyambae est la première autonomie indigène originaire paysanne (AIOC, collectivité territoriale indigène prévue par la Constitution de 2009) en fonctionnement en Bolivie. Son statut est approuvé par référendum le 20 septembre 2015 et ses 46 autorités prennent leurs fonctions le 8 janvier 2017, date de disparition de la commune. Le territoire compte environ 40 000 habitants selon une projection de 2020, répartis entre plus de 100 communautés guarani, sept colonies mennonites et deux bourgs.
