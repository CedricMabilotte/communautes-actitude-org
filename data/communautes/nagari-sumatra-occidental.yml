resume: >-
  Fiche agrégée : elle couvre les nagari de la province de Sumatra occidental, que le règlement régional (Peraturan Daerah, loi provinciale) n° 7 de 2018 définit comme des « communautés de droit coutumier » (kesatuan masyarakat hukum adat) fondées sur la généalogie et l'histoire, avec un territoire délimité, des biens propres et le droit de choisir leurs dirigeants par délibération, selon le principe minangkabau « la coutume repose sur la loi religieuse, la loi religieuse repose sur le Coran ». Le règlement prévoit dans chaque nagari un conseil coutumier (Kerapatan Adat Nagari, KAN), qui désigne le chef du nagari (Kapalo Nagari), et une instance coutumière de règlement des litiges par médiation (Peradilan Adat Nagari). Il sert de cadre aux districts, qui peuvent, par leur propre règlement, faire du nagari une collectivité gouvernée selon la coutume (art. 2 et 24 (2)) ; une étude publiée en 2024 relève qu'aucun district ne l'avait fait à la fin de 2021. Les nagari existants continuent de fonctionner comme villages administratifs sous le nom de nagari ; le district des îles Mentawai relève d'un régime distinct.
