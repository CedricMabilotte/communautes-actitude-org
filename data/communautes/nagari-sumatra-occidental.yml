base_nationale:
  - {instrument: "Peraturan Daerah Provinsi Sumatera Barat n° 7 de 2018 sur les nagari (règlement régional du 5 avril 2018), qui abroge le règlement n° 2 de 2007 sur les principes du gouvernement des nagari ; pris en application de l'art. 109 de la loi n° 6 de 2014 sur les villages", nature: "loi", annee: 2018, source: "https://pasal.id/peraturan/perda/perda-provinsi-sumatera-barat-no-7-tahun-2018"}
  - {instrument: "Décision du ministère de l'Environnement et des Forêts SK.1852/MENLHK-PSKL/PKTHA/PSL.1/3/2019 (mars 2019) : forêt coutumière (hutan adat) Rimbo Tolang dan Rimbo Ubau de la communauté de droit coutumier du nagari Koto Besar, district de Dharmasraya", nature: "loi", annee: 2019, source: "https://geoportal.planologi.kehutanan.go.id/server/rest/services/Peta_Interaktif_2026/HUTAN_ADAT_AR_50K/MapServer/0/query?where=OBJECTID%3D25&outFields=*&returnGeometry=false&f=json"}
droits:
  autogouvernement: {valeur: "conteste", note: "Le règlement n° 7 de 2018 institue dans chaque nagari un conseil coutumier (KAN), « instance de délibération la plus haute », composé de représentants des chefs de lignage (niniak mamak), des religieux (alim ulama), des lettrés (cadiak pandai), des femmes (bundo kanduang) et des jeunes (art. 5 et 6), qui choisit et nomme le Kapalo Nagari par délibération consensuelle et contrôle son action (art. 7 et 12) ; les modalités relèvent d'un règlement de district (art. 6 (4), 12 (2) et 24 (2)), et le gouverneur exerce un encadrement et un contrôle (art. 17 à 21). Les gouvernements de nagari et les institutions existants restent en place selon le droit commun des villages (art. 24 (1) et 25). Une étude publiée en 2024 relève qu'aucun district n'avait adopté ce règlement à la fin de 2021 (Aris, Marawa, 2024).", source: "https://pasal.id/peraturan/perda/perda-provinsi-sumatera-barat-no-7-tahun-2018"}
  pouvoir_normatif: {valeur: "conteste", note: "Le KAN prépare les règlements de nagari (Peraturan Nagari) avec le Kapalo Nagari, qui les promulgue (art. 7 (1) b et 11 d du règlement n° 7 de 2018) ; la gouvernance du nagari et de ses ressources selon le droit coutumier est renvoyée à des règlements de district (art. 22), non adoptés à la fin de 2021 selon Aris (Marawa, 2024).", source: "https://pasal.id/peraturan/perda/perda-provinsi-sumatera-barat-no-7-tahun-2018"}
  justice_propre: {valeur: "conteste", note: "Le KAN crée dans chaque nagari une Peradilan Adat Nagari, instance la plus haute de règlement des litiges selon la coutume du nagari (adat salingka nagari), après les échelons de la famille, du lignage et du clan ; elle règle par la conciliation les litiges sur les titres et les biens hérités en lignée maternelle (sako et pusako), tranche par consensus les affaires civiles coutumières par une décision (« kato putuih ») que les tribunaux prennent pour référence, et prononce des sanctions coutumières (art. 1 (8), 15 et 16 du règlement n° 7 de 2018) ; la composition, la nomination des juges et le financement relèvent d'un règlement de district (art. 16 (2)). Une étude de terrain dans le nagari Duku (Pesisir Selatan) observe que les décisions du KAN n'ont pas de force obligatoire pour les parties (Trihamdi et al., Menara Ilmu, 2023). Comme pour le KAN et le gouvernement coutumier du nagari, aucun district n'avait adopté à la fin de 2021 les règlements d'application (Aris, Marawa, 2024).", source: "https://pasal.id/peraturan/perda/perda-provinsi-sumatera-barat-no-7-tahun-2018"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Le règlement n° 7 de 2018 renvoie la gestion des ressources du nagari selon le droit coutumier aux règlements de district (art. 22). Une forêt coutumière (hutan adat) de 34,9 hectares, Rimbo Tolang dan Rimbo Ubau, est attribuée à la communauté de droit coutumier du nagari Koto Besar (district de Dharmasraya) par décision ministérielle SK.1852 de mars 2019 ; c'est la seule forêt coutumière attribuée à un nagari dans la base géographique du ministère des Forêts consultée en 2026.", source: "https://geoportal.planologi.kehutanan.go.id/server/rest/services/Peta_Interaktif_2026/HUTAN_ADAT_AR_50K/MapServer/0/query?where=OBJECTID%3D25&outFields=*&returnGeometry=false&f=json"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "conteste", note: "Le KAN examine et approuve le projet de budget du nagari (Anggaran Pendapatan dan Belanja Nagari), que le Kapalo Nagari arrête ; le Kapalo Nagari gère les finances et les biens du nagari (art. 7 (1) c et 11 c et e du règlement n° 7 de 2018). Ce dispositif dépend des règlements de district non adoptés à la fin de 2021 (Aris, Marawa, 2024). Le texte ne donne pas de pouvoir d'imposition.", source: "https://pasal.id/peraturan/perda/perda-provinsi-sumatera-barat-no-7-tahun-2018"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "contestee", note: "Selon une étude par entretiens publiée en 2024, aucun district n'avait adopté à la fin de 2021 le règlement prévu pour faire du nagari une collectivité gouvernée selon la coutume ; les districts invoquent le risque de conflits locaux, l'absence de financement défini, la réduction de leurs propres compétences et l'évolution des pratiques culturelles (Aris, Marawa, 2024). D'autres travaux étudient un conflit entre le KAN et le gouvernement du nagari de Sialang (Sukri et Fadri, Journal of Governance, 2025) et l'absence de force obligatoire des décisions du KAN dans les litiges fonciers (Trihamdi et al., Menara Ilmu, 2023).", source: "https://doi.org/10.31958/marawa.v3i1.13223"}
chronologie:
  - {annee: 1983, evenement: "Application en Sumatra occidental de la loi n° 5 de 1979 sur les villages : le village (desa) remplace le nagari comme échelon de gouvernement ; le règlement régional n° 13 de 1983 maintient le nagari comme communauté de droit coutumier, avec son KAN."}
  - {annee: 2000, evenement: "Règlement régional n° 9 de 2000 : retour au gouvernement des nagari, après la loi n° 22 de 1999 sur les collectivités locales."}
  - {annee: 2007, evenement: "Règlement régional n° 2 de 2007 sur les principes du gouvernement des nagari, applicable à tous les districts sauf les îles Mentawai."}
  - {annee: 2014, evenement: "Loi n° 6 de 2014 sur les villages : création du statut de village coutumier (desa adat) ; l'art. 109 confie aux provinces l'organisation de ses institutions."}
  - {annee: 2018, evenement: "Règlement régional n° 7 de 2018 (5 avril) sur les nagari : KAN, Kapalo Nagari désigné par le KAN, Peradilan Adat Nagari ; mise en œuvre renvoyée aux districts."}
  - {annee: 2019, evenement: "Forêt coutumière attribuée à la communauté de droit coutumier du nagari Koto Besar (Dharmasraya)."}
  - {annee: 2021, evenement: "Aucun district n'a encore adopté de règlement d'application du règlement n° 7 de 2018 (Aris, 2024)."}
fiabilite:
  verifie: ["Texte intégral du règlement n° 7 de 2018 et de son exposé des motifs (copie PDF publiée par Pasal.id) : art. 1, 5 à 17, 22 à 27 ; date de promulgation 5 avril 2018 ; abrogation du règlement n° 2 de 2007 ; art. 23 renvoyant les îles Mentawai à un régime de village coutumier propre.", "Historique 1983-2014 : exposé des motifs du règlement n° 7 de 2018.", "Forêt coutumière du nagari Koto Besar : base géographique du ministère des Forêts (décision SK.1852 de mars 2019, 34,9 hectares) ; aucune autre forêt coutumière au nom d'un nagari dans cette base.", "Absence de règlements de district à la fin de 2021 et motifs : résumé de l'article d'Aris (Marawa, 2024), lu dans les métadonnées Crossref.", "Absence de force obligatoire des décisions du KAN à Duku : résumé de l'article de Trihamdi et al. (Menara Ilmu, 2023)."]
  non_confirme: ["Adoption, depuis 2022, d'un règlement de district faisant d'un ou plusieurs nagari des collectivités gouvernées selon la coutume : non vérifié.", "Nombre de nagari : 930 unités « nagari/desa » dans les 11 districts hors îles Mentawai selon le tableau du Bureau du gouvernement de la province (publié en juin 2024, année des données non précisée) ; la colonne ne distingue pas les nagari des desa (le référentiel de l'office statistique signale un desa à Sijunjung) ; les 27 desa de Sawahlunto et 55 de Pariaman, villes, ne sont pas comptés.", "Règlement régional n° 6 de 2008 sur les terres coutumières (tanah ulayat) : texte non ouvert ; le droit sur les terres reste « non établi ».", "Aucun document onusien ou régional nommant les nagari n'a été trouvé.", "Nombre de villages : non trouvé ; aucun total provincial des hameaux (jorong) n'a été trouvé, seulement des tableaux par district (Agam, Lima Puluh Kota, Solok Selatan)."]
