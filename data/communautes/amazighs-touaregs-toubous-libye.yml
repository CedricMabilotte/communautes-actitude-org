resume: >-
  Les Amazighs vivent surtout dans le Djebel Nefoussa, à Zouara et dans les oasis de l'Ouest libyen ; les Touaregs dans le Sud-Ouest saharien, autour de Ghat ; les Toubous dans le Sud, en bordure du Tibesti.
  La Déclaration constitutionnelle de 2011 (texte constitutionnel provisoire) garantit leurs droits linguistiques et culturels, l'arabe restant seule langue officielle.
  La loi n° 18 de 2013 reconnaît leurs langues comme « composantes linguistiques et culturelles » de la société libyenne et ouvre leur enseignement comme matière optionnelle.
  La loi n° 17 de 2013 leur attribue des sièges dans l'Assemblée constituante.
  Aucune institution propre ni territoire n'est prévu par la loi.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le Comité pour l'élimination de la discrimination raciale relève la présence de populations amazighes et touarègues (par. 6) et demande à la Libye de respecter le droit des Amazighs de parler leur langue et de favoriser son enseignement (par. 15).", annee: 2004, source: "https://docs.un.org/fr/CERD/C/64/CO/4"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits de l'homme prend note d'informations sur la violation des droits d'un groupe d'Amazighs au titre de l'article 27 du Pacte (par. 26).", annee: 2007, source: "https://docs.un.org/fr/CCPR/C/LBY/CO/4"}
