  langue: {valeur: "partiel", note: "Art. 1 de la Déclaration constitutionnelle de 2011 : l'arabe est la langue officielle, les droits linguistiques et culturels des Amazighs, des Toubous, des Touaregs et des autres composantes sont garantis. Le tamazight, le tamasheq et le tedaga n'ont pas de statut officiel.", source: "https://www.constituteproject.org/constitution/Libya_2012"}
  education: {valeur: "partiel", note: "Loi n° 18 de 2013, art. 2 et 3 : droit d'apprendre leur langue comme matière optionnelle dans les programmes scolaires ; le ministère de l'Éducation fournit manuels et enseignants. Art. 5 : centres de recherche dans l'enseignement supérieur.", source: "https://security-legislation.ly/latest-laws/law-no-18-of-2013-on-the-rights-of-cultural-and-linguistic-components/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "Loi n° 17 de 2013 sur l'élection de l'Assemblée constituante, art. 1 (définition de la « composante » : Amazighs, Toubous, Touaregs) et art. 5 avec tableau annexé : sièges attribués aux composantes dans les circonscriptions du Djebel, de Koufra, d'Oubari, de Mourzouq et de Ghadamès. Minority Rights Group compte deux sièges par composante sur 60. La garantie ne vaut que pour l'Assemblée constituante.", source: "https://security-legislation.ly/latest-laws/law-no-17-of-2013-on-the-election-of-the-constituent-assembly-in-charge-of-drafting-the-constitution/"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Selon Minority Rights Group (mise à jour 2018), des écoles ont commencé à enseigner le tamazight avec des manuels conçus par des responsables amazighs, mais les enseignants qualifiés manquent ; les Amazighs ont annoncé en 2013 le boycott de l'élection de l'Assemblée constituante, jugeant insuffisants les deux sièges réservés ; les projets de constitution de 2015 et 2016 maintiennent l'arabe comme seule langue officielle.", source: "https://minorityrights.org/communities/imazighen/"}
chronologie:
  - {annee: 2004, evenement: "Le CERD relève des informations selon lesquelles la langue et la culture amazighes ne sont pas reconnues en Libye."}
  - {annee: 2011, evenement: "Déclaration constitutionnelle du 3 août : garantie des droits linguistiques et culturels des Amazighs, Toubous et Touaregs (art. 1)."}
  - {annee: 2013, evenement: "Loi n° 17 du 20 juillet sur l'élection de l'Assemblée constituante : la répartition des sièges doit assurer la représentation des composantes à caractère culturel et linguistique (art. 5 et tableau annexé)."}
  - {annee: 2013, evenement: "Loi n° 18 du 30 juillet sur les droits des composantes culturelles et linguistiques, publiée au Journal officiel le 25 septembre."}
  - {annee: 2015, evenement: "Élection du Haut Conseil amazigh en août, selon Minority Rights Group."}
