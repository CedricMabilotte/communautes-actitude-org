resume: >-
  Oxchuc est une commune tseltal des Hauts du Chiapas. Après des conflits post-électoraux en 2015 et 2016, des communautés obtiennent du Tribunal électoral du Chiapas (2017) une consultation sur l'élection des autorités municipales selon leur système normatif interne (règles propres, dites « us et coutumes »), sans partis politiques ; le Congrès l'autorise par le décret 135 de janvier 2019. Le 13 avril 2019, environ 12 000 personnes de 115 localités élisent l'ayuntamiento (conseil municipal) à main levée en une seule assemblée. L'élection du 15 décembre 2021 est interrompue par des violences et déclarée inachevée ; des conseils municipaux désignés par le Congrès gouvernent de 2022 à février 2025, date à laquelle une nouvelle élection selon le système normatif interne (présidence aux urnes, autres sièges à main levée) désigne l'ayuntamiento 2025-2028.
