droits:
  autogouvernement: {valeur: "reconnu", note: "La Constitution du Chiapas (art. 7 A XVI et art. 80, réforme du 24 juin 2020) dispose que les communes autochtones régies par systèmes normatifs internes élisent leurs autorités selon leurs normes ; à Oxchuc, l'ayuntamiento (présidence, syndicature et six régidurías, c'est-à-dire sièges de conseillers) est élu selon ce système en 2019 puis en 2025, après une période de conseils désignés par le Congrès (2022-2025).", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0002.pdf"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution du Chiapas (art. 7 A I et II) reconnaît l'application des systèmes normatifs propres dans le respect des constitutions ; en 2019, l'Assemblée générale permanente d'Oxchuc adopte quarante normes électorales, validées par l'Institut électoral de l'État (accord IEPC/CG-A/016/2019) avec ses observations.", source: "https://www.redalyc.org/journal/1514/151468725008/html/"}
  justice_propre: {valeur: "partiel", note: "La Constitution du Chiapas (art. 7 A II) reconnaît une juridiction autochtone exercée par les autorités communautaires, dans le cadre de l'ordre juridique en vigueur, avec validation par les juges selon les cas prévus par la loi. Le 14 septembre 2026, l'assemblée des communautés et des barrios d'Oxchuc décide une interdiction permanente de la vente d'alcool et de drogues, assortie d'une amende de 300 000 pesos (La Jornada, 2026) ; la validation de ces décisions par un juge n'a pas été vérifiée.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0002.pdf"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "La Constitution du Chiapas (art. 7 A IX) accorde aux communautés l'usage préférentiel des ressources naturelles des lieux qu'elles habitent, sauf les domaines stratégiques et les droits acquis par des tiers.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0002.pdf"}
  consentement: {valeur: "partiel", note: "Le changement de mode d'élection a été précédé d'une consultation des localités selon les standards du consentement libre, préalable et éclairé, ordonnée par la décision TEECH/JDC/019/2017 ; l'assemblée plénière du 5 janvier 2019 en a proclamé le résultat. La Constitution du Chiapas (art. 7 A XIX) prévoit la consultation des peuples autochtones en vue d'obtenir leur consentement.", source: "https://www.redalyc.org/journal/1514/151468725008/html/"}
  langue: {valeur: "partiel", note: "La loi générale des droits linguistiques (art. 4, 2003) fait des langues autochtones, dont le tseltal, des langues nationales ayant la même validité que l'espagnol ; la Constitution du Chiapas (art. 7 A V) prévoit leur usage dans les espaces publics.", source: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGDLPI.pdf"}
  education: {valeur: "partiel", note: "La Constitution du Chiapas (art. 7 A VI) prévoit la participation des peuples autochtones à la construction des modèles éducatifs.", source: "https://www.congresochiapas.gob.mx/new/Info-Parlamentaria/LEY_0002.pdf"}
  fiscalite: {valeur: "partiel", note: "Les communes administrent librement leur hacienda (finances communales) selon l'art. 115 IV de la Constitution fédérale ; l'Assemblée d'Oxchuc a retenu l'ayuntamiento de l'art. 115 comme forme de gouvernement, sans régime fiscal propre (Ocampo, 2020).", source: "https://www.redalyc.org/journal/1514/151468725008/html/"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "L'élection de 2019 a lieu selon le système normatif interne ; celle du 15 décembre 2021 est interrompue par des violences ayant fait des morts et reste inachevée, et le Congrès du Chiapas désigne un conseil municipal provisoire à partir du 1er janvier 2022 (Cosh Pale, 2023). Une nouvelle élection selon le système normatif interne a lieu les 23 et 26 février 2025, et l'ayuntamiento prête serment le 1er mars 2025 sous protection policière (El Universal, 2025).", source: "https://www.scielo.org.mx/scielo.php?script=sci_arttext&pid=S2007-76102023000100103"}
chronologie:
  - {annee: 1950, evenement: "Première « assemblée générale communautaire unique » : élection d'un président municipal tseltal, Sebastián López Ch'ijk."}
  - {annee: 2016, evenement: "Conflit post-électoral et recours devant les tribunaux électoraux ; le 11 novembre, la Commission permanente pour la paix et la justice d'Oxchuc demande l'élection par système normatif interne."}
  - {annee: 2017, evenement: "Refus de l'Institut électoral (accord IEPC/CG-005/2017, 10 février) ; décision TEECH/JDC/019/2017 (28 juin) ordonnant d'étudier la viabilité du système normatif."}
  - {annee: 2018, evenement: "Report de l'élection municipale (décret du 2 avril) ; expertise anthropologique de l'Institut national d'anthropologie et d'histoire remise le 19 septembre ; assemblées de consultation dans les localités."}
  - {annee: 2019, evenement: "Résultat de la consultation (5 janvier) ; décret 135 (23 janvier) ; Assemblée générale installée (24 février) ; normes validées par l'Institut électoral (mars) ; élection en une seule assemblée (13 avril)."}
  - {annee: 2020, evenement: "Réforme de la Constitution du Chiapas (24 juin) reconnaissant les communes régies par systèmes normatifs internes (art. 80, 100 et 101)."}
  - {annee: 2021, evenement: "Élection du 15 décembre interrompue par des violences ; l'Institut électoral la déclare inachevée (accord IEPC/CG-A/253/2021, 21 décembre) ; le Congrès désigne un conseil municipal (décret 106, 31 décembre)."}
  - {annee: 2022, evenement: "Le Tribunal électoral du Chiapas ordonne un nouveau processus de désignation selon le système normatif (10 février) ; le Congrès désigne un nouveau conseil municipal (28 février)."}
  - {annee: 2025, evenement: "Lignes directrices validées (accord IEPC/CG-A/012/2025, 21 janvier) ; présidence municipale élue aux urnes (23 février), syndicature et régidurías à main levée (26 février) ; prestation de serment (1er mars)."}
  - {annee: 2026, evenement: "Après la mort de deux jeunes femmes renversées par un conducteur ivre (3 septembre), l'assemblée des communautés et des barrios décide le 14 septembre une interdiction permanente de la vente d'alcool et de drogues, avec une amende de 300 000 pesos (La Jornada, 16 septembre)."}
