resume: >-
  Les terres communautaires d'origine (TCO, propriété collective d'un peuple autochtone) sont créées par la loi 1715 de 1996 sur le Service national de réforme agraire, dite loi INRA. La Constitution de 2009 prévoit leur conversion en territoires indigènes originaires paysans (TIOC) par une démarche administrative (disposition transitoire septième) et déclare la propriété collective indivisible, imprescriptible, insaisissable, inaliénable, irréversible et exempte de l'impôt sur la propriété agraire (art. 394.III). Elle reconnaît sur ces territoires l'usage exclusif des ressources renouvelables, la consultation préalable et l'application des normes propres (art. 403). Selon l'Institut national de réforme agraire (INRA), les TIOC/TCO couvrent 26 010 254 ha en 2024, soit 27 % de la structure de la propriété rurale. La fiche couvre le régime foncier ; les autonomies indigènes originaires paysannes (AIOC, gouvernements territoriaux) relèvent d'un autre régime.
