reconnaissance_onu:
  - {mecanisme: "rapporteur_special", detail: "Rapport de mission en Bolivie du Rapporteur spécial Rodolfo Stavenhagen (A/HRC/11/11), § 29 à 33 et 87 : description des TCO, retards de titrage, appropriations illégales ; recommandation de priorité au titrage des TCO.", annee: 2009, source: "https://documents.un.org/api/symbol/access?s=A/HRC/11/11&l=fr&t=pdf"}
  - {mecanisme: "oit_169", detail: "La Bolivie ratifie la Convention 169 de l'OIT le 11 décembre 1991.", annee: 1991, source: "https://treaties.un.org/Pages/showDetails.aspx?objid=08000002800c0136&clang=_en"}
base_nationale:
  - {instrument: "Loi 1715 du Service national de réforme agraire (loi INRA), art. 41.I.5", nature: "loi", annee: 1996, source: "https://bolivia.infoleyes.com/articulo/24116"}
  - {instrument: "Constitution politique de l'État plurinational de Bolivie, art. 30.II, 190, 394.III, 403 et disposition transitoire septième", nature: "constitution", annee: 2009, source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  - {instrument: "Loi 073 de délimitation juridictionnelle (Ley de Deslinde Jurisdiccional), art. 10", nature: "loi", annee: 2010, source: "https://www.lexivox.org/norms/BO-L-N73.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "La Constitution (art. 403.I) reconnaît la faculté d'appliquer les normes propres, administrées par les structures de représentation du territoire ; le gouvernement territorial complet passe par la voie distincte de l'autonomie (art. 293).", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  pouvoir_normatif: {valeur: "partiel", note: "La Constitution (art. 403.I) reconnaît l'application des normes propres sur le territoire et la définition de son développement selon les critères culturels du peuple.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  justice_propre: {valeur: "partiel", note: "La Constitution (art. 190) reconnaît la juridiction indigène originaire paysanne, exercée par les autorités propres selon leurs normes et procédures ; la loi 073 de 2010 (art. 10) en exclut notamment les homicides, les viols, les affaires où l'État est partie, le droit agraire hors répartition interne des terres, le droit minier, forestier et des hydrocarbures.", source: "https://www.lexivox.org/norms/BO-L-N73.html"}
  terres: {valeur: "reconnu", note: "La loi 1715 de 1996 (art. 41.I.5) définit les TCO comme inaliénables, indivisibles, irréversibles, collectives, insaisissables et imprescriptibles ; la Constitution (art. 394.III et 30.II.6) garantit la propriété collective et le titrage collectif.", source: "https://bolivia.infoleyes.com/articulo/24116"}
  ressources: {valeur: "partiel", note: "La Constitution (art. 403.I et 30.II.17) donne l'usage exclusif des ressources renouvelables dans les conditions fixées par la loi ; pour les ressources non renouvelables, seuls la consultation et un partage des bénéfices sont prévus.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  consentement: {valeur: "partiel", note: "La Constitution (art. 30.II.15 et 403.I) impose une consultation préalable, obligatoire et de bonne foi, sans exiger le consentement.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  langue: {valeur: "reconnu", note: "La Constitution (art. 5.I) fait des 36 langues des nations et peuples indigènes originaires paysans des langues officielles de l'État.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  education: {valeur: "partiel", note: "La Constitution (art. 30.II.12) garantit une éducation intraculturelle, interculturelle et plurilingue, sans système scolaire propre au territoire.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "partiel", note: "La Constitution (art. 146.VII) prévoit des circonscriptions spéciales indigènes originaires paysannes à la Chambre des députés, dans les départements où ces peuples sont minoritaires.", source: "https://www.constituteproject.org/constitution/Bolivia_2009.pdf?lang=es"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial des Nations unies relève en 2009 des retards de titrage des TCO, des surfaces reconnues inférieures aux territoires traditionnels sur l'Altiplano et des appropriations illégales de TCO dans les basses terres (A/HRC/11/11, § 31 à 33) ; l'INRA compte fin 2024 environ 148 propriétés TCO/TIOC, près d'un demi-million d'hectares, encore en attente de titre.", source: "https://documents.un.org/api/symbol/access?s=A/HRC/11/11&l=fr&t=pdf"}
chronologie:
  - {annee: 1990, evenement: "Marche pour le territoire et la dignité des peuples de l'Orient, du Chaco et de l'Amazonie ; l'État reconnaît les premiers territoires de peuples autochtones."}
  - {annee: 1996, evenement: "La loi 1715 (loi INRA) crée les terres communautaires d'origine et leur procédure de régularisation (saneamiento)."}
  - {annee: 2006, evenement: "La loi 3545 de reconduction communautaire de la réforme agraire relance le titrage."}
  - {annee: 2009, evenement: "La Constitution crée la catégorie TIOC et prévoit la conversion administrative des TCO (art. 394.III, 403, disposition transitoire septième)."}
  - {annee: 2010, evenement: "La loi 073 de délimitation juridictionnelle fixe le champ de la juridiction indigène originaire paysanne."}
  - {annee: 2024, evenement: "L'INRA compte 26 010 254 ha de TIOC/TCO dans la structure de la propriété rurale."}
fiabilite:
