resume: >-
  La Vallée d'Aoste est une région autonome à statut spécial (loi constitutionnelle n° 4 du 26 février 1948). Le statut place la langue française et la langue italienne sur un plan d'égalité et réserve au français autant d'heures d'enseignement qu'à l'italien. Le Conseil de la Vallée légifère dans les matières énumérées à l'article 2, dont les droits d'usage et les consorteries (communautés de copropriétaires de biens agricoles et forestiers). Les populations de langue allemande (walser) de la vallée du Lys ont des droits propres depuis 1993.
reconnaissance_regionale:
  - {mecanisme: "conseil_europe_fcnm", detail: "Sixième avis du Comité consultatif de la Convention-cadre sur l'Italie, § 19 et 61 : le français et le francoprovençal figurent parmi les douze minorités linguistiques historiques de la loi 482/1999 ; mention des fonds en français et en walser des bibliothèques de la Vallée d'Aoste.", annee: 2026, source: "https://rm.coe.int/acfc-op-vi-2025-5-sixth-opinion-on-italy-en/48802bdf6e"}
