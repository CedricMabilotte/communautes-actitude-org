base_nationale:
  - {instrument: "Statut spécial pour la Vallée d'Aoste (loi constitutionnelle n° 4 du 26 février 1948), texte coordonné avec la loi constitutionnelle n° 2 du 31 janvier 2001", nature: "statut_autonomie", annee: 1948, source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
droits:
  autogouvernement: {valeur: "reconnu", note: "La Vallée d'Aoste est constituée en Région autonome dotée de la personnalité juridique, Statut, art. 1 ; ses organes sont le Conseil de la Vallée, le Gouvernement régional et le Président de la Région, art. 15 ; le Conseil compte trente-cinq membres élus au suffrage universel direct, art. 16.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  pouvoir_normatif: {valeur: "reconnu", note: "La Région exerce le pouvoir législatif dans les matières énumérées, dont l'agriculture et les forêts, l'urbanisme, la chasse et la pêche, la toponymie, Statut, art. 2.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  justice_propre: {valeur: "partiel", note: "L'article 41 du Statut (nomination des juges conciliateurs par le Président de la Région) est inopérant depuis le remplacement du juge conciliateur par le juge de paix (loi 374 du 21 novembre 1991, Cour constitutionnelle, arrêt 150 de 1993) ; la loi 374/1991, art. 40, confie au Président de la Région la proposition de nomination, de révocation et de sanction des juges de paix, et son art. 41 exige d'eux la connaissance du français ; les actes judiciaires restent rédigés en italien, Statut, art. 38.", source: "https://www.regione.vda.it/giudicedipace/default_f.aspx"}
  terres: {valeur: "reconnu", note: "Pouvoir législatif sur les droits d'usage, les consorteries et les communautés de copropriétaires de biens agricoles et forestiers, Statut, art. 2, lettre o ; les forêts appartenant à l'État font partie du patrimoine indisponible de la Région, art. 6.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  ressources: {valeur: "reconnu", note: "Les eaux publiques et les mines sont données en concession gratuite à la Région pour quatre-vingt-dix-neuf ans, renouvelable, Statut, art. 7 et 11 ; l'État lui cède les neuf dixièmes de la redevance hydroélectrique, art. 12.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  consentement: {valeur: "partiel", note: "Les adaptations des programmes scolaires sont approuvées après consultation de commissions mixtes comprenant des représentants du Conseil de la Vallée, Statut, art. 40 ; les décrets d'application sont préparés par une commission paritaire État-Région, art. 48 bis.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  langue: {valeur: "reconnu", note: "En Vallée d'Aoste la langue française et la langue italienne sont sur un plan d'égalité ; les actes publics peuvent être rédigés dans l'une ou l'autre, Statut, art. 38.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  education: {valeur: "reconnu", note: "Dans les écoles qui dépendent de la Région, le français reçoit chaque semaine autant d'heures que l'italien et certaines matières peuvent être enseignées en français, Statut, art. 39 ; l'enseignement de l'allemand est garanti aux populations walser, art. 40 bis.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  fiscalite: {valeur: "reconnu", note: "La Vallée peut créer des impôts et des surtaxes ; l'État lui attribue une quote-part des impôts qu'il perçoit, Statut, art. 12.", source: "https://www.regione.vda.it/allegato.aspx?pk=34495"}
  representation: {valeur: "partiel", note: "La Constitution italienne attribue à la Vallée d'Aoste un sénateur, par dérogation au minimum de trois sénateurs par région, art. 57, et un délégué à l'élection du Président de la République, art. 83.", source: "https://www.cortecostituzionale.it/documenti/download/pdf/Costituzione_della_Repubblica_italiana.pdf"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Statut place le français à égalité avec l'italien ; selon les données compilées par l'Université Laval (enquête de la Fondation Émile-Chanoux, 2001), l'italien est la langue maternelle de 71,5 % des habitants, le francoprovençal et les patois de 16,2 % et le français de 0,99 %.", source: "https://www.axl.cefan.ulaval.ca/europe/italieaoste.htm"}
chronologie:
  - {annee: 1561, evenement: "Édit de Rivoli : le duc Emmanuel-Philibert impose le français dans les actes publics de la vallée."}
  - {annee: 1948, evenement: "Loi constitutionnelle n° 4 du 26 février portant Statut spécial."}
  - {annee: 1991, evenement: "Loi 374 du 21 novembre créant le juge de paix ; le Président de la Région propose la nomination des juges de paix (art. 40)."}
  - {annee: 1993, evenement: "Loi constitutionnelle n° 2 du 23 septembre : article 40 bis sur les populations walser de la vallée du Lys ; arrêt 150 de la Cour constitutionnelle déclarant inopérant l'article 41 du Statut."}
  - {annee: 1999, evenement: "Loi 482/1999 sur les minorités linguistiques historiques (français, francoprovençal)."}
  - {annee: 2001, evenement: "Loi constitutionnelle n° 2 du 31 janvier modifiant le Statut."}
  - {annee: 2025, evenement: "Référendum confirmatif sur la loi régionale 27/2025 (retour à trois votes de préférence) ; élection du Conseil de la Vallée le 28 septembre ; Renzo Testolin élu Président de la Région le 5 novembre."}
  - {annee: 2026, evenement: "Sixième avis du Comité consultatif de la Convention-cadre sur l'Italie, adopté le 11 février."}
