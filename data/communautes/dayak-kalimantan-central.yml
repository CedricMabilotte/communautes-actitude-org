base_nationale:
  - {instrument: "Peraturan Daerah Provinsi Kalimantan Tengah n° 16 de 2008 sur les institutions coutumières dayak au Kalimantan central (règlement régional du 18 décembre 2008), qui abroge le règlement n° 14 de 1998 sur la kedamangan", nature: "loi", annee: 2008, source: "https://jdih.kalteng.go.id/uploads/prokum-2012100111074767.PDF"}
  - {instrument: "Peraturan Daerah Provinsi Kalimantan Tengah n° 1 de 2010 modifiant le règlement n° 16 de 2008 (art. 40 et 41 : indemnités des fonctionnaires coutumiers)", nature: "loi", annee: 2010, source: "https://jdih.kalteng.go.id/storage/app/uploads/public/607/519/f20/607519f201a55920150753.pdf"}
  - {instrument: "Peraturan Gubernur Kalimantan Tengah n° 13 de 2009 sur les terres coutumières et les droits coutumiers sur la terre (arrêté du gouverneur), modifié par l'arrêté n° 4 de 2012", nature: "loi", annee: 2009, source: "https://jdih.kalteng.go.id/uploads/prokum-2012082710355416.pdf"}
  - {instrument: "Peraturan Gubernur Kalimantan Tengah n° 66 de 2016 sur l'aide provinciale au revenu fixe des damang, secrétaires de damang et mantir, modifié par l'arrêté n° 4 de 2017", nature: "loi", annee: 2016, source: "https://jdih.kalteng.go.id/uploads/14-2017-09-20-165143.pdf"}
droits:
  autogouvernement: {valeur: "partiel", note: "La kedamangan est une institution coutumière dayak dotée d'un territoire, d'une communauté et d'un droit coutumier (art. 1 (25) du règlement n° 16 de 2008) ; le Damang Kepala Adat est élu pour six ans, renouvelable une fois, par les chefs de village, les présidents des conseils de village et les mantir de son territoire (art. 11 et 18) ; des conseils coutumiers dayak (Dewan Adat Dayak) existent de la province au village (art. 4 et 5). Le bupati (chef de district) crée les kedamangan, nomme le damang élu, peut annuler l'élection et le révoque sur proposition du conseil coutumier de district (art. 6, 13 (3), 25 et 26).", source: "https://jdih.kalteng.go.id/uploads/prokum-2012100111074767.PDF"}
  pouvoir_normatif: {valeur: "partiel", note: "Le damang peut édicter des règlements de damang (Peraturan Damang) et des décisions (art. 10 (1) (d) du règlement n° 16 de 2008) ; les décisions des conseils de mantir sur la propriété, la gestion et la cession des terres coutumières, validées par le damang, sont des « dispositions juridiques qui lient chaque membre de la communauté coutumière dayak » (art. 9 de l'arrêté du gouverneur n° 13 de 2009, modifié en 2012). Les droits coutumiers ne sont reconnus que s'ils ne contredisent pas la législation (art. 36 (2) du règlement n° 16 de 2008).", source: "https://jdih.kalteng.go.id/uploads/prokum-2012100111074767.PDF"}
  justice_propre: {valeur: "partiel", note: "Le conseil de mantir du village est la juridiction coutumière de premier degré, celui du sous-district, présidé par le damang, la juridiction de dernier degré (art. 7 (3) et (4) et 9 (1) (b) du règlement n° 16 de 2008) ; tout litige coutumier qui lui est soumis doit être reçu et jugé (art. 27) ; ses décisions sont « définitives et lient les parties » (art. 28) ; les sanctions vont de l'avertissement à l'amende (singer), à la mise à l'écart des activités coutumières, à l'exclusion de la communauté du village et au retrait d'un titre honorifique coutumier (gelar adat) (art. 32) ; le damang peut aussi traiter des affaires relevant du droit pénal « selon l'usage coutumier » (art. 8 (c)). Pour la police et les tribunaux de l'État, la décision coutumière n'est qu'un élément d'appréciation (art. 29).", source: "https://jdih.kalteng.go.id/uploads/prokum-2012100111074767.PDF"}
  terres: {valeur: "partiel", note: "La terre coutumière détenue en commun, héritée des ancêtres, est assimilée au droit coutumier collectif sur la terre (hak ulayat) (art. 1 (20) du règlement n° 16 de 2008 ; art. 1 (13) de l'arrêté du gouverneur n° 13 de 2009) ; le damang délivre, après enquête du conseil de mantir et 21 jours d'affichage, une attestation de terre coutumière (SKT adat), au nom des héritiers pour la terre commune (art. 8 et 10 de l'arrêté) ; la terre commune ne peut être cédée sans décision collective selon le droit coutumier (art. 11 (4)). L'attestation n'est qu'une pièce pour l'enregistrement selon la loi agraire nationale de 1960 (commentaire de l'art. 10 (1) (d) du règlement) et la cession reste possible pour les besoins du développement (art. 11 (1) (a) de l'arrêté) ; une terre non inventoriée dans les six ans perd sa reconnaissance coutumière (art. 5 (d) et 14 (3)) ; l'annexe D de l'arrêté n° 4 de 2012 classe la terre coutumière commune comme « terre d'État non libre (ancien essart) ».", source: "https://jdih.kalteng.go.id/uploads/prokum-2012082710355416.pdf"}
  ressources: {valeur: "partiel", note: "Les « droits coutumiers sur la terre » (hak-hak adat di atas tanah) sont des droits collectifs ou individuels de gérer, de prélever et d'utiliser les ressources naturelles du sol et du sous-sol dans les forêts situées hors des terres coutumières (art. 1 (22) du règlement n° 16 de 2008) : gibier, fruits, latex, miel, plantes médicinales, sites religieux (annexe D de l'arrêté du gouverneur n° 4 de 2012) ; le damang gère les droits coutumiers et les biens de la kedamangan (art. 10 (1) (b) du règlement). Ces droits portent sur les produits et non sur le sol ; ils restent soumis à la législation nationale (art. 36 (2)).", source: "https://jdih.kalteng.go.id/uploads/prokum-2012051113260079.pdf"}
  consentement: {valeur: "partiel", note: "Les fonctionnaires de la kedamangan donnent une recommandation écrite avant toute cession de terre coutumière à un tiers ; quand la cession prend la forme d'un droit d'exploitation (Hak Guna Usaha) ou d'usage, la terre revient au titulaire coutumier à l'échéance et tout nouvel usage exige un « nouvel accord » (art. 5 (b) et (c) de l'arrêté du gouverneur n° 13 de 2009) ; une cession pour le développement exige une décision du conseil de mantir validée par le damang et ouvre droit à une compensation (art. 11 (2) et (3)). Le texte ne prévoit pas de droit de refus pour les projets de l'État.", source: "https://jdih.kalteng.go.id/uploads/prokum-2012082710355416.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "partiel", note: "La connaissance des coutumes, du droit coutumier et des droits coutumiers dayak doit être écrite, diffusée et intégrée aux programmes de l'école primaire et du secondaire comme matière locale (muatan lokal), ainsi qu'à la formation des fonctionnaires (art. 38 du règlement n° 16 de 2008) ; les conseils coutumiers dayak l'inscrivent à leur programme annuel avec les collectivités. Le texte ne crée pas d'écoles propres.", source: "https://jdih.kalteng.go.id/uploads/prokum-2012100111074767.PDF"}
  fiscalite: {valeur: "partiel", note: "La province doit financer les conseils coutumiers dayak provinciaux et les districts doivent inscrire à leur budget les kedamangan et les conseils de district, de sous-district et de village (art. 40 (1) et (2) du règlement n° 16 de 2008) ; depuis le règlement n° 1 de 2010, la province et les districts se partagent le versement d'un revenu fixe mensuel aligné sur l'indemnité de l'échelon III.b de la fonction publique pour les damang, IV.b et V.a pour les mantir (art. 40 (4) modifié) ; la part provinciale est fixée à 500 000 roupies pour un damang, versée tous les trois à six mois (art. 2 de l'arrêté du gouverneur n° 66 de 2016, modifié en 2017), les districts ajoutant un montant selon leurs moyens (art. 3). Le damang fixe les frais de procédure coutumière (art. 8 (l)). Aucun pouvoir d'imposition.", source: "https://jdih.kalteng.go.id/storage/app/uploads/public/607/519/f20/607519f201a55920150753.pdf"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "partiel", note: "Le damang célèbre le mariage coutumier et délivre les attestations de mariage, de contrat de mariage et de divorce coutumiers, à la demande des parties (art. 10 (1) (e) du règlement n° 16 de 2008) ; le commentaire précise que ce mariage s'ajoute au mariage religieux de la loi n° 1 de 1974 sans le remplacer. Les membres de la communauté sont les personnes de descendance dayak qui vivent selon les coutumes et le droit coutumier (art. 1 (37)) ; les résidents venus d'ailleurs doivent respecter le droit coutumier dayak local (art. 39).", source: "https://jdih.kalteng.go.id/uploads/prokum-2012100111074767.PDF"}
  autodetermination_externe: {valeur: "non_applicable", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les institutions fonctionnent : le district de Katingan installe un damang le 30 septembre 2026 avec confirmation coutumière par le conseil coutumier dayak (Antara, 2026) ; le district de Murung Raya verse depuis 2025 un revenu mensuel de 4 millions de roupies aux damang (Antara, 13 août 2026). En 2023, des élus de l'assemblée provinciale jugent les indemnités insuffisantes et demandent la révision du règlement de 2008, inchangé depuis 2010 (Antara, 20 décembre 2023). Une étude sur l'arrêté de 2009 relève des conflits fonciers, un écart entre droit coutumier et droit national et un manque d'information des communautés (Gorby et al., Perspektif, 2023).", source: "https://ojs.uma.ac.id/index.php/perspektif/article/view/10324"}
chronologie:
  - {annee: 1894, evenement: "Réunion de Tumbang Anoi (22 mai - 24 juillet) entre groupes dayak, en présence de l'administration néerlandaise : fin des expéditions guerrières et de l'esclavage, 96 articles de droit coutumier dits « Hadat 1894 » selon la tradition rapportée par la province."}
  - {annee: 1957, evenement: "Création de la province du Kalimantan central par la loi d'urgence n° 10 de 1957, confirmée par la loi n° 21 de 1958."}
  - {annee: 1998, evenement: "Règlement régional n° 14 de 1998 sur la kedamangan."}
  - {annee: 2008, evenement: "Règlement régional n° 16 de 2008 (18 décembre) sur les institutions coutumières dayak ; il abroge le règlement de 1998."}
  - {annee: 2009, evenement: "Arrêté du gouverneur n° 13 de 2009 (25 juin) sur les terres coutumières et l'attestation de terre coutumière délivrée par le damang ; délai de six ans pour inventorier les terres coutumières."}
  - {annee: 2010, evenement: "Règlement régional n° 1 de 2010 (25 février) : indemnités des damang et des mantir payées au plus tard en 2011."}
  - {annee: 2012, evenement: "Arrêté du gouverneur n° 4 de 2012 (15 mars) : modèles d'attestation de terre coutumière et tableau des formes de propriété coutumière."}
  - {annee: 2016, evenement: "Arrêté du gouverneur n° 66 de 2016 sur l'aide provinciale au revenu des damang et des mantir, revalorisée en 2017."}
  - {annee: 2023, evenement: "L'assemblée provinciale réunit les damang pour réviser le règlement de 2008."}
  - {annee: 2026, evenement: "L'assemblée de la ville de Palangka Raya annonce un projet de règlement sur le droit pénal coutumier pour son programme 2027."}
fiabilite:
  verifie: ["Règlement n° 16 de 2008 (copie numérisée du service juridique de la province, lue par reconnaissance de caractères) : art. 1, 4 à 13, 18, 25 à 40, 43 et commentaires des art. 7, 8 et 10.", "Règlement n° 1 de 2010 : art. 40 (4) (échelons III.b, IV.a, IV.b, V.a) et 41 (3), adopté le 25 février 2010, promulgué le 4 mars 2010.", "Arrêté du gouverneur n° 13 de 2009 (copie numérisée lue par reconnaissance de caractères) : art. 1 à 15.", "Arrêté du gouverneur n° 4 de 2012 : art. 9, 10, 14 et 15 A, annexes A à D.", "Arrêtés du gouverneur n° 66 de 2016 et n° 4 de 2017 : montants de l'aide provinciale (300 000 puis 500 000 roupies pour un damang, versés tous les trois à six mois) et complément des districts (art. 3).", "Résumé de l'étude de Gorby et al. (Perspektif, vol. 12, n° 4, 2023).", "Installation d'un damang à Katingan Hulu (Antara, 30 septembre 2026) ; revenu versé par le district de Murung Raya (Antara, 13 août 2026) ; travaux de révision (Antara, 20 décembre 2023) ; projet de règlement sur le droit pénal coutumier (Antara, 23 septembre 2026)."]
  non_confirme: ["Le « Hadat 1894 » (Tumbang Anoi) n'est cité ni dans le règlement n° 16 de 2008 ni dans l'arrêté de 2009 ; la référence vient d'un article du service d'information de la province (MMC Kalteng, 3 juillet 2025).", "Le règlement de 2008 donne l'indemnité du damang à l'échelon « II.b » dans la copie numérisée (lecture incertaine) ; le règlement de 2010 la fixe à l'échelon III.b.", "Nombre de kedamangan : une source secondaire indique 67, sans liste officielle trouvée ; valeur laissée vide.", "Population dayak de la province et surface des territoires coutumiers : aucun chiffre officiel ouvert.", "Nombre d'attestations de terre coutumière délivrées et suite donnée par l'administration foncière nationale : non trouvé.", "Aucun document onusien ou régional nommant les institutions de la kedamangan n'a été trouvé.", "Le règlement n° 16 de 2008 n'a pas été vérifié article par article contre une version consolidée postérieure à 2010 ; la révision annoncée en 2023 n'est pas adoptée selon les sources consultées."]
