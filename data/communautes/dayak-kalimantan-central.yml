resume: >-
  Le règlement régional (Peraturan Daerah, loi provinciale) n° 16 de 2008 de la province du Kalimantan central, modifié en 2010, définit les Dayak comme l'ensemble des groupes de population originaires de la province, titulaires de droits coutumiers et d'un droit coutumier propre. Il organise les institutions coutumières dayak : la kedamangan, territoire coutumier formé d'au moins cinq villages, dirigée par un Damang Kepala Adat (chef coutumier) élu pour six ans ; des conseils de mantir (assesseurs coutumiers) qui jugent les litiges coutumiers au village puis au sous-district ; des conseils coutumiers dayak (Dewan Adat Dayak) à chaque échelon administratif. Le damang délivre des attestations de terre coutumière (SKT adat), selon un arrêté du gouverneur de 2009. La province et les districts financent ces institutions et versent une indemnité aux damang et aux mantir.
