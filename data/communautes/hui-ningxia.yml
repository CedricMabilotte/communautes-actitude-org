  verifie: ["Articles 17, 19, 27, 28, 32, 36, 37, 47 et 65 de la loi sur l'autonomie régionale, version de 2001 (Wikisource).", "Articles 112, 114, 116, 117 et 121 de la Constitution (Constitute Project).", "Articles 8, 15 et 16 de la loi sur la promotion de l'unité et du progrès des nationalités (texte publié par le Quotidien du peuple, 14 mars 2026).", "E/C.12/CHN/CO/3, § 50 et 91.", "Projets de règlement d'autonomie du Ningxia et absence de règlement distinct (Yang Feng, 2017).", "Mosquées du Ningxia (Human Rights Watch, 22 novembre 2023).", "Population au septième recensement (China Daily, 25 mai 2021) ; superficie, année de création et subdivisions (fiche du ministère du Commerce) ; comités de villageois (Annuaire statistique du Ningxia 2025, tableau 1-1)."]
  non_confirme: ["Aucun endonyme distinct attesté n'a été retenu.", "La fiche couvre la région ; les préfectures et districts autonomes hui du Gansu, du Xinjiang et d'autres provinces relèvent de la fiche « Préfectures et districts autonomes de Chine ».", "Adoption d'un règlement d'autonomie ou d'un règlement distinct par le Ningxia après 2017 : aucune source trouvée.", "Les dispositions sur la langue visent la langue courante de la localité ; aucune source consultée ne précise la langue d'usage des Hui du Ningxia.", "Nombre de mosquées fermées au Ningxia : estimations citées par Human Rights Watch, non vérifiées sur une source onusienne."]
