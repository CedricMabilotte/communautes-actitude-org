resume: >-
  Les Hui, musulmans de langue chinoise, sont l'une des nationalités minoritaires reconnues par la Chine. La Région autonome hui du Ningxia, créée en 1958, relève du système d'autonomie régionale des nationalités prévu par la Constitution (art. 4 et 112 à 122) et par la loi de 1984 modifiée en 2001. Le droit prévoit des organes d'autogouvernement et un pouvoir de réglementation soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale. Le Ningxia a rédigé seize projets de règlement d'autonomie de 1980 à 2001 ; aucun n'a été soumis au pouvoir central.
