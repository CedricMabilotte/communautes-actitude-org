resume: >-
  Les Hui, population de religion musulmane, sont l'une des nationalités minoritaires reconnues par la Chine. La Région autonome hui du Ningxia, créée en 1958, relève du système d'autonomie régionale des nationalités prévu par la Constitution (art. 4 et 112 à 122) et par la loi de 1984 modifiée en 2001. Le droit prévoit des organes d'autogouvernement et un pouvoir de réglementation soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale. Le Ningxia a rédigé seize projets de règlement d'autonomie de 1980 à 2001 ; aucun n'avait été soumis au pouvoir central en 2017. La loi sur la promotion de l'unité et du progrès des nationalités, en vigueur depuis le 1er juillet 2026, fait de la langue commune nationale la langue de base de l'enseignement et de l'administration.
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Comité des droits économiques, sociaux et culturels, E/C.12/CHN/CO/3 (2023) : § 91, recommandation de protéger les pratiques religieuses des Hui, notamment par la protection et la restauration des sites religieux ; § 50, informations sur des mesures coercitives d'emploi visant notamment les Hui", annee: 2023, source: "https://docs.un.org/fr/E/C.12/CHN/CO/3"}
base_nationale:
  - {instrument: "Constitution de la République populaire de Chine, art. 4 et 112 à 122", nature: "constitution", annee: 1982, source: "https://www.constituteproject.org/constitution/China_2018"}
  - {instrument: "Loi sur l'autonomie régionale des nationalités (1984, modifiée en 2001)", nature: "loi", annee: 2001, source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  - {instrument: "Loi sur la promotion de l'unité et du progrès des nationalités (adoptée le 12 mars 2026, en vigueur le 1er juillet 2026)", nature: "loi", annee: 2026, source: "http://politics.people.com.cn/BIG5/n1/2026/0314/c1001-40681771.html"}
droits:
  autogouvernement: {valeur: "partiel", note: "Organes d'autogouvernement : assemblée populaire et gouvernement de la région ; le président de la région est un citoyen de la nationalité qui exerce l'autonomie (hui), Constitution, art. 112 et 114 ; loi sur l'autonomie régionale, art. 17 (2001). L'État « maintient et améliore » ce système, loi sur l'unité des nationalités, art. 8 (2026).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  pouvoir_normatif: {valeur: "conteste", note: "L'assemblée peut adopter un règlement d'autonomie et des règlements distincts, soumis à l'approbation du Comité permanent de l'Assemblée populaire nationale, Constitution, art. 116 ; loi sur l'autonomie régionale, art. 19 (2001). Le Ningxia a rédigé seize projets de règlement d'autonomie de 1980 à 2001, soumis au comité régional du Parti, sans adoption ; en 2017, aucune des cinq régions autonomes n'avait adopté de règlement distinct (Yang Feng, 2017).", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "Les organes d'autogouvernement définissent, conformément à la loi, la propriété et le droit d'usage des pâturages et des forêts, loi sur l'autonomie régionale, art. 27 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  ressources: {valeur: "partiel", note: "Gestion et protection des ressources naturelles et priorité d'exploitation dans le cadre des plans de l'État, loi sur l'autonomie régionale, art. 28 ; compensation due par l'État pour les ressources transférées hors de la région, art. 65 (2001).", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "partiel", note: "Les organes d'autogouvernement emploient la ou les langues d'usage courant dans la localité, Constitution, art. 121 ; tribunaux et parquets utilisent la langue courante de la localité, loi sur l'autonomie régionale, art. 47 (2001). Depuis 2026, les organes de l'État utilisent la langue commune nationale ; un document publié en langue minoritaire doit aussi l'être dans cette langue, loi sur l'unité des nationalités, art. 15.", source: "http://politics.people.com.cn/BIG5/n1/2026/0314/c1001-40681771.html"}
  education: {valeur: "partiel", note: "Les organes d'autogouvernement décident, selon les orientations de l'État, des programmes, des écoles et de la langue d'enseignement, loi sur l'autonomie régionale, art. 36 et 37 (2001). Depuis 2026, la langue commune nationale est la langue de base de l'enseignement et les écoles utilisent les manuels nationaux unifiés, loi sur l'unité des nationalités, art. 15 et 16.", source: "http://politics.people.com.cn/BIG5/n1/2026/0314/c1001-40681771.html"}
  fiscalite: {valeur: "partiel", note: "Les finances de la zone autonome forment un niveau propre ; les recettes qui lui reviennent sont gérées par les organes d'autogouvernement, loi sur l'autonomie régionale, art. 32 (2001) ; Constitution, art. 117.", source: "https://en.wikisource.org/wiki/Law_of_the_People's_Republic_of_China_on_Regional_National_Autonomy_(2001)"}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Les organes d'autogouvernement existent, mais le pouvoir normatif propre n'a pas été exercé : aucun règlement d'autonomie ni règlement distinct adopté en 2017 (Yang Feng, 2017). Human Rights Watch (2023) documente la fermeture, la démolition ou la transformation de mosquées au Ningxia depuis 2018, en application d'un document du comité régional du Parti sur la « sinisation » de l'islam ; le Comité des droits économiques, sociaux et culturels (2023, § 91) recommande de protéger les pratiques religieuses des Hui.", source: "http://manoa.hawaii.edu/aplpj/wp-content/uploads/sites/120/2017/06/2017-0531-APLPJ-Volume-18.2-3-Feng-compressed.pdf"}
chronologie:
  - {annee: 1958, evenement: "Création de la Région autonome hui du Ningxia."}
  - {annee: 1980, evenement: "Début de la rédaction d'un règlement d'autonomie."}
  - {annee: 1994, evenement: "Quinzième projet de règlement d'autonomie, soumis au comité régional du Parti."}
  - {annee: 2001, evenement: "Révision de la loi sur l'autonomie régionale ; seizième projet de règlement d'autonomie."}
  - {annee: 2018, evenement: "Document du comité régional du Parti sur le travail relatif à l'islam ; début de la « consolidation » des mosquées (Human Rights Watch)."}
  - {annee: 2023, evenement: "Observations du CDESC sur les pratiques religieuses des Hui ; rapport de Human Rights Watch sur les mosquées du Ningxia et du Gansu."}
  - {annee: 2026, evenement: "Adoption le 12 mars de la loi sur la promotion de l'unité et du progrès des nationalités, en vigueur le 1er juillet."}
