resume: >-
  La Constitution du Myanmar de 2008 crée cinq zones auto-administrées (Naga, Danu, Pa-O, Pa Laung, Kokang) et une division auto-administrée (Wa), chacune nommée d'après un groupe national (« national race »). Chaque unité est dirigée par un organe dirigeant (Leading Body) d'au moins dix membres, composé des élus de ses townships (circonscriptions de base) à l'assemblée de l'État ou de la région, de militaires désignés par le commandant en chef pour un quart des sièges et de membres choisis par les premiers. L'organe dirigeant légifère sur une liste de matières locales (annexe 3) et prépare un budget soumis à l'approbation du gouvernement de l'État ou de la région. Depuis le coup d'État de 2021, la zone kokang et la division wa sont administrées de fait par des groupes armés. Les Naga de l'Inde relèvent de la fiche « Naga du Nagaland » ; la foresterie communautaire, de la fiche « Forêts communautaires du Myanmar ».
