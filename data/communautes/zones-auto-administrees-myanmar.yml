effectivite: {valeur: "contestee", note: "Crisis Group (briefing n° 180, 30 mai 2024) relève que Laukkaing (Laukkai), chef-lieu de la zone kokang, est tombée le 5 janvier 2024 aux mains de l'armée de l'Alliance démocratique nationale du Myanmar (MNDAA), qui suit le modèle de l'Armée unie de l'État wa (UWSA), laquelle administre son territoire presque sans lien avec Naypyidaw. Crisis Group (briefing n° 188, 3 juin 2026) indique que les élections de décembre 2025 à janvier 2026, annulées dans une grande partie des zones de conflit, ramènent un gouvernement fondé sur la Constitution de 2008, et que la MNDAA a rendu Lashio à l'armée en avril 2025 dans le cadre d'un cessez-le-feu.", source: "https://www.crisisgroup.org/brf/asia-pacific/myanmar-china/b188-myanmars-new-administration-military-consolidation-not-transition"}
chronologie:
  - {annee: 2008, evenement: "La Constitution crée cinq zones et une division auto-administrées."}
  - {annee: 2021, evenement: "Coup d'État militaire du 1er février ; état d'urgence."}
  - {annee: 2024, evenement: "Chute de Laukkaing, chef-lieu de la zone kokang, aux mains de la MNDAA (5 janvier)."}
  - {annee: 2025, evenement: "Cessez-le-feu entre l'armée et la MNDAA, qui rend Lashio à l'armée en avril. Élections organisées par le régime militaire en trois phases, de décembre 2025 à janvier 2026."}
  - {annee: 2026, evenement: "Min Aung Hlaing élu président par le Parlement le 3 avril ; la nouvelle administration entre en fonction le 11 avril."}
