droits:
  autogouvernement: {valeur: "partiel", note: "Organe dirigeant de chaque zone ou division, formé des élus de ses townships à l'assemblée de l'État ou de la région, de militaires désignés par le commandant en chef (un quart des membres) et de membres choisis par ces deux groupes ; le président de l'organe, choisi parmi les élus, est nommé par le président de l'Union et répond au ministre en chef de l'État ou de la région, Constitution de 2008, art. 275 et 276.", source: "https://www.constituteproject.org/constitution/Myanmar_2008"}
  pouvoir_normatif: {valeur: "partiel", note: "L'organe dirigeant légifère sur les matières de l'annexe 3 (projets urbains et ruraux, routes et ponts, santé publique, affaires de développement, prévention des incendies, pâturages, environnement, forêts, eau et électricité des villes et villages, marchés), Constitution de 2008, art. 196 ; ses lois cèdent devant celles de l'Union et de l'État ou de la région, art. 198.", source: "https://www.constituteproject.org/constitution/Myanmar_2008"}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "partiel", note: "Entretien des pâturages, conservation des forêts et préservation de l'environnement naturel conformément aux lois de l'Union figurent parmi les matières de l'annexe 3 confiées à l'organe dirigeant, Constitution de 2008, art. 196.", source: "https://www.constituteproject.org/constitution/Myanmar_2008"}
  consentement: {valeur: "non_etabli", note: "", source: ""}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "", source: ""}
  fiscalite: {valeur: "partiel", note: "L'organe dirigeant établit un budget annuel soumis pour approbation au gouvernement de l'État ou de la région et dépense les fonds qui lui sont alloués par la loi budgétaire de l'État ou de la région, Constitution de 2008, art. 279 ; aucun impôt propre n'est prévu.", source: "https://www.constituteproject.org/constitution/Myanmar_2008"}
  representation: {valeur: "partiel", note: "Constitution de 2008, art. 141(a) : chacun des États et régions élit douze représentants à l'Amyotha Hluttaw (chambre des nationalités), dont un pour chaque zone ou division auto-administrée ; ce siège revient à la zone, non au peuple titulaire.", source: "https://www.constituteproject.org/constitution/Myanmar_2008"}
