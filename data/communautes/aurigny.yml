resume: >-
  Aurigny est l'une des trois juridictions du bailliage de Guernesey, dépendance de la Couronne britannique (territoire rattaché au souverain sans faire partie du Royaume-Uni). La Government of Alderney Law, 2004 (loi sur le gouvernement d'Aurigny), en vigueur depuis le 1er mai 2005, confie les fonctions législatives et exécutives aux États d'Aurigny, un président et 10 membres élus, et les fonctions judiciaires à la Cour d'Aurigny. Par l'accord de 1948, Guernesey assure la police, les douanes, l'aéroport, la santé, l'éducation et les services sociaux de l'île, et y lève en contrepartie ses impôts. Deux membres des États d'Aurigny siègent comme représentants de l'île aux États de délibération de Guernesey.
