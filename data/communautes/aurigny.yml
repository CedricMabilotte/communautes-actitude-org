droits:
  autogouvernement: {valeur: "reconnu", note: "Les États d'Aurigny se composent de 10 membres et d'un président, tous élus au scrutin secret ; ils exercent toutes les fonctions législatives et exécutives de l'île, Government of Alderney Law, 2004, sections 1 et 27.", source: "https://alderney.gov.gg/CHttpHandler.ashx?id=131855&p=0"}
  pouvoir_normatif: {valeur: "partiel", note: "Les États adoptent des projets de loi (Projets de Loi) soumis à la sanction royale et des ordonnances « pour le bon ordre et le gouvernement » de l'île et de ses eaux territoriales, Government of Alderney Law, 2004, section 46 ; le maintien de l'ordre et les services transférés en 1948 (police, douanes, aéroport, santé, éducation, services sociaux, immigration) relèvent de la législation de Guernesey, Alderney (Application of Legislation) Law, 1948.", source: "https://alderney.gov.gg/Government"}
  justice_propre: {valeur: "partiel", note: "La Cour d'Aurigny, composée de jurés (Jurats, juges non professionnels issus de la population) nommés par le lieutenant-gouverneur, exerce les fonctions judiciaires de l'île, Government of Alderney Law, 2004, sections 2 et 5 ; compétence civile illimitée, peines pénales plafonnées à 12 mois d'emprisonnement, appel devant la Cour royale de Guernesey. Les juges sont nommés par le représentant de la Couronne.", source: "https://courtofalderney.gg/article/158000/Criminal-Court"}
  terres: {valeur: "non_etabli", note: "", source: ""}
  ressources: {valeur: "non_etabli", note: "", source: ""}
  consentement: {valeur: "partiel", note: "Les lois de Guernesey s'appliquent à Aurigny comme législation de tout le bailliage avec le consentement des États d'Aurigny (note CBP-8611, 2025) ; pour les services transférés, les États de délibération légifèrent pour Aurigny en vertu de l'Alderney (Application of Legislation) Law, 1948, annexe 1.", source: "https://researchbriefings.files.parliament.uk/documents/CBP-8611/CBP-8611.pdf"}
  langue: {valeur: "non_etabli", note: "", source: ""}
  education: {valeur: "non_etabli", note: "L'éducation fait partie des services transférés à Guernesey par l'accord de 1948.", source: "https://alderney.gov.gg/Government"}
  fiscalite: {valeur: "partiel", note: "Les résidents paient les impôts et droits de Guernesey en contrepartie des services transférés (accord de 1948) ; depuis le 1er janvier 2021, les États d'Aurigny lèvent leur propre impôt foncier (Property Tax), administré pour leur compte par Guernesey, et fixent et perçoivent les droits sur les carburants et sur les actes de vente immobilière ; le budget annuel est préparé par le comité de la politique et des finances, Government of Alderney Law, 2004, section 58.", source: "https://alderney.gov.gg/property-tax"}
  representation: {valeur: "reconnu", note: "Deux représentants d'Aurigny siègent aux États de délibération de Guernesey, nombre fixé par la Reform (Guernsey) Law, 1948 et la States of Guernsey (Representation of Alderney) Law, 1978.", source: "https://gov.gg/bailiwickcommission-relationships"}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "effective", note: "En septembre 2020, Bailiwick Express rapporte le vote unanime des États d'Aurigny transférant au budget de l'île, à partir de janvier 2021, les droits sur les carburants et sur les actes, après la loi sur l'impôt foncier adoptée la même année. Les services principaux restent gérés par Guernesey au titre de l'accord de 1948.", source: "https://www.bailiwickexpress.com/news-ge/alderney-takes-control-more-local-taxes/"}
chronologie:
  - {annee: 1948, evenement: "Accord par lequel Guernesey prend en charge les principaux services publics d'Aurigny ; Alderney (Application of Legislation) Law, 1948."}
  - {annee: 1949, evenement: "Les États d'Aurigny sont réorganisés et la fonction de président est créée."}
  - {annee: 1978, evenement: "States of Guernsey (Representation of Alderney) Law : représentation d'Aurigny aux États de délibération."}
  - {annee: 2005, evenement: "Entrée en vigueur de la Government of Alderney Law, 2004, le 1er mai."}
  - {annee: 2021, evenement: "Impôt foncier propre d'Aurigny, droits sur les carburants et sur les actes immobiliers versés au budget de l'île."}
  - {annee: 2024, evenement: "Depuis le 29 février, les projets de loi des États d'Aurigny reçoivent la sanction royale du lieutenant-gouverneur, sauf projets réservés au roi."}
