resume: >-
  La loi de 1994 sur la restitution des droits fonciers (Restitution of Land Rights Act n° 22) permet à une communauté dépossédée après 1913 de réclamer la restitution de ses terres, y compris lorsqu'elles ont été intégrées à un parc national. Dans plusieurs parcs, la propriété a été rendue à la communauté, constituée en association de propriété communale (CPA), qui accepte en contrepartie que la terre reste parc national sous un accord contractuel (« contractual park », parc contractuel) avec l'office des parcs nationaux SANParks et un conseil de gestion conjoint (Joint Management Board). Le dispositif a été appliqué à la région de Makuleke du parc Kruger (restitution de 1999, accord de 50 ans révisable après 25 ans), au parc de Kgalagadi (accord !Ae!Hai de 2002, 99 ans, avec les ‡Khomani San et la communauté de Mier). Le parc national du Richtersveld, sur des terres de la communauté du Richtersveld, est aussi géré par un conseil de gestion conjoint, et SANParks verse un loyer aux demandeurs. À Vaalbos, la terre a été déclassée et remise à la communauté de Sydney-on-Vaal ; à Augrabies (Riemvasmaak), Addo (COLCRA) et Golden Gate (Dithabeng), des accords sont en négociation.
  Les ‡Khomani San et la communauté du Richtersveld ont leurs fiches propres (« ‡Khomani San du Kalahari », « Communauté nama du Richtersveld »).
