effectivite: {valeur: "partielle", note: "Le Rapporteur spécial de l'ONU (2005) reprend le constat de la Commission sud-africaine des droits de l'homme : cinq ans après le règlement, les conditions de vie des ‡Khomani San ne s'étaient pas sensiblement améliorées, l'association était divisée et la gestion des terres du Kalahari était « incoherent ». Pour les autres revendications sur le parc Kruger, le compte rendu parlementaire de 2021 rapporte qu'un mémorandum du Conseil des ministres de 2008 a jugé la restitution « not feasible » et que les demandeurs ont opté pour une indemnisation financière.", source: "https://documents.un.org/api/symbol/access?s=E/CN.4/2006/78/Add.2&l=en&t=pdf"}
chronologie:
  - {annee: 1994, evenement: "Loi n° 22 sur la restitution des droits fonciers (Journal officiel du 25 novembre)."}
  - {annee: 1995, evenement: "Dépôt de la revendication de la communauté de Makuleke sur le nord du parc Kruger."}
  - {annee: 1999, evenement: "Restitution de la région de Makuleke à la communauté, avec un accord contractuel de 50 ans et un conseil de gestion conjoint ; première phase du règlement de la revendication des ‡Khomani San (six fermes, environ 40 000 hectares hors parc)."}
  - {annee: 2002, evenement: "Accord !Ae!Hai Kalahari Heritage Park entre les ‡Khomani San, la communauté de Mier et SANParks, en vigueur le 28 mai, pour 99 ans."}
  - {annee: 2003, evenement: "Loi n° 57 sur les aires protégées : accords de cogestion avec une communauté locale (art. 42)."}
  - {annee: 2003, evenement: "La commission parlementaire du tourisme approuve le déclassement de Melkbosrand (4 137 hectares, parc d'Augrabies) au profit de la communauté de Riemvasmaak."}
  - {annee: 2008, evenement: "Un mémorandum du Conseil des ministres juge la restitution physique des autres terres revendiquées dans le parc Kruger non réalisable."}
  - {annee: 2016, evenement: "Accord de règlement de sept des quinze revendications déposées sur le parc Kruger, par indemnisation financière."}
fiabilite:
  verifie: ["Art. 2 et 35 (2) de la loi n° 22 de 1994 (gov.za).", "Art. 41 (2) (e), 42 (1) à (3) et 53 (1) de la loi n° 57 de 2003 (gov.za, version publiée au Journal officiel n° 26025).", "Liste des conseils de gestion conjoints et des négociations en cours (page SANParks sur les revendications foncières).", "Accord Makuleke de 50 ans révisable après 25 ans, faculté de retrait avec préavis de cinq ans, accord !Ae!Hai de 99 ans en vigueur le 28 mai 2002 et partage des revenus des lodges (exposé de SANParks au Parlement, 30 août 2016, PMG).", "Dépôt de la revendication en 1995, surface restituée à Makuleke (25 000 hectares), CPA, pouvoir de décision final du conseil de gestion conjoint, droits exclusifs de recherche et de tourisme, clause d'usage durable et part de 14 % du chiffre d'affaires d'un lodge (Polity, 2011).", "Mémorandum du Conseil des ministres de 2008 et accord de règlement de 2016 couvrant sept des quinze revendications sur le parc Kruger (PMG, 30 novembre 2021).", "§ 37 à 42 du rapport du Rapporteur spécial E/CN.4/2006/78/Add.2.", "Surface de Melkbosrand (4 137 hectares) et approbation du déclassement par la commission parlementaire en 2003 (PMG)."]
  non_confirme: ["Date de l'accord Makuleke : une date de 1998 circule ; SANParks (2016) et Polity (2011) datent la restitution de 1999 ; le texte de l'accord et l'ordonnance du tribunal des revendications foncières n'ont pas été consultés.", "Surface de la région de Makuleke : 25 000 hectares selon Polity, 198,42 km² revendiqués selon une source encyclopédique ; le site Ramsar des zones humides de Makuleke couvre 10 799 hectares.", "Population : Polity indique environ 10 500 personnes pour la communauté de Makuleke au moment du règlement et le Rapporteur spécial environ 300 membres pour la CPA ‡Khomani San ; aucun total pour le régime.", "Statut de Melkbosrand : le Parlement a approuvé le déclassement en 2003, mais SANParks présente encore un conseil de gestion conjoint en négociation « in lieu of Melkbosrand land inside the Augrabies National Park ».", "Date de proclamation et de l'accord contractuel du parc national du Richtersveld, et base de l'accord (restitution ou terres communales déjà détenues) : non vérifiées sur une source primaire ; date du déclassement de Vaalbos non vérifiée.", "Condition de non-réinstallation sur les terres restituées dans le parc Kruger : non vérifiée sur une source consultée.", "Année de dépôt de la revendication Makuleke : 1995 selon Polity, 1996 selon une source encyclopédique.", "Révision à 25 ans de l'accord Makuleke (prévue vers 2024) : aucun résultat publié trouvé.", "Aucun document de la CDB ni inscription au registre ICCA visant le régime n'a été trouvé.", "Surface totale : non trouvée ; la surface des terres communautaires incluses dans le parc national du Richtersveld n'a pas été trouvée sur une source ouverte, et le tableau ne totalise que Makuleke (25 000 ha), !Ae!Hai (25 000 ha) et Melkbosrand (4 137 ha).", "Nombre de villages : non trouvé. Polity (2011) nomme les villages de Makuleke et de Mhinga sans donner le nombre de villages de la communauté."]
