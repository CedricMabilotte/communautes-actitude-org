droits:
  autogouvernement: {valeur: "partiel", note: "La communauté propriétaire, constituée en association de propriété communale (CPA Makuleke, CPA ‡Khomani San), siège avec SANParks dans un conseil de gestion conjoint (Joint Management Board) ; dans le cas de Makuleke, ce conseil a le pouvoir de décision final sur la région. La gestion de la conservation reste à SANParks au titre de l'accord contractuel et de la loi n° 57 de 2003, art. 42 (1), qui permet à l'autorité de gestion de conclure un accord de cogestion avec « a local community ».", source: "https://www.polity.org.za/article/land-restitution-community-rights-and-conservation-a-success-story-2011-09-13"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La loi n° 22 de 1994 ouvre la restitution à une communauté (art. 2) et permet au tribunal de fixer les conditions de la restitution et la manière dont les droits sont détenus (art. 35 (2)). La propriété a été rendue aux communautés de Makuleke (1999) et aux ‡Khomani San et Mier (2002), sous condition que la terre reste dans le parc national ; l'accord Makuleke permet toutefois à la communauté de retirer sa terre du parc Kruger avec un préavis de cinq ans. La loi n° 57 de 2003, art. 53 (1), interdit d'appliquer ses dispositions sur l'accès aux aires protégées et la restriction des activités (art. 45, 46 et 49 à 52) de manière à faire obstacle au règlement des revendications foncières.", source: "https://www.gov.za/sites/default/files/gcis_document/201409/act22of1994.pdf"}
  ressources: {valeur: "partiel", note: "La communauté de Makuleke a obtenu des droits exclusifs de recherche et de développement touristique, et une clause d'« usage durable » prévoit l'usage commercial et consommatif de la faune ; le contrat d'un lodge lui verse 14 % du chiffre d'affaires. À Kgalagadi, selon l'exposé de SANParks au Parlement en 2016, les revenus du lodge !Xaus sont partagés entre les trois parties et un partage des bénéfices à parts égales est prévu pour le futur lodge Auob ; au Richtersveld, SANParks verse un loyer aux demandeurs. La loi n° 57 de 2003, art. 42 (2) (b), permet à un accord de cogestion de répartir les recettes de l'aire protégée.", source: "https://www.polity.org.za/article/land-restitution-community-rights-and-conservation-a-success-story-2011-09-13"}
  consentement: {valeur: "partiel", note: "Le plan de gestion d'une aire protégée doit prévoir des procédures de participation du public, y compris du propriétaire, de « any local community » et des autres parties intéressées (loi n° 57 de 2003, art. 41 (2) (e)). Le maintien des terres restituées dans le parc repose sur un accord signé par la communauté propriétaire. Aucune obligation de consentement préalable n'est prévue pour les décisions de gestion.", source: "https://www.gov.za/sites/default/files/gcis_document/201409/a57-03.pdf"}
