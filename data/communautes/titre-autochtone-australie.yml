effectivite: {valeur: "partielle", note: "La Commission australienne de réforme du droit (rapport 144, 2026) relève que, sur 200 actes futurs contestés soumis à l'arbitrage du Tribunal national du titre autochtone depuis 1994 (au 30 juin 2024), six ont été refusés, et que la procédure pousse les détenteurs du titre à accepter l'offre faite. Le CERD (2017) et le Comité des droits économiques, sociaux et culturels (2026) relèvent l'absence d'exigence de consentement préalable, libre et éclairé.", source: "https://www.alrc.gov.au/wp-content/uploads/2026/06/Fulfilling-the-Promise-of-Mabo-Reforming-the-Future-Acts-Regime-in-the-Native-Title-Act-1993-Cth-ALRC-Report-144-SUMMARY-REPORT.pdf"}
chronologie:
  - {annee: 1992, evenement: "Arrêt Mabo (n° 2) de la Haute Cour."}
  - {annee: 1993, evenement: "Native Title Act."}
  - {annee: 1996, evenement: "Arrêt Wik : coexistence du titre autochtone et des baux pastoraux."}
  - {annee: 1998, evenement: "Modification du Native Title Act à la suite de l'arrêt Wik."}
  - {annee: 2023, evenement: "Titre autochtone reconnu sur 3 321 766 km² (Tribunal national du titre autochtone)."}
  - {annee: 2026, evenement: "Observations finales du Comité des droits économiques, sociaux et culturels (février) ; rapport 144 de la Commission australienne de réforme du droit sur le régime des actes futurs, déposé au Parlement le 24 juin, qui indique que plus de 50 % de la masse continentale fait l'objet d'un titre autochtone déterminé."}
