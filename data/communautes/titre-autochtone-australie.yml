  ressources: {valeur: "partiel", note: "Selon les déterminations de la Cour fédérale (Native Title Act 1993), droits de chasser, pêcher et prélever bois, ocre et autres ressources ; le titre exclusif peut inclure l'usage des ressources à toute fin, y compris commerciale.", source: "https://www.clc.org.au/native-title/"}
  consentement: {valeur: "partiel", note: "Droit de négocier sur certains actes futurs (projets à venir), dont l'exploration et l'exploitation minières (Native Title Act 1993, sous-division P, à partir de la s. 25), sans droit de veto.", source: "https://www.clc.org.au/native-title/"}
