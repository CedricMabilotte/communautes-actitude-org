resume: >-
  Fiche agrégée. Depuis l'arrêt Mabo (1992) de la Haute Cour, qui a écarté la doctrine de la terra nullius, le droit australien reconnaît les droits des peuples aborigènes et des insulaires du détroit de Torres sur leurs terres et leurs eaux, antérieurs à la colonisation (titre autochtone, native title). Le Native Title Act 1993, loi fédérale, organise leur reconnaissance par la Cour fédérale, un droit de négocier sur certains projets et la gestion du titre par des personnes morales (Prescribed Bodies Corporate). Au 1er avril 2023, le titre autochtone était reconnu sur 3 321 766 km².
