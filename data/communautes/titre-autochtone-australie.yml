resume: >-
  Fiche agrégée. Depuis l'arrêt Mabo (1992) de la Haute Cour, qui a écarté la doctrine de la terra nullius, le droit australien reconnaît les droits des peuples aborigènes et des insulaires du détroit de Torres sur leurs terres et leurs eaux, antérieurs à la colonisation (titre autochtone, native title). Le Native Title Act 1993, loi fédérale, organise leur reconnaissance par la Cour fédérale, un droit de négocier sur certains projets et la gestion du titre par des personnes morales (Prescribed Bodies Corporate). Au 1er avril 2023, le titre autochtone était reconnu sur 3 321 766 km². Les règlements négociés en échange de l'abandon du titre autochtone font l'objet de fiches distinctes : « Noongar (sud-ouest de l'Australie-Occidentale) » et « Accords de règlement des propriétaires traditionnels (Victoria) ».
reconnaissance_regionale: []
reconnaissance_onu:
  - {mecanisme: "organe_traite", detail: "Le CERD relève des projets d'extraction menés sans consentement préalable, libre et éclairé sur des terres autochtones et recommande d'appliquer les principes de la Déclaration des Nations Unies sur les droits des peuples autochtones (CERD/C/AUS/CO/18-20)", annee: 2017, source: "https://documents.un.org/api/symbol/access?s=CERD/C/AUS/CO/18-20&l=fr&t=pdf"}
  - {mecanisme: "organe_traite", detail: "Le Comité des droits économiques, sociaux et culturels note que le régime des « actes futurs » du Native Title Act 1993 donne des droits de notification et de négociation mais n'exige pas le consentement préalable, libre et éclairé, et recommande de l'inscrire dans la loi (E/C.12/AUS/CO/6, par. 16-17)", annee: 2026, source: "https://documents.un.org/api/symbol/access?s=E/C.12/AUS/CO/6&l=fr&t=pdf"}
