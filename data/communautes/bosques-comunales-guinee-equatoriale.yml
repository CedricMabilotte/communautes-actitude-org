effectivite: {valeur: "non_etablie", note: "Le cinquième rapport national à la Convention sur la diversité biologique (2014) mentionne la légalisation de deux forêts communales en deux ans et relève le manque d'organisation de la population rurale en comités ; les Comunidades de Vecinos ou Consejos de Poblado, structures du ministère de l'Intérieur, jouent le rôle de comités locaux. Dans la couche cartographique, 11 des 49 forêts portent une date (2007 à 2012) et une référence de document. Aucune source indépendante sur la gestion effective n'a été trouvée.", source: "https://www.cbd.int/doc/world/gq/gq-nr-05-es.pdf"}
chronologie:
  - {annee: 1991, evenement: "Loi n° 3/1991 réglementant la matière forestière, abrogée en 1997."}
  - {annee: 1997, evenement: "Loi n° 1/1997 du 18 février 1997 sur l'usage et la gestion des forêts : création de la catégorie des forêts communales (art. 12 b et 24)."}
  - {annee: 2007, evenement: "Premières dates portées dans la couche cartographique, avec une référence de document (Elonglong, Andom Esangui, Alep Moñung)."}
  - {annee: 2013, evenement: "Lancement de l'Atlas forestier interactif de Guinée équatoriale, version 1.0, qui cartographie les forêts communales."}
  - {annee: 2014, evenement: "Cinquième rapport national à la Convention sur la diversité biologique : légalisation de deux forêts communales dans le cadre de REDD+."}
  - {annee: 2019, evenement: "Dernière modification de l'élément « Equatorial Guinea community forests » sur ArcGIS Online, le 2 avril 2019 (49 polygones, 58 665 ha calculés par SIG)."}
fiabilite:
  verifie:
    - "Articles 5, 12 b, 18, 22, 24 et 101 b de la loi n° 1/1997 dans la copie publiée par l'Observatoire des forêts d'Afrique centrale (COMIFAC) ; date de promulgation : 18 février 1997, Malabo."
    - "Passages du cinquième rapport national à la Convention sur la diversité biologique (mars 2014) sur les bosques comunales, les reservas comunales et les Consejos de Poblado."
    - "Couche « Equatorial Guinea community forests » (attribution : WRI Congo Basin Forest Atlas, licence CC BY 4.0 indiquée sur l'élément ArcGIS Online modifié le 2 avril 2019), interrogée le 1er octobre 2026 : 49 polygones, 40 avec un nom de village, 11 avec une date (2007 à 2012), 58 665 ha au total dans le champ sup_sig_ha ; le tableau reprend ces 49 entrées."
    - "Mention de la catégorie « bosques comunales » dans l'Atlas forestier interactif (article du WRI du 13 novembre 2013)."
  non_confirme:
    - "Aucun texte d'application (règlement) de la loi n° 1/1997 précisant la procédure de délimitation et de cession n'a été trouvé."
    - "La couche cartographique ne dit pas si chaque polygone correspond à une cession formalisée ; les documents référencés dans le champ « documento » ne sont pas publiés et leur nature n'est pas précisée. Les superficies du tableau sont calculées par SIG et diffèrent parfois de la superficie administrative du champ « superficie »."
    - "Une copie de 2023 de la couche, publiée par Global Forest Watch, compte 70 entrées, dont plusieurs sans nom ni superficie, et associe certains noms à d'autres superficies ; elle n'a pas été retenue pour le tableau. La couche officielle de l'administration forestière (Atlas_Forestal_Datos 2017) n'est pas accessible sans authentification."
    - "Population et nombre de villages concernés : aucune source trouvée."
    - "Aucune loi forestière postérieure abrogeant la loi n° 1/1997 n'a été trouvée ; le profil FAOLEX de la Guinée équatoriale liste des textes forestiers de 2017 et 2018 non examinés."
