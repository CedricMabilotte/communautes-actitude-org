  terres: {valeur: "partiel", note: "L'État reconnaît, délimite et cède en usage permanent (cesión de uso permanente : droit d'utiliser la forêt sans en devenir propriétaire) les forêts communales aux communautés rurales (loi n° 1/1997, art. 12 b) ; la Réserve forestière nationale est permanente, inaliénable et du domaine public, sans propriété privée (art. 5) ; l'occupation indue de terrains dans les forêts communales est un délit puni d'un mois à deux ans de prison (art. 101 b).", source: "https://www.observatoire-comifac.net/file/eyJtb2RlbCI6IkFwcFxcTW9kZWxzXFxOYXRpb25hbEluZGljYXRvcnNcXE1vZHVsZXNcXE4yXFxJbnN0cnVtZW50R2VzdGlvbiIsImZpZWxkIjoiZG9jdW1lbnQiLCJpZCI6NzN9"}
  ressources: {valeur: "partiel", note: "Dans les forêts communales, les habitants peuvent exercer des activités de subsistance (loi n° 1/1997, art. 24) ; toute extraction à des fins commerciales exige une autorisation préalable et le paiement d'un droit d'usage (art. 18) ; lors de l'extraction industrielle, le bois situé à moins de 2 000 m du Consejo de Poblado (conseil de village) ne peut pas être exploité, pour protéger les biens communautaires (art. 22).", source: "https://www.observatoire-comifac.net/file/eyJtb2RlbCI6IkFwcFxcTW9kZWxzXFxOYXRpb25hbEluZGljYXRvcnNcXE1vZHVsZXNcXE4yXFxJbnN0cnVtZW50R2VzdGlvbiIsImZpZWxkIjoiZG9jdW1lbnQiLCJpZCI6NzN9"}
