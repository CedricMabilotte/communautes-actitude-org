resume: >-
  Fiche agrégée : elle couvre les communautés rurales titulaires d'une forêt communale en Guinée équatoriale. La loi n° 1/1997 du 18 février 1997 sur l'usage et la gestion des forêts définit les bosques comunales (forêts communales) comme les forêts naturelles ou replantées que l'État reconnaît, délimite et cède en usage permanent aux communautés rurales en raison de leurs usages traditionnels, contiguës à la communauté (art. 12 b). Les habitants y exercent des activités de subsistance et les produits de l'exploitation sont destinés exclusivement au développement de la communauté (art. 24) ; la forêt reste dans la Réserve forestière nationale, du domaine public de l'État (art. 5, 10 et 12). La couche des forêts communales de l'Atlas forestier interactif, publié par le ministère de l'Agriculture et des Forêts avec le WRI, compte 49 polygones, tous dans la région continentale.
