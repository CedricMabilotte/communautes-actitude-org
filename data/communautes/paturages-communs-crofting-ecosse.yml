resume: >-
  Fiche agrégée : elle couvre les pâturages communs (common grazings), terres de colline partagées par les crofters (petits exploitants agricoles locataires sous un régime légal propre) d'un même township (hameau agricole) en Écosse. Le Crofters (Scotland) Act 1993, sections 47 à 52, permet aux crofters partageants de nommer en assemblée publique un comité des pâturages (grazings committee) pour trois ans, chargé d'entretenir et d'améliorer le pâturage et d'édicter des règlements confirmés par la Crofting Commission, l'autorité publique de régulation. La Crofting Commission recense plus de 1 000 pâturages communs couvrant plus de 500 000 hectares. Le Land Reform (Scotland) Act 2003, partie 3, ouvre aux communautés de crofters un droit d'achat des terres de crofting, dont les pâturages communs non répartis, sous réserve d'un vote majoritaire et de l'approbation des ministres écossais. Les droits d'achat communautaires sont décrits dans la fiche « Communautés propriétaires de terres (Écosse) ».
