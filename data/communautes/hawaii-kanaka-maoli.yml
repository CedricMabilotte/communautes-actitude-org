  non_confirme: ["Critère §0 : aucun gouvernement hawaïen n'est reconnu ; la fiche est retenue parce que la constitution d'Hawaï attribue au moins un droit de la grille (langue, terres réservées) à ce peuple. Le rattachement reste discutable.", "Règle du département de l'Intérieur de 2016 sur une procédure de rétablissement de relations de gouvernement à gouvernement : texte non consulté.", "Inscription d'Hawaï sur la liste onusienne des territoires non autonomes jusqu'en 1959 : non vérifiée sur une source onusienne.", "Conditions d'éligibilité aux terres de la Hawaiian Homes Commission (quotient de sang) : non vérifiées.", "Population : le Rapporteur spécial indique « environ un demi-million » de personnes s'identifiant en tout ou partie comme hawaïennes (2012) ; aucun chiffre récent consulté.", "Les sections du chap. 6K ont été lues sur la copie du site du Parlement d'Hawaï hébergée par capitolwebsite.azurewebsites.net, le site capitol.hawaii.gov refusant l'accès."]
