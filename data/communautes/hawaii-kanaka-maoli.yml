resume: >-
  Les Hawaïens autochtones sont le peuple de l'archipel d'Hawaï, État des États-Unis depuis 1959. Ils n'ont pas de gouvernement propre reconnu par le droit fédéral ; une règle du département de l'Intérieur de 2016 fixe la procédure par laquelle un tel gouvernement peut demander une relation de gouvernement à gouvernement avec les États-Unis. Une loi de l'État de 2011 les reconnaît comme le seul peuple autochtone d'Hawaï. La constitution de l'État d'Hawaï, révisée en 1978, crée l'Office of Hawaiian Affairs (Bureau des affaires hawaïennes), fait de l'hawaïen une langue officielle et reprend la loi fédérale sur les terres de la Hawaiian Homes Commission. En 1993, le Congrès a présenté des excuses pour le renversement du royaume d'Hawaï en 1893. Depuis 1993, l'île de Kaho'olawe et ses eaux sur deux milles forment une réserve réservée aux pratiques coutumières hawaïennes, à la conservation et à l'éducation, gérée par une commission de l'État ; la loi prévoit d'en transférer la gestion à l'entité souveraine hawaïenne lorsque celle-ci sera reconnue (HRS, chap. 6K, § 6K-3 et 6K-9). Les zones de pêche de subsistance gérées avec les communautés littorales font l'objet de la fiche « Zones de pêche de subsistance d'Hawaï ».
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis, qui avaient voté contre la Déclaration en 2007, ont déclaré leur appui le 16 décembre 2010 ; le Rapporteur spécial range les Hawaïens autochtones parmi les peuples autochtones des États-Unis (A/HRC/21/47/Add.1, § 1 et 80).", annee: 2010, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
  - {mecanisme: "organe_traite", detail: "Observations finales du Comité pour l'élimination de la discrimination raciale (CERD/C/USA/CO/10-12, 21 septembre 2022), § 49 d : le Comité cite les Hawaïens autochtones parmi les peuples dont la situation a été examinée dans sa procédure d'alerte rapide et d'action urgente, et relève une interprétation restrictive du consentement libre, préalable et éclairé (§ 49 c).", annee: 2022, source: "https://docs.un.org/en/CERD/C/USA/CO/10-12"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission aux États-Unis (A/HRC/21/47/Add.1), § 64 à 66 : absence de pouvoirs d'autogouvernement reconnus en droit fédéral, résolution d'excuses de 1993, appel à la réconciliation resté sans suite.", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
