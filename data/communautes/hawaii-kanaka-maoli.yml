  - {instrument: "Hawaiian Homes Commission Act (loi fédérale de 1921), reprise comme loi de l'État par l'art. XII § 1 de la constitution d'Hawaï", nature: "loi", annee: 1921, source: "https://dhhl.hawaii.gov/about/"}
  - {instrument: "Hawaii Revised Statutes, chap. 10H (loi 195 de 2011), § 10H-1 : reconnaissance des Hawaïens autochtones comme seul peuple autochtone d'Hawaï ; § 10H-3 : commission chargée de la liste des Hawaïens autochtones qualifiés", nature: "loi", annee: 2011, source: "https://capitolwebsite.azurewebsites.net/hrscurrent/Vol01_Ch0001-0042F/HRS0010H/HRS_0010H-0001.htm"}
  - {instrument: "Code des règlements fédéraux, titre 43, partie 50 (81 FR 71318, 14 octobre 2016) : procédure de rétablissement d'une relation de gouvernement à gouvernement avec la communauté hawaïenne autochtone", nature: "loi", annee: 2016, source: "https://www.law.cornell.edu/cfr/text/43/part-50"}
  - {instrument: "Loi nationale sur la préservation historique, 54 U.S.C. § 302706 : consultation des organisations hawaïennes autochtones", nature: "loi", annee: 2014, source: "https://www.law.cornell.edu/uscode/text/54/302706"}
  - {instrument: "Rice c. Cayetano, 528 U.S. 495 (2000)", nature: "jurisprudence", annee: 2000, source: "https://www.law.cornell.edu/supremecourt/text/528/495"}
  - {instrument: "Hawaii Revised Statutes, chap. 6K (loi 340 de 1993), réserve insulaire de Kaho'olawe, § 6K-3 et 6K-9", nature: "loi", annee: 1993, source: "https://capitolwebsite.azurewebsites.net/hrscurrent/Vol01_Ch0001-0042F/HRS0006K/HRS_0006K-0009.htm"}
droits:
  autogouvernement: {valeur: "conteste", note: "La constitution d'Hawaï (art. XII § 5, 1978) réserve l'élection des administrateurs de l'Office of Hawaiian Affairs aux électeurs hawaïens ; la Cour suprême a jugé cette restriction contraire au quinzième amendement en 2000 (Rice c. Cayetano). Le Rapporteur spécial note en 2012 l'absence de pouvoirs d'autogouvernement reconnus en droit fédéral. Depuis 2016, un règlement fédéral (43 CFR partie 50) fixe la procédure de reconnaissance d'un gouvernement hawaïen ; la fiche n'a trouvé aucune source établissant qu'un tel gouvernement ait été reconnu.", source: "https://www.law.cornell.edu/supremecourt/text/528/495"}
  pouvoir_normatif: {valeur: "non_etabli", note: "", source: ""}
  justice_propre: {valeur: "non_etabli", note: "", source: ""}
  terres: {valeur: "partiel", note: "La Hawaiian Homes Commission Act (1921) réserve environ 200 000 acres (environ 810 km²) pour des foyers hawaïens autochtones ; elle est reprise comme loi de l'État par la constitution, art. XII § 1. Les terres sont gérées par un département de l'État, qui administre 203 981 acres.", source: "https://dhhl.hawaii.gov/about/"}
  ressources: {valeur: "partiel", note: "L'État protège les droits exercés de manière coutumière et traditionnelle à des fins de subsistance, culturelles et religieuses par les descendants des Hawaïens présents avant 1778, sous réserve de son pouvoir de réglementation, constitution d'Hawaï, art. XII § 7 (1978).", source: "https://lrb.hawaii.gov/constitution/"}
  consentement: {valeur: "partiel", note: "Une agence fédérale consulte toute organisation hawaïenne autochtone qui attache une signification religieuse et culturelle à un bien susceptible d'être inscrit au registre national des lieux historiques, 54 U.S.C. § 302706 (b) ; l'obligation porte sur la consultation, non sur le consentement, et se limite au patrimoine. Le CERD relève en 2022 une interprétation restrictive du consentement libre, préalable et éclairé (CERD/C/USA/CO/10-12, § 49 c).", source: "https://www.law.cornell.edu/uscode/text/54/302706"}
  langue: {valeur: "reconnu", note: "L'anglais et l'hawaïen sont les langues officielles d'Hawaï ; l'hawaïen n'est exigé pour les actes publics que dans les cas prévus par la loi, constitution d'Hawaï, art. XV § 4 (1978).", source: "https://lrb.hawaii.gov/constitution/"}
  education: {valeur: "partiel", note: "L'État assure dans les écoles publiques un programme d'éducation hawaïenne (langue, culture, histoire), constitution d'Hawaï, art. X § 4 (1978) ; ce programme relève de l'État et non d'une institution hawaïenne.", source: "https://lrb.hawaii.gov/constitution/"}
  fiscalite: {valeur: "non_etabli", note: "", source: ""}
  representation: {valeur: "non_etabli", note: "", source: ""}
  statut_personnel: {valeur: "non_etabli", note: "", source: ""}
  autodetermination_externe: {valeur: "non_etabli", note: "", source: ""}
effectivite: {valeur: "partielle", note: "Le Rapporteur spécial (2012) relève que les Hawaïens autochtones ont peu de terres effectivement détenues et que l'appel à la réconciliation de la résolution de 1993 reste sans suite (A/HRC/21/47/Add.1, § 64 à 66). Le CERD (2022) relève une interprétation restrictive du consentement libre, préalable et éclairé et cite la situation des Hawaïens autochtones examinée dans sa procédure d'alerte rapide (CERD/C/USA/CO/10-12, § 49 c et d).", source: "https://docs.un.org/en/CERD/C/USA/CO/10-12"}
chronologie:
  - {annee: 1893, evenement: "Renversement du royaume d'Hawaï."}
  - {annee: 1921, evenement: "Adoption de la Hawaiian Homes Commission Act."}
  - {annee: 1978, evenement: "Convention constitutionnelle d'Hawaï : création de l'Office of Hawaiian Affairs, hawaïen langue officielle, protection des droits coutumiers."}
  - {annee: 1993, evenement: "Résolution d'excuses du Congrès pour le renversement de 1893."}
  - {annee: 1993, evenement: "Loi 340 : création de la réserve insulaire de Kaho'olawe, dont la gestion doit être transférée à l'entité souveraine hawaïenne après sa reconnaissance."}
  - {annee: 2000, evenement: "Arrêt Rice c. Cayetano : fin du vote réservé aux Hawaïens pour l'Office of Hawaiian Affairs."}
  - {annee: 2011, evenement: "Loi 195 de l'État d'Hawaï : reconnaissance des Hawaïens autochtones comme seul peuple autochtone d'Hawaï et création d'une commission chargée de la liste des Hawaïens autochtones qualifiés."}
  - {annee: 2016, evenement: "Règle du département de l'Intérieur (43 CFR partie 50) sur la procédure de rétablissement d'une relation de gouvernement à gouvernement."}
  - {annee: 2022, evenement: "Observations finales du CERD sur les États-Unis citant les Hawaïens autochtones (CERD/C/USA/CO/10-12, § 49 d)."}
fiabilite:
  verifie: ["Constitution d'Hawaï, art. X § 4, art. XII § 1, 5 et 7, art. XV § 4 (Legislative Reference Bureau).", "Sommaire de l'arrêt Rice c. Cayetano (Cornell LII).", "Superficies de la Hawaiian Homes Commission Act (département des terres hawaïennes).", "§ 1, 3, 5, 64 à 66 et 80 du rapport du Rapporteur spécial (2012).", "Population 2020 (317 497 seuls ou en combinaison, 94 025 seuls) : rapport du DBEDT sur le recensement de 2020.", "HRS § 10H-1 et 10H-3 (loi 195 de 2011).", "43 CFR partie 50, § 50.1, source 81 FR 71318 (14 octobre 2016), en vigueur dans l'eCFR courant (version consultée au 1er octobre 2026).", "54 U.S.C. § 302706 (b) (Cornell LII).", "CERD/C/USA/CO/10-12, § 49 (21 septembre 2022).", "HRS § 6K-3 (usages réservés : droits coutumiers hawaïens, conservation, éducation ; usage commercial interdit) et § 6K-9 (transfert de la gestion à l'entité souveraine hawaïenne après sa reconnaissance par les États-Unis et l'État d'Hawaï)."]
  non_confirme: ["Critère §0 : aucun gouvernement hawaïen n'est reconnu ; la fiche est retenue sur la reconnaissance nominale par la loi de l'État (HRS § 10H-1, 2011) et sur les droits de la grille attribués par la constitution d'Hawaï (langue, terres réservées, droits coutumiers).", "Aucune source consultée n'indique qu'une demande de reconnaissance ait été déposée au titre de 43 CFR partie 50.", "Inscription d'Hawaï sur la liste onusienne des territoires non autonomes jusqu'en 1959 : mentionnée par le Rapporteur spécial (§ 66), non vérifiée sur une résolution de l'Assemblée générale.", "Arrêt Arakaki c. Cayetano (2002) sur la condition d'ascendance des administrateurs de l'Office of Hawaiian Affairs : non consulté.", "Évolutions postérieures à 2024 : seuls les textes cités ont été relus (constitution, HRS, eCFR) ; pas de revue de presse ni de rapport indépendant postérieur à 2022 consulté.", "Nombre de villages : non trouvé.", "Lieux : le département des terres hawaïennes ne date pas le nombre de baux ; l'année retenue est celle de la consultation.", "Conditions d'éligibilité aux terres de la Hawaiian Homes Commission (quotient de sang) : non vérifiées.", "Population hors de l'État d'Hawaï : le Rapporteur spécial indique « environ un demi-million » de personnes s'identifiant en tout ou partie comme hawaïennes aux États-Unis (2012) ; chiffre national du recensement de 2020 non consulté.", "Les sections du chap. 6K ont été lues sur la copie du site du Parlement d'Hawaï hébergée par capitolwebsite.azurewebsites.net, le site capitol.hawaii.gov refusant l'accès."]
