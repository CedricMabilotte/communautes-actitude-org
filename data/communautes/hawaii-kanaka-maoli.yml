resume: >-
  Les Hawaïens autochtones sont le peuple de l'archipel d'Hawaï, État des États-Unis depuis 1959. Ils n'ont pas de gouvernement propre reconnu par le droit fédéral. La constitution de l'État d'Hawaï, révisée en 1978, crée l'Office of Hawaiian Affairs (Bureau des affaires hawaïennes), fait de l'hawaïen une langue officielle et reprend la loi fédérale sur les terres de la Hawaiian Homes Commission. En 1993, le Congrès a présenté des excuses pour le renversement du royaume d'Hawaï en 1893. Depuis 1993, l'île de Kaho'olawe et ses eaux sur deux milles forment une réserve réservée aux pratiques coutumières hawaïennes, à la conservation et à l'éducation, gérée par une commission de l'État ; la loi prévoit d'en transférer la gestion à l'entité souveraine hawaïenne lorsque celle-ci sera reconnue (HRS, chap. 6K, § 6K-3 et 6K-9).
reconnaissance_onu:
  - {mecanisme: "dnudpa", detail: "Les États-Unis, qui avaient voté contre la Déclaration en 2007, ont déclaré leur appui le 16 décembre 2010 ; le Rapporteur spécial range les Hawaïens autochtones parmi les peuples autochtones des États-Unis (A/HRC/21/47/Add.1, § 1 et 80).", annee: 2010, source: "https://social.desa.un.org/issues/indigenous-peoples/united-nations-declaration-on-the-rights-of-indigenous-peoples"}
  - {mecanisme: "rapporteur_special", detail: "Rapport sur la mission aux États-Unis (A/HRC/21/47/Add.1), § 64 à 66 : absence de pouvoirs d'autogouvernement reconnus en droit fédéral, résolution d'excuses de 1993, appel à la réconciliation resté sans suite.", annee: 2012, source: "https://www.ohchr.org/sites/default/files/Documents/HRBodies/HRCouncil/RegularSession/Session21/A-HRC-21-47-Add1_en.pdf"}
