resume: >-
  Les Khoï et les San sont des peuples d'Afrique australe ; la loi-cadre de 2003 sur le leadership traditionnel ne les visait pas.
  La loi sur le leadership traditionnel et khoï-san de 2019 permet pour la première fois de reconnaître des communautés khoï-san, leurs dirigeants et leurs conseils.
  La Cour constitutionnelle l'a déclarée invalide le 30 mai 2023 pour défaut de participation du public ; l'invalidité est suspendue jusqu'au 29 mai 2027, le temps d'adopter une nouvelle loi.
