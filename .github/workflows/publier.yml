name: Publication — communautes.actitude.org
# Régénère le site depuis data/ et le publie sur GitHub Pages à chaque push sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # dates de mise à jour tirées de git log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Générer le site (garde-fous inclus)
        run: python3 scripts/generate_site.py
      - name: Aucun secret dans le site publié
        run: "! grep -rIlE '(ghp_|github_pat_|GANDI_PAT|BEGIN [A-Z ]*PRIVATE KEY)' site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
